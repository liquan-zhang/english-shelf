<script>
const D = {"id": "006", "title": "Asking the Question Everyone Is Afraid to Ask", "meta": "B2 · 约 270 词 · 场景：会议提问", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Question in Everyone's Head", "heading_zh": "1. 每个人心里的那个问题", "rows": [[{"id": "s0_0_0", "md": "In almost every big meeting, there is one question that half the room is thinking and nobody is asking.", "text": "In almost every big meeting, there is one question that half the room is thinking and nobody is asking.", "zh": "几乎每个大会上，都有一个问题是半屋子人心里在想、却没人问出口的。", "sp": null}, {"id": "s0_0_1", "md": "\"Who is actually going to maintain this after launch?\"", "text": "\"Who is actually going to maintain this after launch?\"", "zh": "「上线之后到底谁来维护这个东西？」", "sp": null}, {"id": "s0_0_2", "md": "\"Do we have the data to back up that growth number?\"", "text": "\"Do we have the data to back up that growth number?\"", "zh": "「这个增长数字有数据撑着吗？」", "sp": null}, {"id": "s0_0_3", "md": "\"Didn't we try this two years ago?\"", "text": "\"Didn't we try this two years ago?\"", "zh": "「这个我们两年前不是试过吗？」", "sp": null}], [{"id": "s0_1_0", "md": "People stay quiet for ==understandable== reasons.", "text": "People stay quiet for understandable reasons.", "zh": "大家不吭声，原因也可以理解。", "sp": null}, {"id": "s0_1_1", "md": "They worry the question sounds ==naive==, or that it will __make the presenter look bad__ in front of leadership.", "text": "They worry the question sounds naive, or that it will make the presenter look bad in front of leadership.", "zh": "他们担心问题显得太幼稚，或者让讲的人在老板面前下不来台。", "sp": null}, {"id": "s0_1_2", "md": "So everyone nods, and the ==assumption== survives another month.", "text": "So everyone nods, and the assumption survives another month.", "zh": "于是大家都点头，这个假设又多活了一个月。", "sp": null}], [{"id": "s0_2_0", "md": "**The scary question is usually the one with the most value.**", "text": "The scary question is usually the one with the most value.", "zh": "最让人发怵的问题，通常也最有价值。", "sp": null}, {"id": "s0_2_1", "md": "If you are confused, you are rarely the only one.", "text": "If you are confused, you are rarely the only one.", "zh": "如果你有疑惑，很少只有你一个人疑惑。", "sp": null}, {"id": "s0_2_2", "md": "Asking it early saves the team from __building on a weak foundation__.", "text": "Asking it early saves the team from building on a weak foundation.", "zh": "早点问出来，能避免团队在一个不牢靠的地基上往上盖楼。", "sp": null}]]}, {"heading": "2. How to Ask It Without Starting a Fight", "heading_zh": "2. 怎么问才不会吵起来", "rows": [[{"id": "s1_0_0", "md": "First, own the confusion.", "text": "First, own the confusion.", "zh": "第一，把困惑揽到自己身上。", "sp": null}, {"id": "s1_0_1", "md": "Phrases like \"Help me understand\" or \"I might be missing something\" __lower the temperature__.", "text": "Phrases like \"Help me understand\" or \"I might be missing something\" lower the temperature.", "zh": "像「帮我理解一下」或者「可能是我漏了什么」这样的说法，能让气氛降降温。", "sp": null}, {"id": "s1_0_2", "md": "They make it clear you are curious, not ==accusing== anyone.", "text": "They make it clear you are curious, not accusing anyone.", "zh": "这表明你是好奇，而不是在指责谁。", "sp": null}], [{"id": "s1_1_0", "md": "Second, connect the question to a consequence.", "text": "Second, connect the question to a consequence.", "zh": "第二，把问题和后果挂上钩。", "sp": null}, {"id": "s1_1_1", "md": "Instead of \"Is this number real?\", try \"If the growth is closer to five percent, does the plan still work?\"", "text": "Instead of \"Is this number real?\", try \"If the growth is closer to five percent, does the plan still work?\"", "zh": "别问「这个数字靠谱吗？」，试试问「如果增长只有百分之五左右，这个方案还成立吗？」", "sp": null}, {"id": "s1_1_2", "md": "Now you are testing the plan, not the person.", "text": "Now you are testing the plan, not the person.", "zh": "这样你检验的是方案，而不是人。", "sp": null}], [{"id": "s1_2_0", "md": "Third, ask about ==ownership== and history directly, because those are the topics people avoid most.", "text": "Third, ask about ownership and history directly, because those are the topics people avoid most.", "zh": "第三，直接问归属和历史，因为这是大家最爱回避的话题。", "sp": null}, {"id": "s1_2_1", "md": "\"Who will be on call for this?\" sounds simple, but it often reveals that nobody has thought about it.", "text": "\"Who will be on call for this?\" sounds simple, but it often reveals that nobody has thought about it.", "zh": "「这个谁来 on-call？」听起来很简单，但经常会暴露出根本没人想过这件事。", "sp": null}, {"id": "s1_2_2", "md": "**Simple questions expose missing plans faster than clever ones.**", "text": "Simple questions expose missing plans faster than clever ones.", "zh": "简单的问题比聪明的问题更快暴露计划里的缺口。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, if the room goes quiet, do not rush to fill it.", "text": "Finally, if the room goes quiet, do not rush to fill it.", "zh": "最后，如果全场安静下来，别急着去填。", "sp": null}, {"id": "s1_3_1", "md": "Give the presenter a moment to think.", "text": "Give the presenter a moment to think.", "zh": "给讲的人一点时间想一想。", "sp": null}, {"id": "s1_3_2", "md": "A ==genuine== answer, even \"We don't know yet,\" is worth far more than a confident ==dodge==.", "text": "A genuine answer, even \"We don't know yet,\" is worth far more than a confident dodge.", "zh": "一个真诚的回答，哪怕是「我们还不知道」，也比一个自信的打太极值钱得多。", "sp": null}, {"id": "s1_3_3", "md": "Either way, the team now knows where the real risk sits, and that is exactly why you asked.", "text": "Either way, the team now knows where the real risk sits, and that is exactly why you asked.", "zh": "不管答案是什么，团队现在都知道真正的风险在哪儿了，而这正是你问这个问题的原因。", "sp": null}]]}], "gist": [{"q": "大家为什么不敢问那个关键问题？", "a": "怕问题显得幼稚，或怕在领导面前让讲者难堪，于是都点头，错误假设就继续存在。"}, {"q": "作者给出了哪些提问技巧，让尖锐问题不变成冲突？", "a": "先承认自己没搞懂；把问题和后果挂钩，检验方案而不是人；直接问归属和历史；问完别急着填补沉默。"}, {"q": "为什么作者说“谁来值班”这种简单问题很有价值？", "a": "简单问题往往能暴露出根本没人考虑过的缺失计划。"}], "dictation": [{"id": "s0_2_0", "text": "The scary question is usually the one with the most value."}, {"id": "s1_2_2", "text": "Simple questions expose missing plans faster than clever ones."}, {"id": "s0_2_1", "text": "If you are confused, you are rarely the only one."}, {"id": "s1_1_2", "text": "Now you are testing the plan, not the person."}], "shadow": {"text": "Second, connect the question to a consequence. Instead of \"Is this number real?\", try \"If the growth is closer to five percent, does the plan still work?\" Now you are testing the plan, not the person.", "marked": "<b>Second</b>, / connect the question / to a <b>consequence</b>. //<br>Instead of \"Is this number <b>real</b>?\", / try \"If the growth is closer to <b>five</b> percent, / does the plan <b>still</b> work?\" //<br>Now you are testing the <b>plan</b>, / <b>not</b> the person. //"}, "prompts": [{"q": "另一个团队在大会上展示新平台方案，很亮眼，但没人提谁来长期维护。用 30 秒问出这个问题，语气好奇而不是指责。", "ref": "This looks great, and I can see a lot of teams using it. Help me understand one thing, though. After the launch, who's going to own the platform day to day? I'm thinking about on-call, upgrades, and support questions from other teams. If that's already planned, great. If not, it might be worth deciding before we sign up more users.", "ref_zh": "这个看起来很棒，我能想到很多团队都会用。不过有一点想请你帮我理解一下。上线之后，平台的日常运维谁来负责？我想的是 on-call、升级，还有其他团队来问的支持问题。如果已经规划好了，那很好。如果还没有，可能值得在接入更多用户之前先定下来。", "id": "ref0"}, {"q": "PM 的方案基于“用户增长百分之三十”的假设，你觉得太乐观。用 30 秒把质疑和后果挂钩，而不是直接说数字不对。", "ref": "I might be missing something, so let me ask it this way. The plan assumes thirty percent growth next quarter. If we only get half of that, what happens? Do we still need the extra servers, and does the hiring plan still make sense? I'm not saying the number is wrong. I just want to know the plan survives if we land a bit lower.", "ref_zh": "可能是我漏了什么，那我换个方式问。这个方案假设下季度增长百分之三十。如果只有一半，会怎么样？额外的服务器还需要吗？招聘计划还说得通吗？我不是说这个数字不对。我只是想确认，就算结果低一点，这个方案也扛得住。", "id": "ref1"}], "words": [{"w": "understandable", "ipa": "/ˌʌndərˈstændəbəl/", "zh": "可以理解的", "ex": "The delay is understandable given the vendor issue.", "id": "w0"}, {"w": "naive", "ipa": "/naɪˈiːv/", "zh": "天真的、幼稚的", "ex": "This might be a naive question, but why do we need two queues?", "id": "w1"}, {"w": "assumption", "ipa": "/əˈsʌmp const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;

  for (const k of kids) el.append(k);

};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
