<script>
const D = {"id": "076", "title": "Making the Case for Technical Debt", "meta": "B2 · 约 270 词 · 场景：资源争取", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Nobody Funds Clean Code", "heading_zh": "1. 没人为干净代码买单", "rows": [[{"id": "s0_0_0", "md": "Engineers often ask for time to fix technical debt and get turned down.", "text": "Engineers often ask for time to fix technical debt and get turned down.", "zh": "工程师经常申请时间还技术债，然后被驳回。", "sp": null}, {"id": "s0_0_1", "md": "The request usually sounds like this: \"The code is a mess, and we need a sprint to clean it up.\"", "text": "The request usually sounds like this: \"The code is a mess, and we need a sprint to clean it up.\"", "zh": "申请通常是这么说的：「代码太乱了，我们需要一个迭代来清理。」", "sp": null}, {"id": "s0_0_2", "md": "From the product side, that sounds like a ==detour== with nothing to show at the end.", "text": "From the product side, that sounds like a detour with nothing to show at the end.", "zh": "在产品侧听来，这就是绕了个弯路，最后什么也拿不出来。", "sp": null}], [{"id": "s0_1_0", "md": "The problem is not that leaders don't care about quality.", "text": "The problem is not that leaders don't care about quality.", "zh": "问题不在于领导不在乎质量。", "sp": null}, {"id": "s0_1_1", "md": "It is that \"messy code\" is an engineering feeling, not a business ==consequence==.", "text": "It is that \"messy code\" is an engineering feeling, not a business consequence.", "zh": "而在于「代码很乱」是工程师的感受，而不是业务上的后果。", "sp": null}, {"id": "s0_1_2", "md": "**Nobody funds clean code; people fund faster delivery and fewer outages.**", "text": "Nobody funds clean code; people fund faster delivery and fewer outages.", "zh": "没人为干净代码买单；大家买单的是更快的交付和更少的故障。", "sp": null}], [{"id": "s0_2_0", "md": "Debt is a useful ==metaphor== precisely because it has interest.", "text": "Debt is a useful metaphor precisely because it has interest.", "zh": "「债」之所以是个好比喻，恰恰因为它有利息。", "sp": null}, {"id": "s0_2_1", "md": "Every feature built on top of the messy module costs a little extra, and the extra keeps growing.", "text": "Every feature built on top of the messy module costs a little extra, and the extra keeps growing.", "zh": "每个建在那坨乱代码之上的功能都要多花一点成本，而且这笔额外成本还在不断增长。", "sp": null}, {"id": "s0_2_2", "md": "If you can show that interest in numbers, you are no longer asking for a favor; you are proposing a good deal.", "text": "If you can show that interest in numbers, you are no longer asking for a favor; you are proposing a good deal.", "zh": "如果你能用数字把这笔利息摆出来，你就不是在求人帮忙了；你是在提一笔划算的买卖。", "sp": null}]]}, {"heading": "2. Show the Interest Payments", "heading_zh": "2. 把利息亮出来", "rows": [[{"id": "s1_0_0", "md": "So make the interest visible.", "text": "So make the interest visible.", "zh": "所以，把利息亮出来。", "sp": null}, {"id": "s1_0_1", "md": "Count how many of last quarter's incidents started in the old billing module.", "text": "Count how many of last quarter's incidents started in the old billing module.", "zh": "数一数上个季度的故障里有多少是从老计费模块开始的。", "sp": null}, {"id": "s1_0_2", "md": "Show that changes there take three times longer to review and ship than anywhere else in the codebase.", "text": "Show that changes there take three times longer to review and ship than anywhere else in the codebase.", "zh": "说明那里的改动从 review 到上线，要比代码库其他地方多花三倍时间。", "sp": null}, {"id": "s1_0_3", "md": "Even a rough count from the incident tracker is far more convincing than a general complaint.", "text": "Even a rough count from the incident tracker is far more convincing than a general complaint.", "zh": "哪怕是从故障系统里粗略数一下，也比泛泛地抱怨有说服力得多。", "sp": null}], [{"id": "s1_1_0", "md": "Then propose a ==bounded== investment, not an open-ended cleanup.", "text": "Then propose a bounded investment, not an open-ended cleanup.", "zh": "然后提一个有边界的投入，而不是没完没了的大扫除。", "sp": null}, {"id": "s1_1_1", "md": "\"Give us four weeks to replace the billing state logic, and we expect billing changes to ship twice as fast.\"", "text": "\"Give us four weeks to replace the billing state logic, and we expect billing changes to ship twice as fast.\"", "zh": "「给我们四周时间重写计费状态逻辑，我们预计计费相关的改动上线速度能翻倍。」", "sp": null}, {"id": "s1_1_2", "md": "A clear ==payoff== makes the request comparable to a feature, which is exactly what you want.", "text": "A clear payoff makes the request comparable to a feature, which is exactly what you want.", "zh": "明确的回报让这个申请可以跟一个功能放在一起比较，这正是你想要的。", "sp": null}], [{"id": "s1_2_0", "md": "**When debt work competes on the same terms as features, it starts to win.**", "text": "When debt work competes on the same terms as features, it starts to win.", "zh": "当还债的活儿跟功能在同样的规则下竞争，它就开始能赢了。", "sp": null}, {"id": "s1_2_1", "md": "And if leaders still say no, you have ==documented== the risk, which matters when the next incident __comes around__.", "text": "And if leaders still say no, you have documented the risk, which matters when the next incident comes around.", "zh": "而且就算领导还是说不，你也已经把风险记录在案了，等下一次故障来的时候，这就很重要。", "sp": null}, {"id": "s1_2_2", "md": "Either way, you have __changed the conversation__ from taste to tradeoffs.", "text": "Either way, you have changed the conversation from taste to tradeoffs.", "zh": "不管怎样，你都已经把讨论从个人喜好变成了利弊权衡。", "sp": null}]]}], "gist": [{"q": "为什么“代码太乱需要一个迭代清理”这种请求常被拒？", "a": "在产品侧看来像是没有产出的绕路；“代码乱”是工程感受，不是业务后果。"}, {"q": "作者建议用什么证据说明技术债的“利息”？", "a": "统计上季度多少故障出自旧模块、该模块改动的评审和上线时间是其他地方的三倍等，粗略数字也比抱怨有说服力。"}, {"q": "提方案时要注意什么？被拒了怎么办？", "a": "提有边界的投入和明确回报，让它能和功能同台比较；即使被拒，也已把风险记录在案。"}], "dictation": [{"id": "s0_1_2", "text": "Nobody funds clean code; people fund faster delivery and fewer outages."}, {"id": "s0_2_1", "text": "Every feature built on top of the messy module costs a little extra, and the extra keeps growing."}, {"id": "s1_1_0", "text": "Then propose a bounded investment, not an open-ended cleanup."}, {"id": "s1_2_0", "text": "When debt work competes on the same terms as features, it starts to win."}], "shadow": {"text": "So make the interest visible. Count how many of last quarter's incidents started in the old billing module. Show that changes there take three times longer to review and ship than anywhere else in the codebase.", "marked": "So make the <b>interest</b> visible. //<br><b>Count</b> how many of last quarter's incidents / started in the <b>old</b> billing module. //<br>Show that changes there / take <b>three</b> times longer / to review and ship / than <b>anywhere</b> else in the codebase. //"}, "prompts": [{"q": "季度规划会上，你想为重构老旧的推送模块争取四周。用 30 秒向产品负责人说明利息和回报。", "ref": "I'd like to ask for four weeks on the notification module, and here's why. Five of our last eight incidents started there, and any change to it takes about three times longer to ship than elsewhere. If we replace the scheduling logic, we expect those changes to take days instead of weeks, and fewer late-night pages. It's a bounded piece of work with a clear payoff.", "ref_zh": "我想申请四周时间处理通知模块，理由是这样的。最近八次故障里有五次是从那里开始的，而且那边的任何改动，上线时间都比其他地方多三倍左右。如果我们重写调度逻辑，预计这类改动就能从几周缩到几天，半夜被叫起来的次数也会更少。这是一块有边界的工作，回报也很明确。", "id": "ref0"}, {"q": "产品负责人听完还是说“这季度功能更重要”。用 30 秒得体地接受，同时把风险记录下来。", "ref": "That's fair, and I understand the pressure on features this quarter. I'll accept that call. What I'd like to do is write a short note on the risk, including the incident numbers and what we expect if nothing changes, and add it to the planning doc. That way, if things get worse, we can come back to it quickly with the data already in front of us.", "ref_zh": "有道理，我也理解这个季度做功能的压力。这个决定我接受。我想做的是写一份简短的风险说明，包括故障数据，以及如果什么都不改我们预计会怎样，然后附到规划文档里。这样如果情况变糟，我们可以带着现成的数据很快再把它拿出来讨论。", "id": "ref1"}], "words": [{"w": "detour", "ipa": "/ˈdiːtʊr/", "zh": "绕路、弯路", "ex": "Rewriting the build system was a two-week detour from the roadmap.", "id": "w0"}, {"w": "consequence", "ipa": "/ˈkɑːnsəkwens/", "zh": "后果", "ex": "The consequence of skipping tests was three hotfixes in one week.", "id": "w1"}, {"w": "metaphor", "ipa": "/ˈmetəfɔːr/", "zh": "比喻、隐喻", "ex": "Technical debt is a metaphor that most business leaders understand.", "id": "w2"}, {"w": "bounded", "ipa": "/ˈbaʊndɪd/", const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {

const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
