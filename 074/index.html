<script>
const D = {"id": "074", "title": "Cutting Scope to Hit a Date", "meta": "B2 · 约 280 词 · 场景：项目延期", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Cut Happens Anyway", "heading_zh": "1. 砍需求迟早会发生", "rows": [[{"id": "s0_0_0", "md": "When a project runs late, scope gets cut whether you plan it or not.", "text": "When a project runs late, scope gets cut whether you plan it or not.", "zh": "项目一旦延期，不管你计划没计划，范围都会被砍。", "sp": null}, {"id": "s0_0_1", "md": "The only question is whether you cut it on purpose in week four, or by accident in the last three days.", "text": "The only question is whether you cut it on purpose in week four, or by accident in the last three days.", "zh": "唯一的问题是，你是在第四周主动砍，还是在最后三天被动砍。", "sp": null}, {"id": "s0_0_2", "md": "Pretending otherwise only means that someone else, or the calendar, makes the cut for you.", "text": "Pretending otherwise only means that someone else, or the calendar, makes the cut for you.", "zh": "假装不会发生，只意味着由别人，或者由日历，替你来砍。", "sp": null}], [{"id": "s0_1_0", "md": "Accidental cuts are the expensive kind.", "text": "Accidental cuts are the expensive kind.", "zh": "被动砍是代价最高的那种。", "sp": null}, {"id": "s0_1_1", "md": "Testing gets skipped, error handling gets ==sloppy==, and documentation quietly ==evaporates==.", "text": "Testing gets skipped, error handling gets sloppy, and documentation quietly evaporates.", "zh": "测试被跳过，错误处理草草了事，文档悄无声息地消失了。", "sp": null}, {"id": "s0_1_2", "md": "The feature ships on time but __falls apart__ in the first month, and the team spends the next quarter cleaning up.", "text": "The feature ships on time but falls apart in the first month, and the team spends the next quarter cleaning up.", "zh": "功能按时上线了，但第一个月就散架，团队下个季度都在收拾烂摊子。", "sp": null}], [{"id": "s0_2_0", "md": "**Cutting scope early is a decision; cutting it late is a symptom.**", "text": "Cutting scope early is a decision; cutting it late is a symptom.", "zh": "早砍范围是一个决定；晚砍范围是一个症状。", "sp": null}, {"id": "s0_2_1", "md": "The earlier you admit that the date and the scope don't fit, the more room you have to ==maneuver==.", "text": "The earlier you admit that the date and the scope don't fit, the more room you have to maneuver.", "zh": "你越早承认日期和范围对不上，就越有腾挪的空间。", "sp": null}, {"id": "s0_2_2", "md": "Saying it in week four feels uncomfortable, but saying it the night before launch feels much worse.", "text": "Saying it in week four feels uncomfortable, but saying it the night before launch feels much worse.", "zh": "第四周说出来会觉得别扭，但上线前一晚才说会难受得多。", "sp": null}]]}, {"heading": "2. Cut Slices, Not Corners", "heading_zh": "2. 砍整块，别偷工减料", "rows": [[{"id": "s1_0_0", "md": "Start from the user's journey, not the task list.", "text": "Start from the user's journey, not the task list.", "zh": "从用户路径出发，而不是从任务清单出发。", "sp": null}, {"id": "s1_0_1", "md": "Ask which steps a user absolutely needs on day one to get real value.", "text": "Ask which steps a user absolutely needs on day one to get real value.", "zh": "问一问：用户第一天绝对需要哪些步骤才能拿到真正的价值？", "sp": null}, {"id": "s1_0_2", "md": "For a new payments flow, that might be paying by card, but not saving cards or splitting bills.", "text": "For a new payments flow, that might be paying by card, but not saving cards or splitting bills.", "zh": "对一个新的支付流程来说，可能是用银行卡付款，而不是保存卡片或者 AA 分账。", "sp": null}], [{"id": "s1_1_0", "md": "Cut whole ==slices== of functionality rather than shaving a little quality off everything.", "text": "Cut whole slices of functionality rather than shaving a little quality off everything.", "zh": "整块整块地砍功能，而不是每样都削掉一点质量。", "sp": null}, {"id": "s1_1_1", "md": "A smaller feature that works well beats a full feature that ==misbehaves==.", "text": "A smaller feature that works well beats a full feature that misbehaves.", "zh": "一个小而好用的功能，胜过一个完整却总出毛病的功能。", "sp": null}, {"id": "s1_1_2", "md": "Users notice missing features far less than they notice broken ones.", "text": "Users notice missing features far less than they notice broken ones.", "zh": "用户对缺了的功能，远没有对坏掉的功能那么在意。", "sp": null}], [{"id": "s1_2_0", "md": "When you present the cut, frame it as a ==sequence==, not a loss.", "text": "When you present the cut, frame it as a sequence, not a loss.", "zh": "汇报砍掉的部分时，把它包装成一个先后顺序，而不是一种损失。", "sp": null}, {"id": "s1_2_1", "md": "\"We launch card payments on the fifteenth, and saved cards follow two weeks later.\"", "text": "\"We launch card payments on the fifteenth, and saved cards follow two weeks later.\"", "zh": "「十五号先上银行卡支付，两周后再上保存卡片。」", "sp": null}, {"id": "s1_2_2", "md": "**People accept a smaller first release much more easily when they can see the second one.**", "text": "People accept a smaller first release much more easily when they can see the second one.", "zh": "人们看得到第二版的时候，接受一个小一点的首版要容易得多。", "sp": null}, {"id": "s1_2_3", "md": "It also helps to __be upfront__ about what you cut and why, so nobody discovers it in a demo.", "text": "It also helps to be upfront about what you cut and why, so nobody discovers it in a demo.", "zh": "另外最好坦白说清楚砍了什么、为什么砍，免得有人在 demo 时才发现。", "sp": null}]]}], "gist": [{"q": "作者为什么说范围“总会被砍”？", "a": "项目延期时范围一定会缩，区别只在于第四周主动砍，还是最后三天被动砍。"}, {"q": "被动砍范围会砍掉什么？后果是什么？", "a": "测试、错误处理和文档；功能按时上线但第一个月就出问题，团队下个季度都在收拾。"}, {"q": "应该怎么砍、怎么汇报？", "a": "从用户旅程出发砍掉完整的功能切片而不是全面降质量；汇报时讲成先后顺序，让人看到第二个版本。"}], "dictation": [{"id": "s0_2_0", "text": "Cutting scope early is a decision; cutting it late is a symptom."}, {"id": "s1_1_1", "text": "A smaller feature that works well beats a full feature that misbehaves."}, {"id": "s1_1_2", "text": "Users notice missing features far less than they notice broken ones."}, {"id": "s1_2_2", "text": "People accept a smaller first release much more easily when they can see the second one."}], "shadow": {"text": "Cut whole slices of functionality rather than shaving a little quality off everything. A smaller feature that works well beats a full feature that misbehaves. Users notice missing features far less than they notice broken ones.", "marked": "Cut <b>whole</b> slices of functionality / rather than shaving a little <b>quality</b> / off <b>everything</b>. //<br>A <b>smaller</b> feature that works <b>well</b> / beats a <b>full</b> feature / that <b>misbehaves</b>. //<br>Users notice <b>missing</b> features / far <b>less</b> / than they notice <b>broken</b> ones. //"}, "prompts": [{"q": "项目进行到第四周，你发现按现有范围肯定赶不上发布日。用 30 秒向 PM 提出砍范围的建议，讲成先后顺序。", "ref": "I want to raise this now rather than in the last week. At our current pace, we won't finish everything by the launch date. My suggestion is to launch with the core flow, creating and sharing a playlist, and move collaborative editing to a follow-up release two weeks later. That way the date holds, quality doesn't suffer, and users still get the main value on day one.", "ref_zh": "我想现在就提出来，而不是等到最后一周。按目前的进度，上线日之前我们做不完所有东西。我的建议是先上核心流程，也就是创建和分享歌单，把协同编辑挪到两周后的下一个版本。这样日期保住了，质量不打折扣，用户第一天也能拿到主要价值。", "id": "ref0"}, {"q": "工程师提议“每个功能都做简单一点，测试也少写点”来赶日期。用 30 秒说明为什么应该砍整块功能而不是降质量。", "ref": "I understand the idea, and I know everyone wants to hit the date. But if we cut a little from everything, we end up with five features that all half work, and we spend next month fixing them. I'd rather ship three features that are solid and drop the other two completely for now. Users forgive a missing feature much more easily than a broken one.", "ref_zh": "我理解这个思路，也知道大家都想赶上日期。但如果每样都砍一点，最后我们会得到五个都只能用一半的功能，下个月全花在修它们上。我宁愿先上三个扎实的功能，另外两个暂时整个砍掉。用户对缺一个功能的容忍度，比对一个坏掉的功能高得多。", "id": "ref1"}], "words": [{"w": "sloppy", "ipa": "/ˈslɑːpi/", "zh": "马虎的、草率的", "ex": "The code got sloppy in the last sprint because of the deadline.", "id": "w0"}, {"w": "evaporate", "ipa": "/ɪˈvæpəˌreɪt/", "zh": "（悄悄）消失、蒸发", "ex": "Our buffer evaporated when two engineers got sick.", "id": "w1"}, {"w": "maneuver (v.)", "ipa": "/məˈnuːvər/", "zh": "调整、周旋", "ex": "If we tell the client now, we still have room to maneuver.", "tts_w": "maneuver", "id": "w2"}, {"w": "slice", "ipa": "/slaɪs/", "zh": "切片、一块完整的功能", "ex": "Let's ship a thin sl const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);

  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
