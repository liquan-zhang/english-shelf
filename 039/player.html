<script>
const D = {"id": "039", "title": "Talking About Your Career Growth", "meta": "B2 · 约 280 词 · 场景：职业发展对话", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Question Too Wide to Answer", "heading_zh": "1. 问得太宽，没法回答", "rows": [[{"id": "s0_0_0", "md": "\"How do I get promoted?\" is one of the most common questions in one-on-ones.", "text": "\"How do I get promoted?\" is one of the most common questions in one-on-ones.", "zh": "「我怎么才能晋升？」是 1:1 里最常见的问题之一。", "sp": null}, {"id": "s0_0_1", "md": "It is also one of the least useful.", "text": "It is also one of the least useful.", "zh": "它也是最没用的问题之一。", "sp": null}, {"id": "s0_0_2", "md": "It usually gets a polite, ==generic== answer about \"showing more impact.\"", "text": "It usually gets a polite, generic answer about \"showing more impact.\"", "zh": "得到的通常是一个客气又笼统的回答，说要「体现更多影响力」。", "sp": null}], [{"id": "s0_1_0", "md": "The problem is that the question is too wide.", "text": "The problem is that the question is too wide.", "zh": "问题在于，这个问题太宽了。", "sp": null}, {"id": "s0_1_1", "md": "Your manager would have to describe the whole next level from memory, on the spot.", "text": "Your manager would have to describe the whole next level from memory, on the spot.", "zh": "你的经理得当场凭记忆把下一个职级完整描述一遍。", "sp": null}, {"id": "s0_1_2", "md": "Most people cannot do that well, so they __fall back on__ the words in the job ladder.", "text": "Most people cannot do that well, so they fall back on the words in the job ladder.", "zh": "大多数人做不好这件事，于是只能搬出职级体系里的那些说法。", "sp": null}, {"id": "s0_1_3", "md": "**Ask about the gap, not the destination.**", "text": "Ask about the gap, not the destination.", "zh": "要问差距，而不是问终点。", "sp": null}], [{"id": "s0_2_0", "md": "Try this instead: \"Looking at my last project, what would someone at the next level have done differently?\"", "text": "Try this instead: \"Looking at my last project, what would someone at the next level have done differently?\"", "zh": "换个问法试试：「看我上一个项目，如果是下一个职级的人来做，会有哪些不同的做法？」", "sp": null}, {"id": "s0_2_1", "md": "Now your manager can point to a real moment: maybe you solved the technical problem well but didn't ==influence== the teams around you.", "text": "Now your manager can point to a real moment: maybe you solved the technical problem well but didn't influence the teams around you.", "zh": "这样经理就能指出一个真实的场景：也许你把技术问题解决得很好，但没能影响到周边的团队。", "sp": null}, {"id": "s0_2_2", "md": "That kind of answer is ==actionable==, because you can __work on it__ starting next week.", "text": "That kind of answer is actionable, because you can work on it starting next week.", "zh": "这种回答是可以落地的，因为你下周就能开始改进。", "sp": null}]]}, {"heading": "2. From Conversation to Plan", "heading_zh": "2. 从谈话到计划", "rows": [[{"id": "s1_0_0", "md": "Once you know the gap, ask for a chance to close it.", "text": "Once you know the gap, ask for a chance to close it.", "zh": "一旦知道了差距，就去争取一个弥补它的机会。", "sp": null}, {"id": "s1_0_1", "md": "If the gap is influence across teams, ask to lead the next project that ==spans== two teams.", "text": "If the gap is influence across teams, ask to lead the next project that spans two teams.", "zh": "如果差距是跨团队的影响力，就主动要求牵头下一个横跨两个团队的项目。", "sp": null}, {"id": "s1_0_2", "md": "**Growth comes from stretch work, not from waiting until you feel ready.**", "text": "Growth comes from stretch work, not from waiting until you feel ready.", "zh": "成长来自有挑战的工作，而不是等到你觉得自己准备好了。", "sp": null}], [{"id": "s1_1_0", "md": "Write down what you agreed, in your own words, and send it to your manager.", "text": "Write down what you agreed, in your own words, and send it to your manager.", "zh": "把你们商定的内容用自己的话写下来，发给你的经理。", "sp": null}, {"id": "s1_1_1", "md": "It keeps both of you honest.", "text": "It keeps both of you honest.", "zh": "这能让双方都说到做到。", "sp": null}, {"id": "s1_1_2", "md": "It also gives your manager something ==tangible== to bring into ==calibration==, where they have to argue your case against other strong people.", "text": "It also gives your manager something tangible to bring into calibration, where they have to argue your case against other strong people.", "zh": "这也能让经理在校准会上有实实在在的东西可拿，他得在那里拿你跟其他优秀的人比，替你争取。", "sp": null}], [{"id": "s1_2_0", "md": "Then __check in__ every month or two.", "text": "Then check in every month or two.", "zh": "然后每一两个月跟进一次。", "sp": null}, {"id": "s1_2_1", "md": "Don't wait for the formal review, when it is too late to change the story.", "text": "Don't wait for the formal review, when it is too late to change the story.", "zh": "别等到正式绩效评估，到那时想改变叙事已经晚了。", "sp": null}, {"id": "s1_2_2", "md": "Ask, \"Am I closer than last time, and what is still missing?\"", "text": "Ask, \"Am I closer than last time, and what is still missing?\"", "zh": "问一句：「跟上次比，我离目标更近了吗？还缺什么？」", "sp": null}], [{"id": "s1_3_0", "md": "Your manager wants you to grow, but they have many people to think about.", "text": "Your manager wants you to grow, but they have many people to think about.", "zh": "你的经理希望你成长，但他要操心的人很多。", "sp": null}, {"id": "s1_3_1", "md": "Making your progress easy to see keeps it __on their agenda__.", "text": "Making your progress easy to see keeps it on their agenda.", "zh": "让你的进展一目了然，才能让它一直留在他的议程上。", "sp": null}]]}], "gist": [{"q": "为什么「我怎么才能晋升」是个没用的问题？", "a": "问题太宽，经理只能凭记忆描述整个下一级，于是给出「多展现影响力」这类泛泛的回答。"}, {"q": "作者建议换成什么问法？", "a": "针对具体项目问差距：「看我上个项目，下一级的人会怎么做得不一样？」这样得到的是能马上行动的反馈。"}, {"q": "知道差距之后要做哪几件事？", "a": "争取能补差距的挑战性工作；把约定用自己的话写下来发给经理（方便他在校准会上替你争取）；每一两个月主动跟进进展。"}], "dictation": [{"id": "s0_1_3", "text": "Ask about the gap, not the destination."}, {"id": "s1_0_2", "text": "Growth comes from stretch work, not from waiting until you feel ready."}, {"id": "s1_0_0", "text": "Once you know the gap, ask for a chance to close it."}, {"id": "s1_2_1", "text": "Don't wait for the formal review, when it is too late to change the story."}], "shadow": {"text": "Once you know the gap, ask for a chance to close it. If the gap is influence across teams, ask to lead the next project that spans two teams. Growth comes from stretch work, not from waiting until you feel ready.", "marked": "Once you know the <b>gap</b>, / ask for a <b>chance</b> to close it. //<br>If the gap is <b>influence</b> across teams, / ask to <b>lead</b> the next project / that spans <b>two</b> teams. //<br>Growth comes from <b>stretch</b> work, / <b>not</b> from waiting / until you feel <b>ready</b>. //"}, "prompts": [{"q": "在一对一里和经理谈晋升。不要问「我怎么晋升」，用 30 秒针对你最近的一个项目问差距在哪。", "ref": "I'd like to spend a few minutes on my growth today. Rather than ask about promotion in general, can we look at the search migration I just finished? If someone at the next level had led that project, what would they have done differently? I want something concrete I can work on this quarter, not just the description in the job ladder.", "ref_zh": "今天我想花几分钟聊聊我的成长。与其笼统地问晋升，我们能不能看看我刚做完的搜索迁移？如果是下一个职级的人来牵头这个项目，他会有哪些不同的做法？我想要一个这个季度能具体去改进的点，而不只是职级体系里的那段描述。", "id": "ref0"}, {"q": "经理说你的差距是「跨团队影响力」。用 30 秒提出一个具体的机会请求，并约定怎么跟进。", "ref": "That's really helpful, thank you. If cross-team influence is the gap, I'd like to lead the logging cleanup next quarter, since it touches four teams and nobody owns it yet. I'll write up what we agreed today and send it to you, so we're on the same page. Could we check in on it every month, maybe in the first one-on-one of each month?", "ref_zh": "这真的很有帮助，谢谢。如果跨团队影响力是差距，我想下个季度牵头日志治理，因为它涉及四个团队，目前还没人负责。我会把今天商定的内容写下来发给你，确保我们理解一致。我们能每个月跟进一次吗，比如放在每个月的第一次 1:1 上？", "id": "ref1"}], "words": [{"w": "generic", "ipa": "/dʒəˈnerɪk/", "zh": "泛泛的、笼统的", "ex": "The feedback was too generic to act on.", "id": "w0"}, {"w": "influence (v.)", "ipa": "/ˈɪnfluəns/", "zh": "影响", "ex": "You need to influence the platform team, not just file tickets.", "tts_w": "influence", "id": "w1"}, {"w": "actionable", "ipa": "/ˈækʃənəbl/", "zh": "可执行的、能付诸行动的", "ex": "Let's turn these findings into actionable items with owners.", "id": "w2"}, {"w": "span (v.)", "ipa": "/spæn/", "zh": "跨越、涵盖", "ex": "The project spans three teams 有哪些不同的做法？」", "sp": null, "gap": true, "start": 29.664, "end": 36.144, "words": [[29.769, 29.98], [29.993, 30.19], [30.203, 30.677], [31.177, 31.44], [31.453, 31.519], [31.532, 31.638], [31.651, 31.98], [31.993, 32.546], [32.848, 32.98], [32.993, 33.125], [33.138, 33.506], [33.519, 33.598], [33.611, 33.69], [33.703, 34.164], [34.177, 34.453], [34.467, 34.703], [34.717, 34.967], [34.98, 35.572]]}, {"kind": "s", "id": "s0_2_1", "md": "Now your manager can point to a real moment: maybe you solved the technical problem well but didn't ==influence== the teams around you.", "zh": "这样经理就能指出一个真实的场景：也许你把技术问题解决得很好，但没能影响到周边的团队。", "sp": null, "gap": false, "start": 36.144, "end": 43.968, "words": [[36.249, 36.433], [36.447, 36.578], [36.591, 37.091], [37.105, 37.289], [37.302, 37.697], [37.71, 37.841], [37.855, 37.947], [37.96, 38.276], [38.289, 38.697], [39.21, 39.407], [39.42, 39.552], [39.565, 39.947], [39.96, 40.039], [40.052, 40.512], [40.526, 40.92], [40.933, 41.262], [41.512, 41.67], [41.683, 41.986], [42.039, 42.539], [42.552, 42.644], [42.657, 42.973], [42.986, 43.341], [43.355, 43.578]]}, {"kind": "s", "id": "s0_2_2", "md": "That kind of answer is ==actionable==, because you can __work on it__ starting next week.", "zh": "这种回答是可以落地的，因为你下周就能开始改进。", "sp": null, "gap": false, "start": 43.968, "end": 48.552, "words": [[44.086, 44.218], [44.231, 44.429], [44.442, 44.521], [44.534, 44.915], [44.929, 45.047], [45.06, 45.731], [46.021, 46.31], [46.323, 46.415], [46.429, 46.586], [46.6, 46.823], [46.836, 46.955], [46.968, 47.047], [47.06, 47.455], [47.468, 47.744], [47.757, 48.152]]}, {"kind": "h", "id": "h1", "md": "2. From Conversation to Plan", "zh": "2. 从谈话到计划", "start": 48.552, "end": 51.168, "words": [[48.67, 48.894], [49.315, 49.486], [49.499, 50.249], [50.263, 50.341], [50.355, 50.776]]}, {"kind": "s", "id": "s1_0_0", "md": "Once you know the gap, ask for a chance to close it.", "zh": "一旦知道了差距，就去争取一个弥补它的机会。", "sp": null, "gap": false, "start": 51.168, "end": 54.288, "words": [[51.273, 51.444], [51.457, 51.536], [51.55, 51.655], [51.668, 51.76], [51.773, 52.142], [52.55, 52.786], [52.8, 52.931], [52.944, 52.984], [52.997, 53.286], [53.3, 53.379], [53.392, 53.721], [53.734, 53.905]]}, {"kind": "s", "id": "s1_0_1", "md": "If the gap is influence across teams, ask to lead the next project that ==spans== two teams.", "zh": "如果差距是跨团队的影响力，就主动要求牵头下一个横跨两个团队的项目。", "sp": null, "gap": false, "start": 54.288, "end": 60.528, "words": [[54.393, 54.498], [54.512, 54.604], [54.617, 54.959], [55.051, 55.183], [55.196, 55.748], [55.762, 56.196], [56.209, 56.709], [57.104, 57.38], [57.393, 57.485], [57.499, 57.722], [57.735, 57.814], [57.827, 58.13], [58.143, 58.696], [58.709, 58.854], [58.867, 59.314], [59.327, 59.525], [59.538, 60.143]]}, {"kind": "s", "id": "s1_0_2", "md": "**Growth comes from stretch work, not from waiting until you feel ready.**", "zh": "成长来自有挑战的工作，而不是等到你觉得自己准备好了。", "sp": null, "gap": false, "start": 60.528, "end": 64.872, "words": [[60.633, 60.962], [60.975, 61.278], [61.291, 61.449], [61.462, 61.844], [61.857, 62.212], [62.62, 62.817], [62.831, 63.028], [63.041, 63.41], [63.423, 63.686], [63.699, 63.817], [63.831, 64.146], [64.16, 64.475]]}, {"kind": "s", "id": "s1_1_0", "md": "Write down what you agreed, in your own words, and send it to your manager.", "zh": "把你们商定的内容用自己的话写下来，发给你的经理。", "sp": null, "gap": true, "start": 64.872, "end": 69.384, "words": [[64.977, 65.148], [65.161, 65.411], [65.425, 65.556], [65.569, 65.701], [65.714, 66.227], [66.53, 66.622], [66.635, 66.819], [66.833, 67.017], [67.03, 67.517], [67.754, 67.859], [67.872, 68.135], [68.148, 68.227], [68.24, 68.333], [68.346, 68.451], [68.464, 68.99]]}, {"kind": "s", "id": "s1_1_1", "md": "It keeps both of you honest.", "zh": "这能让双方都说到做到。", "sp": null, "gap": false, "start": 69.384, "end": 71.256, "words": [[69.502, 69.581], [69.595, 69.858], [69.871, 70.121], [70.134, 70.2], [70.213, 70.331], [70.345, 70.805]]}, {"kind": "s", "id": "s1_1_2", "md": "It also gives your manager something ==tangible== to bring into ==calibration==, where they have to argue your case against other strong people.", "zh": "这也能让经理在校准会上有实实在在的东西可拿，他得在那里拿你跟其他优秀的人比，替你争取。", "sp": null, "gap": false, "start": 71.256, "end": 79.176, "words": [[71.361, 71.44], [71.453, 71.796], [71.809, 72.045], [72.059, 72.177], [72.19, 72.717], [72.73, 73.151], [73.164, 73.795], [73.809, 73.927], [73.94, 74.335], [74.348, 74.559], [74.572, 75.295], [75.703, 75.796], [75.809, 75.927], [75.94, 76.177], [76.19, 76.282], [76.295, 76.664], [76.677, 76.861], [76.874, 77.309], [77.427, 77.822], [77.835, 78.045], [78.059, 78.374], [78.388, 78.782]]}, {"kind": "s", "id": "s1_2_0", "md": "Then __check in__ every month or two.", "zh": "然后每一两个月跟进一次。", "sp": null, "gap": true, "start": 79.176, "end": 81.384, "words": [[79.294, 79.413], [79.426, 79.676], [79.689, 79.834], [79.952, 80.163], [80.176, 80.492], [80.584, 80.663], [80.676, 80.992]]}, {"kind": "s", "id": "s1_2_1", "md": "Don't wait for the formal review, when it is too late to change the story.", "zh": "别等到正式绩效评估，到那时想改变叙事已经晚了。", "sp": null, "gap": false, "start": 81.384, "end": 85.848, "words": [[81.489, 81.687], [81.7, 81.923], [81.937, 82.055], [82.068, 82.147], [82.16, 82.555], [82.568, 83.002], [83.397, 83.516], [83.529, 83.608], [83.621, 83.779], [83.792, 84.068], [84.081, 84.397], [84.41, 84.502], [84.516, 84.884], [84.897, 84.963], [84.976, 85.45]]}, {"kind": "s", "id": "s1_2_2", "md": "Ask, \"Am I closer than last time, and what is still missing?\"", "zh": "问一句：「跟上次比，我离目标更近了吗？还缺什么？」", "sp": null, "gap": false, "start": 85.848, "end": 90.12, "words": [[85.953, 86.295], [86.73, 86.795], [86.809, 86.887], [86.901, 87.322], [87.335, 87.453], [87.466, 87.769], [87.782, 88.151], [88.532, 88.637], [88.651, 88.795], [88.809, 88.927], [88.94, 89.203], [89.216, 89.716]]}, {"kind": "s", "id": "s1_3_0", "md": "Your manager wants you to grow, but they have many people to think about.", "zh": "你的经理希望你成长，但他要操心的人很多。", "sp": null, "gap": true, "start": 90.12, "end": 94.464, "words": [[90.225, 90.331], [90.344, 90.817], [90.831, 91.107], [91.12, 91.212], [91.225, 91.304], [91.317, 91.738], [92.067, 92.199], [92.212, 92.344], [92.357, 92.594], [92.607, 93.002], [93.015, 93.357], [93.37, 93.409], [93.423, 93.659], [93.673, 94.081]]}, {"kind": "s", "id": "s1_3_1", "md": "Making your progress easy to see keeps it __on their agenda__.", "zh": "让你的进展一目了然，才能让它一直留在他的议程上。", "sp": null, "gap": false, "start": 94.464, "end": 97.848, "words": [[94.569, 94.832], [94.846, 94.951], [94.964, 95.477], [95.49, 95.819], [95.832, 95.938], [95.951, 96.253], [96.267, 96.582], [96.596, 96.675], [96.688, 96.806], [96.819, 96.951], [96.964, 97.451]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
