const D = {"id": "139", "type": "dialogue", "title": "Hiring a Babysitter", "meta": "B2 · 约 270 词 · 场景：面试保姆与谈价定规矩", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Babysitter", "name_zh": "保姆", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "孩子的作息和健康方面，「你」交代了什么？", "a": "六点半晚饭、洗澡、八点前上床，读书容易睡着；没有过敏，但有湿疹，只能用浴室抽屉里的药膏。"}, {"q": "时薪是怎么谈定的？", "a": "「你」出十八，保姆平时收二十，最后折中定十九；超过十一点由「你」出她回家的打车费。"}, {"q": "双方定了哪些规矩和下一步？", "a": "晚饭后不看屏幕、不带访客；孩子醒了先打给「你」再打给太太；先在这周五、父母还在家时试一晚。"}], "dictation": [{"id": "s0_0_0", "text": "Thanks for coming over, Priya. Could you tell me a bit about your experience with young kids?"}, {"id": "s0_8_0", "text": "We were thinking eighteen dollars an hour. Does that sound reasonable?"}, {"id": "s1_0_0", "text": "Let's meet in the middle at nineteen an hour, then. Would that work for you?"}, {"id": "s1_2_0", "text": "Of course. And if we're running late, we'll always let you know by text."}], "shadow": {"speaker": "A", "text": "Dinner at six thirty, then a bath, and bed by eight. He usually falls asleep quickly if you read to him.", "marked": "<b>Dinner</b> at six <b>thirty</b>, / then a <b>bath</b>, / and <b>bed</b> by eight. //<br>He usually falls asleep <b>quickly</b> / if you <b>read</b> to him. //"}, "prompts": [{"q": "保姆第一次单独带孩子，你出门前要在三十秒内交代清楚最重要的几件事。", "ref": "OK, we're heading out. Dinner is in the fridge, just heat it up for two minutes. He can have one episode of his cartoon, then bath and bed by eight. If he cries for us, give him his blue bunny. Our numbers are on the fridge. If anything feels wrong, call us right away, even if it seems small.", "ref_zh": "好，我们出门了。晚饭在冰箱里，热两分钟就行。他可以看一集动画片，然后洗澡，八点前睡觉。如果他哭着找我们，把那只蓝色小兔子给他。我们的电话在冰箱上。如果觉得有什么不对，马上给我们打电话，哪怕是小事。", "id": "ref0"}, {"q": "保姆连续两次迟到半小时，影响你们出门。礼貌但坦率地跟她谈一谈。", "ref": "Priya, can I have a quick word? The last two Fridays you arrived about half an hour late, and we almost missed our dinner booking. I know traffic can be bad, but we really need you here at six. If six is getting difficult for you, please tell me, and we can see if another time works better.", "ref_zh": "Priya，能简单聊两句吗？最近两个周五你都晚到了半小时左右，我们差点赶不上订好的晚餐。我知道有时候会堵车，但我们确实需要你六点到。如果六点对你来说越来越难，请告诉我，我们可以看看换个时间是不是更合适。", "id": "ref1"}], "words": [{"w": "first aid", "ipa": "/ˌfɜːrst ˈeɪd/", "zh": "急救", "ex": "There's a first aid kit under the kitchen sink.", "id": "w0"}, {"w": "routine", "ipa": "/ruːˈtiːn/", "zh": "日常作息", "ex": "Her bedtime routine is bath, book and then lights out.", "id": "w1"}, {"w": "medical", "ipa": "/ˈmedɪkəl/", "zh": "医疗的；健康方面的", "ex": "Please list any medical conditions on the form.", "id": "w2"}, {"w": "eczema", "ipa": "/ɪɡˈziːmə/", "zh": "湿疹", "ex": "His eczema gets worse in hot, humid weather.", "id": "w3"}, {"w": "reasonable", "ipa": "/ˈriːzənəbəl/", "zh": "合理的", "ex": "The rent is reasonable for this area.", "id": "w4"}, {"w": "meet in the middle", "ipa": "/miːt ɪn ðə ˈmɪdəl/", "zh": "各让一步；折中", "ex": "You want eighty, I offered sixty, so let's meet in the middle.", "id": "w5"}, {"w": "screen time", "ipa": "/ˈskriːn taɪm/", "zh": "看屏幕的时间", "ex": "We limit screen time to half an hour a day.", "id": "w6"}, {"w": "emergency", "ipa": "/ɪˈmɜːrdʒənsi/", "zh": "紧急情况", "ex": "In an emergency, call nine nine five.", "id": "w7"}, {"w": "trial", "ipa": "/ˈtraɪəl/", "zh": "试用；试做", "ex": "The gym offers a free one-week trial.", "id": "w8"}], "sections": [{"heading": "1. The Interview", "heading_zh": "1. 面试", "rows": [[{"id": "s0_0_0", "md": "**Thanks for coming over, Priya. Could you tell me a bit about your experience with young kids?**", "text": "Thanks for coming over, Priya. Could you tell me a bit about your experience with young kids?", "zh": "谢谢你过来，Priya。能简单说说你带小孩的经验吗？", "sp": "A"}], [{"id": "s0_1_0", "md": "Of course. I've been babysitting for five years, mostly toddlers. I also have a ==first aid== certificate.", "text": "Of course. I've been babysitting for five years, mostly toddlers. I also have a first aid certificate.", "zh": "当然。我做保姆五年了，主要带一到三岁的孩子。我还有急救证书。", "sp": "B"}], [{"id": "s0_2_0", "md": "That's great. Our son is two and a half. We mainly need help on Friday evenings, from six to eleven.", "text": "That's great. Our son is two and a half. We mainly need help on Friday evenings, from six to eleven.", "zh": "太好了。我们儿子两岁半。主要是周五晚上需要人，六点到十一点。", "sp": "A"}], [{"id": "s0_3_0", "md": "Friday evenings are fine for me. What's his ==routine== like?", "text": "Friday evenings are fine for me. What's his routine like?", "zh": "周五晚上我可以。他的作息是怎样的？", "sp": "B"}], [{"id": "s0_4_0", "md": "Dinner at six thirty, then a bath, and bed by eight. He usually falls asleep quickly if you read to him.", "text": "Dinner at six thirty, then a bath, and bed by eight. He usually falls asleep quickly if you read to him.", "zh": "六点半吃晚饭，然后洗澡，八点前上床。给他读读书，他一般很快就睡着。", "sp": "A"}], [{"id": "s0_5_0", "md": "Sounds easy enough. Does he have any ==medical== conditions I should know about?", "text": "Sounds easy enough. Does he have any medical conditions I should know about?", "zh": "听起来不难。他有什么我需要知道的健康问题吗？", "sp": "B"}], [{"id": "s0_6_0", "md": "No allergies, but he has ==eczema==, so please use only the cream in the bathroom drawer.", "text": "No allergies, but he has eczema, so please use only the cream in the bathroom drawer.", "zh": "没有过敏，但他有湿疹，所以请只用浴室抽屉里那支药膏。", "sp": "A"}], [{"id": "s0_7_0", "md": "Understood. And may I ask about the rate?", "text": "Understood. And may I ask about the rate?", "zh": "明白了。那可以问一下时薪吗？", "sp": "B"}], [{"id": "s0_8_0", "md": "We were thinking eighteen dollars an hour. Does that sound ==reasonable==?", "text": "We were thinking eighteen dollars an hour. Does that sound reasonable?", "zh": "我们想的是每小时十八块。你觉得合理吗？", "sp": "A"}], [{"id": "s0_9_0", "md": "I usually charge twenty, but I'm happy to be flexible for a regular booking.", "text": "I usually charge twenty, but I'm happy to be flexible for a regular booking.", "zh": "我一般收二十，不过如果是固定的活，我可以灵活一点。", "sp": "B"}]]}, {"heading": "2. Sorting Out the Details", "heading_zh": "2. 敲定细节", "rows": [[{"id": "s1_0_0", "md": "Let's __meet in the middle__ at nineteen an hour, then. Would that work for you?", "text": "Let's meet in the middle at nineteen an hour, then. Would that work for you?", "zh": "那我们折中一下，每小时十九块。你看行吗？", "sp": "A"}], [{"id": "s1_1_0", "md": "That works. But if it goes past eleven, could you __cover my taxi__ home?", "text": "That works. But if it goes past eleven, could you cover my taxi home?", "zh": "可以。不过如果超过十一点，能帮我出回家的打车费吗？", "sp": "B"}], [{"id": "s1_2_0", "md": "**Of course. And if we're running late, we'll always let you know by text.**", "text": "Of course. And if we're running late, we'll always let you know by text.", "zh": "当然。如果我们要晚回来，一定会提前发短信告诉你。", "sp": "A"}], [{"id": "s1_3_0", "md": "Thank you. What are your rules on ==screen time==?", "text": "Thank you. What are your rules on screen time?", "zh": "谢谢。关于看屏幕，你们有什么规定？", "sp": "B"}], [{"id": "s1_4_0", "md": "No screens after dinner, please. And no visitors while you're here.", "text": "No screens after dinner, please. And no visitors while you're here.", "zh": "晚饭后请不要让他看屏幕。另外你在的时候请不要带客人来。", "sp": "A"}], [{"id": "s1_5_0", "md": "Absolutely. Should I call you if he wakes up and won't settle?", "text": "Absolutely. Should I call you if he wakes up and won't settle?", "zh": "没问题。如果他醒了哄不睡，我要给你打电话吗？", "sp": "B"}], [{"id": "s1_6_0", "md": "Yes, call me first, then my wife. Our numbers are on the fridge, along with the ==emergency== contacts.", "text": "Yes, call me first, then my wife. Our numbers are on the fridge, along with the emergency contacts.", "zh": "要，先打给我，再打给我太太。我们的电话贴在冰箱上，紧急联系人也在那儿。", "sp": "A"}], [{"id": "s1_7_0", "md": "Perfect. Could we do a ==trial== evening first, so he can __get used to__ me?", "text": "Perfect. Could we do a trial evening first, so he can get used to me?", "zh": "好的。能不能先试一个晚上，让他熟悉一下我？", "sp": "B"}], [{"id": "s1_8_0", "md": "**Good idea. How about this Friday, while const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
