const D = {"id": "139", "type": "dialogue", "title": "Hiring a Babysitter", "meta": "B2 · 约 270 词 · 场景：面试保姆与谈价定规矩", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Babysitter", "name_zh": "保姆", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "孩子的作息和健康方面，「你」交代了什么？", "a": "六点半晚饭、洗澡、八点前上床，读书容易睡着；没有过敏，但有湿疹，只能用浴室抽屉里的药膏。"}, {"q": "时薪是怎么谈定的？", "a": "「你」出十八，保姆平时收二十，最后折中定十九；超过十一点由「你」出她回家的打车费。"}, {"q": "双方定了哪些规矩和下一步？", "a": "晚饭后不看屏幕、不带访客；孩子醒了先打给「你」再打给太太；先在这周五、父母还在家时试一晚。"}], "dictation": [{"id": "s0_0_0", "text": "Thanks for coming over, Priya. Could you tell me a bit about your experience with young kids?"}, {"id": "s0_8_0", "text": "We were thinking eighteen dollars an hour. Does that sound reasonable?"}, {"id": "s1_0_0", "text": "Let's meet in the middle at nineteen an hour, then. Would that work for you?"}, {"id": "s1_2_0", "text": "Of course. And if we're running late, we'll always let you know by text."}], "shadow": {"speaker": "A", "text": "Dinner at six thirty, then a bath, and bed by eight. He usually falls asleep quickly if you read to him.", "marked": "<b>Dinner</b> at six <b>thirty</b>, / then a <b>bath</b>, / and <b>bed</b> by eight. //<br>He usually falls asleep <b>quickly</b> / if you <b>read</b> to him. //"}, "prompts": [{"q": "保姆第一次单独带孩子，你出门前要在三十秒内交代清楚最重要的几件事。", "ref": "OK, we're heading out. Dinner is in the fridge, just heat it up for two minutes. He can have one episode of his cartoon, then bath and bed by eight. If he cries for us, give him his blue bunny. Our numbers are on the fridge. If anything feels wrong, call us right away, even if it seems small.", "ref_zh": "好，我们出门了。晚饭在冰箱里，热两分钟就行。他可以看一集动画片，然后洗澡，八点前睡觉。如果他哭着找我们，把那只蓝色小兔子给他。我们的电话在冰箱上。如果觉得有什么不对，马上给我们打电话，哪怕是小事。", "id": "ref0"}, {"q": "保姆连续两次迟到半小时，影响你们出门。礼貌但坦率地跟她谈一谈。", "ref": "Priya, can I have a quick word? The last two Fridays you arrived about half an hour late, and we almost missed our dinner booking. I know traffic can be bad, but we really need you here at six. If six is getting difficult for you, please tell me, and we can see if another time works better.", "ref_zh": "Priya，能简单聊两句吗？最近两个周五你都晚到了半小时左右，我们差点赶不上订好的晚餐。我知道有时候会堵车，但我们确实需要你六点到。如果六点对你来说越来越难，请告诉我，我们可以看看换个时间是不是更合适。", "id": "ref1"}], "words": [{"w": "first aid", "ipa": "/ˌfɜːrst ˈeɪd/", "zh": "急救", "ex": "There's a first aid kit under the kitchen sink.", "id": "w0"}, {"w": "routine", "ipa": "/ruːˈtiːn/", "zh": "日常作息", "ex": "Her bedtime routine is bath, book and then lights out.", "id": "w1"}, {"w": "medical", "ipa": "/ˈmedɪkəl/", "zh": "医疗的；健康方面的", "ex": "Please list any medical conditions on the form.", "id": "w2"}, {"w": "eczema", "ipa": "/ɪɡˈziːmə/", "zh": "湿疹", "ex": "His eczema gets worse in hot, humid weather.", "id": "w3"}, {"w": "reasonable", "ipa": "/ˈriːzənəbəl/", "zh": "合理的", "ex": "The rent is reasonable for this area.", "id": "w4"}, {"w": "meet in the middle", "ipa": "/miːt ɪn ðə ˈmɪdəl/", "zh": "各让一步；折中", "ex": "You want eighty, I offered sixty, so let's meet in the middle.", "id": "w5"}, {"w": "screen time", "ipa": "/ˈskriːn taɪm/", "zh": "看屏幕的时间", "ex": "We limit screen time to half an hour a day.", "id": "w6"}, {"w": "emergency", "ipa": "/ɪˈmɜːrdʒənsi/", "zh": "紧急情况", "ex": "In an emergency, call nine nine five.", "id": "w7"}, {"w": "trial", "ipa": "/ˈtraɪəl/", "zh": "试用；试做", "ex": "The gym offers a free one-week trial.", "id": "w8"}], "sections": [{"heading": "1. The Interview", "heading_zh": "1. 面试", "rows": [[{"id": "s0_0_0", "md": "**Thanks for coming over, Priya. Could you tell me a bit about your experience with young kids?**", "text": "Thanks for coming over, Priya. Could you tell me a bit about your experience with young kids?", "zh": "谢谢你过来，Priya。能简单说说你带小孩的经验吗？", "sp": "A"}], [{"id": "s0_1_0", "md": "Of course. I've been babysitting for five years, mostly toddlers. I also have a ==first aid== certificate.", "text": "Of course. I've been babysitting for five years, mostly toddlers. I also have a first aid certificate.", "zh": "当然。我做保姆五年了，主要带一到三岁的孩子。我还有急救证书。", "sp": "B"}], [{"id": "s0_2_0", "md": "That's great. Our son is two and a half. We mainly need help on Friday evenings, from six to eleven.", "text": "That's great. Our son is two and a half. We mainly need help on Friday evenings, from six to eleven.", "zh": "太好了。我们儿子两岁半。主要是周五晚上需要人，六点到十一点。", "sp": "A"}], [{"id": "s0_3_0", "md": "Friday evenings are fine for me. What's his ==routine== like?", "text": "Friday evenings are fine for me. What's his routine like?", "zh": "周五晚上我可以。他的作息是怎样的？", "sp": "B"}], [{"id": "s0_4_0", "md": "Dinner at six thirty, then a bath, and bed by eight. He usually falls asleep quickly if you read to him.", "text": "Dinner at six thirty, then a bath, and bed by eight. He usually falls asleep quickly if you read to him.", "zh": "六点半吃晚饭，然后洗澡，八点前上床。给他读读书，他一般很快就睡着。", "sp": "A"}], [{"id": "s0_5_0", "md": "Sounds easy enough. Does he have any ==medical== conditions I should know about?", "text": "Sounds easy enough. Does he have any medical conditions I should know about?", "zh": "听起来不难。他有什么我需要知道的健康问题吗？", "sp": "B"}], [{"id": "s0_6_0", "md": "No allergies, but he has ==eczema==, so please use only the cream in the bathroom drawer.", "text": "No allergies, but he has eczema, so please use only the cream in the bathroom drawer.", "zh": "没有过敏，但他有湿疹，所以请只用浴室抽屉里那支药膏。", "sp": "A"}], [{"id": "s0_7_0", "md": "Understood. And may I ask about the rate?", "text": "Understood. And may I ask about the rate?", "zh": "明白了。那可以问一下时薪吗？", "sp": "B"}], [{"id": "s0_8_0", "md": "We were thinking eighteen dollars an hour. Does that sound ==reasonable==?", "text": "We were thinking eighteen dollars an hour. Does that sound reasonable?", "zh": "我们想的是每小时十八块。你觉得合理吗？", "sp": "A"}], [{"id": "s0_9_0", "md": "I usually charge twenty, but I'm happy to be flexible for a regular booking.", "text": "I usually charge twenty, but I'm happy to be flexible for a regular booking.", "zh": "我一般收二十，不过如果是固定的活，我可以灵活一点。", "sp": "B"}]]}, {"heading": "2. Sorting Out the Details", "heading_zh": "2. 敲定细节", "rows": [[{"id": "s1_0_0", "md": "Let's __meet in the middle__ at nineteen an hour, then. Would that work for you?", "text": "Let's meet in the middle at nineteen an hour, then. Would that work for you?", "zh": "那我们折中一下，每小时十九块。你看行吗？", "sp": "A"}], [{"id": "s1_1_0", "md": "That works. But if it goes past eleven, could you __cover my taxi__ home?", "text": "That works. But if it goes past eleven, could you cover my taxi home?", "zh": "可以。不过如果超过十一点，能帮我出回家的打车费吗？", "sp": "B"}], [{"id": "s1_2_0", "md": "**Of course. And if we're running late, we'll always let you know by text.**", "text": "Of course. And if we're running late, we'll always let you know by text.", "zh": "当然。如果我们要晚回来，一定会提前发短信告诉你。", "sp": "A"}], [{"id": "s1_3_0", "md": "Thank you. What are your rules on ==screen time==?", "text": "Thank you. What are your rules on screen time?", "zh": "谢谢。关于看屏幕，你们有什么规定？", "sp": "B"}], [{"id": "s1_4_0", "md": "No screens after dinner, please. And no visitors while you're here.", "text": "No screens after dinner, please. And no visitors while you're here.", "zh": "晚饭后请不要让他看屏幕。另外你在的时候请不要带客人来。", "sp": "A"}], [{"id": "s1_5_0", "md": "Absolutely. Should I call you if he wakes up and won't settle?", "text": "Absolutely. Should I call you if he wakes up and won't settle?", "zh": "没问题。如果他醒了哄不睡，我要给你打电话吗？", "sp": "B"}], [{"id": "s1_6_0", "md": "Yes, call me first, then my wife. Our numbers are on the fridge, along with the ==emergency== contacts.", "text": "Yes, call me first, then my wife. Our numbers are on the fridge, along with the emergency contacts.", "zh": "要，先打给我，再打给我太太。我们的电话贴在冰箱上，紧急联系人也在那儿。", "sp": "A"}], [{"id": "s1_7_0", "md": "Perfect. Could we do a ==trial== evening first, so he can __get used to__ me?", "text": "Perfect. Could we do a trial evening first, so he can get used to me?", "zh": "好的。能不能先试一个晚上，让他熟悉一下我？", "sp": "B"}], [{"id": "s1_8_0", "md": "**Good idea. How about this Friday, while const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
