<script>
const D = {"id": "099", "title": "When Silence Means Different Things", "meta": "B2 · 约 280 词 · 场景：解读会议中的沉默", "voice": "en-AU-NatashaNeural", "rate": "-5%", "sections": [{"heading": "1. Four Meanings of the Same Pause", "heading_zh": "1. 同一段沉默的四种意思", "rows": [[{"id": "s0_0_0", "md": "You finish presenting a plan and ask for feedback.", "text": "You finish presenting a plan and ask for feedback.", "zh": "你讲完一个方案，请大家提意见。", "sp": null}, {"id": "s0_0_1", "md": "Nobody says anything for five seconds.", "text": "Nobody says anything for five seconds.", "zh": "五秒钟没人说话。", "sp": null}, {"id": "s0_0_2", "md": "What does that silence mean?", "text": "What does that silence mean?", "zh": "这段沉默是什么意思？", "sp": null}, {"id": "s0_0_3", "md": "The honest answer is that it depends on who is in the room.", "text": "The honest answer is that it depends on who is in the room.", "zh": "老实说，这取决于屋里坐的是谁。", "sp": null}], [{"id": "s0_1_0", "md": "For an Australian colleague, it might mean, \"I agree, let's move on.\"", "text": "For an Australian colleague, it might mean, \"I agree, let's move on.\"", "zh": "对一个澳洲同事来说，可能意思是：「我同意，往下走吧。」", "sp": null}, {"id": "s0_1_1", "md": "For someone from a culture that values ==hierarchy==, it might mean, \"I disagree, but it's not my place to say so in front of your manager.\"", "text": "For someone from a culture that values hierarchy, it might mean, \"I disagree, but it's not my place to say so in front of your manager.\"", "zh": "对来自看重层级的文化的人来说，可能意思是：「我不同意，但当着你老板的面轮不到我说。」", "sp": null}, {"id": "s0_1_2", "md": "For a colleague working in a second language, it might simply mean, \"I'm still ==processing== what you said.\"", "text": "For a colleague working in a second language, it might simply mean, \"I'm still processing what you said.\"", "zh": "对一个用第二语言工作的同事来说，可能只是：「我还在消化你刚才说的。」", "sp": null}, {"id": "s0_1_3", "md": "And for an engineer from Finland, a long pause may just be polite thinking time.", "text": "And for an engineer from Finland, a long pause may just be polite thinking time.", "zh": "而对一个芬兰工程师来说，长时间停顿可能只是礼貌的思考时间。", "sp": null}], [{"id": "s0_2_0", "md": "**Silence is information, but it is not an answer.**", "text": "Silence is information, but it is not an answer.", "zh": "沉默是信息，但不是答案。", "sp": null}, {"id": "s0_2_1", "md": "If you treat it as ==consent==, you will often get surprises later, usually in the form of quiet resistance or work that slowly stalls.", "text": "If you treat it as consent, you will often get surprises later, usually in the form of quiet resistance or work that slowly stalls.", "zh": "如果你把它当成默许，之后往往会有意外，通常表现为无声的抵触，或者慢慢停滞的工作。", "sp": null}]]}, {"heading": "2. Design the Meeting for Quiet People", "heading_zh": "2. 为安静的人设计会议", "rows": [[{"id": "s1_0_0", "md": "First, wait longer than feels comfortable.", "text": "First, wait longer than feels comfortable.", "zh": "第一，等得比你觉得舒服的时间更久一点。", "sp": null}, {"id": "s1_0_1", "md": "Count to seven in your head after asking a question.", "text": "Count to seven in your head after asking a question.", "zh": "提完问题后，在心里数到七。", "sp": null}, {"id": "s1_0_2", "md": "Many ==reflective== people need those extra seconds to __put their thoughts into words__.", "text": "Many reflective people need those extra seconds to put their thoughts into words.", "zh": "很多爱琢磨的人需要多出来的这几秒，才能把想法组织成话。", "sp": null}], [{"id": "s1_1_0", "md": "Second, ask specific people specific questions.", "text": "Second, ask specific people specific questions.", "zh": "第二，点名问具体的人具体的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"Mei, you know the billing system best, what risk do you see here?\" is much easier to answer than an open \"Anyone?\"", "text": "\"Mei, you know the billing system best, what risk do you see here?\" is much easier to answer than an open \"Anyone?\"", "zh": "「Mei，计费系统你最熟，你看这里有什么风险？」比一句开放的「有人要说吗？」好回答得多。", "sp": null}, {"id": "s1_1_2", "md": "It also gives junior colleagues permission to speak before the seniors __set the tone__.", "text": "It also gives junior colleagues permission to speak before the seniors set the tone.", "zh": "这也让资历浅的同事可以在资深的人定调之前先开口。", "sp": null}], [{"id": "s1_2_0", "md": "Third, offer an ==alternative== channel.", "text": "Third, offer an alternative channel.", "zh": "第三，提供另一个渠道。", "sp": null}, {"id": "s1_2_1", "md": "\"If you'd rather think about it, __drop your comments__ in the doc by tomorrow\" catches the people who do their best thinking after the meeting.", "text": "\"If you'd rather think about it, drop your comments in the doc by tomorrow\" catches the people who do their best thinking after the meeting.", "zh": "「如果你想再想想，明天之前把意见写到文档里」，能接住那些会后才想得最清楚的人。", "sp": null}, {"id": "s1_2_2", "md": "Some of your best ideas will arrive that way.", "text": "Some of your best ideas will arrive that way.", "zh": "你的一些最好的点子会从这个渠道冒出来。", "sp": null}], [{"id": "s1_3_0", "md": "**Make it normal to disagree after the meeting, not just during it.**", "text": "Make it normal to disagree after the meeting, not just during it.", "zh": "让会后提不同意见成为常态，而不是只能在会上提。", "sp": null}, {"id": "s1_3_1", "md": "Over time, you will learn what silence means for each person on your team, and you will stop ==mistaking== quiet for agreement.", "text": "Over time, you will learn what silence means for each person on your team, and you will stop mistaking quiet for agreement.", "zh": "时间长了，你会知道团队里每个人的沉默分别意味着什么，也就不会再把安静错当成同意。", "sp": null}]]}], "gist": [{"q": "同样五秒钟的沉默，在文中可能有哪几种含义？", "a": "澳洲同事：同意，继续吧；重视等级的文化：不同意但不便当着上级说；第二语言者：还在消化；芬兰工程师：礼貌的思考时间。"}, {"q": "作者对沉默的核心判断是什么？", "a": "沉默是信息，但不是答案；把沉默当同意，之后常会出现消极抵触或工作慢慢停滞。"}, {"q": "怎样为安静的人设计会议？", "a": "提问后多等一会儿（心里数到七）；点名问具体的人具体问题；提供会后在文档评论的渠道；让会后提异议成为常态。"}], "dictation": [{"id": "s0_2_0", "text": "Silence is information, but it is not an answer."}, {"id": "s1_0_0", "text": "First, wait longer than feels comfortable."}, {"id": "s1_1_0", "text": "Second, ask specific people specific questions."}, {"id": "s1_3_0", "text": "Make it normal to disagree after the meeting, not just during it."}], "shadow": {"text": "For a colleague working in a second language, it might simply mean, \"I'm still processing what you said.\" And for an engineer from Finland, a long pause may just be polite thinking time.", "marked": "For a colleague working in a <b>second</b> language, / it might <b>simply</b> mean, / \"I'm <b>still</b> processing / what you <b>said</b>.\" //<br>And for an engineer from <b>Finland</b>, / a <b>long</b> pause / may just be polite <b>thinking</b> time. //"}, "prompts": [{"q": "你在会上提出组织调整方案后全场沉默。你不确定这代表同意还是不满。用文中的方法处理，30 秒。", "ref": "I'll take that silence as people thinking it over, not as a yes. It's a big change, so I don't expect instant reactions. Priya, you've worked closely with both teams, what worries you most about this? Thanks, that's helpful. For everyone else, please add your concerns to the doc by Thursday, even small ones. Nothing is final until then.", "ref_zh": "我把刚才的沉默理解为大家在思考，而不是同意。这是个大调整，我也不指望大家马上有反应。Priya，你跟两个团队都合作很紧，你最担心的是什么？谢谢，很有帮助。其他人请在周四之前把顾虑写到文档里，再小的也写。在那之前都不算最终定下。", "id": "ref0"}, {"q": "一位日本同事在讨论中总不发言。会后你私下鼓励他表达意见。", "ref": "Hey Kenji, do you have a minute? I noticed you were quiet in the design review, and I know you've worked on that service for years. I'd really value your view, even if it's different from mine. If speaking up in the meeting feels awkward, feel free to message me or comment in the doc. Your input really does change decisions.", "ref_zh": "嘿 Kenji，有空聊一分钟吗？我注意到你在设计评审上没怎么说话，我知道那个服务你做了好几年。我真的很看重你的看法，哪怕跟我的不一样。如果在会上发言觉得别扭，随时私信我或者在文档里评论都行。你的意见是真的会影响决策的。", "id": "ref1"}], "words": [{"w": "hierarchy", "ipa": "/ˈhaɪəˌrɑːrki/", "zh": "等级制度、层级", "ex": "In some teams, hierarchy makes people wait for the manager to speak first.", "id": "w0"}, {"w": "process (v.)", "ipa": "/ˈprɑːses/", "zh": "消化、理解", "ex": "Give me a minute to process that, it's a big change.", "tts_w": "process", "id": "w1"}, {"w": "consent", "ipa": "/kənˈsent/", "zh": "同意、许可", "ex": "Silence in the room is not the same as consent.", "id": "w2"}, {"w" 6, 86.974], [87.027, 87.409], [87.409, 87.54], [87.566, 87.645], [87.724, 88.027], [88.093, 88.58]]}, {"kind": "s", "id": "s1_1_2", "md": "It also gives junior colleagues permission to speak before the seniors __set the tone__.", "zh": "这也让资历浅的同事可以在资深的人定调之前先开口。", "sp": null, "gap": false, "start": 89.616, "end": 95.352, "words": [[89.719, 89.811], [89.824, 90.219], [90.271, 90.495], [90.534, 90.969], [90.969, 91.403], [91.455, 91.903], [91.955, 92.087], [92.087, 92.455], [92.521, 92.903], [92.916, 93.008], [93.008, 93.508], [93.548, 93.771], [93.784, 93.903], [93.903, 94.298]]}, {"kind": "s", "id": "s1_2_0", "md": "Third, offer an ==alternative== channel.", "zh": "第三，提供另一个渠道。", "sp": null, "gap": true, "start": 95.352, "end": 98.664, "words": [[95.455, 95.849], [96.02, 96.389], [96.441, 96.494], [96.534, 97.165], [97.178, 97.639]]}, {"kind": "s", "id": "s1_2_1", "md": "\"If you'd rather think about it, __drop your comments__ in the doc by tomorrow\" catches the people who do their best thinking after the meeting.", "zh": "「如果你想再想想，明天之前把意见写到文档里」，能接住那些会后才想得最清楚的人。", "sp": null, "gap": false, "start": 98.664, "end": 107.016, "words": [[98.767, 98.885], [98.885, 99.148], [99.175, 99.503], [99.517, 99.753], [99.753, 100.056], [100.056, 100.175], [100.398, 100.846], [100.898, 101.003], [101.03, 101.477], [101.503, 101.648], [101.648, 101.74], [101.74, 102.003], [102.003, 102.135], [102.201, 102.635], [102.78, 103.201], [103.227, 103.332], [103.332, 103.727], [103.793, 104.082], [104.135, 104.28], [104.319, 104.424], [104.451, 104.701], [104.74, 105.096], [105.175, 105.503], [105.503, 105.596], [105.596, 105.99]]}, {"kind": "s", "id": "s1_2_2", "md": "Some of your best ideas will arrive that way.", "zh": "你的一些最好的点子会从这个渠道冒出来。", "sp": null, "gap": false, "start": 107.016, "end": 110.784, "words": [[107.119, 107.342], [107.395, 107.461], [107.474, 107.632], [107.658, 107.921], [107.974, 108.474], [108.54, 108.684], [108.711, 109.132], [109.171, 109.355], [109.369, 109.645]]}, {"kind": "s", "id": "s1_3_0", "md": "**Make it normal to disagree after the meeting, not just during it.**", "zh": "让会后提不同意见成为常态，而不是只能在会上提。", "sp": null, "gap": true, "start": 110.784, "end": 115.632, "words": [[110.887, 111.123], [111.137, 111.216], [111.229, 111.61], [111.61, 111.729], [111.729, 112.216], [112.321, 112.623], [112.623, 112.716], [112.716, 113.137], [113.36, 113.729], [113.755, 114.044], [114.058, 114.387], [114.452, 114.545]]}, {"kind": "s", "id": "s1_3_1", "md": "Over time, you will learn what silence means for each person on your team, and you will stop ==mistaking== quiet for agreement.", "zh": "时间长了，你会知道团队里每个人的沉默分别意味着什么，也就不会再把安静错当成同意。", "sp": null, "gap": false, "start": 115.632, "end": 123.816, "words": [[115.735, 115.971], [115.971, 116.366], [116.577, 116.84], [116.84, 116.945], [116.945, 117.261], [117.3, 117.471], [117.537, 117.985], [118.037, 118.34], [118.366, 118.471], [118.471, 118.721], [118.8, 119.182], [119.208, 119.314], [119.34, 119.458], [119.485, 119.853], [120.129, 120.524], [120.564, 120.682], [120.682, 120.774], [120.787, 121.064], [121.077, 121.577], [121.643, 121.998], [122.064, 122.169], [122.235, 122.748]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
