<script>
const D = {"id": "099", "title": "When Silence Means Different Things", "meta": "B2 · 约 280 词 · 场景：解读会议中的沉默", "voice": "en-AU-NatashaNeural", "rate": "-5%", "sections": [{"heading": "1. Four Meanings of the Same Pause", "heading_zh": "1. 同一段沉默的四种意思", "rows": [[{"id": "s0_0_0", "md": "You finish presenting a plan and ask for feedback.", "text": "You finish presenting a plan and ask for feedback.", "zh": "你讲完一个方案，请大家提意见。", "sp": null}, {"id": "s0_0_1", "md": "Nobody says anything for five seconds.", "text": "Nobody says anything for five seconds.", "zh": "五秒钟没人说话。", "sp": null}, {"id": "s0_0_2", "md": "What does that silence mean?", "text": "What does that silence mean?", "zh": "这段沉默是什么意思？", "sp": null}, {"id": "s0_0_3", "md": "The honest answer is that it depends on who is in the room.", "text": "The honest answer is that it depends on who is in the room.", "zh": "老实说，这取决于屋里坐的是谁。", "sp": null}], [{"id": "s0_1_0", "md": "For an Australian colleague, it might mean, \"I agree, let's move on.\"", "text": "For an Australian colleague, it might mean, \"I agree, let's move on.\"", "zh": "对一个澳洲同事来说，可能意思是：「我同意，往下走吧。」", "sp": null}, {"id": "s0_1_1", "md": "For someone from a culture that values ==hierarchy==, it might mean, \"I disagree, but it's not my place to say so in front of your manager.\"", "text": "For someone from a culture that values hierarchy, it might mean, \"I disagree, but it's not my place to say so in front of your manager.\"", "zh": "对来自看重层级的文化的人来说，可能意思是：「我不同意，但当着你老板的面轮不到我说。」", "sp": null}, {"id": "s0_1_2", "md": "For a colleague working in a second language, it might simply mean, \"I'm still ==processing== what you said.\"", "text": "For a colleague working in a second language, it might simply mean, \"I'm still processing what you said.\"", "zh": "对一个用第二语言工作的同事来说，可能只是：「我还在消化你刚才说的。」", "sp": null}, {"id": "s0_1_3", "md": "And for an engineer from Finland, a long pause may just be polite thinking time.", "text": "And for an engineer from Finland, a long pause may just be polite thinking time.", "zh": "而对一个芬兰工程师来说，长时间停顿可能只是礼貌的思考时间。", "sp": null}], [{"id": "s0_2_0", "md": "**Silence is information, but it is not an answer.**", "text": "Silence is information, but it is not an answer.", "zh": "沉默是信息，但不是答案。", "sp": null}, {"id": "s0_2_1", "md": "If you treat it as ==consent==, you will often get surprises later, usually in the form of quiet resistance or work that slowly stalls.", "text": "If you treat it as consent, you will often get surprises later, usually in the form of quiet resistance or work that slowly stalls.", "zh": "如果你把它当成默许，之后往往会有意外，通常表现为无声的抵触，或者慢慢停滞的工作。", "sp": null}]]}, {"heading": "2. Design the Meeting for Quiet People", "heading_zh": "2. 为安静的人设计会议", "rows": [[{"id": "s1_0_0", "md": "First, wait longer than feels comfortable.", "text": "First, wait longer than feels comfortable.", "zh": "第一，等得比你觉得舒服的时间更久一点。", "sp": null}, {"id": "s1_0_1", "md": "Count to seven in your head after asking a question.", "text": "Count to seven in your head after asking a question.", "zh": "提完问题后，在心里数到七。", "sp": null}, {"id": "s1_0_2", "md": "Many ==reflective== people need those extra seconds to __put their thoughts into words__.", "text": "Many reflective people need those extra seconds to put their thoughts into words.", "zh": "很多爱琢磨的人需要多出来的这几秒，才能把想法组织成话。", "sp": null}], [{"id": "s1_1_0", "md": "Second, ask specific people specific questions.", "text": "Second, ask specific people specific questions.", "zh": "第二，点名问具体的人具体的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"Mei, you know the billing system best, what risk do you see here?\" is much easier to answer than an open \"Anyone?\"", "text": "\"Mei, you know the billing system best, what risk do you see here?\" is much easier to answer than an open \"Anyone?\"", "zh": "「Mei，计费系统你最熟，你看这里有什么风险？」比一句开放的「有人要说吗？」好回答得多。", "sp": null}, {"id": "s1_1_2", "md": "It also gives junior colleagues permission to speak before the seniors __set the tone__.", "text": "It also gives junior colleagues permission to speak before the seniors set the tone.", "zh": "这也让资历浅的同事可以在资深的人定调之前先开口。", "sp": null}], [{"id": "s1_2_0", "md": "Third, offer an ==alternative== channel.", "text": "Third, offer an alternative channel.", "zh": "第三，提供另一个渠道。", "sp": null}, {"id": "s1_2_1", "md": "\"If you'd rather think about it, __drop your comments__ in the doc by tomorrow\" catches the people who do their best thinking after the meeting.", "text": "\"If you'd rather think about it, drop your comments in the doc by tomorrow\" catches the people who do their best thinking after the meeting.", "zh": "「如果你想再想想，明天之前把意见写到文档里」，能接住那些会后才想得最清楚的人。", "sp": null}, {"id": "s1_2_2", "md": "Some of your best ideas will arrive that way.", "text": "Some of your best ideas will arrive that way.", "zh": "你的一些最好的点子会从这个渠道冒出来。", "sp": null}], [{"id": "s1_3_0", "md": "**Make it normal to disagree after the meeting, not just during it.**", "text": "Make it normal to disagree after the meeting, not just during it.", "zh": "让会后提不同意见成为常态，而不是只能在会上提。", "sp": null}, {"id": "s1_3_1", "md": "Over time, you will learn what silence means for each person on your team, and you will stop ==mistaking== quiet for agreement.", "text": "Over time, you will learn what silence means for each person on your team, and you will stop mistaking quiet for agreement.", "zh": "时间长了，你会知道团队里每个人的沉默分别意味着什么，也就不会再把安静错当成同意。", "sp": null}]]}], "gist": [{"q": "同样五秒钟的沉默，在文中可能有哪几种含义？", "a": "澳洲同事：同意，继续吧；重视等级的文化：不同意但不便当着上级说；第二语言者：还在消化；芬兰工程师：礼貌的思考时间。"}, {"q": "作者对沉默的核心判断是什么？", "a": "沉默是信息，但不是答案；把沉默当同意，之后常会出现消极抵触或工作慢慢停滞。"}, {"q": "怎样为安静的人设计会议？", "a": "提问后多等一会儿（心里数到七）；点名问具体的人具体问题；提供会后在文档评论的渠道；让会后提异议成为常态。"}], "dictation": [{"id": "s0_2_0", "text": "Silence is information, but it is not an answer."}, {"id": "s1_0_0", "text": "First, wait longer than feels comfortable."}, {"id": "s1_1_0", "text": "Second, ask specific people specific questions."}, {"id": "s1_3_0", "text": "Make it normal to disagree after the meeting, not just during it."}], "shadow": {"text": "For a colleague working in a second language, it might simply mean, \"I'm still processing what you said.\" And for an engineer from Finland, a long pause may just be polite thinking time.", "marked": "For a colleague working in a <b>second</b> language, / it might <b>simply</b> mean, / \"I'm <b>still</b> processing / what you <b>said</b>.\" //<br>And for an engineer from <b>Finland</b>, / a <b>long</b> pause / may just be polite <b>thinking</b> time. //"}, "prompts": [{"q": "你在会上提出组织调整方案后全场沉默。你不确定这代表同意还是不满。用文中的方法处理，30 秒。", "ref": "I'll take that silence as people thinking it over, not as a yes. It's a big change, so I don't expect instant reactions. Priya, you've worked closely with both teams, what worries you most about this? Thanks, that's helpful. For everyone else, please add your concerns to the doc by Thursday, even small ones. Nothing is final until then.", "ref_zh": "我把刚才的沉默理解为大家在思考，而不是同意。这是个大调整，我也不指望大家马上有反应。Priya，你跟两个团队都合作很紧，你最担心的是什么？谢谢，很有帮助。其他人请在周四之前把顾虑写到文档里，再小的也写。在那之前都不算最终定下。", "id": "ref0"}, {"q": "一位日本同事在讨论中总不发言。会后你私下鼓励他表达意见。", "ref": "Hey Kenji, do you have a minute? I noticed you were quiet in the design review, and I know you've worked on that service for years. I'd really value your view, even if it's different from mine. If speaking up in the meeting feels awkward, feel free to message me or comment in the doc. Your input really does change decisions.", "ref_zh": "嘿 Kenji，有空聊一分钟吗？我注意到你在设计评审上没怎么说话，我知道那个服务你做了好几年。我真的很看重你的看法，哪怕跟我的不一样。如果在会上发言觉得别扭，随时私信我或者在文档里评论都行。你的意见是真的会影响决策的。", "id": "ref1"}], "words": [{"w": "hierarchy", "ipa": "/ˈhaɪəˌrɑːrki/", "zh": "等级制度、层级", "ex": "In some teams, hierarchy makes people wait for the manager to speak first.", "id": "w0"}, {"w": "process (v.)", "ipa": "/ˈprɑːses/", "zh": "消化、理解", "ex": "Give me a minute to process that, it's a big change.", "tts_w": "process", "id": "w1"}, {"w": "consent", "ipa": "/kənˈsent/", "zh": "同意、许可", "ex": "Silence in the room is not the same as consent.", "id": "w2"}, {"w" const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

};

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
