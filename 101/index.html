<script>
const D = {"id": "101", "type": "dialogue", "title": "Checking In at a Hotel", "meta": "B2 · 约 280 词 · 场景：酒店入住与客房问题", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Front Desk", "name_zh": "前台", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "「你」对房间提了什么要求？前台怎么安排的？", "a": "要高楼层、离电梯远的房间；前台安排在十八楼的城景房。"}, {"q": "押金和延迟退房的规则分别是什么？", "a": "押金每晚一百元，退房时解冻；可以免费延迟退房到下午一点。"}, {"q": "空调坏了，酒店给出的解决方案是什么？", "a": "马上派维修师傅；十五分钟修不好就升级到同层套房，并免费送水果拼盘。"}], "dictation": [{"id": "s0_3_0", "text": "That's right. Is it possible to get a room on a higher floor, away from the elevator?"}, {"id": "s0_10_0", "text": "And could I get a late checkout on Sunday? My flight isn't until the evening."}, {"id": "s1_2_0", "text": "Thanks. If it can't be fixed tonight, would it be possible to move to another room?"}, {"id": "s1_6_0", "text": "That's very kind. Thanks for sorting this out so quickly."}], "shadow": {"speaker": "A", "text": "Hi, this is Mr. Lee in room eighteen twelve. The air conditioning isn't working, and the room is quite warm.", "marked": "Hi, / this is Mr. <b>Lee</b> / in room <b>eighteen twelve</b>. //<br>The <b>air conditioning</b> / <b>isn't</b> working, / and the room is quite <b>warm</b>. //"}, "prompts": [{"q": "入住时发现订的是两张单人床，你想换成一张大床。用 30 秒跟前台沟通，礼貌但明确。", "ref": "Hi, sorry to bother you. I just got to my room, and it has two single beds, but I booked a king room. Is it possible to switch to a king tonight? If none are free, could you move me tomorrow morning? I'm happy to pack my things and wait in the lobby.", "ref_zh": "你好，不好意思打扰一下。我刚进房间，发现是两张单人床，但我订的是大床房。今晚能换成大床吗？如果没有空房了，明天早上帮我换可以吗？我可以先收拾好东西在大堂等。", "id": "ref0"}, {"q": "隔壁房间半夜很吵，你打电话给前台。说清房号、问题，并提出你希望的处理方式。", "ref": "Hi, this is room eighteen twelve. I'm sorry to call so late, but the room next door has been really loud for about an hour, and I have an early flight. Could someone ask them to keep it down? If that doesn't work, I'd like to move to a quieter room.", "ref_zh": "你好，我是一八一二房间。抱歉这么晚打电话，隔壁房间已经吵了快一个小时了，我明天一早还要赶飞机。能不能请人去提醒他们小声一点？如果不管用，我想换一间安静点的房间。", "id": "ref1"}], "words": [{"w": "reservation", "ipa": "/ˌrezərˈveɪʃən/", "zh": "预订", "ex": "I have a reservation for two at seven.", "id": "w0"}, {"w": "incidentals", "ipa": "/ˌɪnsɪˈdentəlz/", "zh": "杂费（酒店预授权用）", "ex": "They put a hold on my card for incidentals.", "id": "w1"}, {"w": "deposit", "ipa": "/dɪˈpɑːzɪt/", "zh": "押金", "ex": "The deposit will be refunded when you return the key.", "id": "w2"}, {"w": "included", "ipa": "/ɪnˈkluːdɪd/", "zh": "包含的", "ex": "Is service charge included in the price?", "id": "w3"}, {"w": "late checkout", "ipa": "/leɪt ˈtʃekaʊt/", "zh": "延迟退房", "ex": "Could I get a late checkout until two?", "id": "w4"}, {"w": "technician", "ipa": "/tekˈnɪʃən/", "zh": "维修技师", "ex": "A technician will come by between nine and twelve.", "id": "w5"}, {"w": "upgrade (v.)", "ipa": "/ˌʌpˈɡreɪd/", "zh": "升级", "ex": "They upgraded us to a sea view room for free.", "tts_w": "upgrade", "id": "w6"}, {"w": "complimentary", "ipa": "/ˌkɑːmpləˈmentəri/", "zh": "免费赠送的", "ex": "The hotel offers complimentary water and coffee in the lobby.", "id": "w7"}, {"w": "make up for", "ipa": "/meɪk ʌp fɔːr/", "zh": "弥补", "ex": "They gave us free drinks to make up for the long wait.", "id": "w8"}], "sections": [{"heading": "1. At the Front Desk", "heading_zh": "1. 在前台", "rows": [[{"id": "s0_0_0", "md": "Good evening, and welcome. Are you checking in?", "text": "Good evening, and welcome. Are you checking in?", "zh": "晚上好，欢迎光临。您是要办入住吗？", "sp": "B"}], [{"id": "s0_1_0", "md": "Yes, I have a __reservation under the name__ Lee.", "text": "Yes, I have a reservation under the name Lee.", "zh": "是的，我用 Lee 这个名字订了房。", "sp": "A"}], [{"id": "s0_2_0", "md": "Let me pull that up. A king room for three nights, checking out on Sunday?", "text": "Let me pull that up. A king room for three nights, checking out on Sunday?", "zh": "我查一下。一间大床房，住三晚，周日退房，对吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**That's right. Is it possible to get a room on a higher floor, away from the elevator?**", "text": "That's right. Is it possible to get a room on a higher floor, away from the elevator?", "zh": "对。有没有可能给我一间高楼层、离电梯远一点的房间？", "sp": "A"}], [{"id": "s0_4_0", "md": "Let me check. Yes, I can put you on the eighteenth floor with a city view.", "text": "Let me check. Yes, I can put you on the eighteenth floor with a city view.", "zh": "我看看。可以，我给您安排在十八楼，城景房。", "sp": "B"}], [{"id": "s0_5_0", "md": "May I have your passport and a credit card for ==incidentals==?", "text": "May I have your passport and a credit card for incidentals?", "zh": "麻烦出示一下护照，再给一张信用卡用于杂费预授权。", "sp": "B"}], [{"id": "s0_6_0", "md": "Sure. How much is the ==deposit==?", "text": "Sure. How much is the deposit?", "zh": "好的。押金是多少？", "sp": "A"}], [{"id": "s0_7_0", "md": "It's one hundred dollars per night, and it's released when you check out.", "text": "It's one hundred dollars per night, and it's released when you check out.", "zh": "每晚一百元，退房时会解冻。", "sp": "B"}], [{"id": "s0_8_0", "md": "Got it. Is breakfast ==included==, and what time does it start?", "text": "Got it. Is breakfast included, and what time does it start?", "zh": "明白。含早餐吗？几点开始？", "sp": "A"}], [{"id": "s0_9_0", "md": "Yes, it's included. It's served from six thirty to ten thirty on the second floor.", "text": "Yes, it's included. It's served from six thirty to ten thirty on the second floor.", "zh": "含的。早餐在二楼，六点半到十点半。", "sp": "B"}], [{"id": "s0_10_0", "md": "And could I __get a late checkout__ on Sunday? My flight isn't until the evening.", "text": "And could I get a late checkout on Sunday? My flight isn't until the evening.", "zh": "另外周日能晚点退房吗？我的航班是晚上的。", "sp": "A"}], [{"id": "s0_11_0", "md": "I can give you until one o'clock __at no extra charge__.", "text": "I can give you until one o'clock at no extra charge.", "zh": "我可以给您延到一点，不额外收费。", "sp": "B"}], [{"id": "s0_12_0", "md": "One o'clock works. Thanks so much.", "text": "One o'clock works. Thanks so much.", "zh": "一点可以。太感谢了。", "sp": "A"}]]}, {"heading": "2. A Problem with the Room", "heading_zh": "2. 房间出了问题", "rows": [[{"id": "s1_0_0", "md": "Hi, this is Mr. Lee in room eighteen twelve. The air conditioning isn't working, and the room is quite warm.", "text": "Hi, this is Mr. Lee in room eighteen twelve. The air conditioning isn't working, and the room is quite warm.", "zh": "你好，我是一八一二房间的 Lee。空调坏了，房间里挺热的。", "sp": "A"}], [{"id": "s1_1_0", "md": "I'm so sorry about that. I'll __send someone up__ right away to take a look.", "text": "I'm so sorry about that. I'll send someone up right away to take a look.", "zh": "非常抱歉。我马上派人上去看看。", "sp": "B"}], [{"id": "s1_2_0", "md": "**Thanks. If it can't be fixed tonight, would it be possible to move to another room?**", "text": "Thanks. If it can't be fixed tonight, would it be possible to move to another room?", "zh": "谢谢。如果今晚修不好，能不能换个房间？", "sp": "A"}], [{"id": "s1_3_0", "md": "Of course. If the ==technician== can't fix it in fifteen minutes, we'll ==upgrade== you to a suite on the same floor.", "text": "Of course. If the technician can't fix it in fifteen minutes, we'll upgrade you to a suite on the same floor.", "zh": "当然可以。如果维修师傅十五分钟内修不好，我们就给您升级到同一层的套房。", "sp": "B"}], [{"id": "s1_4_0", "md": "That would be great. Could you also send up two extra towels?", "text": "That would be great. Could you also send up two extra towels?", "zh": "那太好了。能再送两条毛巾上来吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "No problem. And to __make up for__ the trouble, we'll send up a ==complimentary== fruit plate.", "text": "No problem. And to make up for the trouble, we'll send up a complimentary fruit plate.", "zh": "没问题。为了弥补给您带来的不便，我们会再送一份免费的水果拼盘。", "sp": "B"}], [{"id": "s1_6_0", "md": "That's very kind. **Thanks for sorting this out so quickly.**", "text": "That's very kind. Thanks for sorting this out so quickly.", "zh": "你们太客气了。谢谢这么快就帮我解决。", "sp": "A"}], [{"id": "s1_7_0", "md": "My pleasure, Mr. Lee. Enjoy the rest o const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
