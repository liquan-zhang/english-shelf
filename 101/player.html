<script>
const D = {"id": "101", "type": "dialogue", "title": "Checking In at a Hotel", "meta": "B2 · 约 280 词 · 场景：酒店入住与客房问题", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Front Desk", "name_zh": "前台", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "「你」对房间提了什么要求？前台怎么安排的？", "a": "要高楼层、离电梯远的房间；前台安排在十八楼的城景房。"}, {"q": "押金和延迟退房的规则分别是什么？", "a": "押金每晚一百元，退房时解冻；可以免费延迟退房到下午一点。"}, {"q": "空调坏了，酒店给出的解决方案是什么？", "a": "马上派维修师傅；十五分钟修不好就升级到同层套房，并免费送水果拼盘。"}], "dictation": [{"id": "s0_3_0", "text": "That's right. Is it possible to get a room on a higher floor, away from the elevator?"}, {"id": "s0_10_0", "text": "And could I get a late checkout on Sunday? My flight isn't until the evening."}, {"id": "s1_2_0", "text": "Thanks. If it can't be fixed tonight, would it be possible to move to another room?"}, {"id": "s1_6_0", "text": "That's very kind. Thanks for sorting this out so quickly."}], "shadow": {"speaker": "A", "text": "Hi, this is Mr. Lee in room eighteen twelve. The air conditioning isn't working, and the room is quite warm.", "marked": "Hi, / this is Mr. <b>Lee</b> / in room <b>eighteen twelve</b>. //<br>The <b>air conditioning</b> / <b>isn't</b> working, / and the room is quite <b>warm</b>. //"}, "prompts": [{"q": "入住时发现订的是两张单人床，你想换成一张大床。用 30 秒跟前台沟通，礼貌但明确。", "ref": "Hi, sorry to bother you. I just got to my room, and it has two single beds, but I booked a king room. Is it possible to switch to a king tonight? If none are free, could you move me tomorrow morning? I'm happy to pack my things and wait in the lobby.", "ref_zh": "你好，不好意思打扰一下。我刚进房间，发现是两张单人床，但我订的是大床房。今晚能换成大床吗？如果没有空房了，明天早上帮我换可以吗？我可以先收拾好东西在大堂等。", "id": "ref0"}, {"q": "隔壁房间半夜很吵，你打电话给前台。说清房号、问题，并提出你希望的处理方式。", "ref": "Hi, this is room eighteen twelve. I'm sorry to call so late, but the room next door has been really loud for about an hour, and I have an early flight. Could someone ask them to keep it down? If that doesn't work, I'd like to move to a quieter room.", "ref_zh": "你好，我是一八一二房间。抱歉这么晚打电话，隔壁房间已经吵了快一个小时了，我明天一早还要赶飞机。能不能请人去提醒他们小声一点？如果不管用，我想换一间安静点的房间。", "id": "ref1"}], "words": [{"w": "reservation", "ipa": "/ˌrezərˈveɪʃən/", "zh": "预订", "ex": "I have a reservation for two at seven.", "id": "w0"}, {"w": "incidentals", "ipa": "/ˌɪnsɪˈdentəlz/", "zh": "杂费（酒店预授权用）", "ex": "They put a hold on my card for incidentals.", "id": "w1"}, {"w": "deposit", "ipa": "/dɪˈpɑːzɪt/", "zh": "押金", "ex": "The deposit will be refunded when you return the key.", "id": "w2"}, {"w": "included", "ipa": "/ɪnˈkluːdɪd/", "zh": "包含的", "ex": "Is service charge included in the price?", "id": "w3"}, {"w": "late checkout", "ipa": "/leɪt ˈtʃekaʊt/", "zh": "延迟退房", "ex": "Could I get a late checkout until two?", "id": "w4"}, {"w": "technician", "ipa": "/tekˈnɪʃən/", "zh": "维修技师", "ex": "A technician will come by between nine and twelve.", "id": "w5"}, {"w": "upgrade (v.)", "ipa": "/ˌʌpˈɡreɪd/", "zh": "升级", "ex": "They upgraded us to a sea view room for free.", "tts_w": "upgrade", "id": "w6"}, {"w": "complimentary", "ipa": "/ˌkɑːmpləˈmentəri/", "zh": "免费赠送的", "ex": "The hotel offers complimentary water and coffee in the lobby.", "id": "w7"}, {"w": "make up for", "ipa": "/meɪk ʌp fɔːr/", "zh": "弥补", "ex": "They gave us free drinks to make up for the long wait.", "id": "w8"}], "sections": [{"heading": "1. At the Front Desk", "heading_zh": "1. 在前台", "rows": [[{"id": "s0_0_0", "md": "Good evening, and welcome. Are you checking in?", "text": "Good evening, and welcome. Are you checking in?", "zh": "晚上好，欢迎光临。您是要办入住吗？", "sp": "B"}], [{"id": "s0_1_0", "md": "Yes, I have a __reservation under the name__ Lee.", "text": "Yes, I have a reservation under the name Lee.", "zh": "是的，我用 Lee 这个名字订了房。", "sp": "A"}], [{"id": "s0_2_0", "md": "Let me pull that up. A king room for three nights, checking out on Sunday?", "text": "Let me pull that up. A king room for three nights, checking out on Sunday?", "zh": "我查一下。一间大床房，住三晚，周日退房，对吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**That's right. Is it possible to get a room on a higher floor, away from the elevator?**", "text": "That's right. Is it possible to get a room on a higher floor, away from the elevator?", "zh": "对。有没有可能给我一间高楼层、离电梯远一点的房间？", "sp": "A"}], [{"id": "s0_4_0", "md": "Let me check. Yes, I can put you on the eighteenth floor with a city view.", "text": "Let me check. Yes, I can put you on the eighteenth floor with a city view.", "zh": "我看看。可以，我给您安排在十八楼，城景房。", "sp": "B"}], [{"id": "s0_5_0", "md": "May I have your passport and a credit card for ==incidentals==?", "text": "May I have your passport and a credit card for incidentals?", "zh": "麻烦出示一下护照，再给一张信用卡用于杂费预授权。", "sp": "B"}], [{"id": "s0_6_0", "md": "Sure. How much is the ==deposit==?", "text": "Sure. How much is the deposit?", "zh": "好的。押金是多少？", "sp": "A"}], [{"id": "s0_7_0", "md": "It's one hundred dollars per night, and it's released when you check out.", "text": "It's one hundred dollars per night, and it's released when you check out.", "zh": "每晚一百元，退房时会解冻。", "sp": "B"}], [{"id": "s0_8_0", "md": "Got it. Is breakfast ==included==, and what time does it start?", "text": "Got it. Is breakfast included, and what time does it start?", "zh": "明白。含早餐吗？几点开始？", "sp": "A"}], [{"id": "s0_9_0", "md": "Yes, it's included. It's served from six thirty to ten thirty on the second floor.", "text": "Yes, it's included. It's served from six thirty to ten thirty on the second floor.", "zh": "含的。早餐在二楼，六点半到十点半。", "sp": "B"}], [{"id": "s0_10_0", "md": "And could I __get a late checkout__ on Sunday? My flight isn't until the evening.", "text": "And could I get a late checkout on Sunday? My flight isn't until the evening.", "zh": "另外周日能晚点退房吗？我的航班是晚上的。", "sp": "A"}], [{"id": "s0_11_0", "md": "I can give you until one o'clock __at no extra charge__.", "text": "I can give you until one o'clock at no extra charge.", "zh": "我可以给您延到一点，不额外收费。", "sp": "B"}], [{"id": "s0_12_0", "md": "One o'clock works. Thanks so much.", "text": "One o'clock works. Thanks so much.", "zh": "一点可以。太感谢了。", "sp": "A"}]]}, {"heading": "2. A Problem with the Room", "heading_zh": "2. 房间出了问题", "rows": [[{"id": "s1_0_0", "md": "Hi, this is Mr. Lee in room eighteen twelve. The air conditioning isn't working, and the room is quite warm.", "text": "Hi, this is Mr. Lee in room eighteen twelve. The air conditioning isn't working, and the room is quite warm.", "zh": "你好，我是一八一二房间的 Lee。空调坏了，房间里挺热的。", "sp": "A"}], [{"id": "s1_1_0", "md": "I'm so sorry about that. I'll __send someone up__ right away to take a look.", "text": "I'm so sorry about that. I'll send someone up right away to take a look.", "zh": "非常抱歉。我马上派人上去看看。", "sp": "B"}], [{"id": "s1_2_0", "md": "**Thanks. If it can't be fixed tonight, would it be possible to move to another room?**", "text": "Thanks. If it can't be fixed tonight, would it be possible to move to another room?", "zh": "谢谢。如果今晚修不好，能不能换个房间？", "sp": "A"}], [{"id": "s1_3_0", "md": "Of course. If the ==technician== can't fix it in fifteen minutes, we'll ==upgrade== you to a suite on the same floor.", "text": "Of course. If the technician can't fix it in fifteen minutes, we'll upgrade you to a suite on the same floor.", "zh": "当然可以。如果维修师傅十五分钟内修不好，我们就给您升级到同一层的套房。", "sp": "B"}], [{"id": "s1_4_0", "md": "That would be great. Could you also send up two extra towels?", "text": "That would be great. Could you also send up two extra towels?", "zh": "那太好了。能再送两条毛巾上来吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "No problem. And to __make up for__ the trouble, we'll send up a ==complimentary== fruit plate.", "text": "No problem. And to make up for the trouble, we'll send up a complimentary fruit plate.", "zh": "没问题。为了弥补给您带来的不便，我们会再送一份免费的水果拼盘。", "sp": "B"}], [{"id": "s1_6_0", "md": "That's very kind. **Thanks for sorting this out so quickly.**", "text": "That's very kind. Thanks for sorting this out so quickly.", "zh": "你们太客气了。谢谢这么快就帮我解决。", "sp": "A"}], [{"id": "s1_7_0", "md": "My pleasure, Mr. Lee. Enjoy the rest o const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
