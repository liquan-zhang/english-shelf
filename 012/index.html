<script>
const D = {"id": "012", "title": "When the Demo Breaks in Front of Everyone", "meta": "B2 · 约 270 词 · 场景：演示翻车", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. They Are Watching You, Not the Bug", "heading_zh": "1. 大家在看你，不是在看 bug", "rows": [[{"id": "s0_0_0", "md": "You click the button, and nothing happens.", "text": "You click the button, and nothing happens.", "zh": "你点了按钮，什么反应都没有。", "sp": null}, {"id": "s0_0_1", "md": "You click again, and an error message fills the screen in front of forty people and your skip-level manager.", "text": "You click again, and an error message fills the screen in front of forty people and your skip-level manager.", "zh": "你又点了一下，一个报错弹满了屏幕，当着四十个人和你老板的老板的面。", "sp": null}, {"id": "s0_0_2", "md": "In that moment, it feels like the demo, the project, and maybe your career are all ==collapsing== together.", "text": "In that moment, it feels like the demo, the project, and maybe your career are all collapsing together.", "zh": "那一刻，你感觉 demo、项目，甚至你的职业生涯都在一起崩塌。", "sp": null}], [{"id": "s0_1_0", "md": "They are not.", "text": "They are not.", "zh": "其实并没有。", "sp": null}, {"id": "s0_1_1", "md": "Everyone in that room has seen software break, and most of them have broken it themselves.", "text": "Everyone in that room has seen software break, and most of them have broken it themselves.", "zh": "那屋里每个人都见过软件出问题，大多数人自己也搞崩过。", "sp": null}, {"id": "s0_1_2", "md": "**What people remember is not the failure; it is how calmly you handled it.**", "text": "What people remember is not the failure; it is how calmly you handled it.", "zh": "大家记住的不是故障本身，而是你处理得有多镇定。", "sp": null}], [{"id": "s0_2_0", "md": "A ==frozen== presenter who keeps clicking and apologizing makes the audience ==uncomfortable==.", "text": "A frozen presenter who keeps clicking and apologizing makes the audience uncomfortable.", "zh": "一个僵在台上、不停地点、不停道歉的讲者，会让听众浑身不自在。", "sp": null}, {"id": "s0_2_1", "md": "A presenter who __takes it in stride__ actually builds trust, because it shows how they will behave during a real outage.", "text": "A presenter who takes it in stride actually builds trust, because it shows how they will behave during a real outage.", "zh": "而一个能坦然应对的讲者反而能建立信任，因为这让人看到他在真正的线上故障里会怎么表现。", "sp": null}]]}, {"heading": "2. Name It, Limit It, Move On", "heading_zh": "2. 点明、限时、继续", "rows": [[{"id": "s1_0_0", "md": "First, name what happened in one light sentence.", "text": "First, name what happened in one light sentence.", "zh": "第一，用一句轻松的话点明发生了什么。", "sp": null}, {"id": "s1_0_1", "md": "\"Well, that's the live part of a live demo.\"", "text": "\"Well, that's the live part of a live demo.\"", "zh": "「好吧，这就是现场演示的『现场』部分。」", "sp": null}, {"id": "s1_0_2", "md": "A small joke ==releases== the tension, for you and for the room.", "text": "A small joke releases the tension, for you and for the room.", "zh": "一个小玩笑能释放紧张情绪，对你和对全场都是。", "sp": null}], [{"id": "s1_1_0", "md": "Second, give yourself a strict limit.", "text": "Second, give yourself a strict limit.", "zh": "第二，给自己定一个严格的时限。", "sp": null}, {"id": "s1_1_1", "md": "**Try one quick fix, and if it does not work in thirty seconds, switch to plan B.**", "text": "Try one quick fix, and if it does not work in thirty seconds, switch to plan B.", "zh": "试一次快速修复，三十秒内不行就切到 B 计划。", "sp": null}, {"id": "s1_1_2", "md": "Debugging in front of an audience almost never ends well, and every extra minute __drains the energy__ out of the room.", "text": "Debugging in front of an audience almost never ends well, and every extra minute drains the energy out of the room.", "zh": "当着观众的面 debug 几乎从来没有好结果，多耗一分钟，全场的劲头就泄掉一分。", "sp": null}], [{"id": "s1_2_0", "md": "That means you need a plan B before you start.", "text": "That means you need a plan B before you start.", "zh": "这意味着开始之前你就得准备好 B 计划。", "sp": null}, {"id": "s1_2_1", "md": "Record a short video of the ==flow==, or keep screenshots of the key moments in a backup slide.", "text": "Record a short video of the flow, or keep screenshots of the key moments in a backup slide.", "zh": "录一段流程的短视频，或者把关键画面截图放在备用的幻灯片里。", "sp": null}, {"id": "s1_2_2", "md": "\"Let me show you a recording from this morning, and I'll walk you through it.\"", "text": "\"Let me show you a recording from this morning, and I'll walk you through it.\"", "zh": "「我给大家放一段今天早上录的视频，我边放边讲。」", "sp": null}, {"id": "s1_2_3", "md": "Most people will not even mind, because the story you are telling is still the same.", "text": "Most people will not even mind, because the story you are telling is still the same.", "zh": "大多数人根本不会介意，因为你讲的故事还是同一个。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __follow up afterward__.", "text": "Finally, follow up afterward.", "zh": "最后，会后跟进。", "sp": null}, {"id": "s1_3_1", "md": "Send a short note explaining the cause and, if possible, a working link.", "text": "Send a short note explaining the cause and, if possible, a working link.", "zh": "发一条简短的说明，讲清原因，可能的话附上一个能用的链接。", "sp": null}, {"id": "s1_3_2", "md": "That message often leaves a better ==impression== than a perfect demo would have.", "text": "That message often leaves a better impression than a perfect demo would have.", "zh": "这条消息留下的印象，往往比一次完美的 demo 还要好。", "sp": null}]]}], "gist": [{"q": "作者认为演示翻车时观众真正在看什么？", "a": "看你怎么应对，而不是看 bug 本身；冷静处理反而能建立信任。"}, {"q": "翻车后的三步是什么？", "a": "用一句轻松的话点明；给自己设限，三十秒修不好就切换备用方案；会后发说明和可用链接跟进。"}, {"q": "作者建议提前准备什么备用方案？", "a": "录一段流程视频，或在备用幻灯片里放关键环节的截图。"}], "dictation": [{"id": "s0_1_2", "text": "What people remember is not the failure; it is how calmly you handled it."}, {"id": "s1_1_1", "text": "Try one quick fix, and if it does not work in thirty seconds, switch to plan B."}, {"id": "s1_2_0", "text": "That means you need a plan B before you start."}, {"id": "s0_1_1", "text": "Everyone in that room has seen software break, and most of them have broken it themselves."}], "shadow": {"text": "Second, give yourself a strict limit. Try one quick fix, and if it does not work in thirty seconds, switch to plan B.", "marked": "<b>Second</b>, / give yourself a <b>strict</b> limit. //<br>Try <b>one</b> quick fix, / and if it does <b>not</b> work / in <b>thirty</b> seconds, / switch to plan <b>B</b>. //"}, "prompts": [{"q": "你在部门大会上演示新搜索功能，点了查询后页面一直转圈。用 30 秒稳住场面并切换到备用录屏。", "ref": "Well, that's the live part of a live demo. Let me try one refresh. Okay, it looks like the test server is having a bad day, so I won't make you watch me debug. I recorded the same flow this morning, so let me play that instead and talk you through it. The key moment is coming up in about ten seconds, right when the results load.", "ref_zh": "好吧，这就是现场演示的「现场」部分。我刷新一下试试。好，看起来测试服务器今天状态不太好，我就不让大家看我 debug 了。今天早上我录了同样的流程，我放那段给大家，边放边讲。关键的地方大概十秒后出现，就在结果加载出来的时候。", "id": "ref0"}, {"q": "演示翻车后的当天下午，你给参会者发一条跟进消息。用 30 秒口述这条消息的内容。", "ref": "Hi everyone, thanks again for sitting through this morning's demo, including the unplanned part. The issue was an expired token on our test server, not the search feature itself, and it's fixed now. Here's a link to the working version, so you can try it yourself. If you have questions or want a quick live walkthrough with your team, just reply here and I'll set something up.", "ref_zh": "大家好，再次感谢各位看完今天上午的 demo，包括那段计划外的插曲。问题出在测试服务器上的一个 token 过期了，不是搜索功能本身的问题，现在已经修好了。这是能正常用的版本链接，大家可以自己试试。如果有问题，或者想给你们团队现场快速过一遍，直接在这里回复，我来约时间。", "id": "ref1"}], "words": [{"w": "collapse", "ipa": "/kəˈlæps/", "zh": "崩塌、垮掉", "ex": "The whole service collapsed when the cache cluster went down.", "id": "w0"}, {"w": "frozen", "ipa": "/ˈfroʊzən/", "zh": "僵住的、卡住的", "ex": "The screen froze, and so did I.", "id": "w1"}, {"w": "uncomfortable", "ipa": "/ʌnˈkʌmftərbəl/", "zh": "不自在的", "ex": "It was uncomfortable to admit the bug in front of the client, but necessary.", "id": "w2"}, {"w": "release (v.)", "ipa": "/rɪˈliːs/", "zh": "释放、缓解", "ex": "A quick laugh released some of the pressure on the incident call.", "tts_w": "release", "id": "w3"}, {"w": "flow (n.)", "ipa": "/floʊ/", "zh": "流程", "ex": "The checkout flow has too man const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
