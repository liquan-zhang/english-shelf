<script>
const D = {"id": "005", "title": "When You Are Put on the Spot", "meta": "B2 · 约 270 词 · 场景：被突然点名", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Three-Second Panic", "heading_zh": "1. 三秒钟的慌乱", "rows": [[{"id": "s0_0_0", "md": "You are half listening in a planning call when a director suddenly says, \"What do you think about the timeline?\"", "text": "You are half listening in a planning call when a director suddenly says, \"What do you think about the timeline?\"", "zh": "你在一个规划会上半听不听，一位总监突然问：「你觉得这个时间线怎么样？」", "sp": null}, {"id": "s0_0_1", "md": "Your heart speeds up, your mind goes blank, and you start talking before you know what you want to say.", "text": "Your heart speeds up, your mind goes blank, and you start talking before you know what you want to say.", "zh": "你心跳加速，脑子一片空白，还没想好要说什么就开口了。", "sp": null}, {"id": "s0_0_2", "md": "Thirty seconds later, you have ==rambled== through three ideas and finished none of them.", "text": "Thirty seconds later, you have rambled through three ideas and finished none of them.", "zh": "三十秒后，你东拉西扯说了三个点，一个都没讲完。", "sp": null}], [{"id": "s0_1_0", "md": "This reaction is normal, especially in a second language.", "text": "This reaction is normal, especially in a second language.", "zh": "这种反应很正常，用第二语言的时候尤其如此。", "sp": null}, {"id": "s0_1_1", "md": "Your brain is doing two jobs at once, finding the answer and finding the words.", "text": "Your brain is doing two jobs at once, finding the answer and finding the words.", "zh": "你的大脑在同时干两件事：想答案，还要找词。", "sp": null}, {"id": "s0_1_2", "md": "**The mistake is not being slow; the mistake is filling the silence with noise.**", "text": "The mistake is not being slow; the mistake is filling the silence with noise.", "zh": "错不在反应慢，错在用噪音去填满沉默。", "sp": null}], [{"id": "s0_2_0", "md": "Experienced speakers are not faster thinkers.", "text": "Experienced speakers are not faster thinkers.", "zh": "有经验的人并不是想得更快。", "sp": null}, {"id": "s0_2_1", "md": "They simply have a few ==stock== phrases that __buy them time__ while sounding calm.", "text": "They simply have a few stock phrases that buy them time while sounding calm.", "zh": "他们只是手里有几句现成的话，既能争取时间，听起来又很从容。", "sp": null}, {"id": "s0_2_2", "md": "Those phrases let the ==panic== pass before the real answer begins.", "text": "Those phrases let the panic pass before the real answer begins.", "zh": "这些话能让慌乱先过去，再开始真正回答。", "sp": null}]]}, {"heading": "2. Buy Time, Then Give a Shape", "heading_zh": "2. 先争取时间，再给出框架", "rows": [[{"id": "s1_0_0", "md": "Start by ==clarifying== the question, even if you understood it.", "text": "Start by clarifying the question, even if you understood it.", "zh": "先澄清一下问题，哪怕你其实听懂了。", "sp": null}, {"id": "s1_0_1", "md": "\"Just to make sure, are you asking about the beta date or the full launch?\"", "text": "\"Just to make sure, are you asking about the beta date or the full launch?\"", "zh": "「我确认一下，你问的是 beta 的时间，还是全量上线？」", "sp": null}, {"id": "s1_0_2", "md": "This gives you five seconds and often makes the question easier to answer.", "text": "This gives you five seconds and often makes the question easier to answer.", "zh": "这能给你争取五秒钟，而且问题往往也会变得更好回答。", "sp": null}], [{"id": "s1_1_0", "md": "Next, tell people the shape of your answer before you fill it in.", "text": "Next, tell people the shape of your answer before you fill it in.", "zh": "接着，先告诉大家你回答的框架，再往里填内容。", "sp": null}, {"id": "s1_1_1", "md": "\"I'd say two things.\"", "text": "\"I'd say two things.\"", "zh": "「我说两点。」", "sp": null}, {"id": "s1_1_2", "md": "Now you only need to find two points, and listeners can __follow along__ even if your wording is rough.", "text": "Now you only need to find two points, and listeners can follow along even if your wording is rough.", "zh": "这样你只需要想出两个点，就算措辞粗糙，听的人也跟得上。", "sp": null}], [{"id": "s1_2_0", "md": "If you really do not know, split what you know from what you need to check.", "text": "If you really do not know, split what you know from what you need to check.", "zh": "如果你真的不知道，就把你知道的和需要确认的分开说。", "sp": null}, {"id": "s1_2_1", "md": "\"From what I've seen, the backend is on track, but I need to confirm the testing ==estimate== with QA.\"", "text": "\"From what I've seen, the backend is on track, but I need to confirm the testing estimate with QA.\"", "zh": "「从我看到的情况来说，后端进度正常，但测试的预估我得跟 QA 确认一下。」", "sp": null}, {"id": "s1_2_2", "md": "**A partial answer with a clear next step sounds more ==competent== than a complete guess.**", "text": "A partial answer with a clear next step sounds more competent than a complete guess.", "zh": "一个不完整但带着明确下一步的回答，比一个完整的瞎猜显得更专业。", "sp": null}], [{"id": "s1_3_0", "md": "Then __follow up in writing__ the same day.", "text": "Then follow up in writing the same day.", "zh": "然后当天就用文字跟进。", "sp": null}, {"id": "s1_3_1", "md": "That message turns an awkward moment into proof that you are ==reliable==.", "text": "That message turns an awkward moment into proof that you are reliable.", "zh": "这条消息能把一个尴尬的时刻，变成你靠谱的证明。", "sp": null}]]}], "gist": [{"q": "被突然点名时，作者说真正的错误是什么？", "a": "不是反应慢，而是用没想清楚的话填满沉默，结果东拉西扯、什么都没说完。"}, {"q": "作者给了哪几个争取时间、稳住的方法？", "a": "先澄清问题；先说回答的结构（比如“我说两点”）；不确定时区分已知和待确认；会后当天书面跟进。"}, {"q": "为什么“部分答案加明确下一步”比完整的猜测更好？", "a": "它显得更专业可靠，而猜测一旦错了会伤可信度。"}], "dictation": [{"id": "s0_1_2", "text": "The mistake is not being slow; the mistake is filling the silence with noise."}, {"id": "s1_2_2", "text": "A partial answer with a clear next step sounds more competent than a complete guess."}, {"id": "s1_1_0", "text": "Next, tell people the shape of your answer before you fill it in."}, {"id": "s0_1_1", "text": "Your brain is doing two jobs at once, finding the answer and finding the words."}], "shadow": {"text": "Next, tell people the shape of your answer before you fill it in. \"I'd say two things.\" Now you only need to find two points, and listeners can follow along even if your wording is rough.", "marked": "<b>Next</b>, / tell people the <b>shape</b> of your answer / <b>before</b> you fill it in. //<br>\"I'd say <b>two</b> things.\" //<br>Now you only need to find <b>two</b> points, / and listeners can <b>follow along</b> / even if your wording is <b>rough</b>. //"}, "prompts": [{"q": "季度规划会上，VP 突然问你：“你们组的支付重构能不能提前两周？”你还没准备。用 30 秒先争取时间，再给出有结构的回答。", "ref": "Good question. Just to make sure, do you mean the full migration or the first phase? For the first phase, I'd say two things. The code changes could probably move up a week. But the real constraint is testing with the bank partners, and I don't control their schedule. Let me check with them today and send you a realistic date by tomorrow morning.", "ref_zh": "好问题。我确认一下，你指的是整个迁移，还是第一期？第一期的话，我说两点。代码改动大概可以提前一周。但真正的卡点是跟银行合作方的联调测试，他们的排期不在我手里。我今天就去跟他们确认，明早之前给你一个靠谱的日期。", "id": "ref0"}, {"q": "跨部门会议上，有人突然问你某个线上指标为什么下降，你只知道一部分原因。用 30 秒区分已知和待确认的内容，并承诺跟进。", "ref": "Let me split this into what I know and what I don't. What I know is that the drop started on Tuesday, right after the new onboarding flow went out, so that's my main suspect. What I haven't confirmed is whether it's all regions or just one. I'll dig into the data with our analyst this afternoon and post an update in the channel before the end of the day.", "ref_zh": "我把这个分成我知道的和不知道的。我知道的是，下滑是从周二开始的，正好在新的注册引导流程上线之后，所以那是我的头号怀疑对象。我还没确认的是，是所有地区都掉了，还是只有一个地区。今天下午我跟分析师一起深挖一下数据，下班前在群里同步进展。", "id": "ref1"}], "words": [{"w": "ramble", "ipa": "/ˈræmbəl/", "zh": "东拉西扯、漫无边际地说", "ex": "Sorry, I'm rambling. The short answer is no, we're not ready.", "id": "w0"}, {"w": "stock (adj.)", "ipa": "/stɑːk/", "zh": "常备的、现成的", "ex": "\"Let me get back to you\" is a stock phrase, but it works.", "tts_w": "stock", "id": "w1"}, {"w": "panic", "ipa": "/ˈpænɪk/", "zh": "恐慌、慌乱", "ex": "There's no need to panic; the rollback is already running.", "id": "w2"}, {"w": "clarify", "ipa": "/ˈklærəˌfaɪ/", "zh": "澄清、说明", "ex": "Could you clarify whether the deadline includes QA?", "id": "w3"}, {"w": "estimate (n.)", "ipa": "/ˈestɪmət/", "zh": "估算", "ex": "Our first estimate was two spri 42], [92.455, 92.929], [92.995, 93.192], [93.205, 93.626], [93.639, 93.784], [93.797, 93.942], [93.955, 94.087], [94.1, 94.718]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
