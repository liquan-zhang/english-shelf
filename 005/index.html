<script>
const D = {"id": "005", "title": "When You Are Put on the Spot", "meta": "B2 · 约 270 词 · 场景：被突然点名", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Three-Second Panic", "heading_zh": "1. 三秒钟的慌乱", "rows": [[{"id": "s0_0_0", "md": "You are half listening in a planning call when a director suddenly says, \"What do you think about the timeline?\"", "text": "You are half listening in a planning call when a director suddenly says, \"What do you think about the timeline?\"", "zh": "你在一个规划会上半听不听，一位总监突然问：「你觉得这个时间线怎么样？」", "sp": null}, {"id": "s0_0_1", "md": "Your heart speeds up, your mind goes blank, and you start talking before you know what you want to say.", "text": "Your heart speeds up, your mind goes blank, and you start talking before you know what you want to say.", "zh": "你心跳加速，脑子一片空白，还没想好要说什么就开口了。", "sp": null}, {"id": "s0_0_2", "md": "Thirty seconds later, you have ==rambled== through three ideas and finished none of them.", "text": "Thirty seconds later, you have rambled through three ideas and finished none of them.", "zh": "三十秒后，你东拉西扯说了三个点，一个都没讲完。", "sp": null}], [{"id": "s0_1_0", "md": "This reaction is normal, especially in a second language.", "text": "This reaction is normal, especially in a second language.", "zh": "这种反应很正常，用第二语言的时候尤其如此。", "sp": null}, {"id": "s0_1_1", "md": "Your brain is doing two jobs at once, finding the answer and finding the words.", "text": "Your brain is doing two jobs at once, finding the answer and finding the words.", "zh": "你的大脑在同时干两件事：想答案，还要找词。", "sp": null}, {"id": "s0_1_2", "md": "**The mistake is not being slow; the mistake is filling the silence with noise.**", "text": "The mistake is not being slow; the mistake is filling the silence with noise.", "zh": "错不在反应慢，错在用噪音去填满沉默。", "sp": null}], [{"id": "s0_2_0", "md": "Experienced speakers are not faster thinkers.", "text": "Experienced speakers are not faster thinkers.", "zh": "有经验的人并不是想得更快。", "sp": null}, {"id": "s0_2_1", "md": "They simply have a few ==stock== phrases that __buy them time__ while sounding calm.", "text": "They simply have a few stock phrases that buy them time while sounding calm.", "zh": "他们只是手里有几句现成的话，既能争取时间，听起来又很从容。", "sp": null}, {"id": "s0_2_2", "md": "Those phrases let the ==panic== pass before the real answer begins.", "text": "Those phrases let the panic pass before the real answer begins.", "zh": "这些话能让慌乱先过去，再开始真正回答。", "sp": null}]]}, {"heading": "2. Buy Time, Then Give a Shape", "heading_zh": "2. 先争取时间，再给出框架", "rows": [[{"id": "s1_0_0", "md": "Start by ==clarifying== the question, even if you understood it.", "text": "Start by clarifying the question, even if you understood it.", "zh": "先澄清一下问题，哪怕你其实听懂了。", "sp": null}, {"id": "s1_0_1", "md": "\"Just to make sure, are you asking about the beta date or the full launch?\"", "text": "\"Just to make sure, are you asking about the beta date or the full launch?\"", "zh": "「我确认一下，你问的是 beta 的时间，还是全量上线？」", "sp": null}, {"id": "s1_0_2", "md": "This gives you five seconds and often makes the question easier to answer.", "text": "This gives you five seconds and often makes the question easier to answer.", "zh": "这能给你争取五秒钟，而且问题往往也会变得更好回答。", "sp": null}], [{"id": "s1_1_0", "md": "Next, tell people the shape of your answer before you fill it in.", "text": "Next, tell people the shape of your answer before you fill it in.", "zh": "接着，先告诉大家你回答的框架，再往里填内容。", "sp": null}, {"id": "s1_1_1", "md": "\"I'd say two things.\"", "text": "\"I'd say two things.\"", "zh": "「我说两点。」", "sp": null}, {"id": "s1_1_2", "md": "Now you only need to find two points, and listeners can __follow along__ even if your wording is rough.", "text": "Now you only need to find two points, and listeners can follow along even if your wording is rough.", "zh": "这样你只需要想出两个点，就算措辞粗糙，听的人也跟得上。", "sp": null}], [{"id": "s1_2_0", "md": "If you really do not know, split what you know from what you need to check.", "text": "If you really do not know, split what you know from what you need to check.", "zh": "如果你真的不知道，就把你知道的和需要确认的分开说。", "sp": null}, {"id": "s1_2_1", "md": "\"From what I've seen, the backend is on track, but I need to confirm the testing ==estimate== with QA.\"", "text": "\"From what I've seen, the backend is on track, but I need to confirm the testing estimate with QA.\"", "zh": "「从我看到的情况来说，后端进度正常，但测试的预估我得跟 QA 确认一下。」", "sp": null}, {"id": "s1_2_2", "md": "**A partial answer with a clear next step sounds more ==competent== than a complete guess.**", "text": "A partial answer with a clear next step sounds more competent than a complete guess.", "zh": "一个不完整但带着明确下一步的回答，比一个完整的瞎猜显得更专业。", "sp": null}], [{"id": "s1_3_0", "md": "Then __follow up in writing__ the same day.", "text": "Then follow up in writing the same day.", "zh": "然后当天就用文字跟进。", "sp": null}, {"id": "s1_3_1", "md": "That message turns an awkward moment into proof that you are ==reliable==.", "text": "That message turns an awkward moment into proof that you are reliable.", "zh": "这条消息能把一个尴尬的时刻，变成你靠谱的证明。", "sp": null}]]}], "gist": [{"q": "被突然点名时，作者说真正的错误是什么？", "a": "不是反应慢，而是用没想清楚的话填满沉默，结果东拉西扯、什么都没说完。"}, {"q": "作者给了哪几个争取时间、稳住的方法？", "a": "先澄清问题；先说回答的结构（比如“我说两点”）；不确定时区分已知和待确认；会后当天书面跟进。"}, {"q": "为什么“部分答案加明确下一步”比完整的猜测更好？", "a": "它显得更专业可靠，而猜测一旦错了会伤可信度。"}], "dictation": [{"id": "s0_1_2", "text": "The mistake is not being slow; the mistake is filling the silence with noise."}, {"id": "s1_2_2", "text": "A partial answer with a clear next step sounds more competent than a complete guess."}, {"id": "s1_1_0", "text": "Next, tell people the shape of your answer before you fill it in."}, {"id": "s0_1_1", "text": "Your brain is doing two jobs at once, finding the answer and finding the words."}], "shadow": {"text": "Next, tell people the shape of your answer before you fill it in. \"I'd say two things.\" Now you only need to find two points, and listeners can follow along even if your wording is rough.", "marked": "<b>Next</b>, / tell people the <b>shape</b> of your answer / <b>before</b> you fill it in. //<br>\"I'd say <b>two</b> things.\" //<br>Now you only need to find <b>two</b> points, / and listeners can <b>follow along</b> / even if your wording is <b>rough</b>. //"}, "prompts": [{"q": "季度规划会上，VP 突然问你：“你们组的支付重构能不能提前两周？”你还没准备。用 30 秒先争取时间，再给出有结构的回答。", "ref": "Good question. Just to make sure, do you mean the full migration or the first phase? For the first phase, I'd say two things. The code changes could probably move up a week. But the real constraint is testing with the bank partners, and I don't control their schedule. Let me check with them today and send you a realistic date by tomorrow morning.", "ref_zh": "好问题。我确认一下，你指的是整个迁移，还是第一期？第一期的话，我说两点。代码改动大概可以提前一周。但真正的卡点是跟银行合作方的联调测试，他们的排期不在我手里。我今天就去跟他们确认，明早之前给你一个靠谱的日期。", "id": "ref0"}, {"q": "跨部门会议上，有人突然问你某个线上指标为什么下降，你只知道一部分原因。用 30 秒区分已知和待确认的内容，并承诺跟进。", "ref": "Let me split this into what I know and what I don't. What I know is that the drop started on Tuesday, right after the new onboarding flow went out, so that's my main suspect. What I haven't confirmed is whether it's all regions or just one. I'll dig into the data with our analyst this afternoon and post an update in the channel before the end of the day.", "ref_zh": "我把这个分成我知道的和不知道的。我知道的是，下滑是从周二开始的，正好在新的注册引导流程上线之后，所以那是我的头号怀疑对象。我还没确认的是，是所有地区都掉了，还是只有一个地区。今天下午我跟分析师一起深挖一下数据，下班前在群里同步进展。", "id": "ref1"}], "words": [{"w": "ramble", "ipa": "/ˈræmbəl/", "zh": "东拉西扯、漫无边际地说", "ex": "Sorry, I'm rambling. The short answer is no, we're not ready.", "id": "w0"}, {"w": "stock (adj.)", "ipa": "/stɑːk/", "zh": "常备的、现成的", "ex": "\"Let me get back to you\" is a stock phrase, but it works.", "tts_w": "stock", "id": "w1"}, {"w": "panic", "ipa": "/ˈpænɪk/", "zh": "恐慌、慌乱", "ex": "There's no need to panic; the rollback is already running.", "id": "w2"}, {"w": "clarify", "ipa": "/ˈklærəˌfaɪ/", "zh": "澄清、说明", "ex": "Could you clarify whether the deadline includes QA?", "id": "w3"}, {"w": "estimate (n.)", "ipa": "/ˈestɪmət/", "zh": "估算", "ex": "Our first estimate was two spri const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
