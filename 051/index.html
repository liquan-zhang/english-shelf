<script>
const D = {"id": "051", "title": "Giving Feedback That People Can Use", "meta": "B2 · 约 280 词 · 场景：给下属反馈", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Feedback Nobody Can Act On", "heading_zh": "1. 没法照着做的反馈", "rows": [[{"id": "s0_0_0", "md": "\"You need to be more proactive.\"", "text": "\"You need to be more proactive.\"", "zh": "「你需要更主动一点。」", "sp": null}, {"id": "s0_0_1", "md": "Most of us have heard a sentence like this in a review, and most of us had no idea what to do with it.", "text": "Most of us have heard a sentence like this in a review, and most of us had no idea what to do with it.", "zh": "我们大多数人都在绩效评估里听过类似的话，而且大多数人都不知道该怎么办。", "sp": null}, {"id": "s0_0_2", "md": "Proactive about what? In which meetings? Compared to whom?", "text": "Proactive about what? In which meetings? Compared to whom?", "zh": "在哪方面主动？在哪些会上？跟谁比？", "sp": null}], [{"id": "s0_1_0", "md": "Vague feedback is not kind; it is just ==incomplete==.", "text": "Vague feedback is not kind; it is just incomplete.", "zh": "模糊的反馈不是善意；它只是不完整。", "sp": null}, {"id": "s0_1_1", "md": "The person walks away worried, guesses what you meant, and often changes the wrong thing.", "text": "The person walks away worried, guesses what you meant, and often changes the wrong thing.", "zh": "对方带着焦虑离开，猜你到底什么意思，结果常常改错了地方。", "sp": null}, {"id": "s0_1_2", "md": "**If the person cannot picture the next step, you have given an opinion, not feedback.**", "text": "If the person cannot picture the next step, you have given an opinion, not feedback.", "zh": "如果对方想象不出下一步该怎么做，你给的就是一个看法，而不是反馈。", "sp": null}], [{"id": "s0_2_0", "md": "Timing matters just as much.", "text": "Timing matters just as much.", "zh": "时机同样重要。", "sp": null}, {"id": "s0_2_1", "md": "Feedback about a design review from two months ago feels like a ==punishment==, not help.", "text": "Feedback about a design review from two months ago feels like a punishment, not help.", "zh": "针对两个月前一次设计评审的反馈，感觉像是惩罚，而不是帮助。", "sp": null}, {"id": "s0_2_2", "md": "Details have faded, and the person cannot ==connect== your comment to a real moment anymore.", "text": "Details have faded, and the person cannot connect your comment to a real moment anymore.", "zh": "细节已经模糊了，对方已经没法把你的评论和一个真实的场景对应起来。", "sp": null}, {"id": "s0_2_3", "md": "By then, the moment to learn from it has already passed.", "text": "By then, the moment to learn from it has already passed.", "zh": "到那时，从中学习的时机早就过去了。", "sp": null}]]}, {"heading": "2. Make It Specific, Make It Soon", "heading_zh": "2. 说具体，说及时", "rows": [[{"id": "s1_0_0", "md": "A simple structure helps: the situation, the behavior, and the ==impact==.", "text": "A simple structure helps: the situation, the behavior, and the impact.", "zh": "一个简单的结构很好用：情境、行为、影响。", "sp": null}, {"id": "s1_0_1", "md": "\"In yesterday's incident call, you went quiet for ten minutes after finding the bad config. The team kept debugging the wrong service.\"", "text": "\"In yesterday's incident call, you went quiet for ten minutes after finding the bad config. The team kept debugging the wrong service.\"", "zh": "「昨天故障电话会上，你发现那个错误配置之后沉默了十分钟。团队一直在排查错误的服务。」", "sp": null}, {"id": "s1_0_2", "md": "There are no labels and no guessing, just one ==observable== moment and its result.", "text": "There are no labels and no guessing, just one observable moment and its result.", "zh": "没有贴标签，不用猜，只有一个看得见的瞬间和它的后果。", "sp": null}], [{"id": "s1_1_0", "md": "Then add a forward-looking request.", "text": "Then add a forward-looking request.", "zh": "然后，加一个面向未来的请求。", "sp": null}, {"id": "s1_1_1", "md": "\"Next time, say what you found right away, even if you're only half sure.\"", "text": "\"Next time, say what you found right away, even if you're only half sure.\"", "zh": "「下次，发现了什么马上说出来，哪怕你只有五成把握。」", "sp": null}, {"id": "s1_1_2", "md": "It is concrete, it is small, and it is easy to try.", "text": "It is concrete, it is small, and it is easy to try.", "zh": "它很具体，很小，也很容易尝试。", "sp": null}, {"id": "s1_1_3", "md": "Now the person knows exactly what better looks like.", "text": "Now the person knows exactly what better looks like.", "zh": "这样对方就清楚地知道「做得更好」是什么样子了。", "sp": null}], [{"id": "s1_2_0", "md": "Try to give feedback within a day or two.", "text": "Try to give feedback within a day or two.", "zh": "尽量在一两天之内给反馈。", "sp": null}, {"id": "s1_2_1", "md": "Small, frequent comments __feel like coaching__; rare, heavy ones feel like ==judgment==.", "text": "Small, frequent comments feel like coaching; rare, heavy ones feel like judgment.", "zh": "小而频繁的意见像是辅导；少而沉重的意见像是审判。", "sp": null}, {"id": "s1_2_2", "md": "**The sooner you say it, the smaller it feels.**", "text": "The sooner you say it, the smaller it feels.", "zh": "说得越早，事情显得越小。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __check for understanding__ instead of assuming it.", "text": "Finally, check for understanding instead of assuming it.", "zh": "最后，确认对方理解了，而不是想当然。", "sp": null}, {"id": "s1_3_1", "md": "Ask, \"How does that land for you?\" and listen to the answer.", "text": "Ask, \"How does that land for you?\" and listen to the answer.", "zh": "问一句「你听了有什么想法？」，然后认真听回答。", "sp": null}, {"id": "s1_3_2", "md": "Sometimes you will learn that the person had context you were missing, and that is ==worth knowing== too.", "text": "Sometimes you will learn that the person had context you were missing, and that is worth knowing too.", "zh": "有时候你会发现对方掌握着你不知道的背景，这同样值得知道。", "sp": null}]]}], "gist": [{"q": "为什么 \"You need to be more proactive\" 这样的反馈没用？", "a": "太模糊，对方不知道具体指什么、下一步该做什么，只能猜，常常改错方向；这只是意见不是反馈。"}, {"q": "作者推荐的反馈结构是什么？", "a": "情境、行为、影响，再加一个面向未来的具体请求，比如「下次一发现问题就马上说出来」。"}, {"q": "关于反馈的时机，作者怎么说？", "a": "一两天内给；小而频繁的反馈像辅导，少而重的像审判；越早说越显得小。最后要确认对方的理解。"}], "dictation": [{"id": "s0_1_2", "text": "If the person cannot picture the next step, you have given an opinion, not feedback."}, {"id": "s0_2_1", "text": "Feedback about a design review from two months ago feels like a punishment, not help."}, {"id": "s1_1_3", "text": "Now the person knows exactly what better looks like."}, {"id": "s1_2_2", "text": "The sooner you say it, the smaller it feels."}], "shadow": {"text": "Try to give feedback within a day or two. Small, frequent comments feel like coaching; rare, heavy ones feel like judgment. The sooner you say it, the smaller it feels.", "marked": "Try to give feedback / within a <b>day</b> or <b>two</b>. //<br><b>Small</b>, <b>frequent</b> comments / feel like <b>coaching</b>; / <b>rare</b>, <b>heavy</b> ones / feel like <b>judgment</b>. //<br>The <b>sooner</b> you say it, / the <b>smaller</b> it feels. //"}, "prompts": [{"q": "下属在昨天的方案评审上，被问到性能数据时一直绕开话题，导致评审没结论。用 30 秒给他具体的反馈：情境、行为、影响和下次的做法。", "ref": "Can I give you some quick feedback on yesterday's review? When Sam asked about the latency numbers, you moved on to the architecture slide twice without answering. Because of that, the reviewers didn't feel ready to approve, and we have to meet again next week. Next time, if you don't have the number, just say so and promise a follow-up. That builds more trust than avoiding it. How does that sound?", "ref_zh": "能就昨天的评审给你一点快速反馈吗？Sam 问到延迟数据的时候，你两次都没回答就直接翻到了架构那页。正因为这样，评审的人觉得还没法批，我们下周还得再开一次。下次如果手头没有数据，直接说没有，然后承诺会后跟进就好。这比回避更能建立信任。你觉得呢？", "id": "ref0"}, {"q": "一位工程师这周主动写了上线检查清单，避免了一次回滚。用 30 秒给他具体的正向反馈，并说明你希望他继续做什么。", "ref": "I want to mention the launch checklist you wrote on Tuesday. Because you added the step to check the feature flag defaults, we caught the wrong setting before the rollout, and we didn't need a rollback. That probably saved us a stressful evening. I'd love for you to keep doing that, and maybe share the checklist with the other two teams on Friday.", "ref_zh": "我想提一下你周二写的上线 checklist。因为你加了检查 feature flag 默认值那一步，我们在灰度之前就发现了错误的配置，没有回滚。这大概帮我们省掉了一个焦头烂额的晚上。希望你继续保持，也可以考虑周五把这份 checklist 分享给另外两个团队。", "id": "ref1"}], "words": [{"w": "incomplete", "ipa": "/ˌɪnkəmˈpliːt/", "zh": "不完整的", "ex": "The incident report is incomplete without the timeline.", "id": "w0"}, {"w": "punishment", "ipa": " const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

}

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
