<script>
const D = {"id": "042", "title": "Translating Your Request into Their Interests", "meta": "B2 · 约 280 词 · 场景：跨团队推动", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Your Reasons Are Not Their Reasons", "heading_zh": "1. 你的理由不是他们的理由", "rows": [[{"id": "s0_0_0", "md": "Imagine you want the operations team to adopt a new logging format.", "text": "Imagine you want the operations team to adopt a new logging format.", "zh": "假设你想让运维团队采用一种新的日志格式。", "sp": null}, {"id": "s0_0_1", "md": "You explain that it will make your dashboards cleaner and your debugging faster.", "text": "You explain that it will make your dashboards cleaner and your debugging faster.", "zh": "你解释说，这能让你们的 dashboard 更清爽，排查问题更快。", "sp": null}, {"id": "s0_0_2", "md": "They nod politely, and nothing happens for two months.", "text": "They nod politely, and nothing happens for two months.", "zh": "他们客气地点点头，然后两个月过去了，什么都没发生。", "sp": null}], [{"id": "s0_1_0", "md": "The problem is not your logic.", "text": "The problem is not your logic.", "zh": "问题不在你的逻辑。", "sp": null}, {"id": "s0_1_1", "md": "The problem is that every reason you gave was about your team.", "text": "The problem is that every reason you gave was about your team.", "zh": "问题在于你给的每一条理由都是关于你自己团队的。", "sp": null}, {"id": "s0_1_2", "md": "From their side, the request means extra work, a new tool to learn, and a ==marginal== benefit for someone else.", "text": "From their side, the request means extra work, a new tool to learn, and a marginal benefit for someone else.", "zh": "站在他们那边，这个请求意味着额外的工作量、一个要学的新工具，以及给别人带来的一点点好处。", "sp": null}, {"id": "s0_1_3", "md": "**Nobody changes their priorities because your argument is correct.**", "text": "Nobody changes their priorities because your argument is correct.", "zh": "没有人会因为你的论证正确就调整自己的优先级。", "sp": null}], [{"id": "s0_2_0", "md": "People move when they can see something they already want.", "text": "People move when they can see something they already want.", "zh": "人们只有在看到自己本来就想要的东西时才会动。", "sp": null}, {"id": "s0_2_1", "md": "That is why the most useful skill in cross-team work is ==translation==.", "text": "That is why the most useful skill in cross-team work is translation.", "zh": "所以跨团队协作里最有用的能力是翻译。", "sp": null}, {"id": "s0_2_2", "md": "You keep the same request, but you __restate it in terms of__ their goals, their ==metrics==, and their pain.", "text": "You keep the same request, but you restate it in terms of their goals, their metrics, and their pain.", "zh": "请求还是那个请求，但你要用他们的目标、他们的指标、他们的痛点重新讲一遍。", "sp": null}]]}, {"heading": "2. The Translation Test", "heading_zh": "2. 翻译测试", "rows": [[{"id": "s1_0_0", "md": "Before any meeting, finish this sentence: \"This helps you because...\"", "text": "Before any meeting, finish this sentence: \"This helps you because...\"", "zh": "开任何会之前，先把这句话补完：「这对你们有帮助，因为……」", "sp": null}, {"id": "s1_0_1", "md": "If you can only finish it with \"it helps us,\" you are not ready yet.", "text": "If you can only finish it with \"it helps us,\" you are not ready yet.", "zh": "如果你只能补成「这对我们有帮助」，说明你还没准备好。", "sp": null}, {"id": "s1_0_2", "md": "Go and find out what keeps them up at night.", "text": "Go and find out what keeps them up at night.", "zh": "去搞清楚是什么让他们夜里睡不着。", "sp": null}], [{"id": "s1_1_0", "md": "Usually, the answer is hiding in plain sight.", "text": "Usually, the answer is hiding in plain sight.", "zh": "通常答案就摆在眼前。", "sp": null}, {"id": "s1_1_1", "md": "The operations team gets paged at three in the morning, and half of those pages come from logs nobody can read.", "text": "The operations team gets paged at three in the morning, and half of those pages come from logs nobody can read.", "zh": "运维团队凌晨三点被 page，其中一半的告警来自没人看得懂的日志。", "sp": null}, {"id": "s1_1_2", "md": "Now your pitch becomes \"This format could __cut your night pages__ by a third.\"", "text": "Now your pitch becomes \"This format could cut your night pages by a third.\"", "zh": "这时候你的说法就变成了「这个格式能把你们的夜间告警砍掉三分之一」。", "sp": null}, {"id": "s1_1_3", "md": "It is the same change, but it lands ==differently==.", "text": "It is the same change, but it lands differently.", "zh": "改动还是同一个，但听起来完全不一样。", "sp": null}], [{"id": "s1_2_0", "md": "Be careful not to ==exaggerate==.", "text": "Be careful not to exaggerate.", "zh": "注意别夸大。", "sp": null}, {"id": "s1_2_1", "md": "If you promise a benefit you cannot deliver, you __burn the trust__ you will need next quarter.", "text": "If you promise a benefit you cannot deliver, you burn the trust you will need next quarter.", "zh": "如果你承诺了做不到的好处，就会把下个季度还用得上的信任烧掉。", "sp": null}, {"id": "s1_2_2", "md": "**Offer the benefit you can prove, and offer to measure it together.**", "text": "Offer the benefit you can prove, and offer to measure it together.", "zh": "只说你能证明的好处，并且主动提出一起来度量。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, let them shape the plan.", "text": "Finally, let them shape the plan.", "zh": "最后，让他们参与制定方案。", "sp": null}, {"id": "s1_3_1", "md": "When they choose the rollout order or the first service to migrate, the project starts to feel like theirs.", "text": "When they choose the rollout order or the first service to migrate, the project starts to feel like theirs.", "zh": "当他们来决定上线顺序、或者先迁哪个服务时，这个项目就开始像是他们自己的了。", "sp": null}, {"id": "s1_3_2", "md": "That sense of ==ownership== does more for your request than any slide you could write.", "text": "That sense of ownership does more for your request than any slide you could write.", "zh": "这种主人翁感对你的请求的帮助，比你能写的任何一页 PPT 都大。", "sp": null}]]}], "gist": [{"q": "为什么运维团队礼貌点头却两个月没动静？", "a": "因为给出的理由全是对我方团队的好处，对他们来说只是额外工作和别人的收益。"}, {"q": "作者提出的「翻译测试」是什么？", "a": "会前补完一句话：This helps you because...；如果只能说「对我们有好处」，就还没准备好。"}, {"q": "翻译需求时要注意什么？", "a": "不要夸大收益，只承诺能证明的好处并提出一起度量；让对方参与定方案，产生主人翁感。"}], "dictation": [{"id": "s0_1_3", "text": "Nobody changes their priorities because your argument is correct."}, {"id": "s0_2_0", "text": "People move when they can see something they already want."}, {"id": "s1_2_2", "text": "Offer the benefit you can prove, and offer to measure it together."}, {"id": "s1_3_1", "text": "When they choose the rollout order or the first service to migrate, the project starts to feel like theirs."}], "shadow": {"text": "Usually, the answer is hiding in plain sight. The operations team gets paged at three in the morning, and half of those pages come from logs nobody can read.", "marked": "Usually, / the answer is <b>hiding</b> in <b>plain</b> sight. //<br>The operations team gets <b>paged</b> / at <b>three</b> in the morning, / and <b>half</b> of those pages / come from logs <b>nobody</b> can read. //"}, "prompts": [{"q": "你想让数据平台团队给你们的表加分区，这样你们查询更快。用 30 秒向他们提出，但要用他们的利益来讲（比如他们的集群成本或告警）。", "ref": "I know partitioning sounds like our problem, so let me put it in terms of your cluster. Our daily reports currently scan the full table, and they show up as the top cost item on your monthly bill. If we partition by date, those jobs should read a tiny fraction of the data. That means lower spend for you and fewer slow queries blocking other teams. Could we try it on one table first and compare the numbers?", "ref_zh": "我知道分区听起来像是我们的问题，那我从你们集群的角度说一下。我们的日报现在每次都扫全表，在你们的月度账单上是排第一的成本项。如果按日期分区，这些任务应该只需要读很小一部分数据。这意味着你们的花费会降下来，挡住其他团队的慢查询也会变少。我们能不能先拿一张表试试，对比一下数据？", "id": "ref0"}, {"q": "你希望客服团队改用你们新做的工单分类工具。他们觉得是给自己添麻烦。用 30 秒回应，把好处翻译成他们关心的指标。", "ref": "I hear you, nobody wants another tool. Here's why I think it's worth a look for your team specifically. Right now your agents spend a lot of time sorting tickets by hand before they even start helping customers. The new tool does that sorting automatically, so your response time should go down. Let's run it with two agents for a week and see if their numbers actually improve.", "ref_zh": "我理解，谁都不想再多一个工具。我说说为什么我觉得这个值得你们团队看一看。现在你们的客服在开始帮客户之前，要花很多时间手动给工单分类。新工具会自动完成分类，所以你们的响应时间应该能降下来。我们先让两个客服用一周，看看他们的数据是不是真的有改善。", "id": "ref1"}], "words": [{"w": "marginal", "ipa": "/ˈmɑːrdʒɪnl/", "zh": "边际的、微小的", "ex": "The gain is marginal, maybe a few mi const L = D.karaoke;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {

    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);

  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';

  if (l.zh) {

  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();

  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {

        else a.currentTime = l.start;

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
