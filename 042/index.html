<script>
const D = {"id": "042", "title": "Translating Your Request into Their Interests", "meta": "B2 · 约 280 词 · 场景：跨团队推动", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Your Reasons Are Not Their Reasons", "heading_zh": "1. 你的理由不是他们的理由", "rows": [[{"id": "s0_0_0", "md": "Imagine you want the operations team to adopt a new logging format.", "text": "Imagine you want the operations team to adopt a new logging format.", "zh": "假设你想让运维团队采用一种新的日志格式。", "sp": null}, {"id": "s0_0_1", "md": "You explain that it will make your dashboards cleaner and your debugging faster.", "text": "You explain that it will make your dashboards cleaner and your debugging faster.", "zh": "你解释说，这能让你们的 dashboard 更清爽，排查问题更快。", "sp": null}, {"id": "s0_0_2", "md": "They nod politely, and nothing happens for two months.", "text": "They nod politely, and nothing happens for two months.", "zh": "他们客气地点点头，然后两个月过去了，什么都没发生。", "sp": null}], [{"id": "s0_1_0", "md": "The problem is not your logic.", "text": "The problem is not your logic.", "zh": "问题不在你的逻辑。", "sp": null}, {"id": "s0_1_1", "md": "The problem is that every reason you gave was about your team.", "text": "The problem is that every reason you gave was about your team.", "zh": "问题在于你给的每一条理由都是关于你自己团队的。", "sp": null}, {"id": "s0_1_2", "md": "From their side, the request means extra work, a new tool to learn, and a ==marginal== benefit for someone else.", "text": "From their side, the request means extra work, a new tool to learn, and a marginal benefit for someone else.", "zh": "站在他们那边，这个请求意味着额外的工作量、一个要学的新工具，以及给别人带来的一点点好处。", "sp": null}, {"id": "s0_1_3", "md": "**Nobody changes their priorities because your argument is correct.**", "text": "Nobody changes their priorities because your argument is correct.", "zh": "没有人会因为你的论证正确就调整自己的优先级。", "sp": null}], [{"id": "s0_2_0", "md": "People move when they can see something they already want.", "text": "People move when they can see something they already want.", "zh": "人们只有在看到自己本来就想要的东西时才会动。", "sp": null}, {"id": "s0_2_1", "md": "That is why the most useful skill in cross-team work is ==translation==.", "text": "That is why the most useful skill in cross-team work is translation.", "zh": "所以跨团队协作里最有用的能力是翻译。", "sp": null}, {"id": "s0_2_2", "md": "You keep the same request, but you __restate it in terms of__ their goals, their ==metrics==, and their pain.", "text": "You keep the same request, but you restate it in terms of their goals, their metrics, and their pain.", "zh": "请求还是那个请求，但你要用他们的目标、他们的指标、他们的痛点重新讲一遍。", "sp": null}]]}, {"heading": "2. The Translation Test", "heading_zh": "2. 翻译测试", "rows": [[{"id": "s1_0_0", "md": "Before any meeting, finish this sentence: \"This helps you because...\"", "text": "Before any meeting, finish this sentence: \"This helps you because...\"", "zh": "开任何会之前，先把这句话补完：「这对你们有帮助，因为……」", "sp": null}, {"id": "s1_0_1", "md": "If you can only finish it with \"it helps us,\" you are not ready yet.", "text": "If you can only finish it with \"it helps us,\" you are not ready yet.", "zh": "如果你只能补成「这对我们有帮助」，说明你还没准备好。", "sp": null}, {"id": "s1_0_2", "md": "Go and find out what keeps them up at night.", "text": "Go and find out what keeps them up at night.", "zh": "去搞清楚是什么让他们夜里睡不着。", "sp": null}], [{"id": "s1_1_0", "md": "Usually, the answer is hiding in plain sight.", "text": "Usually, the answer is hiding in plain sight.", "zh": "通常答案就摆在眼前。", "sp": null}, {"id": "s1_1_1", "md": "The operations team gets paged at three in the morning, and half of those pages come from logs nobody can read.", "text": "The operations team gets paged at three in the morning, and half of those pages come from logs nobody can read.", "zh": "运维团队凌晨三点被 page，其中一半的告警来自没人看得懂的日志。", "sp": null}, {"id": "s1_1_2", "md": "Now your pitch becomes \"This format could __cut your night pages__ by a third.\"", "text": "Now your pitch becomes \"This format could cut your night pages by a third.\"", "zh": "这时候你的说法就变成了「这个格式能把你们的夜间告警砍掉三分之一」。", "sp": null}, {"id": "s1_1_3", "md": "It is the same change, but it lands ==differently==.", "text": "It is the same change, but it lands differently.", "zh": "改动还是同一个，但听起来完全不一样。", "sp": null}], [{"id": "s1_2_0", "md": "Be careful not to ==exaggerate==.", "text": "Be careful not to exaggerate.", "zh": "注意别夸大。", "sp": null}, {"id": "s1_2_1", "md": "If you promise a benefit you cannot deliver, you __burn the trust__ you will need next quarter.", "text": "If you promise a benefit you cannot deliver, you burn the trust you will need next quarter.", "zh": "如果你承诺了做不到的好处，就会把下个季度还用得上的信任烧掉。", "sp": null}, {"id": "s1_2_2", "md": "**Offer the benefit you can prove, and offer to measure it together.**", "text": "Offer the benefit you can prove, and offer to measure it together.", "zh": "只说你能证明的好处，并且主动提出一起来度量。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, let them shape the plan.", "text": "Finally, let them shape the plan.", "zh": "最后，让他们参与制定方案。", "sp": null}, {"id": "s1_3_1", "md": "When they choose the rollout order or the first service to migrate, the project starts to feel like theirs.", "text": "When they choose the rollout order or the first service to migrate, the project starts to feel like theirs.", "zh": "当他们来决定上线顺序、或者先迁哪个服务时，这个项目就开始像是他们自己的了。", "sp": null}, {"id": "s1_3_2", "md": "That sense of ==ownership== does more for your request than any slide you could write.", "text": "That sense of ownership does more for your request than any slide you could write.", "zh": "这种主人翁感对你的请求的帮助，比你能写的任何一页 PPT 都大。", "sp": null}]]}], "gist": [{"q": "为什么运维团队礼貌点头却两个月没动静？", "a": "因为给出的理由全是对我方团队的好处，对他们来说只是额外工作和别人的收益。"}, {"q": "作者提出的「翻译测试」是什么？", "a": "会前补完一句话：This helps you because...；如果只能说「对我们有好处」，就还没准备好。"}, {"q": "翻译需求时要注意什么？", "a": "不要夸大收益，只承诺能证明的好处并提出一起度量；让对方参与定方案，产生主人翁感。"}], "dictation": [{"id": "s0_1_3", "text": "Nobody changes their priorities because your argument is correct."}, {"id": "s0_2_0", "text": "People move when they can see something they already want."}, {"id": "s1_2_2", "text": "Offer the benefit you can prove, and offer to measure it together."}, {"id": "s1_3_1", "text": "When they choose the rollout order or the first service to migrate, the project starts to feel like theirs."}], "shadow": {"text": "Usually, the answer is hiding in plain sight. The operations team gets paged at three in the morning, and half of those pages come from logs nobody can read.", "marked": "Usually, / the answer is <b>hiding</b> in <b>plain</b> sight. //<br>The operations team gets <b>paged</b> / at <b>three</b> in the morning, / and <b>half</b> of those pages / come from logs <b>nobody</b> can read. //"}, "prompts": [{"q": "你想让数据平台团队给你们的表加分区，这样你们查询更快。用 30 秒向他们提出，但要用他们的利益来讲（比如他们的集群成本或告警）。", "ref": "I know partitioning sounds like our problem, so let me put it in terms of your cluster. Our daily reports currently scan the full table, and they show up as the top cost item on your monthly bill. If we partition by date, those jobs should read a tiny fraction of the data. That means lower spend for you and fewer slow queries blocking other teams. Could we try it on one table first and compare the numbers?", "ref_zh": "我知道分区听起来像是我们的问题，那我从你们集群的角度说一下。我们的日报现在每次都扫全表，在你们的月度账单上是排第一的成本项。如果按日期分区，这些任务应该只需要读很小一部分数据。这意味着你们的花费会降下来，挡住其他团队的慢查询也会变少。我们能不能先拿一张表试试，对比一下数据？", "id": "ref0"}, {"q": "你希望客服团队改用你们新做的工单分类工具。他们觉得是给自己添麻烦。用 30 秒回应，把好处翻译成他们关心的指标。", "ref": "I hear you, nobody wants another tool. Here's why I think it's worth a look for your team specifically. Right now your agents spend a lot of time sorting tickets by hand before they even start helping customers. The new tool does that sorting automatically, so your response time should go down. Let's run it with two agents for a week and see if their numbers actually improve.", "ref_zh": "我理解，谁都不想再多一个工具。我说说为什么我觉得这个值得你们团队看一看。现在你们的客服在开始帮客户之前，要花很多时间手动给工单分类。新工具会自动完成分类，所以你们的响应时间应该能降下来。我们先让两个客服用一周，看看他们的数据是不是真的有改善。", "id": "ref1"}], "words": [{"w": "marginal", "ipa": "/ˈmɑːrdʒɪnl/", "zh": "边际的、微小的", "ex": "The gain is marginal, maybe a few mi const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);

};

const player = new Audio();

const rate = () => parseFloat($('#speed').value);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
