<script>
const D = {"id": "098", "title": "Building a Team Culture Across Offices", "meta": "B2 · 约 270 词 · 场景：跨办公室团队文化", "voice": "en-IN-PrabhatNeural", "rate": "-5%", "sections": [{"heading": "1. The Main Office Problem", "heading_zh": "1. 主办公室问题", "rows": [[{"id": "s0_0_0", "md": "Every ==distributed== team has a ==gravity== problem.", "text": "Every distributed team has a gravity problem.", "zh": "每个分布式团队都有一个「引力」问题。", "sp": null}, {"id": "s0_0_1", "md": "The office where the manager sits becomes the main office, and every other office slowly feels like a ==satellite==.", "text": "The office where the manager sits becomes the main office, and every other office slowly feels like a satellite.", "zh": "经理坐的那个办公室会变成主办公室，其他办公室慢慢就觉得自己像卫星。", "sp": null}], [{"id": "s0_1_0", "md": "You can see it in small things.", "text": "You can see it in small things.", "zh": "从一些小事上就能看出来。", "sp": null}, {"id": "s0_1_1", "md": "Decisions happen in a corridor in Singapore, and the team in Hyderabad reads about them a day later.", "text": "Decisions happen in a corridor in Singapore, and the team in Hyderabad reads about them a day later.", "zh": "决定是在新加坡的走廊里定的，海得拉巴的团队一天后才从文字里看到。", "sp": null}, {"id": "s0_1_2", "md": "Jokes, nicknames and stories are all local, so people in other offices always feel one step behind.", "text": "Jokes, nicknames and stories are all local, so people in other offices always feel one step behind.", "zh": "玩笑、外号和故事都是本地的，所以其他办公室的人总觉得慢了半拍。", "sp": null}, {"id": "s0_1_3", "md": "Nobody planned it that way, but nobody stopped it either.", "text": "Nobody planned it that way, but nobody stopped it either.", "zh": "没人有意这样安排，但也没人去阻止。", "sp": null}], [{"id": "s0_2_0", "md": "**Culture is not what you write on a slide; it is what people in every office experience on an ordinary Tuesday.**", "text": "Culture is not what you write on a slide; it is what people in every office experience on an ordinary Tuesday.", "zh": "文化不是你写在 PPT 上的东西；而是每个办公室的人在一个普通周二的真实感受。", "sp": null}, {"id": "s0_2_1", "md": "If that experience depends on which city you sit in, you do not have one team.", "text": "If that experience depends on which city you sit in, you do not have one team.", "zh": "如果这种感受取决于你坐在哪个城市，那你们就不是一个团队。", "sp": null}, {"id": "s0_2_2", "md": "You have several teams sharing a name.", "text": "You have several teams sharing a name.", "zh": "而是几个共用一个名字的团队。", "sp": null}]]}, {"heading": "2. Small Rituals That Travel", "heading_zh": "2. 能跨地域的小仪式", "rows": [[{"id": "s1_0_0", "md": "Start with decisions.", "text": "Start with decisions.", "zh": "先从决策入手。", "sp": null}, {"id": "s1_0_1", "md": "Make it a rule that nothing is final until it is written in the shared channel, even if it was agreed over lunch in one office.", "text": "Make it a rule that nothing is final until it is written in the shared channel, even if it was agreed over lunch in one office.", "zh": "定一条规矩：任何事在写进共享频道之前都不算最终定下，哪怕是在某个办公室吃午饭时已经谈好的。", "sp": null}, {"id": "s1_0_2", "md": "This one habit removes most of the ==insider== advantage.", "text": "This one habit removes most of the insider advantage.", "zh": "光这一个习惯，就能消掉大部分「自己人」的信息优势。", "sp": null}], [{"id": "s1_1_0", "md": "Next, create rituals that work across time zones.", "text": "Next, create rituals that work across time zones.", "zh": "然后，建立一些能跨时区的仪式。", "sp": null}, {"id": "s1_1_1", "md": "Try a weekly thread where everyone posts one win, a monthly demo where each office presents, or a ==shout-out== at the start of every all-hands.", "text": "Try a weekly thread where everyone posts one win, a monthly demo where each office presents, or a shout-out at the start of every all-hands.", "zh": "可以试试每周开一个帖子让每人发一条成果，每月办一次各办公室轮流上台的 demo，或者每次全员会开场先点名表扬。", "sp": null}, {"id": "s1_1_2", "md": "These small moments make people in other cities ==visible== to each other.", "text": "These small moments make people in other cities visible to each other.", "zh": "这些小时刻能让不同城市的人彼此被看见。", "sp": null}], [{"id": "s1_2_0", "md": "Be careful with language.", "text": "Be careful with language.", "zh": "说话用词要小心。", "sp": null}, {"id": "s1_2_1", "md": "Saying \"the India team\" or \"the remote folks\" __draws lines__ you may not intend.", "text": "Saying \"the India team\" or \"the remote folks\" draws lines you may not intend.", "zh": "说「印度团队」或者「远程的那帮人」，会划出一些你可能并不想划的界线。", "sp": null}, {"id": "s1_2_2", "md": "**Talk about the work and the people, not the locations.**", "text": "Talk about the work and the people, not the locations.", "zh": "聊工作、聊人，别聊地点。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, when there is a travel budget, send engineers, not just managers.", "text": "Finally, when there is a travel budget, send engineers, not just managers.", "zh": "最后，有差旅预算的时候，派工程师去，而不只是派经理。", "sp": null}, {"id": "s1_3_1", "md": "Two days of working __side by side__ builds more trust than a year of video calls, and those engineers __bring the stories home__.", "text": "Two days of working side by side builds more trust than a year of video calls, and those engineers bring the stories home.", "zh": "并肩工作两天建立起来的信任，比一年的视频会议还多，而且这些工程师会把故事带回去。", "sp": null}]]}], "gist": [{"q": "什么是分布式团队的“引力问题”？", "a": "经理所在的办公室成了主办公室，其他办公室慢慢变成卫星，决策、笑话和故事都在本地发生，别处总慢一步。"}, {"q": "作者如何定义团队文化？", "a": "不是写在幻灯片上的东西，而是每个办公室的人在普通周二的真实体验；体验取决于所在城市，就不算一个团队。"}, {"q": "文中提出了哪些具体做法？", "a": "决定必须写进共享频道才算数；建立跨时区仪式（每周晒成果、月度各办公室演示、全员会点名表扬）；说人和事，不说地点；差旅预算让工程师也去面对面合作。"}], "dictation": [{"id": "s0_2_0", "text": "Culture is not what you write on a slide; it is what people in every office experience on an ordinary Tuesday."}, {"id": "s1_0_2", "text": "This one habit removes most of the insider advantage."}, {"id": "s1_1_2", "text": "These small moments make people in other cities visible to each other."}, {"id": "s1_2_2", "text": "Talk about the work and the people, not the locations."}], "shadow": {"text": "Start with decisions. Make it a rule that nothing is final until it is written in the shared channel, even if it was agreed over lunch in one office. This one habit removes most of the insider advantage.", "marked": "Start with <b>decisions</b>. //<br>Make it a <b>rule</b> / that <b>nothing</b> is final / until it is <b>written</b> in the shared channel, / even if it was agreed over <b>lunch</b> / in <b>one</b> office. //<br>This one <b>habit</b> / removes most of the <b>insider</b> advantage. //"}, "prompts": [{"q": "你注意到最近很多决定是在新加坡办公室午饭时定下的，海得拉巴的同事事后才知道。你在周会上提出新规则，30 秒。", "ref": "I want to raise something I've noticed, and I'm part of the problem. A few recent decisions were made over lunch here in Singapore, and our colleagues in Hyderabad only heard about them later. From now on, let's agree that nothing is final until it's written in the team channel. If it's not in the channel, it hasn't been decided.", "ref_zh": "我想提一件最近注意到的事，而且我自己也有份。最近有几个决定是在新加坡这边吃午饭时定下的，海得拉巴的同事事后才知道。从现在开始，我们约定：任何事在写进团队频道之前都不算最终定下。没进频道，就等于没定。", "id": "ref0"}, {"q": "你在月度全员会开场给班加罗尔的同事一个 shout-out。", "ref": "Before we start, I want to give a big shout-out to Deepa and the Bangalore crew. Last week, while most of us were asleep, they found the memory leak that had been crashing our upload service for a month. They didn't just patch it, they wrote up exactly how they found it. Deepa, maybe you could share that story at the next demo?", "ref_zh": "开始之前，我想大大表扬一下 Deepa 和班加罗尔的伙伴们。上周，在我们大多数人睡觉的时候，他们找到了那个让上传服务崩了一个月的内存泄漏。他们不只是打了补丁，还把排查过程原原本本写了下来。Deepa，下次 demo 的时候要不要给大家讲讲这个故事？", "id": "ref1"}], "words": [{"w": "distributed", "ipa": "/dɪˈstrɪbjətɪd/", "zh": "分布式的、分散在各地的", "ex": "Running a distributed team means writing more and meeting less.", "id": "w0"}, {"w": "gravity", "ipa": "/ˈɡrævəti/", "zh": "引力、吸引力", "ex": "Headquarters has a natural gravity, so we have to push decisions outward.", "id": "w1"}, {"w": "satellite", "ipa": "/ˈsætəˌlaɪt/", "zh": "卫星；附属的（办公室）", "ex": "Nobody wants to work in a satellite office that only gets leftover tasks.", "id": "w2"}, {"w": "insider", "ipa": "/ɪnˈsaɪdər/", "zh": "内部人士、圈内人", "ex": "Hallway decisions give insiders an unf const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
