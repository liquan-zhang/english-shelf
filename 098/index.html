<script>
const D = {"id": "098", "title": "Building a Team Culture Across Offices", "meta": "B2 · 约 270 词 · 场景：跨办公室团队文化", "voice": "en-IN-PrabhatNeural", "rate": "-5%", "sections": [{"heading": "1. The Main Office Problem", "heading_zh": "1. 主办公室问题", "rows": [[{"id": "s0_0_0", "md": "Every ==distributed== team has a ==gravity== problem.", "text": "Every distributed team has a gravity problem.", "zh": "每个分布式团队都有一个「引力」问题。", "sp": null}, {"id": "s0_0_1", "md": "The office where the manager sits becomes the main office, and every other office slowly feels like a ==satellite==.", "text": "The office where the manager sits becomes the main office, and every other office slowly feels like a satellite.", "zh": "经理坐的那个办公室会变成主办公室，其他办公室慢慢就觉得自己像卫星。", "sp": null}], [{"id": "s0_1_0", "md": "You can see it in small things.", "text": "You can see it in small things.", "zh": "从一些小事上就能看出来。", "sp": null}, {"id": "s0_1_1", "md": "Decisions happen in a corridor in Singapore, and the team in Hyderabad reads about them a day later.", "text": "Decisions happen in a corridor in Singapore, and the team in Hyderabad reads about them a day later.", "zh": "决定是在新加坡的走廊里定的，海得拉巴的团队一天后才从文字里看到。", "sp": null}, {"id": "s0_1_2", "md": "Jokes, nicknames and stories are all local, so people in other offices always feel one step behind.", "text": "Jokes, nicknames and stories are all local, so people in other offices always feel one step behind.", "zh": "玩笑、外号和故事都是本地的，所以其他办公室的人总觉得慢了半拍。", "sp": null}, {"id": "s0_1_3", "md": "Nobody planned it that way, but nobody stopped it either.", "text": "Nobody planned it that way, but nobody stopped it either.", "zh": "没人有意这样安排，但也没人去阻止。", "sp": null}], [{"id": "s0_2_0", "md": "**Culture is not what you write on a slide; it is what people in every office experience on an ordinary Tuesday.**", "text": "Culture is not what you write on a slide; it is what people in every office experience on an ordinary Tuesday.", "zh": "文化不是你写在 PPT 上的东西；而是每个办公室的人在一个普通周二的真实感受。", "sp": null}, {"id": "s0_2_1", "md": "If that experience depends on which city you sit in, you do not have one team.", "text": "If that experience depends on which city you sit in, you do not have one team.", "zh": "如果这种感受取决于你坐在哪个城市，那你们就不是一个团队。", "sp": null}, {"id": "s0_2_2", "md": "You have several teams sharing a name.", "text": "You have several teams sharing a name.", "zh": "而是几个共用一个名字的团队。", "sp": null}]]}, {"heading": "2. Small Rituals That Travel", "heading_zh": "2. 能跨地域的小仪式", "rows": [[{"id": "s1_0_0", "md": "Start with decisions.", "text": "Start with decisions.", "zh": "先从决策入手。", "sp": null}, {"id": "s1_0_1", "md": "Make it a rule that nothing is final until it is written in the shared channel, even if it was agreed over lunch in one office.", "text": "Make it a rule that nothing is final until it is written in the shared channel, even if it was agreed over lunch in one office.", "zh": "定一条规矩：任何事在写进共享频道之前都不算最终定下，哪怕是在某个办公室吃午饭时已经谈好的。", "sp": null}, {"id": "s1_0_2", "md": "This one habit removes most of the ==insider== advantage.", "text": "This one habit removes most of the insider advantage.", "zh": "光这一个习惯，就能消掉大部分「自己人」的信息优势。", "sp": null}], [{"id": "s1_1_0", "md": "Next, create rituals that work across time zones.", "text": "Next, create rituals that work across time zones.", "zh": "然后，建立一些能跨时区的仪式。", "sp": null}, {"id": "s1_1_1", "md": "Try a weekly thread where everyone posts one win, a monthly demo where each office presents, or a ==shout-out== at the start of every all-hands.", "text": "Try a weekly thread where everyone posts one win, a monthly demo where each office presents, or a shout-out at the start of every all-hands.", "zh": "可以试试每周开一个帖子让每人发一条成果，每月办一次各办公室轮流上台的 demo，或者每次全员会开场先点名表扬。", "sp": null}, {"id": "s1_1_2", "md": "These small moments make people in other cities ==visible== to each other.", "text": "These small moments make people in other cities visible to each other.", "zh": "这些小时刻能让不同城市的人彼此被看见。", "sp": null}], [{"id": "s1_2_0", "md": "Be careful with language.", "text": "Be careful with language.", "zh": "说话用词要小心。", "sp": null}, {"id": "s1_2_1", "md": "Saying \"the India team\" or \"the remote folks\" __draws lines__ you may not intend.", "text": "Saying \"the India team\" or \"the remote folks\" draws lines you may not intend.", "zh": "说「印度团队」或者「远程的那帮人」，会划出一些你可能并不想划的界线。", "sp": null}, {"id": "s1_2_2", "md": "**Talk about the work and the people, not the locations.**", "text": "Talk about the work and the people, not the locations.", "zh": "聊工作、聊人，别聊地点。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, when there is a travel budget, send engineers, not just managers.", "text": "Finally, when there is a travel budget, send engineers, not just managers.", "zh": "最后，有差旅预算的时候，派工程师去，而不只是派经理。", "sp": null}, {"id": "s1_3_1", "md": "Two days of working __side by side__ builds more trust than a year of video calls, and those engineers __bring the stories home__.", "text": "Two days of working side by side builds more trust than a year of video calls, and those engineers bring the stories home.", "zh": "并肩工作两天建立起来的信任，比一年的视频会议还多，而且这些工程师会把故事带回去。", "sp": null}]]}], "gist": [{"q": "什么是分布式团队的“引力问题”？", "a": "经理所在的办公室成了主办公室，其他办公室慢慢变成卫星，决策、笑话和故事都在本地发生，别处总慢一步。"}, {"q": "作者如何定义团队文化？", "a": "不是写在幻灯片上的东西，而是每个办公室的人在普通周二的真实体验；体验取决于所在城市，就不算一个团队。"}, {"q": "文中提出了哪些具体做法？", "a": "决定必须写进共享频道才算数；建立跨时区仪式（每周晒成果、月度各办公室演示、全员会点名表扬）；说人和事，不说地点；差旅预算让工程师也去面对面合作。"}], "dictation": [{"id": "s0_2_0", "text": "Culture is not what you write on a slide; it is what people in every office experience on an ordinary Tuesday."}, {"id": "s1_0_2", "text": "This one habit removes most of the insider advantage."}, {"id": "s1_1_2", "text": "These small moments make people in other cities visible to each other."}, {"id": "s1_2_2", "text": "Talk about the work and the people, not the locations."}], "shadow": {"text": "Start with decisions. Make it a rule that nothing is final until it is written in the shared channel, even if it was agreed over lunch in one office. This one habit removes most of the insider advantage.", "marked": "Start with <b>decisions</b>. //<br>Make it a <b>rule</b> / that <b>nothing</b> is final / until it is <b>written</b> in the shared channel, / even if it was agreed over <b>lunch</b> / in <b>one</b> office. //<br>This one <b>habit</b> / removes most of the <b>insider</b> advantage. //"}, "prompts": [{"q": "你注意到最近很多决定是在新加坡办公室午饭时定下的，海得拉巴的同事事后才知道。你在周会上提出新规则，30 秒。", "ref": "I want to raise something I've noticed, and I'm part of the problem. A few recent decisions were made over lunch here in Singapore, and our colleagues in Hyderabad only heard about them later. From now on, let's agree that nothing is final until it's written in the team channel. If it's not in the channel, it hasn't been decided.", "ref_zh": "我想提一件最近注意到的事，而且我自己也有份。最近有几个决定是在新加坡这边吃午饭时定下的，海得拉巴的同事事后才知道。从现在开始，我们约定：任何事在写进团队频道之前都不算最终定下。没进频道，就等于没定。", "id": "ref0"}, {"q": "你在月度全员会开场给班加罗尔的同事一个 shout-out。", "ref": "Before we start, I want to give a big shout-out to Deepa and the Bangalore crew. Last week, while most of us were asleep, they found the memory leak that had been crashing our upload service for a month. They didn't just patch it, they wrote up exactly how they found it. Deepa, maybe you could share that story at the next demo?", "ref_zh": "开始之前，我想大大表扬一下 Deepa 和班加罗尔的伙伴们。上周，在我们大多数人睡觉的时候，他们找到了那个让上传服务崩了一个月的内存泄漏。他们不只是打了补丁，还把排查过程原原本本写了下来。Deepa，下次 demo 的时候要不要给大家讲讲这个故事？", "id": "ref1"}], "words": [{"w": "distributed", "ipa": "/dɪˈstrɪbjətɪd/", "zh": "分布式的、分散在各地的", "ex": "Running a distributed team means writing more and meeting less.", "id": "w0"}, {"w": "gravity", "ipa": "/ˈɡrævəti/", "zh": "引力、吸引力", "ex": "Headquarters has a natural gravity, so we have to push decisions outward.", "id": "w1"}, {"w": "satellite", "ipa": "/ˈsætəˌlaɪt/", "zh": "卫星；附属的（办公室）", "ex": "Nobody wants to work in a satellite office that only gets leftover tasks.", "id": "w2"}, {"w": "insider", "ipa": "/ɪnˈsaɪdər/", "zh": "内部人士、圈内人", "ex": "Hallway decisions give insiders an unf const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
