<script>
const D = {"id": "067", "title": "When the Launch Date Meets a Critical Bug", "meta": "B2 · 约 270 词 · 场景：上线决策", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The False Choice", "heading_zh": "1. 假的二选一", "rows": [[{"id": "s0_0_0", "md": "It is the day before launch, and QA finds a bug that corrupts saved drafts for some users.", "text": "It is the day before launch, and QA finds a bug that corrupts saved drafts for some users.", "zh": "上线前一天，QA 发现了一个 bug，会把部分用户保存的草稿搞坏。", "sp": null}, {"id": "s0_0_1", "md": "Marketing has already announced the date, and the press release is scheduled.", "text": "Marketing has already announced the date, and the press release is scheduled.", "zh": "市场那边已经官宣了日期，新闻稿也排好了。", "sp": null}, {"id": "s0_0_2", "md": "The room quickly splits into two camps: ship anyway, or ==postpone== everything.", "text": "The room quickly splits into two camps: ship anyway, or postpone everything.", "zh": "屋里很快分成两派：硬着头皮上，还是全部延期。", "sp": null}], [{"id": "s0_1_0", "md": "This is almost always a false choice.", "text": "This is almost always a false choice.", "zh": "这几乎总是一个假的二选一。", "sp": null}, {"id": "s0_1_1", "md": "Between shipping everything and shipping nothing, there is usually a middle path.", "text": "Between shipping everything and shipping nothing, there is usually a middle path.", "zh": "在全上和全不上之间，通常还有一条中间路线。", "sp": null}, {"id": "s0_1_2", "md": "You can launch with the broken feature switched off, release to a small ==segment== of users, or ship on time with a known ==workaround==.", "text": "You can launch with the broken feature switched off, release to a small segment of users, or ship on time with a known workaround.", "zh": "你可以把有问题的功能关掉再上线，先放给一小部分用户，或者按时上线并给出一个已知的绕过办法。", "sp": null}], [{"id": "s0_2_0", "md": "**When someone offers you two options under pressure, look for the third one.**", "text": "When someone offers you two options under pressure, look for the third one.", "zh": "当有人在压力下只给你两个选项时，去找第三个。", "sp": null}, {"id": "s0_2_1", "md": "The best answer often keeps the date and removes the risk, rather than trading one for the other.", "text": "The best answer often keeps the date and removes the risk, rather than trading one for the other.", "zh": "最好的答案往往是既保住日期又消掉风险，而不是拿一个去换另一个。", "sp": null}, {"id": "s0_2_2", "md": "Finding it takes ten minutes of calm thinking, which is exactly what panic __crowds out__.", "text": "Finding it takes ten minutes of calm thinking, which is exactly what panic crowds out.", "zh": "找到它只需要十分钟冷静思考，而这恰恰是慌乱时最容易被挤掉的东西。", "sp": null}]]}, {"heading": "2. Bring Options, Not Just Bad News", "heading_zh": "2. 带着方案来，而不只是坏消息", "rows": [[{"id": "s1_0_0", "md": "When you take the problem to your manager or the PM, don't just __drop the bug on the table__.", "text": "When you take the problem to your manager or the PM, don't just drop the bug on the table.", "zh": "当你把问题拿给经理或 PM 的时候，别只是把 bug 往桌上一扔。", "sp": null}, {"id": "s1_0_1", "md": "Bring two or three options, each with a clear ==tradeoff==.", "text": "Bring two or three options, each with a clear tradeoff.", "zh": "带上两三个方案，每个都讲清楚取舍。", "sp": null}, {"id": "s1_0_2", "md": "Keep the message short enough to read on a phone between meetings.", "text": "Keep the message short enough to read on a phone between meetings.", "zh": "消息要短，短到对方能在两个会之间用手机看完。", "sp": null}], [{"id": "s1_1_0", "md": "Option one: ship tomorrow with drafts disabled, and lose that feature for a week.", "text": "Option one: ship tomorrow with drafts disabled, and lose that feature for a week.", "zh": "方案一：明天上线，草稿功能关掉，这个功能缺一周。", "sp": null}, {"id": "s1_1_1", "md": "Option two: ship tomorrow to five percent of users, and accept a small risk of data loss.", "text": "Option two: ship tomorrow to five percent of users, and accept a small risk of data loss.", "zh": "方案二：明天放给百分之五的用户，接受一点数据丢失的风险。", "sp": null}, {"id": "s1_1_2", "md": "Option three: slip by three days and ship everything ==intact==.", "text": "Option three: slip by three days and ship everything intact.", "zh": "方案三：推迟三天，所有功能完整上线。", "sp": null}], [{"id": "s1_2_0", "md": "**Then say which one you recommend, and why.**", "text": "Then say which one you recommend, and why.", "zh": "然后说清楚你推荐哪个，以及为什么。", "sp": null}, {"id": "s1_2_1", "md": "Decision makers want your judgment, not just a menu.", "text": "Decision makers want your judgment, not just a menu.", "zh": "做决定的人要的是你的判断，而不只是一张菜单。", "sp": null}, {"id": "s1_2_2", "md": "A clear ==recommendation== also makes it easier for them to __push back__ if they see a factor you missed, like a contract that depends on the date.", "text": "A clear recommendation also makes it easier for them to push back if they see a factor you missed, like a contract that depends on the date.", "zh": "一个明确的建议也让他们更容易提出反对，比如他们看到了你漏掉的因素，像是有份合同依赖这个日期。", "sp": null}, {"id": "s1_2_3", "md": "Either way, the decision gets made in minutes instead of hours.", "text": "Either way, the decision gets made in minutes instead of hours.", "zh": "不管怎样，决定都能在几分钟内做出来，而不是拖上几个小时。", "sp": null}]]}], "gist": [{"q": "上线前一天发现严重 bug，团队通常分成哪两派？作者怎么看？", "a": "一派照常上线、一派全部推迟；作者认为这是伪二选一，中间往往有第三条路。"}, {"q": "文中提到了哪些“中间路径”？", "a": "关掉有问题的功能上线、只对一小部分用户发布、带着已知的绕过方案按时上线。"}, {"q": "向经理或 PM 汇报时应该怎么做？", "a": "带两三个选项并说清各自代价，然后给出自己的推荐和理由，方便对方快速决定或反驳。"}], "dictation": [{"id": "s0_2_0", "text": "When someone offers you two options under pressure, look for the third one."}, {"id": "s0_1_1", "text": "Between shipping everything and shipping nothing, there is usually a middle path."}, {"id": "s1_2_0", "text": "Then say which one you recommend, and why."}, {"id": "s1_2_1", "text": "Decision makers want your judgment, not just a menu."}], "shadow": {"text": "This is almost always a false choice. Between shipping everything and shipping nothing, there is usually a middle path.", "marked": "This is almost <b>always</b> / a <b>false</b> choice. //<br>Between shipping <b>everything</b> / and shipping <b>nothing</b>, / there is usually / a <b>middle</b> path. //"}, "prompts": [{"q": "明天上线，今晚发现导出功能有严重 bug。用 30 秒向你的总监汇报：给出三个选项和你的推荐。", "ref": "Quick heads-up on tomorrow's launch. QA found a bug that can corrupt exported reports. We have three options. One, launch on time with export turned off for about a week. Two, launch to ten percent of users with export on and watch closely. Three, slip by three days. I recommend option one: the date holds, and export is a minor part of the release. Does anything make the date less important than I think?", "ref_zh": "同步一下明天上线的事。QA 发现了一个 bug，可能会把导出的报表搞坏。我们有三个方案。一，按时上线，导出功能关掉大概一周。二，放给百分之十的用户，导出打开，密切盯着。三，推迟三天。我建议方案一：日期保住了，而且导出只是这次发布里很小的一部分。有没有什么情况，让这个日期没我想的那么重要？", "id": "ref0"}, {"q": "会上大家在“硬上”还是“全推迟”之间吵起来了。用 30 秒打断，引导大家找第三条路。", "ref": "Can I pause us for a second? We're arguing as if there are only two choices, ship everything or ship nothing. I don't think that's true. The bug only affects the sync feature. What if we launch tomorrow with sync behind a flag, and turn it on once the fix is verified? Let's spend five minutes listing middle options before we pick a side.", "ref_zh": "我能让大家先停一下吗？我们现在吵得好像只有两个选择，要么全上，要么全不上。我觉得不是这样。这个 bug 只影响同步功能。要不明天上线，把同步藏在开关后面，等修复验证完再打开？我们先花五分钟把中间方案列一列，再来选边站。", "id": "ref1"}], "words": [{"w": "postpone", "ipa": "/poʊstˈpoʊn/", "zh": "推迟、延期", "ex": "We had to postpone the launch because of the payment bug.", "id": "w0"}, {"w": "segment", "ipa": "/ˈseɡmənt/", "zh": "（用户）分群、部分", "ex": "Let's release it to a small segment of users in one market first.", "id": "w1"}, {"w": "workaround", "ipa": "/ˈwɜːrkəˌraʊnd/", "zh": "临时绕过方案", "ex": "Support can share the workaround until the fix is out.", "id": "w2"}, {"w": "tradeoff", "ipa": "/ˈtreɪdˌɔːf/", "zh": "取舍、权衡", "ex": "The tradeoff is faster delivery but less test coverage.", "id": "w3"}, {"w": "intact", "ipa": "/ɪnˈtækt/", "zh": "完整无损的", "ex": "After the migration, all user settings were intact.", "id": "w4"}, {"w": "recommendation", "ipa": "/ˌrekəmenˈdeɪʃən/", "zh": "建议、推荐方案", "ex": "My recommendation is to delay the roll const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

    h('div', { class: 'how', html: how }), body);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
