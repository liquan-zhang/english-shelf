.", "ref_zh": "你好，我发现上个月账户被扣了一笔低于最低余额的费用，不太明白为什么。我账户里一直都有三千以上。能帮我查一下平均余额是怎么算的吗？如果算错了，能把费用退回吗？如果没错，我也想把规则弄清楚。", "id": "ref1"}], "words": [{"w": "interest", "ipa": "/ˈɪntrəst/", "zh": "利息", "ex": "This account pays very little interest.", "id": "w0"}, {"w": "minimum balance", "ipa": "/ˈmɪnɪməm ˈbæləns/", "zh": "最低余额", "ex": "Keep the minimum balance or you'll be charged a fee.", "id": "w1"}, {"w": "fee", "ipa": "/fiː/", "zh": "费用，手续费", "ex": "Is there a fee for using other banks' ATMs?", "id": "w2"}, {"w": "work pass", "ipa": "/wɜːrk pæs/", "zh": "工作准证", "ex": "Bring your work pass when you sign the lease.", "id": "w3"}, {"w": "proof of address", "ipa": "/pruːf əv ˈædres/", "zh": "住址证明", "ex": "A phone bill can be used as proof of address.", "id": "w4"}, {"w": "utility bill", "ipa": "/juːˈtɪləti bɪl/", "zh": "水电账单", "ex": "Our utility bill went up because of the aircon.", "id": "w5"}, {"w": "verify", "ipa": "/ˈverɪfaɪ/", "zh": "核实，验证", "ex": "You need to verify your identity with your passport.", "id": "w6"}, {"w": "original", "ipa": "/əˈrɪdʒənəl/", "zh": "原件", "ex": "Please bring the original and one photocopy.", "id": "w7"}, {"w": "fall below", "ipa": "/fɔːl bɪˈloʊ/", "zh": "低于", "ex": "If your balance falls below the limit, you'll get an alert.", "id": "w8"}, {"w": "tenancy agreement", "ipa": "/ˈtenənsi əˈɡriːmənt/", "zh": "租约", "ex": "Read the tenancy agreement carefully before you sign.", "id": "w9"}], "sections": [{"heading": "1. Choosing an Account", "heading_zh": "1. 选账户类型", "rows": [[{"id": "s0_0_0", "md": "Hi, thanks for waiting. What can I do for you today?", "text": "Hi, thanks for waiting. What can I do for you today?", "zh": "你好，久等了。今天办什么业务？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I'd like to open a savings account. I've just moved here for work.**", "text": "I'd like to open a savings account. I've just moved here for work.", "zh": "我想开一个储蓄账户。我刚来这边工作。", "sp": "A"}], [{"id": "s0_2_0", "md": "Welcome. Are you after a basic account, or one that pays more ==interest== if your salary goes in?", "text": "Welcome. Are you after a basic account, or one that pays more interest if your salary goes in?", "zh": "欢迎。您想要普通账户，还是工资打进来就能拿更高利息的那种？", "sp": "B"}], [{"id": "s0_3_0", "md": "My salary will go in here, so the second one. Is there a ==minimum balance==?", "text": "My salary will go in here, so the second one. Is there a minimum balance?", "zh": "我工资会打到这里，所以要第二种。有最低余额要求吗？", "sp": "A"}], [{"id": "s0_4_0", "md": "Yes, three thousand dollars on average each month. If you __fall below__ that, there's a ==fee== of five dollars.", "text": "Yes, three thousand dollars on average each month. If you fall below that, there's a fee of five dollars.", "zh": "有，每月平均余额三千元。低于这个数，收五块钱手续费。", "sp": "B"}], [{"id": "s0_5_0", "md": "Okay, that's manageable. Does it __come with__ a debit card I can use overseas?", "text": "Okay, that's manageable. Does it come with a debit card I can use overseas?", "zh": "好，这个能接受。账户带一张能在国外用的借记卡吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "It does, and you can lock it or change your limits in the app.", "text": "It does, and you can lock it or change your limits in the app.", "zh": "带的，而且可以在手机应用里锁卡或者改额度。", "sp": "B"}], [{"id": "s0_7_0", "md": "Great. What documents do you need from me?", "text": "Great. What documents do you need from me?", "zh": "好。需要我提供哪些材料？", "sp": "A"}], [{"id": "s0_8_0", "md": "Your passport, your ==work pass==, and a ==proof of address== from the last three months.", "text": "Your passport, your work pass, and a proof of address from the last three months.", "zh": "您的护照、工作准证，还有近三个月内的住址证明。", "sp": "B"}]]}, {"heading": "2. A Problem with the Paperwork", "heading_zh": "2. 材料出了问题", "rows": [[{"id": "s1_0_0", "md": "Here's my passport and work pass. For the address, I have my tenancy agreement.", "text": "Here's my passport and work pass. For the address, I have my tenancy agreement.", "zh": "这是我的护照和工作准证。住址证明我带了租约。", "sp": "A"}], [{"id": "s1_1_0", "md": "Hmm, this lease is only in your wife's name, so I can't __accept it__ for you, unfortunately.", "text": "Hmm, this lease is only in your wife's name, so I can't accept it for you, unfortunately.", "zh": "嗯，这份租约上只有您太太的名字，很遗憾不能作为您的证明。", "sp": "B"}], [{"id": "s1_2_0", "md": "**I see. What else would work? We only moved in last month.**", "text": "I see. What else would work? We only moved in last month.", "zh": "明白了。那还有什么可以用？我们上个月才搬进来。", "sp": "A"}], [{"id": "s1_3_0", "md": "A ==utility bill== or a letter from your employer with your address would be fine.", "text": "A utility bill or a letter from your employer with your address would be fine.", "zh": "水电账单，或者公司开的、写有您地址的信都可以。", "sp": "B"}], [{"id": "s1_4_0", "md": "My company can send a letter today. Could I __email it over__ instead of coming back?", "text": "My company can send a letter today. Could I email it over instead of coming back?", "zh": "公司今天就能开信。我能直接发邮件给你，不用再跑一趟吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "Unfortunately we need to see the ==original==, but you can upload it in the app once you're ==verified==.", "text": "Unfortunately we need to see the original, but you can upload it in the app once you're verified.", "zh": "很遗憾我们需要看原件，不过等您身份核验好后，可以在应用里上传。", "sp": "B"}], [{"id": "s1_6_0", "md": "So can we start the application now and finish it later?", "text": "So can we start the application now and finish it later?", "zh": "那我们能先把申请办起来，之后再补材料吗？", "sp": "A"}], [{"id": "s1_7_0", "md": "Yes. I'll set everything up today, and the account goes live once your letter is uploaded.", "text": "Yes. I'll set everything up today, and the account goes live once your letter is uploaded.", "zh": "可以。今天我把其他都办好，您上传信件后账户就能启用。", "sp": "B"}], [{"id": "s1_8_0", "md": "**That works. How long does the card take to arrive?**", "text": "That works. How long does the card take to arrive?", "zh": "这样可以。卡多久能寄到？", "sp": "A"}], [{"id": "s1_9_0", "md": "About five working days, posted to your home address.", "text": "About five working days, posted to your home address.", " const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
