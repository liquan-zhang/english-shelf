<script>
const D = {"id": "124", "type": "dialogue", "title": "Taking Your Child to the Doctor", "meta": "B2 · 约 300 词 · 场景：带孩子看发烧与用药", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Doctor", "name_zh": "医生", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "孩子有哪些症状？医生诊断是什么？", "a": "从昨晚发烧，最高三十九度二，吃得很少，有点咳嗽，早上吐了一次，一直拽左耳；诊断是耳朵感染。"}, {"q": "「你」为什么打断医生开药？", "a": "孩子上次吃阿莫西林全身起疹子，可能过敏，医生于是换了别的药并记入病历。"}, {"q": "药怎么吃？什么情况要回来复诊？", "a": "每次五毫升，一天两次，饭后用喂药器喂；三天后还烧或特别没精神就马上回来。"}], "dictation": [{"id": "s0_1_0", "text": "She's had a fever since last night, and she's barely eating anything."}, {"id": "s0_5_0", "text": "A bit of a cough, and she threw up once this morning. She also keeps pulling at her left ear."}, {"id": "s1_3_0", "text": "How much should I give her each time, and does it need to be taken with food?"}, {"id": "s1_1_0", "text": "Sorry, before you do that. She had a rash all over her body the last time she took amoxicillin."}], "shadow": {"speaker": "A", "text": "Sorry, before you do that. She had a rash all over her body the last time she took amoxicillin.", "marked": "<b>Sorry</b>, / before you <b>do</b> that. //<br>She had a <b>rash</b> / all over her <b>body</b> / the <b>last</b> time she took <b>amoxicillin</b>. //"}, "prompts": [{"q": "孩子摔了一跤，额头肿了个包，你打电话问诊所要不要马上带来。说清经过、现在的状态，并问该注意什么。", "ref": "Hi, my son is two. About twenty minutes ago he fell off the sofa and hit his forehead on the floor. He cried straight away, and now there's a big bump, but he's playing normally. He hasn't vomited. Should I bring him in now, or just watch him at home? What signs should I look out for?", "ref_zh": "你好，我儿子两岁。大概二十分钟前他从沙发上摔下来，额头撞到地上。他当时马上就哭了，现在起了个大包，但玩得挺正常，没有吐。我需要现在带他过来，还是在家观察就行？要注意哪些迹象？", "id": "ref0"}, {"q": "医生开了三种药，你记不住。请医生再确认一遍每种药的用法和顺序，并问能不能和退烧药一起吃。", "ref": "Sorry, Doctor, that's a lot to remember. Could we go through them one more time? Which one is for the cough, and which one is for the runny nose? Do they all need to be taken after meals? And if she gets a fever tonight, is it okay to give her paracetamol together with these?", "ref_zh": "不好意思医生，要记的太多了。能再过一遍吗？哪个是治咳嗽的，哪个是治流鼻涕的？都需要饭后吃吗？还有，如果她今晚发烧，可以跟这些药一起吃退烧药吗？", "id": "ref1"}], "words": [{"w": "temperature", "ipa": "/ˈtemprətʃər/", "zh": "体温", "ex": "Let me take your temperature before you see the doctor.", "id": "w0"}, {"w": "vomiting", "ipa": "/ˈvɑːmɪtɪŋ/", "zh": "呕吐", "ex": "If the vomiting doesn't stop, take him to the hospital.", "id": "w1"}, {"w": "diarrhoea", "ipa": "/ˌdaɪəˈriːə/", "zh": "腹泻", "ex": "She's had diarrhoea since she ate that seafood.", "id": "w2"}, {"w": "infection", "ipa": "/ɪnˈfekʃən/", "zh": "感染", "ex": "Keep the cut clean so it doesn't get an infection.", "id": "w3"}, {"w": "antibiotic", "ipa": "/ˌæntibaɪˈɑːtɪk/", "zh": "抗生素", "ex": "Finish the whole course of antibiotics, even if you feel better.", "id": "w4"}, {"w": "rash", "ipa": "/ræʃ/", "zh": "皮疹", "ex": "He got a rash after trying the new soap.", "id": "w5"}, {"w": "allergy", "ipa": "/ˈælərdʒi/", "zh": "过敏", "ex": "Does your child have any food allergies?", "id": "w6"}, {"w": "syringe", "ipa": "/səˈrɪndʒ/", "zh": "（喂药用）注射器，喂药器", "ex": "It's easier to give medicine to a baby with a syringe.", "id": "w7"}, {"w": "lethargic", "ipa": "/ləˈθɑːrdʒɪk/", "zh": "无精打采的，昏沉的", "ex": "The heat makes me feel lethargic in the afternoon.", "id": "w8"}, {"w": "pull at", "ipa": "/pʊl æt/", "zh": "拽，扯", "ex": "Babies often pull at their ears when they're teething.", "id": "w9"}], "sections": [{"heading": "1. Describing the Symptoms", "heading_zh": "1. 描述症状", "rows": [[{"id": "s0_0_0", "md": "Hello, come in, have a seat. So what seems to be the problem with this little one?", "text": "Hello, come in, have a seat. So what seems to be the problem with this little one?", "zh": "你好，请进，坐吧。这个小家伙哪里不舒服？", "sp": "B"}], [{"id": "s0_1_0", "md": "**She's had a fever since last night, and she's barely eating anything.**", "text": "She's had a fever since last night, and she's barely eating anything.", "zh": "她从昨晚开始发烧，几乎什么都不吃。", "sp": "A"}], [{"id": "s0_2_0", "md": "How high did her ==temperature== go? Did you give her anything for it?", "text": "How high did her temperature go? Did you give her anything for it?", "zh": "体温最高烧到多少？给她吃过什么药吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "It __went up to__ thirty nine point two. We gave her children's paracetamol at around two in the morning.", "text": "It went up to thirty nine point two. We gave her children's paracetamol at around two in the morning.", "zh": "最高到三十九度二。凌晨两点左右给她吃了儿童退烧药。", "sp": "A"}], [{"id": "s0_4_0", "md": "Okay. Any cough, ==vomiting==, or ==diarrhoea==?", "text": "Okay. Any cough, vomiting, or diarrhoea?", "zh": "好。有咳嗽、呕吐或者拉肚子吗？", "sp": "B"}], [{"id": "s0_5_0", "md": "A bit of a cough, and she threw up once this morning. She also keeps __pulling at__ her left ear.", "text": "A bit of a cough, and she threw up once this morning. She also keeps pulling at her left ear.", "zh": "有点咳嗽，今天早上吐了一次。她还一直拽自己的左耳朵。", "sp": "A"}], [{"id": "s0_6_0", "md": "Let me have a look. Yes, her left ear is red and swollen. It's an ear ==infection==.", "text": "Let me have a look. Yes, her left ear is red and swollen. It's an ear infection.", "zh": "我看一下。对，她左耳又红又肿，是耳朵感染。", "sp": "B"}], [{"id": "s0_7_0", "md": "Is it serious? She goes to childcare. Should I keep her at home?", "text": "Is it serious? She goes to childcare. Should I keep her at home?", "zh": "严重吗？她在上托儿所。要让她在家待着吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "It's very common at this age. Keep her home until she's been fever free for a full day.", "text": "It's very common at this age. Keep her home until she's been fever free for a full day.", "zh": "这个年纪很常见。让她在家待着，等退烧满一整天再去。", "sp": "B"}]]}, {"heading": "2. Getting the Medicine Right", "heading_zh": "2. 把用药弄清楚", "rows": [[{"id": "s1_0_0", "md": "I'll prescribe an ==antibiotic== called amoxicillin, three times a day for a week.", "text": "I'll prescribe an antibiotic called amoxicillin, three times a day for a week.", "zh": "我给她开一种叫阿莫西林的抗生素，一天三次，吃一周。", "sp": "B"}], [{"id": "s1_1_0", "md": "Sorry, before you do that. She had a ==rash== all over her body the last time she took amoxicillin.", "text": "Sorry, before you do that. She had a rash all over her body the last time she took amoxicillin.", "zh": "不好意思，先等一下。她上次吃阿莫西林的时候全身起了疹子。", "sp": "A"}], [{"id": "s1_2_0", "md": "Ah, thank you for telling me. That could be an ==allergy==. I'll note it in her records and give her something different.", "text": "Ah, thank you for telling me. That could be an allergy. I'll note it in her records and give her something different.", "zh": "啊，谢谢你告诉我。那可能是过敏。我记到她的病历里，给她换一种药。", "sp": "B"}], [{"id": "s1_3_0", "md": "**How much should I give her each time, and does it need to be taken with food?**", "text": "How much should I give her each time, and does it need to be taken with food?", "zh": "每次给她吃多少？需要跟饭一起吃吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Five millilitres twice a day, after meals. Use the ==syringe== in the box, not a kitchen spoon.", "text": "Five millilitres twice a day, after meals. Use the syringe in the box, not a kitchen spoon.", "zh": "每次五毫升，一天两次，饭后吃。用盒子里的喂药器，别用厨房的勺子。", "sp": "B"}], [{"id": "s1_5_0", "md": "Got it. And what if she spits it out?", "text": "Got it. And what if she spits it out?", "zh": "明白。那她要是吐出来怎么办？", "sp": "A"}], [{"id": "s1_6_0", "md": "If she spits most of it out right away, give it again. Otherwise, just wait for the next dose.", "text": "If she spits most of it out right away, give it again. Otherwise, just wait for the next dose.", "zh": "如果刚喂就吐掉了大半，就再喂一次。不然就等下一顿。", "sp": "B"}], [{"id": "s1_7_0", "md": "**Should we come back if the fever doesn't come down?**", "text": "Should we come back if the fever doesn't come down?", "zh": "如果烧一直不退，需要再来吗？", "sp": "A"}], [{"id": "s1_8_0", "md": "Yes. If she's still feverish after three days, or she seems unusually ==lethargic==, bring her back straight away.", "t const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
