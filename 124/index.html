const D = {"id": "124", "type": "dialogue", "title": "Taking Your Child to the Doctor", "meta": "B2 · 约 300 词 · 场景：带孩子看发烧与用药", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Doctor", "name_zh": "医生", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "孩子有哪些症状？医生诊断是什么？", "a": "从昨晚发烧，最高三十九度二，吃得很少，有点咳嗽，早上吐了一次，一直拽左耳；诊断是耳朵感染。"}, {"q": "「你」为什么打断医生开药？", "a": "孩子上次吃阿莫西林全身起疹子，可能过敏，医生于是换了别的药并记入病历。"}, {"q": "药怎么吃？什么情况要回来复诊？", "a": "每次五毫升，一天两次，饭后用喂药器喂；三天后还烧或特别没精神就马上回来。"}], "dictation": [{"id": "s0_1_0", "text": "She's had a fever since last night, and she's barely eating anything."}, {"id": "s0_5_0", "text": "A bit of a cough, and she threw up once this morning. She also keeps pulling at her left ear."}, {"id": "s1_3_0", "text": "How much should I give her each time, and does it need to be taken with food?"}, {"id": "s1_1_0", "text": "Sorry, before you do that. She had a rash all over her body the last time she took amoxicillin."}], "shadow": {"speaker": "A", "text": "Sorry, before you do that. She had a rash all over her body the last time she took amoxicillin.", "marked": "<b>Sorry</b>, / before you <b>do</b> that. //<br>She had a <b>rash</b> / all over her <b>body</b> / the <b>last</b> time she took <b>amoxicillin</b>. //"}, "prompts": [{"q": "孩子摔了一跤，额头肿了个包，你打电话问诊所要不要马上带来。说清经过、现在的状态，并问该注意什么。", "ref": "Hi, my son is two. About twenty minutes ago he fell off the sofa and hit his forehead on the floor. He cried straight away, and now there's a big bump, but he's playing normally. He hasn't vomited. Should I bring him in now, or just watch him at home? What signs should I look out for?", "ref_zh": "你好，我儿子两岁。大概二十分钟前他从沙发上摔下来，额头撞到地上。他当时马上就哭了，现在起了个大包，但玩得挺正常，没有吐。我需要现在带他过来，还是在家观察就行？要注意哪些迹象？", "id": "ref0"}, {"q": "医生开了三种药，你记不住。请医生再确认一遍每种药的用法和顺序，并问能不能和退烧药一起吃。", "ref": "Sorry, Doctor, that's a lot to remember. Could we go through them one more time? Which one is for the cough, and which one is for the runny nose? Do they all need to be taken after meals? And if she gets a fever tonight, is it okay to give her paracetamol together with these?", "ref_zh": "不好意思医生，要记的太多了。能再过一遍吗？哪个是治咳嗽的，哪个是治流鼻涕的？都需要饭后吃吗？还有，如果她今晚发烧，可以跟这些药一起吃退烧药吗？", "id": "ref1"}], "words": [{"w": "temperature", "ipa": "/ˈtemprətʃər/", "zh": "体温", "ex": "Let me take your temperature before you see the doctor.", "id": "w0"}, {"w": "vomiting", "ipa": "/ˈvɑːmɪtɪŋ/", "zh": "呕吐", "ex": "If the vomiting doesn't stop, take him to the hospital.", "id": "w1"}, {"w": "diarrhoea", "ipa": "/ˌdaɪəˈriːə/", "zh": "腹泻", "ex": "She's had diarrhoea since she ate that seafood.", "id": "w2"}, {"w": "infection", "ipa": "/ɪnˈfekʃən/", "zh": "感染", "ex": "Keep the cut clean so it doesn't get an infection.", "id": "w3"}, {"w": "antibiotic", "ipa": "/ˌæntibaɪˈɑːtɪk/", "zh": "抗生素", "ex": "Finish the whole course of antibiotics, even if you feel better.", "id": "w4"}, {"w": "rash", "ipa": "/ræʃ/", "zh": "皮疹", "ex": "He got a rash after trying the new soap.", "id": "w5"}, {"w": "allergy", "ipa": "/ˈælərdʒi/", "zh": "过敏", "ex": "Does your child have any food allergies?", "id": "w6"}, {"w": "syringe", "ipa": "/səˈrɪndʒ/", "zh": "（喂药用）注射器，喂药器", "ex": "It's easier to give medicine to a baby with a syringe.", "id": "w7"}, {"w": "lethargic", "ipa": "/ləˈθɑːrdʒɪk/", "zh": "无精打采的，昏沉的", "ex": "The heat makes me feel lethargic in the afternoon.", "id": "w8"}, {"w": "pull at", "ipa": "/pʊl æt/", "zh": "拽，扯", "ex": "Babies often pull at their ears when they're teething.", "id": "w9"}], "sections": [{"heading": "1. Describing the Symptoms", "heading_zh": "1. 描述症状", "rows": [[{"id": "s0_0_0", "md": "Hello, come in, have a seat. So what seems to be the problem with this little one?", "text": "Hello, come in, have a seat. So what seems to be the problem with this little one?", "zh": "你好，请进，坐吧。这个小家伙哪里不舒服？", "sp": "B"}], [{"id": "s0_1_0", "md": "**She's had a fever since last night, and she's barely eating anything.**", "text": "She's had a fever since last night, and she's barely eating anything.", "zh": "她从昨晚开始发烧，几乎什么都不吃。", "sp": "A"}], [{"id": "s0_2_0", "md": "How high did her ==temperature== go? Did you give her anything for it?", "text": "How high did her temperature go? Did you give her anything for it?", "zh": "体温最高烧到多少？给她吃过什么药吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "It __went up to__ thirty nine point two. We gave her children's paracetamol at around two in the morning.", "text": "It went up to thirty nine point two. We gave her children's paracetamol at around two in the morning.", "zh": "最高到三十九度二。凌晨两点左右给她吃了儿童退烧药。", "sp": "A"}], [{"id": "s0_4_0", "md": "Okay. Any cough, ==vomiting==, or ==diarrhoea==?", "text": "Okay. Any cough, vomiting, or diarrhoea?", "zh": "好。有咳嗽、呕吐或者拉肚子吗？", "sp": "B"}], [{"id": "s0_5_0", "md": "A bit of a cough, and she threw up once this morning. She also keeps __pulling at__ her left ear.", "text": "A bit of a cough, and she threw up once this morning. She also keeps pulling at her left ear.", "zh": "有点咳嗽，今天早上吐了一次。她还一直拽自己的左耳朵。", "sp": "A"}], [{"id": "s0_6_0", "md": "Let me have a look. Yes, her left ear is red and swollen. It's an ear ==infection==.", "text": "Let me have a look. Yes, her left ear is red and swollen. It's an ear infection.", "zh": "我看一下。对，她左耳又红又肿，是耳朵感染。", "sp": "B"}], [{"id": "s0_7_0", "md": "Is it serious? She goes to childcare. Should I keep her at home?", "text": "Is it serious? She goes to childcare. Should I keep her at home?", "zh": "严重吗？她在上托儿所。要让她在家待着吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "It's very common at this age. Keep her home until she's been fever free for a full day.", "text": "It's very common at this age. Keep her home until she's been fever free for a full day.", "zh": "这个年纪很常见。让她在家待着，等退烧满一整天再去。", "sp": "B"}]]}, {"heading": "2. Getting the Medicine Right", "heading_zh": "2. 把用药弄清楚", "rows": [[{"id": "s1_0_0", "md": "I'll prescribe an ==antibiotic== called amoxicillin, three times a day for a week.", "text": "I'll prescribe an antibiotic called amoxicillin, three times a day for a week.", "zh": "我给她开一种叫阿莫西林的抗生素，一天三次，吃一周。", "sp": "B"}], [{"id": "s1_1_0", "md": "Sorry, before you do that. She had a ==rash== all over her body the last time she took amoxicillin.", "text": "Sorry, before you do that. She had a rash all over her body the last time she took amoxicillin.", "zh": "不好意思，先等一下。她上次吃阿莫西林的时候全身起了疹子。", "sp": "A"}], [{"id": "s1_2_0", "md": "Ah, thank you for telling me. That could be an ==allergy==. I'll note it in her records and give her something different.", "text": "Ah, thank you for telling me. That could be an allergy. I'll note it in her records and give her something different.", "zh": "啊，谢谢你告诉我。那可能是过敏。我记到她的病历里，给她换一种药。", "sp": "B"}], [{"id": "s1_3_0", "md": "**How much should I give her each time, and does it need to be taken with food?**", "text": "How much should I give her each time, and does it need to be taken with food?", "zh": "每次给她吃多少？需要跟饭一起吃吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Five millilitres twice a day, after meals. Use the ==syringe== in the box, not a kitchen spoon.", "text": "Five millilitres twice a day, after meals. Use the syringe in the box, not a kitchen spoon.", "zh": "每次五毫升，一天两次，饭后吃。用盒子里的喂药器，别用厨房的勺子。", "sp": "B"}], [{"id": "s1_5_0", "md": "Got it. And what if she spits it out?", "text": "Got it. And what if she spits it out?", "zh": "明白。那她要是吐出来怎么办？", "sp": "A"}], [{"id": "s1_6_0", "md": "If she spits most of it out right away, give it again. Otherwise, just wait for the next dose.", "text": "If she spits most of it out right away, give it again. Otherwise, just wait for the next dose.", "zh": "如果刚喂就吐掉了大半，就再喂一次。不然就等下一顿。", "sp": "B"}], [{"id": "s1_7_0", "md": "**Should we come back if the fever doesn't come down?**", "text": "Should we come back if the fever doesn't come down?", "zh": "如果烧一直不退，需要再来吗？", "sp": "A"}], [{"id": "s1_8_0", "md": "Yes. If she's still feverish after three days, or she seems unusually ==lethargic==, bring her back straight away.", "t const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
