<script>
const D = {"id": "069", "title": "Telling Customers What Went Wrong", "meta": "B2 · 约 270 词 · 场景：对外故障说明", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What Customers Actually Want", "heading_zh": "1. 客户真正想要什么", "rows": [[{"id": "s0_0_0", "md": "After a serious outage, the hardest message to write is the one that goes to customers.", "text": "After a serious outage, the hardest message to write is the one that goes to customers.", "zh": "一次严重故障之后，最难写的就是发给客户的那封信。", "sp": null}, {"id": "s0_0_1", "md": "The ==temptation== is to say as little as possible.", "text": "The temptation is to say as little as possible.", "zh": "最大的诱惑是能少说就少说。", "sp": null}, {"id": "s0_0_2", "md": "Phrases like \"some users may have experienced issues\" feel safe to legal teams and frustrating to everyone else.", "text": "Phrases like \"some users may have experienced issues\" feel safe to legal teams and frustrating to everyone else.", "zh": "像「部分用户可能遇到了问题」这种说法，法务觉得稳妥，其他人看了只会窝火。", "sp": null}], [{"id": "s0_1_0", "md": "Customers rarely expect a system that never fails.", "text": "Customers rarely expect a system that never fails.", "zh": "客户很少指望系统永远不出问题。", "sp": null}, {"id": "s0_1_1", "md": "What they expect is honesty about what happened and confidence that it won't happen the same way again.", "text": "What they expect is honesty about what happened and confidence that it won't happen the same way again.", "zh": "他们期待的是你坦诚说明发生了什么，并且相信同样的事不会再以同样的方式发生。", "sp": null}, {"id": "s0_1_2", "md": "**People forgive an outage much faster than they forgive feeling misled.**", "text": "People forgive an outage much faster than they forgive feeling misled.", "zh": "人们原谅一次故障，比原谅被糊弄的感觉要快得多。", "sp": null}], [{"id": "s0_2_0", "md": "==Evasive== language also creates more work, not less.", "text": "Evasive language also creates more work, not less.", "zh": "闪烁其词的措辞也只会带来更多工作，而不是更少。", "sp": null}, {"id": "s0_2_1", "md": "Support teams get flooded with tickets asking the exact questions your message ==dodged==.", "text": "Support teams get flooded with tickets asking the exact questions your message dodged.", "zh": "客服会被工单淹没，问的恰恰是你那封信回避掉的问题。", "sp": null}, {"id": "s0_2_2", "md": "Every vague sentence you save in the statement comes back as fifty angry emails.", "text": "Every vague sentence you save in the statement comes back as fifty angry emails.", "zh": "声明里你每省掉一句含糊话，最后都会变成五十封愤怒的邮件找回来。", "sp": null}]]}, {"heading": "2. Own It, Explain It, Fix It", "heading_zh": "2. 认下来、讲清楚、改到位", "rows": [[{"id": "s1_0_0", "md": "Start by __taking ownership__ in the first sentence.", "text": "Start by taking ownership in the first sentence.", "zh": "第一句话就把责任认下来。", "sp": null}, {"id": "s1_0_1", "md": "\"Yesterday, between two and four in the afternoon, many of you could not log in, and that was our fault.\"", "text": "\"Yesterday, between two and four in the afternoon, many of you could not log in, and that was our fault.\"", "zh": "「昨天下午两点到四点，很多用户无法登录，这是我们的责任。」", "sp": null}, {"id": "s1_0_2", "md": "Active voice and a clear time window show that you are not hiding.", "text": "Active voice and a clear time window show that you are not hiding.", "zh": "用主动语态，加上清晰的时间窗口，表明你没有在藏着掖着。", "sp": null}], [{"id": "s1_1_0", "md": "Then explain the cause in plain language, without internal jargon.", "text": "Then explain the cause in plain language, without internal jargon.", "zh": "然后用大白话解释原因，不要用内部黑话。", "sp": null}, {"id": "s1_1_1", "md": "\"A configuration change sent all login traffic to a single server, which became ==overloaded==.\"", "text": "\"A configuration change sent all login traffic to a single server, which became overloaded.\"", "zh": "「一次配置变更把所有登录流量都打到了一台服务器上，导致它过载。」", "sp": null}, {"id": "s1_1_2", "md": "Customers do not need the full technical story, but they need enough to believe you understand it.", "text": "Customers do not need the full technical story, but they need enough to believe you understand it.", "zh": "客户不需要完整的技术细节，但需要足够的信息来相信你搞明白了。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, list what you have already changed, not just what you will ==investigate==.", "text": "Finally, list what you have already changed, not just what you will investigate.", "zh": "最后，列出你已经改了什么，而不只是你打算调查什么。", "sp": null}, {"id": "s1_2_1", "md": "Concrete steps, like extra checks before every configuration change, are far more ==reassuring== than promises to __do better__.", "text": "Concrete steps, like extra checks before every configuration change, are far more reassuring than promises to do better.", "zh": "具体的措施，比如每次配置变更前增加检查，比承诺「我们会做得更好」让人安心得多。", "sp": null}, {"id": "s1_2_2", "md": "**An apology without a specific change is just a nicer way of saying nothing.**", "text": "An apology without a specific change is just a nicer way of saying nothing.", "zh": "没有具体改动的道歉，只是一种更好听的什么都没说。", "sp": null}], [{"id": "s1_3_0", "md": "Send the message within a day, while customers are still paying attention.", "text": "Send the message within a day, while customers are still paying attention.", "zh": "一天之内把信发出去，趁客户还在关注。", "sp": null}, {"id": "s1_3_1", "md": "A perfect explanation two weeks later reads like an afterthought, even if every detail in it is right.", "text": "A perfect explanation two weeks later reads like an afterthought, even if every detail in it is right.", "zh": "两周后才发一份完美的解释，读起来就像事后补的，哪怕里面每个细节都是对的。", "sp": null}]]}], "gist": [{"q": "写给客户的故障说明，常见的诱惑是什么？为什么不好？", "a": "尽量少说、用含糊措辞；客户会觉得被误导，客服还会被追问同样问题的工单淹没。"}, {"q": "客户真正想从故障说明里得到什么？", "a": "诚实说明发生了什么，并相信同样的问题不会以同样方式再发生。"}, {"q": "一份好的说明包含哪三步？", "a": "第一句就承担责任（主动语态+明确时间段）；用大白话解释原因；列出已经做出的具体改变，而不只是承诺调查。"}], "dictation": [{"id": "s0_1_2", "text": "People forgive an outage much faster than they forgive feeling misled."}, {"id": "s1_0_2", "text": "Active voice and a clear time window show that you are not hiding."}, {"id": "s1_1_2", "text": "Customers do not need the full technical story, but they need enough to believe you understand it."}, {"id": "s1_2_2", "text": "An apology without a specific change is just a nicer way of saying nothing."}], "shadow": {"text": "Customers rarely expect a system that never fails. What they expect is honesty about what happened and confidence that it won't happen the same way again. People forgive an outage much faster than they forgive feeling misled.", "marked": "Customers <b>rarely</b> expect a system / that <b>never</b> fails. //<br>What they <b>expect</b> / is <b>honesty</b> about what happened / and <b>confidence</b> / that it won't happen the <b>same</b> way again. //<br>People <b>forgive</b> an outage / much <b>faster</b> / than they forgive feeling <b>misled</b>. //"}, "prompts": [{"q": "昨天的同步故障影响了一个大客户。你和对方负责人开电话会，用 30 秒说明发生了什么、原因和已做的改变。", "ref": "Thanks for making time. I want to be direct: yesterday, from nine to eleven in the morning, your team's files didn't sync, and that was our fault. A database upgrade on our side slowed every write request until they timed out. We've already rolled it back, and we've added a load test that every upgrade must pass first. I'm sorry for the disruption to your team.", "ref_zh": "谢谢您抽时间。我直说吧：昨天上午九点到十一点，贵团队的文件没有同步，这是我们的责任。我们这边的一次数据库升级拖慢了所有写请求，直到超时。我们已经回滚了，并且加了一项压测，以后每次升级都必须先通过。给您团队带来的影响，我很抱歉。", "id": "ref0"}, {"q": "法务给的对外声明草稿写着“部分用户可能遇到了问题”。用 30 秒说服他们改得更直接。", "ref": "I understand why the draft is careful, and I don't want us to admit anything we can't support. But 'some users may have experienced issues' will make customers angrier, because they know exactly what happened to them. If we state the time window and say clearly that it was our configuration error, support gets fewer tickets, and we look honest. Can we review a more direct version together?", "ref_zh": "我理解这份草稿为什么写得这么谨慎，我也不希望我们承认任何站不住的东西。但「部分用户可能遇到了问题」只会让客户更生气，因为他们很清楚自己遇到了什么。如果我们写明时间窗口，并清楚说明是我们的配置错误，客服工单会更少，我们也显得坦诚。我们能一起过一下一个更直接的版本吗？", "id": "ref1"}], "words": [{"w": "temptation", "ipa": "/tempˈteɪʃən/", "zh": "诱惑、冲动", "ex": "There's a temptation to blame the cloud provider, but the bug was ours.", "id": "w0"}, {"w": "evasive", "ipa": "/ɪˈveɪsɪv/", "zh": "含糊其辞的、回避的", "ex": "The vendor gave an evasive answer about their uptime last quarter.", "id": "w1"}, {"w": "dodge (v.)", "ipa": "/dɑːdʒ/", "zh": "回避、躲开（问题）", "ex": "He dodged the question about the delay and talked about new features.", "tts_w": "dodge", "id": "w2"}, {"w": "overloaded", "ipa": "/ˌoʊvərˈloʊdɪd/", "zh": "过载的", "ex": "The search cluster got overloaded when the campaign went live.", "id": "w3"}, {"w": "investigate", "ipa": "/ɪnˈvestɪˌɡeɪt/", "zh": "调查、排查", "ex": "We're still investigating why only Android users were affected.", "id": "w4"}, {"w": "reassuring", "ipa": "/ˌriːəˈʃʊrɪŋ/", "zh": "令人安心的", "ex": "It was reassuring to see the error rate drop right after the fix.", "id": "w5"}, {"w": "jargon", "ipa": "/ˈdʒɑːrɡən/", "zh": "行话、术语", "ex": "Please cut the jargon before this goes to the customer.", "id": "w6"}, {"w": "ownership", "ipa": "/ˈoʊnərˌʃɪp/", "zh": "担当、主人翁意识", "ex": "I like how she took ownership of the incident review.", "id": "w7"}, {"w": "mislead", "ipa": "/mɪsˈliːd/", "zh": "误导", "ex": "That chart could mislead people because the axis doesn't start at zero.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. What Customers Actually Want", "zh": "1. 客户真正想要什么", "start": 0.0, "end": 2.568, "words": [[0.105, 0.329], [0.724, 0.882], [0.895, 1.382], [1.395, 1.79], [1.803, 2.184]]}, {"kind": "s", "id": "s0_0_0", "md": "After a serious outage, the hardest message to write is the one that goes to customers.", "zh": "一次严重故障之后，最难写的就是发给客户的那封信。", "sp": null, "gap": false, "start": 2.568, "end": 8.256, "words": [[2.673, 2.976], [2.989, 3.042], [3.055, 3.581], [3.594, 4.134], [4.331, 4.41], [4.423, 4.857], [4.871, 5.265], [5.279, 5.397], [5.41, 5.792], [5.884, 6.015], [6.029, 6.147], [6.16, 6.568], [6.581, 6.752], [6.765, 7.042], [7.055, 7.147], [7.16, 7.857]]}, {"kind": "s", "id": "s0_0_1", "md": "The ==temptation== is to say as little as possible.", "zh": "最大的诱惑是能少说就少说。", "sp" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());

function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
