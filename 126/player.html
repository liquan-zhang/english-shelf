<script>
const D = {"id": "126", "type": "dialogue", "title": "Viewing an Apartment", "meta": "B2 · 约 320 词 · 场景：看房问条件与谈租金", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Property Agent", "name_zh": "房产中介", "voice": "en-AU-NatashaNeural"}}, "gist": [{"q": "房子开价多少？包括什么、不包括什么？", "a": "月租四千二，全家具，不包括水电煤；水电煤大概每月两百。"}, {"q": "「你」在看房时问了哪些和孩子有关、和房况有关的问题？", "a": "问了小区有没有游乐场、附近有没有走路能到的幼儿园；还指出浴室天花板发霉，要求入住前处理。"}, {"q": "最后谈成了什么条件？", "a": "签两年，月租四千一，搬走旧沙发、处理霉斑，租约里加外交条款；下一步签意向书、付一个月诚意金。"}], "dictation": [{"id": "s0_3_0", "text": "Roughly how much are the utilities for a family of three?"}, {"id": "s0_7_0", "text": "We have a toddler. Is there a playground in the condo, and any preschools within walking distance?"}, {"id": "s1_1_0", "text": "Would the landlord consider four thousand if we sign for two years?"}, {"id": "s1_5_0", "text": "Yes, I'd like a diplomatic clause, in case my company relocates me."}], "shadow": {"speaker": "A", "text": "I understand. We can move in on the first of next month, and we don't have any pets.", "marked": "I <b>understand</b>. //<br>We can move in / on the <b>first</b> of next month, / and we <b>don't</b> have any <b>pets</b>. //"}, "prompts": [{"q": "看房时你发现厨房没有洗衣机、主卧空调很旧。跟中介提出，希望房东在入住前解决，并问谁负责空调保养。", "ref": "I like the layout, but there are a couple of things. There's no washing machine in the kitchen, and the air con in the master bedroom looks quite old. Could the landlord put in a washing machine and service the air con before we move in? Also, who's responsible for the regular air con servicing during the lease?", "ref_zh": "我喜欢这个格局，但有几点。厨房没有洗衣机，主卧的空调看起来很旧了。房东能在我们入住前装一台洗衣机、把空调保养一下吗？另外，租期内空调定期保养由谁负责？", "id": "ref0"}, {"q": "中介说房东不肯降价。你换个角度谈：不降价的话，能不能多给点别的条件。", "ref": "Okay, I understand he won't go lower on the rent. In that case, could we ask for something else instead? For example, could he include the internet, or give us two weeks rent free while we move in? We're a quiet family and happy to sign for two years, so we'd be reliable tenants.", "ref_zh": "好，我理解他租金不肯再降。那我们能不能换点别的？比如包网费，或者入住时给两周免租期？我们是很安静的家庭，也愿意签两年，会是很靠谱的租客。", "id": "ref1"}], "words": [{"w": "fully furnished", "ipa": "/ˈfʊli ˈfɜːrnɪʃt/", "zh": "全家具的", "ex": "We're looking for a fully furnished flat near the MRT.", "id": "w0"}, {"w": "utilities", "ipa": "/juːˈtɪlətiz/", "zh": "水电煤等公用事业费", "ex": "Our utilities went up a lot during the hot months.", "id": "w1"}, {"w": "lease", "ipa": "/liːs/", "zh": "租约，租期", "ex": "Our lease ends in March, so we need to decide soon.", "id": "w2"}, {"w": "mould", "ipa": "/moʊld/", "zh": "霉，霉斑", "ex": "Open the windows, or mould will grow in the bathroom.", "id": "w3"}, {"w": "tenancy agreement", "ipa": "/ˈtenənsi əˌɡriːmənt/", "zh": "租赁合同", "ex": "Read the tenancy agreement carefully before you sign.", "id": "w4"}, {"w": "diplomatic clause", "ipa": "/ˌdɪpləˈmætɪk klɔːz/", "zh": "外交条款（工作调动可提前解约）", "ex": "Most expats ask for a diplomatic clause in their lease.", "id": "w5"}, {"w": "relocate", "ipa": "/ˌriːˈloʊkeɪt/", "zh": "调动，搬迁", "ex": "Her company relocated her to Tokyo last year.", "id": "w6"}, {"w": "letter of intent", "ipa": "/ˈletər əv ɪnˈtent/", "zh": "意向书", "ex": "We signed the letter of intent the same day.", "id": "w7"}, {"w": "good faith deposit", "ipa": "/ɡʊd feɪθ dɪˈpɑːzɪt/", "zh": "诚意金", "ex": "The good faith deposit becomes part of the security deposit.", "id": "w8"}, {"w": "break the lease", "ipa": "/breɪk ðə liːs/", "zh": "提前解约", "ex": "If you break the lease early, you may lose your deposit.", "id": "w9"}], "sections": [{"heading": "1. Looking Around the Unit", "heading_zh": "1. 看房", "rows": [[{"id": "s0_0_0", "md": "So this is the living room. It gets the morning sun, and the unit is ==fully furnished==.", "text": "So this is the living room. It gets the morning sun, and the unit is fully furnished.", "zh": "这是客厅。早上有阳光，房子是全家具的。", "sp": "B"}], [{"id": "s0_1_0", "md": "It's nice and bright. How much is the rent __per month__?", "text": "It's nice and bright. How much is the rent per month?", "zh": "挺亮堂的。月租多少？", "sp": "A"}], [{"id": "s0_2_0", "md": "The landlord is asking four thousand two hundred. That doesn't include ==utilities==.", "text": "The landlord is asking four thousand two hundred. That doesn't include utilities.", "zh": "房东开价四千二。不包括水电煤。", "sp": "B"}], [{"id": "s0_3_0", "md": "**Roughly how much are the utilities for a family of three?**", "text": "Roughly how much are the utilities for a family of three?", "zh": "一家三口，水电煤大概每月多少？", "sp": "A"}], [{"id": "s0_4_0", "md": "Most tenants pay around two hundred a month, a bit more if you run the air con all night.", "text": "Most tenants pay around two hundred a month, a bit more if you run the air con all night.", "zh": "大部分租客每月两百左右，要是空调整晚开会多一点。", "sp": "B"}], [{"id": "s0_5_0", "md": "And what's the minimum ==lease== period?", "text": "And what's the minimum lease period?", "zh": "最短租期是多久？", "sp": "A"}], [{"id": "s0_6_0", "md": "Two years ideally, but the landlord might consider one year at a slightly higher rent.", "text": "Two years ideally, but the landlord might consider one year at a slightly higher rent.", "zh": "最好两年，不过一年的话房东可能也会考虑，只是租金稍高。", "sp": "B"}], [{"id": "s0_7_0", "md": "We have a toddler. Is there a playground in the condo, and any preschools __within walking distance__?", "text": "We have a toddler. Is there a playground in the condo, and any preschools within walking distance?", "zh": "我们有个小娃。公寓里有游乐场吗？走路能到的幼儿园有吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "There's a playground next to the pool, and two preschools about five minutes away.", "text": "There's a playground next to the pool, and two preschools about five minutes away.", "zh": "泳池旁边有个游乐场，五分钟路程有两家幼儿园。", "sp": "B"}], [{"id": "s0_9_0", "md": "Good. I noticed some ==mould== on the bathroom ceiling. Would that be fixed before we move in?", "text": "Good. I noticed some mould on the bathroom ceiling. Would that be fixed before we move in?", "zh": "好的。我看到浴室天花板有点发霉。入住前能处理好吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "I'll raise it with the landlord. I'm sure he'd be happy to __sort it out__.", "text": "I'll raise it with the landlord. I'm sure he'd be happy to sort it out.", "zh": "我跟房东提一下。他应该很乐意处理。", "sp": "B"}]]}, {"heading": "2. Making an Offer", "heading_zh": "2. 出价", "rows": [[{"id": "s1_0_0", "md": "We really like the place, and we'd like to make an offer.", "text": "We really like the place, and we'd like to make an offer.", "zh": "我们很喜欢这套房，想出个价。", "sp": "A"}], [{"id": "s1_1_0", "md": "**Would the landlord consider four thousand if we sign for two years?**", "text": "Would the landlord consider four thousand if we sign for two years?", "zh": "如果签两年，房东能接受四千吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "That's a fair bit lower. I can __put it to him__, but he's had a few other viewings this week.", "text": "That's a fair bit lower. I can put it to him, but he's had a few other viewings this week.", "zh": "这低了不少。我可以帮你转达，不过这周还有别人来看过。", "sp": "B"}], [{"id": "s1_3_0", "md": "I understand. We can move in on the first of next month, and we don't have any pets.", "text": "I understand. We can move in on the first of next month, and we don't have any pets.", "zh": "理解。我们下个月一号就能入住，而且没养宠物。", "sp": "A"}], [{"id": "s1_4_0", "md": "That helps. Is there anything else you'd want in the ==tenancy agreement==?", "text": "That helps. Is there anything else you'd want in the tenancy agreement?", "zh": "这是加分项。租约里你们还想加什么条款吗？", "sp": "B"}], [{"id": "s1_5_0", "md": "Yes, I'd like a ==diplomatic clause==, in case my company ==relocates== me.", "text": "Yes, I'd like a diplomatic clause, in case my company relocates me.", "zh": "有，我想加一个外交条款，以防公司把我调走。", "sp": "A"}], [{"id": "s1_6_0", "md": "That's pretty standard. It usually lets you __break the lease__ after twelve months with two months' notice.", "text": "That's pretty standard. It usually lets you break the lease after twelve months with two months' notice.", "zh": "这挺常见的。一般是满十二个月 const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };

zhOn(localStorage.getItem('wb:zh') !== '0');

  if (e.target.tagName === 'SELECT') return;

});
