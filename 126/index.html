<script>
const D = {"id": "126", "type": "dialogue", "title": "Viewing an Apartment", "meta": "B2 · 约 320 词 · 场景：看房问条件与谈租金", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Property Agent", "name_zh": "房产中介", "voice": "en-AU-NatashaNeural"}}, "gist": [{"q": "房子开价多少？包括什么、不包括什么？", "a": "月租四千二，全家具，不包括水电煤；水电煤大概每月两百。"}, {"q": "「你」在看房时问了哪些和孩子有关、和房况有关的问题？", "a": "问了小区有没有游乐场、附近有没有走路能到的幼儿园；还指出浴室天花板发霉，要求入住前处理。"}, {"q": "最后谈成了什么条件？", "a": "签两年，月租四千一，搬走旧沙发、处理霉斑，租约里加外交条款；下一步签意向书、付一个月诚意金。"}], "dictation": [{"id": "s0_3_0", "text": "Roughly how much are the utilities for a family of three?"}, {"id": "s0_7_0", "text": "We have a toddler. Is there a playground in the condo, and any preschools within walking distance?"}, {"id": "s1_1_0", "text": "Would the landlord consider four thousand if we sign for two years?"}, {"id": "s1_5_0", "text": "Yes, I'd like a diplomatic clause, in case my company relocates me."}], "shadow": {"speaker": "A", "text": "I understand. We can move in on the first of next month, and we don't have any pets.", "marked": "I <b>understand</b>. //<br>We can move in / on the <b>first</b> of next month, / and we <b>don't</b> have any <b>pets</b>. //"}, "prompts": [{"q": "看房时你发现厨房没有洗衣机、主卧空调很旧。跟中介提出，希望房东在入住前解决，并问谁负责空调保养。", "ref": "I like the layout, but there are a couple of things. There's no washing machine in the kitchen, and the air con in the master bedroom looks quite old. Could the landlord put in a washing machine and service the air con before we move in? Also, who's responsible for the regular air con servicing during the lease?", "ref_zh": "我喜欢这个格局，但有几点。厨房没有洗衣机，主卧的空调看起来很旧了。房东能在我们入住前装一台洗衣机、把空调保养一下吗？另外，租期内空调定期保养由谁负责？", "id": "ref0"}, {"q": "中介说房东不肯降价。你换个角度谈：不降价的话，能不能多给点别的条件。", "ref": "Okay, I understand he won't go lower on the rent. In that case, could we ask for something else instead? For example, could he include the internet, or give us two weeks rent free while we move in? We're a quiet family and happy to sign for two years, so we'd be reliable tenants.", "ref_zh": "好，我理解他租金不肯再降。那我们能不能换点别的？比如包网费，或者入住时给两周免租期？我们是很安静的家庭，也愿意签两年，会是很靠谱的租客。", "id": "ref1"}], "words": [{"w": "fully furnished", "ipa": "/ˈfʊli ˈfɜːrnɪʃt/", "zh": "全家具的", "ex": "We're looking for a fully furnished flat near the MRT.", "id": "w0"}, {"w": "utilities", "ipa": "/juːˈtɪlətiz/", "zh": "水电煤等公用事业费", "ex": "Our utilities went up a lot during the hot months.", "id": "w1"}, {"w": "lease", "ipa": "/liːs/", "zh": "租约，租期", "ex": "Our lease ends in March, so we need to decide soon.", "id": "w2"}, {"w": "mould", "ipa": "/moʊld/", "zh": "霉，霉斑", "ex": "Open the windows, or mould will grow in the bathroom.", "id": "w3"}, {"w": "tenancy agreement", "ipa": "/ˈtenənsi əˌɡriːmənt/", "zh": "租赁合同", "ex": "Read the tenancy agreement carefully before you sign.", "id": "w4"}, {"w": "diplomatic clause", "ipa": "/ˌdɪpləˈmætɪk klɔːz/", "zh": "外交条款（工作调动可提前解约）", "ex": "Most expats ask for a diplomatic clause in their lease.", "id": "w5"}, {"w": "relocate", "ipa": "/ˌriːˈloʊkeɪt/", "zh": "调动，搬迁", "ex": "Her company relocated her to Tokyo last year.", "id": "w6"}, {"w": "letter of intent", "ipa": "/ˈletər əv ɪnˈtent/", "zh": "意向书", "ex": "We signed the letter of intent the same day.", "id": "w7"}, {"w": "good faith deposit", "ipa": "/ɡʊd feɪθ dɪˈpɑːzɪt/", "zh": "诚意金", "ex": "The good faith deposit becomes part of the security deposit.", "id": "w8"}, {"w": "break the lease", "ipa": "/breɪk ðə liːs/", "zh": "提前解约", "ex": "If you break the lease early, you may lose your deposit.", "id": "w9"}], "sections": [{"heading": "1. Looking Around the Unit", "heading_zh": "1. 看房", "rows": [[{"id": "s0_0_0", "md": "So this is the living room. It gets the morning sun, and the unit is ==fully furnished==.", "text": "So this is the living room. It gets the morning sun, and the unit is fully furnished.", "zh": "这是客厅。早上有阳光，房子是全家具的。", "sp": "B"}], [{"id": "s0_1_0", "md": "It's nice and bright. How much is the rent __per month__?", "text": "It's nice and bright. How much is the rent per month?", "zh": "挺亮堂的。月租多少？", "sp": "A"}], [{"id": "s0_2_0", "md": "The landlord is asking four thousand two hundred. That doesn't include ==utilities==.", "text": "The landlord is asking four thousand two hundred. That doesn't include utilities.", "zh": "房东开价四千二。不包括水电煤。", "sp": "B"}], [{"id": "s0_3_0", "md": "**Roughly how much are the utilities for a family of three?**", "text": "Roughly how much are the utilities for a family of three?", "zh": "一家三口，水电煤大概每月多少？", "sp": "A"}], [{"id": "s0_4_0", "md": "Most tenants pay around two hundred a month, a bit more if you run the air con all night.", "text": "Most tenants pay around two hundred a month, a bit more if you run the air con all night.", "zh": "大部分租客每月两百左右，要是空调整晚开会多一点。", "sp": "B"}], [{"id": "s0_5_0", "md": "And what's the minimum ==lease== period?", "text": "And what's the minimum lease period?", "zh": "最短租期是多久？", "sp": "A"}], [{"id": "s0_6_0", "md": "Two years ideally, but the landlord might consider one year at a slightly higher rent.", "text": "Two years ideally, but the landlord might consider one year at a slightly higher rent.", "zh": "最好两年，不过一年的话房东可能也会考虑，只是租金稍高。", "sp": "B"}], [{"id": "s0_7_0", "md": "We have a toddler. Is there a playground in the condo, and any preschools __within walking distance__?", "text": "We have a toddler. Is there a playground in the condo, and any preschools within walking distance?", "zh": "我们有个小娃。公寓里有游乐场吗？走路能到的幼儿园有吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "There's a playground next to the pool, and two preschools about five minutes away.", "text": "There's a playground next to the pool, and two preschools about five minutes away.", "zh": "泳池旁边有个游乐场，五分钟路程有两家幼儿园。", "sp": "B"}], [{"id": "s0_9_0", "md": "Good. I noticed some ==mould== on the bathroom ceiling. Would that be fixed before we move in?", "text": "Good. I noticed some mould on the bathroom ceiling. Would that be fixed before we move in?", "zh": "好的。我看到浴室天花板有点发霉。入住前能处理好吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "I'll raise it with the landlord. I'm sure he'd be happy to __sort it out__.", "text": "I'll raise it with the landlord. I'm sure he'd be happy to sort it out.", "zh": "我跟房东提一下。他应该很乐意处理。", "sp": "B"}]]}, {"heading": "2. Making an Offer", "heading_zh": "2. 出价", "rows": [[{"id": "s1_0_0", "md": "We really like the place, and we'd like to make an offer.", "text": "We really like the place, and we'd like to make an offer.", "zh": "我们很喜欢这套房，想出个价。", "sp": "A"}], [{"id": "s1_1_0", "md": "**Would the landlord consider four thousand if we sign for two years?**", "text": "Would the landlord consider four thousand if we sign for two years?", "zh": "如果签两年，房东能接受四千吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "That's a fair bit lower. I can __put it to him__, but he's had a few other viewings this week.", "text": "That's a fair bit lower. I can put it to him, but he's had a few other viewings this week.", "zh": "这低了不少。我可以帮你转达，不过这周还有别人来看过。", "sp": "B"}], [{"id": "s1_3_0", "md": "I understand. We can move in on the first of next month, and we don't have any pets.", "text": "I understand. We can move in on the first of next month, and we don't have any pets.", "zh": "理解。我们下个月一号就能入住，而且没养宠物。", "sp": "A"}], [{"id": "s1_4_0", "md": "That helps. Is there anything else you'd want in the ==tenancy agreement==?", "text": "That helps. Is there anything else you'd want in the tenancy agreement?", "zh": "这是加分项。租约里你们还想加什么条款吗？", "sp": "B"}], [{"id": "s1_5_0", "md": "Yes, I'd like a ==diplomatic clause==, in case my company ==relocates== me.", "text": "Yes, I'd like a diplomatic clause, in case my company relocates me.", "zh": "有，我想加一个外交条款，以防公司把我调走。", "sp": "A"}], [{"id": "s1_6_0", "md": "That's pretty standard. It usually lets you __break the lease__ after twelve months with two months' notice.", "text": "That's pretty standard. It usually lets you break the lease after twelve months with two months' notice.", "zh": "这挺常见的。一般是满十二个月 const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
