<script>
const D = {"id": "008", "title": "Disagreeing with a Senior Leader in Public", "meta": "B2 · 约 280 词 · 场景：向上表达异议", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What Leaders Say in Private", "heading_zh": "1. 领导私下怎么说", "rows": [[{"id": "s0_0_0", "md": "Ask senior leaders what frustrates them, and many give the same answer.", "text": "Ask senior leaders what frustrates them, and many give the same answer.", "zh": "问高层领导最让他们头疼的是什么，很多人的回答都一样。", "sp": null}, {"id": "s0_0_1", "md": "\"Nobody tells me when my idea is bad until it's too late.\"", "text": "\"Nobody tells me when my idea is bad until it's too late.\"", "zh": "「我的想法不行，没人告诉我，直到为时已晚。」", "sp": null}, {"id": "s0_0_2", "md": "The higher you go, the more people __filter what they say__, and the less ==accurate== your picture of reality becomes.", "text": "The higher you go, the more people filter what they say, and the less accurate your picture of reality becomes.", "zh": "位置越高，大家说话就越会过滤，你对现实的判断也就越失真。", "sp": null}], [{"id": "s0_1_0", "md": "So most leaders do want pushback.", "text": "So most leaders do want pushback.", "zh": "所以大多数领导其实是想要反对意见的。", "sp": null}, {"id": "s0_1_1", "md": "What they do not want is to lose face in front of a large group, or to feel ==ambushed== by a surprise attack on their plan.", "text": "What they do not want is to lose face in front of a large group, or to feel ambushed by a surprise attack on their plan.", "zh": "他们不想要的，是当着一大群人丢面子，或者被一场针对自己方案的突然袭击打个措手不及。", "sp": null}, {"id": "s0_1_2", "md": "**The problem is rarely that you disagree; it is how and where you do it.**", "text": "The problem is rarely that you disagree; it is how and where you do it.", "zh": "问题很少在于你不同意，而在于你怎么表达、在哪儿表达。", "sp": null}], [{"id": "s0_2_0", "md": "Public disagreement with a senior person is not about being brave.", "text": "Public disagreement with a senior person is not about being brave.", "zh": "当众反对一位高层，跟勇不勇敢没关系。", "sp": null}, {"id": "s0_2_1", "md": "It is about making it easy for them to change their mind without looking ==weak==.", "text": "It is about making it easy for them to change their mind without looking weak.", "zh": "关键是让对方能轻松改变主意，又不显得软弱。", "sp": null}]]}, {"heading": "2. Give Them a Door, Not a Wall", "heading_zh": "2. 给他们一扇门，而不是一堵墙", "rows": [[{"id": "s1_0_0", "md": "Start by asking for room.", "text": "Start by asking for room.", "zh": "先请求一个发言的空间。", "sp": null}, {"id": "s1_0_1", "md": "\"Can I offer a different view on the timeline?\"", "text": "\"Can I offer a different view on the timeline?\"", "zh": "「关于时间线，我能提一个不同的看法吗？」", "sp": null}, {"id": "s1_0_2", "md": "It takes two seconds, and it __signals respect__ while still letting you speak.", "text": "It takes two seconds, and it signals respect while still letting you speak.", "zh": "只要两秒钟，既表达了尊重，又能让你把话说出来。", "sp": null}], [{"id": "s1_1_0", "md": "Then lead with evidence, not opinion.", "text": "Then lead with evidence, not opinion.", "zh": "然后用证据开路，而不是观点。", "sp": null}, {"id": "s1_1_1", "md": "\"In the last two launches of this size, testing took six weeks, not three.\"", "text": "\"In the last two launches of this size, testing took six weeks, not three.\"", "zh": "「最近两次这种规模的上线，测试都花了六周，不是三周。」", "sp": null}, {"id": "s1_1_2", "md": "Data shifts the conversation from \"me against you\" to \"us looking at the same facts.\"", "text": "Data shifts the conversation from \"me against you\" to \"us looking at the same facts.\"", "zh": "数据能把对话从「我对你」变成「我们一起看同一组事实」。", "sp": null}], [{"id": "s1_2_0", "md": "Most importantly, offer a way forward that does not ==require== them to fully reverse.", "text": "Most importantly, offer a way forward that does not require them to fully reverse.", "zh": "最重要的是，给出一条不需要他完全推翻自己的路。", "sp": null}, {"id": "s1_2_1", "md": "Suggest a smaller pilot, an extra checkpoint, or a date to review the risk together.", "text": "Suggest a smaller pilot, an extra checkpoint, or a date to review the risk together.", "zh": "建议先做个小范围试点、加一个检查点，或者约个时间一起复盘风险。", "sp": null}, {"id": "s1_2_2", "md": "**People change direction more easily when you give them a door instead of a wall.**", "text": "People change direction more easily when you give them a door instead of a wall.", "zh": "你给人一扇门而不是一堵墙，他们就更容易调转方向。", "sp": null}], [{"id": "s1_3_0", "md": "Know when to stop.", "text": "Know when to stop.", "zh": "要知道什么时候收手。", "sp": null}, {"id": "s1_3_1", "md": "If the leader still disagrees, say \"Understood, I'll ==flag== it if we see early signs,\" and then __drop it__ in the meeting.", "text": "If the leader still disagrees, say \"Understood, I'll flag it if we see early signs,\" and then drop it in the meeting.", "zh": "如果领导还是不同意，就说「明白，如果看到早期苗头我会及时提出来」，然后在会上就不再提了。", "sp": null}, {"id": "s1_3_2", "md": "If the issue is serious, __follow up one on one__ afterward.", "text": "If the issue is serious, follow up one on one afterward.", "zh": "如果问题确实严重，会后再单独找他聊。", "sp": null}, {"id": "s1_3_3", "md": "A ==calm== disagreement handled this way usually earns more trust than quiet agreement ever could.", "text": "A calm disagreement handled this way usually earns more trust than quiet agreement ever could.", "zh": "这样处理的一次心平气和的反对，通常比默默同意更能赢得信任。", "sp": null}]]}], "gist": [{"q": "作者说高层私下最常抱怨的是什么？", "a": "没人在为时已晚之前告诉他们方案不好；层级越高，听到的信息越被过滤。"}, {"q": "公开反对高层时，作者建议的几个做法是什么？", "a": "先征求发言空间；用证据而不是观点开头；给出不需要对方完全推翻的出路，比如小规模试点或检查点；对方仍坚持时适可而止，严重问题会后单独沟通。"}, {"q": "“给门而不是给墙”是什么意思？", "a": "给对方一个体面调整方向的台阶，而不是逼他当众认错。"}], "dictation": [{"id": "s0_1_2", "text": "The problem is rarely that you disagree; it is how and where you do it."}, {"id": "s1_2_2", "text": "People change direction more easily when you give them a door instead of a wall."}, {"id": "s1_1_0", "text": "Then lead with evidence, not opinion."}, {"id": "s1_3_2", "text": "If the issue is serious, follow up one on one afterward."}], "shadow": {"text": "Most importantly, offer a way forward that does not require them to fully reverse. Suggest a smaller pilot, an extra checkpoint, or a date to review the risk together.", "marked": "Most <b>importantly</b>, / offer a way <b>forward</b> / that does <b>not</b> require them / to <b>fully</b> reverse. //<br>Suggest a smaller <b>pilot</b>, / an extra <b>checkpoint</b>, / or a <b>date</b> / to review the risk <b>together</b>. //"}, "prompts": [{"q": "全员会上，业务负责人宣布新功能三周后全球上线。你认为测试时间不够。用 30 秒公开表达不同意见：先征求空间，再用数据，最后给一个台阶。", "ref": "Can I offer a slightly different view on the timeline? Looking at our last two launches of this size, testing took about six weeks, mostly because of payment edge cases. I'd hate for us to rush and then roll back in front of users. What if we launch in two smaller markets in three weeks, as planned, and go global once we've seen a clean week of data?", "ref_zh": "关于时间线，我能提一个稍微不同的看法吗？看我们最近两次这种规模的上线，测试都花了大概六周，主要是卡在支付的各种边界情况上。我很不希望我们赶着上线，然后当着用户的面回滚。要不我们按原计划三周后先在两个小市场上线，等看到一周干净的数据再全球放量？", "id": "ref0"}, {"q": "你刚才在会上提了异议，但总监还是坚持原计划。用 30 秒得体地收住，并说明你会怎样跟进风险。", "ref": "Understood, and thanks for hearing me out. Let's go with the plan as it is. To stay safe, I'll set up a dashboard for error rates in the new flow, and I'll flag it right away if we see early warning signs. Would it be okay if I grabbed fifteen minutes with you later this week to walk through the rollback steps?", "ref_zh": "明白，谢谢你听我说完。那就按现在的方案来。为了稳妥起见，我会给新流程搭一个错误率的看板，一有预警信号我马上同步。这周晚些时候能不能约你十五分钟，一起过一下回滚步骤？", "id": "ref1"}], "words": [{"w": "accurate", "ipa": "/ˈækjərət/", "zh": "准确的", "ex": "We need accurate numbers before we promise a date.", "id": "w0"}, {"w": "ambush (v.)", "ipa": "/ˈæmbʊʃ/", "zh": "突然发难、伏击", "ex": "Share the concern before the review, so the team doesn't feel ambushed.", "tts_w": "ambush", "id": "w1"}, {"w": "weak", "ipa": "/wiːk/", "zh": "软弱的、站不住的", "ex": "The business case looks weak without the cost numbers.", "id": "w2"}, {"w": "require", "ipa": "/rɪˈkwaɪər/", "zh": "需要、要求", "ex": "This change requires a database migration.", "id": "w3"}, {"w": "flag (v.)", "ipa": "/flæɡ/", "zh": "提出、标记（风险）", "ex": "I'll flag it const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

};

const player = new Audio();

const rate = () => parseFloat($('#speed').value);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
