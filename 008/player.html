<script>
const D = {"id": "008", "title": "Disagreeing with a Senior Leader in Public", "meta": "B2 · 约 280 词 · 场景：向上表达异议", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What Leaders Say in Private", "heading_zh": "1. 领导私下怎么说", "rows": [[{"id": "s0_0_0", "md": "Ask senior leaders what frustrates them, and many give the same answer.", "text": "Ask senior leaders what frustrates them, and many give the same answer.", "zh": "问高层领导最让他们头疼的是什么，很多人的回答都一样。", "sp": null}, {"id": "s0_0_1", "md": "\"Nobody tells me when my idea is bad until it's too late.\"", "text": "\"Nobody tells me when my idea is bad until it's too late.\"", "zh": "「我的想法不行，没人告诉我，直到为时已晚。」", "sp": null}, {"id": "s0_0_2", "md": "The higher you go, the more people __filter what they say__, and the less ==accurate== your picture of reality becomes.", "text": "The higher you go, the more people filter what they say, and the less accurate your picture of reality becomes.", "zh": "位置越高，大家说话就越会过滤，你对现实的判断也就越失真。", "sp": null}], [{"id": "s0_1_0", "md": "So most leaders do want pushback.", "text": "So most leaders do want pushback.", "zh": "所以大多数领导其实是想要反对意见的。", "sp": null}, {"id": "s0_1_1", "md": "What they do not want is to lose face in front of a large group, or to feel ==ambushed== by a surprise attack on their plan.", "text": "What they do not want is to lose face in front of a large group, or to feel ambushed by a surprise attack on their plan.", "zh": "他们不想要的，是当着一大群人丢面子，或者被一场针对自己方案的突然袭击打个措手不及。", "sp": null}, {"id": "s0_1_2", "md": "**The problem is rarely that you disagree; it is how and where you do it.**", "text": "The problem is rarely that you disagree; it is how and where you do it.", "zh": "问题很少在于你不同意，而在于你怎么表达、在哪儿表达。", "sp": null}], [{"id": "s0_2_0", "md": "Public disagreement with a senior person is not about being brave.", "text": "Public disagreement with a senior person is not about being brave.", "zh": "当众反对一位高层，跟勇不勇敢没关系。", "sp": null}, {"id": "s0_2_1", "md": "It is about making it easy for them to change their mind without looking ==weak==.", "text": "It is about making it easy for them to change their mind without looking weak.", "zh": "关键是让对方能轻松改变主意，又不显得软弱。", "sp": null}]]}, {"heading": "2. Give Them a Door, Not a Wall", "heading_zh": "2. 给他们一扇门，而不是一堵墙", "rows": [[{"id": "s1_0_0", "md": "Start by asking for room.", "text": "Start by asking for room.", "zh": "先请求一个发言的空间。", "sp": null}, {"id": "s1_0_1", "md": "\"Can I offer a different view on the timeline?\"", "text": "\"Can I offer a different view on the timeline?\"", "zh": "「关于时间线，我能提一个不同的看法吗？」", "sp": null}, {"id": "s1_0_2", "md": "It takes two seconds, and it __signals respect__ while still letting you speak.", "text": "It takes two seconds, and it signals respect while still letting you speak.", "zh": "只要两秒钟，既表达了尊重，又能让你把话说出来。", "sp": null}], [{"id": "s1_1_0", "md": "Then lead with evidence, not opinion.", "text": "Then lead with evidence, not opinion.", "zh": "然后用证据开路，而不是观点。", "sp": null}, {"id": "s1_1_1", "md": "\"In the last two launches of this size, testing took six weeks, not three.\"", "text": "\"In the last two launches of this size, testing took six weeks, not three.\"", "zh": "「最近两次这种规模的上线，测试都花了六周，不是三周。」", "sp": null}, {"id": "s1_1_2", "md": "Data shifts the conversation from \"me against you\" to \"us looking at the same facts.\"", "text": "Data shifts the conversation from \"me against you\" to \"us looking at the same facts.\"", "zh": "数据能把对话从「我对你」变成「我们一起看同一组事实」。", "sp": null}], [{"id": "s1_2_0", "md": "Most importantly, offer a way forward that does not ==require== them to fully reverse.", "text": "Most importantly, offer a way forward that does not require them to fully reverse.", "zh": "最重要的是，给出一条不需要他完全推翻自己的路。", "sp": null}, {"id": "s1_2_1", "md": "Suggest a smaller pilot, an extra checkpoint, or a date to review the risk together.", "text": "Suggest a smaller pilot, an extra checkpoint, or a date to review the risk together.", "zh": "建议先做个小范围试点、加一个检查点，或者约个时间一起复盘风险。", "sp": null}, {"id": "s1_2_2", "md": "**People change direction more easily when you give them a door instead of a wall.**", "text": "People change direction more easily when you give them a door instead of a wall.", "zh": "你给人一扇门而不是一堵墙，他们就更容易调转方向。", "sp": null}], [{"id": "s1_3_0", "md": "Know when to stop.", "text": "Know when to stop.", "zh": "要知道什么时候收手。", "sp": null}, {"id": "s1_3_1", "md": "If the leader still disagrees, say \"Understood, I'll ==flag== it if we see early signs,\" and then __drop it__ in the meeting.", "text": "If the leader still disagrees, say \"Understood, I'll flag it if we see early signs,\" and then drop it in the meeting.", "zh": "如果领导还是不同意，就说「明白，如果看到早期苗头我会及时提出来」，然后在会上就不再提了。", "sp": null}, {"id": "s1_3_2", "md": "If the issue is serious, __follow up one on one__ afterward.", "text": "If the issue is serious, follow up one on one afterward.", "zh": "如果问题确实严重，会后再单独找他聊。", "sp": null}, {"id": "s1_3_3", "md": "A ==calm== disagreement handled this way usually earns more trust than quiet agreement ever could.", "text": "A calm disagreement handled this way usually earns more trust than quiet agreement ever could.", "zh": "这样处理的一次心平气和的反对，通常比默默同意更能赢得信任。", "sp": null}]]}], "gist": [{"q": "作者说高层私下最常抱怨的是什么？", "a": "没人在为时已晚之前告诉他们方案不好；层级越高，听到的信息越被过滤。"}, {"q": "公开反对高层时，作者建议的几个做法是什么？", "a": "先征求发言空间；用证据而不是观点开头；给出不需要对方完全推翻的出路，比如小规模试点或检查点；对方仍坚持时适可而止，严重问题会后单独沟通。"}, {"q": "“给门而不是给墙”是什么意思？", "a": "给对方一个体面调整方向的台阶，而不是逼他当众认错。"}], "dictation": [{"id": "s0_1_2", "text": "The problem is rarely that you disagree; it is how and where you do it."}, {"id": "s1_2_2", "text": "People change direction more easily when you give them a door instead of a wall."}, {"id": "s1_1_0", "text": "Then lead with evidence, not opinion."}, {"id": "s1_3_2", "text": "If the issue is serious, follow up one on one afterward."}], "shadow": {"text": "Most importantly, offer a way forward that does not require them to fully reverse. Suggest a smaller pilot, an extra checkpoint, or a date to review the risk together.", "marked": "Most <b>importantly</b>, / offer a way <b>forward</b> / that does <b>not</b> require them / to <b>fully</b> reverse. //<br>Suggest a smaller <b>pilot</b>, / an extra <b>checkpoint</b>, / or a <b>date</b> / to review the risk <b>together</b>. //"}, "prompts": [{"q": "全员会上，业务负责人宣布新功能三周后全球上线。你认为测试时间不够。用 30 秒公开表达不同意见：先征求空间，再用数据，最后给一个台阶。", "ref": "Can I offer a slightly different view on the timeline? Looking at our last two launches of this size, testing took about six weeks, mostly because of payment edge cases. I'd hate for us to rush and then roll back in front of users. What if we launch in two smaller markets in three weeks, as planned, and go global once we've seen a clean week of data?", "ref_zh": "关于时间线，我能提一个稍微不同的看法吗？看我们最近两次这种规模的上线，测试都花了大概六周，主要是卡在支付的各种边界情况上。我很不希望我们赶着上线，然后当着用户的面回滚。要不我们按原计划三周后先在两个小市场上线，等看到一周干净的数据再全球放量？", "id": "ref0"}, {"q": "你刚才在会上提了异议，但总监还是坚持原计划。用 30 秒得体地收住，并说明你会怎样跟进风险。", "ref": "Understood, and thanks for hearing me out. Let's go with the plan as it is. To stay safe, I'll set up a dashboard for error rates in the new flow, and I'll flag it right away if we see early warning signs. Would it be okay if I grabbed fifteen minutes with you later this week to walk through the rollback steps?", "ref_zh": "明白，谢谢你听我说完。那就按现在的方案来。为了稳妥起见，我会给新流程搭一个错误率的看板，一有预警信号我马上同步。这周晚些时候能不能约你十五分钟，一起过一下回滚步骤？", "id": "ref1"}], "words": [{"w": "accurate", "ipa": "/ˈækjərət/", "zh": "准确的", "ex": "We need accurate numbers before we promise a date.", "id": "w0"}, {"w": "ambush (v.)", "ipa": "/ˈæmbʊʃ/", "zh": "突然发难、伏击", "ex": "Share the concern before the review, so the team doesn't feel ambushed.", "tts_w": "ambush", "id": "w1"}, {"w": "weak", "ipa": "/wiːk/", "zh": "软弱的、站不住的", "ex": "The business case looks weak without the cost numbers.", "id": "w2"}, {"w": "require", "ipa": "/rɪˈkwaɪər/", "zh": "需要、要求", "ex": "This change requires a database migration.", "id": "w3"}, {"w": "flag (v.)", "ipa": "/flæɡ/", "zh": "提出、标记（风险）", "ex": "I'll flag it in the channel if the error rate goes up.", "tts_w": "flag", "id": "w4"}, {"w": "calm", "ipa": "/kɑːm/", "zh": "冷静的", "ex": "Her calm tone kept the incident call from turning into a blame game.", "id": "w5"}, {"w": "pushback", "ipa": "/ˈpʊʃbæk/", "zh": "反对意见、阻力", "ex": "We got some pushback from sales on the new pricing.", "id": "w6"}, {"w": "lose face", "ipa": "/luːz feɪs/", "zh": "丢面子", "ex": "Give him a way to change the plan without losing face.", "id": "w7"}, {"w": "evidence", "ipa": "/ˈevɪdəns/", "zh": "证据", "ex": "Do we have any evidence that users want this feature?", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. What Leaders Say in Private", "zh": "1. 领导私下怎么说", "start": 0.0, "end": 2.544, "words": [[0.105, 0.368], [0.724, 0.934], [0.947, 1.303], [1.316, 1.553], [1.566, 1.658], [1.671, 2.145]]}, {"kind": "s", "id": "s0_0_0", "md": "Ask senior leaders what frustrates them, and many give the same answer.", "zh": "问高层领导最让他们头疼的是什么，很多人的回答都一样。", "sp": null, "gap": false, "start": 2.544, "end": 6.888, "words": [[2.649, 2.899], [2.912, 3.294], [3.307, 3.662], [3.676, 3.847], [3.86, 4.465], [4.478, 4.676], [5.097, 5.189], [5.202, 5.465], [5.478, 5.649], [5.662, 5.728], [5.741, 6.044], [6.057, 6.491]]}, {"kind": "s", "id": "s0_0_1", "md": "\"Nobody tells me when my idea is bad until it's too late.\"", "zh": "「我的想法不行，没人告诉我，直到为时已晚。」", "sp": null, "gap": false, "start": 6.888, "end": 10.632, "words": [[7.072, 7.283], [7.362, 7.651], [7.664, 7.77], [7.783, 7.901], [7.914, 8.072], [8.085, 8.638], [8.651, 8.783], [8.796, 9.23], [9.243, 9.506], [9.52, 9.651], [9.664, 9.862], [9.875, 10.23]]}, {"kind": "s", "id": "s0_0_2", "md": "The higher you go, the more people __filter what they say__, and the less ==accurate== your picture of reality becomes.", "zh": "位置越高，大家说话就越会过滤，你对现实的判断也就越失真。", "sp": null, "gap": false, "start": 10.632, "end": 17.52, "words": [[10.75, 10.803], [10.816, 11.158], [11.171, 11.29], [11.303, 11.685], [11.974, 12.053], [12.066, 12.25], [12 vidence, not opinion.", "zh": "然后用证据开路，而不是观点。", "sp": null, "gap": true, "start": 49.272, "end": 51.84, "words": [[49.377, 49.588], [49.601, 49.811], [49.825, 49.996], [50.009, 50.548], [50.825, 50.983], [50.996, 51.443]]}, {"kind": "s", "id": "s1_1_1", "md": "\"In the last two launches of this size, testing took six weeks, not three.\"", "zh": "「最近两次这种规模的上线，测试都花了六周，不是三周。」", "sp": null, "gap": false, "start": 51.84, "end": 57.096, "words": [[52.011, 52.037], [52.037, 52.103], [52.116, 52.458], [52.472, 52.643], [52.656, 53.143], [53.156, 53.235], [53.248, 53.445], [53.458, 53.958], [54.182, 54.59], [54.603, 54.814], [54.827, 55.208], [55.222, 55.695], [55.932, 56.195], [56.208, 56.695]]}, {"kind": "s", "id": "s1_1_2", "md": "Data shifts the conversation from \"me against you\" to \"us looking at the same facts.\"", "zh": "数据能把对话从「我对你」变成「我们一起看同一组事实」。", "sp": null, "gap": false, "start": 57.096, "end": 62.784, "words": [[57.214, 57.478], [57.491, 57.899], [57.912, 58.004], [58.017, 58.78], [58.793, 59.03], [59.057, 59.346], [59.359, 59.754], [59.767, 59.951], [60.214, 60.412], [60.478, 60.701], [60.714, 61.096], [61.109, 61.201], [61.214, 61.307], [61.32, 61.675], [61.688, 62.372]]}, {"kind": "s", "id": "s1_2_0", "md": "Most importantly, offer a way forward that does not ==require== them to fully reverse.", "zh": "最重要的是，给出一条不需要他完全推翻自己的路。", "sp": null, "gap": true, "start": 62.784, "end": 68.04, "words": [[62.889, 63.1], [63.113, 63.771], [64.166, 64.481], [64.495, 64.56], [64.573, 64.758], [64.771, 65.244], [65.258, 65.416], [65.429, 65.587], [65.6, 65.837], [65.85, 66.284], [66.297, 66.481], [66.495, 66.573], [66.587, 66.968], [66.981, 67.639]]}, {"kind": "s", "id": "s1_2_1", "md": "Suggest a smaller pilot, an extra checkpoint, or a date to review the risk together.", "zh": "建议先做个小范围试点、加一个检查点，或者约个时间一起复盘风险。", "sp": null, "gap": false, "start": 68.04, "end": 73.872, "words": [[68.145, 68.672], [68.685, 68.724], [68.737, 69.185], [69.198, 69.645], [69.935, 70.093], [70.106, 70.435], [70.448, 71.027], [71.422, 71.54], [71.553, 71.645], [71.658, 71.935], [71.948, 72.079], [72.093, 72.553], [72.566, 72.685], [72.698, 72.974], [72.987, 73.474]]}, {"kind": "s", "id": "s1_2_2", "md": "**People change direction more easily when you give them a door instead of a wall.**", "zh": "你给人一扇门而不是一堵墙，他们就更容易调转方向。", "sp": null, "gap": false, "start": 73.872, "end": 78.792, "words": [[73.99, 74.254], [74.267, 74.609], [74.622, 75.201], [75.372, 75.635], [75.648, 76.148], [76.24, 76.398], [76.411, 76.504], [76.517, 76.714], [76.727, 76.872], [76.885, 76.964], [76.977, 77.398], [77.49, 77.872], [77.885, 77.925], [77.938, 78.004], [78.017, 78.398]]}, {"kind": "s", "id": "s1_3_0", "md": "Know when to stop.", "zh": "要知道什么时候收手。", "sp": null, "gap": true, "start": 78.792, "end": 80.664, "words": [[78.897, 79.002], [79.016, 79.108], [79.121, 79.174], [79.187, 79.621]]}, {"kind": "s", "id": "s1_3_1", "md": "If the leader still disagrees, say \"Understood, I'll ==flag== it if we see early signs,\" and then __drop it__ in the meeting.", "zh": "如果领导还是不同意，就说「明白，如果看到早期苗头我会及时提出来」，然后在会上就不再提了。", "sp": null, "gap": false, "start": 80.664, "end": 88.68, "words": [[80.769, 80.901], [80.914, 81.006], [81.019, 81.322], [81.335, 81.624], [81.638, 82.467], [82.651, 83.019], [83.493, 84.177], [84.585, 84.69], [84.703, 85.098], [85.111, 85.19], [85.203, 85.322], [85.335, 85.44], [85.453, 85.782], [85.914, 86.23], [86.243, 86.835], [87.111, 87.19], [87.203, 87.348], [87.361, 87.69], [87.703, 87.769], [87.782, 87.861], [87.875, 87.94], [87.953, 88.296]]}, {"kind": "s", "id": "s1_3_2", "md": "If the issue is serious, __follow up one on one__ afterward.", "zh": "如果问题确实严重，会后再单独找他聊。", "sp": null, "gap": false, "start": 88.68, "end": 92.568, "words": [[88.785, 88.904], [88.917, 89.009], [89.022, 89.43], [89.443, 89.562], [89.575, 90.312], [90.509, 90.891], [90.904, 91.062], [91.075, 91.285], [91.298, 91.443], [91.456, 91.627], [91.641, 92.167]]}, {"kind": "s", "id": "s1_3_3", "md": "A ==calm== disagreement handled this way usually earns more trust than quiet agreement ever could.", "zh": "这样处理的一次心平气和的反对，通常比默默同意更能赢得信任。", "sp": null, "gap": false, "start": 92.568, "end": 98.904, "words": [[92.673, 92.739], [92.752, 93.107], [93.121, 93.818], [93.831, 94.279], [94.292, 94.476], [94.489, 94.752], [94.765, 95.358], [95.371, 95.7], [95.713, 96.029], [96.042, 96.581], [96.594, 96.752], [96.765, 97.147], [97.16, 97.713], [97.923, 98.107], [98.121, 98.502]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
