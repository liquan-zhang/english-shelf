<script>
const D = {"id": "019", "title": "Demoing Work That Is Not Finished", "meta": "B2 · 约 290 词 · 场景：半成品演示", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Two Ways an Early Demo Goes Wrong", "heading_zh": "1. 早期 demo 翻车的两种方式", "rows": [[{"id": "s0_0_0", "md": "Showing unfinished work is one of the best habits a team can have.", "text": "Showing unfinished work is one of the best habits a team can have.", "zh": "展示没做完的东西，是一个团队能有的最好的习惯之一。", "sp": null}, {"id": "s0_0_1", "md": "You get feedback while changes are still cheap, instead of after three months of building the wrong thing.", "text": "You get feedback while changes are still cheap, instead of after three months of building the wrong thing.", "zh": "你能在改动成本还低的时候拿到反馈，而不是闷头做了三个月才发现方向错了。", "sp": null}, {"id": "s0_0_2", "md": "But early demos tend to fail in one of two opposite ways.", "text": "But early demos tend to fail in one of two opposite ways.", "zh": "但早期 demo 往往会以两种截然相反的方式翻车。", "sp": null}], [{"id": "s0_1_0", "md": "In the first, the audience focuses on the ==rough== parts.", "text": "In the first, the audience focuses on the rough parts.", "zh": "第一种，听众盯着粗糙的地方不放。", "sp": null}, {"id": "s0_1_1", "md": "Someone spends ten minutes on a button color, and nobody comments on the workflow you actually wanted to test.", "text": "Someone spends ten minutes on a button color, and nobody comments on the workflow you actually wanted to test.", "zh": "有人花十分钟纠结一个按钮的颜色，你真正想验证的流程却没人评论。", "sp": null}], [{"id": "s0_2_0", "md": "In the second, the demo looks too good.", "text": "In the second, the demo looks too good.", "zh": "第二种，demo 看起来太完美了。", "sp": null}, {"id": "s0_2_1", "md": "The screens are ==polished==, the data is fake but realistic, and a senior stakeholder says, \"Great, so we can launch next month?\"", "text": "The screens are polished, the data is fake but realistic, and a senior stakeholder says, \"Great, so we can launch next month?\"", "zh": "页面很精致，数据是假的但很逼真，然后一位高层干系人说：「太好了，那下个月就能上线了？」", "sp": null}, {"id": "s0_2_2", "md": "Now you have a ==deadline== based on a prototype held together with tape.", "text": "Now you have a deadline based on a prototype held together with tape.", "zh": "现在你手上有了一个 deadline，依据却是一个用胶带勉强粘起来的原型。", "sp": null}, {"id": "s0_2_3", "md": "**The more finished a demo looks, the more finished people assume it is.**", "text": "The more finished a demo looks, the more finished people assume it is.", "zh": "demo 看起来越完整，大家就越以为它真的快做完了。", "sp": null}]]}, {"heading": "2. Frame It Before You Show It", "heading_zh": "2. 先定调，再展示", "rows": [[{"id": "s1_0_0", "md": "Both problems have the same cure, which is to set the frame before anyone sees a screen.", "text": "Both problems have the same cure, which is to set the frame before anyone sees a screen.", "zh": "这两个问题的解法是一样的：在任何人看到画面之前，先把基调定好。", "sp": null}, {"id": "s1_0_1", "md": "Spend the first thirty seconds saying what is real, what is ==mocked==, and what kind of feedback you want.", "text": "Spend the first thirty seconds saying what is real, what is mocked, and what kind of feedback you want.", "zh": "用开头三十秒讲清楚哪些是真的、哪些是 mock 的，以及你想要什么样的反馈。", "sp": null}], [{"id": "s1_1_0", "md": "\"The search results are real, but the payment step is just a static page.\"", "text": "\"The search results are real, but the payment step is just a static page.\"", "zh": "「搜索结果是真实的，但支付这一步只是个静态页面。」", "sp": null}, {"id": "s1_1_1", "md": "\"Please ignore the styling today; I'd love your view on whether these three steps make sense.\"", "text": "\"Please ignore the styling today; I'd love your view on whether these three steps make sense.\"", "zh": "「今天的样式请先忽略；我很想听听你们觉得这三个步骤是否合理。」", "sp": null}, {"id": "s1_1_2", "md": "This ==steers== their attention to where you need it.", "text": "This steers their attention to where you need it.", "zh": "这样就把大家的注意力引到了你需要的地方。", "sp": null}], [{"id": "s1_2_0", "md": "During the demo, name rough edges before anyone else does.", "text": "During the demo, name rough edges before anyone else does.", "zh": "demo 过程中，在别人指出之前先点明粗糙的地方。", "sp": null}, {"id": "s1_2_1", "md": "\"You'll see this loads slowly; that's a known issue we're fixing next sprint.\"", "text": "\"You'll see this loads slowly; that's a known issue we're fixing next sprint.\"", "zh": "「你们会看到这里加载得很慢，这是已知问题，下个迭代修。」", "sp": null}, {"id": "s1_2_2", "md": "When you __call it out__ first, it sounds like control, not a mistake.", "text": "When you call it out first, it sounds like control, not a mistake.", "zh": "你自己先说出来，听起来就是一切尽在掌握，而不是出了错。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, close with a clear ==status== line.", "text": "Finally, close with a clear status line.", "zh": "最后，用一句清晰的进度说明收尾。", "sp": null}, {"id": "s1_3_1", "md": "\"We're about forty percent done, and the earliest realistic launch is the end of next quarter.\"", "text": "\"We're about forty percent done, and the earliest realistic launch is the end of next quarter.\"", "zh": "「我们大概完成了百分之四十，最早比较现实的上线时间是下季度末。」", "sp": null}, {"id": "s1_3_2", "md": "**Say the date yourself, or someone in the room will say a worse one for you.**", "text": "Say the date yourself, or someone in the room will say a worse one for you.", "zh": "日期要你自己说出来，不然屋里就会有人替你说一个更糟的。", "sp": null}, {"id": "s1_3_3", "md": "That way, the meeting __ends with__ useful feedback and a shared, honest timeline.", "text": "That way, the meeting ends with useful feedback and a shared, honest timeline.", "zh": "这样，会议结束时大家既拿到了有用的反馈，又有了一个共同认可的、实事求是的时间线。", "sp": null}]]}], "gist": [{"q": "演示半成品通常会以哪两种相反的方式出问题？", "a": "要么观众盯着粗糙的细节，没反馈真正想测的流程；要么演示看起来太完善，被误认为快做完了，被定下不现实的上线时间。"}, {"q": "作者给出的统一解法是什么？", "a": "在展示任何画面之前先定框架：说明哪些是真的、哪些是模拟的，以及想要什么样的反馈。"}, {"q": "为什么结尾要由自己说出时间？", "a": "如果自己不说，会有人替你说一个更糟、更不现实的日期。"}], "dictation": [{"id": "s0_2_3", "text": "The more finished a demo looks, the more finished people assume it is."}, {"id": "s1_3_2", "text": "Say the date yourself, or someone in the room will say a worse one for you."}, {"id": "s1_2_0", "text": "During the demo, name rough edges before anyone else does."}, {"id": "s1_2_2", "text": "When you call it out first, it sounds like control, not a mistake."}], "shadow": {"text": "During the demo, name rough edges before anyone else does. \"You'll see this loads slowly; that's a known issue we're fixing next sprint.\" When you call it out first, it sounds like control, not a mistake.", "marked": "During the demo, / name <b>rough</b> edges / <b>before</b> anyone else does. //<br>\"You'll see this loads <b>slowly</b>; / that's a <b>known</b> issue / we're fixing <b>next</b> sprint.\" //<br>When you call it out <b>first</b>, / it sounds like <b>control</b>, / <b>not</b> a mistake. //"}, "prompts": [{"q": "你要给业务方演示一个只做了一半的新客服后台原型。用 30 秒开场设定框架：哪些是真的、哪些是假的、你想要什么反馈。", "ref": "Before I share my screen, a quick note on what you're about to see. This is an early prototype. The ticket list and search are working with real data, but the reply templates and reporting pages are just mock-ups. Please don't worry about colors or spacing yet. What I really want to know is whether this flow matches how your agents work day to day.", "ref_zh": "共享屏幕之前，先简单说一下大家马上要看到的东西。这是一个早期原型。工单列表和搜索用的是真实数据，但回复模板和报表页面只是 mock 稿。颜色和间距先不用在意。我最想知道的是，这个流程跟你们客服同学的日常工作方式对不对得上。", "id": "ref0"}, {"q": "演示结束后，一位高层兴奋地说：“看起来差不多了，下个月上线吧？”用 30 秒管理预期，给出真实进度和时间。", "ref": "I'm really glad it looks promising. I should be clear, though, that what you saw is mostly the front end. The integration with billing and all the error handling still need to be built, so we're about a third of the way there. Realistically, we could start a small beta in two months and launch fully at the end of next quarter. I'll share a written plan this week.", "ref_zh": "很高兴大家觉得有前景。不过我得说清楚，刚才看到的主要是前端。和计费系统的对接以及所有的异常处理都还没做，所以我们大概只完成了三分之一。实事求是地说，两个月后可以开始小范围 beta，下季度末全量上线。这周我会发一份书面计划。", "id": "ref1"}], "words": [{"w": "rough", "ipa": "/rʌf/", "zh": "粗糙的、未打磨的", "ex": "This is a rough draft of the design doc, so feedback is welcome.", "id": "w0"}, {"w const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
