<script>
const D = {"id": "091", "title": "Working with Teammates in Five Time Zones", "meta": "B2 · 约 280 词 · 场景：跨时区协作", "voice": "en-IN-PrabhatNeural", "rate": "-5%", "sections": [{"heading": "1. The Hidden Cost of the Overlap Hour", "heading_zh": "1. 重叠时段的隐性成本", "rows": [[{"id": "s0_0_0", "md": "Our team has people in Bangalore, Singapore, Sydney, London and San Francisco.", "text": "Our team has people in Bangalore, Singapore, Sydney, London and San Francisco.", "zh": "我们团队的人分布在班加罗尔、新加坡、悉尼、伦敦和旧金山。", "sp": null}, {"id": "s0_0_1", "md": "On a map, that looks impressive.", "text": "On a map, that looks impressive.", "zh": "放在地图上，看着挺唬人。", "sp": null}, {"id": "s0_0_2", "md": "In a calendar, it looks like a ==puzzle== with no clean solution.", "text": "In a calendar, it looks like a puzzle with no clean solution.", "zh": "放进日历里，就是一道怎么拼都拼不齐的拼图。", "sp": null}], [{"id": "s0_1_0", "md": "The usual answer is to find one overlap hour and put every meeting there.", "text": "The usual answer is to find one overlap hour and put every meeting there.", "zh": "通常的做法是找一个大家都在线的重叠时段，把所有会都塞进去。", "sp": null}, {"id": "s0_1_1", "md": "But someone always pays for that hour, and it is usually the same people: the ones joining at seven in the morning or ten at night.", "text": "But someone always pays for that hour, and it is usually the same people: the ones joining at seven in the morning or ten at night.", "zh": "但总有人要为这个时段买单，而且通常是同一批人：早上七点或者晚上十点进会的那些。", "sp": null}, {"id": "s0_1_2", "md": "Over time, they stop speaking up, and the team starts losing their ideas without noticing.", "text": "Over time, they stop speaking up, and the team starts losing their ideas without noticing.", "zh": "时间一长，他们就不怎么发言了，团队也在不知不觉中丢掉了他们的想法。", "sp": null}], [{"id": "s0_2_0", "md": "**Time zones are not just a scheduling problem; they are a fairness problem.**", "text": "Time zones are not just a scheduling problem; they are a fairness problem.", "zh": "时区不只是排会的问题；它是公平的问题。", "sp": null}, {"id": "s0_2_1", "md": "If one office always __bears the cost__, ==resentment== builds quietly, even on a friendly team.", "text": "If one office always bears the cost, resentment builds quietly, even on a friendly team.", "zh": "如果总是同一个办公室承担代价，哪怕团队氛围再好，不满也会悄悄积累。", "sp": null}, {"id": "s0_2_2", "md": "People rarely complain about it directly, but you will see it in shorter answers and cameras that stay off.", "text": "People rarely complain about it directly, but you will see it in shorter answers and cameras that stay off.", "zh": "大家很少会直接抱怨，但你会从越来越短的回答、一直不开的摄像头里看出来。", "sp": null}, {"id": "s0_2_3", "md": "That is why the ==arrangement== matters as much as the agenda.", "text": "That is why the arrangement matters as much as the agenda.", "zh": "所以会怎么安排，和议程本身一样重要。", "sp": null}]]}, {"heading": "2. Rotate, Record, Hand Off", "heading_zh": "2. 轮换、录屏、交接", "rows": [[{"id": "s1_0_0", "md": "First, ==rotate== the inconvenient slot.", "text": "First, rotate the inconvenient slot.", "zh": "第一，把难受的时段轮换起来。", "sp": null}, {"id": "s1_0_1", "md": "If the weekly sync is painful for London this month, move it so that Sydney __takes a turn__ next month.", "text": "If the weekly sync is painful for London this month, move it so that Sydney takes a turn next month.", "zh": "如果这个月的周会对伦敦很痛苦，下个月就挪一挪，让悉尼轮一次。", "sp": null}, {"id": "s1_0_2", "md": "People accept a bad time much more easily when they can see it is shared.", "text": "People accept a bad time much more easily when they can see it is shared.", "zh": "大家一旦看到苦是轮着吃的，接受一个糟糕的时间就容易多了。", "sp": null}], [{"id": "s1_1_0", "md": "Second, record every meeting and write a short summary of the decisions.", "text": "Second, record every meeting and write a short summary of the decisions.", "zh": "第二，每个会都录屏，并写一份简短的决策纪要。", "sp": null}, {"id": "s1_1_1", "md": "Someone who could not attend should be able to __catch up__ in five minutes and still give input ==asynchronously== before anything is final.", "text": "Someone who could not attend should be able to catch up in five minutes and still give input asynchronously before anything is final.", "zh": "没能参会的人应该能在五分钟内跟上进度，并且在事情拍板之前，还能异步给出意见。", "sp": null}], [{"id": "s1_2_0", "md": "Third, end each day with a ==handoff== note.", "text": "Third, end each day with a handoff note.", "zh": "第三，每天下班前写一份交接说明。", "sp": null}, {"id": "s1_2_1", "md": "Three lines are enough: what I finished, what is blocked, and what the next person can __pick up__.", "text": "Three lines are enough: what I finished, what is blocked, and what the next person can pick up.", "zh": "三行就够了：我做完了什么，卡在哪里，下一个人可以接着做什么。", "sp": null}, {"id": "s1_2_2", "md": "**A good handoff note means the work keeps moving while you sleep.**", "text": "A good handoff note means the work keeps moving while you sleep.", "zh": "交接写得好，你睡觉的时候活儿也在往前推。", "sp": null}], [{"id": "s1_3_0", "md": "Done well, five time zones stop feeling like a ==burden==.", "text": "Done well, five time zones stop feeling like a burden.", "zh": "做好了，五个时区就不再是负担。", "sp": null}, {"id": "s1_3_1", "md": "The project becomes a relay race, with progress happening __around the clock__ instead of waiting for one shared hour.", "text": "The project becomes a relay race, with progress happening around the clock instead of waiting for one shared hour.", "zh": "项目会变成一场接力赛，进度二十四小时不停，而不是干等那一个共同的小时。", "sp": null}]]}], "gist": [{"q": "作者说“只找一个重叠时段开会”有什么隐性代价？", "a": "总是同一批人在清晨或深夜付出代价，久而久之他们不再发言，团队悄悄失去他们的想法。"}, {"q": "作者把时区问题重新定义成什么问题？", "a": "不只是排期问题，而是公平问题；某个办公室一直承担成本，怨气会悄悄积累。"}, {"q": "文中的三个做法是什么？", "a": "轮换不方便的时段；会议录像并写决策摘要，让缺席者能异步参与；每天结束时写三行交接（完成了什么、卡在哪、下一个人能接什么）。"}], "dictation": [{"id": "s0_2_0", "text": "Time zones are not just a scheduling problem; they are a fairness problem."}, {"id": "s1_0_2", "text": "People accept a bad time much more easily when they can see it is shared."}, {"id": "s1_2_0", "text": "Third, end each day with a handoff note."}, {"id": "s1_2_2", "text": "A good handoff note means the work keeps moving while you sleep."}], "shadow": {"text": "Third, end each day with a handoff note. Three lines are enough: what I finished, what is blocked, and what the next person can pick up. A good handoff note means the work keeps moving while you sleep.", "marked": "Third, end each day / with a <b>handoff</b> note. //<br><b>Three</b> lines are enough: / what I <b>finished</b>, / what is <b>blocked</b>, / and what the <b>next</b> person can pick up. //<br>A good handoff note means / the work keeps <b>moving</b> / while you <b>sleep</b>. //"}, "prompts": [{"q": "你们组的周会一直定在新加坡下午四点，对旧金山同事来说是深夜。你在会上提出轮换时间，30 秒。", "ref": "One process point before we close. Our weekly sync has been at four in the afternoon Singapore time for almost a year, which means Mike has been joining after midnight. That's not fair to him. I'd like to rotate the slot every month, so each office takes a turn with the bad time. I'll send a proposed schedule today.", "ref_zh": "散会前说一个流程上的事。我们的周会快一年都定在新加坡时间下午四点，这意味着 Mike 一直是过了午夜才进会。这对他不公平。我想每个月轮换一次时间，让每个办公室都轮着承担难受的时段。我今天把排期方案发出来。", "id": "ref0"}, {"q": "下班前给伦敦同事发一条语音交接，30 秒说清：完成了什么、卡在哪、他可以接什么。", "ref": "Hi Emma, quick handoff before I log off. I finished the retry logic and all the tests are green. I'm blocked on the config change, because I still don't have access to the production settings. If you have a moment today, could you pick up the code review from Arun? Everything else can wait until I'm back tomorrow morning.", "ref_zh": "Hi Emma，下线前快速交接一下。重试逻辑我写完了，测试全绿。配置变更那块卡住了，因为我还是没有生产环境配置的权限。你今天有空的话，能不能把 Arun 的 code review 接过去？其他的都可以等我明天早上回来再说。", "id": "ref1"}], "words": [{"w": "puzzle", "ipa": "/ˈpʌzəl/", "zh": "难题、谜题", "ex": "Planning the on-call rotation across four offices is a real puzzle.", "id": "w0"}, {"w": "resentment", "ipa": "/rɪˈzentmənt/", "zh": "怨恨、不满", "ex": "Always scheduling demos at night for one team will create resentment.", "id": "w1"}, {"w": "arrangement", "ipa": "/əˈreɪndʒmənt/", "zh": "安排", "ex": "The current arrangement works for Singapore but not for London.", "id": "w2"}, {"w": "rotate", "ipa const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

const player = new Audio();

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
