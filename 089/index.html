<script>
const D = {"id": "089", "title": "Ending a Conversation Gracefully", "meta": "B2 · 约 270 词 · 场景：结束闲聊", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why We Get Stuck", "heading_zh": "1. 为什么我们会被困住", "rows": [[{"id": "s0_0_0", "md": "Starting a conversation is hard, but ending one can be even harder.", "text": "Starting a conversation is hard, but ending one can be even harder.", "zh": "开启一段对话难，结束一段对话可能更难。", "sp": null}, {"id": "s0_0_1", "md": "You have run out of topics, the other person is still talking, and you need to get back to work.", "text": "You have run out of topics, the other person is still talking, and you need to get back to work.", "zh": "你已经没话题了，对方还在说，而你得回去干活。", "sp": null}, {"id": "s0_0_2", "md": "So you nod, smile, and stay ten minutes longer than you wanted.", "text": "So you nod, smile, and stay ten minutes longer than you wanted.", "zh": "于是你点头、微笑，比自己想的多待了十分钟。", "sp": null}], [{"id": "s0_1_0", "md": "Many of us stay because we are afraid that leaving will seem ==dismissive==.", "text": "Many of us stay because we are afraid that leaving will seem dismissive.", "zh": "很多人留下来，是怕一走了之显得敷衍。", "sp": null}, {"id": "s0_1_1", "md": "In fact, ==dragging== out a tired conversation is worse for both people.", "text": "In fact, dragging out a tired conversation is worse for both people.", "zh": "其实，硬撑一段聊乏了的对话，对双方都更糟。", "sp": null}, {"id": "s0_1_2", "md": "**Ending a conversation well leaves a better memory than ending it late.**", "text": "Ending a conversation well leaves a better memory than ending it late.", "zh": "好好结束一段对话，比拖到很晚才结束，留下的印象更好。", "sp": null}], [{"id": "s0_2_0", "md": "The trick is to make the exit feel like a natural close, not an ==escape==.", "text": "The trick is to make the exit feel like a natural close, not an escape.", "zh": "诀窍在于让离开感觉像是自然收尾，而不是落荒而逃。", "sp": null}, {"id": "s0_2_1", "md": "Think of it as the last line of a good story, not a door __slammed shut__.", "text": "Think of it as the last line of a good story, not a door slammed shut.", "zh": "把它想成一个好故事的最后一句，而不是「砰」地关上门。", "sp": null}, {"id": "s0_2_2", "md": "Done well, the other person walks away feeling heard, not dropped.", "text": "Done well, the other person walks away feeling heard, not dropped.", "zh": "收得好，对方走的时候会觉得被倾听了，而不是被晾下了。", "sp": null}]]}, {"heading": "2. Wrap, Reason, Return", "heading_zh": "2. 收尾、理由、留口子", "rows": [[{"id": "s1_0_0", "md": "First, ==summarize== the conversation in one line.", "text": "First, summarize the conversation in one line.", "zh": "第一步，用一句话总结刚才聊的。", "sp": null}, {"id": "s1_0_1", "md": "\"Well, it sounds like the move is finally behind you, that's great.\"", "text": "\"Well, it sounds like the move is finally behind you, that's great.\"", "zh": "「看来搬家这事终于告一段落了，真好。」", "sp": null}, {"id": "s1_0_2", "md": "A short summary tells the other person the conversation has reached its natural end.", "text": "A short summary tells the other person the conversation has reached its natural end.", "zh": "一句简短的总结，就是在告诉对方，这段对话到了自然的终点。", "sp": null}], [{"id": "s1_1_0", "md": "Second, give a brief, honest reason.", "text": "Second, give a brief, honest reason.", "zh": "第二步，给一个简短、真实的理由。", "sp": null}, {"id": "s1_1_1", "md": "\"I need to __jump on a call__ in five minutes\" or \"I should grab something to eat before my next meeting\" is enough.", "text": "\"I need to jump on a call in five minutes\" or \"I should grab something to eat before my next meeting\" is enough.", "zh": "「我五分钟后要上个会」或者「下个会之前我得先去吃点东西」，就够了。", "sp": null}, {"id": "s1_1_2", "md": "You do not need to ==justify== it further.", "text": "You do not need to justify it further.", "zh": "不需要再多解释。", "sp": null}], [{"id": "s1_2_0", "md": "Third, add a reason to talk again that __leaves the door open__.", "text": "Third, add a reason to talk again that leaves the door open.", "zh": "第三步，给下次再聊留个由头，把门留着。", "sp": null}, {"id": "s1_2_1", "md": "\"Let's continue this over lunch next week,\" or \"Send me that article, I'd love to read it.\"", "text": "\"Let's continue this over lunch next week,\" or \"Send me that article, I'd love to read it.\"", "zh": "「下周午饭的时候接着聊」，或者「把那篇文章发我，我挺想看的」。", "sp": null}, {"id": "s1_2_2", "md": "**People forgive a quick exit when it comes with a reason to talk again.**", "text": "People forgive a quick exit when it comes with a reason to talk again.", "zh": "只要离开时带着一个再聊的由头，人们都不会介意你走得快。", "sp": null}], [{"id": "s1_3_0", "md": "In group settings, it is even easier.", "text": "In group settings, it is even easier.", "zh": "在人多的场合，就更容易了。", "sp": null}, {"id": "s1_3_1", "md": "You can say, \"I'm going to __grab a refill__, great chatting with you,\" and ==drift== toward another circle.", "text": "You can say, \"I'm going to grab a refill, great chatting with you,\" and drift toward another circle.", "zh": "你可以说：「我去续杯，跟你聊得很开心。」然后慢慢挪到另一圈人那边。", "sp": null}, {"id": "s1_3_2", "md": "Nobody expects you to stay in one circle all evening.", "text": "Nobody expects you to stay in one circle all evening.", "zh": "没人指望你整晚都待在一个圈子里。", "sp": null}]]}], "gist": [{"q": "人们为什么常常被困在对话里？", "a": "担心离开显得冷淡、不尊重，于是点头微笑多待十分钟；其实拖着一段疲惫的对话对双方都更糟。"}, {"q": "作者给出的结束对话三步是什么？", "a": "Wrap 用一句话总结；Reason 给一个简短真实的理由，不必多解释；Return 留一个下次再聊的口子。"}, {"q": "在多人场合怎么脱身？", "a": "说一句“我去续杯，聊得很开心”，然后自然走向另一圈人。"}], "dictation": [{"id": "s0_1_2", "text": "Ending a conversation well leaves a better memory than ending it late."}, {"id": "s1_0_0", "text": "First, summarize the conversation in one line."}, {"id": "s1_1_2", "text": "You do not need to justify it further."}, {"id": "s1_2_2", "text": "People forgive a quick exit when it comes with a reason to talk again."}], "shadow": {"text": "Third, add a reason to talk again that leaves the door open. \"Let's continue this over lunch next week,\" or \"Send me that article, I'd love to read it.\" People forgive a quick exit when it comes with a reason to talk again.", "marked": "Third, add a <b>reason</b> to talk <b>again</b> / that leaves the <b>door</b> open. //<br>\"Let's <b>continue</b> this over lunch / next <b>week</b>,\" / or \"<b>Send</b> me that article, / I'd <b>love</b> to read it.\" //<br>People <b>forgive</b> a quick exit / when it comes with a <b>reason</b> / to talk <b>again</b>. //"}, "prompts": [{"q": "茶水间里一位产品经理拉着你聊了十分钟他家的装修，你两点有会。用“总结、理由、留口子”结束对话。", "ref": "Sounds like the kitchen is finally coming together, that must be a big relief. I'm sorry to cut this short, but I have a review at two and I still need to read the doc. Send me a photo when it's done though, I'd love to see how it turned out. Good luck with the painters!", "ref_zh": "听起来厨房终于快弄好了，肯定松了一大口气吧。不好意思得先打断一下，我两点有个评审，文档还没看。弄好了给我发张照片啊，挺想看看最后什么样。祝跟油漆师傅打交道顺利！", "id": "ref0"}, {"q": "公司活动上你和一位不太熟的同事已经聊完了话题，想去和另一圈人打招呼。30 秒得体离开。", "ref": "It was really nice to finally meet you in person, after all those calls. I'm going to grab another drink and say hi to a few people from the Jakarta team before they leave. Let's find a time next week to talk more about the data pipeline. I'll send you an invite tomorrow morning.", "ref_zh": "打了那么多电话，终于见到真人了，真的很高兴。我去再拿杯喝的，趁雅加达团队的几个人还没走，过去打个招呼。下周找个时间，我们再细聊聊数据 pipeline。我明天早上给你发邀请。", "id": "ref1"}], "words": [{"w": "dismissive", "ipa": "/dɪsˈmɪsɪv/", "zh": "轻视的、不屑一顾的", "ex": "His reply sounded dismissive, even though he didn't mean it that way.", "id": "w0"}, {"w": "drag out", "ipa": "/dræɡ aʊt/", "zh": "拖延、拖长", "ex": "Let's not drag out this meeting, we can settle the rest in the doc.", "id": "w1"}, {"w": "escape (n.)", "ipa": "/ɪˈskeɪp/", "zh": "逃离、脱身", "ex": "Leaving early felt like an escape, so I stayed and said goodbye properly.", "tts_w": "escape", "id": "w2"}, {"w": "summarize", "ipa": "/ˈsʌməˌraɪz/", "zh": "总结、概括", "ex": "Can someone summarize what we agreed before we drop off?", "id": "w3"}, {"w": "justify", "ipa": "/ˈdʒʌstɪˌfaɪ/", "zh": "证明……合理、为……辩解", "ex": "You'll need data to justify the extra headcount.", "id": "w4"}, {"w": "drift (v.)", "ipa": "/drɪft/", "zh": "漂移、慢慢走向", "ex": "The discussion drifted away from the origina const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {

});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
