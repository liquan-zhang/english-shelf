<script>
const D = {"id": "089", "title": "Ending a Conversation Gracefully", "meta": "B2 · 约 270 词 · 场景：结束闲聊", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why We Get Stuck", "heading_zh": "1. 为什么我们会被困住", "rows": [[{"id": "s0_0_0", "md": "Starting a conversation is hard, but ending one can be even harder.", "text": "Starting a conversation is hard, but ending one can be even harder.", "zh": "开启一段对话难，结束一段对话可能更难。", "sp": null}, {"id": "s0_0_1", "md": "You have run out of topics, the other person is still talking, and you need to get back to work.", "text": "You have run out of topics, the other person is still talking, and you need to get back to work.", "zh": "你已经没话题了，对方还在说，而你得回去干活。", "sp": null}, {"id": "s0_0_2", "md": "So you nod, smile, and stay ten minutes longer than you wanted.", "text": "So you nod, smile, and stay ten minutes longer than you wanted.", "zh": "于是你点头、微笑，比自己想的多待了十分钟。", "sp": null}], [{"id": "s0_1_0", "md": "Many of us stay because we are afraid that leaving will seem ==dismissive==.", "text": "Many of us stay because we are afraid that leaving will seem dismissive.", "zh": "很多人留下来，是怕一走了之显得敷衍。", "sp": null}, {"id": "s0_1_1", "md": "In fact, ==dragging== out a tired conversation is worse for both people.", "text": "In fact, dragging out a tired conversation is worse for both people.", "zh": "其实，硬撑一段聊乏了的对话，对双方都更糟。", "sp": null}, {"id": "s0_1_2", "md": "**Ending a conversation well leaves a better memory than ending it late.**", "text": "Ending a conversation well leaves a better memory than ending it late.", "zh": "好好结束一段对话，比拖到很晚才结束，留下的印象更好。", "sp": null}], [{"id": "s0_2_0", "md": "The trick is to make the exit feel like a natural close, not an ==escape==.", "text": "The trick is to make the exit feel like a natural close, not an escape.", "zh": "诀窍在于让离开感觉像是自然收尾，而不是落荒而逃。", "sp": null}, {"id": "s0_2_1", "md": "Think of it as the last line of a good story, not a door __slammed shut__.", "text": "Think of it as the last line of a good story, not a door slammed shut.", "zh": "把它想成一个好故事的最后一句，而不是「砰」地关上门。", "sp": null}, {"id": "s0_2_2", "md": "Done well, the other person walks away feeling heard, not dropped.", "text": "Done well, the other person walks away feeling heard, not dropped.", "zh": "收得好，对方走的时候会觉得被倾听了，而不是被晾下了。", "sp": null}]]}, {"heading": "2. Wrap, Reason, Return", "heading_zh": "2. 收尾、理由、留口子", "rows": [[{"id": "s1_0_0", "md": "First, ==summarize== the conversation in one line.", "text": "First, summarize the conversation in one line.", "zh": "第一步，用一句话总结刚才聊的。", "sp": null}, {"id": "s1_0_1", "md": "\"Well, it sounds like the move is finally behind you, that's great.\"", "text": "\"Well, it sounds like the move is finally behind you, that's great.\"", "zh": "「看来搬家这事终于告一段落了，真好。」", "sp": null}, {"id": "s1_0_2", "md": "A short summary tells the other person the conversation has reached its natural end.", "text": "A short summary tells the other person the conversation has reached its natural end.", "zh": "一句简短的总结，就是在告诉对方，这段对话到了自然的终点。", "sp": null}], [{"id": "s1_1_0", "md": "Second, give a brief, honest reason.", "text": "Second, give a brief, honest reason.", "zh": "第二步，给一个简短、真实的理由。", "sp": null}, {"id": "s1_1_1", "md": "\"I need to __jump on a call__ in five minutes\" or \"I should grab something to eat before my next meeting\" is enough.", "text": "\"I need to jump on a call in five minutes\" or \"I should grab something to eat before my next meeting\" is enough.", "zh": "「我五分钟后要上个会」或者「下个会之前我得先去吃点东西」，就够了。", "sp": null}, {"id": "s1_1_2", "md": "You do not need to ==justify== it further.", "text": "You do not need to justify it further.", "zh": "不需要再多解释。", "sp": null}], [{"id": "s1_2_0", "md": "Third, add a reason to talk again that __leaves the door open__.", "text": "Third, add a reason to talk again that leaves the door open.", "zh": "第三步，给下次再聊留个由头，把门留着。", "sp": null}, {"id": "s1_2_1", "md": "\"Let's continue this over lunch next week,\" or \"Send me that article, I'd love to read it.\"", "text": "\"Let's continue this over lunch next week,\" or \"Send me that article, I'd love to read it.\"", "zh": "「下周午饭的时候接着聊」，或者「把那篇文章发我，我挺想看的」。", "sp": null}, {"id": "s1_2_2", "md": "**People forgive a quick exit when it comes with a reason to talk again.**", "text": "People forgive a quick exit when it comes with a reason to talk again.", "zh": "只要离开时带着一个再聊的由头，人们都不会介意你走得快。", "sp": null}], [{"id": "s1_3_0", "md": "In group settings, it is even easier.", "text": "In group settings, it is even easier.", "zh": "在人多的场合，就更容易了。", "sp": null}, {"id": "s1_3_1", "md": "You can say, \"I'm going to __grab a refill__, great chatting with you,\" and ==drift== toward another circle.", "text": "You can say, \"I'm going to grab a refill, great chatting with you,\" and drift toward another circle.", "zh": "你可以说：「我去续杯，跟你聊得很开心。」然后慢慢挪到另一圈人那边。", "sp": null}, {"id": "s1_3_2", "md": "Nobody expects you to stay in one circle all evening.", "text": "Nobody expects you to stay in one circle all evening.", "zh": "没人指望你整晚都待在一个圈子里。", "sp": null}]]}], "gist": [{"q": "人们为什么常常被困在对话里？", "a": "担心离开显得冷淡、不尊重，于是点头微笑多待十分钟；其实拖着一段疲惫的对话对双方都更糟。"}, {"q": "作者给出的结束对话三步是什么？", "a": "Wrap 用一句话总结；Reason 给一个简短真实的理由，不必多解释；Return 留一个下次再聊的口子。"}, {"q": "在多人场合怎么脱身？", "a": "说一句“我去续杯，聊得很开心”，然后自然走向另一圈人。"}], "dictation": [{"id": "s0_1_2", "text": "Ending a conversation well leaves a better memory than ending it late."}, {"id": "s1_0_0", "text": "First, summarize the conversation in one line."}, {"id": "s1_1_2", "text": "You do not need to justify it further."}, {"id": "s1_2_2", "text": "People forgive a quick exit when it comes with a reason to talk again."}], "shadow": {"text": "Third, add a reason to talk again that leaves the door open. \"Let's continue this over lunch next week,\" or \"Send me that article, I'd love to read it.\" People forgive a quick exit when it comes with a reason to talk again.", "marked": "Third, add a <b>reason</b> to talk <b>again</b> / that leaves the <b>door</b> open. //<br>\"Let's <b>continue</b> this over lunch / next <b>week</b>,\" / or \"<b>Send</b> me that article, / I'd <b>love</b> to read it.\" //<br>People <b>forgive</b> a quick exit / when it comes with a <b>reason</b> / to talk <b>again</b>. //"}, "prompts": [{"q": "茶水间里一位产品经理拉着你聊了十分钟他家的装修，你两点有会。用“总结、理由、留口子”结束对话。", "ref": "Sounds like the kitchen is finally coming together, that must be a big relief. I'm sorry to cut this short, but I have a review at two and I still need to read the doc. Send me a photo when it's done though, I'd love to see how it turned out. Good luck with the painters!", "ref_zh": "听起来厨房终于快弄好了，肯定松了一大口气吧。不好意思得先打断一下，我两点有个评审，文档还没看。弄好了给我发张照片啊，挺想看看最后什么样。祝跟油漆师傅打交道顺利！", "id": "ref0"}, {"q": "公司活动上你和一位不太熟的同事已经聊完了话题，想去和另一圈人打招呼。30 秒得体离开。", "ref": "It was really nice to finally meet you in person, after all those calls. I'm going to grab another drink and say hi to a few people from the Jakarta team before they leave. Let's find a time next week to talk more about the data pipeline. I'll send you an invite tomorrow morning.", "ref_zh": "打了那么多电话，终于见到真人了，真的很高兴。我去再拿杯喝的，趁雅加达团队的几个人还没走，过去打个招呼。下周找个时间，我们再细聊聊数据 pipeline。我明天早上给你发邀请。", "id": "ref1"}], "words": [{"w": "dismissive", "ipa": "/dɪsˈmɪsɪv/", "zh": "轻视的、不屑一顾的", "ex": "His reply sounded dismissive, even though he didn't mean it that way.", "id": "w0"}, {"w": "drag out", "ipa": "/dræɡ aʊt/", "zh": "拖延、拖长", "ex": "Let's not drag out this meeting, we can settle the rest in the doc.", "id": "w1"}, {"w": "escape (n.)", "ipa": "/ɪˈskeɪp/", "zh": "逃离、脱身", "ex": "Leaving early felt like an escape, so I stayed and said goodbye properly.", "tts_w": "escape", "id": "w2"}, {"w": "summarize", "ipa": "/ˈsʌməˌraɪz/", "zh": "总结、概括", "ex": "Can someone summarize what we agreed before we drop off?", "id": "w3"}, {"w": "justify", "ipa": "/ˈdʒʌstɪˌfaɪ/", "zh": "证明……合理、为……辩解", "ex": "You'll need data to justify the extra headcount.", "id": "w4"}, {"w": "drift (v.)", "ipa": "/drɪft/", "zh": "漂移、慢慢走向", "ex": "The discussion drifted away from the origina , "sp": null, "gap": false, "start": 75.504, "end": 81.624, "words": [[75.688, 75.715], [75.793, 76.32], [76.333, 76.53], [76.543, 76.767], [76.78, 77.136], [77.149, 77.478], [77.491, 77.846], [78.28, 78.465], [78.715, 78.951], [78.965, 79.057], [79.07, 79.241], [79.254, 79.675], [80.083, 80.228], [80.241, 80.543], [80.557, 80.675], [80.688, 80.965], [80.978, 81.149]]}, {"kind": "s", "id": "s1_2_2", "md": "**People forgive a quick exit when it comes with a reason to talk again.**", "zh": "只要离开时带着一个再聊的由头，人们都不会介意你走得快。", "sp": null, "gap": false, "start": 81.624, "end": 85.608, "words": [[81.742, 82.006], [82.019, 82.348], [82.361, 82.44], [82.453, 82.769], [82.887, 83.321], [83.335, 83.479], [83.492, 83.571], [83.585, 83.861], [83.874, 84.019], [84.032, 84.071], [84.085, 84.492], [84.506, 84.571], [84.585, 84.874], [84.887, 85.216]]}, {"kind": "s", "id": "s1_3_0", "md": "In group settings, it is even easier.", "zh": "在人多的场合，就更容易了。", "sp": null, "gap": true, "start": 85.608, "end": 88.224, "words": [[85.713, 85.819], [85.832, 86.095], [86.108, 86.674], [86.897, 86.976], [86.99, 87.108], [87.121, 87.319], [87.332, 87.832]]}, {"kind": "s", "id": "s1_3_1", "md": "You can say, \"I'm going to __grab a refill__, great chatting with you,\" and ==drift== toward another circle.", "zh": "你可以说：「我去续杯，跟你聊得很开心。」然后慢慢挪到另一圈人那边。", "sp": null, "gap": false, "start": 88.224, "end": 94.464, "words": [[88.329, 88.421], [88.435, 88.553], [88.566, 88.961], [89.448, 89.592], [89.606, 89.724], [89.737, 89.803], [89.816, 90.092], [90.106, 90.145], [90.158, 90.882], [91.119, 91.421], [91.435, 91.803], [91.816, 91.987], [92.0, 92.171], [92.606, 92.724], [92.737, 93.106], [93.119, 93.342], [93.356, 93.619], [93.632, 94.066]]}, {"kind": "s", "id": "s1_3_2", "md": "Nobody expects you to stay in one circle all evening.", "zh": "没人指望你整晚都待在一个圈子里。", "sp": null, "gap": false, "start": 94.464, "end": 98.112, "words": [[94.569, 94.951], [94.964, 95.438], [95.451, 95.53], [95.543, 95.609], [95.622, 95.964], const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
