<script>
const D = {"id": "015", "title": "Answering Tough Questions After a Presentation", "meta": "B2 · 约 280 词 · 场景：答疑环节", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Every Hard Question Hides a Worry", "heading_zh": "1. 每个尖锐问题背后都藏着一份担心", "rows": [[{"id": "s0_0_0", "md": "You finish your talk, and the first hand goes up.", "text": "You finish your talk, and the first hand goes up.", "zh": "你讲完了，第一只手举了起来。", "sp": null}, {"id": "s0_0_1", "md": "\"Honestly, why should we trust this when the last migration failed?\"", "text": "\"Honestly, why should we trust this when the last migration failed?\"", "zh": "「说实话，上次迁移都失败了，凭什么让我们相信这次？」", "sp": null}, {"id": "s0_0_2", "md": "The room goes quiet, and everyone turns to see how you react.", "text": "The room goes quiet, and everyone turns to see how you react.", "zh": "全场安静下来，所有人都转过头看你怎么反应。", "sp": null}], [{"id": "s0_1_0", "md": "It is natural to hear a question like that as an attack and to start ==defending== yourself.", "text": "It is natural to hear a question like that as an attack and to start defending yourself.", "zh": "听到这种问题，人很自然会把它当成攻击，然后开始为自己辩护。", "sp": null}, {"id": "s0_1_1", "md": "But most tough questions are not really about you.", "text": "But most tough questions are not really about you.", "zh": "但大多数尖锐的问题其实不是冲你来的。", "sp": null}, {"id": "s0_1_2", "md": "They come from a worry the person has not fully ==articulated==, like losing a weekend to an outage or missing a deadline of their own.", "text": "They come from a worry the person has not fully articulated, like losing a weekend to an outage or missing a deadline of their own.", "zh": "它们来自对方还没完全说出口的担心，比如怕周末被故障搭进去，或者怕耽误自己的 deadline。", "sp": null}, {"id": "s0_1_3", "md": "**If you answer the worry instead of the wording, the tone of the room changes.**", "text": "If you answer the worry instead of the wording, the tone of the room changes.", "zh": "如果你回应的是这份担心，而不是字面上的措辞，全场的气氛就会变。", "sp": null}], [{"id": "s0_2_0", "md": "That means your first job is not to respond.", "text": "That means your first job is not to respond.", "zh": "所以你的第一件事不是回答。", "sp": null}, {"id": "s0_2_1", "md": "It is to understand what is really being asked, and to make the person feel ==heard== before you __make your case__.", "text": "It is to understand what is really being asked, and to make the person feel heard before you make your case.", "zh": "而是搞清楚对方真正在问什么，在摆出你的理由之前，先让对方感到自己被听见了。", "sp": null}]]}, {"heading": "2. Pause, Name the Concern, Answer Short", "heading_zh": "2. 停顿、点出顾虑、简短作答", "rows": [[{"id": "s1_0_0", "md": "Start with a real pause.", "text": "Start with a real pause.", "zh": "先真正停顿一下。", "sp": null}, {"id": "s1_0_1", "md": "Two seconds of silence makes you look ==thoughtful==, not lost, and it keeps you from replying on ==autopilot==.", "text": "Two seconds of silence makes you look thoughtful, not lost, and it keeps you from replying on autopilot.", "zh": "两秒钟的沉默会让你显得在思考，而不是懵了，还能防止你条件反射地张口就答。", "sp": null}], [{"id": "s1_1_0", "md": "Then name the concern behind the question.", "text": "Then name the concern behind the question.", "zh": "然后点出问题背后的顾虑。", "sp": null}, {"id": "s1_1_1", "md": "\"It sounds like the real concern is whether we'll repeat the mistakes from last time.\"", "text": "\"It sounds like the real concern is whether we'll repeat the mistakes from last time.\"", "zh": "「听起来你真正担心的是，我们会不会重蹈上次的覆辙。」", "sp": null}, {"id": "s1_1_2", "md": "If you got it wrong, the person will correct you, and now you know what to answer.", "text": "If you got it wrong, the person will correct you, and now you know what to answer.", "zh": "如果你理解错了，对方会纠正你，这样你就知道该回答什么了。", "sp": null}], [{"id": "s1_2_0", "md": "Give the headline first, in one sentence, then one piece of ==support==.", "text": "Give the headline first, in one sentence, then one piece of support.", "zh": "先用一句话给出结论，再给一个支撑点。", "sp": null}, {"id": "s1_2_1", "md": "\"Yes, we learned from it, and this time every step can be rolled back in minutes.\"", "text": "\"Yes, we learned from it, and this time every step can be rolled back in minutes.\"", "zh": "「会吸取教训的，这次每一步都能在几分钟内回滚。」", "sp": null}, {"id": "s1_2_2", "md": "**Short answers sound confident; long answers sound defensive.**", "text": "Short answers sound confident; long answers sound defensive.", "zh": "回答短，听起来就有底气；回答长，听起来就像在辩解。", "sp": null}], [{"id": "s1_3_0", "md": "If part of the challenge is fair, __admit it openly__.", "text": "If part of the challenge is fair, admit it openly.", "zh": "如果对方的质疑有一部分是对的，就大方承认。", "sp": null}, {"id": "s1_3_1", "md": "\"You're right that our testing was weak last time.\"", "text": "\"You're right that our testing was weak last time.\"", "zh": "「你说得对，上次我们的测试确实没做好。」", "sp": null}, {"id": "s1_3_2", "md": "Agreeing with the ==valid== part makes the rest of your answer far more believable.", "text": "Agreeing with the valid part makes the rest of your answer far more believable.", "zh": "认可合理的那部分，你其余的回答就可信得多。", "sp": null}, {"id": "s1_3_3", "md": "And if you need more time, offer to __take it offline__ rather than __drag the whole room__ into the details.", "text": "And if you need more time, offer to take it offline rather than drag the whole room into the details.", "zh": "如果需要更多时间，就提议会后单独聊，而不是把全场都拖进细节里。", "sp": null}]]}], "gist": [{"q": "作者认为刁钻问题背后通常是什么？", "a": "提问者没说出口的担忧，比如怕周末处理故障或耽误自己的截止日期，而不是针对你个人。"}, {"q": "回答刁钻问题的步骤是什么？", "a": "先真正停顿两秒；说出问题背后的担忧；先给一句结论再给一个支撑；对合理的部分坦然承认；细节太多就会后再谈。"}, {"q": "为什么作者说短回答更好？", "a": "短回答听起来自信，长回答听起来像在辩解。"}], "dictation": [{"id": "s0_1_3", "text": "If you answer the worry instead of the wording, the tone of the room changes."}, {"id": "s1_2_2", "text": "Short answers sound confident; long answers sound defensive."}, {"id": "s1_3_2", "text": "Agreeing with the valid part makes the rest of your answer far more believable."}, {"id": "s1_1_2", "text": "If you got it wrong, the person will correct you, and now you know what to answer."}], "shadow": {"text": "Then name the concern behind the question. \"It sounds like the real concern is whether we'll repeat the mistakes from last time.\"", "marked": "Then <b>name</b> the concern / <b>behind</b> the question. //<br>\"It sounds like the <b>real</b> concern / is whether we'll <b>repeat</b> the mistakes / from <b>last</b> time.\" //"}, "prompts": [{"q": "你讲完新架构方案，一位资深工程师质问：“上次重构拖了半年，凭什么这次能按时？”用 30 秒回应：停顿、说出背后的担忧、短答、承认合理部分。", "ref": "That's a fair question. It sounds like the real concern is whether this turns into another six-month project that blocks everyone else. You're right that the last refactor ran long, mostly because we tried to change everything at once. This time we're moving one service at a time, and each step ships on its own. If the first step slips, we'll know within three weeks, not six months.", "ref_zh": "这个问题很合理。听起来你真正担心的是，这会不会又变成一个拖半年、把所有人都卡住的项目。你说得对，上次重构确实超期了，主要是因为我们想一次把所有东西都改掉。这次我们一次只迁一个服务，每一步都单独上线。如果第一步延期了，我们三周内就会知道，而不是等到半年后。", "id": "ref0"}, {"q": "汇报结束时，有人提出一个很细的技术问题，需要十分钟才能讲清。用 30 秒给出简短回答，并把细节挪到会后。", "ref": "Great question, and the short answer is yes, the new cache handles that case. The full explanation involves how we invalidate keys across regions, and it would take a while to walk through properly. Rather than pull the whole group into the details, could we grab fifteen minutes after this? I'll also add a short section on it to the design doc, so anyone curious can read it.", "ref_zh": "好问题，简短的回答是：能，新缓存能处理这种情况。完整的解释涉及我们怎么跨地区让 key 失效，要讲清楚得花不少时间。与其把大家都拉进细节里，会后我们单独聊十五分钟怎么样？我也会在设计文档里加一小节讲这个，感兴趣的人都可以去看。", "id": "ref1"}], "words": [{"w": "defend", "ipa": "/dɪˈfend/", "zh": "辩护、捍卫", "ex": "I'm not trying to defend the old design; I just want to explain why we chose it.", "id": "w0"}, {"w": "heard (feel heard)", "ipa": "/hɜːrd/", "zh": "（感到）被倾听", "ex": "Repeat their concern first, so the customer feels heard.", "tts_w": "heard", "id": "w1"}, {"w": "thoughtful", "ipa": "/ˈθɔːtfəl/", "zh": "深思熟虑的", "ex": "Thanks for the thoughtful review comments on my pull request.", "id": "w2"}, {"w": "autopilot", const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
