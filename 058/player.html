const D = {"id": "058", "title": "When Your Report Wants to Quit", "meta": "B2 · 约 270 词 · 场景：留人谈话", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The First Five Minutes Matter Most", "heading_zh": "1. 最关键的是头五分钟", "rows": [[{"id": "s0_0_0", "md": "Your best backend engineer asks for a quick call and says, \"I've been thinking about leaving.\"", "text": "Your best backend engineer asks for a quick call and says, \"I've been thinking about leaving.\"", "zh": "你最好的后端工程师约你快速通个话，说：「我最近在考虑离开。」", "sp": null}, {"id": "s0_0_1", "md": "Your stomach drops.", "text": "Your stomach drops.", "zh": "你心里一沉。", "sp": null}, {"id": "s0_0_2", "md": "You think about the roadmap, the on-call rotation, and how you will explain this to your manager.", "text": "You think about the roadmap, the on-call rotation, and how you will explain this to your manager.", "zh": "你想到了 roadmap、on-call 排班，还有该怎么跟你老板解释。", "sp": null}], [{"id": "s0_1_0", "md": "In that moment, most managers make one of two mistakes.", "text": "In that moment, most managers make one of two mistakes.", "zh": "在那一刻，大多数管理者会犯两种错误中的一种。", "sp": null}, {"id": "s0_1_1", "md": "They panic and promise things they cannot deliver, or they ==take it personally== and go cold.", "text": "They panic and promise things they cannot deliver, or they take it personally and go cold.", "zh": "要么慌了，许下自己兑现不了的承诺；要么觉得是针对自己，态度一下子冷下来。", "sp": null}, {"id": "s0_1_2", "md": "Both reactions tell the engineer that your feelings matter more than theirs.", "text": "Both reactions tell the engineer that your feelings matter more than theirs.", "zh": "这两种反应都在告诉工程师：你的感受比他的更重要。", "sp": null}], [{"id": "s0_2_0", "md": "**Your first job is not to keep them; it is to understand them.**", "text": "Your first job is not to keep them; it is to understand them.", "zh": "你的第一要务不是留住他；而是理解他。", "sp": null}, {"id": "s0_2_1", "md": "Thank them for telling you early, because many people simply hand in a ==resignation== letter.", "text": "Thank them for telling you early, because many people simply hand in a resignation letter.", "zh": "谢谢他早点告诉你，因为很多人直接就递辞职信了。", "sp": null}, {"id": "s0_2_2", "md": "Then ==resist== the urge to __fix it on the spot__, and just listen.", "text": "Then resist the urge to fix it on the spot, and just listen.", "zh": "然后忍住当场解决问题的冲动，只是听。", "sp": null}]]}, {"heading": "2. Finding the Real Reason", "heading_zh": "2. 找到真正的原因", "rows": [[{"id": "s1_0_0", "md": "The first reason people give is often the safest one, like salary or a long commute.", "text": "The first reason people give is often the safest one, like salary or a long commute.", "zh": "人们给出的第一个理由，往往是最安全的那个，比如薪资或者通勤太远。", "sp": null}, {"id": "s1_0_1", "md": "Ask gently, \"If that were solved, would you still be thinking about leaving?\"", "text": "Ask gently, \"If that were solved, would you still be thinking about leaving?\"", "zh": "温和地问一句：「如果这个问题解决了，你还会考虑离开吗？」", "sp": null}, {"id": "s1_0_2", "md": "The answer usually __points to__ something deeper: boring work, a ==stalled== promotion, or tension with someone on the team.", "text": "The answer usually points to something deeper: boring work, a stalled promotion, or tension with someone on the team.", "zh": "答案通常会指向更深层的东西：工作没意思、晋升卡住了，或者跟团队里某个人有矛盾。", "sp": null}], [{"id": "s1_1_0", "md": "Once you know the real reason, be honest about what you can change.", "text": "Once you know the real reason, be honest about what you can change.", "zh": "一旦知道了真正的原因，就诚实地说清楚你能改变什么。", "sp": null}, {"id": "s1_1_1", "md": "If they want harder problems, you might move them onto the new streaming project next quarter.", "text": "If they want harder problems, you might move them onto the new streaming project next quarter.", "zh": "如果他想做更有挑战的事，你也许可以下个季度把他调到新的流式计算项目上。", "sp": null}, {"id": "s1_1_2", "md": "If they want a promotion that cannot happen this year, say so clearly.", "text": "If they want a promotion that cannot happen this year, say so clearly.", "zh": "如果他想要的晋升今年不可能实现，就明确说出来。", "sp": null}, {"id": "s1_1_3", "md": "**A vague promise that falls through later does more damage than a hard truth today.**", "text": "A vague promise that falls through later does more damage than a hard truth today.", "zh": "一个之后落空的含糊承诺，比今天一个难听的实话伤害更大。", "sp": null}], [{"id": "s1_2_0", "md": "Sometimes the right outcome is that they leave.", "text": "Sometimes the right outcome is that they leave.", "zh": "有时候，正确的结果就是他离开。", "sp": null}, {"id": "s1_2_1", "md": "A better opportunity elsewhere is not a ==betrayal==, and treating it like one hurts the team that stays behind.", "text": "A better opportunity elsewhere is not a betrayal, and treating it like one hurts the team that stays behind.", "zh": "外面有更好的机会并不是背叛，把它当成背叛，伤害的是留下来的团队。", "sp": null}, {"id": "s1_2_2", "md": "Help them hand over their work well, and __part on good terms__.", "text": "Help them hand over their work well, and part on good terms.", "zh": "帮他把工作好好交接，好聚好散。", "sp": null}, {"id": "s1_2_3", "md": "Engineers who leave ==gracefully== often come back, or send great people your way.", "text": "Engineers who leave gracefully often come back, or send great people your way.", "zh": "体面离开的工程师常常会回来，或者给你推荐很优秀的人。", "sp": null}]]}], "gist": [{"q": "听到下属想离职时，经理常犯哪两种错误？", "a": "慌乱之下许诺做不到的事，或者当成针对自己而变冷淡；两者都在告诉对方你的感受比他的重要。"}, {"q": "怎样找到对方想走的真实原因？", "a": "对方先说的往往是最安全的理由（薪水、通勤）；温和地问「如果这个解决了，你还会考虑走吗」，答案通常指向更深的原因。"}, {"q": "如果对方最终要走，作者建议怎么做？", "a": "别把它当背叛，帮他做好交接，好聚好散；体面离开的人常会回来或推荐好人选。"}], "dictation": [{"id": "s0_2_0", "text": "Your first job is not to keep them; it is to understand them."}, {"id": "s0_2_2", "text": "Then resist the urge to fix it on the spot, and just listen."}, {"id": "s1_1_3", "text": "A vague promise that falls through later does more damage than a hard truth today."}, {"id": "s1_2_0", "text": "Sometimes the right outcome is that they leave."}], "shadow": {"text": "In that moment, most managers make one of two mistakes. They panic and promise things they cannot deliver, or they take it personally and go cold. Both reactions tell the engineer that your feelings matter more than theirs.", "marked": "In that moment, / most managers make one of <b>two</b> mistakes. //<br>They <b>panic</b> / and promise things they <b>cannot</b> deliver, / or they take it <b>personally</b> / and go <b>cold</b>. //<br><b>Both</b> reactions tell the engineer / that <b>your</b> feelings matter more / than <b>theirs</b>. //"}, "prompts": [{"q": "下属在一对一里突然说他在考虑离职。用 30 秒回应：先感谢，不慌不许诺，然后请他多讲讲。", "ref": "Thank you for telling me, really. I know that's not an easy thing to bring up, and I'd much rather hear it from you now than read it in an email. I'm not going to try to talk you out of anything today. I just want to understand. Can you tell me more about what's been on your mind, and how long you've felt this way?", "ref_zh": "真的谢谢你告诉我。我知道这事不好开口，我宁愿现在听你亲口说，也不想在邮件里看到。今天我不会试图劝你什么。我只是想了解一下。能多跟我说说你最近在想什么吗？这种感觉有多久了？", "id": "ref0"}, {"q": "下属说想走是因为晋升没希望，而你知道今年确实升不了。用 30 秒诚实回应，同时说明你能做什么。", "ref": "I want to be straight with you, because you deserve that. A promotion this cycle isn't realistic; the calibration is already closed. What I can do is give you the payments redesign next quarter, which is exactly the scope the next level needs, and write a clear growth plan with you this week. If that's still not enough, I'll understand, and I'll support whatever you decide.", "ref_zh": "我想跟你直说，因为你值得我这么做。这一轮晋升不现实了；校准已经结束了。我能做的是下个季度把支付改版交给你，这正好是下一级需要的范围，这周再跟你一起写一份清晰的成长计划。如果这样还是不够，我能理解，不管你怎么决定我都支持。", "id": "ref1"}], "words": [{"w": "take it personally", "ipa": "/teɪk ɪt ˈpɜːrsənəli/", "zh": "当成针对自己", "ex": "Don't take it personally; the review comments are about the code.", "id": "w0"}, {"w": "resignation", "ipa": "/ˌrezɪɡˈneɪʃən/", "zh": "辞职（信）", "ex": "She handed in her resignation the day after the reorg.", "id": "w1"}, {"w": "resist", "ipa": "/rɪˈzɪst/", "zh": "抵制、忍住", "ex": "Resist the urge to deploy a hotfix before we understand the cause.", "id": "w2"}, {"w": "stalled", "ipa": "/stɔːld/", "zh": "停滞的" const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
