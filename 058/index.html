const D = {"id": "058", "title": "When Your Report Wants to Quit", "meta": "B2 · 约 270 词 · 场景：留人谈话", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The First Five Minutes Matter Most", "heading_zh": "1. 最关键的是头五分钟", "rows": [[{"id": "s0_0_0", "md": "Your best backend engineer asks for a quick call and says, \"I've been thinking about leaving.\"", "text": "Your best backend engineer asks for a quick call and says, \"I've been thinking about leaving.\"", "zh": "你最好的后端工程师约你快速通个话，说：「我最近在考虑离开。」", "sp": null}, {"id": "s0_0_1", "md": "Your stomach drops.", "text": "Your stomach drops.", "zh": "你心里一沉。", "sp": null}, {"id": "s0_0_2", "md": "You think about the roadmap, the on-call rotation, and how you will explain this to your manager.", "text": "You think about the roadmap, the on-call rotation, and how you will explain this to your manager.", "zh": "你想到了 roadmap、on-call 排班，还有该怎么跟你老板解释。", "sp": null}], [{"id": "s0_1_0", "md": "In that moment, most managers make one of two mistakes.", "text": "In that moment, most managers make one of two mistakes.", "zh": "在那一刻，大多数管理者会犯两种错误中的一种。", "sp": null}, {"id": "s0_1_1", "md": "They panic and promise things they cannot deliver, or they ==take it personally== and go cold.", "text": "They panic and promise things they cannot deliver, or they take it personally and go cold.", "zh": "要么慌了，许下自己兑现不了的承诺；要么觉得是针对自己，态度一下子冷下来。", "sp": null}, {"id": "s0_1_2", "md": "Both reactions tell the engineer that your feelings matter more than theirs.", "text": "Both reactions tell the engineer that your feelings matter more than theirs.", "zh": "这两种反应都在告诉工程师：你的感受比他的更重要。", "sp": null}], [{"id": "s0_2_0", "md": "**Your first job is not to keep them; it is to understand them.**", "text": "Your first job is not to keep them; it is to understand them.", "zh": "你的第一要务不是留住他；而是理解他。", "sp": null}, {"id": "s0_2_1", "md": "Thank them for telling you early, because many people simply hand in a ==resignation== letter.", "text": "Thank them for telling you early, because many people simply hand in a resignation letter.", "zh": "谢谢他早点告诉你，因为很多人直接就递辞职信了。", "sp": null}, {"id": "s0_2_2", "md": "Then ==resist== the urge to __fix it on the spot__, and just listen.", "text": "Then resist the urge to fix it on the spot, and just listen.", "zh": "然后忍住当场解决问题的冲动，只是听。", "sp": null}]]}, {"heading": "2. Finding the Real Reason", "heading_zh": "2. 找到真正的原因", "rows": [[{"id": "s1_0_0", "md": "The first reason people give is often the safest one, like salary or a long commute.", "text": "The first reason people give is often the safest one, like salary or a long commute.", "zh": "人们给出的第一个理由，往往是最安全的那个，比如薪资或者通勤太远。", "sp": null}, {"id": "s1_0_1", "md": "Ask gently, \"If that were solved, would you still be thinking about leaving?\"", "text": "Ask gently, \"If that were solved, would you still be thinking about leaving?\"", "zh": "温和地问一句：「如果这个问题解决了，你还会考虑离开吗？」", "sp": null}, {"id": "s1_0_2", "md": "The answer usually __points to__ something deeper: boring work, a ==stalled== promotion, or tension with someone on the team.", "text": "The answer usually points to something deeper: boring work, a stalled promotion, or tension with someone on the team.", "zh": "答案通常会指向更深层的东西：工作没意思、晋升卡住了，或者跟团队里某个人有矛盾。", "sp": null}], [{"id": "s1_1_0", "md": "Once you know the real reason, be honest about what you can change.", "text": "Once you know the real reason, be honest about what you can change.", "zh": "一旦知道了真正的原因，就诚实地说清楚你能改变什么。", "sp": null}, {"id": "s1_1_1", "md": "If they want harder problems, you might move them onto the new streaming project next quarter.", "text": "If they want harder problems, you might move them onto the new streaming project next quarter.", "zh": "如果他想做更有挑战的事，你也许可以下个季度把他调到新的流式计算项目上。", "sp": null}, {"id": "s1_1_2", "md": "If they want a promotion that cannot happen this year, say so clearly.", "text": "If they want a promotion that cannot happen this year, say so clearly.", "zh": "如果他想要的晋升今年不可能实现，就明确说出来。", "sp": null}, {"id": "s1_1_3", "md": "**A vague promise that falls through later does more damage than a hard truth today.**", "text": "A vague promise that falls through later does more damage than a hard truth today.", "zh": "一个之后落空的含糊承诺，比今天一个难听的实话伤害更大。", "sp": null}], [{"id": "s1_2_0", "md": "Sometimes the right outcome is that they leave.", "text": "Sometimes the right outcome is that they leave.", "zh": "有时候，正确的结果就是他离开。", "sp": null}, {"id": "s1_2_1", "md": "A better opportunity elsewhere is not a ==betrayal==, and treating it like one hurts the team that stays behind.", "text": "A better opportunity elsewhere is not a betrayal, and treating it like one hurts the team that stays behind.", "zh": "外面有更好的机会并不是背叛，把它当成背叛，伤害的是留下来的团队。", "sp": null}, {"id": "s1_2_2", "md": "Help them hand over their work well, and __part on good terms__.", "text": "Help them hand over their work well, and part on good terms.", "zh": "帮他把工作好好交接，好聚好散。", "sp": null}, {"id": "s1_2_3", "md": "Engineers who leave ==gracefully== often come back, or send great people your way.", "text": "Engineers who leave gracefully often come back, or send great people your way.", "zh": "体面离开的工程师常常会回来，或者给你推荐很优秀的人。", "sp": null}]]}], "gist": [{"q": "听到下属想离职时，经理常犯哪两种错误？", "a": "慌乱之下许诺做不到的事，或者当成针对自己而变冷淡；两者都在告诉对方你的感受比他的重要。"}, {"q": "怎样找到对方想走的真实原因？", "a": "对方先说的往往是最安全的理由（薪水、通勤）；温和地问「如果这个解决了，你还会考虑走吗」，答案通常指向更深的原因。"}, {"q": "如果对方最终要走，作者建议怎么做？", "a": "别把它当背叛，帮他做好交接，好聚好散；体面离开的人常会回来或推荐好人选。"}], "dictation": [{"id": "s0_2_0", "text": "Your first job is not to keep them; it is to understand them."}, {"id": "s0_2_2", "text": "Then resist the urge to fix it on the spot, and just listen."}, {"id": "s1_1_3", "text": "A vague promise that falls through later does more damage than a hard truth today."}, {"id": "s1_2_0", "text": "Sometimes the right outcome is that they leave."}], "shadow": {"text": "In that moment, most managers make one of two mistakes. They panic and promise things they cannot deliver, or they take it personally and const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;

const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
