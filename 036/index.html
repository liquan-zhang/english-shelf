<script>
const D = {"id": "036", "title": "Disagreeing with Your Manager in a One-on-One", "meta": "B2 · 约 260 词 · 场景：一对一", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Right Room for It", "heading_zh": "1. 选对场合", "rows": [[{"id": "s0_0_0", "md": "Your manager has decided to merge two teams, and you think it is a mistake.", "text": "Your manager has decided to merge two teams, and you think it is a mistake.", "zh": "你的经理决定把两个团队合并，而你觉得这是个错误。", "sp": null}, {"id": "s0_0_1", "md": "You could say nothing, complain to your peers, or raise it at the next ==all-hands==.", "text": "You could say nothing, complain to your peers, or raise it at the next all-hands.", "zh": "你可以什么都不说，可以跟同事吐槽，也可以在下一次全员大会上提出来。", "sp": null}, {"id": "s0_0_2", "md": "All three options are worse than a quiet conversation in your one-on-one.", "text": "All three options are worse than a quiet conversation in your one-on-one.", "zh": "这三种做法，都不如在 1:1 里私下好好聊一聊。", "sp": null}], [{"id": "s0_1_0", "md": "In private, your manager can change their mind without __losing face__.", "text": "In private, your manager can change their mind without losing face.", "zh": "私下里，经理改主意不会丢面子。", "sp": null}, {"id": "s0_1_1", "md": "In public, even a good point can feel like a challenge to their ==authority==.", "text": "In public, even a good point can feel like a challenge to their authority.", "zh": "当着大家的面，哪怕是一个好意见，也可能让人觉得是在挑战他的权威。", "sp": null}, {"id": "s0_1_2", "md": "**Disagree in private, early, and with specifics; support in public once it is decided.**", "text": "Disagree in private, early, and with specifics; support in public once it is decided.", "zh": "反对要私下提、早点提、具体地提；一旦定了，就在公开场合支持。", "sp": null}], [{"id": "s0_2_0", "md": "Timing matters too.", "text": "Timing matters too.", "zh": "时机也很重要。", "sp": null}, {"id": "s0_2_1", "md": "A concern raised before an announcement can still shape the plan.", "text": "A concern raised before an announcement can still shape the plan.", "zh": "在宣布之前提出顾虑，还有机会影响方案。", "sp": null}, {"id": "s0_2_2", "md": "After the announcement, the same concern sounds like ==resistance==, and your manager now has to __walk back__ something they said to the whole group.", "text": "After the announcement, the same concern sounds like resistance, and your manager now has to walk back something they said to the whole group.", "zh": "宣布之后再提同样的顾虑，听起来就像是在抵触，而经理也得把已经对全组说出口的话收回来。", "sp": null}]]}, {"heading": "2. Ask, Show, Listen", "heading_zh": "2. 先问、再摆事实、再听", "rows": [[{"id": "s1_0_0", "md": "Begin by asking for permission: \"Can I push back on something?\"", "text": "Begin by asking for permission: \"Can I push back on something?\"", "zh": "开头先征得同意：「我能对一件事提点不同意见吗？」", "sp": null}, {"id": "s1_0_1", "md": "It sounds small, but it __signals respect__ and gets your manager ready to listen.", "text": "It sounds small, but it signals respect and gets your manager ready to listen.", "zh": "这听起来是件小事，但它传递了尊重，也让经理做好了倾听的准备。", "sp": null}, {"id": "s1_0_2", "md": "Most managers will say yes, and now the disagreement is something they invited.", "text": "Most managers will say yes, and now the disagreement is something they invited.", "zh": "大多数经理都会说可以，这样一来，这次反对就成了他自己邀请来的。", "sp": null}], [{"id": "s1_1_0", "md": "Then describe what you see, not what you feel.", "text": "Then describe what you see, not what you feel.", "zh": "然后描述你看到的事实，而不是你的感受。", "sp": null}, {"id": "s1_1_1", "md": "\"If we merge the teams in March, both ==roadmaps== slip, and the on-call ==rotation== doubles for half the engineers.\"", "text": "\"If we merge the teams in March, both roadmaps slip, and the on-call rotation doubles for half the engineers.\"", "zh": "「如果三月份合并团队，两边的 roadmap 都会延期，一半工程师的 on-call 轮值会翻倍。」", "sp": null}, {"id": "s1_1_2", "md": "Facts about impact are much harder to __brush aside__ than \"I don't think this is a good idea.\"", "text": "Facts about impact are much harder to brush aside than \"I don't think this is a good idea.\"", "zh": "关于影响的事实，比一句「我觉得这不是个好主意」难糊弄过去得多。", "sp": null}], [{"id": "s1_2_0", "md": "Finish with a real question: \"What am I missing?\"", "text": "Finish with a real question: \"What am I missing?\"", "zh": "最后真诚地问一句：「我是不是漏了什么？」", "sp": null}, {"id": "s1_2_1", "md": "Your manager may know about budget cuts or a reorganization you cannot see yet.", "text": "Your manager may know about budget cuts or a reorganization you cannot see yet.", "zh": "你的经理可能知道一些你还看不到的预算削减或者组织调整。", "sp": null}, {"id": "s1_2_2", "md": "**Sometimes the best result of disagreeing is learning why you were wrong.**", "text": "Sometimes the best result of disagreeing is learning why you were wrong.", "zh": "有时候，提反对意见最好的结果，是搞明白自己为什么错了。", "sp": null}], [{"id": "s1_3_0", "md": "If the decision stands, say so out loud: \"Okay, I'll make it work.\"", "text": "If the decision stands, say so out loud: \"Okay, I'll make it work.\"", "zh": "如果决定不变，就明确说出来：「好，我来把它落地。」", "sp": null}, {"id": "s1_3_1", "md": "Then actually do it, without ==hinting== to your team that you were against it.", "text": "Then actually do it, without hinting to your team that you were against it.", "zh": "然后真的去做，别在团队面前暗示你当初是反对的。", "sp": null}]]}], "gist": [{"q": "为什么一对一是表达不同意的合适场合？", "a": "私下里经理可以改主意而不丢面子；公开场合再好的意见也像在挑战他的权威。"}, {"q": "为什么时机很重要？", "a": "宣布之前提的顾虑还能影响计划；宣布之后同样的话听起来像抵触，经理还得当众收回说过的话。"}, {"q": "在一对一里不同意经理的三步是什么？最后要做到什么？", "a": "先征求许可（「我能提个不同意见吗」）；讲具体影响而不是感受；问「我漏掉了什么」。如果决定不变，明确表态支持并真的执行，不向团队暗示自己反对。"}], "dictation": [{"id": "s0_1_2", "text": "Disagree in private, early, and with specifics; support in public once it is decided."}, {"id": "s1_2_2", "text": "Sometimes the best result of disagreeing is learning why you were wrong."}, {"id": "s0_2_1", "text": "A concern raised before an announcement can still shape the plan."}, {"id": "s1_1_0", "text": "Then describe what you see, not what you feel."}], "shadow": {"text": "Finish with a real question: \"What am I missing?\" Your manager may know about budget cuts or a reorganization you cannot see yet. Sometimes the best result of disagreeing is learning why you were wrong.", "marked": "Finish with a <b>real</b> question: / \"What am <b>I</b> missing?\" //<br>Your manager may know about <b>budget cuts</b> / or a <b>reorganization</b> / you cannot see <b>yet</b>. //<br>Sometimes the <b>best</b> result of disagreeing / is learning <b>why</b> you were <b>wrong</b>. //"}, "prompts": [{"q": "经理计划把你团队最资深的工程师调去支援另一个项目。在一对一里用 30 秒表达不同意：先征求许可，讲具体影响，再问你漏掉了什么。", "ref": "Can I push back on something? I'm worried about moving Wei to the search project next month. He's the only person who knows the billing service well, and we have the tax migration in April. Without him, I think that slips by at least three weeks, and on-call gets thinner. But I may not have the full picture. What am I missing about why search needs him now?", "ref_zh": "我能对一件事提点不同意见吗？我有点担心下个月把 Wei 调去搜索项目。他是唯一一个对计费服务很熟的人，而我们四月份还有税务迁移。没有他，我觉得那个项目至少要延期三周，on-call 的人手也会更紧。不过我可能了解得不全面。搜索项目为什么现在就需要他，我是不是漏了什么？", "id": "ref0"}, {"q": "你在一对一里反对过，但经理还是维持了原决定。用 30 秒表态支持，并说明你接下来会怎么做。", "ref": "Okay, thanks for explaining the budget side, that helps. I still have some concerns about the timeline, but I understand why we're doing it, and I'll make it work. I'll talk to the team this week and present it as our plan, not yours. I'll also flag early if the April date starts to look risky, so we can adjust before it becomes a problem.", "ref_zh": "好的，谢谢你把预算那边的情况讲清楚，这很有帮助。我对时间线还是有些顾虑，但我理解我们为什么要这么做，我会把它落地。这周我会跟团队沟通，把它当作我们的计划来讲，而不是你的。如果四月份的时间点开始有风险，我也会提前预警，这样我们能在问题出现之前调整。", "id": "ref1"}], "words": [{"w": "all-hands", "ipa": "/ˈɔːl hændz/", "zh": "全员大会", "ex": "The reorg will be announced at Friday's all-hands.", "tts_w": "all hands", "tts": "The reorganization will be announced at Friday's all hands.", "id": "w0"}, {"w": "authority", "ipa": "/əˈθɔːrəti/", "zh": "权威、职权", "ex": "She has the authority to approve the extra headcount.", "id": "w1"}, {"w": "resistance", "ipa": "/rɪˈzɪstəns/", "zh": "抵触、阻力", "ex": "We met some resistance when we p const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;

  for (const k of kids) el.append(k);

};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
