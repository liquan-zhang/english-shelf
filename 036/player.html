<script>
const D = {"id": "036", "title": "Disagreeing with Your Manager in a One-on-One", "meta": "B2 · 约 260 词 · 场景：一对一", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Right Room for It", "heading_zh": "1. 选对场合", "rows": [[{"id": "s0_0_0", "md": "Your manager has decided to merge two teams, and you think it is a mistake.", "text": "Your manager has decided to merge two teams, and you think it is a mistake.", "zh": "你的经理决定把两个团队合并，而你觉得这是个错误。", "sp": null}, {"id": "s0_0_1", "md": "You could say nothing, complain to your peers, or raise it at the next ==all-hands==.", "text": "You could say nothing, complain to your peers, or raise it at the next all-hands.", "zh": "你可以什么都不说，可以跟同事吐槽，也可以在下一次全员大会上提出来。", "sp": null}, {"id": "s0_0_2", "md": "All three options are worse than a quiet conversation in your one-on-one.", "text": "All three options are worse than a quiet conversation in your one-on-one.", "zh": "这三种做法，都不如在 1:1 里私下好好聊一聊。", "sp": null}], [{"id": "s0_1_0", "md": "In private, your manager can change their mind without __losing face__.", "text": "In private, your manager can change their mind without losing face.", "zh": "私下里，经理改主意不会丢面子。", "sp": null}, {"id": "s0_1_1", "md": "In public, even a good point can feel like a challenge to their ==authority==.", "text": "In public, even a good point can feel like a challenge to their authority.", "zh": "当着大家的面，哪怕是一个好意见，也可能让人觉得是在挑战他的权威。", "sp": null}, {"id": "s0_1_2", "md": "**Disagree in private, early, and with specifics; support in public once it is decided.**", "text": "Disagree in private, early, and with specifics; support in public once it is decided.", "zh": "反对要私下提、早点提、具体地提；一旦定了，就在公开场合支持。", "sp": null}], [{"id": "s0_2_0", "md": "Timing matters too.", "text": "Timing matters too.", "zh": "时机也很重要。", "sp": null}, {"id": "s0_2_1", "md": "A concern raised before an announcement can still shape the plan.", "text": "A concern raised before an announcement can still shape the plan.", "zh": "在宣布之前提出顾虑，还有机会影响方案。", "sp": null}, {"id": "s0_2_2", "md": "After the announcement, the same concern sounds like ==resistance==, and your manager now has to __walk back__ something they said to the whole group.", "text": "After the announcement, the same concern sounds like resistance, and your manager now has to walk back something they said to the whole group.", "zh": "宣布之后再提同样的顾虑，听起来就像是在抵触，而经理也得把已经对全组说出口的话收回来。", "sp": null}]]}, {"heading": "2. Ask, Show, Listen", "heading_zh": "2. 先问、再摆事实、再听", "rows": [[{"id": "s1_0_0", "md": "Begin by asking for permission: \"Can I push back on something?\"", "text": "Begin by asking for permission: \"Can I push back on something?\"", "zh": "开头先征得同意：「我能对一件事提点不同意见吗？」", "sp": null}, {"id": "s1_0_1", "md": "It sounds small, but it __signals respect__ and gets your manager ready to listen.", "text": "It sounds small, but it signals respect and gets your manager ready to listen.", "zh": "这听起来是件小事，但它传递了尊重，也让经理做好了倾听的准备。", "sp": null}, {"id": "s1_0_2", "md": "Most managers will say yes, and now the disagreement is something they invited.", "text": "Most managers will say yes, and now the disagreement is something they invited.", "zh": "大多数经理都会说可以，这样一来，这次反对就成了他自己邀请来的。", "sp": null}], [{"id": "s1_1_0", "md": "Then describe what you see, not what you feel.", "text": "Then describe what you see, not what you feel.", "zh": "然后描述你看到的事实，而不是你的感受。", "sp": null}, {"id": "s1_1_1", "md": "\"If we merge the teams in March, both ==roadmaps== slip, and the on-call ==rotation== doubles for half the engineers.\"", "text": "\"If we merge the teams in March, both roadmaps slip, and the on-call rotation doubles for half the engineers.\"", "zh": "「如果三月份合并团队，两边的 roadmap 都会延期，一半工程师的 on-call 轮值会翻倍。」", "sp": null}, {"id": "s1_1_2", "md": "Facts about impact are much harder to __brush aside__ than \"I don't think this is a good idea.\"", "text": "Facts about impact are much harder to brush aside than \"I don't think this is a good idea.\"", "zh": "关于影响的事实，比一句「我觉得这不是个好主意」难糊弄过去得多。", "sp": null}], [{"id": "s1_2_0", "md": "Finish with a real question: \"What am I missing?\"", "text": "Finish with a real question: \"What am I missing?\"", "zh": "最后真诚地问一句：「我是不是漏了什么？」", "sp": null}, {"id": "s1_2_1", "md": "Your manager may know about budget cuts or a reorganization you cannot see yet.", "text": "Your manager may know about budget cuts or a reorganization you cannot see yet.", "zh": "你的经理可能知道一些你还看不到的预算削减或者组织调整。", "sp": null}, {"id": "s1_2_2", "md": "**Sometimes the best result of disagreeing is learning why you were wrong.**", "text": "Sometimes the best result of disagreeing is learning why you were wrong.", "zh": "有时候，提反对意见最好的结果，是搞明白自己为什么错了。", "sp": null}], [{"id": "s1_3_0", "md": "If the decision stands, say so out loud: \"Okay, I'll make it work.\"", "text": "If the decision stands, say so out loud: \"Okay, I'll make it work.\"", "zh": "如果决定不变，就明确说出来：「好，我来把它落地。」", "sp": null}, {"id": "s1_3_1", "md": "Then actually do it, without ==hinting== to your team that you were against it.", "text": "Then actually do it, without hinting to your team that you were against it.", "zh": "然后真的去做，别在团队面前暗示你当初是反对的。", "sp": null}]]}], "gist": [{"q": "为什么一对一是表达不同意的合适场合？", "a": "私下里经理可以改主意而不丢面子；公开场合再好的意见也像在挑战他的权威。"}, {"q": "为什么时机很重要？", "a": "宣布之前提的顾虑还能影响计划；宣布之后同样的话听起来像抵触，经理还得当众收回说过的话。"}, {"q": "在一对一里不同意经理的三步是什么？最后要做到什么？", "a": "先征求许可（「我能提个不同意见吗」）；讲具体影响而不是感受；问「我漏掉了什么」。如果决定不变，明确表态支持并真的执行，不向团队暗示自己反对。"}], "dictation": [{"id": "s0_1_2", "text": "Disagree in private, early, and with specifics; support in public once it is decided."}, {"id": "s1_2_2", "text": "Sometimes the best result of disagreeing is learning why you were wrong."}, {"id": "s0_2_1", "text": "A concern raised before an announcement can still shape the plan."}, {"id": "s1_1_0", "text": "Then describe what you see, not what you feel."}], "shadow": {"text": "Finish with a real question: \"What am I missing?\" Your manager may know about budget cuts or a reorganization you cannot see yet. Sometimes the best result of disagreeing is learning why you were wrong.", "marked": "Finish with a <b>real</b> question: / \"What am <b>I</b> missing?\" //<br>Your manager may know about <b>budget cuts</b> / or a <b>reorganization</b> / you cannot see <b>yet</b>. //<br>Sometimes the <b>best</b> result of disagreeing / is learning <b>why</b> you were <b>wrong</b>. //"}, "prompts": [{"q": "经理计划把你团队最资深的工程师调去支援另一个项目。在一对一里用 30 秒表达不同意：先征求许可，讲具体影响，再问你漏掉了什么。", "ref": "Can I push back on something? I'm worried about moving Wei to the search project next month. He's the only person who knows the billing service well, and we have the tax migration in April. Without him, I think that slips by at least three weeks, and on-call gets thinner. But I may not have the full picture. What am I missing about why search needs him now?", "ref_zh": "我能对一件事提点不同意见吗？我有点担心下个月把 Wei 调去搜索项目。他是唯一一个对计费服务很熟的人，而我们四月份还有税务迁移。没有他，我觉得那个项目至少要延期三周，on-call 的人手也会更紧。不过我可能了解得不全面。搜索项目为什么现在就需要他，我是不是漏了什么？", "id": "ref0"}, {"q": "你在一对一里反对过，但经理还是维持了原决定。用 30 秒表态支持，并说明你接下来会怎么做。", "ref": "Okay, thanks for explaining the budget side, that helps. I still have some concerns about the timeline, but I understand why we're doing it, and I'll make it work. I'll talk to the team this week and present it as our plan, not yours. I'll also flag early if the April date starts to look risky, so we can adjust before it becomes a problem.", "ref_zh": "好的，谢谢你把预算那边的情况讲清楚，这很有帮助。我对时间线还是有些顾虑，但我理解我们为什么要这么做，我会把它落地。这周我会跟团队沟通，把它当作我们的计划来讲，而不是你的。如果四月份的时间点开始有风险，我也会提前预警，这样我们能在问题出现之前调整。", "id": "ref1"}], "words": [{"w": "all-hands", "ipa": "/ˈɔːl hændz/", "zh": "全员大会", "ex": "The reorg will be announced at Friday's all-hands.", "tts_w": "all hands", "tts": "The reorganization will be announced at Friday's all hands.", "id": "w0"}, {"w": "authority", "ipa": "/əˈθɔːrəti/", "zh": "权威、职权", "ex": "She has the authority to approve the extra headcount.", "id": "w1"}, {"w": "resistance", "ipa": "/rɪˈzɪstəns/", "zh": "抵触、阻力", "ex": "We met some resistance when we p const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
