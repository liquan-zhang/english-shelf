const D = {"id": "122", "type": "dialogue", "title": "At the Pharmacy", "meta": "B2 · 约 320 词 · 场景：药房买感冒药与用药咨询", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Pharmacist", "name_zh": "药剂师", "voice": "en-SG-WayneNeural"}}, "gist": [{"q": "「你」有什么症状？药剂师推荐了什么，怎么吃？", "a": "嗓子疼、鼻塞、有点干咳，不发烧；推荐日夜装感冒药，每六小时两片、一天最多四次、饭后吃。"}, {"q": "「你」为什么又回到药房？药剂师提醒了什么？", "a": "想问家里的扑热息痛能不能和感冒药一起吃；药剂师说感冒药里已含扑热息痛，不能重复吃，否则伤肝。"}, {"q": "孩子咳嗽，药剂师给了什么建议？", "a": "成人药不适合三岁孩子，改用儿童止咳糖浆，每次五毫升、一天三次；发烧就去看医生。"}], "dictation": [{"id": "s0_1_0", "text": "I've had a sore throat and a blocked nose since yesterday. What would you recommend?"}, {"id": "s0_5_0", "text": "Great. How often should I take them, and is it okay to take them on an empty stomach?"}, {"id": "s1_1_0", "text": "Can I take it together with the cold tablets you gave me?"}, {"id": "s1_9_0", "text": "Could you write the dose on the box for me, just so I don't get it wrong?"}], "shadow": {"speaker": "A", "text": "I've had a sore throat and a blocked nose since yesterday. What would you recommend?", "marked": "I've had a <b>sore throat</b> / and a <b>blocked nose</b> / since <b>yesterday</b>. //<br>What would you <b>recommend</b>? //"}, "prompts": [{"q": "你想买止痛药，但你最近在吃医生开的抗生素。用 30 秒跟药剂师说明情况，问清能不能一起吃、怎么吃。", "ref": "Hi, I need something for a headache, but I'm currently on antibiotics from my doctor. I finish them on Friday. Is it safe to take a painkiller at the same time? And should I take it with food, or does it matter? If there's anything I should avoid, please let me know.", "ref_zh": "你好，我想买点治头疼的药，但我现在在吃医生开的抗生素，周五吃完。同时吃止痛药安全吗？要跟饭一起吃吗，还是无所谓？如果有什么需要避免的，请告诉我。", "id": "ref0"}, {"q": "孩子被蚊子咬得很痒，抓破了。你去药房问有什么适合小孩用的药膏，以及要不要看医生。", "ref": "Hi, my daughter is two, and she's got a lot of mosquito bites on her legs. She keeps scratching them, and a couple are a bit red now. Do you have a cream that's safe for toddlers? How many times a day can I put it on? And at what point should I take her to a doctor?", "ref_zh": "你好，我女儿两岁，腿上被蚊子咬了很多包。她一直抓，有几个现在有点红。有没有适合幼儿用的药膏？一天能涂几次？到什么程度需要带她去看医生？", "id": "ref1"}], "words": [{"w": "drowsy", "ipa": "/ˈdraʊzi/", "zh": "昏昏欲睡的", "ex": "This medicine might make you drowsy, so don't drive.", "id": "w0"}, {"w": "dose", "ipa": "/doʊs/", "zh": "（药的）一剂，剂量", "ex": "Take one dose in the morning and one at night.", "id": "w1"}, {"w": "side effects", "ipa": "/ˈsaɪd ɪˌfekts/", "zh": "副作用", "ex": "The most common side effect is a mild headache.", "id": "w2"}, {"w": "lozenge", "ipa": "/ˈlɑːzɪndʒ/", "zh": "润喉糖，含片", "ex": "Suck a lozenge slowly when your throat feels dry.", "id": "w3"}, {"w": "paracetamol", "ipa": "/ˌpærəˈsiːtəmɑːl/", "zh": "扑热息痛（对乙酰氨基酚）", "ex": "We always keep some paracetamol in the first aid kit.", "id": "w4"}, {"w": "liver", "ipa": "/ˈlɪvər/", "zh": "肝脏", "ex": "Too much alcohol is bad for your liver.", "id": "w5"}, {"w": "ingredients", "ipa": "/ɪnˈɡriːdiənts/", "zh": "成分", "ex": "Check the ingredients if your child has any allergies.", "id": "w6"}, {"w": "syrup", "ipa": "/ˈsɪrəp/", "zh": "糖浆", "ex": "Kids usually find cough syrup easier to take than tablets.", "id": "w7"}, {"w": "double up", "ipa": "/ˈdʌbəl ʌp/", "zh": "重复（服用）；加倍", "ex": "If you miss a dose, don't double up the next time.", "id": "w8"}], "sections": [{"heading": "1. At the Counter", "heading_zh": "1. 在柜台", "rows": [[{"id": "s0_0_0", "md": "Hi there, what can I get for you today?", "text": "Hi there, what can I get for you today?", "zh": "你好，今天需要点什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I've had a sore throat and a blocked nose since yesterday. What would you recommend?**", "text": "I've had a sore throat and a blocked nose since yesterday. What would you recommend?", "zh": "我从昨天开始嗓子疼、鼻子堵。你推荐吃点什么？", "sp": "A"}], [{"id": "s0_2_0", "md": "Any fever or cough? And are you taking any other medication at the moment?", "text": "Any fever or cough? And are you taking any other medication at the moment?", "zh": "有发烧或咳嗽吗？你现在有在吃别的药吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "No fever, just a bit of a dry cough. I'm not on anything else.", "text": "No fever, just a bit of a dry cough. I'm not on anything else.", "zh": "不发烧，就是有点干咳。没在吃别的药。", "sp": "A"}], [{"id": "s0_4_0", "md": "Then this day and night pack is a good option. The day tablets won't make you ==drowsy==, but the night ones will help you sleep.", "text": "Then this day and night pack is a good option. The day tablets won't make you drowsy, but the night ones will help you sleep.", "zh": "那这个日夜装挺合适。白天的片不会让你犯困，晚上的能帮你睡觉。", "sp": "B"}], [{"id": "s0_5_0", "md": "Great. __How often should I take__ them, and __is it okay to__ take them on an empty stomach?", "text": "Great. How often should I take them, and is it okay to take them on an empty stomach?", "zh": "好。多久吃一次？空腹吃可以吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "Two tablets every six hours, no more than four ==doses== a day. Better to take them after food.", "text": "Two tablets every six hours, no more than four doses a day. Better to take them after food.", "zh": "每六小时两片，一天不超过四次。最好饭后吃。", "sp": "B"}], [{"id": "s0_7_0", "md": "Got it. Are there any ==side effects== I should watch out for?", "text": "Got it. Are there any side effects I should watch out for?", "zh": "明白。有什么副作用需要注意吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "Some people get a dry mouth. Avoid alcohol, and if it's not better in five days, see a doctor.", "text": "Some people get a dry mouth. Avoid alcohol, and if it's not better in five days, see a doctor.", "zh": "有些人会口干。别喝酒，五天还不好就去看医生。", "sp": "B"}], [{"id": "s0_9_0", "md": "Makes sense. I'll also __grab some__ throat ==lozenges==. Which ones work best?", "text": "Makes sense. I'll also grab some throat lozenges. Which ones work best?", "zh": "有道理。我再拿点润喉糖。哪种效果最好？", "sp": "A"}], [{"id": "s0_10_0", "md": "These honey and lemon ones are popular. That'll be eighteen fifty altogether.", "text": "These honey and lemon ones are popular. That'll be eighteen fifty altogether.", "zh": "这款蜂蜜柠檬的卖得最好。一共十八块五。", "sp": "B"}]]}, {"heading": "2. Coming Back with a Question", "heading_zh": "2. 回来再问一个问题", "rows": [[{"id": "s1_0_0", "md": "Hi, sorry, I was here this morning. I just remembered I have some ==paracetamol== at home for headaches.", "text": "Hi, sorry, I was here this morning. I just remembered I have some paracetamol at home for headaches.", "zh": "你好，不好意思，我早上来过。我刚想起来家里有扑热息痛，平时头疼吃的。", "sp": "A"}], [{"id": "s1_1_0", "md": "**Can I take it together with the cold tablets you gave me?**", "text": "Can I take it together with the cold tablets you gave me?", "zh": "它能和你给我的感冒药一起吃吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Good thing you asked. These tablets already contain paracetamol, so please don't __double up__.", "text": "Good thing you asked. These tablets already contain paracetamol, so please don't double up.", "zh": "幸好你问了。这个感冒药里已经含扑热息痛了，千万别重复吃。", "sp": "B"}], [{"id": "s1_3_0", "md": "Oh, I had no idea. What happens if you take too much?", "text": "Oh, I had no idea. What happens if you take too much?", "zh": "哦，我完全不知道。吃多了会怎么样？", "sp": "A"}], [{"id": "s1_4_0", "md": "It can damage your ==liver==, so stick to the dose on the box. Always check the ==ingredients== list.", "text": "It can damage your liver, so stick to the dose on the box. Always check the ingredients list.", "zh": "可能会伤肝，所以按盒子上的剂量吃。一定要看成分表。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thanks, that's really helpful. One more thing. My son's coughing too. Can he take the same thing?", "text": "Thanks, that's really helpful. One more thing. My son's coughing too. Can he take the same thing?", "zh": "谢谢，太有用了。还有一件事，我儿子也在咳嗽。他能吃一样的药吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "How old is he?", "text": "How old is he?", "zh": "他几岁了？", "sp": "B"}], [{"id": "s1_7_0", "md": "He just turned three.", "text": "He just turned three.", "zh": "刚满三岁。", "sp": "A"}], [{"id": "s1_8_0", "md": "Then no. Adult tablets aren't suitable for young kids. I'd suggest this children's cough ==syrup==, and th const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
