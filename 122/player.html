<script>
const D = {"id": "122", "type": "dialogue", "title": "At the Pharmacy", "meta": "B2 · 约 320 词 · 场景：药房买感冒药与用药咨询", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Pharmacist", "name_zh": "药剂师", "voice": "en-SG-WayneNeural"}}, "gist": [{"q": "「你」有什么症状？药剂师推荐了什么，怎么吃？", "a": "嗓子疼、鼻塞、有点干咳，不发烧；推荐日夜装感冒药，每六小时两片、一天最多四次、饭后吃。"}, {"q": "「你」为什么又回到药房？药剂师提醒了什么？", "a": "想问家里的扑热息痛能不能和感冒药一起吃；药剂师说感冒药里已含扑热息痛，不能重复吃，否则伤肝。"}, {"q": "孩子咳嗽，药剂师给了什么建议？", "a": "成人药不适合三岁孩子，改用儿童止咳糖浆，每次五毫升、一天三次；发烧就去看医生。"}], "dictation": [{"id": "s0_1_0", "text": "I've had a sore throat and a blocked nose since yesterday. What would you recommend?"}, {"id": "s0_5_0", "text": "Great. How often should I take them, and is it okay to take them on an empty stomach?"}, {"id": "s1_1_0", "text": "Can I take it together with the cold tablets you gave me?"}, {"id": "s1_9_0", "text": "Could you write the dose on the box for me, just so I don't get it wrong?"}], "shadow": {"speaker": "A", "text": "I've had a sore throat and a blocked nose since yesterday. What would you recommend?", "marked": "I've had a <b>sore throat</b> / and a <b>blocked nose</b> / since <b>yesterday</b>. //<br>What would you <b>recommend</b>? //"}, "prompts": [{"q": "你想买止痛药，但你最近在吃医生开的抗生素。用 30 秒跟药剂师说明情况，问清能不能一起吃、怎么吃。", "ref": "Hi, I need something for a headache, but I'm currently on antibiotics from my doctor. I finish them on Friday. Is it safe to take a painkiller at the same time? And should I take it with food, or does it matter? If there's anything I should avoid, please let me know.", "ref_zh": "你好，我想买点治头疼的药，但我现在在吃医生开的抗生素，周五吃完。同时吃止痛药安全吗？要跟饭一起吃吗，还是无所谓？如果有什么需要避免的，请告诉我。", "id": "ref0"}, {"q": "孩子被蚊子咬得很痒，抓破了。你去药房问有什么适合小孩用的药膏，以及要不要看医生。", "ref": "Hi, my daughter is two, and she's got a lot of mosquito bites on her legs. She keeps scratching them, and a couple are a bit red now. Do you have a cream that's safe for toddlers? How many times a day can I put it on? And at what point should I take her to a doctor?", "ref_zh": "你好，我女儿两岁，腿上被蚊子咬了很多包。她一直抓，有几个现在有点红。有没有适合幼儿用的药膏？一天能涂几次？到什么程度需要带她去看医生？", "id": "ref1"}], "words": [{"w": "drowsy", "ipa": "/ˈdraʊzi/", "zh": "昏昏欲睡的", "ex": "This medicine might make you drowsy, so don't drive.", "id": "w0"}, {"w": "dose", "ipa": "/doʊs/", "zh": "（药的）一剂，剂量", "ex": "Take one dose in the morning and one at night.", "id": "w1"}, {"w": "side effects", "ipa": "/ˈsaɪd ɪˌfekts/", "zh": "副作用", "ex": "The most common side effect is a mild headache.", "id": "w2"}, {"w": "lozenge", "ipa": "/ˈlɑːzɪndʒ/", "zh": "润喉糖，含片", "ex": "Suck a lozenge slowly when your throat feels dry.", "id": "w3"}, {"w": "paracetamol", "ipa": "/ˌpærəˈsiːtəmɑːl/", "zh": "扑热息痛（对乙酰氨基酚）", "ex": "We always keep some paracetamol in the first aid kit.", "id": "w4"}, {"w": "liver", "ipa": "/ˈlɪvər/", "zh": "肝脏", "ex": "Too much alcohol is bad for your liver.", "id": "w5"}, {"w": "ingredients", "ipa": "/ɪnˈɡriːdiənts/", "zh": "成分", "ex": "Check the ingredients if your child has any allergies.", "id": "w6"}, {"w": "syrup", "ipa": "/ˈsɪrəp/", "zh": "糖浆", "ex": "Kids usually find cough syrup easier to take than tablets.", "id": "w7"}, {"w": "double up", "ipa": "/ˈdʌbəl ʌp/", "zh": "重复（服用）；加倍", "ex": "If you miss a dose, don't double up the next time.", "id": "w8"}], "sections": [{"heading": "1. At the Counter", "heading_zh": "1. 在柜台", "rows": [[{"id": "s0_0_0", "md": "Hi there, what can I get for you today?", "text": "Hi there, what can I get for you today?", "zh": "你好，今天需要点什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I've had a sore throat and a blocked nose since yesterday. What would you recommend?**", "text": "I've had a sore throat and a blocked nose since yesterday. What would you recommend?", "zh": "我从昨天开始嗓子疼、鼻子堵。你推荐吃点什么？", "sp": "A"}], [{"id": "s0_2_0", "md": "Any fever or cough? And are you taking any other medication at the moment?", "text": "Any fever or cough? And are you taking any other medication at the moment?", "zh": "有发烧或咳嗽吗？你现在有在吃别的药吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "No fever, just a bit of a dry cough. I'm not on anything else.", "text": "No fever, just a bit of a dry cough. I'm not on anything else.", "zh": "不发烧，就是有点干咳。没在吃别的药。", "sp": "A"}], [{"id": "s0_4_0", "md": "Then this day and night pack is a good option. The day tablets won't make you ==drowsy==, but the night ones will help you sleep.", "text": "Then this day and night pack is a good option. The day tablets won't make you drowsy, but the night ones will help you sleep.", "zh": "那这个日夜装挺合适。白天的片不会让你犯困，晚上的能帮你睡觉。", "sp": "B"}], [{"id": "s0_5_0", "md": "Great. __How often should I take__ them, and __is it okay to__ take them on an empty stomach?", "text": "Great. How often should I take them, and is it okay to take them on an empty stomach?", "zh": "好。多久吃一次？空腹吃可以吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "Two tablets every six hours, no more than four ==doses== a day. Better to take them after food.", "text": "Two tablets every six hours, no more than four doses a day. Better to take them after food.", "zh": "每六小时两片，一天不超过四次。最好饭后吃。", "sp": "B"}], [{"id": "s0_7_0", "md": "Got it. Are there any ==side effects== I should watch out for?", "text": "Got it. Are there any side effects I should watch out for?", "zh": "明白。有什么副作用需要注意吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "Some people get a dry mouth. Avoid alcohol, and if it's not better in five days, see a doctor.", "text": "Some people get a dry mouth. Avoid alcohol, and if it's not better in five days, see a doctor.", "zh": "有些人会口干。别喝酒，五天还不好就去看医生。", "sp": "B"}], [{"id": "s0_9_0", "md": "Makes sense. I'll also __grab some__ throat ==lozenges==. Which ones work best?", "text": "Makes sense. I'll also grab some throat lozenges. Which ones work best?", "zh": "有道理。我再拿点润喉糖。哪种效果最好？", "sp": "A"}], [{"id": "s0_10_0", "md": "These honey and lemon ones are popular. That'll be eighteen fifty altogether.", "text": "These honey and lemon ones are popular. That'll be eighteen fifty altogether.", "zh": "这款蜂蜜柠檬的卖得最好。一共十八块五。", "sp": "B"}]]}, {"heading": "2. Coming Back with a Question", "heading_zh": "2. 回来再问一个问题", "rows": [[{"id": "s1_0_0", "md": "Hi, sorry, I was here this morning. I just remembered I have some ==paracetamol== at home for headaches.", "text": "Hi, sorry, I was here this morning. I just remembered I have some paracetamol at home for headaches.", "zh": "你好，不好意思，我早上来过。我刚想起来家里有扑热息痛，平时头疼吃的。", "sp": "A"}], [{"id": "s1_1_0", "md": "**Can I take it together with the cold tablets you gave me?**", "text": "Can I take it together with the cold tablets you gave me?", "zh": "它能和你给我的感冒药一起吃吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Good thing you asked. These tablets already contain paracetamol, so please don't __double up__.", "text": "Good thing you asked. These tablets already contain paracetamol, so please don't double up.", "zh": "幸好你问了。这个感冒药里已经含扑热息痛了，千万别重复吃。", "sp": "B"}], [{"id": "s1_3_0", "md": "Oh, I had no idea. What happens if you take too much?", "text": "Oh, I had no idea. What happens if you take too much?", "zh": "哦，我完全不知道。吃多了会怎么样？", "sp": "A"}], [{"id": "s1_4_0", "md": "It can damage your ==liver==, so stick to the dose on the box. Always check the ==ingredients== list.", "text": "It can damage your liver, so stick to the dose on the box. Always check the ingredients list.", "zh": "可能会伤肝，所以按盒子上的剂量吃。一定要看成分表。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thanks, that's really helpful. One more thing. My son's coughing too. Can he take the same thing?", "text": "Thanks, that's really helpful. One more thing. My son's coughing too. Can he take the same thing?", "zh": "谢谢，太有用了。还有一件事，我儿子也在咳嗽。他能吃一样的药吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "How old is he?", "text": "How old is he?", "zh": "他几岁了？", "sp": "B"}], [{"id": "s1_7_0", "md": "He just turned three.", "text": "He just turned three.", "zh": "刚满三岁。", "sp": "A"}], [{"id": "s1_8_0", "md": "Then no. Adult tablets aren't suitable for young kids. I'd suggest this children's cough ==syrup==, and th const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
