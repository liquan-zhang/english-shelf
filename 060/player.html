<script>
const D = {"id": "060", "title": "Asking for Feedback on Yourself", "meta": "B2 · 约 280 词 · 场景：向他人要反馈", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why \"Any Feedback?\" Gets Nothing", "heading_zh": "1. 为什么「有什么反馈吗？」问不出东西", "rows": [[{"id": "s0_0_0", "md": "At the end of a one-on-one, you ask your engineer, \"Any feedback for me?\"", "text": "At the end of a one-on-one, you ask your engineer, \"Any feedback for me?\"", "zh": "1:1 快结束时，你问你的工程师：「对我有什么反馈吗？」", "sp": null}, {"id": "s0_0_1", "md": "She smiles and says, \"No, all good.\"", "text": "She smiles and says, \"No, all good.\"", "zh": "她笑笑说：「没有，都挺好的。」", "sp": null}, {"id": "s0_0_2", "md": "You both move on, and you learn nothing.", "text": "You both move on, and you learn nothing.", "zh": "你们俩就翻篇了，你什么也没了解到。", "sp": null}], [{"id": "s0_1_0", "md": "She is not lying.", "text": "She is not lying.", "zh": "她没有撒谎。", "sp": null}, {"id": "s0_1_1", "md": "The question is simply too broad, and the ==power== gap makes honesty risky.", "text": "The question is simply too broad, and the power gap makes honesty risky.", "zh": "只是这个问题太宽泛了，而且上下级之间的权力差距让说实话变得有风险。", "sp": null}, {"id": "s0_1_2", "md": "Telling your manager what they do badly feels like a career gamble, so the safe answer wins every time.", "text": "Telling your manager what they do badly feels like a career gamble, so the safe answer wins every time.", "zh": "告诉老板他哪里做得不好，感觉像是拿职业前途在赌，所以每次都是安全的回答胜出。", "sp": null}, {"id": "s0_1_3", "md": "**The more power you have, the less honest feedback you get by default.**", "text": "The more power you have, the less honest feedback you get by default.", "zh": "你的权力越大，默认情况下你听到的真话就越少。", "sp": null}], [{"id": "s0_2_0", "md": "As a lead, this creates a dangerous ==blind spot==.", "text": "As a lead, this creates a dangerous blind spot.", "zh": "作为 lead，这会造成一个危险的盲区。", "sp": null}, {"id": "s0_2_1", "md": "Your habits in meetings, your tone in code reviews, and your decisions under pressure all affect the team.", "text": "Your habits in meetings, your tone in code reviews, and your decisions under pressure all affect the team.", "zh": "你开会的习惯、你在 code review 里的语气、你在压力下做的决定，都会影响团队。", "sp": null}, {"id": "s0_2_2", "md": "Yet you are the last person to hear about them, unless you __go looking for__ it ==deliberately==.", "text": "Yet you are the last person to hear about them, unless you go looking for it deliberately.", "zh": "可你却是最后一个听说这些的人，除非你刻意去找。", "sp": null}]]}, {"heading": "2. Make It Easy and Safe to Answer", "heading_zh": "2. 让回答变得容易又安全", "rows": [[{"id": "s1_0_0", "md": "Replace the broad question with a narrow one.", "text": "Replace the broad question with a narrow one.", "zh": "把宽泛的问题换成具体的问题。", "sp": null}, {"id": "s1_0_1", "md": "\"What's one thing I could do differently in our sprint planning?\" is much easier to answer.", "text": "\"What's one thing I could do differently in our sprint planning?\" is much easier to answer.", "zh": "「在 sprint 规划会上，有哪一件事是我可以换个做法的？」这就好回答多了。", "sp": null}, {"id": "s1_0_2", "md": "Asking for one thing also signals that you expect something, so \"all good\" __no longer works__.", "text": "Asking for one thing also signals that you expect something, so \"all good\" no longer works.", "zh": "只要一件事，也是在表明你期待听到点什么，所以「都挺好的」就不管用了。", "sp": null}], [{"id": "s1_1_0", "md": "Give people time, too.", "text": "Give people time, too.", "zh": "也要给对方时间。", "sp": null}, {"id": "s1_1_1", "md": "Send the question a day before the meeting, so they can think instead of ==improvise==.", "text": "Send the question a day before the meeting, so they can think instead of improvise.", "zh": "提前一天把问题发过去，这样他们可以想一想，而不是临场发挥。", "sp": null}, {"id": "s1_1_2", "md": "Some will feel safer writing it down than saying it to your face.", "text": "Some will feel safer writing it down than saying it to your face.", "zh": "有些人觉得写下来比当面说更安全。", "sp": null}], [{"id": "s1_2_0", "md": "When the feedback comes, your reaction decides whether you get more.", "text": "When the feedback comes, your reaction decides whether you get more.", "zh": "反馈来了之后，你的反应决定了你以后还能不能听到更多。", "sp": null}, {"id": "s1_2_1", "md": "Do not explain, defend, or __correct the details__.", "text": "Do not explain, defend, or correct the details.", "zh": "别解释，别辩护，也别去纠正细节。", "sp": null}, {"id": "s1_2_2", "md": "Just say, \"Thank you, that's really ==useful==,\" and ask one follow-up question if you need clarity.", "text": "Just say, \"Thank you, that's really useful,\" and ask one follow-up question if you need clarity.", "zh": "就说一句「谢谢，这很有用」，如果需要弄清楚，再追问一个问题。", "sp": null}, {"id": "s1_2_3", "md": "**If you argue with the first piece of feedback, it will be the last one you get.**", "text": "If you argue with the first piece of feedback, it will be the last one you get.", "zh": "如果你跟第一条反馈争起来，它就会是你收到的最后一条。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, show that it mattered.", "text": "Finally, show that it mattered.", "zh": "最后，让对方看到这条反馈起了作用。", "sp": null}, {"id": "s1_3_1", "md": "A few weeks later, tell them what you changed because of what they said.", "text": "A few weeks later, tell them what you changed because of what they said.", "zh": "几周之后，告诉他们你因为他们的话改了什么。", "sp": null}, {"id": "s1_3_2", "md": "That visible ==follow-through== is what turns one brave comment into a habit.", "text": "That visible follow-through is what turns one brave comment into a habit.", "zh": "正是这种看得见的跟进，把一次鼓起勇气的发言变成了一种习惯。", "sp": null}]]}], "gist": [{"q": "为什么问 \"Any feedback for me?\" 什么也得不到？", "a": "问题太宽泛，加上权力差距让说真话有风险，安全的回答总会胜出；你权力越大，默认得到的真话越少。"}, {"q": "怎样问才更容易得到真实反馈？", "a": "换成很窄的问题，比如「我在迭代规划会上可以改的一件事是什么」；提前一天发问题，让对方有时间想，也可以书面回答。"}, {"q": "收到反馈后应该怎么做？", "a": "不解释、不辩护、不纠正细节，只说谢谢，必要时追问一句；几周后告诉对方你因此改了什么。"}], "dictation": [{"id": "s0_1_3", "text": "The more power you have, the less honest feedback you get by default."}, {"id": "s1_0_0", "text": "Replace the broad question with a narrow one."}, {"id": "s1_2_0", "text": "When the feedback comes, your reaction decides whether you get more."}, {"id": "s1_2_3", "text": "If you argue with the first piece of feedback, it will be the last one you get."}], "shadow": {"text": "When the feedback comes, your reaction decides whether you get more. Do not explain, defend, or correct the details.", "marked": "When the feedback comes, / your <b>reaction</b> decides / whether you get <b>more</b>. //<br>Do <b>not</b> explain, / <b>defend</b>, / or <b>correct</b> the details. //"}, "prompts": [{"q": "你想知道自己在周会上主持得怎么样。用 30 秒向一位下属要反馈：问题要窄，让对方觉得说真话是安全的。", "ref": "Can I ask you for a favor? I'm trying to get better at running our weekly sync, and I suspect I talk too much. What's one thing I could do differently in that meeting? It doesn't have to be big, and you don't need to answer now. Feel free to think about it and send me a message tomorrow. I genuinely want to hear it.", "ref_zh": "能请你帮个忙吗？我想把我们的周会开得更好，我怀疑我说得太多了。在那个会上，有哪一件事是我可以换个做法的？不用是什么大事，也不用现在就回答。你可以想一想，明天给我发个消息。我是真心想听。", "id": "ref0"}, {"q": "一位同事给了你一条有点刺耳的反馈：你在代码评审里的评论语气太硬。用 30 秒回应：不辩解，感谢，并问一个追问。", "ref": "Thank you, honestly. That's not easy to say to someone, and it's really useful to hear. I hadn't realized my comments came across that way. Could you point me to one or two reviews where it felt harsh, so I can see what I'm doing? I'll try to change it, and I'd appreciate it if you tell me in a month whether it's better.", "ref_zh": "真的谢谢你。这种话不好跟人说，听到对我很有用。我之前没意识到我的评论给人的感觉是这样的。你能给我指一两个让你觉得说话很冲的 review 吗？这样我能看看自己是怎么做的。我会试着改，如果一个月后你能告诉我有没有好一点，我会很感激。", "id": "ref1"}], "words": [{"w": "power", "ipa": "/ˈpaʊər/", "zh": "权力", "ex": "The power gap means juniors rarely challenge the tech lead in public.", "id": "w0"}, {"w": "blind spot", "ipa": "/ˈblaɪnd spɑːt/", "zh": "盲点", "ex": "Monitoring for the batch jobs is a blind spot in our setup.", "id": "w1"}, {"w": "deliberately", "ipa": "/dɪˈlɪbərətli/", "zh": "刻意地、有意地", "ex": "We deliberately kept the first version small to learn faster.", "id": "w2"}, {"w": "improvise", "ipa": "/ˈɪmprəvaɪz/", "zh": "即兴发挥", "ex": .881, 73.974], [73.987, 74.092], [74.105, 74.237], [74.25, 74.802]]}, {"kind": "s", "id": "s1_2_0", "md": "When the feedback comes, your reaction decides whether you get more.", "zh": "反馈来了之后，你的反应决定了你以后还能不能听到更多。", "sp": null, "gap": true, "start": 75.192, "end": 79.272, "words": [[75.297, 75.376], [75.389, 75.468], [75.481, 75.995], [76.008, 76.468], [76.745, 76.85], [76.863, 77.429], [77.442, 77.995], [78.008, 78.218], [78.231, 78.324], [78.337, 78.508], [78.521, 78.889]]}, {"kind": "s", "id": "s1_2_1", "md": "Do not explain, defend, or __correct the details__.", "zh": "别解释，别辩护，也别去纠正细节。", "sp": null, "gap": false, "start": 79.272, "end": 83.04, "words": [[79.377, 79.456], [79.469, 79.654], [79.667, 80.272], [80.509, 81.035], [81.443, 81.522], [81.535, 81.904], [81.917, 82.009], [82.022, 82.654]]}, {"kind": "s", "id": "s1_2_2", "md": "Just say, \"Thank you, that's really ==useful==,\" and ask one follow-up question if you need clarity.", "zh": "就说一句「谢谢，这很有用」，如果需要弄清楚，再追问一个问题。", "sp": null, "gap": false, "start": 83.04, "end": 89.352, "words": [[83.145, 83.343], [83.356, 83.685], [84.251, 84.501], [84.514, 84.711], [85.145, 85.343], [85.356, 85.593], [85.606, 86.093], [86.54, 86.658], [86.672, 86.948], [86.961, 87.172], [87.185, 87.632], [87.645, 88.066], [88.079, 88.185], [88.198, 88.277], [88.29, 88.474], [88.487, 88.961]]}, {"kind": "s", "id": "s1_2_3", "md": "**If you argue with the first piece of feedback, it will be the last one you get.**", "zh": "如果你跟第一条反馈争起来，它就会是你收到的最后一条。", "sp": null, "gap": false, "start": 89.352, "end": 93.744, "words": [[89.457, 89.576], [89.589, 89.707], [89.72, 90.023], [90.036, 90.168], [90.181, 90.26], [90.273, 90.681], [90.694, 90.944], [90.957, 91.036], [91.049, 91.655], [91.944, 92.01], [92.023, 92.115], [92.128, 92.234], [92.247, 92.352], [92.365, 92.747], [92.76, 92.878], [92.891, 92.997], [93.01, 93.352]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, show that it mattered.", "zh": "最后，让对方看到这条反馈起了作用。", "sp": null, "gap": true, "start": 93.744, "end": 95.808, "words": [[93.915, 94.323], [94.612, 94.77], [94.783, 94.889], [94.902, 94.981], [94.994, 95.415]]}, {"kind": "s", "id": "s1_3_1", "md": "A few weeks later, tell them what you changed because of what they said.", "zh": "几周之后，告诉他们你因为他们的话改了什么。", "sp": null, "gap": false, "start": 95.808, "end": 99.696, "words": [[95.913, 95.966], [95.979, 96.137], [96.15, 96.387], [96.4, 96.716], [97.097, 97.268], [97.282, 97.4], [97.413, 97.545], [97.558, 97.663], [97.676, 98.19], [98.203, 98.545], [98.558, 98.611], [98.624, 98.755], [98.769, 98.887], [98.9, 99.308]]}, {"kind": "s", "id": "s1_3_2", "md": "That visible ==follow-through== is what turns one brave comment into a habit.", "zh": "正是这种看得见的跟进，把一次鼓起勇气的发言变成了一种习惯。", "sp": null, "gap": false, "start": 99.696, "end": 104.736, "words": [[99.801, 99.999], [100.012, 100.485], [100.499, 101.288], [101.393, 101.538], [101.551, 101.696], [101.709, 102.025], [102.038, 102.367], [102.38, 102.788], [102.801, 103.328], [103.485, 103.762], [103.775, 103.828], [103.841, 104.341]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
