<script>
const D = {"id": "060", "title": "Asking for Feedback on Yourself", "meta": "B2 · 约 280 词 · 场景：向他人要反馈", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why \"Any Feedback?\" Gets Nothing", "heading_zh": "1. 为什么「有什么反馈吗？」问不出东西", "rows": [[{"id": "s0_0_0", "md": "At the end of a one-on-one, you ask your engineer, \"Any feedback for me?\"", "text": "At the end of a one-on-one, you ask your engineer, \"Any feedback for me?\"", "zh": "1:1 快结束时，你问你的工程师：「对我有什么反馈吗？」", "sp": null}, {"id": "s0_0_1", "md": "She smiles and says, \"No, all good.\"", "text": "She smiles and says, \"No, all good.\"", "zh": "她笑笑说：「没有，都挺好的。」", "sp": null}, {"id": "s0_0_2", "md": "You both move on, and you learn nothing.", "text": "You both move on, and you learn nothing.", "zh": "你们俩就翻篇了，你什么也没了解到。", "sp": null}], [{"id": "s0_1_0", "md": "She is not lying.", "text": "She is not lying.", "zh": "她没有撒谎。", "sp": null}, {"id": "s0_1_1", "md": "The question is simply too broad, and the ==power== gap makes honesty risky.", "text": "The question is simply too broad, and the power gap makes honesty risky.", "zh": "只是这个问题太宽泛了，而且上下级之间的权力差距让说实话变得有风险。", "sp": null}, {"id": "s0_1_2", "md": "Telling your manager what they do badly feels like a career gamble, so the safe answer wins every time.", "text": "Telling your manager what they do badly feels like a career gamble, so the safe answer wins every time.", "zh": "告诉老板他哪里做得不好，感觉像是拿职业前途在赌，所以每次都是安全的回答胜出。", "sp": null}, {"id": "s0_1_3", "md": "**The more power you have, the less honest feedback you get by default.**", "text": "The more power you have, the less honest feedback you get by default.", "zh": "你的权力越大，默认情况下你听到的真话就越少。", "sp": null}], [{"id": "s0_2_0", "md": "As a lead, this creates a dangerous ==blind spot==.", "text": "As a lead, this creates a dangerous blind spot.", "zh": "作为 lead，这会造成一个危险的盲区。", "sp": null}, {"id": "s0_2_1", "md": "Your habits in meetings, your tone in code reviews, and your decisions under pressure all affect the team.", "text": "Your habits in meetings, your tone in code reviews, and your decisions under pressure all affect the team.", "zh": "你开会的习惯、你在 code review 里的语气、你在压力下做的决定，都会影响团队。", "sp": null}, {"id": "s0_2_2", "md": "Yet you are the last person to hear about them, unless you __go looking for__ it ==deliberately==.", "text": "Yet you are the last person to hear about them, unless you go looking for it deliberately.", "zh": "可你却是最后一个听说这些的人，除非你刻意去找。", "sp": null}]]}, {"heading": "2. Make It Easy and Safe to Answer", "heading_zh": "2. 让回答变得容易又安全", "rows": [[{"id": "s1_0_0", "md": "Replace the broad question with a narrow one.", "text": "Replace the broad question with a narrow one.", "zh": "把宽泛的问题换成具体的问题。", "sp": null}, {"id": "s1_0_1", "md": "\"What's one thing I could do differently in our sprint planning?\" is much easier to answer.", "text": "\"What's one thing I could do differently in our sprint planning?\" is much easier to answer.", "zh": "「在 sprint 规划会上，有哪一件事是我可以换个做法的？」这就好回答多了。", "sp": null}, {"id": "s1_0_2", "md": "Asking for one thing also signals that you expect something, so \"all good\" __no longer works__.", "text": "Asking for one thing also signals that you expect something, so \"all good\" no longer works.", "zh": "只要一件事，也是在表明你期待听到点什么，所以「都挺好的」就不管用了。", "sp": null}], [{"id": "s1_1_0", "md": "Give people time, too.", "text": "Give people time, too.", "zh": "也要给对方时间。", "sp": null}, {"id": "s1_1_1", "md": "Send the question a day before the meeting, so they can think instead of ==improvise==.", "text": "Send the question a day before the meeting, so they can think instead of improvise.", "zh": "提前一天把问题发过去，这样他们可以想一想，而不是临场发挥。", "sp": null}, {"id": "s1_1_2", "md": "Some will feel safer writing it down than saying it to your face.", "text": "Some will feel safer writing it down than saying it to your face.", "zh": "有些人觉得写下来比当面说更安全。", "sp": null}], [{"id": "s1_2_0", "md": "When the feedback comes, your reaction decides whether you get more.", "text": "When the feedback comes, your reaction decides whether you get more.", "zh": "反馈来了之后，你的反应决定了你以后还能不能听到更多。", "sp": null}, {"id": "s1_2_1", "md": "Do not explain, defend, or __correct the details__.", "text": "Do not explain, defend, or correct the details.", "zh": "别解释，别辩护，也别去纠正细节。", "sp": null}, {"id": "s1_2_2", "md": "Just say, \"Thank you, that's really ==useful==,\" and ask one follow-up question if you need clarity.", "text": "Just say, \"Thank you, that's really useful,\" and ask one follow-up question if you need clarity.", "zh": "就说一句「谢谢，这很有用」，如果需要弄清楚，再追问一个问题。", "sp": null}, {"id": "s1_2_3", "md": "**If you argue with the first piece of feedback, it will be the last one you get.**", "text": "If you argue with the first piece of feedback, it will be the last one you get.", "zh": "如果你跟第一条反馈争起来，它就会是你收到的最后一条。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, show that it mattered.", "text": "Finally, show that it mattered.", "zh": "最后，让对方看到这条反馈起了作用。", "sp": null}, {"id": "s1_3_1", "md": "A few weeks later, tell them what you changed because of what they said.", "text": "A few weeks later, tell them what you changed because of what they said.", "zh": "几周之后，告诉他们你因为他们的话改了什么。", "sp": null}, {"id": "s1_3_2", "md": "That visible ==follow-through== is what turns one brave comment into a habit.", "text": "That visible follow-through is what turns one brave comment into a habit.", "zh": "正是这种看得见的跟进，把一次鼓起勇气的发言变成了一种习惯。", "sp": null}]]}], "gist": [{"q": "为什么问 \"Any feedback for me?\" 什么也得不到？", "a": "问题太宽泛，加上权力差距让说真话有风险，安全的回答总会胜出；你权力越大，默认得到的真话越少。"}, {"q": "怎样问才更容易得到真实反馈？", "a": "换成很窄的问题，比如「我在迭代规划会上可以改的一件事是什么」；提前一天发问题，让对方有时间想，也可以书面回答。"}, {"q": "收到反馈后应该怎么做？", "a": "不解释、不辩护、不纠正细节，只说谢谢，必要时追问一句；几周后告诉对方你因此改了什么。"}], "dictation": [{"id": "s0_1_3", "text": "The more power you have, the less honest feedback you get by default."}, {"id": "s1_0_0", "text": "Replace the broad question with a narrow one."}, {"id": "s1_2_0", "text": "When the feedback comes, your reaction decides whether you get more."}, {"id": "s1_2_3", "text": "If you argue with the first piece of feedback, it will be the last one you get."}], "shadow": {"text": "When the feedback comes, your reaction decides whether you get more. Do not explain, defend, or correct the details.", "marked": "When the feedback comes, / your <b>reaction</b> decides / whether you get <b>more</b>. //<br>Do <b>not</b> explain, / <b>defend</b>, / or <b>correct</b> the details. //"}, "prompts": [{"q": "你想知道自己在周会上主持得怎么样。用 30 秒向一位下属要反馈：问题要窄，让对方觉得说真话是安全的。", "ref": "Can I ask you for a favor? I'm trying to get better at running our weekly sync, and I suspect I talk too much. What's one thing I could do differently in that meeting? It doesn't have to be big, and you don't need to answer now. Feel free to think about it and send me a message tomorrow. I genuinely want to hear it.", "ref_zh": "能请你帮个忙吗？我想把我们的周会开得更好，我怀疑我说得太多了。在那个会上，有哪一件事是我可以换个做法的？不用是什么大事，也不用现在就回答。你可以想一想，明天给我发个消息。我是真心想听。", "id": "ref0"}, {"q": "一位同事给了你一条有点刺耳的反馈：你在代码评审里的评论语气太硬。用 30 秒回应：不辩解，感谢，并问一个追问。", "ref": "Thank you, honestly. That's not easy to say to someone, and it's really useful to hear. I hadn't realized my comments came across that way. Could you point me to one or two reviews where it felt harsh, so I can see what I'm doing? I'll try to change it, and I'd appreciate it if you tell me in a month whether it's better.", "ref_zh": "真的谢谢你。这种话不好跟人说，听到对我很有用。我之前没意识到我的评论给人的感觉是这样的。你能给我指一两个让你觉得说话很冲的 review 吗？这样我能看看自己是怎么做的。我会试着改，如果一个月后你能告诉我有没有好一点，我会很感激。", "id": "ref1"}], "words": [{"w": "power", "ipa": "/ˈpaʊər/", "zh": "权力", "ex": "The power gap means juniors rarely challenge the tech lead in public.", "id": "w0"}, {"w": "blind spot", "ipa": "/ˈblaɪnd spɑːt/", "zh": "盲点", "ex": "Monitoring for the batch jobs is a blind spot in our setup.", "id": "w1"}, {"w": "deliberately", "ipa": "/dɪˈlɪbərətli/", "zh": "刻意地、有意地", "ex": "We deliberately kept the first version small to learn faster.", "id": "w2"}, {"w": "improvise", "ipa": "/ˈɪmprəvaɪz/", "zh": "即兴发挥", "ex": const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
