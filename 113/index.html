const D = {"id": "113", "type": "dialogue", "title": "Talking to a Stranger at the Bar", "meta": "B2 · 约 250 词 · 场景：酒吧和陌生人搭话与告别", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Stranger", "name_zh": "陌生人", "voice": "en-GB-SoniaNeural"}}, "gist": [{"q": "「你」是怎么开启对话的？", "a": "先问旁边的座位有没有人，再问对方喝的是什么酒。"}, {"q": "对方是哪里人、做什么工作？", "a": "来自曼彻斯特，原本外派两年后留在了这里，做物流，主要追踪延误的货运。"}, {"q": "「你」用什么理由结束了聊天？", "a": "说儿子六点就起床，不能太晚，然后自我介绍并道别。"}], "dictation": [{"id": "s0_2_0", "text": "Thanks. That looks good. What are you drinking, if you don't mind me asking?"}, {"id": "s0_6_0", "text": "No, I'm originally from China. I moved here with my family about two years ago. What about you?"}, {"id": "s1_3_0", "text": "Sorry, I didn't quite catch that. Did you say chasing ships?"}, {"id": "s1_8_0", "text": "It was really nice chatting with you. I'm Lee, by the way."}], "shadow": {"speaker": "A", "text": "I'll check it out. Well, I should head off. My son gets up at six, so no late nights for me.", "marked": "I'll <b>check</b> it out. //<br><b>Well</b>, / I should <b>head off</b>. //<br>My <b>son</b> gets up at <b>six</b>, / so no <b>late</b> nights for me. //"}, "prompts": [{"q": "在朋友的生日聚会上，你旁边站着一个谁都不认识的人。主动搭话：介绍自己、说明你和寿星的关系，再问对方一个问题。", "ref": "Hi, I don't think we've met. I'm Lee. I know Daniel from work, we sit on the same floor. How do you know him? I have to say, this is a great place for a party. Have you been here before? I'm always looking for somewhere new to take my family on weekends.", "ref_zh": "你好，我们好像还没见过。我叫 Lee，跟 Daniel 是同事，在同一层办公。你是怎么认识他的？说真的，这地方办聚会真不错。你以前来过吗？我周末总在找新地方带家人去。", "id": "ref0"}, {"q": "在酒吧有人一直拉着你聊，你想礼貌地结束对话回到朋友那边。说一段既得体又明确的话。", "ref": "Sorry, I'm going to have to steal myself away. My friends are waiting for me over there, and I promised I'd only be a minute. It was really good talking to you, though. Good luck with the new job, and enjoy the rest of your night.", "ref_zh": "不好意思，我得先走开一下了。我朋友在那边等我，我说好只离开一会儿的。不过跟你聊得很开心。新工作顺利，今晚玩得开心。", "id": "ref1"}], "words": [{"w": "craft beer", "ipa": "/kræft bɪr/", "zh": "精酿啤酒", "ex": "This bar has over twenty craft beers on tap.", "id": "w0"}, {"w": "posting", "ipa": "/ˈpoʊstɪŋ/", "zh": "外派任职", "ex": "She's here on a three-year posting from London.", "tts": "She's here on a three-year posting from London.", "id": "w1"}, {"w": "grow on (someone)", "ipa": "/ɡroʊ ɑːn/", "zh": "越来越让人喜欢", "ex": "Durian is strange at first, but it grows on you.", "tts_w": "grow on", "id": "w2"}, {"w": "logistics", "ipa": "/ləˈdʒɪstɪks/", "zh": "物流", "ex": "My neighbour works in logistics at the port.", "id": "w3"}, {"w": "chase", "ipa": "/tʃeɪs/", "zh": "追；催办", "ex": "I had to chase the agent three times for the contract.", "id": "w4"}, {"w": "recommend", "ipa": "/ˌrekəˈmend/", "zh": "推荐", "ex": "Can you recommend a good dim sum place nearby?", "id": "w5"}, {"w": "help yourself", "ipa": "/help jərˈself/", "zh": "请随意，自便", "ex": "There's coffee in the kitchen, help yourself.", "id": "w6"}, {"w": "head off", "ipa": "/hed ɔːf/", "zh": "离开，动身", "ex": "I'd better head off before the rain starts.", "id": "w7"}, {"w": "talk (someone) into", "ipa": "/tɔːk ˈɪntuː/", "zh": "说服某人做某事", "ex": "My wife talked me into joining the gym.", "tts_w": "talk into", "id": "w8"}], "sections": [{"heading": "1. Breaking the Ice", "heading_zh": "1. 打开话题", "rows": [[{"id": "s0_0_0", "md": "**Sorry, is anyone sitting here?**", "text": "Sorry, is anyone sitting here?", "zh": "不好意思，这儿有人坐吗？", "sp": "A"}], [{"id": "s0_1_0", "md": "No, it's free. __Help yourself__.", "text": "No, it's free. Help yourself.", "zh": "没有，空着呢。请坐。", "sp": "B"}], [{"id": "s0_2_0", "md": "Thanks. That looks good. What are you drinking, if you don't mind me asking?", "text": "Thanks. That looks good. What are you drinking, if you don't mind me asking?", "zh": "谢谢。你那杯看着不错。冒昧问一下，你喝的是什么？", "sp": "A"}], [{"id": "s0_3_0", "md": "It's a local ==craft== beer, a bit fruity. The bartender __talked me into__ it, and I'm glad he did.", "text": "It's a local craft beer, a bit fruity. The bartender talked me into it, and I'm glad he did.", "zh": "本地的一款精酿啤酒，有点果香。是酒保推荐的，还好我听了他的。", "sp": "B"}], [{"id": "s0_4_0", "md": "Maybe I'll try one too. Do you come here often? It's my first time.", "text": "Maybe I'll try one too. Do you come here often? It's my first time.", "zh": "那我也来一杯吧。你常来这儿吗？我是第一次来。", "sp": "A"}], [{"id": "s0_5_0", "md": "Most Fridays, actually. It's close to my office. You don't sound like you're from around here.", "text": "Most Fridays, actually. It's close to my office. You don't sound like you're from around here.", "zh": "其实差不多每个周五都来，离我公司近。听口音你不是本地人吧？", "sp": "B"}], [{"id": "s0_6_0", "md": "No, I'm originally from China. I moved here with my family about two years ago. What about you?", "text": "No, I'm originally from China. I moved here with my family about two years ago. What about you?", "zh": "不是，我是中国人。大概两年前带着家人搬过来的。你呢？", "sp": "A"}], [{"id": "s0_7_0", "md": "I'm from Manchester. I came out on a two-year ==posting== and somehow never left.", "text": "I'm from Manchester. I came out on a two-year posting and somehow never left.", "zh": "我是曼彻斯特人。本来是公司外派两年，结果不知怎么就留下来了。", "sp": "B"}], [{"id": "s0_8_0", "md": "That __happens a lot__ here, doesn't it? The weather ==grows on you==.", "text": "That happens a lot here, doesn't it? The weather grows on you.", "zh": "这种事在这儿挺常见的，对吧？天气慢慢就让人习惯了。", "sp": "A"}]]}, {"heading": "2. Keeping It Going, Then Wrapping Up", "heading_zh": "2. 接着聊，再自然收尾", "rows": [[{"id": "s1_0_0", "md": "So what do you do? Let me guess, something in tech?", "text": "So what do you do? Let me guess, something in tech?", "zh": "那你是做什么的？我猜猜，搞技术的？", "sp": "B"}], [{"id": "s1_1_0", "md": "Good guess. I manage a team at a tech company. And you?", "text": "Good guess. I manage a team at a tech company. And you?", "zh": "猜对了。我在一家科技公司带团队。你呢？", "sp": "A"}], [{"id": "s1_2_0", "md": "I'm in ==logistics==, which is rather less glamorous. Mostly ==chasing== ships around the region.", "text": "I'm in logistics, which is rather less glamorous. Mostly chasing ships around the region.", "zh": "我做物流，没那么光鲜。基本上就是在区域里到处追船期。", "sp": "B"}], [{"id": "s1_3_0", "md": "**Sorry, I didn't quite catch that. Did you say chasing ships?**", "text": "Sorry, I didn't quite catch that. Did you say chasing ships?", "zh": "不好意思，我没太听清。你是说追船吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Ha, yes. Tracking shipments that are late, basically. It's less exciting than it sounds.", "text": "Ha, yes. Tracking shipments that are late, basically. It's less exciting than it sounds.", "zh": "哈，对。说白了就是盯那些延误的货。没听起来那么刺激。", "sp": "B"}], [{"id": "s1_5_0", "md": "Still sounds more exciting than my meetings. Any good places around here you'd ==recommend==?", "text": "Still sounds more exciting than my meetings. Any good places around here you'd recommend?", "zh": "那也比我开会有意思。这附近有什么好地方推荐吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "There's a little jazz bar two streets down. Quiet, decent wine, no one shouting.", "text": "There's a little jazz bar two streets down. Quiet, decent wine, no one shouting.", "zh": "往前两条街有个小爵士酒吧。安静，红酒不错，没人大吵大闹。", "sp": "B"}], [{"id": "s1_7_0", "md": "I'll __check it out__. Well, I should __head off__. My son gets up at six, so no late nights for me.", "text": "I'll check it out. Well, I should head off. My son gets up at six, so no late nights for me.", "zh": "我去看看。好了，我得走了。我儿子六点就起，我可熬不了夜。", "sp": "A"}], [{"id": "s1_8_0", "md": "**It was really nice chatting with you. I'm Lee, by the way.**", "text": "It was really nice chatting with you. I'm Lee, by the way.", "zh": "跟你聊天很开心。对了，我叫 Lee。", "sp": "A"}], [{"id": "s1_9_0", "md": "Sophie. Nice to meet you, Lee. Maybe see you here next Friday.", "text": "Sophie. Nice to meet you, Lee. Maybe see you here next Friday.", "zh": "我叫 Sophie。很高兴认识你，Lee。说不定下周五这儿见。", "sp": "B"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Breaking the Ice", "zh": "1. 打开话题", "start": 0.0, "end": 1.8, " const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
