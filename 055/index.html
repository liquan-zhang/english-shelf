<script>
const D = {"id": "055", "title": "Delegating Without Disappearing", "meta": "B2 · 约 260 词 · 场景：授权与跟进", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Two Ways to Get It Wrong", "heading_zh": "1. 两种搞砸的方式", "rows": [[{"id": "s0_0_0", "md": "There are two classic delegation mistakes, and most new leads make both.", "text": "There are two classic delegation mistakes, and most new leads make both.", "zh": "授权有两种经典的错误，大多数新 lead 两种都会犯。", "sp": null}, {"id": "s0_0_1", "md": "The first is ==micromanaging==: you hand over a task, then check every commit and rewrite the design doc at midnight.", "text": "The first is micromanaging: you hand over a task, then check every commit and rewrite the design doc at midnight.", "zh": "第一种是微观管理：你把任务交出去，然后每个 commit 都要看，半夜还把设计文档重写一遍。", "sp": null}, {"id": "s0_0_2", "md": "The engineer learns that the work was never really theirs.", "text": "The engineer learns that the work was never really theirs.", "zh": "工程师从中学到的是：这活从来就不真正属于他。", "sp": null}], [{"id": "s0_1_0", "md": "The second mistake is the opposite.", "text": "The second mistake is the opposite.", "zh": "第二种错误正好相反。", "sp": null}, {"id": "s0_1_1", "md": "You hand over the project, say \"Let me know if you need anything,\" and disappear for a month.", "text": "You hand over the project, say \"Let me know if you need anything,\" and disappear for a month.", "zh": "你把项目交出去，说一句「有需要随时找我」，然后消失一个月。", "sp": null}, {"id": "s0_1_2", "md": "Then, a week before launch, you discover the plan has drifted far from what the business needed.", "text": "Then, a week before launch, you discover the plan has drifted far from what the business needed.", "zh": "结果上线前一周，你发现方案已经偏离业务需要的东西很远了。", "sp": null}, {"id": "s0_1_3", "md": "That is not ==trust==; it is ==abdication==.", "text": "That is not trust; it is abdication.", "zh": "那不是信任；那是撒手不管。", "sp": null}], [{"id": "s0_2_0", "md": "**Good delegation means giving away the work, but not your attention.**", "text": "Good delegation means giving away the work, but not your attention.", "zh": "好的授权意味着把活交出去，但不把你的关注也交出去。", "sp": null}, {"id": "s0_2_1", "md": "The skill is choosing where your attention goes.", "text": "The skill is choosing where your attention goes.", "zh": "真正的功夫在于选择把关注放在哪里。", "sp": null}]]}, {"heading": "2. Delegate Outcomes, Agree on Checkpoints", "heading_zh": "2. 交出结果，约定检查点", "rows": [[{"id": "s1_0_0", "md": "Start with the outcome, not the steps.", "text": "Start with the outcome, not the steps.", "zh": "从结果讲起，而不是步骤。", "sp": null}, {"id": "s1_0_1", "md": "\"We need search ==latency== under two hundred milliseconds before the sale event\" leaves room for the engineer to choose the approach.", "text": "\"We need search latency under two hundred milliseconds before the sale event\" leaves room for the engineer to choose the approach.", "zh": "「大促之前，搜索延迟要降到两百毫秒以内」，这给工程师留出了自己选方案的空间。", "sp": null}, {"id": "s1_0_2", "md": "A list of instructions leaves no room at all.", "text": "A list of instructions leaves no room at all.", "zh": "一串操作指令则一点空间都不留。", "sp": null}], [{"id": "s1_1_0", "md": "Next, be ==explicit== about decision rights.", "text": "Next, be explicit about decision rights.", "zh": "接着，把决策权讲明白。", "sp": null}, {"id": "s1_1_1", "md": "Which choices can they make alone, and which ones need a quick chat with you first?", "text": "Which choices can they make alone, and which ones need a quick chat with you first?", "zh": "哪些事他可以自己定，哪些需要先跟你简单聊一下？", "sp": null}, {"id": "s1_1_2", "md": "Changing a library is fine; changing the public API might not be.", "text": "Changing a library is fine; changing the public API might not be.", "zh": "换个库没问题；改对外 API 可能就不行了。", "sp": null}], [{"id": "s1_2_0", "md": "Then agree on ==checkpoints== in advance.", "text": "Then agree on checkpoints in advance.", "zh": "然后，提前约定好检查点。", "sp": null}, {"id": "s1_2_1", "md": "A design review in week one, a demo in week three, and a go or no-go meeting before launch.", "text": "A design review in week one, a demo in week three, and a go or no-go meeting before launch.", "zh": "第一周做设计评审，第三周做 demo，上线前开一次 go/no-go 会。", "sp": null}, {"id": "s1_2_2", "md": "Because the checkpoints are planned, your questions feel like part of the process, not like ==suspicion==.", "text": "Because the checkpoints are planned, your questions feel like part of the process, not like suspicion.", "zh": "因为检查点是事先定好的，你的提问就像是流程的一部分，而不是不信任。", "sp": null}], [{"id": "s1_3_0", "md": "Between checkpoints, __stay reachable but quiet__.", "text": "Between checkpoints, stay reachable but quiet.", "zh": "在检查点之间，保持随时能找到你，但别出声。", "sp": null}, {"id": "s1_3_1", "md": "If you see a problem, ask a question instead of quietly fixing it yourself.", "text": "If you see a problem, ask a question instead of quietly fixing it yourself.", "zh": "如果你发现了问题，就提个问题，而不是自己悄悄修掉。", "sp": null}, {"id": "s1_3_2", "md": "**The goal is a person who can run the next project without you, not a project that ran without mistakes.**", "text": "The goal is a person who can run the next project without you, not a project that ran without mistakes.", "zh": "目标是培养出一个不需要你也能带下一个项目的人，而不是做成一个没出过错的项目。", "sp": null}]]}], "gist": [{"q": "作者说新 lead 常犯的两种授权错误是什么？", "a": "一是事无巨细地管（盯每次提交、半夜重写设计文档）；二是交出去后消失一个月，上线前才发现方向跑偏，这叫甩手不叫信任。"}, {"q": "授权时应该交代什么？", "a": "交代结果而不是步骤；明确决策权：哪些可以自己定，哪些要先和你聊。"}, {"q": "检查点有什么作用？授权的最终目标是什么？", "a": "事先约定的检查点让你的提问成为流程的一部分而不像怀疑；最终目标是培养出能独立做下个项目的人，而不是一个没犯错的项目。"}], "dictation": [{"id": "s0_2_0", "text": "Good delegation means giving away the work, but not your attention."}, {"id": "s1_0_0", "text": "Start with the outcome, not the steps."}, {"id": "s1_3_1", "text": "If you see a problem, ask a question instead of quietly fixing it yourself."}, {"id": "s1_3_2", "text": "The goal is a person who can run the next project without you, not a project that ran without mistakes."}], "shadow": {"text": "Then agree on checkpoints in advance. A design review in week one, a demo in week three, and a go or no-go meeting before launch.", "marked": "Then agree on <b>checkpoints</b> / in <b>advance</b>. //<br>A <b>design</b> review in week <b>one</b>, / a <b>demo</b> in week <b>three</b>, / and a <b>go</b> or <b>no-go</b> meeting / before launch. //"}, "prompts": [{"q": "你要把一次数据库迁移交给一位资深工程师主导。用 30 秒交代：目标结果、他可以自己决定的范围、需要找你的情况和检查点。", "ref": "I'd like you to own the database migration end to end. The outcome we need is zero data loss and less than five minutes of downtime, finished before the end of the quarter. How you get there is your call, including tools and the order of tables. If you want to change the schema that other teams read, let's talk first. Can we do a design review next Friday and a dry-run demo two weeks after that?", "ref_zh": "我希望你端到端负责这次数据库迁移。我们要的结果是零数据丢失、停机不超过五分钟，在季度末之前完成。怎么做由你决定，包括用什么工具、表的迁移顺序。如果你想改其他团队在读的 schema，我们先聊一下。下周五我们做一次设计评审，再过两周做一次演练 demo，可以吗？", "id": "ref0"}, {"q": "检查点时你发现下属的方案有一个风险，但他还没意识到。用 30 秒用提问引导他，而不是直接接手修改。", "ref": "This looks solid overall, and I like how you've staged the rollout. One thing I'm curious about. What happens to the writes that come in while the old and new tables are both live? Walk me through that part. If you've already thought about it, great. If not, it might be worth an hour before the next checkpoint.", "ref_zh": "整体看下来很扎实，我很喜欢你分阶段灰度的安排。有一点我比较好奇。新旧表同时在线的时候，进来的写请求会怎么处理？给我讲讲这部分。如果你已经考虑过了，那很好。如果还没有，在下一个检查点之前花一个小时想想可能会很值。", "id": "ref1"}], "words": [{"w": "micromanage", "ipa": "/ˌmaɪkroʊˈmænɪdʒ/", "zh": "事无巨细地管", "ex": "I don't want to micromanage, so I'll only join the design review.", "id": "w0"}, {"w": "trust", "ipa": "/trʌst/", "zh": "信任", "ex": "Giving her the launch decision showed real trust.", "id": "w1"}, {"w": "abdication", "ipa": "/ˌæbdɪˈkeɪʃən/", "zh": "放弃（责任）、甩手", "ex": "Leaving the team alone during the incident felt like abdication.", "id": "w2"}, {"w": "latency", "ipa": "/ˈleɪtənsi/", "zh": "延迟", "ex": "Latency doubled after the cache was disabled.", "id": "w3"}, {"w": "explicit", "ipa": "/ɪkˈsplɪsɪt/", "zh": "明确的", "ex": "Let's b function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }

  requestAnimationFrame(watchSeg);
})();

async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
