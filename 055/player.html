<script>
const D = {"id": "055", "title": "Delegating Without Disappearing", "meta": "B2 · 约 260 词 · 场景：授权与跟进", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Two Ways to Get It Wrong", "heading_zh": "1. 两种搞砸的方式", "rows": [[{"id": "s0_0_0", "md": "There are two classic delegation mistakes, and most new leads make both.", "text": "There are two classic delegation mistakes, and most new leads make both.", "zh": "授权有两种经典的错误，大多数新 lead 两种都会犯。", "sp": null}, {"id": "s0_0_1", "md": "The first is ==micromanaging==: you hand over a task, then check every commit and rewrite the design doc at midnight.", "text": "The first is micromanaging: you hand over a task, then check every commit and rewrite the design doc at midnight.", "zh": "第一种是微观管理：你把任务交出去，然后每个 commit 都要看，半夜还把设计文档重写一遍。", "sp": null}, {"id": "s0_0_2", "md": "The engineer learns that the work was never really theirs.", "text": "The engineer learns that the work was never really theirs.", "zh": "工程师从中学到的是：这活从来就不真正属于他。", "sp": null}], [{"id": "s0_1_0", "md": "The second mistake is the opposite.", "text": "The second mistake is the opposite.", "zh": "第二种错误正好相反。", "sp": null}, {"id": "s0_1_1", "md": "You hand over the project, say \"Let me know if you need anything,\" and disappear for a month.", "text": "You hand over the project, say \"Let me know if you need anything,\" and disappear for a month.", "zh": "你把项目交出去，说一句「有需要随时找我」，然后消失一个月。", "sp": null}, {"id": "s0_1_2", "md": "Then, a week before launch, you discover the plan has drifted far from what the business needed.", "text": "Then, a week before launch, you discover the plan has drifted far from what the business needed.", "zh": "结果上线前一周，你发现方案已经偏离业务需要的东西很远了。", "sp": null}, {"id": "s0_1_3", "md": "That is not ==trust==; it is ==abdication==.", "text": "That is not trust; it is abdication.", "zh": "那不是信任；那是撒手不管。", "sp": null}], [{"id": "s0_2_0", "md": "**Good delegation means giving away the work, but not your attention.**", "text": "Good delegation means giving away the work, but not your attention.", "zh": "好的授权意味着把活交出去，但不把你的关注也交出去。", "sp": null}, {"id": "s0_2_1", "md": "The skill is choosing where your attention goes.", "text": "The skill is choosing where your attention goes.", "zh": "真正的功夫在于选择把关注放在哪里。", "sp": null}]]}, {"heading": "2. Delegate Outcomes, Agree on Checkpoints", "heading_zh": "2. 交出结果，约定检查点", "rows": [[{"id": "s1_0_0", "md": "Start with the outcome, not the steps.", "text": "Start with the outcome, not the steps.", "zh": "从结果讲起，而不是步骤。", "sp": null}, {"id": "s1_0_1", "md": "\"We need search ==latency== under two hundred milliseconds before the sale event\" leaves room for the engineer to choose the approach.", "text": "\"We need search latency under two hundred milliseconds before the sale event\" leaves room for the engineer to choose the approach.", "zh": "「大促之前，搜索延迟要降到两百毫秒以内」，这给工程师留出了自己选方案的空间。", "sp": null}, {"id": "s1_0_2", "md": "A list of instructions leaves no room at all.", "text": "A list of instructions leaves no room at all.", "zh": "一串操作指令则一点空间都不留。", "sp": null}], [{"id": "s1_1_0", "md": "Next, be ==explicit== about decision rights.", "text": "Next, be explicit about decision rights.", "zh": "接着，把决策权讲明白。", "sp": null}, {"id": "s1_1_1", "md": "Which choices can they make alone, and which ones need a quick chat with you first?", "text": "Which choices can they make alone, and which ones need a quick chat with you first?", "zh": "哪些事他可以自己定，哪些需要先跟你简单聊一下？", "sp": null}, {"id": "s1_1_2", "md": "Changing a library is fine; changing the public API might not be.", "text": "Changing a library is fine; changing the public API might not be.", "zh": "换个库没问题；改对外 API 可能就不行了。", "sp": null}], [{"id": "s1_2_0", "md": "Then agree on ==checkpoints== in advance.", "text": "Then agree on checkpoints in advance.", "zh": "然后，提前约定好检查点。", "sp": null}, {"id": "s1_2_1", "md": "A design review in week one, a demo in week three, and a go or no-go meeting before launch.", "text": "A design review in week one, a demo in week three, and a go or no-go meeting before launch.", "zh": "第一周做设计评审，第三周做 demo，上线前开一次 go/no-go 会。", "sp": null}, {"id": "s1_2_2", "md": "Because the checkpoints are planned, your questions feel like part of the process, not like ==suspicion==.", "text": "Because the checkpoints are planned, your questions feel like part of the process, not like suspicion.", "zh": "因为检查点是事先定好的，你的提问就像是流程的一部分，而不是不信任。", "sp": null}], [{"id": "s1_3_0", "md": "Between checkpoints, __stay reachable but quiet__.", "text": "Between checkpoints, stay reachable but quiet.", "zh": "在检查点之间，保持随时能找到你，但别出声。", "sp": null}, {"id": "s1_3_1", "md": "If you see a problem, ask a question instead of quietly fixing it yourself.", "text": "If you see a problem, ask a question instead of quietly fixing it yourself.", "zh": "如果你发现了问题，就提个问题，而不是自己悄悄修掉。", "sp": null}, {"id": "s1_3_2", "md": "**The goal is a person who can run the next project without you, not a project that ran without mistakes.**", "text": "The goal is a person who can run the next project without you, not a project that ran without mistakes.", "zh": "目标是培养出一个不需要你也能带下一个项目的人，而不是做成一个没出过错的项目。", "sp": null}]]}], "gist": [{"q": "作者说新 lead 常犯的两种授权错误是什么？", "a": "一是事无巨细地管（盯每次提交、半夜重写设计文档）；二是交出去后消失一个月，上线前才发现方向跑偏，这叫甩手不叫信任。"}, {"q": "授权时应该交代什么？", "a": "交代结果而不是步骤；明确决策权：哪些可以自己定，哪些要先和你聊。"}, {"q": "检查点有什么作用？授权的最终目标是什么？", "a": "事先约定的检查点让你的提问成为流程的一部分而不像怀疑；最终目标是培养出能独立做下个项目的人，而不是一个没犯错的项目。"}], "dictation": [{"id": "s0_2_0", "text": "Good delegation means giving away the work, but not your attention."}, {"id": "s1_0_0", "text": "Start with the outcome, not the steps."}, {"id": "s1_3_1", "text": "If you see a problem, ask a question instead of quietly fixing it yourself."}, {"id": "s1_3_2", "text": "The goal is a person who can run the next project without you, not a project that ran without mistakes."}], "shadow": {"text": "Then agree on checkpoints in advance. A design review in week one, a demo in week three, and a go or no-go meeting before launch.", "marked": "Then agree on <b>checkpoints</b> / in <b>advance</b>. //<br>A <b>design</b> review in week <b>one</b>, / a <b>demo</b> in week <b>three</b>, / and a <b>go</b> or <b>no-go</b> meeting / before launch. //"}, "prompts": [{"q": "你要把一次数据库迁移交给一位资深工程师主导。用 30 秒交代：目标结果、他可以自己决定的范围、需要找你的情况和检查点。", "ref": "I'd like you to own the database migration end to end. The outcome we need is zero data loss and less than five minutes of downtime, finished before the end of the quarter. How you get there is your call, including tools and the order of tables. If you want to change the schema that other teams read, let's talk first. Can we do a design review next Friday and a dry-run demo two weeks after that?", "ref_zh": "我希望你端到端负责这次数据库迁移。我们要的结果是零数据丢失、停机不超过五分钟，在季度末之前完成。怎么做由你决定，包括用什么工具、表的迁移顺序。如果你想改其他团队在读的 schema，我们先聊一下。下周五我们做一次设计评审，再过两周做一次演练 demo，可以吗？", "id": "ref0"}, {"q": "检查点时你发现下属的方案有一个风险，但他还没意识到。用 30 秒用提问引导他，而不是直接接手修改。", "ref": "This looks solid overall, and I like how you've staged the rollout. One thing I'm curious about. What happens to the writes that come in while the old and new tables are both live? Walk me through that part. If you've already thought about it, great. If not, it might be worth an hour before the next checkpoint.", "ref_zh": "整体看下来很扎实，我很喜欢你分阶段灰度的安排。有一点我比较好奇。新旧表同时在线的时候，进来的写请求会怎么处理？给我讲讲这部分。如果你已经考虑过了，那很好。如果还没有，在下一个检查点之前花一个小时想想可能会很值。", "id": "ref1"}], "words": [{"w": "micromanage", "ipa": "/ˌmaɪkroʊˈmænɪdʒ/", "zh": "事无巨细地管", "ex": "I don't want to micromanage, so I'll only join the design review.", "id": "w0"}, {"w": "trust", "ipa": "/trʌst/", "zh": "信任", "ex": "Giving her the launch decision showed real trust.", "id": "w1"}, {"w": "abdication", "ipa": "/ˌæbdɪˈkeɪʃən/", "zh": "放弃（责任）、甩手", "ex": "Leaving the team alone during the incident felt like abdication.", "id": "w2"}, {"w": "latency", "ipa": "/ˈleɪtənsi/", "zh": "延迟", "ex": "Latency doubled after the cache was disabled.", "id": "w3"}, {"w": "explicit", "ipa": "/ɪkˈsplɪsɪt/", "zh": "明确的", "ex": "Let's b , [75.467, 75.599], [75.612, 75.862], [75.875, 76.191], [76.599, 76.665], [76.678, 77.059], [77.073, 77.191], [77.204, 77.428], [77.441, 77.915], [78.231, 78.349], [78.362, 78.428], [78.441, 78.849], [78.941, 79.046], [79.059, 79.533], [79.546, 79.875], [79.888, 80.231], [80.244, 80.757]]}, {"kind": "s", "id": "s1_2_2", "md": "Because the checkpoints are planned, your questions feel like part of the process, not like ==suspicion==.", "zh": "因为检查点是事先定好的，你的提问就像是流程的一部分，而不是不信任。", "sp": null, "gap": false, "start": 81.144, "end": 87.192, "words": [[81.249, 81.526], [81.539, 81.644], [81.657, 82.223], [82.236, 82.341], [82.355, 82.855], [83.236, 83.341], [83.355, 83.881], [83.894, 84.183], [84.197, 84.394], [84.407, 84.631], [84.644, 84.71], [84.723, 84.789], [84.802, 85.486], [85.776, 85.986], [85.999, 86.17], [86.183, 86.802]]}, {"kind": "s", "id": "s1_3_0", "md": "Between checkpoints, __stay reachable but quiet__.", "zh": "在检查点之间，保持随时能找到你，但别出声。", "sp": null, "gap": true, "start": 87.192, "end": 90.48, "words": [[87.297, 87.626], [87.639, 88.324], [88.56, 88.797], [88.81, 89.324], [89.403, 89.547], [89.56, 90.1]]}, {"kind": "s", "id": "s1_3_1", "md": "If you see a problem, ask a question instead of quietly fixing it yourself.", "zh": "如果你发现了问题，就提个问题，而不是自己悄悄修掉。", "sp": null, "gap": false, "start": 90.48, "end": 95.328, "words": [[90.585, 90.691], [90.704, 90.783], [90.796, 90.993], [91.006, 91.059], [91.072, 91.533], [91.941, 92.138], [92.151, 92.204], [92.217, 92.73], [92.783, 93.177], [93.191, 93.296], [93.309, 93.835], [93.848, 94.269], [94.283, 94.362], [94.375, 94.941]]}, {"kind": "s", "id": "s1_3_2", "md": "**The goal is a person who can run the next project without you, not a project that ran without mistakes.**", "zh": "目标是培养出一个不需要你也能带下一个项目的人，而不是做成一个没出过错的项目。", "sp": null, "gap": false, "start": 95.328, "end": 101.856, "words": [[95.446, 95.512], [95.525, 95.854], [95.867, 95.973], [95.986, 96.052], [96.065, 96.512], [96.525, 96.657], [96.67, 96.868], [96.881, 97.117], [97.131, 97.223], [97.236, 97.552], [97.565, 98.065], [98.078, 98.486], [98.499, 98.683], [99.117, 99.249], [99.262, 99.302], [99.315, 99.867], [99.881, 100.131], [100.144, 100.446], [100.46, 100.802], [100.815, 101.46]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
