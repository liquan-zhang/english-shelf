<script>
const D = {"id": "025", "title": "Asking Why Five Times", "meta": "B2 · 约 260 词 · 场景：根因分析", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Following the Chain", "heading_zh": "1. 顺着链条往下问", "rows": [[{"id": "s0_0_0", "md": "Start with the ==symptom==: the checkout service returned errors for twenty minutes.", "text": "Start with the symptom: the checkout service returned errors for twenty minutes.", "zh": "先从现象说起：结账服务报错了二十分钟。", "sp": null}, {"id": "s0_0_1", "md": "Why did that happen?", "text": "Why did that happen?", "zh": "为什么会这样？", "sp": null}, {"id": "s0_0_2", "md": "Because the database ran out of connections.", "text": "Because the database ran out of connections.", "zh": "因为数据库连接被耗尽了。", "sp": null}], [{"id": "s0_1_0", "md": "Why did it run out?", "text": "Why did it run out?", "zh": "为什么会耗尽？", "sp": null}, {"id": "s0_1_1", "md": "Because a new batch job opened connections and never closed them.", "text": "Because a new batch job opened connections and never closed them.", "zh": "因为一个新的批处理任务打开连接后一直没关。", "sp": null}, {"id": "s0_1_2", "md": "Why did that reach production?", "text": "Why did that reach production?", "zh": "为什么这个问题会被带到生产环境？", "sp": null}, {"id": "s0_1_3", "md": "Because our tests run against a tiny database where the ==leak== never shows up.", "text": "Because our tests run against a tiny database where the leak never shows up.", "zh": "因为我们的测试跑在一个很小的数据库上，连接泄漏在那里根本暴露不出来。", "sp": null}], [{"id": "s0_2_0", "md": "One more why, and you reach something worth fixing: nobody owns the test data, so it has not been updated in a year.", "text": "One more why, and you reach something worth fixing: nobody owns the test data, so it has not been updated in a year.", "zh": "再问一个为什么，就能挖到真正值得修的东西：测试数据没人负责，所以一年都没更新过。", "sp": null}, {"id": "s0_2_1", "md": "**The first answer tells you what broke; the last one tells you why it will break again.**", "text": "The first answer tells you what broke; the last one tells you why it will break again.", "zh": "第一个答案告诉你什么坏了；最后一个答案告诉你它为什么还会再坏。", "sp": null}, {"id": "s0_2_2", "md": "Fixing the job is a ==patch==, while fixing the test setup __closes the door on__ a whole family of bugs.", "text": "Fixing the job is a patch, while fixing the test setup closes the door on a whole family of bugs.", "zh": "修好那个任务只是打个补丁，而修好测试环境，能把一整类 bug 都堵死。", "sp": null}]]}, {"heading": "2. Three Ways to Get It Wrong", "heading_zh": "2. 三种常见的误区", "rows": [[{"id": "s1_0_0", "md": "The most common mistake is stopping at a person.", "text": "The most common mistake is stopping at a person.", "zh": "最常见的错误是追到某个人就停下了。", "sp": null}, {"id": "s1_0_1", "md": "\"The job leaked because Ken forgot to close the connection\" is a __dead end__.", "text": "\"The job leaked because Ken forgot to close the connection\" is a dead end.", "zh": "「任务泄漏是因为 Ken 忘了关连接」，这就走进死胡同了。", "sp": null}, {"id": "s1_0_2", "md": "People forget things; the real question is why the system let the mistake __slip through__.", "text": "People forget things; the real question is why the system let the mistake slip through.", "zh": "人总会忘事；真正要问的是，系统为什么让这个错误溜了过去。", "sp": null}], [{"id": "s1_1_0", "md": "The second mistake is following only one chain.", "text": "The second mistake is following only one chain.", "zh": "第二个错误是只顺着一条链往下问。", "sp": null}, {"id": "s1_1_1", "md": "Real incidents usually have several ==contributing== causes, so __branch out__ when an answer has two parts.", "text": "Real incidents usually have several contributing causes, so branch out when an answer has two parts.", "zh": "真实的事故通常有好几个共同起作用的原因，所以一个答案包含两部分时，就要分叉往下追。", "sp": null}, {"id": "s1_1_2", "md": "A missing alert and a slow rollback can each deserve their own line of whys.", "text": "A missing alert and a slow rollback can each deserve their own line of whys.", "zh": "缺失的告警和缓慢的回滚，可能各自都值得单独追一串为什么。", "sp": null}], [{"id": "s1_2_0", "md": "The third mistake is taking the number five too literally.", "text": "The third mistake is taking the number five too literally.", "zh": "第三个错误是把「五」这个数字看得太死。", "sp": null}, {"id": "s1_2_1", "md": "**Stop when you reach a cause you can actually change, whether that takes three whys or seven.**", "text": "Stop when you reach a cause you can actually change, whether that takes three whys or seven.", "zh": "追到一个你真正能改变的原因就停下，不管那需要问三次还是七次。", "sp": null}, {"id": "s1_2_2", "md": "Going further usually ends in ==abstract== answers like \"we need better communication.\"", "text": "Going further usually ends in abstract answers like \"we need better communication.\"", "zh": "再往下追，通常只会得到「我们需要加强沟通」这种空泛的答案。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, write the chain down where everyone can see it.", "text": "Finally, write the chain down where everyone can see it.", "zh": "最后，把这条链写在大家都能看到的地方。", "sp": null}, {"id": "s1_3_1", "md": "A visible chain keeps the discussion ==grounded== and stops people from jumping to their favorite theory.", "text": "A visible chain keeps the discussion grounded and stops people from jumping to their favorite theory.", "zh": "链条摆在眼前，讨论就能落到实处，也能防止大家直接跳到自己偏爱的那套理论上。", "sp": null}]]}], "gist": [{"q": "文中的例子里，第一个答案和最后一个答案分别是什么？", "a": "第一个：数据库连接耗尽；最后一个：没人负责测试数据，一年没更新，所以泄漏在测试里发现不了。"}, {"q": "为什么修测试环境比修那个任务更有价值？", "a": "修任务只是打补丁，修测试环境能堵住一整类 bug。"}, {"q": "五个为什么常见的三种用错方式是什么？", "a": "停在某个人身上；只追一条链（不分叉）；死守「五」这个数字，应该在找到能改的原因时就停。"}], "dictation": [{"id": "s0_2_1", "text": "The first answer tells you what broke; the last one tells you why it will break again."}, {"id": "s1_2_1", "text": "Stop when you reach a cause you can actually change, whether that takes three whys or seven."}, {"id": "s1_0_2", "text": "People forget things; the real question is why the system let the mistake slip through."}, {"id": "s1_0_0", "text": "The most common mistake is stopping at a person."}], "shadow": {"text": "The most common mistake is stopping at a person. \"The job leaked because Ken forgot to close the connection\" is a dead end. People forget things; the real question is why the system let the mistake slip through.", "marked": "The most <b>common</b> mistake / is stopping at a <b>person</b>. //<br>\"The job leaked / because <b>Ken forgot</b> to close the connection\" / is a <b>dead end</b>. //<br>People <b>forget</b> things; / the <b>real</b> question is / why the <b>system</b> let the mistake / <b>slip through</b>. //"}, "prompts": [{"q": "复盘会上大家停在「是小王忘了加超时」。用 30 秒把讨论推进一层：不针对个人，追问系统为什么没拦住。", "ref": "I agree the timeout was missing, but let's not stop there, because anyone could forget a timeout. The more useful question is why nothing caught it. Our client library doesn't set a default, and the code review checklist doesn't mention it. If we add a default timeout to the library, this whole class of mistakes goes away, not just this one.", "ref_zh": "我同意是缺了超时设置，但别停在这儿，因为谁都可能忘了设超时。更有价值的问题是，为什么没有任何环节拦住它。我们的客户端库没有默认值，code review 检查清单里也没提这一点。如果我们在库里加一个默认超时，消失的就是这一整类错误，而不只是这一次。", "id": "ref0"}, {"q": "有人提议把复盘结论写成「加强沟通」。用 30 秒说明这个结论太抽象，并提议再问一层为什么。", "ref": "I'm not sure better communication is something we can act on. Let's ask one more why. Why didn't the payments team know about the schema change? Because the change was announced in a channel they don't follow. So a concrete fix could be that any schema change automatically notifies every service that reads that table. That's something we can build and check next month.", "ref_zh": "我不确定「加强沟通」是我们能落地的东西。我们再问一个为什么。支付团队为什么不知道这次表结构变更？因为变更是在一个他们没关注的频道里通知的。所以一个具体的改法可以是：任何表结构变更都自动通知所有读这张表的服务。这是我们下个月就能做出来、也能验证的事。", "id": "ref1"}], "words": [{"w": "symptom", "ipa": "/ˈsɪmptəm/", "zh": "症状、表面现象", "ex": "High latency is the symptom; the slow query is the cause.", "id": "w0"}, {"w": "leak (n.)", "ipa": "/liːk/", "zh": "泄漏", "ex": "A connection leak in the worker slowly drained the pool.", "tts_w": "leak", "id": "w1"}, {"w": "patch (n.)", "ipa": "/pætʃ/", "zh": "补丁、临时修补", "ex": "The restart is a patch; we still need a real fix.", "tts_w": "patch", "id": "w2"}, {"w": "contributing", "ipa": "/kənˈtrɪbjuːtɪŋ/" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
