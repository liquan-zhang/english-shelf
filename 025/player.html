<script>
const D = {"id": "025", "title": "Asking Why Five Times", "meta": "B2 · 约 260 词 · 场景：根因分析", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Following the Chain", "heading_zh": "1. 顺着链条往下问", "rows": [[{"id": "s0_0_0", "md": "Start with the ==symptom==: the checkout service returned errors for twenty minutes.", "text": "Start with the symptom: the checkout service returned errors for twenty minutes.", "zh": "先从现象说起：结账服务报错了二十分钟。", "sp": null}, {"id": "s0_0_1", "md": "Why did that happen?", "text": "Why did that happen?", "zh": "为什么会这样？", "sp": null}, {"id": "s0_0_2", "md": "Because the database ran out of connections.", "text": "Because the database ran out of connections.", "zh": "因为数据库连接被耗尽了。", "sp": null}], [{"id": "s0_1_0", "md": "Why did it run out?", "text": "Why did it run out?", "zh": "为什么会耗尽？", "sp": null}, {"id": "s0_1_1", "md": "Because a new batch job opened connections and never closed them.", "text": "Because a new batch job opened connections and never closed them.", "zh": "因为一个新的批处理任务打开连接后一直没关。", "sp": null}, {"id": "s0_1_2", "md": "Why did that reach production?", "text": "Why did that reach production?", "zh": "为什么这个问题会被带到生产环境？", "sp": null}, {"id": "s0_1_3", "md": "Because our tests run against a tiny database where the ==leak== never shows up.", "text": "Because our tests run against a tiny database where the leak never shows up.", "zh": "因为我们的测试跑在一个很小的数据库上，连接泄漏在那里根本暴露不出来。", "sp": null}], [{"id": "s0_2_0", "md": "One more why, and you reach something worth fixing: nobody owns the test data, so it has not been updated in a year.", "text": "One more why, and you reach something worth fixing: nobody owns the test data, so it has not been updated in a year.", "zh": "再问一个为什么，就能挖到真正值得修的东西：测试数据没人负责，所以一年都没更新过。", "sp": null}, {"id": "s0_2_1", "md": "**The first answer tells you what broke; the last one tells you why it will break again.**", "text": "The first answer tells you what broke; the last one tells you why it will break again.", "zh": "第一个答案告诉你什么坏了；最后一个答案告诉你它为什么还会再坏。", "sp": null}, {"id": "s0_2_2", "md": "Fixing the job is a ==patch==, while fixing the test setup __closes the door on__ a whole family of bugs.", "text": "Fixing the job is a patch, while fixing the test setup closes the door on a whole family of bugs.", "zh": "修好那个任务只是打个补丁，而修好测试环境，能把一整类 bug 都堵死。", "sp": null}]]}, {"heading": "2. Three Ways to Get It Wrong", "heading_zh": "2. 三种常见的误区", "rows": [[{"id": "s1_0_0", "md": "The most common mistake is stopping at a person.", "text": "The most common mistake is stopping at a person.", "zh": "最常见的错误是追到某个人就停下了。", "sp": null}, {"id": "s1_0_1", "md": "\"The job leaked because Ken forgot to close the connection\" is a __dead end__.", "text": "\"The job leaked because Ken forgot to close the connection\" is a dead end.", "zh": "「任务泄漏是因为 Ken 忘了关连接」，这就走进死胡同了。", "sp": null}, {"id": "s1_0_2", "md": "People forget things; the real question is why the system let the mistake __slip through__.", "text": "People forget things; the real question is why the system let the mistake slip through.", "zh": "人总会忘事；真正要问的是，系统为什么让这个错误溜了过去。", "sp": null}], [{"id": "s1_1_0", "md": "The second mistake is following only one chain.", "text": "The second mistake is following only one chain.", "zh": "第二个错误是只顺着一条链往下问。", "sp": null}, {"id": "s1_1_1", "md": "Real incidents usually have several ==contributing== causes, so __branch out__ when an answer has two parts.", "text": "Real incidents usually have several contributing causes, so branch out when an answer has two parts.", "zh": "真实的事故通常有好几个共同起作用的原因，所以一个答案包含两部分时，就要分叉往下追。", "sp": null}, {"id": "s1_1_2", "md": "A missing alert and a slow rollback can each deserve their own line of whys.", "text": "A missing alert and a slow rollback can each deserve their own line of whys.", "zh": "缺失的告警和缓慢的回滚，可能各自都值得单独追一串为什么。", "sp": null}], [{"id": "s1_2_0", "md": "The third mistake is taking the number five too literally.", "text": "The third mistake is taking the number five too literally.", "zh": "第三个错误是把「五」这个数字看得太死。", "sp": null}, {"id": "s1_2_1", "md": "**Stop when you reach a cause you can actually change, whether that takes three whys or seven.**", "text": "Stop when you reach a cause you can actually change, whether that takes three whys or seven.", "zh": "追到一个你真正能改变的原因就停下，不管那需要问三次还是七次。", "sp": null}, {"id": "s1_2_2", "md": "Going further usually ends in ==abstract== answers like \"we need better communication.\"", "text": "Going further usually ends in abstract answers like \"we need better communication.\"", "zh": "再往下追，通常只会得到「我们需要加强沟通」这种空泛的答案。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, write the chain down where everyone can see it.", "text": "Finally, write the chain down where everyone can see it.", "zh": "最后，把这条链写在大家都能看到的地方。", "sp": null}, {"id": "s1_3_1", "md": "A visible chain keeps the discussion ==grounded== and stops people from jumping to their favorite theory.", "text": "A visible chain keeps the discussion grounded and stops people from jumping to their favorite theory.", "zh": "链条摆在眼前，讨论就能落到实处，也能防止大家直接跳到自己偏爱的那套理论上。", "sp": null}]]}], "gist": [{"q": "文中的例子里，第一个答案和最后一个答案分别是什么？", "a": "第一个：数据库连接耗尽；最后一个：没人负责测试数据，一年没更新，所以泄漏在测试里发现不了。"}, {"q": "为什么修测试环境比修那个任务更有价值？", "a": "修任务只是打补丁，修测试环境能堵住一整类 bug。"}, {"q": "五个为什么常见的三种用错方式是什么？", "a": "停在某个人身上；只追一条链（不分叉）；死守「五」这个数字，应该在找到能改的原因时就停。"}], "dictation": [{"id": "s0_2_1", "text": "The first answer tells you what broke; the last one tells you why it will break again."}, {"id": "s1_2_1", "text": "Stop when you reach a cause you can actually change, whether that takes three whys or seven."}, {"id": "s1_0_2", "text": "People forget things; the real question is why the system let the mistake slip through."}, {"id": "s1_0_0", "text": "The most common mistake is stopping at a person."}], "shadow": {"text": "The most common mistake is stopping at a person. \"The job leaked because Ken forgot to close the connection\" is a dead end. People forget things; the real question is why the system let the mistake slip through.", "marked": "The most <b>common</b> mistake / is stopping at a <b>person</b>. //<br>\"The job leaked / because <b>Ken forgot</b> to close the connection\" / is a <b>dead end</b>. //<br>People <b>forget</b> things; / the <b>real</b> question is / why the <b>system</b> let the mistake / <b>slip through</b>. //"}, "prompts": [{"q": "复盘会上大家停在「是小王忘了加超时」。用 30 秒把讨论推进一层：不针对个人，追问系统为什么没拦住。", "ref": "I agree the timeout was missing, but let's not stop there, because anyone could forget a timeout. The more useful question is why nothing caught it. Our client library doesn't set a default, and the code review checklist doesn't mention it. If we add a default timeout to the library, this whole class of mistakes goes away, not just this one.", "ref_zh": "我同意是缺了超时设置，但别停在这儿，因为谁都可能忘了设超时。更有价值的问题是，为什么没有任何环节拦住它。我们的客户端库没有默认值，code review 检查清单里也没提这一点。如果我们在库里加一个默认超时，消失的就是这一整类错误，而不只是这一次。", "id": "ref0"}, {"q": "有人提议把复盘结论写成「加强沟通」。用 30 秒说明这个结论太抽象，并提议再问一层为什么。", "ref": "I'm not sure better communication is something we can act on. Let's ask one more why. Why didn't the payments team know about the schema change? Because the change was announced in a channel they don't follow. So a concrete fix could be that any schema change automatically notifies every service that reads that table. That's something we can build and check next month.", "ref_zh": "我不确定「加强沟通」是我们能落地的东西。我们再问一个为什么。支付团队为什么不知道这次表结构变更？因为变更是在一个他们没关注的频道里通知的。所以一个具体的改法可以是：任何表结构变更都自动通知所有读这张表的服务。这是我们下个月就能做出来、也能验证的事。", "id": "ref1"}], "words": [{"w": "symptom", "ipa": "/ˈsɪmptəm/", "zh": "症状、表面现象", "ex": "High latency is the symptom; the slow query is the cause.", "id": "w0"}, {"w": "leak (n.)", "ipa": "/liːk/", "zh": "泄漏", "ex": "A connection leak in the worker slowly drained the pool.", "tts_w": "leak", "id": "w1"}, {"w": "patch (n.)", "ipa": "/pætʃ/", "zh": "补丁、临时修补", "ex": "The restart is a patch; we still need a real fix.", "tts_w": "patch", "id": "w2"}, {"w": "contributing", "ipa": "/kənˈtrɪbjuːtɪŋ/" gap": false, "start": 30.864, "end": 35.616, "words": [[30.982, 31.048], [31.061, 31.404], [31.417, 31.719], [31.732, 32.009], [32.022, 32.114], [32.127, 32.311], [32.325, 32.719], [33.022, 33.127], [33.14, 33.482], [33.496, 33.732], [33.746, 34.035], [34.048, 34.153], [34.167, 34.417], [34.43, 34.509], [34.522, 34.627], [34.64, 34.877], [34.89, 35.219]]}, {"kind": "s", "id": "s0_2_2", "md": "Fixing the job is a ==patch==, while fixing the test setup __closes the door on__ a whole family of bugs.", "zh": "修好那个任务只是打个补丁，而修好测试环境，能把一整类 bug 都堵死。", "sp": null, "gap": false, "start": 35.616, "end": 42.552, "words": [[35.8, 36.129], [36.142, 36.234], [36.248, 36.669], [36.774, 36.879], [36.892, 36.958], [36.971, 37.524], [37.853, 38.024], [38.037, 38.458], [38.471, 38.563], [38.577, 38.892], [38.905, 39.287], [39.405, 39.919], [39.932, 40.05], [40.063, 40.471], [40.59, 40.682], [40.695, 40.748], [40.761, 41.077], [41.09, 41.511], [41.524, 41.616], [41.629, 42.155]]}, {"kind": "h", "id": "h1", "md": "2. Three Ways to Get It Wrong", "zh": "2. 三种常见的误区", "start": 42.552, "end": 44.904, "words": [[42.657, 42.894], [43.249, 43.513], [43.526, 43.815], [43.828, 43.907], [43.92, 44.052], [44.065, 44.184], [44.197, 44.513]]}, {"kind": "s", "id": "s1_0_0", "md": "The most common mistake is stopping at a person.", "zh": "最常见的错误是追到某个人就停下了。", "sp": null, "gap": false, "start": 44.904, "end": 47.832, "words": [[45.022, 45.075], [45.088, 45.351], [45.365, 45.707], [45.72, 46.207], [46.299, 46.391], [46.404, 46.812], [46.825, 46.904], [46.917, 46.957], [46.97, 47.443]]}, {"kind": "s", "id": "s1_0_1", "md": "\"The job leaked because Ken forgot to close the connection\" is a __dead end__.", "zh": "「任务泄漏是因为 Ken 忘了关连接」，这就走进死胡同了。", "sp": null, "gap": false, "start": 47.832, "end": 52.416, "words": [[48.043, 48.108], [48.108, 48.424], [48.437, 48.753], [48.766, 49.121], [49.135, 49.424], [49.437, 49.845], [49.858, 49.95], [49.964, 50.293], [50.306, 50.398], [50.411, 50.964], [51.2, 51.345], [51.358, 51.437], [51.45, 51.674], [51.687, 52.016]]}, {"kind": "s", "id": "s1_0_2", "md": "People forget things; the real question is why the system let the mistake __slip through__.", "zh": "人总会忘事；真正要问的是，系统为什么让这个错误溜了过去。", "sp": null, "gap": false, "start": 52.416, "end": 57.744, "words": [[52.534, 52.798], [52.811, 53.179], [53.192, 53.705], [53.929, 54.034], [54.048, 54.271], [54.284, 54.824], [54.955, 55.087], [55.1, 55.298], [55.311, 55.416], [55.429, 55.929], [55.942, 56.1], [56.113, 56.179], [56.192, 56.627], [56.64, 56.969], [56.982, 57.35]]}, {"kind": "s", "id": "s1_1_0", "md": "The second mistake is following only one chain.", "zh": "第二个错误是只顺着一条链往下问。", "sp": null, "gap": true, "start": 57.744, "end": 61.008, "words": [[57.862, 57.928], [57.941, 58.297], [58.31, 58.783], [58.876, 58.981], [58.994, 59.533], [59.691, 59.955], [59.968, 60.244], [60.257, 60.626]]}, {"kind": "s", "id": "s1_1_1", "md": "Real incidents usually have several ==contributing== causes, so __branch out__ when an answer has two parts.", "zh": "真实的事故通常有好几个共同起作用的原因，所以一个答案包含两部分时，就要分叉往下追。", "sp": null, "gap": false, "start": 61.008, "end": 67.488, "words": [[61.113, 61.363], [61.376, 61.876], [61.89, 62.376], [62.39, 62.626], [62.64, 63.113], [63.126, 63.732], [63.745, 64.258], [64.64, 64.797], [64.811, 65.192], [65.205, 65.469], [65.561, 65.666], [65.679, 65.771], [65.784, 66.166], [66.179, 66.337], [66.35, 66.534], [66.547, 67.1]]}, {"kind": "s", "id": "s1_1_2", "md": "A missing alert and a slow rollback can each deserve their own line of whys.", "zh": "缺失的告警和缓慢的回滚，可能各自都值得单独追一串为什么。", "sp": null, "gap": false, "start": 67.488, "end": 72.504, "words": [[67.58, 67.62], [67.633, 67.988], [68.001, 68.383], [68.659, 68.764], [68.777, 68.83], [68.843, 69.238], [69.251, 69.83], [69.909, 70.054], [70.146, 70.343], [70.356, 70.777], [70.791, 70.975], [70.988, 71.199], [71.212, 71.462], [71.475, 71.567], [71.58, 72.12]]}, {"kind": "s", "id": "s1_2_0", "md": "The third mistake is taking the number five too literally.", "zh": "第三个错误是把「五」这个数字看得太死。", "sp": null, "gap": true, "start": 72.504, "end": 76.128, "words": [[72.622, 72.701], [72.715, 73.004], [73.017, 73.557], [73.649, 73.767], [73.78, 74.109], [74.122, 74.188], [74.201, 74.517], [74.53, 74.991], [75.004, 75.215], [75.228, 75.741]]}, {"kind": "s", "id": "s1_2_1", "md": "**Stop when you reach a cause you can actually change, whether that takes three whys or seven.**", "zh": "追到一个你真正能改变的原因就停下，不管那需要问三次还是七次。", "sp": null, "gap": false, "start": 76.128, "end": 81.792, "words": [[76.246, 76.641], [76.654, 76.773], [76.786, 76.917], [76.931, 77.141], [77.154, 77.207], [77.22, 77.641], [77.654, 77.76], [77.773, 77.918], [77.931, 78.338], [78.352, 78.931], [79.233, 79.483], [79.496, 79.667], [79.681, 79.996], [80.01, 80.339], [80.352, 80.865], [80.878, 80.983], [80.996, 81.391]]}, {"kind": "s", "id": "s1_2_2", "md": "Going further usually ends in ==abstract== answers like \"we need better communication.\"", "zh": "再往下追，通常只会得到「我们需要加强沟通」这种空泛的答案。", "sp": null, "gap": false, "start": 81.792, "end": 87.24, "words": [[81.897, 82.213], [82.226, 82.647], [82.66, 83.226], [83.239, 83.503], [83.516, 83.634], [83.647, 84.279], [84.292, 84.726], [84.739, 84.976], [85.2, 85.371], [85.384, 85.726], [85.739, 86.042], [86.055, 86.845]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, write the chain down where everyone can see it.", "zh": "最后，把这条链写在大家都能看到的地方。", "sp": null, "gap": true, "start": 87.24, "end": 90.744, "words": [[87.398, 87.806], [88.122, 88.279], [88.293, 88.372], [88.385, 88.674], [88.687, 89.029], [89.043, 89.227], [89.332, 89.74], [89.753, 89.872], [89.885, 90.148], [90.161, 90.345]]}, {"kind": "s", "id": "s1_3_1", "md": "A visible chain keeps the discussion ==grounded== and stops people from jumping to their favorite theory.", "zh": "链条摆在眼前，讨论就能落到实处，也能防止大家直接跳到自己偏爱的那套理论上。", "sp": null, "gap": false, "start": 90.744, "end": 96.648, "words": [[90.836, 90.889], [90.902, 91.336], [91.349, 91.797], [91.81, 92.126], [92.139, 92.231], [92.244, 92.797], [92.81, 93.362], [93.586, 93.757], [93.77, 94.152], [94.165, 94.52], [94.533, 94.704], [94.718, 95.165], [95.178, 95.283], [95.297, 95.454], [95.468, 95.862], [95.876, 96.257]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
