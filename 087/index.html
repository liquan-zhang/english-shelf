<script>
const D = {"id": "087", "title": "Talking About Food, Travel, and Home", "meta": "B2 · 约 290 词 · 场景：聊食物旅行和家乡", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Three Topics That Work Almost Anywhere", "heading_zh": "1. 几乎在哪儿都好聊的三个话题", "rows": [[{"id": "s0_0_0", "md": "In a team with people from Chennai, Manchester, Jakarta and Shanghai, it can be hard to __find common ground__.", "text": "In a team with people from Chennai, Manchester, Jakarta and Shanghai, it can be hard to find common ground.", "zh": "一个团队里有来自金奈、曼彻斯特、雅加达和上海的人，要找共同话题可能挺难的。", "sp": null}, {"id": "s0_0_1", "md": "Pop culture is different, sports are different, and politics is a ==minefield==.", "text": "Pop culture is different, sports are different, and politics is a minefield.", "zh": "流行文化不一样，体育不一样，政治更是雷区。", "sp": null}], [{"id": "s0_1_0", "md": "Food, travel and home are the exception.", "text": "Food, travel and home are the exception.", "zh": "吃的、旅行和家乡是例外。", "sp": null}, {"id": "s0_1_1", "md": "Everyone eats, most people have a trip they love to talk about, and everyone comes from somewhere.", "text": "Everyone eats, most people have a trip they love to talk about, and everyone comes from somewhere.", "zh": "人人都要吃饭，大多数人都有一趟爱聊的旅行，每个人也都来自某个地方。", "sp": null}, {"id": "s0_1_2", "md": "**These topics are safe because everyone is an expert on their own experience.**", "text": "These topics are safe because everyone is an expert on their own experience.", "zh": "这些话题之所以安全，是因为每个人在自己的经历上都是专家。", "sp": null}], [{"id": "s0_2_0", "md": "If you grew up in China and work in Singapore, you have an ==advantage== here, not a weakness.", "text": "If you grew up in China and work in Singapore, you have an advantage here, not a weakness.", "zh": "如果你在中国长大、在新加坡工作，这在这儿是你的优势，不是短板。", "sp": null}, {"id": "s0_2_1", "md": "Your colleagues are often ==fascinated== by places they have never visited.", "text": "Your colleagues are often fascinated by places they have never visited.", "zh": "同事们往往对自己没去过的地方特别好奇。", "sp": null}, {"id": "s0_2_2", "md": "Your hometown, your favorite breakfast, and the way your family celebrates the new year are all ready-made stories.", "text": "Your hometown, your favorite breakfast, and the way your family celebrates the new year are all ready-made stories.", "zh": "你的家乡、你最爱的早餐、你家怎么过年，都是现成的故事。", "sp": null}]]}, {"heading": "2. Prepare a Few Home Stories", "heading_zh": "2. 准备几个家乡故事", "rows": [[{"id": "s1_0_0", "md": "Prepare three short stories you can tell in under a minute: one about a dish, one about a place, and one about a ==tradition==.", "text": "Prepare three short stories you can tell in under a minute: one about a dish, one about a place, and one about a tradition.", "zh": "准备三个一分钟内能讲完的小故事：一道菜、一个地方、一个习俗。", "sp": null}, {"id": "s1_0_1", "md": "For example: \"In my hometown, people eat noodles for breakfast, and the soup is so spicy that visitors ==underestimate== it every time.\"", "text": "For example: \"In my hometown, people eat noodles for breakfast, and the soup is so spicy that visitors underestimate it every time.\"", "zh": "比如：「我们老家早上吃粉，汤辣得不行，外地人每次都低估它。」", "sp": null}], [{"id": "s1_1_0", "md": "Then turn the topic back with a ==comparison== question.", "text": "Then turn the topic back with a comparison question.", "zh": "然后用一个对比式的问题把话题抛回去。", "sp": null}, {"id": "s1_1_1", "md": "\"What's a typical breakfast where you grew up?\" or \"Is there a dish from home you can't find here?\"", "text": "\"What's a typical breakfast where you grew up?\" or \"Is there a dish from home you can't find here?\"", "zh": "「你们那边早餐一般吃什么？」或者「有没有哪道家乡菜在这边吃不到？」", "sp": null}, {"id": "s1_1_2", "md": "Questions like these __level the playing field__, because both of you get to be the expert.", "text": "Questions like these level the playing field, because both of you get to be the expert.", "zh": "这类问题能把双方拉到同一起跑线，因为你们俩都能当一回专家。", "sp": null}], [{"id": "s1_2_0", "md": "**Be curious about other people's food, but never rank it.**", "text": "Be curious about other people's food, but never rank it.", "zh": "对别人家的吃的要好奇，但千万别给它排高低。", "sp": null}, {"id": "s1_2_1", "md": "Calling a dish \"too oily\" or \"weird\" can sound like a judgment about someone's home.", "text": "Calling a dish \"too oily\" or \"weird\" can sound like a judgment about someone's home.", "zh": "说一道菜「太油」或者「好怪」，听起来就像是在评判人家的家乡。", "sp": null}, {"id": "s1_2_2", "md": "Try \"I've never had that, what does it taste like?\" instead, and you will sound open, not ==picky==.", "text": "Try \"I've never had that, what does it taste like?\" instead, and you will sound open, not picky.", "zh": "换成「我还没吃过，是什么味道？」，你听起来就是开放，而不是挑剔。", "sp": null}], [{"id": "s1_3_0", "md": "Travel works the same way.", "text": "Travel works the same way.", "zh": "旅行也是一样。", "sp": null}, {"id": "s1_3_1", "md": "Ask people for ==recommendations==, because everyone loves __being treated as__ a local guide.", "text": "Ask people for recommendations, because everyone loves being treated as a local guide.", "zh": "多请别人推荐，因为谁都喜欢被当成本地向导。", "sp": null}, {"id": "s1_3_2", "md": "\"If I only had one day in your hometown, where should I go?\" is a question almost nobody can resist.", "text": "\"If I only had one day in your hometown, where should I go?\" is a question almost nobody can resist.", "zh": "「如果我在你老家只能待一天，该去哪儿？」这个问题几乎没人能抵挡。", "sp": null}]]}], "gist": [{"q": "为什么食物、旅行和家乡在多国团队里是安全话题？", "a": "每个人都要吃饭、大多有喜欢的旅行、都来自某个地方；每个人都是自己经历的专家。"}, {"q": "作者为什么说来自中国、在新加坡工作反而是优势？", "a": "同事对没去过的地方很好奇，家乡、早餐、过年方式都是现成的故事。"}, {"q": "聊别人的食物时要注意什么？", "a": "可以好奇但不要评判或排名，别说“太油”“奇怪”；改问“我没吃过，是什么味道？”；旅行话题多请对方推荐。"}], "dictation": [{"id": "s0_1_2", "text": "These topics are safe because everyone is an expert on their own experience."}, {"id": "s1_1_0", "text": "Then turn the topic back with a comparison question."}, {"id": "s1_2_0", "text": "Be curious about other people's food, but never rank it."}, {"id": "s1_2_1", "text": "Calling a dish \"too oily\" or \"weird\" can sound like a judgment about someone's home."}], "shadow": {"text": "Food, travel and home are the exception. Everyone eats, most people have a trip they love to talk about, and everyone comes from somewhere. These topics are safe because everyone is an expert on their own experience.", "marked": "Food, <b>travel</b> and <b>home</b> / are the <b>exception</b>. //<br>Everyone <b>eats</b>, / most people have a <b>trip</b> they love to talk about, / and everyone comes from <b>somewhere</b>. //<br>These topics are <b>safe</b> / because everyone is an <b>expert</b> / on their <b>own</b> experience. //"}, "prompts": [{"q": "英国同事问你：What's your hometown like? 用一个准备好的家乡故事回答，再用比较式问题问回去，30 秒。", "ref": "I'm from a mid-sized city in Hunan, in central China. It's famous for very spicy food, and people there are quite proud of it. My mom honestly thinks the chili here is for children. What about you? Where did you grow up, and is there a dish from home you really miss in Singapore?", "ref_zh": "我来自湖南的一个中等城市，在中国中部。那边以特别能吃辣出名，大家也挺引以为豪的。我妈真心觉得这边的辣椒是给小孩吃的。你呢？你在哪儿长大的？有没有哪道家乡菜在新加坡特别想吃？", "id": "ref0"}, {"q": "澳洲同事带来一种很咸的家乡涂酱让你尝，你觉得味道很怪。得体地回应，并把话题聊下去。", "ref": "Wow, that's strong! Definitely not like anything I grew up with. Is this something people eat every day back home, or just for breakfast? Interesting. It reminds me of the fermented tofu my grandfather loved. Most of my friends couldn't stand it either. Next time I'll bring some in, and you can get your revenge.", "ref_zh": "哇，这个味儿好冲！跟我从小吃的完全不一样。这是你们那边每天都吃的，还是只早餐吃？有意思。让我想起我爷爷最爱的腐乳。我大多数朋友也受不了那个。下次我带点来，你就可以报仇了。", "id": "ref1"}], "words": [{"w": "minefield", "ipa": "/ˈmaɪnˌfiːld/", "zh": "雷区", "ex": "Pricing for that market is a legal minefield, so talk to the lawyers first.", "id": "w0"}, {"w": "advantage", "ipa": "/ədˈvæntɪdʒ/", "zh": "优势", "ex": "Knowing both teams is a real advantage when priorities clash.", "id": "w1"}, {"w": "fascinated", "ipa": "/ˈfæsəˌneɪtɪd/", "zh": "着迷的、极感兴趣的", "ex": "The new hires were fascinated by how the recommendation system works.", "id": "w2"} const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
