<script>
const D = {"id": "087", "title": "Talking About Food, Travel, and Home", "meta": "B2 · 约 290 词 · 场景：聊食物旅行和家乡", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Three Topics That Work Almost Anywhere", "heading_zh": "1. 几乎在哪儿都好聊的三个话题", "rows": [[{"id": "s0_0_0", "md": "In a team with people from Chennai, Manchester, Jakarta and Shanghai, it can be hard to __find common ground__.", "text": "In a team with people from Chennai, Manchester, Jakarta and Shanghai, it can be hard to find common ground.", "zh": "一个团队里有来自金奈、曼彻斯特、雅加达和上海的人，要找共同话题可能挺难的。", "sp": null}, {"id": "s0_0_1", "md": "Pop culture is different, sports are different, and politics is a ==minefield==.", "text": "Pop culture is different, sports are different, and politics is a minefield.", "zh": "流行文化不一样，体育不一样，政治更是雷区。", "sp": null}], [{"id": "s0_1_0", "md": "Food, travel and home are the exception.", "text": "Food, travel and home are the exception.", "zh": "吃的、旅行和家乡是例外。", "sp": null}, {"id": "s0_1_1", "md": "Everyone eats, most people have a trip they love to talk about, and everyone comes from somewhere.", "text": "Everyone eats, most people have a trip they love to talk about, and everyone comes from somewhere.", "zh": "人人都要吃饭，大多数人都有一趟爱聊的旅行，每个人也都来自某个地方。", "sp": null}, {"id": "s0_1_2", "md": "**These topics are safe because everyone is an expert on their own experience.**", "text": "These topics are safe because everyone is an expert on their own experience.", "zh": "这些话题之所以安全，是因为每个人在自己的经历上都是专家。", "sp": null}], [{"id": "s0_2_0", "md": "If you grew up in China and work in Singapore, you have an ==advantage== here, not a weakness.", "text": "If you grew up in China and work in Singapore, you have an advantage here, not a weakness.", "zh": "如果你在中国长大、在新加坡工作，这在这儿是你的优势，不是短板。", "sp": null}, {"id": "s0_2_1", "md": "Your colleagues are often ==fascinated== by places they have never visited.", "text": "Your colleagues are often fascinated by places they have never visited.", "zh": "同事们往往对自己没去过的地方特别好奇。", "sp": null}, {"id": "s0_2_2", "md": "Your hometown, your favorite breakfast, and the way your family celebrates the new year are all ready-made stories.", "text": "Your hometown, your favorite breakfast, and the way your family celebrates the new year are all ready-made stories.", "zh": "你的家乡、你最爱的早餐、你家怎么过年，都是现成的故事。", "sp": null}]]}, {"heading": "2. Prepare a Few Home Stories", "heading_zh": "2. 准备几个家乡故事", "rows": [[{"id": "s1_0_0", "md": "Prepare three short stories you can tell in under a minute: one about a dish, one about a place, and one about a ==tradition==.", "text": "Prepare three short stories you can tell in under a minute: one about a dish, one about a place, and one about a tradition.", "zh": "准备三个一分钟内能讲完的小故事：一道菜、一个地方、一个习俗。", "sp": null}, {"id": "s1_0_1", "md": "For example: \"In my hometown, people eat noodles for breakfast, and the soup is so spicy that visitors ==underestimate== it every time.\"", "text": "For example: \"In my hometown, people eat noodles for breakfast, and the soup is so spicy that visitors underestimate it every time.\"", "zh": "比如：「我们老家早上吃粉，汤辣得不行，外地人每次都低估它。」", "sp": null}], [{"id": "s1_1_0", "md": "Then turn the topic back with a ==comparison== question.", "text": "Then turn the topic back with a comparison question.", "zh": "然后用一个对比式的问题把话题抛回去。", "sp": null}, {"id": "s1_1_1", "md": "\"What's a typical breakfast where you grew up?\" or \"Is there a dish from home you can't find here?\"", "text": "\"What's a typical breakfast where you grew up?\" or \"Is there a dish from home you can't find here?\"", "zh": "「你们那边早餐一般吃什么？」或者「有没有哪道家乡菜在这边吃不到？」", "sp": null}, {"id": "s1_1_2", "md": "Questions like these __level the playing field__, because both of you get to be the expert.", "text": "Questions like these level the playing field, because both of you get to be the expert.", "zh": "这类问题能把双方拉到同一起跑线，因为你们俩都能当一回专家。", "sp": null}], [{"id": "s1_2_0", "md": "**Be curious about other people's food, but never rank it.**", "text": "Be curious about other people's food, but never rank it.", "zh": "对别人家的吃的要好奇，但千万别给它排高低。", "sp": null}, {"id": "s1_2_1", "md": "Calling a dish \"too oily\" or \"weird\" can sound like a judgment about someone's home.", "text": "Calling a dish \"too oily\" or \"weird\" can sound like a judgment about someone's home.", "zh": "说一道菜「太油」或者「好怪」，听起来就像是在评判人家的家乡。", "sp": null}, {"id": "s1_2_2", "md": "Try \"I've never had that, what does it taste like?\" instead, and you will sound open, not ==picky==.", "text": "Try \"I've never had that, what does it taste like?\" instead, and you will sound open, not picky.", "zh": "换成「我还没吃过，是什么味道？」，你听起来就是开放，而不是挑剔。", "sp": null}], [{"id": "s1_3_0", "md": "Travel works the same way.", "text": "Travel works the same way.", "zh": "旅行也是一样。", "sp": null}, {"id": "s1_3_1", "md": "Ask people for ==recommendations==, because everyone loves __being treated as__ a local guide.", "text": "Ask people for recommendations, because everyone loves being treated as a local guide.", "zh": "多请别人推荐，因为谁都喜欢被当成本地向导。", "sp": null}, {"id": "s1_3_2", "md": "\"If I only had one day in your hometown, where should I go?\" is a question almost nobody can resist.", "text": "\"If I only had one day in your hometown, where should I go?\" is a question almost nobody can resist.", "zh": "「如果我在你老家只能待一天，该去哪儿？」这个问题几乎没人能抵挡。", "sp": null}]]}], "gist": [{"q": "为什么食物、旅行和家乡在多国团队里是安全话题？", "a": "每个人都要吃饭、大多有喜欢的旅行、都来自某个地方；每个人都是自己经历的专家。"}, {"q": "作者为什么说来自中国、在新加坡工作反而是优势？", "a": "同事对没去过的地方很好奇，家乡、早餐、过年方式都是现成的故事。"}, {"q": "聊别人的食物时要注意什么？", "a": "可以好奇但不要评判或排名，别说“太油”“奇怪”；改问“我没吃过，是什么味道？”；旅行话题多请对方推荐。"}], "dictation": [{"id": "s0_1_2", "text": "These topics are safe because everyone is an expert on their own experience."}, {"id": "s1_1_0", "text": "Then turn the topic back with a comparison question."}, {"id": "s1_2_0", "text": "Be curious about other people's food, but never rank it."}, {"id": "s1_2_1", "text": "Calling a dish \"too oily\" or \"weird\" can sound like a judgment about someone's home."}], "shadow": {"text": "Food, travel and home are the exception. Everyone eats, most people have a trip they love to talk about, and everyone comes from somewhere. These topics are safe because everyone is an expert on their own experience.", "marked": "Food, <b>travel</b> and <b>home</b> / are the <b>exception</b>. //<br>Everyone <b>eats</b>, / most people have a <b>trip</b> they love to talk about, / and everyone comes from <b>somewhere</b>. //<br>These topics are <b>safe</b> / because everyone is an <b>expert</b> / on their <b>own</b> experience. //"}, "prompts": [{"q": "英国同事问你：What's your hometown like? 用一个准备好的家乡故事回答，再用比较式问题问回去，30 秒。", "ref": "I'm from a mid-sized city in Hunan, in central China. It's famous for very spicy food, and people there are quite proud of it. My mom honestly thinks the chili here is for children. What about you? Where did you grow up, and is there a dish from home you really miss in Singapore?", "ref_zh": "我来自湖南的一个中等城市，在中国中部。那边以特别能吃辣出名，大家也挺引以为豪的。我妈真心觉得这边的辣椒是给小孩吃的。你呢？你在哪儿长大的？有没有哪道家乡菜在新加坡特别想吃？", "id": "ref0"}, {"q": "澳洲同事带来一种很咸的家乡涂酱让你尝，你觉得味道很怪。得体地回应，并把话题聊下去。", "ref": "Wow, that's strong! Definitely not like anything I grew up with. Is this something people eat every day back home, or just for breakfast? Interesting. It reminds me of the fermented tofu my grandfather loved. Most of my friends couldn't stand it either. Next time I'll bring some in, and you can get your revenge.", "ref_zh": "哇，这个味儿好冲！跟我从小吃的完全不一样。这是你们那边每天都吃的，还是只早餐吃？有意思。让我想起我爷爷最爱的腐乳。我大多数朋友也受不了那个。下次我带点来，你就可以报仇了。", "id": "ref1"}], "words": [{"w": "minefield", "ipa": "/ˈmaɪnˌfiːld/", "zh": "雷区", "ex": "Pricing for that market is a legal minefield, so talk to the lawyers first.", "id": "w0"}, {"w": "advantage", "ipa": "/ədˈvæntɪdʒ/", "zh": "优势", "ex": "Knowing both teams is a real advantage when priorities clash.", "id": "w1"}, {"w": "fascinated", "ipa": "/ˈfæsəˌneɪtɪd/", "zh": "着迷的、极感兴趣的", "ex": "The new hires were fascinated by how the recommendation system works.", "id": "w2"} .025], [78.039, 78.117], [78.131, 78.262], [78.275, 78.381], [78.394, 78.986]]}, {"kind": "s", "id": "s1_2_0", "md": "**Be curious about other people's food, but never rank it.**", "zh": "对别人家的吃的要好奇，但千万别给它排高低。", "sp": null, "gap": true, "start": 79.368, "end": 83.16, "words": [[79.486, 79.592], [79.605, 80.131], [80.144, 80.421], [80.434, 80.671], [80.684, 81.092], [81.105, 81.565], [81.868, 82.0], [82.013, 82.302], [82.315, 82.579], [82.592, 82.776]]}, {"kind": "s", "id": "s1_2_1", "md": "Calling a dish \"too oily\" or \"weird\" can sound like a judgment about someone's home.", "zh": "说一道菜「太油」或者「好怪」，听起来就像是在评判人家的家乡。", "sp": null, "gap": false, "start": 83.16, "end": 88.68, "words": [[83.252, 83.555], [83.568, 83.647], [83.66, 84.121], [84.226, 84.515], [84.528, 85.042], [85.239, 85.436], [85.463, 85.91], [86.147, 86.278], [86.292, 86.555], [86.568, 86.699], [86.713, 86.765], [86.778, 87.292], [87.357, 87.594], [87.607, 87.95], [87.963, 88.292]]}, {"kind": "s", "id": "s1_2_2", "md": "Try \"I've never had that, what does it taste like?\" instead, and you will sound open, not ==picky==.", "zh": "换成「我还没吃过，是什么味道？」，你听起来就是开放，而不是挑剔。", "sp": null, "gap": false, "start": 88.68, "end": 95.376, "words": [[88.785, 89.101], [89.535, 89.693], [89.706, 89.956], [89.969, 90.219], [90.233, 90.509], [90.904, 90.983], [90.996, 91.114], [91.127, 91.22], [91.233, 91.575], [91.588, 91.877], [92.18, 92.759], [93.088, 93.167], [93.18, 93.259], [93.272, 93.391], [93.404, 93.733], [93.746, 94.114], [94.364, 94.575], [94.588, 94.996]]}, {"kind": "s", "id": "s1_3_0", "md": "Travel works the same way.", "zh": "旅行也是一样。", "sp": null, "gap": true, "start": 95.376, "end": 97.176, "words": [[95.481, 95.837], [95.85, 96.1], [96.113, 96.205], [96.218, 96.508], [96.521, 96.797]]}, {"kind": "s", "id": "s1_3_1", "md": "Ask people for ==recommendations==, because everyone loves __being treated as__ a local guide.", "zh": "多请别人推荐，因为谁都喜欢被当成本地向导。", "sp": null, "gap": false, "start": 97.176, "end": 102.528, "w const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
