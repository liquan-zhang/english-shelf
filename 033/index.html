<script>
const D = {"id": "033", "title": "Asking Your Manager for What You Need", "meta": "B2 · 约 260 词 · 场景：向经理要资源", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Hint Is Not a Request", "heading_zh": "1. 暗示不等于请求", "rows": [[{"id": "s0_0_0", "md": "For three months, your team has been one engineer short.", "text": "For three months, your team has been one engineer short.", "zh": "三个月来，你们团队一直缺一个工程师。", "sp": null}, {"id": "s0_0_1", "md": "You mention it __in passing__, your manager nods, and nothing happens.", "text": "You mention it in passing, your manager nods, and nothing happens.", "zh": "你顺嘴提了一句，经理点了点头，然后就没下文了。", "sp": null}, {"id": "s0_0_2", "md": "It is ==tempting== to decide that they simply don't care.", "text": "It is tempting to decide that they simply don't care.", "zh": "你很容易就会认定，他根本不在乎。", "sp": null}], [{"id": "s0_1_0", "md": "More often, the request never became a real request.", "text": "More often, the request never became a real request.", "zh": "但更常见的情况是，这个请求从来就没真正变成一个请求。", "sp": null}, {"id": "s0_1_1", "md": "\"We're a bit ==stretched==\" sounds like a ==remark==, not something that needs a decision.", "text": "\"We're a bit stretched\" sounds like a remark, not something that needs a decision.", "zh": "「我们人手有点紧」听起来像是随口一说，而不是一件需要做决定的事。", "sp": null}, {"id": "s0_1_2", "md": "Your manager hears twenty remarks like that every week and can only __act on__ a few.", "text": "Your manager hears twenty remarks like that every week and can only act on a few.", "zh": "你的经理每周都会听到二十句这样的话，只能对其中几句采取行动。", "sp": null}, {"id": "s0_1_3", "md": "The ones that get action are the ones that arrive with a clear question attached.", "text": "The ones that get action are the ones that arrive with a clear question attached.", "zh": "真正能推动起来的，是那些附带了明确问题的。", "sp": null}], [{"id": "s0_2_0", "md": "**A complaint describes a problem; a request asks someone to decide something.**", "text": "A complaint describes a problem; a request asks someone to decide something.", "zh": "抱怨是在描述一个问题；请求是在请某人做一个决定。", "sp": null}, {"id": "s0_2_1", "md": "If you want a decision, you have to make it easy to make.", "text": "If you want a decision, you have to make it easy to make.", "zh": "如果你想要一个决定，就得让这个决定容易做。", "sp": null}, {"id": "s0_2_2", "md": "That means being specific about what you need, by when, and why it matters to them.", "text": "That means being specific about what you need, by when, and why it matters to them.", "zh": "这意味着要说清楚你需要什么、什么时候要，以及这件事为什么对他很重要。", "sp": null}]]}, {"heading": "2. Making It Easy to Say Yes", "heading_zh": "2. 让对方容易答应", "rows": [[{"id": "s1_0_0", "md": "Start with a goal your manager already owns.", "text": "Start with a goal your manager already owns.", "zh": "从一个你经理本来就要负责的目标说起。", "sp": null}, {"id": "s1_0_1", "md": "\"You told leadership we would launch in the new market by June.\"", "text": "\"You told leadership we would launch in the new market by June.\"", "zh": "「你跟管理层说过，我们六月前会在新市场上线。」", "sp": null}, {"id": "s1_0_2", "md": "Now your ask is about their ==commitment==, not your comfort.", "text": "Now your ask is about their commitment, not your comfort.", "zh": "这样你的请求就关乎他的承诺，而不是你过得舒不舒服。", "sp": null}, {"id": "s1_0_3", "md": "Managers fight hardest for the things they have already promised to their own boss.", "text": "Managers fight hardest for the things they have already promised to their own boss.", "zh": "经理最会去争取的，就是那些他已经向自己老板承诺过的事情。", "sp": null}], [{"id": "s1_1_0", "md": "Then name the ==resource== exactly.", "text": "Then name the resource exactly.", "zh": "然后把需要的资源说得清清楚楚。", "sp": null}, {"id": "s1_1_1", "md": "Not \"more help,\" but \"one backend engineer for six weeks, or a two-week delay on the reporting feature.\"", "text": "Not \"more help,\" but \"one backend engineer for six weeks, or a two-week delay on the reporting feature.\"", "zh": "不是「多来点人帮忙」，而是「要一个后端工程师支援六周，或者把报表功能推迟两周」。", "sp": null}, {"id": "s1_1_2", "md": "Two clear options let your manager ==weigh== them instead of just saying yes or no.", "text": "Two clear options let your manager weigh them instead of just saying yes or no.", "zh": "给出两个清晰的选项，经理就能去权衡，而不只是回答行或不行。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, state the cost of doing nothing.", "text": "Finally, state the cost of doing nothing.", "zh": "最后，讲明白什么都不做的代价。", "sp": null}, {"id": "s1_2_1", "md": "\"Without either, the launch will probably slip by a month, and on-call will __stretch thin__ again.\"", "text": "\"Without either, the launch will probably slip by a month, and on-call will stretch thin again.\"", "zh": "「两样都没有的话，上线很可能要推迟一个月，on-call 的人手又会捉襟见肘。」", "sp": null}, {"id": "s1_2_2", "md": "**Clear costs turn a favor into a business decision.**", "text": "Clear costs turn a favor into a business decision.", "zh": "代价讲清楚了，求人帮忙就变成了一个业务决策。", "sp": null}], [{"id": "s1_3_0", "md": "If the answer is still no, ask what would change it.", "text": "If the answer is still no, ask what would change it.", "zh": "如果答案还是不行，就问问什么条件下能改变。", "sp": null}, {"id": "s1_3_1", "md": "Then __put a date on__ the follow-up, so the conversation does not quietly disappear.", "text": "Then put a date on the follow-up, so the conversation does not quietly disappear.", "zh": "然后给后续跟进定个日期，免得这次谈话就这么不了了之。", "sp": null}]]}], "gist": [{"q": "为什么团队缺人三个月，经理却没有行动？", "a": "你只是顺口提过，「有点忙不过来」听起来像随口一说，不是一个需要决策的请求。"}, {"q": "作者怎么区分抱怨和请求？", "a": "抱怨只描述问题；请求是请对方做一个决定，要说清要什么、什么时候要、为什么对他重要。"}, {"q": "让经理容易答应的请求包含哪几部分？", "a": "从经理自己承诺的目标说起；把资源说具体并给两个选项；说明不做的代价；被拒绝就问什么能改变结论，并约定跟进时间。"}], "dictation": [{"id": "s0_2_0", "text": "A complaint describes a problem; a request asks someone to decide something."}, {"id": "s1_2_2", "text": "Clear costs turn a favor into a business decision."}, {"id": "s1_0_2", "text": "Now your ask is about their commitment, not your comfort."}, {"id": "s1_3_0", "text": "If the answer is still no, ask what would change it."}], "shadow": {"text": "Then name the resource exactly. Not \"more help,\" but \"one backend engineer for six weeks, or a two-week delay on the reporting feature.\" Two clear options let your manager weigh them instead of just saying yes or no.", "marked": "Then name the resource <b>exactly</b>. //<br><b>Not</b> \"more help,\" / but \"<b>one</b> backend engineer for <b>six weeks</b>, / <b>or</b> a two-week delay / on the reporting feature.\" //<br>Two <b>clear</b> options / let your manager <b>weigh</b> them / instead of just saying <b>yes</b> or <b>no</b>. //"}, "prompts": [{"q": "团队人手不够，一季度的目标可能完不成。在一对一里用 30 秒向经理提出具体请求：挂钩他的目标、给两个选项、说清不做的代价。", "ref": "I need a decision from you on staffing. You committed to the new payment flow by the end of March. With the current team, we'll finish in late April. I see two options: borrow one engineer from the platform team for six weeks, or move the refund feature to the next quarter. If we do neither, we'll miss the date and the on-call load will stay high.", "ref_zh": "人手的事我需要你拍个板。你承诺了三月底上线新的支付流程。按现在的团队，我们要到四月下旬才能做完。我看有两个选项：从平台团队借一个工程师六周，或者把退款功能挪到下个季度。如果两个都不选，我们会错过这个时间点，on-call 的压力也会一直这么高。", "id": "ref0"}, {"q": "你需要预算请外部安全团队做一次渗透测试，经理上次说「再看看」。用 30 秒重新提出，并约定跟进时间。", "ref": "I want to come back to the security test we discussed. The launch is in five weeks, and the external team needs two weeks to schedule us, so if we wait much longer, we lose the option. Without a test, we'd be shipping a new payment page with no outside review. If budget is the issue, can you tell me what would change your answer? Could we decide by Thursday?", "ref_zh": "我想再跟你聊聊之前说的安全测试。上线还有五周，外部团队需要两周来排期，所以如果再拖下去，我们就没这个选项了。不做测试的话，我们上线一个全新的支付页面，却没有任何外部评审。如果卡在预算上，你能告诉我什么条件下你会改变决定吗？我们能在周四前定下来吗？", "id": "ref1"}], "words": [{"w": "tempting", "ipa": "/ˈtemptɪŋ/", "zh": "诱人的、让人想……的", "ex": "It's tempting to skip the tests, but we'll pay for it later.", "id": "w0"}, {"w": "stretched", "ipa": "/stretʃt/", "zh": "（人手）紧张的", "ex": "The team is stretched after two people left.", "id": "w1"}, {"w": "remark", "ipa": "/rɪˈmɑːrk/", "zh": "随口的评论", "ex": "His remark about the deadline turned const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
