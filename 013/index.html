<script>
const D = {"id": "013", "title": "Explaining a System to Non-Engineers", "meta": "B2 · 约 280 词 · 场景：跨职能沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. They Need Decisions, Not Diagrams", "heading_zh": "1. 他们要的是决策，不是架构图", "rows": [[{"id": "s0_0_0", "md": "When a sales lead asks why the new feature is taking so long, most engineers reach for a diagram.", "text": "When a sales lead asks why the new feature is taking so long, most engineers reach for a diagram.", "zh": "销售负责人问新功能为什么拖了这么久，大多数工程师第一反应是去画架构图。", "sp": null}, {"id": "s0_0_1", "md": "Queues, services, databases, arrows going everywhere.", "text": "Queues, services, databases, arrows going everywhere.", "zh": "队列、服务、数据库，箭头满天飞。", "sp": null}, {"id": "s0_0_2", "md": "Ten minutes later, the sales lead is ==politely== nodding and understands even less than before.", "text": "Ten minutes later, the sales lead is politely nodding and understands even less than before.", "zh": "十分钟后，销售负责人礼貌地点着头，懂的比之前还少。", "sp": null}], [{"id": "s0_1_0", "md": "The mistake is answering a question they did not ask.", "text": "The mistake is answering a question they did not ask.", "zh": "错就错在回答了一个对方没问的问题。", "sp": null}, {"id": "s0_1_1", "md": "They do not want to know how the system works.", "text": "They do not want to know how the system works.", "zh": "他们并不想知道系统是怎么运作的。", "sp": null}, {"id": "s0_1_2", "md": "They want to know what it means for their customers, their deadline, and their ==promises==.", "text": "They want to know what it means for their customers, their deadline, and their promises.", "zh": "他们想知道的是，这对他们的客户、他们的 deadline、他们许下的承诺意味着什么。", "sp": null}, {"id": "s0_1_3", "md": "**Explain the system only as deeply as the decision in front of them requires.**", "text": "Explain the system only as deeply as the decision in front of them requires.", "zh": "系统讲到多深，只取决于他们眼前要做的决定需要多深。", "sp": null}], [{"id": "s0_2_0", "md": "This is not about ==dumbing== things down for people who are less smart.", "text": "This is not about dumbing things down for people who are less smart.", "zh": "这不是因为对方不够聪明，所以要讲得浅显一点。", "sp": null}, {"id": "s0_2_1", "md": "It is about __translating__ your world into theirs, which is a skill in its own right.", "text": "It is about translating your world into theirs, which is a skill in its own right.", "zh": "而是把你的世界翻译成他们的世界，这本身就是一项本事。", "sp": null}]]}, {"heading": "2. Outcome, Picture, Impact", "heading_zh": "2. 结果、画面、影响", "rows": [[{"id": "s1_0_0", "md": "Start with the outcome they care about.", "text": "Start with the outcome they care about.", "zh": "先讲他们关心的结果。", "sp": null}, {"id": "s1_0_1", "md": "\"Right now, a customer's order can take up to a minute to show up in their history.\"", "text": "\"Right now, a customer's order can take up to a minute to show up in their history.\"", "zh": "「现在，客户下的单最长要一分钟才能在历史订单里看到。」", "sp": null}], [{"id": "s1_1_0", "md": "Then give one picture, not five.", "text": "Then give one picture, not five.", "zh": "然后给一个画面，不是五个。", "sp": null}, {"id": "s1_1_1", "md": "\"Think of it like a busy restaurant kitchen; orders come in faster than the cooks can handle, so they ==pile up== at the counter.\"", "text": "\"Think of it like a busy restaurant kitchen; orders come in faster than the cooks can handle, so they pile up at the counter.\"", "zh": "「可以把它想象成一个忙碌的餐厅后厨：单子进来的速度比厨师做得快，就在出餐口堆起来了。」", "sp": null}, {"id": "s1_1_2", "md": "**One good analogy beats ten accurate details.**", "text": "One good analogy beats ten accurate details.", "zh": "一个好的类比，胜过十个准确的细节。", "sp": null}, {"id": "s1_1_3", "md": "Pick something from daily life, and stop as soon as the picture works, before the ==analogy== starts to break.", "text": "Pick something from daily life, and stop as soon as the picture works, before the analogy starts to break.", "zh": "从日常生活里挑个例子，画面一立住就停，别等到类比开始站不住脚。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, connect it back to their world.", "text": "Finally, connect it back to their world.", "zh": "最后，把它跟他们的世界连起来。", "sp": null}, {"id": "s1_2_1", "md": "\"Adding more cooks takes about three weeks, which is why the promotion should start after the holidays.\"", "text": "\"Adding more cooks takes about three weeks, which is why the promotion should start after the holidays.\"", "zh": "「再加厨师大概要三周，所以促销最好放在节后开始。」", "sp": null}, {"id": "s1_2_2", "md": "Now they can __plan around it__, which is what they really needed.", "text": "Now they can plan around it, which is what they really needed.", "zh": "这样他们就能据此做计划了，这才是他们真正需要的。", "sp": null}], [{"id": "s1_3_0", "md": "Watch your ==jargon== along the way.", "text": "Watch your jargon along the way.", "zh": "过程中注意少用黑话。", "sp": null}, {"id": "s1_3_1", "md": "Words like \"latency\" or \"throughput\" feel normal to you, but each one is a small wall.", "text": "Words like \"latency\" or \"throughput\" feel normal to you, but each one is a small wall.", "zh": "像「延迟」「吞吐量」这种词你觉得很平常，但每一个对他们来说都是一道小墙。", "sp": null}, {"id": "s1_3_2", "md": "At the end, ask them to __say it back__ in their own words.", "text": "At the end, ask them to say it back in their own words.", "zh": "最后，请他们用自己的话复述一遍。", "sp": null}, {"id": "s1_3_3", "md": "If they can explain it to their boss, you have done your job ==properly==.", "text": "If they can explain it to their boss, you have done your job properly.", "zh": "如果他们能讲给自己的老板听，你的活儿就干到位了。", "sp": null}]]}], "gist": [{"q": "工程师向非技术同事解释系统时常犯的错误是什么？", "a": "回答了对方没问的问题，讲系统怎么运作，而对方只想知道对客户、截止时间和承诺意味着什么。"}, {"q": "作者建议的三步解释结构是什么？", "a": "先讲对方关心的结果；再用一个生活化的类比；最后连回对方的工作，让他能据此做计划。"}, {"q": "怎么检验对方真的听懂了？", "a": "请对方用自己的话复述，能讲给自己老板听就说明讲清楚了。"}], "dictation": [{"id": "s0_1_3", "text": "Explain the system only as deeply as the decision in front of them requires."}, {"id": "s1_1_2", "text": "One good analogy beats ten accurate details."}, {"id": "s0_1_1", "text": "They do not want to know how the system works."}, {"id": "s1_2_2", "text": "Now they can plan around it, which is what they really needed."}], "shadow": {"text": "Then give one picture, not five. \"Think of it like a busy restaurant kitchen; orders come in faster than the cooks can handle, so they pile up at the counter.\" One good analogy beats ten accurate details.", "marked": "Then give <b>one</b> picture, / not <b>five</b>. //<br>\"Think of it like a busy restaurant <b>kitchen</b>; / orders come in <b>faster</b> / than the cooks can handle, / so they <b>pile up</b> at the counter.\" //<br>One <b>good</b> analogy / beats <b>ten</b> accurate details. //"}, "prompts": [{"q": "市场部同事问你：为什么大促那天 App 会变慢？用 30 秒按“结果、类比、对他的影响”向她解释，不用技术术语。", "ref": "Good question. What users notice is that pages take a few seconds longer to load during big sales. Think of it like a shop with only four checkout counters. On a normal day that's fine, but on sale day the lines get really long. We're adding more counters, but it takes a few weeks. So for the next campaign, starting at different times in different regions would really help.", "ref_zh": "好问题。用户能感觉到的是，大促期间页面加载会慢上几秒。可以把它想象成一家只有四个收银台的店。平时没问题，但到了大促那天，队就排得特别长。我们正在加收银台，但需要几周时间。所以下次活动，如果不同地区错开时间开始，会很有帮助。", "id": "ref0"}, {"q": "财务同事问为什么要花钱做“数据库迁移”。用 30 秒用一个类比解释，并说明不做会有什么后果。", "ref": "Fair question, since nothing visible changes for users. Our current database is like an old warehouse that's almost full. We can still squeeze things in, but every month it gets slower to find anything, and one day the shelves will simply run out. Moving to the new one costs us about two months of work now. If we wait, we'll be forced to move during a crisis, which is much more expensive.", "ref_zh": "这个问题问得在理，毕竟用户那边看不到任何变化。我们现在的数据库就像一个快塞满的旧仓库。东西还能硬塞进去，但每个月找东西都更慢，总有一天货架会直接用完。现在搬到新仓库，大概要花两个月的工作量。如果等下去，我们就会被迫在出事的时候搬，那代价就大多了。", "id": "ref1"}], "words": [{"w": "politely", "ipa": "/pəˈlaɪtli/", "zh": "礼貌地", "ex": "She politely declined the extra scope for this sprint.", "id": "w0"}, {"w": "promise (n.)", "ipa": "/ˈprɑːmɪs/", "zh": "承诺", "ex": "We can't make promises to the client until load testing is done.", "tts_w": "promise", const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();

  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
