<script>
const D = {"id": "090", "title": "Being Funny Without Trying Too Hard", "meta": "B2 · 约 270 词 · 场景：工作场合的幽默", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Forget About Telling Jokes", "heading_zh": "1. 别想着讲笑话", "rows": [[{"id": "s0_0_0", "md": "Many people think being funny at work means telling jokes.", "text": "Many people think being funny at work means telling jokes.", "zh": "很多人以为在职场上有趣，就是会讲笑话。", "sp": null}, {"id": "s0_0_1", "md": "In a second language, that is a hard game to win, because jokes depend on timing, wordplay and shared culture.", "text": "In a second language, that is a hard game to win, because jokes depend on timing, wordplay and shared culture.", "zh": "用第二语言的话，这局很难赢，因为笑话靠的是节奏、文字游戏和共同的文化背景。", "sp": null}, {"id": "s0_0_2", "md": "**The funniest people at work are rarely joke tellers; they are good observers.**", "text": "The funniest people at work are rarely joke tellers; they are good observers.", "zh": "职场上最有意思的人，很少是会讲笑话的人；他们是会观察的人。", "sp": null}], [{"id": "s0_1_0", "md": "Most workplace humor comes from noticing something everyone already feels.", "text": "Most workplace humor comes from noticing something everyone already feels.", "zh": "职场上的幽默，大多来自点破一件大家都有同感的事。", "sp": null}, {"id": "s0_1_1", "md": "Think of the meeting that could have been an email, or the build that only fails during demos.", "text": "Think of the meeting that could have been an email, or the build that only fails during demos.", "zh": "比如那个本来发封邮件就能解决的会，或者那个一到演示就挂的构建。", "sp": null}, {"id": "s0_1_2", "md": "When you name that shared feeling lightly, people laugh because they ==recognize== it.", "text": "When you name that shared feeling lightly, people laugh because they recognize it.", "zh": "你轻描淡写地把这种共同感受说出来，大家就会笑，因为都有共鸣。", "sp": null}], [{"id": "s0_2_0", "md": "This kind of humor is also much safer across cultures.", "text": "This kind of humor is also much safer across cultures.", "zh": "这种幽默在跨文化场合也安全得多。", "sp": null}, {"id": "s0_2_1", "md": "It does not rely on ==sarcasm==, which often gets lost or ==misread== between offices.", "text": "It does not rely on sarcasm, which often gets lost or misread between offices.", "zh": "它不靠讽刺，而讽刺在不同办公室之间经常会丢失或者被误读。", "sp": null}, {"id": "s0_2_2", "md": "It also __takes the pressure off__, because you are describing the room, not performing for it.", "text": "It also takes the pressure off, because you are describing the room, not performing for it.", "zh": "它也让你没那么大压力，因为你是在描述现场，而不是给大家表演。", "sp": null}]]}, {"heading": "2. Three Low-Effort Habits", "heading_zh": "2. 三个不费劲的习惯", "rows": [[{"id": "s1_0_0", "md": "First, use ==self-deprecating== humor, gently.", "text": "First, use self-deprecating humor, gently.", "zh": "第一，适度地自嘲。", "sp": null}, {"id": "s1_0_1", "md": "\"My English gets worse after four o'clock, so let's decide this now\" makes people relax, and it shows you are __comfortable in your own skin__.", "text": "\"My English gets worse after four o'clock, so let's decide this now\" makes people relax, and it shows you are comfortable in your own skin.", "zh": "「我的英语过了四点就会变差，所以咱们现在就定了吧」，能让大家放松下来，也显得你对自己挺自在的。", "sp": null}, {"id": "s1_0_2", "md": "It works because you name your weakness before anyone else can.", "text": "It works because you name your weakness before anyone else can.", "zh": "之所以管用，是因为你抢在别人之前，自己先把短处说出来了。", "sp": null}], [{"id": "s1_1_0", "md": "Second, ==exaggerate== a small truth.", "text": "Second, exaggerate a small truth.", "zh": "第二，把一个小事实稍微夸张一下。", "sp": null}, {"id": "s1_1_1", "md": "\"This spreadsheet has more tabs than my browser, and that's saying something.\"", "text": "\"This spreadsheet has more tabs than my browser, and that's saying something.\"", "zh": "「这个表格的 tab 比我浏览器开的还多，这可不是一般的多。」", "sp": null}, {"id": "s1_1_2", "md": "Small, harmless exaggeration is easy to deliver and hard to get wrong.", "text": "Small, harmless exaggeration is easy to deliver and hard to get wrong.", "zh": "小而无害的夸张，好说出口，也很难翻车。", "sp": null}], [{"id": "s1_2_0", "md": "Third, be a good audience.", "text": "Third, be a good audience.", "zh": "第三，做个好观众。", "sp": null}, {"id": "s1_2_1", "md": "When someone else makes a joke, laugh, or __play along__ with one more line.", "text": "When someone else makes a joke, laugh, or play along with one more line.", "zh": "别人开玩笑的时候，笑一笑，或者顺着再接一句。", "sp": null}, {"id": "s1_2_2", "md": "**You do not need to be the funniest person in the room; you just need to make humor feel welcome.**", "text": "You do not need to be the funniest person in the room; you just need to make humor feel welcome.", "zh": "你不需要当全场最有趣的人；只要让大家觉得在这儿开玩笑是受欢迎的。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, avoid jokes about someone's accent, appearance or country, and never get a laugh at a junior person's ==expense==.", "text": "Finally, avoid jokes about someone's accent, appearance or country, and never get a laugh at a junior person's expense.", "zh": "最后，别拿别人的口音、长相或者国家开玩笑，也永远别拿资历浅的人逗乐。", "sp": null}, {"id": "s1_3_1", "md": "If you are not sure a joke will __go down well__, leave it out.", "text": "If you are not sure a joke will go down well, leave it out.", "zh": "如果拿不准一个笑话会不会冷场或冒犯人，那就别讲。", "sp": null}]]}], "gist": [{"q": "作者为什么不建议用第二语言讲笑话？", "a": "笑话依赖时机、文字游戏和共同文化，用第二语言很难赢；职场上最有趣的人通常是善于观察的人。"}, {"q": "为什么观察式幽默跨文化更安全？", "a": "它说出大家共有的感受，不依赖讽刺，而讽刺在不同办公室之间容易丢失或被误解。"}, {"q": "文中的三个低成本习惯和禁区是什么？", "a": "温和地自嘲；夸大一个小事实；做好听众、接梗。禁区：拿口音、外貌、国家开玩笑，或拿下属开涮；没把握就别说。"}], "dictation": [{"id": "s0_0_2", "text": "The funniest people at work are rarely joke tellers; they are good observers."}, {"id": "s0_1_0", "text": "Most workplace humor comes from noticing something everyone already feels."}, {"id": "s1_1_2", "text": "Small, harmless exaggeration is easy to deliver and hard to get wrong."}, {"id": "s1_2_2", "text": "You do not need to be the funniest person in the room; you just need to make humor feel welcome."}], "shadow": {"text": "Most workplace humor comes from noticing something everyone already feels. Think of the meeting that could have been an email, or the build that only fails during demos. When you name that shared feeling lightly, people laugh because they recognize it.", "marked": "Most workplace <b>humor</b> / comes from <b>noticing</b> something / everyone <b>already</b> feels. //<br>Think of the meeting / that could have been an <b>email</b>, / or the build that only fails during <b>demos</b>. //<br>When you <b>name</b> that shared feeling <b>lightly</b>, / people laugh / because they <b>recognize</b> it. //"}, "prompts": [{"q": "季度复盘会开场，大家都很紧张，因为数据不好。用一句自嘲或观察式幽默缓和气氛，再进入正题。", "ref": "Before we start, I should say I've looked at these numbers so many times this week that I now see them in my dreams. So nothing on these slides will surprise me. Okay, the short version is we missed our target, and I want to spend most of today on why, and on what we change next quarter.", "ref_zh": "开始之前先说一句，这周这些数字我看了太多遍，现在做梦都能梦到。所以这几页 PPT 上的东西都吓不到我了。好，简单说就是我们没达成目标，今天我想把大部分时间花在原因上，以及下个季度要改什么。", "id": "ref0"}, {"q": "会上同事抱怨 Our build server needs a holiday more than we do. 你接一句梗，再顺势把话题拉回工作。", "ref": "Honestly, I think it's already on holiday. It just forgot to set an out-of-office message. Maybe that's why it only replies every forty minutes. But seriously, Sam, if you have time this week, could we look at caching together? I'd love to get our build time down before the release.", "ref_zh": "说实话，我觉得它已经在休假了。只是忘了设自动回复。可能这就是为什么它每四十分钟才回一次。不过说正经的，Sam，你这周要是有空，我们一起看看缓存？我想在发布前把构建时间降下来。", "id": "ref1"}], "words": [{"w": "recognize", "ipa": "/ˈrekəɡˌnaɪz/", "zh": "认出、意识到", "ex": "Everyone recognized the problem the moment she showed the graph.", "id": "w0"}, {"w": "sarcasm", "ipa": "/ˈsɑːrˌkæzəm/", "zh": "讽刺、挖苦", "ex": "Sarcasm in chat is easy to misread, so add context.", "id": "w1"}, {"w": "misread", "ipa": "/ˌmɪsˈriːd/", "zh": "误读、误解", "ex": "I misread his short reply as angry, but he was just busy.", "id": "w2"}, {"w": "self-deprecating", "ipa": "/ˌself ˈdeprəˌkeɪtɪŋ/", "zh": "自嘲的、自谦的", "ex": "Her self-deprecating opening made the tense review feel lighter.", "id": "w3"}, {"w": "exaggerate", "ipa": "/ɪɡˈzædʒəˌreɪt/", "zh": "夸大、夸张", "ex": "I'm not exaggerating, the page took ten seconds to load.", "tts": "I'm not exaggerating, the page took ten seconds to load.", "id": "w4"}, {"w": "expense", "ipa": "/ɪkˈspens/", "zh": "代价；at someone's expense 拿某人开涮", "ex": "Never make a joke at a new teammate's expense.", "id": "w5"}, {"w": "deliver (v.)", "ipa": "/dɪˈlɪvər/", "zh": "（讲笑话、发言）表达、说出", "ex": "He delivered the bad news calmly and with a clear plan.", "tts_w": "deliver", "id": "w6"}, {"w": "play along", "ipa": "/pleɪ əˈlɔːŋ/", "zh": "配合、接梗", "ex": "When the PM joked about the deadline, I played along for a second.", "id": "w7"}, {"w": "go down well", "ipa": "/ɡoʊ daʊn wel/", "zh": "受欢迎、反响好", "ex": "The new on-call rotation went down well with the team.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Forget About Telling Jokes", "zh": "1. 别想着讲笑话", "start": 0.0, "end": 2.472, "words": [[0.105, 0.382], [0.711, 0.987], [1.0, 1.237], [1.25, 1.539], [1.553, 2.079]]}, {"kind": "s", "id": "s0_0_0", "md": "Many people think being funny at work means telling jokes.", "zh": "很多人以为在职场上有趣，就是会讲笑话。", "sp": null, "gap": false, "start": 2.472, "end": 5.832, "words": [[2.577, 2.775], [2.788, 3.117], [3.13, 3.367], [3.38, 3.604], [3.617, 3.959], [3.972, 4.064], [4.077, 4.354], [4.367, 4.59], [4.604, 4.906], [4.919, 5.433]]}, {"kind": "s", "id": "s0_0_1", "md": "In a second language, that is a hard game to win, because jokes depend on timing, wordplay and shared culture.", "zh": "用第二语言的话，这局很难赢，因为笑话靠的是节奏、文字游戏和共同的文化背景。", "sp": null, "gap": false, "start": 5.832, "end": 13.32, "words": [[5.937, 6.003], [6.016, 6.069], [6.082, 6.503], [6.516, 7.095], [7.345, 7.503], [7.516, 7.608], [7.621, 7.674], [7.687, 8.082], [8.095, 8.332], [8.345, 8.45], [8.464, 8.806], [9.121, 9.464], [9.477, 9.779], [9.793, 10.135], [10.148, 10.279], [10.293, 10.793], [11.187, 11.806], [11. afer across cultures.", "zh": "这种幽默在跨文化场合也安全得多。", "sp": null, "gap": true, "start": 33.192, "end": 36.864, "words": [[33.297, 33.416], [33.429, 33.626], [33.639, 33.718], [33.731, 34.1], [34.271, 34.442], [34.521, 34.85], [34.863, 35.1], [35.113, 35.495], [35.508, 35.85], [35.863, 36.468]]}, {"kind": "s", "id": "s0_2_1", "md": "It does not rely on ==sarcasm==, which often gets lost or ==misread== between offices.", "zh": "它不靠讽刺，而讽刺在不同办公室之间经常会丢失或者被误读。", "sp": null, "gap": false, "start": 36.864, "end": 42.432, "words": [[36.969, 37.035], [37.048, 37.206], [37.219, 37.417], [37.43, 37.825], [37.838, 37.956], [37.969, 38.667], [38.956, 39.114], [39.127, 39.509], [39.522, 39.719], [39.732, 40.246], [40.325, 40.443], [40.456, 40.996], [41.009, 41.364], [41.377, 42.035]]}, {"kind": "s", "id": "s0_2_2", "md": "It also __takes the pressure off__, because you are describing the room, not performing for it.", "zh": "它也让你没那么大压力，因为你是在描述现场，而不是给大家表演。", "sp": null, "gap": false, "start": 42.432, "end": 47.928, "words": [[42.537, 42.616], [42.629, 42.919], [42.932, 43.221], [43.235, 43.327], [43.34, 43.748], [43.761, 44.143], [44.353, 44.656], [44.669, 44.748], [44.761, 44.853], [44.866, 45.485], [45.498, 45.564], [45.577, 46.011], [46.406, 46.577], [46.59, 47.116], [47.129, 47.393], [47.406, 47.537]]}, {"kind": "h", "id": "h1", "md": "2. Three Low-Effort Habits", "zh": "2. 三个不费劲的习惯", "start": 47.928, "end": 50.4, "words": [[48.046, 48.27], [48.625, 48.928], [48.941, 49.428], [49.441, 50.02]]}, {"kind": "s", "id": "s1_0_0", "md": "First, use ==self-deprecating== humor, gently.", "zh": "第一，适度地自嘲。", "sp": null, "gap": false, "start": 50.4, "end": 53.976, "words": [[50.571, 50.939], [51.229, 51.439], [51.453, 52.4], [52.413, 52.821], [53.124, 53.571]]}, {"kind": "s", "id": "s1_0_1", "md": "\"My English gets worse after four o'clock, so let's decide this now\" makes people relax, and it shows you are __comfortable in your own skin__.", "zh": "「我的英语过了四点就会变差，所以咱们现在就定了吧」，能让大家放松下来，也显得你对自己挺自在的。", "sp": null, "gap": false, "start": 53.976, "end": 62.352, "words": [[54.173, 54.187], [54.265, 54.634], [54.647, 54.844], [54.858, 55.213], [55.226, 55.502], [55.515, 55.713], [55.726, 56.16], [56.568, 56.687], [56.7, 56.897], [56.91, 57.397], [57.41, 57.594], [57.608, 57.937], [58.173, 58.423], [58.437, 58.792], [58.805, 59.423], [59.647, 59.752], [59.765, 59.844], [59.858, 60.2], [60.213, 60.305], [60.318, 60.437], [60.45, 61.068], [61.081, 61.186], [61.2, 61.358], [61.371, 61.529], [61.542, 61.963]]}, {"kind": "s", "id": "s1_0_2", "md": "It works because you name your weakness before anyone else can.", "zh": "之所以管用，是因为你抢在别人之前，自己先把短处说出来了。", "sp": null, "gap": false, "start": 62.352, "end": 66.408, "words": [[62.457, 62.615], [62.628, 62.984], [62.997, 63.339], [63.352, 63.457], [63.47, 63.773], [63.786, 63.97], [63.984, 64.523], [64.536, 65.089], [65.102, 65.418], [65.431, 65.641], [65.655, 66.01]]}, {"kind": "s", "id": "s1_1_0", "md": "Second, ==exaggerate== a small truth.", "zh": "第二，把一个小事实稍微夸张一下。", "sp": null, "gap": true, "start": 66.408, "end": 69.24, "words": [[66.526, 66.921], [67.369, 67.974], [67.987, 68.026], [68.04, 68.355], [68.369, 68.842]]}, {"kind": "s", "id": "s1_1_1", "md": "\"This spreadsheet has more tabs than my browser, and that's saying something.\"", "zh": "「这个表格的 tab 比我浏览器开的还多，这可不是一般的多。」", "sp": null, "gap": false, "start": 69.24, "end": 73.608, "words": [[69.424, 69.464], [69.543, 70.082], [70.095, 70.319], [70.332, 70.622], [70.635, 71.069], [71.082, 71.201], [71.214, 71.358], [71.372, 71.924], [72.24, 72.293], [72.306, 72.503], [72.516, 72.793], [72.806, 73.214]]}, {"kind": "s", "id": "s1_1_2", "md": "Small, harmless exaggeration is easy to deliver and hard to get wrong.", "zh": "小而无害的夸张，好说出口，也很难翻车。", "sp": null, "gap": false, "start": 73.608, "end": 78.888, "words": [[73.713, 74.108], [74.503, 74.911], [74.924, 75.792], [75.937, 76.121], [76.253, 76.569], [76.582, 76.687], [76.7, 77.253], [77.437, 77.503], [77.516, 77.871], [77.884, 77.95], [77.963, 78.161], [78.174, 78.503]]}, {"kind": "s", "id": "s1_2_0", "md": "Third, be a good audience.", "zh": "第三，做个好观众。", "sp": null, "gap": true, "start": 78.888, "end": 81.096, "words": [[79.046, 79.48], [79.756, 79.875], [79.888, 79.941], [79.954, 80.099], [80.112, 80.717]]}, {"kind": "s", "id": "s1_2_1", "md": "When someone else makes a joke, laugh, or __play along__ with one more line.", "zh": "别人开玩笑的时候，笑一笑，或者顺着再接一句。", "sp": null, "gap": false, "start": 81.096, "end": 85.824, "words": [[81.201, 81.306], [81.32, 81.649], [81.662, 81.899], [81.912, 82.149], [82.162, 82.228], [82.241, 82.675], [83.057, 83.504], [83.885, 83.964], [83.978, 84.175], [84.188, 84.517], [84.53, 84.675], [84.688, 84.872], [84.885, 85.083], [85.096, 85.425]]}, {"kind": "s", "id": "s1_2_2", "md": "**You do not need to be the funniest person in the room; you just need to make humor feel welcome.**", "zh": "你不需要当全场最有趣的人；只要让大家觉得在这儿开玩笑是受欢迎的。", "sp": null, "gap": false, "start": 85.824, "end": 91.008, "words": [[85.942, 86.021], [86.035, 86.153], [86.166, 86.377], [86.39, 86.587], [86.6, 86.666], [86.679, 86.798], [86.811, 86.903], [86.916, 87.456], [87.469, 87.877], [87.89, 87.969], [87.982, 88.048], [88.061, 88.363], [88.824, 88.877], [88.89, 89.113], [89.127, 89.284], [89.298, 89.35], [89.363, 89.561], [89.574, 89.877], [89.89, 90.192], [90.206, 90.627]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, avoid jokes about someone's accent, appearance or country, and never get a laugh at a junior person's ==expense==.", "zh": "最后，别拿别人的口音、长相或者国家开玩笑，也永远别拿资历浅的人逗乐。", "sp": null, "gap": true, "start": 91.008, "end": 98.832, "words": [[91.192, 91.679], [91.929, 92.311], [92.324, 92.653], [92.666, 92.903], [92.916, 93.311], [93.324, 93.863], [94.166, 94.732], [94.745, 94.85], [94.863, 95.403], [95.692, 95.824], [95.837, 96.061], [96.074, 96.205], [96.219, 96.271], [96.284, 96.732], [96.745, 96.824], [96.837, 96.903], [96.916, 97.324], [97.337, 97.732], [97.745, 98.429]]}, {"kind": "s", "id": "s1_3_1", "md": "If you are not sure a joke will __go down well__, leave it out.", "zh": "如果拿不准一个笑话会不会冷场或冒犯人，那就别讲。", "sp": null, "gap": false, "start": 98.832, "end": 102.12, "words": [[98.937, 99.042], [99.056, 99.135], [99.148, 99.214], [99.227, 99.411], [99.424, 99.635], [99.648, 99.7], [99.714, 100.043], [100.056, 100.161], [100.174, 100.306], [100.319, 100.621], [100.635, 100.95], [101.227, 101.371], [101.385, 101.464], [101.477, 101.727]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
