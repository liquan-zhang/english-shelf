<script>
const D = {"id": "090", "title": "Being Funny Without Trying Too Hard", "meta": "B2 · 约 270 词 · 场景：工作场合的幽默", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Forget About Telling Jokes", "heading_zh": "1. 别想着讲笑话", "rows": [[{"id": "s0_0_0", "md": "Many people think being funny at work means telling jokes.", "text": "Many people think being funny at work means telling jokes.", "zh": "很多人以为在职场上有趣，就是会讲笑话。", "sp": null}, {"id": "s0_0_1", "md": "In a second language, that is a hard game to win, because jokes depend on timing, wordplay and shared culture.", "text": "In a second language, that is a hard game to win, because jokes depend on timing, wordplay and shared culture.", "zh": "用第二语言的话，这局很难赢，因为笑话靠的是节奏、文字游戏和共同的文化背景。", "sp": null}, {"id": "s0_0_2", "md": "**The funniest people at work are rarely joke tellers; they are good observers.**", "text": "The funniest people at work are rarely joke tellers; they are good observers.", "zh": "职场上最有意思的人，很少是会讲笑话的人；他们是会观察的人。", "sp": null}], [{"id": "s0_1_0", "md": "Most workplace humor comes from noticing something everyone already feels.", "text": "Most workplace humor comes from noticing something everyone already feels.", "zh": "职场上的幽默，大多来自点破一件大家都有同感的事。", "sp": null}, {"id": "s0_1_1", "md": "Think of the meeting that could have been an email, or the build that only fails during demos.", "text": "Think of the meeting that could have been an email, or the build that only fails during demos.", "zh": "比如那个本来发封邮件就能解决的会，或者那个一到演示就挂的构建。", "sp": null}, {"id": "s0_1_2", "md": "When you name that shared feeling lightly, people laugh because they ==recognize== it.", "text": "When you name that shared feeling lightly, people laugh because they recognize it.", "zh": "你轻描淡写地把这种共同感受说出来，大家就会笑，因为都有共鸣。", "sp": null}], [{"id": "s0_2_0", "md": "This kind of humor is also much safer across cultures.", "text": "This kind of humor is also much safer across cultures.", "zh": "这种幽默在跨文化场合也安全得多。", "sp": null}, {"id": "s0_2_1", "md": "It does not rely on ==sarcasm==, which often gets lost or ==misread== between offices.", "text": "It does not rely on sarcasm, which often gets lost or misread between offices.", "zh": "它不靠讽刺，而讽刺在不同办公室之间经常会丢失或者被误读。", "sp": null}, {"id": "s0_2_2", "md": "It also __takes the pressure off__, because you are describing the room, not performing for it.", "text": "It also takes the pressure off, because you are describing the room, not performing for it.", "zh": "它也让你没那么大压力，因为你是在描述现场，而不是给大家表演。", "sp": null}]]}, {"heading": "2. Three Low-Effort Habits", "heading_zh": "2. 三个不费劲的习惯", "rows": [[{"id": "s1_0_0", "md": "First, use ==self-deprecating== humor, gently.", "text": "First, use self-deprecating humor, gently.", "zh": "第一，适度地自嘲。", "sp": null}, {"id": "s1_0_1", "md": "\"My English gets worse after four o'clock, so let's decide this now\" makes people relax, and it shows you are __comfortable in your own skin__.", "text": "\"My English gets worse after four o'clock, so let's decide this now\" makes people relax, and it shows you are comfortable in your own skin.", "zh": "「我的英语过了四点就会变差，所以咱们现在就定了吧」，能让大家放松下来，也显得你对自己挺自在的。", "sp": null}, {"id": "s1_0_2", "md": "It works because you name your weakness before anyone else can.", "text": "It works because you name your weakness before anyone else can.", "zh": "之所以管用，是因为你抢在别人之前，自己先把短处说出来了。", "sp": null}], [{"id": "s1_1_0", "md": "Second, ==exaggerate== a small truth.", "text": "Second, exaggerate a small truth.", "zh": "第二，把一个小事实稍微夸张一下。", "sp": null}, {"id": "s1_1_1", "md": "\"This spreadsheet has more tabs than my browser, and that's saying something.\"", "text": "\"This spreadsheet has more tabs than my browser, and that's saying something.\"", "zh": "「这个表格的 tab 比我浏览器开的还多，这可不是一般的多。」", "sp": null}, {"id": "s1_1_2", "md": "Small, harmless exaggeration is easy to deliver and hard to get wrong.", "text": "Small, harmless exaggeration is easy to deliver and hard to get wrong.", "zh": "小而无害的夸张，好说出口，也很难翻车。", "sp": null}], [{"id": "s1_2_0", "md": "Third, be a good audience.", "text": "Third, be a good audience.", "zh": "第三，做个好观众。", "sp": null}, {"id": "s1_2_1", "md": "When someone else makes a joke, laugh, or __play along__ with one more line.", "text": "When someone else makes a joke, laugh, or play along with one more line.", "zh": "别人开玩笑的时候，笑一笑，或者顺着再接一句。", "sp": null}, {"id": "s1_2_2", "md": "**You do not need to be the funniest person in the room; you just need to make humor feel welcome.**", "text": "You do not need to be the funniest person in the room; you just need to make humor feel welcome.", "zh": "你不需要当全场最有趣的人；只要让大家觉得在这儿开玩笑是受欢迎的。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, avoid jokes about someone's accent, appearance or country, and never get a laugh at a junior person's ==expense==.", "text": "Finally, avoid jokes about someone's accent, appearance or country, and never get a laugh at a junior person's expense.", "zh": "最后，别拿别人的口音、长相或者国家开玩笑，也永远别拿资历浅的人逗乐。", "sp": null}, {"id": "s1_3_1", "md": "If you are not sure a joke will __go down well__, leave it out.", "text": "If you are not sure a joke will go down well, leave it out.", "zh": "如果拿不准一个笑话会不会冷场或冒犯人，那就别讲。", "sp": null}]]}], "gist": [{"q": "作者为什么不建议用第二语言讲笑话？", "a": "笑话依赖时机、文字游戏和共同文化，用第二语言很难赢；职场上最有趣的人通常是善于观察的人。"}, {"q": "为什么观察式幽默跨文化更安全？", "a": "它说出大家共有的感受，不依赖讽刺，而讽刺在不同办公室之间容易丢失或被误解。"}, {"q": "文中的三个低成本习惯和禁区是什么？", "a": "温和地自嘲；夸大一个小事实；做好听众、接梗。禁区：拿口音、外貌、国家开玩笑，或拿下属开涮；没把握就别说。"}], "dictation": [{"id": "s0_0_2", "text": "The funniest people at work are rarely joke tellers; they are good observers."}, {"id": "s0_1_0", "text": "Most workplace humor comes from noticing something everyone already feels."}, {"id": "s1_1_2", "text": "Small, harmless exaggeration is easy to deliver and hard to get wrong."}, {"id": "s1_2_2", "text": "You do not need to be the funniest person in the room; you just need to make humor feel welcome."}], "shadow": {"text": "Most workplace humor comes from noticing something everyone already feels. Think of the meeting that could have been an email, or the build that only fails during demos. When you name that shared feeling lightly, people laugh because they recognize it.", "marked": "Most workplace <b>humor</b> / comes from <b>noticing</b> something / everyone <b>already</b> feels. //<br>Think of the meeting / that could have been an <b>email</b>, / or the build that only fails during <b>demos</b>. //<br>When you <b>name</b> that shared feeling <b>lightly</b>, / people laugh / because they <b>recognize</b> it. //"}, "prompts": [{"q": "季度复盘会开场，大家都很紧张，因为数据不好。用一句自嘲或观察式幽默缓和气氛，再进入正题。", "ref": "Before we start, I should say I've looked at these numbers so many times this week that I now see them in my dreams. So nothing on these slides will surprise me. Okay, the short version is we missed our target, and I want to spend most of today on why, and on what we change next quarter.", "ref_zh": "开始之前先说一句，这周这些数字我看了太多遍，现在做梦都能梦到。所以这几页 PPT 上的东西都吓不到我了。好，简单说就是我们没达成目标，今天我想把大部分时间花在原因上，以及下个季度要改什么。", "id": "ref0"}, {"q": "会上同事抱怨 Our build server needs a holiday more than we do. 你接一句梗，再顺势把话题拉回工作。", "ref": "Honestly, I think it's already on holiday. It just forgot to set an out-of-office message. Maybe that's why it only replies every forty minutes. But seriously, Sam, if you have time this week, could we look at caching together? I'd love to get our build time down before the release.", "ref_zh": "说实话，我觉得它已经在休假了。只是忘了设自动回复。可能这就是为什么它每四十分钟才回一次。不过说正经的，Sam，你这周要是有空，我们一起看看缓存？我想在发布前把构建时间降下来。", "id": "ref1"}], "words": [{"w": "recognize", "ipa": "/ˈrekəɡˌnaɪz/", "zh": "认出、意识到", "ex": "Everyone recognized the problem the moment she showed the graph.", "id": "w0"}, {"w": "sarcasm", "ipa": "/ˈsɑːrˌkæzəm/", "zh": "讽刺、挖苦", "ex": "Sarcasm in chat is easy to misread, so add context.", "id": "w1"}, {"w": "misread", "ipa": "/ˌmɪsˈriːd/", "zh": "误读、误解", "ex": "I misread his short reply as angry, but he was just busy.", "id": "w2"}, {"w": "self-deprecating", "ipa": "/ˌself ˈdeprəˌkeɪtɪŋ/", "zh": "自嘲的、自谦的", "ex" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
