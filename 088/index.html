<script>
const D = {"id": "088", "title": "Welcoming a New Teammate", "meta": "B2 · 约 280 词 · 场景：欢迎新同事", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The First Week Sticks", "heading_zh": "1. 第一周会一直记得", "rows": [[{"id": "s0_0_0", "md": "New people remember their first week for a long time.", "text": "New people remember their first week for a long time.", "zh": "新人会把入职第一周记很久。", "sp": null}, {"id": "s0_0_1", "md": "They remember who said hello, who invited them to lunch, and who left them alone at a desk with a new laptop.", "text": "They remember who said hello, who invited them to lunch, and who left them alone at a desk with a new laptop.", "zh": "他们记得谁打了招呼，谁约他们吃午饭，又是谁把他们和一台新电脑丢在工位上不管。", "sp": null}, {"id": "s0_0_2", "md": "That week shapes a sense of ==belonging== that is hard to change later.", "text": "That week shapes a sense of belonging that is hard to change later.", "zh": "那一周塑造的归属感，之后很难再改变。", "sp": null}], [{"id": "s0_1_0", "md": "Most new teammates feel ==overwhelmed== in their first few days, even if they look calm.", "text": "Most new teammates feel overwhelmed in their first few days, even if they look calm.", "zh": "大多数新同事头几天都会有点招架不住，哪怕表面看着很淡定。", "sp": null}, {"id": "s0_1_1", "md": "As a lead, you cannot remove that feeling, but you can make it smaller.", "text": "As a lead, you cannot remove that feeling, but you can make it smaller.", "zh": "作为 lead，你没法消除这种感觉，但可以让它小一点。", "sp": null}, {"id": "s0_1_2", "md": "**A new teammate does not need a perfect onboarding plan; they need one person who clearly wants them there.**", "text": "A new teammate does not need a perfect onboarding plan; they need one person who clearly wants them there.", "zh": "新同事不需要一份完美的入职计划；他们需要一个明显希望他们来的人。", "sp": null}], [{"id": "s0_2_0", "md": "The welcome is also a message to the rest of the team.", "text": "The welcome is also a message to the rest of the team.", "zh": "欢迎新人，也是在给团队其他人传递信号。", "sp": null}, {"id": "s0_2_1", "md": "People watch how you treat the newest person, and they draw ==conclusions== about what kind of team this really is.", "text": "People watch how you treat the newest person, and they draw conclusions about what kind of team this really is.", "zh": "大家会看你怎么对待最新来的人，并由此判断这到底是个什么样的团队。", "sp": null}]]}, {"heading": "2. Four Small Gestures", "heading_zh": "2. 四个小举动", "rows": [[{"id": "s1_0_0", "md": "Send a short message before day one.", "text": "Send a short message before day one.", "zh": "入职前发一条简短的消息。", "sp": null}, {"id": "s1_0_1", "md": "\"Hi Priya, looking forward to having you on the team on Monday. I'll meet you in the lobby at ten.\"", "text": "\"Hi Priya, looking forward to having you on the team on Monday. I'll meet you in the lobby at ten.\"", "zh": "「Hi Priya，期待你周一加入团队。我十点在大堂接你。」", "sp": null}, {"id": "s1_0_2", "md": "It removes the ==uncertainty== of the first morning.", "text": "It removes the uncertainty of the first morning.", "zh": "这样就省掉了第一天早上的忐忑。", "sp": null}], [{"id": "s1_1_0", "md": "On the first day, introduce them with one ==strength==, not just a job title.", "text": "On the first day, introduce them with one strength, not just a job title.", "zh": "第一天介绍他们的时候，带上一个长处，而不只是一个职位。", "sp": null}, {"id": "s1_1_1", "md": "\"This is Priya, she built a payments dashboard in her last role, so she's the person to ask about charts.\"", "text": "\"This is Priya, she built a payments dashboard in her last role, so she's the person to ask about charts.\"", "zh": "「这是 Priya，她上一份工作搭过一个支付看板，图表相关的事问她就对了。」", "sp": null}, {"id": "s1_1_2", "md": "Then make sure someone __takes them to lunch__, so they are not eating alone at their desk.", "text": "Then make sure someone takes them to lunch, so they are not eating alone at their desk.", "zh": "然后确保有人带他们去吃午饭，别让他们一个人在工位上吃。", "sp": null}], [{"id": "s1_2_0", "md": "Give them a simple map of people: who to ask about code, who to ask about process, and who knows the best lunch spots.", "text": "Give them a simple map of people: who to ask about code, who to ask about process, and who knows the best lunch spots.", "zh": "给他们一张简单的人员地图：代码问谁，流程问谁，谁知道附近最好吃的午饭。", "sp": null}, {"id": "s1_2_1", "md": "**Knowing who to ask matters more in the first month than knowing the answers.**", "text": "Knowing who to ask matters more in the first month than knowing the answers.", "zh": "第一个月里，知道该问谁比知道答案更重要。", "sp": null}], [{"id": "s1_3_0", "md": "At the end of the first week, __check in__ with an open question.", "text": "At the end of the first week, check in with an open question.", "zh": "第一周快结束时，用一个开放式问题 check-in 一下。", "sp": null}, {"id": "s1_3_1", "md": "\"What's been ==confusing== so far?\" works better than \"Is everything okay?\", because it gives them ==permission== to be honest.", "text": "\"What's been confusing so far?\" works better than \"Is everything okay?\", because it gives them permission to be honest.", "zh": "「到目前为止有什么让你摸不着头脑的？」比「一切都还好吧？」好用，因为它让对方可以放心说实话。", "sp": null}]]}], "gist": [{"q": "作者为什么说新人的第一周很重要？", "a": "新人会记很久，它决定归属感；新人往往不知所措，同时团队其他人也在看你怎么对待最新的人。"}, {"q": "新人最需要的是什么？", "a": "不是完美的入职计划，而是一个明确欢迎他们的人。"}, {"q": "文中的四个小动作是什么？", "a": "入职前发短消息约好见面；第一天介绍时带上一个长处并安排人陪吃午饭；给一张“该问谁”的人员地图；第一周末用开放问题 check in。"}], "dictation": [{"id": "s0_1_2", "text": "A new teammate does not need a perfect onboarding plan; they need one person who clearly wants them there."}, {"id": "s1_0_2", "text": "It removes the uncertainty of the first morning."}, {"id": "s1_2_1", "text": "Knowing who to ask matters more in the first month than knowing the answers."}, {"id": "s1_3_0", "text": "At the end of the first week, check in with an open question."}], "shadow": {"text": "Most new teammates feel overwhelmed in their first few days, even if they look calm. As a lead, you cannot remove that feeling, but you can make it smaller. A new teammate does not need a perfect onboarding plan; they need one person who clearly wants them there.", "marked": "Most new teammates / feel <b>overwhelmed</b> in their first few days, / even if they look <b>calm</b>. //<br>As a lead, / you cannot <b>remove</b> that feeling, / but you can make it <b>smaller</b>. //<br>A new teammate does not need a <b>perfect</b> onboarding plan; / they need <b>one person</b> / who clearly <b>wants</b> them there. //"}, "prompts": [{"q": "新同事 Tom 从伦敦调来新加坡，第一天你带他认识团队。用“名字加一个长处”的方式介绍他，并约他吃午饭。", "ref": "Hey everyone, quick one. This is Tom, he just moved over from our London office. Tom spent the last two years making our upload service twice as fast, so if you have performance questions, he's your guy. Tom, a few of us usually grab lunch at the food court downstairs around noon. Want to join us today?", "ref_zh": "大家好，占用一分钟。这是 Tom，刚从伦敦办公室调过来。Tom 过去两年把我们的上传服务提速了一倍，所以有性能方面的问题，找他就对了。Tom，我们几个中午一般十二点左右去楼下美食广场吃饭。今天一起去？", "id": "ref0"}, {"q": "新同事入职第一周的周五，你做一个 30 秒的 check-in。", "ref": "So, you've survived your first week! How are you finding it? Good. What's been the most confusing part so far? Honestly, anything counts, the tools, the acronyms, the people. That makes sense, our release process confuses everyone at first. Let's spend twenty minutes on it Monday morning. And have a proper rest this weekend.", "ref_zh": "怎么样，第一周熬过来了！感觉如何？那就好。到目前为止最让你摸不着头脑的是什么？说真的，什么都算，工具、缩写、人。能理解，我们的发布流程一开始谁都搞不懂。周一早上我们花二十分钟过一遍。这周末好好休息。", "id": "ref1"}], "words": [{"w": "belonging", "ipa": "/bɪˈlɔːŋɪŋ/", "zh": "归属感", "ex": "Small rituals like team lunches build a sense of belonging.", "id": "w0"}, {"w": "overwhelmed", "ipa": "/ˌoʊvərˈwelmd/", "zh": "不知所措的、被压垮的", "ex": "I felt overwhelmed by the number of internal tools in my first week.", "id": "w1"}, {"w": "conclusion", "ipa": "/kənˈkluːʒən/", "zh": "结论", "ex": "Don't draw conclusions from one week of data.", "id": "w2"}, {"w": "uncertainty", "ipa": "/ʌnˈsɜːrtənti/", "zh": "不确定性", "ex": "The reorg created a lot of uncertainty, so we need to communicate early.", "id": "w3"}, {"w": "strength", "ipa": "/streŋθ/", "zh": "长处、优势", "ex": "Her biggest strength is turning messy requirements into a clear plan.", "id": "w4"}, const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
