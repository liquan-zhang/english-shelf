<script>
const D = {"id": "088", "title": "Welcoming a New Teammate", "meta": "B2 · 约 280 词 · 场景：欢迎新同事", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The First Week Sticks", "heading_zh": "1. 第一周会一直记得", "rows": [[{"id": "s0_0_0", "md": "New people remember their first week for a long time.", "text": "New people remember their first week for a long time.", "zh": "新人会把入职第一周记很久。", "sp": null}, {"id": "s0_0_1", "md": "They remember who said hello, who invited them to lunch, and who left them alone at a desk with a new laptop.", "text": "They remember who said hello, who invited them to lunch, and who left them alone at a desk with a new laptop.", "zh": "他们记得谁打了招呼，谁约他们吃午饭，又是谁把他们和一台新电脑丢在工位上不管。", "sp": null}, {"id": "s0_0_2", "md": "That week shapes a sense of ==belonging== that is hard to change later.", "text": "That week shapes a sense of belonging that is hard to change later.", "zh": "那一周塑造的归属感，之后很难再改变。", "sp": null}], [{"id": "s0_1_0", "md": "Most new teammates feel ==overwhelmed== in their first few days, even if they look calm.", "text": "Most new teammates feel overwhelmed in their first few days, even if they look calm.", "zh": "大多数新同事头几天都会有点招架不住，哪怕表面看着很淡定。", "sp": null}, {"id": "s0_1_1", "md": "As a lead, you cannot remove that feeling, but you can make it smaller.", "text": "As a lead, you cannot remove that feeling, but you can make it smaller.", "zh": "作为 lead，你没法消除这种感觉，但可以让它小一点。", "sp": null}, {"id": "s0_1_2", "md": "**A new teammate does not need a perfect onboarding plan; they need one person who clearly wants them there.**", "text": "A new teammate does not need a perfect onboarding plan; they need one person who clearly wants them there.", "zh": "新同事不需要一份完美的入职计划；他们需要一个明显希望他们来的人。", "sp": null}], [{"id": "s0_2_0", "md": "The welcome is also a message to the rest of the team.", "text": "The welcome is also a message to the rest of the team.", "zh": "欢迎新人，也是在给团队其他人传递信号。", "sp": null}, {"id": "s0_2_1", "md": "People watch how you treat the newest person, and they draw ==conclusions== about what kind of team this really is.", "text": "People watch how you treat the newest person, and they draw conclusions about what kind of team this really is.", "zh": "大家会看你怎么对待最新来的人，并由此判断这到底是个什么样的团队。", "sp": null}]]}, {"heading": "2. Four Small Gestures", "heading_zh": "2. 四个小举动", "rows": [[{"id": "s1_0_0", "md": "Send a short message before day one.", "text": "Send a short message before day one.", "zh": "入职前发一条简短的消息。", "sp": null}, {"id": "s1_0_1", "md": "\"Hi Priya, looking forward to having you on the team on Monday. I'll meet you in the lobby at ten.\"", "text": "\"Hi Priya, looking forward to having you on the team on Monday. I'll meet you in the lobby at ten.\"", "zh": "「Hi Priya，期待你周一加入团队。我十点在大堂接你。」", "sp": null}, {"id": "s1_0_2", "md": "It removes the ==uncertainty== of the first morning.", "text": "It removes the uncertainty of the first morning.", "zh": "这样就省掉了第一天早上的忐忑。", "sp": null}], [{"id": "s1_1_0", "md": "On the first day, introduce them with one ==strength==, not just a job title.", "text": "On the first day, introduce them with one strength, not just a job title.", "zh": "第一天介绍他们的时候，带上一个长处，而不只是一个职位。", "sp": null}, {"id": "s1_1_1", "md": "\"This is Priya, she built a payments dashboard in her last role, so she's the person to ask about charts.\"", "text": "\"This is Priya, she built a payments dashboard in her last role, so she's the person to ask about charts.\"", "zh": "「这是 Priya，她上一份工作搭过一个支付看板，图表相关的事问她就对了。」", "sp": null}, {"id": "s1_1_2", "md": "Then make sure someone __takes them to lunch__, so they are not eating alone at their desk.", "text": "Then make sure someone takes them to lunch, so they are not eating alone at their desk.", "zh": "然后确保有人带他们去吃午饭，别让他们一个人在工位上吃。", "sp": null}], [{"id": "s1_2_0", "md": "Give them a simple map of people: who to ask about code, who to ask about process, and who knows the best lunch spots.", "text": "Give them a simple map of people: who to ask about code, who to ask about process, and who knows the best lunch spots.", "zh": "给他们一张简单的人员地图：代码问谁，流程问谁，谁知道附近最好吃的午饭。", "sp": null}, {"id": "s1_2_1", "md": "**Knowing who to ask matters more in the first month than knowing the answers.**", "text": "Knowing who to ask matters more in the first month than knowing the answers.", "zh": "第一个月里，知道该问谁比知道答案更重要。", "sp": null}], [{"id": "s1_3_0", "md": "At the end of the first week, __check in__ with an open question.", "text": "At the end of the first week, check in with an open question.", "zh": "第一周快结束时，用一个开放式问题 check-in 一下。", "sp": null}, {"id": "s1_3_1", "md": "\"What's been ==confusing== so far?\" works better than \"Is everything okay?\", because it gives them ==permission== to be honest.", "text": "\"What's been confusing so far?\" works better than \"Is everything okay?\", because it gives them permission to be honest.", "zh": "「到目前为止有什么让你摸不着头脑的？」比「一切都还好吧？」好用，因为它让对方可以放心说实话。", "sp": null}]]}], "gist": [{"q": "作者为什么说新人的第一周很重要？", "a": "新人会记很久，它决定归属感；新人往往不知所措，同时团队其他人也在看你怎么对待最新的人。"}, {"q": "新人最需要的是什么？", "a": "不是完美的入职计划，而是一个明确欢迎他们的人。"}, {"q": "文中的四个小动作是什么？", "a": "入职前发短消息约好见面；第一天介绍时带上一个长处并安排人陪吃午饭；给一张“该问谁”的人员地图；第一周末用开放问题 check in。"}], "dictation": [{"id": "s0_1_2", "text": "A new teammate does not need a perfect onboarding plan; they need one person who clearly wants them there."}, {"id": "s1_0_2", "text": "It removes the uncertainty of the first morning."}, {"id": "s1_2_1", "text": "Knowing who to ask matters more in the first month than knowing the answers."}, {"id": "s1_3_0", "text": "At the end of the first week, check in with an open question."}], "shadow": {"text": "Most new teammates feel overwhelmed in their first few days, even if they look calm. As a lead, you cannot remove that feeling, but you can make it smaller. A new teammate does not need a perfect onboarding plan; they need one person who clearly wants them there.", "marked": "Most new teammates / feel <b>overwhelmed</b> in their first few days, / even if they look <b>calm</b>. //<br>As a lead, / you cannot <b>remove</b> that feeling, / but you can make it <b>smaller</b>. //<br>A new teammate does not need a <b>perfect</b> onboarding plan; / they need <b>one person</b> / who clearly <b>wants</b> them there. //"}, "prompts": [{"q": "新同事 Tom 从伦敦调来新加坡，第一天你带他认识团队。用“名字加一个长处”的方式介绍他，并约他吃午饭。", "ref": "Hey everyone, quick one. This is Tom, he just moved over from our London office. Tom spent the last two years making our upload service twice as fast, so if you have performance questions, he's your guy. Tom, a few of us usually grab lunch at the food court downstairs around noon. Want to join us today?", "ref_zh": "大家好，占用一分钟。这是 Tom，刚从伦敦办公室调过来。Tom 过去两年把我们的上传服务提速了一倍，所以有性能方面的问题，找他就对了。Tom，我们几个中午一般十二点左右去楼下美食广场吃饭。今天一起去？", "id": "ref0"}, {"q": "新同事入职第一周的周五，你做一个 30 秒的 check-in。", "ref": "So, you've survived your first week! How are you finding it? Good. What's been the most confusing part so far? Honestly, anything counts, the tools, the acronyms, the people. That makes sense, our release process confuses everyone at first. Let's spend twenty minutes on it Monday morning. And have a proper rest this weekend.", "ref_zh": "怎么样，第一周熬过来了！感觉如何？那就好。到目前为止最让你摸不着头脑的是什么？说真的，什么都算，工具、缩写、人。能理解，我们的发布流程一开始谁都搞不懂。周一早上我们花二十分钟过一遍。这周末好好休息。", "id": "ref1"}], "words": [{"w": "belonging", "ipa": "/bɪˈlɔːŋɪŋ/", "zh": "归属感", "ex": "Small rituals like team lunches build a sense of belonging.", "id": "w0"}, {"w": "overwhelmed", "ipa": "/ˌoʊvərˈwelmd/", "zh": "不知所措的、被压垮的", "ex": "I felt overwhelmed by the number of internal tools in my first week.", "id": "w1"}, {"w": "conclusion", "ipa": "/kənˈkluːʒən/", "zh": "结论", "ex": "Don't draw conclusions from one week of data.", "id": "w2"}, {"w": "uncertainty", "ipa": "/ʌnˈsɜːrtənti/", "zh": "不确定性", "ex": "The reorg created a lot of uncertainty, so we need to communicate early.", "id": "w3"}, {"w": "strength", "ipa": "/streŋθ/", "zh": "长处、优势", "ex": "Her biggest strength is turning messy requirements into a clear plan.", "id": "w4"}, const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
