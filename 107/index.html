const D = {"id": "107", "type": "dialogue", "title": "Ordering at a Restaurant", "meta": "B2 · 约 310 词 · 场景：海鲜餐厅点餐与改单", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Server", "name_zh": "服务员", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "服务员推荐了什么？「你」对辣度和分量问了什么？", "a": "推荐招牌辣椒蟹和麦片虾；「你」问有多辣，要了微辣，又问中份够不够两大一小吃。"}, {"q": "「你」为什么改单？改成了什么？", "a": "螃蟹是时价，中份大概一百块，比预期贵；厨房还没开做，就改成了七十块左右的小份，并多加两个炸馒头。"}, {"q": "关于孩子，「你」提了哪些要求？", "a": "要不辣的半份蛋炒饭、一杯温水，并请厨房先上炒饭。"}], "dictation": [{"id": "s0_1_0", "text": "I think we're ready. It's our first time here. What would you recommend?"}, {"id": "s0_7_0", "text": "Okay, one medium crab and four fried buns. Could we also get a vegetable dish that isn't too oily?"}, {"id": "s1_2_0", "text": "Hmm, that's more than I expected. Is it too late to change to a smaller one?"}, {"id": "s1_8_0", "text": "That's fine. Could you bring the rice out first? He gets hungry quickly."}], "shadow": {"speaker": "A", "text": "Excuse me, sorry. I just noticed the crab is market price. How much would a medium one be?", "marked": "Excuse me, / <b>sorry</b>. //<br>I just <b>noticed</b> / the crab is <b>market price</b>. //<br>How much / would a <b>medium</b> one be? //"}, "prompts": [{"q": "你对虾过敏，朋友带你去一家东南亚餐厅。点菜前跟服务员说明情况，问哪些菜可以吃、能不能单独做。", "ref": "Before we order, I should mention that I'm allergic to prawns, and it's quite serious. Could you tell me which dishes are safe for me? I know a lot of sauces here use dried shrimp or shrimp paste. If the curry has it, could the kitchen make a separate portion without it? Thanks, I really appreciate it.", "ref_zh": "点菜之前我得说一下，我对虾过敏，而且挺严重的。能告诉我哪些菜我可以吃吗？我知道这里很多酱料会用虾米或虾酱。如果咖喱里有，厨房能单独给我做一份不放的吗？谢谢，非常感谢。", "id": "ref0"}, {"q": "菜上齐了，你发现分量太多吃不完，想问能不能打包，顺便再加一份甜品给孩子。", "ref": "Excuse me, everything was delicious, but we ordered way too much. Could we take the rest of the crab and the rice away? Separate boxes would be great. And could we get one mango pudding for our son? Just one spoon is fine, and could you bring it out after you clear the table?", "ref_zh": "不好意思，菜都很好吃，但我们点太多了。剩下的螃蟹和炒饭能打包吗？分开装最好。再给我儿子来一份芒果布丁？一个勺子就行，收完桌子再上吧。", "id": "ref1"}], "words": [{"w": "signature dish", "ipa": "/ˈsɪɡnətʃər dɪʃ/", "zh": "招牌菜", "ex": "The roast duck is their signature dish.", "id": "w0"}, {"w": "spicy", "ipa": "/ˈspaɪsi/", "zh": "辣的", "ex": "Is the laksa very spicy?", "id": "w1"}, {"w": "mild", "ipa": "/maɪld/", "zh": "微辣的；温和的", "ex": "Could I have the curry mild, please?", "id": "w2"}, {"w": "half portion", "ipa": "/hæf ˈpɔːrʃən/", "zh": "半份", "ex": "Can I order a half portion for my daughter?", "id": "w3"}, {"w": "oily", "ipa": "/ˈɔɪli/", "zh": "油腻的", "ex": "The noodles were a bit too oily for me.", "id": "w4"}, {"w": "market price", "ipa": "/ˈmɑːrkɪt praɪs/", "zh": "时价", "ex": "The lobster is sold at market price.", "id": "w5"}, {"w": "less sweet", "ipa": "/les swiːt/", "zh": "少甜", "ex": "One iced tea, less sweet, please.", "id": "w6"}, {"w": "wet wipes", "ipa": "/wet waɪps/", "zh": "湿纸巾", "ex": "Always keep some wet wipes in the diaper bag.", "id": "w7"}, {"w": "messy", "ipa": "/ˈmesi/", "zh": "弄得脏乱的", "ex": "Eating crab with your hands is fun but messy.", "id": "w8"}], "sections": [{"heading": "1. Asking for Recommendations", "heading_zh": "1. 问推荐", "rows": [[{"id": "s0_0_0", "md": "Hi, are you ready to order, or do you need a few more minutes?", "text": "Hi, are you ready to order, or do you need a few more minutes?", "zh": "您好，可以点菜了吗？还是再看几分钟？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I think we're ready. It's our first time here. What would you recommend?**", "text": "I think we're ready. It's our first time here. What would you recommend?", "zh": "应该可以了。我们第一次来，你推荐什么？", "sp": "A"}], [{"id": "s0_2_0", "md": "Our ==signature== dish is the chilli crab, and the cereal prawns are very popular too.", "text": "Our signature dish is the chilli crab, and the cereal prawns are very popular too.", "zh": "我们的招牌菜是辣椒蟹，麦片虾也很受欢迎。", "sp": "B"}], [{"id": "s0_3_0", "md": "Chilli crab sounds great. How ==spicy== is it, though? My wife can't take much heat.", "text": "Chilli crab sounds great. How spicy is it, though? My wife can't take much heat.", "zh": "辣椒蟹听起来不错。不过有多辣？我太太不太能吃辣。", "sp": "A"}], [{"id": "s0_4_0", "md": "It's more sweet than spicy, but we can make it ==mild== if you like.", "text": "It's more sweet than spicy, but we can make it mild if you like.", "zh": "其实偏甜不算辣，您要的话我们可以做微辣。", "sp": "B"}], [{"id": "s0_5_0", "md": "Mild would be perfect. And how big is a medium crab? __Is it enough for__ two adults and a child?", "text": "Mild would be perfect. And how big is a medium crab? Is it enough for two adults and a child?", "zh": "微辣正好。中份的蟹有多大？够两个大人一个小孩吃吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "A medium one is about one kilo, so it's good for two or three. Most people __order some fried buns__ for the sauce.", "text": "A medium one is about one kilo, so it's good for two or three. Most people order some fried buns for the sauce.", "zh": "中份大概一公斤，两三个人吃刚好。大部分人会点些炸馒头蘸酱。", "sp": "B"}], [{"id": "s0_7_0", "md": "**Okay, one medium crab and four fried buns. Could we also get a vegetable dish that isn't too oily?**", "text": "Okay, one medium crab and four fried buns. Could we also get a vegetable dish that isn't too oily?", "zh": "好，一只中份蟹，四个炸馒头。再来个不太油的蔬菜？", "sp": "A"}], [{"id": "s0_8_0", "md": "I'd suggest the kailan with garlic. It's light and fresh.", "text": "I'd suggest the kailan with garlic. It's light and fresh.", "zh": "推荐蒜蓉芥兰，清淡爽口。", "sp": "B"}], [{"id": "s0_9_0", "md": "Sounds good. And for our son, do you have something plain? Nothing spicy.", "text": "Sounds good. And for our son, do you have something plain? Nothing spicy.", "zh": "好的。给我儿子有没有清淡点的？不要辣。", "sp": "A"}], [{"id": "s0_10_0", "md": "Our egg fried rice isn't spicy at all, and we can do a ==half portion== for him.", "text": "Our egg fried rice isn't spicy at all, and we can do a half portion for him.", "zh": "我们的蛋炒饭一点都不辣，可以给他做半份。", "sp": "B"}]]}, {"heading": "2. Changing the Order", "heading_zh": "2. 改单", "rows": [[{"id": "s1_0_0", "md": "Excuse me, sorry. I just noticed the crab is ==market price==. How much would a medium one be?", "text": "Excuse me, sorry. I just noticed the crab is market price. How much would a medium one be?", "zh": "不好意思，打扰一下。我刚看到螃蟹是时价，中份的大概多少钱？", "sp": "A"}], [{"id": "s1_1_0", "md": "Today it's ninety-eight dollars a kilo, so roughly one hundred dollars.", "text": "Today it's ninety-eight dollars a kilo, so roughly one hundred dollars.", "zh": "今天是一公斤九十八块，所以大概一百块左右。", "sp": "B"}], [{"id": "s1_2_0", "md": "**Hmm, that's more than I expected. Is it too late to change to a smaller one?**", "text": "Hmm, that's more than I expected. Is it too late to change to a smaller one?", "zh": "嗯，比我想的贵。现在换成小一点的还来得及吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "The kitchen hasn't started yet, so no problem. A small one is around seventy.", "text": "The kitchen hasn't started yet, so no problem. A small one is around seventy.", "zh": "厨房还没开始做，没问题。小的大概七十块。", "sp": "B"}], [{"id": "s1_4_0", "md": "Let's go with the small one, then, and __add two more__ fried buns.", "text": "Let's go with the small one, then, and add two more fried buns.", "zh": "那就要小的吧，再加两个炸馒头。", "sp": "A"}], [{"id": "s1_5_0", "md": "Sure. Anything to drink?", "text": "Sure. Anything to drink?", "zh": "好的。要喝点什么吗？", "sp": "B"}], [{"id": "s1_6_0", "md": "Two lime juices, ==less sweet==, and a warm water for our son. Could we also have some ==wet wipes==? Crab gets ==messy==.", "text": "Two lime juices, less sweet, and a warm water for our son. Could we also have some wet wipes? Crab gets messy.", "zh": "两杯青柠汁，少甜，给我儿子一杯温水。能再给些湿纸巾吗？吃螃蟹会弄得很脏。", "sp": "A"}], [{"id": "s1_7_0", "md": "Of course. Just so you know, the wet wipes are fifty cents each.", "text": "Of course. Just so you know, the wet wipes are fifty cents each.", "zh": "当然。提醒一下，湿纸巾是五毛钱一包。", "sp": "B"}], [{"id": "s1_8_0", "md": "**That's fine. Could const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
