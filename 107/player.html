const D = {"id": "107", "type": "dialogue", "title": "Ordering at a Restaurant", "meta": "B2 · 约 310 词 · 场景：海鲜餐厅点餐与改单", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Server", "name_zh": "服务员", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "服务员推荐了什么？「你」对辣度和分量问了什么？", "a": "推荐招牌辣椒蟹和麦片虾；「你」问有多辣，要了微辣，又问中份够不够两大一小吃。"}, {"q": "「你」为什么改单？改成了什么？", "a": "螃蟹是时价，中份大概一百块，比预期贵；厨房还没开做，就改成了七十块左右的小份，并多加两个炸馒头。"}, {"q": "关于孩子，「你」提了哪些要求？", "a": "要不辣的半份蛋炒饭、一杯温水，并请厨房先上炒饭。"}], "dictation": [{"id": "s0_1_0", "text": "I think we're ready. It's our first time here. What would you recommend?"}, {"id": "s0_7_0", "text": "Okay, one medium crab and four fried buns. Could we also get a vegetable dish that isn't too oily?"}, {"id": "s1_2_0", "text": "Hmm, that's more than I expected. Is it too late to change to a smaller one?"}, {"id": "s1_8_0", "text": "That's fine. Could you bring the rice out first? He gets hungry quickly."}], "shadow": {"speaker": "A", "text": "Excuse me, sorry. I just noticed the crab is market price. How much would a medium one be?", "marked": "Excuse me, / <b>sorry</b>. //<br>I just <b>noticed</b> / the crab is <b>market price</b>. //<br>How much / would a <b>medium</b> one be? //"}, "prompts": [{"q": "你对虾过敏，朋友带你去一家东南亚餐厅。点菜前跟服务员说明情况，问哪些菜可以吃、能不能单独做。", "ref": "Before we order, I should mention that I'm allergic to prawns, and it's quite serious. Could you tell me which dishes are safe for me? I know a lot of sauces here use dried shrimp or shrimp paste. If the curry has it, could the kitchen make a separate portion without it? Thanks, I really appreciate it.", "ref_zh": "点菜之前我得说一下，我对虾过敏，而且挺严重的。能告诉我哪些菜我可以吃吗？我知道这里很多酱料会用虾米或虾酱。如果咖喱里有，厨房能单独给我做一份不放的吗？谢谢，非常感谢。", "id": "ref0"}, {"q": "菜上齐了，你发现分量太多吃不完，想问能不能打包，顺便再加一份甜品给孩子。", "ref": "Excuse me, everything was delicious, but we ordered way too much. Could we take the rest of the crab and the rice away? Separate boxes would be great. And could we get one mango pudding for our son? Just one spoon is fine, and could you bring it out after you clear the table?", "ref_zh": "不好意思，菜都很好吃，但我们点太多了。剩下的螃蟹和炒饭能打包吗？分开装最好。再给我儿子来一份芒果布丁？一个勺子就行，收完桌子再上吧。", "id": "ref1"}], "words": [{"w": "signature dish", "ipa": "/ˈsɪɡnətʃər dɪʃ/", "zh": "招牌菜", "ex": "The roast duck is their signature dish.", "id": "w0"}, {"w": "spicy", "ipa": "/ˈspaɪsi/", "zh": "辣的", "ex": "Is the laksa very spicy?", "id": "w1"}, {"w": "mild", "ipa": "/maɪld/", "zh": "微辣的；温和的", "ex": "Could I have the curry mild, please?", "id": "w2"}, {"w": "half portion", "ipa": "/hæf ˈpɔːrʃən/", "zh": "半份", "ex": "Can I order a half portion for my daughter?", "id": "w3"}, {"w": "oily", "ipa": "/ˈɔɪli/", "zh": "油腻的", "ex": "The noodles were a bit too oily for me.", "id": "w4"}, {"w": "market price", "ipa": "/ˈmɑːrkɪt praɪs/", "zh": "时价", "ex": "The lobster is sold at market price.", "id": "w5"}, {"w": "less sweet", "ipa": "/les swiːt/", "zh": "少甜", "ex": "One iced tea, less sweet, please.", "id": "w6"}, {"w": "wet wipes", "ipa": "/wet waɪps/", "zh": "湿纸巾", "ex": "Always keep some wet wipes in the diaper bag.", "id": "w7"}, {"w": "messy", "ipa": "/ˈmesi/", "zh": "弄得脏乱的", "ex": "Eating crab with your hands is fun but messy.", "id": "w8"}], "sections": [{"heading": "1. Asking for Recommendations", "heading_zh": "1. 问推荐", "rows": [[{"id": "s0_0_0", "md": "Hi, are you ready to order, or do you need a few more minutes?", "text": "Hi, are you ready to order, or do you need a few more minutes?", "zh": "您好，可以点菜了吗？还是再看几分钟？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I think we're ready. It's our first time here. What would you recommend?**", "text": "I think we're ready. It's our first time here. What would you recommend?", "zh": "应该可以了。我们第一次来，你推荐什么？", "sp": "A"}], [{"id": "s0_2_0", "md": "Our ==signature== dish is the chilli crab, and the cereal prawns are very popular too.", "text": "Our signature dish is the chilli crab, and the cereal prawns are very popular too.", "zh": "我们的招牌菜是辣椒蟹，麦片虾也很受欢迎。", "sp": "B"}], [{"id": "s0_3_0", "md": "Chilli crab sounds great. How ==spicy== is it, though? My wife can't take much heat.", "text": "Chilli crab sounds great. How spicy is it, though? My wife can't take much heat.", "zh": "辣椒蟹听起来不错。不过有多辣？我太太不太能吃辣。", "sp": "A"}], [{"id": "s0_4_0", "md": "It's more sweet than spicy, but we can make it ==mild== if you like.", "text": "It's more sweet than spicy, but we can make it mild if you like.", "zh": "其实偏甜不算辣，您要的话我们可以做微辣。", "sp": "B"}], [{"id": "s0_5_0", "md": "Mild would be perfect. And how big is a medium crab? __Is it enough for__ two adults and a child?", "text": "Mild would be perfect. And how big is a medium crab? Is it enough for two adults and a child?", "zh": "微辣正好。中份的蟹有多大？够两个大人一个小孩吃吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "A medium one is about one kilo, so it's good for two or three. Most people __order some fried buns__ for the sauce.", "text": "A medium one is about one kilo, so it's good for two or three. Most people order some fried buns for the sauce.", "zh": "中份大概一公斤，两三个人吃刚好。大部分人会点些炸馒头蘸酱。", "sp": "B"}], [{"id": "s0_7_0", "md": "**Okay, one medium crab and four fried buns. Could we also get a vegetable dish that isn't too oily?**", "text": "Okay, one medium crab and four fried buns. Could we also get a vegetable dish that isn't too oily?", "zh": "好，一只中份蟹，四个炸馒头。再来个不太油的蔬菜？", "sp": "A"}], [{"id": "s0_8_0", "md": "I'd suggest the kailan with garlic. It's light and fresh.", "text": "I'd suggest the kailan with garlic. It's light and fresh.", "zh": "推荐蒜蓉芥兰，清淡爽口。", "sp": "B"}], [{"id": "s0_9_0", "md": "Sounds good. And for our son, do you have something plain? Nothing spicy.", "text": "Sounds good. And for our son, do you have something plain? Nothing spicy.", "zh": "好的。给我儿子有没有清淡点的？不要辣。", "sp": "A"}], [{"id": "s0_10_0", "md": "Our egg fried rice isn't spicy at all, and we can do a ==half portion== for him.", "text": "Our egg fried rice isn't spicy at all, and we can do a half portion for him.", "zh": "我们的蛋炒饭一点都不辣，可以给他做半份。", "sp": "B"}]]}, {"heading": "2. Changing the Order", "heading_zh": "2. 改单", "rows": [[{"id": "s1_0_0", "md": "Excuse me, sorry. I just noticed the crab is ==market price==. How much would a medium one be?", "text": "Excuse me, sorry. I just noticed the crab is market price. How much would a medium one be?", "zh": "不好意思，打扰一下。我刚看到螃蟹是时价，中份的大概多少钱？", "sp": "A"}], [{"id": "s1_1_0", "md": "Today it's ninety-eight dollars a kilo, so roughly one hundred dollars.", "text": "Today it's ninety-eight dollars a kilo, so roughly one hundred dollars.", "zh": "今天是一公斤九十八块，所以大概一百块左右。", "sp": "B"}], [{"id": "s1_2_0", "md": "**Hmm, that's more than I expected. Is it too late to change to a smaller one?**", "text": "Hmm, that's more than I expected. Is it too late to change to a smaller one?", "zh": "嗯，比我想的贵。现在换成小一点的还来得及吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "The kitchen hasn't started yet, so no problem. A small one is around seventy.", "text": "The kitchen hasn't started yet, so no problem. A small one is around seventy.", "zh": "厨房还没开始做，没问题。小的大概七十块。", "sp": "B"}], [{"id": "s1_4_0", "md": "Let's go with the small one, then, and __add two more__ fried buns.", "text": "Let's go with the small one, then, and add two more fried buns.", "zh": "那就要小的吧，再加两个炸馒头。", "sp": "A"}], [{"id": "s1_5_0", "md": "Sure. Anything to drink?", "text": "Sure. Anything to drink?", "zh": "好的。要喝点什么吗？", "sp": "B"}], [{"id": "s1_6_0", "md": "Two lime juices, ==less sweet==, and a warm water for our son. Could we also have some ==wet wipes==? Crab gets ==messy==.", "text": "Two lime juices, less sweet, and a warm water for our son. Could we also have some wet wipes? Crab gets messy.", "zh": "两杯青柠汁，少甜，给我儿子一杯温水。能再给些湿纸巾吗？吃螃蟹会弄得很脏。", "sp": "A"}], [{"id": "s1_7_0", "md": "Of course. Just so you know, the wet wipes are fifty cents each.", "text": "Of course. Just so you know, the wet wipes are fifty cents each.", "zh": "当然。提醒一下，湿纸巾是五毛钱一包。", "sp": "B"}], [{"id": "s1_8_0", "md": "**That's fine. Could const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
