 loves splashing around, but he won't put his face in the water.", "text": "Complete beginner. He loves splashing around, but he won't put his face in the water.", "zh": "完全零基础。他喜欢在水里扑腾，但不肯把脸放进水里。", "sp": "A"}], [{"id": "s0_3_0", "md": "That's really common. He'd start in our Starfish level. It's all about ==water confidence==.", "text": "That's really common. He'd start in our Starfish level. It's all about water confidence.", "zh": "这很常见。他会从我们的海星级开始，重点是让孩子不怕水。", "sp": "B"}], [{"id": "s0_4_0", "md": "**How many kids are in each class, and how long are the lessons?**", "text": "How many kids are in each class, and how long are the lessons?", "zh": "每个班有几个孩子？每节课多长时间？", "sp": "A"}], [{"id": "s0_5_0", "md": "Four kids per coach at most, and thirty minutes each. We run weekday afternoons and Saturday mornings.", "text": "Four kids per coach at most, and thirty minutes each. We run weekday afternoons and Saturday mornings.", "zh": "一个教练最多带四个孩子，每节三十分钟。工作日下午和周六上午都有课。", "sp": "B"}], [{"id": "s0_6_0", "md": "Saturday mornings would suit us best. Do parents need to get in the pool?", "text": "Saturday mornings would suit us best. Do parents need to get in the pool?", "zh": "周六上午最适合我们。家长需要下水吗？", "sp": "A"}], [{"id": "s0_7_0", "md": "Not at his level. You can watch from the ==viewing gallery== upstairs.", "text": "Not at his level. You can watch from the viewing gallery upstairs.", "zh": "他这个级别不用。您可以在楼上的观看区看。", "sp": "B"}], [{"id": "s0_8_0", "md": "And is there a trial lesson __before we commit to__ a full term?", "text": "And is there a trial lesson before we commit to a full term?", "zh": "在报整期之前，有试听课吗？", "sp": "A"}], [{"id": "s0_9_0", "md": "Yes. A trial is twenty-five dollars, and it's ==deducted== from the term fee if you sign up.", "text": "Yes. A trial is twenty-five dollars, and it's deducted from the term fee if you sign up.", "zh": "有。试课二十五块，如果报名，会从学期费里扣掉。", "sp": "B"}]]}, {"heading": "2. After the Trial", "heading_zh": "2. 试课之后", "rows": [[{"id": "s1_0_0", "md": "Hi, it's Coach Ben from the swim school. How did your son find the trial on Saturday?", "text": "Hi, it's Coach Ben from the swim school. How did your son find the trial on Saturday?", "zh": "您好，我是游泳学校的 Ben 教练。您儿子觉得周六的试课怎么样？", "sp": "B"}], [{"id": "s1_1_0", "md": "Honestly, he was a bit scared. He cried for the first ten minutes, but he was smiling by the end.", "text": "Honestly, he was a bit scared. He cried for the first ten minutes, but he was smiling by the end.", "zh": "说实话，他有点害怕。前十分钟一直哭，不过到最后笑了。", "sp": "A"}], [{"id": "s1_2_0", "md": "That's a good sign. Most kids need two or three lessons to ==warm up==.", "text": "That's a good sign. Most kids need two or three lessons to warm up.", "zh": "这是好兆头。大部分孩子需要两三节课才能放开。", "sp": "B"}], [{"id": "s1_3_0", "md": "**Good to know. We'd like to go ahead with the Saturday class. Is there still a spot at nine?**", "text": "Good to know. We'd like to go ahead with the Saturday class. Is there still a spot at nine?", "zh": "那就好。我们想报周六的班。九点那节还有位置吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Nine is full, I'm afraid. We have ten thirty, or I can put you on the ==waitlist== for nine.", "text": "Nine is full, I'm afraid. We have ten thirty, or I can put you on the waitlist for nine.", "zh": "恐怕九点满了。十点半有，或者我把您排进九点的候补名单。", "sp": "B"}], [{"id": "s1_5_0", "md": "Let's take ten thirty for now, but please __keep us on__ the list for nine.", "text": "Let's take ten thirty for now, but please keep us on the list for nine.", "zh": "那先报十点半，不过请把我们留在九点的候补名单上。", "sp": "A"}], [{"id": "s1_6_0", "md": "Will do. The term is ten lessons, and it's three hundred and twenty dollars after the trial is deducted.", "text": "Will do. The term is ten lessons, and it's three hundred and twenty dollars after the trial is deducted.", "zh": "好的。一期十节课，扣掉试课费后是三百二十块。", "sp": "B"}], [{"id": "s1_7_0", "md": "What happens if he's sick and misses a class? Can he make it up?", "text": "What happens if he's sick and misses a class? Can he make it up?", "zh": "如果他生病缺了一节课怎么办？ "end": 103.224, "words": [[98.546, 98.783], [98.783, 98.967], [98.967, 99.243], [99.243, 99.52], [99.52, 99.928], [99.928, 100.23], [100.23, 100.349], [100.349, 100.822], [101.125, 101.296], [101.296, 101.559], [101.559, 101.664], [101.664, 101.757], [101.757, 101.98], [101.98, 102.099], [102.099, 102.138], [102.138, 102.375], [102.375, 102.849]]}, {"kind": "s", "id": "s1_9_0", "md": "**Fair enough. I'll pay online tonight. Thanks for checking in.**", "zh": "挺合理的。我今晚在网上付款。谢谢你打电话来问。", "sp": "A", "gap": false, "start": 103.224, "end": 107.064, "words": [[103.369, 103.514], [103.527, 103.856], [104.29, 104.408], [104.421, 104.619], [104.632, 104.934], [104.948, 105.369], [105.816, 105.974], [105.987, 106.092], [106.106, 106.461], [106.474, 106.658]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
