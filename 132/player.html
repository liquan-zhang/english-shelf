<script>
const D = {"id": "132", "type": "dialogue", "title": "Choosing a Phone Plan", "meta": "B2 · 约 330 词 · 场景：电信店选套餐与携号转网", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Sales Staff", "name_zh": "店员", "voice": "en-SG-WayneNeural"}}, "gist": [{"q": "「你」最后选了什么套餐？为什么？", "a": "纯 SIM 卡、无合约的套餐，一百 G 流量，含马来西亚漫游；因为流量用得多、不想被合约绑住、常去新山。"}, {"q": "第二天新卡为什么用不了？", "a": "原运营商那边转网还没完成，可能因为还有一笔未付的最后账单，号码被锁住了。"}, {"q": "店员给出了哪些解决办法？", "a": "让「你」先结清原运营商的欠款，他再手动推进转网，一小时内可用；同时免费给一张带临时号码的预付卡。"}], "dictation": [{"id": "s0_3_0", "text": "Yes, I'd like to keep my number. How long does the transfer usually take?"}, {"id": "s0_7_0", "text": "Is that on a contract, or can I cancel anytime?"}, {"id": "s1_4_0", "text": "Possibly the final bill. Could you tell me exactly what I need to do to get this sorted today?"}, {"id": "s1_6_0", "text": "OK. In the meantime, could you give me a temporary number so I'm reachable?"}], "shadow": {"speaker": "A", "text": "Hi, I signed up here yesterday, but my new SIM still isn't working. I have no signal at all.", "marked": "Hi, / I signed up here <b>yesterday</b>, / but my new <b>SIM</b> / <b>still</b> isn't working. //<br>I have <b>no signal</b> / at <b>all</b>. //"}, "prompts": [{"q": "月底账单里多了一笔你没想到的漫游费。打给客服，说明情况，请对方解释并争取减免。", "ref": "Hi, I'm calling about my latest bill. There's a roaming charge of about forty dollars, but I thought my plan included roaming in Malaysia. I was only in Johor Bahru for the weekend. Could you check what the charge is for? If it's a mistake, I'd like it removed. And if I went over the limit, could you waive it this one time?", "ref_zh": "你好，我打来是想问一下最近这期账单。里面有一笔大概四十块的漫游费，但我以为我的套餐包含马来西亚漫游。我只是周末去了一趟新山。能帮我查一下这笔费用是什么吗？如果是弄错了，希望能撤掉。如果是我超出了额度，这次能不能帮我免掉？", "id": "ref0"}, {"q": "你签了十二个月合约，但现在想提前解约换套餐。去门店问清楚违约金和最划算的做法。", "ref": "Hi, I'm on a twelve-month contract, and I still have about five months left. I'd like to switch to a cheaper plan, because I'm using much less data now. Is there an early termination fee? If so, how much is it? Or is there a way to downgrade within the same contract without paying a penalty?", "ref_zh": "你好，我签的是十二个月的合约，现在还剩五个月左右。我想换一个便宜点的套餐，因为我现在流量用得少多了。提前解约有违约金吗？有的话是多少？或者有没有办法在同一个合约里降档，不用付违约金？", "id": "ref1"}], "words": [{"w": "switch (v.)", "ipa": "/swɪtʃ/", "zh": "换成；转换", "ex": "We switched to a cheaper electricity provider last month.", "tts_w": "switch", "id": "w0"}, {"w": "port (v.)", "ipa": "/pɔːrt/", "zh": "携号转网", "ex": "Can I port my number from my old provider?", "tts_w": "port", "id": "w1"}, {"w": "contract", "ipa": "/ˈkɑːntrækt/", "zh": "合约", "ex": "I don't want to be locked into a two-year contract.", "id": "w2"}, {"w": "roaming", "ipa": "/ˈroʊmɪŋ/", "zh": "漫游", "ex": "Turn off data roaming before you land in Bangkok.", "id": "w3"}, {"w": "pending", "ipa": "/ˈpendɪŋ/", "zh": "待处理的", "ex": "My refund is still pending after a week.", "id": "w4"}, {"w": "hold (n.)", "ipa": "/hoʊld/", "zh": "冻结；锁定", "ex": "The bank put a hold on my card after a strange payment.", "tts_w": "hold", "id": "w5"}, {"w": "temporary", "ipa": "/ˈtempəreri/", "zh": "临时的", "ex": "We're staying in a temporary apartment until our flat is ready.", "id": "w6"}, {"w": "hotspot", "ipa": "/ˈhɑːtspɑːt/", "zh": "热点（手机共享网络）", "ex": "Can you turn on your hotspot so I can check my email?", "id": "w7"}, {"w": "push through", "ipa": "/pʊʃ θruː/", "zh": "推进办成", "ex": "The agent pushed my application through in two days.", "id": "w8"}, {"w": "sort out", "ipa": "/sɔːrt aʊt/", "zh": "解决；处理好", "ex": "Let me sort out the parking before the guests arrive.", "id": "w9"}], "sections": [{"heading": "1. At the Telco Shop", "heading_zh": "1. 在电信门店", "rows": [[{"id": "s0_0_0", "md": "Hi there, how can I help you today?", "text": "Hi there, how can I help you today?", "zh": "您好，今天有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, I'm __looking for__ a new mobile plan. I'd like to ==switch== from my current provider.", "text": "Hi, I'm looking for a new mobile plan. I'd like to switch from my current provider.", "zh": "你好，我想办个新的手机套餐，打算从现在的运营商转过来。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. Do you want to __keep your number__? We can ==port== it over for free.", "text": "Sure. Do you want to keep your number? We can port it over for free.", "zh": "好的。您想保留原号码吗？我们可以免费帮您携号转网。", "sp": "B"}], [{"id": "s0_3_0", "md": "**Yes, I'd like to keep my number. How long does the transfer usually take?**", "text": "Yes, I'd like to keep my number. How long does the transfer usually take?", "zh": "对，我想保留号码。转网一般要多久？", "sp": "A"}], [{"id": "s0_4_0", "md": "Usually within one working day. How much data do you use in a month?", "text": "Usually within one working day. How much data do you use in a month?", "zh": "一般一个工作日内。您每个月大概用多少流量？", "sp": "B"}], [{"id": "s0_5_0", "md": "Quite a lot. I often use my phone as a hotspot, so maybe sixty to eighty gigabytes.", "text": "Quite a lot. I often use my phone as a hotspot, so maybe sixty to eighty gigabytes.", "zh": "挺多的。我经常拿手机开热点，大概六十到八十个 G。", "sp": "A"}], [{"id": "s0_6_0", "md": "Then I'd suggest our SIM-only plan. It's thirty dollars a month for one hundred gigabytes.", "text": "Then I'd suggest our SIM-only plan. It's thirty dollars a month for one hundred gigabytes.", "zh": "那我推荐我们的纯 SIM 卡套餐，每月三十块，一百个 G。", "sp": "B"}], [{"id": "s0_7_0", "md": "Is that on a ==contract==, or can I cancel anytime?", "text": "Is that on a contract, or can I cancel anytime?", "zh": "这个要签合约吗？还是随时可以取消？", "sp": "A"}], [{"id": "s0_8_0", "md": "There's a twelve-month contract, or a no-contract version for five dollars more.", "text": "There's a twelve-month contract, or a no-contract version for five dollars more.", "zh": "有十二个月合约的，也有无合约的，每月贵五块。", "sp": "B"}], [{"id": "s0_9_0", "md": "I'd rather go with no contract. Does it include ==roaming== in Malaysia? I drive up to Johor Bahru sometimes.", "text": "I'd rather go with no contract. Does it include roaming in Malaysia? I drive up to Johor Bahru sometimes.", "zh": "我宁愿选无合约的。包含马来西亚漫游吗？我有时候开车去新山。", "sp": "A"}], [{"id": "s0_10_0", "md": "Yes, you get five gigabytes of roaming data in Malaysia and Indonesia every month.", "text": "Yes, you get five gigabytes of roaming data in Malaysia and Indonesia every month.", "zh": "包含，每个月在马来西亚和印尼有五个 G 的漫游流量。", "sp": "B"}], [{"id": "s0_11_0", "md": "Great, let's go with that one. What do you need from me?", "text": "Great, let's go with that one. What do you need from me?", "zh": "太好了，就办这个吧。需要我提供什么？", "sp": "A"}], [{"id": "s0_12_0", "md": "Just your passport or employment pass, and I'll __sign you up__ right now.", "text": "Just your passport or employment pass, and I'll sign you up right now.", "zh": "护照或者工作准证就行，我现在就帮您办。", "sp": "B"}]]}, {"heading": "2. Back at the Shop", "heading_zh": "2. 回到门店", "rows": [[{"id": "s1_0_0", "md": "Hi, I signed up here yesterday, but my new SIM __still isn't working__. I have no signal at all.", "text": "Hi, I signed up here yesterday, but my new SIM still isn't working. I have no signal at all.", "zh": "你好，我昨天在这里办的卡，但新 SIM 卡还是用不了，一点信号都没有。", "sp": "A"}], [{"id": "s1_1_0", "md": "Sorry about that. Let me check. Ah, the transfer from your old provider is still ==pending==.", "text": "Sorry about that. Let me check. Ah, the transfer from your old provider is still pending.", "zh": "不好意思，我查一下。啊，您原运营商那边的转网还在处理中。", "sp": "B"}], [{"id": "s1_2_0", "md": "Is there anything I can do? I'm waiting for an important call from my son's school.", "text": "Is there anything I can do? I'm waiting for an important call from my son's school.", "zh": "我能做点什么吗？我在等儿子学校打来的一个重要电话。", "sp": "A"}], [{"id": "s1_3_0", "md": "Your old provider may have a ==hold== on the number. Do you have any unpaid bills with them?", "text": "Your old provider may have a hold on the number. Do you have any unpaid bills with them?", "zh": "可能是原运营商把号码锁住了。您在他们那边还有没交的账单吗？", "sp": "B"}], [{"id": "s1_4_0", "md": "**Possibly the final bill. Could you tell me exactly what I need to do t const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
