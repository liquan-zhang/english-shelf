<script>
const D = {"id": "132", "type": "dialogue", "title": "Choosing a Phone Plan", "meta": "B2 · 约 330 词 · 场景：电信店选套餐与携号转网", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Sales Staff", "name_zh": "店员", "voice": "en-SG-WayneNeural"}}, "gist": [{"q": "「你」最后选了什么套餐？为什么？", "a": "纯 SIM 卡、无合约的套餐，一百 G 流量，含马来西亚漫游；因为流量用得多、不想被合约绑住、常去新山。"}, {"q": "第二天新卡为什么用不了？", "a": "原运营商那边转网还没完成，可能因为还有一笔未付的最后账单，号码被锁住了。"}, {"q": "店员给出了哪些解决办法？", "a": "让「你」先结清原运营商的欠款，他再手动推进转网，一小时内可用；同时免费给一张带临时号码的预付卡。"}], "dictation": [{"id": "s0_3_0", "text": "Yes, I'd like to keep my number. How long does the transfer usually take?"}, {"id": "s0_7_0", "text": "Is that on a contract, or can I cancel anytime?"}, {"id": "s1_4_0", "text": "Possibly the final bill. Could you tell me exactly what I need to do to get this sorted today?"}, {"id": "s1_6_0", "text": "OK. In the meantime, could you give me a temporary number so I'm reachable?"}], "shadow": {"speaker": "A", "text": "Hi, I signed up here yesterday, but my new SIM still isn't working. I have no signal at all.", "marked": "Hi, / I signed up here <b>yesterday</b>, / but my new <b>SIM</b> / <b>still</b> isn't working. //<br>I have <b>no signal</b> / at <b>all</b>. //"}, "prompts": [{"q": "月底账单里多了一笔你没想到的漫游费。打给客服，说明情况，请对方解释并争取减免。", "ref": "Hi, I'm calling about my latest bill. There's a roaming charge of about forty dollars, but I thought my plan included roaming in Malaysia. I was only in Johor Bahru for the weekend. Could you check what the charge is for? If it's a mistake, I'd like it removed. And if I went over the limit, could you waive it this one time?", "ref_zh": "你好，我打来是想问一下最近这期账单。里面有一笔大概四十块的漫游费，但我以为我的套餐包含马来西亚漫游。我只是周末去了一趟新山。能帮我查一下这笔费用是什么吗？如果是弄错了，希望能撤掉。如果是我超出了额度，这次能不能帮我免掉？", "id": "ref0"}, {"q": "你签了十二个月合约，但现在想提前解约换套餐。去门店问清楚违约金和最划算的做法。", "ref": "Hi, I'm on a twelve-month contract, and I still have about five months left. I'd like to switch to a cheaper plan, because I'm using much less data now. Is there an early termination fee? If so, how much is it? Or is there a way to downgrade within the same contract without paying a penalty?", "ref_zh": "你好，我签的是十二个月的合约，现在还剩五个月左右。我想换一个便宜点的套餐，因为我现在流量用得少多了。提前解约有违约金吗？有的话是多少？或者有没有办法在同一个合约里降档，不用付违约金？", "id": "ref1"}], "words": [{"w": "switch (v.)", "ipa": "/swɪtʃ/", "zh": "换成；转换", "ex": "We switched to a cheaper electricity provider last month.", "tts_w": "switch", "id": "w0"}, {"w": "port (v.)", "ipa": "/pɔːrt/", "zh": "携号转网", "ex": "Can I port my number from my old provider?", "tts_w": "port", "id": "w1"}, {"w": "contract", "ipa": "/ˈkɑːntrækt/", "zh": "合约", "ex": "I don't want to be locked into a two-year contract.", "id": "w2"}, {"w": "roaming", "ipa": "/ˈroʊmɪŋ/", "zh": "漫游", "ex": "Turn off data roaming before you land in Bangkok.", "id": "w3"}, {"w": "pending", "ipa": "/ˈpendɪŋ/", "zh": "待处理的", "ex": "My refund is still pending after a week.", "id": "w4"}, {"w": "hold (n.)", "ipa": "/hoʊld/", "zh": "冻结；锁定", "ex": "The bank put a hold on my card after a strange payment.", "tts_w": "hold", "id": "w5"}, {"w": "temporary", "ipa": "/ˈtempəreri/", "zh": "临时的", "ex": "We're staying in a temporary apartment until our flat is ready.", "id": "w6"}, {"w": "hotspot", "ipa": "/ˈhɑːtspɑːt/", "zh": "热点（手机共享网络）", "ex": "Can you turn on your hotspot so I can check my email?", "id": "w7"}, {"w": "push through", "ipa": "/pʊʃ θruː/", "zh": "推进办成", "ex": "The agent pushed my application through in two days.", "id": "w8"}, {"w": "sort out", "ipa": "/sɔːrt aʊt/", "zh": "解决；处理好", "ex": "Let me sort out the parking before the guests arrive.", "id": "w9"}], "sections": [{"heading": "1. At the Telco Shop", "heading_zh": "1. 在电信门店", "rows": [[{"id": "s0_0_0", "md": "Hi there, how can I help you today?", "text": "Hi there, how can I help you today?", "zh": "您好，今天有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, I'm __looking for__ a new mobile plan. I'd like to ==switch== from my current provider.", "text": "Hi, I'm looking for a new mobile plan. I'd like to switch from my current provider.", "zh": "你好，我想办个新的手机套餐，打算从现在的运营商转过来。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. Do you want to __keep your number__? We can ==port== it over for free.", "text": "Sure. Do you want to keep your number? We can port it over for free.", "zh": "好的。您想保留原号码吗？我们可以免费帮您携号转网。", "sp": "B"}], [{"id": "s0_3_0", "md": "**Yes, I'd like to keep my number. How long does the transfer usually take?**", "text": "Yes, I'd like to keep my number. How long does the transfer usually take?", "zh": "对，我想保留号码。转网一般要多久？", "sp": "A"}], [{"id": "s0_4_0", "md": "Usually within one working day. How much data do you use in a month?", "text": "Usually within one working day. How much data do you use in a month?", "zh": "一般一个工作日内。您每个月大概用多少流量？", "sp": "B"}], [{"id": "s0_5_0", "md": "Quite a lot. I often use my phone as a hotspot, so maybe sixty to eighty gigabytes.", "text": "Quite a lot. I often use my phone as a hotspot, so maybe sixty to eighty gigabytes.", "zh": "挺多的。我经常拿手机开热点，大概六十到八十个 G。", "sp": "A"}], [{"id": "s0_6_0", "md": "Then I'd suggest our SIM-only plan. It's thirty dollars a month for one hundred gigabytes.", "text": "Then I'd suggest our SIM-only plan. It's thirty dollars a month for one hundred gigabytes.", "zh": "那我推荐我们的纯 SIM 卡套餐，每月三十块，一百个 G。", "sp": "B"}], [{"id": "s0_7_0", "md": "Is that on a ==contract==, or can I cancel anytime?", "text": "Is that on a contract, or can I cancel anytime?", "zh": "这个要签合约吗？还是随时可以取消？", "sp": "A"}], [{"id": "s0_8_0", "md": "There's a twelve-month contract, or a no-contract version for five dollars more.", "text": "There's a twelve-month contract, or a no-contract version for five dollars more.", "zh": "有十二个月合约的，也有无合约的，每月贵五块。", "sp": "B"}], [{"id": "s0_9_0", "md": "I'd rather go with no contract. Does it include ==roaming== in Malaysia? I drive up to Johor Bahru sometimes.", "text": "I'd rather go with no contract. Does it include roaming in Malaysia? I drive up to Johor Bahru sometimes.", "zh": "我宁愿选无合约的。包含马来西亚漫游吗？我有时候开车去新山。", "sp": "A"}], [{"id": "s0_10_0", "md": "Yes, you get five gigabytes of roaming data in Malaysia and Indonesia every month.", "text": "Yes, you get five gigabytes of roaming data in Malaysia and Indonesia every month.", "zh": "包含，每个月在马来西亚和印尼有五个 G 的漫游流量。", "sp": "B"}], [{"id": "s0_11_0", "md": "Great, let's go with that one. What do you need from me?", "text": "Great, let's go with that one. What do you need from me?", "zh": "太好了，就办这个吧。需要我提供什么？", "sp": "A"}], [{"id": "s0_12_0", "md": "Just your passport or employment pass, and I'll __sign you up__ right now.", "text": "Just your passport or employment pass, and I'll sign you up right now.", "zh": "护照或者工作准证就行，我现在就帮您办。", "sp": "B"}]]}, {"heading": "2. Back at the Shop", "heading_zh": "2. 回到门店", "rows": [[{"id": "s1_0_0", "md": "Hi, I signed up here yesterday, but my new SIM __still isn't working__. I have no signal at all.", "text": "Hi, I signed up here yesterday, but my new SIM still isn't working. I have no signal at all.", "zh": "你好，我昨天在这里办的卡，但新 SIM 卡还是用不了，一点信号都没有。", "sp": "A"}], [{"id": "s1_1_0", "md": "Sorry about that. Let me check. Ah, the transfer from your old provider is still ==pending==.", "text": "Sorry about that. Let me check. Ah, the transfer from your old provider is still pending.", "zh": "不好意思，我查一下。啊，您原运营商那边的转网还在处理中。", "sp": "B"}], [{"id": "s1_2_0", "md": "Is there anything I can do? I'm waiting for an important call from my son's school.", "text": "Is there anything I can do? I'm waiting for an important call from my son's school.", "zh": "我能做点什么吗？我在等儿子学校打来的一个重要电话。", "sp": "A"}], [{"id": "s1_3_0", "md": "Your old provider may have a ==hold== on the number. Do you have any unpaid bills with them?", "text": "Your old provider may have a hold on the number. Do you have any unpaid bills with them?", "zh": "可能是原运营商把号码锁住了。您在他们那边还有没交的账单吗？", "sp": "B"}], [{"id": "s1_4_0", "md": "**Possibly the final bill. Could you tell me exactly what I need to do t const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

main.append(step('s1', '① 盲听', '3 分钟', '不看稿，听完整篇（可听两遍），然后试着回答下面的问题，再展开看答案。',
  h('div', {},
    h('audio', { controls: '', src: src('track'), preload: 'none' }),
    ...D.gist.map((g, i) => h('div', { class: 'q' }, h('div', {}, `Q${i + 1}. ${g.q}`),
      h('details', {}, h('summary', {}, '看答案'), h('div', {}, g.a)))))));

// 2 dictation
main.append(step('s2', '② 听写', '4 分钟', '每句可以反复听，听到能完整写出来为止。点「核对」后，<span style="color:var(--bad)">红色</span>是漏听或听错的词。',
  h('div', {}, ...D.dictation.map((d, i) => {
    const ta = h('textarea', { placeholder: '把听到的句子打出来…' });
    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
</html>
