<script>
const D = {"id": "045", "title": "Aligning Two Teams on One Goal", "meta": "B2 · 约 260 词 · 场景：跨团队对齐", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Two Scoreboards, One Product", "heading_zh": "1. 两块记分牌，一个产品", "rows": [[{"id": "s0_0_0", "md": "The growth team wants more pop-ups to drive sign-ups.", "text": "The growth team wants more pop-ups to drive sign-ups.", "zh": "增长团队想多加弹窗来拉注册。", "sp": null}, {"id": "s0_0_1", "md": "The app performance team wants fewer, because every pop-up adds load time.", "text": "The app performance team wants fewer, because every pop-up adds load time.", "zh": "App 性能团队想少加，因为每个弹窗都会拖慢加载时间。", "sp": null}, {"id": "s0_0_2", "md": "Both teams are smart, both have data, and both are measured on different numbers.", "text": "Both teams are smart, both have data, and both are measured on different numbers.", "zh": "两个团队都很聪明，手里都有数据，而且考核的是不同的指标。", "sp": null}], [{"id": "s0_1_0", "md": "This is the usual root of cross-team conflict.", "text": "This is the usual root of cross-team conflict.", "zh": "这就是跨团队冲突最常见的根源。", "sp": null}, {"id": "s0_1_1", "md": "It is rarely about ==personalities==.", "text": "It is rarely about personalities.", "zh": "问题很少出在人的性格上。", "sp": null}, {"id": "s0_1_2", "md": "**When two teams keep different scoreboards, every meeting turns into a negotiation.**", "text": "When two teams keep different scoreboards, every meeting turns into a negotiation.", "zh": "两个团队各看各的记分牌，每次开会就都变成了谈判。", "sp": null}, {"id": "s0_1_3", "md": "Each side ==defends== its own metric, and the user __gets lost in the middle__.", "text": "Each side defends its own metric, and the user gets lost in the middle.", "zh": "每一方都在守自己的指标，用户就在中间被弄丢了。", "sp": null}], [{"id": "s0_2_0", "md": "You cannot fix this with more meetings or a nicer tone.", "text": "You cannot fix this with more meetings or a nicer tone.", "zh": "这事靠多开几次会、语气客气一点是解决不了的。", "sp": null}, {"id": "s0_2_1", "md": "You fix it by changing what both teams are __held accountable for__.", "text": "You fix it by changing what both teams are held accountable for.", "zh": "要解决，就得改变两个团队各自要背的东西。", "sp": null}, {"id": "s0_2_2", "md": "In other words, you need a shared definition of winning that neither team can ==achieve== alone.", "text": "In other words, you need a shared definition of winning that neither team can achieve alone.", "zh": "换句话说，你需要一个双方共同认可的「赢」的定义，而且任何一个团队单靠自己都做不到。", "sp": null}]]}, {"heading": "2. Building the Shared Number", "heading_zh": "2. 建立一个共同的指标", "rows": [[{"id": "s1_0_0", "md": "Get both leads in one room and ask a simple question.", "text": "Get both leads in one room and ask a simple question.", "zh": "把两边的 lead 拉到一个房间里，问一个简单的问题。", "sp": null}, {"id": "s1_0_1", "md": "\"If this project goes perfectly, what changes for the user?\"", "text": "\"If this project goes perfectly, what changes for the user?\"", "zh": "「如果这个项目做得完美，用户那边会有什么变化？」", "sp": null}, {"id": "s1_0_2", "md": "Keep asking until the answer is something both teams would __sign off on__.", "text": "Keep asking until the answer is something both teams would sign off on.", "zh": "一直追问，直到答案是两个团队都愿意签字认可的。", "sp": null}], [{"id": "s1_1_0", "md": "In our example, the answer might be \"more new users who are still active after a week.\"", "text": "In our example, the answer might be \"more new users who are still active after a week.\"", "zh": "拿我们的例子来说，答案可能是「一周后仍然活跃的新用户更多了」。", "sp": null}, {"id": "s1_1_1", "md": "Sign-ups alone can be gamed, and load time alone ignores the business.", "text": "Sign-ups alone can be gamed, and load time alone ignores the business.", "zh": "光看注册量可以刷，光看加载时间又不管业务。", "sp": null}, {"id": "s1_1_2", "md": "Retention ==captures== what both teams actually care about.", "text": "Retention captures what both teams actually care about.", "zh": "留存才真正体现了两个团队都在乎的东西。", "sp": null}], [{"id": "s1_2_0", "md": "Then add a ==guardrail== for each side.", "text": "Then add a guardrail for each side.", "zh": "然后给每一方各加一条护栏。", "sp": null}, {"id": "s1_2_1", "md": "The growth team can try any idea, as long as load time stays under an agreed limit.", "text": "The growth team can try any idea, as long as load time stays under an agreed limit.", "zh": "增长团队想试什么点子都行，只要加载时间不超过约定的上限。", "sp": null}, {"id": "s1_2_2", "md": "**A shared goal plus clear guardrails turns rivals into partners.**", "text": "A shared goal plus clear guardrails turns rivals into partners.", "zh": "共同的目标加上清晰的护栏，能把对手变成搭档。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, review the number together, in the same meeting, from the same dashboard.", "text": "Finally, review the number together, in the same meeting, from the same dashboard.", "zh": "最后，一起看这个指标：同一个会、同一个 dashboard。", "sp": null}, {"id": "s1_3_1", "md": "When both teams look at one chart every week, arguments about whose data is right slowly ==disappear==.", "text": "When both teams look at one chart every week, arguments about whose data is right slowly disappear.", "zh": "当两个团队每周都看同一张图，关于谁的数据对的争论就会慢慢消失。", "sp": null}, {"id": "s1_3_2", "md": "The conversation shifts from \"your team\" to \"our number,\" which is exactly the point.", "text": "The conversation shifts from \"your team\" to \"our number,\" which is exactly the point.", "zh": "对话会从「你们团队」变成「我们的指标」，这恰恰就是目的所在。", "sp": null}]]}], "gist": [{"q": "跨团队冲突通常的根源是什么？", "a": "不是性格问题，而是两个团队用不同的指标（记分牌）考核，每次开会都变成谈判。"}, {"q": "例子中两个团队的共同目标最后是什么？为什么选它？", "a": "一周后仍活跃的新用户数（留存）；单看注册量能被刷，单看加载时间忽略业务，留存同时反映双方关心的东西。"}, {"q": "除了共同目标，还要加什么？", "a": "给每一方设护栏指标，比如增长团队可以随便试，但加载时间必须低于约定上限；并每周用同一个看板一起复盘。"}], "dictation": [{"id": "s0_1_2", "text": "When two teams keep different scoreboards, every meeting turns into a negotiation."}, {"id": "s1_0_1", "text": "\"If this project goes perfectly, what changes for the user?\""}, {"id": "s1_2_2", "text": "A shared goal plus clear guardrails turns rivals into partners."}, {"id": "s1_1_1", "text": "Sign-ups alone can be gamed, and load time alone ignores the business."}], "shadow": {"text": "Then add a guardrail for each side. The growth team can try any idea, as long as load time stays under an agreed limit. A shared goal plus clear guardrails turns rivals into partners.", "marked": "Then add a <b>guardrail</b> / for <b>each</b> side. //<br>The growth team can try <b>any</b> idea, / as long as <b>load time</b> stays under an <b>agreed</b> limit. //<br>A <b>shared</b> goal / plus clear <b>guardrails</b> / turns <b>rivals</b> into <b>partners</b>. //"}, "prompts": [{"q": "推荐算法组想提高点击率，内容安全组想减少违规内容曝光，两边在会上吵起来了。你主持会议，用 30 秒提出一个共同目标加护栏的方案。", "ref": "Can I suggest we step back for a second? I think we're arguing because we're looking at two different numbers. What we both want is users who come back tomorrow because they enjoyed their feed. So let's make next-day return rate the shared goal. Recommendations can test anything they like, as long as the rate of flagged content doesn't go up. Does that work for both teams?", "ref_zh": "我能不能建议大家先退一步？我觉得我们在吵，是因为我们看的是两个不同的数字。我们双方真正想要的，是用户因为喜欢自己的 feed，第二天还会回来。所以我们就把次日回访率作为共同目标吧。推荐团队想试什么都行，只要被举报内容的比例不上升。两个团队觉得这样可以吗？", "id": "ref0"}, {"q": "两个团队每周都在争论谁的数据是对的。用 30 秒提议统一看板和复盘方式。", "ref": "Every week we spend the first twenty minutes debating whose numbers are right, and that's time we never get back. I'd like to propose one dashboard that both teams agree on, built from the same data source. We review it together every Monday, in one meeting. If someone thinks a number is wrong, we fix the dashboard, not the argument.", "ref_zh": "每周我们都要花前二十分钟争论谁的数据是对的，这些时间是再也找不回来的。我想提议做一个两个团队都认可的 dashboard，用同一个数据源。每周一我们一起在一个会上看。如果有人觉得哪个数字不对，我们就去修 dashboard，而不是继续吵。", "id": "ref1"}], "words": [{"w": "personality", "ipa": "/ˌpɜːrsəˈnæləti/", "zh": "性格、个性", "ex": "This isn't a personality clash; their goals are just different.", "id": "w0"}, {"w": "achieve", "ipa": "/əˈtʃiːv/", "zh": "达成、实现", "ex": "We can't achieve the latency target without their help.", "id": "w1"}, {"w": "capture (v.)", "ipa": "/ˈkæptʃər/", "zh": "体现、捕捉", "ex": "Does this metric really captu const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
