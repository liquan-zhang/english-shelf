<script>
const D = {"id": "045", "title": "Aligning Two Teams on One Goal", "meta": "B2 · 约 260 词 · 场景：跨团队对齐", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Two Scoreboards, One Product", "heading_zh": "1. 两块记分牌，一个产品", "rows": [[{"id": "s0_0_0", "md": "The growth team wants more pop-ups to drive sign-ups.", "text": "The growth team wants more pop-ups to drive sign-ups.", "zh": "增长团队想多加弹窗来拉注册。", "sp": null}, {"id": "s0_0_1", "md": "The app performance team wants fewer, because every pop-up adds load time.", "text": "The app performance team wants fewer, because every pop-up adds load time.", "zh": "App 性能团队想少加，因为每个弹窗都会拖慢加载时间。", "sp": null}, {"id": "s0_0_2", "md": "Both teams are smart, both have data, and both are measured on different numbers.", "text": "Both teams are smart, both have data, and both are measured on different numbers.", "zh": "两个团队都很聪明，手里都有数据，而且考核的是不同的指标。", "sp": null}], [{"id": "s0_1_0", "md": "This is the usual root of cross-team conflict.", "text": "This is the usual root of cross-team conflict.", "zh": "这就是跨团队冲突最常见的根源。", "sp": null}, {"id": "s0_1_1", "md": "It is rarely about ==personalities==.", "text": "It is rarely about personalities.", "zh": "问题很少出在人的性格上。", "sp": null}, {"id": "s0_1_2", "md": "**When two teams keep different scoreboards, every meeting turns into a negotiation.**", "text": "When two teams keep different scoreboards, every meeting turns into a negotiation.", "zh": "两个团队各看各的记分牌，每次开会就都变成了谈判。", "sp": null}, {"id": "s0_1_3", "md": "Each side ==defends== its own metric, and the user __gets lost in the middle__.", "text": "Each side defends its own metric, and the user gets lost in the middle.", "zh": "每一方都在守自己的指标，用户就在中间被弄丢了。", "sp": null}], [{"id": "s0_2_0", "md": "You cannot fix this with more meetings or a nicer tone.", "text": "You cannot fix this with more meetings or a nicer tone.", "zh": "这事靠多开几次会、语气客气一点是解决不了的。", "sp": null}, {"id": "s0_2_1", "md": "You fix it by changing what both teams are __held accountable for__.", "text": "You fix it by changing what both teams are held accountable for.", "zh": "要解决，就得改变两个团队各自要背的东西。", "sp": null}, {"id": "s0_2_2", "md": "In other words, you need a shared definition of winning that neither team can ==achieve== alone.", "text": "In other words, you need a shared definition of winning that neither team can achieve alone.", "zh": "换句话说，你需要一个双方共同认可的「赢」的定义，而且任何一个团队单靠自己都做不到。", "sp": null}]]}, {"heading": "2. Building the Shared Number", "heading_zh": "2. 建立一个共同的指标", "rows": [[{"id": "s1_0_0", "md": "Get both leads in one room and ask a simple question.", "text": "Get both leads in one room and ask a simple question.", "zh": "把两边的 lead 拉到一个房间里，问一个简单的问题。", "sp": null}, {"id": "s1_0_1", "md": "\"If this project goes perfectly, what changes for the user?\"", "text": "\"If this project goes perfectly, what changes for the user?\"", "zh": "「如果这个项目做得完美，用户那边会有什么变化？」", "sp": null}, {"id": "s1_0_2", "md": "Keep asking until the answer is something both teams would __sign off on__.", "text": "Keep asking until the answer is something both teams would sign off on.", "zh": "一直追问，直到答案是两个团队都愿意签字认可的。", "sp": null}], [{"id": "s1_1_0", "md": "In our example, the answer might be \"more new users who are still active after a week.\"", "text": "In our example, the answer might be \"more new users who are still active after a week.\"", "zh": "拿我们的例子来说，答案可能是「一周后仍然活跃的新用户更多了」。", "sp": null}, {"id": "s1_1_1", "md": "Sign-ups alone can be gamed, and load time alone ignores the business.", "text": "Sign-ups alone can be gamed, and load time alone ignores the business.", "zh": "光看注册量可以刷，光看加载时间又不管业务。", "sp": null}, {"id": "s1_1_2", "md": "Retention ==captures== what both teams actually care about.", "text": "Retention captures what both teams actually care about.", "zh": "留存才真正体现了两个团队都在乎的东西。", "sp": null}], [{"id": "s1_2_0", "md": "Then add a ==guardrail== for each side.", "text": "Then add a guardrail for each side.", "zh": "然后给每一方各加一条护栏。", "sp": null}, {"id": "s1_2_1", "md": "The growth team can try any idea, as long as load time stays under an agreed limit.", "text": "The growth team can try any idea, as long as load time stays under an agreed limit.", "zh": "增长团队想试什么点子都行，只要加载时间不超过约定的上限。", "sp": null}, {"id": "s1_2_2", "md": "**A shared goal plus clear guardrails turns rivals into partners.**", "text": "A shared goal plus clear guardrails turns rivals into partners.", "zh": "共同的目标加上清晰的护栏，能把对手变成搭档。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, review the number together, in the same meeting, from the same dashboard.", "text": "Finally, review the number together, in the same meeting, from the same dashboard.", "zh": "最后，一起看这个指标：同一个会、同一个 dashboard。", "sp": null}, {"id": "s1_3_1", "md": "When both teams look at one chart every week, arguments about whose data is right slowly ==disappear==.", "text": "When both teams look at one chart every week, arguments about whose data is right slowly disappear.", "zh": "当两个团队每周都看同一张图，关于谁的数据对的争论就会慢慢消失。", "sp": null}, {"id": "s1_3_2", "md": "The conversation shifts from \"your team\" to \"our number,\" which is exactly the point.", "text": "The conversation shifts from \"your team\" to \"our number,\" which is exactly the point.", "zh": "对话会从「你们团队」变成「我们的指标」，这恰恰就是目的所在。", "sp": null}]]}], "gist": [{"q": "跨团队冲突通常的根源是什么？", "a": "不是性格问题，而是两个团队用不同的指标（记分牌）考核，每次开会都变成谈判。"}, {"q": "例子中两个团队的共同目标最后是什么？为什么选它？", "a": "一周后仍活跃的新用户数（留存）；单看注册量能被刷，单看加载时间忽略业务，留存同时反映双方关心的东西。"}, {"q": "除了共同目标，还要加什么？", "a": "给每一方设护栏指标，比如增长团队可以随便试，但加载时间必须低于约定上限；并每周用同一个看板一起复盘。"}], "dictation": [{"id": "s0_1_2", "text": "When two teams keep different scoreboards, every meeting turns into a negotiation."}, {"id": "s1_0_1", "text": "\"If this project goes perfectly, what changes for the user?\""}, {"id": "s1_2_2", "text": "A shared goal plus clear guardrails turns rivals into partners."}, {"id": "s1_1_1", "text": "Sign-ups alone can be gamed, and load time alone ignores the business."}], "shadow": {"text": "Then add a guardrail for each side. The growth team can try any idea, as long as load time stays under an agreed limit. A shared goal plus clear guardrails turns rivals into partners.", "marked": "Then add a <b>guardrail</b> / for <b>each</b> side. //<br>The growth team can try <b>any</b> idea, / as long as <b>load time</b> stays under an <b>agreed</b> limit. //<br>A <b>shared</b> goal / plus clear <b>guardrails</b> / turns <b>rivals</b> into <b>partners</b>. //"}, "prompts": [{"q": "推荐算法组想提高点击率，内容安全组想减少违规内容曝光，两边在会上吵起来了。你主持会议，用 30 秒提出一个共同目标加护栏的方案。", "ref": "Can I suggest we step back for a second? I think we're arguing because we're looking at two different numbers. What we both want is users who come back tomorrow because they enjoyed their feed. So let's make next-day return rate the shared goal. Recommendations can test anything they like, as long as the rate of flagged content doesn't go up. Does that work for both teams?", "ref_zh": "我能不能建议大家先退一步？我觉得我们在吵，是因为我们看的是两个不同的数字。我们双方真正想要的，是用户因为喜欢自己的 feed，第二天还会回来。所以我们就把次日回访率作为共同目标吧。推荐团队想试什么都行，只要被举报内容的比例不上升。两个团队觉得这样可以吗？", "id": "ref0"}, {"q": "两个团队每周都在争论谁的数据是对的。用 30 秒提议统一看板和复盘方式。", "ref": "Every week we spend the first twenty minutes debating whose numbers are right, and that's time we never get back. I'd like to propose one dashboard that both teams agree on, built from the same data source. We review it together every Monday, in one meeting. If someone thinks a number is wrong, we fix the dashboard, not the argument.", "ref_zh": "每周我们都要花前二十分钟争论谁的数据是对的，这些时间是再也找不回来的。我想提议做一个两个团队都认可的 dashboard，用同一个数据源。每周一我们一起在一个会上看。如果有人觉得哪个数字不对，我们就去修 dashboard，而不是继续吵。", "id": "ref1"}], "words": [{"w": "personality", "ipa": "/ˌpɜːrsəˈnæləti/", "zh": "性格、个性", "ex": "This isn't a personality clash; their goals are just different.", "id": "w0"}, {"w": "achieve", "ipa": "/əˈtʃiːv/", "zh": "达成、实现", "ex": "We can't achieve the latency target without their help.", "id": "w1"}, {"w": "capture (v.)", "ipa": "/ˈkæptʃər/", "zh": "体现、捕捉", "ex": "Does this metric really captu const h = (tag, attrs = {}, ...kids) => {

const player = new Audio();

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
