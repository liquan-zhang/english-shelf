const D = {"id": "071", "title": "Saying What You Will Not Do This Quarter", "meta": "B2 · 约 280 词 · 场景：季度规划", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Plan Is Mostly No", "heading_zh": "1. 计划的大半是说不", "rows": [[{"id": "s0_0_0", "md": "Every quarterly plan looks reasonable when it lists what the team will build.", "text": "Every quarterly plan looks reasonable when it lists what the team will build.", "zh": "每份季度规划在列出团队要做什么的时候，看起来都挺合理。", "sp": null}, {"id": "s0_0_1", "md": "The trouble starts in week three, when a new request arrives and nobody knows whether it fits.", "text": "The trouble starts in week three, when a new request arrives and nobody knows whether it fits.", "zh": "麻烦从第三周开始，新需求来了，没人知道它该不该塞进去。", "sp": null}, {"id": "s0_0_2", "md": "Without a clear boundary, everything quietly becomes a priority, and the team ends the quarter with ten things half done.", "text": "Without a clear boundary, everything quietly becomes a priority, and the team ends the quarter with ten things half done.", "zh": "没有清晰的边界，所有事都会悄悄变成优先级，团队到季度末手里是十件做了一半的事。", "sp": null}], [{"id": "s0_1_0", "md": "**A plan only means something when it also says what you are not doing.**", "text": "A plan only means something when it also says what you are not doing.", "zh": "一份计划只有同时写明不做什么，才有意义。", "sp": null}, {"id": "s0_1_1", "md": "That list is uncomfortable to write, because every item on it belongs to someone who cares about it.", "text": "That list is uncomfortable to write, because every item on it belongs to someone who cares about it.", "zh": "这份清单写起来很难受，因为上面每一项背后都有一个在乎它的人。", "sp": null}, {"id": "s0_1_2", "md": "But leaving it ==implicit== does not avoid the conflict; it only moves the conflict to a worse moment, usually the quarterly review.", "text": "But leaving it implicit does not avoid the conflict; it only moves the conflict to a worse moment, usually the quarterly review.", "zh": "但不明说并不能回避冲突；它只是把冲突挪到一个更糟的时间点，通常是季度复盘。", "sp": null}], [{"id": "s0_2_0", "md": "An ==explicit== not-doing list protects the team.", "text": "An explicit not-doing list protects the team.", "zh": "一份明确的不做清单能保护团队。", "sp": null}, {"id": "s0_2_1", "md": "When someone asks for something new, you can point to the list and ask what they would like to __swap out__.", "text": "When someone asks for something new, you can point to the list and ask what they would like to swap out.", "zh": "有人提新需求时，你可以指着清单问他想拿哪一项来换。", "sp": null}, {"id": "s0_2_2", "md": "The conversation shifts from pressure to ==negotiation==, which is a much healthier place to be.", "text": "The conversation shifts from pressure to negotiation, which is a much healthier place to be.", "zh": "对话就从施压变成了谈判，这是一个健康得多的状态。", "sp": null}]]}, {"heading": "2. Saying Not Now Without Burning Bridges", "heading_zh": "2. 说「现在不做」又不伤关系", "rows": [[{"id": "s1_0_0", "md": "Don't let people find out from a slide in a big meeting.", "text": "Don't let people find out from a slide in a big meeting.", "zh": "别让人在大会上从一页 PPT 里才知道。", "sp": null}, {"id": "s1_0_1", "md": "__Reach out__ to the owners of the biggest ==deprioritized== items before the plan is published.", "text": "Reach out to the owners of the biggest deprioritized items before the plan is published.", "zh": "在计划发布之前，先私下找那些被降优先级的大项负责人聊一聊。", "sp": null}, {"id": "s1_0_2", "md": "A short private call beats a public surprise every time.", "text": "A short private call beats a public surprise every time.", "zh": "一通简短的私聊，永远好过当众给人一个意外。", "sp": null}], [{"id": "s1_1_0", "md": "Be specific about why the item didn't make the cut.", "text": "Be specific about why the item didn't make the cut.", "zh": "要具体说明这一项为什么没排进来。", "sp": null}, {"id": "s1_1_1", "md": "\"We're not doing the export feature this quarter because the latency work affects every customer, and we only have two backend engineers.\"", "text": "\"We're not doing the export feature this quarter because the latency work affects every customer, and we only have two backend engineers.\"", "zh": "「这个季度不做导出功能，是因为延迟优化影响所有客户，而我们只有两个后端工程师。」", "sp": null}, {"id": "s1_1_2", "md": "A reason tied to real ==constraints== is much easier to accept than a reason that sounds like personal taste.", "text": "A reason tied to real constraints is much easier to accept than a reason that sounds like personal taste.", "zh": "跟真实约束挂钩的理由，比听起来像个人喜好的理由容易接受得多。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, tell them what would change your answer.", "text": "Finally, tell them what would change your answer.", "zh": "最后，告诉他们什么情况下你的答案会变。", "sp": null}, {"id": "s1_2_1", "md": "\"If the latency work finishes early, export is first in line.\"", "text": "\"If the latency work finishes early, export is first in line.\"", "zh": "「如果延迟优化提前做完，导出功能第一个排上。」", "sp": null}, {"id": "s1_2_2", "md": "**Not now, with a condition, sounds very different from never.**", "text": "Not now, with a condition, sounds very different from never.", "zh": "带条件的「现在不做」，跟「永远不做」听起来完全不一样。", "sp": null}, {"id": "s1_2_3", "md": "It keeps the door open and keeps the ==stakeholder== on your side for the next round of planning.", "text": "It keeps the door open and keeps the stakeholder on your side for the next round of planning.", "zh": "它让门一直开着，也让这位相关方在下一轮规划时还站在你这边。", "sp": null}]]}], "gist": [{"q": "为什么季度计划必须写出“不做什么”？", "a": "否则新需求来了没人知道是否在范围内，所有事都悄悄变成优先级；不写只是把冲突推迟到更糟的时刻。"}, {"q": "明确的“不做清单”对团队有什么用？", "a": "有人提新需求时可以指着清单问要换掉哪一项，把施压变成协商。"}, {"q": "怎样告诉别人“这季度不做”而不伤关系？", "a": "发布前私下先沟通；用真实约束说明原因；告诉对方什么条件下会改变答案，“暂不做+条件”不同于“永远不做”。"}], "dictation": [{"id": "s0_1_0", "text": "A plan only means something when it also says what you are not doing."}, {"id": "s0_2_1", "text": "When someone asks for something new, you can point to the list and ask what they would like to swap out."}, {"id": "s1_1_2", "text": "A reason tied to real constraints is much easier to accept than a reason that sounds like personal taste."}, {"id": "s1_2_2", "text": "Not now, with a condition, sounds very different from never."}], "shadow": {"text": "Finally, tell them what would change your answer. \"If the latency work finishes early, export is first in line.\" Not now, with a condition, sounds very different from never.", "marked": "<b>Finally</b>, / tell them what would <b>change</b> your answer. //<br>\"If the latency work finishes <b>early</b>, / export is <b>first</b> in line.\" //<br>Not <b>now</b>, / with a <b>condition</b>, / sounds very <b>different</b> / from <b>never</b>. //"}, "prompts": [{"q": "运营负责人很想要的“批量导入”这季度排不上。用 30 秒在一对一里告诉她：不做的原因和什么情况下会做。", "ref": "I wanted to tell you this before the plan goes out. Bulk import didn't make it into this quarter. The main reason is that we're putting both backend engineers on the payment latency issue, which affects every customer. I know that's disappointing. If the latency work wraps up early, bulk import is the first thing we pick up, and I'll let you know by mid-quarter either way.", "ref_zh": "我想在计划发出去之前先跟你说一声。批量导入没排进这个季度。主要原因是我们要把两个后端工程师都放到支付延迟的问题上，这个影响所有客户。我知道这挺让人失望的。如果延迟优化提前收尾，批量导入就是我们第一个接的事，不管怎样，季度中我都会给你个准信。", "id": "ref0"}, {"q": "季度中一个兄弟团队临时塞来新需求。用 30 秒指着“不做清单”回应，把讨论变成取舍。", "ref": "Thanks for bringing this to us early. As you can see in our plan, we committed to three projects, and we listed what we're not doing to make room for them. I'm open to taking this on, but something has to come out. Looking at the list, would you rather we delay the search improvements or the reporting work? Let's agree on that first.", "ref_zh": "谢谢你这么早就来找我们。你也看到了，我们的计划里承诺了三个项目，也列了为了腾出精力不做哪些事。我愿意接这个需求，但总得拿掉点什么。看看这份清单，你更愿意我们推迟搜索优化，还是报表那块？我们先把这个对齐。", "id": "ref1"}], "words": [{"w": "implicit", "ipa": "/ɪmˈplɪsɪt/", "zh": "隐含的、未明说的", "ex": "There was an implicit expectation that we'd support the old version too.", "id": "w0"}, {"w": "explicit", "ipa": "/ɪkˈsplɪsɪt/", "zh": "明确的、明说的", "ex": "Let's make the scope explicit in the doc so nobody is surprised.", "id": "w1"}, {"w": "negotiation", "ipa": "/nɪˌɡoʊʃiˈeɪʃən/", "zh": "协商、谈判", "ex": "Scope is always a negotiation const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
