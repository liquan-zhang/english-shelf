<script>
const D = {"id": "071", "title": "Saying What You Will Not Do This Quarter", "meta": "B2 · 约 280 词 · 场景：季度规划", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Plan Is Mostly No", "heading_zh": "1. 计划的大半是说不", "rows": [[{"id": "s0_0_0", "md": "Every quarterly plan looks reasonable when it lists what the team will build.", "text": "Every quarterly plan looks reasonable when it lists what the team will build.", "zh": "每份季度规划在列出团队要做什么的时候，看起来都挺合理。", "sp": null}, {"id": "s0_0_1", "md": "The trouble starts in week three, when a new request arrives and nobody knows whether it fits.", "text": "The trouble starts in week three, when a new request arrives and nobody knows whether it fits.", "zh": "麻烦从第三周开始，新需求来了，没人知道它该不该塞进去。", "sp": null}, {"id": "s0_0_2", "md": "Without a clear boundary, everything quietly becomes a priority, and the team ends the quarter with ten things half done.", "text": "Without a clear boundary, everything quietly becomes a priority, and the team ends the quarter with ten things half done.", "zh": "没有清晰的边界，所有事都会悄悄变成优先级，团队到季度末手里是十件做了一半的事。", "sp": null}], [{"id": "s0_1_0", "md": "**A plan only means something when it also says what you are not doing.**", "text": "A plan only means something when it also says what you are not doing.", "zh": "一份计划只有同时写明不做什么，才有意义。", "sp": null}, {"id": "s0_1_1", "md": "That list is uncomfortable to write, because every item on it belongs to someone who cares about it.", "text": "That list is uncomfortable to write, because every item on it belongs to someone who cares about it.", "zh": "这份清单写起来很难受，因为上面每一项背后都有一个在乎它的人。", "sp": null}, {"id": "s0_1_2", "md": "But leaving it ==implicit== does not avoid the conflict; it only moves the conflict to a worse moment, usually the quarterly review.", "text": "But leaving it implicit does not avoid the conflict; it only moves the conflict to a worse moment, usually the quarterly review.", "zh": "但不明说并不能回避冲突；它只是把冲突挪到一个更糟的时间点，通常是季度复盘。", "sp": null}], [{"id": "s0_2_0", "md": "An ==explicit== not-doing list protects the team.", "text": "An explicit not-doing list protects the team.", "zh": "一份明确的不做清单能保护团队。", "sp": null}, {"id": "s0_2_1", "md": "When someone asks for something new, you can point to the list and ask what they would like to __swap out__.", "text": "When someone asks for something new, you can point to the list and ask what they would like to swap out.", "zh": "有人提新需求时，你可以指着清单问他想拿哪一项来换。", "sp": null}, {"id": "s0_2_2", "md": "The conversation shifts from pressure to ==negotiation==, which is a much healthier place to be.", "text": "The conversation shifts from pressure to negotiation, which is a much healthier place to be.", "zh": "对话就从施压变成了谈判，这是一个健康得多的状态。", "sp": null}]]}, {"heading": "2. Saying Not Now Without Burning Bridges", "heading_zh": "2. 说「现在不做」又不伤关系", "rows": [[{"id": "s1_0_0", "md": "Don't let people find out from a slide in a big meeting.", "text": "Don't let people find out from a slide in a big meeting.", "zh": "别让人在大会上从一页 PPT 里才知道。", "sp": null}, {"id": "s1_0_1", "md": "__Reach out__ to the owners of the biggest ==deprioritized== items before the plan is published.", "text": "Reach out to the owners of the biggest deprioritized items before the plan is published.", "zh": "在计划发布之前，先私下找那些被降优先级的大项负责人聊一聊。", "sp": null}, {"id": "s1_0_2", "md": "A short private call beats a public surprise every time.", "text": "A short private call beats a public surprise every time.", "zh": "一通简短的私聊，永远好过当众给人一个意外。", "sp": null}], [{"id": "s1_1_0", "md": "Be specific about why the item didn't make the cut.", "text": "Be specific about why the item didn't make the cut.", "zh": "要具体说明这一项为什么没排进来。", "sp": null}, {"id": "s1_1_1", "md": "\"We're not doing the export feature this quarter because the latency work affects every customer, and we only have two backend engineers.\"", "text": "\"We're not doing the export feature this quarter because the latency work affects every customer, and we only have two backend engineers.\"", "zh": "「这个季度不做导出功能，是因为延迟优化影响所有客户，而我们只有两个后端工程师。」", "sp": null}, {"id": "s1_1_2", "md": "A reason tied to real ==constraints== is much easier to accept than a reason that sounds like personal taste.", "text": "A reason tied to real constraints is much easier to accept than a reason that sounds like personal taste.", "zh": "跟真实约束挂钩的理由，比听起来像个人喜好的理由容易接受得多。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, tell them what would change your answer.", "text": "Finally, tell them what would change your answer.", "zh": "最后，告诉他们什么情况下你的答案会变。", "sp": null}, {"id": "s1_2_1", "md": "\"If the latency work finishes early, export is first in line.\"", "text": "\"If the latency work finishes early, export is first in line.\"", "zh": "「如果延迟优化提前做完，导出功能第一个排上。」", "sp": null}, {"id": "s1_2_2", "md": "**Not now, with a condition, sounds very different from never.**", "text": "Not now, with a condition, sounds very different from never.", "zh": "带条件的「现在不做」，跟「永远不做」听起来完全不一样。", "sp": null}, {"id": "s1_2_3", "md": "It keeps the door open and keeps the ==stakeholder== on your side for the next round of planning.", "text": "It keeps the door open and keeps the stakeholder on your side for the next round of planning.", "zh": "它让门一直开着，也让这位相关方在下一轮规划时还站在你这边。", "sp": null}]]}], "gist": [{"q": "为什么季度计划必须写出“不做什么”？", "a": "否则新需求来了没人知道是否在范围内，所有事都悄悄变成优先级；不写只是把冲突推迟到更糟的时刻。"}, {"q": "明确的“不做清单”对团队有什么用？", "a": "有人提新需求时可以指着清单问要换掉哪一项，把施压变成协商。"}, {"q": "怎样告诉别人“这季度不做”而不伤关系？", "a": "发布前私下先沟通；用真实约束说明原因；告诉对方什么条件下会改变答案，“暂不做+条件”不同于“永远不做”。"}], "dictation": [{"id": "s0_1_0", "text": "A plan only means something when it also says what you are not doing."}, {"id": "s0_2_1", "text": "When someone asks for something new, you can point to the list and ask what they would like to swap out."}, {"id": "s1_1_2", "text": "A reason tied to real constraints is much easier to accept than a reason that sounds like personal taste."}, {"id": "s1_2_2", "text": "Not now, with a condition, sounds very different from never."}], "shadow": {"text": "Finally, tell them what would change your answer. \"If the latency work finishes early, export is first in line.\" Not now, with a condition, sounds very different from never.", "marked": "<b>Finally</b>, / tell them what would <b>change</b> your answer. //<br>\"If the latency work finishes <b>early</b>, / export is <b>first</b> in line.\" //<br>Not <b>now</b>, / with a <b>condition</b>, / sounds very <b>different</b> / from <b>never</b>. //"}, "prompts": [{"q": "运营负责人很想要的“批量导入”这季度排不上。用 30 秒在一对一里告诉她：不做的原因和什么情况下会做。", "ref": "I wanted to tell you this before the plan goes out. Bulk import didn't make it into this quarter. The main reason is that we're putting both backend engineers on the payment latency issue, which affects every customer. I know that's disappointing. If the latency work wraps up early, bulk import is the first thing we pick up, and I'll let you know by mid-quarter either way.", "ref_zh": "我想在计划发出去之前先跟你说一声。批量导入没排进这个季度。主要原因是我们要把两个后端工程师都放到支付延迟的问题上，这个影响所有客户。我知道这挺让人失望的。如果延迟优化提前收尾，批量导入就是我们第一个接的事，不管怎样，季度中我都会给你个准信。", "id": "ref0"}, {"q": "季度中一个兄弟团队临时塞来新需求。用 30 秒指着“不做清单”回应，把讨论变成取舍。", "ref": "Thanks for bringing this to us early. As you can see in our plan, we committed to three projects, and we listed what we're not doing to make room for them. I'm open to taking this on, but something has to come out. Looking at the list, would you rather we delay the search improvements or the reporting work? Let's agree on that first.", "ref_zh": "谢谢你这么早就来找我们。你也看到了，我们的计划里承诺了三个项目，也列了为了腾出精力不做哪些事。我愿意接这个需求，但总得拿掉点什么。看看这份清单，你更愿意我们推迟搜索优化，还是报表那块？我们先把这个对齐。", "id": "ref1"}], "words": [{"w": "implicit", "ipa": "/ɪmˈplɪsɪt/", "zh": "隐含的、未明说的", "ex": "There was an implicit expectation that we'd support the old version too.", "id": "w0"}, {"w": "explicit", "ipa": "/ɪkˈsplɪsɪt/", "zh": "明确的、明说的", "ex": "Let's make the scope explicit in the doc so nobody is surprised.", "id": "w1"}, {"w": "negotiation", "ipa": "/nɪˌɡoʊʃiˈeɪʃən/", "zh": "协商、谈判", "ex": "Scope is always a negotiation .834, 73.084], [73.097, 73.202], [73.215, 73.715], [73.728, 74.071], [74.084, 74.242], [74.255, 74.65], [74.768, 75.044], [75.057, 75.176], [75.189, 75.702], [75.715, 76.018], [76.031, 76.492], [76.649, 76.926], [76.939, 77.478], [77.939, 78.005], [78.018, 78.163], [78.176, 78.452], [78.465, 78.728], [78.742, 79.031], [79.044, 79.518], [79.531, 80.242]]}, {"kind": "s", "id": "s1_1_2", "md": "A reason tied to real ==constraints== is much easier to accept than a reason that sounds like personal taste.", "zh": "跟真实约束挂钩的理由，比听起来像个人喜好的理由容易接受得多。", "sp": null, "gap": false, "start": 80.76, "end": 87.648, "words": [[80.865, 80.918], [80.931, 81.339], [81.352, 81.76], [81.773, 81.905], [81.918, 82.194], [82.207, 82.826], [82.944, 83.089], [83.102, 83.431], [83.549, 83.97], [83.984, 84.115], [84.128, 84.628], [84.707, 84.852], [84.865, 84.918], [84.931, 85.418], [85.549, 85.694], [85.707, 86.115], [86.128, 86.286], [86.299, 86.773], [86.786, 87.26]]}, {"kind": "s", "id": "s1_2_0", "md": "Finally, tell them what would change your answer.", "zh": "最后，告诉他们什么情况下你的答案会变。", "sp": null, "gap": true, "start": 87.648, "end": 90.36, "words": [[87.819, 88.24], [88.556, 88.714], [88.727, 88.845], [88.859, 88.977], [88.99, 89.122], [89.135, 89.411], [89.424, 89.543], [89.556, 89.964]]}, {"kind": "s", "id": "s1_2_1", "md": "\"If the latency work finishes early, export is first in line.\"", "zh": "「如果延迟优化提前做完，导出功能第一个排上。」", "sp": null, "gap": false, "start": 90.36, "end": 94.632, "words": [[90.544, 90.597], [90.597, 90.689], [90.702, 91.189], [91.202, 91.465], [91.478, 91.992], [92.005, 92.452], [92.689, 93.189], [93.202, 93.307], [93.321, 93.742], [93.755, 93.86], [93.873, 94.242]]}, {"kind": "s", "id": "s1_2_2", "md": "**Not now, with a condition, sounds very different from never.**", "zh": "带条件的「现在不做」，跟「永远不做」听起来完全不一样。", "sp": null, "gap": false, "start": 94.632, "end": 98.76, "words": [[94.737, 94.935], [94.948, 95.277], [95.671, 95.803], [95.816, 95.869], [95.882, 96.421], [96.79, 97.079], [97.093, 97.369], [97.382, 97.75], [97.764, 97.948], [97.961, 98.382]]}, {"kind": "s", "id": "s1_2_3", "md": "It keeps the door open and keeps the ==stakeholder== on your side for the next round of planning.", "zh": "它让门一直开着，也让这位相关方在下一轮规划时还站在你这边。", "sp": null, "gap": false, "start": 98.76, "end": 103.8, "words": [[98.865, 98.971], [98.984, 99.273], [99.286, 99.405], [99.418, 99.734], [99.747, 100.102], [100.181, 100.313], [100.326, 100.628], [100.642, 100.747], [100.76, 101.392], [101.405, 101.51], [101.523, 101.681], [101.694, 102.089], [102.102, 102.194], [102.207, 102.3], [102.313, 102.668], [102.681, 102.878], [102.892, 102.957], [102.971, 103.418]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
