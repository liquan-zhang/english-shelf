<script>
const D = {"id": "068", "title": "Calm Is Contagious", "meta": "B2 · 约 280 词 · 场景：危机沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Room Copies You", "heading_zh": "1. 整个房间都在模仿你", "rows": [[{"id": "s0_0_0", "md": "Join any outage call and you can tell within a minute how it is going.", "text": "Join any outage call and you can tell within a minute how it is going.", "zh": "随便进一个故障会议，一分钟之内你就能感觉到进展如何。", "sp": null}, {"id": "s0_0_1", "md": "Not from the graphs, but from the voices.", "text": "Not from the graphs, but from the voices.", "zh": "不是看曲线，而是听声音。", "sp": null}, {"id": "s0_0_2", "md": "Fast, overlapping speech, sharp questions, and long silences all ==signal== panic.", "text": "Fast, overlapping speech, sharp questions, and long silences all signal panic.", "zh": "语速快、抢着说话、问话很冲、长时间冷场，这些都是慌了的信号。", "sp": null}], [{"id": "s0_1_0", "md": "People in a crisis watch the person in charge and copy them.", "text": "People in a crisis watch the person in charge and copy them.", "zh": "危机中的人会盯着负责的那个人，跟着他学。", "sp": null}, {"id": "s0_1_1", "md": "If the lead talks quickly and sounds ==irritated==, everyone speeds up and starts making small mistakes.", "text": "If the lead talks quickly and sounds irritated, everyone speeds up and starts making small mistakes.", "zh": "如果指挥说话很快、听着很烦躁，所有人都会跟着提速，开始犯小错。", "sp": null}, {"id": "s0_1_2", "md": "If the lead sounds steady, the room __settles down__ and people start thinking again.", "text": "If the lead sounds steady, the room settles down and people start thinking again.", "zh": "如果指挥听起来很稳，整个会就会安定下来，大家又能开始思考了。", "sp": null}], [{"id": "s0_2_0", "md": "This matters even more on global teams.", "text": "This matters even more on global teams.", "zh": "在跨国团队里，这一点更重要。", "sp": null}, {"id": "s0_2_1", "md": "When half the call is joining from another time zone, often in a second language, a rushed voice is much harder to follow.", "text": "When half the call is joining from another time zone, often in a second language, a rushed voice is much harder to follow.", "zh": "当会上一半人是从另一个时区接进来的，而且常常用的是第二语言，急促的语速会让人更难跟上。", "sp": null}, {"id": "s0_2_2", "md": "Speaking calmly is also speaking clearly, and clarity saves minutes.", "text": "Speaking calmly is also speaking clearly, and clarity saves minutes.", "zh": "说话冷静，也就是说话清楚，而清楚能省下好几分钟。", "sp": null}], [{"id": "s0_3_0", "md": "**Your tone during an incident is part of the fix, not a side detail.**", "text": "Your tone during an incident is part of the fix, not a side detail.", "zh": "故障期间你的语气本身就是修复的一部分，而不是细枝末节。", "sp": null}, {"id": "s0_3_1", "md": "Calm does not mean slow or ==indifferent==.", "text": "Calm does not mean slow or indifferent.", "zh": "冷静不等于慢，也不等于无所谓。", "sp": null}, {"id": "s0_3_2", "md": "It means your voice stays level while your actions stay fast.", "text": "It means your voice stays level while your actions stay fast.", "zh": "它的意思是，声音保持平稳，动作保持迅速。", "sp": null}]]}, {"heading": "2. What a Calm Voice Sounds Like", "heading_zh": "2. 冷静的声音听起来是什么样", "rows": [[{"id": "s1_0_0", "md": "First, slow your speech down a little and lower your volume.", "text": "First, slow your speech down a little and lower your volume.", "zh": "第一，语速稍微放慢一点，音量压低一点。", "sp": null}, {"id": "s1_0_1", "md": "It feels strange, but on a call it ==projects== control.", "text": "It feels strange, but on a call it projects control.", "zh": "这感觉有点怪，但在会上它会传递出掌控感。", "sp": null}, {"id": "s1_0_2", "md": "Second, use short factual sentences, like \"Rollback is at fifty percent, and errors are flat.\"", "text": "Second, use short factual sentences, like \"Rollback is at fifty percent, and errors are flat.\"", "zh": "第二，用简短的事实句，比如「回滚到百分之五十了，报错持平。」", "sp": null}], [{"id": "s1_1_0", "md": "Third, replace blame with questions about the system.", "text": "Third, replace blame with questions about the system.", "zh": "第三，用针对系统的提问来代替追责。", "sp": null}, {"id": "s1_1_1", "md": "\"Who pushed this?\" makes people ==defensive== and quiet, exactly when you need them talking.", "text": "\"Who pushed this?\" makes people defensive and quiet, exactly when you need them talking.", "zh": "「谁推的这个？」会让人防御心起来、不吭声，偏偏这时候你最需要大家开口。", "sp": null}, {"id": "s1_1_2", "md": "\"What changed in the last hour?\" gets you the same information without the fear.", "text": "\"What changed in the last hour?\" gets you the same information without the fear.", "zh": "「过去一小时改了什么？」能拿到同样的信息，又不会让人害怕。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, __name the next step__ even when you are not sure it will work.", "text": "Finally, name the next step even when you are not sure it will work.", "zh": "最后，哪怕你不确定管不管用，也要说出下一步。", "sp": null}, {"id": "s1_2_1", "md": "\"We'll try restarting the cache nodes; if that doesn't help in five minutes, we fail over to the backup region.\"", "text": "\"We'll try restarting the cache nodes; if that doesn't help in five minutes, we fail over to the backup region.\"", "zh": "「我们先重启缓存节点；五分钟内不见效，就切到备用机房。」", "sp": null}, {"id": "s1_2_2", "md": "**People can handle bad news; what they cannot handle is not knowing what happens next.**", "text": "People can handle bad news; what they cannot handle is not knowing what happens next.", "zh": "人们扛得住坏消息；扛不住的是不知道接下来会发生什么。", "sp": null}, {"id": "s1_2_3", "md": "A ==composed== lead gives them that, one step at a time.", "text": "A composed lead gives them that, one step at a time.", "zh": "一个镇定的指挥，就是一步一步地把这个交给大家。", "sp": null}]]}], "gist": [{"q": "作者说在故障电话里，怎么判断事情进展如何？", "a": "听声音而不是看图表：语速快、抢话、尖锐提问和长时间沉默都说明大家在慌。"}, {"q": "为什么说语气是修复的一部分？", "a": "人们会模仿负责人：负责人急躁大家就加速出错，负责人稳住大家才能重新思考。冷静不等于慢或冷漠。"}, {"q": "让声音显得冷静的具体做法有哪些？", "a": "放慢语速、降低音量；用简短的事实句；用关于系统的提问代替追责；即使不确定也说出下一步。"}], "dictation": [{"id": "s0_3_0", "text": "Your tone during an incident is part of the fix, not a side detail."}, {"id": "s0_3_2", "text": "It means your voice stays level while your actions stay fast."}, {"id": "s1_1_2", "text": "\"What changed in the last hour?\" gets you the same information without the fear."}, {"id": "s1_2_2", "text": "People can handle bad news; what they cannot handle is not knowing what happens next."}], "shadow": {"text": "Calm does not mean slow or indifferent. It means your voice stays level while your actions stay fast.", "marked": "<b>Calm</b> does not mean / <b>slow</b> / or <b>indifferent</b>. //<br>It means your <b>voice</b> stays level / while your <b>actions</b> / stay <b>fast</b>. //"}, "prompts": [{"q": "故障电话里大家抢着说话、互相质问“谁改的”。你接过话头，用 30 秒让大家冷静下来并给出下一步。", "ref": "Okay, let's take a breath. Here's where we are: errors are still high, but they're not getting worse. We don't need to know who changed what right now. The useful question is, what changed in the last hour? Arjun, can you pull the deploy log? Meanwhile, we'll restart the cache nodes. If that doesn't help in five minutes, we fail over. Next check-in at ten past.", "ref_zh": "好，大家先缓口气。现在的情况是：报错还是很高，但没有继续恶化。现在不需要搞清楚谁改了什么。有用的问题是，过去一小时改了什么？Arjun，你能把部署记录拉一下吗？同时我们先重启缓存节点。五分钟内不见效，我们就切机房。十分的时候再碰一次。", "id": "ref0"}, {"q": "你的经理在故障中不停在群里追问、语气很急。私下用 30 秒跟他沟通，请他配合保持冷静的节奏。", "ref": "Hey, I know this outage is stressful, and you're getting pressure from above. One thing that would really help: the team is reading every message you send, and the fast questions are making people rush. Could we agree that I'll send you a short update every fifteen minutes, and you route your questions through me? That keeps the engineers focused, and you still get what you need.", "ref_zh": "嘿，我知道这次故障压力很大，上面也在给你压力。有件事会很有帮助：团队会看你发的每一条消息，连珠炮式的追问会让大家手忙脚乱。我们能不能这样约定：我每十五分钟给你发一条简短同步，你的问题都通过我来转？这样工程师能专心干活，你也能拿到你需要的信息。", "id": "ref1"}], "words": [{"w": "signal (v.)", "ipa": "/ˈsɪɡnəl/", "zh": "表明、预示", "ex": "A sudden drop in traffic usually signals a client-side bug.", "tts_w": "signal", "id": "w0"}, {"w": "irritated", "ipa": "/ˈɪrɪˌteɪtɪd/", "zh": "恼火的、烦躁的", "ex": "He sounded irritated when the vendor missed the deadline again.", "id": "w1"}, {"w": "indifferent", "ipa": "/ɪnˈdɪfərənt/", "zh": "冷漠的、漠不关心的", "ex": "Users aren't indifferent to latency; they just leave quietly.", "id": "w2"}, {"w": "project (v.)", "ipa": "/prəˈdʒekt/", "zh": "展现、传达（某种形象）", "ex": "Try to project confidence when you present the new timeline.", "tts_w": "project", "id": "w3"}, {"w": "defensive", "ipa": "/dɪˈfensɪv/", "zh": "防御性的、戒备的", "ex": "The author got defensive when the review focused on naming.", "id": "w4"}, {"w": "composed", "ipa": "/kəmˈpoʊzd/", "zh": "镇定的、沉着的", "ex": "She stayed composed even when the client joined the incident call.", "id": "w5"}, {"w": "contagious", "ipa": "/kənˈteɪdʒəs/", "zh": "有感染力的、会传染的", "ex": "Her energy in the kickoff was contagious.", "id": "w6"}, {"w": "overlapping", "ipa": "/ˌoʊvərˈlæpɪŋ/", "zh": "重叠的、相互打断的", "ex": "We have three overlapping projects all touching the same service.", "id": "w7"}, {"w": "steady", "ipa": "/ˈstedi/", "zh": "稳定的、沉稳的", "ex": "Latency has been steady since the cache fix.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. The Room Copies You", "zh": "1. 整个房间都在模仿你", "start": 0.0, "end": 2.064, "words": [[0.105, 0.329], [0.724, 0.789], [0.803, 1.026], [1.039, 1.46], [1.474, 1.671]]}, {"kind": "s", "id": "s0_0_0", "md": "Join any outage call and you can tell within a minute how it is going.", "zh": "随便进一个故障会议，一分钟之内你就能感觉到进展如何。", "sp": null, "gap": false, "start": 2.064, "end": 6.096, "words": [[2.169, 2.446], [2.459, 2.696], [2.709, 3.011], [3.025, 3.406], [3.656, 3.735], [3.748, 3.84], [3.853, 3.972], [3.985, 4.222], [4.235, 4.524], [4.538, 4.577], [4.59, 4.919], [4.932, 5.117], [5.13, 5.196], [5.209, 5.314], [5.327, 5.696]]}, {"kind": "s", "id": "s0_0_1", "md": "Not from the graphs, but from the voices.", "zh": "不是看曲线，而是听声音。", "sp": null, "gap": false, "start": 6.096, "end": 8.928, "words": [[6.201, 6.412], [6.425, 6.57], [6.583, 6.649], [6.662, 7.28], [7.491, 7.636], [7.649, 7.82], [7.833, 7.899], [7.912, 8.53]]}, {"kind": "s", "id": "s0_0_2", "md": "Fast, overlapping speech, sharp questions, and long silences all ==signal== panic.", "zh":  "words": [[74.438, 74.885], [75.254, 75.648], [75.662, 75.964], [75.977, 76.122], [76.135, 76.622], [76.635, 76.872], [76.885, 76.964], [76.977, 77.412]]}, {"kind": "s", "id": "s1_1_1", "md": "\"Who pushed this?\" makes people ==defensive== and quiet, exactly when you need them talking.", "zh": "「谁推的这个？」会让人防御心起来、不吭声，偏偏这时候你最需要大家开口。", "sp": null, "gap": false, "start": 77.808, "end": 83.424, "words": [[78.019, 78.045], [78.045, 78.361], [78.374, 78.808], [79.111, 79.321], [79.334, 79.65], [79.663, 80.308], [80.321, 80.44], [80.453, 80.926], [81.4, 81.953], [81.966, 82.111], [82.124, 82.216], [82.229, 82.426], [82.44, 82.571], [82.584, 83.045]]}, {"kind": "s", "id": "s1_1_2", "md": "\"What changed in the last hour?\" gets you the same information without the fear.", "zh": "「过去一小时改了什么？」能拿到同样的信息，又不会让人害怕。", "sp": null, "gap": false, "start": 83.424, "end": 87.96, "words": [[83.608, 83.621], [83.7, 84.108], [84.121, 84.174], [84.187, 84.266], [84.279, 84.635], [84.648, 84.911], [85.306, 85.503], [85.516, 85.621], [85.635, 85.74], [85.753, 86.056], [86.069, 86.7], [86.713, 87.056], [87.069, 87.148], [87.161, 87.569]]}, {"kind": "s", "id": "s1_2_0", "md": "Finally, __name the next step__ even when you are not sure it will work.", "zh": "最后，哪怕你不确定管不管用，也要说出下一步。", "sp": null, "gap": true, "start": 87.96, "end": 92.136, "words": [[88.144, 88.565], [88.96, 89.144], [89.157, 89.236], [89.249, 89.526], [89.539, 89.881], [90.105, 90.328], [90.342, 90.473], [90.486, 90.578], [90.592, 90.671], [90.684, 90.92], [90.934, 91.17], [91.184, 91.249], [91.263, 91.394], [91.407, 91.749]]}, {"kind": "s", "id": "s1_2_1", "md": "\"We'll try restarting the cache nodes; if that doesn't help in five minutes, we fail over to the backup region.\"", "zh": "「我们先重启缓存节点；五分钟内不见效，就切到备用机房。」", "sp": null, "gap": false, "start": 92.136, "end": 99.288, "words": [[92.333, 92.399], [92.399, 92.649], [92.662, 93.294], [93.307, 93.386], [93.399, 93.781], [93.794, 94.281], [94.689, 94.768], [94.781, 94.978], [94.991, 95.307], [95.32, 95.57], [95.583, 95.675], [95.689, 95.991], [96.004, 96.465], [96.741, 96.899], [96.912, 97.36], [97.465, 97.689], [97.702, 97.781], [97.794, 97.899], [97.912, 98.399], [98.412, 98.768]]}, {"kind": "s", "id": "s1_2_2", "md": "**People can handle bad news; what they cannot handle is not knowing what happens next.**", "zh": "人们扛得住坏消息；扛不住的是不知道接下来会发生什么。", "sp": null, "gap": false, "start": 99.288, "end": 104.832, "words": [[99.406, 99.67], [99.683, 99.828], [99.841, 100.235], [100.249, 100.512], [100.525, 100.959], [101.354, 101.499], [101.512, 101.63], [101.643, 101.998], [102.012, 102.433], [102.446, 102.551], [102.564, 102.906], [102.92, 103.301], [103.314, 103.459], [103.472, 103.893], [103.906, 104.433]]}, {"kind": "s", "id": "s1_2_3", "md": "A ==composed== lead gives them that, one step at a time.", "zh": "一个镇定的指挥，就是一步一步地把这个交给大家。", "sp": null, "gap": false, "start": 104.832, "end": 108.432, "words": [[104.937, 105.003], [105.016, 105.582], [105.595, 105.911], [105.924, 106.2], [106.214, 106.398], [106.411, 106.7], [107.003, 107.2], [107.214, 107.477], [107.49, 107.556], [107.569, 107.608], [107.621, 108.042]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
