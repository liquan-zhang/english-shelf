<script>
const D = {"id": "068", "title": "Calm Is Contagious", "meta": "B2 · 约 280 词 · 场景：危机沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Room Copies You", "heading_zh": "1. 整个房间都在模仿你", "rows": [[{"id": "s0_0_0", "md": "Join any outage call and you can tell within a minute how it is going.", "text": "Join any outage call and you can tell within a minute how it is going.", "zh": "随便进一个故障会议，一分钟之内你就能感觉到进展如何。", "sp": null}, {"id": "s0_0_1", "md": "Not from the graphs, but from the voices.", "text": "Not from the graphs, but from the voices.", "zh": "不是看曲线，而是听声音。", "sp": null}, {"id": "s0_0_2", "md": "Fast, overlapping speech, sharp questions, and long silences all ==signal== panic.", "text": "Fast, overlapping speech, sharp questions, and long silences all signal panic.", "zh": "语速快、抢着说话、问话很冲、长时间冷场，这些都是慌了的信号。", "sp": null}], [{"id": "s0_1_0", "md": "People in a crisis watch the person in charge and copy them.", "text": "People in a crisis watch the person in charge and copy them.", "zh": "危机中的人会盯着负责的那个人，跟着他学。", "sp": null}, {"id": "s0_1_1", "md": "If the lead talks quickly and sounds ==irritated==, everyone speeds up and starts making small mistakes.", "text": "If the lead talks quickly and sounds irritated, everyone speeds up and starts making small mistakes.", "zh": "如果指挥说话很快、听着很烦躁，所有人都会跟着提速，开始犯小错。", "sp": null}, {"id": "s0_1_2", "md": "If the lead sounds steady, the room __settles down__ and people start thinking again.", "text": "If the lead sounds steady, the room settles down and people start thinking again.", "zh": "如果指挥听起来很稳，整个会就会安定下来，大家又能开始思考了。", "sp": null}], [{"id": "s0_2_0", "md": "This matters even more on global teams.", "text": "This matters even more on global teams.", "zh": "在跨国团队里，这一点更重要。", "sp": null}, {"id": "s0_2_1", "md": "When half the call is joining from another time zone, often in a second language, a rushed voice is much harder to follow.", "text": "When half the call is joining from another time zone, often in a second language, a rushed voice is much harder to follow.", "zh": "当会上一半人是从另一个时区接进来的，而且常常用的是第二语言，急促的语速会让人更难跟上。", "sp": null}, {"id": "s0_2_2", "md": "Speaking calmly is also speaking clearly, and clarity saves minutes.", "text": "Speaking calmly is also speaking clearly, and clarity saves minutes.", "zh": "说话冷静，也就是说话清楚，而清楚能省下好几分钟。", "sp": null}], [{"id": "s0_3_0", "md": "**Your tone during an incident is part of the fix, not a side detail.**", "text": "Your tone during an incident is part of the fix, not a side detail.", "zh": "故障期间你的语气本身就是修复的一部分，而不是细枝末节。", "sp": null}, {"id": "s0_3_1", "md": "Calm does not mean slow or ==indifferent==.", "text": "Calm does not mean slow or indifferent.", "zh": "冷静不等于慢，也不等于无所谓。", "sp": null}, {"id": "s0_3_2", "md": "It means your voice stays level while your actions stay fast.", "text": "It means your voice stays level while your actions stay fast.", "zh": "它的意思是，声音保持平稳，动作保持迅速。", "sp": null}]]}, {"heading": "2. What a Calm Voice Sounds Like", "heading_zh": "2. 冷静的声音听起来是什么样", "rows": [[{"id": "s1_0_0", "md": "First, slow your speech down a little and lower your volume.", "text": "First, slow your speech down a little and lower your volume.", "zh": "第一，语速稍微放慢一点，音量压低一点。", "sp": null}, {"id": "s1_0_1", "md": "It feels strange, but on a call it ==projects== control.", "text": "It feels strange, but on a call it projects control.", "zh": "这感觉有点怪，但在会上它会传递出掌控感。", "sp": null}, {"id": "s1_0_2", "md": "Second, use short factual sentences, like \"Rollback is at fifty percent, and errors are flat.\"", "text": "Second, use short factual sentences, like \"Rollback is at fifty percent, and errors are flat.\"", "zh": "第二，用简短的事实句，比如「回滚到百分之五十了，报错持平。」", "sp": null}], [{"id": "s1_1_0", "md": "Third, replace blame with questions about the system.", "text": "Third, replace blame with questions about the system.", "zh": "第三，用针对系统的提问来代替追责。", "sp": null}, {"id": "s1_1_1", "md": "\"Who pushed this?\" makes people ==defensive== and quiet, exactly when you need them talking.", "text": "\"Who pushed this?\" makes people defensive and quiet, exactly when you need them talking.", "zh": "「谁推的这个？」会让人防御心起来、不吭声，偏偏这时候你最需要大家开口。", "sp": null}, {"id": "s1_1_2", "md": "\"What changed in the last hour?\" gets you the same information without the fear.", "text": "\"What changed in the last hour?\" gets you the same information without the fear.", "zh": "「过去一小时改了什么？」能拿到同样的信息，又不会让人害怕。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, __name the next step__ even when you are not sure it will work.", "text": "Finally, name the next step even when you are not sure it will work.", "zh": "最后，哪怕你不确定管不管用，也要说出下一步。", "sp": null}, {"id": "s1_2_1", "md": "\"We'll try restarting the cache nodes; if that doesn't help in five minutes, we fail over to the backup region.\"", "text": "\"We'll try restarting the cache nodes; if that doesn't help in five minutes, we fail over to the backup region.\"", "zh": "「我们先重启缓存节点；五分钟内不见效，就切到备用机房。」", "sp": null}, {"id": "s1_2_2", "md": "**People can handle bad news; what they cannot handle is not knowing what happens next.**", "text": "People can handle bad news; what they cannot handle is not knowing what happens next.", "zh": "人们扛得住坏消息；扛不住的是不知道接下来会发生什么。", "sp": null}, {"id": "s1_2_3", "md": "A ==composed== lead gives them that, one step at a time.", "text": "A composed lead gives them that, one step at a time.", "zh": "一个镇定的指挥，就是一步一步地把这个交给大家。", "sp": null}]]}], "gist": [{"q": "作者说在故障电话里，怎么判断事情进展如何？", "a": "听声音而不是看图表：语速快、抢话、尖锐提问和长时间沉默都说明大家在慌。"}, {"q": "为什么说语气是修复的一部分？", "a": "人们会模仿负责人：负责人急躁大家就加速出错，负责人稳住大家才能重新思考。冷静不等于慢或冷漠。"}, {"q": "让声音显得冷静的具体做法有哪些？", "a": "放慢语速、降低音量；用简短的事实句；用关于系统的提问代替追责；即使不确定也说出下一步。"}], "dictation": [{"id": "s0_3_0", "text": "Your tone during an incident is part of the fix, not a side detail."}, {"id": "s0_3_2", "text": "It means your voice stays level while your actions stay fast."}, {"id": "s1_1_2", "text": "\"What changed in the last hour?\" gets you the same information without the fear."}, {"id": "s1_2_2", "text": "People can handle bad news; what they cannot handle is not knowing what happens next."}], "shadow": {"text": "Calm does not mean slow or indifferent. It means your voice stays level while your actions stay fast.", "marked": "<b>Calm</b> does not mean / <b>slow</b> / or <b>indifferent</b>. //<br>It means your <b>voice</b> stays level / while your <b>actions</b> / stay <b>fast</b>. //"}, "prompts": [{"q": "故障电话里大家抢着说话、互相质问“谁改的”。你接过话头，用 30 秒让大家冷静下来并给出下一步。", "ref": "Okay, let's take a breath. Here's where we are: errors are still high, but they're not getting worse. We don't need to know who changed what right now. The useful question is, what changed in the last hour? Arjun, can you pull the deploy log? Meanwhile, we'll restart the cache nodes. If that doesn't help in five minutes, we fail over. Next check-in at ten past.", "ref_zh": "好，大家先缓口气。现在的情况是：报错还是很高，但没有继续恶化。现在不需要搞清楚谁改了什么。有用的问题是，过去一小时改了什么？Arjun，你能把部署记录拉一下吗？同时我们先重启缓存节点。五分钟内不见效，我们就切机房。十分的时候再碰一次。", "id": "ref0"}, {"q": "你的经理在故障中不停在群里追问、语气很急。私下用 30 秒跟他沟通，请他配合保持冷静的节奏。", "ref": "Hey, I know this outage is stressful, and you're getting pressure from above. One thing that would really help: the team is reading every message you send, and the fast questions are making people rush. Could we agree that I'll send you a short update every fifteen minutes, and you route your questions through me? That keeps the engineers focused, and you still get what you need.", "ref_zh": "嘿，我知道这次故障压力很大，上面也在给你压力。有件事会很有帮助：团队会看你发的每一条消息，连珠炮式的追问会让大家手忙脚乱。我们能不能这样约定：我每十五分钟给你发一条简短同步，你的问题都通过我来转？这样工程师能专心干活，你也能拿到你需要的信息。", "id": "ref1"}], "words": [{"w": "signal (v.)", "ipa": "/ˈsɪɡnəl/", "zh": "表明、预示", "ex": "A sudden drop in traffic usually signals a client-side bug.", "tts_w": "signal", "id": "w0"}, {"w": "irritated", "ipa": "/ˈɪrɪˌteɪtɪd/", "zh": "恼火的、烦躁的", "ex": "He sounded irritated when the vendor missed the deadline again.", "id": "w1"}, {"w": "indifferent", "ipa": "/ɪnˈdɪfərənt/", "zh": "冷漠的、漠不关心的", "ex": "Users aren't indi const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;

function step(id, name, time, how, body) {

  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
