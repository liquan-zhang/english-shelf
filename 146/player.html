<script>
const D = {"id": "146", "type": "dialogue", "title": "Calling Customer Service", "meta": "B2 · 约 290 词 · 场景：宽带客服：报障与退款", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Customer Service Agent", "name_zh": "客服专员", "voice": "en-AU-NatashaNeural"}}, "gist": [{"q": "「你」家的宽带出了什么问题？客服怎么说？", "a": "从周一晚上就断网了，重启路由器也没用；客服说是区域故障，今晚六点前恢复，不行就免费派技术员。"}, {"q": "账单有什么问题？多久能退款？", "a": "这个月被扣了两次五十九块；客服提了工单给账务部门，一般五到七个工作日。"}, {"q": "「你」还争取到了什么？", "a": "拿到了工单号并复述确认，还争取到下期账单抵扣十块钱的断网补偿。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, thanks. I've been on hold for twenty minutes, so I'm glad to finally reach a person."}, {"id": "s0_7_0", "text": "Yes, several times. The light keeps blinking red, and I've already checked all the cables."}, {"id": "s1_6_0", "text": "That's fine. Could I get a reference number, so I don't have to explain everything again?"}, {"id": "s1_10_0", "text": "Thanks. Also, since we had no internet for three days, is there any compensation?"}], "shadow": {"speaker": "A", "text": "One more thing. I think I was charged twice for this month's bill.", "marked": "One more <b>thing</b>. //<br>I think I was <b>charged twice</b> / for this month's <b>bill</b>. //"}, "prompts": [{"q": "你网购的儿童安全座椅送错了型号。打电话给客服：说清订单、问题和你要的解决方案（换货并上门取件）。", "ref": "Hi, I'm calling about an order I received yesterday. It's a child car seat, but it's the wrong model. I ordered the one for toddlers, and you sent the infant version. I'd like to exchange it for the right one. Could you arrange for someone to pick up the wrong seat? And could I get a reference number for this?", "ref_zh": "你好，我打电话是关于昨天收到的一个订单。是儿童安全座椅，但型号送错了。我订的是幼儿款，你们送来的是婴儿款。我想换成正确的那款。能安排人上门把错的取走吗？另外能给我一个工单号吗？", "id": "ref0"}, {"q": "你已经打了三次电话投诉同一个问题，还没解决。礼貌但坚定地要求升级处理。", "ref": "Hi, this is my third call about the same issue, and it's still not fixed. I have the reference number from last week. I understand it's not your fault, but I'd like to escalate this. Could you put me through to a supervisor, or have someone senior call me back today? I really need a clear timeline this time.", "ref_zh": "你好，这个问题我已经是第三次打电话了，还是没解决。我有上周的工单号。我知道这不是你的错，但我希望升级处理。能帮我转给主管吗？或者今天让负责人给我回个电话？这次我真的需要一个明确的时间表。", "id": "ref1"}], "words": [{"w": "broadband", "ipa": "/ˈbrɔːdbænd/", "zh": "宽带", "ex": "We pay about fifty dollars a month for home broadband.", "id": "w0"}, {"w": "router", "ipa": "/ˈraʊtər/", "zh": "路由器", "ex": "Try unplugging the router for thirty seconds.", "id": "w1"}, {"w": "outage", "ipa": "/ˈaʊtɪdʒ/", "zh": "（服务）中断，故障", "ex": "There was a power outage in our block last night.", "id": "w2"}, {"w": "restore", "ipa": "/rɪˈstɔːr/", "zh": "恢复", "ex": "Water supply will be restored by noon.", "id": "w3"}, {"w": "payment", "ipa": "/ˈpeɪmənt/", "zh": "付款，扣款", "ex": "The payment didn't go through, so I tried again.", "id": "w4"}, {"w": "refund", "ipa": "/ˈriːfʌnd/", "zh": "退款", "ex": "I asked for a refund because the shoes didn't fit.", "id": "w5"}, {"w": "ticket", "ipa": "/ˈtɪkɪt/", "zh": "（客服）工单", "ex": "I've raised a ticket, and someone will email you.", "id": "w6"}, {"w": "compensation", "ipa": "/ˌkɑːmpenˈseɪʃən/", "zh": "补偿，赔偿", "ex": "The airline offered us compensation for the delay.", "id": "w7"}, {"w": "credit (n.)", "ipa": "/ˈkredɪt/", "zh": "（账户）抵扣额", "ex": "They gave me a twenty-dollar credit on my next bill.", "tts_w": "credit", "id": "w8"}, {"w": "read back", "ipa": "/riːd bæk/", "zh": "复述确认", "ex": "Let me read back your order to make sure it's right.", "id": "w9"}], "sections": [{"heading": "1. Getting Through to a Person", "heading_zh": "1. 终于接通人工", "rows": [[{"id": "s0_0_0", "md": "Thanks for holding. My name's Natasha. How can I help you today?", "text": "Thanks for holding. My name's Natasha. How can I help you today?", "zh": "感谢您的耐心等待，我是 Natasha。今天有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, thanks. I've been on hold for twenty minutes, so I'm glad to finally reach a person.**", "text": "Hi, thanks. I've been on hold for twenty minutes, so I'm glad to finally reach a person.", "zh": "你好，谢谢。我等了二十分钟，终于接通真人了。", "sp": "A"}], [{"id": "s0_2_0", "md": "I'm sorry about the wait. We've had a lot of calls this morning.", "text": "I'm sorry about the wait. We've had a lot of calls this morning.", "zh": "抱歉让您久等了，今天早上来电特别多。", "sp": "B"}], [{"id": "s0_3_0", "md": "No worries. Our home ==broadband== has been down since Monday night.", "text": "No worries. Our home broadband has been down since Monday night.", "zh": "没事。我家的宽带从周一晚上就断了。", "sp": "A"}], [{"id": "s0_4_0", "md": "That's frustrating. Could I get the phone number on the account?", "text": "That's frustrating. Could I get the phone number on the account?", "zh": "那确实很烦。能告诉我账户上登记的电话号码吗？", "sp": "B"}], [{"id": "s0_5_0", "md": "Sure, it's nine one two three, four five six seven.", "text": "Sure, it's nine one two three, four five six seven.", "zh": "好的，是九一二三，四五六七。", "sp": "A"}], [{"id": "s0_6_0", "md": "Thanks, Mr Lee. Have you tried restarting the ==router==?", "text": "Thanks, Mr Lee. Have you tried restarting the router?", "zh": "谢谢，李先生。您试过重启路由器吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Yes, __several times__. The light keeps blinking red, and I've already checked all the cables.", "text": "Yes, several times. The light keeps blinking red, and I've already checked all the cables.", "zh": "试了好几次。指示灯一直闪红灯，线我也都检查过了。", "sp": "A"}], [{"id": "s0_8_0", "md": "Okay, I can see an ==outage== in your area. Service should be ==restored== by six tonight.", "text": "Okay, I can see an outage in your area. Service should be restored by six tonight.", "zh": "好的，我这边看到您所在区域有网络故障，今晚六点前应该能恢复。", "sp": "B"}], [{"id": "s0_9_0", "md": "**And if it's still not working by then, what's the next step?**", "text": "And if it's still not working by then, what's the next step?", "zh": "那如果到时候还是不行，下一步怎么办？", "sp": "A"}], [{"id": "s0_10_0", "md": "Just call us back, and we'll send a technician __free of charge__.", "text": "Just call us back, and we'll send a technician free of charge.", "zh": "您再打给我们，我们会免费派技术员上门。", "sp": "B"}]]}, {"heading": "2. A Billing Problem", "heading_zh": "2. 账单出了问题", "rows": [[{"id": "s1_0_0", "md": "One more thing. I think I __was charged twice__ for this month's bill.", "text": "One more thing. I think I was charged twice for this month's bill.", "zh": "还有一件事。我这个月的账单好像被扣了两次款。", "sp": "A"}], [{"id": "s1_1_0", "md": "Let me have a look. Yes, I can see two ==payments== of fifty-nine dollars on the fifth.", "text": "Let me have a look. Yes, I can see two payments of fifty-nine dollars on the fifth.", "zh": "我看一下。是的，五号有两笔五十九块的扣款。", "sp": "B"}], [{"id": "s1_2_0", "md": "Could you refund one of them, please?", "text": "Could you refund one of them, please?", "zh": "能把其中一笔退给我吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "I can't process the ==refund== myself, but I can raise a ==ticket== with our billing team.", "text": "I can't process the refund myself, but I can raise a ticket with our billing team.", "zh": "我这边没法直接退款，不过可以给账务部门提一个工单。", "sp": "B"}], [{"id": "s1_4_0", "md": "Okay. How long will that take?", "text": "Okay. How long will that take?", "zh": "好的。大概要多久？", "sp": "A"}], [{"id": "s1_5_0", "md": "Usually five to seven working days.", "text": "Usually five to seven working days.", "zh": "一般五到七个工作日。", "sp": "B"}], [{"id": "s1_6_0", "md": "**That's fine. Could I get a reference number, so I don't have to explain everything again?**", "text": "That's fine. Could I get a reference number, so I don't have to explain everything again?", "zh": "可以。能给我一个工单号吗？这样我就不用从头再讲一遍了。", "sp": "A"}], [{"id": "s1_7_0", "md": "Of course. It's C S, four eight two, seven one nine.", "text": "Of course. It's C S, four eight two, seven one nine.", "zh": "当然。工单号是 C S，四八二，七一九。", "sp": "B"}], [{"id": "s1_8_0", "md": "Let me __read that back__. C S, four eight two, seven one nine?", "text": "Let me read that back. C S, four eight two, seven one nine?", "zh": "我复述一下：C S，四八二，七一九，对吗？", "sp": "A"}], [{"id": "s1_9_0", "md": "That's right. You'll also get an email confirmation within the hour.", "text": "That's right. You'll also get an email confirmation within the hour.", "zh": "没错。一小时内您还会收到确认邮件。", "sp": "B"}], [{"id": "s1_10_0", "md": "Thanks. Also, since we had no internet for three days, is there any ==compensation==?", "text": "Thanks. Also, since we had no internet for three days, is there any compensation?", "zh": "谢谢。另外，我们家断网三天了，有没有什么补偿？", "sp": "A"}], [{"id": "s1_11_0", "md": "Fair question. I can apply a ten-dollar ==credit== to your next bill.", "text": "Fair question. I can apply a ten-dollar credit to your next bill.", "zh": "这个问得合理。我可以在您下期账单里抵扣十块钱。", "sp": "B"}], [{"id": "s1_12_0", "md": "I appreciate that. Thanks for your help, Natasha.", "text": "I appreciate that. Thanks for your help, Natasha.", "zh": "谢谢，感谢你的帮助，Natasha。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Getting Through to a Person", "zh": "1. 终于接通人工", "start": 0.0, "end": 2.328, "words": [[0.105, 0.368], [0.697, 0.961], [0.974, 1.197], [1.211, 1.355], [1.368, 1.447], [1.461, 1.934]]}, {"kind": "s", "id": "s0_0_0", "md": "Thanks for holding. My name's Natasha. How can I help you today?", "zh": "感谢您的耐心等待，我是 Natasha。今天有什么可以帮您？", "sp": "B", "gap": false, "start": 2.328, "end": 9.144, "words": [[2.431, 2.733], [2.786, 2.904], [2.917, 3.391], [4.46, 4.617], [4.71, 5.039], [5.065, 5.657], [6.749, 6.867], [6.973, 7.091], [7.131, 7.196], [7.249, 7.473], [7.525, 7.67], [7.67, 8.012]]}, {"kind": "s", "id": "s0_1_0", "md": "**Hi, thanks. I've been on hold for twenty minutes, so I'm glad to finally reach a person.**", "zh": "你好，谢谢。我等了二十分钟，终于接通真人了。", "sp": "A", "gap": false, "start": 9.144, "end": 14.544, "words": [[9.262, 9.407], [9.433, 9.881], [10.315, 10.447], [10.46, 10.591], [10.605, 10.736], [10.749, 11.039], [11.052, 11.183], [11.197, 11.473], [11.486, 11.947], [12.223, 12.381], [12.394, 12.499], [12.512, 12.894], [12.907, 12.973], [12.986, 13.42], [13.433, 13.618], [13.631, 13.683 const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
