<script>
const D = {"id": "146", "type": "dialogue", "title": "Calling Customer Service", "meta": "B2 · 约 290 词 · 场景：宽带客服：报障与退款", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Customer Service Agent", "name_zh": "客服专员", "voice": "en-AU-NatashaNeural"}}, "gist": [{"q": "「你」家的宽带出了什么问题？客服怎么说？", "a": "从周一晚上就断网了，重启路由器也没用；客服说是区域故障，今晚六点前恢复，不行就免费派技术员。"}, {"q": "账单有什么问题？多久能退款？", "a": "这个月被扣了两次五十九块；客服提了工单给账务部门，一般五到七个工作日。"}, {"q": "「你」还争取到了什么？", "a": "拿到了工单号并复述确认，还争取到下期账单抵扣十块钱的断网补偿。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, thanks. I've been on hold for twenty minutes, so I'm glad to finally reach a person."}, {"id": "s0_7_0", "text": "Yes, several times. The light keeps blinking red, and I've already checked all the cables."}, {"id": "s1_6_0", "text": "That's fine. Could I get a reference number, so I don't have to explain everything again?"}, {"id": "s1_10_0", "text": "Thanks. Also, since we had no internet for three days, is there any compensation?"}], "shadow": {"speaker": "A", "text": "One more thing. I think I was charged twice for this month's bill.", "marked": "One more <b>thing</b>. //<br>I think I was <b>charged twice</b> / for this month's <b>bill</b>. //"}, "prompts": [{"q": "你网购的儿童安全座椅送错了型号。打电话给客服：说清订单、问题和你要的解决方案（换货并上门取件）。", "ref": "Hi, I'm calling about an order I received yesterday. It's a child car seat, but it's the wrong model. I ordered the one for toddlers, and you sent the infant version. I'd like to exchange it for the right one. Could you arrange for someone to pick up the wrong seat? And could I get a reference number for this?", "ref_zh": "你好，我打电话是关于昨天收到的一个订单。是儿童安全座椅，但型号送错了。我订的是幼儿款，你们送来的是婴儿款。我想换成正确的那款。能安排人上门把错的取走吗？另外能给我一个工单号吗？", "id": "ref0"}, {"q": "你已经打了三次电话投诉同一个问题，还没解决。礼貌但坚定地要求升级处理。", "ref": "Hi, this is my third call about the same issue, and it's still not fixed. I have the reference number from last week. I understand it's not your fault, but I'd like to escalate this. Could you put me through to a supervisor, or have someone senior call me back today? I really need a clear timeline this time.", "ref_zh": "你好，这个问题我已经是第三次打电话了，还是没解决。我有上周的工单号。我知道这不是你的错，但我希望升级处理。能帮我转给主管吗？或者今天让负责人给我回个电话？这次我真的需要一个明确的时间表。", "id": "ref1"}], "words": [{"w": "broadband", "ipa": "/ˈbrɔːdbænd/", "zh": "宽带", "ex": "We pay about fifty dollars a month for home broadband.", "id": "w0"}, {"w": "router", "ipa": "/ˈraʊtər/", "zh": "路由器", "ex": "Try unplugging the router for thirty seconds.", "id": "w1"}, {"w": "outage", "ipa": "/ˈaʊtɪdʒ/", "zh": "（服务）中断，故障", "ex": "There was a power outage in our block last night.", "id": "w2"}, {"w": "restore", "ipa": "/rɪˈstɔːr/", "zh": "恢复", "ex": "Water supply will be restored by noon.", "id": "w3"}, {"w": "payment", "ipa": "/ˈpeɪmənt/", "zh": "付款，扣款", "ex": "The payment didn't go through, so I tried again.", "id": "w4"}, {"w": "refund", "ipa": "/ˈriːfʌnd/", "zh": "退款", "ex": "I asked for a refund because the shoes didn't fit.", "id": "w5"}, {"w": "ticket", "ipa": "/ˈtɪkɪt/", "zh": "（客服）工单", "ex": "I've raised a ticket, and someone will email you.", "id": "w6"}, {"w": "compensation", "ipa": "/ˌkɑːmpenˈseɪʃən/", "zh": "补偿，赔偿", "ex": "The airline offered us compensation for the delay.", "id": "w7"}, {"w": "credit (n.)", "ipa": "/ˈkredɪt/", "zh": "（账户）抵扣额", "ex": "They gave me a twenty-dollar credit on my next bill.", "tts_w": "credit", "id": "w8"}, {"w": "read back", "ipa": "/riːd bæk/", "zh": "复述确认", "ex": "Let me read back your order to make sure it's right.", "id": "w9"}], "sections": [{"heading": "1. Getting Through to a Person", "heading_zh": "1. 终于接通人工", "rows": [[{"id": "s0_0_0", "md": "Thanks for holding. My name's Natasha. How can I help you today?", "text": "Thanks for holding. My name's Natasha. How can I help you today?", "zh": "感谢您的耐心等待，我是 Natasha。今天有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, thanks. I've been on hold for twenty minutes, so I'm glad to finally reach a person.**", "text": "Hi, thanks. I've been on hold for twenty minutes, so I'm glad to finally reach a person.", "zh": "你好，谢谢。我等了二十分钟，终于接通真人了。", "sp": "A"}], [{"id": "s0_2_0", "md": "I'm sorry about the wait. We've had a lot of calls this morning.", "text": "I'm sorry about the wait. We've had a lot of calls this morning.", "zh": "抱歉让您久等了，今天早上来电特别多。", "sp": "B"}], [{"id": "s0_3_0", "md": "No worries. Our home ==broadband== has been down since Monday night.", "text": "No worries. Our home broadband has been down since Monday night.", "zh": "没事。我家的宽带从周一晚上就断了。", "sp": "A"}], [{"id": "s0_4_0", "md": "That's frustrating. Could I get the phone number on the account?", "text": "That's frustrating. Could I get the phone number on the account?", "zh": "那确实很烦。能告诉我账户上登记的电话号码吗？", "sp": "B"}], [{"id": "s0_5_0", "md": "Sure, it's nine one two three, four five six seven.", "text": "Sure, it's nine one two three, four five six seven.", "zh": "好的，是九一二三，四五六七。", "sp": "A"}], [{"id": "s0_6_0", "md": "Thanks, Mr Lee. Have you tried restarting the ==router==?", "text": "Thanks, Mr Lee. Have you tried restarting the router?", "zh": "谢谢，李先生。您试过重启路由器吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Yes, __several times__. The light keeps blinking red, and I've already checked all the cables.", "text": "Yes, several times. The light keeps blinking red, and I've already checked all the cables.", "zh": "试了好几次。指示灯一直闪红灯，线我也都检查过了。", "sp": "A"}], [{"id": "s0_8_0", "md": "Okay, I can see an ==outage== in your area. Service should be ==restored== by six tonight.", "text": "Okay, I can see an outage in your area. Service should be restored by six tonight.", "zh": "好的，我这边看到您所在区域有网络故障，今晚六点前应该能恢复。", "sp": "B"}], [{"id": "s0_9_0", "md": "**And if it's still not working by then, what's the next step?**", "text": "And if it's still not working by then, what's the next step?", "zh": "那如果到时候还是不行，下一步怎么办？", "sp": "A"}], [{"id": "s0_10_0", "md": "Just call us back, and we'll send a technician __free of charge__.", "text": "Just call us back, and we'll send a technician free of charge.", "zh": "您再打给我们，我们会免费派技术员上门。", "sp": "B"}]]}, {"heading": "2. A Billing Problem", "heading_zh": "2. 账单出了问题", "rows": [[{"id": "s1_0_0", "md": "One more thing. I think I __was charged twice__ for this month's bill.", "text": "One more thing. I think I was charged twice for this month's bill.", "zh": "还有一件事。我这个月的账单好像被扣了两次款。", "sp": "A"}], [{"id": "s1_1_0", "md": "Let me have a look. Yes, I can see two ==payments== of fifty-nine dollars on the fifth.", "text": "Let me have a look. Yes, I can see two payments of fifty-nine dollars on the fifth.", "zh": "我看一下。是的，五号有两笔五十九块的扣款。", "sp": "B"}], [{"id": "s1_2_0", "md": "Could you refund one of them, please?", "text": "Could you refund one of them, please?", "zh": "能把其中一笔退给我吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "I can't process the ==refund== myself, but I can raise a ==ticket== with our billing team.", "text": "I can't process the refund myself, but I can raise a ticket with our billing team.", "zh": "我这边没法直接退款，不过可以给账务部门提一个工单。", "sp": "B"}], [{"id": "s1_4_0", "md": "Okay. How long will that take?", "text": "Okay. How long will that take?", "zh": "好的。大概要多久？", "sp": "A"}], [{"id": "s1_5_0", "md": "Usually five to seven working days.", "text": "Usually five to seven working days.", "zh": "一般五到七个工作日。", "sp": "B"}], [{"id": "s1_6_0", "md": "**That's fine. Could I get a reference number, so I don't have to explain everything again?**", "text": "That's fine. Could I get a reference number, so I don't have to explain everything again?", "zh": "可以。能给我一个工单号吗？这样我就不用从头再讲一遍了。", "sp": "A"}], [{"id": "s1_7_0", "md": "Of course. It's C S, four eight two, seven one nine.", "text": "Of course. It's C S, four eight two, seven one nine.", "zh": "当然。工单号是 C S，四八二，七一九。", "sp": "B"}], [{"id": "s1_8_0", "md": "Let me __read that back__. C S, four eight two, seven one nine?", "text": "Let me read that back. C S, four eight two, seven one nine?", "zh": "我复述一下：C S，四八二，七一九，对吗？", "sp": "A"}], [{"id": "s1_9_ const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  h('div', {},
    h('audio', { controls: '', src: src('track'), preload: 'none' }),

      h('details', {}, h('summary', {}, '看答案'), h('div', {}, g.a)))))));

// 2 dictation
main.append(step('s2', '② 听写', '4 分钟', '每句可以反复听，听到能完整写出来为止。点「核对」后，<span style="color:var(--bad)">红色</span>是漏听或听错的词。',
  h('div', {}, ...D.dictation.map((d, i) => {
    const ta = h('textarea', { placeholder: '把听到的句子打出来…' });
    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening

for (const sec of D.sections) {

  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
