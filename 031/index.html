<script>
const D = {"id": "031", "title": "Getting Five Minutes with Your Skip-Level", "meta": "B2 · 约 270 词 · 场景：隔级沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What Your Skip-Level Cannot See", "heading_zh": "1. 隔级老板看不到的东西", "rows": [[{"id": "s0_0_0", "md": "Your manager's manager runs a group of eighty people.", "text": "Your manager's manager runs a group of eighty people.", "zh": "你老板的老板管着一个八十人的大组。", "sp": null}, {"id": "s0_0_1", "md": "Most of what reaches them has been ==filtered== through two layers of managers and cleaned up for slides.", "text": "Most of what reaches them has been filtered through two layers of managers and cleaned up for slides.", "zh": "传到他那儿的大部分信息，都已经被两层经理过滤过，还为了做 slides 修饰过。", "sp": null}, {"id": "s0_0_2", "md": "That is why five minutes with someone close to the work can be worth more to them than another dashboard.", "text": "That is why five minutes with someone close to the work can be worth more to them than another dashboard.", "zh": "所以，跟一个离一线很近的人聊五分钟，对他来说可能比再看一个大盘更有价值。", "sp": null}], [{"id": "s0_1_0", "md": "**Your skip-level does not need a status update; they need a view they cannot get from a report.**", "text": "Your skip-level does not need a status update; they need a view they cannot get from a report.", "zh": "隔级老板不需要你汇报进度；他需要的是从报告里看不到的视角。", "sp": null}, {"id": "s0_1_1", "md": "Tell them what you see on the ground: where teams __get stuck__, which ==handoff== keeps failing, what users complain about most.", "text": "Tell them what you see on the ground: where teams get stuck, which handoff keeps failing, what users complain about most.", "zh": "告诉他你在一线看到了什么：团队在哪儿卡住、哪个交接环节老出问题、用户抱怨最多的是什么。", "sp": null}, {"id": "s0_1_2", "md": "Small, specific details are exactly what gets lost on the way up.", "text": "Small, specific details are exactly what gets lost on the way up.", "zh": "这些细小、具体的细节，恰恰是往上传的过程中最容易丢的。", "sp": null}], [{"id": "s0_2_0", "md": "Avoid using the time to complain about your manager.", "text": "Avoid using the time to complain about your manager.", "zh": "别把这个时间拿来抱怨你的直属经理。", "sp": null}, {"id": "s0_2_1", "md": "It puts your skip-level in an ==awkward== position and rarely changes anything.", "text": "It puts your skip-level in an awkward position and rarely changes anything.", "zh": "这会让隔级老板很尴尬，而且基本改变不了什么。", "sp": null}, {"id": "s0_2_2", "md": "If there is a real problem, __raise it with__ your manager first.", "text": "If there is a real problem, raise it with your manager first.", "zh": "如果真有问题，先跟你的经理提。", "sp": null}]]}, {"heading": "2. A Five-Minute Script", "heading_zh": "2. 五分钟谈话的准备", "rows": [[{"id": "s1_0_0", "md": "Prepare three things before the meeting.", "text": "Prepare three things before the meeting.", "zh": "开会前准备好三样东西。", "sp": null}, {"id": "s1_0_1", "md": "First, one ==observation== backed by a concrete example.", "text": "First, one observation backed by a concrete example.", "zh": "第一，一个有具体例子支撑的观察。", "sp": null}, {"id": "s1_0_2", "md": "\"Two of our launches slipped last month because the data team only takes requests through a form nobody checks.\"", "text": "\"Two of our launches slipped last month because the data team only takes requests through a form nobody checks.\"", "zh": "「上个月我们有两个项目延期了，因为数据团队只通过一个没人看的表单接需求。」", "sp": null}], [{"id": "s1_1_0", "md": "Second, one question that shows you think beyond your own team.", "text": "Second, one question that shows you think beyond your own team.", "zh": "第二，一个能体现你在思考本团队以外事情的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"What is the biggest risk you see for our group next year?\"", "text": "\"What is the biggest risk you see for our group next year?\"", "zh": "「您觉得我们组明年最大的风险是什么？」", "sp": null}, {"id": "s1_1_2", "md": "Their answer tells you what they __lose sleep over__, which helps you ==prioritize== your own work.", "text": "Their answer tells you what they lose sleep over, which helps you prioritize your own work.", "zh": "他的回答会告诉你他最睡不着觉的是什么，这能帮你给自己的工作排优先级。", "sp": null}], [{"id": "s1_2_0", "md": "Third, one small ask, if you have one.", "text": "Third, one small ask, if you have one.", "zh": "第三，如果有的话，提一个小请求。", "sp": null}, {"id": "s1_2_1", "md": "It might be an introduction to another team, or ==sponsorship== for a fix that crosses team lines.", "text": "It might be an introduction to another team, or sponsorship for a fix that crosses team lines.", "zh": "可能是请他帮你引荐另一个团队，或者为一个跨团队的修复站台。", "sp": null}, {"id": "s1_2_2", "md": "**Keep the ask small enough that they can say yes on the spot.**", "text": "Keep the ask small enough that they can say yes on the spot.", "zh": "请求要小到他当场就能答应。", "sp": null}], [{"id": "s1_3_0", "md": "Afterwards, tell your manager what you discussed.", "text": "Afterwards, tell your manager what you discussed.", "zh": "事后，把聊了什么告诉你的经理。", "sp": null}, {"id": "s1_3_1", "md": "When your manager is never surprised, both relationships stay healthy, and the next meeting is easier to get.", "text": "When your manager is never surprised, both relationships stay healthy, and the next meeting is easier to get.", "zh": "经理永远不会被蒙在鼓里，两边的关系才能都保持健康，下次也更容易约到时间。", "sp": null}]]}], "gist": [{"q": "为什么和隔级老板的五分钟对他们有价值？", "a": "他们收到的信息经过两层经理过滤和美化，一线的具体细节正是他们缺少的视角。"}, {"q": "文章提醒不要在这个时间里做什么？", "a": "不要抱怨自己的直属经理，这会让隔级老板很尴尬，也很少改变什么；真有问题先找直属经理。"}, {"q": "五分钟里应该准备哪三样东西？之后还要做什么？", "a": "一个有具体例子的观察、一个超出本团队视角的问题、一个对方能当场答应的小请求；之后把谈话内容告诉直属经理。"}], "dictation": [{"id": "s0_1_0", "text": "Your skip-level does not need a status update; they need a view they cannot get from a report."}, {"id": "s1_2_2", "text": "Keep the ask small enough that they can say yes on the spot."}, {"id": "s0_1_2", "text": "Small, specific details are exactly what gets lost on the way up."}, {"id": "s0_2_2", "text": "If there is a real problem, raise it with your manager first."}], "shadow": {"text": "Third, one small ask, if you have one. It might be an introduction to another team, or sponsorship for a fix that crosses team lines. Keep the ask small enough that they can say yes on the spot.", "marked": "Third, / one <b>small</b> ask, / if you have one. //<br>It might be an <b>introduction</b> to another team, / or <b>sponsorship</b> for a fix / that <b>crosses</b> team lines. //<br>Keep the ask <b>small</b> enough / that they can say <b>yes</b> / on the <b>spot</b>. //"}, "prompts": [{"q": "电梯里碰到隔级老板，他问「最近怎么样？」用 30 秒给他一个一线观察，而不是汇报进度。", "ref": "Pretty good, thanks. One thing I've noticed might be useful for you. Our last two launches were delayed by about a week each, and both times the reason was the same: we were waiting on access approvals from the security team. It's not anyone's fault, the queue is just manual. If it's helpful, I can write up a short note on what's slowing it down.", "ref_zh": "挺好的，谢谢。有件事我注意到了，可能对您有用。我们最近两次上线都各推迟了大约一周，两次原因都一样：在等安全团队的权限审批。这不是谁的错，只是整个流程是人工排队的。如果有帮助的话，我可以写个简短的说明，讲讲是什么在拖慢它。", "id": "ref0"}, {"q": "隔级一对一快结束了，你想请他帮忙引荐另一个部门的负责人来推动一个跨团队修复。用 30 秒提出这个小请求。", "ref": "Before we wrap up, I have one small ask. The duplicate notification bug sits between our team and the messaging team, and right now nobody owns it. I've talked to their engineers, and they're willing, but they need their lead to prioritize it. Would you be open to introducing me to her? A short call should be enough to agree on an owner.", "ref_zh": "结束之前，我有个小请求。重复通知这个 bug 卡在我们团队和消息团队之间，现在没人负责。我跟他们的工程师聊过，他们愿意做，但需要他们的 lead 把它排进优先级。您方便帮我引荐一下她吗？简单开个短会，应该就能把负责人定下来。", "id": "ref1"}], "words": [{"w": "skip-level", "ipa": "/ˈskɪp ˌlevəl/", "zh": "隔级上级", "ex": "I have a skip-level one-on-one with the director on Friday.", "tts_w": "skip level", "id": "w0"}, {"w": "filter (v.)", "ipa": "/ˈfɪltər/", "zh": "过滤", "ex": "Bad news often gets filtered out before it reaches leadership.", "tts_w": "filter", "id": "w1"}, {"w": "handoff", "ipa": "/ˈhændɔːf/", "zh": "交接", "ex": "Most bugs appear at the handoff between design and engineering.", "id": "w2"}, {"w": "awkward", "ipa": "/ˈɔːkwərd/", "zh": "尴尬的、为难的", "ex": "It was awkward to correct the VP's numbers in fr const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
