<script>
const D = {"id": "031", "title": "Getting Five Minutes with Your Skip-Level", "meta": "B2 · 约 270 词 · 场景：隔级沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What Your Skip-Level Cannot See", "heading_zh": "1. 隔级老板看不到的东西", "rows": [[{"id": "s0_0_0", "md": "Your manager's manager runs a group of eighty people.", "text": "Your manager's manager runs a group of eighty people.", "zh": "你老板的老板管着一个八十人的大组。", "sp": null}, {"id": "s0_0_1", "md": "Most of what reaches them has been ==filtered== through two layers of managers and cleaned up for slides.", "text": "Most of what reaches them has been filtered through two layers of managers and cleaned up for slides.", "zh": "传到他那儿的大部分信息，都已经被两层经理过滤过，还为了做 slides 修饰过。", "sp": null}, {"id": "s0_0_2", "md": "That is why five minutes with someone close to the work can be worth more to them than another dashboard.", "text": "That is why five minutes with someone close to the work can be worth more to them than another dashboard.", "zh": "所以，跟一个离一线很近的人聊五分钟，对他来说可能比再看一个大盘更有价值。", "sp": null}], [{"id": "s0_1_0", "md": "**Your skip-level does not need a status update; they need a view they cannot get from a report.**", "text": "Your skip-level does not need a status update; they need a view they cannot get from a report.", "zh": "隔级老板不需要你汇报进度；他需要的是从报告里看不到的视角。", "sp": null}, {"id": "s0_1_1", "md": "Tell them what you see on the ground: where teams __get stuck__, which ==handoff== keeps failing, what users complain about most.", "text": "Tell them what you see on the ground: where teams get stuck, which handoff keeps failing, what users complain about most.", "zh": "告诉他你在一线看到了什么：团队在哪儿卡住、哪个交接环节老出问题、用户抱怨最多的是什么。", "sp": null}, {"id": "s0_1_2", "md": "Small, specific details are exactly what gets lost on the way up.", "text": "Small, specific details are exactly what gets lost on the way up.", "zh": "这些细小、具体的细节，恰恰是往上传的过程中最容易丢的。", "sp": null}], [{"id": "s0_2_0", "md": "Avoid using the time to complain about your manager.", "text": "Avoid using the time to complain about your manager.", "zh": "别把这个时间拿来抱怨你的直属经理。", "sp": null}, {"id": "s0_2_1", "md": "It puts your skip-level in an ==awkward== position and rarely changes anything.", "text": "It puts your skip-level in an awkward position and rarely changes anything.", "zh": "这会让隔级老板很尴尬，而且基本改变不了什么。", "sp": null}, {"id": "s0_2_2", "md": "If there is a real problem, __raise it with__ your manager first.", "text": "If there is a real problem, raise it with your manager first.", "zh": "如果真有问题，先跟你的经理提。", "sp": null}]]}, {"heading": "2. A Five-Minute Script", "heading_zh": "2. 五分钟谈话的准备", "rows": [[{"id": "s1_0_0", "md": "Prepare three things before the meeting.", "text": "Prepare three things before the meeting.", "zh": "开会前准备好三样东西。", "sp": null}, {"id": "s1_0_1", "md": "First, one ==observation== backed by a concrete example.", "text": "First, one observation backed by a concrete example.", "zh": "第一，一个有具体例子支撑的观察。", "sp": null}, {"id": "s1_0_2", "md": "\"Two of our launches slipped last month because the data team only takes requests through a form nobody checks.\"", "text": "\"Two of our launches slipped last month because the data team only takes requests through a form nobody checks.\"", "zh": "「上个月我们有两个项目延期了，因为数据团队只通过一个没人看的表单接需求。」", "sp": null}], [{"id": "s1_1_0", "md": "Second, one question that shows you think beyond your own team.", "text": "Second, one question that shows you think beyond your own team.", "zh": "第二，一个能体现你在思考本团队以外事情的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"What is the biggest risk you see for our group next year?\"", "text": "\"What is the biggest risk you see for our group next year?\"", "zh": "「您觉得我们组明年最大的风险是什么？」", "sp": null}, {"id": "s1_1_2", "md": "Their answer tells you what they __lose sleep over__, which helps you ==prioritize== your own work.", "text": "Their answer tells you what they lose sleep over, which helps you prioritize your own work.", "zh": "他的回答会告诉你他最睡不着觉的是什么，这能帮你给自己的工作排优先级。", "sp": null}], [{"id": "s1_2_0", "md": "Third, one small ask, if you have one.", "text": "Third, one small ask, if you have one.", "zh": "第三，如果有的话，提一个小请求。", "sp": null}, {"id": "s1_2_1", "md": "It might be an introduction to another team, or ==sponsorship== for a fix that crosses team lines.", "text": "It might be an introduction to another team, or sponsorship for a fix that crosses team lines.", "zh": "可能是请他帮你引荐另一个团队，或者为一个跨团队的修复站台。", "sp": null}, {"id": "s1_2_2", "md": "**Keep the ask small enough that they can say yes on the spot.**", "text": "Keep the ask small enough that they can say yes on the spot.", "zh": "请求要小到他当场就能答应。", "sp": null}], [{"id": "s1_3_0", "md": "Afterwards, tell your manager what you discussed.", "text": "Afterwards, tell your manager what you discussed.", "zh": "事后，把聊了什么告诉你的经理。", "sp": null}, {"id": "s1_3_1", "md": "When your manager is never surprised, both relationships stay healthy, and the next meeting is easier to get.", "text": "When your manager is never surprised, both relationships stay healthy, and the next meeting is easier to get.", "zh": "经理永远不会被蒙在鼓里，两边的关系才能都保持健康，下次也更容易约到时间。", "sp": null}]]}], "gist": [{"q": "为什么和隔级老板的五分钟对他们有价值？", "a": "他们收到的信息经过两层经理过滤和美化，一线的具体细节正是他们缺少的视角。"}, {"q": "文章提醒不要在这个时间里做什么？", "a": "不要抱怨自己的直属经理，这会让隔级老板很尴尬，也很少改变什么；真有问题先找直属经理。"}, {"q": "五分钟里应该准备哪三样东西？之后还要做什么？", "a": "一个有具体例子的观察、一个超出本团队视角的问题、一个对方能当场答应的小请求；之后把谈话内容告诉直属经理。"}], "dictation": [{"id": "s0_1_0", "text": "Your skip-level does not need a status update; they need a view they cannot get from a report."}, {"id": "s1_2_2", "text": "Keep the ask small enough that they can say yes on the spot."}, {"id": "s0_1_2", "text": "Small, specific details are exactly what gets lost on the way up."}, {"id": "s0_2_2", "text": "If there is a real problem, raise it with your manager first."}], "shadow": {"text": "Third, one small ask, if you have one. It might be an introduction to another team, or sponsorship for a fix that crosses team lines. Keep the ask small enough that they can say yes on the spot.", "marked": "Third, / one <b>small</b> ask, / if you have one. //<br>It might be an <b>introduction</b> to another team, / or <b>sponsorship</b> for a fix / that <b>crosses</b> team lines. //<br>Keep the ask <b>small</b> enough / that they can say <b>yes</b> / on the <b>spot</b>. //"}, "prompts": [{"q": "电梯里碰到隔级老板，他问「最近怎么样？」用 30 秒给他一个一线观察，而不是汇报进度。", "ref": "Pretty good, thanks. One thing I've noticed might be useful for you. Our last two launches were delayed by about a week each, and both times the reason was the same: we were waiting on access approvals from the security team. It's not anyone's fault, the queue is just manual. If it's helpful, I can write up a short note on what's slowing it down.", "ref_zh": "挺好的，谢谢。有件事我注意到了，可能对您有用。我们最近两次上线都各推迟了大约一周，两次原因都一样：在等安全团队的权限审批。这不是谁的错，只是整个流程是人工排队的。如果有帮助的话，我可以写个简短的说明，讲讲是什么在拖慢它。", "id": "ref0"}, {"q": "隔级一对一快结束了，你想请他帮忙引荐另一个部门的负责人来推动一个跨团队修复。用 30 秒提出这个小请求。", "ref": "Before we wrap up, I have one small ask. The duplicate notification bug sits between our team and the messaging team, and right now nobody owns it. I've talked to their engineers, and they're willing, but they need their lead to prioritize it. Would you be open to introducing me to her? A short call should be enough to agree on an owner.", "ref_zh": "结束之前，我有个小请求。重复通知这个 bug 卡在我们团队和消息团队之间，现在没人负责。我跟他们的工程师聊过，他们愿意做，但需要他们的 lead 把它排进优先级。您方便帮我引荐一下她吗？简单开个短会，应该就能把负责人定下来。", "id": "ref1"}], "words": [{"w": "skip-level", "ipa": "/ˈskɪp ˌlevəl/", "zh": "隔级上级", "ex": "I have a skip-level one-on-one with the director on Friday.", "tts_w": "skip level", "id": "w0"}, {"w": "filter (v.)", "ipa": "/ˈfɪltər/", "zh": "过滤", "ex": "Bad news often gets filtered out before it reaches leadership.", "tts_w": "filter", "id": "w1"}, {"w": "handoff", "ipa": "/ˈhændɔːf/", "zh": "交接", "ex": "Most bugs appear at the handoff between design and engineering.", "id": "w2"}, {"w": "awkward", "ipa": "/ˈɔːkwərd/", "zh": "尴尬的、为难的", "ex": "It was awkward to correct the VP's numbers in front of everyone.", "tts": "It was awkward to correct the vice president's numbers in front of everyone.", "id": "w3"}, {"w": "observation", "ipa": "/ˌɑːbzərˈveɪʃən/", "zh": "观察、看到的情况", "ex": "One observation from on-call: most pages come from the same service.", "id": "w4"}, {"w": "prioritize", "ipa": "/praɪˈɔːrətaɪz/", "zh": "确定优先级", "ex": "We need to prioritize the login bug over new features.", "id": "w5"}, {"w": "sponsorship", "ipa": "/ˈspɑːnsərʃɪp/", "zh": "（高层）支持、背书", "ex": "Without executive sponsorship, the cross-team cleanup will stall.", "id": "w6"}, {"w": "on the spot", "ipa": "/ɑːn ðə ˈspɑːt/", "zh": "当场", "ex": "She approved the extra budget on the spot.", "id": "w7"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. What Your Skip-Level Cannot See", "zh": "1. 隔级老板看不到的东西", "start": 0.0, "end": 2.688, "words": [[0.105, 0.355], [0.711, 0.855], [0.868, 1.0], [1.013, 1.579], [1.592, 1.947], [1.961, 2.303]]}, {"kind": "s", "id": "s0_0_0", "md": "Your manager's manager runs a group of eighty people.", "zh": "你老板的老板管着一个八十人的大组。", "sp": null, "gap": false, "start": 2.688, "end": 6.216, "words": [[2.793, 2.885], [2.899, 3.385], [3.399, 3.899], [3.912, 4.135], [4.149, 4.214], [4.227, 4.622], [4.833, 5.004], [5.162, 5.372], [5.385, 5.82]]}, {"kind": "s", "id": "s0_0_1", "md": "Most of what reaches them has been ==filtered== through two layers of managers and cleaned up for slides.", "zh": "传到他那儿的大部分信息，都已经被两层经理过滤过，还为了做 slides 修饰过。", "sp": null, "gap": false, "start": 6.216, "end": 12.24, "words": [[6.321, 6.571], [6.584, 6.65], [6.663, 6.848], [6.861, 7.269], [7.282, 7.479], [7.492, 7.637], [7.65, 7.808], [7.821, 8.361], [8.374, 8.598], [8.611, 8.94], [8.953, 9.334], [9.348, 9.427], [9.44, 10.137], [10.4, 10.519], [10.532, 10.887], [10.9, 11.032], [11.045, 11.19], [11.203, 11.861]]}, {"kind": "s", "id": "s0_0_2", "md": "That is why five minutes with someone close to the work can be worth more to them than another dashboard.", "zh": "所以，跟一个离一线很近的人聊五分钟，对他来说可能比再看一个大盘更有 ], [74.019, 74.177], [74.19, 74.545]]}, {"kind": "s", "id": "s1_2_0", "md": "Third, one small ask, if you have one.", "zh": "第三，如果有的话，提一个小请求。", "sp": null, "gap": true, "start": 74.928, "end": 78.072, "words": [[75.086, 75.507], [75.889, 76.073], [76.086, 76.415], [76.428, 76.81], [76.994, 77.073], [77.086, 77.178], [77.191, 77.428], [77.441, 77.691]]}, {"kind": "s", "id": "s1_2_1", "md": "It might be an introduction to another team, or ==sponsorship== for a fix that crosses team lines.", "zh": "可能是请他帮你引荐另一个团队，或者为一个跨团队的修复站台。", "sp": null, "gap": false, "start": 78.072, "end": 83.928, "words": [[78.177, 78.256], [78.269, 78.48], [78.493, 78.625], [78.638, 78.717], [78.73, 79.401], [79.414, 79.546], [79.559, 79.914], [79.927, 80.309], [80.73, 80.809], [80.822, 81.467], [81.48, 81.651], [81.664, 81.704], [81.717, 82.098], [82.111, 82.243], [82.256, 82.73], [82.743, 82.993], [83.006, 83.533]]}, {"kind": "s", "id": "s1_2_2", "md": "**Keep the ask small enough that they can say yes on the spot.**", "zh": "请求要小到他当场就能答应。", "sp": null, "gap": false, "start": 83.928, "end": 87.504, "words": [[84.033, 84.244], [84.257, 84.375], [84.389, 84.717], [84.731, 85.099], [85.112, 85.402], [85.415, 85.546], [85.56, 85.678], [85.691, 85.823], [85.836, 86.099], [86.112, 86.441], [86.454, 86.533], [86.546, 86.612], [86.625, 87.099]]}, {"kind": "s", "id": "s1_3_0", "md": "Afterwards, tell your manager what you discussed.", "zh": "事后，把聊了什么告诉你的经理。", "sp": null, "gap": true, "start": 87.504, "end": 90.576, "words": [[87.609, 88.267], [88.53, 88.701], [88.715, 88.846], [88.859, 89.28], [89.293, 89.425], [89.438, 89.517], [89.53, 90.175]]}, {"kind": "s", "id": "s1_3_1", "md": "When your manager is never surprised, both relationships stay healthy, and the next meeting is easier to get.", "zh": "经理永远不会被蒙在鼓里，两边的关系才能都保持健康，下次也更容易约到时间。", "sp": null, "gap": false, "start": 90.576, "end": 97.464, "words": [[90.694, 90.787], [90.8, 90.892], [90.905, 91.405], [91.418, 91.589], [91.602, 91.905], [91.918, 92.615], [92.879, 93.129], [93.142, 93.879], [93.892, 94.155], [94.168, 94.681], [94.997, 95.089], [95.102, 95.181], [95.194, 95.484], [95.497, 95.852], [96.063, 96.194], [96.273, 96.642], [96.655, 96.721], [96.734, 97.076]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
