<script>
const D = {"id": "050", "title": "Handling a Turf War", "meta": "B2 · 约 280 词 · 场景：团队边界冲突", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. How Turf Wars Start", "heading_zh": "1. 地盘之争是怎么开始的", "rows": [[{"id": "s0_0_0", "md": "Two teams discover, in the same quarterly review, that both are building a notification service.", "text": "Two teams discover, in the same quarterly review, that both are building a notification service.", "zh": "两个团队在同一次季度 review 上发现，双方都在做一个通知服务。", "sp": null}, {"id": "s0_0_1", "md": "Each has a design doc, a roadmap, and a manager who has already promised it upward.", "text": "Each has a design doc, a roadmap, and a manager who has already promised it upward.", "zh": "每边都有设计文档、有 roadmap，还有一个已经向上承诺过的老板。", "sp": null}, {"id": "s0_0_2", "md": "Within a week, design reviews turn into ==debates== about history, and nobody shares code.", "text": "Within a week, design reviews turn into debates about history, and nobody shares code.", "zh": "不到一周，设计评审就变成了翻旧账，谁也不共享代码。", "sp": null}], [{"id": "s0_1_0", "md": "Turf wars are rarely about ego alone.", "text": "Turf wars are rarely about ego alone.", "zh": "地盘之争很少只是面子问题。", "sp": null}, {"id": "s0_1_1", "md": "Owning a system means headcount, visibility, and a story for promotion.", "text": "Owning a system means headcount, visibility, and a story for promotion.", "zh": "拥有一个系统，意味着 HC、能见度，以及一个能拿去晋升的故事。", "sp": null}, {"id": "s0_1_2", "md": "So when ==boundaries== are unclear, smart people __dig in__, because losing the project feels like losing their future.", "text": "So when boundaries are unclear, smart people dig in, because losing the project feels like losing their future.", "zh": "所以边界一不清楚，聪明人就会死守，因为丢了项目感觉就像丢了前途。", "sp": null}], [{"id": "s0_2_0", "md": "**You will not end a turf war by proving who was there first.**", "text": "You will not end a turf war by proving who was there first.", "zh": "你没法靠证明谁先来的来结束地盘之争。", "sp": null}, {"id": "s0_2_1", "md": "History is ==ambiguous==, and every side has a version that makes them look right.", "text": "History is ambiguous, and every side has a version that makes them look right.", "zh": "历史本身就说不清，每一方都有一个让自己显得占理的版本。", "sp": null}, {"id": "s0_2_2", "md": "The only exit is to change the question.", "text": "The only exit is to change the question.", "zh": "唯一的出路是换一个问题。", "sp": null}]]}, {"heading": "2. Changing the Question", "heading_zh": "2. 换一个问题", "rows": [[{"id": "s1_0_0", "md": "Move the discussion from \"who owns it\" to \"what do our users need.\"", "text": "Move the discussion from \"who owns it\" to \"what do our users need.\"", "zh": "把讨论从「这归谁」转到「我们的用户需要什么」。", "sp": null}, {"id": "s1_0_1", "md": "Write down the use cases together, and you will often find that the two teams need different things.", "text": "Write down the use cases together, and you will often find that the two teams need different things.", "zh": "一起把使用场景写下来，你往往会发现两个团队需要的是不同的东西。", "sp": null}, {"id": "s1_0_2", "md": "One needs fast push alerts, the other needs reliable email at scale.", "text": "One needs fast push alerts, the other needs reliable email at scale.", "zh": "一个需要快速的推送提醒，另一个需要大规模、可靠的邮件。", "sp": null}], [{"id": "s1_1_0", "md": "That opens the door to a split by ==interface==, not by people.", "text": "That opens the door to a split by interface, not by people.", "zh": "这就为按接口拆分、而不是按人拆分打开了口子。", "sp": null}, {"id": "s1_1_1", "md": "One team owns delivery, the other owns templates and scheduling, and a clear contract sits between them.", "text": "One team owns delivery, the other owns templates and scheduling, and a clear contract sits between them.", "zh": "一个团队负责投递，另一个负责模板和调度，中间是一份清晰的接口约定。", "sp": null}, {"id": "s1_1_2", "md": "Both teams __walk away with__ something real to own.", "text": "Both teams walk away with something real to own.", "zh": "两个团队都能拿到真正属于自己的东西。", "sp": null}], [{"id": "s1_2_0", "md": "If the teams still cannot agree, do not let the fight __drag on__ for months.", "text": "If the teams still cannot agree, do not let the fight drag on for months.", "zh": "如果两个团队还是谈不拢，别让这场仗拖上几个月。", "sp": null}, {"id": "s1_2_1", "md": "Ask a shared manager to decide, and give them a short, ==neutral== document with both options and their costs.", "text": "Ask a shared manager to decide, and give them a short, neutral document with both options and their costs.", "zh": "请共同的上级来拍板，并给他一份简短、中立的文档，列出两个方案和各自的代价。", "sp": null}, {"id": "s1_2_2", "md": "**A fast, imperfect decision is better than a slow war that burns both teams out.**", "text": "A fast, imperfect decision is better than a slow war that burns both teams out.", "zh": "一个快速但不完美的决定，好过一场把两个团队都拖垮的持久战。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, be generous after the ==outcome==.", "text": "Finally, be generous after the outcome.", "zh": "最后，结果出来之后要大度。", "sp": null}, {"id": "s1_3_1", "md": "If your side wins, invite the other team into design reviews.", "text": "If your side wins, invite the other team into design reviews.", "zh": "如果你这边赢了，就邀请对方团队来参加设计评审。", "sp": null}, {"id": "s1_3_2", "md": "If your side loses, help them succeed, because people will remember how you behaved far longer than who won.", "text": "If your side loses, help them succeed, because people will remember how you behaved far longer than who won.", "zh": "如果你这边输了，就帮他们做成，因为人们记住你当时的表现，会比记住谁赢了久得多。", "sp": null}]]}], "gist": [{"q": "为什么团队会陷入地盘之争？", "a": "拥有一个系统意味着人头编制、能见度和晋升故事；归属不清时，丢掉项目就像丢掉前途，所以大家会死守。"}, {"q": "作者说怎样才能走出地盘之争？", "a": "不去争谁先来的（历史总是模糊的），而是换个问题：从「谁拥有」变成「用户需要什么」，再按接口而不是按人拆分。"}, {"q": "如果仍然谈不拢怎么办？结果出来后呢？", "a": "请共同上级拍板，提供一份中立的文档列出两个方案和代价；结果出来后要大度，赢了邀请对方参与评审，输了帮对方成功。"}], "dictation": [{"id": "s0_2_0", "text": "You will not end a turf war by proving who was there first."}, {"id": "s1_0_1", "text": "Write down the use cases together, and you will often find that the two teams need different things."}, {"id": "s1_2_2", "text": "A fast, imperfect decision is better than a slow war that burns both teams out."}, {"id": "s1_1_2", "text": "Both teams walk away with something real to own."}], "shadow": {"text": "Turf wars are rarely about ego alone. Owning a system means headcount, visibility, and a story for promotion.", "marked": "Turf wars are <b>rarely</b> about <b>ego</b> alone. //<br><b>Owning</b> a system means <b>headcount</b>, / <b>visibility</b>, / and a <b>story</b> for promotion. //"}, "prompts": [{"q": "你的团队和另一个团队都想负责新的配置中心，会议开始变得火药味很浓。用 30 秒把讨论从「谁拥有」拉回到「用户需要什么」。", "ref": "I think we could argue about history all afternoon and still not agree. Can we try a different question? What do the services using this config center actually need? If we list the use cases on the board, we might find that one team cares about fast rollout and the other about audit and approvals. Then we can talk about splitting by interface instead of picking a winner.", "ref_zh": "我觉得我们就算争一下午历史，也还是谈不拢。我们能不能换个问题？用这个配置中心的服务到底需要什么？如果我们把使用场景列在白板上，可能会发现一个团队在乎的是快速发布，另一个在乎的是审计和审批。那我们就可以讨论按接口拆分，而不是非要决出一个赢家。", "id": "ref0"}, {"q": "两个团队争了一个月仍无结论。用 30 秒向共同的上级提出请他拍板，并说明你会准备一份中立的方案对比。", "ref": "We've been going back and forth on the notification service for a month, and both teams are losing time. I'd like to ask you to make the call. Kevin and I will write one short document together, with both options, the cost of each, and the risks. We'll send it by Thursday. Whatever you decide, my team will support it fully.", "ref_zh": "通知服务这件事我们已经来回拉扯了一个月，两个团队都在浪费时间。我想请你来拍板。Kevin 和我会一起写一份简短的文档，列出两个方案、各自的成本和风险。我们周四前发给你。不管你怎么定，我的团队都会全力支持。", "id": "ref1"}], "words": [{"w": "debate", "ipa": "/dɪˈbeɪt/", "zh": "争论、辩论", "ex": "Let's not turn the design review into a debate about who started it.", "id": "w0"}, {"w": "boundary", "ipa": "/ˈbaʊndri/", "zh": "边界", "ex": "We need a clear boundary between the API team and the client team.", "id": "w1"}, {"w": "ambiguous", "ipa": "/æmˈbɪɡjuəs/", "zh": "模糊的、有歧义的", "ex": "The requirements are ambiguous, so let's confirm with the PM.", "id": "w2"}, {"w": "interface", "ipa": "/ˈɪntərfeɪs/", "zh": "接口 const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {

  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
