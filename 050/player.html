<script>
const D = {"id": "050", "title": "Handling a Turf War", "meta": "B2 · 约 280 词 · 场景：团队边界冲突", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. How Turf Wars Start", "heading_zh": "1. 地盘之争是怎么开始的", "rows": [[{"id": "s0_0_0", "md": "Two teams discover, in the same quarterly review, that both are building a notification service.", "text": "Two teams discover, in the same quarterly review, that both are building a notification service.", "zh": "两个团队在同一次季度 review 上发现，双方都在做一个通知服务。", "sp": null}, {"id": "s0_0_1", "md": "Each has a design doc, a roadmap, and a manager who has already promised it upward.", "text": "Each has a design doc, a roadmap, and a manager who has already promised it upward.", "zh": "每边都有设计文档、有 roadmap，还有一个已经向上承诺过的老板。", "sp": null}, {"id": "s0_0_2", "md": "Within a week, design reviews turn into ==debates== about history, and nobody shares code.", "text": "Within a week, design reviews turn into debates about history, and nobody shares code.", "zh": "不到一周，设计评审就变成了翻旧账，谁也不共享代码。", "sp": null}], [{"id": "s0_1_0", "md": "Turf wars are rarely about ego alone.", "text": "Turf wars are rarely about ego alone.", "zh": "地盘之争很少只是面子问题。", "sp": null}, {"id": "s0_1_1", "md": "Owning a system means headcount, visibility, and a story for promotion.", "text": "Owning a system means headcount, visibility, and a story for promotion.", "zh": "拥有一个系统，意味着 HC、能见度，以及一个能拿去晋升的故事。", "sp": null}, {"id": "s0_1_2", "md": "So when ==boundaries== are unclear, smart people __dig in__, because losing the project feels like losing their future.", "text": "So when boundaries are unclear, smart people dig in, because losing the project feels like losing their future.", "zh": "所以边界一不清楚，聪明人就会死守，因为丢了项目感觉就像丢了前途。", "sp": null}], [{"id": "s0_2_0", "md": "**You will not end a turf war by proving who was there first.**", "text": "You will not end a turf war by proving who was there first.", "zh": "你没法靠证明谁先来的来结束地盘之争。", "sp": null}, {"id": "s0_2_1", "md": "History is ==ambiguous==, and every side has a version that makes them look right.", "text": "History is ambiguous, and every side has a version that makes them look right.", "zh": "历史本身就说不清，每一方都有一个让自己显得占理的版本。", "sp": null}, {"id": "s0_2_2", "md": "The only exit is to change the question.", "text": "The only exit is to change the question.", "zh": "唯一的出路是换一个问题。", "sp": null}]]}, {"heading": "2. Changing the Question", "heading_zh": "2. 换一个问题", "rows": [[{"id": "s1_0_0", "md": "Move the discussion from \"who owns it\" to \"what do our users need.\"", "text": "Move the discussion from \"who owns it\" to \"what do our users need.\"", "zh": "把讨论从「这归谁」转到「我们的用户需要什么」。", "sp": null}, {"id": "s1_0_1", "md": "Write down the use cases together, and you will often find that the two teams need different things.", "text": "Write down the use cases together, and you will often find that the two teams need different things.", "zh": "一起把使用场景写下来，你往往会发现两个团队需要的是不同的东西。", "sp": null}, {"id": "s1_0_2", "md": "One needs fast push alerts, the other needs reliable email at scale.", "text": "One needs fast push alerts, the other needs reliable email at scale.", "zh": "一个需要快速的推送提醒，另一个需要大规模、可靠的邮件。", "sp": null}], [{"id": "s1_1_0", "md": "That opens the door to a split by ==interface==, not by people.", "text": "That opens the door to a split by interface, not by people.", "zh": "这就为按接口拆分、而不是按人拆分打开了口子。", "sp": null}, {"id": "s1_1_1", "md": "One team owns delivery, the other owns templates and scheduling, and a clear contract sits between them.", "text": "One team owns delivery, the other owns templates and scheduling, and a clear contract sits between them.", "zh": "一个团队负责投递，另一个负责模板和调度，中间是一份清晰的接口约定。", "sp": null}, {"id": "s1_1_2", "md": "Both teams __walk away with__ something real to own.", "text": "Both teams walk away with something real to own.", "zh": "两个团队都能拿到真正属于自己的东西。", "sp": null}], [{"id": "s1_2_0", "md": "If the teams still cannot agree, do not let the fight __drag on__ for months.", "text": "If the teams still cannot agree, do not let the fight drag on for months.", "zh": "如果两个团队还是谈不拢，别让这场仗拖上几个月。", "sp": null}, {"id": "s1_2_1", "md": "Ask a shared manager to decide, and give them a short, ==neutral== document with both options and their costs.", "text": "Ask a shared manager to decide, and give them a short, neutral document with both options and their costs.", "zh": "请共同的上级来拍板，并给他一份简短、中立的文档，列出两个方案和各自的代价。", "sp": null}, {"id": "s1_2_2", "md": "**A fast, imperfect decision is better than a slow war that burns both teams out.**", "text": "A fast, imperfect decision is better than a slow war that burns both teams out.", "zh": "一个快速但不完美的决定，好过一场把两个团队都拖垮的持久战。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, be generous after the ==outcome==.", "text": "Finally, be generous after the outcome.", "zh": "最后，结果出来之后要大度。", "sp": null}, {"id": "s1_3_1", "md": "If your side wins, invite the other team into design reviews.", "text": "If your side wins, invite the other team into design reviews.", "zh": "如果你这边赢了，就邀请对方团队来参加设计评审。", "sp": null}, {"id": "s1_3_2", "md": "If your side loses, help them succeed, because people will remember how you behaved far longer than who won.", "text": "If your side loses, help them succeed, because people will remember how you behaved far longer than who won.", "zh": "如果你这边输了，就帮他们做成，因为人们记住你当时的表现，会比记住谁赢了久得多。", "sp": null}]]}], "gist": [{"q": "为什么团队会陷入地盘之争？", "a": "拥有一个系统意味着人头编制、能见度和晋升故事；归属不清时，丢掉项目就像丢掉前途，所以大家会死守。"}, {"q": "作者说怎样才能走出地盘之争？", "a": "不去争谁先来的（历史总是模糊的），而是换个问题：从「谁拥有」变成「用户需要什么」，再按接口而不是按人拆分。"}, {"q": "如果仍然谈不拢怎么办？结果出来后呢？", "a": "请共同上级拍板，提供一份中立的文档列出两个方案和代价；结果出来后要大度，赢了邀请对方参与评审，输了帮对方成功。"}], "dictation": [{"id": "s0_2_0", "text": "You will not end a turf war by proving who was there first."}, {"id": "s1_0_1", "text": "Write down the use cases together, and you will often find that the two teams need different things."}, {"id": "s1_2_2", "text": "A fast, imperfect decision is better than a slow war that burns both teams out."}, {"id": "s1_1_2", "text": "Both teams walk away with something real to own."}], "shadow": {"text": "Turf wars are rarely about ego alone. Owning a system means headcount, visibility, and a story for promotion.", "marked": "Turf wars are <b>rarely</b> about <b>ego</b> alone. //<br><b>Owning</b> a system means <b>headcount</b>, / <b>visibility</b>, / and a <b>story</b> for promotion. //"}, "prompts": [{"q": "你的团队和另一个团队都想负责新的配置中心，会议开始变得火药味很浓。用 30 秒把讨论从「谁拥有」拉回到「用户需要什么」。", "ref": "I think we could argue about history all afternoon and still not agree. Can we try a different question? What do the services using this config center actually need? If we list the use cases on the board, we might find that one team cares about fast rollout and the other about audit and approvals. Then we can talk about splitting by interface instead of picking a winner.", "ref_zh": "我觉得我们就算争一下午历史，也还是谈不拢。我们能不能换个问题？用这个配置中心的服务到底需要什么？如果我们把使用场景列在白板上，可能会发现一个团队在乎的是快速发布，另一个在乎的是审计和审批。那我们就可以讨论按接口拆分，而不是非要决出一个赢家。", "id": "ref0"}, {"q": "两个团队争了一个月仍无结论。用 30 秒向共同的上级提出请他拍板，并说明你会准备一份中立的方案对比。", "ref": "We've been going back and forth on the notification service for a month, and both teams are losing time. I'd like to ask you to make the call. Kevin and I will write one short document together, with both options, the cost of each, and the risks. We'll send it by Thursday. Whatever you decide, my team will support it fully.", "ref_zh": "通知服务这件事我们已经来回拉扯了一个月，两个团队都在浪费时间。我想请你来拍板。Kevin 和我会一起写一份简短的文档，列出两个方案、各自的成本和风险。我们周四前发给你。不管你怎么定，我的团队都会全力支持。", "id": "ref1"}], "words": [{"w": "debate", "ipa": "/dɪˈbeɪt/", "zh": "争论、辩论", "ex": "Let's not turn the design review into a debate about who started it.", "id": "w0"}, {"w": "boundary", "ipa": "/ˈbaʊndri/", "zh": "边界", "ex": "We need a clear boundary between the API team and the client team.", "id": "w1"}, {"w": "ambiguous", "ipa": "/æmˈbɪɡjuəs/", "zh": "模糊的、有歧义的", "ex": "The requirements are ambiguous, so let's confirm with the PM.", "id": "w2"}, {"w": "interface", "ipa": "/ˈɪntərfeɪs/", "zh": "接口 const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
