<script>
const D = {"id": "000", "title": "How to Disagree Without Making Enemies", "meta": "B2 · 约 270 词 · 场景：会议发言", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why Silence Is Expensive", "heading_zh": "1. 沉默的代价很高", "rows": [[{"id": "s0_0_0", "md": "In many teams, the most dangerous moment in a meeting is not an argument.", "text": "In many teams, the most dangerous moment in a meeting is not an argument.", "zh": "在很多团队里，会议中最危险的时刻不是争论。", "sp": null}, {"id": "s0_0_1", "md": "It is the quiet agreement.", "text": "It is the quiet agreement.", "zh": "而是一片安静的同意。", "sp": null}, {"id": "s0_0_2", "md": "Someone presents a plan, nobody ==objects==, and the decision is made.", "text": "Someone presents a plan, nobody objects, and the decision is made.", "zh": "有人提出一个方案，没人反对，决定就这么定了。", "sp": null}, {"id": "s0_0_3", "md": "Two weeks later, half the room ==admits== they had doubts from the start.", "text": "Two weeks later, half the room admits they had doubts from the start.", "zh": "两周后，半屋子的人承认自己一开始就有疑虑。", "sp": null}], [{"id": "s0_1_0", "md": "This happens because disagreeing feels risky.", "text": "This happens because disagreeing feels risky.", "zh": "之所以会这样，是因为提反对意见让人觉得有风险。", "sp": null}, {"id": "s0_1_1", "md": "We worry about __coming across as__ negative, or about __putting someone on the spot__ in front of their manager.", "text": "We worry about coming across as negative, or about putting someone on the spot in front of their manager.", "zh": "我们担心显得太消极，或者担心当着别人经理的面让人下不来台。", "sp": null}, {"id": "s0_1_2", "md": "So we stay silent, and the team pays later.", "text": "So we stay silent, and the team pays later.", "zh": "于是我们保持沉默，代价则由团队事后来付。", "sp": null}, {"id": "s0_1_3", "md": "**A concern raised in the meeting costs five minutes; the same concern raised after launch costs five weeks.**", "text": "A concern raised in the meeting costs five minutes; the same concern raised after launch costs five weeks.", "zh": "一个顾虑在会上提出来只要五分钟；同样的顾虑等上线后再提，要花五周。", "sp": null}], [{"id": "s0_2_0", "md": "Good teams treat disagreement as a ==contribution==, not an attack.", "text": "Good teams treat disagreement as a contribution, not an attack.", "zh": "好的团队把不同意见当作贡献，而不是攻击。", "sp": null}, {"id": "s0_2_1", "md": "The goal is not to win the argument.", "text": "The goal is not to win the argument.", "zh": "目的不是赢下争论。", "sp": null}, {"id": "s0_2_2", "md": "The goal is to ==surface== risks while they are still cheap to fix.", "text": "The goal is to surface risks while they are still cheap to fix.", "zh": "目的是趁风险还容易修的时候，把它摆到桌面上。", "sp": null}]]}, {"heading": "2. Three Moves That Make Disagreement Safe", "heading_zh": "2. 让反对变得安全的三个动作", "rows": [[{"id": "s1_0_0", "md": "**First, agree on the goal before you challenge the method.**", "text": "First, agree on the goal before you challenge the method.", "zh": "第一，先对齐目标，再质疑方法。", "sp": null}, {"id": "s1_0_1", "md": "Saying \"We both want this release to be stable\" __sets the frame__.", "text": "Saying \"We both want this release to be stable\" sets the frame.", "zh": "说一句「我们都希望这次发布是稳定的」，就先把框架定下来了。", "sp": null}, {"id": "s1_0_2", "md": "Now your objection sounds like help, not opposition.", "text": "Now your objection sounds like help, not opposition.", "zh": "这样你的反对听起来像是在帮忙，而不是在唱反调。", "sp": null}], [{"id": "s1_1_0", "md": "Second, ask instead of assert.", "text": "Second, ask instead of assert.", "zh": "第二，用提问代替断言。", "sp": null}, {"id": "s1_1_1", "md": "\"What happens if traffic doubles?\" is easier to hear than \"This won't scale.\"", "text": "\"What happens if traffic doubles?\" is easier to hear than \"This won't scale.\"", "zh": "「如果流量翻倍会怎样？」比「这扛不住」更容易让人听进去。", "sp": null}, {"id": "s1_1_2", "md": "A question invites the other person to find the gap themselves, which makes them far more likely to ==acknowledge== it.", "text": "A question invites the other person to find the gap themselves, which makes them far more likely to acknowledge it.", "zh": "提问会让对方自己去发现漏洞，这样他们承认问题的可能性就大得多。", "sp": null}], [{"id": "s1_2_0", "md": "Third, be specific.", "text": "Third, be specific.", "zh": "第三，说具体。", "sp": null}, {"id": "s1_2_1", "md": "==Vague== concerns like \"I'm not sure about this\" __leave people guessing__.", "text": "Vague concerns like \"I'm not sure about this\" leave people guessing.", "zh": "「我对这个不太确定」这种模糊的顾虑，只会让人去猜你到底担心什么。", "sp": null}, {"id": "s1_2_2", "md": "Point to one number, one dependency, or one ==scenario==.", "text": "Point to one number, one dependency, or one scenario.", "zh": "指出一个数字、一个依赖，或者一个具体场景。", "sp": null}, {"id": "s1_2_3", "md": "**Specific doubts get fixed; vague doubts get ignored.**", "text": "Specific doubts get fixed; vague doubts get ignored.", "zh": "具体的疑虑会被解决；模糊的疑虑会被忽略。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, once the team decides, __commit to the decision__, even if it wasn't your choice.", "text": "Finally, once the team decides, commit to the decision, even if it wasn't your choice.", "zh": "最后，团队一旦做了决定，就全力执行，哪怕那不是你选的方案。", "sp": null}, {"id": "s1_3_1", "md": "Disagreeing openly and then supporting the outcome is what builds ==credibility==.", "text": "Disagreeing openly and then supporting the outcome is what builds credibility.", "zh": "公开提出异议，然后支持最终结果，这才是建立信誉的方式。", "sp": null}, {"id": "s1_3_2", "md": "People will listen to your next objection because they know you are not just being difficult.", "text": "People will listen to your next objection because they know you are not just being difficult.", "zh": "下次你再反对时，大家会听，因为他们知道你不是在故意找茬。", "sp": null}]]}], "gist": [{"q": "作者说会议里最危险的时刻是什么？", "a": "The quiet agreement：没人反对、决定就这么定了，事后一半人承认一开始就有疑虑。"}, {"q": "为什么要在会上就提出顾虑？用文中的数字回答。", "a": "会上提只花 5 分钟，上线后再提要花 5 周。"}, {"q": "安全地表达反对有哪几步？", "a": "先对齐目标再质疑方法；用提问代替断言；说具体（一个数字/依赖/场景）；团队定了之后全力执行。"}], "dictation": [{"id": "s0_1_3", "text": "A concern raised in the meeting costs five minutes; the same concern raised after launch costs five weeks."}, {"id": "s1_0_0", "text": "First, agree on the goal before you challenge the method."}, {"id": "s1_1_2", "text": "A question invites the other person to find the gap themselves, which makes them far more likely to acknowledge it."}, {"id": "s1_2_3", "text": "Specific doubts get fixed; vague doubts get ignored."}], "shadow": {"text": "First, agree on the goal before you challenge the method. Saying \"We both want this release to be stable\" sets the frame. Now your objection sounds like help, not opposition.", "marked": "First, <b>agree</b> on the <b>goal</b> / before you <b>challenge</b> the <b>method</b>. //<br>Saying \"We <b>both</b> want this release / to be <b>stable</b>\" / sets the <b>frame</b>. //<br>Now your objection sounds like <b>help</b>, / <b>not</b> opposition. //"}, "prompts": [{"q": "PM 想跳过灰度，周五直接全量上线。用 30 秒反对他，先对齐目标，再用一个问题指出风险。", "ref": "I think we all want this launch to go smoothly, without a rollback over the weekend. What happens if the new logic breaks in a region we haven't tested? If we start with a ten percent rollout on Friday and watch the crash rate for a day, we only lose twenty-four hours, and we get a real number to decide on.", "ref_zh": "我想我们都希望这次上线顺顺利利，周末不用回滚。如果新逻辑在我们没测过的地区出问题怎么办？如果周五先放百分之十的量，观察一天崩溃率，我们只损失二十四小时，却能拿到一个真实的数字来做决定。", "id": "ref0"}, {"q": "TL 提议这个季度把服务用新框架重写。你对排期有顾虑，提一个具体的担忧，并给出替代方案。", "ref": "I like the direction, and I agree the current code is hard to maintain. My concern is the timeline. Three other projects depend on this service this quarter, so if the rewrite slips by even two weeks, they slip with it. Could we migrate one endpoint first and see how long it actually takes?", "ref_zh": "我认同这个方向，也同意现在的代码很难维护。我担心的是排期。这个季度有三个项目依赖这个服务，重写哪怕晚两周，它们也会跟着延期。我们能不能先迁移一个接口，看看实际要花多久？", "id": "ref1"}], "words": [{"w": "vague", "ipa": "/veɪɡ/", "zh": "模糊的、含糊的", "ex": "\"Faster\" is too vague. Can we say p99 under 200 ms?", "tts": "\"Faster\" is too vague. Can we say P ninety-nine under two hundred milliseconds?", "id": "w0"}, {"w": "surface (v.)", "ipa": "/ˈsɜːrfɪs/", "zh": "提出、使浮出水面", "ex": "I want t const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }

  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
