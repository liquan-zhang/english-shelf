const D = {"id": "054", "title": "Talking to Someone Who Is Underperforming", "meta": "B2 · 约 290 词 · 场景：绩效谈话", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Conversation Managers Delay", "heading_zh": "1. 管理者总在拖延的那场谈话", "rows": [[{"id": "s0_0_0", "md": "For three sprints in a row, one of your engineers has missed estimates, and his code reviews keep coming back with basic bugs.", "text": "For three sprints in a row, one of your engineers has missed estimates, and his code reviews keep coming back with basic bugs.", "zh": "连续三个 sprint，你的一位工程师都没达到预估，他的代码 review 还老是被打回来，都是些低级 bug。", "sp": null}, {"id": "s0_0_1", "md": "You notice it, the team notices it, and you tell yourself that next sprint will be different.", "text": "You notice it, the team notices it, and you tell yourself that next sprint will be different.", "zh": "你注意到了，团队也注意到了，你跟自己说下个 sprint 会不一样。", "sp": null}, {"id": "s0_0_2", "md": "It usually is not.", "text": "It usually is not.", "zh": "通常并不会。", "sp": null}], [{"id": "s0_1_0", "md": "Managers delay this conversation because it feels ==confrontational==.", "text": "Managers delay this conversation because it feels confrontational.", "zh": "管理者拖延这场谈话，是因为感觉像是在对抗。", "sp": null}, {"id": "s0_1_1", "md": "But silence is not neutral.", "text": "But silence is not neutral.", "zh": "但沉默并不是中立的。", "sp": null}, {"id": "s0_1_2", "md": "The engineer assumes everything is fine, the team starts to __pick up the slack__ and quietly resent it, and the problem grows.", "text": "The engineer assumes everything is fine, the team starts to pick up the slack and quietly resent it, and the problem grows.", "zh": "那位工程师以为一切都好，团队开始帮他兜底并在心里暗暗不满，问题越来越大。", "sp": null}, {"id": "s0_1_3", "md": "**Waiting does not protect the person; it only makes the eventual conversation harder.**", "text": "Waiting does not protect the person; it only makes the eventual conversation harder.", "zh": "等待并不能保护这个人；只会让最终的那场谈话更难开口。", "sp": null}], [{"id": "s0_2_0", "md": "Remember that ==underperformance== has many causes.", "text": "Remember that underperformance has many causes.", "zh": "要记住，表现不佳的原因有很多。", "sp": null}, {"id": "s0_2_1", "md": "It might be unclear expectations, a skill gap, or a problem at home.", "text": "It might be unclear expectations, a skill gap, or a problem at home.", "zh": "可能是预期没讲清楚，可能是能力有缺口，也可能是家里出了事。", "sp": null}, {"id": "s0_2_2", "md": "You cannot fix it until you __get to the bottom of__ it, and you cannot do that without ==raising== it.", "text": "You cannot fix it until you get to the bottom of it, and you cannot do that without raising it.", "zh": "不搞清楚根源你就没法解决，而不把问题提出来你就没法搞清楚。", "sp": null}]]}, {"heading": "2. Running the Conversation", "heading_zh": "2. 怎么谈", "rows": [[{"id": "s1_0_0", "md": "Hold it in private, and say why you are there in the first minute.", "text": "Hold it in private, and say why you are there in the first minute.", "zh": "私下谈，并且在第一分钟就说明来意。", "sp": null}, {"id": "s1_0_1", "md": "\"I want to talk about the last few sprints, because I'm worried, and I want to help.\"", "text": "\"I want to talk about the last few sprints, because I'm worried, and I want to help.\"", "zh": "「我想聊聊最近几个 sprint，因为我有点担心，也想帮你。」", "sp": null}, {"id": "s1_0_2", "md": "Long warm-ups make people anxious and ==dilute== the message.", "text": "Long warm-ups make people anxious and dilute the message.", "zh": "铺垫太长会让人焦虑，还会冲淡你要说的事。", "sp": null}], [{"id": "s1_1_0", "md": "Then share facts, not ==labels==.", "text": "Then share facts, not labels.", "zh": "然后，讲事实，不贴标签。", "sp": null}, {"id": "s1_1_1", "md": "\"Three of your last five reviews needed major rework\" is something you can discuss.", "text": "\"Three of your last five reviews needed major rework\" is something you can discuss.", "zh": "「你最近五次 review 里有三次需要大改」，这是可以讨论的。", "sp": null}, {"id": "s1_1_2", "md": "\"You seem careless\" is something people can only defend against.", "text": "\"You seem careless\" is something people can only defend against.", "zh": "「你好像挺粗心的」，这只会让人去辩解。", "sp": null}], [{"id": "s1_2_0", "md": "Next, stop talking and ask for their view.", "text": "Next, stop talking and ask for their view.", "zh": "接着，停下来，问问他的看法。", "sp": null}, {"id": "s1_2_1", "md": "\"What's your read on what's been happening?\"", "text": "\"What's your read on what's been happening?\"", "zh": "「你自己怎么看最近发生的事？」", "sp": null}, {"id": "s1_2_2", "md": "You may learn about an unclear spec, a personal ==struggle==, or a task that was simply too big for their level.", "text": "You may learn about an unclear spec, a personal struggle, or a task that was simply too big for their level.", "zh": "你可能会了解到需求文档不清楚、个人遇到困难，或者某个任务对他的级别来说本来就太大了。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, agree on a concrete plan with dates.", "text": "Finally, agree on a concrete plan with dates.", "zh": "最后，约定一个带日期的具体计划。", "sp": null}, {"id": "s1_3_1", "md": "One or two clear goals, the support you will provide, and a time to __check in__ two weeks later.", "text": "One or two clear goals, the support you will provide, and a time to check in two weeks later.", "zh": "一两个清晰的目标、你会提供的支持，以及两周后约个时间复盘。", "sp": null}, {"id": "s1_3_2", "md": "**Be kind about the person and clear about the gap.**", "text": "Be kind about the person and clear about the gap.", "zh": "对人要温和，对差距要说清楚。", "sp": null}, {"id": "s1_3_3", "md": "Leaving someone confused about where they stand is the least kind option of all.", "text": "Leaving someone confused about where they stand is the least kind option of all.", "zh": "让一个人搞不清自己处在什么位置，才是最不善意的做法。", "sp": null}]]}], "gist": [{"q": "经理为什么常常拖延绩效谈话？拖延的后果是什么？", "a": "觉得像对抗；但沉默不中立，当事人以为没问题，团队替他补位并暗生怨气，问题越来越大，最后的谈话更难。"}, {"q": "谈话时为什么要讲事实而不是贴标签？", "a": "事实（五次评审有三次需要大改）可以讨论；标签（你很粗心）只会让人防御。"}, {"q": "谈话的最后一步是什么？", "a": "约定具体计划：一两个明确目标、你提供的支持、两周后的检查时间；对人友善、对差距清楚。"}], "dictation": [{"id": "s0_1_3", "text": "Waiting does not protect the person; it only makes the eventual conversation harder."}, {"id": "s1_0_2", "text": "Long warm-ups make people anxious and dilute the message."}, {"id": "s1_3_2", "text": "Be kind about the person and clear about the gap."}, {"id": "s1_3_3", "text": "Leaving someone confused about where they stand is the least kind option of all."}], "shadow": {"text": "Then share facts, not labels. \"Three of your last five reviews needed major rework\" is something you can discuss. \"You seem careless\" is something people can only defend against.", "marked": "Then share <b>facts</b>, / <b>not</b> labels. //<br>\"<b>Three</b> of your last <b>five</b> reviews / needed <b>major</b> rework\" / is something you can <b>discuss</b>. //<br>\"You seem <b>careless</b>\" / is something people can <b>only</b> defend against. //"}, "prompts": [{"q": "你要和一位最近连续几次延期、代码质量下降的下属谈话。用 30 秒开场：第一分钟讲明来意，讲事实，然后请他说说他的看法。", "ref": "Thanks for making time. I want to talk about the last few sprints, because I'm a bit worried and I want to help. Two of your last three tasks slipped by more than a week, and the payment fix needed a second rollback. I'm not assuming I know why. What's your read on what's been happening?", "ref_zh": "谢谢你抽时间。我想聊聊最近几个 sprint，因为我有点担心，也想帮你。你最近三个任务里有两个延期超过一周，支付那个修复还回滚了两次。我不预设自己知道原因。你自己怎么看最近发生的事？", "id": "ref0"}, {"q": "谈话接近尾声，你们已经找到原因（需求不清 + 任务太大）。用 30 秒总结一个带日期的改进计划和你的支持。", "ref": "Okay, so it sounds like unclear specs and oversized tasks are the main problems. Here's what I suggest. For the next two weeks, we'll split every task into pieces of two days or less, and I'll join your first spec review with the PM. Your goal is to hit your estimates on those smaller tasks. Let's check in on the twentieth and see how it's going. Does that feel fair?", "ref_zh": "好，听下来主要问题是需求不清楚和任务太大。我的建议是这样。接下来两周，我们把每个任务都拆成两天以内的小块，你跟 PM 的第一次需求评审我也会参加。你的目标是在这些小任务上达到自己的预估。我们二十号对一下，看看进展如何。你觉得这样公平吗？", "id": "ref1"}], "words": [{"w": "confrontational", "ipa": "/ˌkɑːnfrʌnˈteɪʃənl/", "zh": "对抗性的", "ex": "I want this to be a conversation, not a confrontational review.", "id": "w0"}, {"w": "underperformance", "ipa": " const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;

const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
