<script>
const D = {"id": "054", "title": "Talking to Someone Who Is Underperforming", "meta": "B2 · 约 290 词 · 场景：绩效谈话", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Conversation Managers Delay", "heading_zh": "1. 管理者总在拖延的那场谈话", "rows": [[{"id": "s0_0_0", "md": "For three sprints in a row, one of your engineers has missed estimates, and his code reviews keep coming back with basic bugs.", "text": "For three sprints in a row, one of your engineers has missed estimates, and his code reviews keep coming back with basic bugs.", "zh": "连续三个 sprint，你的一位工程师都没达到预估，他的代码 review 还老是被打回来，都是些低级 bug。", "sp": null}, {"id": "s0_0_1", "md": "You notice it, the team notices it, and you tell yourself that next sprint will be different.", "text": "You notice it, the team notices it, and you tell yourself that next sprint will be different.", "zh": "你注意到了，团队也注意到了，你跟自己说下个 sprint 会不一样。", "sp": null}, {"id": "s0_0_2", "md": "It usually is not.", "text": "It usually is not.", "zh": "通常并不会。", "sp": null}], [{"id": "s0_1_0", "md": "Managers delay this conversation because it feels ==confrontational==.", "text": "Managers delay this conversation because it feels confrontational.", "zh": "管理者拖延这场谈话，是因为感觉像是在对抗。", "sp": null}, {"id": "s0_1_1", "md": "But silence is not neutral.", "text": "But silence is not neutral.", "zh": "但沉默并不是中立的。", "sp": null}, {"id": "s0_1_2", "md": "The engineer assumes everything is fine, the team starts to __pick up the slack__ and quietly resent it, and the problem grows.", "text": "The engineer assumes everything is fine, the team starts to pick up the slack and quietly resent it, and the problem grows.", "zh": "那位工程师以为一切都好，团队开始帮他兜底并在心里暗暗不满，问题越来越大。", "sp": null}, {"id": "s0_1_3", "md": "**Waiting does not protect the person; it only makes the eventual conversation harder.**", "text": "Waiting does not protect the person; it only makes the eventual conversation harder.", "zh": "等待并不能保护这个人；只会让最终的那场谈话更难开口。", "sp": null}], [{"id": "s0_2_0", "md": "Remember that ==underperformance== has many causes.", "text": "Remember that underperformance has many causes.", "zh": "要记住，表现不佳的原因有很多。", "sp": null}, {"id": "s0_2_1", "md": "It might be unclear expectations, a skill gap, or a problem at home.", "text": "It might be unclear expectations, a skill gap, or a problem at home.", "zh": "可能是预期没讲清楚，可能是能力有缺口，也可能是家里出了事。", "sp": null}, {"id": "s0_2_2", "md": "You cannot fix it until you __get to the bottom of__ it, and you cannot do that without ==raising== it.", "text": "You cannot fix it until you get to the bottom of it, and you cannot do that without raising it.", "zh": "不搞清楚根源你就没法解决，而不把问题提出来你就没法搞清楚。", "sp": null}]]}, {"heading": "2. Running the Conversation", "heading_zh": "2. 怎么谈", "rows": [[{"id": "s1_0_0", "md": "Hold it in private, and say why you are there in the first minute.", "text": "Hold it in private, and say why you are there in the first minute.", "zh": "私下谈，并且在第一分钟就说明来意。", "sp": null}, {"id": "s1_0_1", "md": "\"I want to talk about the last few sprints, because I'm worried, and I want to help.\"", "text": "\"I want to talk about the last few sprints, because I'm worried, and I want to help.\"", "zh": "「我想聊聊最近几个 sprint，因为我有点担心，也想帮你。」", "sp": null}, {"id": "s1_0_2", "md": "Long warm-ups make people anxious and ==dilute== the message.", "text": "Long warm-ups make people anxious and dilute the message.", "zh": "铺垫太长会让人焦虑，还会冲淡你要说的事。", "sp": null}], [{"id": "s1_1_0", "md": "Then share facts, not ==labels==.", "text": "Then share facts, not labels.", "zh": "然后，讲事实，不贴标签。", "sp": null}, {"id": "s1_1_1", "md": "\"Three of your last five reviews needed major rework\" is something you can discuss.", "text": "\"Three of your last five reviews needed major rework\" is something you can discuss.", "zh": "「你最近五次 review 里有三次需要大改」，这是可以讨论的。", "sp": null}, {"id": "s1_1_2", "md": "\"You seem careless\" is something people can only defend against.", "text": "\"You seem careless\" is something people can only defend against.", "zh": "「你好像挺粗心的」，这只会让人去辩解。", "sp": null}], [{"id": "s1_2_0", "md": "Next, stop talking and ask for their view.", "text": "Next, stop talking and ask for their view.", "zh": "接着，停下来，问问他的看法。", "sp": null}, {"id": "s1_2_1", "md": "\"What's your read on what's been happening?\"", "text": "\"What's your read on what's been happening?\"", "zh": "「你自己怎么看最近发生的事？」", "sp": null}, {"id": "s1_2_2", "md": "You may learn about an unclear spec, a personal ==struggle==, or a task that was simply too big for their level.", "text": "You may learn about an unclear spec, a personal struggle, or a task that was simply too big for their level.", "zh": "你可能会了解到需求文档不清楚、个人遇到困难，或者某个任务对他的级别来说本来就太大了。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, agree on a concrete plan with dates.", "text": "Finally, agree on a concrete plan with dates.", "zh": "最后，约定一个带日期的具体计划。", "sp": null}, {"id": "s1_3_1", "md": "One or two clear goals, the support you will provide, and a time to __check in__ two weeks later.", "text": "One or two clear goals, the support you will provide, and a time to check in two weeks later.", "zh": "一两个清晰的目标、你会提供的支持，以及两周后约个时间复盘。", "sp": null}, {"id": "s1_3_2", "md": "**Be kind about the person and clear about the gap.**", "text": "Be kind about the person and clear about the gap.", "zh": "对人要温和，对差距要说清楚。", "sp": null}, {"id": "s1_3_3", "md": "Leaving someone confused about where they stand is the least kind option of all.", "text": "Leaving someone confused about where they stand is the least kind option of all.", "zh": "让一个人搞不清自己处在什么位置，才是最不善意的做法。", "sp": null}]]}], "gist": [{"q": "经理为什么常常拖延绩效谈话？拖延的后果是什么？", "a": "觉得像对抗；但沉默不中立，当事人以为没问题，团队替他补位并暗生怨气，问题越来越大，最后的谈话更难。"}, {"q": "谈话时为什么要讲事实而不是贴标签？", "a": "事实（五次评审有三次需要大改）可以讨论；标签（你很粗心）只会让人防御。"}, {"q": "谈话的最后一步是什么？", "a": "约定具体计划：一两个明确目标、你提供的支持、两周后的检查时间；对人友善、对差距清楚。"}], "dictation": [{"id": "s0_1_3", "text": "Waiting does not protect the person; it only makes the eventual conversation harder."}, {"id": "s1_0_2", "text": "Long warm-ups make people anxious and dilute the message."}, {"id": "s1_3_2", "text": "Be kind about the person and clear about the gap."}, {"id": "s1_3_3", "text": "Leaving someone confused about where they stand is the least kind option of all."}], "shadow": {"text": "Then share facts, not labels. \"Three of your last five reviews needed major rework\" is something you can discuss. \"You seem careless\" is something people can only defend against.", "marked": "Then share <b>facts</b>, / <b>not</b> labels. //<br>\"<b>Three</b> of your last <b>five</b> reviews / needed <b>major</b> rework\" / is something you can <b>discuss</b>. //<br>\"You seem <b>careless</b>\" / is something people can <b>only</b> defend against. //"}, "prompts": [{"q": "你要和一位最近连续几次延期、代码质量下降的下属谈话。用 30 秒开场：第一分钟讲明来意，讲事实，然后请他说说他的看法。", "ref": "Thanks for making time. I want to talk about the last few sprints, because I'm a bit worried and I want to help. Two of your last three tasks slipped by more than a week, and the payment fix needed a second rollback. I'm not assuming I know why. What's your read on what's been happening?", "ref_zh": "谢谢你抽时间。我想聊聊最近几个 sprint，因为我有点担心，也想帮你。你最近三个任务里有两个延期超过一周，支付那个修复还回滚了两次。我不预设自己知道原因。你自己怎么看最近发生的事？", "id": "ref0"}, {"q": "谈话接近尾声，你们已经找到原因（需求不清 + 任务太大）。用 30 秒总结一个带日期的改进计划和你的支持。", "ref": "Okay, so it sounds like unclear specs and oversized tasks are the main problems. Here's what I suggest. For the next two weeks, we'll split every task into pieces of two days or less, and I'll join your first spec review with the PM. Your goal is to hit your estimates on those smaller tasks. Let's check in on the twentieth and see how it's going. Does that feel fair?", "ref_zh": "好，听下来主要问题是需求不清楚和任务太大。我的建议是这样。接下来两周，我们把每个任务都拆成两天以内的小块，你跟 PM 的第一次需求评审我也会参加。你的目标是在这些小任务上达到自己的预估。我们二十号对一下，看看进展如何。你觉得这样公平吗？", "id": "ref1"}], "words": [{"w": "confrontational", "ipa": "/ˌkɑːnfrʌnˈteɪʃənl/", "zh": "对抗性的", "ex": "I want this to be a conversation, not a confrontational review.", "id": "w0"}, {"w": "underperformance", "ipa": " const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
