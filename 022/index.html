<script>
const D = {"id": "022", "title": "Writing Code Review Comments That Help", "meta": "B2 · 约 270 词 · 场景：代码评审", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Comment Without Context", "heading_zh": "1. 没有上下文的评论", "rows": [[{"id": "s0_0_0", "md": "Imagine you open a pull request and find one comment: \"Why is this here?\"", "text": "Imagine you open a pull request and find one comment: \"Why is this here?\"", "zh": "想象一下，你打开一个 PR，只看到一条评论：「这个为什么在这儿？」", "sp": null}, {"id": "s0_0_1", "md": "It could be a real question, a polite complaint, or a sign that the reviewer wants the whole thing rewritten.", "text": "It could be a real question, a polite complaint, or a sign that the reviewer wants the whole thing rewritten.", "zh": "它可能是个真诚的问题，可能是委婉的抱怨，也可能说明评审人想让你整个重写。", "sp": null}, {"id": "s0_0_2", "md": "Most authors assume the worst.", "text": "Most authors assume the worst.", "zh": "大多数作者都会往最坏的方向想。", "sp": null}], [{"id": "s0_1_0", "md": "Written comments __lose the tone of voice__ that softens a question in person.", "text": "Written comments lose the tone of voice that softens a question in person.", "zh": "书面评论少了当面说话时那种能让提问显得柔和的语气。", "sp": null}, {"id": "s0_1_1", "md": "That is why short review comments so often feel ==hostile==, even when the reviewer meant nothing bad.", "text": "That is why short review comments so often feel hostile, even when the reviewer meant nothing bad.", "zh": "所以简短的 review 评论常常让人觉得带着敌意，哪怕评审人根本没那个意思。", "sp": null}, {"id": "s0_1_2", "md": "**The fix is not to be nicer; it is to be clearer.**", "text": "The fix is not to be nicer; it is to be clearer.", "zh": "解决办法不是更客气，而是更清楚。", "sp": null}], [{"id": "s0_2_0", "md": "Clear comments also save time.", "text": "Clear comments also save time.", "zh": "清楚的评论还能省时间。", "sp": null}, {"id": "s0_2_1", "md": "When the author has to guess your ==intent==, they either miss something important or spend an afternoon on a ==trivial== change.", "text": "When the author has to guess your intent, they either miss something important or spend an afternoon on a trivial change.", "zh": "作者要是得猜你的意图，要么漏掉重要的东西，要么在一个鸡毛蒜皮的改动上耗掉一下午。", "sp": null}, {"id": "s0_2_2", "md": "Then the two of you __go back and forth__ for days, and the release waits.", "text": "Then the two of you go back and forth for days, and the release waits.", "zh": "然后你们俩来来回回拉扯好几天，发布就只能干等着。", "sp": null}]]}, {"heading": "2. Label, Reason, Option", "heading_zh": "2. 标签、理由、方案", "rows": [[{"id": "s1_0_0", "md": "**Start every comment with a label: blocking, suggestion, or question.**", "text": "Start every comment with a label: blocking, suggestion, or question.", "zh": "每条评论开头都加个标签：blocking、建议，或者提问。", "sp": null}, {"id": "s1_0_1", "md": "\"Blocking\" means the code should not ==merge== until it is fixed.", "text": "\"Blocking\" means the code should not merge until it is fixed.", "zh": "「Blocking」意思是这个问题不修，代码就不该合入。", "sp": null}, {"id": "s1_0_2", "md": "\"Suggestion\" means you would do it differently, but the author decides.", "text": "\"Suggestion\" means you would do it differently, but the author decides.", "zh": "「建议」意思是你会换种做法，但由作者来定。", "sp": null}, {"id": "s1_0_3", "md": "\"Question\" means you genuinely want to understand.", "text": "\"Question\" means you genuinely want to understand.", "zh": "「提问」意思是你确实想搞明白。", "sp": null}], [{"id": "s1_1_0", "md": "Then give the reason.", "text": "Then give the reason.", "zh": "然后给出理由。", "sp": null}, {"id": "s1_1_1", "md": "\"This loop calls the database once per user, which will hurt ==latency== on large accounts\" is far more useful than \"this is slow.\"", "text": "\"This loop calls the database once per user, which will hurt latency on large accounts\" is far more useful than \"this is slow.\"", "zh": "「这个循环每个用户查一次数据库，大账号的延迟会很难看」，比一句「这里很慢」有用得多。", "sp": null}, {"id": "s1_1_2", "md": "A reason also lets the author __push back__ if you are wrong.", "text": "A reason also lets the author push back if you are wrong.", "zh": "有了理由，你要是说错了，作者也能反驳你。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, offer an option when you can.", "text": "Finally, offer an option when you can.", "zh": "最后，能给方案就给个方案。", "sp": null}, {"id": "s1_2_1", "md": "A short ==snippet== or a link to an example __saves a round trip__.", "text": "A short snippet or a link to an example saves a round trip.", "zh": "一小段代码或者一个示例链接，就能省掉一轮来回。", "sp": null}, {"id": "s1_2_2", "md": "Keep ==nitpicks== about spacing and naming to a minimum, or __leave them to__ the linter.", "text": "Keep nitpicks about spacing and naming to a minimum, or leave them to the linter.", "zh": "空格、命名这类细枝末节的挑刺尽量少提，或者干脆交给 linter。", "sp": null}], [{"id": "s1_3_0", "md": "Good reviewers also say what they like.", "text": "Good reviewers also say what they like.", "zh": "好的评审人也会说自己喜欢哪里。", "sp": null}, {"id": "s1_3_1", "md": "One line such as \"nice test coverage here\" tells the author which habits to keep.", "text": "One line such as \"nice test coverage here\" tells the author which habits to keep.", "zh": "一句「这里测试覆盖做得不错」，就能让作者知道哪些习惯该保持。", "sp": null}, {"id": "s1_3_2", "md": "Praise is cheap to write, and it makes the hard comments easier to accept.", "text": "Praise is cheap to write, and it makes the hard comments easier to accept.", "zh": "夸人写起来不费事，还能让那些难听的评论更容易被接受。", "sp": null}]]}], "gist": [{"q": "为什么简短的 review 评论常常让人觉得有敌意？", "a": "文字丢掉了当面说话时的语气，作者猜不到评论者的意图，往往最坏处想。"}, {"q": "作者建议每条评论开头加什么？分别是什么意思？", "a": "加标签：blocking（不改不能合入）、suggestion（建议，作者决定）、question（真心想弄懂）。"}, {"q": "除了标签，一条好评论还应包含什么？", "a": "说明理由（让作者能反驳），尽量给出可选方案（代码片段或示例链接）；格式类小问题交给 linter；也要说出做得好的地方。"}], "dictation": [{"id": "s0_1_2", "text": "The fix is not to be nicer; it is to be clearer."}, {"id": "s1_0_0", "text": "Start every comment with a label: blocking, suggestion, or question."}, {"id": "s0_1_0", "text": "Written comments lose the tone of voice that softens a question in person."}, {"id": "s1_1_2", "text": "A reason also lets the author push back if you are wrong."}], "shadow": {"text": "Start every comment with a label: blocking, suggestion, or question. \"Blocking\" means the code should not merge until it is fixed. \"Suggestion\" means you would do it differently, but the author decides.", "marked": "Start <b>every</b> comment with a <b>label</b>: / <b>blocking</b>, / <b>suggestion</b>, / or <b>question</b>. //<br>\"Blocking\" means the code should <b>not merge</b> / until it is <b>fixed</b>. //<br>\"Suggestion\" means you would do it <b>differently</b>, / but the <b>author</b> decides. //"}, "prompts": [{"q": "你在 review 一个同事的 PR，发现一个循环里每次都查数据库。口头跟他说这个问题：先说明是 blocking 还是 suggestion，再给理由和替代方案。", "ref": "Hey, one thing on your pull request, and I'd call this one blocking. The loop in the sync job queries the database once per user. For small accounts it's fine, but our biggest customers have thousands of users, so latency will spike badly. Could you batch the lookups into a single query? I left a short snippet in the comment that shows one way to do it.", "ref_zh": "嘿，你的 PR 有个问题，我觉得这个算 blocking。同步任务里那个循环每个用户查一次数据库。小账号没问题，但我们最大的客户有好几千个用户，延迟会飙得很厉害。能不能把这些查询合成一次批量查询？我在评论里贴了一小段代码，演示了一种写法。", "id": "ref0"}, {"q": "新人抱怨你的 review 评论太冷、太多小问题。用 30 秒向他解释你接下来会怎么改评论方式。", "ref": "Thanks for telling me, that's fair feedback. From now on I'll label every comment, so you'll know right away whether it's blocking, just a suggestion, or a real question. I'll also explain why I'm asking for a change. And I'll stop commenting on spacing, since the linter can catch that. If something still feels unclear, just ping me and we can talk it through.", "ref_zh": "谢谢你跟我说，这个反馈很中肯。以后我每条评论都会加标签，你一眼就能看出是 blocking、只是建议，还是真的在提问。我也会说明为什么要改。空格这类问题我就不评了，linter 能查出来。如果还有哪里不清楚，直接 ping 我，我们当面聊。", "id": "ref1"}], "words": [{"w": "hostile", "ipa": "/ˈhɑːstl/", "zh": "有敌意的", "ex": "His review comments read as hostile, though he meant them as questions.", "id": "w0"}, {"w": "intent", "ipa": "/ɪnˈtent/", "zh": "意图", "ex": "Add a line explaining the intent, not just the change.", "id": "w1"}, {"w": "trivial", "ip const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

}

// progress

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
