<script>
const D = {"id": "108", "type": "dialogue", "title": "When the Food Is Wrong", "meta": "B2 · 约 280 词 · 场景：上错菜、菜凉、等太久的礼貌投诉", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Waiter", "name_zh": "服务员", "voice": "en-GB-RyanNeural"}}, "gist": [{"q": "第一道菜和意面分别有什么问题？", "a": "三文鱼配菜上错了，点的是沙拉却上了土豆泥；意面早早上来，等其他菜时已经凉了，「你」要求重新做一份。"}, {"q": "孩子们的餐等了多久？服务员做了什么？", "a": "等了快四十分钟；服务员马上去催，并免费先送了面包。"}, {"q": "「你」提意见后，餐厅怎么补偿的？", "a": "服务员承认今晚人手不够，跟经理商量后免了意面的钱和服务费。"}], "dictation": [{"id": "s0_1_0", "text": "Sorry, I think there's been a mix-up. I actually ordered the salmon with salad, not mash."}, {"id": "s0_5_0", "text": "A fresh one would be better, if that's not too much trouble."}, {"id": "s0_9_0", "text": "Thank you. Could we get some bread for them in the meantime?"}, {"id": "s1_5_0", "text": "I appreciate you saying that. Is there anything you can do about the bill?"}], "shadow": {"speaker": "A", "text": "Actually, we've been waiting almost forty minutes for the kids' meals. Could you check on them? They're getting quite cranky.", "marked": "Actually, / we've been waiting <b>almost forty minutes</b> / for the kids' meals. //<br>Could you <b>check</b> on them? //<br>They're getting quite <b>cranky</b>. //"}, "prompts": [{"q": "你点的牛排要五分熟，端上来几乎全熟了。礼貌地跟服务员说明，并提出你希望的处理方式。", "ref": "Excuse me, sorry to bother you. I asked for my steak medium, but this one is almost well done. It's quite dry inside. Would it be possible to have it cooked again? I'm happy to wait. And could you keep the sides warm for me, so everything comes out together this time?", "ref_zh": "不好意思，打扰一下。我的牛排要的是五分熟，但这块几乎全熟了，里面挺干的。能重新做一份吗？我可以等。另外配菜能帮我保温一下吗？这次一起上。", "id": "ref0"}, {"q": "你在一碗汤里发现了一根头发。冷静地叫来服务员，说明情况，不想闹大，但希望换掉这道菜。", "ref": "Hi, sorry, could you come over for a second? I just found a hair in my soup. I don't want to make a big deal out of it, but I'd rather not eat this one. Could you take it away and bring me something else? Maybe the fish noodles instead. Thanks for understanding.", "ref_zh": "你好，不好意思，能过来一下吗？我刚在汤里发现了一根头发。我不想把事情闹大，但这碗我不想吃了。能拿走换个别的吗？换成鱼片面吧。谢谢理解。", "id": "ref1"}], "words": [{"w": "mix-up", "ipa": "/ˈmɪks ʌp/", "zh": "搞混；弄错", "ex": "There was a mix-up with our booking.", "id": "w0"}, {"w": "lukewarm", "ipa": "/ˌluːkˈwɔːrm/", "zh": "温吞的；不够热的", "ex": "The coffee was only lukewarm.", "id": "w1"}, {"w": "cranky", "ipa": "/ˈkræŋki/", "zh": "（孩子）烦躁闹脾气的", "ex": "He gets cranky when he's hungry.", "id": "w2"}, {"w": "chase up", "ipa": "/tʃeɪs ʌp/", "zh": "催办", "ex": "Could you chase up my order? It's been a while.", "id": "w3"}, {"w": "in the meantime", "ipa": "/ɪn ðə ˈmiːntaɪm/", "zh": "在此期间", "ex": "The doctor is running late. In the meantime, please fill in this form.", "id": "w4"}, {"w": "on the house", "ipa": "/ɑːn ðə haʊs/", "zh": "店家免费请客", "ex": "The dessert is on the house tonight.", "id": "w5"}, {"w": "short-staffed", "ipa": "/ˌʃɔːrt ˈstæft/", "zh": "人手不足的", "ex": "Sorry for the wait, we're short-staffed today.", "id": "w6"}, {"w": "excuse (n.)", "ipa": "/ɪkˈskjuːs/", "zh": "借口；理由", "ex": "Being busy is no excuse for being rude.", "tts_w": "excuse", "id": "w7"}, {"w": "waive", "ipa": "/weɪv/", "zh": "免除（费用）", "ex": "They waived the delivery fee because it came late.", "id": "w8"}], "sections": [{"heading": "1. The Wrong Dish", "heading_zh": "1. 上错菜", "rows": [[{"id": "s0_0_0", "md": "Here you are, the grilled salmon with mashed potatoes.", "text": "Here you are, the grilled salmon with mashed potatoes.", "zh": "您的烤三文鱼配土豆泥。", "sp": "B"}], [{"id": "s0_1_0", "md": "Sorry, I think there's been a ==mix-up==. I actually ordered the salmon with salad, not mash.", "text": "Sorry, I think there's been a mix-up. I actually ordered the salmon with salad, not mash.", "zh": "不好意思，好像搞错了。我点的是三文鱼配沙拉，不是土豆泥。", "sp": "A"}], [{"id": "s0_2_0", "md": "Oh, I do apologise. Let me check. You're quite right, it says salad. I'll get that changed.", "text": "Oh, I do apologise. Let me check. You're quite right, it says salad. I'll get that changed.", "zh": "哦，非常抱歉。我查一下。您说得对，单子上写的是沙拉。我马上给您换。", "sp": "B"}], [{"id": "s0_3_0", "md": "Thanks. Also, the pasta came out a while ago, and it's gone ==lukewarm== while we waited for everything else.", "text": "Thanks. Also, the pasta came out a while ago, and it's gone lukewarm while we waited for everything else.", "zh": "谢谢。另外意面很早就上了，等其他菜的时候已经温吞了。", "sp": "A"}], [{"id": "s0_4_0", "md": "I'm sorry about that. Would you like the kitchen to __heat it up__, or make a fresh one?", "text": "I'm sorry about that. Would you like the kitchen to heat it up, or make a fresh one?", "zh": "抱歉。您是想让厨房热一下，还是重新做一份？", "sp": "B"}], [{"id": "s0_5_0", "md": "**A fresh one would be better, if that's not too much trouble.**", "text": "A fresh one would be better, if that's not too much trouble.", "zh": "如果不太麻烦的话，重新做一份更好。", "sp": "A"}], [{"id": "s0_6_0", "md": "Not at all. Is everything else alright?", "text": "Not at all. Is everything else alright?", "zh": "一点也不麻烦。其他还好吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Actually, we've been waiting almost forty minutes for the kids' meals. Could you __check on__ them? They're getting quite ==cranky==.", "text": "Actually, we've been waiting almost forty minutes for the kids' meals. Could you check on them? They're getting quite cranky.", "zh": "其实孩子们的餐我们已经等了快四十分钟了。能帮忙催一下吗？他们已经开始闹脾气了。", "sp": "A"}], [{"id": "s0_8_0", "md": "Of course. I'll __chase it up__ right now.", "text": "Of course. I'll chase it up right now.", "zh": "当然，我现在就去催。", "sp": "B"}], [{"id": "s0_9_0", "md": "**Thank you. Could we get some bread for them in the meantime?**", "text": "Thank you. Could we get some bread for them in the meantime?", "zh": "谢谢。这期间能先给他们来点面包吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Certainly. I'll bring some over, ==on the house==.", "text": "Certainly. I'll bring some over, on the house.", "zh": "当然。我拿一些过来，免费的。", "sp": "B"}]]}, {"heading": "2. Giving Feedback", "heading_zh": "2. 提意见", "rows": [[{"id": "s1_0_0", "md": "How was everything in the end?", "text": "How was everything in the end?", "zh": "最后吃得怎么样？", "sp": "B"}], [{"id": "s1_1_0", "md": "The food was good once it came, but honestly, the wait was really long. I'd like to give some feedback, if that's okay.", "text": "The food was good once it came, but honestly, the wait was really long. I'd like to give some feedback, if that's okay.", "zh": "菜上了以后挺好吃的，不过说实话，等得太久了。我想提点意见，可以吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Please do. We'd appreciate it.", "text": "Please do. We'd appreciate it.", "zh": "请说，我们很欢迎。", "sp": "B"}], [{"id": "s1_3_0", "md": "We waited nearly an hour for the kids' food, and two dishes came out wrong. It __put a damper on__ the evening.", "text": "We waited nearly an hour for the kids' food, and two dishes came out wrong. It put a damper on the evening.", "zh": "孩子的饭等了将近一个小时，还有两道菜上错了。整晚的兴致都被扫了。", "sp": "A"}], [{"id": "s1_4_0", "md": "I completely understand, and I'm really sorry. We're ==short-staffed== tonight, but that's no ==excuse==.", "text": "I completely understand, and I'm really sorry. We're short-staffed tonight, but that's no excuse.", "zh": "我完全理解，真的很抱歉。我们今晚人手不够，但这不是理由。", "sp": "B"}], [{"id": "s1_5_0", "md": "**I appreciate you saying that. Is there anything you can do about the bill?**", "text": "I appreciate you saying that. Is there anything you can do about the bill?", "zh": "谢谢你这么说。账单上能有什么表示吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "I've spoken to my manager. We've taken the pasta off, and we've ==waived== the service charge.", "text": "I've spoken to my manager. We've taken the pasta off, and we've waived the service charge.", "zh": "我跟经理说过了。意面不收钱，服务费也免了。", "sp": "B"}], [{"id": "s1_7_0", "md": "**That's very fair. Thanks for handling it so well.**", "text": "That's very fair. Thanks for handling it so well.", "zh": "很公道。谢谢你处理得这么好。", "sp": "A"}], [{"id": "s1_8_0", "md": "Thank you for being so understanding. We hope you'll __give us another chance__.", "text": "T "zh": "谢谢你这么说。账单上能有什么表示吗？", "sp": "A", "gap": false, "start": 90.528, "end": 94.464, "words": [[90.633, 90.725], [90.739, 91.199], [91.212, 91.278], [91.291, 91.62], [91.633, 91.936], [92.37, 92.475], [92.489, 92.646], [92.66, 93.015], [93.028, 93.133], [93.146, 93.265], [93.278, 93.436], [93.449, 93.699], [93.712, 93.791], [93.804, 94.081]]}, {"kind": "s", "id": "s1_6_0", "md": "I've spoken to my manager. We've taken the pasta off, and we've ==waived== the service charge.", "zh": "我跟经理说过了。意面不收钱，服务费也免了。", "sp": "B", "gap": false, "start": 94.464, "end": 101.304, "words": [[94.564, 94.748], [94.761, 95.156], [95.169, 95.261], [95.275, 95.419], [95.432, 96.038], [96.948, 97.198], [97.211, 97.527], [97.54, 97.619], [97.632, 97.988], [98.001, 98.343], [98.593, 98.698], [98.711, 98.869], [98.882, 99.225], [99.238, 99.317], [99.33, 99.777], [99.79, 100.396]]}, {"kind": "s", "id": "s1_7_0", "md": "**That's very fair. Thanks for handling it so well.**", "zh": "很公道。谢谢你处理得这么好。", "sp": "A", "gap": false, "start": 101.304, "end": 104.496, "words": [[101.422, 101.58], [101.593, 101.83], [101.843, 102.251], [102.699, 102.87], [102.883, 103.015], [103.028, 103.436], [103.449, 103.528], [103.541, 103.751], [103.765, 104.107]]}, {"kind": "s", "id": "s1_8_0", "md": "Thank you for being so understanding. We hope you'll __give us another chance__.", "zh": "谢谢您这么体谅。希望您再给我们一次机会。", "sp": "B", "gap": false, "start": 104.496, "end": 110.232, "words": [[104.596, 104.925], [104.938, 105.017], [105.03, 105.162], [105.175, 105.425], [105.438, 105.701], [105.714, 106.543], [107.454, 107.612], [107.625, 107.901], [107.914, 108.059], [108.072, 108.23], [108.243, 108.349], [108.362, 108.678], [108.691, 109.322]]}, {"kind": "s", "id": "s1_9_0", "md": "We will. The salmon was lovely, actually.", "zh": "会的。其实三文鱼很好吃。", "sp": "A", "gap": false, "start": 110.232, "end": 113.256, "words": [[110.337, 110.456], [110.469, 110.719], [111.166, 111.219], [111.232, 111.574], [111.587, 111.732], [111.745, 112.166], [112.337, 112.864]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
