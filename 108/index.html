const D = {"id": "108", "type": "dialogue", "title": "When the Food Is Wrong", "meta": "B2 · 约 280 词 · 场景：上错菜、菜凉、等太久的礼貌投诉", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Waiter", "name_zh": "服务员", "voice": "en-GB-RyanNeural"}}, "gist": [{"q": "第一道菜和意面分别有什么问题？", "a": "三文鱼配菜上错了，点的是沙拉却上了土豆泥；意面早早上来，等其他菜时已经凉了，「你」要求重新做一份。"}, {"q": "孩子们的餐等了多久？服务员做了什么？", "a": "等了快四十分钟；服务员马上去催，并免费先送了面包。"}, {"q": "「你」提意见后，餐厅怎么补偿的？", "a": "服务员承认今晚人手不够，跟经理商量后免了意面的钱和服务费。"}], "dictation": [{"id": "s0_1_0", "text": "Sorry, I think there's been a mix-up. I actually ordered the salmon with salad, not mash."}, {"id": "s0_5_0", "text": "A fresh one would be better, if that's not too much trouble."}, {"id": "s0_9_0", "text": "Thank you. Could we get some bread for them in the meantime?"}, {"id": "s1_5_0", "text": "I appreciate you saying that. Is there anything you can do about the bill?"}], "shadow": {"speaker": "A", "text": "Actually, we've been waiting almost forty minutes for the kids' meals. Could you check on them? They're getting quite cranky.", "marked": "Actually, / we've been waiting <b>almost forty minutes</b> / for the kids' meals. //<br>Could you <b>check</b> on them? //<br>They're getting quite <b>cranky</b>. //"}, "prompts": [{"q": "你点的牛排要五分熟，端上来几乎全熟了。礼貌地跟服务员说明，并提出你希望的处理方式。", "ref": "Excuse me, sorry to bother you. I asked for my steak medium, but this one is almost well done. It's quite dry inside. Would it be possible to have it cooked again? I'm happy to wait. And could you keep the sides warm for me, so everything comes out together this time?", "ref_zh": "不好意思，打扰一下。我的牛排要的是五分熟，但这块几乎全熟了，里面挺干的。能重新做一份吗？我可以等。另外配菜能帮我保温一下吗？这次一起上。", "id": "ref0"}, {"q": "你在一碗汤里发现了一根头发。冷静地叫来服务员，说明情况，不想闹大，但希望换掉这道菜。", "ref": "Hi, sorry, could you come over for a second? I just found a hair in my soup. I don't want to make a big deal out of it, but I'd rather not eat this one. Could you take it away and bring me something else? Maybe the fish noodles instead. Thanks for understanding.", "ref_zh": "你好，不好意思，能过来一下吗？我刚在汤里发现了一根头发。我不想把事情闹大，但这碗我不想吃了。能拿走换个别的吗？换成鱼片面吧。谢谢理解。", "id": "ref1"}], "words": [{"w": "mix-up", "ipa": "/ˈmɪks ʌp/", "zh": "搞混；弄错", "ex": "There was a mix-up with our booking.", "id": "w0"}, {"w": "lukewarm", "ipa": "/ˌluːkˈwɔːrm/", "zh": "温吞的；不够热的", "ex": "The coffee was only lukewarm.", "id": "w1"}, {"w": "cranky", "ipa": "/ˈkræŋki/", "zh": "（孩子）烦躁闹脾气的", "ex": "He gets cranky when he's hungry.", "id": "w2"}, {"w": "chase up", "ipa": "/tʃeɪs ʌp/", "zh": "催办", "ex": "Could you chase up my order? It's been a while.", "id": "w3"}, {"w": "in the meantime", "ipa": "/ɪn ðə ˈmiːntaɪm/", "zh": "在此期间", "ex": "The doctor is running late. In the meantime, please fill in this form.", "id": "w4"}, {"w": "on the house", "ipa": "/ɑːn ðə haʊs/", "zh": "店家免费请客", "ex": "The dessert is on the house tonight.", "id": "w5"}, {"w": "short-staffed", "ipa": "/ˌʃɔːrt ˈstæft/", "zh": "人手不足的", "ex": "Sorry for the wait, we're short-staffed today.", "id": "w6"}, {"w": "excuse (n.)", "ipa": "/ɪkˈskjuːs/", "zh": "借口；理由", "ex": "Being busy is no excuse for being rude.", "tts_w": "excuse", "id": "w7"}, {"w": "waive", "ipa": "/weɪv/", "zh": "免除（费用）", "ex": "They waived the delivery fee because it came late.", "id": "w8"}], "sections": [{"heading": "1. The Wrong Dish", "heading_zh": "1. 上错菜", "rows": [[{"id": "s0_0_0", "md": "Here you are, the grilled salmon with mashed potatoes.", "text": "Here you are, the grilled salmon with mashed potatoes.", "zh": "您的烤三文鱼配土豆泥。", "sp": "B"}], [{"id": "s0_1_0", "md": "Sorry, I think there's been a ==mix-up==. I actually ordered the salmon with salad, not mash.", "text": "Sorry, I think there's been a mix-up. I actually ordered the salmon with salad, not mash.", "zh": "不好意思，好像搞错了。我点的是三文鱼配沙拉，不是土豆泥。", "sp": "A"}], [{"id": "s0_2_0", "md": "Oh, I do apologise. Let me check. You're quite right, it says salad. I'll get that changed.", "text": "Oh, I do apologise. Let me check. You're quite right, it says salad. I'll get that changed.", "zh": "哦，非常抱歉。我查一下。您说得对，单子上写的是沙拉。我马上给您换。", "sp": "B"}], [{"id": "s0_3_0", "md": "Thanks. Also, the pasta came out a while ago, and it's gone ==lukewarm== while we waited for everything else.", "text": "Thanks. Also, the pasta came out a while ago, and it's gone lukewarm while we waited for everything else.", "zh": "谢谢。另外意面很早就上了，等其他菜的时候已经温吞了。", "sp": "A"}], [{"id": "s0_4_0", "md": "I'm sorry about that. Would you like the kitchen to __heat it up__, or make a fresh one?", "text": "I'm sorry about that. Would you like the kitchen to heat it up, or make a fresh one?", "zh": "抱歉。您是想让厨房热一下，还是重新做一份？", "sp": "B"}], [{"id": "s0_5_0", "md": "**A fresh one would be better, if that's not too much trouble.**", "text": "A fresh one would be better, if that's not too much trouble.", "zh": "如果不太麻烦的话，重新做一份更好。", "sp": "A"}], [{"id": "s0_6_0", "md": "Not at all. Is everything else alright?", "text": "Not at all. Is everything else alright?", "zh": "一点也不麻烦。其他还好吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Actually, we've been waiting almost forty minutes for the kids' meals. Could you __check on__ them? They're getting quite ==cranky==.", "text": "Actually, we've been waiting almost forty minutes for the kids' meals. Could you check on them? They're getting quite cranky.", "zh": "其实孩子们的餐我们已经等了快四十分钟了。能帮忙催一下吗？他们已经开始闹脾气了。", "sp": "A"}], [{"id": "s0_8_0", "md": "Of course. I'll __chase it up__ right now.", "text": "Of course. I'll chase it up right now.", "zh": "当然，我现在就去催。", "sp": "B"}], [{"id": "s0_9_0", "md": "**Thank you. Could we get some bread for them in the meantime?**", "text": "Thank you. Could we get some bread for them in the meantime?", "zh": "谢谢。这期间能先给他们来点面包吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Certainly. I'll bring some over, ==on the house==.", "text": "Certainly. I'll bring some over, on the house.", "zh": "当然。我拿一些过来，免费的。", "sp": "B"}]]}, {"heading": "2. Giving Feedback", "heading_zh": "2. 提意见", "rows": [[{"id": "s1_0_0", "md": "How was everything in the end?", "text": "How was everything in the end?", "zh": "最后吃得怎么样？", "sp": "B"}], [{"id": "s1_1_0", "md": "The food was good once it came, but honestly, the wait was really long. I'd like to give some feedback, if that's okay.", "text": "The food was good once it came, but honestly, the wait was really long. I'd like to give some feedback, if that's okay.", "zh": "菜上了以后挺好吃的，不过说实话，等得太久了。我想提点意见，可以吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Please do. We'd appreciate it.", "text": "Please do. We'd appreciate it.", "zh": "请说，我们很欢迎。", "sp": "B"}], [{"id": "s1_3_0", "md": "We waited nearly an hour for the kids' food, and two dishes came out wrong. It __put a damper on__ the evening.", "text": "We waited nearly an hour for the kids' food, and two dishes came out wrong. It put a damper on the evening.", "zh": "孩子的饭等了将近一个小时，还有两道菜上错了。整晚的兴致都被扫了。", "sp": "A"}], [{"id": "s1_4_0", "md": "I completely understand, and I'm really sorry. We're ==short-staffed== tonight, but that's no ==excuse==.", "text": "I completely understand, and I'm really sorry. We're short-staffed tonight, but that's no excuse.", "zh": "我完全理解，真的很抱歉。我们今晚人手不够，但这不是理由。", "sp": "B"}], [{"id": "s1_5_0", "md": "**I appreciate you saying that. Is there anything you can do about the bill?**", "text": "I appreciate you saying that. Is there anything you can do about the bill?", "zh": "谢谢你这么说。账单上能有什么表示吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "I've spoken to my manager. We've taken the pasta off, and we've ==waived== the service charge.", "text": "I've spoken to my manager. We've taken the pasta off, and we've waived the service charge.", "zh": "我跟经理说过了。意面不收钱，服务费也免了。", "sp": "B"}], [{"id": "s1_7_0", "md": "**That's very fair. Thanks for handling it so well.**", "text": "That's very fair. Thanks for handling it so well.", "zh": "很公道。谢谢你处理得这么好。", "sp": "A"}], [{"id": "s1_8_0", "md": "Thank you for being so understanding. We hope you'll __give us another chance__.", "text": "T const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
