<script>
const D = {"id": "056", "title": "Coaching with Questions", "meta": "B2 · 约 290 词 · 场景：辅导下属", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Answer Trap", "heading_zh": "1. 直接给答案的陷阱", "rows": [[{"id": "s0_0_0", "md": "A junior engineer comes to your desk with a slow query.", "text": "A junior engineer comes to your desk with a slow query.", "zh": "一位初级工程师拿着一条慢查询来找你。", "sp": null}, {"id": "s0_0_1", "md": "You can see the missing index in about ten seconds, so you tell her, and she fixes it.", "text": "You can see the missing index in about ten seconds, so you tell her, and she fixes it.", "zh": "你大概十秒钟就看出缺了个索引，于是告诉她，她修好了。", "sp": null}, {"id": "s0_0_2", "md": "It feels efficient, and for today, it is.", "text": "It feels efficient, and for today, it is.", "zh": "感觉很高效，就今天来说，也确实是。", "sp": null}], [{"id": "s0_1_0", "md": "But notice what she learned.", "text": "But notice what she learned.", "zh": "但留意一下她学到了什么。", "sp": null}, {"id": "s0_1_1", "md": "She learned that when something is hard, the fastest path is to ask you.", "text": "She learned that when something is hard, the fastest path is to ask you.", "zh": "她学到的是：遇到难题，最快的路就是来问你。", "sp": null}, {"id": "s0_1_2", "md": "Next week she will come back with a ==similar== problem, and the week after that too.", "text": "Next week she will come back with a similar problem, and the week after that too.", "zh": "下周她会带着类似的问题回来，再下周也一样。", "sp": null}, {"id": "s0_1_3", "md": "**Every answer you give for free is a problem you will be asked to solve again.**", "text": "Every answer you give for free is a problem you will be asked to solve again.", "zh": "你白给出去的每一个答案，都是一个你以后还会被要求再解决一遍的问题。", "sp": null}], [{"id": "s0_2_0", "md": "Coaching with questions feels slower at first.", "text": "Coaching with questions feels slower at first.", "zh": "用提问来辅导，一开始会感觉更慢。", "sp": null}, {"id": "s0_2_1", "md": "It __takes patience__ to watch someone struggle with a problem you could solve instantly.", "text": "It takes patience to watch someone struggle with a problem you could solve instantly.", "zh": "看着一个人在你瞬间就能解决的问题上挣扎，是需要耐心的。", "sp": null}, {"id": "s0_2_2", "md": "Yet it builds the one thing an answer cannot: the ==ability== to find the next answer without you, which is the whole ==purpose== of coaching.", "text": "Yet it builds the one thing an answer cannot: the ability to find the next answer without you, which is the whole purpose of coaching.", "zh": "但它能培养出一样答案给不了的东西：不靠你也能找到下一个答案的能力，而这正是辅导的全部意义。", "sp": null}]]}, {"heading": "2. Questions That Do the Teaching", "heading_zh": "2. 用问题来教", "rows": [[{"id": "s1_0_0", "md": "Start with \"What have you tried so far?\"", "text": "Start with \"What have you tried so far?\"", "zh": "从「你目前都试过什么了？」开始。", "sp": null}, {"id": "s1_0_1", "md": "It shows respect for her effort and tells you where her thinking stopped.", "text": "It shows respect for her effort and tells you where her thinking stopped.", "zh": "这表示你尊重她的努力，也能让你知道她的思路卡在哪儿。", "sp": null}, {"id": "s1_0_2", "md": "Often, simply explaining the problem out loud helps her __spot the issue__ herself.", "text": "Often, simply explaining the problem out loud helps her spot the issue herself.", "zh": "很多时候，光是把问题大声讲出来，她自己就能发现问题所在。", "sp": null}], [{"id": "s1_1_0", "md": "Then ask questions that point the way without ==spoiling== the answer.", "text": "Then ask questions that point the way without spoiling the answer.", "zh": "然后，问一些能指方向、但不剧透答案的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"What does the query plan say?\" or \"Which part of the request takes the longest?\"", "text": "\"What does the query plan say?\" or \"Which part of the request takes the longest?\"", "zh": "「执行计划怎么说？」或者「请求里哪一部分耗时最长？」", "sp": null}, {"id": "s1_1_2", "md": "Each question narrows the search, but she still makes the ==discovery==.", "text": "Each question narrows the search, but she still makes the discovery.", "zh": "每个问题都在缩小排查范围，但发现还是由她自己来完成。", "sp": null}], [{"id": "s1_2_0", "md": "A powerful one for stuck moments is \"If I weren't here, what would you try next?\"", "text": "A powerful one for stuck moments is \"If I weren't here, what would you try next?\"", "zh": "卡住的时候，有个特别管用的问题：「如果我不在，你下一步会试什么？」", "sp": null}, {"id": "s1_2_1", "md": "People usually have an idea; they just want permission to try it.", "text": "People usually have an idea; they just want permission to try it.", "zh": "人们通常是有想法的；他们只是想得到允许去试。", "sp": null}, {"id": "s1_2_2", "md": "**Your job is to make thinking out loud feel safe, not to grade the answer.**", "text": "Your job is to make thinking out loud feel safe, not to grade the answer.", "zh": "你的工作是让大声思考变得安全，而不是给答案打分。", "sp": null}], [{"id": "s1_3_0", "md": "Know when to stop, though.", "text": "Know when to stop, though.", "zh": "不过，要知道什么时候该停。", "sp": null}, {"id": "s1_3_1", "md": "During an outage, or when she is clearly ==exhausted==, just give the answer and __debrief later__.", "text": "During an outage, or when she is clearly exhausted, just give the answer and debrief later.", "zh": "线上故障的时候，或者她明显已经累坏了，就直接给答案，事后再复盘。", "sp": null}, {"id": "s1_3_2", "md": "Coaching is an ==investment==, and you make investments when there is time, not in the middle of a fire.", "text": "Coaching is an investment, and you make investments when there is time, not in the middle of a fire.", "zh": "辅导是一种投资，投资要在有时间的时候做，而不是在救火的时候。", "sp": null}]]}], "gist": [{"q": "直接给答案有什么隐藏的问题？", "a": "对方学到的是遇到难题最快的办法就是问你，下周还会带着类似问题回来；每个白给的答案都是你要再解决一次的问题。"}, {"q": "作者推荐了哪些辅导问题？", "a": "你已经试过什么；引导而不揭晓答案的问题（查询计划怎么说、哪部分最慢）；如果我不在，你下一步会试什么。"}, {"q": "什么时候不该用提问式辅导？", "a": "线上事故时或对方明显精疲力竭时，直接给答案，事后再复盘；辅导是投资，要在有时间时做。"}], "dictation": [{"id": "s0_1_3", "text": "Every answer you give for free is a problem you will be asked to solve again."}, {"id": "s1_0_1", "text": "It shows respect for her effort and tells you where her thinking stopped."}, {"id": "s1_2_1", "text": "People usually have an idea; they just want permission to try it."}, {"id": "s1_2_2", "text": "Your job is to make thinking out loud feel safe, not to grade the answer."}], "shadow": {"text": "A powerful one for stuck moments is \"If I weren't here, what would you try next?\" People usually have an idea; they just want permission to try it.", "marked": "A <b>powerful</b> one for <b>stuck</b> moments is / \"If I <b>weren't</b> here, / what would <b>you</b> try next?\" //<br>People <b>usually</b> have an idea; / they just want <b>permission</b> / to <b>try</b> it. //"}, "prompts": [{"q": "一位新人来问你：服务的 P99 延迟突然升高，该怎么查？你知道大概原因，但想让他自己找到。用 30 秒用提问引导他。", "ref": "Good catch noticing that. Before I jump in, what have you looked at so far? Okay, so the average looks normal and only the tail is high. What does that usually tell you? Which requests are in that slow tail, and do they have anything in common? Take a look at the traces for ten of them and tell me what you see.", "ref_zh": "发现得好。在我插手之前，你目前都看了些什么？好，所以平均值看着正常，只有长尾高。这通常说明什么？慢的长尾里都是哪些请求，它们有什么共同点吗？挑十个看看它们的 trace，然后告诉我你看到了什么。", "id": "ref0"}, {"q": "下属卡住了，问你该选方案 A 还是方案 B。你想让他自己做决定。用 30 秒回应。", "ref": "I have an opinion, but I'd rather hear yours first. If I weren't around this week, which one would you pick, and why? Tell me what you'd be giving up with that choice. If your reasoning holds up, go with it, and I'll back you in the review. If we see a gap, we'll talk it through together.", "ref_zh": "我有我的看法，但我更想先听听你的。如果这周我不在，你会选哪一个，为什么？说说选了它你会放弃什么。如果你的理由站得住，就按你的来，评审的时候我会支持你。如果我们发现有漏洞，就一起讨论。", "id": "ref1"}], "words": [{"w": "similar", "ipa": "/ˈsɪmələr/", "zh": "类似的", "ex": "We had a similar timeout issue on the order service last month.", "id": "w0"}, {"w": "ability", "ipa": "/əˈbɪləti/", "zh": "能力", "ex": "The goal is the ability to debug production issues alone.", "id": "w1"}, {"w": "purpose", "ipa": "/ˈpɜːrpəs/", "zh": "目的", "ex": "The purpose of this review is learning, not blame.", "id": "w2"}, {"w": "spoil", "ipa": "/spɔɪl/", "zh": "剧透、破坏", "ex": "I don't want to spoil it; check the slow query log first.", "id": "w3"}, {"w": " const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
