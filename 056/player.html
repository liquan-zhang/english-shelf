<script>
const D = {"id": "056", "title": "Coaching with Questions", "meta": "B2 · 约 290 词 · 场景：辅导下属", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Answer Trap", "heading_zh": "1. 直接给答案的陷阱", "rows": [[{"id": "s0_0_0", "md": "A junior engineer comes to your desk with a slow query.", "text": "A junior engineer comes to your desk with a slow query.", "zh": "一位初级工程师拿着一条慢查询来找你。", "sp": null}, {"id": "s0_0_1", "md": "You can see the missing index in about ten seconds, so you tell her, and she fixes it.", "text": "You can see the missing index in about ten seconds, so you tell her, and she fixes it.", "zh": "你大概十秒钟就看出缺了个索引，于是告诉她，她修好了。", "sp": null}, {"id": "s0_0_2", "md": "It feels efficient, and for today, it is.", "text": "It feels efficient, and for today, it is.", "zh": "感觉很高效，就今天来说，也确实是。", "sp": null}], [{"id": "s0_1_0", "md": "But notice what she learned.", "text": "But notice what she learned.", "zh": "但留意一下她学到了什么。", "sp": null}, {"id": "s0_1_1", "md": "She learned that when something is hard, the fastest path is to ask you.", "text": "She learned that when something is hard, the fastest path is to ask you.", "zh": "她学到的是：遇到难题，最快的路就是来问你。", "sp": null}, {"id": "s0_1_2", "md": "Next week she will come back with a ==similar== problem, and the week after that too.", "text": "Next week she will come back with a similar problem, and the week after that too.", "zh": "下周她会带着类似的问题回来，再下周也一样。", "sp": null}, {"id": "s0_1_3", "md": "**Every answer you give for free is a problem you will be asked to solve again.**", "text": "Every answer you give for free is a problem you will be asked to solve again.", "zh": "你白给出去的每一个答案，都是一个你以后还会被要求再解决一遍的问题。", "sp": null}], [{"id": "s0_2_0", "md": "Coaching with questions feels slower at first.", "text": "Coaching with questions feels slower at first.", "zh": "用提问来辅导，一开始会感觉更慢。", "sp": null}, {"id": "s0_2_1", "md": "It __takes patience__ to watch someone struggle with a problem you could solve instantly.", "text": "It takes patience to watch someone struggle with a problem you could solve instantly.", "zh": "看着一个人在你瞬间就能解决的问题上挣扎，是需要耐心的。", "sp": null}, {"id": "s0_2_2", "md": "Yet it builds the one thing an answer cannot: the ==ability== to find the next answer without you, which is the whole ==purpose== of coaching.", "text": "Yet it builds the one thing an answer cannot: the ability to find the next answer without you, which is the whole purpose of coaching.", "zh": "但它能培养出一样答案给不了的东西：不靠你也能找到下一个答案的能力，而这正是辅导的全部意义。", "sp": null}]]}, {"heading": "2. Questions That Do the Teaching", "heading_zh": "2. 用问题来教", "rows": [[{"id": "s1_0_0", "md": "Start with \"What have you tried so far?\"", "text": "Start with \"What have you tried so far?\"", "zh": "从「你目前都试过什么了？」开始。", "sp": null}, {"id": "s1_0_1", "md": "It shows respect for her effort and tells you where her thinking stopped.", "text": "It shows respect for her effort and tells you where her thinking stopped.", "zh": "这表示你尊重她的努力，也能让你知道她的思路卡在哪儿。", "sp": null}, {"id": "s1_0_2", "md": "Often, simply explaining the problem out loud helps her __spot the issue__ herself.", "text": "Often, simply explaining the problem out loud helps her spot the issue herself.", "zh": "很多时候，光是把问题大声讲出来，她自己就能发现问题所在。", "sp": null}], [{"id": "s1_1_0", "md": "Then ask questions that point the way without ==spoiling== the answer.", "text": "Then ask questions that point the way without spoiling the answer.", "zh": "然后，问一些能指方向、但不剧透答案的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"What does the query plan say?\" or \"Which part of the request takes the longest?\"", "text": "\"What does the query plan say?\" or \"Which part of the request takes the longest?\"", "zh": "「执行计划怎么说？」或者「请求里哪一部分耗时最长？」", "sp": null}, {"id": "s1_1_2", "md": "Each question narrows the search, but she still makes the ==discovery==.", "text": "Each question narrows the search, but she still makes the discovery.", "zh": "每个问题都在缩小排查范围，但发现还是由她自己来完成。", "sp": null}], [{"id": "s1_2_0", "md": "A powerful one for stuck moments is \"If I weren't here, what would you try next?\"", "text": "A powerful one for stuck moments is \"If I weren't here, what would you try next?\"", "zh": "卡住的时候，有个特别管用的问题：「如果我不在，你下一步会试什么？」", "sp": null}, {"id": "s1_2_1", "md": "People usually have an idea; they just want permission to try it.", "text": "People usually have an idea; they just want permission to try it.", "zh": "人们通常是有想法的；他们只是想得到允许去试。", "sp": null}, {"id": "s1_2_2", "md": "**Your job is to make thinking out loud feel safe, not to grade the answer.**", "text": "Your job is to make thinking out loud feel safe, not to grade the answer.", "zh": "你的工作是让大声思考变得安全，而不是给答案打分。", "sp": null}], [{"id": "s1_3_0", "md": "Know when to stop, though.", "text": "Know when to stop, though.", "zh": "不过，要知道什么时候该停。", "sp": null}, {"id": "s1_3_1", "md": "During an outage, or when she is clearly ==exhausted==, just give the answer and __debrief later__.", "text": "During an outage, or when she is clearly exhausted, just give the answer and debrief later.", "zh": "线上故障的时候，或者她明显已经累坏了，就直接给答案，事后再复盘。", "sp": null}, {"id": "s1_3_2", "md": "Coaching is an ==investment==, and you make investments when there is time, not in the middle of a fire.", "text": "Coaching is an investment, and you make investments when there is time, not in the middle of a fire.", "zh": "辅导是一种投资，投资要在有时间的时候做，而不是在救火的时候。", "sp": null}]]}], "gist": [{"q": "直接给答案有什么隐藏的问题？", "a": "对方学到的是遇到难题最快的办法就是问你，下周还会带着类似问题回来；每个白给的答案都是你要再解决一次的问题。"}, {"q": "作者推荐了哪些辅导问题？", "a": "你已经试过什么；引导而不揭晓答案的问题（查询计划怎么说、哪部分最慢）；如果我不在，你下一步会试什么。"}, {"q": "什么时候不该用提问式辅导？", "a": "线上事故时或对方明显精疲力竭时，直接给答案，事后再复盘；辅导是投资，要在有时间时做。"}], "dictation": [{"id": "s0_1_3", "text": "Every answer you give for free is a problem you will be asked to solve again."}, {"id": "s1_0_1", "text": "It shows respect for her effort and tells you where her thinking stopped."}, {"id": "s1_2_1", "text": "People usually have an idea; they just want permission to try it."}, {"id": "s1_2_2", "text": "Your job is to make thinking out loud feel safe, not to grade the answer."}], "shadow": {"text": "A powerful one for stuck moments is \"If I weren't here, what would you try next?\" People usually have an idea; they just want permission to try it.", "marked": "A <b>powerful</b> one for <b>stuck</b> moments is / \"If I <b>weren't</b> here, / what would <b>you</b> try next?\" //<br>People <b>usually</b> have an idea; / they just want <b>permission</b> / to <b>try</b> it. //"}, "prompts": [{"q": "一位新人来问你：服务的 P99 延迟突然升高，该怎么查？你知道大概原因，但想让他自己找到。用 30 秒用提问引导他。", "ref": "Good catch noticing that. Before I jump in, what have you looked at so far? Okay, so the average looks normal and only the tail is high. What does that usually tell you? Which requests are in that slow tail, and do they have anything in common? Take a look at the traces for ten of them and tell me what you see.", "ref_zh": "发现得好。在我插手之前，你目前都看了些什么？好，所以平均值看着正常，只有长尾高。这通常说明什么？慢的长尾里都是哪些请求，它们有什么共同点吗？挑十个看看它们的 trace，然后告诉我你看到了什么。", "id": "ref0"}, {"q": "下属卡住了，问你该选方案 A 还是方案 B。你想让他自己做决定。用 30 秒回应。", "ref": "I have an opinion, but I'd rather hear yours first. If I weren't around this week, which one would you pick, and why? Tell me what you'd be giving up with that choice. If your reasoning holds up, go with it, and I'll back you in the review. If we see a gap, we'll talk it through together.", "ref_zh": "我有我的看法，但我更想先听听你的。如果这周我不在，你会选哪一个，为什么？说说选了它你会放弃什么。如果你的理由站得住，就按你的来，评审的时候我会支持你。如果我们发现有漏洞，就一起讨论。", "id": "ref1"}], "words": [{"w": "similar", "ipa": "/ˈsɪmələr/", "zh": "类似的", "ex": "We had a similar timeout issue on the order service last month.", "id": "w0"}, {"w": "ability", "ipa": "/əˈbɪləti/", "zh": "能力", "ex": "The goal is the ability to debug production issues alone.", "id": "w1"}, {"w": "purpose", "ipa": "/ˈpɜːrpəs/", "zh": "目的", "ex": "The purpose of this review is learning, not blame.", "id": "w2"}, {"w": "spoil", "ipa": "/spɔɪl/", "zh": "剧透、破坏", "ex": "I don't want to spoil it; check the slow query log first.", "id": "w3"}, {"w": " const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
