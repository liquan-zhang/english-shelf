<script>
const D = {"id": "119", "type": "dialogue", "title": "Asking About a Strange Charge", "meta": "B2 · 约 260 词 · 场景：电话查询账单上的陌生扣款", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Customer Service", "name_zh": "银行客服", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "那笔一百一十九元的陌生扣款是什么？", "a": "去年注册的云存储免费试用自动转成了年度付费订阅。"}, {"q": "银行能帮「你」退这笔订阅费吗？", "a": "不能，因为同意过条款；需要自己直接联系那家公司，尽快取消可能会退款。"}, {"q": "酒店的两笔扣款是怎么回事？", "a": "其中一笔是入住时的预授权冻结，七到十天内会释放；如果没释放再打电话，银行代为提出争议。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, there's a charge on my statement that I don't recognise. Could you help me look into it?"}, {"id": "s0_7_0", "text": "Can the bank get that money back for me?"}, {"id": "s1_2_0", "text": "Sorry, what does pending mean exactly? Has it been taken from my account or not?"}, {"id": "s1_6_0", "text": "Could you note that on my account, so I don't have to explain everything again?"}], "shadow": {"speaker": "A", "text": "The October one. It's one hundred and nineteen dollars, and the merchant is just a string of letters.", "marked": "The <b>October</b> one. //<br>It's one hundred and <b>nineteen</b> dollars, / and the <b>merchant</b> / is just a <b>string of letters</b>. //"}, "prompts": [{"q": "你发现自动续费的健身房会员费又扣了一个月，但你上个月已经取消了。打电话给健身房，要求退款。", "ref": "Hi, I cancelled my membership last month and got a confirmation email, but I was still charged for this month. It's eighty-nine dollars. Could you check your records and refund it? I can forward you the email if that helps. I'd also like a written confirmation that there won't be any more charges.", "ref_zh": "你好，我上个月取消了会员，也收到了确认邮件，但这个月还是被扣了八十九元。能帮我查一下记录并退款吗？需要的话我可以把邮件转发给你。我还想要一份书面确认，保证之后不会再扣费。", "id": "ref0"}, {"q": "你看到账单上有一笔国外的小额扣款，不确定是不是盗刷。打电话问银行该怎么判断、要不要换卡。", "ref": "Hi, I noticed a small charge from an overseas website on my card, only about three dollars, but I've never shopped there. I've read that people sometimes test stolen cards with small amounts. Could you tell me more about this merchant? If it looks suspicious, I think I'd rather block the card and get a new one.", "ref_zh": "你好，我看到卡上有一笔境外网站的小额扣款，大约三块钱，但我从没在那儿买过东西。我看到说有人会用小额消费测试盗来的卡。能告诉我这个商户的更多信息吗？如果看起来可疑，我宁愿把卡冻结，换张新卡。", "id": "ref1"}], "words": [{"w": "statement", "ipa": "/ˈsteɪtmənt/", "zh": "（银行）账单，对账单", "ex": "I check my credit card statement every month.", "id": "w0"}, {"w": "merchant", "ipa": "/ˈmɜːrtʃənt/", "zh": "商户", "ex": "The merchant name on the bill was different from the shop's name.", "id": "w1"}, {"w": "descriptor", "ipa": "/dɪˈskrɪptər/", "zh": "（账单上的）商户描述代码", "ex": "Search the descriptor online to see which company it is.", "id": "w2"}, {"w": "annual", "ipa": "/ˈænjuəl/", "zh": "每年的", "ex": "The annual fee is waived for the first year.", "id": "w3"}, {"w": "pending", "ipa": "/ˈpendɪŋ/", "zh": "待处理的，未入账的", "ex": "The refund is still pending.", "id": "w4"}, {"w": "hold", "ipa": "/hoʊld/", "zh": "冻结金额，预授权", "ex": "The car rental put a hold of five hundred dollars on my card.", "tts": "The car rental put a hold of five hundred dollars on my card.", "id": "w5"}, {"w": "dispute", "ipa": "/dɪˈspjuːt/", "zh": "争议，异议", "ex": "The bank will open a dispute with the shop.", "id": "w6"}, {"w": "roll over", "ipa": "/roʊl ˈoʊvər/", "zh": "自动续延", "ex": "The free trial rolls over into a paid plan after a month.", "id": "w7"}, {"w": "drop off", "ipa": "/drɑːp ɔːf/", "zh": "（冻结金额）自动消失", "ex": "The deposit hold should drop off in a few days.", "id": "w8"}], "sections": [{"heading": "1. A Name You Don't Recognise", "heading_zh": "1. 不认识的商户名", "rows": [[{"id": "s0_0_0", "md": "Good afternoon, you're speaking with Priya. How may I assist you?", "text": "Good afternoon, you're speaking with Priya. How may I assist you?", "zh": "下午好，我是 Priya。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, there's a charge on my statement that I don't recognise. Could you help me look into it?**", "text": "Hi, there's a charge on my statement that I don't recognise. Could you help me look into it?", "zh": "你好，我的账单上有一笔扣款我不认识。能帮我查一下吗？", "sp": "A"}], [{"id": "s0_2_0", "md": "Of course. Which ==statement== are you looking at, and what's the amount?", "text": "Of course. Which statement are you looking at, and what's the amount?", "zh": "当然。您看的是哪一期账单？金额是多少？", "sp": "B"}], [{"id": "s0_3_0", "md": "The October one. It's one hundred and nineteen dollars, and the ==merchant== is just a string of letters.", "text": "The October one. It's one hundred and nineteen dollars, and the merchant is just a string of letters.", "zh": "十月的。一百一十九元，商户名就是一串字母。", "sp": "A"}], [{"id": "s0_4_0", "md": "Let me pull it up. That ==descriptor== belongs to a software company. It's an ==annual== subscription for cloud storage.", "text": "Let me pull it up. That descriptor belongs to a software company. It's an annual subscription for cloud storage.", "zh": "我调出来看看。这个商户代码属于一家软件公司，是云存储的年度订阅。", "sp": "B"}], [{"id": "s0_5_0", "md": "Oh. I signed up for a free trial last year and __completely forgot__ about it.", "text": "Oh. I signed up for a free trial last year and completely forgot about it.", "zh": "哦。我去年注册了个免费试用，完全忘了这事。", "sp": "A"}], [{"id": "s0_6_0", "md": "That happens a lot. The trial __rolls over__ into a paid plan automatically.", "text": "That happens a lot. The trial rolls over into a paid plan automatically.", "zh": "这种情况很常见。试用期结束会自动转成付费套餐。", "sp": "B"}], [{"id": "s0_7_0", "md": "Can the bank get that money back for me?", "text": "Can the bank get that money back for me?", "zh": "银行能帮我把这笔钱要回来吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "Since you agreed to the terms, you'd need to ask the company directly. Many will refund if you cancel quickly.", "text": "Since you agreed to the terms, you'd need to ask the company directly. Many will refund if you cancel quickly.", "zh": "因为您同意过条款，需要直接联系那家公司。很多公司如果您尽快取消，会给退款。", "sp": "B"}]]}, {"heading": "2. Charged Twice", "heading_zh": "2. 被扣了两次", "rows": [[{"id": "s1_0_0", "md": "Okay, I'll do that. While I have you, there's another problem. A hotel charged me twice.", "text": "Okay, I'll do that. While I have you, there's another problem. A hotel charged me twice.", "zh": "好，我去联系。顺便还有个问题，有家酒店扣了我两次钱。", "sp": "A"}], [{"id": "s1_1_0", "md": "I see two payments of four hundred and fifty dollars. One is still ==pending==, though.", "text": "I see two payments of four hundred and fifty dollars. One is still pending, though.", "zh": "我看到两笔四百五十元的扣款，不过其中一笔还在处理中。", "sp": "B"}], [{"id": "s1_2_0", "md": "Sorry, what does pending mean exactly? __Has it been taken__ from my account or not?", "text": "Sorry, what does pending mean exactly? Has it been taken from my account or not?", "zh": "不好意思，处理中具体是什么意思？钱到底扣走了没有？", "sp": "A"}], [{"id": "s1_3_0", "md": "It's a ==hold== the hotel placed at check-in. It usually __drops off__ within seven to ten days.", "text": "It's a hold the hotel placed at check-in. It usually drops off within seven to ten days.", "zh": "那是酒店入住时做的预授权冻结，一般七到十天内会自动释放。", "sp": "B"}], [{"id": "s1_4_0", "md": "And if it doesn't drop off by then?", "text": "And if it doesn't drop off by then?", "zh": "如果到时候还没释放呢？", "sp": "A"}], [{"id": "s1_5_0", "md": "Then please call us back and we'll raise a ==dispute== with the hotel on your behalf.", "text": "Then please call us back and we'll raise a dispute with the hotel on your behalf.", "zh": "那就再打给我们，我们代您向酒店提出争议。", "sp": "B"}], [{"id": "s1_6_0", "md": "**Could you note that on my account, so I don't have to explain everything again?**", "text": "Could you note that on my account, so I don't have to explain everything again?", "zh": "能在我账户上备注一下吗？免得我还得从头解释一遍。", "sp": "A"}], [{"id": "s1_7_0", "md": "Certainly, I've added a note. Is there anything else I can help you with today?", "text": "Certainly, I've added a note. Is there anything else I can help you with today?", "zh": "当然，已经加了备注。今天还有别的需要帮忙的吗？", "sp": "B"}], [{"id": "s1_8_0", "md": "No, that's everything. Thanks for explaining it so clearly.", "text": "No, that' const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
