const D = {"id": "119", "type": "dialogue", "title": "Asking About a Strange Charge", "meta": "B2 · 约 260 词 · 场景：电话查询账单上的陌生扣款", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Customer Service", "name_zh": "银行客服", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "那笔一百一十九元的陌生扣款是什么？", "a": "去年注册的云存储免费试用自动转成了年度付费订阅。"}, {"q": "银行能帮「你」退这笔订阅费吗？", "a": "不能，因为同意过条款；需要自己直接联系那家公司，尽快取消可能会退款。"}, {"q": "酒店的两笔扣款是怎么回事？", "a": "其中一笔是入住时的预授权冻结，七到十天内会释放；如果没释放再打电话，银行代为提出争议。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, there's a charge on my statement that I don't recognise. Could you help me look into it?"}, {"id": "s0_7_0", "text": "Can the bank get that money back for me?"}, {"id": "s1_2_0", "text": "Sorry, what does pending mean exactly? Has it been taken from my account or not?"}, {"id": "s1_6_0", "text": "Could you note that on my account, so I don't have to explain everything again?"}], "shadow": {"speaker": "A", "text": "The October one. It's one hundred and nineteen dollars, and the merchant is just a string of letters.", "marked": "The <b>October</b> one. //<br>It's one hundred and <b>nineteen</b> dollars, / and the <b>merchant</b> / is just a <b>string of letters</b>. //"}, "prompts": [{"q": "你发现自动续费的健身房会员费又扣了一个月，但你上个月已经取消了。打电话给健身房，要求退款。", "ref": "Hi, I cancelled my membership last month and got a confirmation email, but I was still charged for this month. It's eighty-nine dollars. Could you check your records and refund it? I can forward you the email if that helps. I'd also like a written confirmation that there won't be any more charges.", "ref_zh": "你好，我上个月取消了会员，也收到了确认邮件，但这个月还是被扣了八十九元。能帮我查一下记录并退款吗？需要的话我可以把邮件转发给你。我还想要一份书面确认，保证之后不会再扣费。", "id": "ref0"}, {"q": "你看到账单上有一笔国外的小额扣款，不确定是不是盗刷。打电话问银行该怎么判断、要不要换卡。", "ref": "Hi, I noticed a small charge from an overseas website on my card, only about three dollars, but I've never shopped there. I've read that people sometimes test stolen cards with small amounts. Could you tell me more about this merchant? If it looks suspicious, I think I'd rather block the card and get a new one.", "ref_zh": "你好，我看到卡上有一笔境外网站的小额扣款，大约三块钱，但我从没在那儿买过东西。我看到说有人会用小额消费测试盗来的卡。能告诉我这个商户的更多信息吗？如果看起来可疑，我宁愿把卡冻结，换张新卡。", "id": "ref1"}], "words": [{"w": "statement", "ipa": "/ˈsteɪtmənt/", "zh": "（银行）账单，对账单", "ex": "I check my credit card statement every month.", "id": "w0"}, {"w": "merchant", "ipa": "/ˈmɜːrtʃənt/", "zh": "商户", "ex": "The merchant name on the bill was different from the shop's name.", "id": "w1"}, {"w": "descriptor", "ipa": "/dɪˈskrɪptər/", "zh": "（账单上的）商户描述代码", "ex": "Search the descriptor online to see which company it is.", "id": "w2"}, {"w": "annual", "ipa": "/ˈænjuəl/", "zh": "每年的", "ex": "The annual fee is waived for the first year.", "id": "w3"}, {"w": "pending", "ipa": "/ˈpendɪŋ/", "zh": "待处理的，未入账的", "ex": "The refund is still pending.", "id": "w4"}, {"w": "hold", "ipa": "/hoʊld/", "zh": "冻结金额，预授权", "ex": "The car rental put a hold of five hundred dollars on my card.", "tts": "The car rental put a hold of five hundred dollars on my card.", "id": "w5"}, {"w": "dispute", "ipa": "/dɪˈspjuːt/", "zh": "争议，异议", "ex": "The bank will open a dispute with the shop.", "id": "w6"}, {"w": "roll over", "ipa": "/roʊl ˈoʊvər/", "zh": "自动续延", "ex": "The free trial rolls over into a paid plan after a month.", "id": "w7"}, {"w": "drop off", "ipa": "/drɑːp ɔːf/", "zh": "（冻结金额）自动消失", "ex": "The deposit hold should drop off in a few days.", "id": "w8"}], "sections": [{"heading": "1. A Name You Don't Recognise", "heading_zh": "1. 不认识的商户名", "rows": [[{"id": "s0_0_0", "md": "Good afternoon, you're speaking with Priya. How may I assist you?", "text": "Good afternoon, you're speaking with Priya. How may I assist you?", "zh": "下午好，我是 Priya。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, there's a charge on my statement that I don't recognise. Could you help me look into it?**", "text": "Hi, there's a charge on my statement that I don't recognise. Could you help me look into it?", "zh": "你好，我的账单上有一笔扣款我不认识。能帮我查一下吗？", "sp": "A"}], [{"id": "s0_2_0", "md": "Of course. Which ==statement== are you looking at, and what's the amount?", "text": "Of course. Which statement are you looking at, and what's the amount?", "zh": "当然。您看的是哪一期账单？金额是多少？", "sp": "B"}], [{"id": "s0_3_0", "md": "The October one. It's one hundred and nineteen dollars, and the ==merchant== is just a string of letters.", "text": "The October one. It's one hundred and nineteen dollars, and the merchant is just a string of letters.", "zh": "十月的。一百一十九元，商户名就是一串字母。", "sp": "A"}], [{"id": "s0_4_0", "md": "Let me pull it up. That ==descriptor== belongs to a software company. It's an ==annual== subscription for cloud storage.", "text": "Let me pull it up. That descriptor belongs to a software company. It's an annual subscription for cloud storage.", "zh": "我调出来看看。这个商户代码属于一家软件公司，是云存储的年度订阅。", "sp": "B"}], [{"id": "s0_5_0", "md": "Oh. I signed up for a free trial last year and __completely forgot__ about it.", "text": "Oh. I signed up for a free trial last year and completely forgot about it.", "zh": "哦。我去年注册了个免费试用，完全忘了这事。", "sp": "A"}], [{"id": "s0_6_0", "md": "That happens a lot. The trial __rolls over__ into a paid plan automatically.", "text": "That happens a lot. The trial rolls over into a paid plan automatically.", "zh": "这种情况很常见。试用期结束会自动转成付费套餐。", "sp": "B"}], [{"id": "s0_7_0", "md": "Can the bank get that money back for me?", "text": "Can the bank get that money back for me?", "zh": "银行能帮我把这笔钱要回来吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "Since you agreed to the terms, you'd need to ask the company directly. Many will refund if you cancel quickly.", "text": "Since you agreed to the terms, you'd need to ask the company directly. Many will refund if you cancel quickly.", "zh": "因为您同意过条款，需要直接联系那家公司。很多公司如果您尽快取消，会给退款。", "sp": "B"}]]}, {"heading": "2. Charged Twice", "heading_zh": "2. 被扣了两次", "rows": [[{"id": "s1_0_0", "md": "Okay, I'll do that. While I have you, there's another problem. A hotel charged me twice.", "text": "Okay, I'll do that. While I have you, there's another problem. A hotel charged me twice.", "zh": "好，我去联系。顺便还有个问题，有家酒店扣了我两次钱。", "sp": "A"}], [{"id": "s1_1_0", "md": "I see two payments of four hundred and fifty dollars. One is still ==pending==, though.", "text": "I see two payments of four hundred and fifty dollars. One is still pending, though.", "zh": "我看到两笔四百五十元的扣款，不过其中一笔还在处理中。", "sp": "B"}], [{"id": "s1_2_0", "md": "Sorry, what does pending mean exactly? __Has it been taken__ from my account or not?", "text": "Sorry, what does pending mean exactly? Has it been taken from my account or not?", "zh": "不好意思，处理中具体是什么意思？钱到底扣走了没有？", "sp": "A"}], [{"id": "s1_3_0", "md": "It's a ==hold== the hotel placed at check-in. It usually __drops off__ within seven to ten days.", "text": "It's a hold the hotel placed at check-in. It usually drops off within seven to ten days.", "zh": "那是酒店入住时做的预授权冻结，一般七到十天内会自动释放。", "sp": "B"}], [{"id": "s1_4_0", "md": "And if it doesn't drop off by then?", "text": "And if it doesn't drop off by then?", "zh": "如果到时候还没释放呢？", "sp": "A"}], [{"id": "s1_5_0", "md": "Then please call us back and we'll raise a ==dispute== with the hotel on your behalf.", "text": "Then please call us back and we'll raise a dispute with the hotel on your behalf.", "zh": "那就再打给我们，我们代您向酒店提出争议。", "sp": "B"}], [{"id": "s1_6_0", "md": "**Could you note that on my account, so I don't have to explain everything again?**", "text": "Could you note that on my account, so I don't have to explain everything again?", "zh": "能在我账户上备注一下吗？免得我还得从头解释一遍。", "sp": "A"}], [{"id": "s1_7_0", "md": "Certainly, I've added a note. Is there anything else I can help you with today?", "text": "Certainly, I've added a note. Is there anything else I can help you with today?", "zh": "当然，已经加了备注。今天还有别的需要帮忙的吗？", "sp": "B"}], [{"id": "s1_8_0", "md": "No, that's everything. Thanks for explaining it so clearly.", "text": "No, that' const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
