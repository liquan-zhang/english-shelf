<script>
const D = {"id": "079", "title": "Connecting Daily Work to the Big Goal", "meta": "B2 · 约 270 词 · 场景：团队对齐", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Ticket and the Reason", "heading_zh": "1. 工单和背后的理由", "rows": [[{"id": "s0_0_0", "md": "Ask an engineer what they are working on, and you usually hear a ticket.", "text": "Ask an engineer what they are working on, and you usually hear a ticket.", "zh": "问一个工程师在做什么，你听到的通常是一个工单。", "sp": null}, {"id": "s0_0_1", "md": "\"I'm adding retry logic to the upload service.\"", "text": "\"I'm adding retry logic to the upload service.\"", "zh": "「我在给上传服务加重试逻辑。」", "sp": null}, {"id": "s0_0_2", "md": "Ask why, and the answer is often a shrug, or \"It was in the sprint.\"", "text": "Ask why, and the answer is often a shrug, or \"It was in the sprint.\"", "zh": "再问为什么，回答往往是耸耸肩，或者「迭代里排了这个」。", "sp": null}], [{"id": "s0_1_0", "md": "That gap matters more than it seems.", "text": "That gap matters more than it seems.", "zh": "这个断层比看起来要严重。", "sp": null}, {"id": "s0_1_1", "md": "Engineers who don't know the goal make ==sensible== local choices that are wrong for the bigger picture.", "text": "Engineers who don't know the goal make sensible local choices that are wrong for the bigger picture.", "zh": "不知道目标的工程师，会做出局部合理、但从全局看是错的选择。", "sp": null}, {"id": "s0_1_2", "md": "They ==polish== an edge case nobody hits, or skip the one metric the whole project depends on.", "text": "They polish an edge case nobody hits, or skip the one metric the whole project depends on.", "zh": "他们会去打磨一个没人会碰到的边界情况，或者漏掉整个项目都依赖的那个指标。", "sp": null}, {"id": "s0_1_3", "md": "Nobody is being lazy; they simply cannot see what matters most.", "text": "Nobody is being lazy; they simply cannot see what matters most.", "zh": "没人在偷懒；他们只是看不到什么最重要。", "sp": null}], [{"id": "s0_2_0", "md": "**People make better small decisions when they can see the big one.**", "text": "People make better small decisions when they can see the big one.", "zh": "人们看得见大决策的时候，小决策就会做得更好。", "sp": null}, {"id": "s0_2_1", "md": "Explaining the goal once at a kickoff is not enough, because it fades by the second week.", "text": "Explaining the goal once at a kickoff is not enough, because it fades by the second week.", "zh": "只在启动会上讲一次目标是不够的，因为到第二周就淡了。", "sp": null}, {"id": "s0_2_2", "md": "The link has to be ==reinforced== in everyday work, in tickets, standups, and code reviews.", "text": "The link has to be reinforced in everyday work, in tickets, standups, and code reviews.", "zh": "这个关联必须在日常工作里反复强化，在工单里、站会上、code review 里。", "sp": null}]]}, {"heading": "2. The So-That Chain", "heading_zh": "2. 「为了」链条", "rows": [[{"id": "s1_0_0", "md": "A simple habit helps: describe the work with the words \"so that.\"", "text": "A simple habit helps: describe the work with the words \"so that.\"", "zh": "有个简单的习惯会很有帮助：用「为了」来描述工作。", "sp": null}, {"id": "s1_0_1", "md": "\"I'm adding retry logic so that uploads on weak networks succeed, so that new creators finish their first video, so that first-week ==retention== goes up.\"", "text": "\"I'm adding retry logic so that uploads on weak networks succeed, so that new creators finish their first video, so that first-week retention goes up.\"", "zh": "「我加重试逻辑，是为了让弱网下的上传能成功，为了让新创作者能完成第一个视频，为了让首周留存涨上去。」", "sp": null}, {"id": "s1_0_2", "md": "Each step connects the ticket one level higher, until it reaches a goal the company actually tracks.", "text": "Each step connects the ticket one level higher, until it reaches a goal the company actually tracks.", "zh": "每一步都把这个工单往上连一层，直到连到一个公司真正在追踪的目标。", "sp": null}], [{"id": "s1_1_0", "md": "As a lead, ==model== this yourself in standups and planning.", "text": "As a lead, model this yourself in standups and planning.", "zh": "作为 TL，你自己要在站会和规划会上带头这么做。", "sp": null}, {"id": "s1_1_1", "md": "When a link in the chain is missing, that is useful information.", "text": "When a link in the chain is missing, that is useful information.", "zh": "当链条中某一环缺了，这本身就是有用的信息。", "sp": null}, {"id": "s1_1_2", "md": "Either the work is less important than it looks, or the goal needs to be explained better.", "text": "Either the work is less important than it looks, or the goal needs to be explained better.", "zh": "要么这项工作没有看起来那么重要，要么目标需要讲得更清楚。", "sp": null}], [{"id": "s1_2_0", "md": "**If you cannot finish the sentence, question the ticket before you start it.**", "text": "If you cannot finish the sentence, question the ticket before you start it.", "zh": "如果你补不全这句话，那就在动手之前先质疑这个工单。", "sp": null}, {"id": "s1_2_1", "md": "Over time, the team starts asking these questions without you, and many ==priorities== __sort themselves out__.", "text": "Over time, the team starts asking these questions without you, and many priorities sort themselves out.", "zh": "时间长了，团队不用你也会自己问这些问题，很多优先级问题会自然理顺。", "sp": null}, {"id": "s1_2_2", "md": "That is when a team feels ==aligned== rather than managed, and you can __step back__ from the details.", "text": "That is when a team feels aligned rather than managed, and you can step back from the details.", "zh": "到那时，团队感受到的是对齐而不是被管，你也就可以从细节里抽身了。", "sp": null}]]}], "gist": [{"q": "工程师不知道工作背后的目标，会带来什么问题？", "a": "会做出局部合理但整体错误的选择，比如打磨没人遇到的边界情况，却忽略整个项目依赖的关键指标。"}, {"q": "“so that 链条”是什么？", "a": "用“so that”把一张工单逐级连到更高的目标，直到连到公司真正追踪的指标。"}, {"q": "如果链条连不上，说明什么？", "a": "要么这项工作没看起来那么重要，要么目标需要讲得更清楚；说不完这句话就先质疑这张工单。"}], "dictation": [{"id": "s0_2_0", "text": "People make better small decisions when they can see the big one."}, {"id": "s0_2_1", "text": "Explaining the goal once at a kickoff is not enough, because it fades by the second week."}, {"id": "s1_1_2", "text": "Either the work is less important than it looks, or the goal needs to be explained better."}, {"id": "s1_2_0", "text": "If you cannot finish the sentence, question the ticket before you start it."}], "shadow": {"text": "As a lead, model this yourself in standups and planning. When a link in the chain is missing, that is useful information. Either the work is less important than it looks, or the goal needs to be explained better.", "marked": "As a <b>lead</b>, / model this <b>yourself</b> / in standups and planning. //<br>When a link in the chain is <b>missing</b>, / that is <b>useful</b> information. //<br><b>Either</b> the work is less important / than it <b>looks</b>, / <b>or</b> the goal needs to be <b>explained</b> better. //"}, "prompts": [{"q": "站会上，新同事只说“我在改缓存过期策略”。用 30 秒示范用 so-that 链条说清这项工作和团队目标的关系。", "ref": "Let me try putting that in a so-that chain, because I think it's more important than it sounds. We're changing the cache expiry so that product pages show the right price, so that fewer users hit checkout errors, so that our conversion goal for the quarter stays on track. So if you have to choose between speed and accuracy here, choose accuracy.", "ref_zh": "我试着用「为了」链条来说一下，因为我觉得这件事比听起来重要。我们改缓存过期时间，是为了让商品页显示正确的价格，为了让更少的用户在下单时报错，为了让我们这个季度的转化目标不掉队。所以如果在这里要在速度和准确性之间选，选准确性。", "id": "ref0"}, {"q": "你发现团队有一张工单怎么都连不到季度目标。用 30 秒在规划会上提出质疑。", "ref": "Before we commit to this ticket, can I test it quickly? I tried to finish the sentence, 'we're doing this so that...', and I couldn't connect it to any of our three quarterly goals. Maybe I'm missing context. If someone can explain the link, great. If not, I'd suggest we move it to the backlog and use that week on the onboarding work instead.", "ref_zh": "在我们认领这个工单之前，我能快速检验一下吗？我试着补全「我们做这个是为了……」这句话，结果没法把它跟我们三个季度目标中的任何一个连起来。可能是我缺了点背景。如果有人能讲清楚这个关联，那很好。如果讲不清，我建议把它挪到 backlog，把那一周用在新手引导上。", "id": "ref1"}], "words": [{"w": "sensible", "ipa": "/ˈsensəbəl/", "zh": "合理的、明智的", "ex": "Caching the results seems like a sensible first step.", "id": "w0"}, {"w": "polish (v.)", "ipa": "/ˈpɑːlɪʃ/", "zh": "打磨、润色", "ex": "Let's ship it now and polish the animations next sprint.", "tts_w": "polish", "id": "w1"}, {"w": "reinforce", "ipa": "/ˌriːɪnˈfɔːrs/", "zh": "强化、加强", "ex": "The weekly demo reinforces why this project matters.", "id": "w2"}, {"w": "retention", "ipa": "/rɪˈtenʃən/", "zh": "留存（率）", "ex": " const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
