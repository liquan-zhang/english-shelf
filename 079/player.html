<script>
const D = {"id": "079", "title": "Connecting Daily Work to the Big Goal", "meta": "B2 · 约 270 词 · 场景：团队对齐", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Ticket and the Reason", "heading_zh": "1. 工单和背后的理由", "rows": [[{"id": "s0_0_0", "md": "Ask an engineer what they are working on, and you usually hear a ticket.", "text": "Ask an engineer what they are working on, and you usually hear a ticket.", "zh": "问一个工程师在做什么，你听到的通常是一个工单。", "sp": null}, {"id": "s0_0_1", "md": "\"I'm adding retry logic to the upload service.\"", "text": "\"I'm adding retry logic to the upload service.\"", "zh": "「我在给上传服务加重试逻辑。」", "sp": null}, {"id": "s0_0_2", "md": "Ask why, and the answer is often a shrug, or \"It was in the sprint.\"", "text": "Ask why, and the answer is often a shrug, or \"It was in the sprint.\"", "zh": "再问为什么，回答往往是耸耸肩，或者「迭代里排了这个」。", "sp": null}], [{"id": "s0_1_0", "md": "That gap matters more than it seems.", "text": "That gap matters more than it seems.", "zh": "这个断层比看起来要严重。", "sp": null}, {"id": "s0_1_1", "md": "Engineers who don't know the goal make ==sensible== local choices that are wrong for the bigger picture.", "text": "Engineers who don't know the goal make sensible local choices that are wrong for the bigger picture.", "zh": "不知道目标的工程师，会做出局部合理、但从全局看是错的选择。", "sp": null}, {"id": "s0_1_2", "md": "They ==polish== an edge case nobody hits, or skip the one metric the whole project depends on.", "text": "They polish an edge case nobody hits, or skip the one metric the whole project depends on.", "zh": "他们会去打磨一个没人会碰到的边界情况，或者漏掉整个项目都依赖的那个指标。", "sp": null}, {"id": "s0_1_3", "md": "Nobody is being lazy; they simply cannot see what matters most.", "text": "Nobody is being lazy; they simply cannot see what matters most.", "zh": "没人在偷懒；他们只是看不到什么最重要。", "sp": null}], [{"id": "s0_2_0", "md": "**People make better small decisions when they can see the big one.**", "text": "People make better small decisions when they can see the big one.", "zh": "人们看得见大决策的时候，小决策就会做得更好。", "sp": null}, {"id": "s0_2_1", "md": "Explaining the goal once at a kickoff is not enough, because it fades by the second week.", "text": "Explaining the goal once at a kickoff is not enough, because it fades by the second week.", "zh": "只在启动会上讲一次目标是不够的，因为到第二周就淡了。", "sp": null}, {"id": "s0_2_2", "md": "The link has to be ==reinforced== in everyday work, in tickets, standups, and code reviews.", "text": "The link has to be reinforced in everyday work, in tickets, standups, and code reviews.", "zh": "这个关联必须在日常工作里反复强化，在工单里、站会上、code review 里。", "sp": null}]]}, {"heading": "2. The So-That Chain", "heading_zh": "2. 「为了」链条", "rows": [[{"id": "s1_0_0", "md": "A simple habit helps: describe the work with the words \"so that.\"", "text": "A simple habit helps: describe the work with the words \"so that.\"", "zh": "有个简单的习惯会很有帮助：用「为了」来描述工作。", "sp": null}, {"id": "s1_0_1", "md": "\"I'm adding retry logic so that uploads on weak networks succeed, so that new creators finish their first video, so that first-week ==retention== goes up.\"", "text": "\"I'm adding retry logic so that uploads on weak networks succeed, so that new creators finish their first video, so that first-week retention goes up.\"", "zh": "「我加重试逻辑，是为了让弱网下的上传能成功，为了让新创作者能完成第一个视频，为了让首周留存涨上去。」", "sp": null}, {"id": "s1_0_2", "md": "Each step connects the ticket one level higher, until it reaches a goal the company actually tracks.", "text": "Each step connects the ticket one level higher, until it reaches a goal the company actually tracks.", "zh": "每一步都把这个工单往上连一层，直到连到一个公司真正在追踪的目标。", "sp": null}], [{"id": "s1_1_0", "md": "As a lead, ==model== this yourself in standups and planning.", "text": "As a lead, model this yourself in standups and planning.", "zh": "作为 TL，你自己要在站会和规划会上带头这么做。", "sp": null}, {"id": "s1_1_1", "md": "When a link in the chain is missing, that is useful information.", "text": "When a link in the chain is missing, that is useful information.", "zh": "当链条中某一环缺了，这本身就是有用的信息。", "sp": null}, {"id": "s1_1_2", "md": "Either the work is less important than it looks, or the goal needs to be explained better.", "text": "Either the work is less important than it looks, or the goal needs to be explained better.", "zh": "要么这项工作没有看起来那么重要，要么目标需要讲得更清楚。", "sp": null}], [{"id": "s1_2_0", "md": "**If you cannot finish the sentence, question the ticket before you start it.**", "text": "If you cannot finish the sentence, question the ticket before you start it.", "zh": "如果你补不全这句话，那就在动手之前先质疑这个工单。", "sp": null}, {"id": "s1_2_1", "md": "Over time, the team starts asking these questions without you, and many ==priorities== __sort themselves out__.", "text": "Over time, the team starts asking these questions without you, and many priorities sort themselves out.", "zh": "时间长了，团队不用你也会自己问这些问题，很多优先级问题会自然理顺。", "sp": null}, {"id": "s1_2_2", "md": "That is when a team feels ==aligned== rather than managed, and you can __step back__ from the details.", "text": "That is when a team feels aligned rather than managed, and you can step back from the details.", "zh": "到那时，团队感受到的是对齐而不是被管，你也就可以从细节里抽身了。", "sp": null}]]}], "gist": [{"q": "工程师不知道工作背后的目标，会带来什么问题？", "a": "会做出局部合理但整体错误的选择，比如打磨没人遇到的边界情况，却忽略整个项目依赖的关键指标。"}, {"q": "“so that 链条”是什么？", "a": "用“so that”把一张工单逐级连到更高的目标，直到连到公司真正追踪的指标。"}, {"q": "如果链条连不上，说明什么？", "a": "要么这项工作没看起来那么重要，要么目标需要讲得更清楚；说不完这句话就先质疑这张工单。"}], "dictation": [{"id": "s0_2_0", "text": "People make better small decisions when they can see the big one."}, {"id": "s0_2_1", "text": "Explaining the goal once at a kickoff is not enough, because it fades by the second week."}, {"id": "s1_1_2", "text": "Either the work is less important than it looks, or the goal needs to be explained better."}, {"id": "s1_2_0", "text": "If you cannot finish the sentence, question the ticket before you start it."}], "shadow": {"text": "As a lead, model this yourself in standups and planning. When a link in the chain is missing, that is useful information. Either the work is less important than it looks, or the goal needs to be explained better.", "marked": "As a <b>lead</b>, / model this <b>yourself</b> / in standups and planning. //<br>When a link in the chain is <b>missing</b>, / that is <b>useful</b> information. //<br><b>Either</b> the work is less important / than it <b>looks</b>, / <b>or</b> the goal needs to be <b>explained</b> better. //"}, "prompts": [{"q": "站会上，新同事只说“我在改缓存过期策略”。用 30 秒示范用 so-that 链条说清这项工作和团队目标的关系。", "ref": "Let me try putting that in a so-that chain, because I think it's more important than it sounds. We're changing the cache expiry so that product pages show the right price, so that fewer users hit checkout errors, so that our conversion goal for the quarter stays on track. So if you have to choose between speed and accuracy here, choose accuracy.", "ref_zh": "我试着用「为了」链条来说一下，因为我觉得这件事比听起来重要。我们改缓存过期时间，是为了让商品页显示正确的价格，为了让更少的用户在下单时报错，为了让我们这个季度的转化目标不掉队。所以如果在这里要在速度和准确性之间选，选准确性。", "id": "ref0"}, {"q": "你发现团队有一张工单怎么都连不到季度目标。用 30 秒在规划会上提出质疑。", "ref": "Before we commit to this ticket, can I test it quickly? I tried to finish the sentence, 'we're doing this so that...', and I couldn't connect it to any of our three quarterly goals. Maybe I'm missing context. If someone can explain the link, great. If not, I'd suggest we move it to the backlog and use that week on the onboarding work instead.", "ref_zh": "在我们认领这个工单之前，我能快速检验一下吗？我试着补全「我们做这个是为了……」这句话，结果没法把它跟我们三个季度目标中的任何一个连起来。可能是我缺了点背景。如果有人能讲清楚这个关联，那很好。如果讲不清，我建议把它挪到 backlog，把那一周用在新手引导上。", "id": "ref1"}], "words": [{"w": "sensible", "ipa": "/ˈsensəbəl/", "zh": "合理的、明智的", "ex": "Caching the results seems like a sensible first step.", "id": "w0"}, {"w": "polish (v.)", "ipa": "/ˈpɑːlɪʃ/", "zh": "打磨、润色", "ex": "Let's ship it now and polish the animations next sprint.", "tts_w": "polish", "id": "w1"}, {"w": "reinforce", "ipa": "/ˌriːɪnˈfɔːrs/", "zh": "强化、加强", "ex": "The weekly demo reinforces why this project matters.", "id": "w2"}, {"w": "retention", "ipa": "/rɪˈtenʃən/", "zh": "留存（率）", "ex": "  53.838], [53.851, 53.983], [53.996, 54.088], [54.101, 54.483], [54.588, 54.786], [54.799, 55.128]]}, {"kind": "s", "id": "s1_0_1", "md": "\"I'm adding retry logic so that uploads on weak networks succeed, so that new creators finish their first video, so that first-week ==retention== goes up.\"", "zh": "「我加重试逻辑，是为了让弱网下的上传能成功，为了让新创作者能完成第一个视频，为了让首周留存涨上去。」", "sp": null, "gap": false, "start": 55.536, "end": 65.328, "words": [[55.733, 55.733], [55.812, 56.128], [56.141, 56.575], [56.589, 57.049], [57.26, 57.391], [57.404, 57.589], [57.602, 58.141], [58.154, 58.312], [58.325, 58.562], [58.575, 59.075], [59.089, 59.707], [60.089, 60.194], [60.207, 60.391], [60.404, 60.602], [60.615, 61.154], [61.168, 61.536], [61.549, 61.694], [61.707, 62.062], [62.075, 62.51], [62.891, 62.983], [62.997, 63.154], [63.168, 63.72], [63.733, 64.233], [64.247, 64.536], [64.549, 64.812]]}, {"kind": "s", "id": "s1_0_2", "md": "Each step connects the ticket one level higher, until it reaches a goal the company actually tracks.", "zh": "每一步都把这个工单往上连一层，直到连到一个公司真正在追踪的目标。", "sp": null, "gap": false, "start": 65.328, "end": 71.664, "words": [[65.433, 65.631], [65.644, 66.012], [66.025, 66.446], [66.46, 66.565], [66.578, 66.986], [66.999, 67.315], [67.328, 67.604], [67.617, 68.025], [68.446, 68.696], [68.71, 68.841], [68.854, 69.183], [69.196, 69.275], [69.289, 69.591], [69.604, 69.71], [69.723, 70.249], [70.262, 70.644], [70.657, 71.275]]}, {"kind": "s", "id": "s1_1_0", "md": "As a lead, ==model== this yourself in standups and planning.", "zh": "作为 TL，你自己要在站会和规划会上带头这么做。", "sp": null, "gap": true, "start": 71.664, "end": 75.336, "words": [[71.769, 71.888], [71.901, 71.953], [71.967, 72.374], [72.703, 73.019], [73.032, 73.203], [73.217, 73.638], [73.651, 73.743], [73.756, 74.401], [74.414, 74.493], [74.506, 74.94]]}, {"kind": "s", "id": "s1_1_1", "md": "When a link in the chain is missing, that is useful information.", "zh": "当链条中某一环缺了，这本身就是有用的信息。", "sp": null, "gap": false, "start": 75.336, "end": 79.392, "words": [[75.454, 75.547], [75.56, 75.625], [75.639, 75.915], [75.928, 76.007], [76.02, 76.112], [76.125, 76.533], [76.639, 76.757], [76.77, 77.27], [77.652, 77.797], [77.81, 77.941], [77.954, 78.336], [78.349, 78.994]]}, {"kind": "s", "id": "s1_1_2", "md": "Either the work is less important than it looks, or the goal needs to be explained better.", "zh": "要么这项工作没有看起来那么重要，要么目标需要讲得更清楚。", "sp": null, "gap": false, "start": 79.392, "end": 84.696, "words": [[79.484, 79.695], [79.708, 79.8], [79.813, 80.116], [80.195, 80.326], [80.339, 80.589], [80.603, 81.155], [81.168, 81.287], [81.3, 81.405], [81.418, 81.866], [82.129, 82.234], [82.247, 82.339], [82.353, 82.721], [82.879, 83.102], [83.116, 83.208], [83.221, 83.339], [83.353, 83.918], [83.931, 84.313]]}, {"kind": "s", "id": "s1_2_0", "md": "**If you cannot finish the sentence, question the ticket before you start it.**", "zh": "如果你补不全这句话，那就在动手之前先质疑这个工单。", "sp": null, "gap": true, "start": 84.696, "end": 88.848, "words": [[84.801, 84.906], [84.92, 85.012], [85.025, 85.367], [85.38, 85.696], [85.709, 85.801], [85.814, 86.42], [86.657, 87.064], [87.078, 87.183], [87.196, 87.512], [87.525, 87.854], [87.867, 87.946], [87.959, 88.288], [88.301, 88.459]]}, {"kind": "s", "id": "s1_2_1", "md": "Over time, the team starts asking these questions without you, and many ==priorities== __sort themselves out__.", "zh": "时间长了，团队不用你也会自己问这些问题，很多优先级问题会自然理顺。", "sp": null, "gap": false, "start": 88.848, "end": 95.496, "words": [[88.953, 89.151], [89.164, 89.637], [89.953, 90.058], [90.072, 90.361], [90.374, 90.743], [90.835, 91.322], [91.335, 91.493], [91.506, 91.993], [92.006, 92.414], [92.427, 92.637], [92.966, 93.085], [93.098, 93.348], [93.361, 94.032], [94.045, 94.309], [94.322, 94.835], [94.848, 95.098]]}, {"kind": "s", "id": "s1_2_2", "md": "That is when a team feels ==aligned== rather than managed, and you can __step back__ from the details.", "zh": "到那时，团队感受到的是对齐而不是被管，你也就可以从细节里抽身了。", "sp": null, "gap": false, "start": 95.496, "end": 101.04, "words": [[95.601, 95.693], [95.707, 95.799], [95.812, 95.93], [95.943, 96.022], [96.035, 96.404], [96.417, 96.772], [96.785, 97.351], [97.364, 97.693], [97.707, 97.864], [97.878, 98.43], [98.759, 98.851], [98.864, 98.943], [98.957, 99.088], [99.101, 99.443], [99.457, 99.72], [99.733, 99.878], [99.891, 99.97], [99.983, 100.641]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
