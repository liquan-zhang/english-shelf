<script>
const D = {"id": "063", "title": "Rolling Back Is Not Failure", "meta": "B2 · 约 270 词 · 场景：发布回滚", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Forty Minutes Nobody Needed", "heading_zh": "1. 没必要的四十分钟", "rows": [[{"id": "s0_0_0", "md": "Picture a release that goes out at noon.", "text": "Picture a release that goes out at noon.", "zh": "设想一个中午十二点上线的版本。", "sp": null}, {"id": "s0_0_1", "md": "Fifteen minutes later, error rates start to climb, and the engineer who wrote the change says, \"Give me ten minutes, I think I see it.\"", "text": "Fifteen minutes later, error rates start to climb, and the engineer who wrote the change says, \"Give me ten minutes, I think I see it.\"", "zh": "十五分钟后，错误率开始往上爬，写这个改动的工程师说：「给我十分钟，我好像看到问题了。」", "sp": null}, {"id": "s0_0_2", "md": "Ten minutes becomes forty, and users keep hitting errors the whole time.", "text": "Ten minutes becomes forty, and users keep hitting errors the whole time.", "zh": "十分钟变成了四十分钟，用户全程都在报错。", "sp": null}], [{"id": "s0_1_0", "md": "Nobody in that room was ==careless==.", "text": "Nobody in that room was careless.", "zh": "那个屋子里没有谁是马虎的。", "sp": null}, {"id": "s0_1_1", "md": "They delayed the rollback because it felt like admitting the work was bad.", "text": "They delayed the rollback because it felt like admitting the work was bad.", "zh": "他们拖着不回滚，是因为回滚感觉像是承认活儿干砸了。", "sp": null}, {"id": "s0_1_2", "md": "In fact, the change itself was fine; it had one wrong default value.", "text": "In fact, the change itself was fine; it had one wrong default value.", "zh": "其实改动本身没问题；只是有一个默认值写错了。", "sp": null}, {"id": "s0_1_3", "md": "**A rollback is not a verdict on your code; it is a way to buy time.**", "text": "A rollback is not a verdict on your code; it is a way to buy time.", "zh": "回滚不是对你代码的判决；它是一种争取时间的手段。", "sp": null}], [{"id": "s0_2_0", "md": "Fixing forward under pressure is ==tempting==, but it is one of the riskiest things a team can do.", "text": "Fixing forward under pressure is tempting, but it is one of the riskiest things a team can do.", "zh": "顶着压力往前修很诱人，但这是一个团队能干的最冒险的事之一。", "sp": null}, {"id": "s0_2_1", "md": "You are writing new code, with less review, while users are watching.", "text": "You are writing new code, with less review, while users are watching.", "zh": "你在用户眼皮底下写新代码，review 还更少。", "sp": null}, {"id": "s0_2_2", "md": "Rolling back returns you to a ==proven== version, and then you can debug __at your own pace__.", "text": "Rolling back returns you to a proven version, and then you can debug at your own pace.", "zh": "回滚能让你回到一个验证过的版本，然后你可以按自己的节奏慢慢查。", "sp": null}]]}, {"heading": "2. Decide Before You Ship", "heading_zh": "2. 发版前就做好决定", "rows": [[{"id": "s1_0_0", "md": "The fix is to make the rollback decision before the release, when nobody's pride is __on the line__.", "text": "The fix is to make the rollback decision before the release, when nobody's pride is on the line.", "zh": "解决办法是在发版之前就把回滚的决定做好，那时候还没人的面子挂在上面。", "sp": null}, {"id": "s1_0_1", "md": "Write down one or two ==thresholds== in the launch plan.", "text": "Write down one or two thresholds in the launch plan.", "zh": "在上线方案里写下一两条阈值。", "sp": null}, {"id": "s1_0_2", "md": "For example, if the crash rate doubles or checkout errors pass one percent, we roll back first and talk later.", "text": "For example, if the crash rate doubles or checkout errors pass one percent, we roll back first and talk later.", "zh": "比如，崩溃率翻倍，或者下单报错超过百分之一，我们就先回滚，回头再讨论。", "sp": null}], [{"id": "s1_1_0", "md": "**When the rule is agreed in advance, rolling back becomes a procedure, not a confession.**", "text": "When the rule is agreed in advance, rolling back becomes a procedure, not a confession.", "zh": "规则事先定好了，回滚就是走流程，而不是认错。", "sp": null}, {"id": "s1_1_1", "md": "The on-call engineer does not need permission, and the author does not need to ==justify== anything.", "text": "The on-call engineer does not need permission, and the author does not need to justify anything.", "zh": "on-call 工程师不需要请示，代码作者也不需要解释什么。", "sp": null}, {"id": "s1_1_2", "md": "It also makes the post-launch review calmer, because the decision was never personal.", "text": "It also makes the post-launch review calmer, because the decision was never personal.", "zh": "这也让上线后的复盘更心平气和，因为这个决定从来就不针对个人。", "sp": null}], [{"id": "s1_2_0", "md": "Managers __set the tone__ here.", "text": "Managers set the tone here.", "zh": "在这件事上，管理者决定了基调。", "sp": null}, {"id": "s1_2_1", "md": "If you thank the person who ==triggered== a fast rollback, the team learns that speed matters more than pride.", "text": "If you thank the person who triggered a fast rollback, the team learns that speed matters more than pride.", "zh": "如果你感谢那个果断触发回滚的人，团队就会明白速度比面子重要。", "sp": null}, {"id": "s1_2_2", "md": "If your first question is \"Who broke it?\", people will __hold on to__ bad releases far too long.", "text": "If your first question is \"Who broke it?\", people will hold on to bad releases far too long.", "zh": "如果你第一句问的是「谁搞坏的？」，大家就会死扛着有问题的版本，拖太久都不回滚。", "sp": null}]]}], "gist": [{"q": "开头的例子里，团队为什么拖了四十分钟才回滚？", "a": "不是因为粗心，而是回滚感觉像承认自己的代码不好，于是想先在线修。"}, {"q": "作者为什么认为在压力下“往前修”很危险？", "a": "在用户受影响时写新代码，评审更少；回滚能回到已验证的版本，再从容排查。"}, {"q": "怎样让回滚变成例行操作而不是认错？", "a": "发布前在上线方案里写好回滚阈值；管理者感谢快速回滚的人，而不是先问谁搞坏的。"}], "dictation": [{"id": "s0_1_3", "text": "A rollback is not a verdict on your code; it is a way to buy time."}, {"id": "s0_2_1", "text": "You are writing new code, with less review, while users are watching."}, {"id": "s1_1_0", "text": "When the rule is agreed in advance, rolling back becomes a procedure, not a confession."}, {"id": "s1_2_1", "text": "If you thank the person who triggered a fast rollback, the team learns that speed matters more than pride."}], "shadow": {"text": "Fixing forward under pressure is tempting, but it is one of the riskiest things a team can do. You are writing new code, with less review, while users are watching. Rolling back returns you to a proven version, and then you can debug at your own pace.", "marked": "Fixing <b>forward</b> under pressure / is <b>tempting</b>, / but it is one of the <b>riskiest</b> things / a team can do. //<br>You are writing <b>new</b> code, / with <b>less</b> review, / while users are <b>watching</b>. //<br>Rolling <b>back</b> / returns you to a <b>proven</b> version, / and <b>then</b> you can debug / at your <b>own</b> pace. //"}, "prompts": [{"q": "新版本上线后崩溃率翻倍，写代码的同事说“再给我十分钟”。你是 on-call 负责人，用 30 秒说服他先回滚。", "ref": "I hear you, and you might be right about the cause. But crash rate has doubled, and that's the threshold we agreed on in the launch plan. Let's roll back now, get users back to a stable version, and then you can debug without the clock running. This isn't about your code being bad. It's just the cheapest way to buy time.", "ref_zh": "我明白，你对原因的判断可能是对的。但崩溃率已经翻倍了，这正是我们在上线方案里定好的阈值。我们现在就回滚，先让用户回到稳定版本，然后你可以不赶时间地慢慢查。这跟你代码好不好没关系。这只是争取时间最便宜的办法。", "id": "ref0"}, {"q": "下周有个大版本要发。在发布评审会上，用 30 秒提议事先写好回滚标准。", "ref": "Before we sign off, I'd like to add one thing to the launch plan: clear rollback thresholds. Something like, if checkout errors go above one percent, or crash rate doubles for ten minutes, the on-call engineer rolls back without asking anyone. Deciding now, while we're calm, means nobody has to make that call under pressure, and nobody has to defend their code at midnight.", "ref_zh": "在大家签字之前，我想在上线方案里加一条：明确的回滚阈值。比如下单报错超过百分之一，或者崩溃率翻倍持续十分钟，on-call 工程师就直接回滚，不用请示任何人。趁现在大家都冷静把这个定下来，就没人需要在压力下拍板，也没人需要半夜为自己的代码辩护。", "id": "ref1"}], "words": [{"w": "careless", "ipa": "/ˈkerləs/", "zh": "粗心的", "ex": "It wasn't a careless mistake; the test environment just didn't match production.", "id": "w0"}, {"w": "tempting", "ipa": "/ˈtemptɪŋ/", "zh": "诱人的、让人想去做的", "ex": "It's tempting to add one more feature, but let's ship what we have.", "id": "w1"}, {"w": "proven", "ipa": "/ˈpruːvən/", "zh": "经过验证的", "ex": "Let's stick with the proven setup for the holiday traffic.", "id": "w2"}, {"w": "threshold", "ipa": "/ˈθreʃhoʊld/", "z const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
