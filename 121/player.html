const D = {"id": "121", "type": "dialogue", "title": "Seeing a Doctor at a Clinic", "meta": "B2 · 约 270 词 · 场景：全科诊所看病、病假条与复诊", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Doctor", "name_zh": "医生", "voice": "en-US-EmmaNeural"}}, "gist": [{"q": "「你」有哪些症状？持续多久了？", "a": "从周日开始喉咙痛、发烧，晚上约三十八度五，现在还有干咳，晚上更重。"}, {"q": "医生的诊断和处理是什么？", "a": "病毒感染，不用抗生素；开了喉咙药和止咳糖浆，给了两天病假。"}, {"q": "什么情况下要回来复诊？", "a": "再烧三天以上，或者感觉喘不上气，就马上回来。"}], "dictation": [{"id": "s0_1_0", "text": "I've had a sore throat and a fever since Sunday, and now I've started coughing."}, {"id": "s0_5_0", "text": "Mostly dry, but it's worse at night. It's keeping me up."}, {"id": "s1_3_0", "text": "Thanks. And my son is three. Is there a chance he'll catch it from me?"}, {"id": "s1_9_0", "text": "Great. Can I claim this visit with my company's insurance card?"}], "shadow": {"speaker": "A", "text": "Around thirty-eight point five at night. I've been taking paracetamol, but it keeps coming back.", "marked": "Around <b>thirty-eight point five</b> / at <b>night</b>. //<br>I've been taking <b>paracetamol</b>, / but it <b>keeps coming back</b>. //"}, "prompts": [{"q": "孩子半夜发烧还呕吐，你打电话给二十四小时诊所，描述症状并问现在要不要马上带去看。", "ref": "Hi, I'm calling about my three-year-old son. He's had a fever since this evening, about thirty-nine degrees, and he just threw up twice. He's still drinking a little water, but he's very tired. Should I bring him in now, or is it okay to wait until the morning? And do I need to book, or can we just walk in?", "ref_zh": "你好，我打电话是因为我三岁的儿子。他从今天傍晚开始发烧，大概三十九度，刚才吐了两次。他还能喝一点水，但很没精神。我应该现在带他过去，还是可以等到早上？需要预约吗，还是直接过去就行？", "id": "ref0"}, {"q": "你吃了医生开的药三天还没好转，再去诊所复诊。说清楚哪里好了、哪里没好，并问下一步怎么办。", "ref": "Hi, doctor, I came in on Monday with a sore throat and fever. The fever's gone now, which is good, but the cough is actually worse, especially at night, and I'm still very tired. I've been taking the syrup three times a day. Do you think I need a different medicine, or maybe a chest X-ray?", "ref_zh": "医生你好，我周一来过，当时喉咙痛、发烧。现在烧退了，这点挺好，但咳嗽反而更严重了，尤其是晚上，人也还是很累。止咳糖浆我一直一天喝三次。你觉得需要换药吗，或者拍个胸片？", "id": "ref1"}], "words": [{"w": "fever", "ipa": "/ˈfiːvər/", "zh": "发烧", "ex": "My daughter has had a fever since last night.", "id": "w0"}, {"w": "phlegm", "ipa": "/flem/", "zh": "痰", "ex": "This syrup helps loosen the phlegm.", "id": "w1"}, {"w": "allergy", "ipa": "/ˈælərdʒi/", "zh": "过敏", "ex": "Does your son have any food allergies?", "id": "w2"}, {"w": "inflamed", "ipa": "/ɪnˈfleɪmd/", "zh": "发炎的", "ex": "His gums are a bit inflamed.", "id": "w3"}, {"w": "viral", "ipa": "/ˈvaɪrəl/", "zh": "病毒性的", "ex": "It's a viral infection, so it should clear up on its own.", "id": "w4"}, {"w": "medical leave", "ipa": "/ˈmedɪkəl liːv/", "zh": "病假", "ex": "I'm on medical leave until Friday.", "id": "w5"}, {"w": "contagious", "ipa": "/kənˈteɪdʒəs/", "zh": "传染性的", "ex": "Hand, foot and mouth disease is very contagious at preschool.", "id": "w6"}, {"w": "short of breath", "ipa": "/ʃɔːrt əv breθ/", "zh": "呼吸急促，喘不上气", "ex": "I get short of breath when I take the stairs.", "id": "w7"}, {"w": "medical certificate", "ipa": "/ˈmedɪkəl sərˈtɪfɪkət/", "zh": "病假条（新加坡常说 MC）", "ex": "Remember to send your medical certificate to HR.", "id": "w8"}, {"w": "keep (someone) up", "ipa": "/kiːp ʌp/", "zh": "让人睡不着", "ex": "The baby kept us up all night.", "tts_w": "keep up", "id": "w9"}], "sections": [{"heading": "1. Describing the Symptoms", "heading_zh": "1. 描述症状", "rows": [[{"id": "s0_0_0", "md": "Hi, come on in and have a seat. What brings you in today?", "text": "Hi, come on in and have a seat. What brings you in today?", "zh": "你好，进来坐吧。今天哪里不舒服？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I've had a sore throat and a fever since Sunday, and now I've started coughing.**", "text": "I've had a sore throat and a fever since Sunday, and now I've started coughing.", "zh": "我从周日开始喉咙痛、发烧，现在又开始咳嗽了。", "sp": "A"}], [{"id": "s0_2_0", "md": "How high has the ==fever== been? Have you taken anything for it?", "text": "How high has the fever been? Have you taken anything for it?", "zh": "烧到多少度？吃过什么药吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "Around thirty-eight point five at night. I've been taking paracetamol, but it __keeps coming back__.", "text": "Around thirty-eight point five at night. I've been taking paracetamol, but it keeps coming back.", "zh": "晚上大概三十八度五。我一直在吃扑热息痛，但烧总是反复。", "sp": "A"}], [{"id": "s0_4_0", "md": "Is the cough dry, or are you bringing up ==phlegm==?", "text": "Is the cough dry, or are you bringing up phlegm?", "zh": "是干咳，还是有痰？", "sp": "B"}], [{"id": "s0_5_0", "md": "Mostly dry, but it's worse at night. It's __keeping me up__.", "text": "Mostly dry, but it's worse at night. It's keeping me up.", "zh": "主要是干咳，但晚上更严重，咳得我睡不着。", "sp": "A"}], [{"id": "s0_6_0", "md": "Any ==allergies== to medication?", "text": "Any allergies to medication?", "zh": "有药物过敏吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Not that I know of.", "text": "Not that I know of.", "zh": "据我所知没有。", "sp": "A"}], [{"id": "s0_8_0", "md": "Let me have a listen. Breathe in deeply. Your chest is clear, but your throat is quite ==inflamed==.", "text": "Let me have a listen. Breathe in deeply. Your chest is clear, but your throat is quite inflamed.", "zh": "我听一下。深呼吸。肺部是清的，不过喉咙发炎挺厉害。", "sp": "B"}]]}, {"heading": "2. Medicine and Medical Leave", "heading_zh": "2. 开药和病假", "rows": [[{"id": "s1_0_0", "md": "It looks ==viral==, so antibiotics won't help. I'll give you something for the throat and a cough syrup.", "text": "It looks viral, so antibiotics won't help. I'll give you something for the throat and a cough syrup.", "zh": "看起来是病毒感染，抗生素没用。我给你开点治喉咙的药和止咳糖浆。", "sp": "B"}], [{"id": "s1_1_0", "md": "**Could I get a medical certificate? I don't think I can work like this.**", "text": "Could I get a medical certificate? I don't think I can work like this.", "zh": "能给我开个病假条吗？我这样没法上班。", "sp": "A"}], [{"id": "s1_2_0", "md": "Sure. I'll give you two const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
