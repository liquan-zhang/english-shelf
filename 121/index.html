const D = {"id": "121", "type": "dialogue", "title": "Seeing a Doctor at a Clinic", "meta": "B2 · 约 270 词 · 场景：全科诊所看病、病假条与复诊", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Doctor", "name_zh": "医生", "voice": "en-US-EmmaNeural"}}, "gist": [{"q": "「你」有哪些症状？持续多久了？", "a": "从周日开始喉咙痛、发烧，晚上约三十八度五，现在还有干咳，晚上更重。"}, {"q": "医生的诊断和处理是什么？", "a": "病毒感染，不用抗生素；开了喉咙药和止咳糖浆，给了两天病假。"}, {"q": "什么情况下要回来复诊？", "a": "再烧三天以上，或者感觉喘不上气，就马上回来。"}], "dictation": [{"id": "s0_1_0", "text": "I've had a sore throat and a fever since Sunday, and now I've started coughing."}, {"id": "s0_5_0", "text": "Mostly dry, but it's worse at night. It's keeping me up."}, {"id": "s1_3_0", "text": "Thanks. And my son is three. Is there a chance he'll catch it from me?"}, {"id": "s1_9_0", "text": "Great. Can I claim this visit with my company's insurance card?"}], "shadow": {"speaker": "A", "text": "Around thirty-eight point five at night. I've been taking paracetamol, but it keeps coming back.", "marked": "Around <b>thirty-eight point five</b> / at <b>night</b>. //<br>I've been taking <b>paracetamol</b>, / but it <b>keeps coming back</b>. //"}, "prompts": [{"q": "孩子半夜发烧还呕吐，你打电话给二十四小时诊所，描述症状并问现在要不要马上带去看。", "ref": "Hi, I'm calling about my three-year-old son. He's had a fever since this evening, about thirty-nine degrees, and he just threw up twice. He's still drinking a little water, but he's very tired. Should I bring him in now, or is it okay to wait until the morning? And do I need to book, or can we just walk in?", "ref_zh": "你好，我打电话是因为我三岁的儿子。他从今天傍晚开始发烧，大概三十九度，刚才吐了两次。他还能喝一点水，但很没精神。我应该现在带他过去，还是可以等到早上？需要预约吗，还是直接过去就行？", "id": "ref0"}, {"q": "你吃了医生开的药三天还没好转，再去诊所复诊。说清楚哪里好了、哪里没好，并问下一步怎么办。", "ref": "Hi, doctor, I came in on Monday with a sore throat and fever. The fever's gone now, which is good, but the cough is actually worse, especially at night, and I'm still very tired. I've been taking the syrup three times a day. Do you think I need a different medicine, or maybe a chest X-ray?", "ref_zh": "医生你好，我周一来过，当时喉咙痛、发烧。现在烧退了，这点挺好，但咳嗽反而更严重了，尤其是晚上，人也还是很累。止咳糖浆我一直一天喝三次。你觉得需要换药吗，或者拍个胸片？", "id": "ref1"}], "words": [{"w": "fever", "ipa": "/ˈfiːvər/", "zh": "发烧", "ex": "My daughter has had a fever since last night.", "id": "w0"}, {"w": "phlegm", "ipa": "/flem/", "zh": "痰", "ex": "This syrup helps loosen the phlegm.", "id": "w1"}, {"w": "allergy", "ipa": "/ˈælərdʒi/", "zh": "过敏", "ex": "Does your son have any food allergies?", "id": "w2"}, {"w": "inflamed", "ipa": "/ɪnˈfleɪmd/", "zh": "发炎的", "ex": "His gums are a bit inflamed.", "id": "w3"}, {"w": "viral", "ipa": "/ˈvaɪrəl/", "zh": "病毒性的", "ex": "It's a viral infection, so it should clear up on its own.", "id": "w4"}, {"w": "medical leave", "ipa": "/ˈmedɪkəl liːv/", "zh": "病假", "ex": "I'm on medical leave until Friday.", "id": "w5"}, {"w": "contagious", "ipa": "/kənˈteɪdʒəs/", "zh": "传染性的", "ex": "Hand, foot and mouth disease is very contagious at preschool.", "id": "w6"}, {"w": "short of breath", "ipa": "/ʃɔːrt əv breθ/", "zh": "呼吸急促，喘不上气", "ex": "I get short of breath when I take the stairs.", "id": "w7"}, {"w": "medical certificate", "ipa": "/ˈmedɪkəl sərˈtɪfɪkət/", "zh": "病假条（新加坡常说 MC）", "ex": "Remember to send your medical certificate to HR.", "id": "w8"}, {"w": "keep (someone) up", "ipa": "/kiːp ʌp/", "zh": "让人睡不着", "ex": "The baby kept us up all night.", "tts_w": "keep up", "id": "w9"}], "sections": [{"heading": "1. Describing the Symptoms", "heading_zh": "1. 描述症状", "rows": [[{"id": "s0_0_0", "md": "Hi, come on in and have a seat. What brings you in today?", "text": "Hi, come on in and have a seat. What brings you in today?", "zh": "你好，进来坐吧。今天哪里不舒服？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I've had a sore throat and a fever since Sunday, and now I've started coughing.**", "text": "I've had a sore throat and a fever since Sunday, and now I've started coughing.", "zh": "我从周日开始喉咙痛、发烧，现在又开始咳嗽了。", "sp": "A"}], [{"id": "s0_2_0", "md": "How high has the ==fever== been? Have you taken anything for it?", "text": "How high has the fever been? Have you taken anything for it?", "zh": "烧到多少度？吃过什么药吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "Around thirty-eight point five at night. I've been taking paracetamol, but it __keeps coming back__.", "text": "Around thirty-eight point five at night. I've been taking paracetamol, but it keeps coming back.", "zh": "晚上大概三十八度五。我一直在吃扑热息痛，但烧总是反复。", "sp": "A"}], [{"id": "s0_4_0", "md": "Is the cough dry, or are you bringing up ==phlegm==?", "text": "Is the cough dry, or are you bringing up phlegm?", "zh": "是干咳，还是有痰？", "sp": "B"}], [{"id": "s0_5_0", "md": "Mostly dry, but it's worse at night. It's __keeping me up__.", "text": "Mostly dry, but it's worse at night. It's keeping me up.", "zh": "主要是干咳，但晚上更严重，咳得我睡不着。", "sp": "A"}], [{"id": "s0_6_0", "md": "Any ==allergies== to medication?", "text": "Any allergies to medication?", "zh": "有药物过敏吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Not that I know of.", "text": "Not that I know of.", "zh": "据我所知没有。", "sp": "A"}], [{"id": "s0_8_0", "md": "Let me have a listen. Breathe in deeply. Your chest is clear, but your throat is quite ==inflamed==.", "text": "Let me have a listen. Breathe in deeply. Your chest is clear, but your throat is quite inflamed.", "zh": "我听一下。深呼吸。肺部是清的，不过喉咙发炎挺厉害。", "sp": "B"}]]}, {"heading": "2. Medicine and Medical Leave", "heading_zh": "2. 开药和病假", "rows": [[{"id": "s1_0_0", "md": "It looks ==viral==, so antibiotics won't help. I'll give you something for the throat and a cough syrup.", "text": "It looks viral, so antibiotics won't help. I'll give you something for the throat and a cough syrup.", "zh": "看起来是病毒感染，抗生素没用。我给你开点治喉咙的药和止咳糖浆。", "sp": "B"}], [{"id": "s1_1_0", "md": "**Could I get a medical certificate? I don't think I can work like this.**", "text": "Could I get a medical certificate? I don't think I can work like this.", "zh": "能给我开个病假条吗？我这样没法上班。", "sp": "A"}], [{"id": "s1_2_0", "md": "Sure. I'll give you two const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

    h('div', { class: 'how', html: how }), body);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
