<script>
const D = {"id": "072", "title": "Writing Goals That Can Be Measured", "meta": "B2 · 约 270 词 · 场景：目标设定", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Goal That Cannot Fail", "heading_zh": "1. 一个不可能失败的目标", "rows": [[{"id": "s0_0_0", "md": "\"Improve app performance\" appears in a lot of quarterly plans.", "text": "\"Improve app performance\" appears in a lot of quarterly plans.", "zh": "「提升 App 性能」出现在很多季度规划里。", "sp": null}, {"id": "s0_0_1", "md": "It sounds ==ambitious==, and nobody can argue with it.", "text": "It sounds ambitious, and nobody can argue with it.", "zh": "听起来很有野心，谁也挑不出毛病。", "sp": null}, {"id": "s0_0_2", "md": "That is exactly the problem.", "text": "That is exactly the problem.", "zh": "问题恰恰就在这里。", "sp": null}], [{"id": "s0_1_0", "md": "At the end of the quarter, the team will have done some performance work, so the goal will look met.", "text": "At the end of the quarter, the team will have done some performance work, so the goal will look met.", "zh": "到季度末，团队总会做了些性能相关的活儿，所以目标看起来是完成了。", "sp": null}, {"id": "s0_1_1", "md": "But nobody can say whether the work mattered, or whether a different project would have mattered more.", "text": "But nobody can say whether the work mattered, or whether a different project would have mattered more.", "zh": "但没人说得清这些活儿到底有没有用，或者换个项目会不会更有价值。", "sp": null}, {"id": "s0_1_2", "md": "**A goal that cannot fail also cannot tell you anything.**", "text": "A goal that cannot fail also cannot tell you anything.", "zh": "一个不可能失败的目标，也不可能告诉你任何东西。", "sp": null}], [{"id": "s0_2_0", "md": "Measurable goals feel risky because they make it obvious when you miss.", "text": "Measurable goals feel risky because they make it obvious when you miss.", "zh": "可衡量的目标让人觉得有风险，因为没达成的时候一眼就能看出来。", "sp": null}, {"id": "s0_2_1", "md": "That ==visibility== is the whole point.", "text": "That visibility is the whole point.", "zh": "这种透明恰恰是关键所在。", "sp": null}, {"id": "s0_2_2", "md": "A clear miss teaches the team far more than a ==fuzzy== success, because it forces an honest conversation about why.", "text": "A clear miss teaches the team far more than a fuzzy success, because it forces an honest conversation about why.", "zh": "一次清清楚楚的没达成，比一次模模糊糊的成功能教给团队多得多，因为它逼着大家坦诚地讨论原因。", "sp": null}]]}, {"heading": "2. Baseline, Target, Guardrail", "heading_zh": "2. 基线、目标值、护栏", "rows": [[{"id": "s1_0_0", "md": "A measurable goal starts with three parts.", "text": "A measurable goal starts with three parts.", "zh": "一个可衡量的目标从三部分开始。", "sp": null}, {"id": "s1_0_1", "md": "The ==baseline== is where you are today, like a cold start time of two point four seconds.", "text": "The baseline is where you are today, like a cold start time of two point four seconds.", "zh": "基线是你现在的位置，比如冷启动时间二点四秒。", "sp": null}, {"id": "s1_0_2", "md": "The target is where you want to be, like one point five seconds, and the date is when you will check.", "text": "The target is where you want to be, like one point five seconds, and the date is when you will check.", "zh": "目标值是你想达到的位置，比如一点五秒，再加上你什么时候来检查。", "sp": null}], [{"id": "s1_1_0", "md": "Then add a ==guardrail==, a metric that must not get worse.", "text": "Then add a guardrail, a metric that must not get worse.", "zh": "然后加一条护栏，也就是一个不能变差的指标。", "sp": null}, {"id": "s1_1_1", "md": "Teams under pressure will find shortcuts, like loading less content so the first screen appears faster.", "text": "Teams under pressure will find shortcuts, like loading less content so the first screen appears faster.", "zh": "压力之下，团队会找捷径，比如少加载点内容，让首屏出得更快。", "sp": null}, {"id": "s1_1_2", "md": "A guardrail such as \"crash rate and session length stay flat\" keeps everyone __playing fair__.", "text": "A guardrail such as \"crash rate and session length stay flat\" keeps everyone playing fair.", "zh": "像「崩溃率和使用时长保持持平」这样的护栏，能让大家都规规矩矩地玩。", "sp": null}], [{"id": "s1_2_0", "md": "Some goals are hard to measure directly, especially in the first quarter of a new project.", "text": "Some goals are hard to measure directly, especially in the first quarter of a new project.", "zh": "有些目标很难直接衡量，尤其是新项目的第一个季度。", "sp": null}, {"id": "s1_2_1", "md": "**If you can't measure the outcome yet, measure the step that leads to it, and say so.**", "text": "If you can't measure the outcome yet, measure the step that leads to it, and say so.", "zh": "如果结果暂时还量不了，就去量通往结果的那一步，并且把这一点讲明白。", "sp": null}, {"id": "s1_2_2", "md": "\"Ship the new image pipeline to all regions\" is not perfect, but at least it is ==verifiable==.", "text": "\"Ship the new image pipeline to all regions\" is not perfect, but at least it is verifiable.", "zh": "「新的图片链路全量覆盖所有地区」不算完美，但至少是可验证的。", "sp": null}, {"id": "s1_2_3", "md": "Just don't pretend that an ==output== is the same as a result, and __come back to__ the real metric once you can track it.", "text": "Just don't pretend that an output is the same as a result, and come back to the real metric once you can track it.", "zh": "只是别假装产出就等于结果，等能追踪真正的指标了，再回到那个指标上来。", "sp": null}]]}], "gist": [{"q": "“提升 App 性能”这类目标有什么问题？", "a": "听起来宏大没人反对，但不可能失败，因此也无法告诉你做的事是否有价值。"}, {"q": "一个可衡量的目标包括哪几部分？为什么要加护栏指标？", "a": "基线、目标值、检查日期；再加一个不能变差的护栏指标，防止团队在压力下走捷径（比如少加载内容来刷快首屏）。"}, {"q": "暂时无法直接衡量结果时怎么办？", "a": "衡量通往结果的那一步并明说，比如“新图片管线上线到所有区域”；但不要把产出当成结果，能追踪时回到真正的指标。"}], "dictation": [{"id": "s0_1_2", "text": "A goal that cannot fail also cannot tell you anything."}, {"id": "s0_2_0", "text": "Measurable goals feel risky because they make it obvious when you miss."}, {"id": "s1_1_0", "text": "Then add a guardrail, a metric that must not get worse."}, {"id": "s1_2_1", "text": "If you can't measure the outcome yet, measure the step that leads to it, and say so."}], "shadow": {"text": "Then add a guardrail, a metric that must not get worse. Teams under pressure will find shortcuts, like loading less content so the first screen appears faster.", "marked": "Then add a <b>guardrail</b>, / a metric that must <b>not</b> get worse. //<br>Teams under <b>pressure</b> / will find <b>shortcuts</b>, / like loading <b>less</b> content / so the first screen appears <b>faster</b>. //"}, "prompts": [{"q": "你下属交来的季度目标写着“提升搜索体验”。用 30 秒帮他改成可衡量的目标，包括基线、目标和护栏。", "ref": "I like the focus on search, but as written, we can't tell at the end of the quarter if we succeeded. Let's make it measurable. Right now, about forty percent of searches end with a click. Could we aim for fifty percent by the end of the quarter? And let's add a guardrail: search latency shouldn't go up. That way nobody can hit the target by just showing fewer results.", "ref_zh": "我认同把重点放在搜索上，但按现在的写法，到季度末我们没法判断有没有成功。我们把它改成可衡量的。现在大约百分之四十的搜索最后有点击。我们能不能把季度末的目标定在百分之五十？再加一条护栏：搜索延迟不能涨。这样就没人能靠少展示结果来凑数了。", "id": "ref0"}, {"q": "一个新项目第一季度很难直接衡量业务结果。用 30 秒向你的总监解释为什么本季度用里程碑代替结果指标。", "ref": "For this quarter, I'd suggest a milestone goal rather than a business metric. The new recommendation service won't have real traffic until late in the quarter, so any retention number would be noise. Instead, we'll commit to having it live in all three regions by week ten. That's verifiable. Next quarter, once traffic is real, we switch to measuring retention directly.", "ref_zh": "这个季度我建议定一个里程碑目标，而不是业务指标。新的推荐服务要到季度末才会有真实流量，所以任何留存数字都只是噪音。我们改为承诺第十周之前在三个地区全部上线。这是可验证的。下个季度等有了真实流量，我们再改成直接看留存。", "id": "ref1"}], "words": [{"w": "ambitious", "ipa": "/æmˈbɪʃəs/", "zh": "雄心勃勃的、宏大的", "ex": "Halving latency in one quarter is ambitious but possible.", "id": "w0"}, {"w": "visibility", "ipa": "/ˌvɪzəˈbɪləti/", "zh": "可见度、透明度", "ex": "A weekly dashboard gives leadership visibility into our progress.", "id": "w1"}, {"w": "fuzzy", "ipa": "/ˈfʌzi/", "zh": "模糊不清的", "ex": "The requirements are still fuzzy, so let's not estimate yet.", "id": "w2"}, {"w": "baseline", "ipa": "/ˈbeɪsˌlaɪn/", "zh": "基线、基准值", "ex": "We need a baseline before we can say the change helped.", "id": "w3"}, {"w": "guardrail", "ipa": "/ˈɡɑːrdˌreɪl/", "zh": "护栏指标、防护底线", "ex": "Crash rate is our guardrail for this experiment.", "id": "w4"}, {"w": "verifiable", "ipa" const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
