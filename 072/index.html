const D = {"id": "072", "title": "Writing Goals That Can Be Measured", "meta": "B2 · 约 270 词 · 场景：目标设定", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Goal That Cannot Fail", "heading_zh": "1. 一个不可能失败的目标", "rows": [[{"id": "s0_0_0", "md": "\"Improve app performance\" appears in a lot of quarterly plans.", "text": "\"Improve app performance\" appears in a lot of quarterly plans.", "zh": "「提升 App 性能」出现在很多季度规划里。", "sp": null}, {"id": "s0_0_1", "md": "It sounds ==ambitious==, and nobody can argue with it.", "text": "It sounds ambitious, and nobody can argue with it.", "zh": "听起来很有野心，谁也挑不出毛病。", "sp": null}, {"id": "s0_0_2", "md": "That is exactly the problem.", "text": "That is exactly the problem.", "zh": "问题恰恰就在这里。", "sp": null}], [{"id": "s0_1_0", "md": "At the end of the quarter, the team will have done some performance work, so the goal will look met.", "text": "At the end of the quarter, the team will have done some performance work, so the goal will look met.", "zh": "到季度末，团队总会做了些性能相关的活儿，所以目标看起来是完成了。", "sp": null}, {"id": "s0_1_1", "md": "But nobody can say whether the work mattered, or whether a different project would have mattered more.", "text": "But nobody can say whether the work mattered, or whether a different project would have mattered more.", "zh": "但没人说得清这些活儿到底有没有用，或者换个项目会不会更有价值。", "sp": null}, {"id": "s0_1_2", "md": "**A goal that cannot fail also cannot tell you anything.**", "text": "A goal that cannot fail also cannot tell you anything.", "zh": "一个不可能失败的目标，也不可能告诉你任何东西。", "sp": null}], [{"id": "s0_2_0", "md": "Measurable goals feel risky because they make it obvious when you miss.", "text": "Measurable goals feel risky because they make it obvious when you miss.", "zh": "可衡量的目标让人觉得有风险，因为没达成的时候一眼就能看出来。", "sp": null}, {"id": "s0_2_1", "md": "That ==visibility== is the whole point.", "text": "That visibility is the whole point.", "zh": "这种透明恰恰是关键所在。", "sp": null}, {"id": "s0_2_2", "md": "A clear miss teaches the team far more than a ==fuzzy== success, because it forces an honest conversation about why.", "text": "A clear miss teaches the team far more than a fuzzy success, because it forces an honest conversation about why.", "zh": "一次清清楚楚的没达成，比一次模模糊糊的成功能教给团队多得多，因为它逼着大家坦诚地讨论原因。", "sp": null}]]}, {"heading": "2. Baseline, Target, Guardrail", "heading_zh": "2. 基线、目标值、护栏", "rows": [[{"id": "s1_0_0", "md": "A measurable goal starts with three parts.", "text": "A measurable goal starts with three parts.", "zh": "一个可衡量的目标从三部分开始。", "sp": null}, {"id": "s1_0_1", "md": "The ==baseline== is where you are today, like a cold start time of two point four seconds.", "text": "The baseline is where you are today, like a cold start time of two point four seconds.", "zh": "基线是你现在的位置，比如冷启动时间二点四秒。", "sp": null}, {"id": "s1_0_2", "md": "The target is where you want to be, like one point five seconds, and the date is when you will check.", "text": "The target is where you want to be, like one point five seconds, and the date is when you will check.", "zh": "目标值是你想达到的位置，比如一点五秒，再加上你什么时候来检查。", "sp": null}], [{"id": "s1_1_0", "md": "Then add a ==guardrail==, a metric that must not get worse.", "text": "Then add a guardrail, a metric that must not get worse.", "zh": "然后加一条护栏，也就是一个不能变差的指标。", "sp": null}, {"id": "s1_1_1", "md": "Teams under pressure will find shortcuts, like loading less content so the first screen appears faster.", "text": "Teams under pressure will find shortcuts, like loading less content so the first screen appears faster.", "zh": "压力之下，团队会找捷径，比如少加载点内容，让首屏出得更快。", "sp": null}, {"id": "s1_1_2", "md": "A guardrail such as \"crash rate and session length stay flat\" keeps everyone __playing fair__.", "text": "A guardrail such as \"crash rate and session length stay flat\" keeps everyone playing fair.", "zh": "像「崩溃率和使用时长保持持平」这样的护栏，能让大家都规规矩矩地玩。", "sp": null}], [{"id": "s1_2_0", "md": "Some goals are hard to measure directly, especially in the first quarter of a new project.", "text": "Some goals are hard to measure directly, especially in the first quarter of a new project.", "zh": "有些目标很难直接衡量，尤其是新项目的第一个季度。", "sp": null}, {"id": "s1_2_1", "md": "**If you can't measure the outcome yet, measure the step that leads to it, and say so.**", "text": "If you can't measure the outcome yet, measure the step that leads to it, and say so.", "zh": "如果结果暂时还量不了，就去量通往结果的那一步，并且把这一点讲明白。", "sp": null}, {"id": "s1_2_2", "md": "\"Ship the new image pipeline to all regions\" is not perfect, but at least it is ==verifiable==.", "text": "\"Ship the new image pipeline to all regions\" is not perfect, but at least it is verifiable.", "zh": "「新的图片链路全量覆盖所有地区」不算完美，但至少是可验证的。", "sp": null}, {"id": "s1_2_3", "md": "Just don't pretend that an ==output== is the same as a result, and __come back to__ the real metric once you can track it.", "text": "Just don't pretend that an output is the same as a result, and come back to the real metric once you can track it.", "zh": "只是别假装产出就等于结果，等能追踪真正的指标了，再回到那个指标上来。", "sp": null}]]}], "gist": [{"q": "“提升 App 性能”这类目标有什么问题？", "a": "听起来宏大没人反对，但不可能失败，因此也无法告诉你做的事是否有价值。"}, {"q": "一个可衡量的目标包括哪几部分？为什么要加护栏指标？", "a": "基线、目标值、检查日期；再加一个不能变差的护栏指标，防止团队在压力下走捷径（比如少加载内容来刷快首屏）。"}, {"q": "暂时无法直接衡量结果时怎么办？", "a": "衡量通往结果的那一步并明说，比如“新图片管线上线到所有区域”；但不要把产出当成结果，能追踪时回到真正的指标。"}], "dictation": [{"id": "s0_1_2", "text": "A goal that cannot fail also cannot tell you anything."}, {"id": "s0_2_0", "text": "Measurable goals feel risky because they make it obvious when you miss."}, {"id": "s1_1_0", "text": "Then add a guardrail, a metric that must not get worse."}, {"id": "s1_2_1", "text": "If you can't measure the outcome yet, measure the step that leads to it, and say so."}], "shadow": {"text": "Then add a guardrail, a metric that must not get worse. Teams under pressure will find shortcuts, like loading less content so the first screen appears faster.", "marked": "Then add a <b>guardrail</b>, / a metric that must <b>not</b> get worse. //<br>Teams under <b>pressure</b> / will find <b>shortcuts</b>, / like loading <b>less</b> content / so the first screen appears <b>faster</b>. //"}, "prompts": [{"q": "你下属交来的季度目标写着“提升搜索体验”。用 30 秒帮他改成可衡量的目标，包括基线、目标和护栏。", "ref": "I like the focus on search, but as written, we can't tell at the end of the quarter if we succeeded. Let's make it measurable. Right now, about forty percent of searches end with a click. Could we aim for fifty percent by the end of the quarter? And let's add a guardrail: search latency shouldn't go up. That way nobody can hit the target by just showing fewer results.", "ref_zh": "我认同把重点放在搜索上，但按现在的写法，到季度末我们没法判断有没有成功。我们把它改成可衡量的。现在大约百分之四十的搜索最后有点击。我们能不能把季度末的目标定在百分之五十？再加一条护栏：搜索延迟不能涨。这样就没人能靠少展示结果来凑数了。", "id": "ref0"}, {"q": "一个新项目第一季度很难直接衡量业务结果。用 30 秒向你的总监解释为什么本季度用里程碑代替结果指标。", "ref": "For this quarter, I'd suggest a milestone goal rather than a business metric. The new recommendation service won't have real traffic until late in the quarter, so any retention number would be noise. Instead, we'll commit to having it live in all three regions by week ten. That's verifiable. Next quarter, once traffic is real, we switch to measuring retention directly.", "ref_zh": "这个季度我建议定一个里程碑目标，而不是业务指标。新的推荐服务要到季度末才会有真实流量，所以任何留存数字都只是噪音。我们改为承诺第十周之前在三个地区全部上线。这是可验证的。下个季度等有了真实流量，我们再改成直接看留存。", "id": "ref1"}], "words": [{"w": "ambitious", "ipa": "/æmˈbɪʃəs/", "zh": "雄心勃勃的、宏大的", "ex": "Halving latency in one quarter is ambitious but possible.", "id": "w0"}, {"w": "visibility", "ipa": "/ˌvɪzəˈbɪləti/", "zh": "可见度、透明度", "ex": "A weekly dashboard gives leadership visibility into our progress.", "id": "w1"}, {"w": "fuzzy", "ipa": "/ˈfʌzi/", "zh": "模糊不清的", "ex": "The requirements are still fuzzy, so let's not estimate yet.", "id": "w2"}, {"w": "baseline", "ipa": "/ˈbeɪsˌlaɪn/", "zh": "基线、基准值", "ex": "We need a baseline before we can say the change helped.", "id": "w3"}, {"w": "guardrail", "ipa": "/ˈɡɑːrdˌreɪl/", "zh": "护栏指标、防护底线", "ex": "Crash rate is our guardrail for this experiment.", "id": "w4"}, {"w": "verifiable", "ipa" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;

const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
