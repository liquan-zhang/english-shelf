<script>
const D = {"id": "065", "title": "Explaining Risk Without Scaring People", "meta": "B2 · 约 260 词 · 场景：风险汇报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Two Ways to Say the Same Thing", "heading_zh": "1. 同一件事的两种说法", "rows": [[{"id": "s0_0_0", "md": "Imagine two engineers describing the same problem to a director.", "text": "Imagine two engineers describing the same problem to a director.", "zh": "设想两个工程师向总监描述同一个问题。", "sp": null}, {"id": "s0_0_1", "md": "The first says, \"The database could fall over during the sale.\"", "text": "The first says, \"The database could fall over during the sale.\"", "zh": "第一个说：「大促期间数据库可能会挂。」", "sp": null}, {"id": "s0_0_2", "md": "The second says, \"There is a small chance the database hits its limit during the sale; if it does, checkout slows for a few minutes, and we have a switch ready to turn off recommendations.\"", "text": "The second says, \"There is a small chance the database hits its limit during the sale; if it does, checkout slows for a few minutes, and we have a switch ready to turn off recommendations.\"", "zh": "第二个说：「大促期间数据库有小概率打到上限；真打到了，下单会慢几分钟，我们准备好了一个开关，可以把推荐关掉。」", "sp": null}], [{"id": "s0_1_0", "md": "Both are honest, but only one of them lets the director sleep at night.", "text": "Both are honest, but only one of them lets the director sleep at night.", "zh": "两个人说的都是实话，但只有一个能让总监睡个安稳觉。", "sp": null}, {"id": "s0_1_1", "md": "The first sentence is ==alarming== because it has no size and no plan.", "text": "The first sentence is alarming because it has no size and no plan.", "zh": "第一句话吓人，是因为它既没说多大，也没说怎么办。", "sp": null}, {"id": "s0_1_2", "md": "The listener fills the gap with the worst ==outcome== they can picture.", "text": "The listener fills the gap with the worst outcome they can picture.", "zh": "听的人会用自己能想到的最坏结果去填这个空白。", "sp": null}], [{"id": "s0_2_0", "md": "**Unmeasured risk sounds bigger than it is, and that makes people overreact.**", "text": "Unmeasured risk sounds bigger than it is, and that makes people overreact.", "zh": "没量化过的风险听起来总比实际更大，这会让人反应过度。", "sp": null}, {"id": "s0_2_1", "md": "They add approval steps, delay launches, or start to ==micromanage== the team.", "text": "They add approval steps, delay launches, or start to micromanage the team.", "zh": "他们会加审批环节、推迟上线，或者开始事无巨细地管团队。", "sp": null}, {"id": "s0_2_2", "md": "Your job is to give them a risk they can __put in perspective__.", "text": "Your job is to give them a risk they can put in perspective.", "zh": "你的任务是给他们一个能放在合理位置上看待的风险。", "sp": null}]]}, {"heading": "2. Likelihood, Impact, Plan", "heading_zh": "2. 可能性、影响、预案", "rows": [[{"id": "s1_0_0", "md": "A calm risk statement has three parts.", "text": "A calm risk statement has three parts.", "zh": "一个冷静的风险陈述有三个部分。", "sp": null}, {"id": "s1_0_1", "md": "Likelihood: how probable is it, in rough terms like \"unlikely\" or \"about one in ten\"?", "text": "Likelihood: how probable is it, in rough terms like \"unlikely\" or \"about one in ten\"?", "zh": "可能性：大概有多大概率，用「不太可能」或者「十分之一左右」这种粗略的说法就行。", "sp": null}, {"id": "s1_0_2", "md": "Impact: who is affected, for how long, and how badly?", "text": "Impact: who is affected, for how long, and how badly?", "zh": "影响：影响到谁，持续多久，严重到什么程度？", "sp": null}, {"id": "s1_0_3", "md": "Plan: what will you do to prevent it, and what will you do if it happens anyway?", "text": "Plan: what will you do to prevent it, and what will you do if it happens anyway?", "zh": "预案：你会怎么预防，万一还是发生了又会怎么处理？", "sp": null}], [{"id": "s1_1_0", "md": "**Never present a risk without the plan that goes with it.**", "text": "Never present a risk without the plan that goes with it.", "zh": "永远不要只抛出风险而不带上对应的预案。", "sp": null}, {"id": "s1_1_1", "md": "The plan is what turns a worry into a ==contained== risk.", "text": "The plan is what turns a worry into a contained risk.", "zh": "正是预案，把一个担忧变成了一个可控的风险。", "sp": null}, {"id": "s1_1_2", "md": "Even a simple fallback, like \"we can __switch back to__ the old flow in five minutes,\" changes the mood in the room.", "text": "Even a simple fallback, like \"we can switch back to the old flow in five minutes,\" changes the mood in the room.", "zh": "哪怕只是一个简单的兜底，比如「我们五分钟内就能切回老流程」，也会让屋里的气氛完全不同。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, match your tone to the ==severity==.", "text": "Finally, match your tone to the severity.", "zh": "最后，语气要和严重程度匹配。", "sp": null}, {"id": "s1_2_1", "md": "Don't __play it down__ to look confident, and don't ==dramatize== it to get attention.", "text": "Don't play it down to look confident, and don't dramatize it to get attention.", "zh": "别为了显得自信就轻描淡写，也别为了引起重视就夸大其词。", "sp": null}, {"id": "s1_2_2", "md": "If you are honest about size, people will believe you when you finally say, \"This one is serious.\"", "text": "If you are honest about size, people will believe you when you finally say, \"This one is serious.\"", "zh": "如果你对风险大小一直很坦诚，等你终于说「这次是真的严重」时，大家就会信你。", "sp": null}]]}], "gist": [{"q": "文中两种说法的关键区别是什么？", "a": "第一种只说“可能挂”，没有大小和预案，很吓人；第二种说清概率小、影响几分钟、并有开关预案。"}, {"q": "没有量化的风险会导致什么后果？", "a": "听的人会往最坏处想而过度反应：加审批、推迟上线、开始微观管理团队。"}, {"q": "一个冷静的风险陈述包括哪三部分？语气上要注意什么？", "a": "可能性、影响、预案；语气要和严重程度匹配，既不淡化也不夸大，这样真正严重时别人才会信你。"}], "dictation": [{"id": "s0_2_0", "text": "Unmeasured risk sounds bigger than it is, and that makes people overreact."}, {"id": "s1_1_0", "text": "Never present a risk without the plan that goes with it."}, {"id": "s1_1_1", "text": "The plan is what turns a worry into a contained risk."}, {"id": "s1_2_1", "text": "Don't play it down to look confident, and don't dramatize it to get attention."}], "shadow": {"text": "Never present a risk without the plan that goes with it. The plan is what turns a worry into a contained risk.", "marked": "<b>Never</b> present a risk / without the <b>plan</b> / that goes with it. //<br>The plan is what turns a <b>worry</b> / into a <b>contained</b> risk. //"}, "prompts": [{"q": "大促前，总监问你“新缓存方案有没有风险？”。用 30 秒按“可能性、影响、预案”回答，不要吓到他。", "ref": "There is one risk worth knowing about. If traffic is much higher than forecast, the new cache could run out of memory. We think that's unlikely, maybe one in ten. If it happens, product pages would load slower for a few minutes, but checkout isn't affected. We've set an alert at seventy percent memory, and we can switch back to the old cache in under five minutes.", "ref_zh": "有一个风险值得大家知道。如果流量比预估高很多，新缓存可能会内存不够。我们觉得可能性不大，大概十分之一。真发生了，商品页会慢几分钟，但下单不受影响。我们在内存百分之七十设了告警，而且五分钟内就能切回老缓存。", "id": "ref0"}, {"q": "同事在全员群里写“这次迁移可能会丢数据！”，引起恐慌。用 30 秒在会上把这个风险重新讲清楚、讲准确。", "ref": "I want to put yesterday's message in perspective. The risk is real, but it's narrow. Only drafts saved during the ten-minute cutover window could be affected, and we expect that to be a few hundred records at most. We're taking a full backup right before the cutover, and we've tested restoring from it twice. So it's a contained risk with a clear recovery plan.", "ref_zh": "我想把昨天那条消息说得更准确一点。风险是真实存在的，但范围很窄。只有在十分钟切换窗口内保存的草稿可能受影响，我们预计最多也就几百条记录。切换前我们会做一次全量备份，而且已经演练过两次从备份恢复。所以这是一个可控的风险，恢复方案也很清楚。", "id": "ref1"}], "words": [{"w": "alarming", "ipa": "/əˈlɑːrmɪŋ/", "zh": "令人担忧的、吓人的", "ex": "The error spike looked alarming, but it was a logging bug.", "id": "w0"}, {"w": "outcome", "ipa": "/ˈaʊtˌkʌm/", "zh": "结果", "ex": "The worst outcome is a few minutes of slower checkout.", "id": "w1"}, {"w": "micromanage", "ipa": "/ˌmaɪkroʊˈmænɪdʒ/", "zh": "微观管理、管得过细", "ex": "After the outage, leadership started to micromanage every release.", "id": "w2"}, {"w": "contain (v.)", "ipa": "/kənˈteɪn/", "zh": "控制住、限制住", "ex": "We contained the issue to one region before it spread.", "tts_w": "contain", "id": "w3"}, {"w": "severity", "ipa": "/səˈverəti/", "zh": "严重程度", "ex": "Let's agree on the severity level before we page anyone.", "id": "w4"}, {"w": "dramatize", "ipa": "/ˈdræməˌtaɪz/", "zh": "夸大、渲染", "ex": "I don't want to dramatize it, but this bug affects every new user.", "id": "w5"}, {"w": "likelihood", "ipa": "/ˈlaɪkliˌhʊd/", "zh": "可能性", "ex": "The likelihood , 38.172], [38.186, 38.343], [38.357, 38.58], [38.593, 39.001], [39.015, 39.778]]}, {"kind": "s", "id": "s0_2_1", "md": "They add approval steps, delay launches, or start to ==micromanage== the team.", "zh": "他们会加审批环节、推迟上线，或者开始事无巨细地管团队。", "sp": null, "gap": false, "start": 40.176, "end": 45.192, "words": [[40.281, 40.439], [40.452, 40.597], [40.61, 41.071], [41.084, 41.663], [41.887, 42.176], [42.189, 42.834], [43.084, 43.202], [43.215, 43.518], [43.531, 43.61], [43.623, 44.334], [44.347, 44.426], [44.439, 44.808]]}, {"kind": "s", "id": "s0_2_2", "md": "Your job is to give them a risk they can __put in perspective__.", "zh": "你的任务是给他们一个能放在合理位置上看待的风险。", "sp": null, "gap": false, "start": 45.192, "end": 48.72, "words": [[45.297, 45.403], [45.416, 45.81], [45.903, 45.995], [46.008, 46.113], [46.126, 46.337], [46.35, 46.481], [46.495, 46.574], [46.587, 47.021], [47.034, 47.153], [47.166, 47.324], [47.337, 47.534], [47.547, 47.626], [47.639, 48.324]]}, {"kind": "h", "id": "h1", "md": "2. Likelihood, Impact, Plan", "zh": "2. 可能性、影响、预案", "start": 48.72, "end": 51.72, "words": [[48.838, 49.088], [49.417, 49.983], [50.299, 50.812], [50.891, 51.325]]}, {"kind": "s", "id": "s1_0_0", "md": "A calm risk statement has three parts.", "zh": "一个冷静的风险陈述有三个部分。", "sp": null, "gap": false, "start": 51.72, "end": 54.312, "words": [[51.825, 51.891], [51.904, 52.246], [52.259, 52.457], [52.47, 52.904], [52.917, 53.128], [53.141, 53.365], [53.378, 53.931]]}, {"kind": "s", "id": "s1_0_1", "md": "Likelihood: how probable is it, in rough terms like \"unlikely\" or \"about one in ten\"?", "zh": "可能性：大概有多大概率，用「不太可能」或者「十分之一左右」这种粗略的说法就行。", "sp": null, "gap": false, "start": 54.312, "end": 60.912, "words": [[54.417, 54.944], [55.391, 55.523], [55.536, 56.049], [56.062, 56.18], [56.194, 56.365], [56.615, 56.786], [56.799, 57.036], [57.049, 57.417], [57.43, 57.68], [57.786, 58.509], [58.93, 59.101], [59.128, 59.483], [59.496, 59.72], [59.733, 59.838], [59.851, 60.246]]}, {"kind": "s", "id": "s1_0_2", "md": "Impact: who is affected, for how long, and how badly?", "zh": "影响：影响到谁，持续多久，严重到什么程度？", "sp": null, "gap": false, "start": 60.912, "end": 65.232, "words": [[61.017, 61.491], [61.965, 62.096], [62.109, 62.215], [62.228, 62.754], [63.017, 63.136], [63.149, 63.346], [63.359, 63.807], [64.057, 64.109], [64.123, 64.32], [64.333, 64.846]]}, {"kind": "s", "id": "s1_0_3", "md": "Plan: what will you do to prevent it, and what will you do if it happens anyway?", "zh": "预案：你会怎么预防，万一还是发生了又会怎么处理？", "sp": null, "gap": false, "start": 65.232, "end": 70.248, "words": [[65.35, 65.653], [66.087, 66.219], [66.232, 66.337], [66.35, 66.495], [66.508, 66.745], [66.758, 66.864], [66.877, 67.285], [67.298, 67.443], [67.758, 67.837], [67.85, 68.008], [68.021, 68.14], [68.153, 68.298], [68.311, 68.653], [68.666, 68.837], [68.85, 68.916], [68.929, 69.364], [69.377, 69.85]]}, {"kind": "s", "id": "s1_1_0", "md": "**Never present a risk without the plan that goes with it.**", "zh": "永远不要只抛出风险而不带上对应的预案。", "sp": null, "gap": true, "start": 70.248, "end": 73.512, "words": [[70.353, 70.59], [70.603, 70.959], [70.972, 71.024], [71.037, 71.458], [71.472, 71.827], [71.84, 71.919], [71.932, 72.287], [72.301, 72.432], [72.445, 72.709], [72.722, 72.919], [72.932, 73.116]]}, {"kind": "s", "id": "s1_1_1", "md": "The plan is what turns a worry into a ==contained== risk.", "zh": "正是预案，把一个担忧变成了一个可控的风险。", "sp": null, "gap": false, "start": 73.512, "end": 77.112, "words": [[73.63, 73.709], [73.723, 74.104], [74.117, 74.236], [74.249, 74.42], [74.433, 74.749], [74.762, 74.841], [74.854, 75.38], [75.433, 75.709], [75.723, 75.775], [75.788, 76.262], [76.275, 76.723]]}, {"kind": "s", "id": "s1_1_2", "md": "Even a simple fallback, like \"we can __switch back to__ the old flow in five minutes,\" changes the mood in the room.", "zh": "哪怕只是一个简单的兜底，比如「我们五分钟内就能切回老流程」，也会让屋里的气氛完全不同。", "sp": null, "gap": false, "start": 77.112, "end": 84.168, "words": [[77.217, 77.428], [77.441, 77.494], [77.507, 77.954], [77.967, 78.586], [78.849, 79.112], [79.323, 79.441], [79.454, 79.586], [79.599, 79.967], [79.98, 80.283], [80.296, 80.388], [80.401, 80.533], [80.546, 80.809], [80.823, 81.204], [81.217, 81.309], [81.323, 81.678], [81.691, 82.151], [82.428, 82.849], [82.862, 82.941], [82.954, 83.27], [83.283, 83.362], [83.375, 83.441], [83.454, 83.783]]}, {"kind": "s", "id": "s1_2_0", "md": "Finally, match your tone to the ==severity==.", "zh": "最后，语气要和严重程度匹配。", "sp": null, "gap": true, "start": 84.168, "end": 87.072, "words": [[84.339, 84.747], [85.142, 85.365], [85.379, 85.497], [85.51, 85.852], [85.865, 85.958], [85.971, 86.063], [86.076, 86.681]]}, {"kind": "s", "id": "s1_2_1", "md": "Don't __play it down__ to look confident, and don't ==dramatize== it to get attention.", "zh": "别为了显得自信就轻描淡写，也别为了引起重视就夸大其词。", "sp": null, "gap": false, "start": 87.072, "end": 91.464, "words": [[87.177, 87.335], [87.348, 87.533], [87.546, 87.651], [87.664, 87.954], [87.967, 88.059], [88.072, 88.256], [88.269, 88.875], [89.19, 89.269], [89.283, 89.546], [89.559, 90.217], [90.23, 90.309], [90.322, 90.401], [90.414, 90.559], [90.572, 91.072]]}, {"kind": "s", "id": "s1_2_2", "md": "If you are honest about size, people will believe you when you finally say, \"This one is serious.\"", "zh": "如果你对风险大小一直很坦诚，等你终于说「这次是真的严重」时，大家就会信你。", "sp": null, "gap": false, "start": 91.464, "end": 97.824, "words": [[91.569, 91.688], [91.701, 91.793], [91.806, 91.977], [91.99, 92.319], [92.332, 92.622], [92.635, 93.201], [93.411, 93.74], [93.753, 93.872], [93.885, 94.267], [94.28, 94.464], [94.556, 94.688], [94.701, 94.806], [94.819, 95.28], [95.293, 95.648], [96.135, 96.332], [96.346, 96.53], [96.543, 96.661], [96.675, 97.425]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
