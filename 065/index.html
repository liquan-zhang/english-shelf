<script>
const D = {"id": "065", "title": "Explaining Risk Without Scaring People", "meta": "B2 · 约 260 词 · 场景：风险汇报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Two Ways to Say the Same Thing", "heading_zh": "1. 同一件事的两种说法", "rows": [[{"id": "s0_0_0", "md": "Imagine two engineers describing the same problem to a director.", "text": "Imagine two engineers describing the same problem to a director.", "zh": "设想两个工程师向总监描述同一个问题。", "sp": null}, {"id": "s0_0_1", "md": "The first says, \"The database could fall over during the sale.\"", "text": "The first says, \"The database could fall over during the sale.\"", "zh": "第一个说：「大促期间数据库可能会挂。」", "sp": null}, {"id": "s0_0_2", "md": "The second says, \"There is a small chance the database hits its limit during the sale; if it does, checkout slows for a few minutes, and we have a switch ready to turn off recommendations.\"", "text": "The second says, \"There is a small chance the database hits its limit during the sale; if it does, checkout slows for a few minutes, and we have a switch ready to turn off recommendations.\"", "zh": "第二个说：「大促期间数据库有小概率打到上限；真打到了，下单会慢几分钟，我们准备好了一个开关，可以把推荐关掉。」", "sp": null}], [{"id": "s0_1_0", "md": "Both are honest, but only one of them lets the director sleep at night.", "text": "Both are honest, but only one of them lets the director sleep at night.", "zh": "两个人说的都是实话，但只有一个能让总监睡个安稳觉。", "sp": null}, {"id": "s0_1_1", "md": "The first sentence is ==alarming== because it has no size and no plan.", "text": "The first sentence is alarming because it has no size and no plan.", "zh": "第一句话吓人，是因为它既没说多大，也没说怎么办。", "sp": null}, {"id": "s0_1_2", "md": "The listener fills the gap with the worst ==outcome== they can picture.", "text": "The listener fills the gap with the worst outcome they can picture.", "zh": "听的人会用自己能想到的最坏结果去填这个空白。", "sp": null}], [{"id": "s0_2_0", "md": "**Unmeasured risk sounds bigger than it is, and that makes people overreact.**", "text": "Unmeasured risk sounds bigger than it is, and that makes people overreact.", "zh": "没量化过的风险听起来总比实际更大，这会让人反应过度。", "sp": null}, {"id": "s0_2_1", "md": "They add approval steps, delay launches, or start to ==micromanage== the team.", "text": "They add approval steps, delay launches, or start to micromanage the team.", "zh": "他们会加审批环节、推迟上线，或者开始事无巨细地管团队。", "sp": null}, {"id": "s0_2_2", "md": "Your job is to give them a risk they can __put in perspective__.", "text": "Your job is to give them a risk they can put in perspective.", "zh": "你的任务是给他们一个能放在合理位置上看待的风险。", "sp": null}]]}, {"heading": "2. Likelihood, Impact, Plan", "heading_zh": "2. 可能性、影响、预案", "rows": [[{"id": "s1_0_0", "md": "A calm risk statement has three parts.", "text": "A calm risk statement has three parts.", "zh": "一个冷静的风险陈述有三个部分。", "sp": null}, {"id": "s1_0_1", "md": "Likelihood: how probable is it, in rough terms like \"unlikely\" or \"about one in ten\"?", "text": "Likelihood: how probable is it, in rough terms like \"unlikely\" or \"about one in ten\"?", "zh": "可能性：大概有多大概率，用「不太可能」或者「十分之一左右」这种粗略的说法就行。", "sp": null}, {"id": "s1_0_2", "md": "Impact: who is affected, for how long, and how badly?", "text": "Impact: who is affected, for how long, and how badly?", "zh": "影响：影响到谁，持续多久，严重到什么程度？", "sp": null}, {"id": "s1_0_3", "md": "Plan: what will you do to prevent it, and what will you do if it happens anyway?", "text": "Plan: what will you do to prevent it, and what will you do if it happens anyway?", "zh": "预案：你会怎么预防，万一还是发生了又会怎么处理？", "sp": null}], [{"id": "s1_1_0", "md": "**Never present a risk without the plan that goes with it.**", "text": "Never present a risk without the plan that goes with it.", "zh": "永远不要只抛出风险而不带上对应的预案。", "sp": null}, {"id": "s1_1_1", "md": "The plan is what turns a worry into a ==contained== risk.", "text": "The plan is what turns a worry into a contained risk.", "zh": "正是预案，把一个担忧变成了一个可控的风险。", "sp": null}, {"id": "s1_1_2", "md": "Even a simple fallback, like \"we can __switch back to__ the old flow in five minutes,\" changes the mood in the room.", "text": "Even a simple fallback, like \"we can switch back to the old flow in five minutes,\" changes the mood in the room.", "zh": "哪怕只是一个简单的兜底，比如「我们五分钟内就能切回老流程」，也会让屋里的气氛完全不同。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, match your tone to the ==severity==.", "text": "Finally, match your tone to the severity.", "zh": "最后，语气要和严重程度匹配。", "sp": null}, {"id": "s1_2_1", "md": "Don't __play it down__ to look confident, and don't ==dramatize== it to get attention.", "text": "Don't play it down to look confident, and don't dramatize it to get attention.", "zh": "别为了显得自信就轻描淡写，也别为了引起重视就夸大其词。", "sp": null}, {"id": "s1_2_2", "md": "If you are honest about size, people will believe you when you finally say, \"This one is serious.\"", "text": "If you are honest about size, people will believe you when you finally say, \"This one is serious.\"", "zh": "如果你对风险大小一直很坦诚，等你终于说「这次是真的严重」时，大家就会信你。", "sp": null}]]}], "gist": [{"q": "文中两种说法的关键区别是什么？", "a": "第一种只说“可能挂”，没有大小和预案，很吓人；第二种说清概率小、影响几分钟、并有开关预案。"}, {"q": "没有量化的风险会导致什么后果？", "a": "听的人会往最坏处想而过度反应：加审批、推迟上线、开始微观管理团队。"}, {"q": "一个冷静的风险陈述包括哪三部分？语气上要注意什么？", "a": "可能性、影响、预案；语气要和严重程度匹配，既不淡化也不夸大，这样真正严重时别人才会信你。"}], "dictation": [{"id": "s0_2_0", "text": "Unmeasured risk sounds bigger than it is, and that makes people overreact."}, {"id": "s1_1_0", "text": "Never present a risk without the plan that goes with it."}, {"id": "s1_1_1", "text": "The plan is what turns a worry into a contained risk."}, {"id": "s1_2_1", "text": "Don't play it down to look confident, and don't dramatize it to get attention."}], "shadow": {"text": "Never present a risk without the plan that goes with it. The plan is what turns a worry into a contained risk.", "marked": "<b>Never</b> present a risk / without the <b>plan</b> / that goes with it. //<br>The plan is what turns a <b>worry</b> / into a <b>contained</b> risk. //"}, "prompts": [{"q": "大促前，总监问你“新缓存方案有没有风险？”。用 30 秒按“可能性、影响、预案”回答，不要吓到他。", "ref": "There is one risk worth knowing const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress

function step(id, name, time, how, body) {

  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
