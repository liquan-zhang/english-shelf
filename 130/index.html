const D = {"id": "130", "type": "dialogue", "title": "Getting the Deposit Back", "meta": "B2 · 约 280 词 · 场景：退租验房与谈押金扣款", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Landlord", "name_zh": "房东", "voice": "en-AU-WilliamMultilingualNeural"}}, "gist": [{"q": "验房时房东发现了哪些问题？「你」怎么回应？", "a": "墙上有印子，「你」说用湿布能擦掉；台面有划痕，「你」说入住时就有，有照片为证；丢了一把信箱钥匙，同意扣三十块。"}, {"q": "房东后来想扣多少？理由是什么？", "a": "想扣八百，用于整套房子重新刷漆加信箱钥匙。"}, {"q": "双方最后怎么谈妥的？", "a": "只出儿子那一间房的刷漆费两百加钥匙三十，共两百三；房东出书面明细，剩余押金七天内转回原账户。"}], "dictation": [{"id": "s0_5_0", "text": "That was already there when we moved in. I have the photos to prove it."}, {"id": "s0_9_0", "text": "That's fair. When can we expect the deposit back?"}, {"id": "s1_5_0", "text": "I'm happy to pay for repainting that one room, but not the whole flat."}, {"id": "s1_9_0", "text": "Thanks. Could you send me a written breakdown, and transfer the rest to the same account?"}], "shadow": {"speaker": "A", "text": "I understand the key. But we lived there for three years, and some marks are just normal wear and tear.", "marked": "I understand the <b>key</b>. //<br>But we lived there / for <b>three years</b>, / and some marks are just <b>normal wear and tear</b>. //"}, "prompts": [{"q": "退租已经一个月了，押金还没退。给房东打电话礼貌地催，提到租约里的期限。", "ref": "Hi Mr. Brown, it's Zhang. Sorry to bother you, but it's been a month since we handed back the keys, and I haven't received the deposit yet. The tenancy agreement says it should be returned within fourteen days. Could you let me know when you'll be able to transfer it? If there's an issue, I'm happy to talk it through.", "ref_zh": "布朗先生您好，我是小张。不好意思打扰您，我们交钥匙已经一个月了，押金还没收到。租约上写的是十四天内退还。能告诉我大概什么时候能转吗？如果有什么问题，我很乐意一起谈。", "id": "ref0"}, {"q": "退房前你想先跟房东约验房，并问清楚需要做到什么标准，免得之后被扣钱。", "ref": "Hi, our lease ends on the thirtieth, and I'd like to arrange the handover inspection. Would the twenty-ninth in the afternoon work for you? Also, just so we're on the same page, is there anything you'd like us to do before then? For example, do we need a professional cleaning and air con servicing, or is a normal clean enough?", "ref_zh": "你好，我们的租约三十号到期，我想约个时间验房交接。二十九号下午您方便吗？另外，为了达成一致，在那之前您希望我们做些什么？比如需要请专业保洁、做空调保养吗，还是普通打扫就够了？", "id": "ref1"}], "words": [{"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "收据", "ex": "Keep the receipt in case you need to return it.", "id": "w0"}, {"w": "scratch", "ipa": "/skrætʃ/", "zh": "划痕", "ex": "There's a small scratch on my phone screen.", "id": "w1"}, {"w": "access card", "ipa": "/ˈækses kɑːrd/", "zh": "门禁卡", "ex": "I left my access card at home and couldn't get into the lift.", "id": "w2"}, {"w": "deduct", "ipa": "/dɪˈdʌkt/", "zh": "扣除", "ex": "They deducted the cleaning fee from our deposit.", "id": "w3"}, {"w": "normal wear and tear", "ipa": "/ˈnɔːrməl ˌwer ən ˈter/", "zh": "正常损耗", "ex": "Faded curtains count as normal wear and tear.", "id": "w4"}, {"w": "refund (v.)", "ipa": "/rɪˈfʌnd/", "zh": "退款", "ex": "The airline refunded the ticket within a week.", "tts_w": "refund", "id": "w5"}, {"w": "transfer", "ipa": "/trænsˈfɜːr/", "zh": "转账", "ex": "I'll transfer the money to you after lunch.", "id": "w6"}, {"w": "tenancy agreement", "ipa": "/ˈtenənsi əˌɡriːmənt/", "zh": "租赁合同", "ex": "The tenancy agreement says pets are not allowed.", "id": "w7"}, {"w": "wipe off", "ipa": "/waɪp ɔːf/", "zh": "擦掉", "ex": "Wipe off the crayon before it dries.", "id": "w8"}], "sections": [{"heading": "1. The Handover Inspection", "heading_zh": "1. 退房验房", "rows": [[{"id": "s0_0_0", "md": "Right, let's go through the flat. The living room looks pretty good.", "text": "Right, let's go through the flat. The living room looks pretty good.", "zh": "好，我们把房子过一遍。客厅看着挺好的。", "sp": "B"}], [{"id": "s0_1_0", "md": "Thanks. We had it professionally cleaned yesterday, and here's the ==receipt== for the air con servicing.", "text": "Thanks. We had it professionally cleaned yesterday, and here's the receipt for the air con servicing.", "zh": "谢谢。我们昨天请了专业保洁，这是空调保养的收据。", "sp": "A"}], [{"id": "s0_2_0", "md": "Great. Hang on, what are these marks on the wall here?", "text": "Great. Hang on, what are these marks on the wall here?", "zh": "很好。等一下，墙上这些印子是什么？", "sp": "B"}], [{"id": "s0_3_0", "md": "That's where our son's bed was. They should __wipe off__ with a damp cloth.", "text": "That's where our son's bed was. They should wipe off with a damp cloth.", "zh": "那是我儿子床靠墙的地方。用湿布应该能擦掉。", "sp": "A"}], [{"id": "s0_4_0", "md": "Maybe. And there's a ==scratch== on the kitchen countertop.", "text": "Maybe. And there's a scratch on the kitchen countertop.", "zh": "也许吧。厨房台面上还有一道划痕。", "sp": "B"}], [{"id": "s0_5_0", "md": "**That was already there when we moved in. I have the photos to prove it.**", "text": "That was already there when we moved in. I have the photos to prove it.", "zh": "那个是我们搬进来时就有的。我有照片可以证明。", "sp": "A"}], [{"id": "s0_6_0", "md": "Fair enough. Have you got all the keys and ==access cards==?", "text": "Fair enough. Have you got all the keys and access cards?", "zh": "好吧。钥匙和门禁卡都在吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Here are two sets of keys and three access cards. One of the mailbox keys is missing, unfortunately.", "text": "Here are two sets of keys and three access cards. One of the mailbox keys is missing, unfortunately.", "zh": "这是两套钥匙和三张门禁卡。不过有一把信箱钥匙丢了。", "sp": "A"}], [{"id": "s0_8_0", "md": "No worries. A replacement is about thirty dollars, so we'll ==deduct== that.", "text": "No worries. A replacement is about thirty dollars, so we'll deduct that.", "zh": "没关系。配一把大概三十块，从押金里扣。", "sp": "B"}], [{"id": "s0_9_0", "md": "**That's fair. When can we expect the deposit back?**", "text": "That's fair. When can we expect the deposit back?", "zh": "合理。押金什么时候能退给我们？", "sp": "A"}]]}, {"heading": "2. Disputing the Deductions", "heading_zh": "2. 对扣款有异议", "rows": [[{"id": "s1_0_0", "md": "Hi, I've had a look at the costs. I'm planning to keep eight hundred dollars from your deposit.", "text": "Hi, I've had a look at the costs. I'm planning to keep eight hundred dollars from your deposit.", "zh": "你好，我算了一下费用。打算从押金里扣八百块。", "sp": "B"}], [{"id": "s1_1_0", "md": "Eight hundred? That seems like a lot. __What exactly is that for__?", "text": "Eight hundred? That seems like a lot. What exactly is that for?", "zh": "八百？这有点多了。具体是什么费用？", "sp": "A"}], [{"id": "s1_2_0", "md": "Repainting the whole flat, plus the mailbox key.", "text": "Repainting the whole flat, plus the mailbox key.", "zh": "整套房子重新刷漆，加上信箱钥匙。", "sp": "B"}], [{"id": "s1_3_0", "md": "I understand the key. But we lived there for three years, and some marks are just ==normal wear and tear==.", "text": "I understand the key. But we lived there for three years, and some marks are just normal wear and tear.", "zh": "钥匙我理解。但我们住了三年，有些印子只是正常损耗。", "sp": "A"}], [{"id": "s1_4_0", "md": "Maybe, but the walls in your son's room are pretty bad.", "text": "Maybe, but the walls in your son's room are pretty bad.", "zh": "也许吧，但你儿子房间的墙挺糟糕的。", "sp": "B"}], [{"id": "s1_5_0", "md": "**I'm happy to pay for repainting that one room, but not the whole flat.**", "text": "I'm happy to pay for repainting that one room, but not the whole flat.", "zh": "那一间房重新刷漆我愿意出，但整套不行。", "sp": "A"}], [{"id": "s1_6_0", "md": "Okay. What figure did you have in mind?", "text": "Okay. What figure did you have in mind?", "zh": "好吧。你觉得多少合适？", "sp": "B"}], [{"id": "s1_7_0", "md": "A painter quoted me two hundred for one room. So two hundred plus thirty for the key, __as long as__ the rest is ==refunded== this week.", "text": "A painter quoted me two hundred for one room. So two hundred plus thirty for the key, as long as the rest is refunded this week.", "zh": "有个油漆师傅给我报价一间房两百。所以两百加钥匙三十，前提是剩下的这周退回来。", "sp": "A"}], [{"id": "s1_8_0", "md": "Alright, that's reasonable. Two hundred and thirty it is.", "text": "Alright, that's reasonable. Two hundred and thirty it is.", "zh": "好吧，挺合理的。就扣两百三。", "sp": "B"}], [{"id": "s1_9_0", "md": "Thanks. Could you send me a writ const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
