const D = {"id": "130", "type": "dialogue", "title": "Getting the Deposit Back", "meta": "B2 · 约 280 词 · 场景：退租验房与谈押金扣款", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Landlord", "name_zh": "房东", "voice": "en-AU-WilliamMultilingualNeural"}}, "gist": [{"q": "验房时房东发现了哪些问题？「你」怎么回应？", "a": "墙上有印子，「你」说用湿布能擦掉；台面有划痕，「你」说入住时就有，有照片为证；丢了一把信箱钥匙，同意扣三十块。"}, {"q": "房东后来想扣多少？理由是什么？", "a": "想扣八百，用于整套房子重新刷漆加信箱钥匙。"}, {"q": "双方最后怎么谈妥的？", "a": "只出儿子那一间房的刷漆费两百加钥匙三十，共两百三；房东出书面明细，剩余押金七天内转回原账户。"}], "dictation": [{"id": "s0_5_0", "text": "That was already there when we moved in. I have the photos to prove it."}, {"id": "s0_9_0", "text": "That's fair. When can we expect the deposit back?"}, {"id": "s1_5_0", "text": "I'm happy to pay for repainting that one room, but not the whole flat."}, {"id": "s1_9_0", "text": "Thanks. Could you send me a written breakdown, and transfer the rest to the same account?"}], "shadow": {"speaker": "A", "text": "I understand the key. But we lived there for three years, and some marks are just normal wear and tear.", "marked": "I understand the <b>key</b>. //<br>But we lived there / for <b>three years</b>, / and some marks are just <b>normal wear and tear</b>. //"}, "prompts": [{"q": "退租已经一个月了，押金还没退。给房东打电话礼貌地催，提到租约里的期限。", "ref": "Hi Mr. Brown, it's Zhang. Sorry to bother you, but it's been a month since we handed back the keys, and I haven't received the deposit yet. The tenancy agreement says it should be returned within fourteen days. Could you let me know when you'll be able to transfer it? If there's an issue, I'm happy to talk it through.", "ref_zh": "布朗先生您好，我是小张。不好意思打扰您，我们交钥匙已经一个月了，押金还没收到。租约上写的是十四天内退还。能告诉我大概什么时候能转吗？如果有什么问题，我很乐意一起谈。", "id": "ref0"}, {"q": "退房前你想先跟房东约验房，并问清楚需要做到什么标准，免得之后被扣钱。", "ref": "Hi, our lease ends on the thirtieth, and I'd like to arrange the handover inspection. Would the twenty-ninth in the afternoon work for you? Also, just so we're on the same page, is there anything you'd like us to do before then? For example, do we need a professional cleaning and air con servicing, or is a normal clean enough?", "ref_zh": "你好，我们的租约三十号到期，我想约个时间验房交接。二十九号下午您方便吗？另外，为了达成一致，在那之前您希望我们做些什么？比如需要请专业保洁、做空调保养吗，还是普通打扫就够了？", "id": "ref1"}], "words": [{"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "收据", "ex": "Keep the receipt in case you need to return it.", "id": "w0"}, {"w": "scratch", "ipa": "/skrætʃ/", "zh": "划痕", "ex": "There's a small scratch on my phone screen.", "id": "w1"}, {"w": "access card", "ipa": "/ˈækses kɑːrd/", "zh": "门禁卡", "ex": "I left my access card at home and couldn't get into the lift.", "id": "w2"}, {"w": "deduct", "ipa": "/dɪˈdʌkt/", "zh": "扣除", "ex": "They deducted the cleaning fee from our deposit.", "id": "w3"}, {"w": "normal wear and tear", "ipa": "/ˈnɔːrməl ˌwer ən ˈter/", "zh": "正常损耗", "ex": "Faded curtains count as normal wear and tear.", "id": "w4"}, {"w": "refund (v.)", "ipa": "/rɪˈfʌnd/", "zh": "退款", "ex": "The airline refunded the ticket within a week.", "tts_w": "refund", "id": "w5"}, {"w": "transfer", "ipa": "/trænsˈfɜːr/", "zh": "转账", "ex": "I'll transfer the money to you after lunch.", "id": "w6"}, {"w": "tenancy agreement", "ipa": "/ˈtenənsi əˌɡriːmənt/", "zh": "租赁合同", "ex": "The tenancy agreement says pets are not allowed.", "id": "w7"}, {"w": "wipe off", "ipa": "/waɪp ɔːf/", "zh": "擦掉", "ex": "Wipe off the crayon before it dries.", "id": "w8"}], "sections": [{"heading": "1. The Handover Inspection", "heading_zh": "1. 退房验房", "rows": [[{"id": "s0_0_0", "md": "Right, let's go through the flat. The living room looks pretty good.", "text": "Right, let's go through the flat. The living room looks pretty good.", "zh": "好，我们把房子过一遍。客厅看着挺好的。", "sp": "B"}], [{"id": "s0_1_0", "md": "Thanks. We had it professionally cleaned yesterday, and here's the ==receipt== for the air con servicing.", "text": "Thanks. We had it professionally cleaned yesterday, and here's the receipt for the air con servicing.", "zh": "谢谢。我们昨天请了专业保洁，这是空调保养的收据。", "sp": "A"}], [{"id": "s0_2_0", "md": "Great. Hang on, what are these marks on the wall here?", "text": "Great. Hang on, what are these marks on the wall here?", "zh": "很好。等一下，墙上这些印子是什么？", "sp": "B"}], [{"id": "s0_3_0", "md": "That's where our son's bed was. They should __wipe off__ with a damp cloth.", "text": "That's where our son's bed was. They should wipe off with a damp cloth.", "zh": "那是我儿子床靠墙的地方。用湿布应该能擦掉。", "sp": "A"}], [{"id": "s0_4_0", "md": "Maybe. And there's a ==scratch== on the kitchen countertop.", "text": "Maybe. And there's a scratch on the kitchen countertop.", "zh": "也许吧。厨房台面上还有一道划痕。", "sp": "B"}], [{"id": "s0_5_0", "md": "**That was already there when we moved in. I have the photos to prove it.**", "text": "That was already there when we moved in. I have the photos to prove it.", "zh": "那个是我们搬进来时就有的。我有照片可以证明。", "sp": "A"}], [{"id": "s0_6_0", "md": "Fair enough. Have you got all the keys and ==access cards==?", "text": "Fair enough. Have you got all the keys and access cards?", "zh": "好吧。钥匙和门禁卡都在吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Here are two sets of keys and three access cards. One of the mailbox keys is missing, unfortunately.", "text": "Here are two sets of keys and three access cards. One of the mailbox keys is missing, unfortunately.", "zh": "这是两套钥匙和三张门禁卡。不过有一把信箱钥匙丢了。", "sp": "A"}], [{"id": "s0_8_0", "md": "No worries. A replacement is about thirty dollars, so we'll ==deduct== that.", "text": "No worries. A replacement is about thirty dollars, so we'll deduct that.", "zh": "没关系。配一把大概三十块，从押金里扣。", "sp": "B"}], [{"id": "s0_9_0", "md": "**That's fair. When can we expect the deposit back?**", "text": "That's fair. When can we expect the deposit back?", "zh": "合理。押金什么时候能退给我们？", "sp": "A"}]]}, {"heading": "2. Disputing the Deductions", "heading_zh": "2. 对扣款有异议", "rows": [[{"id": "s1_0_0", "md": "Hi, I've had a look at the costs. I'm planning to keep eight hundred dollars from your deposit.", "text": "Hi, I've had a look at the costs. I'm planning to keep eight hundred dollars from your deposit.", "zh": "你好，我算了一下费用。打算从押金里扣八百块。", "sp": "B"}], [{"id": "s1_1_0", "md": "Eight hundred? That seems like a lot. __What exactly is that for__?", "text": "Eight hundred? That seems like a lot. What exactly is that for?", "zh": "八百？这有点多了。具体是什么费用？", "sp": "A"}], [{"id": "s1_2_0", "md": "Repainting the whole flat, plus the mailbox key.", "text": "Repainting the whole flat, plus the mailbox key.", "zh": "整套房子重新刷漆，加上信箱钥匙。", "sp": "B"}], [{"id": "s1_3_0", "md": "I understand the key. But we lived there for three years, and some marks are just ==normal wear and tear==.", "text": "I understand the key. But we lived there for three years, and some marks are just normal wear and tear.", "zh": "钥匙我理解。但我们住了三年，有些印子只是正常损耗。", "sp": "A"}], [{"id": "s1_4_0", "md": "Maybe, but the walls in your son's room are pretty bad.", "text": "Maybe, but the walls in your son's room are pretty bad.", "zh": "也许吧，但你儿子房间的墙挺糟糕的。", "sp": "B"}], [{"id": "s1_5_0", "md": "**I'm happy to pay for repainting that one room, but not the whole flat.**", "text": "I'm happy to pay for repainting that one room, but not the whole flat.", "zh": "那一间房重新刷漆我愿意出，但整套不行。", "sp": "A"}], [{"id": "s1_6_0", "md": "Okay. What figure did you have in mind?", "text": "Okay. What figure did you have in mind?", "zh": "好吧。你觉得多少合适？", "sp": "B"}], [{"id": "s1_7_0", "md": "A painter quoted me two hundred for one room. So two hundred plus thirty for the key, __as long as__ the rest is ==refunded== this week.", "text": "A painter quoted me two hundred for one room. So two hundred plus thirty for the key, as long as the rest is refunded this week.", "zh": "有个油漆师傅给我报价一间房两百。所以两百加钥匙三十，前提是剩下的这周退回来。", "sp": "A"}], [{"id": "s1_8_0", "md": "Alright, that's reasonable. Two hundred and thirty it is.", "text": "Alright, that's reasonable. Two hundred and thirty it is.", "zh": "好吧，挺合理的。就扣两百三。", "sp": "B"}], [{"id": "s1_9_0", "md": "Thanks. Could you send me a writ const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
