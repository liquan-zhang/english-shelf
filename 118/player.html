f every fee that was taken. If it was a mistake on the bank's side, I'd like the difference refunded.", "ref_zh": "你好，我上周给父母汇了一笔钱，选了所有费用由我承担。但他们收到的钱比预期少了大约两百人民币。能告诉我原因吗？我想要一份每项扣费的明细。如果是银行这边的错，希望把差额退还。", "id": "ref1"}], "words": [{"w": "telegraphic transfer", "ipa": "/ˌtelɪˈɡræfɪk ˈtrænsfɜːr/", "zh": "电汇", "ex": "The rent was paid by telegraphic transfer from overseas.", "id": "w0"}, {"w": "exchange rate", "ipa": "/ɪksˈtʃeɪndʒ reɪt/", "zh": "汇率", "ex": "The exchange rate is better at the money changer in the mall.", "id": "w1"}, {"w": "charges", "ipa": "/ˈtʃɑːrdʒɪz/", "zh": "费用", "ex": "Are there any hidden charges I should know about?", "id": "w2"}, {"w": "intermediary", "ipa": "/ˌɪntərˈmiːdieri/", "zh": "中间方，中转行", "ex": "The intermediary bank took a small fee.", "id": "w3"}, {"w": "reference", "ipa": "/ˈrefərəns/", "zh": "参考编号", "ex": "Please quote your booking reference when you call.", "id": "w4"}, {"w": "match", "ipa": "/mætʃ/", "zh": "相符，一致", "ex": "The name on the ticket must match your passport.", "id": "w5"}, {"w": "amendment", "ipa": "/əˈmendmənt/", "zh": "修改，更正", "ex": "I made a small amendment to the contract.", "id": "w6"}, {"w": "on hold", "ipa": "/ɑːn hoʊld/", "zh": "暂缓，暂扣", "ex": "Our plan to move is on hold for now.", "id": "w7"}, {"w": "take a cut", "ipa": "/teɪk ə kʌt/", "zh": "抽成，扣一部分", "ex": "The delivery app takes a cut from every order.", "id": "w8"}], "sections": [{"heading": "1. At the Counter", "heading_zh": "1. 在柜台办汇款", "rows": [[{"id": "s0_0_0", "md": "**Hi, I'd like to send some money to my parents in China. What's the best way to do it?**", "text": "Hi, I'd like to send some money to my parents in China. What's the best way to do it?", "zh": "你好，我想给在中国的父母汇点钱。怎么汇最好？", "sp": "A"}], [{"id": "s0_1_0", "md": "We can do a ==telegraphic transfer== straight to their bank account. How much are you thinking of sending?", "text": "We can do a telegraphic transfer straight to their bank account. How much are you thinking of sending?", "zh": "我们可以电汇直接到他们的银行账户。您打算汇多少？", "sp": "B"}], [{"id": "s0_2_0", "md": "About five thousand Singapore dollars. What's today's ==exchange rate==?", "text": "About five thousand Singapore dollars. What's today's exchange rate?", "zh": "大约五千新币。今天的汇率是多少？", "sp": "A"}], [{"id": "s0_3_0", "md": "It's five point two eight yuan to the dollar right now, but it __moves throughout__ the day.", "text": "It's five point two eight yuan to the dollar right now, but it moves throughout the day.", "zh": "现在是一新币兑五点二八人民币，不过一天之中会变动。", "sp": "B"}], [{"id": "s0_4_0", "md": "And what are the ==charges==? Is there a fee on both sides?", "text": "And what are the charges? Is there a fee on both sides?", "zh": "手续费呢？两边都要收费吗？", "sp": "A"}], [{"id": "s0_5_0", "md": "Our fee is twenty dollars. Their bank, or an ==intermediary== bank, may also __take a cut__.", "text": "Our fee is twenty dollars. Their bank, or an intermediary bank, may also take a cut.", "zh": "我们收二十元。对方银行或者中转行也可能扣一部分。", "sp": "B"}], [{"id": "s0_6_0", "md": "Is there a way to make sure my parents receive the full amount?", "text": "Is there a way to make sure my parents receive the full amount?", "zh": "有没有办法确保我父母收到全额？", "sp": "A"}], [{"id": "s0_7_0", "md": "You can choose to pay all charges yourself. That's an extra fifteen dollars.", "text": "You can choose to pay all charges yourself. That's an extra fifteen dollars.", "zh": "您可以选择所有费用由您承担，要多付十五元。", "sp": "B"}], [{"id": "s0_8_0", "md": "Let's do that. __How long__ will it take to arrive?", "text": "Let's do that. How long will it take to arrive?", "zh": "那就这样。多久能到账？", "sp": "A"}], [{"id": "s0_9_0", "md": "Normally one to three working days.", "text": "Normally one to three working days.", "zh": "一般一到三个工作日。", "sp": "B"}]]}, {"heading": "2. The Money Hasn't Arrived", "heading_zh": "2. 钱没到账", "rows": [[{"id": "s1_0_0", "md": "Hi, I sent a transfer to China last Monday, and it still hasn't arrived. Could you help me find out what's going on?", "text": "Hi, I sent a transfer to China last Monday, and it still hasn't arrived. Could you help me find out what's going on?", "zh": "你好，我上周一往中国汇了一笔钱，到现在还没到账。能帮我查查是怎么回事吗？", "sp": "A"}], [{"id": "s1_1_0", "md": "Certainly. Do you have the transaction ==reference==?", "text": "Certainly. Do you have the transaction reference?", "zh": "当然。您有交易参考号吗？", "sp": "B"}], [{"id": "s1_2_0", "md": "Yes, it's T T, nine four seven, two eight one.", "text": "Yes, it's T T, nine four seven, two eight one.", "zh": "有，是 TT 九四七二八一。", "sp": "A"}], [{"id": "s1_3_0", "md": "Thank you. It looks like the receiving bank has put it __on hold__. The name doesn't quite ==match== their records.", "text": "Thank you. It looks like the receiving bank has put it on hold. The name doesn't quite match their records.", "zh": "谢谢。看起来收款行把这笔钱暂扣了，收款人名字和他们的记录对不上。", "sp": "B"}], [{"id": "s1_4_0", "md": "Oh, I might have spelled my father's name with a space in the middle. What do I need to do?", "text": "Oh, I might have spelled my father's name with a space in the middle. What do I need to do?", "zh": "哦，我可能把我父亲名字中间多打了一个空格。我需要做什么？", "sp": "A"}], [{"id": "s1_5_0", "md": "Please fill in an ==amendment== form with the name exactly as it appears on his account.", "text": "Please fill in an amendment form with the name exactly as it appears on his account.", "zh": "请填一份修改申请表，名字要和他账户上的完全一致。", "sp": "B"}], [{"id": "s1_6_0", "md": "**Will there be another fee for that, and how long will it take after the correction?**", "text": "Will there be another fee for that, and how long will it take after the correction?", "zh": "改这个还要再收费吗？改完之后要多久？", "sp": "A"}], [{"id": "s1_7_0", "md": "There's a ten dollar fee, I'm afraid, and it should __go through__ within two working days.", "text": "There's a ten dollar fee, I'm afraid, and it should go through within two working days.", "zh": "恐怕要收十元，一般两个工作日内就能到账。", "sp": "B"}], [{"id": "s1_8_0", "md": "Alright, I'll fill it in now. Lesson learned. Thanks for your help.", "text": "Alright, I'll fill it in now. Lesson learned. Thank const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
