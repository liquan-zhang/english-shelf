<script>
const D = {"id": "096", "title": "Leading a Video Call with Bad Connections", "meta": "B2 · 约 280 词 · 场景：网络不好时主持视频会", "voice": "en-GB-SoniaNeural", "rate": "-5%", "sections": [{"heading": "1. The Call That Falls Apart", "heading_zh": "1. 一团糟的会议", "rows": [[{"id": "s0_0_0", "md": "You know the call.", "text": "You know the call.", "zh": "这种会你肯定遇到过。", "sp": null}, {"id": "s0_0_1", "md": "Someone's voice freezes in the middle of a sentence, two people start talking at once after a delay, and a third has been on mute for five minutes without realizing it.", "text": "Someone's voice freezes in the middle of a sentence, two people start talking at once after a delay, and a third has been on mute for five minutes without realizing it.", "zh": "有人话说到一半声音卡住了，因为有延迟两个人同时开口，还有一个人静音了五分钟自己都没发现。", "sp": null}, {"id": "s0_0_2", "md": "By the end, nobody is sure what was decided.", "text": "By the end, nobody is sure what was decided.", "zh": "到最后，谁也说不清到底定了什么。", "sp": null}], [{"id": "s0_1_0", "md": "With teammates in Manila, Chennai and rural Australia, weak connections are not rare ==exceptions==.", "text": "With teammates in Manila, Chennai and rural Australia, weak connections are not rare exceptions.", "zh": "队友在马尼拉、金奈和澳洲乡下，网络差根本不是什么稀罕事。", "sp": null}, {"id": "s0_1_1", "md": "They are part of the job, and whoever leads the call has to plan for them.", "text": "They are part of the job, and whoever leads the call has to plan for them.", "zh": "这就是工作的一部分，主持会议的人得提前为此做准备。", "sp": null}, {"id": "s0_1_2", "md": "**On a bad connection, structure is more important than charm.**", "text": "On a bad connection, structure is more important than charm.", "zh": "网络不好的时候，结构比个人魅力更重要。", "sp": null}], [{"id": "s0_2_0", "md": "The goal is a call that still works even if some people only hear half of it.", "text": "The goal is a call that still works even if some people only hear half of it.", "zh": "目标是开一个哪怕有人只听到一半也还能运转的会。", "sp": null}, {"id": "s0_2_1", "md": "That means less ==improvising== and more ==explicit== signals about who speaks, when, and what was agreed.", "text": "That means less improvising and more explicit signals about who speaks, when, and what was agreed.", "zh": "这意味着少一些临场发挥，多一些明确的信号：谁说、什么时候说、定了什么。", "sp": null}, {"id": "s0_2_2", "md": "Think of yourself less as a chairperson and more as a radio host.", "text": "Think of yourself less as a chairperson and more as a radio host.", "zh": "别把自己当会议主席，更像一个电台主持人。", "sp": null}]]}, {"heading": "2. Run It Like a Radio Show", "heading_zh": "2. 像主持电台节目一样开会", "rows": [[{"id": "s1_0_0", "md": "Start by posting the agenda and the key question in the chat, so people who __drop out__ can still follow.", "text": "Start by posting the agenda and the key question in the chat, so people who drop out can still follow.", "zh": "一开始就把议程和核心问题发到聊天框里，这样掉线的人也还能跟上。", "sp": null}, {"id": "s1_0_1", "md": "If the audio is ==choppy==, ask everyone except the speaker to turn off their video to __free up bandwidth__.", "text": "If the audio is choppy, ask everyone except the speaker to turn off their video to free up bandwidth.", "zh": "如果声音断断续续，请除了发言人以外的所有人关掉视频，腾出带宽。", "sp": null}, {"id": "s1_0_2", "md": "Keep your own camera on, so people can still see who is leading.", "text": "Keep your own camera on, so people can still see who is leading.", "zh": "你自己的摄像头保持开着，让大家还能看到是谁在主持。", "sp": null}], [{"id": "s1_1_0", "md": "__Call on people by name__ instead of asking, \"Any thoughts?\"", "text": "Call on people by name instead of asking, \"Any thoughts?\"", "zh": "点名叫人发言，而不是问「大家有什么想法？」", "sp": null}, {"id": "s1_1_1", "md": "\"Ahmed, you first, then Claire.\"", "text": "\"Ahmed, you first, then Claire.\"", "zh": "「Ahmed 你先说，然后 Claire。」", "sp": null}, {"id": "s1_1_2", "md": "With a delay, open questions create long silences followed by three people talking at once.", "text": "With a delay, open questions create long silences followed by three people talking at once.", "zh": "有延迟的时候，开放式提问会先冷场很久，然后三个人同时开口。", "sp": null}], [{"id": "s1_2_0", "md": "Use the chat as a ==backup== channel.", "text": "Use the chat as a backup channel.", "zh": "把聊天框当作备用通道。", "sp": null}, {"id": "s1_2_1", "md": "If someone freezes, say, \"We lost you, Ahmed, could you type your main point in the chat?\"", "text": "If someone freezes, say, \"We lost you, Ahmed, could you type your main point in the chat?\"", "zh": "如果有人卡住了，就说：「Ahmed 我们听不到你了，能把你的要点打在聊天框里吗？」", "sp": null}, {"id": "s1_2_2", "md": "This keeps the meeting moving without making anyone feel ==singled out==.", "text": "This keeps the meeting moving without making anyone feel singled out.", "zh": "这样会议能继续往前走，也不会让谁觉得被单拎出来。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, close by reading the decisions aloud and posting them in writing straight away.", "text": "Finally, close by reading the decisions aloud and posting them in writing straight away.", "zh": "最后，收尾时把决定大声念一遍，并马上用文字发出来。", "sp": null}, {"id": "s1_3_1", "md": "**On a bad line, if it isn't written down, it wasn't decided.**", "text": "On a bad line, if it isn't written down, it wasn't decided.", "zh": "网络不好的时候，没写下来的，就等于没定。", "sp": null}, {"id": "s1_3_2", "md": "That way, nobody can remember it differently next week.", "text": "That way, nobody can remember it differently next week.", "zh": "这样下周就没人会记成别的样子。", "sp": null}]]}], "gist": [{"q": "作者说网络差的会议里什么比个人魅力更重要？", "a": "结构；会议要设计成即使有人只听到一半也能运转。"}, {"q": "为什么要点名发言而不是问 \"Any thoughts?\"", "a": "有延迟时，开放式提问会先冷场，然后三个人同时开口；点名能排好发言顺序。"}, {"q": "文中主持网络差会议的具体做法有哪些？", "a": "提前把议程和关键问题发到聊天框；音频卡顿时让非发言者关视频；按名字点人；用聊天框作备用通道；结束时口头念出决定并立刻书面发出。"}], "dictation": [{"id": "s0_1_2", "text": "On a bad connection, structure is more important than charm."}, {"id": "s0_2_0", "text": "The goal is a call that still works even if some people only hear half of it."}, {"id": "s1_2_0", "text": "Use the chat as a backup channel."}, {"id": "s1_3_1", "text": "On a bad line, if it isn't written down, it wasn't decided."}], "shadow": {"text": "Use the chat as a backup channel. If someone freezes, say, \"We lost you, Ahmed, could you type your main point in the chat?\" This keeps the meeting moving without making anyone feel singled out.", "marked": "Use the chat / as a <b>backup</b> channel. //<br>If someone <b>freezes</b>, say, / \"We <b>lost</b> you, Ahmed, / could you <b>type</b> your main point in the chat?\" //<br>This keeps the meeting <b>moving</b> / without making anyone / feel <b>singled out</b>. //"}, "prompts": [{"q": "你主持会议时，马尼拉同事的声音断断续续，大家都听不清，还有人同时开口。30 秒控场。", "ref": "Okay, let's pause for a second. Maria, your audio is breaking up on our side. Could you type your main point in the chat while we keep going? And could everyone except the speaker switch off video for now? That should help the connection. Ben, you were next, go ahead, and then we'll come back to Maria's point.", "ref_zh": "好，我们先停一下。Maria，你的声音在我们这边断断续续的。我们继续的时候，你能把要点打在聊天框里吗？另外，除了发言人以外，大家能不能先把视频关掉？这样网络应该会好一些。Ben，该你了，你先说，然后我们再回到 Maria 的点。", "id": "ref0"}, {"q": "会议快结束了，整场网络都不好。你做 30 秒收尾总结。", "ref": "Before we lose anyone else, let me read out what we decided. First, we're keeping the launch date. Second, Ahmed's team owns the load test, and the results are due Wednesday. Third, we're dropping dark mode from this release. I'll post all of this in the chat right now. If anything is wrong, reply there by tomorrow.", "ref_zh": "趁还没有更多人掉线，我把定下来的事念一遍。第一，上线日期不变。第二，压测由 Ahmed 的团队负责，周三出结果。第三，深色模式这个版本先砍掉。我现在就把这些发到聊天框里。有不对的地方，明天之前在那里回复。", "id": "ref1"}], "words": [{"w": "exception", "ipa": "/ɪkˈsepʃən/", "zh": "例外", "ex": "Late changes should be the exception, not the rule.", "id": "w0"}, {"w": "improvise", "ipa": "/ˈɪmprəˌvaɪz/", "zh": "即兴发挥、临时应付", "ex": "The demo environment crashed, so I had to improvise with screenshots.", "id": "w1"}, {"w": "explicit", "ipa": "/ɪkˈsplɪsɪt/", "zh": "明确的、清楚的", "ex": "Please be explicit about who owns each action item.", "id": "w2"}, {"w": "choppy", "ipa": "/ˈtʃɑːpi/", "zh": "（声音、画面）断断续续的", "ex": "Your audio is a bit choppy, could you move closer t 34.838, 34.917], [34.93, 35.312], [35.325, 35.509], [35.522, 35.851], [35.865, 36.325], [36.338, 36.628], [36.641, 36.746], [36.759, 36.983], [36.996, 37.444], [37.457, 37.693], [37.707, 37.943], [37.957, 38.259], [38.272, 38.378], [38.391, 38.746]]}, {"kind": "s", "id": "s0_2_1", "md": "That means less ==improvising== and more ==explicit== signals about who speaks, when, and what was agreed.", "zh": "这意味着少一些临场发挥，多一些明确的信号：谁说、什么时候说、定了什么。", "sp": null, "gap": false, "start": 39.144, "end": 45.936, "words": [[39.286, 39.536], [39.549, 39.891], [39.905, 40.155], [40.168, 41.023], [41.036, 41.168], [41.181, 41.378], [41.391, 41.997], [42.01, 42.51], [42.523, 42.826], [42.839, 42.957], [42.97, 43.589], [43.865, 44.247], [44.444, 44.576], [44.589, 44.799], [44.812, 44.944], [44.957, 45.536]]}, {"kind": "s", "id": "s0_2_2", "md": "Think of yourself less as a chairperson and more as a radio host.", "zh": "别把自己当会议主席，更像一个电台主持人。", "sp": null, "gap": false, "start": 45.936, "end": 50.616, "words": [[46.052, 46.341], [46.354, 46.473], [46.486, 47.091], [47.104, 47.381], [47.394, 47.486], [47.499, 47.578], [47.591, 48.447], [48.46, 48.631], [48.644, 48.973], [48.986, 49.104], [49.118, 49.183], [49.197, 49.631], [49.644, 50.223]]}, {"kind": "h", "id": "h1", "md": "2. Run It Like a Radio Show", "zh": "2. 像主持电台节目一样开会", "start": 50.616, "end": 53.52, "words": [[50.732, 51.087], [51.574, 51.745], [51.758, 51.916], [51.929, 52.127], [52.14, 52.205], [52.219, 52.679], [52.692, 53.127]]}, {"kind": "s", "id": "s1_0_0", "md": "Start by posting the agenda and the key question in the chat, so people who __drop out__ can still follow.", "zh": "一开始就把议程和核心问题发到聊天框里，这样掉线的人也还能跟上。", "sp": null, "gap": false, "start": 53.52, "end": 60.072, "words": [[53.662, 54.136], [54.149, 54.307], [54.32, 54.82], [54.833, 54.938], [54.952, 55.544], [55.557, 55.715], [55.728, 55.833], [55.846, 56.07], [56.083, 56.531], [56.544, 56.623], [56.636, 56.741], [56.754, 57.162], [57.491, 57.636], [57.649, 57.991], [58.004, 58.109], [58.123, 58.399], [58.412, 58.702], [58.715, 58.886], [58.899, 59.202], [59.215, 59.688]]}, {"kind": "s", "id": "s1_0_1", "md": "If the audio is ==choppy==, ask everyone except the speaker to turn off their video to __free up bandwidth__.", "zh": "如果声音断断续续，请除了发言人以外的所有人关掉视频，腾出带宽。", "sp": null, "gap": false, "start": 60.072, "end": 66.576, "words": [[60.214, 60.372], [60.385, 60.517], [60.53, 60.977], [60.99, 61.135], [61.148, 61.661], [61.964, 62.254], [62.267, 62.675], [62.688, 63.083], [63.096, 63.175], [63.188, 63.688], [63.701, 63.819], [63.833, 64.122], [64.135, 64.293], [64.306, 64.438], [64.451, 64.911], [64.925, 65.056], [65.069, 65.306], [65.319, 65.464], [65.477, 66.175]]}, {"kind": "s", "id": "s1_0_2", "md": "Keep your own camera on, so people can still see who is leading.", "zh": "你自己的摄像头保持开着，让大家还能看到是谁在主持。", "sp": null, "gap": false, "start": 66.576, "end": 71.04, "words": [[66.677, 66.966], [66.979, 67.15], [67.163, 67.374], [67.387, 67.808], [67.821, 68.124], [68.427, 68.585], [68.598, 68.953], [68.966, 69.137], [69.15, 69.466], [69.479, 69.769], [69.782, 69.94], [69.953, 70.098], [70.111, 70.65]]}, {"kind": "s", "id": "s1_1_0", "md": "__Call on people by name__ instead of asking, \"Any thoughts?\"", "zh": "点名叫人发言，而不是问「大家有什么想法？」", "sp": null, "gap": true, "start": 71.04, "end": 75.216, "words": [[71.141, 71.443], [71.456, 71.601], [71.614, 71.996], [72.009, 72.154], [72.167, 72.575], [72.588, 72.943], [72.956, 73.062], [73.075, 73.641], [73.956, 74.141], [74.154, 74.825]]}, {"kind": "s", "id": "s1_1_1", "md": "\"Ahmed, you first, then Claire.\"", "zh": "「Ahmed 你先说，然后 Claire。」", "sp": null, "gap": false, "start": 75.216, "end": 78.216, "words": [[75.332, 75.832], [76.121, 76.253], [76.266, 76.845], [77.095, 77.332], [77.345, 77.832]]}, {"kind": "s", "id": "s1_1_2", "md": "With a delay, open questions create long silences followed by three people talking at once.", "zh": "有延迟的时候，开放式提问会先冷场很久，然后三个人同时开口。", "sp": null, "gap": false, "start": 78.216, "end": 84.696, "words": [[78.345, 78.542], [78.555, 78.621], [78.634, 79.174], [79.49, 79.805], [79.819, 80.411], [80.424, 80.845], [80.858, 81.121], [81.134, 81.911], [81.924, 82.384], [82.398, 82.542], [82.555, 82.832], [82.845, 83.213], [83.227, 83.608], [83.621, 83.74], [83.753, 84.305]]}, {"kind": "s", "id": "s1_2_0", "md": "Use the chat as a ==backup== channel.", "zh": "把聊天框当作备用通道。", "sp": null, "gap": true, "start": 84.696, "end": 87.336, "words": [[84.812, 85.128], [85.141, 85.272], [85.285, 85.72], [85.733, 85.864], [85.878, 85.957], [85.97, 86.404], [86.417, 86.943]]}, {"kind": "s", "id": "s1_2_1", "md": "If someone freezes, say, \"We lost you, Ahmed, could you type your main point in the chat?\"", "zh": "如果有人卡住了，就说：「Ahmed 我们听不到你了，能把你的要点打在聊天框里吗？」", "sp": null, "gap": false, "start": 87.336, "end": 93.72, "words": [[87.452, 87.61], [87.623, 88.044], [88.057, 88.702], [88.925, 89.294], [89.504, 89.623], [89.636, 90.031], [90.044, 90.281], [90.583, 91.044], [91.32, 91.465], [91.478, 91.583], [91.597, 91.86], [91.873, 91.978], [91.991, 92.241], [92.254, 92.597], [92.61, 92.689], [92.702, 92.794], [92.807, 93.32]]}, {"kind": "s", "id": "s1_2_2", "md": "This keeps the meeting moving without making anyone feel ==singled out==.", "zh": "这样会议能继续往前走，也不会让谁觉得被单拎出来。", "sp": null, "gap": false, "start": 93.72, "end": 98.4, "words": [[93.862, 94.125], [94.138, 94.467], [94.481, 94.586], [94.599, 95.059], [95.073, 95.586], [95.599, 96.02], [96.033, 96.428], [96.441, 96.849], [96.862, 97.112], [97.125, 97.533], [97.546, 98.02]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, close by reading the decisions aloud and posting them in writing straight away.", "zh": "最后，收尾时把决定大声念一遍，并马上用文字发出来。", "sp": null, "gap": true, "start": 98.4, "end": 104.28, "words": [[98.529, 99.2], [99.489, 99.845], [99.858, 100.029], [100.042, 100.437], [100.45, 100.555], [100.568, 101.134], [101.147, 101.634], [101.647, 101.818], [101.832, 102.318], [102.332, 102.489], [102.503, 102.621], [102.634, 103.042], [103.055, 103.397], [103.411, 103.884]]}, {"kind": "s", "id": "s1_3_1", "md": "**On a bad line, if it isn't written down, it wasn't decided.**", "zh": "网络不好的时候，没写下来的，就等于没定。", "sp": null, "gap": false, "start": 104.28, "end": 108.888, "words": [[104.422, 104.567], [104.58, 104.646], [104.659, 104.948], [104.962, 105.422], [105.685, 105.804], [105.817, 105.935], [105.948, 106.238], [106.251, 106.567], [106.58, 107.014], [107.264, 107.369], [107.383, 107.738], [107.751, 108.488]]}, {"kind": "s", "id": "s1_3_2", "md": "That way, nobody can remember it differently next week.", "zh": "这样下周就没人会记成别的样子。", "sp": null, "gap": false, "start": 108.888, "end": 113.064, "words": [[109.03, 109.32], [109.333, 109.675], [109.991, 110.425], [110.438, 110.622], [110.635, 111.162], [111.175, 111.359], [111.372, 111.859], [111.872, 112.201], [112.214, 112.662]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
