<script>
const D = {"id": "096", "title": "Leading a Video Call with Bad Connections", "meta": "B2 · 约 280 词 · 场景：网络不好时主持视频会", "voice": "en-GB-SoniaNeural", "rate": "-5%", "sections": [{"heading": "1. The Call That Falls Apart", "heading_zh": "1. 一团糟的会议", "rows": [[{"id": "s0_0_0", "md": "You know the call.", "text": "You know the call.", "zh": "这种会你肯定遇到过。", "sp": null}, {"id": "s0_0_1", "md": "Someone's voice freezes in the middle of a sentence, two people start talking at once after a delay, and a third has been on mute for five minutes without realizing it.", "text": "Someone's voice freezes in the middle of a sentence, two people start talking at once after a delay, and a third has been on mute for five minutes without realizing it.", "zh": "有人话说到一半声音卡住了，因为有延迟两个人同时开口，还有一个人静音了五分钟自己都没发现。", "sp": null}, {"id": "s0_0_2", "md": "By the end, nobody is sure what was decided.", "text": "By the end, nobody is sure what was decided.", "zh": "到最后，谁也说不清到底定了什么。", "sp": null}], [{"id": "s0_1_0", "md": "With teammates in Manila, Chennai and rural Australia, weak connections are not rare ==exceptions==.", "text": "With teammates in Manila, Chennai and rural Australia, weak connections are not rare exceptions.", "zh": "队友在马尼拉、金奈和澳洲乡下，网络差根本不是什么稀罕事。", "sp": null}, {"id": "s0_1_1", "md": "They are part of the job, and whoever leads the call has to plan for them.", "text": "They are part of the job, and whoever leads the call has to plan for them.", "zh": "这就是工作的一部分，主持会议的人得提前为此做准备。", "sp": null}, {"id": "s0_1_2", "md": "**On a bad connection, structure is more important than charm.**", "text": "On a bad connection, structure is more important than charm.", "zh": "网络不好的时候，结构比个人魅力更重要。", "sp": null}], [{"id": "s0_2_0", "md": "The goal is a call that still works even if some people only hear half of it.", "text": "The goal is a call that still works even if some people only hear half of it.", "zh": "目标是开一个哪怕有人只听到一半也还能运转的会。", "sp": null}, {"id": "s0_2_1", "md": "That means less ==improvising== and more ==explicit== signals about who speaks, when, and what was agreed.", "text": "That means less improvising and more explicit signals about who speaks, when, and what was agreed.", "zh": "这意味着少一些临场发挥，多一些明确的信号：谁说、什么时候说、定了什么。", "sp": null}, {"id": "s0_2_2", "md": "Think of yourself less as a chairperson and more as a radio host.", "text": "Think of yourself less as a chairperson and more as a radio host.", "zh": "别把自己当会议主席，更像一个电台主持人。", "sp": null}]]}, {"heading": "2. Run It Like a Radio Show", "heading_zh": "2. 像主持电台节目一样开会", "rows": [[{"id": "s1_0_0", "md": "Start by posting the agenda and the key question in the chat, so people who __drop out__ can still follow.", "text": "Start by posting the agenda and the key question in the chat, so people who drop out can still follow.", "zh": "一开始就把议程和核心问题发到聊天框里，这样掉线的人也还能跟上。", "sp": null}, {"id": "s1_0_1", "md": "If the audio is ==choppy==, ask everyone except the speaker to turn off their video to __free up bandwidth__.", "text": "If the audio is choppy, ask everyone except the speaker to turn off their video to free up bandwidth.", "zh": "如果声音断断续续，请除了发言人以外的所有人关掉视频，腾出带宽。", "sp": null}, {"id": "s1_0_2", "md": "Keep your own camera on, so people can still see who is leading.", "text": "Keep your own camera on, so people can still see who is leading.", "zh": "你自己的摄像头保持开着，让大家还能看到是谁在主持。", "sp": null}], [{"id": "s1_1_0", "md": "__Call on people by name__ instead of asking, \"Any thoughts?\"", "text": "Call on people by name instead of asking, \"Any thoughts?\"", "zh": "点名叫人发言，而不是问「大家有什么想法？」", "sp": null}, {"id": "s1_1_1", "md": "\"Ahmed, you first, then Claire.\"", "text": "\"Ahmed, you first, then Claire.\"", "zh": "「Ahmed 你先说，然后 Claire。」", "sp": null}, {"id": "s1_1_2", "md": "With a delay, open questions create long silences followed by three people talking at once.", "text": "With a delay, open questions create long silences followed by three people talking at once.", "zh": "有延迟的时候，开放式提问会先冷场很久，然后三个人同时开口。", "sp": null}], [{"id": "s1_2_0", "md": "Use the chat as a ==backup== channel.", "text": "Use the chat as a backup channel.", "zh": "把聊天框当作备用通道。", "sp": null}, {"id": "s1_2_1", "md": "If someone freezes, say, \"We lost you, Ahmed, could you type your main point in the chat?\"", "text": "If someone freezes, say, \"We lost you, Ahmed, could you type your main point in the chat?\"", "zh": "如果有人卡住了，就说：「Ahmed 我们听不到你了，能把你的要点打在聊天框里吗？」", "sp": null}, {"id": "s1_2_2", "md": "This keeps the meeting moving without making anyone feel ==singled out==.", "text": "This keeps the meeting moving without making anyone feel singled out.", "zh": "这样会议能继续往前走，也不会让谁觉得被单拎出来。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, close by reading the decisions aloud and posting them in writing straight away.", "text": "Finally, close by reading the decisions aloud and posting them in writing straight away.", "zh": "最后，收尾时把决定大声念一遍，并马上用文字发出来。", "sp": null}, {"id": "s1_3_1", "md": "**On a bad line, if it isn't written down, it wasn't decided.**", "text": "On a bad line, if it isn't written down, it wasn't decided.", "zh": "网络不好的时候，没写下来的，就等于没定。", "sp": null}, {"id": "s1_3_2", "md": "That way, nobody can remember it differently next week.", "text": "That way, nobody can remember it differently next week.", "zh": "这样下周就没人会记成别的样子。", "sp": null}]]}], "gist": [{"q": "作者说网络差的会议里什么比个人魅力更重要？", "a": "结构；会议要设计成即使有人只听到一半也能运转。"}, {"q": "为什么要点名发言而不是问 \"Any thoughts?\"", "a": "有延迟时，开放式提问会先冷场，然后三个人同时开口；点名能排好发言顺序。"}, {"q": "文中主持网络差会议的具体做法有哪些？", "a": "提前把议程和关键问题发到聊天框；音频卡顿时让非发言者关视频；按名字点人；用聊天框作备用通道；结束时口头念出决定并立刻书面发出。"}], "dictation": [{"id": "s0_1_2", "text": "On a bad connection, structure is more important than charm."}, {"id": "s0_2_0", "text": "The goal is a call that still works even if some people only hear half of it."}, {"id": "s1_2_0", "text": "Use the chat as a backup channel."}, {"id": "s1_3_1", "text": "On a bad line, if it isn't written down, it wasn't decided."}], "shadow": {"text": "Use the chat as a backup channel. If someone freezes, say, \"We lost you, Ahmed, could you type your main point in the chat?\" This keeps the meeting moving without making anyone feel singled out.", "marked": "Use the chat / as a <b>backup</b> channel. //<br>If someone <b>freezes</b>, say, / \"We <b>lost</b> you, Ahmed, / could you <b>type</b> your main point in the chat?\" //<br>This keeps the meeting <b>moving</b> / without making anyone / feel <b>singled out</b>. //"}, "prompts": [{"q": "你主持会议时，马尼拉同事的声音断断续续，大家都听不清，还有人同时开口。30 秒控场。", "ref": "Okay, let's pause for a second. Maria, your audio is breaking up on our side. Could you type your main point in the chat while we keep going? And could everyone except the speaker switch off video for now? That should help the connection. Ben, you were next, go ahead, and then we'll come back to Maria's point.", "ref_zh": "好，我们先停一下。Maria，你的声音在我们这边断断续续的。我们继续的时候，你能把要点打在聊天框里吗？另外，除了发言人以外，大家能不能先把视频关掉？这样网络应该会好一些。Ben，该你了，你先说，然后我们再回到 Maria 的点。", "id": "ref0"}, {"q": "会议快结束了，整场网络都不好。你做 30 秒收尾总结。", "ref": "Before we lose anyone else, let me read out what we decided. First, we're keeping the launch date. Second, Ahmed's team owns the load test, and the results are due Wednesday. Third, we're dropping dark mode from this release. I'll post all of this in the chat right now. If anything is wrong, reply there by tomorrow.", "ref_zh": "趁还没有更多人掉线，我把定下来的事念一遍。第一，上线日期不变。第二，压测由 Ahmed 的团队负责，周三出结果。第三，深色模式这个版本先砍掉。我现在就把这些发到聊天框里。有不对的地方，明天之前在那里回复。", "id": "ref1"}], "words": [{"w": "exception", "ipa": "/ɪkˈsepʃən/", "zh": "例外", "ex": "Late changes should be the exception, not the rule.", "id": "w0"}, {"w": "improvise", "ipa": "/ˈɪmprəˌvaɪz/", "zh": "即兴发挥、临时应付", "ex": "The demo environment crashed, so I had to improvise with screenshots.", "id": "w1"}, {"w": "explicit", "ipa": "/ɪkˈsplɪsɪt/", "zh": "明确的、清楚的", "ex": "Please be explicit about who owns each action item.", "id": "w2"}, {"w": "choppy", "ipa": "/ˈtʃɑːpi/", "zh": "（声音、画面）断断续续的", "ex": "Your audio is a bit choppy, could you move closer t const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
