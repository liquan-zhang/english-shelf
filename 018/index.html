<script>
const D = {"id": "018", "title": "Presenting Bad News Upward", "meta": "B2 · 约 280 词 · 场景：向上汇报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Bad News Gets Worse with Age", "heading_zh": "1. 坏消息越放越坏", "rows": [[{"id": "s0_0_0", "md": "Bad news is like milk; it does not get better if you leave it in the fridge.", "text": "Bad news is like milk; it does not get better if you leave it in the fridge.", "zh": "坏消息就像牛奶，放在冰箱里不会变好。", "sp": null}, {"id": "s0_0_1", "md": "A project that is two weeks late on Monday is still fixable.", "text": "A project that is two weeks late on Monday is still fixable.", "zh": "一个项目周一时延期两周，还有救。", "sp": null}, {"id": "s0_0_2", "md": "The same delay, ==revealed== the day before launch, becomes a crisis that pulls in three directors.", "text": "The same delay, revealed the day before launch, becomes a crisis that pulls in three directors.", "zh": "同样的延期，拖到上线前一天才说出来，就成了要拉上三个总监的危机。", "sp": null}], [{"id": "s0_1_0", "md": "Most people delay bad news for a kind reason.", "text": "Most people delay bad news for a kind reason.", "zh": "大多数人拖着不报坏消息，出发点是好的。", "sp": null}, {"id": "s0_1_1", "md": "They hope to fix the problem quietly and never have to mention it.", "text": "They hope to fix the problem quietly and never have to mention it.", "zh": "他们希望悄悄把问题解决，永远不用提起。", "sp": null}, {"id": "s0_1_2", "md": "Sometimes that works, but when it does not, your manager learns two things at once, that the project is in trouble and that you __kept it from them__.", "text": "Sometimes that works, but when it does not, your manager learns two things at once, that the project is in trouble and that you kept it from them.", "zh": "有时候这样确实行得通，但一旦行不通，你的经理会同时得知两件事：项目出了问题，而且你一直瞒着他。", "sp": null}], [{"id": "s0_2_0", "md": "**Managers can handle bad news; what they cannot handle is surprise.**", "text": "Managers can handle bad news; what they cannot handle is surprise.", "zh": "经理能接受坏消息，他们接受不了的是意外。", "sp": null}, {"id": "s0_2_1", "md": "Early warning gives them time to move people, adjust ==commitments==, or warn their own boss.", "text": "Early warning gives them time to move people, adjust commitments, or warn their own boss.", "zh": "提前预警能让他们有时间调人、调整承诺，或者给自己的老板打个预防针。", "sp": null}, {"id": "s0_2_2", "md": "In that sense, raising a problem early is not ==conceding== failure; it is giving them options.", "text": "In that sense, raising a problem early is not conceding failure; it is giving them options.", "zh": "从这个意义上说，早点暴露问题不是认输，而是给他们留出选择的余地。", "sp": null}]]}, {"heading": "2. Headline, Impact, Options", "heading_zh": "2. 结论、影响、选项", "rows": [[{"id": "s1_0_0", "md": "Open with the headline, not the history.", "text": "Open with the headline, not the history.", "zh": "开口先讲结论，不讲来龙去脉。", "sp": null}, {"id": "s1_0_1", "md": "\"The payment migration will miss the end of the month by about two weeks.\"", "text": "\"The payment migration will miss the end of the month by about two weeks.\"", "zh": "「支付迁移会比月底的节点晚两周左右。」", "sp": null}, {"id": "s1_0_2", "md": "If you start with a long story, your manager spends the whole time __bracing for__ the bad part.", "text": "If you start with a long story, your manager spends the whole time bracing for the bad part.", "zh": "如果你从一个很长的故事讲起，你的经理整个过程都在提心吊胆地等坏消息。", "sp": null}], [{"id": "s1_1_0", "md": "Then explain the impact in their terms.", "text": "Then explain the impact in their terms.", "zh": "然后用他们关心的维度讲清影响。", "sp": null}, {"id": "s1_1_1", "md": "Which customers, which teams, and which promises are affected?", "text": "Which customers, which teams, and which promises are affected?", "zh": "影响到哪些客户、哪些团队、哪些承诺？", "sp": null}, {"id": "s1_1_2", "md": "Keep the cause short and ==factual==, and avoid blaming another team, even if it is true.", "text": "Keep the cause short and factual, and avoid blaming another team, even if it is true.", "zh": "原因要讲得简短、客观，别甩锅给其他团队，哪怕确实是他们的问题。", "sp": null}], [{"id": "s1_2_0", "md": "Most importantly, bring options, with your ==recommendation==.", "text": "Most importantly, bring options, with your recommendation.", "zh": "最重要的是，带着选项来，并给出你的建议。", "sp": null}, {"id": "s1_2_1", "md": "\"We can cut the refund feature and ship on time, or keep it and slip two weeks; I'd suggest cutting it.\"", "text": "\"We can cut the refund feature and ship on time, or keep it and slip two weeks; I'd suggest cutting it.\"", "zh": "「我们可以砍掉退款功能按时上线，或者保留它推迟两周；我建议砍掉。」", "sp": null}, {"id": "s1_2_2", "md": "**Never bring a problem upward without at least one way out.**", "text": "Never bring a problem upward without at least one way out.", "zh": "永远不要只把问题往上抛，至少要带一条出路。", "sp": null}], [{"id": "s1_3_0", "md": "End with exactly what you need, whether it is a decision, extra people, or help __managing expectations__ with another team.", "text": "End with exactly what you need, whether it is a decision, extra people, or help managing expectations with another team.", "zh": "最后讲清楚你具体需要什么，不管是一个决定、更多人手，还是帮忙跟另一个团队管理预期。", "sp": null}, {"id": "s1_3_1", "md": "Delivered this way, bad news can actually ==strengthen== your manager's trust in you.", "text": "Delivered this way, bad news can actually strengthen your manager's trust in you.", "zh": "用这种方式传达，坏消息反而能加深经理对你的信任。", "sp": null}]]}], "gist": [{"q": "作者为什么把坏消息比作牛奶？", "a": "坏消息放着不会变好，越晚说越严重，早说还能补救，晚说就成了危机。"}, {"q": "作者说管理者真正无法接受的是什么？", "a": "不是坏消息本身，而是意外；提前预警能给他们调整人力、承诺和向上沟通的时间。"}, {"q": "向上汇报坏消息的结构是什么？", "a": "先说结论；用对方的语言讲影响，原因简短客观不甩锅；带着选项和自己的建议；最后明确需要什么支持。"}], "dictation": [{"id": "s0_2_0", "text": "Managers can handle bad news; what they cannot handle is surprise."}, {"id": "s1_2_2", "text": "Never bring a problem upward without at least one way out."}, {"id": "s1_0_0", "text": "Open with the headline, not the history."}, {"id": "s0_0_0", "text": "Bad news is like milk; it does not get better if you leave it in the fridge."}], "shadow": {"text": "Most importantly, bring options, with your recommendation. \"We can cut the refund feature and ship on time, or keep it and slip two weeks; I'd suggest cutting it.\"", "marked": "Most <b>importantly</b>, / bring <b>options</b>, / with your <b>recommendation</b>. //<br>\"We can <b>cut</b> the refund feature / and ship on <b>time</b>, / or <b>keep</b> it / and slip <b>two</b> weeks; // I'd suggest <b>cutting</b> it.\" //"}, "prompts": [{"q": "你发现团队负责的数据迁移会比计划晚三周，原因是上游接口变更。用 30 秒向你的总监汇报：结论、影响、选项和建议。", "ref": "I need to flag a risk early. The data migration is going to be about three weeks late. The upstream API changed last week, and we have to rewrite part of the sync logic. The main impact is on the finance reports, which depend on the new tables. We have two options. We can move only the finance tables first and hit the date, or move everything three weeks later. I'd recommend the first option.", "ref_zh": "我需要提前同步一个风险。数据迁移会晚三周左右。上游 API 上周改了，我们得重写一部分同步逻辑。主要影响的是财务报表，它们依赖新表。我们有两个选项。可以先只迁财务相关的表，赶上原定日期；或者三周后整体迁移。我建议选第一个。", "id": "ref0"}, {"q": "线上出了一个影响部分用户的故障，已经止血。用 30 秒向上级简短汇报，并说明你需要他帮什么。", "ref": "Quick heads-up on this morning's incident. For about forty minutes, roughly five percent of users couldn't log in. It's fixed now, and we've rolled back the change that caused it. We'll have a full write-up by Thursday. The one thing I need from you is help with the customer success team, since a few large clients noticed, and I think the message should come from your level.", "ref_zh": "同步一下今天上午的事故。大约四十分钟里，约百分之五的用户登录不了。现在已经修好了，引发问题的改动也已经回滚。周四前我们会出完整的复盘报告。我唯一需要你帮忙的是客户成功团队那边，因为有几个大客户注意到了，我觉得这个口径应该由你这个层级来发。", "id": "ref1"}], "words": [{"w": "reveal", "ipa": "/rɪˈviːl/", "zh": "揭露、透露", "ex": "The audit revealed three services still using the old password hash.", "id": "w0"}, {"w": "commitment", "ipa": "/kəˈmɪtmənt/", "zh": "承诺、已答应的事", "ex": "We can't take this on without dropping another commitment.", "id": "w1"}, {"w": "concede", "ipa": "/kənˈsiːd/", "zh": "承认（失败、观点）", "ex": "I'll concede that the old design was simpler to operate.", "id": "w2"}, {"w": "factual", "ipa": "/ˈfæktʃuəl/", "zh": "基于事实的、客观的", "ex": "Kee const player = new Audio();

// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
