<script>
const D = {"id": "112", "type": "dialogue", "title": "Ordering Coffee Your Way", "meta": "B2 · 约 250 词 · 场景：咖啡店定制点单与做错饮品", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Barista", "name_zh": "咖啡师", "voice": "en-SG-WayneNeural"}}, "gist": [{"q": "「你」点的咖啡有哪些定制要求？", "a": "大杯燕麦奶拿铁，特别烫，半泵香草糖浆，多加一份浓缩。"}, {"q": "拿到咖啡后出了什么问题？「你」为什么特别在意？", "a": "拿错成别人的普通牛奶拿铁；因为「你」不能喝乳制品。"}, {"q": "咖啡师最后怎么处理的？", "a": "按要求重做一杯，并且那个可颂免费送了。"}], "dictation": [{"id": "s0_1_0", "text": "Can I get a large latte with oat milk, please?"}, {"id": "s0_5_0", "text": "Just half a pump of vanilla. I don't like it too sweet."}, {"id": "s1_0_0", "text": "Sorry, excuse me. I think this might be the wrong drink. It tastes like regular milk."}, {"id": "s1_4_0", "text": "That's the one. Could you also put a lid on it? I'll take it to go after all."}], "shadow": {"speaker": "A", "text": "No worries. I just can't have dairy, so I wanted to double-check.", "marked": "No <b>worries</b>. //<br>I just <b>can't</b> have <b>dairy</b>, / so I wanted to <b>double</b>-check. //"}, "prompts": [{"q": "你在咖啡店想点一杯冰美式，但要少冰、不加糖，另外问问有没有低咖啡因的选项。用 30 秒点单。", "ref": "Hi, can I get an iced Americano, please? Less ice, and no sugar or syrup at all. Actually, do you have a decaf option? I've already had two coffees today. If you do, I'll go with decaf. And could I get it in a medium size? Thanks.", "ref_zh": "你好，请给我一杯冰美式。少冰，完全不要糖或糖浆。对了，你们有低咖啡因的吗？我今天已经喝了两杯咖啡了。有的话我就换低因的。中杯就行，谢谢。", "id": "ref0"}, {"q": "你在外卖平台点的咖啡送到后发现是热的，而你点的是冰的。打电话给店里，说明情况并提出你想怎么处理。", "ref": "Hi, I just got a delivery from your shop under the name Lee. I ordered an iced latte, but this one is hot. I think the order got mixed up. Would it be possible to send the right one, or could you refund the drink instead? Either is fine with me, I just want to sort it out.", "ref_zh": "你好，我刚收到你们店的外卖，名字是 Lee。我点的是冰拿铁，送来的是热的，应该是弄混了。能重新送一杯对的吗？或者这杯给我退款也行。两种都可以，我就是想把事情处理好。", "id": "ref1"}], "words": [{"w": "extra hot", "ipa": "/ˈekstrə hɑːt/", "zh": "特别烫（咖啡定制）", "ex": "Can I get my flat white extra hot, please?", "id": "w0"}, {"w": "syrup", "ipa": "/ˈsɪrəp/", "zh": "糖浆", "ex": "No syrup for me, thanks. I'm cutting down on sugar.", "id": "w1"}, {"w": "shot", "ipa": "/ʃɑːt/", "zh": "一份浓缩咖啡", "ex": "I'll have a cappuccino with an extra shot.", "id": "w2"}, {"w": "half a pump", "ipa": "/hæf ə pʌmp/", "zh": "半泵（糖浆）", "ex": "Just half a pump of caramel, please.", "id": "w3"}, {"w": "label", "ipa": "/ˈleɪbəl/", "zh": "标签", "ex": "Check the label on the cup before you take it.", "id": "w4"}, {"w": "remake (v.)", "ipa": "/ˌriːˈmeɪk/", "zh": "重做", "ex": "Sorry, we'll remake your drink right away.", "tts_w": "remake", "id": "w5"}, {"w": "on the house", "ipa": "/ɑːn ðə haʊs/", "zh": "店家请客，免费", "ex": "The dessert is on the house tonight.", "id": "w6"}, {"w": "dairy", "ipa": "/ˈderi/", "zh": "乳制品", "ex": "My son can't have dairy, so we always ask for soy milk.", "id": "w7"}, {"w": "double-check", "ipa": "/ˌdʌbəl ˈtʃek/", "zh": "再确认一下", "ex": "Let me double-check the address before I pay.", "id": "w8"}], "sections": [{"heading": "1. At the Counter", "heading_zh": "1. 在柜台点单", "rows": [[{"id": "s0_0_0", "md": "Morning! What can I get started for you?", "text": "Morning! What can I get started for you?", "zh": "早！想喝点什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Can I get a large latte with oat milk, please?**", "text": "Can I get a large latte with oat milk, please?", "zh": "请给我一杯大杯燕麦奶拿铁。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. Oat milk is an extra eighty cents. Is that okay?", "text": "Sure. Oat milk is an extra eighty cents. Is that okay?", "zh": "好的。燕麦奶要加八毛钱，可以吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "That's fine. And could you __make it__ ==extra hot==? I've got a long walk to the office.", "text": "That's fine. And could you make it extra hot? I've got a long walk to the office.", "zh": "没问题。能做得特别烫一点吗？我走到公司要挺久。", "sp": "A"}], [{"id": "s0_4_0", "md": "No problem. Any ==syrup==? We have vanilla, caramel and hazelnut.", "text": "No problem. Any syrup? We have vanilla, caramel and hazelnut.", "zh": "没问题。要加糖浆吗？有香草、焦糖和榛子的。", "sp": "B"}], [{"id": "s0_5_0", "md": "Just __half a pump__ of vanilla. I don't like it too sweet.", "text": "Just half a pump of vanilla. I don't like it too sweet.", "zh": "香草的，只要半泵。我不喜欢太甜。", "sp": "A"}], [{"id": "s0_6_0", "md": "Half a pump, got it. Would you like an extra ==shot==? It's quite a mild blend.", "text": "Half a pump, got it. Would you like an extra shot? It's quite a mild blend.", "zh": "半泵，记下了。要不要多加一份浓缩？我们这款豆子味道比较淡。", "sp": "B"}], [{"id": "s0_7_0", "md": "Oh, yes, __go ahead__. I need it today. And one plain croissant, __for here__.", "text": "Oh, yes, go ahead. I need it today. And one plain croissant, for here.", "zh": "哦，好，加吧。今天确实需要。再要一个原味可颂，在这儿吃。", "sp": "A"}], [{"id": "s0_8_0", "md": "Alright, that's eight forty altogether. Can I get a name for the cup?", "text": "Alright, that's eight forty altogether. Can I get a name for the cup?", "zh": "好的，一共八块四。杯子上写什么名字？", "sp": "B"}], [{"id": "s0_9_0", "md": "It's Lee. L, E, E. Can I pay by card?", "text": "It's Lee. L, E, E. Can I pay by card?", "zh": "Lee。L、E、E。能刷卡吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Of course, just tap here whenever you're ready.", "text": "Of course, just tap here whenever you're ready.", "zh": "当然，准备好了在这儿拍一下就行。", "sp": "B"}]]}, {"heading": "2. The Wrong Drink", "heading_zh": "2. 饮品做错了", "rows": [[{"id": "s1_0_0", "md": "Sorry, __excuse me__. I think this might be the wrong drink. It tastes like regular milk.", "text": "Sorry, excuse me. I think this might be the wrong drink. It tastes like regular milk.", "zh": "不好意思，打扰一下。我觉得这杯可能做错了，喝着像普通牛奶。", "sp": "A"}], [{"id": "s1_1_0", "md": "Oh, let me check the ==label==. You're right, this one's for another order. My apologies.", "text": "Oh, let me check the label. You're right, this one's for another order. My apologies.", "zh": "哦，我看看标签。您说得对，这杯是别人的单。抱歉。", "sp": "B"}], [{"id": "s1_2_0", "md": "No worries. I just can't have dairy, so I wanted to __double-check__.", "text": "No worries. I just can't have dairy, so I wanted to double-check.", "zh": "没关系。我只是不能喝乳制品，所以想确认一下。", "sp": "A"}], [{"id": "s1_3_0", "md": "Totally understand. I'll ==remake== it now, oat milk, extra hot, half vanilla, extra shot.", "text": "Totally understand. I'll remake it now, oat milk, extra hot, half vanilla, extra shot.", "zh": "完全理解。我马上重做：燕麦奶、特别烫、半泵香草、多加一份浓缩。", "sp": "B"}], [{"id": "s1_4_0", "md": "**That's the one. Could you also put a lid on it? I'll take it to go after all.**", "text": "That's the one. Could you also put a lid on it? I'll take it to go after all.", "zh": "就是这个。能帮我加个盖子吗？我还是打包带走吧。", "sp": "A"}], [{"id": "s1_5_0", "md": "Sure thing. And since you had to wait, the croissant is ==on the house== today.", "text": "Sure thing. And since you had to wait, the croissant is on the house today.", "zh": "没问题。让您久等了，今天可颂算我们请的。", "sp": "B"}], [{"id": "s1_6_0", "md": "Oh, you don't have to do that. But thank you, that's really nice of you.", "text": "Oh, you don't have to do that. But thank you, that's really nice of you.", "zh": "哎，不用这样的。不过谢谢，你人真好。", "sp": "A"}], [{"id": "s1_7_0", "md": "Here you go. Careful, it's very hot. Have a good day at work!", "text": "Here you go. Careful, it's very hot. Have a good day at work!", "zh": "给您。小心，很烫。祝您上班顺利！", "sp": "B"}], [{"id": "s1_8_0", "md": "**Thanks, you too. See you tomorrow.**", "text": "Thanks, you too. See you tomorrow.", "zh": "谢谢，你也是。明天见。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. At the Counter", "zh": "1. 在柜台点单", "start": 0.0, "end": 1.704, "words": [[0.105, 0.316], [0.658, 0.737], [0.75, 0.829], [0.842, 1.303]]}, {"kind": "s", "id": "s0_0_0", "md": "Morning! What can I get started for you?", "zh": "早！想喝点什么？", "sp": "B", "gap": false, "start": 1.704, "end": 6.144, "words": [[1.807, 2.491], [3.388, 3.638], [3.651, 3.796], [3.809, 3.888], [3.901, 4.099], [4.112, 4.559], [4.572, 4.743], const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));
