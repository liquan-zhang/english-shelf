<script>
const D = {"id": "112", "type": "dialogue", "title": "Ordering Coffee Your Way", "meta": "B2 · 约 250 词 · 场景：咖啡店定制点单与做错饮品", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Barista", "name_zh": "咖啡师", "voice": "en-SG-WayneNeural"}}, "gist": [{"q": "「你」点的咖啡有哪些定制要求？", "a": "大杯燕麦奶拿铁，特别烫，半泵香草糖浆，多加一份浓缩。"}, {"q": "拿到咖啡后出了什么问题？「你」为什么特别在意？", "a": "拿错成别人的普通牛奶拿铁；因为「你」不能喝乳制品。"}, {"q": "咖啡师最后怎么处理的？", "a": "按要求重做一杯，并且那个可颂免费送了。"}], "dictation": [{"id": "s0_1_0", "text": "Can I get a large latte with oat milk, please?"}, {"id": "s0_5_0", "text": "Just half a pump of vanilla. I don't like it too sweet."}, {"id": "s1_0_0", "text": "Sorry, excuse me. I think this might be the wrong drink. It tastes like regular milk."}, {"id": "s1_4_0", "text": "That's the one. Could you also put a lid on it? I'll take it to go after all."}], "shadow": {"speaker": "A", "text": "No worries. I just can't have dairy, so I wanted to double-check.", "marked": "No <b>worries</b>. //<br>I just <b>can't</b> have <b>dairy</b>, / so I wanted to <b>double</b>-check. //"}, "prompts": [{"q": "你在咖啡店想点一杯冰美式，但要少冰、不加糖，另外问问有没有低咖啡因的选项。用 30 秒点单。", "ref": "Hi, can I get an iced Americano, please? Less ice, and no sugar or syrup at all. Actually, do you have a decaf option? I've already had two coffees today. If you do, I'll go with decaf. And could I get it in a medium size? Thanks.", "ref_zh": "你好，请给我一杯冰美式。少冰，完全不要糖或糖浆。对了，你们有低咖啡因的吗？我今天已经喝了两杯咖啡了。有的话我就换低因的。中杯就行，谢谢。", "id": "ref0"}, {"q": "你在外卖平台点的咖啡送到后发现是热的，而你点的是冰的。打电话给店里，说明情况并提出你想怎么处理。", "ref": "Hi, I just got a delivery from your shop under the name Lee. I ordered an iced latte, but this one is hot. I think the order got mixed up. Would it be possible to send the right one, or could you refund the drink instead? Either is fine with me, I just want to sort it out.", "ref_zh": "你好，我刚收到你们店的外卖，名字是 Lee。我点的是冰拿铁，送来的是热的，应该是弄混了。能重新送一杯对的吗？或者这杯给我退款也行。两种都可以，我就是想把事情处理好。", "id": "ref1"}], "words": [{"w": "extra hot", "ipa": "/ˈekstrə hɑːt/", "zh": "特别烫（咖啡定制）", "ex": "Can I get my flat white extra hot, please?", "id": "w0"}, {"w": "syrup", "ipa": "/ˈsɪrəp/", "zh": "糖浆", "ex": "No syrup for me, thanks. I'm cutting down on sugar.", "id": "w1"}, {"w": "shot", "ipa": "/ʃɑːt/", "zh": "一份浓缩咖啡", "ex": "I'll have a cappuccino with an extra shot.", "id": "w2"}, {"w": "half a pump", "ipa": "/hæf ə pʌmp/", "zh": "半泵（糖浆）", "ex": "Just half a pump of caramel, please.", "id": "w3"}, {"w": "label", "ipa": "/ˈleɪbəl/", "zh": "标签", "ex": "Check the label on the cup before you take it.", "id": "w4"}, {"w": "remake (v.)", "ipa": "/ˌriːˈmeɪk/", "zh": "重做", "ex": "Sorry, we'll remake your drink right away.", "tts_w": "remake", "id": "w5"}, {"w": "on the house", "ipa": "/ɑːn ðə haʊs/", "zh": "店家请客，免费", "ex": "The dessert is on the house tonight.", "id": "w6"}, {"w": "dairy", "ipa": "/ˈderi/", "zh": "乳制品", "ex": "My son can't have dairy, so we always ask for soy milk.", "id": "w7"}, {"w": "double-check", "ipa": "/ˌdʌbəl ˈtʃek/", "zh": "再确认一下", "ex": "Let me double-check the address before I pay.", "id": "w8"}], "sections": [{"heading": "1. At the Counter", "heading_zh": "1. 在柜台点单", "rows": [[{"id": "s0_0_0", "md": "Morning! What can I get started for you?", "text": "Morning! What can I get started for you?", "zh": "早！想喝点什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Can I get a large latte with oat milk, please?**", "text": "Can I get a large latte with oat milk, please?", "zh": "请给我一杯大杯燕麦奶拿铁。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. Oat milk is an extra eighty cents. Is that okay?", "text": "Sure. Oat milk is an extra eighty cents. Is that okay?", "zh": "好的。燕麦奶要加八毛钱，可以吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "That's fine. And could you __make it__ ==extra hot==? I've got a long walk to the office.", "text": "That's fine. And could you make it extra hot? I've got a long walk to the office.", "zh": "没问题。能做得特别烫一点吗？我走到公司要挺久。", "sp": "A"}], [{"id": "s0_4_0", "md": "No problem. Any ==syrup==? We have vanilla, caramel and hazelnut.", "text": "No problem. Any syrup? We have vanilla, caramel and hazelnut.", "zh": "没问题。要加糖浆吗？有香草、焦糖和榛子的。", "sp": "B"}], [{"id": "s0_5_0", "md": "Just __half a pump__ of vanilla. I don't like it too sweet.", "text": "Just half a pump of vanilla. I don't like it too sweet.", "zh": "香草的，只要半泵。我不喜欢太甜。", "sp": "A"}], [{"id": "s0_6_0", "md": "Half a pump, got it. Would you like an extra ==shot==? It's quite a mild blend.", "text": "Half a pump, got it. Would you like an extra shot? It's quite a mild blend.", "zh": "半泵，记下了。要不要多加一份浓缩？我们这款豆子味道比较淡。", "sp": "B"}], [{"id": "s0_7_0", "md": "Oh, yes, __go ahead__. I need it today. And one plain croissant, __for here__.", "text": "Oh, yes, go ahead. I need it today. And one plain croissant, for here.", "zh": "哦，好，加吧。今天确实需要。再要一个原味可颂，在这儿吃。", "sp": "A"}], [{"id": "s0_8_0", "md": "Alright, that's eight forty altogether. Can I get a name for the cup?", "text": "Alright, that's eight forty altogether. Can I get a name for the cup?", "zh": "好的，一共八块四。杯子上写什么名字？", "sp": "B"}], [{"id": "s0_9_0", "md": "It's Lee. L, E, E. Can I pay by card?", "text": "It's Lee. L, E, E. Can I pay by card?", "zh": "Lee。L、E、E。能刷卡吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Of course, just tap here whenever you're ready.", "text": "Of course, just tap here whenever you're ready.", "zh": "当然，准备好了在这儿拍一下就行。", "sp": "B"}]]}, {"heading": "2. The Wrong Drink", "heading_zh": "2. 饮品做错了", "rows": [[{"id": "s1_0_0", "md": "Sorry, __excuse me__. I think this might be the wrong drink. It tastes like regular milk.", "text": "Sorry, excuse me. I think this might be the wrong drink. It tastes like regular milk.", "zh": "不好意思，打扰一下。我觉得这杯可能做错了，喝着像普通牛奶。", "sp": "A"}], [{"id": "s1_1_0", "md": "Oh, let me check the ==label==. You're right, this one's for another order. My apologies.", "text": "Oh, let me check the label. You're right, this one's for another order. My apologies.", "zh": "哦，我看看标签。您说得对，这杯是别人的单。抱歉。", "sp": "B"}], [{"id const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
