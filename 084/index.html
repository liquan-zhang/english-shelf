<script>
const D = {"id": "084", "title": "Joining a Conversation at a Team Dinner", "meta": "B2 · 约 280 词 · 场景：团队聚餐", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Stuck at the End of the Table", "heading_zh": "1. 被困在桌子尽头", "rows": [[{"id": "s0_0_0", "md": "At team dinners, conversations split into small circles of three or four people.", "text": "At team dinners, conversations split into small circles of three or four people.", "zh": "团队聚餐的时候，聊天会分成三四个人一拨的小圈子。", "sp": null}, {"id": "s0_0_1", "md": "If you arrive late or sit at the end of the table, you can easily end up __on the outside__, nodding ==politely== for an hour.", "text": "If you arrive late or sit at the end of the table, you can easily end up on the outside, nodding politely for an hour.", "zh": "要是你来晚了，或者坐在桌子尽头，很容易就被晾在外面，礼貌性点头点一个小时。", "sp": null}], [{"id": "s0_1_0", "md": "Many people wait for a perfect gap before they speak.", "text": "Many people wait for a perfect gap before they speak.", "zh": "很多人想等一个完美的空当再开口。", "sp": null}, {"id": "s0_1_1", "md": "In a ==lively== group, that gap never comes, and the longer you wait, the harder it feels to __jump in__.", "text": "In a lively group, that gap never comes, and the longer you wait, the harder it feels to jump in.", "zh": "在聊得正热的一桌人里，这种空当根本不会出现，而且等得越久，越觉得插不进去。", "sp": null}, {"id": "s0_1_2", "md": "**Waiting for the perfect moment is the most reliable way to stay silent all night.**", "text": "Waiting for the perfect moment is the most reliable way to stay silent all night.", "zh": "等完美时机，是整晚一句话都说不上的最稳妥方式。", "sp": null}], [{"id": "s0_2_0", "md": "The good news is that you do not need a clever opening line.", "text": "The good news is that you do not need a clever opening line.", "zh": "好消息是，你不需要什么巧妙的开场白。", "sp": null}, {"id": "s0_2_1", "md": "Groups are usually happy to let someone in, as long as you join what they are already talking about instead of changing the ==subject==.", "text": "Groups are usually happy to let someone in, as long as you join what they are already talking about instead of changing the subject.", "zh": "大家一般都乐意让人加入，只要你接着他们正在聊的话题，而不是另起炉灶。", "sp": null}]]}, {"heading": "2. Listen First, Then Ask", "heading_zh": "2. 先听，再问", "rows": [[{"id": "s1_0_0", "md": "Start by listening for a minute to __get the gist__ of the conversation.", "text": "Start by listening for a minute to get the gist of the conversation.", "zh": "先听上一分钟，搞清楚大家在聊什么。", "sp": null}, {"id": "s1_0_1", "md": "Is it about a football match, a holiday, or the new office?", "text": "Is it about a football match, a holiday, or the new office?", "zh": "是在聊球赛、度假，还是新办公室？", "sp": null}], [{"id": "s1_1_0", "md": "Then join with a short question that __builds on__ what you just heard.", "text": "Then join with a short question that builds on what you just heard.", "zh": "然后用一个简短的问题接上你刚听到的内容。", "sp": null}, {"id": "s1_1_1", "md": "\"Wait, are you talking about the Japan trip? Which city did you like most?\"", "text": "\"Wait, are you talking about the Japan trip? Which city did you like most?\"", "zh": "「等下，你们说的是那次日本旅行吗？最喜欢哪个城市？」", "sp": null}, {"id": "s1_1_2", "md": "A question is the safest entry, because it puts the ==spotlight== on them, not on you.", "text": "A question is the safest entry, because it puts the spotlight on them, not on you.", "zh": "提问是最稳的切入方式，因为聚光灯打在他们身上，而不是你身上。", "sp": null}], [{"id": "s1_2_0", "md": "Use your body as well.", "text": "Use your body as well.", "zh": "肢体也要用上。", "sp": null}, {"id": "s1_2_1", "md": "Turn your chair toward the group, lean in a little, and react with small sounds like \"Really?\" or \"No way.\"", "text": "Turn your chair toward the group, lean in a little, and react with small sounds like \"Really?\" or \"No way.\"", "zh": "把椅子转向这群人，身体稍微前倾，用「真的假的？」「不会吧！」这种小反应接话。", "sp": null}, {"id": "s1_2_2", "md": "These ==signals== tell the group you are part of the circle, even before you say much.", "text": "These signals tell the group you are part of the circle, even before you say much.", "zh": "这些信号会告诉大家你已经是圈子里的一员了，哪怕你还没说几句。", "sp": null}], [{"id": "s1_3_0", "md": "**Once you are in, share one small story of your own, then pass the conversation back.**", "text": "Once you are in, share one small story of your own, then pass the conversation back.", "zh": "一旦加入进去，就分享一个自己的小故事，然后把话头递回去。", "sp": null}, {"id": "s1_3_1", "md": "If you see someone else sitting quietly, do them a favor and __bring them in__: \"Ravi, didn't you live in Osaka for a while?\"", "text": "If you see someone else sitting quietly, do them a favor and bring them in: \"Ravi, didn't you live in Osaka for a while?\"", "zh": "要是看到有人一直闷着不说话，帮他一把，把他拉进来：「Ravi，你是不是在大阪住过一阵子？」", "sp": null}, {"id": "s1_3_2", "md": "Being the person who includes others is a great way to become ==memorable== at any dinner.", "text": "Being the person who includes others is a great way to become memorable at any dinner.", "zh": "做那个把别人拉进来的人，是在任何饭局上让人记住你的好办法。", "sp": null}]]}], "gist": [{"q": "为什么等一个“完美时机”再开口行不通？", "a": "热闹的小圈子里根本不会出现完美空档，越等越难插话，最后整晚沉默。"}, {"q": "加入对话最安全的方式是什么？为什么？", "a": "先听一分钟弄清在聊什么，再用一个接着话题的小问题加入；提问把焦点放在对方身上，而不是自己。"}, {"q": "进入对话之后作者建议做什么？", "a": "讲一个自己的小故事再把话抛回去；看到有人沉默就把他拉进来，这样的人在聚餐上最让人记住。"}], "dictation": [{"id": "s0_1_2", "text": "Waiting for the perfect moment is the most reliable way to stay silent all night."}, {"id": "s1_1_2", "text": "A question is the safest entry, because it puts the spotlight on them, not on you."}, {"id": "s1_3_0", "text": "Once you are in, share one small story of your own, then pass the conversation back."}, {"id": "s1_2_0", "text": "Use your body as well."}], "shadow": {"text": "Then join with a short question that builds on what you just heard. \"Wait, are you talking about the Japan trip? Which city did you like most?\" A question is the safest entry, because it puts the spotlight on them, not on you.", "marked": "Then <b>join</b> with a short <b>question</b> / that builds on what you just <b>heard</b>. //<br>\"<b>Wait</b>, are you talking about the <b>Japan</b> trip? / Which <b>city</b> did you like <b>most</b>?\" //<br>A question is the <b>safest</b> entry, / because it puts the <b>spotlight</b> on <b>them</b>, / not on <b>you</b>. //"}, "prompts": [{"q": "团队聚餐，旁边三个同事在聊最近去巴厘岛的旅行，你一直没插上话。用“先听再提问”的方式加入，30 秒。", "ref": "Sorry, I couldn't help overhearing, you were in Bali last month? Which part did you stay in? I've only been once, years ago, and we spent most of the time in Ubud because it rained every day on the coast. Did you get lucky with the weather, or was it the same story?", "ref_zh": "不好意思，没忍住听到了，你们上个月去巴厘岛了？住的哪一块？我只去过一次，好多年前了，因为海边天天下雨，我们大部分时间都待在乌布。你们运气好碰上好天气了吗，还是也一样？", "id": "ref0"}, {"q": "聚餐时你注意到新来的印度同事一直没说话，大家正在聊美食。用一句话把他拉进对话，并接着聊几句。", "ref": "Speaking of spicy food, Arjun, you grew up in Chennai, right? I bet you think everything we've ordered tonight is pretty mild. What's the one dish from home you can't find here in Singapore? Okay, I'm writing that down. Maybe you can take us somewhere good next time, you choose the place.", "ref_zh": "说到辣的，Arjun，你是在金奈长大的对吧？我猜你觉得我们今晚点的这些都挺不辣的。有哪道家乡菜是你在新加坡找不到的？好，我记下来了。下次要不你带我们去个好地方，你来挑。", "id": "ref1"}], "words": [{"w": "politely", "ipa": "/pəˈlaɪtli/", "zh": "礼貌地、客气地", "ex": "He nodded politely, but I could tell he didn't agree.", "id": "w0"}, {"w": "lively", "ipa": "/ˈlaɪvli/", "zh": "热烈的、活跃的", "ex": "We had a lively discussion about the new pricing model.", "id": "w1"}, {"w": "subject", "ipa": "/ˈsʌbdʒɪkt/", "zh": "话题", "ex": "Let's not change the subject; we still need an owner for this bug.", "id": "w2"}, {"w": "spotlight", "ipa": "/ˈspɑːtˌlaɪt/", "zh": "焦点、聚光灯", "ex": "I'd rather put the spotlight on the team than on myself.", "id": "w3"}, {"w": "signal (n.)", "ipa": "/ˈsɪɡnəl/", "zh": "信号", "ex": "Turning your camera on is a small signal that you're engaged.", "tts_w": "signal", "id": "w4"}, {"w": "memorable", "ipa": "/ˈmemərəbəl/", "zh": "难忘的、容易被记住的", "ex": "Her demo was memorable because she told a user's story first.", "id": "w5"}, {"w": "gist", "ipa": const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;

  for (const k of kids) el.append(k);

const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
