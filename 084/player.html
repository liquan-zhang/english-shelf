<script>
const D = {"id": "084", "title": "Joining a Conversation at a Team Dinner", "meta": "B2 · 约 280 词 · 场景：团队聚餐", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Stuck at the End of the Table", "heading_zh": "1. 被困在桌子尽头", "rows": [[{"id": "s0_0_0", "md": "At team dinners, conversations split into small circles of three or four people.", "text": "At team dinners, conversations split into small circles of three or four people.", "zh": "团队聚餐的时候，聊天会分成三四个人一拨的小圈子。", "sp": null}, {"id": "s0_0_1", "md": "If you arrive late or sit at the end of the table, you can easily end up __on the outside__, nodding ==politely== for an hour.", "text": "If you arrive late or sit at the end of the table, you can easily end up on the outside, nodding politely for an hour.", "zh": "要是你来晚了，或者坐在桌子尽头，很容易就被晾在外面，礼貌性点头点一个小时。", "sp": null}], [{"id": "s0_1_0", "md": "Many people wait for a perfect gap before they speak.", "text": "Many people wait for a perfect gap before they speak.", "zh": "很多人想等一个完美的空当再开口。", "sp": null}, {"id": "s0_1_1", "md": "In a ==lively== group, that gap never comes, and the longer you wait, the harder it feels to __jump in__.", "text": "In a lively group, that gap never comes, and the longer you wait, the harder it feels to jump in.", "zh": "在聊得正热的一桌人里，这种空当根本不会出现，而且等得越久，越觉得插不进去。", "sp": null}, {"id": "s0_1_2", "md": "**Waiting for the perfect moment is the most reliable way to stay silent all night.**", "text": "Waiting for the perfect moment is the most reliable way to stay silent all night.", "zh": "等完美时机，是整晚一句话都说不上的最稳妥方式。", "sp": null}], [{"id": "s0_2_0", "md": "The good news is that you do not need a clever opening line.", "text": "The good news is that you do not need a clever opening line.", "zh": "好消息是，你不需要什么巧妙的开场白。", "sp": null}, {"id": "s0_2_1", "md": "Groups are usually happy to let someone in, as long as you join what they are already talking about instead of changing the ==subject==.", "text": "Groups are usually happy to let someone in, as long as you join what they are already talking about instead of changing the subject.", "zh": "大家一般都乐意让人加入，只要你接着他们正在聊的话题，而不是另起炉灶。", "sp": null}]]}, {"heading": "2. Listen First, Then Ask", "heading_zh": "2. 先听，再问", "rows": [[{"id": "s1_0_0", "md": "Start by listening for a minute to __get the gist__ of the conversation.", "text": "Start by listening for a minute to get the gist of the conversation.", "zh": "先听上一分钟，搞清楚大家在聊什么。", "sp": null}, {"id": "s1_0_1", "md": "Is it about a football match, a holiday, or the new office?", "text": "Is it about a football match, a holiday, or the new office?", "zh": "是在聊球赛、度假，还是新办公室？", "sp": null}], [{"id": "s1_1_0", "md": "Then join with a short question that __builds on__ what you just heard.", "text": "Then join with a short question that builds on what you just heard.", "zh": "然后用一个简短的问题接上你刚听到的内容。", "sp": null}, {"id": "s1_1_1", "md": "\"Wait, are you talking about the Japan trip? Which city did you like most?\"", "text": "\"Wait, are you talking about the Japan trip? Which city did you like most?\"", "zh": "「等下，你们说的是那次日本旅行吗？最喜欢哪个城市？」", "sp": null}, {"id": "s1_1_2", "md": "A question is the safest entry, because it puts the ==spotlight== on them, not on you.", "text": "A question is the safest entry, because it puts the spotlight on them, not on you.", "zh": "提问是最稳的切入方式，因为聚光灯打在他们身上，而不是你身上。", "sp": null}], [{"id": "s1_2_0", "md": "Use your body as well.", "text": "Use your body as well.", "zh": "肢体也要用上。", "sp": null}, {"id": "s1_2_1", "md": "Turn your chair toward the group, lean in a little, and react with small sounds like \"Really?\" or \"No way.\"", "text": "Turn your chair toward the group, lean in a little, and react with small sounds like \"Really?\" or \"No way.\"", "zh": "把椅子转向这群人，身体稍微前倾，用「真的假的？」「不会吧！」这种小反应接话。", "sp": null}, {"id": "s1_2_2", "md": "These ==signals== tell the group you are part of the circle, even before you say much.", "text": "These signals tell the group you are part of the circle, even before you say much.", "zh": "这些信号会告诉大家你已经是圈子里的一员了，哪怕你还没说几句。", "sp": null}], [{"id": "s1_3_0", "md": "**Once you are in, share one small story of your own, then pass the conversation back.**", "text": "Once you are in, share one small story of your own, then pass the conversation back.", "zh": "一旦加入进去，就分享一个自己的小故事，然后把话头递回去。", "sp": null}, {"id": "s1_3_1", "md": "If you see someone else sitting quietly, do them a favor and __bring them in__: \"Ravi, didn't you live in Osaka for a while?\"", "text": "If you see someone else sitting quietly, do them a favor and bring them in: \"Ravi, didn't you live in Osaka for a while?\"", "zh": "要是看到有人一直闷着不说话，帮他一把，把他拉进来：「Ravi，你是不是在大阪住过一阵子？」", "sp": null}, {"id": "s1_3_2", "md": "Being the person who includes others is a great way to become ==memorable== at any dinner.", "text": "Being the person who includes others is a great way to become memorable at any dinner.", "zh": "做那个把别人拉进来的人，是在任何饭局上让人记住你的好办法。", "sp": null}]]}], "gist": [{"q": "为什么等一个“完美时机”再开口行不通？", "a": "热闹的小圈子里根本不会出现完美空档，越等越难插话，最后整晚沉默。"}, {"q": "加入对话最安全的方式是什么？为什么？", "a": "先听一分钟弄清在聊什么，再用一个接着话题的小问题加入；提问把焦点放在对方身上，而不是自己。"}, {"q": "进入对话之后作者建议做什么？", "a": "讲一个自己的小故事再把话抛回去；看到有人沉默就把他拉进来，这样的人在聚餐上最让人记住。"}], "dictation": [{"id": "s0_1_2", "text": "Waiting for the perfect moment is the most reliable way to stay silent all night."}, {"id": "s1_1_2", "text": "A question is the safest entry, because it puts the spotlight on them, not on you."}, {"id": "s1_3_0", "text": "Once you are in, share one small story of your own, then pass the conversation back."}, {"id": "s1_2_0", "text": "Use your body as well."}], "shadow": {"text": "Then join with a short question that builds on what you just heard. \"Wait, are you talking about the Japan trip? Which city did you like most?\" A question is the safest entry, because it puts the spotlight on them, not on you.", "marked": "Then <b>join</b> with a short <b>question</b> / that builds on what you just <b>heard</b>. //<br>\"<b>Wait</b>, are you talking about the <b>Japan</b> trip? / Which <b>city</b> did you like <b>most</b>?\" //<br>A question is the <b>safest</b> entry, / because it puts the <b>spotlight</b> on <b>them</b>, / not on <b>you</b>. //"}, "prompts": [{"q": "团队聚餐，旁边三个同事在聊最近去巴厘岛的旅行，你一直没插上话。用“先听再提问”的方式加入，30 秒。", "ref": "Sorry, I couldn't help overhearing, you were in Bali last month? Which part did you stay in? I've only been once, years ago, and we spent most of the time in Ubud because it rained every day on the coast. Did you get lucky with the weather, or was it the same story?", "ref_zh": "不好意思，没忍住听到了，你们上个月去巴厘岛了？住的哪一块？我只去过一次，好多年前了，因为海边天天下雨，我们大部分时间都待在乌布。你们运气好碰上好天气了吗，还是也一样？", "id": "ref0"}, {"q": "聚餐时你注意到新来的印度同事一直没说话，大家正在聊美食。用一句话把他拉进对话，并接着聊几句。", "ref": "Speaking of spicy food, Arjun, you grew up in Chennai, right? I bet you think everything we've ordered tonight is pretty mild. What's the one dish from home you can't find here in Singapore? Okay, I'm writing that down. Maybe you can take us somewhere good next time, you choose the place.", "ref_zh": "说到辣的，Arjun，你是在金奈长大的对吧？我猜你觉得我们今晚点的这些都挺不辣的。有哪道家乡菜是你在新加坡找不到的？好，我记下来了。下次要不你带我们去个好地方，你来挑。", "id": "ref1"}], "words": [{"w": "politely", "ipa": "/pəˈlaɪtli/", "zh": "礼貌地、客气地", "ex": "He nodded politely, but I could tell he didn't agree.", "id": "w0"}, {"w": "lively", "ipa": "/ˈlaɪvli/", "zh": "热烈的、活跃的", "ex": "We had a lively discussion about the new pricing model.", "id": "w1"}, {"w": "subject", "ipa": "/ˈsʌbdʒɪkt/", "zh": "话题", "ex": "Let's not change the subject; we still need an owner for this bug.", "id": "w2"}, {"w": "spotlight", "ipa": "/ˈspɑːtˌlaɪt/", "zh": "焦点、聚光灯", "ex": "I'd rather put the spotlight on the team than on myself.", "id": "w3"}, {"w": "signal (n.)", "ipa": "/ˈsɪɡnəl/", "zh": "信号", "ex": "Turning your camera on is a small signal that you're engaged.", "tts_w": "signal", "id": "w4"}, {"w": "memorable", "ipa": "/ˈmemərəbəl/", "zh": "难忘的、容易被记住的", "ex": "Her demo was memorable because she told a user's story first.", "id": "w5"}, {"w": "gist", "ipa": const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
