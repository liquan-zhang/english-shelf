<script>
const D = {"id": "014", "title": "Presenting Numbers That People Remember", "meta": "B2 · 约 280 词 · 场景：数据汇报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Number Alone Means Nothing", "heading_zh": "1. 光有数字毫无意义", "rows": [[{"id": "s0_0_0", "md": "Here is a sentence from a real quarterly review.", "text": "Here is a sentence from a real quarterly review.", "zh": "这是一次真实的季度复盘里的一句话。", "sp": null}, {"id": "s0_0_1", "md": "\"We reduced P ninety-nine latency from eight hundred and forty milliseconds to six hundred and ten.\"", "text": "\"We reduced P ninety-nine latency from eight hundred and forty milliseconds to six hundred and ten.\"", "zh": "「我们把 P99 延迟从八百四十毫秒降到了六百一十毫秒。」", "sp": null}, {"id": "s0_0_2", "md": "It is accurate, it is impressive, and almost nobody in the room will remember it by lunch.", "text": "It is accurate, it is impressive, and almost nobody in the room will remember it by lunch.", "zh": "数据准确，成绩亮眼，但到午饭时间，屋里几乎没人还记得。", "sp": null}], [{"id": "s0_1_0", "md": "The problem is not the audience's attention span.", "text": "The problem is not the audience's attention span.", "zh": "问题不在于听众注意力不集中。", "sp": null}, {"id": "s0_1_1", "md": "A number by itself has no ==meaning== until people can compare it to something.", "text": "A number by itself has no meaning until people can compare it to something.", "zh": "一个数字本身没有意义，除非大家能拿它跟什么东西比一比。", "sp": null}, {"id": "s0_1_2", "md": "Is six hundred and ten good?", "text": "Is six hundred and ten good?", "zh": "六百一十算好吗？", "sp": null}, {"id": "s0_1_3", "md": "Is the drop big or small?", "text": "Is the drop big or small?", "zh": "这个降幅算大还是算小？", "sp": null}, {"id": "s0_1_4", "md": "Most listeners have no ==reference point==, so the number simply __slides past__ them.", "text": "Most listeners have no reference point, so the number simply slides past them.", "zh": "大多数听众没有参照物，所以这个数字就这么从他们耳边滑过去了。", "sp": null}], [{"id": "s0_2_0", "md": "**Your job is not to report numbers; it is to make them feel like something.**", "text": "Your job is not to report numbers; it is to make them feel like something.", "zh": "你的工作不是汇报数字，而是让数字有感觉。", "sp": null}, {"id": "s0_2_1", "md": "That takes three small habits, and none of them require ==fancy== charts.", "text": "That takes three small habits, and none of them require fancy charts.", "zh": "这需要三个小习惯，而且都用不着花哨的图表。", "sp": null}]]}, {"heading": "2. Round It, Compare It, Translate It", "heading_zh": "2. 取整、对比、换算", "rows": [[{"id": "s1_0_0", "md": "First, round ==aggressively==.", "text": "First, round aggressively.", "zh": "第一，大胆取整。", "sp": null}, {"id": "s1_0_1", "md": "\"About a third faster\" is easier to hold in your head than the exact figure.", "text": "\"About a third faster\" is easier to hold in your head than the exact figure.", "zh": "「快了大概三分之一」比精确数字好记得多。", "sp": null}, {"id": "s1_0_2", "md": "Put the precise number on the slide for those who want it, and say the simple one out loud.", "text": "Put the precise number on the slide for those who want it, and say the simple one out loud.", "zh": "精确数字放在幻灯片上给想看的人看，嘴上说简单的那个。", "sp": null}], [{"id": "s1_1_0", "md": "Second, always give a comparison.", "text": "Second, always give a comparison.", "zh": "第二，永远给一个对比。", "sp": null}, {"id": "s1_1_1", "md": "A comparison gives listeners a ruler to measure your number against.", "text": "A comparison gives listeners a ruler to measure your number against.", "zh": "对比给了听众一把尺子，用来衡量你的数字。", "sp": null}, {"id": "s1_1_2", "md": "Compare it to last quarter, to a ==competitor==, or to a goal everyone remembers.", "text": "Compare it to last quarter, to a competitor, or to a goal everyone remembers.", "zh": "跟上季度比，跟竞争对手比，或者跟一个大家都记得的目标比。", "sp": null}, {"id": "s1_1_3", "md": "\"We're now faster than our target for next year\" __tells a story__ in one line.", "text": "\"We're now faster than our target for next year\" tells a story in one line.", "zh": "「我们现在已经比明年的目标还快了」，一句话就讲了个故事。", "sp": null}], [{"id": "s1_2_0", "md": "Third, translate the number into human units.", "text": "Third, translate the number into human units.", "zh": "第三，把数字换算成人能感知的单位。", "sp": null}, {"id": "s1_2_1", "md": "Instead of \"saved twelve thousand compute hours,\" try \"saved the cost of two full-time engineers.\"", "text": "Instead of \"saved twelve thousand compute hours,\" try \"saved the cost of two full-time engineers.\"", "zh": "别说「省了一万两千个计算小时」，试试说「省下了两个全职工程师的成本」。", "sp": null}, {"id": "s1_2_2", "md": "Instead of \"point three percent error rate,\" try \"one failed payment for every three hundred customers.\"", "text": "Instead of \"point three percent error rate,\" try \"one failed payment for every three hundred customers.\"", "zh": "别说「错误率百分之零点三」，试试说「每三百个客户里有一笔支付失败」。", "sp": null}, {"id": "s1_2_3", "md": "**People forget percentages, but they remember people, money, and time.**", "text": "People forget percentages, but they remember people, money, and time.", "zh": "百分比人们会忘，但人、钱和时间他们记得住。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, choose one ==headline== number per slide, and __let the rest go__.", "text": "Finally, choose one headline number per slide, and let the rest go.", "zh": "最后，每页幻灯片只选一个核心数字，其余的都舍掉。", "sp": null}, {"id": "s1_3_1", "md": "If everything is highlighted, nothing is.", "text": "If everything is highlighted, nothing is.", "zh": "如果什么都高亮，就等于什么都没高亮。", "sp": null}, {"id": "s1_3_2", "md": "A clear number respects how people actually listen, which is once, quickly, and while thinking about something else.", "text": "A clear number respects how people actually listen, which is once, quickly, and while thinking about something else.", "zh": "一个清晰的数字，尊重的是人们真实的听法：只听一遍，听得很快，而且脑子里还想着别的事。", "sp": null}]]}], "gist": [{"q": "为什么作者说单独一个数字没有意义？", "a": "听众没有参照点，不知道这个数字是好是坏、变化是大是小，所以记不住。"}, {"q": "让数字被记住的三个习惯是什么？", "a": "大胆取整；一定给出对比（上季度、竞品、目标）；换算成人、钱、时间等直观单位。"}, {"q": "每页幻灯片的数字应该怎么安排？", "a": "只选一个主打数字，其余放下；全都强调等于什么都没强调。"}], "dictation": [{"id": "s0_2_0", "text": "Your job is not to report numbers; it is const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
