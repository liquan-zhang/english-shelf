const D = {"id": "014", "title": "Presenting Numbers That People Remember", "meta": "B2 · 约 280 词 · 场景：数据汇报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. A Number Alone Means Nothing", "heading_zh": "1. 光有数字毫无意义", "rows": [[{"id": "s0_0_0", "md": "Here is a sentence from a real quarterly review.", "text": "Here is a sentence from a real quarterly review.", "zh": "这是一次真实的季度复盘里的一句话。", "sp": null}, {"id": "s0_0_1", "md": "\"We reduced P ninety-nine latency from eight hundred and forty milliseconds to six hundred and ten.\"", "text": "\"We reduced P ninety-nine latency from eight hundred and forty milliseconds to six hundred and ten.\"", "zh": "「我们把 P99 延迟从八百四十毫秒降到了六百一十毫秒。」", "sp": null}, {"id": "s0_0_2", "md": "It is accurate, it is impressive, and almost nobody in the room will remember it by lunch.", "text": "It is accurate, it is impressive, and almost nobody in the room will remember it by lunch.", "zh": "数据准确，成绩亮眼，但到午饭时间，屋里几乎没人还记得。", "sp": null}], [{"id": "s0_1_0", "md": "The problem is not the audience's attention span.", "text": "The problem is not the audience's attention span.", "zh": "问题不在于听众注意力不集中。", "sp": null}, {"id": "s0_1_1", "md": "A number by itself has no ==meaning== until people can compare it to something.", "text": "A number by itself has no meaning until people can compare it to something.", "zh": "一个数字本身没有意义，除非大家能拿它跟什么东西比一比。", "sp": null}, {"id": "s0_1_2", "md": "Is six hundred and ten good?", "text": "Is six hundred and ten good?", "zh": "六百一十算好吗？", "sp": null}, {"id": "s0_1_3", "md": "Is the drop big or small?", "text": "Is the drop big or small?", "zh": "这个降幅算大还是算小？", "sp": null}, {"id": "s0_1_4", "md": "Most listeners have no ==reference point==, so the number simply __slides past__ them.", "text": "Most listeners have no reference point, so the number simply slides past them.", "zh": "大多数听众没有参照物，所以这个数字就这么从他们耳边滑过去了。", "sp": null}], [{"id": "s0_2_0", "md": "**Your job is not to report numbers; it is to make them feel like something.**", "text": "Your job is not to report numbers; it is to make them feel like something.", "zh": "你的工作不是汇报数字，而是让数字有感觉。", "sp": null}, {"id": "s0_2_1", "md": "That takes three small habits, and none of them require ==fancy== charts.", "text": "That takes three small habits, and none of them require fancy charts.", "zh": "这需要三个小习惯，而且都用不着花哨的图表。", "sp": null}]]}, {"heading": "2. Round It, Compare It, Translate It", "heading_zh": "2. 取整、对比、换算", "rows": [[{"id": "s1_0_0", "md": "First, round ==aggressively==.", "text": "First, round aggressively.", "zh": "第一，大胆取整。", "sp": null}, {"id": "s1_0_1", "md": "\"About a third faster\" is easier to hold in your head than the exact figure.", "text": "\"About a third faster\" is easier to hold in your head than the exact figure.", "zh": "「快了大概三分之一」比精确数字好记得多。", "sp": null}, {"id": "s1_0_2", "md": "Put the precise number on the slide for those who want it, and say the simple one out loud.", "text": "Put the precise number on the slide for those who want it, and say the simple one out loud.", "zh": "精确数字放在幻灯片上给想看的人看，嘴上说简单的那个。", "sp": null}], [{"id": "s1_1_0", "md": "Second, always give a comparison.", "text": "Second, always give a comparison.", "zh": "第二，永远给一个对比。", "sp": null}, {"id": "s1_1_1", "md": "A comparison gives listeners a ruler to measure your number against.", "text": "A comparison gives listeners a ruler to measure your number against.", "zh": "对比给了听众一把尺子，用来衡量你的数字。", "sp": null}, {"id": "s1_1_2", "md": "Compare it to last quarter, to a ==competitor==, or to a goal everyone remembers.", "text": "Compare it to last quarter, to a competitor, or to a goal everyone remembers.", "zh": "跟上季度比，跟竞争对手比，或者跟一个大家都记得的目标比。", "sp": null}, {"id": "s1_1_3", "md": "\"We're now faster than our target for next year\" __tells a story__ in one line.", "text": "\"We're now faster than our target for next year\" tells a story in one line.", "zh": "「我们现在已经比明年的目标还快了」，一句话就讲了个故事。", "sp": null}], [{"id": "s1_2_0", "md": "Third, translate the number into human units.", "text": "Third, translate the number into human units.", "zh": "第三，把数字换算成人能感知的单位。", "sp": null}, {"id": "s1_2_1", "md": "Instead of \"saved twelve thousand compute hours,\" try \"saved the cost of two full-time engineers.\"", "text": "Instead of \"saved twelve thousand compute hours,\" try \"saved the cost of two full-time engineers.\"", "zh": "别说「省了一万两千个计算小时」，试试说「省下了两个全职工程师的成本」。", "sp": null}, {"id": "s1_2_2", "md": "Instead of \"point three percent error rate,\" try \"one failed payment for every three hundred customers.\"", "text": "Instead of \"point three percent error rate,\" try \"one failed payment for every three hundred customers.\"", "zh": "别说「错误率百分之零点三」，试试说「每三百个客户里有一笔支付失败」。", "sp": null}, {"id": "s1_2_3", "md": "**People forget percentages, but they remember people, money, and time.**", "text": "People forget percentages, but they remember people, money, and time.", "zh": "百分比人们会忘，但人、钱和时间他们记得住。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, choose one ==headline== number per slide, and __let the rest go__.", "text": "Finally, choose one headline number per slide, and let the rest go.", "zh": "最后，每页幻灯片只选一个核心数字，其余的都舍掉。", "sp": null}, {"id": "s1_3_1", "md": "If everything is highlighted, nothing is.", "text": "If everything is highlighted, nothing is.", "zh": "如果什么都高亮，就等于什么都没高亮。", "sp": null}, {"id": "s1_3_2", "md": "A clear number respects how people actually listen, which is once, quickly, and while thinking about something else.", "text": "A clear number respects how people actually listen, which is once, quickly, and while thinking about something else.", "zh": "一个清晰的数字，尊重的是人们真实的听法：只听一遍，听得很快，而且脑子里还想着别的事。", "sp": null}]]}], "gist": [{"q": "为什么作者说单独一个数字没有意义？", "a": "听众没有参照点，不知道这个数字是好是坏、变化是大是小，所以记不住。"}, {"q": "让数字被记住的三个习惯是什么？", "a": "大胆取整；一定给出对比（上季度、竞品、目标）；换算成人、钱、时间等直观单位。"}, {"q": "每页幻灯片的数字应该怎么安排？", "a": "只选一个主打数字，其余放下；全都强调等于什么都没强调。"}], "dictation": [{"id": "s0_2_0", "text": "Your job is not to report numbers; it is to make them feel like something."}, {"id": "s1_2_3", "text": "People forget percentages, but they remember people, money, and time."}, {"id": "s0_1_1", "text": "A number by itself has no meaning until people can compare it to something."}, {"id": "s1_3_1", "text": "If everything is highlighted, nothing is."}], "shadow": {"text": "Third, translate the number into human units. Instead of \"saved twelve thousand compute hours,\" try \"saved the cost of two full-time engineers.\"", "marked": "<b>Third</b>, / translate the number / into <b>human</b> units. //<br>Instead of \"saved twelve thousand <b>compute</b> hours,\" / try \"saved the <b>cost</b> / of <b>two</b> full-time <b>engineers</b>.\" //"}, "prompts": [{"q": "季度汇报中，你要讲“崩溃率从百分之零点八降到百分之零点二”。用 30 秒把这个数字讲得让人记住：取整、对比、换算成人话。", "ref": "The headline for this quarter is stability. Our crash rate is now about a quarter of what it was in the spring. To put that in human terms, before, roughly one in every hundred and twenty sessions ended in a crash. Now it's one in five hundred. For a typical user who opens the app twice a day, that's going from a crash every two months to about one a year.", "ref_zh": "这个季度的关键词是稳定性。我们的崩溃率现在大约只有春天时的四分之一。换成人能感知的说法，以前大概每一百二十次会话就有一次崩溃。现在是五百次一次。对一个每天打开两次 app 的普通用户来说，就是从大概两个月崩一次，变成了一年崩一次左右。", "id": "ref0"}, {"q": "你要向管理层争取资源优化存储，说明“每月存储费用十五万美元，其中三成是无用日志”。用 30 秒把钱换算成大家有感觉的单位。", "ref": "Here's the number I want you to remember. About a third of our storage bill is old logs that nobody ever reads. That's roughly fifty thousand dollars a month, or the cost of a small team, spent on data we delete without looking. With about three weeks of cleanup work, we can get most of that back, every single month, from now on.", "ref_zh": "这是我希望大家记住的数字。我们存储账单里大约三分之一，是从来没人看的旧日志。这差不多是每个月五万美元，相当于一个小团队的成本，花在了我们看都不看就删掉的数据上。只要花大概三周做清理，从今往后每个月都能把其中大部分省回来。", "id": "ref1"}], "words": [{"w": "meaning", "ipa": "/ˈmiːnɪŋ/", "zh": "意义", "ex": "This metric has no meaning unless we compare it week over week.", "id": "w0"}, const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
