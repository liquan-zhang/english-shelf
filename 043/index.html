<script>
const D = {"id": "043", "title": "Negotiating Scope with Product Managers", "meta": "B2 · 约 280 词 · 场景：需求评审", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Scope Is a Trade, Not a Fight", "heading_zh": "1. 范围是交换，不是对抗", "rows": [[{"id": "s0_0_0", "md": "It is planning week, and the product manager walks in with twelve features for a six week cycle.", "text": "It is planning week, and the product manager walks in with twelve features for a six week cycle.", "zh": "到了规划周，产品经理带着十二个需求走进来，而这个周期只有六周。", "sp": null}, {"id": "s0_0_1", "md": "Your first instinct is to say, \"We can't do all of this.\"", "text": "Your first instinct is to say, \"We can't do all of this.\"", "zh": "你的第一反应是说：「这些我们做不完。」", "sp": null}, {"id": "s0_0_2", "md": "It is true, but it ends the conversation instead of starting one.", "text": "It is true, but it ends the conversation instead of starting one.", "zh": "这话没错，但它直接把对话聊死了，而不是开启对话。", "sp": null}], [{"id": "s0_1_0", "md": "A product manager hears \"can't\" as a ==verdict==.", "text": "A product manager hears \"can't\" as a verdict.", "zh": "产品经理听到「做不了」，会当成一个判决。", "sp": null}, {"id": "s0_1_1", "md": "They have already promised something to their boss, so now they feel cornered and start to __push back__ harder.", "text": "They have already promised something to their boss, so now they feel cornered and start to push back harder.", "zh": "他们已经跟老板承诺过了，所以这时候会觉得被逼到墙角，反推得更猛。", "sp": null}, {"id": "s0_1_2", "md": "Meanwhile, your team ends up with a vague ==commitment== to do \"as much as possible.\"", "text": "Meanwhile, your team ends up with a vague commitment to do \"as much as possible.\"", "zh": "与此同时，你的团队最后只得到一个含糊的承诺：「尽量多做」。", "sp": null}], [{"id": "s0_2_0", "md": "The better mindset is that scope is a trade.", "text": "The better mindset is that scope is a trade.", "zh": "更好的心态是：范围是一种交换。", "sp": null}, {"id": "s0_2_1", "md": "Time, people, and quality are fixed for this cycle, so the only real ==variable== is what goes in.", "text": "Time, people, and quality are fixed for this cycle, so the only real variable is what goes in.", "zh": "这个周期里时间、人力和质量都是定死的，所以唯一真正的变量是放进来什么。", "sp": null}, {"id": "s0_2_2", "md": "**Your job is not to say no to features; it is to make the trade-offs visible.**", "text": "Your job is not to say no to features; it is to make the trade-offs visible.", "zh": "你的工作不是对需求说不；而是把取舍摆到明面上。", "sp": null}]]}, {"heading": "2. Turning a Wish List into Choices", "heading_zh": "2. 把愿望清单变成选择题", "rows": [[{"id": "s1_0_0", "md": "Start by asking what problem the release is supposed to solve.", "text": "Start by asking what problem the release is supposed to solve.", "zh": "先问清楚这个版本到底要解决什么问题。", "sp": null}, {"id": "s1_0_1", "md": "Once you agree on the goal, many features suddenly look ==optional==.", "text": "Once you agree on the goal, many features suddenly look optional.", "zh": "目标一旦对齐，很多需求一下子就显得可有可无了。", "sp": null}, {"id": "s1_0_2", "md": "Then ask, \"What is the smallest version that would tell us if this works?\"", "text": "Then ask, \"What is the smallest version that would tell us if this works?\"", "zh": "然后再问：「能告诉我们这件事行不行的最小版本是什么？」", "sp": null}], [{"id": "s1_1_0", "md": "Next, put the list on the screen and __size each item__ roughly, in days, not hours.", "text": "Next, put the list on the screen and size each item roughly, in days, not hours.", "zh": "接下来，把清单投到屏幕上，给每一项粗估个工作量，按天算，不按小时。", "sp": null}, {"id": "s1_1_1", "md": "Draw a line where the capacity runs out.", "text": "Draw a line where the capacity runs out.", "zh": "在容量用完的地方画一条线。", "sp": null}, {"id": "s1_1_2", "md": "Now you are not refusing anything; you are asking the product manager to __rank the work__ above the line.", "text": "Now you are not refusing anything; you are asking the product manager to rank the work above the line.", "zh": "这时候你没有拒绝任何东西；你是在请产品经理给线以上的工作排优先级。", "sp": null}], [{"id": "s1_2_0", "md": "When they want to add something late, use the same ==framing==.", "text": "When they want to add something late, use the same framing.", "zh": "当他们后期想加东西时，用同样的说法。", "sp": null}, {"id": "s1_2_1", "md": "\"Sure, we can add the export feature. Which of these two should we move out to make room?\"", "text": "\"Sure, we can add the export feature. Which of these two should we move out to make room?\"", "zh": "「行，导出功能可以加。这两个里挪出去哪一个来腾位置？」", "sp": null}, {"id": "s1_2_2", "md": "**A new request should always come with a price tag.**", "text": "A new request should always come with a price tag.", "zh": "新需求永远都要带上价签。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __write down what was cut__ and share it after the meeting.", "text": "Finally, write down what was cut and share it after the meeting.", "zh": "最后，把砍掉的需求写下来，会后发给大家。", "sp": null}, {"id": "s1_3_1", "md": "Cut features have a way of quietly coming back two weeks later.", "text": "Cut features have a way of quietly coming back two weeks later.", "zh": "被砍掉的需求总会在两周后悄悄地又冒出来。", "sp": null}, {"id": "s1_3_2", "md": "A short written ==record== protects your team and keeps everyone honest about the plan.", "text": "A short written record protects your team and keeps everyone honest about the plan.", "zh": "一份简短的书面记录能保护你的团队，也让每个人对计划都诚实。", "sp": null}]]}], "gist": [{"q": "为什么直接说 \"We can't do all of this\" 不好？", "a": "它结束了对话；PM 听到的是判决，会觉得被逼到墙角而更强硬，团队最后只得到一个「尽量做」的模糊承诺。"}, {"q": "作者把范围谈判看成什么？", "a": "一场交换：时间、人力和质量固定，唯一的变量是放进什么；你的任务是让取舍可见，而不是拒绝需求。"}, {"q": "PM 中途要加需求时怎么回应？", "a": "可以加，但问他把哪一项挪出去腾位置；新需求必须带价签。会后把砍掉的内容写下来分享。"}], "dictation": [{"id": "s0_2_2", "text": "Your job is not to say no to features; it is to make the trade-offs visible."}, {"id": "s1_0_2", "text": "Then ask, \"What is the smallest version that would tell us if this works?\""}, {"id": "s1_2_2", "text": "A new request should always come with a price tag."}, {"id": "s1_3_1", "text": "Cut features have a way of quietly coming back two weeks later."}], "shadow": {"text": "Draw a line where the capacity runs out. Now you are not refusing anything; you are asking the product manager to rank the work above the line.", "marked": "Draw a <b>line</b> / where the <b>capacity</b> runs out. //<br>Now you are <b>not</b> refusing anything; / you are asking the product manager / to <b>rank</b> the work / <b>above</b> the line. //"}, "prompts": [{"q": "PM 在迭代中途要求加一个「数据导出」功能，并且不能延期。用 30 秒回应：不拒绝，但让他做取舍。", "ref": "I see why export matters, and we can build it. The catch is that our sprint is already full, so something has to move. Export is about four days of work. We could push back the settings redesign, or we could ship search filters with fewer options. Which one is less important to you for this release?", "ref_zh": "我理解导出功能很重要，我们也能做。问题是这个 sprint 已经排满了，所以得挪掉点什么。导出大概要四天工作量。我们可以把设置页改版往后推，或者搜索筛选先少做几个选项上线。对这个版本来说，你觉得哪个没那么重要？", "id": "ref0"}, {"q": "需求评审会上 PM 列了很多功能。用 30 秒引导大家先对齐目标，并提出做一个最小可验证版本。", "ref": "Before we go through the list, can we agree on what this release needs to prove? If the goal is to see whether sellers actually use bulk editing, then we probably don't need templates or undo in the first version. What's the smallest version that would answer that question? Let's build that first, look at the usage data, and then decide what to add next.", "ref_zh": "在过清单之前，我们能不能先对齐一下这个版本要验证什么？如果目标是看卖家到底会不会用批量编辑，那第一版大概不需要模板和撤销功能。能回答这个问题的最小版本是什么？我们先把它做出来，看看使用数据，再决定接下来加什么。", "id": "ref1"}], "words": [{"w": "verdict", "ipa": "/ˈvɜːrdɪkt/", "zh": "裁决、定论", "ex": "Don't treat my estimate as a final verdict; it's a starting point.", "id": "w0"}, {"w": "commitment", "ipa": "/kəˈmɪtmənt/", "zh": "承诺", "ex": "We can make a firm commitment on the first three items only.", "id": "w1"}, {"w": "variable", "ipa": "/ˈveriəbl/", "zh": "变量", "ex": "With the date fixed, scope is the only variable we control.", "id": "w2"}, {"w": "optional", "ipa": "/ˈɑːpʃənl/", "zh": "可选的", "ex": "Dark mode is optional for this release, so let's move it out.", "id": "w3"}, {"w": "framing", "ipa": "/ˈfreɪmɪŋ/", "zh": "表述框架、说法", "ex": "The framing matters: const h = (tag, attrs = {}, ...kids) => {

const player = new Audio();

const rate = () => parseFloat($('#speed').value);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
