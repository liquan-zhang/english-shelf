<script>
const D = {"id": "123", "type": "dialogue", "title": "Booking and Visiting the Dentist", "meta": "B2 · 约 300 词 · 场景：预约牙医与结账报销", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Dental Receptionist", "name_zh": "牙科前台", "voice": "en-GB-SoniaNeural"}}, "gist": [{"q": "「你」的牙是什么症状？最后约在什么时候？", "a": "左下牙平时没事，喝冷的就很疼；因为不想请假，约在周四晚上六点半。"}, {"q": "账单为什么比预期贵？保险报了多少？", "a": "包括问诊、两张片子和较贵的白色补牙材料，共三百四十块；保险报两百，自付一百四十。"}, {"q": "「你」结账时提了哪两个请求？", "a": "要一张明细收据找公司报销剩下的钱；洗牙推迟到下个月，约晚上。"}], "dictation": [{"id": "s0_3_0", "text": "It's fine most of the time, but it really hurts when I drink something cold."}, {"id": "s0_5_0", "text": "Do you have anything after six? I'd rather not take time off work."}, {"id": "s1_1_0", "text": "Oh, that's more than I expected. Could you walk me through the charges?"}, {"id": "s1_5_0", "text": "Could I get an itemised receipt? I'd like to claim the rest from my company."}], "shadow": {"speaker": "A", "text": "Could I get an itemised receipt? I'd like to claim the rest from my company.", "marked": "Could I get an <b>itemised</b> receipt? //<br>I'd like to <b>claim</b> the rest / from my <b>company</b>. //"}, "prompts": [{"q": "孩子第一次看牙医，你打电话预约。说明孩子年龄、问有没有儿童牙医、问周末时间和大概费用。", "ref": "Hi, I'd like to book a first dental checkup for my son. He's three and a half, and he's a bit nervous about doctors. Do you have a dentist who's good with young kids? We'd prefer a Saturday morning if possible. And roughly how much does a first visit cost?", "ref_zh": "你好，我想给我儿子约第一次牙科检查。他三岁半，有点怕看医生。你们有擅长看小孩的牙医吗？如果可以的话想约周六上午。第一次大概多少钱？", "id": "ref0"}, {"q": "牙医建议你做一个很贵的治疗。你想先了解有没有别的方案，并且不想今天就决定。", "ref": "Thanks for explaining. Before I decide, could you tell me if there are any other options? Maybe something less expensive, even if it doesn't last as long? I'd also like to check with my insurance first. Could you give me a written quote, and I'll call you back by the end of the week?", "ref_zh": "谢谢你的解释。在我决定之前，能告诉我还有没有其他方案吗？比如便宜一点的，哪怕没那么持久也行。我也想先问问保险公司。能给我一份书面报价吗？我这周末之前给你回电话。", "id": "ref1"}], "words": [{"w": "toothache", "ipa": "/ˈtuːθeɪk/", "zh": "牙疼", "ex": "I had a terrible toothache all weekend.", "id": "w0"}, {"w": "sensitivity", "ipa": "/ˌsensəˈtɪvəti/", "zh": "（牙齿）敏感", "ex": "This toothpaste helps with sensitivity to cold drinks.", "id": "w1"}, {"w": "cavity", "ipa": "/ˈkævəti/", "zh": "蛀牙，龋洞", "ex": "Too many sweets can give kids cavities.", "id": "w2"}, {"w": "emergency", "ipa": "/ɪˈmɜːrdʒənsi/", "zh": "紧急情况，急诊", "ex": "Call this number only in an emergency.", "id": "w3"}, {"w": "filling", "ipa": "/ˈfɪlɪŋ/", "zh": "补牙；补牙材料", "ex": "One of my old fillings fell out last night.", "id": "w4"}, {"w": "balance", "ipa": "/ˈbæləns/", "zh": "余额，差额", "ex": "You can pay the balance when you pick it up.", "id": "w5"}, {"w": "treatment notes", "ipa": "/ˈtriːtmənt noʊts/", "zh": "治疗记录", "ex": "The insurer asked for a copy of the treatment notes.", "id": "w6"}, {"w": "scaling", "ipa": "/ˈskeɪlɪŋ/", "zh": "洗牙（刮牙石）", "ex": "I get a scaling and polish every six months.", "id": "w7"}, {"w": "itemised", "ipa": "/ˈaɪtəmaɪzd/", "zh": "逐项列明的", "ex": "Could you send me an itemised bill?", "id": "w8"}, {"w": "hold off on", "ipa": "/hoʊld ɔːf ɑːn/", "zh": "推迟，先不做", "ex": "Let's hold off on buying a car until next year.", "id": "w9"}], "sections": [{"heading": "1. Booking on the Phone", "heading_zh": "1. 电话预约", "rows": [[{"id": "s0_0_0", "md": "Good morning, Bright Smile Dental. How can I help?", "text": "Good morning, Bright Smile Dental. How can I help?", "zh": "早上好，这里是亮笑牙科。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, I'd like to __book an appointment__. I've got a ==toothache== on the lower left side.", "text": "Hi, I'd like to book an appointment. I've got a toothache on the lower left side.", "zh": "你好，我想预约一下。我左下边的牙疼。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sorry to hear that. Is the pain constant, or only when you eat something?", "text": "Sorry to hear that. Is the pain constant, or only when you eat something?", "zh": "真遗憾。是一直疼，还是只在吃东西的时候疼？", "sp": "B"}], [{"id": "s0_3_0", "md": "**It's fine most of the time, but it really hurts when I drink something cold.**", "text": "It's fine most of the time, but it really hurts when I drink something cold.", "zh": "大部分时间没事，但一喝冷的就特别疼。", "sp": "A"}], [{"id": "s0_4_0", "md": "That could be ==sensitivity== or a small ==cavity==. Doctor Tan has a slot tomorrow at eleven fifteen.", "text": "That could be sensitivity or a small cavity. Doctor Tan has a slot tomorrow at eleven fifteen.", "zh": "可能是牙齿敏感，也可能是有个小蛀牙。陈医生明天十一点一刻有空。", "sp": "B"}], [{"id": "s0_5_0", "md": "Do you have anything after six? I'd rather not __take time off__ work.", "text": "Do you have anything after six? I'd rather not take time off work.", "zh": "六点以后有吗？我不太想请假。", "sp": "A"}], [{"id": "s0_6_0", "md": "Our latest slot is six thirty on Thursday. Would that suit you?", "text": "Our latest slot is six thirty on Thursday. Would that suit you?", "zh": "我们最晚的号是周四六点半。您看行吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Thursday works. Roughly how much is a checkup, and do you take insurance?", "text": "Thursday works. Roughly how much is a checkup, and do you take insurance?", "zh": "周四可以。检查大概多少钱？你们接受保险吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "A consultation and X ray is about one hundred and twenty dollars. We can bill some insurers directly, so please bring your card.", "text": "A consultation and X ray is about one hundred and twenty dollars. We can bill some insurers directly, so please bring your card.", "zh": "问诊加拍片大约一百二十块。部分保险公司我们可以直接结算，所以请带上保险卡。", "sp": "B"}], [{"id": "s0_9_0", "md": "Will do. And what if the pain gets worse before then?", "text": "Will do. And what if the pain gets worse before then?", "zh": "好的。那如果在那之前疼得更厉害了呢？", "sp": "A"}], [{"id": "s0_10_0", "md": "Just call us. We keep a few ==emergency== slots every morning.", "text": "Just call us. We keep a few emergency slots every morning.", "zh": "直接给我们打电话。我们每天早上都留了几个急诊号。", "sp": "B"}]]}, {"heading": "2. Paying After Treatment", "heading_zh": "2. 治疗后结账", "rows": [[{"id": "s1_0_0", "md": "So Doctor Tan did one ==filling== today. The total comes to three hundred and forty dollars.", "text": "So Doctor Tan did one filling today. The total comes to three hundred and forty dollars.", "zh": "陈医生今天给您补了一颗牙。一共三百四十块。", "sp": "B"}], [{"id": "s1_1_0", "md": "Oh, that's more than I expected. Could you __walk me through__ the charges?", "text": "Oh, that's more than I expected. Could you walk me through the charges?", "zh": "哦，比我想的贵。能给我讲讲都收了哪些费用吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Of course. It's the consultation, two X rays, and a white filling, which costs more than a silver one.", "text": "Of course. It's the consultation, two X rays, and a white filling, which costs more than a silver one.", "zh": "当然。有问诊费、两张片子，还有一个白色补牙材料，比银色的贵一些。", "sp": "B"}], [{"id": "s1_3_0", "md": "I see. Does my insurance cover the filling, or just the checkup?", "text": "I see. Does my insurance cover the filling, or just the checkup?", "zh": "明白了。我的保险报补牙吗，还是只报检查？", "sp": "A"}], [{"id": "s1_4_0", "md": "Your plan covers basic fillings up to two hundred dollars a year. You'd pay the ==balance== of one hundred and forty.", "text": "Your plan covers basic fillings up to two hundred dollars a year. You'd pay the balance of one hundred and forty.", "zh": "您的保险每年最多报两百块的基础补牙。剩下的一百四十块需要您自付。", "sp": "B"}], [{"id": "s1_5_0", "md": "**Could I get an itemised receipt? I'd like to claim the rest from my company.**", "text": "Could I get an itemised receipt? I'd like to claim the rest from my company.", "zh": "能给我开一张明细收据吗？剩下的我想找公司报销。", "sp": "A"}], [{"id": "s1_6_0", "md": "No problem. I'll email it to you along with the ==treatment notes==.", "text": "No problem. I'll email it to you along with the treatment notes.", "zh": "没问题。我连同治疗记录一起发到您邮箱。", "sp": "B"}], [{"id": "s1_7_0", "md": "Thanks. The dentist also mentioned a ==scaling== and polish. Can I __hold of const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
