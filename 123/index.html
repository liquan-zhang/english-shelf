<script>
const D = {"id": "123", "type": "dialogue", "title": "Booking and Visiting the Dentist", "meta": "B2 · 约 300 词 · 场景：预约牙医与结账报销", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Dental Receptionist", "name_zh": "牙科前台", "voice": "en-GB-SoniaNeural"}}, "gist": [{"q": "「你」的牙是什么症状？最后约在什么时候？", "a": "左下牙平时没事，喝冷的就很疼；因为不想请假，约在周四晚上六点半。"}, {"q": "账单为什么比预期贵？保险报了多少？", "a": "包括问诊、两张片子和较贵的白色补牙材料，共三百四十块；保险报两百，自付一百四十。"}, {"q": "「你」结账时提了哪两个请求？", "a": "要一张明细收据找公司报销剩下的钱；洗牙推迟到下个月，约晚上。"}], "dictation": [{"id": "s0_3_0", "text": "It's fine most of the time, but it really hurts when I drink something cold."}, {"id": "s0_5_0", "text": "Do you have anything after six? I'd rather not take time off work."}, {"id": "s1_1_0", "text": "Oh, that's more than I expected. Could you walk me through the charges?"}, {"id": "s1_5_0", "text": "Could I get an itemised receipt? I'd like to claim the rest from my company."}], "shadow": {"speaker": "A", "text": "Could I get an itemised receipt? I'd like to claim the rest from my company.", "marked": "Could I get an <b>itemised</b> receipt? //<br>I'd like to <b>claim</b> the rest / from my <b>company</b>. //"}, "prompts": [{"q": "孩子第一次看牙医，你打电话预约。说明孩子年龄、问有没有儿童牙医、问周末时间和大概费用。", "ref": "Hi, I'd like to book a first dental checkup for my son. He's three and a half, and he's a bit nervous about doctors. Do you have a dentist who's good with young kids? We'd prefer a Saturday morning if possible. And roughly how much does a first visit cost?", "ref_zh": "你好，我想给我儿子约第一次牙科检查。他三岁半，有点怕看医生。你们有擅长看小孩的牙医吗？如果可以的话想约周六上午。第一次大概多少钱？", "id": "ref0"}, {"q": "牙医建议你做一个很贵的治疗。你想先了解有没有别的方案，并且不想今天就决定。", "ref": "Thanks for explaining. Before I decide, could you tell me if there are any other options? Maybe something less expensive, even if it doesn't last as long? I'd also like to check with my insurance first. Could you give me a written quote, and I'll call you back by the end of the week?", "ref_zh": "谢谢你的解释。在我决定之前，能告诉我还有没有其他方案吗？比如便宜一点的，哪怕没那么持久也行。我也想先问问保险公司。能给我一份书面报价吗？我这周末之前给你回电话。", "id": "ref1"}], "words": [{"w": "toothache", "ipa": "/ˈtuːθeɪk/", "zh": "牙疼", "ex": "I had a terrible toothache all weekend.", "id": "w0"}, {"w": "sensitivity", "ipa": "/ˌsensəˈtɪvəti/", "zh": "（牙齿）敏感", "ex": "This toothpaste helps with sensitivity to cold drinks.", "id": "w1"}, {"w": "cavity", "ipa": "/ˈkævəti/", "zh": "蛀牙，龋洞", "ex": "Too many sweets can give kids cavities.", "id": "w2"}, {"w": "emergency", "ipa": "/ɪˈmɜːrdʒənsi/", "zh": "紧急情况，急诊", "ex": "Call this number only in an emergency.", "id": "w3"}, {"w": "filling", "ipa": "/ˈfɪlɪŋ/", "zh": "补牙；补牙材料", "ex": "One of my old fillings fell out last night.", "id": "w4"}, {"w": "balance", "ipa": "/ˈbæləns/", "zh": "余额，差额", "ex": "You can pay the balance when you pick it up.", "id": "w5"}, {"w": "treatment notes", "ipa": "/ˈtriːtmənt noʊts/", "zh": "治疗记录", "ex": "The insurer asked for a copy of the treatment notes.", "id": "w6"}, {"w": "scaling", "ipa": "/ˈskeɪlɪŋ/", "zh": "洗牙（刮牙石）", "ex": "I get a scaling and polish every six months.", "id": "w7"}, {"w": "itemised", "ipa": "/ˈaɪtəmaɪzd/", "zh": "逐项列明的", "ex": "Could you send me an itemised bill?", "id": "w8"}, {"w": "hold off on", "ipa": "/hoʊld ɔːf ɑːn/", "zh": "推迟，先不做", "ex": "Let's hold off on buying a car until next year.", "id": "w9"}], "sections": [{"heading": "1. Booking on the Phone", "heading_zh": "1. 电话预约", "rows": [[{"id": "s0_0_0", "md": "Good morning, Bright Smile Dental. How can I help?", "text": "Good morning, Bright Smile Dental. How can I help?", "zh": "早上好，这里是亮笑牙科。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, I'd like to __book an appointment__. I've got a ==toothache== on the lower left side.", "text": "Hi, I'd like to book an appointment. I've got a toothache on the lower left side.", "zh": "你好，我想预约一下。我左下边的牙疼。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sorry to hear that. Is the pain constant, or only when you eat something?", "text": "Sorry to hear that. Is the pain constant, or only when you eat something?", "zh": "真遗憾。是一直疼，还是只在吃东西的时候疼？", "sp": "B"}], [{"id": "s0_3_0", "md": "**It's fine most of the time, but it really hurts when I drink something cold.**", "text": "It's fine most of the time, but it really hurts when I drink something cold.", "zh": "大部分时间没事，但一喝冷的就特别疼。", "sp": "A"}], [{"id": "s0_4_0", "md": "That could be ==sensitivity== or a small ==cavity==. Doctor Tan has a slot tomorrow at eleven fifteen.", "text": "That could be sensitivity or a small cavity. Doctor Tan has a slot tomorrow at eleven fifteen.", "zh": "可能是牙齿敏感，也可能是有个小蛀牙。陈医生明天十一点一刻有空。", "sp": "B"}], [{"id": "s0_5_0", "md": "Do you have anything after six? I'd rather not __take time off__ work.", "text": "Do you have anything after six? I'd rather not take time off work.", "zh": "六点以后有吗？我不太想请假。", "sp": "A"}], [{"id": "s0_6_0", "md": "Our latest slot is six thirty on Thursday. Would that suit you?", "text": "Our latest slot is six thirty on Thursday. Would that suit you?", "zh": "我们最晚的号是周四六点半。您看行吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Thursday works. Roughly how much is a checkup, and do you take insurance?", "text": "Thursday works. Roughly how much is a checkup, and do you take insurance?", "zh": "周四可以。检查大概多少钱？你们接受保险吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "A consultation and X ray is about one hundred and twenty dollars. We can bill some insurers directly, so please bring your card.", "text": "A consultation and X ray is about one hundred and twenty dollars. We can bill some insurers directly, so please bring your card.", "zh": "问诊加拍片大约一百二十块。部分保险公司我们可以直接结算，所以请带上保险卡。", "sp": "B"}], [{"id": "s0_9_0", "md": "Will do. And what if the pain gets worse before then?", "text": "Will do. And what if the pain gets worse before then?", "zh": "好的。那如果在那之前疼得更厉害了呢？", "sp": "A"}], [{"id": "s0_10_0", "md": "Just call us. We keep a few ==emergency== slots every morning.", "text": "Just call us. We keep a few emergency slots every morning.", "zh": "直接给我们打电话。我们每天早上都留了几个急诊号。", "sp": "B"}]]}, {"heading": "2. Paying After Treatment", "heading_zh": "2. 治疗后结账", "rows": [[{"id": "s1_0_0", "md": "So Doctor Tan did one ==filling== today. The total comes to three hundred and forty dollars.", "text": "So Doctor Tan did one filling today. The total comes to three hundred and forty dollars.", "zh": "陈医生今天给您补了一颗牙。一共三百四十块。", "sp": "B"}], [{"id": "s1_1_0", "md": "Oh, that's more than I expected. Could you __walk me through__ the charges?", "text": "Oh, that's more than I expected. Could you walk me through the charges?", "zh": "哦，比我想的贵。能给我讲讲都收了哪些费用吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Of course. It's the consultation, two X rays, and a white filling, which costs more than a silver one.", "text": "Of course. It's the consultation, two X rays, and a white filling, which costs more than a silver one.", "zh": "当然。有问诊费、两张片子，还有一个白色补牙材料，比银色的贵一些。", "sp": "B"}], [{"id": "s1_3_0", "md": "I see. Does my insurance cover the filling, or just the checkup?", "text": "I see. Does my insurance cover the filling, or just the checkup?", "zh": "明白了。我的保险报补牙吗，还是只报检查？", "sp": "A"}], [{"id": "s1_4_0", "md": "Your plan covers basic fillings up to two hundred dollars a year. You'd pay the ==balance== of one hundred and forty.", "text": "Your plan covers basic fillings up to two hundred dollars a year. You'd pay the balance of one hundred and forty.", "zh": "您的保险每年最多报两百块的基础补牙。剩下的一百四十块需要您自付。", "sp": "B"}], [{"id": "s1_5_0", "md": "**Could I get an itemised receipt? I'd like to claim the rest from my company.**", "text": "Could I get an itemised receipt? I'd like to claim the rest from my company.", "zh": "能给我开一张明细收据吗？剩下的我想找公司报销。", "sp": "A"}], [{"id": "s1_6_0", "md": "No problem. I'll email it to you along with the ==treatment notes==.", "text": "No problem. I'll email it to you along with the treatment notes.", "zh": "没问题。我连同治疗记录一起发到您邮箱。", "sp": "B"}], [{"id": "s1_7_0", "md": "Thanks. The dentist also mentioned a ==scaling== and polish. Can I __hold of const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
