<script>
const D = {"id": "010", "title": "Handling the Person Who Talks Too Much", "meta": "B2 · 约 270 词 · 场景：平衡发言", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. It Is a Format Problem", "heading_zh": "1. 这是形式问题", "rows": [[{"id": "s0_0_0", "md": "Every team has one.", "text": "Every team has one.", "zh": "每个团队都有这么一位。", "sp": null}, {"id": "s0_0_1", "md": "A smart, ==enthusiastic== person who answers every question first, and then answers it again in more detail.", "text": "A smart, enthusiastic person who answers every question first, and then answers it again in more detail.", "zh": "一个聪明、热情的人，每个问题都抢先回答，然后再展开细节回答一遍。", "sp": null}, {"id": "s0_0_2", "md": "Meanwhile, the quiet engineer who actually wrote the code says nothing for the whole hour.", "text": "Meanwhile, the quiet engineer who actually wrote the code says nothing for the whole hour.", "zh": "与此同时，真正写代码的那个安静的工程师，整整一个小时一句话都没说。", "sp": null}], [{"id": "s0_1_0", "md": "It is tempting to see this as a ==personality== problem.", "text": "It is tempting to see this as a personality problem.", "zh": "人很容易把这看成性格问题。", "sp": null}, {"id": "s0_1_1", "md": "But in most cases, the talker is not trying to ==dominate==.", "text": "But in most cases, the talker is not trying to dominate.", "zh": "但大多数情况下，话多的人并不是想压人一头。", "sp": null}, {"id": "s0_1_2", "md": "They are simply quick to speak, and an open discussion rewards whoever speaks fastest.", "text": "They are simply quick to speak, and an open discussion rewards whoever speaks fastest.", "zh": "他们只是嘴快，而开放式讨论天然奖励说得最快的人。", "sp": null}, {"id": "s0_1_3", "md": "**When the format rewards speed, you will always hear from the same people.**", "text": "When the format rewards speed, you will always hear from the same people.", "zh": "只要形式奖励速度，你听到的永远是那几个人的声音。", "sp": null}], [{"id": "s0_2_0", "md": "That is good news for you as a manager.", "text": "That is good news for you as a manager.", "zh": "对管理者来说，这其实是个好消息。", "sp": null}, {"id": "s0_2_1", "md": "You do not need to change anyone's character.", "text": "You do not need to change anyone's character.", "zh": "你不需要改变任何人的性格。", "sp": null}, {"id": "s0_2_2", "md": "You only need to __change the rules of the room__.", "text": "You only need to change the rules of the room.", "zh": "你只需要改一改会上的规则。", "sp": null}]]}, {"heading": "2. Small Changes to the Rules", "heading_zh": "2. 对规则做些小调整", "rows": [[{"id": "s1_0_0", "md": "Try giving everyone two minutes to write their ideas down before anyone speaks.", "text": "Try giving everyone two minutes to write their ideas down before anyone speaks.", "zh": "试试在任何人发言之前，给每个人两分钟把想法写下来。", "sp": null}, {"id": "s1_0_1", "md": "Then go around the table, or the video grid, in a fixed order.", "text": "Then go around the table, or the video grid, in a fixed order.", "zh": "然后按固定顺序，绕桌子一圈，或者按视频画面的顺序轮流说。", "sp": null}, {"id": "s1_0_2", "md": "The fast thinker still contributes, but everyone else gets a fair ==turn==.", "text": "The fast thinker still contributes, but everyone else gets a fair turn.", "zh": "反应快的人照样能贡献想法，但其他人也都有了公平的机会。", "sp": null}], [{"id": "s1_1_0", "md": "You can also invite specific people by name, with a question they can answer.", "text": "You can also invite specific people by name, with a question they can answer.", "zh": "你也可以点名邀请某个人，抛给他一个他答得上来的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"Kenji, you built the retry logic, what worries you about this design?\"", "text": "\"Kenji, you built the retry logic, what worries you about this design?\"", "zh": "「Kenji，重试逻辑是你写的，这个设计里你最担心什么？」", "sp": null}, {"id": "s1_1_2", "md": "A direct, concrete question is much easier to answer than \"Does anyone else have thoughts?\"", "text": "A direct, concrete question is much easier to answer than \"Does anyone else have thoughts?\"", "zh": "一个直接、具体的问题，比「其他人还有想法吗？」好回答得多。", "sp": null}], [{"id": "s1_2_0", "md": "When the talker starts a third long comment, ==redirect== gently.", "text": "When the talker starts a third long comment, redirect gently.", "zh": "当话多的人开始第三段长篇发言时，温和地把话头转开。", "sp": null}, {"id": "s1_2_1", "md": "\"Thanks, Mark, let's __hear from a few others__ before we come back to you.\"", "text": "\"Thanks, Mark, let's hear from a few others before we come back to you.\"", "zh": "「谢谢 Mark，我们先听听其他几位的，再回到你这儿。」", "sp": null}], [{"id": "s1_3_0", "md": "Finally, have a private chat, framed as asking for help.", "text": "Finally, have a private chat, framed as asking for help.", "zh": "最后，找他私下聊一聊，以请他帮忙的方式来说。", "sp": null}, {"id": "s1_3_1", "md": "\"You always __get the ball rolling__, and I'd love your help drawing the quieter people in.\"", "text": "\"You always get the ball rolling, and I'd love your help drawing the quieter people in.\"", "zh": "「每次都是你把讨论带起来的，我很希望你能帮我把那些比较安静的同学也拉进来。」", "sp": null}, {"id": "s1_3_2", "md": "**Most talkers are happy to step back once they see it as a new role, not as ==criticism== of their style.**", "text": "Most talkers are happy to step back once they see it as a new role, not as criticism of their style.", "zh": "大多数话多的人一旦把这看作一个新角色，而不是对自己风格的批评，都很乐意往后退一步。", "sp": null}, {"id": "s1_3_3", "md": "Some even become your best ally for running ==inclusive== meetings.", "text": "Some even become your best ally for running inclusive meetings.", "zh": "有些人甚至会成为你组织包容性会议的最佳盟友。", "sp": null}]]}], "gist": [{"q": "作者认为“有人一直说”本质上是什么问题？", "a": "不是性格问题，而是会议形式问题：开放讨论奖励说得最快的人。"}, {"q": "作者建议怎样调整会议规则？", "a": "先让大家写两分钟再发言并按顺序轮流；点名并给具体问题；对方第三次长篇发言时温和转向他人。"}, {"q": "私下和话多的人沟通时，作者建议怎么说？", "a": "以请他帮忙的方式，请他带动安静的人发言，让他把这看作新角色而不是批评。"}], "dictation": [{"id": "s0_1_3", "text": "When the format rewards speed, you will always hear from the same people."}, {"id": "s1_3_2", "text": "Most talkers are happy to step back once they see it as a new role, not as criticism of their style."}, {"id": "s0_2_1", "text": "You do not need to change anyone's character."}, {"id": "s1_0_1", "text": "Then go around the table, or the video grid, in a fixed order."}], "shadow": {"text": "When the talker starts a third long comment, redirect gently. \"Thanks, Mark, let's hear from a few others before we come back to you.\"", "marked": "When the talker starts a <b>third</b> long comment, / redirect <b>gently</b>. //<br>\"<b>Thanks</b>, Mark, / let's hear from a few <b>others</b> / before we come <b>back</b> to you.\" //"}, "prompts": [{"q": "设计评审会上，一位资深同事已经发言很多次，而负责实现的新人一直没说话。用 30 秒温和地转向，邀请新人具体回答一个问题。", "ref": "Thanks, Raj, that's really helpful. Let me pause there for a second, because I want to make sure we hear from everyone. Lin, you wrote most of the sync logic, so you know it better than anyone. If we switch to this new design, which part of your code would be the hardest to change? Take your time.", "ref_zh": "谢谢 Raj，这个很有帮助。我先在这儿停一下，因为我想确保每个人都能发言。Lin，同步逻辑大部分是你写的，你比谁都清楚。如果我们换成这个新设计，你代码里哪部分最难改？不着急，慢慢想。", "id": "ref0"}, {"q": "会后你私下和那位总是抢先发言的同事聊，用 30 秒把“少说一点”包装成请他帮忙。", "ref": "Hey, do you have a minute? First, I really appreciate how you always get the discussion going, it saves us a lot of awkward silence. I'd like your help with something. Some of the newer folks hardly speak in reviews, and I think they have good ideas. Next time, could you try asking one of them for their view before sharing yours? You'd be great at drawing them in.", "ref_zh": "嘿，你有一分钟吗？首先，真的很感谢你每次都能把讨论带起来，帮我们省掉了不少尴尬的冷场。我想请你帮个忙。有些新来的同学在评审会上几乎不说话，但我觉得他们是有好想法的。下次你能不能先问问他们中的某个人怎么看，再说你自己的？你很擅长把人带进来。", "id": "ref1"}], "words": [{"w": "enthusiastic", "ipa": "/ɪnˌθuːziˈæstɪk/", "zh": "热情的、积极的", "ex": "The team is enthusiastic about moving to the new framework.", "id": "w0"}, {"w": "personality", "ipa": "/ˌpɜːrsəˈnæləti/", "zh": "性格、个性", "ex": "This isn't about personality; the process is just unclear.", "id": "w1"}, {"w": "dominate", "ipa": "/ˈdɑːmɪˌneɪt/", "zh": "主导、支配", "ex": "One noisy customer shouldn't dominate the roadmap.", "id": "w2"}, {"w": "turn (n.)", "ipa": "/tɜːrn/", "zh": "轮次、机会", "ex": "Everyone gets a turn to demo at the end of the sprint.", "tts_w": "turn", "id": "w3"}, {"w": "redire const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress

function step(id, name, time, how, body) {

  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
