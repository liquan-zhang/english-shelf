<script>
const D = {"id": "010", "title": "Handling the Person Who Talks Too Much", "meta": "B2 · 约 270 词 · 场景：平衡发言", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. It Is a Format Problem", "heading_zh": "1. 这是形式问题", "rows": [[{"id": "s0_0_0", "md": "Every team has one.", "text": "Every team has one.", "zh": "每个团队都有这么一位。", "sp": null}, {"id": "s0_0_1", "md": "A smart, ==enthusiastic== person who answers every question first, and then answers it again in more detail.", "text": "A smart, enthusiastic person who answers every question first, and then answers it again in more detail.", "zh": "一个聪明、热情的人，每个问题都抢先回答，然后再展开细节回答一遍。", "sp": null}, {"id": "s0_0_2", "md": "Meanwhile, the quiet engineer who actually wrote the code says nothing for the whole hour.", "text": "Meanwhile, the quiet engineer who actually wrote the code says nothing for the whole hour.", "zh": "与此同时，真正写代码的那个安静的工程师，整整一个小时一句话都没说。", "sp": null}], [{"id": "s0_1_0", "md": "It is tempting to see this as a ==personality== problem.", "text": "It is tempting to see this as a personality problem.", "zh": "人很容易把这看成性格问题。", "sp": null}, {"id": "s0_1_1", "md": "But in most cases, the talker is not trying to ==dominate==.", "text": "But in most cases, the talker is not trying to dominate.", "zh": "但大多数情况下，话多的人并不是想压人一头。", "sp": null}, {"id": "s0_1_2", "md": "They are simply quick to speak, and an open discussion rewards whoever speaks fastest.", "text": "They are simply quick to speak, and an open discussion rewards whoever speaks fastest.", "zh": "他们只是嘴快，而开放式讨论天然奖励说得最快的人。", "sp": null}, {"id": "s0_1_3", "md": "**When the format rewards speed, you will always hear from the same people.**", "text": "When the format rewards speed, you will always hear from the same people.", "zh": "只要形式奖励速度，你听到的永远是那几个人的声音。", "sp": null}], [{"id": "s0_2_0", "md": "That is good news for you as a manager.", "text": "That is good news for you as a manager.", "zh": "对管理者来说，这其实是个好消息。", "sp": null}, {"id": "s0_2_1", "md": "You do not need to change anyone's character.", "text": "You do not need to change anyone's character.", "zh": "你不需要改变任何人的性格。", "sp": null}, {"id": "s0_2_2", "md": "You only need to __change the rules of the room__.", "text": "You only need to change the rules of the room.", "zh": "你只需要改一改会上的规则。", "sp": null}]]}, {"heading": "2. Small Changes to the Rules", "heading_zh": "2. 对规则做些小调整", "rows": [[{"id": "s1_0_0", "md": "Try giving everyone two minutes to write their ideas down before anyone speaks.", "text": "Try giving everyone two minutes to write their ideas down before anyone speaks.", "zh": "试试在任何人发言之前，给每个人两分钟把想法写下来。", "sp": null}, {"id": "s1_0_1", "md": "Then go around the table, or the video grid, in a fixed order.", "text": "Then go around the table, or the video grid, in a fixed order.", "zh": "然后按固定顺序，绕桌子一圈，或者按视频画面的顺序轮流说。", "sp": null}, {"id": "s1_0_2", "md": "The fast thinker still contributes, but everyone else gets a fair ==turn==.", "text": "The fast thinker still contributes, but everyone else gets a fair turn.", "zh": "反应快的人照样能贡献想法，但其他人也都有了公平的机会。", "sp": null}], [{"id": "s1_1_0", "md": "You can also invite specific people by name, with a question they can answer.", "text": "You can also invite specific people by name, with a question they can answer.", "zh": "你也可以点名邀请某个人，抛给他一个他答得上来的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"Kenji, you built the retry logic, what worries you about this design?\"", "text": "\"Kenji, you built the retry logic, what worries you about this design?\"", "zh": "「Kenji，重试逻辑是你写的，这个设计里你最担心什么？」", "sp": null}, {"id": "s1_1_2", "md": "A direct, concrete question is much easier to answer than \"Does anyone else have thoughts?\"", "text": "A direct, concrete question is much easier to answer than \"Does anyone else have thoughts?\"", "zh": "一个直接、具体的问题，比「其他人还有想法吗？」好回答得多。", "sp": null}], [{"id": "s1_2_0", "md": "When the talker starts a third long comment, ==redirect== gently.", "text": "When the talker starts a third long comment, redirect gently.", "zh": "当话多的人开始第三段长篇发言时，温和地把话头转开。", "sp": null}, {"id": "s1_2_1", "md": "\"Thanks, Mark, let's __hear from a few others__ before we come back to you.\"", "text": "\"Thanks, Mark, let's hear from a few others before we come back to you.\"", "zh": "「谢谢 Mark，我们先听听其他几位的，再回到你这儿。」", "sp": null}], [{"id": "s1_3_0", "md": "Finally, have a private chat, framed as asking for help.", "text": "Finally, have a private chat, framed as asking for help.", "zh": "最后，找他私下聊一聊，以请他帮忙的方式来说。", "sp": null}, {"id": "s1_3_1", "md": "\"You always __get the ball rolling__, and I'd love your help drawing the quieter people in.\"", "text": "\"You always get the ball rolling, and I'd love your help drawing the quieter people in.\"", "zh": "「每次都是你把讨论带起来的，我很希望你能帮我把那些比较安静的同学也拉进来。」", "sp": null}, {"id": "s1_3_2", "md": "**Most talkers are happy to step back once they see it as a new role, not as ==criticism== of their style.**", "text": "Most talkers are happy to step back once they see it as a new role, not as criticism of their style.", "zh": "大多数话多的人一旦把这看作一个新角色，而不是对自己风格的批评，都很乐意往后退一步。", "sp": null}, {"id": "s1_3_3", "md": "Some even become your best ally for running ==inclusive== meetings.", "text": "Some even become your best ally for running inclusive meetings.", "zh": "有些人甚至会成为你组织包容性会议的最佳盟友。", "sp": null}]]}], "gist": [{"q": "作者认为“有人一直说”本质上是什么问题？", "a": "不是性格问题，而是会议形式问题：开放讨论奖励说得最快的人。"}, {"q": "作者建议怎样调整会议规则？", "a": "先让大家写两分钟再发言并按顺序轮流；点名并给具体问题；对方第三次长篇发言时温和转向他人。"}, {"q": "私下和话多的人沟通时，作者建议怎么说？", "a": "以请他帮忙的方式，请他带动安静的人发言，让他把这看作新角色而不是批评。"}], "dictation": [{"id": "s0_1_3", "text": "When the format rewards speed, you will always hear from the same people."}, {"id": "s1_3_2", "text": "Most talkers are happy to step back once they see it as a new role, not as criticism of their style."}, {"id": "s0_2_1", "text": "You do not need to change anyone's character."}, {"id": "s1_0_1", "text": "Then go around the table, or the video grid, in a fixed order."}], "shadow": {"text": "When the talker starts a third long comment, redirect gently. \"Thanks, Mark, let's hear from a few others before we come back to you.\"", "marked": "When the talker starts a <b>third</b> long comment, / redirect <b>gently</b>. //<br>\"<b>Thanks</b>, Mark, / let's hear from a few <b>others</b> / before we come <b>back</b> to you.\" //"}, "prompts": [{"q": "设计评审会上，一位资深同事已经发言很多次，而负责实现的新人一直没说话。用 30 秒温和地转向，邀请新人具体回答一个问题。", "ref": "Thanks, Raj, that's really helpful. Let me pause there for a second, because I want to make sure we hear from everyone. Lin, you wrote most of the sync logic, so you know it better than anyone. If we switch to this new design, which part of your code would be the hardest to change? Take your time.", "ref_zh": "谢谢 Raj，这个很有帮助。我先在这儿停一下，因为我想确保每个人都能发言。Lin，同步逻辑大部分是你写的，你比谁都清楚。如果我们换成这个新设计，你代码里哪部分最难改？不着急，慢慢想。", "id": "ref0"}, {"q": "会后你私下和那位总是抢先发言的同事聊，用 30 秒把“少说一点”包装成请他帮忙。", "ref": "Hey, do you have a minute? First, I really appreciate how you always get the discussion going, it saves us a lot of awkward silence. I'd like your help with something. Some of the newer folks hardly speak in reviews, and I think they have good ideas. Next time, could you try asking one of them for their view before sharing yours? You'd be great at drawing them in.", "ref_zh": "嘿，你有一分钟吗？首先，真的很感谢你每次都能把讨论带起来，帮我们省掉了不少尴尬的冷场。我想请你帮个忙。有些新来的同学在评审会上几乎不说话，但我觉得他们是有好想法的。下次你能不能先问问他们中的某个人怎么看，再说你自己的？你很擅长把人带进来。", "id": "ref1"}], "words": [{"w": "enthusiastic", "ipa": "/ɪnˌθuːziˈæstɪk/", "zh": "热情的、积极的", "ex": "The team is enthusiastic about moving to the new framework.", "id": "w0"}, {"w": "personality", "ipa": "/ˌpɜːrsəˈnæləti/", "zh": "性格、个性", "ex": "This isn't about personality; the process is just unclear.", "id": "w1"}, {"w": "dominate", "ipa": "/ˈdɑːmɪˌneɪt/", "zh": "主导、支配", "ex": "One noisy customer shouldn't dominate the roadmap.", "id": "w2"}, {"w": "turn (n.)", "ipa": "/tɜːrn/", "zh": "轮次、机会", "ex": "Everyone gets a turn to demo at the end of the sprint.", "tts_w": "turn", "id": "w3"}, {"w": "redire 84], [90.997, 91.339], [91.352, 91.576], [91.589, 91.707], [91.72, 92.023], [92.036, 92.194], [92.207, 92.339], [92.352, 92.378], [92.391, 92.668], [92.681, 93.063], [93.484, 93.628], [93.641, 93.734], [93.747, 94.339], [94.352, 94.431], [94.444, 94.589], [94.602, 95.102]]}, {"kind": "s", "id": "s1_3_3", "md": "Some even become your best ally for running ==inclusive== meetings.", "zh": "有些人甚至会成为你组织包容性会议的最佳盟友。", "sp": null, "gap": false, "start": 95.496, "end": 99.936, "words": [[95.601, 95.799], [95.917, 96.154], [96.167, 96.535], [96.549, 96.693], [96.707, 97.088], [97.101, 97.509], [97.522, 97.799], [97.812, 98.246], [98.338, 98.957], [98.97, 99.535]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
