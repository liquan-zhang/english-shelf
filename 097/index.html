<script>
const D = {"id": "097", "title": "Checking Understanding Without Sounding Rude", "meta": "B2 · 约 280 词 · 场景：确认对方理解", "voice": "en-AU-WilliamMultilingualNeural", "rate": "-5%", "sections": [{"heading": "1. The Trouble with \"Does That Make Sense?\"", "heading_zh": "1. 「这样说清楚吗？」的问题", "rows": [[{"id": "s0_0_0", "md": "At the end of a briefing, most managers ask, \"Does that make sense?\"", "text": "At the end of a briefing, most managers ask, \"Does that make sense?\"", "zh": "讲完一件事，大多数经理都会问一句：「这样说清楚吗？」", "sp": null}, {"id": "s0_0_1", "md": "Almost everyone says yes.", "text": "Almost everyone says yes.", "zh": "几乎所有人都会说清楚。", "sp": null}, {"id": "s0_0_2", "md": "A week later, half the team has built something ==subtly== different from what you asked for.", "text": "A week later, half the team has built something subtly different from what you asked for.", "zh": "一周后，一半的人做出来的东西都和你要的有点微妙的不一样。", "sp": null}], [{"id": "s0_1_0", "md": "The question is the problem.", "text": "The question is the problem.", "zh": "问题出在这个问法上。", "sp": null}, {"id": "s0_1_1", "md": "Answering no in front of colleagues can make people ==lose face==, especially someone new or someone working in a second language.", "text": "Answering no in front of colleagues can make people lose face, especially someone new or someone working in a second language.", "zh": "当着同事的面说「不清楚」，会让人觉得丢面子，尤其是新人或者用第二语言工作的人。", "sp": null}, {"id": "s0_1_2", "md": "\"Do you understand?\" is even worse, because it can sound ==condescending==, as if you doubt their ability.", "text": "\"Do you understand?\" is even worse, because it can sound condescending, as if you doubt their ability.", "zh": "「你听懂了吗？」就更糟了，因为听起来有点居高临下，好像你在怀疑他们的能力。", "sp": null}], [{"id": "s0_2_0", "md": "**A yes to \"Does that make sense?\" usually means \"I heard you,\" not \"I can do it.\"**", "text": "A yes to \"Does that make sense?\" usually means \"I heard you,\" not \"I can do it.\"", "zh": "对「这样说清楚吗？」回答「清楚」，通常意思是「我听到了」，而不是「我能做」。", "sp": null}, {"id": "s0_2_1", "md": "To check real understanding, you need questions that ask people to use the information, not just agree with it.", "text": "To check real understanding, you need questions that ask people to use the information, not just agree with it.", "zh": "要确认对方真的理解了，你需要问那种让人用上这些信息的问题，而不只是让人点头同意。", "sp": null}, {"id": "s0_2_2", "md": "That is a much better test of what has actually landed.", "text": "That is a much better test of what has actually landed.", "zh": "这才能更好地检验信息到底有没有传到位。", "sp": null}]]}, {"heading": "2. Put the Burden on Yourself", "heading_zh": "2. 把责任揽到自己身上", "rows": [[{"id": "s1_0_0", "md": "First, take ==ownership== of the explanation.", "text": "First, take ownership of the explanation.", "zh": "第一，把讲解的责任揽到自己身上。", "sp": null}, {"id": "s1_0_1", "md": "\"I went through that quickly, so let me check I explained it well\" sounds very different from \"Did you get that?\"", "text": "\"I went through that quickly, so let me check I explained it well\" sounds very different from \"Did you get that?\"", "zh": "「刚才我讲得有点快，我确认一下自己有没有讲清楚」，听起来和「你听懂了吗？」完全不一样。", "sp": null}, {"id": "s1_0_2", "md": "Now any gap is your fault, not theirs, and people feel free to __speak up__.", "text": "Now any gap is your fault, not theirs, and people feel free to speak up.", "zh": "这样一来，有任何没对齐的地方都是你的问题，不是他们的，大家也就敢开口了。", "sp": null}], [{"id": "s1_1_0", "md": "Second, ask about the first step.", "text": "Second, ask about the first step.", "zh": "第二，问第一步打算做什么。", "sp": null}, {"id": "s1_1_1", "md": "\"So what's the first thing you'll do on Monday?\" tells you much more than a yes or a no.", "text": "\"So what's the first thing you'll do on Monday?\" tells you much more than a yes or a no.", "zh": "「那你周一第一件事打算做什么？」能告诉你的东西，比一个「是」或「不是」多得多。", "sp": null}, {"id": "s1_1_2", "md": "If the answer is ==off track==, you can correct it gently right away, before anyone has written a line of code.", "text": "If the answer is off track, you can correct it gently right away, before anyone has written a line of code.", "zh": "如果回答跑偏了，你可以当场温和地纠正，赶在任何人写下一行代码之前。", "sp": null}], [{"id": "s1_2_0", "md": "Third, invite a ==recap==, but make it ==collaborative==.", "text": "Third, invite a recap, but make it collaborative.", "zh": "第三，请大家一起复述，但要做成协作的样子。", "sp": null}, {"id": "s1_2_1", "md": "\"Can we quickly __sum up__ the next steps together, so I can put them in the notes?\"", "text": "\"Can we quickly sum up the next steps together, so I can put them in the notes?\"", "zh": "「我们快速一起过一下下一步，我好记到纪要里？」", "sp": null}, {"id": "s1_2_2", "md": "**When the recap has a practical purpose, nobody feels tested.**", "text": "When the recap has a practical purpose, nobody feels tested.", "zh": "复述有了实际用途，就没人会觉得自己在被考。", "sp": null}], [{"id": "s1_3_0", "md": "These questions take an extra minute.", "text": "These questions take an extra minute.", "zh": "这些问题会多花一分钟。", "sp": null}, {"id": "s1_3_1", "md": "But they turn a polite yes into a real check, and they __save everyone from__ a painful surprise later.", "text": "But they turn a polite yes into a real check, and they save everyone from a painful surprise later.", "zh": "但它们能把一句客气的「清楚」变成一次真正的确认，也能让大家免于之后一个难受的意外。", "sp": null}, {"id": "s1_3_2", "md": "Over a quarter, that minute pays for itself many times over.", "text": "Over a quarter, that minute pays for itself many times over.", "zh": "放到一个季度来看，这一分钟能回本好多倍。", "sp": null}]]}], "gist": [{"q": "为什么问 \"Does that make sense?\" 往往得不到真实答案？", "a": "当众说不懂会觉得丢面子，尤其是新人或用第二语言工作的人；这里的 yes 通常只代表“听到了”，不代表“能做到”。"}, {"q": "作者说要“把负担放在自己身上”，具体怎么说？", "a": "说“我讲得有点快，确认一下我讲清楚没有”，把没懂归为自己没讲好，而不是对方没听懂。"}, {"q": "除此之外还有哪两个确认方法？", "a": "问对方第一步要做什么；邀请一起总结下一步，并给出实际用途（写进会议记录），这样没人觉得被考。"}], "dictation": [{"id": "s0_1_0", "text": "The question is the problem."}, {"id": "s1_0_0", "text": "First, take ownership of the explanation."}, {"id": "s1_1_0", "text": "Second, ask about the first step."}, {"id": "s1_2_2", "text": "When the recap has a practical purpose, nobody feels tested."}], "shadow": {"text": "First, take ownership of the explanation. \"I went through that quickly, so let me check I explained it well\" sounds very different from \"Did you get that?\" Now any gap is your fault, not theirs, and people feel free to speak up.", "marked": "First, take <b>ownership</b> / of the <b>explanation</b>. //<br>\"I went through that <b>quickly</b>, / so let me check / I explained it <b>well</b>\" / sounds very <b>different</b> / from \"Did you <b>get</b> that?\" //<br>Now any gap is <b>your</b> fault, / not <b>theirs</b>, / and people feel free to speak <b>up</b>. //"}, "prompts": [{"q": "你刚给新加坡的外包团队讲完一个复杂的接口变更。不问 Does that make sense，而是确认他们真的理解了，30 秒。", "ref": "Okay, I covered a lot there, and I went through the last part quite fast, so let me check I explained it clearly. Siti, if you were starting on this tomorrow, what would be the first change you'd make? Great, that's exactly right. And Ken, which endpoint do you think will need the most testing? Let's put both answers in the notes.", "ref_zh": "好，刚才讲的内容挺多，最后一部分我讲得也比较快，我确认一下自己有没有讲清楚。Siti，如果你明天开始做这个，第一个要改的是什么？很好，完全正确。Ken，你觉得哪个接口最需要重点测试？我们把这两个回答都记到纪要里。", "id": "ref0"}, {"q": "一对一时你给下属布置了一个跨团队任务，想确认他理解了优先级，但不想显得不信任他。", "ref": "Before we wrap up, can we sum up the plan together? I want to make sure my notes are right. What do you see as the top priority this week, and who do you need to talk to first? Perfect. One small thing, the payments team is busy until Wednesday, so maybe start with the data team instead.", "ref_zh": "结束之前，我们一起过一下计划？我想确认我的笔记没记错。你觉得这周最高优先级是什么，第一个要找谁聊？完美。还有个小事，支付团队周三之前都很忙，所以可以先从数据团队那边开始。", "id": "ref1"}], "words": [{"w": "subtly", "ipa": "/ˈsʌtli/", "zh": "微妙地、细微地", "ex": "The two specs are subtly different, which caused the bug.", "id": "w0"}, {"w": "lose face", "ipa": "/luːz feɪs/", "zh": "丢面子", "ex": "He didn't want to lose face by admitting the estimate was wrong.", "id": "w1"}, {"w": "condescending", "ipa": "/ˌkɑːndɪˈsendɪŋ/", "zh": "居高临下的、高人一等的", "ex": "Explaining basics to a senior engineer const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

}

// progress

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
