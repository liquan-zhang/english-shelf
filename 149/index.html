const D = {"id": "149", "type": "dialogue", "title": "Booking a Repair Technician", "meta": "B2 · 约 310 词 · 场景：预约空调维修与报价", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Service Coordinator", "name_zh": "维修客服", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "空调出了什么问题？客服初步判断是什么原因？", "a": "卧室空调漏水、制冷不好，持续一周了；可能是排水管堵了，或者需要化学清洗。"}, {"q": "上门费怎么收？「你」提了什么要求？", "a": "检查费四十块，决定维修就免；「你」要求动工前先报价，没同意不能开工。"}, {"q": "对三百八十块的报价，「你」最后怎么砍的？", "a": "请对方拆开费用，问清补冷媒不着急就先不做；签年度保养合约让化学清洗打八折，最后只做排水管和化学清洗，享受九十天保修。"}], "dictation": [{"id": "s0_1_0", "text": "Hi. The aircon in our bedroom is leaking water, and it's not cooling properly."}, {"id": "s0_9_0", "text": "Could the technician give me a quote before starting any work?"}, {"id": "s1_2_0", "text": "That's a lot more than I expected. Could you break it down for me?"}, {"id": "s1_4_0", "text": "The unit's only three years old. Is the gas top-up really necessary right now?"}], "shadow": {"speaker": "A", "text": "The unit's only three years old. Is the gas top-up really necessary right now?", "marked": "The unit's only <b>three</b> years old. //<br>Is the <b>gas top-up</b> / <b>really</b> necessary / right <b>now</b>? //"}, "prompts": [{"q": "家里的洗衣机坏了，打电话约维修。用 30 秒说清：什么问题、希望的时间、问上门费和是否先报价。", "ref": "Hi, our washing machine stopped working this morning. It fills with water, but the drum won't spin, and it's showing an error code. Could someone come and take a look this week, ideally on a weekday evening or Saturday morning? How much is the call-out fee? And could the technician give me a quote before doing any repairs?", "ref_zh": "你好，我家洗衣机今天早上坏了。能进水，但滚筒不转，还显示一个错误代码。这周能派人来看看吗？最好是工作日晚上或者周六上午。上门费多少？技术员修之前能先给我报价吗？", "id": "ref0"}, {"q": "维修师傅说热水器要整个换掉，报价很高。你想先拿第二个意见，礼貌地暂缓。", "ref": "Thanks for checking it so carefully. That's a bigger job than I expected, so I'd like to think it over before I decide. Could you write down the quote and what exactly needs replacing? I'll talk to my landlord first, since it might be covered. I'm happy to pay today's inspection fee, of course.", "ref_zh": "谢谢你检查得这么仔细。这比我预想的工程大，我想先考虑一下再决定。能把报价和具体要换什么写下来给我吗？我先跟房东商量一下，可能由他承担。今天的检查费我当然照付。", "id": "ref1"}], "words": [{"w": "blocked", "ipa": "/blɑːkt/", "zh": "堵塞的", "ex": "The kitchen sink is blocked again.", "id": "w0"}, {"w": "chemical wash", "ipa": "/ˈkemɪkəl wɑːʃ/", "zh": "（空调）化学清洗", "ex": "Our aircon needs a chemical wash once a year.", "id": "w1"}, {"w": "call-out fee", "ipa": "/ˈkɔːl aʊt fiː/", "zh": "上门费", "ex": "The plumber charges a call-out fee even if he can't fix it.", "id": "w2"}, {"w": "inspection", "ipa": "/ɪnˈspekʃən/", "zh": "检查", "ex": "The landlord wants to do an inspection before we move out.", "id": "w3"}, {"w": "top-up", "ipa": "/ˈtɑːp ʌp/", "zh": "补充；充值", "ex": "I need to top up my EZ-Link card.", "id": "w4"}, {"w": "pressure", "ipa": "/ˈpreʃər/", "zh": "压力，气压", "ex": "The water pressure in the shower is really weak.", "id": "w5"}, {"w": "servicing", "ipa": "/ˈsɜːrvɪsɪŋ/", "zh": "定期保养", "ex": "The car is due for servicing next month.", "id": "w6"}, {"w": "contract", "ipa": "/ˈkɑːntrækt/", "zh": "合约", "ex": "We signed a one-year cleaning contract.", "tts": "We signed a one-year cleaning contract.", "id": "w7"}, {"w": "warranty", "ipa": "/ˈwɔːrənti/", "zh": "保修", "ex": "Is the fridge still under warranty?", "id": "w8"}, {"w": "quote (n.)", "ipa": "/kwoʊt/", "zh": "报价", "ex": "We got three quotes before choosing a mover.", "tts_w": "quote", "id": "w9"}], "sections": [{"heading": "1. Booking the Visit", "heading_zh": "1. 预约上门", "rows": [[{"id": "s0_0_0", "md": "Good morning, CoolAir Services. How can I help you?", "text": "Good morning, CoolAir Services. How can I help you?", "zh": "早上好，CoolAir 空调服务。请问有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi. The aircon in our bedroom is leaking water, and it's not cooling properly.**", "text": "Hi. The aircon in our bedroom is leaking water, and it's not cooling properly.", "zh": "你好。我们卧室的空调在漏水，制冷也不太好。", "sp": "A"}], [{"id": "s0_2_0", "md": "I'm sorry to hear that. How long has it been like this?", "text": "I'm sorry to hear that. How long has it been like this?", "zh": "很抱歉。这种情况多久了？", "sp": "B"}], [{"id": "s0_3_0", "md": "About a week. Water keeps dripping onto the floor, especially at night.", "text": "About a week. Water keeps dripping onto the floor, especially at night.", "zh": "大概一个星期了。水一直往地板上滴，晚上尤其严重。", "sp": "A"}], [{"id": "s0_4_0", "md": "It sounds like a ==blocked== drain pipe, or it may need a ==chemical== wash. When would you like the technician to come?", "text": "It sounds like a blocked drain pipe, or it may need a chemical wash. When would you like the technician to come?", "zh": "听起来像是排水管堵了，也可能需要做化学清洗。您希望技术员什么时候上门？", "sp": "B"}], [{"id": "s0_5_0", "md": "__As soon as possible__, really. Do you have anything this Saturday?", "text": "As soon as possible, really. Do you have anything this Saturday?", "zh": "越快越好。这周六有空档吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "Saturday we have a slot between two and four in the afternoon.", "text": "Saturday we have a slot between two and four in the afternoon.", "zh": "周六下午两点到四点有一个时段。", "sp": "B"}], [{"id": "s0_7_0", "md": "That works. How much is the ==call-out== fee?", "text": "That works. How much is the call-out fee?", "zh": "可以。上门费是多少？", "sp": "A"}], [{"id": "s0_8_0", "md": "It's forty dollars for the ==inspection==, but it's waived if you go ahead with the repair.", "text": "It's forty dollars for the inspection, but it's waived if you go ahead with the repair.", "zh": "检查费四十块，如果您决定维修就免掉。", "sp": "B"}], [{"id": "s0_9_0", "md": "**Could the technician give me a quote before starting any work?**", "text": "Could the technician give me a quote before starting any work?", "zh": "技术员能在动工前先给我报个价吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Yes, of course. Nothing will be done without your approval.", "text": "Yes, of course. Nothing will be done without your approval.", "zh": "当然可以。没有您的同意，什么都不会动。", "sp": "B"}]]}, {"heading": "2. The Quote Seems High", "heading_zh": "2. 报价有点高", "rows": [[{"id": "s1_0_0", "md": "Hi, I'm calling about the quote your technician gave me this afternoon. It's three hundred and eighty dollars.", "text": "Hi, I'm calling about the quote your technician gave me this afternoon. It's three hundred and eighty dollars.", "zh": "你好，我打电话是想问一下你们技术员今天下午给的报价，三百八十块。", "sp": "A"}], [{"id": "s1_1_0", "md": "Let me pull it up. It includes a chemical wash, a gas ==top-up==, and a new drain pipe.", "text": "Let me pull it up. It includes a chemical wash, a gas top-up, and a new drain pipe.", "zh": "我调出来看看。里面包括化学清洗、补充冷媒，还有换一根新的排水管。", "sp": "B"}], [{"id": "s1_2_0", "md": "That's a lot more than I expected. __Could you break it down__ for me?", "text": "That's a lot more than I expected. Could you break it down for me?", "zh": "这比我预想的高不少。能帮我拆开讲讲各项费用吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "Sure. The chemical wash is one hundred and fifty, the gas is one hundred and twenty, and the pipe is one hundred and ten.", "text": "Sure. The chemical wash is one hundred and fifty, the gas is one hundred and twenty, and the pipe is one hundred and ten.", "zh": "好的。化学清洗一百五，冷媒一百二，排水管一百一。", "sp": "B"}], [{"id": "s1_4_0", "md": "**The unit's only three years old. Is the gas top-up really necessary right now?**", "text": "The unit's only three years old. Is the gas top-up really necessary right now?", "zh": "这台空调才用了三年。补冷媒现在真的有必要吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "The technician noted the ==pressure== was a bit low, but it's not urgent. You could leave it for now.", "text": "The technician noted the pressure was a bit low, but it's not urgent. You could leave it for now.", "zh": "技术员记录说压力有点低，但不着急，可以先不做。", "sp": "B"}], [{"id": "s1_6_0", "md": "Then let's skip the gas for now. And if I sign up for your yearly ==servicing== package, __is there a discount__?", "text": "Then let's skip the gas for now. And if I sign up for your yearly servicing package, const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
</html>
