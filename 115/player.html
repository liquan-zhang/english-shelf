<script>
const D = {"id": "115", "type": "dialogue", "title": "Asking the Bartender for Something Non-Alcoholic", "meta": "B2 · 约 240 词 · 场景：点无酒精饮品与婉拒劝酒", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Bartender", "name_zh": "调酒师", "voice": "en-US-AvaNeural"}}, "gist": [{"q": "「你」想要什么样的饮品？", "a": "完全无酒精、不太甜、偏苦一点、有喝酒感觉的饮品。"}, {"q": "为什么「你」要再三确认没有酒精？调酒师发现了什么？", "a": "因为这周在吃药；调酒师说平时会加含酒精的苦精，这次不放。"}, {"q": "老板送酒时「你」是怎么处理的？", "a": "礼貌拒绝，请调酒师用同样杯子做一杯姜汁青柠无酒精小杯饮，好一起干杯又不显眼。"}], "dictation": [{"id": "s0_1_0", "text": "I'm not drinking tonight. What do you have that's alcohol-free but not too sweet?"}, {"id": "s0_5_0", "text": "Sounds good. Just to double-check, there's no alcohol in it at all? Not even a little?"}, {"id": "s1_3_0", "text": "Thanks, but I'll pass. Could you make me something fun to toast with instead?"}, {"id": "s1_5_0", "text": "That's perfect. I don't want to make a big deal out of it."}], "shadow": {"speaker": "A", "text": "That's really generous of him. The others will love it, but count me out, please.", "marked": "That's really <b>generous</b> of him. //<br>The <b>others</b> will love it, / but <b>count me out</b>, / please. //"}, "prompts": [{"q": "公司聚餐时，经理举着酒杯让你「至少喝一杯」。你不想喝，用轻松的方式拒绝，又不让场面冷下来。", "ref": "Thanks, really, but I'm sticking to soda tonight. I've got an early start with my son tomorrow, and he doesn't care how late I stayed out. But I'm definitely joining the toast, so fill my glass with soda. To a great quarter, everyone, and thanks for all the hard work.", "ref_zh": "真的谢谢，但我今晚就喝汽水了。明天一早要陪儿子，他可不管我昨晚多晚回家。不过干杯我一定参加，给我倒上汽水。敬这个精彩的季度，大家辛苦了。", "id": "ref0"}, {"q": "在餐厅你想点一款无酒精啤酒，问服务员有没有、是什么牌子、酒精含量是否真的为零。", "ref": "Hi, do you have any non-alcoholic beer? If you do, which brand is it? I just want to check, is it completely zero alcohol, or is it the kind with a tiny bit in it? I'm driving tonight, so I'd rather be safe. If you don't have one, a ginger beer would be fine.", "ref_zh": "你好，你们有无酒精啤酒吗？有的话是什么牌子？我想确认一下，是完全零酒精，还是含一点点的那种？我今晚要开车，想稳妥点。没有的话，来一杯姜汁汽水也行。", "id": "ref1"}], "words": [{"w": "citrusy", "ipa": "/ˈsɪtrəsi/", "zh": "柑橘味的", "ex": "This tea has a light, citrusy taste.", "id": "w0"}, {"w": "bitter", "ipa": "/ˈbɪtər/", "zh": "苦的", "ex": "Bitter gourd is too bitter for my kid.", "id": "w1"}, {"w": "zero-proof", "ipa": "/ˈzɪroʊ pruːf/", "zh": "零酒精的（饮品）", "ex": "More bars now have a zero-proof menu.", "id": "w2"}, {"w": "bitters", "ipa": "/ˈbɪtərz/", "zh": "苦精（调酒用，含酒精）", "ex": "Ask them to skip the bitters if you can't have alcohol.", "id": "w3"}, {"w": "shooter", "ipa": "/ˈʃuːtər/", "zh": "一口饮的小杯饮品", "ex": "They served a mango shooter before the meal.", "id": "w4"}, {"w": "celebration", "ipa": "/ˌseləˈbreɪʃən/", "zh": "庆祝", "ex": "We're having a small celebration for my daughter's birthday.", "id": "w5"}, {"w": "count me out", "ipa": "/kaʊnt mi aʊt/", "zh": "我就不参加了", "ex": "A run at six in the morning? Count me out.", "id": "w6"}, {"w": "leave out", "ipa": "/liːv aʊt/", "zh": "不放，省去", "ex": "Can you leave out the chilli in my noodles?", "id": "w7"}, {"w": "generous", "ipa": "/ˈdʒenərəs/", "zh": "大方的", "ex": "It was very generous of our neighbours to lend us their stroller.", "id": "w8"}, {"w": "tab", "ipa": "/tæb/", "zh": "（酒吧）记账单", "ex": "Can I start a tab? I'll pay at the end.", "id": "w9"}], "sections": [{"heading": "1. Finding the Right Drink", "heading_zh": "1. 找一杯合适的饮品", "rows": [[{"id": "s0_0_0", "md": "Hey there, what are we having tonight?", "text": "Hey there, what are we having tonight?", "zh": "嗨，今晚喝点什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I'm not drinking tonight. What do you have that's alcohol-free but not too sweet?**", "text": "I'm not drinking tonight. What do you have that's alcohol-free but not too sweet?", "zh": "我今晚不喝酒。有没有无酒精、又不太甜的？", "sp": "A"}], [{"id": "s0_2_0", "md": "Good question. Most people just get a soda. Do you like something ==citrusy== or more ==bitter==?", "text": "Good question. Most people just get a soda. Do you like something citrusy or more bitter?", "zh": "问得好。大多数人就点个汽水。你喜欢柑橘味的，还是偏苦一点的？", "sp": "B"}], [{"id": "s0_3_0", "md": "Bitter, I think. Something that __feels like__ a proper drink, not a kids' juice.", "text": "Bitter, I think. Something that feels like a proper drink, not a kids' juice.", "zh": "苦一点的吧。要有点正经喝酒的感觉，别像小孩喝的果汁。", "sp": "A"}], [{"id": "s0_4_0", "md": "Then try our ==zero-proof== spritz. It's grapefruit, tonic and a non-alcoholic aperitif.", "text": "Then try our zero-proof spritz. It's grapefruit, tonic and a non-alcoholic aperitif.", "zh": "那试试我们的零度气泡酒。西柚、汤力水，加一种无酒精开胃酒。", "sp": "B"}], [{"id": "s0_5_0", "md": "Sounds good. Just to __double-check__, there's no alcohol in it at all? Not even a little?", "text": "Sounds good. Just to double-check, there's no alcohol in it at all? Not even a little?", "zh": "听着不错。我再确认一下，里面完全没有酒精吧？一点都没有？", "sp": "A"}], [{"id": "s0_6_0", "md": "Good that you asked. Normally I add a dash of ==bitters==, and that does have alcohol. I'll __leave it out__.", "text": "Good that you asked. Normally I add a dash of bitters, and that does have alcohol. I'll leave it out.", "zh": "幸好你问了。平时我会加几滴苦精，那个是含酒精的。我不放就是了。", "sp": "B"}], [{"id": "s0_7_0", "md": "Thanks, I appreciate that. I'm on medication this week, so I need to be careful.", "text": "Thanks, I appreciate that. I'm on medication this week, so I need to be careful.", "zh": "谢谢，很感激。我这周在吃药，得注意点。", "sp": "A"}]]}, {"heading": "2. Saying No Without the Awkwardness", "heading_zh": "2. 不尴尬地说不", "rows": [[{"id": "s1_0_0", "md": "Here's your spritz. Oh, and your table's celebrating, right? The owner wants to send over a round of shots.", "text": "Here's your spritz. Oh, and your table's celebrating, right? The owner wants to send over a round of shots.", "zh": "你的气泡饮来了。对了，你们那桌在庆祝吧？老板想送一轮小杯烈酒。", "sp": "B"}], [{"id": "s1_1_0", "md": "That's really ==generous== of him. The others will love it, but __count me out__, please.", "text": "That's really gener const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
