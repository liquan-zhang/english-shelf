const D = {"id": "115", "type": "dialogue", "title": "Asking the Bartender for Something Non-Alcoholic", "meta": "B2 · 约 240 词 · 场景：点无酒精饮品与婉拒劝酒", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Bartender", "name_zh": "调酒师", "voice": "en-US-AvaNeural"}}, "gist": [{"q": "「你」想要什么样的饮品？", "a": "完全无酒精、不太甜、偏苦一点、有喝酒感觉的饮品。"}, {"q": "为什么「你」要再三确认没有酒精？调酒师发现了什么？", "a": "因为这周在吃药；调酒师说平时会加含酒精的苦精，这次不放。"}, {"q": "老板送酒时「你」是怎么处理的？", "a": "礼貌拒绝，请调酒师用同样杯子做一杯姜汁青柠无酒精小杯饮，好一起干杯又不显眼。"}], "dictation": [{"id": "s0_1_0", "text": "I'm not drinking tonight. What do you have that's alcohol-free but not too sweet?"}, {"id": "s0_5_0", "text": "Sounds good. Just to double-check, there's no alcohol in it at all? Not even a little?"}, {"id": "s1_3_0", "text": "Thanks, but I'll pass. Could you make me something fun to toast with instead?"}, {"id": "s1_5_0", "text": "That's perfect. I don't want to make a big deal out of it."}], "shadow": {"speaker": "A", "text": "That's really generous of him. The others will love it, but count me out, please.", "marked": "That's really <b>generous</b> of him. //<br>The <b>others</b> will love it, / but <b>count me out</b>, / please. //"}, "prompts": [{"q": "公司聚餐时，经理举着酒杯让你「至少喝一杯」。你不想喝，用轻松的方式拒绝，又不让场面冷下来。", "ref": "Thanks, really, but I'm sticking to soda tonight. I've got an early start with my son tomorrow, and he doesn't care how late I stayed out. But I'm definitely joining the toast, so fill my glass with soda. To a great quarter, everyone, and thanks for all the hard work.", "ref_zh": "真的谢谢，但我今晚就喝汽水了。明天一早要陪儿子，他可不管我昨晚多晚回家。不过干杯我一定参加，给我倒上汽水。敬这个精彩的季度，大家辛苦了。", "id": "ref0"}, {"q": "在餐厅你想点一款无酒精啤酒，问服务员有没有、是什么牌子、酒精含量是否真的为零。", "ref": "Hi, do you have any non-alcoholic beer? If you do, which brand is it? I just want to check, is it completely zero alcohol, or is it the kind with a tiny bit in it? I'm driving tonight, so I'd rather be safe. If you don't have one, a ginger beer would be fine.", "ref_zh": "你好，你们有无酒精啤酒吗？有的话是什么牌子？我想确认一下，是完全零酒精，还是含一点点的那种？我今晚要开车，想稳妥点。没有的话，来一杯姜汁汽水也行。", "id": "ref1"}], "words": [{"w": "citrusy", "ipa": "/ˈsɪtrəsi/", "zh": "柑橘味的", "ex": "This tea has a light, citrusy taste.", "id": "w0"}, {"w": "bitter", "ipa": "/ˈbɪtər/", "zh": "苦的", "ex": "Bitter gourd is too bitter for my kid.", "id": "w1"}, {"w": "zero-proof", "ipa": "/ˈzɪroʊ pruːf/", "zh": "零酒精的（饮品）", "ex": "More bars now have a zero-proof menu.", "id": "w2"}, {"w": "bitters", "ipa": "/ˈbɪtərz/", "zh": "苦精（调酒用，含酒精）", "ex": "Ask them to skip the bitters if you can't have alcohol.", "id": "w3"}, {"w": "shooter", "ipa": "/ˈʃuːtər/", "zh": "一口饮的小杯饮品", "ex": "They served a mango shooter before the meal.", "id": "w4"}, {"w": "celebration", "ipa": "/ˌseləˈbreɪʃən/", "zh": "庆祝", "ex": "We're having a small celebration for my daughter's birthday.", "id": "w5"}, {"w": "count me out", "ipa": "/kaʊnt mi aʊt/", "zh": "我就不参加了", "ex": "A run at six in the morning? Count me out.", "id": "w6"}, {"w": "leave out", "ipa": "/liːv aʊt/", "zh": "不放，省去", "ex": "Can you leave out the chilli in my noodles?", "id": "w7"}, {"w": "generous", "ipa": "/ˈdʒenərəs/", "zh": "大方的", "ex": "It was very generous of our neighbours to lend us their stroller.", "id": "w8"}, {"w": "tab", "ipa": "/tæb/", "zh": "（酒吧）记账单", "ex": "Can I start a tab? I'll pay at the end.", "id": "w9"}], "sections": [{"heading": "1. Finding the Right Drink", "heading_zh": "1. 找一杯合适的饮品", "rows": [[{"id": "s0_0_0", "md": "Hey there, what are we having tonight?", "text": "Hey there, what are we having tonight?", "zh": "嗨，今晚喝点什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**I'm not drinking tonight. What do you have that's alcohol-free but not too sweet?**", "text": "I'm not drinking tonight. What do you have that's alcohol-free but not too sweet?", "zh": "我今晚不喝酒。有没有无酒精、又不太甜的？", "sp": "A"}], [{"id": "s0_2_0", "md": "Good question. Most people just get a soda. Do you like something ==citrusy== or more ==bitter==?", "text": "Good question. Most people just get a soda. Do you like something citrusy or more bitter?", "zh": "问得好。大多数人就点个汽水。你喜欢柑橘味的，还是偏苦一点的？", "sp": "B"}], [{"id": "s0_3_0", "md": "Bitter, I think. Something that __feels like__ a proper drink, not a kids' juice.", "text": "Bitter, I think. Something that feels like a proper drink, not a kids' juice.", "zh": "苦一点的吧。要有点正经喝酒的感觉，别像小孩喝的果汁。", "sp": "A"}], [{"id": "s0_4_0", "md": "Then try our ==zero-proof== spritz. It's grapefruit, tonic and a non-alcoholic aperitif.", "text": "Then try our zero-proof spritz. It's grapefruit, tonic and a non-alcoholic aperitif.", "zh": "那试试我们的零度气泡酒。西柚、汤力水，加一种无酒精开胃酒。", "sp": "B"}], [{"id": "s0_5_0", "md": "Sounds good. Just to __double-check__, there's no alcohol in it at all? Not even a little?", "text": "Sounds good. Just to double-check, there's no alcohol in it at all? Not even a little?", "zh": "听着不错。我再确认一下，里面完全没有酒精吧？一点都没有？", "sp": "A"}], [{"id": "s0_6_0", "md": "Good that you asked. Normally I add a dash of ==bitters==, and that does have alcohol. I'll __leave it out__.", "text": "Good that you asked. Normally I add a dash of bitters, and that does have alcohol. I'll leave it out.", "zh": "幸好你问了。平时我会加几滴苦精，那个是含酒精的。我不放就是了。", "sp": "B"}], [{"id": "s0_7_0", "md": "Thanks, I appreciate that. I'm on medication this week, so I need to be careful.", "text": "Thanks, I appreciate that. I'm on medication this week, so I need to be careful.", "zh": "谢谢，很感激。我这周在吃药，得注意点。", "sp": "A"}]]}, {"heading": "2. Saying No Without the Awkwardness", "heading_zh": "2. 不尴尬地说不", "rows": [[{"id": "s1_0_0", "md": "Here's your spritz. Oh, and your table's celebrating, right? The owner wants to send over a round of shots.", "text": "Here's your spritz. Oh, and your table's celebrating, right? The owner wants to send over a round of shots.", "zh": "你的气泡饮来了。对了，你们那桌在庆祝吧？老板想送一轮小杯烈酒。", "sp": "B"}], [{"id": "s1_1_0", "md": "That's really ==generous== of him. The others will love it, but __count me out__, please.", "text": "That's really generous of him. The others will love it, but count me out, please.", "zh": "老板太大方了。其他人肯定喜欢，不过我就不要了。", "sp": "A"}], [{"id": "s1_2_0", "md": "Are you sure? It's just one. Nobody's going to judge you.", "text": "Are you sure? It's just one. Nobody's going to judge you.", "zh": "确定吗？就一小杯而已，没人会说你的。", "sp": "B"}], [{"id": "s1_3_0", "md": "**Thanks, but I'll pass. Could you make me something fun to toast with instead?**", "text": "Thanks, but I'll pass. Could you make me something fun to toast with instead?", "zh": "谢谢，但我不喝了。能给我弄点好玩的、可以一起干杯的吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Sure. How about a ginger and lime ==shooter== in the same glass? Nobody will know the difference.", "text": "Sure. How about a ginger and lime shooter in the same glass? Nobody will know the difference.", "zh": "可以。用同样的杯子给你做一杯姜汁青柠小杯饮怎么样？别人看不出区别。", "sp": "B"}], [{"id": "s1_5_0", "md": "That's perfect. I don't want to __make a big deal__ out of it.", "text": "That's perfect. I don't want to make a big deal out of it.", "zh": "太好了。我不想把这事搞得太显眼。", "sp": "A"}], [{"id": "s1_6_0", "md": "Totally get it. Happens more than you'd think. I'll bring them all over together.", "text": "Totally get it. Happens more than you'd think. I'll bring them all over together.", "zh": "完全理解，这种情况比你想的多多了。我一起端过去。", "sp": "B"}], [{"id": "s1_7_0", "md": "**You're a lifesaver. Can you put my drinks on the same tab as the table?**", "text": "You're a lifesaver. Can you put my drinks on the same tab as the table?", "zh": "你真是救了我。我的饮品能记在那桌的账上吗？", "sp": "A"}], [{"id": "s1_8_0", "md": "Already done. Enjoy the ==celebration==.", "text": "Already done. Enjoy the celebration.", "zh": "已经记好了。玩得开心。", "sp": "B"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Finding the Right Drink", "zh": "1. 找一杯合适的饮品", "start": 0.0, "end": 2.232, "words": [[0.105, 0.355], [0.697, 1.04], [1.053, 1.132], [1.145, 1.395], [1.408, 1.842]]}, {"kind": "s", "id": "s0_0_0", "md": "Hey there, what are we having tonight?", "zh": "嗨，今晚喝点什么？", "sp": "B", "gap": const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}
