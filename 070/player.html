<script>
const D = {"id": "070", "title": "Planning for the Thing That Will Go Wrong", "meta": "B2 · 约 270 词 · 场景：上线预案", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Imagine It Already Failed", "heading_zh": "1. 假设它已经失败了", "rows": [[{"id": "s0_0_0", "md": "Ask a team what could go wrong with a launch, and you usually get polite, ==generic== answers.", "text": "Ask a team what could go wrong with a launch, and you usually get polite, generic answers.", "zh": "问一个团队上线可能出什么问题，你通常只会得到一些客气又笼统的回答。", "sp": null}, {"id": "s0_0_1", "md": "\"Maybe performance.\"", "text": "\"Maybe performance.\"", "zh": "「可能是性能吧。」", "sp": null}, {"id": "s0_0_2", "md": "\"Maybe some edge cases.\"", "text": "\"Maybe some edge cases.\"", "zh": "「可能有些边界情况。」", "sp": null}, {"id": "s0_0_3", "md": "Nobody wants to sound negative about a project everyone has worked hard on.", "text": "Nobody wants to sound negative about a project everyone has worked hard on.", "zh": "大家都辛辛苦苦做了这个项目，没人想显得唱衰。", "sp": null}], [{"id": "s0_1_0", "md": "Now try a different question: it is three weeks after launch, and the project was a disaster; what happened?", "text": "Now try a different question: it is three weeks after launch, and the project was a disaster; what happened?", "zh": "现在换个问法：上线三周后，这个项目彻底搞砸了，发生了什么？", "sp": null}, {"id": "s0_1_1", "md": "Suddenly people get specific.", "text": "Suddenly people get specific.", "zh": "大家一下子就具体起来了。", "sp": null}, {"id": "s0_1_2", "md": "Someone remembers the partner team never confirmed their capacity, and someone else admits the migration script was never tested on real data.", "text": "Someone remembers the partner team never confirmed their capacity, and someone else admits the migration script was never tested on real data.", "zh": "有人想起合作团队一直没确认他们的容量，还有人承认迁移脚本从来没在真实数据上测过。", "sp": null}], [{"id": "s0_2_0", "md": "This exercise, often called a ==pre-mortem==, works because it gives people permission to be ==pessimistic==.", "text": "This exercise, often called a pre-mortem, works because it gives people permission to be pessimistic.", "zh": "这个练习通常叫事前验尸，它管用是因为它允许大家悲观。", "sp": null}, {"id": "s0_2_1", "md": "**It is easier to explain a failure that has already happened than to predict one that might.**", "text": "It is easier to explain a failure that has already happened than to predict one that might.", "zh": "解释一个已经发生的失败，比预测一个可能发生的失败要容易。", "sp": null}, {"id": "s0_2_2", "md": "Concerns that felt rude to raise now __count as__ useful input.", "text": "Concerns that felt rude to raise now count as useful input.", "zh": "那些原本说出来显得冒犯的担忧，现在都算是有用的输入。", "sp": null}, {"id": "s0_2_3", "md": "Within twenty minutes, the room has a list of real risks instead of polite guesses.", "text": "Within twenty minutes, the room has a list of real risks instead of polite guesses.", "zh": "二十分钟之内，屋里就有了一份真实风险清单，而不是一堆客气的猜测。", "sp": null}]]}, {"heading": "2. From Fears to a Playbook", "heading_zh": "2. 从担忧到预案手册", "rows": [[{"id": "s1_0_0", "md": "A pre-mortem produces a long list, and you cannot prepare for everything.", "text": "A pre-mortem produces a long list, and you cannot prepare for everything.", "zh": "事前验尸会产出一长串清单，你不可能每一项都做准备。", "sp": null}, {"id": "s1_0_1", "md": "Pick the two or three failures that are both likely and painful.", "text": "Pick the two or three failures that are both likely and painful.", "zh": "挑出两三个既可能发生、又很要命的失败。", "sp": null}, {"id": "s1_0_2", "md": "For each one, write down an early ==indicator== and a first response.", "text": "For each one, write down an early indicator and a first response.", "zh": "每一个都写下一个早期信号和一个第一响应动作。", "sp": null}], [{"id": "s1_1_0", "md": "For example, if the partner API slows down, the indicator might be P ninety-nine latency above one second.", "text": "For example, if the partner API slows down, the indicator might be P ninety-nine latency above one second.", "zh": "比如，如果合作方的 API 变慢，早期信号可以是 P99 延迟超过一秒。", "sp": null}, {"id": "s1_1_1", "md": "The first response is to switch on cached results and __page the partner's on-call__.", "text": "The first response is to switch on cached results and page the partner's on-call.", "zh": "第一响应动作是打开缓存结果，并呼叫合作方的 on-call。", "sp": null}, {"id": "s1_1_2", "md": "Now the engineer on duty has a plan instead of a ==puzzle== at three in the morning.", "text": "Now the engineer on duty has a plan instead of a puzzle at three in the morning.", "zh": "这样凌晨三点值班的工程师手里就有一份方案，而不是一道谜题。", "sp": null}], [{"id": "s1_2_0", "md": "**Preparation does not stop things from going wrong; it stops you from being surprised.**", "text": "Preparation does not stop things from going wrong; it stops you from being surprised.", "zh": "准备不能阻止事情出错；它能让你不被打个措手不及。", "sp": null}, {"id": "s1_2_1", "md": "Keep the ==playbook== short, link it from the launch doc, and __walk through it__ once before release day.", "text": "Keep the playbook short, link it from the launch doc, and walk through it once before release day.", "zh": "预案手册要短，从上线文档里链过去，发布日之前带大家过一遍。", "sp": null}, {"id": "s1_2_2", "md": "A plan nobody has read is barely better than no plan at all.", "text": "A plan nobody has read is barely better than no plan at all.", "zh": "一份没人读过的方案，比没有方案也好不了多少。", "sp": null}]]}], "gist": [{"q": "直接问“可能出什么问题”为什么效果不好？", "a": "大家只会给出礼貌、泛泛的回答，比如“可能性能”“可能有边界情况”，没人想显得消极。"}, {"q": "“事前验尸”是怎么做的？为什么有效？", "a": "假设上线三周后项目失败了，问发生了什么；它允许大家悲观，解释已发生的失败比预测可能的失败容易。"}, {"q": "如何把清单变成可用的预案？", "a": "挑两三个既可能又痛的失败，各写一个早期指标和第一反应；预案要短、挂在上线文档里，并在发布前走一遍。"}], "dictation": [{"id": "s0_2_1", "text": "It is easier to explain a failure that has already happened than to predict one that might."}, {"id": "s1_0_1", "text": "Pick the two or three failures that are both likely and painful."}, {"id": "s1_2_0", "text": "Preparation does not stop things from going wrong; it stops you from being surprised."}, {"id": "s1_2_2", "text": "A plan nobody has read is barely better than no plan at all."}], "shadow": {"text": "For example, if the partner API slows down, the indicator might be P ninety-nine latency above one second. The first response is to switch on cached results and page the partner's on-call. Now the engineer on duty has a plan instead of a puzzle at three in the morning.", "marked": "For example, / if the partner API <b>slows</b> down, / the indicator might be / P ninety-nine latency / above <b>one</b> second. //<br>The first <b>response</b> / is to switch on <b>cached</b> results / and page the partner's <b>on-call</b>. //<br>Now the engineer on duty / has a <b>plan</b> / instead of a <b>puzzle</b> / at three in the <b>morning</b>. //"}, "prompts": [{"q": "下个月要上线一个依赖外部合作方的大功能。在启动会上用 30 秒带大家做一次“事前验尸”。", "ref": "Before we dive into the timeline, I'd like to try a quick exercise. Imagine it's six weeks after launch, and this project went badly wrong. Take two minutes and write down what you think happened. Be as specific and pessimistic as you like; nothing is off limits. Then we'll pick the two or three most likely failures and write a first response for each.", "ref_zh": "在过时间线之前，我想先做个小练习。假设现在是上线六周后，这个项目彻底搞砸了。花两分钟写下你觉得发生了什么。想多具体、多悲观都行；没有什么不能说的。然后我们挑出最可能的两三个失败，每个写一个第一响应动作。", "id": "ref0"}, {"q": "同事觉得写预案是浪费时间：“出了问题再说”。用 30 秒说服他至少为一个风险写好预案。", "ref": "I get that we can't plan for everything, and I don't want a thirty-page document either. But think about the partner API. If it slows down at three in the morning, whoever is on call will be guessing. One short paragraph, what latency number to watch and what switch to flip, takes us twenty minutes now. It saves someone an hour of panic later.", "ref_zh": "我明白我们不可能什么都预案到，我也不想要一份三十页的文档。但想想合作方的 API。如果它凌晨三点变慢，当班的 on-call 只能靠猜。一小段话，写清楚盯哪个延迟数字、拨哪个开关，现在只要花我们二十分钟。以后就能省掉某个人一小时的手忙脚乱。", "id": "ref1"}], "words": [{"w": "generic", "ipa": "/dʒəˈnerɪk/", "zh": "泛泛的、笼统的", "ex": "The feedback was too generic to act on.", "id": "w0"}, {"w": "pre-mortem", "ipa": "/ˌpriːˈmɔːrtəm/", "zh": "事前验尸（预想失败原因的复盘）", "ex": "Let's run a quick pre-mortem before we lock the launch date.", "id": "w1"}, {"w": "pessimistic", "ipa const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
