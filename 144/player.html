<script>
const D = {"id": "144", "type": "dialogue", "title": "Small Talk at a Friend's Party", "meta": "B2 · 约 290 词 · 场景：朋友派对上的闲聊", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Party Guest", "name_zh": "派对上的客人", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "Rahul 是怎么认识主人 Mei 的？他做什么工作？", "a": "他们的女儿同班，是在家长群里熟起来的；他做物流，每天处理货运延误。"}, {"q": "第二次见面时「你」遇到了什么尴尬？怎么处理的？", "a": "忘了对方的名字；直接道歉说自己记不住名字，请他再说一遍。"}, {"q": "Rahul 推荐的幼儿园有什么特点？他还提出帮什么忙？", "a": "Little Oaks，在武吉知马，有英文和中文双语课程，排队的人多；他可以介绍「你」认识园长。"}], "dictation": [{"id": "s0_7_0", "text": "I manage an engineering team at a tech company. It's mostly meetings these days, to be honest."}, {"id": "s0_11_0", "text": "About two years. We're still figuring out the best places to eat, so any tips are welcome."}, {"id": "s1_1_0", "text": "Oh, thank you. I'm so sorry, I'm terrible with names. Could you remind me of yours?"}, {"id": "s1_9_0", "text": "Done. Well, I'd better go find my wife. It was really nice chatting with you."}], "shadow": {"speaker": "A", "text": "About two years. We're still figuring out the best places to eat, so any tips are welcome.", "marked": "About <b>two</b> years. //<br>We're still <b>figuring out</b> / the best places to <b>eat</b>, / so any <b>tips</b> are welcome. //"}, "prompts": [{"q": "同事婚礼上你被安排和一桌陌生人坐。用 30 秒自我介绍，并抛出一个能让大家接话的问题。", "ref": "Hi everyone, I'm Lee. I work with Jason on the platform team, so I'm on the groom's side. I don't think I know anyone else at this table yet. How do you all know the couple? I'm guessing some of you go way back with them, maybe from school or university?", "ref_zh": "大家好，我叫李，是和 Jason 一起在平台组的同事，所以算新郎这边的。这桌我好像谁都还不认识。大家都是怎么认识新人的？我猜有人跟他们认识很久了吧，可能是中学或者大学同学？", "id": "ref0"}, {"q": "派对上一个人一直拉着你聊，你想礼貌地脱身去找别人。说一段自然的收尾。", "ref": "It's been great hearing about your trip to Japan. I'm definitely adding Hokkaido to our list. I should go and say hi to Mei before it gets too late, though. I haven't even talked to the host yet. Let's grab a drink later if you're still around. Enjoy the rest of the party.", "ref_zh": "听你讲日本之旅真有意思，我一定把北海道加进我们的清单。不过我得趁还不太晚去跟 Mei 打个招呼，我到现在都还没跟主人说上话。待会儿你还在的话我们再喝一杯。玩得开心。", "id": "ref1"}], "words": [{"w": "preschool", "ipa": "/ˈpriːskuːl/", "zh": "幼儿园", "ex": "Our son starts preschool in January.", "id": "w0"}, {"w": "logistics", "ipa": "/ləˈdʒɪstɪks/", "zh": "物流", "ex": "She works in logistics for a shipping company.", "id": "w1"}, {"w": "intense", "ipa": "/ɪnˈtens/", "zh": "紧张的；强度大的", "ex": "The last week before the move was pretty intense.", "id": "w2"}, {"w": "figure out", "ipa": "/ˈfɪɡjər aʊt/", "zh": "弄清楚，摸索出", "ex": "We're still figuring out which bus goes to the zoo.", "id": "w3"}, {"w": "bilingual", "ipa": "/baɪˈlɪŋɡwəl/", "zh": "双语的", "ex": "We want a bilingual school for our daughter.", "id": "w4"}, {"w": "waitlist", "ipa": "/ˈweɪtlɪst/", "zh": "候补名单", "ex": "We've been on the waitlist for three months.", "id": "w5"}, {"w": "register", "ipa": "/ˈredʒɪstər/", "zh": "登记，报名", "ex": "You need to register online before the class starts.", "id": "w6"}, {"w": "swap", "ipa": "/swɑːp/", "zh": "交换", "ex": "We swapped numbers so we could arrange a playdate.", "id": "w7"}, {"w": "catch up", "ipa": "/kætʃ ʌp/", "zh": "叙旧，聚一聚", "ex": "Let's catch up over lunch next week.", "id": "w8"}], "sections": [{"heading": "1. By the Food Table", "heading_zh": "1. 在餐台边", "rows": [[{"id": "s0_0_0", "md": "These satay are amazing, aren't they? Have you tried them yet?", "text": "These satay are amazing, aren't they? Have you tried them yet?", "zh": "这沙爹太好吃了，对吧？你尝过了吗？", "sp": "B"}], [{"id": "s0_1_0", "md": "Not yet, but they smell great. I'm Lee, by the way.", "text": "Not yet, but they smell great. I'm Lee, by the way.", "zh": "还没呢，不过闻着很香。对了，我叫李。", "sp": "A"}], [{"id": "s0_2_0", "md": "Rahul. Nice to meet you. So __how do you know__ Mei?", "text": "Rahul. Nice to meet you. So how do you know Mei?", "zh": "我叫 Rahul，很高兴认识你。你是怎么认识 Mei 的？", "sp": "B"}], [{"id": "s0_3_0", "md": "We used to work together at my last company. What about you?", "text": "We used to work together at my last company. What about you?", "zh": "我们以前在我上一家公司共事过。你呢？", "sp": "A"}], [{"id": "s0_4_0", "md": "Our daughters are in the same class. We bonded over the school WhatsApp group.", "text": "Our daughters are in the same class. We bonded over the school WhatsApp group.", "zh": "我们的女儿在同一个班。我们是在学校的家长群里熟起来的。", "sp": "B"}], [{"id": "s0_5_0", "md": "Ha, nice. Ours is three, so we're just starting to look at ==preschools==.", "text": "Ha, nice. Ours is three, so we're just starting to look at preschools.", "zh": "哈，挺好。我家的才三岁，我们刚开始看幼儿园。", "sp": "A"}], [{"id": "s0_6_0", "md": "Ah, that's a big decision. We spent months on it. What do you do, Lee?", "text": "Ah, that's a big decision. We spent months on it. What do you do, Lee?", "zh": "啊，那可是大事。我们当时纠结了好几个月。你是做什么的？", "sp": "B"}], [{"id": "s0_7_0", "md": "**I manage an engineering team at a tech company. It's mostly meetings these days, to be honest.**", "text": "I manage an engineering team at a tech company. It's mostly meetings these days, to be honest.", "zh": "我在一家科技公司带一个工程团队。说实话，现在基本都在开会。", "sp": "A"}], [{"id": "s0_8_0", "md": "I know the feeling. I'm in ==logistics==, so my day is basically shipping delays.", "text": "I know the feeling. I'm in logistics, so my day is basically shipping delays.", "zh": "我懂那种感觉。我做物流的，每天基本就是处理货运延误。", "sp": "B"}], [{"id": "s0_9_0", "md": "That sounds ==intense==. __How long have you been__ in Singapore?", "text": "That sounds intense. How long have you been in Singapore?", "zh": "听起来压力挺大的。你来新加坡多久了？", "sp": "A"}], [{"id": "s0_10_0", "md": "Almost ten years now. My wife's from here. What about you?", "text": "Almost ten years now. My wife's from here. What about you?", "zh": "快十年了，我太太是本地人。你呢？", "sp": "B"}], [{"id": "s0_11_0", "md": "About two years. We're still ==figuring== out the best places to eat, so any tips are welcome.", "text": "About two years. We're still figuring out the best places to eat, so any tips are welcome.", "zh": "两年左右。我们还在摸索哪里好吃，有推荐的话欢迎告诉我。", "sp": "A"}]]}, {"heading": "2. A Name Slips Away", "heading_zh": "2. 一时想不起名字", "rows": [[{"id": "s1_0_0", "md": "Hey, there you are! I wrote down the name of that preschool I mentioned.", "text": "Hey, there you are! I wrote down the name of that preschool I mentioned.", "zh": "嘿，原来你在这儿！我把刚才说的那家幼儿园的名字写下来了。", "sp": "B"}], [{"id": "s1_1_0", "md": "**Oh, thank you. I'm so sorry, I'm terrible with names. Could you remind me of yours?**", "text": "Oh, thank you. I'm so sorry, I'm terrible with names. Could you remind me of yours?", "zh": "哦，谢谢你。真不好意思，我特别记不住名字，你能再告诉我一下吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "No worries at all, it's Rahul. It happens to me all the time.", "text": "No worries at all, it's Rahul. It happens to me all the time.", "zh": "完全没关系，我叫 Rahul。我也经常这样。", "sp": "B"}], [{"id": "s1_3_0", "md": "Rahul, right. Thanks. So what's the preschool called?", "text": "Rahul, right. Thanks. So what's the preschool called?", "zh": "对，Rahul，谢谢。那家幼儿园叫什么？", "sp": "A"}], [{"id": "s1_4_0", "md": "It's called Little Oaks, in Bukit Timah. They have a ==bilingual== programme in English and Mandarin.", "text": "It's called Little Oaks, in Bukit Timah. They have a bilingual programme in English and Mandarin.", "zh": "叫 Little Oaks，在武吉知马。他们有英文和中文的双语课程。", "sp": "B"}], [{"id": "s1_5_0", "md": "That's exactly what we're looking for. Do they have a long ==waitlist==?", "text": "That's exactly what we're looking for. Do they have a long waitlist?", "zh": "这正是我们想要的。排队的人多吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "Pretty long, so I'd ==register== early. I can introduce you to the principal if you like.", "text": "Pretty long, so I'd register early. I can introduce you to the principal if you like.", "zh": "挺多的，所以我建议早点报名。你愿意的话，我可以介绍你认识园长。", "sp": "B"}], [{"id": "s1_7_0", "md": "That would be really helpful. __Shall we swap numbers__?", "text": "That would be really helpful. Sha const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {

  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');

if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
