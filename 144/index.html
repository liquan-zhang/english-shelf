<script>
const D = {"id": "144", "type": "dialogue", "title": "Small Talk at a Friend's Party", "meta": "B2 · 约 290 词 · 场景：朋友派对上的闲聊", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Party Guest", "name_zh": "派对上的客人", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "Rahul 是怎么认识主人 Mei 的？他做什么工作？", "a": "他们的女儿同班，是在家长群里熟起来的；他做物流，每天处理货运延误。"}, {"q": "第二次见面时「你」遇到了什么尴尬？怎么处理的？", "a": "忘了对方的名字；直接道歉说自己记不住名字，请他再说一遍。"}, {"q": "Rahul 推荐的幼儿园有什么特点？他还提出帮什么忙？", "a": "Little Oaks，在武吉知马，有英文和中文双语课程，排队的人多；他可以介绍「你」认识园长。"}], "dictation": [{"id": "s0_7_0", "text": "I manage an engineering team at a tech company. It's mostly meetings these days, to be honest."}, {"id": "s0_11_0", "text": "About two years. We're still figuring out the best places to eat, so any tips are welcome."}, {"id": "s1_1_0", "text": "Oh, thank you. I'm so sorry, I'm terrible with names. Could you remind me of yours?"}, {"id": "s1_9_0", "text": "Done. Well, I'd better go find my wife. It was really nice chatting with you."}], "shadow": {"speaker": "A", "text": "About two years. We're still figuring out the best places to eat, so any tips are welcome.", "marked": "About <b>two</b> years. //<br>We're still <b>figuring out</b> / the best places to <b>eat</b>, / so any <b>tips</b> are welcome. //"}, "prompts": [{"q": "同事婚礼上你被安排和一桌陌生人坐。用 30 秒自我介绍，并抛出一个能让大家接话的问题。", "ref": "Hi everyone, I'm Lee. I work with Jason on the platform team, so I'm on the groom's side. I don't think I know anyone else at this table yet. How do you all know the couple? I'm guessing some of you go way back with them, maybe from school or university?", "ref_zh": "大家好，我叫李，是和 Jason 一起在平台组的同事，所以算新郎这边的。这桌我好像谁都还不认识。大家都是怎么认识新人的？我猜有人跟他们认识很久了吧，可能是中学或者大学同学？", "id": "ref0"}, {"q": "派对上一个人一直拉着你聊，你想礼貌地脱身去找别人。说一段自然的收尾。", "ref": "It's been great hearing about your trip to Japan. I'm definitely adding Hokkaido to our list. I should go and say hi to Mei before it gets too late, though. I haven't even talked to the host yet. Let's grab a drink later if you're still around. Enjoy the rest of the party.", "ref_zh": "听你讲日本之旅真有意思，我一定把北海道加进我们的清单。不过我得趁还不太晚去跟 Mei 打个招呼，我到现在都还没跟主人说上话。待会儿你还在的话我们再喝一杯。玩得开心。", "id": "ref1"}], "words": [{"w": "preschool", "ipa": "/ˈpriːskuːl/", "zh": "幼儿园", "ex": "Our son starts preschool in January.", "id": "w0"}, {"w": "logistics", "ipa": "/ləˈdʒɪstɪks/", "zh": "物流", "ex": "She works in logistics for a shipping company.", "id": "w1"}, {"w": "intense", "ipa": "/ɪnˈtens/", "zh": "紧张的；强度大的", "ex": "The last week before the move was pretty intense.", "id": "w2"}, {"w": "figure out", "ipa": "/ˈfɪɡjər aʊt/", "zh": "弄清楚，摸索出", "ex": "We're still figuring out which bus goes to the zoo.", "id": "w3"}, {"w": "bilingual", "ipa": "/baɪˈlɪŋɡwəl/", "zh": "双语的", "ex": "We want a bilingual school for our daughter.", "id": "w4"}, {"w": "waitlist", "ipa": "/ˈweɪtlɪst/", "zh": "候补名单", "ex": "We've been on the waitlist for three months.", "id": "w5"}, {"w": "register", "ipa": "/ˈredʒɪstər/", "zh": "登记，报名", "ex": "You need to register online before the class starts.", "id": "w6"}, {"w": "swap", "ipa": "/swɑːp/", "zh": "交换", "ex": "We swapped numbers so we could arrange a playdate.", "id": "w7"}, {"w": "catch up", "ipa": "/kætʃ ʌp/", "zh": "叙旧，聚一聚", "ex": "Let's catch up over lunch next week.", "id": "w8"}], "sections": [{"heading": "1. By the Food Table", "heading_zh": "1. 在餐台边", "rows": [[{"id": "s0_0_0", "md": "These satay are amazing, aren't they? Have you tried them yet?", "text": "These satay are amazing, aren't they? Have you tried them yet?", "zh": "这沙爹太好吃了，对吧？你尝过了吗？", "sp": "B"}], [{"id": "s0_1_0", "md": "Not yet, but they smell great. I'm Lee, by the way.", "text": "Not yet, but they smell great. I'm Lee, by the way.", "zh": "还没呢，不过闻着很香。对了，我叫李。", "sp": "A"}], [{"id": "s0_2_0", "md": "Rahul. Nice to meet you. So __how do you know__ Mei?", "text": "Rahul. Nice to meet you. So how do you know Mei?", "zh": "我叫 Rahul，很高兴认识你。你是怎么认识 Mei 的？", "sp": "B"}], [{"id": "s0_3_0", "md": "We used to work together at my last company. What about you?", "text": "We used to work together at my last company. What about you?", "zh": "我们以前在我上一家公司共事过。你呢？", "sp": "A"}], [{"id": "s0_4_0", "md": "Our daughters are in the same class. We bonded over the school WhatsApp group.", "text": "Our daughters are in the same class. We bonded over the school WhatsApp group.", "zh": "我们的女儿在同一个班。我们是在学校的家长群里熟起来的。", "sp": "B"}], [{"id": "s0_5_0", "md": "Ha, nice. Ours is three, so we're just starting to look at ==preschools==.", "text": "Ha, nice. Ours is three, so we're just starting to look at preschools.", "zh": "哈，挺好。我家的才三岁，我们刚开始看幼儿园。", "sp": "A"}], [{"id": "s0_6_0", "md": "Ah, that's a big decision. We spent months on it. What do you do, Lee?", "text": "Ah, that's a big decision. We spent months on it. What do you do, Lee?", "zh": "啊，那可是大事。我们当时纠结了好几个月。你是做什么的？", "sp": "B"}], [{"id": "s0_7_0", "md": "**I manage an engineering team at a tech company. It's mostly meetings these days, to be honest.**", "text": "I manage an engineering team at a tech company. It's mostly meetings these days, to be honest.", "zh": "我在一家科技公司带一个工程团队。说实话，现在基本都在开会。", "sp": "A"}], [{"id": "s0_8_0", "md": "I know the feeling. I'm in ==logistics==, so my day is basically shipping delays.", "text": "I know the feeling. I'm in logistics, so my day is basically shipping delays.", "zh": "我懂那种感觉。我做物流的，每天基本就是处理货运延误。", "sp": "B"}], [{"id": "s0_9_0", "md": "That sounds ==intense==. __How long have you been__ in Singapore?", "text": "That sounds intense. How long have you been in Singapore?", "zh": "听起来压力挺大的。你来新加坡多久了？", "sp": "A"}], [{"id": "s0_10_0", "md": "Almost ten years now. My wife's from here. What about you?", "text": "Almost ten years now. My wife's from here. What about you?", "zh": "快十年了，我太太是本地人。你呢？", "sp": "B"}], [{"id": "s0_11_0", "md": "About two years. We're still ==figuring== out the best places to eat, so any tips are welcome.", "text": "About two years. We're still figuring out the best places to eat, so any tips are welcome.", "zh": "两年左右。我们还在摸索哪里好吃，有推荐的话欢迎告诉我。", "sp": "A"}]]}, {"heading": "2. A Name Slips Away", "heading_zh": "2. 一时想不起名字", "rows": [[{"id": "s1_0_0", "md": "Hey, there you are! I wrote down the name of that preschool I mentioned.", "text": "Hey, there you are! I wrote down the name of that preschool I mentioned.", "zh": "嘿，原来你在这儿！我把刚才说的那家幼儿园的名字写下来了。", "sp": "B"}], [{"id": "s1_1_0", "md": "**Oh, thank you. I'm so sorry, I'm terrible with names. Could you remind me of yours?**", "text": "Oh, thank you. I'm so sorry, I'm terrible with names. Could you remind me of yours?", "zh": "哦，谢谢你。真不好意思，我特别记不住名字，你能再告诉我一下吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "No worries at all, it's Rahul. It happens to me all the time.", "text": "No worries at all, it's Rahul. It happens to me all the time.", "zh": "完全没关系，我叫 Rahul。我也经常这样。", "sp": "B"}], [{"id": "s1_3_0", "md": "Rahul, right. Thanks. So what's the preschool called?", "text": "Rahul, right. Thanks. So what's the preschool called?", "zh": "对，Rahul，谢谢。那家幼儿园叫什么？", "sp": "A"}], [{"id": "s1_4_0", "md": "It's called Little Oaks, in Bukit Timah. They have a ==bilingual== programme in English and Mandarin.", "text": "It's called Little Oaks, in Bukit Timah. They have a bilingual programme in English and Mandarin.", "zh": "叫 Little Oaks，在武吉知马。他们有英文和中文的双语课程。", "sp": "B"}], [{"id": "s1_5_0", "md": "That's exactly what we're looking for. Do they have a long ==waitlist==?", "text": "That's exactly what we're looking for. Do they have a long waitlist?", "zh": "这正是我们想要的。排队的人多吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "Pretty long, so I'd ==register== early. I can introduce you to the principal if you like.", "text": "Pretty long, so I'd register early. I can introduce you to the principal if you like.", "zh": "挺多的，所以我建议早点报名。你愿意的话，我可以介绍你认识园长。", "sp": "B"}], [{"id": "s1_7_0", "md": "That would be really helpful. __Shall we swap numbers__?", "text": "That would be really helpful. Sha const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
