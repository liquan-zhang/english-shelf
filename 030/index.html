<script>
const D = {"id": "030", "title": "When to Approve with Comments", "meta": "B2 · 约 260 词 · 场景：代码评审", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Middle Option", "heading_zh": "1. 中间选项", "rows": [[{"id": "s0_0_0", "md": "Between \"approve\" and \"request changes,\" there is a quiet middle option.", "text": "Between \"approve\" and \"request changes,\" there is a quiet middle option.", "zh": "在「通过」和「要求修改」之间，有一个不太起眼的中间选项。", "sp": null}, {"id": "s0_0_1", "md": "You approve the change, leave a few comments, and trust the author to handle them before merging.", "text": "You approve the change, leave a few comments, and trust the author to handle them before merging.", "zh": "你批准这个改动，留几条评论，相信作者会在合入前处理好。", "sp": null}, {"id": "s0_0_2", "md": "Used well, it removes a whole round of waiting, which matters a lot when your reviewer sleeps while you work.", "text": "Used well, it removes a whole round of waiting, which matters a lot when your reviewer sleeps while you work.", "zh": "用得好，它能省掉一整轮等待，尤其当你在干活时评审人正在睡觉，这一点就特别重要。", "sp": null}], [{"id": "s0_1_0", "md": "Used badly, it becomes a ==loophole==.", "text": "Used badly, it becomes a loophole.", "zh": "用得不好，它就成了一个漏洞。", "sp": null}, {"id": "s0_1_1", "md": "A busy reviewer approves, mentions a serious bug in a comment, and the bug ships anyway because the author read the green check and nothing else.", "text": "A busy reviewer approves, mentions a serious bug in a comment, and the bug ships anyway because the author read the green check and nothing else.", "zh": "一个很忙的评审人点了通过，在评论里提了一个严重 bug，结果 bug 还是上线了，因为作者只看了那个绿色的勾，别的什么都没看。", "sp": null}, {"id": "s0_1_2", "md": "**An approval is a promise that the code is safe to merge, not a polite way to end the review.**", "text": "An approval is a promise that the code is safe to merge, not a polite way to end the review.", "zh": "批准代表你承诺这段代码可以安全合入，而不是一种客气地结束评审的方式。", "sp": null}], [{"id": "s0_2_0", "md": "So the real question is not how many comments you have.", "text": "So the real question is not how many comments you have.", "zh": "所以真正的问题不在于你有多少条评论。", "sp": null}, {"id": "s0_2_1", "md": "It is whether the remaining issues are ==cosmetic== or ==structural==.", "text": "It is whether the remaining issues are cosmetic or structural.", "zh": "而在于剩下的问题是表面的，还是结构性的。", "sp": null}, {"id": "s0_2_2", "md": "Ten small naming comments can be fine, while one quiet comment about data loss is not.", "text": "Ten small naming comments can be fine, while one quiet comment about data loss is not.", "zh": "十条小的命名评论可能没关系，而一条不起眼的、关于丢数据的评论就不行。", "sp": null}]]}, {"heading": "2. Three Conditions for a Conditional Yes", "heading_zh": "2. 有条件通过的三个前提", "rows": [[{"id": "s1_0_0", "md": "Approve with comments only when three things are true.", "text": "Approve with comments only when three things are true.", "zh": "只有同时满足三个条件时，才用「带评论通过」。", "sp": null}, {"id": "s1_0_1", "md": "The issues are small, like naming, a missing log line, or a clearer error message.", "text": "The issues are small, like naming, a missing log line, or a clearer error message.", "zh": "问题都很小，比如命名、少了一行日志，或者报错信息可以更清楚。", "sp": null}, {"id": "s1_0_2", "md": "The change is easy to ==reverse== if something __slips through__.", "text": "The change is easy to reverse if something slips through.", "zh": "万一有什么漏过去了，这个改动也很容易回滚。", "sp": null}, {"id": "s1_0_3", "md": "And you trust this author to __follow through__ without being checked again.", "text": "And you trust this author to follow through without being checked again.", "zh": "而且你相信这位作者不用再被检查一遍，也会把事情落实到位。", "sp": null}], [{"id": "s1_1_0", "md": "If any of those is false, request changes.", "text": "If any of those is false, request changes.", "zh": "只要有一条不满足，就要求修改。", "sp": null}, {"id": "s1_1_1", "md": "Anything touching security, data correctness, or ==backward compatibility== deserves a second look, no matter how small the fix seems.", "text": "Anything touching security, data correctness, or backward compatibility deserves a second look, no matter how small the fix seems.", "zh": "凡是涉及安全、数据正确性或向后兼容的，都值得再看一遍，不管修复看起来多小。", "sp": null}, {"id": "s1_1_2", "md": "A day of delay is cheap compared with a broken client in production.", "text": "A day of delay is cheap compared with a broken client in production.", "zh": "跟线上客户端被搞挂相比，晚一天根本不算什么。", "sp": null}], [{"id": "s1_2_0", "md": "**Whatever you choose, make it explicit which comments are required and which are optional.**", "text": "Whatever you choose, make it explicit which comments are required and which are optional.", "zh": "不管你选哪个，都要明确说清楚哪些评论是必须改的，哪些是可选的。", "sp": null}, {"id": "s1_2_1", "md": "A quick \"non-blocking\" tag on the optional ones __removes the guesswork__.", "text": "A quick \"non-blocking\" tag on the optional ones removes the guesswork.", "zh": "在可选的评论上加个「non-blocking」标签，就省得对方去猜了。", "sp": null}, {"id": "s1_2_2", "md": "Over time, this habit builds ==mutual== trust, and reviews get faster for everyone.", "text": "Over time, this habit builds mutual trust, and reviews get faster for everyone.", "zh": "时间长了，这个习惯能建立起彼此的信任，大家的评审都会变快。", "sp": null}]]}], "gist": [{"q": "「带意见通过」用得好和用得不好分别会怎样？", "a": "用得好能省掉一轮等待（尤其跨时区）；用得不好就成了漏洞，严重 bug 写在评论里却照样上线。"}, {"q": "作者说判断的关键是什么？", "a": "不看评论数量，而看剩下的问题是表面的（命名等）还是结构性的（如数据丢失）。"}, {"q": "什么时候可以带意见通过？什么时候必须要求修改？", "a": "问题很小、容易回滚、信任作者会跟进时可以通过；涉及安全、数据正确性、向后兼容时必须要求修改。"}], "dictation": [{"id": "s0_1_2", "text": "An approval is a promise that the code is safe to merge, not a polite way to end the review."}, {"id": "s1_2_0", "text": "Whatever you choose, make it explicit which comments are required and which are optional."}, {"id": "s1_1_0", "text": "If any of those is false, request changes."}, {"id": "s0_2_0", "text": "So the real question is not how many comments you have."}], "shadow": {"text": "So the real question is not how many comments you have. It is whether the remaining issues are cosmetic or structural. Ten small naming comments can be fine, while one quiet comment about data loss is not.", "marked": "So the <b>real</b> question / is <b>not</b> how many comments you have. //<br>It is whether the remaining issues / are <b>cosmetic</b> / or <b>structural</b>. //<br><b>Ten</b> small naming comments / can be <b>fine</b>, / while <b>one</b> quiet comment about <b>data loss</b> / is <b>not</b>. //"}, "prompts": [{"q": "你 approve 了一个 PR 并留了几条意见，作者在另一个时区。用 30 秒（语音留言）说明哪些必须改、哪些可选。", "ref": "Hi, I've approved your change so you don't have to wait for me overnight. Two of my comments are required before you merge: please add the null check on the user ID, and log the request ID in the error path. The other three are optional, just naming ideas, so use your judgment. If the null check turns out to be more complicated than it looks, ping me and I'll take another look.", "ref_zh": "嗨，我已经批准了你的改动，这样你不用等我一晚上。有两条评论是合入前必须改的：请给用户 ID 加上空值检查，并在错误分支里打印 request ID。另外三条是可选的，只是一些命名上的想法，你自己判断就好。如果空值检查比看起来复杂，ping 我一下，我再看一遍。", "id": "ref0"}, {"q": "组里有人习惯「先 approve 再在评论里提严重问题」。用 30 秒在团队会上提出新的约定。", "ref": "I'd like to suggest a small rule for reviews. If a comment is about security, data correctness, or backward compatibility, please request changes instead of approving with comments. Last month we shipped a bug that was mentioned in a comment, but the approval made it look safe. For everything else, approving with comments is great, as long as you tag optional comments as non-blocking.", "ref_zh": "我想给评审提一条小规则。如果评论涉及安全、数据正确性或向后兼容，请直接要求修改，而不是带评论通过。上个月我们上线了一个 bug，它其实在评论里被提到过，但那个批准让它看起来是安全的。其他情况下，带评论通过完全没问题，只要把可选的评论标成 non-blocking 就行。", "id": "ref1"}], "words": [{"w": "loophole", "ipa": "/ˈluːphoʊl/", "zh": "漏洞、空子", "ex": "Approving with a blocking comment is a loophole in our process.", "id": "w0"}, {"w": "cosmetic", "ipa": "/kɑːzˈmetɪk/", "zh": "表面的、无关紧要的", "ex": "The remaining issues are cosmetic, so I'm fine to ship.", "id": "w1"}, {"w": "structural", "ipa": "/ˈstrʌktʃərəl/", "zh": "结构性的", "ex": "This is a structural problem; a quick patch won't fix it.", "id": "w2"}, { const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;

function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
