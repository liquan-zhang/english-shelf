<script>
const D = {"id": "030", "title": "When to Approve with Comments", "meta": "B2 · 约 260 词 · 场景：代码评审", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Middle Option", "heading_zh": "1. 中间选项", "rows": [[{"id": "s0_0_0", "md": "Between \"approve\" and \"request changes,\" there is a quiet middle option.", "text": "Between \"approve\" and \"request changes,\" there is a quiet middle option.", "zh": "在「通过」和「要求修改」之间，有一个不太起眼的中间选项。", "sp": null}, {"id": "s0_0_1", "md": "You approve the change, leave a few comments, and trust the author to handle them before merging.", "text": "You approve the change, leave a few comments, and trust the author to handle them before merging.", "zh": "你批准这个改动，留几条评论，相信作者会在合入前处理好。", "sp": null}, {"id": "s0_0_2", "md": "Used well, it removes a whole round of waiting, which matters a lot when your reviewer sleeps while you work.", "text": "Used well, it removes a whole round of waiting, which matters a lot when your reviewer sleeps while you work.", "zh": "用得好，它能省掉一整轮等待，尤其当你在干活时评审人正在睡觉，这一点就特别重要。", "sp": null}], [{"id": "s0_1_0", "md": "Used badly, it becomes a ==loophole==.", "text": "Used badly, it becomes a loophole.", "zh": "用得不好，它就成了一个漏洞。", "sp": null}, {"id": "s0_1_1", "md": "A busy reviewer approves, mentions a serious bug in a comment, and the bug ships anyway because the author read the green check and nothing else.", "text": "A busy reviewer approves, mentions a serious bug in a comment, and the bug ships anyway because the author read the green check and nothing else.", "zh": "一个很忙的评审人点了通过，在评论里提了一个严重 bug，结果 bug 还是上线了，因为作者只看了那个绿色的勾，别的什么都没看。", "sp": null}, {"id": "s0_1_2", "md": "**An approval is a promise that the code is safe to merge, not a polite way to end the review.**", "text": "An approval is a promise that the code is safe to merge, not a polite way to end the review.", "zh": "批准代表你承诺这段代码可以安全合入，而不是一种客气地结束评审的方式。", "sp": null}], [{"id": "s0_2_0", "md": "So the real question is not how many comments you have.", "text": "So the real question is not how many comments you have.", "zh": "所以真正的问题不在于你有多少条评论。", "sp": null}, {"id": "s0_2_1", "md": "It is whether the remaining issues are ==cosmetic== or ==structural==.", "text": "It is whether the remaining issues are cosmetic or structural.", "zh": "而在于剩下的问题是表面的，还是结构性的。", "sp": null}, {"id": "s0_2_2", "md": "Ten small naming comments can be fine, while one quiet comment about data loss is not.", "text": "Ten small naming comments can be fine, while one quiet comment about data loss is not.", "zh": "十条小的命名评论可能没关系，而一条不起眼的、关于丢数据的评论就不行。", "sp": null}]]}, {"heading": "2. Three Conditions for a Conditional Yes", "heading_zh": "2. 有条件通过的三个前提", "rows": [[{"id": "s1_0_0", "md": "Approve with comments only when three things are true.", "text": "Approve with comments only when three things are true.", "zh": "只有同时满足三个条件时，才用「带评论通过」。", "sp": null}, {"id": "s1_0_1", "md": "The issues are small, like naming, a missing log line, or a clearer error message.", "text": "The issues are small, like naming, a missing log line, or a clearer error message.", "zh": "问题都很小，比如命名、少了一行日志，或者报错信息可以更清楚。", "sp": null}, {"id": "s1_0_2", "md": "The change is easy to ==reverse== if something __slips through__.", "text": "The change is easy to reverse if something slips through.", "zh": "万一有什么漏过去了，这个改动也很容易回滚。", "sp": null}, {"id": "s1_0_3", "md": "And you trust this author to __follow through__ without being checked again.", "text": "And you trust this author to follow through without being checked again.", "zh": "而且你相信这位作者不用再被检查一遍，也会把事情落实到位。", "sp": null}], [{"id": "s1_1_0", "md": "If any of those is false, request changes.", "text": "If any of those is false, request changes.", "zh": "只要有一条不满足，就要求修改。", "sp": null}, {"id": "s1_1_1", "md": "Anything touching security, data correctness, or ==backward compatibility== deserves a second look, no matter how small the fix seems.", "text": "Anything touching security, data correctness, or backward compatibility deserves a second look, no matter how small the fix seems.", "zh": "凡是涉及安全、数据正确性或向后兼容的，都值得再看一遍，不管修复看起来多小。", "sp": null}, {"id": "s1_1_2", "md": "A day of delay is cheap compared with a broken client in production.", "text": "A day of delay is cheap compared with a broken client in production.", "zh": "跟线上客户端被搞挂相比，晚一天根本不算什么。", "sp": null}], [{"id": "s1_2_0", "md": "**Whatever you choose, make it explicit which comments are required and which are optional.**", "text": "Whatever you choose, make it explicit which comments are required and which are optional.", "zh": "不管你选哪个，都要明确说清楚哪些评论是必须改的，哪些是可选的。", "sp": null}, {"id": "s1_2_1", "md": "A quick \"non-blocking\" tag on the optional ones __removes the guesswork__.", "text": "A quick \"non-blocking\" tag on the optional ones removes the guesswork.", "zh": "在可选的评论上加个「non-blocking」标签，就省得对方去猜了。", "sp": null}, {"id": "s1_2_2", "md": "Over time, this habit builds ==mutual== trust, and reviews get faster for everyone.", "text": "Over time, this habit builds mutual trust, and reviews get faster for everyone.", "zh": "时间长了，这个习惯能建立起彼此的信任，大家的评审都会变快。", "sp": null}]]}], "gist": [{"q": "「带意见通过」用得好和用得不好分别会怎样？", "a": "用得好能省掉一轮等待（尤其跨时区）；用得不好就成了漏洞，严重 bug 写在评论里却照样上线。"}, {"q": "作者说判断的关键是什么？", "a": "不看评论数量，而看剩下的问题是表面的（命名等）还是结构性的（如数据丢失）。"}, {"q": "什么时候可以带意见通过？什么时候必须要求修改？", "a": "问题很小、容易回滚、信任作者会跟进时可以通过；涉及安全、数据正确性、向后兼容时必须要求修改。"}], "dictation": [{"id": "s0_1_2", "text": "An approval is a promise that the code is safe to merge, not a polite way to end the review."}, {"id": "s1_2_0", "text": "Whatever you choose, make it explicit which comments are required and which are optional."}, {"id": "s1_1_0", "text": "If any of those is false, request changes."}, {"id": "s0_2_0", "text": "So the real question is not how many comments you have."}], "shadow": {"text": "So the real question is not how many comments you have. It is whether the remaining issues are cosmetic or structural. Ten small naming comments can be fine, while one quiet comment about data loss is not.", "marked": "So the <b>real</b> question / is <b>not</b> how many comments you have. //<br>It is whether the remaining issues / are <b>cosmetic</b> / or <b>structural</b>. //<br><b>Ten</b> small naming comments / can be <b>fine</b>, / while <b>one</b> quiet comment about <b>data loss</b> / is <b>not</b>. //"}, "prompts": [{"q": "你 approve 了一个 PR 并留了几条意见，作者在另一个时区。用 30 秒（语音留言）说明哪些必须改、哪些可选。", "ref": "Hi, I've approved your change so you don't have to wait for me overnight. Two of my comments are required before you merge: please add the null check on the user ID, and log the request ID in the error path. The other three are optional, just naming ideas, so use your judgment. If the null check turns out to be more complicated than it looks, ping me and I'll take another look.", "ref_zh": "嗨，我已经批准了你的改动，这样你不用等我一晚上。有两条评论是合入前必须改的：请给用户 ID 加上空值检查，并在错误分支里打印 request ID。另外三条是可选的，只是一些命名上的想法，你自己判断就好。如果空值检查比看起来复杂，ping 我一下，我再看一遍。", "id": "ref0"}, {"q": "组里有人习惯「先 approve 再在评论里提严重问题」。用 30 秒在团队会上提出新的约定。", "ref": "I'd like to suggest a small rule for reviews. If a comment is about security, data correctness, or backward compatibility, please request changes instead of approving with comments. Last month we shipped a bug that was mentioned in a comment, but the approval made it look safe. For everything else, approving with comments is great, as long as you tag optional comments as non-blocking.", "ref_zh": "我想给评审提一条小规则。如果评论涉及安全、数据正确性或向后兼容，请直接要求修改，而不是带评论通过。上个月我们上线了一个 bug，它其实在评论里被提到过，但那个批准让它看起来是安全的。其他情况下，带评论通过完全没问题，只要把可选的评论标成 non-blocking 就行。", "id": "ref1"}], "words": [{"w": "loophole", "ipa": "/ˈluːphoʊl/", "zh": "漏洞、空子", "ex": "Approving with a blocking comment is a loophole in our process.", "id": "w0"}, {"w": "cosmetic", "ipa": "/kɑːzˈmetɪk/", "zh": "表面的、无关紧要的", "ex": "The remaining issues are cosmetic, so I'm fine to ship.", "id": "w1"}, {"w": "structural", "ipa": "/ˈstrʌktʃərəl/", "zh": "结构性的", "ex": "This is a structural problem; a quick patch won't fix it.", "id": "w2"}, {"w": "reverse (v.)", "ipa": "/rɪˈvɜːrs/", "zh": "撤销、逆转", "ex": "A feature flag lets us reverse the change in seconds.", "tts_w": "reverse", "id": "w3"}, {"w": "backward compatibility", "ipa": "/ˌbækwərd kəmˌpætəˈbɪləti/", "zh": "向后兼容", "ex": "Renaming this field breaks backward compatibility for older clients.", "id": "w4"}, {"w": "mutual", "ipa": "/ˈmjuːtʃuəl/", "zh": "相互的", "ex": "Fast reviews depend on mutual trust between the teams.", "id": "w5"}, {"w": "explicit", "ipa": "/ɪkˈsplɪsɪt/", "zh": "明确的", "ex": "Please be explicit about which comments block the merge.", "id": "w6"}, {"w": "guesswork", "ipa": "/ˈɡeswɜːrk/", "zh": "猜测", "ex": "Clear labels take the guesswork out of code review.", "id": "w7"}, {"w": "conditional", "ipa": "/kənˈdɪʃənl/", "zh": "有条件的", "ex": "It's a conditional yes: fix the logging and you can merge.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. The Middle Option", "zh": "1. 中间选项", "start": 0.0, "end": 1.872, "words": [[0.118, 0.382], [0.711, 0.789], [0.803, 1.053], [1.066, 1.474]]}, {"kind": "s", "id": "s0_0_0", "md": "Between \"approve\" and \"request changes,\" there is a quiet middle option.", "zh": "在「通过」和「要求修改」之间，有一个不太起眼的中间选项。", "sp": null, "gap": false, "start": 1.872, "end": 6.672, "words": [[1.99, 2.385], [2.411, 3.082], [3.267, 3.385], [3.411, 3.872], [3.885, 4.438], [4.727, 4.885], [4.898, 4.99], [5.004, 5.083], [5.096, 5.556], [5.569, 5.833], [5.846, 6.293]]}, {"kind": "s", "id": "s0_0_1", "md": "You approve the change, leave a few comments, and trust the author to handle them before merging.", "zh": "你批准这个改动，留几条评论，相信作者会在合入前处理好。", "sp": null, "gap": false, "start": 6.672, "end": 12.336, "words": [[6.777, 6.935], [6.948, 7.33], [7.343, 7.435], [7.448, 8.027], [8.277, 8.422], [8.435, 8.488], [8.501, 8.711], [8.725, 9.356], [9.593, 9.711], [9.725, 10.08], [10.093, 10.211], [10.225, 10.554], [10.567, 10.619], [10.633, 11.014], [11.027, 11.185], [11.198, 11.527], [11.54, 11.935]]}, {"kind": "s", "id": "s0_0_2", "m h": "凡是涉及安全、数据正确性或向后兼容的，都值得再看一遍，不管修复看起来多小。", "sp": null, "gap": false, "start": 72.12, "end": 80.664, "words": [[72.225, 72.686], [72.699, 73.133], [73.146, 73.87], [74.133, 74.37], [74.383, 75.067], [75.278, 75.423], [75.436, 75.883], [75.896, 76.765], [76.778, 77.199], [77.212, 77.265], [77.278, 77.738], [77.752, 78.002], [78.331, 78.449], [78.462, 78.765], [78.778, 78.923], [78.936, 79.304], [79.317, 79.396], [79.409, 79.712], [79.725, 80.265]]}, {"kind": "s", "id": "s1_1_2", "md": "A day of delay is cheap compared with a broken client in production.", "zh": "跟线上客户端被搞挂相比，晚一天根本不算什么。", "sp": null, "gap": false, "start": 80.664, "end": 85.104, "words": [[80.769, 80.835], [80.848, 81.085], [81.098, 81.203], [81.217, 81.677], [81.69, 81.861], [81.875, 82.243], [82.322, 82.822], [82.835, 82.98], [82.993, 83.059], [83.138, 83.585], [83.598, 84.006], [84.111, 84.177], [84.19, 84.717]]}, {"kind": "s", "id": "s1_2_0", "md": "**Whatever you choose, make it explicit which comments are required and which are optional.**", "zh": "不管你选哪个，都要明确说清楚哪些评论是必须改的，哪些是可选的。", "sp": null, "gap": true, "start": 85.104, "end": 90.384, "words": [[85.209, 85.578], [85.591, 85.722], [85.736, 86.288], [86.538, 86.722], [86.736, 86.801], [86.815, 87.42], [87.433, 87.617], [87.63, 88.078], [88.091, 88.183], [88.196, 88.801], [88.986, 89.117], [89.13, 89.315], [89.328, 89.446], [89.459, 89.986]]}, {"kind": "s", "id": "s1_2_1", "md": "A quick \"non-blocking\" tag on the optional ones __removes the guesswork__.", "zh": "在可选的评论上加个「non-blocking」标签，就省得对方去猜了。", "sp": null, "gap": false, "start": 90.384, "end": 95.184, "words": [[90.489, 90.555], [90.568, 90.91], [90.989, 91.831], [91.858, 92.358], [92.423, 92.502], [92.516, 92.608], [92.621, 93.173], [93.187, 93.489], [93.502, 94.042], [94.055, 94.147], [94.16, 94.792]]}, {"kind": "s", "id": "s1_2_2", "md": "Over time, this habit builds ==mutual== trust, and reviews get faster for everyone.", "zh": "时间长了，这个习惯能建立起彼此的信任，大家的评审都会变快。", "sp": null, "gap": false, "start": 95.184, "end": 101.016, "words": [[95.289, 95.487], [95.5, 95.921], [96.342, 96.5], [96.513, 96.934], [96.947, 97.276], [97.289, 97.789], [97.802, 98.342], [98.645, 98.723], [98.737, 99.237], [99.25, 99.421], [99.434, 99.973], [99.987, 100.144], [100.158, 100.631]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
