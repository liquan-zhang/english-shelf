<script>
const D = {"id": "082", "title": "Remembering Things About People", "meta": "B2 · 约 290 词 · 场景：记住同事的小事", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Colleague Who Remembered", "heading_zh": "1. 那位记得我的同事", "rows": [[{"id": "s0_0_0", "md": "Last spring, a designer I had met only once asked me, \"How did your daughter's piano exam go?\"", "text": "Last spring, a designer I had met only once asked me, \"How did your daughter's piano exam go?\"", "zh": "去年春天，一位我只见过一面的设计师问我：「你女儿的钢琴考级怎么样了？」", "sp": null}, {"id": "s0_0_1", "md": "I had mentioned it __in passing__, weeks earlier, at the end of a call.", "text": "I had mentioned it in passing, weeks earlier, at the end of a call.", "zh": "那是几周前一次通话快结束时，我随口提的一句。", "sp": null}, {"id": "s0_0_2", "md": "I was ==genuinely== surprised, and from that moment I __went out of my way__ to help her whenever she asked.", "text": "I was genuinely surprised, and from that moment I went out of my way to help her whenever she asked.", "zh": "我是真的很意外，从那以后，只要她找我帮忙，我都会特意帮她。", "sp": null}], [{"id": "s0_1_0", "md": "That is the quiet power of remembering ==trivial== things.", "text": "That is the quiet power of remembering trivial things.", "zh": "这就是记住小事的无声力量。", "sp": null}, {"id": "s0_1_1", "md": "It costs almost nothing, yet it tells people they are more than a ticket in your queue.", "text": "It costs almost nothing, yet it tells people they are more than a ticket in your queue.", "zh": "它几乎不花什么成本，却能让对方知道，自己在你眼里不只是队列里的一张工单。", "sp": null}, {"id": "s0_1_2", "md": "**People rarely remember what you said, but they always remember that you remembered.**", "text": "People rarely remember what you said, but they always remember that you remembered.", "zh": "人们很少记得你说过什么，但总会记得你记得他们。", "sp": null}], [{"id": "s0_2_0", "md": "Most of us do not have that kind of memory, especially when we work with dozens of people across several teams.", "text": "Most of us do not have that kind of memory, especially when we work with dozens of people across several teams.", "zh": "我们大多数人没有那么好的记性，尤其是要和好几个团队、几十号人打交道的时候。", "sp": null}, {"id": "s0_2_1", "md": "So we should not ==rely== on memory alone.", "text": "So we should not rely on memory alone.", "zh": "所以不能只靠脑子记。", "sp": null}, {"id": "s0_2_2", "md": "We need a small system.", "text": "We need a small system.", "zh": "我们需要一个小系统。", "sp": null}]]}, {"heading": "2. A Two-Line Habit", "heading_zh": "2. 两行笔记的习惯", "rows": [[{"id": "s1_0_0", "md": "**After any real conversation, write down two lines: one fact and one thing to follow up on.**", "text": "After any real conversation, write down two lines: one fact and one thing to follow up on.", "zh": "每次真正聊过之后，记两行：一条事实，一件之后要跟进的事。", "sp": null}, {"id": "s1_0_1", "md": "For example: \"Marco, moving apartments next month. Ask how the move went.\"", "text": "For example: \"Marco, moving apartments next month. Ask how the move went.\"", "zh": "比如：「Marco，下个月搬家。回头问问搬得怎么样。」", "sp": null}, {"id": "s1_0_2", "md": "Keep these notes in one place, next to the person's name in your contacts or in a simple document.", "text": "Keep these notes in one place, next to the person's name in your contacts or in a simple document.", "zh": "这些笔记放在一个地方，记在通讯录里这个人的名字旁边，或者一个简单的文档里。", "sp": null}], [{"id": "s1_1_0", "md": "Before your next one-on-one or coffee chat, spend thirty seconds reading the note.", "text": "Before your next one-on-one or coffee chat, spend thirty seconds reading the note.", "zh": "下次一对一或者喝咖啡之前，花三十秒看一眼笔记。", "sp": null}, {"id": "s1_1_1", "md": "Then open with a ==callback==: \"Last time you were in the middle of moving. Did it all go smoothly?\"", "text": "Then open with a callback: \"Last time you were in the middle of moving. Did it all go smoothly?\"", "zh": "然后用一句回扣开场：「上次你正忙着搬家，后来都还顺利吧？」", "sp": null}, {"id": "s1_1_2", "md": "This __shows you were listening__ and gives the other person an easy story to tell.", "text": "This shows you were listening and gives the other person an easy story to tell.", "zh": "这说明你当时在认真听，也给了对方一个好讲的话题。", "sp": null}], [{"id": "s1_2_0", "md": "Be careful with ==sensitive== topics.", "text": "Be careful with sensitive topics.", "zh": "敏感话题要小心。", "sp": null}, {"id": "s1_2_1", "md": "Health problems, family conflicts, or a rejected promotion are things to __bring up__ only if the other person raises them first.", "text": "Health problems, family conflicts, or a rejected promotion are things to bring up only if the other person raises them first.", "zh": "健康问题、家庭矛盾，或者晋升没过，这些只有对方自己先提起，你才能聊。", "sp": null}, {"id": "s1_2_2", "md": "Stick to ==milestones== people are happy to share: trips, hobbies, exams, new pets, a first marathon.", "text": "Stick to milestones people are happy to share: trips, hobbies, exams, new pets, a first marathon.", "zh": "就聊那些大家乐意分享的节点：旅行、爱好、考试、新养的宠物、第一次跑全马。", "sp": null}], [{"id": "s1_3_0", "md": "Done ==consistently==, this habit __adds up__.", "text": "Done consistently, this habit adds up.", "zh": "坚持下来，这个习惯会慢慢攒出效果。", "sp": null}, {"id": "s1_3_1", "md": "You will not just be the manager from the other team; you will be the person who asked about their dog.", "text": "You will not just be the manager from the other team; you will be the person who asked about their dog.", "zh": "你不再只是隔壁团队的某个经理；你会是那个问起他们家狗狗的人。", "sp": null}]]}], "gist": [{"q": "作者开头讲的设计师的故事说明了什么？", "a": "只见过一面的人记得他随口提过的女儿钢琴考试，让他很意外，之后主动帮她；记住小事成本低、回报大。"}, {"q": "作者建议的“两行习惯”具体是什么？", "a": "每次真正的交谈后记两行：一个事实 + 一件下次要跟进的事；见面前花三十秒看一眼，用 callback 开场。"}, {"q": "哪些话题要小心？应该聊什么？", "a": "健康、家庭矛盾、晋升被拒等敏感话题，除非对方先提；多聊对方乐于分享的里程碑：旅行、爱好、考试、宠物、第一次马拉松。"}], "dictation": [{"id": "s0_1_2", "text": "People rarely remember what you said, but they always remember that you remembered."}, {"id": "s0_2_1", "text": "So we should not rely on memory alone."}, {"id": "s1_0_0", "text": "After any real conversation, write down two lines: one fact and one thing to follow up on."}, {"id": "s1_1_2", "text": "This shows you were listening and gives the other person an easy story to tell."}], "shadow": {"text": "Before your next one-on-one or coffee chat, spend thirty seconds reading the note. Then open with a callback: \"Last time you were in the middle of moving. Did it all go smoothly?\" This shows you were listening and gives the other person an easy story to tell.", "marked": "Before your next <b>one-on-one</b> or coffee chat, / spend <b>thirty seconds</b> / reading the <b>note</b>. //<br>Then open with a <b>callback</b>: / \"Last time you were in the middle of <b>moving</b>. / Did it all go <b>smoothly</b>?\" //<br>This shows you were <b>listening</b> / and gives the other person / an <b>easy</b> story to tell. //"}, "prompts": [{"q": "你和新加坡同事 Wei Ling 两周没见，上次她说要带父母去日本。现在在茶水间碰到她，用 callback 开场聊 30 秒。", "ref": "Hey Wei Ling, welcome back! Last time we talked, you were about to take your parents to Japan. How did it go? Did they cope with all the walking? That sounds lovely. My parents visited me here last year, and I think they walked more in one week than in a whole year at home. Any place you'd recommend?", "ref_zh": "嘿 Wei Ling，欢迎回来！上次聊的时候，你正准备带爸妈去日本。玩得怎么样？他们走那么多路吃得消吗？听着真不错。我爸妈去年来这边看我，我觉得他们一周走的路比在家一年都多。有什么地方推荐吗？", "id": "ref0"}, {"q": "一对一开始时，你想关心下属最近搬家的事，但又不想显得在查岗。30 秒自然带过，再进入正题。", "ref": "Before we get into the project, how did the move go? I remember you said the new place is closer to the office. Has the commute actually gotten better? Good to hear. If you need a morning off to sort out the boxes, just let me know. Okay, shall we start with the release plan?", "ref_zh": "聊项目之前，先问一句，搬家还顺利吗？我记得你说新家离公司更近。通勤是真的轻松些了吗？那挺好。要是需要请半天假收拾箱子，跟我说一声就行。好，我们先从发布计划开始？", "id": "ref1"}], "words": [{"w": "genuinely", "ipa": "/ˈdʒenjuɪnli/", "zh": "真诚地、确实", "ex": "I was genuinely impressed by how fast the new hire picked up the codebase.", "id": "w0"}, {"w": "trivial", "ipa": "/ˈtrɪviəl/", "zh": "琐碎的、微不足道的", "ex": "It sounds trivial, but fixing the error message cut support tickets in half.", "id": "w1"}, {"w": "rely on", "ipa": "/rɪˈlaɪ ɑːn/", "zh": "依赖、依靠", "ex const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
