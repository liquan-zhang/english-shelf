<script>
const D = {"id": "082", "title": "Remembering Things About People", "meta": "B2 · 约 290 词 · 场景：记住同事的小事", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Colleague Who Remembered", "heading_zh": "1. 那位记得我的同事", "rows": [[{"id": "s0_0_0", "md": "Last spring, a designer I had met only once asked me, \"How did your daughter's piano exam go?\"", "text": "Last spring, a designer I had met only once asked me, \"How did your daughter's piano exam go?\"", "zh": "去年春天，一位我只见过一面的设计师问我：「你女儿的钢琴考级怎么样了？」", "sp": null}, {"id": "s0_0_1", "md": "I had mentioned it __in passing__, weeks earlier, at the end of a call.", "text": "I had mentioned it in passing, weeks earlier, at the end of a call.", "zh": "那是几周前一次通话快结束时，我随口提的一句。", "sp": null}, {"id": "s0_0_2", "md": "I was ==genuinely== surprised, and from that moment I __went out of my way__ to help her whenever she asked.", "text": "I was genuinely surprised, and from that moment I went out of my way to help her whenever she asked.", "zh": "我是真的很意外，从那以后，只要她找我帮忙，我都会特意帮她。", "sp": null}], [{"id": "s0_1_0", "md": "That is the quiet power of remembering ==trivial== things.", "text": "That is the quiet power of remembering trivial things.", "zh": "这就是记住小事的无声力量。", "sp": null}, {"id": "s0_1_1", "md": "It costs almost nothing, yet it tells people they are more than a ticket in your queue.", "text": "It costs almost nothing, yet it tells people they are more than a ticket in your queue.", "zh": "它几乎不花什么成本，却能让对方知道，自己在你眼里不只是队列里的一张工单。", "sp": null}, {"id": "s0_1_2", "md": "**People rarely remember what you said, but they always remember that you remembered.**", "text": "People rarely remember what you said, but they always remember that you remembered.", "zh": "人们很少记得你说过什么，但总会记得你记得他们。", "sp": null}], [{"id": "s0_2_0", "md": "Most of us do not have that kind of memory, especially when we work with dozens of people across several teams.", "text": "Most of us do not have that kind of memory, especially when we work with dozens of people across several teams.", "zh": "我们大多数人没有那么好的记性，尤其是要和好几个团队、几十号人打交道的时候。", "sp": null}, {"id": "s0_2_1", "md": "So we should not ==rely== on memory alone.", "text": "So we should not rely on memory alone.", "zh": "所以不能只靠脑子记。", "sp": null}, {"id": "s0_2_2", "md": "We need a small system.", "text": "We need a small system.", "zh": "我们需要一个小系统。", "sp": null}]]}, {"heading": "2. A Two-Line Habit", "heading_zh": "2. 两行笔记的习惯", "rows": [[{"id": "s1_0_0", "md": "**After any real conversation, write down two lines: one fact and one thing to follow up on.**", "text": "After any real conversation, write down two lines: one fact and one thing to follow up on.", "zh": "每次真正聊过之后，记两行：一条事实，一件之后要跟进的事。", "sp": null}, {"id": "s1_0_1", "md": "For example: \"Marco, moving apartments next month. Ask how the move went.\"", "text": "For example: \"Marco, moving apartments next month. Ask how the move went.\"", "zh": "比如：「Marco，下个月搬家。回头问问搬得怎么样。」", "sp": null}, {"id": "s1_0_2", "md": "Keep these notes in one place, next to the person's name in your contacts or in a simple document.", "text": "Keep these notes in one place, next to the person's name in your contacts or in a simple document.", "zh": "这些笔记放在一个地方，记在通讯录里这个人的名字旁边，或者一个简单的文档里。", "sp": null}], [{"id": "s1_1_0", "md": "Before your next one-on-one or coffee chat, spend thirty seconds reading the note.", "text": "Before your next one-on-one or coffee chat, spend thirty seconds reading the note.", "zh": "下次一对一或者喝咖啡之前，花三十秒看一眼笔记。", "sp": null}, {"id": "s1_1_1", "md": "Then open with a ==callback==: \"Last time you were in the middle of moving. Did it all go smoothly?\"", "text": "Then open with a callback: \"Last time you were in the middle of moving. Did it all go smoothly?\"", "zh": "然后用一句回扣开场：「上次你正忙着搬家，后来都还顺利吧？」", "sp": null}, {"id": "s1_1_2", "md": "This __shows you were listening__ and gives the other person an easy story to tell.", "text": "This shows you were listening and gives the other person an easy story to tell.", "zh": "这说明你当时在认真听，也给了对方一个好讲的话题。", "sp": null}], [{"id": "s1_2_0", "md": "Be careful with ==sensitive== topics.", "text": "Be careful with sensitive topics.", "zh": "敏感话题要小心。", "sp": null}, {"id": "s1_2_1", "md": "Health problems, family conflicts, or a rejected promotion are things to __bring up__ only if the other person raises them first.", "text": "Health problems, family conflicts, or a rejected promotion are things to bring up only if the other person raises them first.", "zh": "健康问题、家庭矛盾，或者晋升没过，这些只有对方自己先提起，你才能聊。", "sp": null}, {"id": "s1_2_2", "md": "Stick to ==milestones== people are happy to share: trips, hobbies, exams, new pets, a first marathon.", "text": "Stick to milestones people are happy to share: trips, hobbies, exams, new pets, a first marathon.", "zh": "就聊那些大家乐意分享的节点：旅行、爱好、考试、新养的宠物、第一次跑全马。", "sp": null}], [{"id": "s1_3_0", "md": "Done ==consistently==, this habit __adds up__.", "text": "Done consistently, this habit adds up.", "zh": "坚持下来，这个习惯会慢慢攒出效果。", "sp": null}, {"id": "s1_3_1", "md": "You will not just be the manager from the other team; you will be the person who asked about their dog.", "text": "You will not just be the manager from the other team; you will be the person who asked about their dog.", "zh": "你不再只是隔壁团队的某个经理；你会是那个问起他们家狗狗的人。", "sp": null}]]}], "gist": [{"q": "作者开头讲的设计师的故事说明了什么？", "a": "只见过一面的人记得他随口提过的女儿钢琴考试，让他很意外，之后主动帮她；记住小事成本低、回报大。"}, {"q": "作者建议的“两行习惯”具体是什么？", "a": "每次真正的交谈后记两行：一个事实 + 一件下次要跟进的事；见面前花三十秒看一眼，用 callback 开场。"}, {"q": "哪些话题要小心？应该聊什么？", "a": "健康、家庭矛盾、晋升被拒等敏感话题，除非对方先提；多聊对方乐于分享的里程碑：旅行、爱好、考试、宠物、第一次马拉松。"}], "dictation": [{"id": "s0_1_2", "text": "People rarely remember what you said, but they always remember that you remembered."}, {"id": "s0_2_1", "text": "So we should not rely on memory alone."}, {"id": "s1_0_0", "text": "After any real conversation, write down two lines: one fact and one thing to follow up on."}, {"id": "s1_1_2", "text": "This shows you were listening and gives the other person an easy story to tell."}], "shadow": {"text": "Before your next one-on-one or coffee chat, spend thirty seconds reading the note. Then open with a callback: \"Last time you were in the middle of moving. Did it all go smoothly?\" This shows you were listening and gives the other person an easy story to tell.", "marked": "Before your next <b>one-on-one</b> or coffee chat, / spend <b>thirty seconds</b> / reading the <b>note</b>. //<br>Then open with a <b>callback</b>: / \"Last time you were in the middle of <b>moving</b>. / Did it all go <b>smoothly</b>?\" //<br>This shows you were <b>listening</b> / and gives the other person / an <b>easy</b> story to tell. //"}, "prompts": [{"q": "你和新加坡同事 Wei Ling 两周没见，上次她说要带父母去日本。现在在茶水间碰到她，用 callback 开场聊 30 秒。", "ref": "Hey Wei Ling, welcome back! Last time we talked, you were about to take your parents to Japan. How did it go? Did they cope with all the walking? That sounds lovely. My parents visited me here last year, and I think they walked more in one week than in a whole year at home. Any place you'd recommend?", "ref_zh": "嘿 Wei Ling，欢迎回来！上次聊的时候，你正准备带爸妈去日本。玩得怎么样？他们走那么多路吃得消吗？听着真不错。我爸妈去年来这边看我，我觉得他们一周走的路比在家一年都多。有什么地方推荐吗？", "id": "ref0"}, {"q": "一对一开始时，你想关心下属最近搬家的事，但又不想显得在查岗。30 秒自然带过，再进入正题。", "ref": "Before we get into the project, how did the move go? I remember you said the new place is closer to the office. Has the commute actually gotten better? Good to hear. If you need a morning off to sort out the boxes, just let me know. Okay, shall we start with the release plan?", "ref_zh": "聊项目之前，先问一句，搬家还顺利吗？我记得你说新家离公司更近。通勤是真的轻松些了吗？那挺好。要是需要请半天假收拾箱子，跟我说一声就行。好，我们先从发布计划开始？", "id": "ref1"}], "words": [{"w": "genuinely", "ipa": "/ˈdʒenjuɪnli/", "zh": "真诚地、确实", "ex": "I was genuinely impressed by how fast the new hire picked up the codebase.", "id": "w0"}, {"w": "trivial", "ipa": "/ˈtrɪviəl/", "zh": "琐碎的、微不足道的", "ex": "It sounds trivial, but fixing the error message cut support tickets in half.", "id": "w1"}, {"w": "rely on", "ipa": "/rɪˈlaɪ ɑːn/", "zh": "依赖、依靠", "ex const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
