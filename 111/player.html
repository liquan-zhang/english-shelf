const D = {"id": "111", "type": "dialogue", "title": "Ordering Drinks at a Bar", "meta": "B2 · 约 270 词 · 场景：酒吧点酒、开账与核对账单", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Bartender", "name_zh": "调酒师", "voice": "en-US-EmmaNeural"}}, "gist": [{"q": "欢乐时光有什么优惠？", "a": "八点前自家酒和生啤买一送一，指定鸡尾酒十二块。"}, {"q": "「你」给自己和朋友各点了什么？为什么？", "a": "自己要了不太甜的柚子金汤力；朋友要开车，所以点了姜汁青柠无酒精鸡尾酒。"}, {"q": "结账时发现了哪两个问题？", "a": "最后一轮是七点四十五点的，却因为八点零五才录入被按原价收；还多算了一份隔壁桌的玉米片。总数从两百一十八改成一百七十六。"}], "dictation": [{"id": "s0_1_0", "text": "Hi. What's on happy hour right now?"}, {"id": "s0_7_0", "text": "Perfect, one of each. Can I start a tab? A few more colleagues are coming."}, {"id": "s1_0_0", "text": "Hi, we're heading off soon. Could I close out the tab, please?"}, {"id": "s1_4_0", "text": "I think the last round was charged at full price. We ordered it at seven forty-five, still within happy hour."}], "shadow": {"speaker": "A", "text": "I think the last round was charged at full price. We ordered it at seven forty-five, still within happy hour.", "marked": "I think the <b>last round</b> / was charged at <b>full price</b>. //<br>We ordered it at <b>seven forty-five</b>, / still within <b>happy hour</b>. //"}, "prompts": [{"q": "你请客户喝酒，但你不确定他喝不喝酒。跟调酒师说你们的需求，问几个不同口味的选择，并说明全部记在你的账上。", "ref": "Hi, I'm hosting a client tonight, and I'm not sure what he likes yet. Could you suggest a couple of options? Maybe one light cocktail, one good whisky, and something non-alcoholic in case he doesn't drink. Whatever we order tonight, please put it all on my tab. Here's my card.", "ref_zh": "你好，我今晚招待一位客户，还不清楚他喜欢喝什么。能推荐几个选择吗？比如一款清淡的鸡尾酒、一款好的威士忌，再来一款无酒精的，以防他不喝酒。今晚点的全都记在我的账上。这是我的卡。", "id": "ref0"}, {"q": "你点了一杯鸡尾酒，喝了一口发现太甜，跟你说的口味完全不一样。礼貌地跟调酒师说明，问能不能调整或换一杯。", "ref": "Sorry, could I ask you something? I had a sip of this, and it's a lot sweeter than I expected. I'm not a fan of sweet drinks. Is there any way to make it a bit drier, maybe with more lime or soda? If not, I'm happy to switch to a gin and tonic instead.", "ref_zh": "不好意思，想问一下。我尝了一口，比我想的甜很多。我不太喜欢甜的。能不能调干一点，比如多加点青柠或者苏打水？不行的话，我换一杯金汤力也可以。", "id": "ref1"}], "words": [{"w": "happy hour", "ipa": "/ˈhæpi aʊər/", "zh": "欢乐时光（酒水优惠时段）", "ex": "Happy hour ends at eight.", "id": "w0"}, {"w": "one-for-one", "ipa": "/ˌwʌn fər ˈwʌn/", "zh": "买一送一", "ex": "Bubble tea is one-for-one on Wednesdays.", "id": "w1"}, {"w": "yuzu", "ipa": "/ˈjuːzuː/", "zh": "日本柚子", "ex": "This cake has a light yuzu flavour.", "id": "w2"}, {"w": "crisp", "ipa": "/krɪsp/", "zh": "（口感）清爽的", "ex": "I'd like a crisp white wine with the fish.", "id": "w3"}, {"w": "non-alcoholic", "ipa": "/ˌnɑːn ælkəˈhɔːlɪk/", "zh": "不含酒精的", "ex": "Do you have any non-alcoholic beer?", "id": "w4"}, {"w": "mocktail", "ipa": "/ˈmɑːkteɪl/", "zh": "无酒精鸡尾酒", "ex": "The kids each had a fruit mocktail.", "id": "w5"}, {"w": "last round", "ipa": "/læst raʊnd/", "zh": "最后一轮（酒）", "ex": "Last round is on me.", "id": "w6"}, {"w": "keyed in", "ipa": "/kiːd ɪn/", "zh": "录入（系统）", "ex": "The order was keyed in under the wrong table.", "id": "w7"}, {"w": "adjust", "ipa": "/əˈdʒʌst/", "zh": "调整", "ex": "Could you adjust the bill? We cancelled one dish.", "id": "w8"}], "sections": [{"heading": "1. Ordering at the Bar", "heading_zh": "1. 在吧台点酒", "rows": [[{"id": "s0_0_0", "md": "Hey, what can I get you?", "text": "Hey, what can I get you?", "zh": "嗨，要喝点什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi. What's on happy hour right now?**", "text": "Hi. What's on happy hour right now?", "zh": "你好。现在欢乐时光有什么优惠？", "sp": "A"}], [{"id": "s0_2_0", "md": "Until eight, house wines and draft beers are ==one-for-one==, and selected cocktails are twelve dollars.", "text": "Until eight, house wines and draft beers are one-for-one, and selected cocktails are twelve dollars.", "zh": "八点之前，自家酒和生啤买一送一，指定鸡尾酒十二块。", "sp": "B"}], [{"id": "s0_3_0", "md": "Nice. I'm not much of a beer person, though. What would you recommend __if I like__ something not too sweet?", "text": "Nice. I'm not much of a beer person, though. What would you recommend if I like something not too sweet?", "zh": "不错。不过我不太喝啤酒。如果我喜欢不太甜的，你推荐什么？", "sp": "A"}], [{"id": "s0_4_0", "md": "Try our gin and tonic with ==yuzu==. It's ==crisp== and a little bitter. Most people love it.", "text": "Try our gin and tonic with yuzu. It's crisp and a little bitter. Most people love it.", "zh": "试试我们的柚子金汤力，清爽、带点苦味。大多数人都很喜欢。", "sp": "B"}], [{"id": "s0_5_0", "md": "I'll __go for__ that. And for my friend, anything ==non-alcoholic==? He's driving.", "text": "I'll go for that. And for my friend, anything non-alcoholic? He's driving.", "zh": "那我就要这个。给我朋友有没有不含酒精的？他要开车。", "sp": "A"}], [{"id": "s0_6_0", "md": "We do a great ginger and lime ==mocktail==. Very refreshing.", "text": "We do a great ginger and lime mocktail. Very refreshing.", "zh": "我们有一款很棒的姜汁青柠无酒精鸡尾酒，很清爽。", "sp": "B"}], [{"id": "s0_7_0", "md": "**Perfect, one of each. Can I start a tab? A few more colleagues are coming.**", "text": "Perfect, one of each. Can I start a tab? A few more colleagues are coming.", "zh": "好，各来一杯。我能开个账先挂着吗？还有几个同事要来。", "sp": "A"}], [{"id": "s0_8_0", "md": "Sure. I'll just need to hold a card behind the bar.", "text": "Sure. I'll just need to hold a card behind the bar.", "zh": "可以。我需要押一张卡在吧台。", "sp": "B"}], [{"id": "s0_9_0", "md": "Here you go. Could you also __bring a jug of water__ to our table? We're the ones by the window.", "text": "Here you go. Could you also bring a jug of water to our table? We're the ones by the window.", "zh": "给你。能再送一壶水到我们桌吗？我们坐在窗边。", "sp": "A"}], [{"id": "s0_10_0", "md": "You got it. I'll bring the drinks over.", "text": "You got it. I'll bring the drinks over.", "zh": "没问题。饮料我给你们送过去。", "sp": "B"}]]}, {"heading": "2. Closing the Tab", "heading_zh": "2. 结账", "rows": [[{"id": "s1_0_0", "md": "**Hi, we're heading off soon. Could I close out the tab, please?**", "text": "Hi, we're heading off soon. Could I close out the tab, please?", "zh": "你好， const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
