const D = {"id": "111", "type": "dialogue", "title": "Ordering Drinks at a Bar", "meta": "B2 · 约 270 词 · 场景：酒吧点酒、开账与核对账单", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Bartender", "name_zh": "调酒师", "voice": "en-US-EmmaNeural"}}, "gist": [{"q": "欢乐时光有什么优惠？", "a": "八点前自家酒和生啤买一送一，指定鸡尾酒十二块。"}, {"q": "「你」给自己和朋友各点了什么？为什么？", "a": "自己要了不太甜的柚子金汤力；朋友要开车，所以点了姜汁青柠无酒精鸡尾酒。"}, {"q": "结账时发现了哪两个问题？", "a": "最后一轮是七点四十五点的，却因为八点零五才录入被按原价收；还多算了一份隔壁桌的玉米片。总数从两百一十八改成一百七十六。"}], "dictation": [{"id": "s0_1_0", "text": "Hi. What's on happy hour right now?"}, {"id": "s0_7_0", "text": "Perfect, one of each. Can I start a tab? A few more colleagues are coming."}, {"id": "s1_0_0", "text": "Hi, we're heading off soon. Could I close out the tab, please?"}, {"id": "s1_4_0", "text": "I think the last round was charged at full price. We ordered it at seven forty-five, still within happy hour."}], "shadow": {"speaker": "A", "text": "I think the last round was charged at full price. We ordered it at seven forty-five, still within happy hour.", "marked": "I think the <b>last round</b> / was charged at <b>full price</b>. //<br>We ordered it at <b>seven forty-five</b>, / still within <b>happy hour</b>. //"}, "prompts": [{"q": "你请客户喝酒，但你不确定他喝不喝酒。跟调酒师说你们的需求，问几个不同口味的选择，并说明全部记在你的账上。", "ref": "Hi, I'm hosting a client tonight, and I'm not sure what he likes yet. Could you suggest a couple of options? Maybe one light cocktail, one good whisky, and something non-alcoholic in case he doesn't drink. Whatever we order tonight, please put it all on my tab. Here's my card.", "ref_zh": "你好，我今晚招待一位客户，还不清楚他喜欢喝什么。能推荐几个选择吗？比如一款清淡的鸡尾酒、一款好的威士忌，再来一款无酒精的，以防他不喝酒。今晚点的全都记在我的账上。这是我的卡。", "id": "ref0"}, {"q": "你点了一杯鸡尾酒，喝了一口发现太甜，跟你说的口味完全不一样。礼貌地跟调酒师说明，问能不能调整或换一杯。", "ref": "Sorry, could I ask you something? I had a sip of this, and it's a lot sweeter than I expected. I'm not a fan of sweet drinks. Is there any way to make it a bit drier, maybe with more lime or soda? If not, I'm happy to switch to a gin and tonic instead.", "ref_zh": "不好意思，想问一下。我尝了一口，比我想的甜很多。我不太喜欢甜的。能不能调干一点，比如多加点青柠或者苏打水？不行的话，我换一杯金汤力也可以。", "id": "ref1"}], "words": [{"w": "happy hour", "ipa": "/ˈhæpi aʊər/", "zh": "欢乐时光（酒水优惠时段）", "ex": "Happy hour ends at eight.", "id": "w0"}, {"w": "one-for-one", "ipa": "/ˌwʌn fər ˈwʌn/", "zh": "买一送一", "ex": "Bubble tea is one-for-one on Wednesdays.", "id": "w1"}, {"w": "yuzu", "ipa": "/ˈjuːzuː/", "zh": "日本柚子", "ex": "This cake has a light yuzu flavour.", "id": "w2"}, {"w": "crisp", "ipa": "/krɪsp/", "zh": "（口感）清爽的", "ex": "I'd like a crisp white wine with the fish.", "id": "w3"}, {"w": "non-alcoholic", "ipa": "/ˌnɑːn ælkəˈhɔːlɪk/", "zh": "不含酒精的", "ex": "Do you have any non-alcoholic beer?", "id": "w4"}, {"w": "mocktail", "ipa": "/ˈmɑːkteɪl/", "zh": "无酒精鸡尾酒", "ex": "The kids each had a fruit mocktail.", "id": "w5"}, {"w": "last round", "ipa": "/læst raʊnd/", "zh": "最后一轮（酒）", "ex": "Last round is on me.", "id": "w6"}, {"w": "keyed in", "ipa": "/kiːd ɪn/", "zh": "录入（系统）", "ex": "The order was keyed in under the wrong table.", "id": "w7"}, {"w": "adjust", "ipa": "/əˈdʒʌst/", "zh": "调整", "ex": "Could you adjust the bill? We cancelled one dish.", "id": "w8"}], "sections": [{"heading": "1. Ordering at the Bar", "heading_zh": "1. 在吧台点酒", "rows": [[{"id": "s0_0_0", "md": "Hey, what can I get you?", "text": "Hey, what can I get you?", "zh": "嗨，要喝点什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi. What's on happy hour right now?**", "text": "Hi. What's on happy hour right now?", "zh": "你好。现在欢乐时光有什么优惠？", "sp": "A"}], [{"id": "s0_2_0", "md": "Until eight, house wines and draft beers are ==one-for-one==, and selected cocktails are twelve dollars.", "text": "Until eight, house wines and draft beers are one-for-one, and selected cocktails are twelve dollars.", "zh": "八点之前，自家酒和生啤买一送一，指定鸡尾酒十二块。", "sp": "B"}], [{"id": "s0_3_0", "md": "Nice. I'm not much of a beer person, though. What would you recommend __if I like__ something not too sweet?", "text": "Nice. I'm not much of a beer person, though. What would you recommend if I like something not too sweet?", "zh": "不错。不过我不太喝啤酒。如果我喜欢不太甜的，你推荐什么？", "sp": "A"}], [{"id": "s0_4_0", "md": "Try our gin and tonic with ==yuzu==. It's ==crisp== and a little bitter. Most people love it.", "text": "Try our gin and tonic with yuzu. It's crisp and a little bitter. Most people love it.", "zh": "试试我们的柚子金汤力，清爽、带点苦味。大多数人都很喜欢。", "sp": "B"}], [{"id": "s0_5_0", "md": "I'll __go for__ that. And for my friend, anything ==non-alcoholic==? He's driving.", "text": "I'll go for that. And for my friend, anything non-alcoholic? He's driving.", "zh": "那我就要这个。给我朋友有没有不含酒精的？他要开车。", "sp": "A"}], [{"id": "s0_6_0", "md": "We do a great ginger and lime ==mocktail==. Very refreshing.", "text": "We do a great ginger and lime mocktail. Very refreshing.", "zh": "我们有一款很棒的姜汁青柠无酒精鸡尾酒，很清爽。", "sp": "B"}], [{"id": "s0_7_0", "md": "**Perfect, one of each. Can I start a tab? A few more colleagues are coming.**", "text": "Perfect, one of each. Can I start a tab? A few more colleagues are coming.", "zh": "好，各来一杯。我能开个账先挂着吗？还有几个同事要来。", "sp": "A"}], [{"id": "s0_8_0", "md": "Sure. I'll just need to hold a card behind the bar.", "text": "Sure. I'll just need to hold a card behind the bar.", "zh": "可以。我需要押一张卡在吧台。", "sp": "B"}], [{"id": "s0_9_0", "md": "Here you go. Could you also __bring a jug of water__ to our table? We're the ones by the window.", "text": "Here you go. Could you also bring a jug of water to our table? We're the ones by the window.", "zh": "给你。能再送一壶水到我们桌吗？我们坐在窗边。", "sp": "A"}], [{"id": "s0_10_0", "md": "You got it. I'll bring the drinks over.", "text": "You got it. I'll bring the drinks over.", "zh": "没问题。饮料我给你们送过去。", "sp": "B"}]]}, {"heading": "2. Closing the Tab", "heading_zh": "2. 结账", "rows": [[{"id": "s1_0_0", "md": "**Hi, we're heading off soon. Could I close out the tab, please?**", "text": "Hi, we're heading off soon. Could I close out the tab, please?", "zh": "你好，我们要走了。能帮我结一下账吗？", "sp": "A"}], [{"id": "s1_1_0", "md": "Sure. That comes to two hundred and eighteen dollars.", "text": "Sure. That comes to two hundred and eighteen dollars.", "zh": "好的。一共两百一十八块。", "sp": "B"}], [{"id": "s1_2_0", "md": "Hmm, that seems a bit high. Could I __take a look at__ the bill before I pay?", "text": "Hmm, that seems a bit high. Could I take a look at the bill before I pay?", "zh": "嗯，好像有点多。付钱之前能让我看一下账单吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "Of course, here you go.", "text": "Of course, here you go.", "zh": "当然，给你。", "sp": "B"}], [{"id": "s1_4_0", "md": "I think the ==last round== was charged at full price. We ordered it at seven forty-five, still within ==happy hour==.", "text": "I think the last round was charged at full price. We ordered it at seven forty-five, still within happy hour.", "zh": "最后一轮好像是按原价收的。我们七点四十五点的，还在欢乐时光内。", "sp": "A"}], [{"id": "s1_5_0", "md": "Let me check the system. Oh, you're right. It was ==keyed in== at eight oh five. Sorry, I'll ==adjust== that.", "text": "Let me check the system. Oh, you're right. It was keyed in at eight oh five. Sorry, I'll adjust that.", "zh": "我查一下系统。哦，你说得对。是八点零五才录进去的。抱歉，我改一下。", "sp": "B"}], [{"id": "s1_6_0", "md": "Thanks. And we didn't order these nachos. I think they're from the next table.", "text": "Thanks. And we didn't order these nachos. I think they're from the next table.", "zh": "谢谢。还有，这份玉米片不是我们点的，应该是隔壁桌的。", "sp": "A"}], [{"id": "s1_7_0", "md": "My bad. I'll take those off too. The new total is one hundred and seventy-six.", "text": "My bad. I'll take those off too. The new total is one hundred and seventy-six.", "zh": "是我搞错了，这个也去掉。新的总数是一百七十六。", "sp": "B"}], [{"id": "s1_8_0", "md": "That looks right now. __Thanks for sorting it out__.", "text": "That looks right now. Thanks for sorting it out.", "zh": "现在对了。谢谢你处理好。", "sp": "A"}], [{"id": "s1_9_0", "md": "No problem. Don't forget your card. Have a good night, guys!", "text": "No problem. Don't forget your card. Have a good night const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;

const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
