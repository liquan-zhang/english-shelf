<script>
const D = {"id": "125", "type": "dialogue", "title": "Calling for an Urgent Appointment", "meta": "B2 · 约 320 词 · 场景：电话争取当天急诊号", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Clinic Receptionist", "name_zh": "诊所前台", "voice": "en-US-AvaNeural"}}, "gist": [{"q": "「你」的眼睛有什么症状？前台为什么愿意加号？", "a": "右眼从昨晚开始又红又疼，今早视线模糊，而且戴隐形眼镜；眼疼加视线模糊不能拖，所以医生同意加号。"}, {"q": "前台提醒「你」什么情况要直接去急诊？", "a": "如果疼得很厉害或看不清东西，就直接去急诊。"}, {"q": "诊所回电带来了什么消息？「你」要带哪些东西？", "a": "有人取消了两点四十的号，要两点半前到填表；带证件、保险卡、隐形眼镜盒和员工卡。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, I need to see a doctor today. It's fairly urgent."}, {"id": "s0_3_0", "text": "My right eye has been red and painful since last night. This morning my vision is a bit blurry."}, {"id": "s0_8_0", "text": "That's fine. I'd rather wait than leave it until tomorrow."}, {"id": "s1_9_0", "text": "Perfect. And if I'm running a few minutes late, will I lose the slot?"}], "shadow": {"speaker": "A", "text": "My right eye has been red and painful since last night. This morning my vision is a bit blurry.", "marked": "My <b>right eye</b> / has been <b>red</b> and <b>painful</b> / since <b>last night</b>. //<br>This <b>morning</b> / my vision is a bit <b>blurry</b>. //"}, "prompts": [{"q": "你打电话给常去的诊所，前台说今天约满了。你的症状是高烧三天不退。说清情况，争取今天被看到。", "ref": "Hi, I understand you're fully booked, but I've had a high fever for three days now, and it's not coming down even with paracetamol. Last night it was almost forty. I'm also getting a bad headache. Is there any chance the doctor could see me today? I'm happy to come in as a walk-in and wait.", "ref_zh": "你好，我知道你们今天约满了，但我已经高烧三天了，吃了退烧药也不退。昨晚差不多四十度，头也疼得厉害。医生今天有没有可能给我看一下？我可以现场挂号排队等。", "id": "ref0"}, {"q": "你约的号要迟到二十分钟，打电话给诊所，道歉并问能不能保留或改时间。", "ref": "Hi, this is Zhang. I have an appointment at four with Doctor Morgan. I'm really sorry, but I'm stuck in traffic, and I'll be about twenty minutes late. Would it still be possible to see her? If not, could you move me to a later slot today, or first thing tomorrow?", "ref_zh": "你好，我是张先生，约了四点摩根医生的号。真的很抱歉，我堵在路上了，大概要晚二十分钟。还能看吗？如果不行，能帮我改到今天晚一点的号，或者明天一早吗？", "id": "ref1"}], "words": [{"w": "blurry", "ipa": "/ˈblɜːri/", "zh": "模糊的", "ex": "The photo is a bit blurry. Can you take another one?", "id": "w0"}, {"w": "contact lenses", "ipa": "/ˈkɑːntækt ˌlenzɪz/", "zh": "隐形眼镜", "ex": "Don't sleep with your contact lenses in.", "id": "w1"}, {"w": "walk-in", "ipa": "/ˈwɔːk ɪn/", "zh": "不预约直接来的（病人/客人）", "ex": "The clinic accepts walk-ins until five.", "tts_w": "walk in", "id": "w2"}, {"w": "emergency", "ipa": "/ɪˈmɜːrdʒənsi/", "zh": "急诊；紧急情况", "ex": "We spent the whole night in the emergency department.", "id": "w3"}, {"w": "cancellation", "ipa": "/ˌkænsəˈleɪʃən/", "zh": "取消（的预约）", "ex": "Put me on the list in case there's a cancellation.", "id": "w4"}, {"w": "bill (v.)", "ipa": "/bɪl/", "zh": "向……开账单，直接结算", "ex": "The hospital will bill your insurer directly.", "tts_w": "bill", "id": "w5"}, {"w": "panel", "ipa": "/ˈpænəl/", "zh": "（公司保险的）合作诊所名单", "ex": "Is this clinic on our company's panel?", "id": "w6"}, {"w": "covered", "ipa": "/ˈkʌvərd/", "zh": "（保险）覆盖的，可报销的", "ex": "Is physiotherapy covered by your plan?", "id": "w7"}, {"w": "squeeze in", "ipa": "/skwiːz ɪn/", "zh": "（日程里）挤出时间加进来", "ex": "The barber squeezed me in before closing.", "id": "w8"}, {"w": "ease off", "ipa": "/iːz ɔːf/", "zh": "（疼痛、雨等）减轻", "ex": "Wait until the rain eases off before you leave.", "id": "w9"}], "sections": [{"heading": "1. Trying to Get Seen Today", "heading_zh": "1. 争取今天就看上", "rows": [[{"id": "s0_0_0", "md": "Good morning, Riverside Family Clinic. How can I help you?", "text": "Good morning, Riverside Family Clinic. How can I help you?", "zh": "早上好，这里是河畔家庭诊所。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, I need to see a doctor today. It's fairly urgent.**", "text": "Hi, I need to see a doctor today. It's fairly urgent.", "zh": "你好，我今天需要看医生，挺急的。", "sp": "A"}], [{"id": "s0_2_0", "md": "I'm afraid we're __fully booked__ today. Can you tell me a little about what's going on?", "text": "I'm afraid we're fully booked today. Can you tell me a little about what's going on?", "zh": "恐怕今天的号都约满了。能简单说说是什么情况吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "My right eye has been red and painful since last night. This morning my vision is a bit ==blurry==.", "text": "My right eye has been red and painful since last night. This morning my vision is a bit blurry.", "zh": "我右眼从昨晚开始又红又疼。今天早上看东西有点模糊。", "sp": "A"}], [{"id": "s0_4_0", "md": "Okay. Did anything get into your eye, or do you wear ==contact lenses==?", "text": "Okay. Did anything get into your eye, or do you wear contact lenses?", "zh": "好的。有东西进眼睛了吗？您戴隐形眼镜吗？", "sp": "B"}], [{"id": "s0_5_0", "md": "I do wear contacts. I took them out last night, but the pain hasn't __eased off__ at all.", "text": "I do wear contacts. I took them out last night, but the pain hasn't eased off at all.", "zh": "我戴隐形。昨晚已经摘了，但疼得一点没减轻。", "sp": "A"}], [{"id": "s0_6_0", "md": "Thanks. Pain with blurry vision isn't something we want to wait on. Let me check with the doctor.", "text": "Thanks. Pain with blurry vision isn't something we want to wait on. Let me check with the doctor.", "zh": "谢谢。眼睛疼还看不清，这种情况不能拖。我问一下医生。", "sp": "B"}], [{"id": "s0_7_0", "md": "She can __squeeze you in__ as a ==walk-in==, but you might have to wait up to an hour.", "text": "She can squeeze you in as a walk-in, but you might have to wait up to an hour.", "zh": "她可以按现场挂号给您加个号，不过可能要等一个小时左右。", "sp": "B"}], [{"id": "s0_8_0", "md": "**That's fine. I'd rather wait than leave it until tomorrow.**", "text": "That's fine. I'd rather wait than leave it until tomorrow.", "zh": "没关系。我宁可等，也不想拖到明天。", "sp": "A"}], [{"id": "s0_9_0", "md": "One more thing. If the pain becomes severe or you can't see properly, go straight to the ==emergency== department.", "text": "One more thing. If the pain becomes severe or you can't see properly, go straight to the emergency department.", "zh": "还有一点。如果疼得很厉害或者看不清了，直接去急诊。", "sp": "B"}]]}, {"heading": "2. A Call Back from the Clinic", "heading_zh": "2. 诊所回电", "rows": [[{"id": "s1_0_0", "md": "Hi, is this Mr. Zhang? It's Riverside Clinic. We've just had a ==cancellation== at two forty.", "text": "Hi, is this Mr. Zhang? It's Riverside Clinic. We've just had a cancellation at two forty.", "zh": "您好，是张先生吗？这里是河畔诊所。刚有人取消了两点四十的号。", "sp": "B"}], [{"id": "s1_1_0", "md": "Oh, great timing. I was about to head over. Is that with the same doctor?", "text": "Oh, great timing. I was about to head over. Is that with the same doctor?", "zh": "哦，来得正好，我正准备过去。是同一位医生吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Yes, Doctor Morgan. Can you make it by two thirty to fill in the forms?", "text": "Yes, Doctor Morgan. Can you make it by two thirty to fill in the forms?", "zh": "是的，摩根医生。您能两点半之前到吗？要填一下表。", "sp": "B"}], [{"id": "s1_3_0", "md": "Yes, I'll be there. Should I bring anything with me?", "text": "Yes, I'll be there. Should I bring anything with me?", "zh": "可以，我会到。需要带什么东西吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Your ID, your insurance card, and your contact lens case, if you still have it.", "text": "Your ID, your insurance card, and your contact lens case, if you still have it.", "zh": "身份证件、保险卡，还有您的隐形眼镜盒，如果还在的话。", "sp": "B"}], [{"id": "s1_5_0", "md": "Sure. I'll take a taxi, since I probably shouldn't drive. Can you ==bill== my insurance directly?", "text": "Sure. I'll take a taxi, since I probably shouldn't drive. Can you bill my insurance directly?", "zh": "好的。我打车过去，估计不该开车。你们能直接跟我的保险结算吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "If your company is on our ==panel==, yes. Otherwise you pay first and claim later.", "text": "If your company is on our panel, yes. Otherwise you pay first and claim later.", "zh": "如果您公司在我们的合作名单上就可以。不然就得先付钱再去报销。", "sp": "B"}], [{"id": "s1_7_0", "md": "It should be. My company is Northwind Tech. Could you __double check__ for me?", "text": "It should be. My company is Northwind Tech. const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

main.append(step('s2', '② 听写', '4 分钟', '每句可以反复听，听到能完整写出来为止。点「核对」后，<span style="color:var(--bad)">红色</span>是漏听或听错的词。',
  h('div', {}, ...D.dictation.map((d, i) => {
    const ta = h('textarea', { placeholder: '把听到的句子打出来…' });
    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
