<script>
const D = {"id": "125", "type": "dialogue", "title": "Calling for an Urgent Appointment", "meta": "B2 · 约 320 词 · 场景：电话争取当天急诊号", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Clinic Receptionist", "name_zh": "诊所前台", "voice": "en-US-AvaNeural"}}, "gist": [{"q": "「你」的眼睛有什么症状？前台为什么愿意加号？", "a": "右眼从昨晚开始又红又疼，今早视线模糊，而且戴隐形眼镜；眼疼加视线模糊不能拖，所以医生同意加号。"}, {"q": "前台提醒「你」什么情况要直接去急诊？", "a": "如果疼得很厉害或看不清东西，就直接去急诊。"}, {"q": "诊所回电带来了什么消息？「你」要带哪些东西？", "a": "有人取消了两点四十的号，要两点半前到填表；带证件、保险卡、隐形眼镜盒和员工卡。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, I need to see a doctor today. It's fairly urgent."}, {"id": "s0_3_0", "text": "My right eye has been red and painful since last night. This morning my vision is a bit blurry."}, {"id": "s0_8_0", "text": "That's fine. I'd rather wait than leave it until tomorrow."}, {"id": "s1_9_0", "text": "Perfect. And if I'm running a few minutes late, will I lose the slot?"}], "shadow": {"speaker": "A", "text": "My right eye has been red and painful since last night. This morning my vision is a bit blurry.", "marked": "My <b>right eye</b> / has been <b>red</b> and <b>painful</b> / since <b>last night</b>. //<br>This <b>morning</b> / my vision is a bit <b>blurry</b>. //"}, "prompts": [{"q": "你打电话给常去的诊所，前台说今天约满了。你的症状是高烧三天不退。说清情况，争取今天被看到。", "ref": "Hi, I understand you're fully booked, but I've had a high fever for three days now, and it's not coming down even with paracetamol. Last night it was almost forty. I'm also getting a bad headache. Is there any chance the doctor could see me today? I'm happy to come in as a walk-in and wait.", "ref_zh": "你好，我知道你们今天约满了，但我已经高烧三天了，吃了退烧药也不退。昨晚差不多四十度，头也疼得厉害。医生今天有没有可能给我看一下？我可以现场挂号排队等。", "id": "ref0"}, {"q": "你约的号要迟到二十分钟，打电话给诊所，道歉并问能不能保留或改时间。", "ref": "Hi, this is Zhang. I have an appointment at four with Doctor Morgan. I'm really sorry, but I'm stuck in traffic, and I'll be about twenty minutes late. Would it still be possible to see her? If not, could you move me to a later slot today, or first thing tomorrow?", "ref_zh": "你好，我是张先生，约了四点摩根医生的号。真的很抱歉，我堵在路上了，大概要晚二十分钟。还能看吗？如果不行，能帮我改到今天晚一点的号，或者明天一早吗？", "id": "ref1"}], "words": [{"w": "blurry", "ipa": "/ˈblɜːri/", "zh": "模糊的", "ex": "The photo is a bit blurry. Can you take another one?", "id": "w0"}, {"w": "contact lenses", "ipa": "/ˈkɑːntækt ˌlenzɪz/", "zh": "隐形眼镜", "ex": "Don't sleep with your contact lenses in.", "id": "w1"}, {"w": "walk-in", "ipa": "/ˈwɔːk ɪn/", "zh": "不预约直接来的（病人/客人）", "ex": "The clinic accepts walk-ins until five.", "tts_w": "walk in", "id": "w2"}, {"w": "emergency", "ipa": "/ɪˈmɜːrdʒənsi/", "zh": "急诊；紧急情况", "ex": "We spent the whole night in the emergency department.", "id": "w3"}, {"w": "cancellation", "ipa": "/ˌkænsəˈleɪʃən/", "zh": "取消（的预约）", "ex": "Put me on the list in case there's a cancellation.", "id": "w4"}, {"w": "bill (v.)", "ipa": "/bɪl/", "zh": "向……开账单，直接结算", "ex": "The hospital will bill your insurer directly.", "tts_w": "bill", "id": "w5"}, {"w": "panel", "ipa": "/ˈpænəl/", "zh": "（公司保险的）合作诊所名单", "ex": "Is this clinic on our company's panel?", "id": "w6"}, {"w": "covered", "ipa": "/ˈkʌvərd/", "zh": "（保险）覆盖的，可报销的", "ex": "Is physiotherapy covered by your plan?", "id": "w7"}, {"w": "squeeze in", "ipa": "/skwiːz ɪn/", "zh": "（日程里）挤出时间加进来", "ex": "The barber squeezed me in before closing.", "id": "w8"}, {"w": "ease off", "ipa": "/iːz ɔːf/", "zh": "（疼痛、雨等）减轻", "ex": "Wait until the rain eases off before you leave.", "id": "w9"}], "sections": [{"heading": "1. Trying to Get Seen Today", "heading_zh": "1. 争取今天就看上", "rows": [[{"id": "s0_0_0", "md": "Good morning, Riverside Family Clinic. How can I help you?", "text": "Good morning, Riverside Family Clinic. How can I help you?", "zh": "早上好，这里是河畔家庭诊所。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, I need to see a doctor today. It's fairly urgent.**", "text": "Hi, I need to see a doctor today. It's fairly urgent.", "zh": "你好，我今天需要看医生，挺急的。", "sp": "A"}], [{"id": "s0_2_0", "md": "I'm afraid we're __fully booked__ today. Can you tell me a little about what's going on?", "text": "I'm afraid we're fully booked today. Can you tell me a little about what's going on?", "zh": "恐怕今天的号都约满了。能简单说说是什么情况吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "My right eye has been red and painful since last night. This morning my vision is a bit ==blurry==.", "text": "My right eye has been red and painful since last night. This morning my vision is a bit blurry.", "zh": "我右眼从昨晚开始又红又疼。今天早上看东西有点模糊。", "sp": "A"}], [{"id": "s0_4_0", "md": "Okay. Did anything get into your eye, or do you wear ==contact lenses==?", "text": "Okay. Did anything get into your eye, or do you wear contact lenses?", "zh": "好的。有东西进眼睛了吗？您戴隐形眼镜吗？", "sp": "B"}], [{"id": "s0_5_0", "md": "I do wear contacts. I took them out last night, but the pain hasn't __eased off__ at all.", "text": "I do wear contacts. I took them out last night, but the pain hasn't eased off at all.", "zh": "我戴隐形。昨晚已经摘了，但疼得一点没减轻。", "sp": "A"}], [{"id": "s0_6_0", "md": "Thanks. Pain with blurry vision isn't something we want to wait on. Let me check with the doctor.", "text": "Thanks. Pain with blurry vision isn't something we want to wait on. Let me check with the doctor.", "zh": "谢谢。眼睛疼还看不清，这种情况不能拖。我问一下医生。", "sp": "B"}], [{"id": "s0_7_0", "md": "She can __squeeze you in__ as a ==walk-in==, but you might have to wait up to an hour.", "text": "She can squeeze you in as a walk-in, but you might have to wait up to an hour.", "zh": "她可以按现场挂号给您加个号，不过可能要等一个小时左右。", "sp": "B"}], [{"id": "s0_8_0", "md": "**That's fine. I'd rather wait than leave it until tomorrow.**", "text": "That's fine. I'd rather wait than leave it until tomorrow.", "zh": "没关系。我宁可等，也不想拖到明天。", "sp": "A"}], [{"id": "s0_9_0", "md": "One more thing. If the pain becomes severe or you can't see properly, go straight to the ==emergency== department.", "text": "One more thing. If the pain becomes severe or you can't see properly, go straight to the emergency department.", "zh": "还有一点。如果疼得很厉害或者看不清了，直接去急诊。", "sp": "B"}]]}, {"heading": "2. A Call Back from the Clinic", "heading_zh": "2. 诊所回电", "rows": [[{"id": "s1_0_0", "md": "Hi, is this Mr. Zhang? It's Riverside Clinic. We've just had a ==cancellation== at two forty.", "text": "Hi, is this Mr. Zhang? It's Riverside Clinic. We've just had a cancellation at two forty.", "zh": "您好，是张先生吗？这里是河畔诊所。刚有人取消了两点四十的号。", "sp": "B"}], [{"id": "s1_1_0", "md": "Oh, great timing. I was about to head over. Is that with the same doctor?", "text": "Oh, great timing. I was about to head over. Is that with the same doctor?", "zh": "哦，来得正好，我正准备过去。是同一位医生吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Yes, Doctor Morgan. Can you make it by two thirty to fill in the forms?", "text": "Yes, Doctor Morgan. Can you make it by two thirty to fill in the forms?", "zh": "是的，摩根医生。您能两点半之前到吗？要填一下表。", "sp": "B"}], [{"id": "s1_3_0", "md": "Yes, I'll be there. Should I bring anything with me?", "text": "Yes, I'll be there. Should I bring anything with me?", "zh": "可以，我会到。需要带什么东西吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Your ID, your insurance card, and your contact lens case, if you still have it.", "text": "Your ID, your insurance card, and your contact lens case, if you still have it.", "zh": "身份证件、保险卡，还有您的隐形眼镜盒，如果还在的话。", "sp": "B"}], [{"id": "s1_5_0", "md": "Sure. I'll take a taxi, since I probably shouldn't drive. Can you ==bill== my insurance directly?", "text": "Sure. I'll take a taxi, since I probably shouldn't drive. Can you bill my insurance directly?", "zh": "好的。我打车过去，估计不该开车。你们能直接跟我的保险结算吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "If your company is on our ==panel==, yes. Otherwise you pay first and claim later.", "text": "If your company is on our panel, yes. Otherwise you pay first and claim later.", "zh": "如果您公司在我们的合作名单上就可以。不然就得先付钱再去报销。", "sp": "B"}], [{"id": "s1_7_0", "md": "It should be. My company is Northwind Tech. Could you __double check__ for me?", "text": "It should be. My company is Northwind Tech. const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
