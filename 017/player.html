<script>
const D = {"id": "017", "title": "Telling the Story Behind a Metric", "meta": "B2 · 约 270 词 · 场景：指标解读", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Up and to the Right Is Not an Update", "heading_zh": "1. 曲线往上走不等于汇报", "rows": [[{"id": "s0_0_0", "md": "\"Daily active users grew eight percent this month.\"", "text": "\"Daily active users grew eight percent this month.\"", "zh": "「本月日活增长了百分之八。」", "sp": null}, {"id": "s0_0_1", "md": "In many weekly reviews, that sentence is the whole update, followed by a smile and the next slide.", "text": "In many weekly reviews, that sentence is the whole update, followed by a smile and the next slide.", "zh": "在很多周会上，这句话就是汇报的全部，接着一个微笑，翻到下一页。", "sp": null}, {"id": "s0_0_2", "md": "But it ==raises== more questions than it answers.", "text": "But it raises more questions than it answers.", "zh": "但它带出的问题比它回答的还多。", "sp": null}], [{"id": "s0_1_0", "md": "Did the new feature work, or did a holiday bring people back?", "text": "Did the new feature work, or did a holiday bring people back?", "zh": "是新功能起作用了，还是假期把人带回来了？", "sp": null}, {"id": "s0_1_1", "md": "Did all users grow, or did one marketing campaign pull in a wave of users who will leave next week?", "text": "Did all users grow, or did one marketing campaign pull in a wave of users who will leave next week?", "zh": "是所有用户都在涨，还是某次营销活动拉来了一波下周就会走的用户？", "sp": null}, {"id": "s0_1_2", "md": "Without a cause, a number cannot ==guide== any decision, so nobody knows whether to do more of something or stop it.", "text": "Without a cause, a number cannot guide any decision, so nobody knows whether to do more of something or stop it.", "zh": "不知道原因，数字就没法指导任何决策，所以没人知道这件事是该加码还是该叫停。", "sp": null}], [{"id": "s0_2_0", "md": "**A metric tells you what happened; your job is to explain why.**", "text": "A metric tells you what happened; your job is to explain why.", "zh": "指标告诉你发生了什么，你的工作是解释为什么。", "sp": null}, {"id": "s0_2_1", "md": "Leaders do not need you to read the chart to them.", "text": "Leaders do not need you to read the chart to them.", "zh": "领导不需要你把图表念给他们听。", "sp": null}, {"id": "s0_2_2", "md": "They need your ==interpretation==, and your honest view of how sure you are.", "text": "They need your interpretation, and your honest view of how sure you are.", "zh": "他们需要的是你的解读，以及你对自己有几分把握的坦诚判断。", "sp": null}]]}, {"heading": "2. What Moved, Why, and What Now", "heading_zh": "2. 什么变了、为什么、接下来怎么办", "rows": [[{"id": "s1_0_0", "md": "Start by saying what moved, and __break it down__ before anyone asks.", "text": "Start by saying what moved, and break it down before anyone asks.", "zh": "先说什么变了，并且在别人问之前就拆开来讲。", "sp": null}, {"id": "s1_0_1", "md": "\"Most of the growth came from new users in two markets, while existing users stayed flat.\"", "text": "\"Most of the growth came from new users in two markets, while existing users stayed flat.\"", "zh": "「增长主要来自两个市场的新用户，老用户基本持平。」", "sp": null}, {"id": "s1_0_2", "md": "That one split often changes the whole ==conversation==.", "text": "That one split often changes the whole conversation.", "zh": "光这一个拆分，往往就能改变整个讨论的走向。", "sp": null}], [{"id": "s1_1_0", "md": "Next, give your best explanation, and keep facts apart from guesses.", "text": "Next, give your best explanation, and keep facts apart from guesses.", "zh": "接着给出你最好的解释，并且把事实和猜测分开。", "sp": null}, {"id": "s1_1_1", "md": "\"We know the campaign launched on the third; we suspect the referral change helped too, but we haven't tested it yet.\"", "text": "\"We know the campaign launched on the third; we suspect the referral change helped too, but we haven't tested it yet.\"", "zh": "「我们知道活动是三号上线的；我们怀疑邀请机制的改动也有帮助，但还没验证。」", "sp": null}, {"id": "s1_1_2", "md": "**Being clear about what you suspect is as important as being clear about what you know.**", "text": "Being clear about what you suspect is as important as being clear about what you know.", "zh": "讲清楚你怀疑什么，和讲清楚你知道什么同样重要。", "sp": null}], [{"id": "s1_2_0", "md": "Then say what happens next.", "text": "Then say what happens next.", "zh": "然后说接下来怎么做。", "sp": null}, {"id": "s1_2_1", "md": "\"We'll check retention for these new users in two weeks before we __double down__ on the campaign.\"", "text": "\"We'll check retention for these new users in two weeks before we double down on the campaign.\"", "zh": "「在活动上加大投入之前，我们会在两周后看一下这批新用户的留存。」", "sp": null}], [{"id": "s1_3_0", "md": "Finally, treat good news with the same ==suspicion== as bad news.", "text": "Finally, treat good news with the same suspicion as bad news.", "zh": "最后，对好消息要像对坏消息一样保持怀疑。", "sp": null}, {"id": "s1_3_1", "md": "Teams dig deep when a number drops, but they rarely question a number that __makes them look good__.", "text": "Teams dig deep when a number drops, but they rarely question a number that makes them look good.", "zh": "数字一掉，团队就会刨根问底，但很少有人去质疑一个让自己脸上有光的数字。", "sp": null}, {"id": "s1_3_2", "md": "Asking \"Why did this go up?\" with real ==curiosity== is what makes your reports worth trusting.", "text": "Asking \"Why did this go up?\" with real curiosity is what makes your reports worth trusting.", "zh": "带着真正的好奇心去问「这个为什么涨了？」，才让你的汇报值得信赖。", "sp": null}]]}], "gist": [{"q": "为什么“日活涨了百分之八”本身不算一个好的汇报？", "a": "没有原因，就不知道是新功能起效、节假日还是一次性活动，也无法据此做决策。"}, {"q": "讲指标故事的三步是什么？", "a": "说清什么变了并主动拆分；给出最佳解释并区分事实和猜测；说明下一步行动。"}, {"q": "作者为什么提醒对好消息也要保持怀疑？", "a": "团队常只深挖下跌而不追问上涨；对上涨同样追问原因，汇报才值得信任。"}], "dictation": [{"id": "s0_2_0", "text": "A metric tells you what happened; your job is to explain why."}, {"id": "s1_1_2", "text": "Being clear about what you suspect is as important as being clear about what you know."}, {"id": "s1_1_0", "text": "Next, give your best explanation, and keep facts apart from guesses."}, {"id": "s1_0_2", "text": "That one split often changes the whole conversation."}], "shadow": {"text": "Next, give your best explanation, and keep facts apart from guesses. \"We know the campaign launched on the third; we suspect the referral change helped too, but we haven't tested it yet.\"", "marked": "<b>Next</b>, / give your <b>best</b> explanation, / and keep <b>facts</b> apart from <b>guesses</b>. //<br>\"We <b>know</b> the campaign launched on the <b>third</b>; / we <b>suspect</b> the referral change helped too, / but we <b>haven't</b> tested it yet.\" //"}, "prompts": [{"q": "周会上你要汇报：本周搜索点击率下降了百分之五。用 30 秒讲清楚：哪里在降、你知道的原因和猜测、下一步怎么做。", "ref": "Search click-through dropped about five percent this week, but it isn't across the board. Almost all of the drop is on Android, and only on the latest app version. We know that version changed the result layout. We suspect the new thumbnails are pushing results below the fold, but we haven't confirmed it. We're running a quick test with the old layout and should have an answer by Friday.", "ref_zh": "这周搜索点击率下降了大约百分之五，但并不是全面下降。几乎所有的下降都在安卓端，而且只在最新版本上。我们知道这个版本改了结果页的布局。我们怀疑新加的缩略图把结果挤到了首屏以下，但还没证实。我们正在用旧布局跑一个快速实验，周五前应该能有结论。", "id": "ref0"}, {"q": "你的团队指标大涨，大家都很开心。用 30 秒在汇报里提醒大家先别急着庆祝，说明你会如何验证原因。", "ref": "This is great news, and I don't want to downplay it. But before we celebrate, I want to understand why it went up. The jump lines up with the holiday weekend, and we saw a similar spike last year that disappeared a week later. So over the next two weeks, we'll compare it with the same period last year and check if new users are sticking around. Then we'll know how much credit the feature really deserves.", "ref_zh": "这是个好消息，我不想给它泼冷水。但在庆祝之前，我想先搞清楚它为什么涨。这次上涨正好赶上假期周末，而去年我们也见过类似的峰值，一周后就消失了。所以接下来两周，我们会跟去年同期做对比，再看看新用户有没有留下来。到时候就知道这个功能到底该记多少功劳了。", "id": "ref1"}], "words": [{"w": "raise (questions)", "ipa": "/reɪz/", "zh": "引出、提出（问题）", "ex": "The spike in refunds raises questions about the new checkout.", "tts_w": "raise", "id": "w0"}, {"w": "guide (v.)", "ipa": "/ɡaɪd/", "zh": "指导、引导", "ex": "Let the user research guide the roadmap, not our opinions.", "tts_w": "guide", "id": "w1"}, {"w": "interpretation", "ipa": "/ɪnˌtɜːrprɪˈteɪʃən/", "zh": "解读", "ex": "My interpretation is that users like the feature but can't find it.", "id": "w2"}, {"w": "conversation", "ipa": "/ˌkɑːnvərˈseɪʃən/", "zh": "讨论、对话", "ex": "Showing the cost per user changed the conversation with finance.", "id": "w3"}, {"w": "suspicion", "ipa": "/səˈspɪʃən/", "zh": "怀疑", "ex": "My suspicion is that the bot traffic is inflating our numbers.", "id": "w4"}, {"w": "curiosity", "ipa": "/ˌkjʊriˈɑːsəti/", "zh": "好奇心", "ex": "Approach the outage with curiosity, not blame.", "id": "w5"}, {"w": "break down", "ipa": "/breɪk daʊn/", "zh": "拆分、细分", "ex": "Can you break down the latency by region?", "id": "w6"}, {"w": "double down (on)", "ipa": "/ˈdʌbəl daʊn/", "zh": "加倍投入", "ex": "Before we double down on video, let's check the retention data.", "tts_w": "double down", "id": "w7"}, {"w": "suspect (v.)", "ipa": "/səˈspekt/", "zh": "怀疑、猜想", "ex": "I suspect the slowdown comes from the new logging library.", "tts_w": "suspect", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Up and to the Right Is Not an Update", "zh": "1. 曲线往上走不等于汇报", "start": 0.0, "end": 3.288, "words": [[0.118, 0.382], [0.934, 1.145], [1.263, 1.329], [1.342, 1.434], [1.447, 1.553], [1.566, 1.908], [2.0, 2.092], [2.105, 2.316], [2.329, 2.408], [2.421, 2.908]]}, {"kind": "s", "id": "s0_0_0", "md": "\"Daily active users grew eight percent this month.\"", "zh": "「本月日活增长了百分之八。」", "sp": null, "gap": false, "start": 3.288, "end": 6.672, "words": [[3.472, 3.683], [3.762, 4.077], [4.091, 4.525], [4.538, 4.854], [4.972, 5.17], [5.183, 5.63], [5.643, 5.814], [5.827, 6.262]]}, {"kind": "s", "id": "s0_0_1", "md": "In many weekly reviews, that sentence is the whole update, followed by a smile and the next slide.", "zh": "在很多周会上，这句话就是汇报的全部，接着一个微笑，翻到下一页。", "sp": null, "gap": false, "start": 6.672, "end": 13.56, "words": [[6.777, 6.922], [6.935, 7.251], [7.264, 7.633], [7.646, 8.304], [8.567, 8.751], [8.764, 9.29], [9.396, 9.501], [9.514, 9.593], [9.606, 9.935], [10.001, 10.461], [10.843, 11.238], [11.251, 11.422], [11.435, 11.501], [11.514, 12.054], [12.277, 12.3 const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
