<script>
const D = {"id": "017", "title": "Telling the Story Behind a Metric", "meta": "B2 · 约 270 词 · 场景：指标解读", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Up and to the Right Is Not an Update", "heading_zh": "1. 曲线往上走不等于汇报", "rows": [[{"id": "s0_0_0", "md": "\"Daily active users grew eight percent this month.\"", "text": "\"Daily active users grew eight percent this month.\"", "zh": "「本月日活增长了百分之八。」", "sp": null}, {"id": "s0_0_1", "md": "In many weekly reviews, that sentence is the whole update, followed by a smile and the next slide.", "text": "In many weekly reviews, that sentence is the whole update, followed by a smile and the next slide.", "zh": "在很多周会上，这句话就是汇报的全部，接着一个微笑，翻到下一页。", "sp": null}, {"id": "s0_0_2", "md": "But it ==raises== more questions than it answers.", "text": "But it raises more questions than it answers.", "zh": "但它带出的问题比它回答的还多。", "sp": null}], [{"id": "s0_1_0", "md": "Did the new feature work, or did a holiday bring people back?", "text": "Did the new feature work, or did a holiday bring people back?", "zh": "是新功能起作用了，还是假期把人带回来了？", "sp": null}, {"id": "s0_1_1", "md": "Did all users grow, or did one marketing campaign pull in a wave of users who will leave next week?", "text": "Did all users grow, or did one marketing campaign pull in a wave of users who will leave next week?", "zh": "是所有用户都在涨，还是某次营销活动拉来了一波下周就会走的用户？", "sp": null}, {"id": "s0_1_2", "md": "Without a cause, a number cannot ==guide== any decision, so nobody knows whether to do more of something or stop it.", "text": "Without a cause, a number cannot guide any decision, so nobody knows whether to do more of something or stop it.", "zh": "不知道原因，数字就没法指导任何决策，所以没人知道这件事是该加码还是该叫停。", "sp": null}], [{"id": "s0_2_0", "md": "**A metric tells you what happened; your job is to explain why.**", "text": "A metric tells you what happened; your job is to explain why.", "zh": "指标告诉你发生了什么，你的工作是解释为什么。", "sp": null}, {"id": "s0_2_1", "md": "Leaders do not need you to read the chart to them.", "text": "Leaders do not need you to read the chart to them.", "zh": "领导不需要你把图表念给他们听。", "sp": null}, {"id": "s0_2_2", "md": "They need your ==interpretation==, and your honest view of how sure you are.", "text": "They need your interpretation, and your honest view of how sure you are.", "zh": "他们需要的是你的解读，以及你对自己有几分把握的坦诚判断。", "sp": null}]]}, {"heading": "2. What Moved, Why, and What Now", "heading_zh": "2. 什么变了、为什么、接下来怎么办", "rows": [[{"id": "s1_0_0", "md": "Start by saying what moved, and __break it down__ before anyone asks.", "text": "Start by saying what moved, and break it down before anyone asks.", "zh": "先说什么变了，并且在别人问之前就拆开来讲。", "sp": null}, {"id": "s1_0_1", "md": "\"Most of the growth came from new users in two markets, while existing users stayed flat.\"", "text": "\"Most of the growth came from new users in two markets, while existing users stayed flat.\"", "zh": "「增长主要来自两个市场的新用户，老用户基本持平。」", "sp": null}, {"id": "s1_0_2", "md": "That one split often changes the whole ==conversation==.", "text": "That one split often changes the whole conversation.", "zh": "光这一个拆分，往往就能改变整个讨论的走向。", "sp": null}], [{"id": "s1_1_0", "md": "Next, give your best explanation, and keep facts apart from guesses.", "text": "Next, give your best explanation, and keep facts apart from guesses.", "zh": "接着给出你最好的解释，并且把事实和猜测分开。", "sp": null}, {"id": "s1_1_1", "md": "\"We know the campaign launched on the third; we suspect the referral change helped too, but we haven't tested it yet.\"", "text": "\"We know the campaign launched on the third; we suspect the referral change helped too, but we haven't tested it yet.\"", "zh": "「我们知道活动是三号上线的；我们怀疑邀请机制的改动也有帮助，但还没验证。」", "sp": null}, {"id": "s1_1_2", "md": "**Being clear about what you suspect is as important as being clear about what you know.**", "text": "Being clear about what you suspect is as important as being clear about what you know.", "zh": "讲清楚你怀疑什么，和讲清楚你知道什么同样重要。", "sp": null}], [{"id": "s1_2_0", "md": "Then say what happens next.", "text": "Then say what happens next.", "zh": "然后说接下来怎么做。", "sp": null}, {"id": "s1_2_1", "md": "\"We'll check retention for these new users in two weeks before we __double down__ on the campaign.\"", "text": "\"We'll check retention for these new users in two weeks before we double down on the campaign.\"", "zh": "「在活动上加大投入之前，我们会在两周后看一下这批新用户的留存。」", "sp": null}], [{"id": "s1_3_0", "md": "Finally, treat good news with the same ==suspicion== as bad news.", "text": "Finally, treat good news with the same suspicion as bad news.", "zh": "最后，对好消息要像对坏消息一样保持怀疑。", "sp": null}, {"id": "s1_3_1", "md": "Teams dig deep when a number drops, but they rarely question a number that __makes them look good__.", "text": "Teams dig deep when a number drops, but they rarely question a number that makes them look good.", "zh": "数字一掉，团队就会刨根问底，但很少有人去质疑一个让自己脸上有光的数字。", "sp": null}, {"id": "s1_3_2", "md": "Asking \"Why did this go up?\" with real ==curiosity== is what makes your reports worth trusting.", "text": "Asking \"Why did this go up?\" with real curiosity is what makes your reports worth trusting.", "zh": "带着真正的好奇心去问「这个为什么涨了？」，才让你的汇报值得信赖。", "sp": null}]]}], "gist": [{"q": "为什么“日活涨了百分之八”本身不算一个好的汇报？", "a": "没有原因，就不知道是新功能起效、节假日还是一次性活动，也无法据此做决策。"}, {"q": "讲指标故事的三步是什么？", "a": "说清什么变了并主动拆分；给出最佳解释并区分事实和猜测；说明下一步行动。"}, {"q": "作者为什么提醒对好消息也要保持怀疑？", "a": "团队常只深挖下跌而不追问上涨；对上涨同样追问原因，汇报才值得信任。"}], "dictation": [{"id": "s0_2_0", "text": "A metric tells you what happened; your job is to explain why."}, {"id": "s1_1_2", "text": "Being clear about what you suspect is as important as being clear about what you know."}, {"id": "s1_1_0", "text": "Next, give your best explanation, and keep facts apart from guesses."}, {"id": "s1_0_2", "text": "That one split often changes the whole conversation."}], "shadow": {"text": "Next, give your best explanation, and keep facts apart from guesses. \"We know the campaign launched on the third; we suspect the referral change helped too, but we haven't tested it yet.\"", "marked": "<b>Next</b>, / give your <b>best</b> explanation, / and keep <b>facts</b> apart from <b>guesses</b>. //<br>\"We <b>know</b> the campaign launched on the <b>third</b>; / we <b>suspect</b> the referral change helped too, / but we <b>haven't</b> tested it yet.\" //"}, "prompts": [{"q": "周会上你要汇报：本周搜索点击率下降了百分之五。用 30 秒讲清楚：哪里在降、你知道的原因和猜测、下一步怎么做。", "ref": "Search click-through dropped about five percent this week, but it isn't across the board. Almost all of the drop is on Android, and only on the latest app version. We know that version changed the result layout. We suspect the new thumbnails are pushing results below the fold, but we haven't confirmed it. We're running a quick test with the old layout and should have an answer by Friday.", "ref_zh": "这周搜索点击率下降了大约百分之五，但并不是全面下降。几乎所有的下降都在安卓端，而且只在最新版本上。我们知道这个版本改了结果页的布局。我们怀疑新加的缩略图把结果挤到了首屏以下，但还没证实。我们正在用旧布局跑一个快速实验，周五前应该能有结论。", "id": "ref0"}, {"q": "你的团队指标大涨，大家都很开心。用 30 秒在汇报里提醒大家先别急着庆祝，说明你会如何验证原因。", "ref": "This is great news, and I don't want to downplay it. But before we celebrate, I want to understand why it went up. The jump lines up with the holiday weekend, and we saw a similar spike last year that disappeared a week later. So over the next two weeks, we'll compare it with the same period last year and check if new users are sticking around. Then we'll know how much credit the feature really deserves.", "ref_zh": "这是个好消息，我不想给它泼冷水。但在庆祝之前，我想先搞清楚它为什么涨。这次上涨正好赶上假期周末，而去年我们也见过类似的峰值，一周后就消失了。所以接下来两周，我们会跟去年同期做对比，再看看新用户有没有留下来。到时候就知道这个功能到底该记多少功劳了。", "id": "ref1"}], "words": [{"w": "raise (questions)", "ipa": "/reɪz/", "zh": "引出、提出（问题）", "ex": "The spike in refunds raises questions about the new checkout.", "tts_w": "raise", "id": "w0"}, {"w": "guide (v.)", "ipa": "/ɡaɪd/", "zh": "指导、引导", "ex": "Let the user research guide the roadmap, not our opinions.", "tts_w": "guide", "id": "w1"}, {"w": "interpretation", "ipa": "/ɪnˌtɜːrprɪˈteɪʃən/", "zh": "解读", "ex": "My interpretation is that users like the feature but can't find it const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
