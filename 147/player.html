const D = {"id": "147", "type": "dialogue", "title": "Sending a Parcel at the Post Office", "meta": "B2 · 约 270 词 · 场景：邮局寄国际包裹", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Counter Staff", "name_zh": "邮局柜台职员", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "航空和快递在时效和价格上有什么区别？「你」选了哪个，为什么？", "a": "航空七到十个工作日、四十二块；快递三到五天、七十九块。选了航空，因为是给妈妈的生日礼物，还有两周时间。"}, {"q": "海关申报和保价分别要注意什么？", "a": "每样物品都要列出来并如实写大概价值，否则可能被海关扣下；超过一百块建议保价，多三块钱，最高赔五百。"}, {"q": "封箱前出了什么问题？丢件怎么索赔？", "a": "里面有个充电宝，锂电池不能空运，只好拿出来重新封箱；丢件的话六个月内带收据回来办理。"}], "dictation": [{"id": "s0_1_0", "text": "Hi. I'd like to send this parcel to Shanghai. What are my options?"}, {"id": "s0_6_0", "text": "I'll go with airmail. It's a birthday present for my mum, and there are still two weeks."}, {"id": "s1_3_0", "text": "No problem, I'll take it out now. Could I borrow some tape?"}, {"id": "s1_7_0", "text": "And if it gets lost, what's the process for making a claim?"}], "shadow": {"speaker": "A", "text": "What should I put for the value? It's mostly clothes and some snacks.", "marked": "What should I put / for the <b>value</b>? //<br>It's <b>mostly</b> clothes / and some <b>snacks</b>. //"}, "prompts": [{"q": "你要从新加坡寄一箱孩子的旧绘本回国内老家。用 30 秒问清：最便宜的方式、多久到、书要不要申报。", "ref": "Hi, I'd like to send this box of children's books to my parents in China. They're not urgent at all, so what's the cheapest way to send them? Is there a surface mail option, and roughly how long would that take? Also, do I need to declare used books, and what value should I put down?", "ref_zh": "你好，我想把这箱儿童书寄给国内的父母。一点都不急，最便宜的寄法是什么？有没有海运，大概要多久？另外旧书需要申报吗？价值该填多少？", "id": "ref0"}, {"q": "你寄的包裹物流显示「已送达」，但家人说没收到。去邮局柜台说明情况并要求调查。", "ref": "Hi, I sent a parcel to Shanghai two weeks ago. The tracking says it was delivered on Monday, but my mum says she never got it. I've brought the receipt with the tracking number. Could you look into where it was actually delivered? And if it's lost, I'd like to make a claim. I did pay for insurance.", "ref_zh": "你好，我两周前寄了一个包裹到上海。物流显示周一已经送达，但我妈说根本没收到。我带了有跟踪号码的收据。能帮我查一下到底送到哪里了吗？如果丢了，我想申请索赔，我是买了保价的。", "id": "ref1"}], "words": [{"w": "airmail", "ipa": "/ˈermeɪl/", "zh": "航空邮寄", "ex": "Airmail is slower than express, but much cheaper.", "id": "w0"}, {"w": "customs", "ipa": "/ˈkʌstəmz/", "zh": "海关", "ex": "My package has been stuck at customs for a week.", "id": "w1"}, {"w": "declaration", "ipa": "/ˌdekləˈreɪʃən/", "zh": "申报（单）", "ex": "Fill in the declaration form and sign at the bottom.", "id": "w2"}, {"w": "value", "ipa": "/ˈvæljuː/", "zh": "价值，价格", "ex": "What's the total value of the items in the box?", "id": "w3"}, {"w": "cover (v.)", "ipa": "/ˈkʌvər/", "zh": "（保险）承保，赔付", "ex": "Does the insurance cover damage during delivery?", "tts_w": "cover", "id": "w4"}, {"w": "battery", "ipa": "/ˈbætəri/", "zh": "电池", "ex": "The remote control needs new batteries.", "id": "w5"}, {"w": "power bank", "ipa": "/ˈpaʊər bæŋk/", "zh": "充电宝", "ex": "Power banks must go in your hand luggage.", "id": "w6"}, {"w": "reseal", "ipa": "/ˌriːˈsiːl/", "zh": "重新封好", "ex": "Please reseal the bag after you take out the snacks.", "id": "w7"}, {"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "收据", "ex": "Keep the receipt in case you need to return it.", "id": "w8"}, {"w": "tracking number", "ipa": "/ˈtrækɪŋ ˈnʌmbər/", "zh": "快递跟踪号", "ex": "The seller emailed me the tracking number this morning.", "id": "w9"}], "sections": [{"heading": "1. Choosing a Service", "heading_zh": "1. 选择寄送方式", "rows": [[{"id": "s0_0_0", "md": "Next, please. What can I do for you?", "text": "Next, please. What can I do for you?", "zh": "下一位。请问要办什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi. I'd like to send this parcel to Shanghai. What are my options?**", "text": "Hi. I'd like to send this parcel to Shanghai. What are my options?", "zh": "你好，我想把这个包裹寄到上海。有哪些方式可以选？", "sp": "A"}], [{"id": "s0_2_0", "md": "Let me weigh it first. Okay, it's just over two kilos.", "text": "Let me weigh it first. Okay, it's just over two kilos.", "zh": "我先称一下。好，两公斤多一点。", "sp": "B"}], [{"id": "s0_3_0", "md": "By ==airmail==, it takes about seven to ten working days. Express is three to five, but it's almost double the price.", "text": "By airmail, it takes about seven to ten working days. Express is three to five, but it's almost double the price.", "zh": "寄航空大概七到十个工作日。快递三到五天，但价格差不多翻倍。", "sp": "B"}], [{"id": "s0_4_0", "md": "How much is each one?", "text": "How much is each one?", "zh": "分别多少钱？", "sp": "A"}], [{"id": "s0_5_0", "md": "Airmail is forty-two dollars, and express is seventy-nine.", "text": "Airmail is forty-two dollars, and express is seventy-nine.", "zh": "航空四十二块，快递七十九。", "sp": "B"}], [{"id": "s0_6_0", "md": "I'll __go with__ airmail. It's a birthday present for my mum, and there are still two weeks.", "text": "I'll go with airmail. It's a birthday present for my mum, and there are still two weeks.", "zh": "那就寄航空吧。是给我妈的生日礼物，还有两周时间。", "sp": "A"}], [{"id": "s0_7_0", "md": "Sure. You'll need to fill in this ==customs== ==declaration== form.", "text": "Sure. You'll need to fill in this customs declaration form.", "zh": "好的。您需要填一下这张海关申报单。", "sp": "B"}], [{"id": "s0_8_0", "md": "What should I put for the ==value==? It's mostly clothes and some snacks.", "text": "What should I put for the value? It's mostly clothes and some snacks.", "zh": "价值那一栏该怎么填？里面主要是衣服和一些零食。", "sp": "A"}], [{"id": "s0_9_0", "md": "Just list each item and a rough value. Be accurate, or it might be held at customs.", "text": "Just list each item and a rough value. Be accurate, or it might be held at customs.", "zh": "把每样东西列出来，写个大概价值就行。要如实写，不然可能会被海关扣下。", "sp": "B"}], [{"id": "s0_10_0", "md": "Got it. __Is it worth__ getting insurance?", "text": "Got it. Is it worth getting insurance?", "zh": "明白。值得买保价吗？", "sp": "A"}], [{"id": "s0_11_0", "md": "If it's over a hundred dollars, I'd say yes. It's three dollars extra and ==covers== up to five hundred.", "text": "If it's over a hundred dollars, I'd say yes. It's three dollars extra and covers up to five hundred.", "zh": "如果超过一百块，我建议买。多三块钱，最高赔五百。", "sp": "B"}]]}, {"heading": "2. A Problem with the Contents", "heading_zh": "2. 包裹里有违禁品", "rows": [[{"id": "s1_0_0", "md": "Before I seal it, is there anything with a ==battery== inside?", "text": "Before I seal it, is there anything with a battery inside?", "zh": "封箱之前问一下，里面有带电池的东西吗？", "sp": "B"}], [{"id": "s1_1_0", "md": "Oh, there's a small ==power bank== in there. Is that a problem?", "text": "Oh, there's a small power bank in there. Is that a problem?", "zh": "哦，里面有个小充电宝。这有问题吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "I'm afraid so. Lithium batteries can't go by air. You'll have to take it out.", "text": "I'm afraid so. Lithium batteries can't go by air. You'll have to take it out.", "zh": "恐怕是的。锂电池不能走空运，您得拿出来。", "sp": "B"}], [{"id": "s1_3_0", "md": "**No problem, I'll take it out now. Could I borrow some tape?**", "text": "No problem, I'll take it out now. Could I borrow some tape?", "zh": "没问题，我现在就拿出来。能借我点胶带吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Here you go. Please make sure you ==reseal== the box properly.", "text": "Here you go. Please make sure you reseal the box properly.", "zh": "给您。请把箱子重新封好。", "sp": "B"}], [{"id": "s1_5_0", "md": "Done. And how can I __keep track of__ it?", "text": "Done. And how can I keep track of it?", "zh": "好了。那我怎么查包裹到哪儿了？", "sp": "A"}], [{"id": "s1_6_0", "md": "Here's your ==receipt==. The ==tracking== number is at the top, and you can check it on our website.", "text": "Here's your receipt. The tracking number is at the top, and you can check it on our website.", "zh": "这是您的收据。跟踪号码在最上面，可以在我们官网查。", "sp": "B"}], [{"id": "s1_7_0", "md": "And if it gets lost, __what's the process__ for making a claim?", "text": "And if it gets lost, what's the process for making a claim?", "zh": "那如果包裹丢了，索赔流程是怎样的？", "sp": "A"}], [{"id": "s1_8_0", "md": "Bring the receipt back here within six months, and we'll look into it.", " const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
