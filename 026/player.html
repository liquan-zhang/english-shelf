<script>
const D = {"id": "026", "title": "Trade-offs, Not Right Answers", "meta": "B2 · 约 280 词 · 场景：架构讨论", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Argument That Never Ends", "heading_zh": "1. 永远吵不完的争论", "rows": [[{"id": "s0_0_0", "md": "Two senior engineers have spent three meetings arguing about a relational database versus a document store.", "text": "Two senior engineers have spent three meetings arguing about a relational database versus a document store.", "zh": "两位资深工程师已经为关系型数据库和文档数据库吵了三次会。", "sp": null}, {"id": "s0_0_1", "md": "Every week they bring new benchmarks, and every week nobody changes their mind.", "text": "Every week they bring new benchmarks, and every week nobody changes their mind.", "zh": "每周他们都带着新的 benchmark 来，每周谁也说服不了谁。", "sp": null}, {"id": "s0_0_2", "md": "Both are smart, both have good points, and the team is still waiting for a decision.", "text": "Both are smart, both have good points, and the team is still waiting for a decision.", "zh": "两个人都很聪明，说得也都有道理，可团队还在等一个结论。", "sp": null}, {"id": "s0_0_3", "md": "The problem is not the people; it is the question.", "text": "The problem is not the people; it is the question.", "zh": "问题不在人，而在问题本身。", "sp": null}], [{"id": "s0_1_0", "md": "\"Which one is better?\" has no answer, because better depends on what you need.", "text": "\"Which one is better?\" has no answer, because better depends on what you need.", "zh": "「哪个更好？」这个问题没有答案，因为好不好取决于你需要什么。", "sp": null}, {"id": "s0_1_1", "md": "Every architecture choice gives you something and __takes something away__.", "text": "Every architecture choice gives you something and takes something away.", "zh": "每个架构选择都会给你一些东西，也会拿走一些东西。", "sp": null}, {"id": "s0_1_2", "md": "**Once you ask what each option costs, the argument turns into a decision.**", "text": "Once you ask what each option costs, the argument turns into a decision.", "zh": "一旦你开始问每个方案的代价是什么，争论就变成了决策。", "sp": null}], [{"id": "s0_2_0", "md": "A cache gives you speed and costs you ==freshness==.", "text": "A cache gives you speed and costs you freshness.", "zh": "缓存给你速度，代价是数据的新鲜度。", "sp": null}, {"id": "s0_2_1", "md": "Splitting into many small services gives teams ==autonomy== and costs you easy debugging.", "text": "Splitting into many small services gives teams autonomy and costs you easy debugging.", "zh": "拆成很多小服务，团队获得了自主权，代价是排查问题没那么方便了。", "sp": null}, {"id": "s0_2_2", "md": "Neither side is wrong; they are simply ==optimizing== for different things.", "text": "Neither side is wrong; they are simply optimizing for different things.", "zh": "两边都没错，只是各自优化的目标不同。", "sp": null}]]}, {"heading": "2. Name the Price, Then Pick", "heading_zh": "2. 先讲代价，再做选择", "rows": [[{"id": "s1_0_0", "md": "When you present an option, __lead with__ the trade-off instead of the benefit.", "text": "When you present an option, lead with the trade-off instead of the benefit.", "zh": "介绍一个方案时，先讲取舍，而不是先讲好处。", "sp": null}, {"id": "s1_0_1", "md": "Say, \"This gets us lower latency, and the price is more ==operational== work for on-call.\"", "text": "Say, \"This gets us lower latency, and the price is more operational work for on-call.\"", "zh": "可以说：「这样能把延迟降下来，代价是 on-call 的运维工作会更多。」", "sp": null}, {"id": "s1_0_2", "md": "People trust a proposal more when it is honest about its costs.", "text": "People trust a proposal more when it is honest about its costs.", "zh": "一个方案对自己的代价越坦诚，大家就越信它。", "sp": null}, {"id": "s1_0_3", "md": "It shows you have already looked for the weak spots yourself.", "text": "It shows you have already looked for the weak spots yourself.", "zh": "这说明你自己已经先找过它的软肋了。", "sp": null}], [{"id": "s1_1_0", "md": "Next, connect the choice to what the team needs most this quarter.", "text": "Next, connect the choice to what the team needs most this quarter.", "zh": "接着，把这个选择和团队这个季度最需要的东西挂上钩。", "sp": null}, {"id": "s1_1_1", "md": "If the goal is shipping fast, the simpler option usually wins, even if it is less ==elegant==.", "text": "If the goal is shipping fast, the simpler option usually wins, even if it is less elegant.", "zh": "如果目标是快速上线，通常是更简单的方案胜出，哪怕它没那么优雅。", "sp": null}, {"id": "s1_1_2", "md": "If the goal is surviving a big traffic spike, you may have to __accept the extra complexity__.", "text": "If the goal is surviving a big traffic spike, you may have to accept the extra complexity.", "zh": "如果目标是扛住一波大流量，你可能就得接受额外的复杂度。", "sp": null}], [{"id": "s1_2_0", "md": "**Saying \"for now, we choose speed over flexibility\" is a decision; saying \"option A is right\" is an opinion.**", "text": "Saying \"for now, we choose speed over flexibility\" is a decision; saying \"option A is right\" is an opinion.", "zh": "说「现阶段我们选速度、不选灵活性」是一个决策；说「方案 A 是对的」只是一个观点。", "sp": null}, {"id": "s1_2_1", "md": "Write down the trade-off and the conditions that would make you ==revisit== it.", "text": "Write down the trade-off and the conditions that would make you revisit it.", "zh": "把这个取舍写下来，再写清楚在什么条件下要重新评估。", "sp": null}, {"id": "s1_2_2", "md": "When those conditions change, nobody has to admit they were wrong.", "text": "When those conditions change, nobody has to admit they were wrong.", "zh": "等这些条件变了，没人需要承认自己当初错了。", "sp": null}, {"id": "s1_2_3", "md": "The context simply moved, and the team __moves with it__.", "text": "The context simply moved, and the team moves with it.", "zh": "只是情况变了，团队跟着调整而已。", "sp": null}]]}], "gist": [{"q": "两位工程师争了三次会还没结论，作者认为问题出在哪里？", "a": "不在人，在问题本身：「哪个更好」没有答案，好坏取决于需求。"}, {"q": "作者举了哪些取舍的例子？", "a": "缓存换来速度、牺牲数据新鲜度；拆成小服务换来团队自主、牺牲调试便利。"}, {"q": "怎样把争论变成决策？", "a": "介绍方案时先讲代价；把选择和本季度最重要的目标挂钩；写下取舍和需要重新评估的条件。"}], "dictation": [{"id": "s0_1_2", "text": "Once you ask what each option costs, the argument turns into a decision."}, {"id": "s0_1_1", "text": "Every architecture choice gives you something and takes something away."}, {"id": "s1_0_2", "text": "People trust a proposal more when it is honest about its costs."}, {"id": "s1_2_1", "text": "Write down the trade-off and the conditions that would make you revisit it."}], "shadow": {"text": "A cache gives you speed and costs you freshness. Splitting into many small services gives teams autonomy and costs you easy debugging. Neither side is wrong; they are simply optimizing for different things.", "marked": "A <b>cache</b> gives you <b>speed</b> / and costs you <b>freshness</b>. //<br>Splitting into many small services / gives teams <b>autonomy</b> / and costs you <b>easy debugging</b>. //<br><b>Neither</b> side is wrong; / they are simply optimizing / for <b>different</b> things. //"}, "prompts": [{"q": "团队在争要不要引入消息队列，双方都在说自己的方案「更好」。用 30 秒把讨论改成讲取舍，并和本季度目标挂钩。", "ref": "Can I suggest we stop asking which one is better? Both options work. A message queue gives us decoupling and smoother traffic peaks, and the price is another system for on-call to run. Direct calls are simpler but more fragile under load. Our main goal this quarter is to ship the new checkout before the holidays, so I'd lean toward direct calls for now and revisit if traffic doubles.", "ref_zh": "我建议咱们别再争哪个更好了。两个方案都行得通。消息队列能解耦，也能把流量高峰削平，代价是 on-call 又多一套系统要维护。直接调用更简单，但高负载下更脆弱。我们这个季度的主要目标是赶在假期前把新的结账流程上线，所以我现阶段倾向直接调用，等流量翻倍了再重新评估。", "id": "ref0"}, {"q": "你推荐一个方案，介绍时主动先讲它的代价，再说明在什么条件下你们会重新评估。", "ref": "Here's my recommendation, starting with what it costs us. If we move the profile data into a cache, reads get about five times faster, but users may see stale data for up to a minute. For profiles, I think that's acceptable. We should revisit this if we ever put account balances in the same cache, because there a minute of stale data would be a real problem.", "ref_zh": "这是我的建议，先说代价。如果把用户资料数据放进缓存，读取速度大概能快五倍，但用户可能会看到最长一分钟前的旧数据。对用户资料来说，我觉得这可以接受。如果哪天我们要把账户余额也放进同一个缓存，就得重新评估，因为那种场景下一分钟的旧数据就是真问题了。", "id": "ref1"}], "words": [{"w": "trade-off", "ipa": "/ˈtreɪd ɔːf/", "zh": "取舍、权衡", "ex": "The trade-off is faster reads in exchange for stale data.", "tts_w": "tradeoff", "id": "w0"}, {"w": "freshness", "ipa": "/ˈfreʃnəs/", "zh": "（数据）新鲜度", "ex": "For pricing, freshness matters more than speed.", "id": "w1"}, {"w": "autonomy", "ipa": "/ɔːˈtɑːnəmi/", "zh": "自主权", "ex": "Separate services give each team autonomy over its release schedule.", "id": "w2"}, {"w": "optimize", "ipa": "/ˈɑːptɪmaɪz/", "zh": "优化、以……为优先", "ex": "Right now we optimize for shipping speed, not cost.", "id": "w3"}, {"w": "operational", "ipa": "/ˌɑːpəˈreɪʃənl/", "zh": "运维的、运营的", "ex": "Another database means more operational load for on-call.", "id": "w4"}, {"w": "elegant", "ipa": "/ˈelɪɡənt/", "zh": "优雅的、简洁巧妙的", "ex": "It's not the most elegant solution, but it ships this week.", "id": "w5"}, {"w": "revisit", "ipa": "/ˌriːˈvɪzɪt/", "zh": "重新审视", "ex": "We'll revisit the sharding decision if traffic doubles.", "id": "w6"}, {"w": "flexibility", "ipa": "/ˌfleksəˈbɪləti/", "zh": "灵活性", "ex": "A plugin system adds flexibility we don't need yet.", "id": "w7"}, {"w": "complexity", "ipa": "/kəmˈpleksəti/", "zh": "复杂度", "ex": "Every new service adds complexity to debugging.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. The Argument That Never Ends", "zh": "1. 永远吵不完的争论", "start": 0.0, "end": 2.928, "words": [[0.118, 0.382], [0.724, 0.829], [0.842, 1.382], [1.5, 1.697], [1.711, 2.039], [2.053, 2.539]]}, {"kind": "s", "id": "s0_0_0", "md": "Two senior engineers have spent three meetings arguing about a relational database versus a document store.", "zh": "两位资深工程师已经为关系型数据库和文档数据库吵了三次会。", "sp": null, "gap": false, "start": 2.928, "end": 9.504, "words": [[3.046, 3.217], [3.231, 3.599], [3.612, 4.112], [4.125, 4.257], [4.27, 4.599], [4.612, 4.967], [4.981, 5.402], [5.415, 5.967], [5.981, 6.257], [6.27, 6.296], [6.31, 6.902], [6.915, 7.573], [7.678, 8.073], [8.086, 8.191], [8.204, 8.704], [8.717, 9.112]]}, {"kind": "s", "id": "s0_0_1", "md": "Every week they bring new benchmarks, and every week nobody changes their mind.", "zh": "每周他们都带着新的 benchmark 来，每周谁也说服不了谁。", "sp": null, "gap": false, "start": 9.504, "end": 14.688, "words": [[9.609, 9.859], [9.87 9, 73.016], [73.029, 73.345], [73.358, 73.516], [73.529, 73.963]]}, {"kind": "s", "id": "s1_1_1", "md": "If the goal is shipping fast, the simpler option usually wins, even if it is less ==elegant==.", "zh": "如果目标是快速上线，通常是更简单的方案胜出，哪怕它没那么优雅。", "sp": null, "gap": false, "start": 74.352, "end": 80.472, "words": [[74.457, 74.576], [74.589, 74.681], [74.694, 75.063], [75.076, 75.207], [75.22, 75.655], [75.668, 76.286], [76.497, 76.602], [76.615, 77.036], [77.049, 77.444], [77.457, 77.891], [77.905, 78.444], [78.852, 79.063], [79.076, 79.207], [79.22, 79.286], [79.299, 79.418], [79.431, 79.641], [79.655, 80.089]]}, {"kind": "s", "id": "s1_1_2", "md": "If the goal is surviving a big traffic spike, you may have to __accept the extra complexity__.", "zh": "如果目标是扛住一波大流量，你可能就得接受额外的复杂度。", "sp": null, "gap": false, "start": 80.472, "end": 86.496, "words": [[80.577, 80.696], [80.709, 80.801], [80.814, 81.156], [81.169, 81.275], [81.288, 81.906], [81.919, 81.998], [82.077, 82.393], [82.406, 82.867], [82.88, 83.367], [83.696, 83.775], [83.788, 83.972], [83.985, 84.222], [84.235, 84.34], [84.354, 84.84], [84.854, 84.959], [85.038, 85.393], [85.406, 86.104]]}, {"kind": "s", "id": "s1_2_0", "md": "**Saying \"for now, we choose speed over flexibility\" is a decision; saying \"option A is right\" is an opinion.**", "zh": "说「现阶段我们选速度、不选灵活性」是一个决策；说「方案 A 是对的」只是一个观点。", "sp": null, "gap": true, "start": 86.496, "end": 94.416, "words": [[86.614, 86.97], [86.996, 87.154], [87.167, 87.549], [87.851, 88.009], [88.022, 88.351], [88.364, 88.772], [88.785, 89.049], [89.062, 89.904], [90.141, 90.272], [90.285, 90.338], [90.351, 90.956], [91.378, 91.851], [91.97, 92.391], [92.404, 92.522], [92.535, 92.693], [92.707, 93.049], [93.351, 93.456], [93.47, 93.535], [93.549, 94.022]]}, {"kind": "s", "id": "s1_2_1", "md": "Write down the trade-off and the conditions that would make you ==revisit== it.", "zh": "把这个取舍写下来，再写清楚在什么条件下要重新评估。", "sp": null, "gap": false, "start": 94.416, "end": 98.28, "words": [[94. const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
