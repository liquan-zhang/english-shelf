<script>
const D = {"id": "026", "title": "Trade-offs, Not Right Answers", "meta": "B2 · 约 280 词 · 场景：架构讨论", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Argument That Never Ends", "heading_zh": "1. 永远吵不完的争论", "rows": [[{"id": "s0_0_0", "md": "Two senior engineers have spent three meetings arguing about a relational database versus a document store.", "text": "Two senior engineers have spent three meetings arguing about a relational database versus a document store.", "zh": "两位资深工程师已经为关系型数据库和文档数据库吵了三次会。", "sp": null}, {"id": "s0_0_1", "md": "Every week they bring new benchmarks, and every week nobody changes their mind.", "text": "Every week they bring new benchmarks, and every week nobody changes their mind.", "zh": "每周他们都带着新的 benchmark 来，每周谁也说服不了谁。", "sp": null}, {"id": "s0_0_2", "md": "Both are smart, both have good points, and the team is still waiting for a decision.", "text": "Both are smart, both have good points, and the team is still waiting for a decision.", "zh": "两个人都很聪明，说得也都有道理，可团队还在等一个结论。", "sp": null}, {"id": "s0_0_3", "md": "The problem is not the people; it is the question.", "text": "The problem is not the people; it is the question.", "zh": "问题不在人，而在问题本身。", "sp": null}], [{"id": "s0_1_0", "md": "\"Which one is better?\" has no answer, because better depends on what you need.", "text": "\"Which one is better?\" has no answer, because better depends on what you need.", "zh": "「哪个更好？」这个问题没有答案，因为好不好取决于你需要什么。", "sp": null}, {"id": "s0_1_1", "md": "Every architecture choice gives you something and __takes something away__.", "text": "Every architecture choice gives you something and takes something away.", "zh": "每个架构选择都会给你一些东西，也会拿走一些东西。", "sp": null}, {"id": "s0_1_2", "md": "**Once you ask what each option costs, the argument turns into a decision.**", "text": "Once you ask what each option costs, the argument turns into a decision.", "zh": "一旦你开始问每个方案的代价是什么，争论就变成了决策。", "sp": null}], [{"id": "s0_2_0", "md": "A cache gives you speed and costs you ==freshness==.", "text": "A cache gives you speed and costs you freshness.", "zh": "缓存给你速度，代价是数据的新鲜度。", "sp": null}, {"id": "s0_2_1", "md": "Splitting into many small services gives teams ==autonomy== and costs you easy debugging.", "text": "Splitting into many small services gives teams autonomy and costs you easy debugging.", "zh": "拆成很多小服务，团队获得了自主权，代价是排查问题没那么方便了。", "sp": null}, {"id": "s0_2_2", "md": "Neither side is wrong; they are simply ==optimizing== for different things.", "text": "Neither side is wrong; they are simply optimizing for different things.", "zh": "两边都没错，只是各自优化的目标不同。", "sp": null}]]}, {"heading": "2. Name the Price, Then Pick", "heading_zh": "2. 先讲代价，再做选择", "rows": [[{"id": "s1_0_0", "md": "When you present an option, __lead with__ the trade-off instead of the benefit.", "text": "When you present an option, lead with the trade-off instead of the benefit.", "zh": "介绍一个方案时，先讲取舍，而不是先讲好处。", "sp": null}, {"id": "s1_0_1", "md": "Say, \"This gets us lower latency, and the price is more ==operational== work for on-call.\"", "text": "Say, \"This gets us lower latency, and the price is more operational work for on-call.\"", "zh": "可以说：「这样能把延迟降下来，代价是 on-call 的运维工作会更多。」", "sp": null}, {"id": "s1_0_2", "md": "People trust a proposal more when it is honest about its costs.", "text": "People trust a proposal more when it is honest about its costs.", "zh": "一个方案对自己的代价越坦诚，大家就越信它。", "sp": null}, {"id": "s1_0_3", "md": "It shows you have already looked for the weak spots yourself.", "text": "It shows you have already looked for the weak spots yourself.", "zh": "这说明你自己已经先找过它的软肋了。", "sp": null}], [{"id": "s1_1_0", "md": "Next, connect the choice to what the team needs most this quarter.", "text": "Next, connect the choice to what the team needs most this quarter.", "zh": "接着，把这个选择和团队这个季度最需要的东西挂上钩。", "sp": null}, {"id": "s1_1_1", "md": "If the goal is shipping fast, the simpler option usually wins, even if it is less ==elegant==.", "text": "If the goal is shipping fast, the simpler option usually wins, even if it is less elegant.", "zh": "如果目标是快速上线，通常是更简单的方案胜出，哪怕它没那么优雅。", "sp": null}, {"id": "s1_1_2", "md": "If the goal is surviving a big traffic spike, you may have to __accept the extra complexity__.", "text": "If the goal is surviving a big traffic spike, you may have to accept the extra complexity.", "zh": "如果目标是扛住一波大流量，你可能就得接受额外的复杂度。", "sp": null}], [{"id": "s1_2_0", "md": "**Saying \"for now, we choose speed over flexibility\" is a decision; saying \"option A is right\" is an opinion.**", "text": "Saying \"for now, we choose speed over flexibility\" is a decision; saying \"option A is right\" is an opinion.", "zh": "说「现阶段我们选速度、不选灵活性」是一个决策；说「方案 A 是对的」只是一个观点。", "sp": null}, {"id": "s1_2_1", "md": "Write down the trade-off and the conditions that would make you ==revisit== it.", "text": "Write down the trade-off and the conditions that would make you revisit it.", "zh": "把这个取舍写下来，再写清楚在什么条件下要重新评估。", "sp": null}, {"id": "s1_2_2", "md": "When those conditions change, nobody has to admit they were wrong.", "text": "When those conditions change, nobody has to admit they were wrong.", "zh": "等这些条件变了，没人需要承认自己当初错了。", "sp": null}, {"id": "s1_2_3", "md": "The context simply moved, and the team __moves with it__.", "text": "The context simply moved, and the team moves with it.", "zh": "只是情况变了，团队跟着调整而已。", "sp": null}]]}], "gist": [{"q": "两位工程师争了三次会还没结论，作者认为问题出在哪里？", "a": "不在人，在问题本身：「哪个更好」没有答案，好坏取决于需求。"}, {"q": "作者举了哪些取舍的例子？", "a": "缓存换来速度、牺牲数据新鲜度；拆成小服务换来团队自主、牺牲调试便利。"}, {"q": "怎样把争论变成决策？", "a": "介绍方案时先讲代价；把选择和本季度最重要的目标挂钩；写下取舍和需要重新评估的条件。"}], "dictation": [{"id": "s0_1_2", "text": "Once you ask what each option costs, the argument turns into a decision."}, {"id": "s0_1_1", "text": "Every architecture choice gives you something and takes something away."}, {"id": "s1_0_2", "text": "People trust a proposal more when it is honest about its costs."}, {"id": "s1_2_1", "text": "Write down the trade-off and the conditions that would make you revisit it."}], "shadow": {"text": "A cache gives you speed and costs you freshness. Splitting into many small services gives teams autonomy and costs you easy debugging. Neither side is wrong; they are simply optimizing for different things.", "marked": "A <b>cache</b> gives you <b>speed</b> / and costs you <b>freshness</b>. //<br>Splitting into many small services / gives teams <b>autonomy</b> / and costs you <b>easy debugging</b>. //<br><b>Neither</b> side is wrong; / they are simply optimizing / for <b>different</b> things. //"}, "prompts": [{"q": "团队在争要不要引入消息队列，双方都在说自己的方案「更好」。用 30 秒把讨论改成讲取舍，并和本季度目标挂钩。", "ref": "Can I suggest we stop asking which one is better? Both options work. A message queue gives us decoupling and smoother traffic peaks, and the price is another system for on-call to run. Direct calls are simpler but more fragile under load. Our main goal this quarter is to ship the new checkout before the holidays, so I'd lean toward direct calls for now and revisit if traffic doubles.", "ref_zh": "我建议咱们别再争哪个更好了。两个方案都行得通。消息队列能解耦，也能把流量高峰削平，代价是 on-call 又多一套系统要维护。直接调用更简单，但高负载下更脆弱。我们这个季度的主要目标是赶在假期前把新的结账流程上线，所以我现阶段倾向直接调用，等流量翻倍了再重新评估。", "id": "ref0"}, {"q": "你推荐一个方案，介绍时主动先讲它的代价，再说明在什么条件下你们会重新评估。", "ref": "Here's my recommendation, starting with what it costs us. If we move the profile data into a cache, reads get about five times faster, but users may see stale data for up to a minute. For profiles, I think that's acceptable. We should revisit this if we ever put account balances in the same cache, because there a minute of stale data would be a real problem.", "ref_zh": "这是我的建议，先说代价。如果把用户资料数据放进缓存，读取速度大概能快五倍，但用户可能会看到最长一分钟前的旧数据。对用户资料来说，我觉得这可以接受。如果哪天我们要把账户余额也放进同一个缓存，就得重新评估，因为那种场景下一分钟的旧数据就是真问题了。", "id": "ref1"}], "words": [{"w": "trade-off", "ipa": "/ˈtreɪd ɔːf/", "zh": "取舍、权衡", "ex": "The trade-off is faster reads in exchange for stale data.", "tts_w": "tradeoff", "id": "w0"}, {"w": "freshness", "ipa": "/ˈfreʃnəs/", "zh": "（数据）新鲜度", "ex": "For pricin const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
