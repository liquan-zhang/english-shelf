const D = {"id": "131", "type": "dialogue", "title": "Returning Something You Bought", "meta": "B2 · 约 310 词 · 场景：商店退换货与无小票退礼物", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Sales Assistant", "name_zh": "店员", "voice": "en-US-EmmaNeural"}}, "gist": [{"q": "空气炸锅出了什么问题？为什么不能直接退款？", "a": "能开机但完全不加热；买了十天，超过了七天退款期，按规定只能走厂家保修。"}, {"q": "「你」怎么说服店员？最后怎么处理的？", "a": "说明第三天就坏了、当时在出差、明显是质量问题；经理破例当天换一台新的，「你」还要求先试机。"}, {"q": "没有小票的玩具最后怎么退的？", "a": "不能退到卡上，只能退成店内消费额度；「你」指出是原价买的，店员破例按原价三十九块九给额度。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, I'd like to return this air fryer. It stopped working after just a few days."}, {"id": "s0_7_0", "text": "It turns on, but it doesn't heat up at all. It's clearly a defect, not something we did."}, {"id": "s1_2_0", "text": "No, I'm afraid not. Is there any way you could still take it back?"}, {"id": "s1_4_0", "text": "Would it be possible to put it back on my card instead?"}], "shadow": {"speaker": "A", "text": "I understand, but it broke down on the third day. I was away on a business trip, so I couldn't bring it in sooner.", "marked": "I <b>understand</b>, / but it broke down / on the <b>third</b> day. //<br>I was <b>away</b> / on a business trip, / so I <b>couldn't</b> bring it in <b>sooner</b>. //"}, "prompts": [{"q": "你网购的儿童鞋尺码不对，到线下门店想换。说明情况，问能不能在店里换，以及没货怎么办。", "ref": "Hi, I bought these shoes for my son on your website last week, but they're a size too small. He's only tried them on indoors. Can I exchange them here in the store, or do I have to send them back by post? And if you don't have the next size in stock, could I get a refund instead?", "ref_zh": "你好，我上周在你们官网给儿子买了这双鞋，但小了一码。他只在家里试穿过。能在门店直接换吗，还是必须寄回去？如果大一码没货，可以改成退款吗？", "id": "ref0"}, {"q": "你买的衬衫洗了一次就掉色，但店员说洗过的不能退。礼貌而坚定地争取，并要求见经理。", "ref": "I understand you normally don't accept washed items, but I followed the care label exactly. I washed it once in cold water, and the colour came out all over my other clothes. That's a quality problem, not something I did wrong. If you're not able to help, could I please speak to the manager?", "ref_zh": "我理解洗过的东西你们一般不退，但我完全是按洗涤标签操作的。只用冷水洗了一次，颜色就掉得我其他衣服上都是。这是质量问题，不是我操作不当。如果你没法处理，能请经理来一下吗？", "id": "ref1"}], "words": [{"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "小票，收据", "ex": "Do you need a printed receipt, or is an email okay?", "id": "w0"}, {"w": "refund", "ipa": "/ˈriːfʌnd/", "zh": "退款", "ex": "I asked for a refund because the shoes were too small.", "id": "w1"}, {"w": "warranty", "ipa": "/ˈwɔːrənti/", "zh": "保修", "ex": "The laptop comes with a two year warranty.", "id": "w2"}, {"w": "defect", "ipa": "/ˈdiːfekt/", "zh": "缺陷，质量问题", "ex": "If there's a defect, they'll replace it for free.", "id": "w3"}, {"w": "exception", "ipa": "/ɪkˈsepʃən/", "zh": "例外，破例", "ex": "Normally we don't allow food inside, but we'll make an exception.", "id": "w4"}, {"w": "unopened", "ipa": "/ʌnˈoʊpənd/", "zh": "未拆封的", "ex": "You can return unopened items within thirty days.", "id": "w5"}, {"w": "store credit", "ipa": "/stɔːr ˈkredɪt/", "zh": "店内消费额度", "ex": "They gave me store credit instead of cash.", "id": "w6"}, {"w": "proof of purchase", "ipa": "/pruːf əv ˈpɜːrtʃəs/", "zh": "购买凭证", "ex": "Keep your proof of purchase for warranty claims.", "id": "w7"}, {"w": "promotion", "ipa": "/prəˈmoʊʃən/", "zh": "促销", "ex": "The supermarket has a promotion on durian this week.", "id": "w8"}, {"w": "break down", "ipa": "/breɪk daʊn/", "zh": "（机器）坏掉", "ex": "Our washing machine broke down again.", "id": "w9"}], "sections": [{"heading": "1. A Faulty Air Fryer", "heading_zh": "1. 坏掉的空气炸锅", "rows": [[{"id": "s0_0_0", "md": "Hi, how can I help you today?", "text": "Hi, how can I help you today?", "zh": "您好，今天有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, I'd like to return this air fryer. It stopped working after just a few days.**", "text": "Hi, I'd like to return this air fryer. It stopped working after just a few days.", "zh": "你好，我想退这台空气炸锅。才用了几天就坏了。", "sp": "A"}], [{"id": "s0_2_0", "md": "Oh no. Do you have the ==receipt== with you?", "text": "Oh no. Do you have the receipt with you?", "zh": "哎呀。您带小票了吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "I have the digital receipt in my email. Here it is. I bought it ten days ago.", "text": "I have the digital receipt in my email. Here it is. I bought it ten days ago.", "zh": "邮箱里有电子小票，就这个。我是十天前买的。", "sp": "A"}], [{"id": "s0_4_0", "md": "Thanks. Unfortunately, our ==refund== policy is seven days. After that, it goes back to the manufacturer for repair under ==warranty==.", "text": "Thanks. Unfortunately, our refund policy is seven days. After that, it goes back to the manufacturer for repair under warranty.", "zh": "谢谢。不过我们的退款期是七天。超过七天就只能走厂家保修维修了。", "sp": "B"}], [{"id": "s0_5_0", "md": "I understand, but it __broke down__ on the third day. I was away on a business trip, so I couldn't bring it in sooner.", "text": "I understand, but it broke down on the third day. I was away on a business trip, so I couldn't bring it in sooner.", "zh": "我理解，但它第三天就坏了。我当时出差，所以没法早点拿过来。", "sp": "A"}], [{"id": "s0_6_0", "md": "I see. What exactly is wrong with it?", "text": "I see. What exactly is wrong with it?", "zh": "明白了。具体是什么问题？", "sp": "B"}], [{"id": "s0_7_0", "md": "It turns on, but it doesn't heat up at all. It's clearly a ==defect==, not something we did.", "text": "It turns on, but it doesn't heat up at all. It's clearly a defect, not something we did.", "zh": "能开机，但完全不加热。这明显是质量问题，不是我们弄坏的。", "sp": "A"}], [{"id": "s0_8_0", "md": "Let me __check with my manager__. One moment, please.", "text": "Let me check with my manager. One moment, please.", "zh": "我去问一下经理。请稍等。", "sp": "B"}], [{"id": "s0_9_0", "md": "Okay, my manager says we can make an ==exception== and swap it for a new one today.", "text": "Okay, my manager says we can make an exception and swap it for a new one today.", "zh": "好的，经理说可以破例，今天给您换一台新的。", "sp": "B"}], [{"id": "s0_10_0", "md": "**That would be great. Could you test the new one before I take it home?**", "text": "That would be great. Could you test the new one before I take it home?", "zh": "太好了。我带回家之前，能先把新的试一下吗？", "sp": "A"}]]}, {"heading": "2. A Gift Without a Receipt", "heading_zh": "2. 没有小票的礼物", "rows": [[{"id": "s1_0_0", "md": "While I'm here, my son got this toy as a gift, but he already has the same one. It's ==unopened==.", "text": "While I'm here, my son got this toy as a gift, but he already has the same one. It's unopened.", "zh": "趁我在这儿，我儿子收到这个玩具当礼物，可他已经有一个一样的了。还没拆封。", "sp": "A"}], [{"id": "s1_1_0", "md": "Do you have a gift receipt, by any chance?", "text": "Do you have a gift receipt, by any chance?", "zh": "请问您有礼品小票吗？", "sp": "B"}], [{"id": "s1_2_0", "md": "No, I'm afraid not. Is there any way you could still take it back?", "text": "No, I'm afraid not. Is there any way you could still take it back?", "zh": "恐怕没有。还有什么办法能退吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "Without a receipt, I can only offer ==store credit== at the current selling price.", "text": "Without a receipt, I can only offer store credit at the current selling price.", "zh": "没有小票的话，我只能按现价给您退成店内消费额度。", "sp": "B"}], [{"id": "s1_4_0", "md": "**Would it be possible to put it back on my card instead?**", "text": "Would it be possible to put it back on my card instead?", "zh": "能不能直接退到我的卡上？", "sp": "A"}], [{"id": "s1_5_0", "md": "Sorry, card refunds need ==proof of purchase==. But the credit is valid for a year, and you can use it online too.", "text": "Sorry, card refunds need proof of purchase. But the credit is valid for a year, and you can use it online too.", "zh": "抱歉，退到卡上需要购买凭证。不过额度一年内有效，网上也能用。", "sp": "B"}], [{"id": "s1_6_0", "md": "Okay, store credit is fine then. How much is it worth?", "text": "Okay, store credit is fine then. How much is it worth?", "zh": "好吧，那消费额度也行。值多少钱？", "sp": "A"}], [{"id": "s1_7_0", "md": "It's on ==promotion== right now, so it's thirty-two ninety.", "text": "It's on promotion right now, so it's thirty-two const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  h('div', {}, ...D.dictation.map((d, i) => {
    const ta = h('textarea', { placeholder: '把听到的句子打出来…' });
    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },

        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),

        } }, '核对')),

  }))));

for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
