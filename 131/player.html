t all over my other clothes. That's a quality problem, not something I did wrong. If you're not able to help, could I please speak to the manager?", "ref_zh": "我理解洗过的东西你们一般不退，但我完全是按洗涤标签操作的。只用冷水洗了一次，颜色就掉得我其他衣服上都是。这是质量问题，不是我操作不当。如果你没法处理，能请经理来一下吗？", "id": "ref1"}], "words": [{"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "小票，收据", "ex": "Do you need a printed receipt, or is an email okay?", "id": "w0"}, {"w": "refund", "ipa": "/ˈriːfʌnd/", "zh": "退款", "ex": "I asked for a refund because the shoes were too small.", "id": "w1"}, {"w": "warranty", "ipa": "/ˈwɔːrənti/", "zh": "保修", "ex": "The laptop comes with a two year warranty.", "id": "w2"}, {"w": "defect", "ipa": "/ˈdiːfekt/", "zh": "缺陷，质量问题", "ex": "If there's a defect, they'll replace it for free.", "id": "w3"}, {"w": "exception", "ipa": "/ɪkˈsepʃən/", "zh": "例外，破例", "ex": "Normally we don't allow food inside, but we'll make an exception.", "id": "w4"}, {"w": "unopened", "ipa": "/ʌnˈoʊpənd/", "zh": "未拆封的", "ex": "You can return unopened items within thirty days.", "id": "w5"}, {"w": "store credit", "ipa": "/stɔːr ˈkredɪt/", "zh": "店内消费额度", "ex": "They gave me store credit instead of cash.", "id": "w6"}, {"w": "proof of purchase", "ipa": "/pruːf əv ˈpɜːrtʃəs/", "zh": "购买凭证", "ex": "Keep your proof of purchase for warranty claims.", "id": "w7"}, {"w": "promotion", "ipa": "/prəˈmoʊʃən/", "zh": "促销", "ex": "The supermarket has a promotion on durian this week.", "id": "w8"}, {"w": "break down", "ipa": "/breɪk daʊn/", "zh": "（机器）坏掉", "ex": "Our washing machine broke down again.", "id": "w9"}], "sections": [{"heading": "1. A Faulty Air Fryer", "heading_zh": "1. 坏掉的空气炸锅", "rows": [[{"id": "s0_0_0", "md": "Hi, how can I help you today?", "text": "Hi, how can I help you today?", "zh": "您好，今天有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, I'd like to return this air fryer. It stopped working after just a few days.**", "text": "Hi, I'd like to return this air fryer. It stopped working after just a few days.", "zh": "你好，我想退这台空气炸锅。才用了几天就坏了。", "sp": "A"}], [{"id": "s0_2_0", "md": "Oh no. Do you have the ==receipt== with you?", "text": "Oh no. Do you have the receipt with you?", "zh": "哎呀。您带小票了吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "I have the digital receipt in my email. Here it is. I bought it ten days ago.", "text": "I have the digital receipt in my email. Here it is. I bought it ten days ago.", "zh": "邮箱里有电子小票，就这个。我是十天前买的。", "sp": "A"}], [{"id": "s0_4_0", "md": "Thanks. Unfortunately, our ==refund== policy is seven days. After that, it goes back to the manufacturer for repair under ==warranty==.", "text": "Thanks. Unfortunately, our refund policy is seven days. After that, it goes back to the manufacturer for repair under warranty.", "zh": "谢谢。不过我们的退款期是七天。超过七天就只能走厂家保修维修了。", "sp": "B"}], [{"id": "s0_5_0", "md": "I understand, but it __broke down__ on the third day. I was away on a business trip, so I couldn't bring it in sooner.", "text": "I understand, but it broke down on the third day. I was away on a business trip, so I couldn't bring it in sooner.", "zh": "我理解，但它第三天就坏了。我当时出差，所以没法早点拿过来。", "sp": "A"}], [{"id": "s0_6_0", "md": "I see. What exactly is wrong with it?", "text": "I see. What exactly is wrong with it?", "zh": "明白了。具体是什么问题？", "sp": "B"}], [{"id": "s0_7_0", "md": "It turns on, but it doesn't heat up at all. It's clearly a ==defect==, not something we did.", "text": "It turns on, but it doesn't heat up at all. It's clearly a defect, not something we did.", "zh": "能开机，但完全不加热。这明显是质量问题，不是我们弄坏的。", "sp": "A"}], [{"id": "s0_8_0", "md": "Let me __check with my manager__. One moment, please.", "text": "Let me check with my manager. One moment, please.", "zh": "我去问一下经理。请稍等。", "sp": "B"}], [{"id": "s0_9_0", "md": "Okay, my manager says we can make an ==exception== and swap it for a new one today.", "text": "Okay, my manager says we can make an exception and swap it for a new one today.", "zh": "好的，经理说可以破例，今天给您换一台新的。", "sp": "B"}], [{"id": "s0_10_0", "md": "**That would be great. Could you test the new one before I take it home?**", "text": "That would be great. Could you test the new one before I take it home?", "zh": "太好了。我带回家之前，能先把新的试一下吗？", "sp": "A"}]]}, {"heading": "2. A Gift Without a Receipt", "heading_zh": "2. 没有小票的礼物", "rows": [[{"id": "s1_0_0", "md": "While I'm here, my son got this toy as a gift, but he already has the same one. It's ==unopened==.", "text": "While I'm here, my son got this toy as a gift, but he already has the same one. It's unopened.", "zh": "趁我在这儿，我儿子收到这个玩具当礼物，可他已经有一个一样的了。还没拆封。", "sp": "A"}], [{"id": "s1_1_0", "md": "Do you have a gift receipt, by any chance?", "text": "Do you have a gift receipt, by any chance?", "zh": "请问您有礼品小票吗？", "sp": "B"}], [{"id": "s1_2_0", "md": "No, I'm afraid not. Is there any way you could still take it back?", "text": "No, I'm afraid not. Is there any way you could still take it back?", "zh": "恐怕没有。还有什么办法能退吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "Without a receipt, I can only offer ==store credit== at the current selling price.", "text": "Without a receipt, I can only offer store credit at the current selling price.", "zh": "没有小票的话，我只能按现价给您退成店内消费额度。", "sp": "B"}], [{"id": "s1_4_0", "md": "**Would it be possible to put it back on my card instead?**", "text": "Would it be possible to put it back on my card instead?", "zh": "能不能直接退到我的卡上？", "sp": "A"}], [{"id": "s1_5_0", "md": "Sorry, card refunds need ==proof of purchase==. But the credit is valid for a year, and you can use it online too.", "text": "Sorry, card refunds need proof of purchase. But the credit is valid for a year, and you can use it online too.", "zh": "抱歉，退到卡上需要购买凭证。不过额度一年内有效，网上也能用。", "sp": "B"}], [{"id": "s1_6_0", "md": "Okay, store credit is fine then. How much is it worth?", "text": "Okay, store credit is fine then. How much is it worth?", "zh": "好吧，那消费额度也行。值多少钱？", "sp": "A"}], [{"id": "s1_7_0", "md": "It's on ==promotion== right now, so it's thirty-two ninety.", "text": "It's on promotion right now, so it's thirty-two const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
