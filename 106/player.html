const D = {"id": "106", "type": "dialogue", "title": "Booking a Table for a Family Dinner", "meta": "B2 · 约 310 词 · 场景：电话订寿宴与迟到通知", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Restaurant Staff", "name_zh": "餐厅店员", "voice": "en-AU-NatashaNeural"}}, "gist": [{"q": "「你」订位时提了哪些要求？", "a": "周六晚七点八个人，要包间；要两张儿童餐椅；爸爸不吃牛肉，一个孩子花生过敏；自带生日蛋糕。"}, {"q": "包间和自带蛋糕各有什么费用？", "a": "包间最低消费八百块；自带蛋糕收二十块蛋糕切费，餐厅帮忙冷藏。"}, {"q": "「你」为什么打第二通电话？餐厅怎么配合的？", "a": "高速上有车祸，要晚二十分钟；餐厅说包间可以保留，前菜等人到了再上，主菜后插蜡烛端蛋糕、员工一起唱生日歌。"}], "dictation": [{"id": "s0_3_0", "text": "It's my mother's seventieth birthday. Do you have a private room, or at least a quieter corner?"}, {"id": "s0_9_0", "text": "Yes. Would it be okay if we brought our own birthday cake?"}, {"id": "s1_3_0", "text": "I'm afraid we're running about twenty minutes late. There's an accident on the expressway."}, {"id": "s1_5_0", "text": "Thank you. We pre-ordered the starters. Could you hold off on them until we arrive?"}], "shadow": {"speaker": "A", "text": "I'm afraid we're running about twenty minutes late. There's an accident on the expressway.", "marked": "I'm <b>afraid</b> / we're running about <b>twenty minutes</b> late. //<br>There's an <b>accident</b> / on the expressway. //"}, "prompts": [{"q": "你订好了周六的位子，但人数从八个变成十一个。打电话给餐厅，问包间能不能坐下，不行的话有什么安排。", "ref": "Hi, this is Lee. I have a booking for eight people this Saturday at seven, in the private room. A few more relatives are flying in, so we'll actually be eleven. Is there any way the room can fit eleven? If it's too tight, could you put two tables together in a quieter part of the main dining area instead?", "ref_zh": "你好，我是 Lee。我订了这周六七点的包间，八个人。又有几个亲戚要飞过来，所以实际上是十一个人。包间能坐得下十一个吗？如果太挤，能不能在大厅安静一点的地方拼两张桌子？", "id": "ref0"}, {"q": "家里孩子突然发烧，你需要取消当晚的订位。打电话给餐厅，道歉并问会不会扣订金，能不能改到下周。", "ref": "Hi, this is Lee. I'm really sorry, but I need to cancel tonight's booking for eight. My son has come down with a fever, and we can't leave him. I know it's very short notice. Will the deposit be refunded, or could we move the booking to next Saturday instead? Same time, same room, if possible.", "ref_zh": "你好，我是 Lee。真的很抱歉，我需要取消今晚八个人的订位。我儿子突然发烧了，我们离不开他。我知道通知得很晚。订金能退吗？或者能改到下周六吗？最好同样的时间、同样的包间。", "id": "ref1"}], "words": [{"w": "private room", "ipa": "/ˈpraɪvət ruːm/", "zh": "包间", "ex": "We booked a private room for the team dinner.", "id": "w0"}, {"w": "minimum spend", "ipa": "/ˈmɪnɪməm spend/", "zh": "最低消费", "ex": "The private room has a minimum spend of five hundred dollars.", "id": "w1"}, {"w": "high chair", "ipa": "/ˈhaɪ tʃer/", "zh": "儿童餐椅", "ex": "Could we get a high chair for the baby?", "id": "w2"}, {"w": "allergic", "ipa": "/əˈlɜːrdʒɪk/", "zh": "过敏的", "ex": "My son is allergic to shellfish.", "id": "w3"}, {"w": "cakeage", "ipa": "/ˈkeɪkɪdʒ/", "zh": "（自带蛋糕）切蛋糕费", "ex": "Some restaurants charge cakeage if you bring your own cake.", "id": "w4"}, {"w": "pre-order (v.)", "ipa": "/ˌpriːˈɔːrdər/", "zh": "预先点（菜）", "ex": "We pre-ordered the roast duck when we booked.", "tts_w": "pre-order", "id": "w5"}, {"w": "mains", "ipa": "/meɪnz/", "zh": "主菜", "ex": "We shared two starters and three mains.", "id": "w6"}, {"w": "candle", "ipa": "/ˈkændəl/", "zh": "蜡烛", "ex": "She blew out all the candles in one go.", "id": "w7"}, {"w": "hold off on", "ipa": "/hoʊld ɔːf ɑːn/", "zh": "暂缓", "ex": "Let's hold off on dessert for now.", "id": "w8"}], "sections": [{"heading": "1. Making the Booking", "heading_zh": "1. 电话订位", "rows": [[{"id": "s0_0_0", "md": "Good afternoon, Harbour Grill. How can I help?", "text": "Good afternoon, Harbour Grill. How can I help?", "zh": "下午好，Harbour Grill。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, I'd like to __book a table for__ Saturday night, around seven. There'll be eight of us.", "text": "Hi, I'd like to book a table for Saturday night, around seven. There'll be eight of us.", "zh": "你好，我想订周六晚上七点左右的位子，一共八个人。", "sp": "A"}], [{"id": "s0_2_0", "md": "Let me check. Saturday at seven for eight. Yes, we can do that. Is it a special occasion?", "text": "Let me check. Saturday at seven for eight. Yes, we can do that. Is it a special occasion?", "zh": "我查一下。周六七点，八位。可以的。是有什么特别的日子吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**It's my mother's seventieth birthday. Do you have a private room, or at least a quieter corner?**", "text": "It's my mother's seventieth birthday. Do you have a private room, or at least a quieter corner?", "zh": "是我妈妈七十大寿。有包间吗？或者至少安静一点的角落？", "sp": "A"}], [{"id": "s0_4_0", "md": "We have a ==private room== that seats ten, but there's a ==minimum spend== of eight hundred dollars.", "text": "We have a private room that seats ten, but there's a minimum spend of eight hundred dollars.", "zh": "我们有一间能坐十个人的包间，不过最低消费是八百块。", "sp": "B"}], [{"id": "s0_5_0", "md": "That should be fine. We'll also need two ==high chairs== for the kids.", "text": "That should be fine. We'll also need two high chairs for the kids.", "zh": "应该没问题。我们还需要两张儿童餐椅。", "sp": "A"}], [{"id": "s0_6_0", "md": "No worries. Any __dietary requirements__ I should note down?", "text": "No worries. Any dietary requirements I should note down?", "zh": "没问题。有什么饮食上的要求需要我记下来吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "My father doesn't eat beef, and one of the kids is ==allergic== to peanuts.", "text": "My father doesn't eat beef, and one of the kids is allergic to peanuts.", "zh": "我爸爸不吃牛肉，有个孩子对花生过敏。", "sp": "A"}], [{"id": "s0_8_0", "md": "Got it, I'll let the kitchen know. Anything else?", "text": "Got it, I'll let the kitchen know. Anything else?", "zh": "好的，我会告诉厨房。还有别的吗？", "sp": "B"}], [{"id": "s0_9_0", "md": "**Yes. Would it be okay if we brought our own birthday cake?**", "text": "Yes. Would it be okay if we brought our own birthday cake?", "zh": "有。我们自己带生日蛋糕可以吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Of course. There's a ==cakeage== fee of twenty dollars, and we'll keep it in the fridge for you.", "text": "Of course. There's a cakeage fee of twenty dollars, and we'll keep it in the fridge for you.", "zh": "当然可以。蛋糕切费是二十块，我们会帮您放冰箱。", "sp": "B"}], [{"id": "s0_11_0", "md": "That's fine. The booking's under Lee, and my number is nine one two three, four five six seven.", "text": "That's fine. The booking's under Lee, and my number is nine one two three, four five six seven.", "zh": "可以。预订名字写 Lee，我的电话是九一二三，四五六七。", "sp": "A"}], [{"id": "s0_12_0", "md": "Lovely. We'll send you a confirmation by text. See you Saturday!", "text": "Lovely. We'll send you a confirmation by text. See you Saturday!", "zh": "好的。我们会发短信确认。周六见！", "sp": "B"}]]}, {"heading": "2. Running Late", "heading_zh": "2. 要迟到了", "rows": [[{"id": "s1_0_0", "md": "Harbour Grill, this is Natasha.", "text": "Harbour Grill, this is Natasha.", "zh": "Harbour Grill，我是 Natasha。", "sp": "B"}], [{"id": "s1_1_0", "md": "Hi Natasha, this is Lee. I have a booking for eight at seven tonight, in the private room.", "text": "Hi Natasha, this is Lee. I have a booking for eight at seven tonight, in the private room.", "zh": "你好 Natasha，我是 Lee。我订了今晚七点的包间，八个人。", "sp": "A"}], [{"id": "s1_2_0", "md": "Yes, Mr. Lee. We've got everything set up for you.", "text": "Yes, Mr. Lee. We've got everything set up for you.", "zh": "是的，Lee 先生。我们都给您布置好了。", "sp": "B"}], [{"id": "s1_3_0", "md": "**I'm afraid we're running about twenty minutes late. There's an accident on the expressway.**", "text": "I'm afraid we're running about twenty minutes late. There's an accident on the expressway.", "zh": "我们恐怕要晚二十分钟左右。高速上出了车祸。", "sp": "A"}], [{"id": "s1_4_0", "md": "Thanks for letting us know. We normally only __hold the table__ for fifteen minutes, but for the private room, that's fine.", "text": "Thanks for letting us know. We normally only hold the table for fifteen minutes, but for the private room, that's fine.", "zh": "谢谢告知。我们一般只保留位子十五分钟，不过包间没关系。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thank you. We ==pre-ordered== the starters. Could you __hold off on__ them until we arrive?", "text": "Thank you. We const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
