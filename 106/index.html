const D = {"id": "106", "type": "dialogue", "title": "Booking a Table for a Family Dinner", "meta": "B2 · 约 310 词 · 场景：电话订寿宴与迟到通知", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Restaurant Staff", "name_zh": "餐厅店员", "voice": "en-AU-NatashaNeural"}}, "gist": [{"q": "「你」订位时提了哪些要求？", "a": "周六晚七点八个人，要包间；要两张儿童餐椅；爸爸不吃牛肉，一个孩子花生过敏；自带生日蛋糕。"}, {"q": "包间和自带蛋糕各有什么费用？", "a": "包间最低消费八百块；自带蛋糕收二十块蛋糕切费，餐厅帮忙冷藏。"}, {"q": "「你」为什么打第二通电话？餐厅怎么配合的？", "a": "高速上有车祸，要晚二十分钟；餐厅说包间可以保留，前菜等人到了再上，主菜后插蜡烛端蛋糕、员工一起唱生日歌。"}], "dictation": [{"id": "s0_3_0", "text": "It's my mother's seventieth birthday. Do you have a private room, or at least a quieter corner?"}, {"id": "s0_9_0", "text": "Yes. Would it be okay if we brought our own birthday cake?"}, {"id": "s1_3_0", "text": "I'm afraid we're running about twenty minutes late. There's an accident on the expressway."}, {"id": "s1_5_0", "text": "Thank you. We pre-ordered the starters. Could you hold off on them until we arrive?"}], "shadow": {"speaker": "A", "text": "I'm afraid we're running about twenty minutes late. There's an accident on the expressway.", "marked": "I'm <b>afraid</b> / we're running about <b>twenty minutes</b> late. //<br>There's an <b>accident</b> / on the expressway. //"}, "prompts": [{"q": "你订好了周六的位子，但人数从八个变成十一个。打电话给餐厅，问包间能不能坐下，不行的话有什么安排。", "ref": "Hi, this is Lee. I have a booking for eight people this Saturday at seven, in the private room. A few more relatives are flying in, so we'll actually be eleven. Is there any way the room can fit eleven? If it's too tight, could you put two tables together in a quieter part of the main dining area instead?", "ref_zh": "你好，我是 Lee。我订了这周六七点的包间，八个人。又有几个亲戚要飞过来，所以实际上是十一个人。包间能坐得下十一个吗？如果太挤，能不能在大厅安静一点的地方拼两张桌子？", "id": "ref0"}, {"q": "家里孩子突然发烧，你需要取消当晚的订位。打电话给餐厅，道歉并问会不会扣订金，能不能改到下周。", "ref": "Hi, this is Lee. I'm really sorry, but I need to cancel tonight's booking for eight. My son has come down with a fever, and we can't leave him. I know it's very short notice. Will the deposit be refunded, or could we move the booking to next Saturday instead? Same time, same room, if possible.", "ref_zh": "你好，我是 Lee。真的很抱歉，我需要取消今晚八个人的订位。我儿子突然发烧了，我们离不开他。我知道通知得很晚。订金能退吗？或者能改到下周六吗？最好同样的时间、同样的包间。", "id": "ref1"}], "words": [{"w": "private room", "ipa": "/ˈpraɪvət ruːm/", "zh": "包间", "ex": "We booked a private room for the team dinner.", "id": "w0"}, {"w": "minimum spend", "ipa": "/ˈmɪnɪməm spend/", "zh": "最低消费", "ex": "The private room has a minimum spend of five hundred dollars.", "id": "w1"}, {"w": "high chair", "ipa": "/ˈhaɪ tʃer/", "zh": "儿童餐椅", "ex": "Could we get a high chair for the baby?", "id": "w2"}, {"w": "allergic", "ipa": "/əˈlɜːrdʒɪk/", "zh": "过敏的", "ex": "My son is allergic to shellfish.", "id": "w3"}, {"w": "cakeage", "ipa": "/ˈkeɪkɪdʒ/", "zh": "（自带蛋糕）切蛋糕费", "ex": "Some restaurants charge cakeage if you bring your own cake.", "id": "w4"}, {"w": "pre-order (v.)", "ipa": "/ˌpriːˈɔːrdər/", "zh": "预先点（菜）", "ex": "We pre-ordered the roast duck when we booked.", "tts_w": "pre-order", "id": "w5"}, {"w": "mains", "ipa": "/meɪnz/", "zh": "主菜", "ex": "We shared two starters and three mains.", "id": "w6"}, {"w": "candle", "ipa": "/ˈkændəl/", "zh": "蜡烛", "ex": "She blew out all the candles in one go.", "id": "w7"}, {"w": "hold off on", "ipa": "/hoʊld ɔːf ɑːn/", "zh": "暂缓", "ex": "Let's hold off on dessert for now.", "id": "w8"}], "sections": [{"heading": "1. Making the Booking", "heading_zh": "1. 电话订位", "rows": [[{"id": "s0_0_0", "md": "Good afternoon, Harbour Grill. How can I help?", "text": "Good afternoon, Harbour Grill. How can I help?", "zh": "下午好，Harbour Grill。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, I'd like to __book a table for__ Saturday night, around seven. There'll be eight of us.", "text": "Hi, I'd like to book a table for Saturday night, around seven. There'll be eight of us.", "zh": "你好，我想订周六晚上七点左右的位子，一共八个人。", "sp": "A"}], [{"id": "s0_2_0", "md": "Let me check. Saturday at seven for eight. Yes, we can do that. Is it a special occasion?", "text": "Let me check. Saturday at seven for eight. Yes, we can do that. Is it a special occasion?", "zh": "我查一下。周六七点，八位。可以的。是有什么特别的日子吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**It's my mother's seventieth birthday. Do you have a private room, or at least a quieter corner?**", "text": "It's my mother's seventieth birthday. Do you have a private room, or at least a quieter corner?", "zh": "是我妈妈七十大寿。有包间吗？或者至少安静一点的角落？", "sp": "A"}], [{"id": "s0_4_0", "md": "We have a ==private room== that seats ten, but there's a ==minimum spend== of eight hundred dollars.", "text": "We have a private room that seats ten, but there's a minimum spend of eight hundred dollars.", "zh": "我们有一间能坐十个人的包间，不过最低消费是八百块。", "sp": "B"}], [{"id": "s0_5_0", "md": "That should be fine. We'll also need two ==high chairs== for the kids.", "text": "That should be fine. We'll also need two high chairs for the kids.", "zh": "应该没问题。我们还需要两张儿童餐椅。", "sp": "A"}], [{"id": "s0_6_0", "md": "No worries. Any __dietary requirements__ I should note down?", "text": "No worries. Any dietary requirements I should note down?", "zh": "没问题。有什么饮食上的要求需要我记下来吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "My father doesn't eat beef, and one of the kids is ==allergic== to peanuts.", "text": "My father doesn't eat beef, and one of the kids is allergic to peanuts.", "zh": "我爸爸不吃牛肉，有个孩子对花生过敏。", "sp": "A"}], [{"id": "s0_8_0", "md": "Got it, I'll let the kitchen know. Anything else?", "text": "Got it, I'll let the kitchen know. Anything else?", "zh": "好的，我会告诉厨房。还有别的吗？", "sp": "B"}], [{"id": "s0_9_0", "md": "**Yes. Would it be okay if we brought our own birthday cake?**", "text": "Yes. Would it be okay if we brought our own birthday cake?", "zh": "有。我们自己带生日蛋糕可以吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Of course. There's a ==cakeage== fee of twenty dollars, and we'll keep it in the fridge for you.", "text": "Of course. There's a cakeage fee of twenty dollars, and we'll keep it in the fridge for you.", "zh": "当然可以。蛋糕切费是二十块，我们会帮您放冰箱。", "sp": "B"}], [{"id": "s0_11_0", "md": "That's fine. The booking's under Lee, and my number is nine one two three, four five six seven.", "text": "That's fine. The booking's under Lee, and my number is nine one two three, four five six seven.", "zh": "可以。预订名字写 Lee，我的电话是九一二三，四五六七。", "sp": "A"}], [{"id": "s0_12_0", "md": "Lovely. We'll send you a confirmation by text. See you Saturday!", "text": "Lovely. We'll send you a confirmation by text. See you Saturday!", "zh": "好的。我们会发短信确认。周六见！", "sp": "B"}]]}, {"heading": "2. Running Late", "heading_zh": "2. 要迟到了", "rows": [[{"id": "s1_0_0", "md": "Harbour Grill, this is Natasha.", "text": "Harbour Grill, this is Natasha.", "zh": "Harbour Grill，我是 Natasha。", "sp": "B"}], [{"id": "s1_1_0", "md": "Hi Natasha, this is Lee. I have a booking for eight at seven tonight, in the private room.", "text": "Hi Natasha, this is Lee. I have a booking for eight at seven tonight, in the private room.", "zh": "你好 Natasha，我是 Lee。我订了今晚七点的包间，八个人。", "sp": "A"}], [{"id": "s1_2_0", "md": "Yes, Mr. Lee. We've got everything set up for you.", "text": "Yes, Mr. Lee. We've got everything set up for you.", "zh": "是的，Lee 先生。我们都给您布置好了。", "sp": "B"}], [{"id": "s1_3_0", "md": "**I'm afraid we're running about twenty minutes late. There's an accident on the expressway.**", "text": "I'm afraid we're running about twenty minutes late. There's an accident on the expressway.", "zh": "我们恐怕要晚二十分钟左右。高速上出了车祸。", "sp": "A"}], [{"id": "s1_4_0", "md": "Thanks for letting us know. We normally only __hold the table__ for fifteen minutes, but for the private room, that's fine.", "text": "Thanks for letting us know. We normally only hold the table for fifteen minutes, but for the private room, that's fine.", "zh": "谢谢告知。我们一般只保留位子十五分钟，不过包间没关系。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thank you. We ==pre-ordered== the starters. Could you __hold off on__ them until we arrive?", "text": "Thank you. We const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

main.append(step('s2', '② 听写', '4 分钟', '每句可以反复听，听到能完整写出来为止。点「核对」后，<span style="color:var(--bad)">红色</span>是漏听或听错的词。',
  h('div', {}, ...D.dictation.map((d, i) => {
    const ta = h('textarea', { placeholder: '把听到的句子打出来…' });
    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
