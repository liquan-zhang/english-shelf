<script>
const D = {"id": "061", "title": "The First Ten Minutes of an Incident", "meta": "B2 · 约 260 词 · 场景：故障响应", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Instinct to Debug", "heading_zh": "1. 想立刻排查的本能", "rows": [[{"id": "s0_0_0", "md": "When an alert fires at two in the morning, every engineer wants to open the logs.", "text": "When an alert fires at two in the morning, every engineer wants to open the logs.", "zh": "凌晨两点告警一响，每个工程师的第一反应都是去翻日志。", "sp": null}, {"id": "s0_0_1", "md": "That instinct is healthy, but in the first ten minutes it is often the wrong job.", "text": "That instinct is healthy, but in the first ten minutes it is often the wrong job.", "zh": "这个本能没毛病，但在头十分钟里，这往往不是该干的事。", "sp": null}, {"id": "s0_0_2", "md": "Five people debugging in five different directions is not a response; it is ==noise==.", "text": "Five people debugging in five different directions is not a response; it is noise.", "zh": "五个人朝五个方向各查各的，那不叫响应，那叫添乱。", "sp": null}], [{"id": "s0_1_0", "md": "The real danger early on is confusion about who is doing what.", "text": "The real danger early on is confusion about who is doing what.", "zh": "初期真正的风险，是谁在干什么没人说得清。", "sp": null}, {"id": "s0_1_1", "md": "Two people restart the same service, a third ==escalates== to the wrong team, and nobody tells the PM.", "text": "Two people restart the same service, a third escalates to the wrong team, and nobody tells the PM.", "zh": "两个人重启了同一个服务，第三个人升级给了错的团队，还没人通知 PM。", "sp": null}, {"id": "s0_1_2", "md": "**Most incidents get worse because of coordination, not because of code.**", "text": "Most incidents get worse because of coordination, not because of code.", "zh": "大多数故障越搞越大，问题出在协同上，而不是代码上。", "sp": null}], [{"id": "s0_2_0", "md": "So before anyone touches production, somebody needs to __take charge__.", "text": "So before anyone touches production, somebody needs to take charge.", "zh": "所以在任何人动线上之前，得有一个人站出来扛指挥。", "sp": null}, {"id": "s0_2_1", "md": "That person does not have to be the most senior engineer on the call.", "text": "That person does not have to be the most senior engineer on the call.", "zh": "这个人不一定是会上资历最深的工程师。", "sp": null}, {"id": "s0_2_2", "md": "They just need to ==claim== the role out loud and __stick with it__.", "text": "They just need to claim the role out loud and stick with it.", "zh": "他只需要大声把这个角色认下来，并且一直担到底。", "sp": null}]]}, {"heading": "2. What the Lead Says First", "heading_zh": "2. 指挥第一句说什么", "rows": [[{"id": "s1_0_0", "md": "**The incident lead's first job is to make the situation visible, not to fix it.**", "text": "The incident lead's first job is to make the situation visible, not to fix it.", "zh": "故障指挥的第一件事是让局面透明，而不是去修。", "sp": null}, {"id": "s1_0_1", "md": "Open one channel, and ask everyone to __post updates there__ instead of in private messages.", "text": "Open one channel, and ask everyone to post updates there instead of in private messages.", "zh": "开一个群，让所有人都在里面同步进展，别私聊。", "sp": null}, {"id": "s1_0_2", "md": "Then assign two roles: one person investigates, and one person communicates.", "text": "Then assign two roles: one person investigates, and one person communicates.", "zh": "然后定两个角色：一个人负责排查，一个人负责对外沟通。", "sp": null}], [{"id": "s1_1_0", "md": "Next, state what you know and what you don't.", "text": "Next, state what you know and what you don't.", "zh": "接下来，说清楚哪些是已知的，哪些还不知道。", "sp": null}, {"id": "s1_1_1", "md": "\"Checkout errors are up since the ten o'clock release; we don't know yet if the release caused it.\"", "text": "\"Checkout errors are up since the ten o'clock release; we don't know yet if the release caused it.\"", "zh": "「十点那次发版之后下单报错上涨了；还不确定是不是发版导致的。」", "sp": null}, {"id": "s1_1_2", "md": "That single sentence stops people from ==speculating== and gives them a shared starting point.", "text": "That single sentence stops people from speculating and gives them a shared starting point.", "zh": "就这一句话，能让大家不再瞎猜，有一个共同的起点。", "sp": null}, {"id": "s1_1_3", "md": "If a rollback is a safe ==mitigation==, try it before you understand the root cause.", "text": "If a rollback is a safe mitigation, try it before you understand the root cause.", "zh": "如果回滚是安全的止血手段，那就在搞清根因之前先回滚。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, __set a rhythm__.", "text": "Finally, set a rhythm.", "zh": "最后，定好节奏。", "sp": null}, {"id": "s1_2_1", "md": "Promise the next update in fifteen minutes, even if there is nothing new to report.", "text": "Promise the next update in fifteen minutes, even if there is nothing new to report.", "zh": "承诺十五分钟后同步下一次进展，哪怕到时候没有新消息。", "sp": null}, {"id": "s1_2_2", "md": "A ==predictable== update tells managers they can stop pinging the engineers.", "text": "A predictable update tells managers they can stop pinging the engineers.", "zh": "有规律的同步能让领导们知道，不用再去追着工程师问了。", "sp": null}, {"id": "s1_2_3", "md": "Silence during an outage feels like chaos, even when the team is making progress.", "text": "Silence during an outage feels like chaos, even when the team is making progress.", "zh": "故障期间一沉默，大家就觉得一团乱，哪怕团队其实在推进。", "sp": null}]]}], "gist": [{"q": "作者认为故障前十分钟最大的危险是什么？", "a": "不是代码本身，而是协调混乱：没人知道谁在做什么，重复操作、升级错人、没人通知 PM。"}, {"q": "故障负责人的第一件事是什么？", "a": "让局面可见而不是亲自修：开一个统一频道，分出排查和沟通两个角色。"}, {"q": "为什么要固定节奏发更新，哪怕没有新进展？", "a": "可预期的更新让管理者不再去追问工程师；沉默会让人觉得一片混乱。"}], "dictation": [{"id": "s0_1_2", "text": "Most incidents get worse because of coordination, not because of code."}, {"id": "s1_0_0", "text": "The incident lead's first job is to make the situation visible, not to fix it."}, {"id": "s1_1_3", "text": "If a rollback is a safe mitigation, try it before you understand the root cause."}, {"id": "s1_2_3", "text": "Silence during an outage feels like chaos, even when the team is making progress."}], "shadow": {"text": "Next, state what you know and what you don't. \"Checkout errors are up since the ten o'clock release; we don't know yet if the release caused it.\" That single sentence stops people from speculating and gives them a shared starting point.", "marked": "Next, / state what you <b>know</b> / and what you <b>don't</b>. //<br>\"Checkout <b>errors</b> are up / since the <b>ten</b> o'clock release; / we <b>don't</b> know yet / if the release <b>caused</b> it.\" //<br>That <b>single</b> sentence / stops people from <b>speculating</b> / and gives them a <b>shared</b> starting point. //"}, "prompts": [{"q": "凌晨告警，群里五个人各自在查、各说各的。你决定站出来当指挥。用 30 秒接管：宣布角色、说清已知和未知、定下一次更新时间。", "ref": "Okay, everyone, I'll run this incident. Let's keep all updates in this channel, please, not in private messages. Mei, you investigate; Tom, you handle communication with support and the PM. Here's what we know: login errors started around one forty, right after the config push. We don't know yet if the push caused it. Let's roll back the config first, and I'll post the next update in fifteen minutes.", "ref_zh": "好，大家听一下，这次故障我来指挥。所有进展都同步在这个群里，别私聊。Mei 你负责排查；Tom 你负责跟客服和 PM 沟通。目前已知的是：登录报错大概从一点四十开始，正好在配置推送之后。还不确定是不是这次推送导致的。我们先把配置回滚，我十五分钟后同步下一次进展。", "id": "ref0"}, {"q": "故障复盘会上，有人说“下次大家都赶紧查日志就行了”。用 30 秒说明为什么前十分钟应该先定角色而不是先查。", "ref": "I understand the instinct, and fast debugging matters. But last night, three of us restarted the same service and nobody told the PM for twenty minutes. The code wasn't the slow part; the coordination was. So I'd suggest a simple rule: in the first few minutes, someone claims the lead role, opens one channel and assigns an investigator and a communicator. Then everyone else debugs.", "ref_zh": "我理解这种本能，快速排查确实重要。但昨晚我们三个人重启了同一个服务，二十分钟都没人通知 PM。慢的不是代码，是协同。所以我建议定个简单的规矩：前几分钟先有人认领指挥角色，开一个群，指定一个排查的、一个沟通的。然后其他人再去查。", "id": "ref1"}], "words": [{"w": "noise", "ipa": "/nɔɪz/", "zh": "噪音；无用的干扰信息", "ex": "Half of these alerts are noise, so the real one got missed.", "id": "w0"}, {"w": "escalate", "ipa": "/ˈeskəˌleɪt/", "zh": "升级（问题上报）", "ex": "If the database team doesn't respond in ten minutes, escalate to their manager.", "id": "w1"}, {"w": "claim (v.)", "ipa": "/kleɪm/", "zh": "认领、主动承担", "ex": "Can someone claim this ticket before the end of the day?", "tts_w": "claim", "id": "w2"}, {"w": "speculate", "ipa": "/ˈspekjəˌleɪt/", "zh": "猜测、推测", "ex": "Let's not speculate about the cause until we see the logs.", "id": "w3"}, {"w": "mitigation", "ipa": "/ˌmɪtɪˈɡeɪʃən/", "zh": "缓解措施、止损手段", "ex": "Turning off the new feature flag is our fastest mitigation.", "id": "w4"}, {"w": "predictable", "ipa": "/prɪˈdɪktəbəl/", "zh": "可预期的", "ex": "Stakeholders care more about predictable updates than perfect ones.", "id": "w5"}, {"w": "coordination", "ipa": "/koʊˌɔːrdɪˈneɪʃən/", "zh": "协调", "ex": "The outage lasted longer because of poor coordination between teams.", "id": "w6"}, {"w": "assign", "ipa": "/əˈsaɪn/", "zh": "分配、指派", "ex": "I'll assign the follow-up items after the call.", "id": "w7"}, {"w": "instinct", "ipa": "/ˈɪnstɪŋkt/", "zh": "本能、直觉", "ex": "My first instinct was to restart the pod, but I checked the metrics first.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. The Instinct to Debug", "zh": "1. 想立刻排查的本能", "start": 0.0, "end": 2.304, "words": [[0.105, 0.395], [0.711, 0.816], [0.829, 1.303], [1.316, 1.408], [1.421, 1.921]]}, {"kind": "s", "id": "s0_0_0", "md": "When an alert fires at two in the morning, every engineer wants to open the logs.", "zh": "凌晨两点告警一响，每个工程师的第一反应都是去翻日志。", "sp": null, "gap": false, "start": 2.304, "end": 7.44, "words": [[2.422, 2.528], [2.541, 2.607], [2.62, 2.949], [2.962, 3.409], [3.422, 3.541], [3.554, 3.791], [3.804, 3.87], [3.883, 3.949], [3.962, 4.383], [4.804, 5.093], [5.107, 5.725], [5.738, 5.962], [5.975, 6.067], [6.08, 6.357], [6.37, 6.449], [6.462, 7.041]]}, {"kind": "s", "id": "s0_0_1", "md": "That instinct is healthy, but in the first ten minutes it is often the wrong job.", "zh": "这个本能没毛病，但在头十分钟里，这往往不是该干的事。", "sp": null, "gap": false, "start": 7.44, "end": 12.504, "words": [[7.545, 7.716], [7.729, 8.229], [8.243, 8.348], [8.361, 8.848], [9.151, 9.269], [9.282, 9.348], [9.361, 9.453], [9.466, 9.835], [9.848, 10.058], [10.07 }, {"kind": "s", "id": "s0_2_0", "md": "So before anyone touches production, somebody needs to __take charge__.", "zh": "所以在任何人动线上之前，得有一个人站出来扛指挥。", "sp": null, "gap": true, "start": 33.144, "end": 37.392, "words": [[33.249, 33.394], [33.407, 33.855], [33.868, 34.197], [34.21, 34.565], [34.578, 35.105], [35.486, 35.841], [35.855, 36.078], [36.091, 36.183], [36.197, 36.433], [36.447, 37.012]]}, {"kind": "s", "id": "s0_2_1", "md": "That person does not have to be the most senior engineer on the call.", "zh": "这个人不一定是会上资历最深的工程师。", "sp": null, "gap": false, "start": 37.392, "end": 41.256, "words": [[37.497, 37.655], [37.668, 38.063], [38.076, 38.247], [38.26, 38.51], [38.524, 38.76], [38.774, 38.866], [38.879, 39.01], [39.024, 39.116], [39.129, 39.418], [39.431, 39.839], [39.853, 40.3], [40.313, 40.405], [40.418, 40.497], [40.51, 40.879]]}, {"kind": "s", "id": "s0_2_2", "md": "They just need to ==claim== the role out loud and __stick with it__.", "zh": "他只需要大声把这个角色认下来，并且一直担到底。", "sp": null, "gap": false, "start": 41.256, "end": 44.592, "words": [[41.374, 41.44], [41.453, 41.638], [41.651, 41.769], [41.782, 41.848], [41.861, 42.164], [42.177, 42.282], [42.295, 42.611], [42.624, 42.795], [42.809, 43.217], [43.414, 43.519], [43.532, 43.822], [43.835, 44.019], [44.032, 44.203]]}, {"kind": "h", "id": "h1", "md": "2. What the Lead Says First", "zh": "2. 指挥第一句说什么", "start": 44.592, "end": 47.136, "words": [[44.71, 44.921], [45.381, 45.513], [45.526, 45.618], [45.631, 45.881], [45.895, 46.171], [46.184, 46.75]]}, {"kind": "s", "id": "s1_0_0", "md": "**The incident lead's first job is to make the situation visible, not to fix it.**", "zh": "故障指挥的第一件事是让局面透明，而不是去修。", "sp": null, "gap": false, "start": 47.136, "end": 52.44, "words": [[47.241, 47.347], [47.36, 47.846], [47.86, 48.123], [48.136, 48.583], [48.597, 49.004], [49.097, 49.202], [49.215, 49.307], [49.32, 49.597], [49.61, 49.702], [49.715, 50.452], [50.465, 50.939], [51.268, 51.425], [51.439, 51.518], [51.531, 51.86], [51.87 , "md": "Silence during an outage feels like chaos, even when the team is making progress.", "zh": "故障期间一沉默，大家就觉得一团乱，哪怕团队其实在推进。", "sp": null, "gap": false, "start": 94.392, "end": 100.08, "words": [[94.497, 94.984], [94.997, 95.313], [95.326, 95.445], [95.458, 95.839], [95.853, 96.195], [96.208, 96.405], [96.418, 97.103], [97.55, 97.76], [97.774, 97.905], [97.918, 98.01], [98.024, 98.471], [98.589, 98.681], [98.695, 98.971], [98.984, 99.695]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
