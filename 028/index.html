<script>
const D = {"id": "028", "title": "Reviewing a Proposal You Disagree With", "meta": "B2 · 约 280 词 · 场景：方案评审", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Make Their Case First", "heading_zh": "1. 先替对方把道理讲出来", "rows": [[{"id": "s0_0_0", "md": "You open the proposal, read the first page, and already know you don't like it.", "text": "You open the proposal, read the first page, and already know you don't like it.", "zh": "你打开这份提案，读完第一页，就已经知道自己不喜欢它了。", "sp": null}, {"id": "s0_0_1", "md": "That reaction might be real ==insight==, or it might just be ==bias== toward your own approach.", "text": "That reaction might be real insight, or it might just be bias toward your own approach.", "zh": "这种反应可能是真知灼见，也可能只是你偏爱自己那套做法。", "sp": null}, {"id": "s0_0_2", "md": "Before you write a single comment, try to __argue for__ the proposal.", "text": "Before you write a single comment, try to argue for the proposal.", "zh": "在写下任何一条评论之前，先试着替这份提案说话。", "sp": null}], [{"id": "s0_1_0", "md": "**If you cannot explain why a smart person would choose this, you are not ready to reject it.**", "text": "If you cannot explain why a smart person would choose this, you are not ready to reject it.", "zh": "如果你讲不出一个聪明人为什么会这么选，你就还没资格否掉它。", "sp": null}, {"id": "s0_1_1", "md": "Write a short summary of the author's goal and their strongest argument.", "text": "Write a short summary of the author's goal and their strongest argument.", "zh": "简短写下作者的目标，以及他们最有力的论据。", "sp": null}, {"id": "s0_1_2", "md": "Then share it: \"Here is my understanding; did I get it right?\"", "text": "Then share it: \"Here is my understanding; did I get it right?\"", "zh": "然后发出去：「这是我的理解，我理解得对吗？」", "sp": null}], [{"id": "s0_2_0", "md": "This step does two things.", "text": "This step does two things.", "zh": "这一步有两个作用。", "sp": null}, {"id": "s0_2_1", "md": "It catches ==misunderstandings== early, because many disagreements are really about different readings of the same page.", "text": "It catches misunderstandings early, because many disagreements are really about different readings of the same page.", "zh": "它能尽早发现误解，因为很多分歧其实只是对同一页内容的理解不同。", "sp": null}, {"id": "s0_2_2", "md": "It also shows the author you __took their work seriously__, which makes them more ==receptive== to what comes next.", "text": "It also shows the author you took their work seriously, which makes them more receptive to what comes next.", "zh": "它也让作者看到你认真对待了他们的工作，这样他们对你后面的意见会更听得进去。", "sp": null}]]}, {"heading": "2. Different Is Not Wrong", "heading_zh": "2. 不一样不等于错", "rows": [[{"id": "s1_0_0", "md": "Next, sort your concerns into two groups.", "text": "Next, sort your concerns into two groups.", "zh": "接下来，把你的顾虑分成两类。", "sp": null}, {"id": "s1_0_1", "md": "Some are ==preferences==: you would have picked another framework or named things differently.", "text": "Some are preferences: you would have picked another framework or named things differently.", "zh": "一类是个人偏好：你可能会选另一个框架，或者换种命名方式。", "sp": null}, {"id": "s1_0_2", "md": "Others are risks: the plan will miss the deadline, or it will lose data under load.", "text": "Others are risks: the plan will miss the deadline, or it will lose data under load.", "zh": "另一类是风险：这个方案会赶不上 deadline，或者高负载下会丢数据。", "sp": null}], [{"id": "s1_1_0", "md": "Only the second group should block the proposal.", "text": "Only the second group should block the proposal.", "zh": "只有第二类才应该卡住这份提案。", "sp": null}, {"id": "s1_1_1", "md": "Label the first group clearly, with something like \"personal preference, feel free to ignore.\"", "text": "Label the first group clearly, with something like \"personal preference, feel free to ignore.\"", "zh": "第一类要明确标出来，比如写一句「个人偏好，可以忽略」。", "sp": null}, {"id": "s1_1_2", "md": "**Reviewers who block on taste soon find that nobody asks them to review anything.**", "text": "Reviewers who block on taste soon find that nobody asks them to review anything.", "zh": "因为个人口味就卡别人的评审人，很快会发现没人再找他们 review 了。", "sp": null}], [{"id": "s1_2_0", "md": "For real risks, be concrete and ==proportionate==.", "text": "For real risks, be concrete and proportionate.", "zh": "对真正的风险，要说得具体，也要把握分寸。", "sp": null}, {"id": "s1_2_1", "md": "Explain the ==impact==, how likely it is, and what would reduce it.", "text": "Explain the impact, how likely it is, and what would reduce it.", "zh": "讲清楚影响有多大、发生的可能性有多高，以及怎么能降低它。", "sp": null}, {"id": "s1_2_2", "md": "A rare edge case does not deserve the same energy as a likely outage.", "text": "A rare edge case does not deserve the same energy as a likely outage.", "zh": "一个很少触发的边界情况，不值得花跟一个大概率故障同样的力气。", "sp": null}, {"id": "s1_2_3", "md": "If the author ==addresses== the risk in a way you would not have chosen, __let it go__.", "text": "If the author addresses the risk in a way you would not have chosen, let it go.", "zh": "如果作者用一种你不会选的方式解决了这个风险，那就随它去吧。", "sp": null}], [{"id": "s1_3_0", "md": "Your job is to make the proposal safe, not to turn it into yours.", "text": "Your job is to make the proposal safe, not to turn it into yours.", "zh": "你的任务是让提案变得安全，不是把它改成你的方案。", "sp": null}, {"id": "s1_3_1", "md": "Authors remember the reviewers who __made their ideas stronger__, and they come back to them.", "text": "Authors remember the reviewers who made their ideas stronger, and they come back to them.", "zh": "作者会记住那些让他们的想法变得更强的评审人，下次还会去找他们。", "sp": null}]]}], "gist": [{"q": "评审一个你不认同的方案，第一步应该做什么？", "a": "先替方案说话：写下作者的目标和最有力的论点，并问作者「我理解得对吗」。"}, {"q": "这一步有什么好处？", "a": "及早发现误解（很多分歧其实是对同一页的不同理解）；让作者感到被认真对待，更愿意听后面的意见。"}, {"q": "作者建议把顾虑分成哪两类？分别怎么处理？", "a": "个人偏好（标注清楚、可忽略，不阻塞）和真实风险（具体、成比例地说明影响、可能性和缓解办法，才可以阻塞）。"}], "dictation": [{"id": "s0_1_0", "text": "If you cannot explain why a smart person would choose this, you are not ready to reject it."}, {"id": "s1_1_2", "text": "Reviewers who block on taste soon find that nobody asks them to review anything."}, {"id": "s1_1_0", "text": "Only the second group should block the proposal."}, {"id": "s1_3_0", "text": "Your job is to make the proposal safe, not to turn it into yours."}], "shadow": {"text": "Next, sort your concerns into two groups. Some are preferences: you would have picked another framework or named things differently. Others are risks: the plan will miss the deadline, or it will lose data under load.", "marked": "Next, / sort your concerns / into <b>two</b> groups. //<br>Some are <b>preferences</b>: / you would have picked <b>another</b> framework / or named things <b>differently</b>. //<br>Others are <b>risks</b>: / the plan will <b>miss</b> the deadline, / or it will <b>lose data</b> under load. //"}, "prompts": [{"q": "另一个团队提议把服务从 Go 迁到 Java，你不认同。评审会上先用 30 秒复述对方方案的目标和最强论点，再确认理解是否正确。", "ref": "Before I share my concerns, let me check that I understand the proposal. The main goal is to put all backend services on one language, so engineers can move between teams and share libraries. The strongest argument, I think, is the hiring data: most of our new hires already know Java. Did I get that right? If so, my questions are really about the migration cost, not the direction.", "ref_zh": "在说我的顾虑之前，我先确认一下我对提案的理解。主要目标是把所有后端服务统一成一种语言，这样工程师可以在团队之间流动，也能共享库。我觉得最有力的论据是招聘数据：我们大部分新人本来就会 Java。我理解得对吗？如果对的话，我的问题其实是关于迁移成本的，而不是方向。", "id": "ref0"}, {"q": "你对一个方案有三条意见，其中两条只是个人偏好，一条是真实风险。用 30 秒把它们区分清楚地讲出来。", "ref": "I have three comments, but only one of them is blocking. The first two are just preferences: I'd name the topics differently, and I'd use a different retry library. Feel free to ignore both. The real concern is data loss. If the consumer crashes after reading a message but before writing to the database, that message is gone. I'd like to see that case handled before we approve.", "ref_zh": "我有三条评论，但只有一条是 blocking。前两条只是个人偏好：topic 我会换个命名，重试库我会用另一个。这两条都可以忽略。真正的顾虑是丢数据。如果 consumer 读到消息后、写数据库之前挂了，这条消息就没了。我希望在批准之前，把这种情况处理掉。", "id": "ref1"}], "words": [{"w": "insight", "ipa": "/ˈɪnsaɪt/", "zh": "洞察、深刻见解", "ex": "Her insight about cold starts changed the whole design.", "id": "w0"}, {"w": "bias", "ipa": "/ˈbaɪəs/", " const h = (tag, attrs = {}, ...kids) => {

function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
