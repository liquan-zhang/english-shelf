<script>
const D = {"id": "001", "title": "How to Speak Up in the First Five Minutes", "meta": "B2 · 约 280 词 · 场景：会议开场", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Cost of Waiting", "heading_zh": "1. 等待的代价", "rows": [[{"id": "s0_0_0", "md": "Most people wait for the right moment to speak in a meeting.", "text": "Most people wait for the right moment to speak in a meeting.", "zh": "大多数人开会时都在等一个合适的时机再发言。", "sp": null}, {"id": "s0_0_1", "md": "They ==hesitate==, polish a perfect point, and hold on to it.", "text": "They hesitate, polish a perfect point, and hold on to it.", "zh": "他们犹豫不决，把一个观点打磨得完美无缺，然后一直憋着。", "sp": null}, {"id": "s0_0_2", "md": "By the time they are ready, the discussion has already ==drifted== somewhere else.", "text": "By the time they are ready, the discussion has already drifted somewhere else.", "zh": "等他们准备好了，讨论早就跑到别的地方去了。", "sp": null}], [{"id": "s0_1_0", "md": "The first five minutes are different from the rest of the meeting.", "text": "The first five minutes are different from the rest of the meeting.", "zh": "会议的头五分钟和后面不一样。", "sp": null}, {"id": "s0_1_1", "md": "This is when the group ==settles== on what the problem actually is.", "text": "This is when the group settles on what the problem actually is.", "zh": "这几分钟里，大家会定下来问题到底是什么。", "sp": null}, {"id": "s0_1_2", "md": "If someone opens by saying the database is too slow, everyone spends the next hour __talking about__ databases.", "text": "If someone opens by saying the database is too slow, everyone spends the next hour talking about databases.", "zh": "如果有人一上来就说数据库太慢，那接下来一个小时大家都会围着数据库聊。", "sp": null}, {"id": "s0_1_3", "md": "**Whoever speaks first often decides what the meeting is about.**", "text": "Whoever speaks first often decides what the meeting is about.", "zh": "谁先开口，往往就决定了这个会聊什么。", "sp": null}], [{"id": "s0_2_0", "md": "Speaking early also takes pressure off you.", "text": "Speaking early also takes pressure off you.", "zh": "早点发言，对你自己也是减压。", "sp": null}, {"id": "s0_2_1", "md": "Once people have heard your voice, the second time __feels far less risky__.", "text": "Once people have heard your voice, the second time feels far less risky.", "zh": "大家听过你说话之后，第二次开口就没那么有压力了。", "sp": null}, {"id": "s0_2_2", "md": "Waiting does the opposite, because the longer you stay quiet, the higher the bar for your first sentence becomes.", "text": "Waiting does the opposite, because the longer you stay quiet, the higher the bar for your first sentence becomes.", "zh": "等待的效果正好相反，你沉默得越久，第一句话的门槛就越高。", "sp": null}]]}, {"heading": "2. What to Say When You Go First", "heading_zh": "2. 第一个开口时说什么", "rows": [[{"id": "s1_0_0", "md": "You do not need a brilliant insight to open.", "text": "You do not need a brilliant insight to open.", "zh": "开场不需要什么精辟的洞见。", "sp": null}, {"id": "s1_0_1", "md": "**You need a frame that helps everyone think.**", "text": "You need a frame that helps everyone think.", "zh": "你需要的是一个能帮大家理清思路的框架。", "sp": null}, {"id": "s1_0_2", "md": "Try __restating the goal__ in one sentence, such as \"So today we're deciding whether the migration ships this quarter.\"", "text": "Try restating the goal in one sentence, such as \"So today we're deciding whether the migration ships this quarter.\"", "zh": "可以试着用一句话重述目标，比如「所以今天我们要定的是，这个迁移这个季度能不能上线」。", "sp": null}], [{"id": "s1_1_0", "md": "Another option is to ==propose== the questions that matter.", "text": "Another option is to propose the questions that matter.", "zh": "另一个办法是把关键问题先摆出来。", "sp": null}, {"id": "s1_1_1", "md": "Say something like \"I think we need to settle two things, the cost and the timeline.\"", "text": "Say something like \"I think we need to settle two things, the cost and the timeline.\"", "zh": "比如说「我觉得我们得先定两件事：成本和时间线」。", "sp": null}, {"id": "s1_1_2", "md": "Now the discussion has a ==backbone==, and you are the one who built it.", "text": "Now the discussion has a backbone, and you are the one who built it.", "zh": "这样讨论就有了主心骨，而这个主心骨是你搭起来的。", "sp": null}], [{"id": "s1_2_0", "md": "If you already have a view, __put it on the table__ early, but keep it light.", "text": "If you already have a view, put it on the table early, but keep it light.", "zh": "如果你已经有自己的看法，可以早点抛出来，但语气要轻一点。", "sp": null}, {"id": "s1_2_1", "md": "\"My ==instinct== is to delay, but I'd like to hear the risks first\" invites pushback instead of ending the debate.", "text": "\"My instinct is to delay, but I'd like to hear the risks first\" invites pushback instead of ending the debate.", "zh": "「我的直觉是先缓一缓，但我想先听听大家看到的风险」，这样说是在邀请大家来挑战，而不是直接把讨论终结掉。", "sp": null}, {"id": "s1_2_2", "md": "It shows ==conviction== without closing the door.", "text": "It shows conviction without closing the door.", "zh": "既表明了态度，又没有把门关死。", "sp": null}], [{"id": "s1_3_0", "md": "Over time, people start to __look to you__ to set the direction.", "text": "Over time, people start to look to you to set the direction.", "zh": "时间长了，大家会开始指望你来定方向。", "sp": null}, {"id": "s1_3_1", "md": "That ==expectation== is a quiet form of influence, and it begins with one sentence in the first five minutes.", "text": "That expectation is a quiet form of influence, and it begins with one sentence in the first five minutes.", "zh": "这种期待本身就是一种不显山露水的影响力，而它就从头五分钟里的一句话开始。", "sp": null}]]}], "gist": [{"q": "作者认为会议的前五分钟为什么特别重要？", "a": "这是大家确定“问题到底是什么”的时候；谁先开口，往往就决定了会议讨论什么。"}, {"q": "一直等待完美时机再开口，会带来什么问题？", "a": "讨论早已跑到别处；而且越晚开口，第一句话的门槛越高、压力越大。"}, {"q": "抢先开口时可以说什么？", "a": "复述会议目标；提出需要解决的几个问题，给讨论搭骨架；轻描淡写地亮出自己的倾向，同时邀请反对意见。"}], "dictation": [{"id": "s0_1_3", "text": "Whoever speaks first often decides what the meeting is about."}, {"id": "s1_0_1", "text": "You need a frame that helps everyone think."}, {"id": "s0_2_2", "text": "Waiting does the opposite, because the longer you stay quiet, the higher the bar for your first sentence becomes."}, {"id": "s1_2_0", "text": "If you already have a view, put it on the table early, but keep it light."}], "shadow": {"text": "You do not need a brilliant insight to open. You need a frame that helps everyone think.", "marked": "You do <b>not</b> need a <b>brilliant</b> insight / to <b>open</b>. //<br>You need a <b>frame</b> / that helps <b>everyone</b> think. //"}, "prompts": [{"q": "周会刚开始，大家在闲聊。议题是“要不要推迟下个版本”。用 30 秒抢先开口：复述目标，并提出需要定的两个问题。", "ref": "Okay, maybe I can kick us off. As I understand it, today we're deciding whether the next release goes out on schedule or slips by a week. I think we need to settle two things. First, how serious are the open crash bugs? Second, what does a one-week delay cost the marketing team? If we answer those two, the decision should be easy.", "ref_zh": "好，要不我先起个头。我理解今天要定的是，下个版本是按时发，还是推迟一周。我觉得我们得先搞清楚两件事。第一，现在没修的那些崩溃 bug 到底有多严重？第二，推迟一周对市场团队有什么影响？这两个问题答清楚了，决定应该就很好做了。", "id": "ref0"}, {"q": "跨团队评审会上，对方准备讲方案。你倾向先做小范围试点。开场先亮出你的倾向，但留出讨论空间。", "ref": "Before we dive in, let me share where I'm starting from, so you know my bias. My instinct is to run a small pilot in one market before we commit to the full rollout. But I haven't seen all your data yet, so I'd really like to hear the risks you see. If the numbers say a pilot is a waste of time, I'm happy to change my mind.", "ref_zh": "在开始之前，我先说一下我的出发点，让大家知道我的倾向。我的直觉是先在一个市场小范围试点，再决定要不要全量铺开。不过你们的数据我还没全看过，所以很想听听你们看到的风险。如果数据说明试点纯属浪费时间，我很乐意改主意。", "id": "ref1"}], "words": [{"w": "hesitate", "ipa": "/ˈhezɪˌteɪt/", "zh": "犹豫", "ex": "Don't hesitate to ping me if the deploy gets stuck.", "id": "w0"}, {"w": "drift (v.)", "ipa": "/drɪft/", "zh": "（话题）偏离、漂移", "ex": "The review drifted into a debate about naming conventions.", "tts_w": "drift", "id": "w1"}, {"w": "settle on", "ipa": "/ˈsetl ɑːn/", "zh": "确定、选定", "ex": "We finally settled on a weekly release cadence.", "id": "w2"}, {"w": "propose", "ipa": "/prəˈpoʊz/", "zh": "提议", "ex": "I propose we freeze new features until the outage report is done.", "id": "w3"}, {"w": "backbone", "ipa": "/ˈbækboʊn/", "zh": "骨架、主干", "ex": "This checklist is the backbone of our launch process.", "id": "w4"}, {"w": "instinct", "ipa": const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;

  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
