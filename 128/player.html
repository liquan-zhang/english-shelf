<script>
const D = {"id": "128", "type": "dialogue", "title": "Setting Up Internet and Utilities", "meta": "B2 · 约 310 词 · 场景：开通宽带与安装爽约", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Customer Service", "name_zh": "客服", "voice": "en-GB-RyanNeural"}}, "gist": [{"q": "「你」最后选了什么套餐？合约条件是什么？", "a": "千兆宽带，每月四十五块，合约二十四个月，免安装费、送路由器；提前解约有逐月递减的违约费。"}, {"q": "安装那天出了什么问题？客服怎么解释？", "a": "师傅到一点半都没来；客服说记录显示师傅进不了楼，可能被楼下保安拦了。"}, {"q": "客服给出了哪些补救措施？", "a": "改约到明天上午第一个时段，免第一个月月费，把手机号加到工单并提前在保安处登记，再发一封确认邮件。"}], "dictation": [{"id": "s0_3_0", "text": "What's the difference in practice? We mostly stream videos, and I work from home sometimes."}, {"id": "s0_7_0", "text": "What happens if I need to cancel early? We might move overseas next year."}, {"id": "s1_4_0", "text": "I took the morning off for this. What can you do to make it right?"}, {"id": "s1_8_0", "text": "Thanks. And could you put that in writing? An email would be fine."}], "shadow": {"speaker": "A", "text": "Hi, I had an installation booked for this morning, nine to one. It's now half past one, and nobody's turned up.", "marked": "Hi, / I had an <b>installation</b> booked / for this <b>morning</b>, / <b>nine</b> to <b>one</b>. //<br>It's now <b>half past one</b>, / and <b>nobody's</b> turned up. //"}, "prompts": [{"q": "你打电话给电力公司开户。说明搬家日期、地址类型，问需要什么材料、押金多少、多久能开通。", "ref": "Hi, I'm moving into a condo next Monday, and I'd like to open a new electricity and water account. What documents do I need? I have my passport, employment pass, and the tenancy agreement. Is there a deposit for foreigners, and roughly how much is it? And will the power be on by the time I move in?", "ref_zh": "你好，我下周一搬进一个公寓，想开新的水电账户。需要什么材料？我有护照、工作准证和租房合同。外国人需要交押金吗，大概多少？我入住的时候电能通上吗？", "id": "ref0"}, {"q": "宽带装好后晚上经常断网。打电话投诉，说明情况，并要求上门检查或换路由器。", "ref": "Hi, my broadband was installed last week, but it keeps dropping in the evenings, usually between eight and eleven. I've already restarted the router several times, and it doesn't help. I work from home, so this is a real problem. Could you send a technician to check the line, or replace the router?", "ref_zh": "你好，我的宽带上周刚装好，但晚上老是断，一般在八点到十一点之间。我已经重启路由器好几次了，没用。我在家办公，这真的很影响。能派师傅来检查线路，或者换个路由器吗？", "id": "ref1"}], "words": [{"w": "broadband", "ipa": "/ˈbrɔːdbænd/", "zh": "宽带", "ex": "Our broadband is much faster since we upgraded.", "id": "w0"}, {"w": "contract", "ipa": "/ˈkɑːntrækt/", "zh": "合约，合同", "ex": "My phone contract ends in June.", "id": "w1"}, {"w": "installation fee", "ipa": "/ˌɪnstəˈleɪʃən fiː/", "zh": "安装费", "ex": "They waived the installation fee for new customers.", "id": "w2"}, {"w": "router", "ipa": "/ˈraʊtər/", "zh": "路由器", "ex": "Try moving the router to the middle of the flat.", "id": "w3"}, {"w": "cancel", "ipa": "/ˈkænsəl/", "zh": "取消，解约", "ex": "I'd like to cancel my gym membership.", "id": "w4"}, {"w": "access", "ipa": "/ˈækses/", "zh": "进入（的权限）", "ex": "Visitors need a card to get access to the lift.", "id": "w5"}, {"w": "security guard", "ipa": "/sɪˈkjʊrəti ɡɑːrd/", "zh": "保安", "ex": "Leave the parcel with the security guard at the gate.", "id": "w6"}, {"w": "waive", "ipa": "/weɪv/", "zh": "免除（费用）", "ex": "The bank agreed to waive the late fee this time.", "id": "w7"}, {"w": "confirmation", "ipa": "/ˌkɑːnfərˈmeɪʃən/", "zh": "确认（函）", "ex": "I haven't received a confirmation email yet.", "id": "w8"}, {"w": "sign up for", "ipa": "/saɪn ʌp fɔːr/", "zh": "报名，办理开通", "ex": "We signed up for swimming classes for our son.", "id": "w9"}], "sections": [{"heading": "1. Choosing a Plan", "heading_zh": "1. 选套餐", "rows": [[{"id": "s0_0_0", "md": "Thanks for calling. My name's Oliver. How can I help you today?", "text": "Thanks for calling. My name's Oliver. How can I help you today?", "zh": "感谢来电，我是奥利弗。今天有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, I've just moved into a new flat, and I'd like to __sign up for__ home ==broadband==.", "text": "Hi, I've just moved into a new flat, and I'd like to sign up for home broadband.", "zh": "你好，我刚搬进新房子，想办家庭宽带。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. We have a one gig plan at forty-five dollars a month, or two gig at fifty-five.", "text": "Sure. We have a one gig plan at forty-five dollars a month, or two gig at fifty-five.", "zh": "好的。我们有千兆套餐每月四十五块，两千兆每月五十五块。", "sp": "B"}], [{"id": "s0_3_0", "md": "**What's the difference in practice? We mostly stream videos, and I work from home sometimes.**", "text": "What's the difference in practice? We mostly stream videos, and I work from home sometimes.", "zh": "实际用起来有什么区别？我们主要看视频，我偶尔在家办公。", "sp": "A"}], [{"id": "s0_4_0", "md": "Honestly, one gig is plenty for a family. Two gig only matters if lots of devices are downloading at once.", "text": "Honestly, one gig is plenty for a family. Two gig only matters if lots of devices are downloading at once.", "zh": "说实话，一个家庭千兆完全够用。只有很多设备同时下载时，两千兆才有意义。", "sp": "B"}], [{"id": "s0_5_0", "md": "Okay, one gig then. How long is the ==contract==, and is there an ==installation fee==?", "text": "Okay, one gig then. How long is the contract, and is there an installation fee?", "zh": "好，那就千兆。合约多长？有安装费吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "It's a twenty-four month contract. Installation is free, and the ==router== is included.", "text": "It's a twenty-four month contract. Installation is free, and the router is included.", "zh": "合约二十四个月。安装免费，送路由器。", "sp": "B"}], [{"id": "s0_7_0", "md": "What happens if I need to ==cancel== early? We might move overseas next year.", "text": "What happens if I need to cancel early? We might move overseas next year.", "zh": "如果要提前解约怎么办？我们明年可能搬去国外。", "sp": "A"}], [{"id": "s0_8_0", "md": "There's an early termination charge, but it goes down every month. I'll email you the details.", "text": "There's an early termination charge, but it goes down every month. I'll email you the details.", "zh": "会有提前解约费，但每个月递减。我把详情发到您邮箱。", "sp": "B"}], [{"id": "s0_9_0", "md": "**That's fine. When's the earliest you can send someone to install it?**", "text": "That's fine. When's the earliest you can send someone to install it?", "zh": "可以。最早什么时候能派人来安装？", "sp": "A"}], [{"id": "s0_10_0", "md": "This Saturday, between nine and one. Someone will need to be home.", "text": "This Saturday, between nine and one. Someone will need to be home.", "zh": "这周六，九点到一点之间。家里需要有人。", "sp": "B"}]]}, {"heading": "2. The Technician Doesn't Show Up", "heading_zh": "2. 师傅没来", "rows": [[{"id": "s1_0_0", "md": "Hi, I had an installation booked for this morning, nine to one. It's now half past one, and __nobody's turned up__.", "text": "Hi, I had an installation booked for this morning, nine to one. It's now half past one, and nobody's turned up.", "zh": "你好，我约了今天上午九点到一点安装。现在已经一点半了，一个人都没来。", "sp": "A"}], [{"id": "s1_1_0", "md": "I'm really sorry about that. Let me check. It says the technician couldn't get ==access== to the building.", "text": "I'm really sorry about that. Let me check. It says the technician couldn't get access to the building.", "zh": "非常抱歉。我查一下。记录上说师傅进不了楼。", "sp": "B"}], [{"id": "s1_2_0", "md": "That's strange. I was home all morning, and nobody called me.", "text": "That's strange. I was home all morning, and nobody called me.", "zh": "奇怪了。我整个上午都在家，也没人给我打电话。", "sp": "A"}], [{"id": "s1_3_0", "md": "He may have been stopped by the ==security guard== downstairs. I do apologise.", "text": "He may have been stopped by the security guard downstairs. I do apologise.", "zh": "他可能被楼下保安拦住了。真的很抱歉。", "sp": "B"}], [{"id": "s1_4_0", "md": "**I took the morning off for this. What can you do to make it right?**", "text": "I took the morning off for this. What can you do to make it right?", "zh": "我为这事请了一上午假。你们打算怎么补救？", "sp": "A"}], [{"id": "s1_5_0", "md": "I can rebook you for the first slot tomorrow morning and ==waive== your first month's fee.", "text": "I can rebook you for the first slot tomorrow morning and waive your first month's fee.", "zh": "我可以帮您改约到明天上午第一个时段，并免掉第一个月的月费。" const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
