<script>
const D = {"id": "128", "type": "dialogue", "title": "Setting Up Internet and Utilities", "meta": "B2 · 约 310 词 · 场景：开通宽带与安装爽约", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Customer Service", "name_zh": "客服", "voice": "en-GB-RyanNeural"}}, "gist": [{"q": "「你」最后选了什么套餐？合约条件是什么？", "a": "千兆宽带，每月四十五块，合约二十四个月，免安装费、送路由器；提前解约有逐月递减的违约费。"}, {"q": "安装那天出了什么问题？客服怎么解释？", "a": "师傅到一点半都没来；客服说记录显示师傅进不了楼，可能被楼下保安拦了。"}, {"q": "客服给出了哪些补救措施？", "a": "改约到明天上午第一个时段，免第一个月月费，把手机号加到工单并提前在保安处登记，再发一封确认邮件。"}], "dictation": [{"id": "s0_3_0", "text": "What's the difference in practice? We mostly stream videos, and I work from home sometimes."}, {"id": "s0_7_0", "text": "What happens if I need to cancel early? We might move overseas next year."}, {"id": "s1_4_0", "text": "I took the morning off for this. What can you do to make it right?"}, {"id": "s1_8_0", "text": "Thanks. And could you put that in writing? An email would be fine."}], "shadow": {"speaker": "A", "text": "Hi, I had an installation booked for this morning, nine to one. It's now half past one, and nobody's turned up.", "marked": "Hi, / I had an <b>installation</b> booked / for this <b>morning</b>, / <b>nine</b> to <b>one</b>. //<br>It's now <b>half past one</b>, / and <b>nobody's</b> turned up. //"}, "prompts": [{"q": "你打电话给电力公司开户。说明搬家日期、地址类型，问需要什么材料、押金多少、多久能开通。", "ref": "Hi, I'm moving into a condo next Monday, and I'd like to open a new electricity and water account. What documents do I need? I have my passport, employment pass, and the tenancy agreement. Is there a deposit for foreigners, and roughly how much is it? And will the power be on by the time I move in?", "ref_zh": "你好，我下周一搬进一个公寓，想开新的水电账户。需要什么材料？我有护照、工作准证和租房合同。外国人需要交押金吗，大概多少？我入住的时候电能通上吗？", "id": "ref0"}, {"q": "宽带装好后晚上经常断网。打电话投诉，说明情况，并要求上门检查或换路由器。", "ref": "Hi, my broadband was installed last week, but it keeps dropping in the evenings, usually between eight and eleven. I've already restarted the router several times, and it doesn't help. I work from home, so this is a real problem. Could you send a technician to check the line, or replace the router?", "ref_zh": "你好，我的宽带上周刚装好，但晚上老是断，一般在八点到十一点之间。我已经重启路由器好几次了，没用。我在家办公，这真的很影响。能派师傅来检查线路，或者换个路由器吗？", "id": "ref1"}], "words": [{"w": "broadband", "ipa": "/ˈbrɔːdbænd/", "zh": "宽带", "ex": "Our broadband is much faster since we upgraded.", "id": "w0"}, {"w": "contract", "ipa": "/ˈkɑːntrækt/", "zh": "合约，合同", "ex": "My phone contract ends in June.", "id": "w1"}, {"w": "installation fee", "ipa": "/ˌɪnstəˈleɪʃən fiː/", "zh": "安装费", "ex": "They waived the installation fee for new customers.", "id": "w2"}, {"w": "router", "ipa": "/ˈraʊtər/", "zh": "路由器", "ex": "Try moving the router to the middle of the flat.", "id": "w3"}, {"w": "cancel", "ipa": "/ˈkænsəl/", "zh": "取消，解约", "ex": "I'd like to cancel my gym membership.", "id": "w4"}, {"w": "access", "ipa": "/ˈækses/", "zh": "进入（的权限）", "ex": "Visitors need a card to get access to the lift.", "id": "w5"}, {"w": "security guard", "ipa": "/sɪˈkjʊrəti ɡɑːrd/", "zh": "保安", "ex": "Leave the parcel with the security guard at the gate.", "id": "w6"}, {"w": "waive", "ipa": "/weɪv/", "zh": "免除（费用）", "ex": "The bank agreed to waive the late fee this time.", "id": "w7"}, {"w": "confirmation", "ipa": "/ˌkɑːnfərˈmeɪʃən/", "zh": "确认（函）", "ex": "I haven't received a confirmation email yet.", "id": "w8"}, {"w": "sign up for", "ipa": "/saɪn ʌp fɔːr/", "zh": "报名，办理开通", "ex": "We signed up for swimming classes for our son.", "id": "w9"}], "sections": [{"heading": "1. Choosing a Plan", "heading_zh": "1. 选套餐", "rows": [[{"id": "s0_0_0", "md": "Thanks for calling. My name's Oliver. How can I help you today?", "text": "Thanks for calling. My name's Oliver. How can I help you today?", "zh": "感谢来电，我是奥利弗。今天有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, I've just moved into a new flat, and I'd like to __sign up for__ home ==broadband==.", "text": "Hi, I've just moved into a new flat, and I'd like to sign up for home broadband.", "zh": "你好，我刚搬进新房子，想办家庭宽带。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. We have a one gig plan at forty-five dollars a month, or two gig at fifty-five.", "text": "Sure. We have a one gig plan at forty-five dollars a month, or two gig at fifty-five.", "zh": "好的。我们有千兆套餐每月四十五块，两千兆每月五十五块。", "sp": "B"}], [{"id": "s0_3_0", "md": "**What's the difference in practice? We mostly stream videos, and I work from home sometimes.**", "text": "What's the difference in practice? We mostly stream videos, and I work from home sometimes.", "zh": "实际用起来有什么区别？我们主要看视频，我偶尔在家办公。", "sp": "A"}], [{"id": "s0_4_0", "md": "Honestly, one gig is plenty for a family. Two gig only matters if lots of devices are downloading at once.", "text": "Honestly, one gig is plenty for a family. Two gig only matters if lots of devices are downloading at once.", "zh": "说实话，一个家庭千兆完全够用。只有很多设备同时下载时，两千兆才有意义。", "sp": "B"}], [{"id": "s0_5_0", "md": "Okay, one gig then. How long is the ==contract==, and is there an ==installation fee==?", "text": "Okay, one gig then. How long is the contract, and is there an installation fee?", "zh": "好，那就千兆。合约多长？有安装费吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "It's a twenty-four month contract. Installation is free, and the ==router== is included.", "text": "It's a twenty-four month contract. Installation is free, and the router is included.", "zh": "合约二十四个月。安装免费，送路由器。", "sp": "B"}], [{"id": "s0_7_0", "md": "What happens if I need to ==cancel== early? We might move overseas next year.", "text": "What happens if I need to cancel early? We might move overseas next year.", "zh": "如果要提前解约怎么办？我们明年可能搬去国外。", "sp": "A"}], [{"id": "s0_8_0", "md": "There's an early termination charge, but it goes down every month. I'll email you the details.", "text": "There's an early termination charge, but it goes down every month. I'll email you the details.", "zh": "会有提前解约费，但每个月递减。我把详情发到您邮箱。", "sp": "B"}], [{"id": "s0_9_0", "md": "**That's fine. When's the earliest you can send someone to install it?**", "text": "That's fine. When's the earliest you can send someone to install it?", "zh": "可以。最早什么时候能派人来安装？", "sp": "A"}], [{"id": "s0_10_0", "md": "This Saturday, between nine and one. Someone will need to be home.", "text": "This Saturday, between nine and one. Someone will need to be home.", "zh": "这周六，九点到一点之间。家里需要有人。", "sp": "B"}]]}, {"heading": "2. The Technician Doesn't Show Up", "heading_zh": "2. 师傅没来", "rows": [[{"id": "s1_0_0", "md": "Hi, I had an installation booked for this morning, nine to one. It's now half past one, and __nobody's turned up__.", "text": "Hi, I had an installation booked for this morning, nine to one. It's now half past one, and nobody's turned up.", "zh": "你好，我约了今天上午九点到一点安装。现在已经一点半了，一个人都没来。", "sp": "A"}], [{"id": "s1_1_0", "md": "I'm really sorry about that. Let me check. It says the technician couldn't get ==access== to the building.", "text": "I'm really sorry about that. Let me check. It says the technician couldn't get access to the building.", "zh": "非常抱歉。我查一下。记录上说师傅进不了楼。", "sp": "B"}], [{"id": "s1_2_0", "md": "That's strange. I was home all morning, and nobody called me.", "text": "That's strange. I was home all morning, and nobody called me.", "zh": "奇怪了。我整个上午都在家，也没人给我打电话。", "sp": "A"}], [{"id": "s1_3_0", "md": "He may have been stopped by the ==security guard== downstairs. I do apologise.", "text": "He may have been stopped by the security guard downstairs. I do apologise.", "zh": "他可能被楼下保安拦住了。真的很抱歉。", "sp": "B"}], [{"id": "s1_4_0", "md": "**I took the morning off for this. What can you do to make it right?**", "text": "I took the morning off for this. What can you do to make it right?", "zh": "我为这事请了一上午假。你们打算怎么补救？", "sp": "A"}], [{"id": "s1_5_0", "md": "I can rebook you for the first slot tomorrow morning and ==waive== your first month's fee.", "text": "I can rebook you for the first slot tomorrow morning and waive your first month's fee.", "zh": "我可以帮您改约到明天上午第一个时段，并免掉第一个月的月费。" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
