<script>
const D = {"id": "148", "type": "dialogue", "title": "Reporting a Lost Item", "meta": "B2 · 约 280 词 · 场景：地铁站报失钱包", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Station Staff", "name_zh": "车站工作人员", "voice": "en-GB-RyanNeural"}}, "gist": [{"q": "「你」把钱包落在哪里了？钱包长什么样，里面有什么？", "a": "落在环线往港湾方向的地铁上；黑色真皮对折钱包，四角磨旧，里面有工作准证、两张银行卡和大约八十块现金。"}, {"q": "工作人员找回钱包时说了什么情况？", "a": "有人在港湾站交了钱包，卡和准证都在，但现金没了。"}, {"q": "去领钱包要带什么？太太能不能代领？", "a": "带护照和报失编号；太太代领需要「你」签字的授权书和护照复印件，所以「你」决定下班自己去。"}], "dictation": [{"id": "s0_0_0", "text": "Excuse me. I think I left my wallet on the train about twenty minutes ago."}, {"id": "s0_6_0", "text": "My employment pass, two bank cards, and about eighty dollars in cash."}, {"id": "s1_5_0", "text": "Do I need to bring anything? My ID was actually in the wallet."}, {"id": "s1_7_0", "text": "Perfect. Is it okay if my wife picks it up instead? I'm stuck at work."}], "shadow": {"speaker": "A", "text": "The Circle Line, heading towards HarbourFront. I got off here at Buona Vista.", "marked": "The <b>Circle</b> Line, / heading towards <b>HarbourFront</b>. //<br>I got off <b>here</b> / at Buona <b>Vista</b>. //"}, "prompts": [{"q": "你在出租车上落下了孩子的水壶和外套，打电话给出租车公司。说清乘车时间、路线和物品特征，并留下联系方式。", "ref": "Hi, I took one of your taxis this afternoon, around three, from Holland Village to Novena. I think I left a bag in the back seat. It's a small blue backpack with a kid's water bottle and a grey jacket inside. I paid by card, if that helps you find the driver. My number is nine one two three, four five six seven.", "ref_zh": "你好，我今天下午三点左右坐了你们的出租车，从荷兰村到诺维娜。我好像把一个包落在后座了。是个蓝色小背包，里面有一个儿童水壶和一件灰色外套。我是刷卡付的，也许能帮你们找到司机。我的电话是九一二三，四五六七。", "id": "ref0"}, {"q": "你在商场丢了手机，去客服台求助。说清最后在哪里用过、手机的样子，问他们会怎么处理。", "ref": "Hi, I think I lost my phone somewhere in the mall. The last time I used it was at the coffee shop on the second floor, maybe half an hour ago. It's a black phone in a clear case with a sticker of a cartoon dog on the back. Has anyone handed one in? If not, could you take my details and call me if it turns up?", "ref_zh": "你好，我好像在商场里把手机弄丢了。最后一次用是在二楼的咖啡店，大概半小时前。是一部黑色手机，透明壳，背面贴了一只卡通小狗贴纸。有人交过来吗？如果没有，能留下我的联系方式，找到了打给我吗？", "id": "ref1"}], "words": [{"w": "describe", "ipa": "/dɪˈskraɪb/", "zh": "描述", "ex": "Can you describe the man who took your bag?", "id": "w0"}, {"w": "bifold", "ipa": "/ˈbaɪfoʊld/", "zh": "对折式钱包", "ex": "I prefer a slim bifold to a big wallet.", "id": "w1"}, {"w": "cancel", "ipa": "/ˈkænsəl/", "zh": "注销，挂失（卡）", "ex": "I called the bank to cancel my credit card.", "id": "w2"}, {"w": "contact number", "ipa": "/ˈkɑːntækt ˈnʌmbər/", "zh": "联系电话", "ex": "Please leave a contact number at the front desk.", "id": "w3"}, {"w": "reference number", "ipa": "/ˈrefrəns ˈnʌmbər/", "zh": "编号，参考号", "ex": "Quote your reference number when you call back.", "id": "w4"}, {"w": "nightmare", "ipa": "/ˈnaɪtmer/", "zh": "噩梦；极其麻烦的事", "ex": "Getting a new passport abroad is a nightmare.", "id": "w5"}, {"w": "collect", "ipa": "/kəˈlekt/", "zh": "领取", "ex": "You can collect your parcel from the locker downstairs.", "id": "w6"}, {"w": "control station", "ipa": "/kənˈtroʊl ˈsteɪʃən/", "zh": "（新加坡地铁站）服务中心", "ex": "Ask at the control station if you need help with your card.", "id": "w7"}, {"w": "authorisation", "ipa": "/ˌɔːθərəˈzeɪʃən/", "zh": "授权（书）", "ex": "You need written authorisation to collect someone else's mail.", "id": "w8"}], "sections": [{"heading": "1. At the Station Counter", "heading_zh": "1. 在车站服务台", "rows": [[{"id": "s0_0_0", "md": "**Excuse me. I think I left my wallet on the train about twenty minutes ago.**", "text": "Excuse me. I think I left my wallet on the train about twenty minutes ago.", "zh": "不好意思。我好像二十分钟前把钱包落在地铁上了。", "sp": "A"}], [{"id": "s0_1_0", "md": "Oh dear. Which line were you on, and which direction?", "text": "Oh dear. Which line were you on, and which direction?", "zh": "哎呀。您坐的是哪条线，往哪个方向？", "sp": "B"}], [{"id": "s0_2_0", "md": "The Circle Line, heading towards HarbourFront. I got off here at Buona Vista.", "text": "The Circle Line, heading towards HarbourFront. I got off here at Buona Vista.", "zh": "环线，往港湾方向。我在这里波那维斯达站下的车。", "sp": "A"}], [{"id": "s0_3_0", "md": "Right. Can you ==describe== the wallet for me?", "text": "Right. Can you describe the wallet for me?", "zh": "好的。能描述一下钱包的样子吗？", "sp": "B"}], [{"id": "s0_4_0", "md": "It's a black leather ==bifold==, quite worn at the corners.", "text": "It's a black leather bifold, quite worn at the corners.", "zh": "是个黑色真皮对折钱包，四个角磨得挺旧的。", "sp": "A"}], [{"id": "s0_5_0", "md": "And what was inside?", "text": "And what was inside?", "zh": "里面有什么？", "sp": "B"}], [{"id": "s0_6_0", "md": "My employment pass, two bank cards, and about eighty dollars in cash.", "text": "My employment pass, two bank cards, and about eighty dollars in cash.", "zh": "我的工作准证、两张银行卡，还有大概八十块现金。", "sp": "A"}], [{"id": "s0_7_0", "md": "Have you ==cancelled== your bank cards yet?", "text": "Have you cancelled your bank cards yet?", "zh": "银行卡您挂失了吗？", "sp": "B"}], [{"id": "s0_8_0", "md": "Not yet. __I'll do that__ right after this.", "text": "Not yet. I'll do that right after this.", "zh": "还没有。这边弄完我马上就去办。", "sp": "A"}], [{"id": "s0_9_0", "md": "Good idea. I'll file a report and alert the other stations. Can I have your name and ==contact== number?", "text": "Good idea. I'll file a report and alert the other stations. Can I have your name and contact number?", "zh": "好的。我来登记报失，并通知沿线其他车站。能留一下您的姓名和联系电话吗？", "sp": "B"}], [{"id": "s0_10_0", "md": "Lee Wei, and my number is nine eight seven six, five four three two. __Feel free to__ call anytime.", "text": "Lee Wei, and my number is nine eight seven six, five four three two. Feel free to call anytime.", "zh": "李伟，电话是九八七六，五四三二。随时可以打给我。", "sp": "A"}], [{"id": "s0_11_0", "md": "Thanks. Here's your ==reference== number. If it turns up, we'll give you a call.", "text": "Thanks. Here's your reference number. If it turns up, we'll give you a ca const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
