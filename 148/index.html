const D = {"id": "148", "type": "dialogue", "title": "Reporting a Lost Item", "meta": "B2 · 约 280 词 · 场景：地铁站报失钱包", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Station Staff", "name_zh": "车站工作人员", "voice": "en-GB-RyanNeural"}}, "gist": [{"q": "「你」把钱包落在哪里了？钱包长什么样，里面有什么？", "a": "落在环线往港湾方向的地铁上；黑色真皮对折钱包，四角磨旧，里面有工作准证、两张银行卡和大约八十块现金。"}, {"q": "工作人员找回钱包时说了什么情况？", "a": "有人在港湾站交了钱包，卡和准证都在，但现金没了。"}, {"q": "去领钱包要带什么？太太能不能代领？", "a": "带护照和报失编号；太太代领需要「你」签字的授权书和护照复印件，所以「你」决定下班自己去。"}], "dictation": [{"id": "s0_0_0", "text": "Excuse me. I think I left my wallet on the train about twenty minutes ago."}, {"id": "s0_6_0", "text": "My employment pass, two bank cards, and about eighty dollars in cash."}, {"id": "s1_5_0", "text": "Do I need to bring anything? My ID was actually in the wallet."}, {"id": "s1_7_0", "text": "Perfect. Is it okay if my wife picks it up instead? I'm stuck at work."}], "shadow": {"speaker": "A", "text": "The Circle Line, heading towards HarbourFront. I got off here at Buona Vista.", "marked": "The <b>Circle</b> Line, / heading towards <b>HarbourFront</b>. //<br>I got off <b>here</b> / at Buona <b>Vista</b>. //"}, "prompts": [{"q": "你在出租车上落下了孩子的水壶和外套，打电话给出租车公司。说清乘车时间、路线和物品特征，并留下联系方式。", "ref": "Hi, I took one of your taxis this afternoon, around three, from Holland Village to Novena. I think I left a bag in the back seat. It's a small blue backpack with a kid's water bottle and a grey jacket inside. I paid by card, if that helps you find the driver. My number is nine one two three, four five six seven.", "ref_zh": "你好，我今天下午三点左右坐了你们的出租车，从荷兰村到诺维娜。我好像把一个包落在后座了。是个蓝色小背包，里面有一个儿童水壶和一件灰色外套。我是刷卡付的，也许能帮你们找到司机。我的电话是九一二三，四五六七。", "id": "ref0"}, {"q": "你在商场丢了手机，去客服台求助。说清最后在哪里用过、手机的样子，问他们会怎么处理。", "ref": "Hi, I think I lost my phone somewhere in the mall. The last time I used it was at the coffee shop on the second floor, maybe half an hour ago. It's a black phone in a clear case with a sticker of a cartoon dog on the back. Has anyone handed one in? If not, could you take my details and call me if it turns up?", "ref_zh": "你好，我好像在商场里把手机弄丢了。最后一次用是在二楼的咖啡店，大概半小时前。是一部黑色手机，透明壳，背面贴了一只卡通小狗贴纸。有人交过来吗？如果没有，能留下我的联系方式，找到了打给我吗？", "id": "ref1"}], "words": [{"w": "describe", "ipa": "/dɪˈskraɪb/", "zh": "描述", "ex": "Can you describe the man who took your bag?", "id": "w0"}, {"w": "bifold", "ipa": "/ˈbaɪfoʊld/", "zh": "对折式钱包", "ex": "I prefer a slim bifold to a big wallet.", "id": "w1"}, {"w": "cancel", "ipa": "/ˈkænsəl/", "zh": "注销，挂失（卡）", "ex": "I called the bank to cancel my credit card.", "id": "w2"}, {"w": "contact number", "ipa": "/ˈkɑːntækt ˈnʌmbər/", "zh": "联系电话", "ex": "Please leave a contact number at the front desk.", "id": "w3"}, {"w": "reference number", "ipa": "/ˈrefrəns ˈnʌmbər/", "zh": "编号，参考号", "ex": "Quote your reference number when you call back.", "id": "w4"}, {"w": "nightmare", "ipa": "/ˈnaɪtmer/", "zh": "噩梦；极其麻烦的事", "ex": "Getting a new passport abroad is a nightmare.", "id": "w5"}, {"w": "collect", "ipa": "/kəˈlekt/", "zh": "领取", "ex": "You can collect your parcel from the locker downstairs.", "id": "w6"}, {"w": "control station", "ipa": "/kənˈtroʊl ˈsteɪʃən/", "zh": "（新加坡地铁站）服务中心", "ex": "Ask at the control station if you need help with your card.", "id": "w7"}, {"w": "authorisation", "ipa": "/ˌɔːθərəˈzeɪʃən/", "zh": "授权（书）", "ex": "You need written authorisation to collect someone else's mail.", "id": "w8"}], "sections": [{"heading": "1. At the Station Counter", "heading_zh": "1. 在车站服务台", "rows": [[{"id": "s0_0_0", "md": "**Excuse me. I think I left my wallet on the train about twenty minutes ago.**", "text": "Excuse me. I think I left my wallet on the train about twenty minutes ago.", "zh": "不好意思。我好像二十分钟前把钱包落在地铁上了。", "sp": "A"}], [{"id": "s0_1_0", "md": "Oh dear. Which line were you on, and which direction?", "text": "Oh dear. Which line were you on, and which direction?", "zh": "哎呀。您坐的是哪条线，往哪个方向？", "sp": "B"}], [{"id": "s0_2_0", "md": "The Circle Line, heading towards HarbourFront. I got off here at Buona Vista.", "text": "The Circle Line, heading towards HarbourFront. I got off here at Buona Vista.", "zh": "环线，往港湾方向。我在这里波那维斯达站下的车。", "sp": "A"}], [{"id": "s0_3_0", "md": "Right. Can you ==describe== the wallet for me?", "text": "Right. Can you describe the wallet for me?", "zh": "好的。能描述一下钱包的样子吗？", "sp": "B"}], [{"id": "s0_4_0", "md": "It's a black leather ==bifold==, quite worn at the corners.", "text": "It's a black leather bifold, quite worn at the corners.", "zh": "是个黑色真皮对折钱包，四个角磨得挺旧的。", "sp": "A"}], [{"id": "s0_5_0", "md": "And what was inside?", "text": "And what was inside?", "zh": "里面有什么？", "sp": "B"}], [{"id": "s0_6_0", "md": "My employment pass, two bank cards, and about eighty dollars in cash.", "text": "My employment pass, two bank cards, and about eighty dollars in cash.", "zh": "我的工作准证、两张银行卡，还有大概八十块现金。", "sp": "A"}], [{"id": "s0_7_0", "md": "Have you ==cancelled== your bank cards yet?", "text": "Have you cancelled your bank cards yet?", "zh": "银行卡您挂失了吗？", "sp": "B"}], [{"id": "s0_8_0", "md": "Not yet. __I'll do that__ right after this.", "text": "Not yet. I'll do that right after this.", "zh": "还没有。这边弄完我马上就去办。", "sp": "A"}], [{"id": "s0_9_0", "md": "Good idea. I'll file a report and alert the other stations. Can I have your name and ==contact== number?", "text": "Good idea. I'll file a report and alert the other stations. Can I have your name and contact number?", "zh": "好的。我来登记报失，并通知沿线其他车站。能留一下您的姓名和联系电话吗？", "sp": "B"}], [{"id": "s0_10_0", "md": "Lee Wei, and my number is nine eight seven six, five four three two. __Feel free to__ call anytime.", "text": "Lee Wei, and my number is nine eight seven six, five four three two. Feel free to call anytime.", "zh": "李伟，电话是九八七六，五四三二。随时可以打给我。", "sp": "A"}], [{"id": "s0_11_0", "md": "Thanks. Here's your ==reference== number. If it turns up, we'll give you a call.", "text": "Thanks. Here's your reference number. If it turns up, we'll give you a call.", "zh": "谢谢。这是您的报失编号。如果找到了，我们会给您打电话。", "sp": "B"}]]}, {"heading": "2. A Call Back", "heading_zh": "2. 车站回电", "rows": [[{"id": "s1_0_0", "md": "Hello, is this Mr Lee? It's Ryan from Buona Vista station. Someone handed in a black wallet at HarbourFront.", "text": "Hello, is this Mr Lee? It's Ryan from Buona Vista station. Someone handed in a black wallet at HarbourFront.", "zh": "你好，是李先生吗？我是波那维斯达站的 Ryan。有人在港湾站交了一个黑色钱包。", "sp": "B"}], [{"id": "s1_1_0", "md": "**Oh, that's great news! Is everything still inside?**", "text": "Oh, that's great news! Is everything still inside?", "zh": "哦，太好了！东西都还在吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "The cards and the pass are there, but I'm afraid there's no cash.", "text": "The cards and the pass are there, but I'm afraid there's no cash.", "zh": "卡和准证都在，不过现金恐怕没有了。", "sp": "B"}], [{"id": "s1_3_0", "md": "Ah well, I'm just relieved about the pass. Replacing it would have been a ==nightmare==.", "text": "Ah well, I'm just relieved about the pass. Replacing it would have been a nightmare.", "zh": "唉，算了，准证还在我就放心了。要补办的话可就麻烦死了。", "sp": "A"}], [{"id": "s1_4_0", "md": "I understand. You can ==collect== it at the HarbourFront ==control station== until nine tonight.", "text": "I understand. You can collect it at the HarbourFront control station until nine tonight.", "zh": "理解。今晚九点前您可以去港湾站的车站服务中心领取。", "sp": "B"}], [{"id": "s1_5_0", "md": "**Do I need to bring anything? My ID was actually in the wallet.**", "text": "Do I need to bring anything? My ID was actually in the wallet.", "zh": "需要带什么吗？我的证件其实就在钱包里。", "sp": "A"}], [{"id": "s1_6_0", "md": "Your passport will do, plus the reference number I gave you.", "text": "Your passport will do, plus the reference number I gave you.", "zh": "带护照就可以，还有我给您的那个报失编号。", "sp": "B"}], [{"id": "s1_7_0", "md": "Perfect. __Is it okay if__ my wife picks it up instead? I'm stuck at work.", "text": "Perfect. Is it okay if my wife picks it up instead? I'm stuck at work.", "zh": "好的。我太太代我去领可以吗？我在公司走不开。", "sp": " const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
