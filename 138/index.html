const D = {"id": "138", "type": "dialogue", "title": "Chatting with Other Parents at the Playground", "meta": "B2 · 约 240 词 · 场景：游乐场搭话与约玩", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Other Parent", "name_zh": "另一位家长", "voice": "en-GB-RyanNeural"}}, "gist": [{"q": "两位家长互相介绍了哪些信息？", "a": "Mia 三岁半，住对面公寓，两个月前从上海搬来；Oliver 刚满四岁，在社区中心旁的幼儿园上学。"}, {"q": "两个孩子发生了什么？大人怎么处理的？", "a": "两人抢同一辆滑板车；「你」让 Mia 好好问、轮流玩，对方让 Oliver 先给她玩几分钟。"}, {"q": "最后约了什么？", "a": "周日上午十点来「你」家玩，天气好可以去公寓泳池；两人交换了电话，「你」用 WhatsApp 发地址。"}], "dictation": [{"id": "s0_1_0", "text": "Yes, that's Mia. She's three and a half. Which one is yours?"}, {"id": "s0_7_0", "text": "Not yet. Is that one any good? I've heard mixed reviews."}, {"id": "s1_3_0", "text": "Sorry about that. She's still learning to share."}, {"id": "s1_5_0", "text": "They seem to get along, though. Would you be up for a playdate sometime? Maybe at our place on the weekend?"}], "shadow": {"speaker": "A", "text": "From Shanghai. We're still settling in. Does Oliver go to school nearby?", "marked": "From <b>Shanghai</b>. //<br>We're still <b>settling in</b>. //<br>Does <b>Oliver</b> / go to school <b>nearby</b>? //"}, "prompts": [{"q": "在电梯里遇到一位常见面的家长，孩子年龄相仿。主动搭话，并问问附近有什么适合孩子的地方。", "ref": "Hi, I think I see you at the playground most evenings. Your daughter must be about the same age as my son, around three? We're fairly new here, so I'm still looking for things to do with him on weekends. Are there any good indoor playgrounds or kids' classes nearby that you'd recommend?", "ref_zh": "你好，我好像傍晚经常在游乐场看到你。你女儿应该跟我儿子差不多大，三岁左右吧？我们刚搬来不久，还在找周末能带他去玩的地方。附近有没有什么好的室内游乐场或者儿童课程可以推荐？", "id": "ref0"}, {"q": "约好的周日玩耍，孩子早上发烧了。给对方家长发语音，取消并改约。", "ref": "Hi, it's Mia's dad. I'm really sorry, but Mia woke up with a fever this morning, so we'll have to cancel today. I don't want Oliver to catch anything. She was really looking forward to it, though. Could we do next Sunday instead, same time? Let me know what works for you. Sorry again.", "ref_zh": "你好，我是 Mia 的爸爸。真不好意思，Mia 今早起来发烧了，今天只能取消了，不想让 Oliver 被传染。不过她本来特别期待。下周日同一时间可以吗？看你们什么时候方便。再次抱歉。", "id": "ref1"}], "words": [{"w": "condo", "ipa": "/ˈkɑːndoʊ/", "zh": "（私人）公寓", "ex": "Our condo has a pool and a small gym.", "id": "w0"}, {"w": "neighbourhood", "ipa": "/ˈneɪbərhʊd/", "zh": "街区；附近一带", "ex": "It's a quiet neighbourhood with lots of families.", "id": "w1"}, {"w": "settle in", "ipa": "/ˈsetəl ɪn/", "zh": "安顿下来；适应", "ex": "It took us a few months to settle in after the move.", "id": "w2"}, {"w": "review", "ipa": "/rɪˈvjuː/", "zh": "评价", "ex": "The restaurant has great reviews on Google.", "id": "w3"}, {"w": "waiting list", "ipa": "/ˈweɪtɪŋ lɪst/", "zh": "候补名单", "ex": "Can you put my name on the waiting list?", "id": "w4"}, {"w": "take turns", "ipa": "/teɪk tɜːrnz/", "zh": "轮流", "ex": "You two need to take turns on the swing.", "id": "w5"}, {"w": "share", "ipa": "/ʃer/", "zh": "分享", "ex": "Can you share your crayons with your brother?", "id": "w6"}, {"w": "squabble", "ipa": "/ˈskwɑːbəl/", "zh": "（小事）争吵", "ex": "The kids had a squabble over the last cookie.", "id": "w7"}, {"w": "swap", "ipa": "/swɑːp/", "zh": "交换", "ex": "Let's swap seats so you can see the screen.", "id": "w8"}, {"w": "playdate", "ipa": "/ˈpleɪdeɪt/", "zh": "（家长约的）孩子一起玩", "ex": "We arranged a playdate at the park on Saturday.", "id": "w9"}], "sections": [{"heading": "1. Breaking the Ice", "heading_zh": "1. 打开话题", "rows": [[{"id": "s0_0_0", "md": "Is that your little one on the slide? She's fearless!", "text": "Is that your little one on the slide? She's fearless!", "zh": "滑梯上那个是你家的吗？她胆子真大！", "sp": "B"}], [{"id": "s0_1_0", "md": "**Yes, that's Mia. She's three and a half. Which one is yours?**", "text": "Yes, that's Mia. She's three and a half. Which one is yours?", "zh": "是的，那是 Mia，三岁半。哪个是你家的？", "sp": "A"}], [{"id": "s0_2_0", "md": "The boy in the blue hat, Oliver. He just turned four. Do you live around here?", "text": "The boy in the blue hat, Oliver. He just turned four. Do you live around here?", "zh": "戴蓝帽子那个男孩，叫 Oliver，刚满四岁。你住这附近吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "Yes, in the ==condo== just across the road. We moved in two months ago.", "text": "Yes, in the condo just across the road. We moved in two months ago.", "zh": "对，就住马路对面那个公寓，两个月前搬进来的。", "sp": "A"}], [{"id": "s0_4_0", "md": "Oh nice, welcome to the ==neighbourhood==. Where did you move from?", "text": "Oh nice, welcome to the neighbourhood. Where did you move from?", "zh": "不错啊，欢迎来到这一片。你们从哪儿搬来的？", "sp": "B"}], [{"id": "s0_5_0", "md": "From Shanghai. We're still __settling in__. Does Oliver go to school nearby?", "text": "From Shanghai. We're still settling in. Does Oliver go to school nearby?", "zh": "从上海。我们还在适应中。Oliver 在附近上学吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "Yes, he's at the preschool next to the community centre. Have you found one yet?", "text": "Yes, he's at the preschool next to the community centre. Have you found one yet?", "zh": "对，在社区中心旁边那家幼儿园。你们找到幼儿园了吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Not yet. Is that one any good? I've heard mixed ==reviews==.", "text": "Not yet. Is that one any good? I've heard mixed reviews.", "zh": "还没有。那家好吗？我听到的评价有好有坏。", "sp": "A"}], [{"id": "s0_8_0", "md": "We've been happy with it. The teachers are lovely, though the ==waiting list== is long.", "text": "We've been happy with it. The teachers are lovely, though the waiting list is long.", "zh": "我们挺满意的。老师都很好，不过候补名单很长。", "sp": "B"}]]}, {"heading": "2. A Squabble and a Playdate", "heading_zh": "2. 小争执和约玩", "rows": [[{"id": "s1_0_0", "md": "Uh oh. Looks like they both want the same scooter.", "text": "Uh oh. Looks like they both want the same scooter.", "zh": "哎呀，看来他俩都想要同一辆滑板车。", "sp": "B"}], [{"id": "s1_1_0", "md": "Mia, sweetheart, that's Oliver's scooter. Can you ask nicely and __take turns__?", "text": "Mia, sweetheart, that's Oliver's scooter. Can you ask nicely and take turns?", "zh": "Mia，宝贝，那是 Oliver 的滑板车。你好好问一下，轮流玩好不好？", "sp": "A"}], [{"id": "s1_2_0", "md": "Oliver, let her __have a go__ for a few minutes, then it's your turn again.", "text": "Oliver, let her have a go for a few minutes, then it's your turn again.", "zh": "Oliver，让她玩几分钟，然后再轮到你。", "sp": "B"}], [{"id": "s1_3_0", "md": "Sorry about that. She's still learning to ==share==.", "text": "Sorry about that. She's still learning to share.", "zh": "不好意思。她还在学怎么分享。", "sp": "A"}], [{"id": "s1_4_0", "md": "No worries, Oliver's exactly the same. Little ==squabbles== like this happen every day.", "text": "No worries, Oliver's exactly the same. Little squabbles like this happen every day.", "zh": "没事，Oliver 也一样。这种小争执每天都有。", "sp": "B"}], [{"id": "s1_5_0", "md": "**They seem to get along, though. Would you be up for a playdate sometime? Maybe at our place on the weekend?**", "text": "They seem to get along, though. Would you be up for a playdate sometime? Maybe at our place on the weekend?", "zh": "不过他俩好像挺合得来。哪天约着一起玩怎么样？周末来我们家？", "sp": "A"}], [{"id": "s1_6_0", "md": "That would be great. Saturdays are busy with swimming, but Sunday morning could work.", "text": "That would be great. Saturdays are busy with swimming, but Sunday morning could work.", "zh": "那太好了。周六要上游泳课，但周日上午可以。", "sp": "B"}], [{"id": "s1_7_0", "md": "How about Sunday at ten? There's a pool in our condo, __if the weather holds__.", "text": "How about Sunday at ten? There's a pool in our condo, if the weather holds.", "zh": "周日十点怎么样？我们公寓有泳池，天气好的话可以去玩。", "sp": "A"}], [{"id": "s1_8_0", "md": "Sunday at ten sounds perfect. Shall we ==swap== numbers?", "text": "Sunday at ten sounds perfect. Shall we swap numbers?", "zh": "周日十点很好。我们交换一下电话吧？", "sp": "B"}], [{"id": "s1_9_0", "md": "**Sure. I'll WhatsApp you our address. It was really nice meeting you.**", "text": "Sure. I'll WhatsApp you our address. It was really nice meeting you.", "zh": "好的，我用 WhatsApp 把地址发给你。很高兴认识你。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Breaking the Ice", "zh": "1. const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));
