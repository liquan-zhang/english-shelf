<script>
const D = {"id": "145", "type": "dialogue", "title": "Inviting Friends Over for Dinner", "meta": "B2 · 约 260 词 · 场景：请朋友来家里吃饭", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Friend", "name_zh": "朋友", "voice": "en-US-AvaNeural"}}, "gist": [{"q": "晚饭定在什么时候？朋友夫妇有什么饮食要求？", "a": "下周六晚上七点半；Tom 吃素，但吃蛋和奶制品，Sarah 什么都吃。"}, {"q": "当天发生了什么变化？", "a": "保姆临时取消，他们要带儿子 Max 一起来，而且 Max 对坚果过敏，比较严重。"}, {"q": "「你」为 Max 的过敏做了哪些安排？", "a": "保证不放花生和其他坚果，并再检查火锅蘸料；芝麻可以吃。"}], "dictation": [{"id": "s0_2_0", "text": "We'd love to have you and Tom over for dinner. Are you free next Saturday?"}, {"id": "s0_8_0", "text": "You don't have to, but a bottle of wine would be nice. Just bring yourselves."}, {"id": "s1_1_0", "text": "Of course! The more the merrier. Our son will be thrilled to have a playmate."}, {"id": "s1_5_0", "text": "Got it. I'll double-check the hotpot sauces, since some of them have peanuts."}], "shadow": {"speaker": "A", "text": "Good to know. We're planning to do hotpot, so we can make a separate vegetable broth for him.", "marked": "Good to <b>know</b>. //<br>We're planning to do <b>hotpot</b>, / so we can make a <b>separate</b> vegetable broth / for <b>him</b>. //"}, "prompts": [{"q": "你想请新同事一家周末来家里吃饭。发一条语音：说清时间、地点、问忌口，并说明孩子也欢迎来。", "ref": "Hi Priya, it's Lee. We'd love to have you and your family over for lunch next Sunday, around twelve. We're in Tiong Bahru, and I'll send you the address. Please bring the kids too. Our son would love some company. Is there anything you don't eat? Just let me know, and we'll plan around it.", "ref_zh": "嗨 Priya，我是李。下周日中午十二点左右想请你们一家来家里吃午饭。我们住在中峇鲁，地址我稍后发你。孩子一起带来吧，我儿子很想有人陪他玩。你们有什么不吃的吗？告诉我一声，我们照着安排。", "id": "ref0"}, {"q": "朋友到了才说自己最近在戒糖戒碳水，而你准备的是饺子和甜点。灵活应对，让对方不尴尬。", "ref": "Oh, no worries at all. I'm glad you told me. We've got plenty of other things. There's a big salad, some grilled chicken, and steamed fish, so you won't go hungry. Just skip the dumplings and the cake. And next time, I'll know to plan a low carb menu for you.", "ref_zh": "哦，完全没关系，你告诉我就好。我们还有很多别的菜，有一大份沙拉、烤鸡和清蒸鱼，你不会饿着的。饺子和蛋糕跳过就行。下次我就知道给你准备低碳水的菜了。", "id": "ref1"}], "words": [{"w": "dietary", "ipa": "/ˈdaɪəteri/", "zh": "饮食的", "ex": "Please let us know about any dietary needs before the event.", "id": "w0"}, {"w": "vegetarian", "ipa": "/ˌvedʒəˈteriən/", "zh": "素食者；素食的", "ex": "Is there a vegetarian option on the menu?", "id": "w1"}, {"w": "broth", "ipa": "/brɔːθ/", "zh": "汤底，清汤", "ex": "The chicken broth needs to simmer for an hour.", "id": "w2"}, {"w": "dessert", "ipa": "/dɪˈzɜːrt/", "zh": "甜点", "ex": "Let's skip dessert and just get coffee.", "id": "w3"}, {"w": "babysitter", "ipa": "/ˈbeɪbisɪtər/", "zh": "临时保姆", "ex": "We need a babysitter for Friday night.", "id": "w4"}, {"w": "allergy", "ipa": "/ˈælərdʒi/", "zh": "过敏", "ex": "My son has an allergy to shellfish.", "id": "w5"}, {"w": "sauce", "ipa": "/sɔːs/", "zh": "酱料，蘸料", "ex": "Could I have the chilli sauce on the side?", "id": "w6"}, {"w": "visitor parking", "ipa": "/ˈvɪzɪtər ˈpɑːrkɪŋ/", "zh": "访客停车位", "ex": "Visitor parking is free for the first hour.", "id": "w7"}, {"w": "block", "ipa": "/blɑːk/", "zh": "（组屋、公寓的）一栋楼", "ex": "Our block is the one next to the playground.", "id": "w8"}, {"w": "the more the merrier", "ipa": "/ðə mɔːr ðə ˈmeriər/", "zh": "人越多越热闹", "ex": "Bring your cousins along. The more the merrier!", "id": "w9"}], "sections": [{"heading": "1. Making the Invitation", "heading_zh": "1. 发出邀请", "rows": [[{"id": "s0_0_0", "md": "Hey Sarah, it's Lee. Have you got a minute?", "text": "Hey Sarah, it's Lee. Have you got a minute?", "zh": "嘿 Sarah，我是李。你现在方便说两句吗？", "sp": "A"}], [{"id": "s0_1_0", "md": "Sure, what's up?", "text": "Sure, what's up?", "zh": "当然，怎么了？", "sp": "B"}], [{"id": "s0_2_0", "md": "**We'd love to have you and Tom over for dinner. Are you free next Saturday?**", "text": "We'd love to have you and Tom over for dinner. Are you free next Saturday?", "zh": "我们想请你和 Tom 来家里吃饭。下周六有空吗？", "sp": "A"}], [{"id": "s0_3_0", "md": "Oh, that's so sweet! Saturday works, but could we make it a bit later, like seven thirty?", "text": "Oh, that's so sweet! Saturday works, but could we make it a bit later, like seven thirty?", "zh": "哇，太贴心了！周六可以，不过能不能稍微晚一点，比如七点半？", "sp": "B"}], [{"id": "s0_4_0", "md": "Seven thirty is perfect. Is there anything you guys don't eat? Any ==dietary== restrictions?", "text": "Seven thirty is perfect. Is there anything you guys don't eat? Any dietary restrictions?", "zh": "七点半正好。你们有什么不吃的吗？有没有饮食上的忌口？", "sp": "A"}], [{"id": "s0_5_0", "md": "Tom's ==vegetarian==, but he eats eggs and dairy. I'll eat anything.", "text": "Tom's vegetarian, but he eats eggs and dairy. I'll eat anything.", "zh": "Tom 吃素，不过蛋和奶制品可以吃。我什么都吃。", "sp": "B"}], [{"id": "s0_6_0", "md": "Good to know. We're planning to do hotpot, so we can __make a separate__ vegetable ==broth== for him.", "text": "Good to know. We're planning to do hotpot, so we can make a separate vegetable broth for him.", "zh": "好的，记下了。我们打算吃火锅，可以给他单独做一锅素汤底。", "sp": "A"}], [{"id": "s0_7_0", "md": "He'll love that. Can we bring anything? Wine, ==dessert==?", "text": "He'll love that. Can we bring anything? Wine, dessert?", "zh": "他肯定喜欢。我们带点什么吧？酒还是甜点？", "sp": "B"}], [{"id": "s0_8_0", "md": "__You don't have to__, but a bottle of wine would be nice. __Just bring yourselves__.", "text": "You don't have to, but a bottle of wine would be nice. Just bring yourselves.", "zh": "不用特意带，不过带瓶酒也挺好。人来就行。", "sp": "A"}], [{"id": "s0_9_0", "md": "Deal. Send me your address and I'll put it in my calendar.", "text": "Deal. Send me your address and I'll put it in my calendar.", "zh": "说定了。把地址发我，我记到日历里。", "sp": "B"}]]}, {"heading": "2. A Last-Minute Change", "heading_zh": "2. 临时变化", "rows": [[{"id": "s1_0_0", "md": "Hi Lee, sorry to call on the day. Our ==babysitter== just cancelled. Would it be okay if we brought Max?", "text": "Hi Lee, sorry to call on the day. Our babysitter just cancelled. Would it be okay if we brought Max?", "zh": "嗨李，抱歉当天才打电话。我们的保姆临时取消了，可以带 Max 一起来吗？", "sp": "B"}], [{"id": "s1_1_0", "md": "**Of course! The more the merrier. Our son will be thrilled to have a playmate.**", "text": "Of course! The more the merrier. Our son will be thrilled to have a playmate.", "zh": "当然！人越多越热闹。我儿子有个玩伴会高兴坏的。", "sp": "A"}], [{"id": "s1_2_0", "md": "Thank you. One thing, though. Max has a nut ==allergy==, and it's fairly serious.", "text": "Thank you. One thing, though. Max has a nut allergy, and it's fairly serious.", "zh": "谢谢。不过有一点，Max 对坚果过敏，还挺严重的。", "sp": "B"}], [{"id": "s1_3_0", "md": "Thanks for telling me. I'll make sure nothing has peanuts in it. __What about__ sesame?", "text": "Thanks for telling me. I'll make sure nothing has peanuts in it. What about sesame?", "zh": "谢谢你告诉我。我保证所有东西都不放花生。那芝麻呢？", "sp": "A"}], [{"id": "s1_4_0", "md": "Sesame is fine. Just no peanuts or other nuts, like cashews.", "text": "Sesame is fine. Just no peanuts or other nuts, like cashews.", "zh": "芝麻没问题。只要不放花生和其他坚果就行，比如腰果。", "sp": "B"}], [{"id": "s1_5_0", "md": "Got it. I'll double-check the hotpot ==sauces==, since some of them have peanuts.", "text": "Got it. I'll double-check the hotpot sauces, since some of them have peanuts.", "zh": "明白。我会再检查一下火锅蘸料，有些里面有花生。", "sp": "A"}], [{"id": "s1_6_0", "md": "You're a star. Honestly, he'll be happy with rice and noodles.", "text": "You're a star. Honestly, he'll be happy with rice and noodles.", "zh": "你太好了。说实话，他有米饭和面条就很开心了。", "sp": "B"}], [{"id": "s1_7_0", "md": "Also, ==visitor== parking is at the back of the ==block==. Just tell the guard you're visiting unit ten eleven.", "text": "Also, visitor parking is at the back of the block. Just tell the guard you're visiting unit ten eleven.", "zh": "另外，访客停车位在楼的后面。跟保安说你们去十楼十一号就行。", "sp": "A"}], [{"id": "s1_8_0", "md": "Great. We might be ten minutes late with all the extra packing.", "text": "Great. We might be ten minutes late with all the extra packing.", "zh": "好的。多带个孩子要收拾东西，我们可能会晚十分钟。", "s const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
