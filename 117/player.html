<script>
const D = {"id": "117", "type": "dialogue", "title": "Reporting a Lost Card", "meta": "B2 · 约 280 词 · 场景：电话挂失信用卡与可疑交易", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Card Services", "name_zh": "信用卡客服", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "客服是怎么核实「你」的身份的？", "a": "先问全名和出生日期，再发一次性验证码让你念出来。"}, {"q": "卡被冻结后发现了什么？", "a": "早上有两笔网上交易不是本人：电器店二百四十元、外卖平台十八元。"}, {"q": "客服后续做了哪些处理？", "a": "两笔交易提交争议并标记盗刷，调查期间不收费；补寄新卡，提醒更新自动扣款；短信发参考编号。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, I think I've lost my credit card. I need to block it right away."}, {"id": "s1_3_0", "text": "Neither of those was me. Can I dispute them?"}, {"id": "s1_7_0", "text": "And can you send me a replacement card? My phone bill is paid with this one."}, {"id": "s1_9_0", "text": "Got it. Could I also get a reference number for this call?"}], "shadow": {"speaker": "A", "text": "Last night at a restaurant in Tanjong Pagar. I think I left it behind there.", "marked": "<b>Last night</b> / at a <b>restaurant</b> in Tanjong <b>Pagar</b>. //<br>I think I <b>left it behind</b> there. //"}, "prompts": [{"q": "你在手机银行里收到一条你没做过的扣款提醒，但卡还在你手上。打电话给银行，说明情况并要求处理。", "ref": "Hi, I just got an alert for a charge of about ninety dollars on my credit card, but I didn't make it. The card is still with me, so I think the details might have been stolen online. Could you block this card, dispute the charge, and send me a new one? I'd also like to know if there were any other strange payments.", "ref_zh": "你好，我刚收到信用卡一笔大约九十元的扣款提醒，但不是我刷的。卡还在我身上，所以我怀疑卡信息在网上被盗了。能帮我冻结这张卡、对这笔扣款提出争议、再寄一张新卡吗？我也想知道还有没有别的异常付款。", "id": "ref0"}, {"q": "冻结卡片后你发现卡其实在外套口袋里。打电话问能不能解冻，以及之前的争议还会不会继续处理。", "ref": "Hi, I called this morning to block my card, but I've just found it in my jacket pocket. Is it possible to unblock it instead of getting a replacement? Also, I reported a charge I didn't recognise. I still don't think that one was me, so I'd like the dispute to carry on. Is that okay?", "ref_zh": "你好，我今天早上打电话冻结了卡，结果刚在外套口袋里找到了。能不能直接解冻，不用补新卡？另外我之前报了一笔不认识的扣款，我仍然觉得那笔不是我刷的，希望争议继续处理，可以吗？", "id": "ref1"}], "words": [{"w": "verify", "ipa": "/ˈverɪfaɪ/", "zh": "核实", "ex": "We need to verify your phone number first.", "id": "w0"}, {"w": "one-time password", "ipa": "/ˌwʌn taɪm ˈpæswɜːrd/", "zh": "一次性验证码", "ex": "Never share your one-time password with anyone.", "id": "w1"}, {"w": "block (v.)", "ipa": "/blɑːk/", "zh": "冻结（卡）", "ex": "You can block your card in the app in seconds.", "tts_w": "block", "id": "w2"}, {"w": "transaction", "ipa": "/trænˈzækʃən/", "zh": "交易", "ex": "Every transaction shows up in the app straight away.", "id": "w3"}, {"w": "fraud", "ipa": "/frɔːd/", "zh": "诈骗，盗刷", "ex": "The bank called me about possible fraud on my account.", "id": "w4"}, {"w": "investigate", "ipa": "/ɪnˈvestɪɡeɪt/", "zh": "调查", "ex": "The landlord promised to investigate the leak.", "id": "w5"}, {"w": "dispute (v.)", "ipa": "/dɪˈspjuːt/", "zh": "对（扣款）提出异议", "ex": "You can dispute the charge within sixty days.", "tts_w": "dispute", "id": "w6"}, {"w": "replacement card", "ipa": "/rɪˈpleɪsmənt kɑːrd/", "zh": "补发的卡", "ex": "My replacement card came in the post yesterday.", "id": "w7"}, {"w": "recurring payment", "ipa": "/rɪˈkɜːrɪŋ ˈpeɪmənt/", "zh": "定期自动扣款", "ex": "My gym fee is a recurring payment on my card.", "id": "w8"}], "sections": [{"heading": "1. Blocking the Card", "heading_zh": "1. 冻结卡片", "rows": [[{"id": "s0_0_0", "md": "Thank you for calling Card Services. This is Michelle. How can I help?", "text": "Thank you for calling Card Services. This is Michelle. How can I help?", "zh": "感谢致电信用卡服务中心，我是 Michelle。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, I think I've lost my credit card. I need to block it right away.**", "text": "Hi, I think I've lost my credit card. I need to block it right away.", "zh": "你好，我的信用卡好像丢了。需要马上冻结。", "sp": "A"}], [{"id": "s0_2_0", "md": "I can help with that. First, I need to ==verify== your identity. Could I have your full name and date of birth?", "text": "I can help with that. First, I need to verify your identity. Could I have your full name and date of birth?", "zh": "我来帮您处理。首先需要核实身份。请告诉我您的全名和出生日期。", "sp": "B"}], [{"id": "s0_3_0", "md": "It's Lee Wei, born on the fourth of March, nineteen eighty-eight.", "text": "It's Lee Wei, born on the fourth of March, nineteen eighty-eight.", "zh": "Lee Wei，一九八八年三月四日出生。", "sp": "A"}], [{"id": "s0_4_0", "md": "Thank you. I've just sent a ==one-time password== to your mobile. Could you read it out?", "text": "Thank you. I've just sent a one-time password to your mobile. Could you read it out?", "zh": "谢谢。我刚往您手机发了一个一次性验证码，请念一下。", "sp": "B"}], [{"id": "s0_5_0", "md": "Sure, it's seven, four, one, nine, zero, two.", "text": "Sure, it's seven, four, one, nine, zero, two.", "zh": "好的，是七四一九零二。", "sp": "A"}], [{"id": "s0_6_0", "md": "That's verified. When did you last use the card?", "text": "That's verified. When did you last use the card?", "zh": "核实成功。您最后一次用这张卡是什么时候？", "sp": "B"}], [{"id": "s0_7_0", "md": "Last night at a restaurant in Tanjong Pagar. I think I __left it behind__ there.", "text": "Last night at a restaurant in Tanjong Pagar. I think I left it behind there.", "zh": "昨晚在丹戎巴葛的一家餐厅。我估计是落在那儿了。", "sp": "A"}], [{"id": "s0_8_0", "md": "Okay, I've ==blocked== the card now. Nobody can use it from this point on.", "text": "Okay, I've blocked the card now. Nobody can use it from this point on.", "zh": "好的，卡已经冻结了。从现在起没人能用这张卡。", "sp": "B"}]]}, {"heading": "2. Charges You Didn't Make", "heading_zh": "2. 不是你刷的交易", "rows": [[{"id": "s1_0_0", "md": "I do see two ==transactions== this morning, both online. Did you make those?", "text": "I do see two transactions this morning, both online. Did you make those?", "zh": "我看到今天早上有两笔交易，都是网上的。是您本人消费的吗？", "sp": "B"}], [{"id": "s1_1_0", "md": "What are they? I haven't used the card since last night.", "text": "What are they? I haven't used the card since last night.", "zh": "是什么交易？我从昨晚起就没用过这张卡。", "sp": "A"}], [{"id": "s1_2_0", "md": "One for two hundred and forty dollars at an electronics store, and one for eighteen dollars at a food delivery app.", "text": "One for two hundred and forty dollars at an electronics store, and one for eighteen dollars at a food delivery app.", "zh": "一笔是电器店的二百四十元，一笔是外卖平台的十八元。", "sp": "B"}], [{"id": "s1_3_0", "md": "**Neither of those was me. Can I dispute them?**", "text": "Neither of those was me. Can I dispute them?", "zh": "这两笔都不是我。我能申诉吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Yes. I'll __raise a dispute__ for both and flag them as ==fraud==. You won't be charged while we ==investigate==.", "text": "Yes. I'll raise a dispute for both and flag them as fraud. You won't be charged while we investigate.", "zh": "可以。我给这两笔都提交争议，标记为盗刷。调查期间不会向您收费。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thank you. __How long__ does the investigation usually take?", "text": "Thank you. How long does the investigation usually take?", "zh": "谢谢。调查一般要多久？", "sp": "A"}], [{"id": "s1_6_0", "md": "Usually two to four weeks. We'll update you by email.", "text": "Usually two to four weeks. We'll update you by email.", "zh": "一般两到四周，我们会邮件通知您进展。", "sp": "B"}], [{"id": "s1_7_0", "md": "**And can you send me a replacement card? My phone bill is paid with this one.**", "text": "And can you send me a replacement card? My phone bill is paid with this one.", "zh": "能给我补一张新卡吗？我的手机话费是用这张卡扣的。", "sp": "A"}], [{"id": "s1_8_0", "md": "A new card will arrive in five to seven working days, with a new number. You'll need to __update__ your recurring payments.", "text": "A new card will arrive in five to seven working days, with a new number. You'll need to update your recurring payments.", "zh": "新卡五到七个工作日寄到，卡号会变。您需要更新自动扣款的卡号。", "sp": "B"}], [{"id": "s1_9_0", "md": "Got it. Could I also get a reference number for this call?", "text": "Got it. Could I also get a reference number for this call?", "zh": "明白了。能给我这次来电的参考编号吗？", "sp": "A"}], [{"id": "s1_10_0", "md": "O const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
