const D = {"id": "117", "type": "dialogue", "title": "Reporting a Lost Card", "meta": "B2 · 约 280 词 · 场景：电话挂失信用卡与可疑交易", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Card Services", "name_zh": "信用卡客服", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "客服是怎么核实「你」的身份的？", "a": "先问全名和出生日期，再发一次性验证码让你念出来。"}, {"q": "卡被冻结后发现了什么？", "a": "早上有两笔网上交易不是本人：电器店二百四十元、外卖平台十八元。"}, {"q": "客服后续做了哪些处理？", "a": "两笔交易提交争议并标记盗刷，调查期间不收费；补寄新卡，提醒更新自动扣款；短信发参考编号。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, I think I've lost my credit card. I need to block it right away."}, {"id": "s1_3_0", "text": "Neither of those was me. Can I dispute them?"}, {"id": "s1_7_0", "text": "And can you send me a replacement card? My phone bill is paid with this one."}, {"id": "s1_9_0", "text": "Got it. Could I also get a reference number for this call?"}], "shadow": {"speaker": "A", "text": "Last night at a restaurant in Tanjong Pagar. I think I left it behind there.", "marked": "<b>Last night</b> / at a <b>restaurant</b> in Tanjong <b>Pagar</b>. //<br>I think I <b>left it behind</b> there. //"}, "prompts": [{"q": "你在手机银行里收到一条你没做过的扣款提醒，但卡还在你手上。打电话给银行，说明情况并要求处理。", "ref": "Hi, I just got an alert for a charge of about ninety dollars on my credit card, but I didn't make it. The card is still with me, so I think the details might have been stolen online. Could you block this card, dispute the charge, and send me a new one? I'd also like to know if there were any other strange payments.", "ref_zh": "你好，我刚收到信用卡一笔大约九十元的扣款提醒，但不是我刷的。卡还在我身上，所以我怀疑卡信息在网上被盗了。能帮我冻结这张卡、对这笔扣款提出争议、再寄一张新卡吗？我也想知道还有没有别的异常付款。", "id": "ref0"}, {"q": "冻结卡片后你发现卡其实在外套口袋里。打电话问能不能解冻，以及之前的争议还会不会继续处理。", "ref": "Hi, I called this morning to block my card, but I've just found it in my jacket pocket. Is it possible to unblock it instead of getting a replacement? Also, I reported a charge I didn't recognise. I still don't think that one was me, so I'd like the dispute to carry on. Is that okay?", "ref_zh": "你好，我今天早上打电话冻结了卡，结果刚在外套口袋里找到了。能不能直接解冻，不用补新卡？另外我之前报了一笔不认识的扣款，我仍然觉得那笔不是我刷的，希望争议继续处理，可以吗？", "id": "ref1"}], "words": [{"w": "verify", "ipa": "/ˈverɪfaɪ/", "zh": "核实", "ex": "We need to verify your phone number first.", "id": "w0"}, {"w": "one-time password", "ipa": "/ˌwʌn taɪm ˈpæswɜːrd/", "zh": "一次性验证码", "ex": "Never share your one-time password with anyone.", "id": "w1"}, {"w": "block (v.)", "ipa": "/blɑːk/", "zh": "冻结（卡）", "ex": "You can block your card in the app in seconds.", "tts_w": "block", "id": "w2"}, {"w": "transaction", "ipa": "/trænˈzækʃən/", "zh": "交易", "ex": "Every transaction shows up in the app straight away.", "id": "w3"}, {"w": "fraud", "ipa": "/frɔːd/", "zh": "诈骗，盗刷", "ex": "The bank called me about possible fraud on my account.", "id": "w4"}, {"w": "investigate", "ipa": "/ɪnˈvestɪɡeɪt/", "zh": "调查", "ex": "The landlord promised to investigate the leak.", "id": "w5"}, {"w": "dispute (v.)", "ipa": "/dɪˈspjuːt/", "zh": "对（扣款）提出异议", "ex": "You can dispute the charge within sixty days.", "tts_w": "dispute", "id": "w6"}, {"w": "replacement card", "ipa": "/rɪˈpleɪsmənt kɑːrd/", "zh": "补发的卡", "ex": "My replacement card came in the post yesterday.", "id": "w7"}, {"w": "recurring payment", "ipa": "/rɪˈkɜːrɪŋ ˈpeɪmənt/", "zh": "定期自动扣款", "ex": "My gym fee is a recurring payment on my card.", "id": "w8"}], "sections": [{"heading": "1. Blocking the Card", "heading_zh": "1. 冻结卡片", "rows": [[{"id": "s0_0_0", "md": "Thank you for calling Card Services. This is Michelle. How can I help?", "text": "Thank you for calling Card Services. This is Michelle. How can I help?", "zh": "感谢致电信用卡服务中心，我是 Michelle。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, I think I've lost my credit card. I need to block it right away.**", "text": "Hi, I think I've lost my credit card. I need to block it right away.", "zh": "你好，我的信用卡好像丢了。需要马上冻结。", "sp": "A"}], [{"id": "s0_2_0", "md": "I can help with that. First, I need to ==verify== your identity. Could I have your full name and date of birth?", "text": "I can help with that. First, I need to verify your identity. Could I have your full name and date of birth?", "zh": "我来帮您处理。首先需要核实身份。请告诉我您的全名和出生日期。", "sp": "B"}], [{"id": "s0_3_0", "md": "It's Lee Wei, born on the fourth of March, nineteen eighty-eight.", "text": "It's Lee Wei, born on the fourth of March, nineteen eighty-eight.", "zh": "Lee Wei，一九八八年三月四日出生。", "sp": "A"}], [{"id": "s0_4_0", "md": "Thank you. I've just sent a ==one-time password== to your mobile. Could you read it out?", "text": "Thank you. I've just sent a one-time password to your mobile. Could you read it out?", "zh": "谢谢。我刚往您手机发了一个一次性验证码，请念一下。", "sp": "B"}], [{"id": "s0_5_0", "md": "Sure, it's seven, four, one, nine, zero, two.", "text": "Sure, it's seven, four, one, nine, zero, two.", "zh": "好的，是七四一九零二。", "sp": "A"}], [{"id": "s0_6_0", "md": "That's verified. When did you last use the card?", "text": "That's verified. When did you last use the card?", "zh": "核实成功。您最后一次用这张卡是什么时候？", "sp": "B"}], [{"id": "s0_7_0", "md": "Last night at a restaurant in Tanjong Pagar. I think I __left it behind__ there.", "text": "Last night at a restaurant in Tanjong Pagar. I think I left it behind there.", "zh": "昨晚在丹戎巴葛的一家餐厅。我估计是落在那儿了。", "sp": "A"}], [{"id": "s0_8_0", "md": "Okay, I've ==blocked== the card now. Nobody can use it from this point on.", "text": "Okay, I've blocked the card now. Nobody can use it from this point on.", "zh": "好的，卡已经冻结了。从现在起没人能用这张卡。", "sp": "B"}]]}, {"heading": "2. Charges You Didn't Make", "heading_zh": "2. 不是你刷的交易", "rows": [[{"id": "s1_0_0", "md": "I do see two ==transactions== this morning, both online. Did you make those?", "text": "I do see two transactions this morning, both online. Did you make those?", "zh": "我看到今天早上有两笔交易，都是网上的。是您本人消费的吗？", "sp": "B"}], [{"id": "s1_1_0", "md": "What are they? I haven't used the card since last night.", "text": "What are they? I haven't used the card since last night.", "zh": "是什么交易？我从昨晚起就没用过这张卡。", "sp": "A"}], [{"id": "s1_2_0", "md": "One for two hundred and forty dollars at an electronics store, and one for eighteen dollars at a food delivery app.", "text": "One for two hundred and forty dollars at an electronics store, and one for eighteen dollars at a food delivery app.", "zh": "一笔是电器店的二百四十元，一笔是外卖平台的十八元。", "sp": "B"}], [{"id": "s1_3_0", "md": "**Neither of those was me. Can I dispute them?**", "text": "Neither of those was me. Can I dispute them?", "zh": "这两笔都不是我。我能申诉吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Yes. I'll __raise a dispute__ for both and flag them as ==fraud==. You won't be charged while we ==investigate==.", "text": "Yes. I'll raise a dispute for both and flag them as fraud. You won't be charged while we investigate.", "zh": "可以。我给这两笔都提交争议，标记为盗刷。调查期间不会向您收费。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thank you. __How long__ does the investigation usually take?", "text": "Thank you. How long does the investigation usually take?", "zh": "谢谢。调查一般要多久？", "sp": "A"}], [{"id": "s1_6_0", "md": "Usually two to four weeks. We'll update you by email.", "text": "Usually two to four weeks. We'll update you by email.", "zh": "一般两到四周，我们会邮件通知您进展。", "sp": "B"}], [{"id": "s1_7_0", "md": "**And can you send me a replacement card? My phone bill is paid with this one.**", "text": "And can you send me a replacement card? My phone bill is paid with this one.", "zh": "能给我补一张新卡吗？我的手机话费是用这张卡扣的。", "sp": "A"}], [{"id": "s1_8_0", "md": "A new card will arrive in five to seven working days, with a new number. You'll need to __update__ your recurring payments.", "text": "A new card will arrive in five to seven working days, with a new number. You'll need to update your recurring payments.", "zh": "新卡五到七个工作日寄到，卡号会变。您需要更新自动扣款的卡号。", "sp": "B"}], [{"id": "s1_9_0", "md": "Got it. Could I also get a reference number for this call?", "text": "Got it. Could I also get a reference number for this call?", "zh": "明白了。能给我这次来电的参考编号吗？", "sp": "A"}], [{"id": "s1_10_0", "md": "O const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
