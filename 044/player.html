<script>
const D = {"id": "044", "title": "Saying No Without Closing the Door", "meta": "B2 · 约 280 词 · 场景：拒绝请求", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What a Bare No Costs You", "heading_zh": "1. 一句干巴巴的「不」会让你付出什么", "rows": [[{"id": "s0_0_0", "md": "A partner team asks you to build a custom report for their launch next month.", "text": "A partner team asks you to build a custom report for their launch next month.", "zh": "一个合作团队请你为他们下个月的上线做一份定制报表。", "sp": null}, {"id": "s0_0_1", "md": "Your team is already stretched, so you reply, \"Sorry, we don't have the bandwidth.\"", "text": "Your team is already stretched, so you reply, \"Sorry, we don't have the bandwidth.\"", "zh": "你的团队已经忙不过来了，于是你回复：「抱歉，我们没有人力。」", "sp": null}, {"id": "s0_0_2", "md": "It feels efficient, but the other side hears something else.", "text": "It feels efficient, but the other side hears something else.", "zh": "感觉挺高效，但对方听到的是另一回事。", "sp": null}, {"id": "s0_0_3", "md": "They hear that their problem does not matter to you.", "text": "They hear that their problem does not matter to you.", "zh": "他们听到的是：他们的问题在你这儿无所谓。", "sp": null}], [{"id": "s0_1_0", "md": "A bare no has a long memory.", "text": "A bare no has a long memory.", "zh": "一句干巴巴的「不」，别人会记很久。", "sp": null}, {"id": "s0_1_1", "md": "Months later, when you need a favor from that team, someone will ==recall== that you were the person who __shut them down__.", "text": "Months later, when you need a favor from that team, someone will recall that you were the person who shut them down.", "zh": "几个月后，当你需要那个团队帮忙时，会有人想起来你就是当初把他们打发走的那个人。", "sp": null}, {"id": "s0_1_2", "md": "**The words you use to refuse often matter more than the refusal itself.**", "text": "The words you use to refuse often matter more than the refusal itself.", "zh": "你拒绝时用的措辞，往往比拒绝本身更重要。", "sp": null}], [{"id": "s0_2_0", "md": "You will have to say no often as a lead, and that is healthy.", "text": "You will have to say no often as a lead, and that is healthy.", "zh": "作为 lead，你会经常需要说不，这很正常。", "sp": null}, {"id": "s0_2_1", "md": "Protecting your team's ==focus== is part of the job.", "text": "Protecting your team's focus is part of the job.", "zh": "保护团队的专注度本来就是工作的一部分。", "sp": null}, {"id": "s0_2_2", "md": "The skill is to decline the request while keeping the ==relationship== intact.", "text": "The skill is to decline the request while keeping the relationship intact.", "zh": "真正的功夫在于拒绝了请求，关系却还完好无损。", "sp": null}]]}, {"heading": "2. The Shape of a Good No", "heading_zh": "2. 好的拒绝长什么样", "rows": [[{"id": "s1_0_0", "md": "Start by showing that you understood the request.", "text": "Start by showing that you understood the request.", "zh": "先表明你听懂了对方的请求。", "sp": null}, {"id": "s1_0_1", "md": "Repeat their goal in one sentence, so they know you are not ==brushing them off==.", "text": "Repeat their goal in one sentence, so they know you are not brushing them off.", "zh": "用一句话复述他们的目标，让他们知道你不是在敷衍。", "sp": null}, {"id": "s1_0_2", "md": "\"You need launch numbers your leadership can trust by the twentieth.\"", "text": "\"You need launch numbers your leadership can trust by the twentieth.\"", "zh": "「你们需要在二十号之前拿到领导能信得过的上线数据。」", "sp": null}], [{"id": "s1_1_0", "md": "Then give the real reason, briefly and without ==apology== theatre.", "text": "Then give the real reason, briefly and without apology theatre.", "zh": "然后给出真实的理由，简短，别演那种道歉戏码。", "sp": null}, {"id": "s1_1_1", "md": "\"We are __heads down on__ the payment migration until the end of the month.\"", "text": "\"We are heads down on the payment migration until the end of the month.\"", "zh": "「到月底之前我们都在埋头做支付迁移。」", "sp": null}, {"id": "s1_1_2", "md": "One honest reason is more convincing than three weak ones.", "text": "One honest reason is more convincing than three weak ones.", "zh": "一个真实的理由比三个站不住的理由更有说服力。", "sp": null}], [{"id": "s1_2_0", "md": "Now open a door.", "text": "Now open a door.", "zh": "接着，给对方留一扇门。", "sp": null}, {"id": "s1_2_1", "md": "Offer a smaller version, a later date, or a person who can help.", "text": "Offer a smaller version, a later date, or a person who can help.", "zh": "提供一个缩小的版本、一个更晚的时间，或者一个能帮上忙的人。", "sp": null}, {"id": "s1_2_2", "md": "\"We can't build a custom report, but we can __give you access to__ the raw table and an example query today.\"", "text": "\"We can't build a custom report, but we can give you access to the raw table and an example query today.\"", "zh": "「定制报表我们做不了，但今天就可以给你们开原始表的权限，再附一个示例查询。」", "sp": null}, {"id": "s1_2_3", "md": "**A no with an alternative still feels like help.**", "text": "A no with an alternative still feels like help.", "zh": "带着替代方案的拒绝，听起来依然是在帮忙。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, name the condition that would turn it into a yes.", "text": "Finally, name the condition that would turn it into a yes.", "zh": "最后，说清楚在什么条件下会变成同意。", "sp": null}, {"id": "s1_3_1", "md": "\"If this is still needed after the migration, let's __put it on the list__ for next quarter.\"", "text": "\"If this is still needed after the migration, let's put it on the list for next quarter.\"", "zh": "「如果迁移完了你们还需要，我们就把它放进下个季度的清单。」", "sp": null}, {"id": "s1_3_2", "md": "A clear condition shows that the door is closed for now, not ==permanently==.", "text": "A clear condition shows that the door is closed for now, not permanently.", "zh": "一个清楚的条件表明，这扇门只是暂时关上，不是永远关上。", "sp": null}]]}], "gist": [{"q": "简单地回一句 \"We don't have the bandwidth\" 有什么代价？", "a": "对方听到的是「你的问题对我不重要」；几个月后你求他们时，他们会记得你曾经直接回绝。"}, {"q": "一个好的拒绝包括哪几部分？", "a": "先复述对方目标表明理解；给一个真实的简短理由；提供替代方案（缩小版、晚一点或别人能帮）；说明什么条件下能变成 yes。"}, {"q": "为什么只给一个理由？", "a": "一个诚实的理由比三个站不住的理由更有说服力。"}], "dictation": [{"id": "s0_1_2", "text": "The words you use to refuse often matter more than the refusal itself."}, {"id": "s1_1_2", "text": "One honest reason is more convincing than three weak ones."}, {"id": "s1_2_3", "text": "A no with an alternative still feels like help."}, {"id": "s0_2_1", "text": "Protecting your team's focus is part of the job."}], "shadow": {"text": "Now open a door. Offer a smaller version, a later date, or a person who can help.", "marked": "Now <b>open</b> a <b>door</b>. //<br>Offer a <b>smaller</b> version, / a <b>later</b> date, / or a <b>person</b> who can help. //"}, "prompts": [{"q": "隔壁团队请你们帮忙做一次压测，但你们这两周在赶支付迁移。用 30 秒拒绝，但给出替代方案和可以答应的条件。", "ref": "I understand you need confidence in the new service before the sale event. Honestly, we're heads down on the payment migration for the next two weeks, so we can't run the load test ourselves. What we can do is share our test scripts today and spend thirty minutes walking your engineer through them. If you still need us after the migration, I'm happy to put it on our list.", "ref_zh": "我理解你们在大促之前需要对新服务有信心。说实话，接下来两周我们都在埋头做支付迁移，所以压测没法我们自己来跑。我们能做的是今天就把测试脚本共享给你们，再花三十分钟带你们的工程师过一遍。如果迁移完之后你们还需要我们，我很乐意把它排进我们的清单。", "id": "ref0"}, {"q": "你的老板临时问你能不能接一个新的内部工具项目。你认为团队现在接不了。用 30 秒说 no，但不关上门。", "ref": "Thanks for thinking of us, and I can see why this tool matters. Right now, though, taking it on would put the search launch at risk, and that's the commitment we made to the business. My suggestion is that we scope it properly in the next planning cycle. If it's urgent before then, Ken's team built something similar last year, and they might be able to reuse it.", "ref_zh": "谢谢你们想到我们，我也明白这个工具为什么重要。不过现在接下来的话，会让搜索的上线有风险，而那是我们对业务做过的承诺。我的建议是在下一个规划周期里把它好好评估一下范围。如果在那之前就很急，Ken 的团队去年做过一个类似的东西，也许可以直接复用。", "id": "ref1"}], "words": [{"w": "recall", "ipa": "/rɪˈkɔːl/", "zh": "回想起、记得", "ex": "I recall that we had the same timeout issue last spring.", "id": "w0"}, {"w": "focus", "ipa": "/ˈfoʊkəs/", "zh": "专注、重点", "ex": "Our focus this month is the payment migration, nothing else.", "id": "w1"}, {"w": "relationship", "ipa": "/rɪˈleɪʃənʃɪp/", "zh": "关系", "ex": "We have a good working relationship with the data team.", "id": "w2"}, {"w": "brush off", "ipa": "/brʌʃ ɔːf/", "zh": "敷衍、打发", "ex": "I don't want to brush off their concern, so let's set up a call.", "id const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
