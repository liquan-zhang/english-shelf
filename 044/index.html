<script>
const D = {"id": "044", "title": "Saying No Without Closing the Door", "meta": "B2 · 约 280 词 · 场景：拒绝请求", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What a Bare No Costs You", "heading_zh": "1. 一句干巴巴的「不」会让你付出什么", "rows": [[{"id": "s0_0_0", "md": "A partner team asks you to build a custom report for their launch next month.", "text": "A partner team asks you to build a custom report for their launch next month.", "zh": "一个合作团队请你为他们下个月的上线做一份定制报表。", "sp": null}, {"id": "s0_0_1", "md": "Your team is already stretched, so you reply, \"Sorry, we don't have the bandwidth.\"", "text": "Your team is already stretched, so you reply, \"Sorry, we don't have the bandwidth.\"", "zh": "你的团队已经忙不过来了，于是你回复：「抱歉，我们没有人力。」", "sp": null}, {"id": "s0_0_2", "md": "It feels efficient, but the other side hears something else.", "text": "It feels efficient, but the other side hears something else.", "zh": "感觉挺高效，但对方听到的是另一回事。", "sp": null}, {"id": "s0_0_3", "md": "They hear that their problem does not matter to you.", "text": "They hear that their problem does not matter to you.", "zh": "他们听到的是：他们的问题在你这儿无所谓。", "sp": null}], [{"id": "s0_1_0", "md": "A bare no has a long memory.", "text": "A bare no has a long memory.", "zh": "一句干巴巴的「不」，别人会记很久。", "sp": null}, {"id": "s0_1_1", "md": "Months later, when you need a favor from that team, someone will ==recall== that you were the person who __shut them down__.", "text": "Months later, when you need a favor from that team, someone will recall that you were the person who shut them down.", "zh": "几个月后，当你需要那个团队帮忙时，会有人想起来你就是当初把他们打发走的那个人。", "sp": null}, {"id": "s0_1_2", "md": "**The words you use to refuse often matter more than the refusal itself.**", "text": "The words you use to refuse often matter more than the refusal itself.", "zh": "你拒绝时用的措辞，往往比拒绝本身更重要。", "sp": null}], [{"id": "s0_2_0", "md": "You will have to say no often as a lead, and that is healthy.", "text": "You will have to say no often as a lead, and that is healthy.", "zh": "作为 lead，你会经常需要说不，这很正常。", "sp": null}, {"id": "s0_2_1", "md": "Protecting your team's ==focus== is part of the job.", "text": "Protecting your team's focus is part of the job.", "zh": "保护团队的专注度本来就是工作的一部分。", "sp": null}, {"id": "s0_2_2", "md": "The skill is to decline the request while keeping the ==relationship== intact.", "text": "The skill is to decline the request while keeping the relationship intact.", "zh": "真正的功夫在于拒绝了请求，关系却还完好无损。", "sp": null}]]}, {"heading": "2. The Shape of a Good No", "heading_zh": "2. 好的拒绝长什么样", "rows": [[{"id": "s1_0_0", "md": "Start by showing that you understood the request.", "text": "Start by showing that you understood the request.", "zh": "先表明你听懂了对方的请求。", "sp": null}, {"id": "s1_0_1", "md": "Repeat their goal in one sentence, so they know you are not ==brushing them off==.", "text": "Repeat their goal in one sentence, so they know you are not brushing them off.", "zh": "用一句话复述他们的目标，让他们知道你不是在敷衍。", "sp": null}, {"id": "s1_0_2", "md": "\"You need launch numbers your leadership can trust by the twentieth.\"", "text": "\"You need launch numbers your leadership can trust by the twentieth.\"", "zh": "「你们需要在二十号之前拿到领导能信得过的上线数据。」", "sp": null}], [{"id": "s1_1_0", "md": "Then give the real reason, briefly and without ==apology== theatre.", "text": "Then give the real reason, briefly and without apology theatre.", "zh": "然后给出真实的理由，简短，别演那种道歉戏码。", "sp": null}, {"id": "s1_1_1", "md": "\"We are __heads down on__ the payment migration until the end of the month.\"", "text": "\"We are heads down on the payment migration until the end of the month.\"", "zh": "「到月底之前我们都在埋头做支付迁移。」", "sp": null}, {"id": "s1_1_2", "md": "One honest reason is more convincing than three weak ones.", "text": "One honest reason is more convincing than three weak ones.", "zh": "一个真实的理由比三个站不住的理由更有说服力。", "sp": null}], [{"id": "s1_2_0", "md": "Now open a door.", "text": "Now open a door.", "zh": "接着，给对方留一扇门。", "sp": null}, {"id": "s1_2_1", "md": "Offer a smaller version, a later date, or a person who can help.", "text": "Offer a smaller version, a later date, or a person who can help.", "zh": "提供一个缩小的版本、一个更晚的时间，或者一个能帮上忙的人。", "sp": null}, {"id": "s1_2_2", "md": "\"We can't build a custom report, but we can __give you access to__ the raw table and an example query today.\"", "text": "\"We can't build a custom report, but we can give you access to the raw table and an example query today.\"", "zh": "「定制报表我们做不了，但今天就可以给你们开原始表的权限，再附一个示例查询。」", "sp": null}, {"id": "s1_2_3", "md": "**A no with an alternative still feels like help.**", "text": "A no with an alternative still feels like help.", "zh": "带着替代方案的拒绝，听起来依然是在帮忙。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, name the condition that would turn it into a yes.", "text": "Finally, name the condition that would turn it into a yes.", "zh": "最后，说清楚在什么条件下会变成同意。", "sp": null}, {"id": "s1_3_1", "md": "\"If this is still needed after the migration, let's __put it on the list__ for next quarter.\"", "text": "\"If this is still needed after the migration, let's put it on the list for next quarter.\"", "zh": "「如果迁移完了你们还需要，我们就把它放进下个季度的清单。」", "sp": null}, {"id": "s1_3_2", "md": "A clear condition shows that the door is closed for now, not ==permanently==.", "text": "A clear condition shows that the door is closed for now, not permanently.", "zh": "一个清楚的条件表明，这扇门只是暂时关上，不是永远关上。", "sp": null}]]}], "gist": [{"q": "简单地回一句 \"We don't have the bandwidth\" 有什么代价？", "a": "对方听到的是「你的问题对我不重要」；几个月后你求他们时，他们会记得你曾经直接回绝。"}, {"q": "一个好的拒绝包括哪几部分？", "a": "先复述对方目标表明理解；给一个真实的简短理由；提供替代方案（缩小版、晚一点或别人能帮）；说明什么条件下能变成 yes。"}, {"q": "为什么只给一个理由？", "a": "一个诚实的理由比三个站不住的理由更有说服力。"}], "dictation": [{"id": "s0_1_2", "text": "The words you use to refuse often matter more than the refusal itself."}, {"id": "s1_1_2", "text": "One honest reason is more convincing than three weak ones."}, {"id": "s1_2_3", "text": "A no with an alternative still feels like help."}, {"id": "s0_2_1", "text": "Protecting your team's focus is part of the job."}], "shadow": {"text": "Now open a door. Offer a smaller version, a later date, or a person who can help.", "marked": "Now <b>open</b> a <b>door</b>. //<br>Offer a <b>smaller</b> version, / a <b>later</b> date, / or a <b>person</b> who can help. //"}, "prompts": [{"q": "隔壁团队请你们帮忙做一次压测，但你们这两周在赶支付迁移。用 30 秒拒绝，但给出替代方案和可以答应的条件。", "ref": "I understand you need confidence in the new service before the sale event. Honestly, we're heads down on the payment migration for the next two weeks, so we can't run the load test ourselves. What we can do is share our test scripts today and spend thirty minutes walking your engineer through them. If you still need us after the migration, I'm happy to put it on our list.", "ref_zh": "我理解你们在大促之前需要对新服务有信心。说实话，接下来两周我们都在埋头做支付迁移，所以压测没法我们自己来跑。我们能做的是今天就把测试脚本共享给你们，再花三十分钟带你们的工程师过一遍。如果迁移完之后你们还需要我们，我很乐意把它排进我们的清单。", "id": "ref0"}, {"q": "你的老板临时问你能不能接一个新的内部工具项目。你认为团队现在接不了。用 30 秒说 no，但不关上门。", "ref": "Thanks for thinking of us, and I can see why this tool matters. Right now, though, taking it on would put the search launch at risk, and that's the commitment we made to the business. My suggestion is that we scope it properly in the next planning cycle. If it's urgent before then, Ken's team built something similar last year, and they might be able to reuse it.", "ref_zh": "谢谢你们想到我们，我也明白这个工具为什么重要。不过现在接下来的话，会让搜索的上线有风险，而那是我们对业务做过的承诺。我的建议是在下一个规划周期里把它好好评估一下范围。如果在那之前就很急，Ken 的团队去年做过一个类似的东西，也许可以直接复用。", "id": "ref1"}], "words": [{"w": "recall", "ipa": "/rɪˈkɔːl/", "zh": "回想起、记得", "ex": "I recall that we had the same timeout issue last spring.", "id": "w0"}, {"w": "focus", "ipa": "/ˈfoʊkəs/", "zh": "专注、重点", "ex": "Our focus this month is the payment migration, nothing else.", "id": "w1"}, {"w": "relationship", "ipa": "/rɪˈleɪʃənʃɪp/", "zh": "关系", "ex": "We have a good working relationship with the data team.", "id": "w2"}, {"w": "brush off", "ipa": "/brʌʃ ɔːf/", "zh": "敷衍、打发", "ex": "I don't want to brush off their concern, so let's set up a call.", "id const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {

  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
