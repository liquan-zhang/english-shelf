<script>
const D = {"id": "046", "title": "When Another Team Misses Their Deadline", "meta": "B2 · 约 260 词 · 场景：依赖延期", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Message Nobody Wants", "heading_zh": "1. 没人想收到的消息", "rows": [[{"id": "s0_0_0", "md": "Two days before your release, the identity team writes, \"Sorry, the new login service will be late.\"", "text": "Two days before your release, the identity team writes, \"Sorry, the new login service will be late.\"", "zh": "离你的发布还有两天，账号团队发来消息：「抱歉，新的登录服务要延期了。」", "sp": null}, {"id": "s0_0_1", "md": "Your feature depends on it, your stakeholders expect a launch, and your team is already frustrated.", "text": "Your feature depends on it, your stakeholders expect a launch, and your team is already frustrated.", "zh": "你的功能依赖它，你的干系人都在等上线，你的团队已经很烦躁了。", "sp": null}, {"id": "s0_0_2", "md": "The tempting reaction is to __vent in the group chat__ or forward the message to your manager with a sharp comment.", "text": "The tempting reaction is to vent in the group chat or forward the message to your manager with a sharp comment.", "zh": "这时候最想做的，是在群里发泄一通，或者把消息转给你老板，再附上一句难听的评论。", "sp": null}], [{"id": "s0_1_0", "md": "Resist both.", "text": "Resist both.", "zh": "两样都忍住。", "sp": null}, {"id": "s0_1_1", "md": "Blame feels good for about ten minutes, and then it makes everything harder.", "text": "Blame feels good for about ten minutes, and then it makes everything harder.", "zh": "甩锅大概能爽十分钟，然后一切都会变得更难办。", "sp": null}, {"id": "s0_1_2", "md": "The other team will become ==defensive==, share less, and protect themselves instead of helping you.", "text": "The other team will become defensive, share less, and protect themselves instead of helping you.", "zh": "对方团队会变得防备，信息给得更少，忙着保护自己而不是帮你。", "sp": null}], [{"id": "s0_2_0", "md": "**A missed deadline is a planning problem first, and a people problem much later, if ever.**", "text": "A missed deadline is a planning problem first, and a people problem much later, if ever.", "zh": "错过 deadline 首先是个规划问题，就算是人的问题，那也是很久以后的事，甚至可能根本不是。", "sp": null}, {"id": "s0_2_1", "md": "Your real job right now is to replace a ==broken== date with a ==reliable== one.", "text": "Your real job right now is to replace a broken date with a reliable one.", "zh": "你现在真正要做的，是把一个已经失效的日期换成一个靠谱的日期。", "sp": null}]]}, {"heading": "2. Re-plan Before You React", "heading_zh": "2. 先重新规划，再做反应", "rows": [[{"id": "s1_0_0", "md": "Start with two calm questions.", "text": "Start with two calm questions.", "zh": "先冷静地问两个问题。", "sp": null}, {"id": "s1_0_1", "md": "\"What is the new date, and how confident are you in it?\"", "text": "\"What is the new date, and how confident are you in it?\"", "zh": "「新的日期是什么时候？你们对这个日期有多大把握？」", "sp": null}, {"id": "s1_0_2", "md": "The second question matters more, because a date with low ==confidence== is just a hope.", "text": "The second question matters more, because a date with low confidence is just a hope.", "zh": "第二个问题更重要，因为一个没把握的日期只是个愿望。", "sp": null}], [{"id": "s1_1_0", "md": "Next, ask what is blocking them.", "text": "Next, ask what is blocking them.", "zh": "接着，问问是什么卡住了他们。", "sp": null}, {"id": "s1_1_1", "md": "Sometimes the answer is something you can __help with__, like test data or a review from your side.", "text": "Sometimes the answer is something you can help with, like test data or a review from your side.", "zh": "有时候答案是你能帮上忙的，比如测试数据，或者你这边的一个 review。", "sp": null}, {"id": "s1_1_2", "md": "Offering help early turns you from a victim into a partner.", "text": "Offering help early turns you from a victim into a partner.", "zh": "早点主动提供帮助，能让你从受害者变成合作伙伴。", "sp": null}], [{"id": "s1_2_0", "md": "While they work on their part, __build a plan B__ for yours.", "text": "While they work on their part, build a plan B for yours.", "zh": "在他们搞定自己那部分的同时，你给自己这部分准备一个 B 计划。", "sp": null}, {"id": "s1_2_1", "md": "Could you ship behind a feature flag and switch it on later?", "text": "Could you ship behind a feature flag and switch it on later?", "zh": "能不能先藏在 feature flag 后面发出去，之后再打开？", "sp": null}, {"id": "s1_2_2", "md": "Could you launch with the old login flow for now?", "text": "Could you launch with the old login flow for now?", "zh": "能不能先用老的登录流程上线？", "sp": null}, {"id": "s1_2_3", "md": "**Never let another team's date be the only thing standing between you and a launch.**", "text": "Never let another team's date be the only thing standing between you and a launch.", "zh": "永远别让另一个团队的日期成为你和上线之间唯一的障碍。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, update your stakeholders with facts, not feelings.", "text": "Finally, update your stakeholders with facts, not feelings.", "zh": "最后，向干系人同步事实，而不是情绪。", "sp": null}, {"id": "s1_3_1", "md": "Explain the new date, its confidence, and your fallback.", "text": "Explain the new date, its confidence, and your fallback.", "zh": "讲清楚新日期、把握有多大，以及你的兜底方案。", "sp": null}, {"id": "s1_3_2", "md": "If the dependency slips again, then escalate, but bring the ==timeline== and options, not ==accusations==.", "text": "If the dependency slips again, then escalate, but bring the timeline and options, not accusations.", "zh": "如果依赖方又延期了，那就升级，但要带着时间线和选项去，而不是带着指责。", "sp": null}]]}], "gist": [{"q": "依赖方延期时，作者不建议做什么？为什么？", "a": "不要在群里发泄或带着情绪转给老板；指责只让对方变得防御，少共享信息，只顾自保。"}, {"q": "作者建议先问对方哪两个问题？哪个更重要？", "a": "新的日期是什么、你们有多大把握；第二个更重要，没有把握的日期只是愿望。"}, {"q": "等对方的同时，你自己该做什么？", "a": "准备 plan B，比如用功能开关先上线再打开，或先用旧登录流程；向干系人同步事实、新日期、把握度和备选方案；再次延期才升级，带时间线和选项而非指责。"}], "dictation": [{"id": "s0_2_0", "text": "A missed deadline is a planning problem first, and a people problem much later, if ever."}, {"id": "s1_0_2", "text": "The second question matters more, because a date with low confidence is just a hope."}, {"id": "s1_2_3", "text": "Never let another team's date be the only thing standing between you and a launch."}, {"id": "s1_1_2", "text": "Offering help early turns you from a victim into a partner."}], "shadow": {"text": "Start with two calm questions. \"What is the new date, and how confident are you in it?\" The second question matters more, because a date with low confidence is just a hope.", "marked": "Start with two <b>calm</b> questions. //<br>\"What is the <b>new</b> date, / and how <b>confident</b> are you in it?\" //<br>The <b>second</b> question matters more, / because a date with <b>low</b> confidence / is just a <b>hope</b>. //"}, "prompts": [{"q": "支付团队告诉你他们的接口要晚一周交付，而你们下周要上线。用 30 秒回复对方：不指责，问清新日期和把握度，并主动提供帮助。", "ref": "Thanks for the heads-up, I appreciate hearing it now rather than on launch day. Can you help me understand two things? What's the new date, and how confident are you in it? Also, is anything blocking you that we could help with? We can lend you an engineer for testing, or prepare the mock data you need.", "ref_zh": "谢谢提前告诉我，现在知道总比上线当天才知道好。能帮我搞清楚两件事吗？新日期是哪天，你们有多大把握？另外，有没有什么卡住你们、是我们能帮上忙的？我们可以借一个工程师给你们做测试，或者准备你们需要的 mock 数据。", "id": "ref0"}, {"q": "依赖延期导致你们的上线要推迟。用 30 秒向业务方同步：事实、新日期、把握度和你的备选方案。", "ref": "Quick update on the checkout launch. The new login service we depend on is running about a week late. Their new date is the fourteenth, and they're fairly confident, since the remaining work is mostly testing. In the meantime, we'll ship our part behind a feature flag, so we can switch it on the same day their service is ready. If their date slips again, I'll flag it immediately.", "ref_zh": "同步一下结账功能上线的情况。我们依赖的新登录服务大概要晚一周。他们的新日期是十四号，把握还比较大，因为剩下的主要是测试工作。在这期间，我们会先把我们这部分藏在 feature flag 后面发出去，这样他们的服务一就绪，我们当天就能打开。如果他们的日期再延，我会第一时间同步。", "id": "ref1"}], "words": [{"w": "defensive", "ipa": "/dɪˈfensɪv/", "zh": "防御性的、戒备的", "ex": "He got defensive when we asked why the tests were skipped.", "id": "w0"}, {"w": "broken", "ipa": "/ˈbroʊkən/", "zh": "失效的、坏掉的", "ex": "The old date is broken, so let's agree on a new one.", "id": "w1"}, {"w": "reliable", "ipa": "/rɪˈlaɪəbl/", "zh": "可靠的", "ex": "We need a reliable estimate, not an optimistic one.", "id": "w2"}, {"w": "confidence", "ipa": "/ˈkɑːnfɪdəns/", "zh": "把握、信心", "ex": "How much co const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
