<script>
const D = {"id": "046", "title": "When Another Team Misses Their Deadline", "meta": "B2 · 约 260 词 · 场景：依赖延期", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Message Nobody Wants", "heading_zh": "1. 没人想收到的消息", "rows": [[{"id": "s0_0_0", "md": "Two days before your release, the identity team writes, \"Sorry, the new login service will be late.\"", "text": "Two days before your release, the identity team writes, \"Sorry, the new login service will be late.\"", "zh": "离你的发布还有两天，账号团队发来消息：「抱歉，新的登录服务要延期了。」", "sp": null}, {"id": "s0_0_1", "md": "Your feature depends on it, your stakeholders expect a launch, and your team is already frustrated.", "text": "Your feature depends on it, your stakeholders expect a launch, and your team is already frustrated.", "zh": "你的功能依赖它，你的干系人都在等上线，你的团队已经很烦躁了。", "sp": null}, {"id": "s0_0_2", "md": "The tempting reaction is to __vent in the group chat__ or forward the message to your manager with a sharp comment.", "text": "The tempting reaction is to vent in the group chat or forward the message to your manager with a sharp comment.", "zh": "这时候最想做的，是在群里发泄一通，或者把消息转给你老板，再附上一句难听的评论。", "sp": null}], [{"id": "s0_1_0", "md": "Resist both.", "text": "Resist both.", "zh": "两样都忍住。", "sp": null}, {"id": "s0_1_1", "md": "Blame feels good for about ten minutes, and then it makes everything harder.", "text": "Blame feels good for about ten minutes, and then it makes everything harder.", "zh": "甩锅大概能爽十分钟，然后一切都会变得更难办。", "sp": null}, {"id": "s0_1_2", "md": "The other team will become ==defensive==, share less, and protect themselves instead of helping you.", "text": "The other team will become defensive, share less, and protect themselves instead of helping you.", "zh": "对方团队会变得防备，信息给得更少，忙着保护自己而不是帮你。", "sp": null}], [{"id": "s0_2_0", "md": "**A missed deadline is a planning problem first, and a people problem much later, if ever.**", "text": "A missed deadline is a planning problem first, and a people problem much later, if ever.", "zh": "错过 deadline 首先是个规划问题，就算是人的问题，那也是很久以后的事，甚至可能根本不是。", "sp": null}, {"id": "s0_2_1", "md": "Your real job right now is to replace a ==broken== date with a ==reliable== one.", "text": "Your real job right now is to replace a broken date with a reliable one.", "zh": "你现在真正要做的，是把一个已经失效的日期换成一个靠谱的日期。", "sp": null}]]}, {"heading": "2. Re-plan Before You React", "heading_zh": "2. 先重新规划，再做反应", "rows": [[{"id": "s1_0_0", "md": "Start with two calm questions.", "text": "Start with two calm questions.", "zh": "先冷静地问两个问题。", "sp": null}, {"id": "s1_0_1", "md": "\"What is the new date, and how confident are you in it?\"", "text": "\"What is the new date, and how confident are you in it?\"", "zh": "「新的日期是什么时候？你们对这个日期有多大把握？」", "sp": null}, {"id": "s1_0_2", "md": "The second question matters more, because a date with low ==confidence== is just a hope.", "text": "The second question matters more, because a date with low confidence is just a hope.", "zh": "第二个问题更重要，因为一个没把握的日期只是个愿望。", "sp": null}], [{"id": "s1_1_0", "md": "Next, ask what is blocking them.", "text": "Next, ask what is blocking them.", "zh": "接着，问问是什么卡住了他们。", "sp": null}, {"id": "s1_1_1", "md": "Sometimes the answer is something you can __help with__, like test data or a review from your side.", "text": "Sometimes the answer is something you can help with, like test data or a review from your side.", "zh": "有时候答案是你能帮上忙的，比如测试数据，或者你这边的一个 review。", "sp": null}, {"id": "s1_1_2", "md": "Offering help early turns you from a victim into a partner.", "text": "Offering help early turns you from a victim into a partner.", "zh": "早点主动提供帮助，能让你从受害者变成合作伙伴。", "sp": null}], [{"id": "s1_2_0", "md": "While they work on their part, __build a plan B__ for yours.", "text": "While they work on their part, build a plan B for yours.", "zh": "在他们搞定自己那部分的同时，你给自己这部分准备一个 B 计划。", "sp": null}, {"id": "s1_2_1", "md": "Could you ship behind a feature flag and switch it on later?", "text": "Could you ship behind a feature flag and switch it on later?", "zh": "能不能先藏在 feature flag 后面发出去，之后再打开？", "sp": null}, {"id": "s1_2_2", "md": "Could you launch with the old login flow for now?", "text": "Could you launch with the old login flow for now?", "zh": "能不能先用老的登录流程上线？", "sp": null}, {"id": "s1_2_3", "md": "**Never let another team's date be the only thing standing between you and a launch.**", "text": "Never let another team's date be the only thing standing between you and a launch.", "zh": "永远别让另一个团队的日期成为你和上线之间唯一的障碍。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, update your stakeholders with facts, not feelings.", "text": "Finally, update your stakeholders with facts, not feelings.", "zh": "最后，向干系人同步事实，而不是情绪。", "sp": null}, {"id": "s1_3_1", "md": "Explain the new date, its confidence, and your fallback.", "text": "Explain the new date, its confidence, and your fallback.", "zh": "讲清楚新日期、把握有多大，以及你的兜底方案。", "sp": null}, {"id": "s1_3_2", "md": "If the dependency slips again, then escalate, but bring the ==timeline== and options, not ==accusations==.", "text": "If the dependency slips again, then escalate, but bring the timeline and options, not accusations.", "zh": "如果依赖方又延期了，那就升级，但要带着时间线和选项去，而不是带着指责。", "sp": null}]]}], "gist": [{"q": "依赖方延期时，作者不建议做什么？为什么？", "a": "不要在群里发泄或带着情绪转给老板；指责只让对方变得防御，少共享信息，只顾自保。"}, {"q": "作者建议先问对方哪两个问题？哪个更重要？", "a": "新的日期是什么、你们有多大把握；第二个更重要，没有把握的日期只是愿望。"}, {"q": "等对方的同时，你自己该做什么？", "a": "准备 plan B，比如用功能开关先上线再打开，或先用旧登录流程；向干系人同步事实、新日期、把握度和备选方案；再次延期才升级，带时间线和选项而非指责。"}], "dictation": [{"id": "s0_2_0", "text": "A missed deadline is a planning problem first, and a people problem much later, if ever."}, {"id": "s1_0_2", "text": "The second question matters more, because a date with low confidence is just a hope."}, {"id": "s1_2_3", "text": "Never let another team's date be the only thing standing between you and a launch."}, {"id": "s1_1_2", "text": "Offering help early turns you from a victim into a partner."}], "shadow": {"text": "Start with two calm questions. \"What is the new date, and how confident are you in it?\" The second question matters more, because a date with low confidence is just a hope.", "marked": "Start with two <b>calm</b> questions. //<br>\"What is the <b>new</b> date, / and how <b>confident</b> are you in it?\" //<br>The <b>second</b> question matters more, / because a date with <b>low</b> confidence / is just a <b>hope</b>. //"}, "prompts": [{"q": "支付团队告诉你他们的接口要晚一周交付，而你们下周要上线。用 30 秒回复对方：不指责，问清新日期和把握度，并主动提供帮助。", "ref": "Thanks for the heads-up, I appreciate hearing it now rather than on launch day. Can you help me understand two things? What's the new date, and how confident are you in it? Also, is anything blocking you that we could help with? We can lend you an engineer for testing, or prepare the mock data you need.", "ref_zh": "谢谢提前告诉我，现在知道总比上线当天才知道好。能帮我搞清楚两件事吗？新日期是哪天，你们有多大把握？另外，有没有什么卡住你们、是我们能帮上忙的？我们可以借一个工程师给你们做测试，或者准备你们需要的 mock 数据。", "id": "ref0"}, {"q": "依赖延期导致你们的上线要推迟。用 30 秒向业务方同步：事实、新日期、把握度和你的备选方案。", "ref": "Quick update on the checkout launch. The new login service we depend on is running about a week late. Their new date is the fourteenth, and they're fairly confident, since the remaining work is mostly testing. In the meantime, we'll ship our part behind a feature flag, so we can switch it on the same day their service is ready. If their date slips again, I'll flag it immediately.", "ref_zh": "同步一下结账功能上线的情况。我们依赖的新登录服务大概要晚一周。他们的新日期是十四号，把握还比较大，因为剩下的主要是测试工作。在这期间，我们会先把我们这部分藏在 feature flag 后面发出去，这样他们的服务一就绪，我们当天就能打开。如果他们的日期再延，我会第一时间同步。", "id": "ref1"}], "words": [{"w": "defensive", "ipa": "/dɪˈfensɪv/", "zh": "防御性的、戒备的", "ex": "He got defensive when we asked why the tests were skipped.", "id": "w0"}, {"w": "broken", "ipa": "/ˈbroʊkən/", "zh": "失效的、坏掉的", "ex": "The old date is broken, so let's agree on a new one.", "id": "w1"}, {"w": "reliable", "ipa": "/rɪˈlaɪəbl/", "zh": "可靠的", "ex": "We need a reliable estimate, not an optimistic one.", "id": "w2"}, {"w": "confidence", "ipa": "/ˈkɑːnfɪdəns/", "zh": "把握、信心", "ex": "How much co usations==.", "zh": "如果依赖方又延期了，那就升级，但要带着时间线和选项去，而不是带着指责。", "sp": null, "gap": false, "start": 92.256, "end": 99.264, "words": [[92.361, 92.493], [92.506, 92.585], [92.598, 93.19], [93.203, 93.559], [93.572, 94.019], [94.348, 94.559], [94.572, 95.23], [95.493, 95.638], [95.651, 95.888], [95.901, 96.006], [96.019, 96.69], [96.703, 96.835], [96.848, 97.506], [97.769, 97.993], [98.006, 98.874]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
