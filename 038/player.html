<script>
const D = {"id": "038", "title": "Escalating Without Burning Bridges", "meta": "B2 · 约 260 词 · 场景：跨团队问题升级", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What Escalation Really Is", "heading_zh": "1. 升级到底是什么", "rows": [[{"id": "s0_0_0", "md": "For two weeks, you have been waiting for another team to fix a bug that blocks your launch.", "text": "For two weeks, you have been waiting for another team to fix a bug that blocks your launch.", "zh": "两周了，你一直在等另一个团队修一个卡住你们上线的 bug。", "sp": null}, {"id": "s0_0_1", "md": "Polite reminders in the chat have gone nowhere.", "text": "Polite reminders in the chat have gone nowhere.", "zh": "在群里客客气气地催了几次，都石沉大海。", "sp": null}, {"id": "s0_0_2", "md": "You know it is time to ==escalate==, but it feels like __going behind someone's back__.", "text": "You know it is time to escalate, but it feels like going behind someone's back.", "zh": "你知道是时候往上升级了，但总觉得这像是在背后告状。", "sp": null}], [{"id": "s0_1_0", "md": "Escalation feels personal because we treat it as a complaint.", "text": "Escalation feels personal because we treat it as a complaint.", "zh": "升级之所以让人觉得针对个人，是因为我们把它当成了投诉。", "sp": null}, {"id": "s0_1_1", "md": "**A good escalation is not a complaint about a person; it is a request for a decision that neither of you can make alone.**", "text": "A good escalation is not a complaint about a person; it is a request for a decision that neither of you can make alone.", "zh": "好的升级不是投诉某个人；而是请别人来做一个你们俩谁都定不了的决定。", "sp": null}, {"id": "s0_1_2", "md": "Usually the other team is not lazy; they have ==conflicting== priorities from their own leadership.", "text": "Usually the other team is not lazy; they have conflicting priorities from their own leadership.", "zh": "通常对方团队并不是偷懒；他们有来自自己领导的、相互冲突的优先级。", "sp": null}, {"id": "s0_1_3", "md": "Your bug is simply losing to something their boss cares about more.", "text": "Your bug is simply losing to something their boss cares about more.", "zh": "你的 bug 只是排在了他们老板更在意的事情后面。", "sp": null}], [{"id": "s0_2_0", "md": "Seen this way, escalating actually helps them.", "text": "Seen this way, escalating actually helps them.", "zh": "这么一看，升级其实是在帮他们。", "sp": null}, {"id": "s0_2_1", "md": "It __takes the pressure off__ the engineer stuck in the middle.", "text": "It takes the pressure off the engineer stuck in the middle.", "zh": "它能给夹在中间的那位工程师减压。", "sp": null}, {"id": "s0_2_2", "md": "It also puts the choice in front of someone with the ==mandate== to make it, instead of leaving two teams to argue forever.", "text": "It also puts the choice in front of someone with the mandate to make it, instead of leaving two teams to argue forever.", "zh": "它还能把这个选择交给有权拍板的人，而不是让两个团队无休止地扯皮。", "sp": null}]]}, {"heading": "2. No Surprises", "heading_zh": "2. 不要搞突然袭击", "rows": [[{"id": "s1_0_0", "md": "**Tell the other person before you escalate, and invite them to join.**", "text": "Tell the other person before you escalate, and invite them to join.", "zh": "升级之前先告诉对方，并邀请他一起参与。", "sp": null}, {"id": "s1_0_1", "md": "\"I think we need our managers to decide between your roadmap item and our launch; can we write it up together?\"", "text": "\"I think we need our managers to decide between your roadmap item and our launch; can we write it up together?\"", "zh": "「我觉得需要我们俩的经理来决定，是先做你们 roadmap 上的事还是先保我们的上线；我们一起写个说明好吗？」", "sp": null}, {"id": "s1_0_2", "md": "This turns a potential ==ambush== into a shared problem.", "text": "This turns a potential ambush into a shared problem.", "zh": "这样，一场可能的突然袭击就变成了双方共同的问题。", "sp": null}], [{"id": "s1_1_0", "md": "Keep the write-up short and ==neutral==.", "text": "Keep the write-up short and neutral.", "zh": "说明要写得简短、中立。", "sp": null}, {"id": "s1_1_1", "md": "State the impact on each side, the options, and the date you need an answer.", "text": "State the impact on each side, the options, and the date you need an answer.", "zh": "写清楚对双方各自的影响、有哪些选项，以及你需要在哪天之前得到答复。", "sp": null}, {"id": "s1_1_2", "md": "Avoid ==loaded== words like \"ignored\" or \"refused,\" which make readers __pick sides__ instead of solving the problem.", "text": "Avoid loaded words like \"ignored\" or \"refused,\" which make readers pick sides instead of solving the problem.", "zh": "避免用「无视」「拒绝」这类带情绪的词，它们会让读的人去站队，而不是去解决问题。", "sp": null}], [{"id": "s1_2_0", "md": "After the decision, thank the other team, whatever the result.", "text": "After the decision, thank the other team, whatever the result.", "zh": "不管结果如何，决定出来后都要谢谢对方团队。", "sp": null}, {"id": "s1_2_1", "md": "If the call goes against you, accept it and __plan around it__.", "text": "If the call goes against you, accept it and plan around it.", "zh": "如果结果对你不利，就接受它，然后围绕它重新规划。", "sp": null}, {"id": "s1_2_2", "md": "You will work with these people again next quarter, and they will remember exactly how you handled this one.", "text": "You will work with these people again next quarter, and they will remember exactly how you handled this one.", "zh": "下个季度你们还要一起共事，而他们会清清楚楚地记得你这次是怎么处理的。", "sp": null}]]}], "gist": [{"q": "为什么升级问题会让人觉得像「背后告状」？作者怎么重新定义它？", "a": "因为我们把升级当成投诉；作者认为好的升级是请上级做一个双方都做不了的决定，对方往往只是有冲突的优先级。"}, {"q": "为什么说升级其实也帮了对方？", "a": "它减轻了夹在中间的工程师的压力，把选择交给有权决定的人，而不是让两个团队一直争下去。"}, {"q": "升级时怎样不伤关系？", "a": "升级前先告诉对方并邀请一起写；文字简短中立，写清双方影响、选项和需要答复的日期，避免「无视」「拒绝」这类带情绪的词；结果出来后感谢对方，结果不利也接受。"}], "dictation": [{"id": "s0_1_1", "text": "A good escalation is not a complaint about a person; it is a request for a decision that neither of you can make alone."}, {"id": "s1_0_0", "text": "Tell the other person before you escalate, and invite them to join."}, {"id": "s0_1_0", "text": "Escalation feels personal because we treat it as a complaint."}, {"id": "s1_1_1", "text": "State the impact on each side, the options, and the date you need an answer."}], "shadow": {"text": "Escalation feels personal because we treat it as a complaint. A good escalation is not a complaint about a person; it is a request for a decision that neither of you can make alone.", "marked": "Escalation feels <b>personal</b> / because we treat it as a <b>complaint</b>. //<br>A good escalation / is <b>not</b> a complaint about a <b>person</b>; / it is a request for a <b>decision</b> / that <b>neither</b> of you / can make <b>alone</b>. //"}, "prompts": [{"q": "另一个团队的工程师一直没修阻塞你们上线的 bug。你决定升级，先私下跟他说一声。用 30 秒说明你要升级、为什么、并邀请他一起写。", "ref": "Hey, I wanted to talk to you before I do anything. I know you're stuck between our bug and your team's migration, and that's not your fault. I think it's a priority call that neither of us can make. Would you be okay if we wrote a short note to both our managers together, laying out the two options and the launch date? That way nobody feels surprised.", "ref_zh": "嘿，我想在做任何动作之前先跟你聊聊。我知道你夹在我们的 bug 和你们团队的迁移之间，这不是你的错。我觉得这是一个优先级的问题，我们俩谁都定不了。我们一起给双方的经理写个简短的说明，把两个选项和上线日期列清楚，你看行吗？这样谁都不会觉得突然。", "id": "ref0"}, {"q": "你在写给两位经理的升级说明，口头先跟自己的经理过一遍：用中立的语言讲清楚影响、选项和需要答复的时间。", "ref": "Here's the summary I'm planning to send. The login bug in the identity service blocks our launch on the fifteenth. The identity team is focused on their migration, which also has a hard deadline. Option one, they spend two days on our fix and the migration moves by two days. Option two, we launch without single sign-on and add it in the next release. We need a decision by Friday.", "ref_zh": "这是我打算发出去的总结。身份服务里的登录 bug 卡住了我们十五号的上线。身份团队正在全力做他们的迁移，那个也有硬性的 deadline。方案一，他们花两天修我们的问题，迁移顺延两天。方案二，我们先不带单点登录上线，下个版本再加上。我们需要在周五前拿到决定。", "id": "ref1"}], "words": [{"w": "escalate", "ipa": "/ˈeskəleɪt/", "zh": "（向上）升级问题", "ex": "If we don't hear back by Friday, I'll escalate to their director.", "id": "w0"}, {"w": "conflicting", "ipa": "/kənˈflɪktɪŋ/", "zh": "相互冲突的", "ex": "The two teams got conflicting instructions about the launch date.", "id": "w1"}, {"w": "mandate", "ipa": "/ˈmændeɪt/", "zh": "授权、职权范围", "ex": "Our team doesn't have the mandate to change their API.", "id": "w2"}, {"w": "ambush", "ipa": "/ˈæmbʊʃ/", "zh": "突然袭击", "ex": "Raising it first in the big meeting would feel like an ambush.", " 1.766, 72.029], [72.042, 72.134], [72.148, 72.345], [72.358, 72.437], [72.45, 72.924]]}, {"kind": "s", "id": "s1_1_2", "md": "Avoid ==loaded== words like \"ignored\" or \"refused,\" which make readers __pick sides__ instead of solving the problem.", "zh": "避免用「无视」「拒绝」这类带情绪的词，它们会让读的人去站队，而不是去解决问题。", "sp": null, "gap": false, "start": 73.32, "end": 80.568, "words": [[73.412, 73.82], [73.833, 74.188], [74.202, 74.57], [74.583, 74.833], [74.965, 75.649], [75.873, 76.083], [76.109, 76.846], [77.149, 77.32], [77.333, 77.57], [77.583, 77.991], [78.004, 78.267], [78.281, 78.715], [78.728, 79.202], [79.215, 79.294], [79.307, 79.662], [79.675, 79.741], [79.754, 80.188]]}, {"kind": "s", "id": "s1_2_0", "md": "After the decision, thank the other team, whatever the result.", "zh": "不管结果如何，决定出来后都要谢谢对方团队。", "sp": null, "gap": true, "start": 80.568, "end": 84.648, "words": [[80.673, 80.923], [80.936, 81.029], [81.042, 81.581], [81.976, 82.239], [82.252, 82.384], [82.397, 82.594], [82.607, 83.002], [83.318, 83.634], [83.647, 83.739], [83.752, 84.265]]}, {"kind": "s", "id": "s1_2_1", "md": "If the call goes against you, accept it and __plan around it__.", "zh": "如果结果对你不利，就接受它，然后围绕它重新规划。", "sp": null, "gap": false, "start": 84.648, "end": 88.56, "words": [[84.753, 84.858], [84.872, 84.951], [84.964, 85.214], [85.227, 85.477], [85.49, 85.872], [85.885, 86.056], [86.477, 86.885], [86.898, 87.043], [87.24, 87.332], [87.345, 87.622], [87.635, 87.977], [87.99, 88.161]]}, {"kind": "s", "id": "s1_2_2", "md": "You will work with these people again next quarter, and they will remember exactly how you handled this one.", "zh": "下个季度你们还要一起共事，而他们会清清楚楚地记得你这次是怎么处理的。", "sp": null, "gap": false, "start": 88.56, "end": 94.512, "words": [[88.678, 88.771], [88.784, 88.915], [88.928, 89.165], [89.178, 89.323], [89.336, 89.547], [89.56, 89.915], [89.928, 90.271], [90.284, 90.56], [90.573, 91.007], [91.442, 91.494], [91.507, 91.626], [91.639, 91.81], [91.823, 92.297], [92.31, 92.981], [92.994, 93.126], [93.139, 93.297], [93.31, 93.678], [93.692, 93.876], [93.889, 94.126]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
