<script>
const D = {"id": "038", "title": "Escalating Without Burning Bridges", "meta": "B2 · 约 260 词 · 场景：跨团队问题升级", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What Escalation Really Is", "heading_zh": "1. 升级到底是什么", "rows": [[{"id": "s0_0_0", "md": "For two weeks, you have been waiting for another team to fix a bug that blocks your launch.", "text": "For two weeks, you have been waiting for another team to fix a bug that blocks your launch.", "zh": "两周了，你一直在等另一个团队修一个卡住你们上线的 bug。", "sp": null}, {"id": "s0_0_1", "md": "Polite reminders in the chat have gone nowhere.", "text": "Polite reminders in the chat have gone nowhere.", "zh": "在群里客客气气地催了几次，都石沉大海。", "sp": null}, {"id": "s0_0_2", "md": "You know it is time to ==escalate==, but it feels like __going behind someone's back__.", "text": "You know it is time to escalate, but it feels like going behind someone's back.", "zh": "你知道是时候往上升级了，但总觉得这像是在背后告状。", "sp": null}], [{"id": "s0_1_0", "md": "Escalation feels personal because we treat it as a complaint.", "text": "Escalation feels personal because we treat it as a complaint.", "zh": "升级之所以让人觉得针对个人，是因为我们把它当成了投诉。", "sp": null}, {"id": "s0_1_1", "md": "**A good escalation is not a complaint about a person; it is a request for a decision that neither of you can make alone.**", "text": "A good escalation is not a complaint about a person; it is a request for a decision that neither of you can make alone.", "zh": "好的升级不是投诉某个人；而是请别人来做一个你们俩谁都定不了的决定。", "sp": null}, {"id": "s0_1_2", "md": "Usually the other team is not lazy; they have ==conflicting== priorities from their own leadership.", "text": "Usually the other team is not lazy; they have conflicting priorities from their own leadership.", "zh": "通常对方团队并不是偷懒；他们有来自自己领导的、相互冲突的优先级。", "sp": null}, {"id": "s0_1_3", "md": "Your bug is simply losing to something their boss cares about more.", "text": "Your bug is simply losing to something their boss cares about more.", "zh": "你的 bug 只是排在了他们老板更在意的事情后面。", "sp": null}], [{"id": "s0_2_0", "md": "Seen this way, escalating actually helps them.", "text": "Seen this way, escalating actually helps them.", "zh": "这么一看，升级其实是在帮他们。", "sp": null}, {"id": "s0_2_1", "md": "It __takes the pressure off__ the engineer stuck in the middle.", "text": "It takes the pressure off the engineer stuck in the middle.", "zh": "它能给夹在中间的那位工程师减压。", "sp": null}, {"id": "s0_2_2", "md": "It also puts the choice in front of someone with the ==mandate== to make it, instead of leaving two teams to argue forever.", "text": "It also puts the choice in front of someone with the mandate to make it, instead of leaving two teams to argue forever.", "zh": "它还能把这个选择交给有权拍板的人，而不是让两个团队无休止地扯皮。", "sp": null}]]}, {"heading": "2. No Surprises", "heading_zh": "2. 不要搞突然袭击", "rows": [[{"id": "s1_0_0", "md": "**Tell the other person before you escalate, and invite them to join.**", "text": "Tell the other person before you escalate, and invite them to join.", "zh": "升级之前先告诉对方，并邀请他一起参与。", "sp": null}, {"id": "s1_0_1", "md": "\"I think we need our managers to decide between your roadmap item and our launch; can we write it up together?\"", "text": "\"I think we need our managers to decide between your roadmap item and our launch; can we write it up together?\"", "zh": "「我觉得需要我们俩的经理来决定，是先做你们 roadmap 上的事还是先保我们的上线；我们一起写个说明好吗？」", "sp": null}, {"id": "s1_0_2", "md": "This turns a potential ==ambush== into a shared problem.", "text": "This turns a potential ambush into a shared problem.", "zh": "这样，一场可能的突然袭击就变成了双方共同的问题。", "sp": null}], [{"id": "s1_1_0", "md": "Keep the write-up short and ==neutral==.", "text": "Keep the write-up short and neutral.", "zh": "说明要写得简短、中立。", "sp": null}, {"id": "s1_1_1", "md": "State the impact on each side, the options, and the date you need an answer.", "text": "State the impact on each side, the options, and the date you need an answer.", "zh": "写清楚对双方各自的影响、有哪些选项，以及你需要在哪天之前得到答复。", "sp": null}, {"id": "s1_1_2", "md": "Avoid ==loaded== words like \"ignored\" or \"refused,\" which make readers __pick sides__ instead of solving the problem.", "text": "Avoid loaded words like \"ignored\" or \"refused,\" which make readers pick sides instead of solving the problem.", "zh": "避免用「无视」「拒绝」这类带情绪的词，它们会让读的人去站队，而不是去解决问题。", "sp": null}], [{"id": "s1_2_0", "md": "After the decision, thank the other team, whatever the result.", "text": "After the decision, thank the other team, whatever the result.", "zh": "不管结果如何，决定出来后都要谢谢对方团队。", "sp": null}, {"id": "s1_2_1", "md": "If the call goes against you, accept it and __plan around it__.", "text": "If the call goes against you, accept it and plan around it.", "zh": "如果结果对你不利，就接受它，然后围绕它重新规划。", "sp": null}, {"id": "s1_2_2", "md": "You will work with these people again next quarter, and they will remember exactly how you handled this one.", "text": "You will work with these people again next quarter, and they will remember exactly how you handled this one.", "zh": "下个季度你们还要一起共事，而他们会清清楚楚地记得你这次是怎么处理的。", "sp": null}]]}], "gist": [{"q": "为什么升级问题会让人觉得像「背后告状」？作者怎么重新定义它？", "a": "因为我们把升级当成投诉；作者认为好的升级是请上级做一个双方都做不了的决定，对方往往只是有冲突的优先级。"}, {"q": "为什么说升级其实也帮了对方？", "a": "它减轻了夹在中间的工程师的压力，把选择交给有权决定的人，而不是让两个团队一直争下去。"}, {"q": "升级时怎样不伤关系？", "a": "升级前先告诉对方并邀请一起写；文字简短中立，写清双方影响、选项和需要答复的日期，避免「无视」「拒绝」这类带情绪的词；结果出来后感谢对方，结果不利也接受。"}], "dictation": [{"id": "s0_1_1", "text": "A good escalation is not a complaint about a person; it is a request for a decision that neither of you can make alone."}, {"id": "s1_0_0", "text": "Tell the other person before you escalate, and invite them to join."}, {"id": "s0_1_0", "text": "Escalation feels personal because we treat it as a complaint."}, {"id": "s1_1_1", "text": "State the impact on each side, the options, and the date you need an answer."}], "shadow": {"text": "Escalation feels personal because we treat it as a complaint. A good escalation is not a complaint about a person; it is a request for a decision that neither of you can make alone.", "marked": "Escalation feels <b>personal</b> / because we treat it as a <b>complaint</b>. //<br>A good escalation / is <b>not</b> a complaint about a <b>person</b>; / it is a request for a <b>decision</b> / that <b>neither</b> of you / can make <b>alone</b>. //"}, "prompts": [{"q": "另一个团队的工程师一直没修阻塞你们上线的 bug。你决定升级，先私下跟他说一声。用 30 秒说明你要升级、为什么、并邀请他一起写。", "ref": "Hey, I wanted to talk to you before I do anything. I know you're stuck between our bug and your team's migration, and that's not your fault. I think it's a priority call that neither of us can make. Would you be okay if we wrote a short note to both our managers together, laying out the two options and the launch date? That way nobody feels surprised.", "ref_zh": "嘿，我想在做任何动作之前先跟你聊聊。我知道你夹在我们的 bug 和你们团队的迁移之间，这不是你的错。我觉得这是一个优先级的问题，我们俩谁都定不了。我们一起给双方的经理写个简短的说明，把两个选项和上线日期列清楚，你看行吗？这样谁都不会觉得突然。", "id": "ref0"}, {"q": "你在写给两位经理的升级说明，口头先跟自己的经理过一遍：用中立的语言讲清楚影响、选项和需要答复的时间。", "ref": "Here's the summary I'm planning to send. The login bug in the identity service blocks our launch on the fifteenth. The identity team is focused on their migration, which also has a hard deadline. Option one, they spend two days on our fix and the migration moves by two days. Option two, we launch without single sign-on and add it in the next release. We need a decision by Friday.", "ref_zh": "这是我打算发出去的总结。身份服务里的登录 bug 卡住了我们十五号的上线。身份团队正在全力做他们的迁移，那个也有硬性的 deadline。方案一，他们花两天修我们的问题，迁移顺延两天。方案二，我们先不带单点登录上线，下个版本再加上。我们需要在周五前拿到决定。", "id": "ref1"}], "words": [{"w": "escalate", "ipa": "/ˈeskəleɪt/", "zh": "（向上）升级问题", "ex": "If we don't hear back by Friday, I'll escalate to their director.", "id": "w0"}, {"w": "conflicting", "ipa": "/kənˈflɪktɪŋ/", "zh": "相互冲突的", "ex": "The two teams got conflicting instructions about the launch date.", "id": "w1"}, {"w": "mandate", "ipa": "/ˈmændeɪt/", "zh": "授权、职权范围", "ex": "Our team doesn't have the mandate to change their API.", "id": "w2"}, {"w": "ambush", "ipa": "/ˈæmbʊʃ/", "zh": "突然袭击", "ex": "Raising it first in the big meeting would feel like an ambush.", " const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {

  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
