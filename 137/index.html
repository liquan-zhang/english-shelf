const D = {"id": "137", "type": "dialogue", "title": "Talking to Your Child's Teacher", "meta": "B2 · 约 260 词 · 场景：家长会谈孩子表现与小冲突", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Teacher", "name_zh": "老师", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "老师怎么评价 Leo 的社交和英语？", "a": "大集体里有点害羞，但有两个好朋友；英语进步很大，都听得懂，只是开口缺自信。"}, {"q": "老师提到的小问题是什么？", "a": "上周玩游戏时同学拿了他的玩具，他着急推了对方；没人受伤，两人很快和好。"}, {"q": "关于作业，老师给了什么建议？", "a": "作业不该超过二十分钟；如果卡住了就停下，写个条子给老师。"}], "dictation": [{"id": "s0_1_0", "text": "That's good to hear. How is he getting along with the other kids?"}, {"id": "s0_5_0", "text": "Is there anything we can do at home to help?"}, {"id": "s1_3_0", "text": "Thanks for telling me. We'll have a chat with him tonight about using words instead."}, {"id": "s1_7_0", "text": "That's a relief. Could we stay in touch by email if anything else comes up?"}], "shadow": {"speaker": "A", "text": "One more thing. He spends almost an hour on homework most nights. Is that normal?", "marked": "One more <b>thing</b>. //<br>He spends <b>almost an hour</b> / on <b>homework</b> / most nights. //<br>Is that <b>normal</b>? //"}, "prompts": [{"q": "孩子回家说在学校被同学欺负了。给老师打电话，说明情况，请老师留意，但语气别带指责。", "ref": "Hi, this is Leo's dad. Sorry to call after school. Leo came home a bit upset today. He said one of the boys keeps taking his snacks and laughing at his English. I'm not sure how much of it is true, but could you keep an eye on it for a few days? And please let me know what you see.", "ref_zh": "你好，我是 Leo 的爸爸。不好意思放学后打电话。Leo 今天回家有点不开心，说有个男孩老拿他的零食，还笑他的英语。我不确定有多少是真的，但能不能麻烦你这几天留意一下？看到什么也请告诉我。", "id": "ref0"}, {"q": "下周你要带孩子回国三天，需要请假。给老师写一段口头留言，说明请假和补课的事。", "ref": "Hi, just a quick note. We need to fly back to China next week for a family event, so Leo will miss school from Wednesday to Friday. Sorry for the short notice. Is there any work he should do while he's away? I'd like to make sure he doesn't fall behind. Thank you for understanding.", "ref_zh": "你好，简单说一下。我们下周要回国参加一个家庭活动，所以 Leo 周三到周五不能来上学。抱歉通知得有点晚。他不在的这几天有什么需要做的功课吗？我想确保他不会落下。谢谢理解。", "id": "ref1"}], "words": [{"w": "shy", "ipa": "/ʃaɪ/", "zh": "害羞的", "ex": "She's shy at first, but she warms up quickly.", "id": "w0"}, {"w": "confidence", "ipa": "/ˈkɑːnfɪdəns/", "zh": "自信", "ex": "Swimming lessons gave him a lot of confidence.", "id": "w1"}, {"w": "encourage", "ipa": "/ɪnˈkɜːrɪdʒ/", "zh": "鼓励", "ex": "We encourage the kids to try new food at dinner.", "id": "w2"}, {"w": "on track", "ipa": "/ɑːn træk/", "zh": "进度正常", "ex": "The renovation is on track to finish by Friday.", "id": "w3"}, {"w": "concern", "ipa": "/kənˈsɜːrn/", "zh": "担忧的事；问题", "ex": "My main concern is the long commute to school.", "id": "w4"}, {"w": "frustrated", "ipa": "/ˈfrʌstreɪtɪd/", "zh": "沮丧的；着急的", "ex": "He gets frustrated when the puzzle pieces don't fit.", "id": "w5"}, {"w": "make up", "ipa": "/meɪk ʌp/", "zh": "和好", "ex": "The kids argued, but they made up after lunch.", "id": "w6"}, {"w": "homework", "ipa": "/ˈhoʊmwɜːrk/", "zh": "家庭作业", "ex": "Let's finish your homework before we go to the park.", "id": "w7"}, {"w": "keep someone posted", "ipa": "/kiːp ˈsʌmwʌn ˈpoʊstɪd/", "zh": "随时告知某人进展", "ex": "Keep me posted on when the delivery arrives.", "id": "w8"}], "sections": [{"heading": "1. How He's Doing", "heading_zh": "1. 孩子的表现", "rows": [[{"id": "s0_0_0", "md": "Thanks for coming in, Mr. Zhang. Leo is doing well overall. He's very curious in class.", "text": "Thanks for coming in, Mr. Zhang. Leo is doing well overall. He's very curious in class.", "zh": "谢谢您过来，张先生。Leo 整体表现不错，上课时好奇心很强。", "sp": "B"}], [{"id": "s0_1_0", "md": "**That's good to hear. How is he getting along with the other kids?**", "text": "That's good to hear. How is he getting along with the other kids?", "zh": "听到这个很高兴。他跟其他小朋友相处得怎么样？", "sp": "A"}], [{"id": "s0_2_0", "md": "He's a bit ==shy== in big groups, but he has two close friends he plays with every day.", "text": "He's a bit shy in big groups, but he has two close friends he plays with every day.", "zh": "在大集体里他有点害羞，但他有两个好朋友，每天都一起玩。", "sp": "B"}], [{"id": "s0_3_0", "md": "At home he talks nonstop, but he says English is still hard sometimes.", "text": "At home he talks nonstop, but he says English is still hard sometimes.", "zh": "在家里他说个不停，但他说英语有时候还是挺难的。", "sp": "A"}], [{"id": "s0_4_0", "md": "His English has improved a lot this term. He understands everything. He just needs more ==confidence== when he speaks.", "text": "His English has improved a lot this term. He understands everything. He just needs more confidence when he speaks.", "zh": "这学期他的英语进步很大。他什么都听得懂，只是开口说的时候需要更多自信。", "sp": "B"}], [{"id": "s0_5_0", "md": "**Is there anything we can do at home to help?**", "text": "Is there anything we can do at home to help?", "zh": "我们在家能做些什么来帮他吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "Read with him every night, even for ten minutes. And ==encourage== him to tell you about his day in English.", "text": "Read with him every night, even for ten minutes. And encourage him to tell you about his day in English.", "zh": "每晚陪他读书，哪怕十分钟也好。再鼓励他用英语跟你们讲讲一天的事。", "sp": "B"}], [{"id": "s0_7_0", "md": "We can __definitely do that__. How about his reading level?", "text": "We can definitely do that. How about his reading level?", "zh": "这个我们一定能做到。他的阅读水平怎么样？", "sp": "A"}], [{"id": "s0_8_0", "md": "He's __right on track__. He loves picture books about animals.", "text": "He's right on track. He loves picture books about animals.", "zh": "完全跟得上进度。他特别喜欢动物绘本。", "sp": "B"}]]}, {"heading": "2. A Small Concern", "heading_zh": "2. 一个小问题", "rows": [[{"id": "s1_0_0", "md": "There's one small ==concern== I wanted to raise. Last week, he pushed a classmate during a game.", "text": "There's one small concern I wanted to raise. Last week, he pushed a classmate during a game.", "zh": "有个小问题想跟您说一下。上周玩游戏的时候，他推了一个同学。", "sp": "B"}], [{"id": "s1_1_0", "md": "Oh, I'm sorry to hear that. Do you know what happened, exactly?", "te const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress

const steps = [];
function step(id, name, time, how, body) {

  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
