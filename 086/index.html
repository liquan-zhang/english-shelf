const D = {"id": "086", "title": "Keeping a Conversation Going with Follow-up Questions", "meta": "B2 · 约 280 词 · 场景：用追问延续闲聊", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Jumping Versus Digging", "heading_zh": "1. 跳开还是深挖", "rows": [[{"id": "s0_0_0", "md": "Picture this exchange at the coffee machine.", "text": "Picture this exchange at the coffee machine.", "zh": "想象一下咖啡机旁的这段对话。", "sp": null}, {"id": "s0_0_1", "md": "\"I went hiking last weekend,\" says your colleague.", "text": "\"I went hiking last weekend,\" says your colleague.", "zh": "「我上周末去徒步了。」同事说。", "sp": null}, {"id": "s0_0_2", "md": "\"Oh, nice,\" you reply, and then you ==abruptly== ask about the project deadline.", "text": "\"Oh, nice,\" you reply, and then you abruptly ask about the project deadline.", "zh": "「哦，不错。」你回了一句，然后突然问起项目 deadline。", "sp": null}], [{"id": "s0_1_0", "md": "Nothing went wrong, exactly, but the conversation just died.", "text": "Nothing went wrong, exactly, but the conversation just died.", "zh": "说起来也没出什么错，但天就这么聊死了。", "sp": null}, {"id": "s0_1_1", "md": "Your colleague ==volunteered== a topic, and you jumped away from it.", "text": "Your colleague volunteered a topic, and you jumped away from it.", "zh": "同事主动抛了个话题，你却跳开了。", "sp": null}, {"id": "s0_1_2", "md": "**Most conversations do not end because people run out of things to say; they end because nobody digs.**", "text": "Most conversations do not end because people run out of things to say; they end because nobody digs.", "zh": "大多数对话结束，不是因为没话可说；而是因为没人往下挖。", "sp": null}], [{"id": "s0_2_0", "md": "Digging means staying with the same topic for two or three more questions.", "text": "Digging means staying with the same topic for two or three more questions.", "zh": "深挖的意思是，在同一个话题上再多问两三个问题。", "sp": null}, {"id": "s0_2_1", "md": "It can feel ==intrusive== at first, but most people enjoy talking about something they chose to __bring up__ themselves.", "text": "It can feel intrusive at first, but most people enjoy talking about something they chose to bring up themselves.", "zh": "一开始可能会觉得有点冒犯，但大多数人都喜欢聊自己主动提起的事。", "sp": null}, {"id": "s0_2_2", "md": "You are not being nosy; you are giving them permission to keep going.", "text": "You are not being nosy; you are giving them permission to keep going.", "zh": "你不是在八卦；你是在给对方接着往下讲的许可。", "sp": null}, {"id": "s0_2_3", "md": "A good rule is to ask at least two follow-ups before you change the subject.", "text": "A good rule is to ask at least two follow-ups before you change the subject.", "zh": "一个好用的规矩是：换话题之前，至少追问两句。", "sp": null}]]}, {"heading": "2. Three Follow-ups That Always Work", "heading_zh": "2. 三个百试百灵的追问", "rows": [[{"id": "s1_0_0", "md": "The first is the detail question: \"Where did you go?\" or \"How long was the trail?\"", "text": "The first is the detail question: \"Where did you go?\" or \"How long was the trail?\"", "zh": "第一种是细节题：「去的哪儿？」或者「那条路线有多长？」", "sp": null}, {"id": "s1_0_1", "md": "It is easy to answer and shows you are __tuned in__.", "text": "It is easy to answer and shows you are tuned in.", "zh": "好回答，也说明你在认真听。", "sp": null}, {"id": "s1_0_2", "md": "Keep it light, though, and do not turn the chat into an interview.", "text": "Keep it light, though, and do not turn the chat into an interview.", "zh": "不过要轻松点，别把闲聊变成面试。", "sp": null}], [{"id": "s1_1_0", "md": "The second is the experience question: \"What was the best part?\" or \"Was it as hard as you expected?\"", "text": "The second is the experience question: \"What was the best part?\" or \"Was it as hard as you expected?\"", "zh": "第二种是体验题：「最棒的是哪一段？」或者「跟你预想的一样累吗？」", "sp": null}, {"id": "s1_1_1", "md": "This invites a short story, and stories are where people __open up__.", "text": "This invites a short story, and stories are where people open up.", "zh": "这会引出一个小故事，而人往往是在讲故事的时候才打开话匣子。", "sp": null}], [{"id": "s1_2_0", "md": "The third is the future question: \"Would you do it again?\" or \"Where's next on your list?\"", "text": "The third is the future question: \"Would you do it again?\" or \"Where's next on your list?\"", "zh": "第三种是未来题：「还会再去吗？」或者「下一个想去哪儿？」", "sp": null}, {"id": "s1_2_1", "md": "It shows ==curiosity== about the person, not just the event, and it often ==reveals== what they really enjoy.", "text": "It shows curiosity about the person, not just the event, and it often reveals what they really enjoy.", "zh": "这说明你好奇的是这个人，而不只是这件事，而且往往能看出他真正喜欢什么。", "sp": null}], [{"id": "s1_3_0", "md": "Between questions, ==echo== a word or two from their answer.", "text": "Between questions, echo a word or two from their answer.", "zh": "问题和问题之间，重复一两个对方回答里的词。", "sp": null}, {"id": "s1_3_1", "md": "If they say, \"The view at the top was unreal,\" you can say, \"Unreal? Better than the photos?\"", "text": "If they say, \"The view at the top was unreal,\" you can say, \"Unreal? Better than the photos?\"", "zh": "如果他说：「山顶的风景简直不真实。」你可以接：「不真实？比照片还好看？」", "sp": null}, {"id": "s1_3_2", "md": "**Echoing a single word is the easiest follow-up in English, and it buys you time to think.**", "text": "Echoing a single word is the easiest follow-up in English, and it buys you time to think.", "zh": "重复一个词，是英语里最省力的追问，还能给你争取点思考时间。", "sp": null}]]}], "gist": [{"q": "作者说大多数对话为什么会冷掉？", "a": "不是没话可说，而是没人往下“挖”：对方抛出话题，我们却跳到别的事上。"}, {"q": "三种万能追问分别是什么？", "a": "细节问题（去哪了、多远）；经历问题（最好的部分是什么、比预想难吗）；未来问题（还会再去吗、下一站去哪）。"}, {"q": "echo 技巧是什么？有什么好处？", "a": "重复对方回答里的一两个词并加问号接着问；这是最简单的追问，还能给自己争取思考时间。"}], "dictation": [{"id": "s0_1_2", "text": "Most conversations do not end because people run out of things to say; they end because nobody digs."}, {"id": "s0_2_0", "text": "Digging means staying with the same topic for two or three more questions."}, {"id": "s1_1_1", "text": "This invites a short story, and stories are where people open up."}, {"id": "s1_3_2", "text": "Echoing a single word is the easiest follow-up in English, and it buys you time to think."}], "shadow": {"text": "Between questions, echo a word or two from their answer. If they say, \"The view at the top was unreal,\" you can say, \"Unreal? Better than the photos?\" Echoing a single word is the easiest follow-up in English, and it buys you time to think.", "marked": "Between questions, / <b>echo</b> a word or two / from their <b>answer</b>. //<br>If they say, / \"The <b>view</b> at the top was <b>unreal</b>,\" / you can say, / \"<b>Unreal</b>? / <b>Better</b> than the photos?\" //<br><b>Echoing</b> a single word / is the <b>easiest</b> follow-up in English, / and it buys you <b>time</b> to think. //"}, "prompts": [{"q": "印度同事说他上周末回家参加了朋友的婚礼。用细节、经历、未来三种追问，加上 echo，把对话聊 30 秒。", "ref": "Oh, a wedding! Was it back home in India? Three days? Wow. What was the best part, the food or the dancing? Ha, I believe it. I've never been to an Indian wedding. Would you say it was a typical one, or bigger than usual? Next time a friend of yours gets married, I want a full report.", "ref_zh": "哦，婚礼！是回印度老家吗？三天？哇。最棒的是哪部分，吃的还是跳舞？哈，我信。我还没参加过印度婚礼。你觉得这算是典型的规模，还是比一般的更大？下次你朋友结婚，我要听完整汇报。", "id": "ref0"}, {"q": "会前同事随口说 I've started learning to cook. 用 echo 和追问聊 30 秒。", "ref": "Learning to cook? That's great. What made you start? Delivery fatigue, I get that. What's the first dish you managed to get right? Pasta from scratch? That's ambitious. Was it as hard as you expected? I tried making dumplings once and they all fell apart in the pot, so I'm genuinely impressed. What's next on your list?", "ref_zh": "在学做饭？挺好的。怎么想起来学的？外卖吃腻了，懂。第一道做成功的菜是什么？手擀意面？够有野心的。跟你想的一样难吗？我有次试着包饺子，下锅全散了，所以我是真心佩服。下一道打算做什么？", "id": "ref1"}], "words": [{"w": "abruptly", "ipa": "/əˈbrʌptli/", "zh": "突然地、生硬地", "ex": "The call ended abruptly when his connection dropped.", "id": "w0"}, {"w": "volunteer (v.)", "ipa": "/ˌvɑːlənˈtɪr/", "zh": "主动提出、主动说起", "ex": "She volunteered to take notes, which helped a lot.", "tts_w": "volunteer", "id": "w1"}, {"w": "intrusive", "ipa": "/ɪnˈtruːsɪv/", "zh": "冒昧的、侵扰的", "ex": "Asking about salary in the first chat can feel intrusive.", "id": "w2"}, {"w": "curiosity const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));

function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
