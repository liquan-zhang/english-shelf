<script>
const D = {"id": "040", "title": "Bringing Solutions, Not Just Problems", "meta": "B2 · 约 280 词 · 场景：向上汇报问题", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Rule Has a Catch", "heading_zh": "1. 这条规则有个坑", "rows": [[{"id": "s0_0_0", "md": "Many managers like to say, \"Don't bring me problems, bring me solutions.\"", "text": "Many managers like to say, \"Don't bring me problems, bring me solutions.\"", "zh": "很多经理喜欢说：「别光给我带问题来，要带解决方案来。」", "sp": null}, {"id": "s0_0_1", "md": "The idea is good: people who arrive with a plan save everyone time.", "text": "The idea is good: people who arrive with a plan save everyone time.", "zh": "出发点是好的：带着方案来的人能给大家省时间。", "sp": null}, {"id": "s0_0_2", "md": "But taken too far, the rule has a dangerous ==side effect==.", "text": "But taken too far, the rule has a dangerous side effect.", "zh": "但如果执行过了头，这条规则会有一个危险的副作用。", "sp": null}], [{"id": "s0_1_0", "md": "Engineers start hiding problems until they have a fix.", "text": "Engineers start hiding problems until they have a fix.", "zh": "工程师会开始把问题捂着，直到想出办法为止。", "sp": null}, {"id": "s0_1_1", "md": "A storage issue that could have been handled in a week __stays quiet__ for a month, until it becomes an ==outage==.", "text": "A storage issue that could have been handled in a week stays quiet for a month, until it becomes an outage.", "zh": "一个本来一周就能处理掉的存储问题，被闷了一个月，直到变成一次线上故障。", "sp": null}, {"id": "s0_1_2", "md": "By then, the cheap options are gone.", "text": "By then, the cheap options are gone.", "zh": "到那时，低成本的选项都已经没了。", "sp": null}, {"id": "s0_1_3", "md": "**Raise problems early, and bring your best thinking, even if it is not a finished solution.**", "text": "Raise problems early, and bring your best thinking, even if it is not a finished solution.", "zh": "问题要早点提，带上你最好的思考，哪怕还不是一个完整的方案。", "sp": null}], [{"id": "s0_2_0", "md": "Your manager doesn't need a perfect answer from you.", "text": "Your manager doesn't need a perfect answer from you.", "zh": "你的经理不需要你给出完美的答案。", "sp": null}, {"id": "s0_2_1", "md": "They need to know you have __thought it through__ and that you are not just handing them a ==burden== without context.", "text": "They need to know you have thought it through and that you are not just handing them a burden without context.", "zh": "他需要知道你已经认真想过了，而不是没头没尾地把一个包袱甩给他。", "sp": null}, {"id": "s0_2_2", "md": "Half a plan delivered on Monday is worth more than a full plan delivered after the damage.", "text": "Half a plan delivered on Monday is worth more than a full plan delivered after the damage.", "zh": "周一交上来的半个方案，比损失造成之后才交的完整方案更有价值。", "sp": null}]]}, {"heading": "2. A Simple Four-Part Message", "heading_zh": "2. 简单的四段式消息", "rows": [[{"id": "s1_0_0", "md": "Start with the problem and its ==severity== in one sentence.", "text": "Start with the problem and its severity in one sentence.", "zh": "先用一句话讲清楚问题和它的严重程度。", "sp": null}, {"id": "s1_0_1", "md": "\"Our storage will be full in about three weeks, and writes will start failing.\"", "text": "\"Our storage will be full in about three weeks, and writes will start failing.\"", "zh": "「我们的存储大概三周后就会满，到时候写入会开始失败。」", "sp": null}, {"id": "s1_0_2", "md": "Your manager now knows how urgent this is before you say anything else.", "text": "Your manager now knows how urgent this is before you say anything else.", "zh": "这样你还没往下说，经理就已经知道这事有多急了。", "sp": null}], [{"id": "s1_1_0", "md": "Next, offer two or three options with their costs.", "text": "Next, offer two or three options with their costs.", "zh": "接下来，给出两三个选项，以及各自的代价。", "sp": null}, {"id": "s1_1_1", "md": "\"We can clean up old logs, which __buys us__ a month, or add capacity, which costs budget but solves it for a year.\"", "text": "\"We can clean up old logs, which buys us a month, or add capacity, which costs budget but solves it for a year.\"", "zh": "「我们可以清理旧日志，这能多撑一个月；或者扩容，要花预算，但能管一年。」", "sp": null}, {"id": "s1_1_2", "md": "Options show your manager the ==landscape==, not just one path.", "text": "Options show your manager the landscape, not just one path.", "zh": "选项能让经理看到全局，而不只是一条路。", "sp": null}], [{"id": "s1_2_0", "md": "Then give your ==recommendation== and the reason behind it.", "text": "Then give your recommendation and the reason behind it.", "zh": "然后给出你的建议，以及背后的理由。", "sp": null}, {"id": "s1_2_1", "md": "\"I suggest cleaning up now and requesting capacity for next quarter.\"", "text": "\"I suggest cleaning up now and requesting capacity for next quarter.\"", "zh": "「我建议现在先清理，同时为下个季度申请扩容。」", "sp": null}, {"id": "s1_2_2", "md": "**Having a recommendation is what turns you from a messenger into an owner.**", "text": "Having a recommendation is what turns you from a messenger into an owner.", "zh": "有了自己的建议，你就从一个传话的人变成了一个负责的人。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, say what you need from them: approval, budget, or simply ==awareness==.", "text": "Finally, say what you need from them: approval, budget, or simply awareness.", "zh": "最后，说明你需要他做什么：批准、预算，或者只是知会一声。", "sp": null}, {"id": "s1_3_1", "md": "If you truly have no solution yet, __say so plainly__ and bring the exact question you are stuck on instead.", "text": "If you truly have no solution yet, say so plainly and bring the exact question you are stuck on instead.", "zh": "如果你确实还没有方案，就直说，然后把你卡住的那个具体问题带过来。", "sp": null}]]}], "gist": [{"q": "「别带问题来，带方案来」这条规则有什么副作用？", "a": "工程师会在想出解决办法之前一直藏着问题，小问题拖成事故，便宜的选项也没了。"}, {"q": "作者认为经理真正需要的是什么？", "a": "不是完美答案，而是早点知道问题，并且看到你认真想过、带着背景和思路来，而不是把包袱直接甩给他。"}, {"q": "推荐的四段式汇报是什么？", "a": "一句话讲清问题和严重程度；给两三个带成本的选项；给出你的推荐和理由；说明需要经理做什么（批准、预算或只是知情）。"}], "dictation": [{"id": "s0_1_3", "text": "Raise problems early, and bring your best thinking, even if it is not a finished solution."}, {"id": "s1_2_2", "text": "Having a recommendation is what turns you from a messenger into an owner."}, {"id": "s0_1_0", "text": "Engineers start hiding problems until they have a fix."}, {"id": "s1_1_2", "text": "Options show your manager the landscape, not just one path."}], "shadow": {"text": "Then give your recommendation and the reason behind it. \"I suggest cleaning up now and requesting capacity for next quarter.\" Having a recommendation is what turns you from a messenger into an owner.", "marked": "Then give your <b>recommendation</b> / and the <b>reason</b> behind it. //<br>\"I suggest <b>cleaning up</b> now / and requesting <b>capacity</b> / for <b>next</b> quarter.\" //<br>Having a recommendation / is what turns you / from a <b>messenger</b> / into an <b>owner</b>. //"}, "prompts": [{"q": "你发现一个第三方 SDK 下个月停止支持，影响你们的推送功能。用 30 秒按「问题和严重程度、选项、推荐、需要什么」向经理汇报。", "ref": "Quick heads-up on a risk. The push notification library we use stops being supported next month, and after that, new phones may not receive our notifications. I see two options: upgrade to the vendor's new version, which takes about a week, or switch to a different provider, which takes a month but cuts cost. I recommend the upgrade now. I just need your approval to pause one small feature this sprint.", "ref_zh": "提前跟你同步一个风险。我们用的推送通知库下个月就停止维护了，之后新手机可能收不到我们的通知。我看有两个选项：升级到厂商的新版本，大概要一周；或者换一家服务商，要一个月，但能降成本。我建议现在就升级。我只需要你批准这个 sprint 先暂停一个小功能。", "id": "ref0"}, {"q": "你发现了一个性能问题但还没想到解决方案。用 30 秒向经理提出，说明你目前的判断和卡在哪里。", "ref": "I want to flag something early, even though I don't have a fix yet. Checkout latency has been creeping up about ten percent a week for the past month. It's not urgent today, but at this rate we'll feel it during the holiday sale. My best guess is the new recommendation call, but I can't confirm it. What I'm stuck on is getting tracing access to that service. Could you help me get it?", "ref_zh": "有件事我想早点提出来，虽然我还没有解决办法。过去一个月，结账延迟每周大约上涨百分之十。今天还不算紧急，但照这个速度，到假期大促的时候就会有明显感觉。我最大的怀疑是新加的推荐接口调用，但还没法确认。我卡在拿不到那个服务的 tracing 权限上。你能帮我申请一下吗？", "id": "ref1"}], "words": [{"w": "side effect", "ipa": "/ˈsaɪd ɪˌfekt/", "zh": "副作用", "ex": "One side effect of the new cache is slightly stale prices.", "id": "w0"}, {"w": "outage", "ipa": "/ˈaʊtɪdʒ/", "zh": "（服务）中断、故障", "ex": "The outage las const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
