<script>
const D = {"id": "040", "title": "Bringing Solutions, Not Just Problems", "meta": "B2 · 约 280 词 · 场景：向上汇报问题", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Rule Has a Catch", "heading_zh": "1. 这条规则有个坑", "rows": [[{"id": "s0_0_0", "md": "Many managers like to say, \"Don't bring me problems, bring me solutions.\"", "text": "Many managers like to say, \"Don't bring me problems, bring me solutions.\"", "zh": "很多经理喜欢说：「别光给我带问题来，要带解决方案来。」", "sp": null}, {"id": "s0_0_1", "md": "The idea is good: people who arrive with a plan save everyone time.", "text": "The idea is good: people who arrive with a plan save everyone time.", "zh": "出发点是好的：带着方案来的人能给大家省时间。", "sp": null}, {"id": "s0_0_2", "md": "But taken too far, the rule has a dangerous ==side effect==.", "text": "But taken too far, the rule has a dangerous side effect.", "zh": "但如果执行过了头，这条规则会有一个危险的副作用。", "sp": null}], [{"id": "s0_1_0", "md": "Engineers start hiding problems until they have a fix.", "text": "Engineers start hiding problems until they have a fix.", "zh": "工程师会开始把问题捂着，直到想出办法为止。", "sp": null}, {"id": "s0_1_1", "md": "A storage issue that could have been handled in a week __stays quiet__ for a month, until it becomes an ==outage==.", "text": "A storage issue that could have been handled in a week stays quiet for a month, until it becomes an outage.", "zh": "一个本来一周就能处理掉的存储问题，被闷了一个月，直到变成一次线上故障。", "sp": null}, {"id": "s0_1_2", "md": "By then, the cheap options are gone.", "text": "By then, the cheap options are gone.", "zh": "到那时，低成本的选项都已经没了。", "sp": null}, {"id": "s0_1_3", "md": "**Raise problems early, and bring your best thinking, even if it is not a finished solution.**", "text": "Raise problems early, and bring your best thinking, even if it is not a finished solution.", "zh": "问题要早点提，带上你最好的思考，哪怕还不是一个完整的方案。", "sp": null}], [{"id": "s0_2_0", "md": "Your manager doesn't need a perfect answer from you.", "text": "Your manager doesn't need a perfect answer from you.", "zh": "你的经理不需要你给出完美的答案。", "sp": null}, {"id": "s0_2_1", "md": "They need to know you have __thought it through__ and that you are not just handing them a ==burden== without context.", "text": "They need to know you have thought it through and that you are not just handing them a burden without context.", "zh": "他需要知道你已经认真想过了，而不是没头没尾地把一个包袱甩给他。", "sp": null}, {"id": "s0_2_2", "md": "Half a plan delivered on Monday is worth more than a full plan delivered after the damage.", "text": "Half a plan delivered on Monday is worth more than a full plan delivered after the damage.", "zh": "周一交上来的半个方案，比损失造成之后才交的完整方案更有价值。", "sp": null}]]}, {"heading": "2. A Simple Four-Part Message", "heading_zh": "2. 简单的四段式消息", "rows": [[{"id": "s1_0_0", "md": "Start with the problem and its ==severity== in one sentence.", "text": "Start with the problem and its severity in one sentence.", "zh": "先用一句话讲清楚问题和它的严重程度。", "sp": null}, {"id": "s1_0_1", "md": "\"Our storage will be full in about three weeks, and writes will start failing.\"", "text": "\"Our storage will be full in about three weeks, and writes will start failing.\"", "zh": "「我们的存储大概三周后就会满，到时候写入会开始失败。」", "sp": null}, {"id": "s1_0_2", "md": "Your manager now knows how urgent this is before you say anything else.", "text": "Your manager now knows how urgent this is before you say anything else.", "zh": "这样你还没往下说，经理就已经知道这事有多急了。", "sp": null}], [{"id": "s1_1_0", "md": "Next, offer two or three options with their costs.", "text": "Next, offer two or three options with their costs.", "zh": "接下来，给出两三个选项，以及各自的代价。", "sp": null}, {"id": "s1_1_1", "md": "\"We can clean up old logs, which __buys us__ a month, or add capacity, which costs budget but solves it for a year.\"", "text": "\"We can clean up old logs, which buys us a month, or add capacity, which costs budget but solves it for a year.\"", "zh": "「我们可以清理旧日志，这能多撑一个月；或者扩容，要花预算，但能管一年。」", "sp": null}, {"id": "s1_1_2", "md": "Options show your manager the ==landscape==, not just one path.", "text": "Options show your manager the landscape, not just one path.", "zh": "选项能让经理看到全局，而不只是一条路。", "sp": null}], [{"id": "s1_2_0", "md": "Then give your ==recommendation== and the reason behind it.", "text": "Then give your recommendation and the reason behind it.", "zh": "然后给出你的建议，以及背后的理由。", "sp": null}, {"id": "s1_2_1", "md": "\"I suggest cleaning up now and requesting capacity for next quarter.\"", "text": "\"I suggest cleaning up now and requesting capacity for next quarter.\"", "zh": "「我建议现在先清理，同时为下个季度申请扩容。」", "sp": null}, {"id": "s1_2_2", "md": "**Having a recommendation is what turns you from a messenger into an owner.**", "text": "Having a recommendation is what turns you from a messenger into an owner.", "zh": "有了自己的建议，你就从一个传话的人变成了一个负责的人。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, say what you need from them: approval, budget, or simply ==awareness==.", "text": "Finally, say what you need from them: approval, budget, or simply awareness.", "zh": "最后，说明你需要他做什么：批准、预算，或者只是知会一声。", "sp": null}, {"id": "s1_3_1", "md": "If you truly have no solution yet, __say so plainly__ and bring the exact question you are stuck on instead.", "text": "If you truly have no solution yet, say so plainly and bring the exact question you are stuck on instead.", "zh": "如果你确实还没有方案，就直说，然后把你卡住的那个具体问题带过来。", "sp": null}]]}], "gist": [{"q": "「别带问题来，带方案来」这条规则有什么副作用？", "a": "工程师会在想出解决办法之前一直藏着问题，小问题拖成事故，便宜的选项也没了。"}, {"q": "作者认为经理真正需要的是什么？", "a": "不是完美答案，而是早点知道问题，并且看到你认真想过、带着背景和思路来，而不是把包袱直接甩给他。"}, {"q": "推荐的四段式汇报是什么？", "a": "一句话讲清问题和严重程度；给两三个带成本的选项；给出你的推荐和理由；说明需要经理做什么（批准、预算或只是知情）。"}], "dictation": [{"id": "s0_1_3", "text": "Raise problems early, and bring your best thinking, even if it is not a finished solution."}, {"id": "s1_2_2", "text": "Having a recommendation is what turns you from a messenger into an owner."}, {"id": "s0_1_0", "text": "Engineers start hiding problems until they have a fix."}, {"id": "s1_1_2", "text": "Options show your manager the landscape, not just one path."}], "shadow": {"text": "Then give your recommendation and the reason behind it. \"I suggest cleaning up now and requesting capacity for next quarter.\" Having a recommendation is what turns you from a messenger into an owner.", "marked": "Then give your <b>recommendation</b> / and the <b>reason</b> behind it. //<br>\"I suggest <b>cleaning up</b> now / and requesting <b>capacity</b> / for <b>next</b> quarter.\" //<br>Having a recommendation / is what turns you / from a <b>messenger</b> / into an <b>owner</b>. //"}, "prompts": [{"q": "你发现一个第三方 SDK 下个月停止支持，影响你们的推送功能。用 30 秒按「问题和严重程度、选项、推荐、需要什么」向经理汇报。", "ref": "Quick heads-up on a risk. The push notification library we use stops being supported next month, and after that, new phones may not receive our notifications. I see two options: upgrade to the vendor's new version, which takes about a week, or switch to a different provider, which takes a month but cuts cost. I recommend the upgrade now. I just need your approval to pause one small feature this sprint.", "ref_zh": "提前跟你同步一个风险。我们用的推送通知库下个月就停止维护了，之后新手机可能收不到我们的通知。我看有两个选项：升级到厂商的新版本，大概要一周；或者换一家服务商，要一个月，但能降成本。我建议现在就升级。我只需要你批准这个 sprint 先暂停一个小功能。", "id": "ref0"}, {"q": "你发现了一个性能问题但还没想到解决方案。用 30 秒向经理提出，说明你目前的判断和卡在哪里。", "ref": "I want to flag something early, even though I don't have a fix yet. Checkout latency has been creeping up about ten percent a week for the past month. It's not urgent today, but at this rate we'll feel it during the holiday sale. My best guess is the new recommendation call, but I can't confirm it. What I'm stuck on is getting tracing access to that service. Could you help me get it?", "ref_zh": "有件事我想早点提出来，虽然我还没有解决办法。过去一个月，结账延迟每周大约上涨百分之十。今天还不算紧急，但照这个速度，到假期大促的时候就会有明显感觉。我最大的怀疑是新加的推荐接口调用，但还没法确认。我卡在拿不到那个服务的 tracing 权限上。你能帮我申请一下吗？", "id": "ref1"}], "words": [{"w": "side effect", "ipa": "/ˈsaɪd ɪˌfekt/", "zh": "副作用", "ex": "One side effect of the new cache is slightly stale prices.", "id": "w0"}, {"w": "outage", "ipa": "/ˈaʊtɪdʒ/", "zh": "（服务）中断、故障", "ex": "The outage lasted forty minutes and affected two regions.", "id": "w1"}, {"w": "burden", "ipa": "/ˈbɜːrdn/", "zh": "负担、包袱", "ex": "I don't want to put the burden of the migration on the new hires.", "id": "w2"}, {"w": "severity", "ipa": "/səˈverəti/", "zh": "严重程度", "ex": "We classified the bug as high severity because payments were affected.", "id": "w3"}, {"w": "landscape", "ipa": "/ˈlændskeɪp/", "zh": "全貌、整体局面", "ex": "Before we choose a vendor, let's map out the landscape.", "id": "w4"}, {"w": "recommendation", "ipa": "/ˌrekəmenˈdeɪʃən/", "zh": "建议、推荐方案", "ex": "My recommendation is to delay the launch by one week.", "id": "w5"}, {"w": "awareness", "ipa": "/əˈwernəs/", "zh": "知情、意识", "ex": "No action needed, this is just for awareness.", "id": "w6"}, {"w": "messenger", "ipa": "/ˈmesɪndʒər/", "zh": "传话的人", "ex": "I don't want to be just the messenger; here's what I suggest.", "id": "w7"}, {"w": "capacity", "ipa": "/kəˈpæsəti/", "zh": "容量、产能", "ex": "We need more storage capacity before the holiday peak.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. The Rule Has a Catch", "zh": "1. 这条规则有个坑", "start": 0.0, "end": 2.304, "words": [[0.105, 0.316], [0.724, 0.803], [0.816, 1.118], [1.132, 1.316], [1.329, 1.368], [1.382, 1.908]]}, {"kind": "s", "id": "s0_0_0", "md": "Many managers like to say, \"Don't bring me problems, bring me solutions.\"", "zh": "很多经理喜欢说：「别光给我带问题来，要带解决方案来。」", "sp": null, "gap": false, "start": 2.304, "end": 7.296, "words": [[2.409, 2.646], [2.659, 3.186], [3.199, 3.383], [3.396, 3.475], [3.488, 3.922], [4.225, 4.436], [4.449, 4.633], [4.646, 4.751], [4.765, 5.488], [5.686, 5.909], [5.922, 6.054], [6.067, 6.883]]}, {"kind": "s", "id": "s0_0_1", "md": "The idea is good: people who arrive with a plan save everyone time.", "zh": "出发点是好的：带着方案来的人能给大家省时间。", "sp": null, "gap": false, "start": 7.296, "end": 12.288, "words": [[7.414, 7.507], [7.52, 8.046], [8.059, 8.217], [8.23, 8.559], [9.046, 9.335], [9.349, 9.467], [9.48, 9.954], [9.967, 10.099], [10.11 5, 68.35], [68.363, 68.639], [68.652, 68.797], [68.902, 69.1], [69.113, 69.692], [69.902, 70.1], [70.113, 70.468], [70.481, 70.626], [70.639, 70.678], [70.692, 71.139], [71.507, 71.744], [71.757, 71.942], [71.955, 72.718], [73.086, 73.244], [73.257, 73.626], [73.639, 74.113], [74.244, 74.376], [74.389, 74.823], [74.836, 74.929], [74.942, 75.126], [75.139, 75.165], [75.179, 75.586]]}, {"kind": "s", "id": "s1_1_2", "md": "Options show your manager the ==landscape==, not just one path.", "zh": "选项能让经理看到全局，而不只是一条路。", "sp": null, "gap": false, "start": 76.104, "end": 80.04, "words": [[76.209, 76.643], [76.657, 76.841], [76.854, 76.986], [76.999, 77.407], [77.42, 77.499], [77.512, 78.117], [78.499, 78.683], [78.696, 78.933], [78.946, 79.117], [79.13, 79.643]]}, {"kind": "s", "id": "s1_2_0", "md": "Then give your ==recommendation== and the reason behind it.", "zh": "然后给出你的建议，以及背后的理由。", "sp": null, "gap": true, "start": 80.04, "end": 83.208, "words": [[80.158, 80.303], [80.316, 80.514], [80.527, 80.658], [80.672, 81.514], [81.658, 81.737], [81.751, 81.843], [81.856, 82.224], [82.237, 82.632], [82.645, 82.829]]}, {"kind": "s", "id": "s1_2_1", "md": "\"I suggest cleaning up now and requesting capacity for next quarter.\"", "zh": "「我建议现在先清理，同时为下个季度申请扩容。」", "sp": null, "gap": false, "start": 83.208, "end": 87.744, "words": [[83.392, 83.432], [83.432, 83.945], [83.958, 84.34], [84.353, 84.484], [84.497, 84.971], [85.103, 85.195], [85.208, 85.761], [85.774, 86.405], [86.419, 86.576], [86.59, 86.879], [86.892, 87.313]]}, {"kind": "s", "id": "s1_2_2", "md": "**Having a recommendation is what turns you from a messenger into an owner.**", "zh": "有了自己的建议，你就从一个传话的人变成了一个负责的人。", "sp": null, "gap": false, "start": 87.744, "end": 92.112, "words": [[87.849, 88.099], [88.112, 88.152], [88.165, 89.02], [89.165, 89.27], [89.283, 89.468], [89.481, 89.836], [89.849, 89.981], [89.994, 90.152], [90.165, 90.204], [90.218, 90.862], [90.941, 91.257], [91.27, 91.362], [91.376, 91.731]]}, {"kind": "s", const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
