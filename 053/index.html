<script>
const D = {"id": "053", "title": "Praising Specific Work, Not People", "meta": "B2 · 约 260 词 · 场景：表扬与认可", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Trouble with \"Great Job\"", "heading_zh": "1. 「干得好」的问题", "rows": [[{"id": "s0_0_0", "md": "After a smooth launch, you post in the team channel: \"Great job, everyone! You're amazing!\"", "text": "After a smooth launch, you post in the team channel: \"Great job, everyone! You're amazing!\"", "zh": "上线很顺利，你在团队群里发：「大家干得好！你们太棒了！」", "sp": null}, {"id": "s0_0_1", "md": "People add a few emojis, and the moment is gone by lunch.", "text": "People add a few emojis, and the moment is gone by lunch.", "zh": "大家回几个表情，到午饭时这事就过去了。", "sp": null}, {"id": "s0_0_2", "md": "Nobody learned anything, and the engineer who quietly saved the launch feels ==invisible==.", "text": "Nobody learned anything, and the engineer who quietly saved the launch feels invisible.", "zh": "没有人学到任何东西，而那个默默救了这次上线的工程师觉得自己被无视了。", "sp": null}], [{"id": "s0_1_0", "md": "General praise sounds kind, but it carries almost no information.", "text": "General praise sounds kind, but it carries almost no information.", "zh": "笼统的表扬听起来很友善，但几乎不带任何信息。", "sp": null}, {"id": "s0_1_1", "md": "Praise about the person, like \"you're so smart,\" is even ==riskier==.", "text": "Praise about the person, like \"you're so smart,\" is even riskier.", "zh": "夸人本身的，比如「你真聪明」，风险更大。", "sp": null}, {"id": "s0_1_2", "md": "It __teaches people to protect__ their image, so they avoid hard problems where they might look less smart.", "text": "It teaches people to protect their image, so they avoid hard problems where they might look less smart.", "zh": "这会让人学会维护自己的形象，于是他们会避开那些可能显得自己不够聪明的难题。", "sp": null}], [{"id": "s0_2_0", "md": "**Praise is a tool for telling people what to repeat.**", "text": "Praise is a tool for telling people what to repeat.", "zh": "表扬是一种工具，用来告诉大家什么值得重复。", "sp": null}, {"id": "s0_2_1", "md": "Used well, it is one of the cheapest ways to ==steer== how your team works.", "text": "Used well, it is one of the cheapest ways to steer how your team works.", "zh": "用得好，它是引导团队工作方式最便宜的手段之一。", "sp": null}, {"id": "s0_2_2", "md": "Used vaguely, it is just noise.", "text": "Used vaguely, it is just noise.", "zh": "用得模糊，它就只是噪音。", "sp": null}]]}, {"heading": "2. Point at the Work", "heading_zh": "2. 夸具体的工作", "rows": [[{"id": "s1_0_0", "md": "Good praise names a specific action and its effect.", "text": "Good praise names a specific action and its effect.", "zh": "好的表扬会点出一个具体的动作和它的效果。", "sp": null}, {"id": "s1_0_1", "md": "\"Splitting the migration into five small releases meant we could roll back each step in minutes. That's why we had zero downtime.\"", "text": "\"Splitting the migration into five small releases meant we could roll back each step in minutes. That's why we had zero downtime.\"", "zh": "「把迁移拆成五个小版本发布，意味着每一步都能在几分钟内回滚。所以我们才做到了零停机。」", "sp": null}, {"id": "s1_0_2", "md": "The engineer now knows exactly which ==decision== mattered.", "text": "The engineer now knows exactly which decision mattered.", "zh": "这下工程师就确切知道是哪个决定起了作用。", "sp": null}], [{"id": "s1_1_0", "md": "Notice the less visible work, too.", "text": "Notice the less visible work, too.", "zh": "也要注意那些不那么显眼的工作。", "sp": null}, {"id": "s1_1_1", "md": "Anyone can praise a big feature, but cleaning up flaky tests, writing a clear runbook, or ==mentoring== a new hire often __goes unnoticed__.", "text": "Anyone can praise a big feature, but cleaning up flaky tests, writing a clear runbook, or mentoring a new hire often goes unnoticed.", "zh": "谁都会夸一个大功能，但清理不稳定的测试、写一份清晰的 runbook、带新人，这些往往没人注意到。", "sp": null}, {"id": "s1_1_2", "md": "When you praise those things, you tell the whole team that they count.", "text": "When you praise those things, you tell the whole team that they count.", "zh": "当你表扬这些事情时，你是在告诉整个团队：这些也算数。", "sp": null}], [{"id": "s1_2_0", "md": "Choose the right audience.", "text": "Choose the right audience.", "zh": "选对场合。", "sp": null}, {"id": "s1_2_1", "md": "Some people love public ==recognition==; others find it embarrassing and prefer a private message.", "text": "Some people love public recognition; others find it embarrassing and prefer a private message.", "zh": "有些人很喜欢公开表扬；另一些人会觉得尴尬，更喜欢私信。", "sp": null}, {"id": "s1_2_2", "md": "If you are not sure, ask, or __do both__: a short public note and a longer private one.", "text": "If you are not sure, ask, or do both: a short public note and a longer private one.", "zh": "如果拿不准，就问一下，或者两样都做：公开说一句简短的，私下再发一段长的。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, praise the process, not only the result.", "text": "Finally, praise the process, not only the result.", "zh": "最后，表扬过程，而不只是结果。", "sp": null}, {"id": "s1_3_1", "md": "A careful experiment that failed can deserve more credit than a lucky success.", "text": "A careful experiment that failed can deserve more credit than a lucky success.", "zh": "一个严谨但失败了的实验，可能比一次侥幸的成功更值得肯定。", "sp": null}, {"id": "s1_3_2", "md": "**When you reward good thinking instead of good luck, people take smarter risks.**", "text": "When you reward good thinking instead of good luck, people take smarter risks.", "zh": "当你奖励的是好的思考而不是好运气时，大家才会冒更聪明的风险。", "sp": null}]]}], "gist": [{"q": "作者认为 \"Great job, you're amazing\" 这类表扬有什么问题？", "a": "几乎没有信息量，没人学到什么，真正默默救场的人感觉被忽视。"}, {"q": "为什么夸人「聪明」更有风险？", "a": "它让人学会维护形象，回避可能显得不够聪明的难题。"}, {"q": "好的表扬应该怎么做？", "a": "点出具体行动和它的效果；关注不显眼的工作（修不稳定测试、写 runbook、带新人）；选对公开或私下的场合；表扬过程和思考，而不只是结果。"}], "dictation": [{"id": "s0_2_0", "text": "Praise is a tool for telling people what to repeat."}, {"id": "s1_0_0", "text": "Good praise names a specific action and its effect."}, {"id": "s1_3_1", "text": "A careful experiment that failed can deserve more credit than a lucky success."}, {"id": "s1_3_2", "text": "When you reward good thinking instead of good luck, people take smarter risks."}], "shadow": {"text": "Notice the less visible work, too. Anyone can praise a big feature, but cleaning up flaky tests, writing a clear runbook, or mentoring a new hire often goes unnoticed. When you praise those things, you tell the whole team that they count.", "marked": "Notice the <b>less visible</b> work, / too. //<br>Anyone can praise a <b>big</b> feature, / but cleaning up <b>flaky</b> tests, / writing a clear <b>runbook</b>, / or <b>mentoring</b> a new hire / often goes <b>unnoticed</b>. //<br>When you praise <b>those</b> things, / you tell the <b>whole</b> team / that they <b>count</b>. //"}, "prompts": [{"q": "一位工程师花了一周把一批不稳定的测试修好了，CI 变得可靠。用 30 秒在周会上具体地表扬他做的事和带来的效果。", "ref": "I want to call out something that's easy to miss. Over the last week, Arjun fixed almost all of the flaky tests in the checkout pipeline. Before that, we were rerunning builds three or four times a day and losing trust in red results. This week, a red build actually means something is broken. That's saved every one of us time, so thank you, Arjun.", "ref_zh": "我想特别提一件很容易被忽略的事。过去一周，Arjun 把结账流水线里几乎所有不稳定的测试都修好了。在那之前，我们每天要把构建重跑三四次，对红色结果已经不信任了。这周，构建一红就真的说明有东西坏了。这给我们每个人都省了时间，所以谢谢你，Arjun。", "id": "ref0"}, {"q": "下属做了一个实验，结果没有达到预期，但实验设计得很严谨。用 30 秒私下表扬他的过程而不是结果。", "ref": "I know the experiment didn't give us the lift we hoped for, but I want you to know I thought it was really well done. You defined the success metric before you started, you ran it long enough, and you stopped as soon as the guardrail moved. Because of that, we can trust the result and move on quickly. That's exactly the kind of thinking I want more of.", "ref_zh": "我知道这个实验没带来我们期望的提升，但我想让你知道，我觉得它做得非常好。你在开始前就定义了成功指标，跑的时间足够长，护栏指标一动就马上停了。正因为这样，我们可以信任这个结果，并且很快往下走。这正是我希望多一些的思考方式。", "id": "ref1"}], "words": [{"w": "invisible", "ipa": "/ɪnˈvɪzəbl/", "zh": "看不见的、被忽视的", "ex": "A lot of platform work is invisible until something breaks.", "id": "w0"}, {"w": "risky", "ipa": "/ˈrɪski/", "zh": "有风险的", "ex": "Deploying on Friday afternoon is riskier than it looks.", "id": "w1"}, {"w": "steer", "ipa": "/stɪr/", "zh": "引导、掌舵", "ex": "Can you steer the disc // recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
