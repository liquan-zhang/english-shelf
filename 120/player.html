const D = {"id": "120", "type": "dialogue", "title": "Talking to an Insurance Agent", "meta": "B2 · 约 280 词 · 场景：咨询家庭医疗保险与理赔", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Insurance Agent", "name_zh": "保险顾问", "voice": "en-AU-WilliamMultilingualNeural"}}, "gist": [{"q": "这份家庭医疗险的自付部分怎么算？", "a": "每年免赔额两千元，之后自付百分之十，封顶三千元，最坏一年最多付五千元。"}, {"q": "儿子的哮喘会有什么影响？", "a": "可能被当作既往病症除外，需要看病历才能决定。"}, {"q": "顾问推销储蓄计划时「你」怎么回应的？最后怎么收尾？", "a": "说想把保险和储蓄分开，先只谈医疗险；今天不签，要完整条款回去和太太商量，下周答复。"}], "dictation": [{"id": "s0_3_0", "text": "What's the deductible, and how much would we still have to pay ourselves?"}, {"id": "s1_1_0", "text": "I'd rather keep insurance and savings separate. Let's focus on the health plan for now."}, {"id": "s1_3_0", "text": "Not today. Could you send me the full policy wording so I can read the fine print?"}, {"id": "s1_9_0", "text": "That's helpful. I'll go through it with my wife and get back to you next week."}], "shadow": {"speaker": "A", "text": "Thanks. And if we do need to claim, how does it work? Do we pay first and get reimbursed?", "marked": "<b>Thanks</b>. //<br>And if we <b>do</b> need to <b>claim</b>, / how does it <b>work</b>? //<br>Do we <b>pay first</b> / and get <b>reimbursed</b>? //"}, "prompts": [{"q": "你想给全家买一份旅游保险，下个月回国过年。打电话问保不保航班延误、孩子生病看急诊，以及丢行李怎么理赔。", "ref": "Hi, we're flying to China next month with our three-year-old, and I'm looking at your family travel plan. Does it cover flight delays, and from how many hours? If my son gets sick and needs to see a doctor there, is that covered? And if a bag goes missing, what documents would I need to make a claim?", "ref_zh": "你好，我们下个月要带三岁的孩子回中国，我在看你们的家庭旅游险。航班延误保吗？延误几个小时起算？如果儿子在那边生病要看医生，保不保？如果行李丢了，理赔需要哪些材料？", "id": "ref0"}, {"q": "你的理赔申请被拒了，理由是既往病症，但你认为这次就诊和以前的病无关。打电话给保险公司提出复议。", "ref": "Hi, I'm calling about a claim that was rejected last week. The letter says it's a pre-existing condition, but I don't think that's right. My son saw the doctor for an ear infection, which has nothing to do with his asthma. Could you review the claim again? I can send a letter from his doctor if that helps.", "ref_zh": "你好，我打电话是关于上周被拒的一笔理赔。信里说属于既往病症，但我觉得不对。我儿子这次看的是耳朵感染，跟他的哮喘没关系。能重新审核一下吗？需要的话我可以提供医生的证明信。", "id": "ref1"}], "words": [{"w": "deductible", "ipa": "/dɪˈdʌktəbəl/", "zh": "免赔额", "ex": "A higher deductible means a lower monthly premium.", "id": "w0"}, {"w": "co-payment", "ipa": "/ˌkoʊ ˈpeɪmənt/", "zh": "共付额，自付比例", "ex": "There's a small co-payment for each clinic visit.", "id": "w1"}, {"w": "premium", "ipa": "/ˈpriːmiəm/", "zh": "保费", "ex": "Our car insurance premium went up this year.", "id": "w2"}, {"w": "exclude", "ipa": "/ɪkˈskluːd/", "zh": "除外，不包括", "ex": "Dental care is excluded from this plan.", "id": "w3"}, {"w": "pre-existing condition", "ipa": "/ˌpriː ɪɡˈzɪstɪŋ kənˈdɪʃən/", "zh": "既往病症", "ex": "Most plans don't cover pre-existing conditions straight away.", "id": "w4"}, {"w": "wording", "ipa": "/ˈwɜːrdɪŋ/", "zh": "（保单）条款措辞", "ex": "Always read the policy wording, not just the brochure.", "id": "w5"}, {"w": "claim", "ipa": "/kleɪm/", "zh": "理赔；索赔", "ex": "You can claim for the taxi if your flight is cancelled.", "id": "w6"}, {"w": "reimburse", "ipa": "/ˌriːɪmˈbɜːrs/", "zh": "报销，偿还", "ex": "My company reimburses me for the phone bill.", "id": "w7"}, {"w": "waiting period", "ipa": "/ˈweɪtɪŋ ˈpɪriəd/", "zh": "等待期", "ex": "There's a thirty-day waiting period for illness.", "id": "w8"}], "sections": [{"heading": "1. What the Plan Covers", "heading_zh": "1. 这份保险保什么", "rows": [[{"id": "s0_0_0", "md": "Thanks for coming in. So you're looking at health cover for the whole family?", "text": "Thanks for coming in. So you're looking at health cover for the whole family?", "zh": "谢谢您过来。您是想给全家买医疗保险，对吧？", "sp": "B"}], [{"id": "s0_1_0", "md": "Yes. My company plan only covers me, so I want something for my wife and our son.", "text": "Yes. My company plan only covers me, so I want something for my wife and our son.", "zh": "对。公司的保险只保我一个人，我想给太太和儿子也买一份。", "sp": "A"}], [{"id": "s0_2_0", "md": "This family plan covers hospital stays, surgery, and specialist visits, both here and in Malaysia.", "text": "This family plan covers hospital stays, surgery, and specialist visits, both here and in Malaysia.", "zh": "这个家庭计划保住院、手术和专科门诊，新加坡和马来西亚都保。", "sp": "B"}], [{"id": "s0_3_0", "md": "**What's the deductible, and how much would we still have to pay ourselves?**", "text": "What's the deductible, and how much would we still have to pay ourselves?", "zh": "免赔额是多少？我们自己还要付多少？", "sp": "A"}], [{"id": "s0_4_0", "md": "The ==deductible== is two thousand dollars a year. After that, there's ten percent ==co-payment==, __capped at__ three thousand.", "text": "The deductible is two thousand dollars a year. After that, there's ten percent co-payment, capped at three thousand.", "zh": "免赔额每年两千元。超过后自付百分之十，封顶三千元。", "sp": "B"}], [{"id": "s0_5_0", "md": "So the most we'd pay in a bad year is five thousand. What's the ==premium==?", "text": "So the most we'd pay in a bad year is five thousand. What's the premium?", "zh": "那情况最糟的一年，我们最多付五千。保费是多少？", "sp": "A"}], [{"id": "s0_6_0", "md": "For the three of you, around two hundred and sixty dollars a month.", "text": "For the three of you, around two hundred and sixty dollars a month.", "zh": "你们三个人，每月大概两百六十元。", "sp": "B"}], [{"id": "s0_7_0", "md": "My son had asthma when he was a baby. Would that be ==excluded==?", "text": "My son had asthma when he was a baby. Would that be excluded?", "zh": "我儿子婴儿时期有过哮喘。这个会被除外吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "It may be, as a ==pre-existing condition==. We'd need his medical records to __make a decision__.", "text": "It may be, as a pre-existing condition. We'd need his medical records to make a decision.", "zh": "有可能，属于既往病症。我们需要看他的病历才能决定。", "sp": "B"}]]}, {"heading": "2. Not So Fast", "heading_zh": "2. 先别急着签", "rows": [[{"id": "s1_0_0", "md": "Now, a lot of families also add our savings plan. It __builds up__ cash value for your son's education.", "text": "Now, a lot of families also add our savings plan. It builds up cash value for your son's education.", "zh": "另外，很多家庭会加上我们的储蓄计划，可以为孩子教育攒现金价值。", "sp": "B"}], [{"id": "s1_1_0", "md": "**I'd rather keep insurance and savings separate. Let's focus on the health plan for now.**", "text": "I'd rather keep insurance and savings separate. Let's focus on the health plan for now.", "zh": "我更想把保险和储蓄分开。现在先专注医疗险吧。", "sp": "A"}], [{"id": "s1_2_0", "md": "Fair enough. Can I ask how quickly you'd like to sign up?", "text": "Fair enough. Can I ask how quickly you'd like to sign up?", "zh": "可以理解。请问您打算多快投保？", "sp": "B"}], [{"id": "s1_3_0", "md": "Not today. Could you send me the full policy ==wording== so I can read the fine print?", "text": "Not today. Could you send me the full policy wording so I can read the fine print?", "zh": "今天不签。能把完整的保单条款发给我吗？我想看看细则。", "sp": "A"}], [{"id": "s1_4_0", "md": "Sure, I'll email it tonight, along with a summary of the benefits.", "text": "Sure, I'll email it tonight, along with a summary of the benefits.", "zh": "当然，今晚就发邮件给您，附上保障摘要。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thanks. And if we do need to ==claim==, how does it work? Do we pay first and get ==reimbursed==?", "text": "Thanks. And if we do need to claim, how does it work? Do we pay first and get reimbursed?", "zh": "谢谢。如果真要理赔，流程是怎样的？是先自己付钱再报销吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "At our panel hospitals, we pay them directly. Elsewhere, you __submit the bills__ in the app within ninety days.", "text": "At our panel hospitals, we pay them directly. Elsewhere, you submit the bills in the app within ninety days.", "zh": "在我们的合作医院，我们直接跟医院结算。其他医院的话，九十天内在应用里提交账单。", "sp": "B"}], [{"id": "s1_7_0", "md": "And is there a ==waiting period== before the cover starts?", "text": "And is there a waiting period before the cover starts?", "zh": "保障生效前有等待期吗？", "sp": "A"}], [{"id": "s1_8_0", "md": "Thirty days for illness, but accide const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
