const D = {"id": "120", "type": "dialogue", "title": "Talking to an Insurance Agent", "meta": "B2 · 约 280 词 · 场景：咨询家庭医疗保险与理赔", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Insurance Agent", "name_zh": "保险顾问", "voice": "en-AU-WilliamMultilingualNeural"}}, "gist": [{"q": "这份家庭医疗险的自付部分怎么算？", "a": "每年免赔额两千元，之后自付百分之十，封顶三千元，最坏一年最多付五千元。"}, {"q": "儿子的哮喘会有什么影响？", "a": "可能被当作既往病症除外，需要看病历才能决定。"}, {"q": "顾问推销储蓄计划时「你」怎么回应的？最后怎么收尾？", "a": "说想把保险和储蓄分开，先只谈医疗险；今天不签，要完整条款回去和太太商量，下周答复。"}], "dictation": [{"id": "s0_3_0", "text": "What's the deductible, and how much would we still have to pay ourselves?"}, {"id": "s1_1_0", "text": "I'd rather keep insurance and savings separate. Let's focus on the health plan for now."}, {"id": "s1_3_0", "text": "Not today. Could you send me the full policy wording so I can read the fine print?"}, {"id": "s1_9_0", "text": "That's helpful. I'll go through it with my wife and get back to you next week."}], "shadow": {"speaker": "A", "text": "Thanks. And if we do need to claim, how does it work? Do we pay first and get reimbursed?", "marked": "<b>Thanks</b>. //<br>And if we <b>do</b> need to <b>claim</b>, / how does it <b>work</b>? //<br>Do we <b>pay first</b> / and get <b>reimbursed</b>? //"}, "prompts": [{"q": "你想给全家买一份旅游保险，下个月回国过年。打电话问保不保航班延误、孩子生病看急诊，以及丢行李怎么理赔。", "ref": "Hi, we're flying to China next month with our three-year-old, and I'm looking at your family travel plan. Does it cover flight delays, and from how many hours? If my son gets sick and needs to see a doctor there, is that covered? And if a bag goes missing, what documents would I need to make a claim?", "ref_zh": "你好，我们下个月要带三岁的孩子回中国，我在看你们的家庭旅游险。航班延误保吗？延误几个小时起算？如果儿子在那边生病要看医生，保不保？如果行李丢了，理赔需要哪些材料？", "id": "ref0"}, {"q": "你的理赔申请被拒了，理由是既往病症，但你认为这次就诊和以前的病无关。打电话给保险公司提出复议。", "ref": "Hi, I'm calling about a claim that was rejected last week. The letter says it's a pre-existing condition, but I don't think that's right. My son saw the doctor for an ear infection, which has nothing to do with his asthma. Could you review the claim again? I can send a letter from his doctor if that helps.", "ref_zh": "你好，我打电话是关于上周被拒的一笔理赔。信里说属于既往病症，但我觉得不对。我儿子这次看的是耳朵感染，跟他的哮喘没关系。能重新审核一下吗？需要的话我可以提供医生的证明信。", "id": "ref1"}], "words": [{"w": "deductible", "ipa": "/dɪˈdʌktəbəl/", "zh": "免赔额", "ex": "A higher deductible means a lower monthly premium.", "id": "w0"}, {"w": "co-payment", "ipa": "/ˌkoʊ ˈpeɪmənt/", "zh": "共付额，自付比例", "ex": "There's a small co-payment for each clinic visit.", "id": "w1"}, {"w": "premium", "ipa": "/ˈpriːmiəm/", "zh": "保费", "ex": "Our car insurance premium went up this year.", "id": "w2"}, {"w": "exclude", "ipa": "/ɪkˈskluːd/", "zh": "除外，不包括", "ex": "Dental care is excluded from this plan.", "id": "w3"}, {"w": "pre-existing condition", "ipa": "/ˌpriː ɪɡˈzɪstɪŋ kənˈdɪʃən/", "zh": "既往病症", "ex": "Most plans don't cover pre-existing conditions straight away.", "id": "w4"}, {"w": "wording", "ipa": "/ˈwɜːrdɪŋ/", "zh": "（保单）条款措辞", "ex": "Always read the policy wording, not just the brochure.", "id": "w5"}, {"w": "claim", "ipa": "/kleɪm/", "zh": "理赔；索赔", "ex": "You can claim for the taxi if your flight is cancelled.", "id": "w6"}, {"w": "reimburse", "ipa": "/ˌriːɪmˈbɜːrs/", "zh": "报销，偿还", "ex": "My company reimburses me for the phone bill.", "id": "w7"}, {"w": "waiting period", "ipa": "/ˈweɪtɪŋ ˈpɪriəd/", "zh": "等待期", "ex": "There's a thirty-day waiting period for illness.", "id": "w8"}], "sections": [{"heading": "1. What the Plan Covers", "heading_zh": "1. 这份保险保什么", "rows": [[{"id": "s0_0_0", "md": "Thanks for coming in. So you're looking at health cover for the whole family?", "text": "Thanks for coming in. So you're looking at health cover for the whole family?", "zh": "谢谢您过来。您是想给全家买医疗保险，对吧？", "sp": "B"}], [{"id": "s0_1_0", "md": "Yes. My company plan only covers me, so I want something for my wife and our son.", "text": "Yes. My company plan only covers me, so I want something for my wife and our son.", "zh": "对。公司的保险只保我一个人，我想给太太和儿子也买一份。", "sp": "A"}], [{"id": "s0_2_0", "md": "This family plan covers hospital stays, surgery, and specialist visits, both here and in Malaysia.", "text": "This family plan covers hospital stays, surgery, and specialist visits, both here and in Malaysia.", "zh": "这个家庭计划保住院、手术和专科门诊，新加坡和马来西亚都保。", "sp": "B"}], [{"id": "s0_3_0", "md": "**What's the deductible, and how much would we still have to pay ourselves?**", "text": "What's the deductible, and how much would we still have to pay ourselves?", "zh": "免赔额是多少？我们自己还要付多少？", "sp": "A"}], [{"id": "s0_4_0", "md": "The ==deductible== is two thousand dollars a year. After that, there's ten percent ==co-payment==, __capped at__ three thousand.", "text": "The deductible is two thousand dollars a year. After that, there's ten percent co-payment, capped at three thousand.", "zh": "免赔额每年两千元。超过后自付百分之十，封顶三千元。", "sp": "B"}], [{"id": "s0_5_0", "md": "So the most we'd pay in a bad year is five thousand. What's the ==premium==?", "text": "So the most we'd pay in a bad year is five thousand. What's the premium?", "zh": "那情况最糟的一年，我们最多付五千。保费是多少？", "sp": "A"}], [{"id": "s0_6_0", "md": "For the three of you, around two hundred and sixty dollars a month.", "text": "For the three of you, around two hundred and sixty dollars a month.", "zh": "你们三个人，每月大概两百六十元。", "sp": "B"}], [{"id": "s0_7_0", "md": "My son had asthma when he was a baby. Would that be ==excluded==?", "text": "My son had asthma when he was a baby. Would that be excluded?", "zh": "我儿子婴儿时期有过哮喘。这个会被除外吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "It may be, as a ==pre-existing condition==. We'd need his medical records to __make a decision__.", "text": "It may be, as a pre-existing condition. We'd need his medical records to make a decision.", "zh": "有可能，属于既往病症。我们需要看他的病历才能决定。", "sp": "B"}]]}, {"heading": "2. Not So Fast", "heading_zh": "2. 先别急着签", "rows": [[{"id": "s1_0_0", "md": "Now, a lot of families also add our savings plan. It __builds up__ cash value for your son's education.", "text": "Now, a lot of families also add our savings plan. It builds up cash value for your son's education.", "zh": "另外，很多家庭会加上我们的储蓄计划，可以为孩子教育攒现金价值。", "sp": "B"}], [{"id": "s1_1_0", "md": "**I'd rather keep insurance and savings separate. Let's focus on the health plan for now.**", "text": "I'd rather keep insurance and savings separate. Let's focus on the health plan for now.", "zh": "我更想把保险和储蓄分开。现在先专注医疗险吧。", "sp": "A"}], [{"id": "s1_2_0", "md": "Fair enough. Can I ask how quickly you'd like to sign up?", "text": "Fair enough. Can I ask how quickly you'd like to sign up?", "zh": "可以理解。请问您打算多快投保？", "sp": "B"}], [{"id": "s1_3_0", "md": "Not today. Could you send me the full policy ==wording== so I can read the fine print?", "text": "Not today. Could you send me the full policy wording so I can read the fine print?", "zh": "今天不签。能把完整的保单条款发给我吗？我想看看细则。", "sp": "A"}], [{"id": "s1_4_0", "md": "Sure, I'll email it tonight, along with a summary of the benefits.", "text": "Sure, I'll email it tonight, along with a summary of the benefits.", "zh": "当然，今晚就发邮件给您，附上保障摘要。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thanks. And if we do need to ==claim==, how does it work? Do we pay first and get ==reimbursed==?", "text": "Thanks. And if we do need to claim, how does it work? Do we pay first and get reimbursed?", "zh": "谢谢。如果真要理赔，流程是怎样的？是先自己付钱再报销吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "At our panel hospitals, we pay them directly. Elsewhere, you __submit the bills__ in the app within ninety days.", "text": "At our panel hospitals, we pay them directly. Elsewhere, you submit the bills in the app within ninety days.", "zh": "在我们的合作医院，我们直接跟医院结算。其他医院的话，九十天内在应用里提交账单。", "sp": "B"}], [{"id": "s1_7_0", "md": "And is there a ==waiting period== before the cover starts?", "text": "And is there a waiting period before the cover starts?", "zh": "保障生效前有等待期吗？", "sp": "A"}], [{"id": "s1_8_0", "md": "Thirty days for illness, but accide const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
