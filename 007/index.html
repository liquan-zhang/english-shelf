<script>
const D = {"id": "007", "title": "Running a Meeting That Ends on Time", "meta": "B2 · 约 260 词 · 场景：主持会议", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Topics Expand, Questions Finish", "heading_zh": "1. 话题会膨胀，问题会收尾", "rows": [[{"id": "s0_0_0", "md": "Most meetings run over for one simple reason.", "text": "Most meetings run over for one simple reason.", "zh": "大多数会议超时，原因很简单。", "sp": null}, {"id": "s0_0_1", "md": "The agenda lists topics, not outcomes.", "text": "The agenda lists topics, not outcomes.", "zh": "议程上列的是话题，不是产出。", "sp": null}, {"id": "s0_0_2", "md": "\"Q four roadmap\" can fill an hour, a day, or a whole week, because there is no point where it is ==obviously== done.", "text": "\"Q four roadmap\" can fill an hour, a day, or a whole week, because there is no point where it is obviously done.", "zh": "「Q4 路线图」可以聊一小时、一天，甚至一整周，因为它没有一个明显的终点。", "sp": null}], [{"id": "s0_1_0", "md": "Compare that with \"Decide which two projects we cut from the Q four roadmap.\"", "text": "Compare that with \"Decide which two projects we cut from the Q four roadmap.\"", "zh": "对比一下「决定从 Q4 路线图里砍掉哪两个项目」。", "sp": null}, {"id": "s0_1_1", "md": "Now everyone knows what finished looks like.", "text": "Now everyone knows what finished looks like.", "zh": "这下大家都知道怎样才算完成了。", "sp": null}, {"id": "s0_1_2", "md": "People bring ==relevant== data instead of general opinions, and side topics are easier to __spot and set aside__.", "text": "People bring relevant data instead of general opinions, and side topics are easier to spot and set aside.", "zh": "大家会带着相关数据来，而不是泛泛而谈，跑题的话题也更容易被发现、被搁置。", "sp": null}], [{"id": "s0_2_0", "md": "**Write every agenda item as a question the group must answer.**", "text": "Write every agenda item as a question the group must answer.", "zh": "把每个议程项都写成一个大家必须回答的问题。", "sp": null}, {"id": "s0_2_1", "md": "If you cannot turn an item into a question, it probably belongs in an email.", "text": "If you cannot turn an item into a question, it probably belongs in an email.", "zh": "如果某一项转不成问题，那它大概发邮件就行了。", "sp": null}, {"id": "s0_2_2", "md": "This one habit __cuts more time__ than any meeting tool or ==strict== rule.", "text": "This one habit cuts more time than any meeting tool or strict rule.", "zh": "光这一个习惯省下的时间，比任何会议工具或严格规定都多。", "sp": null}]]}, {"heading": "2. Keeping the Clock Visible", "heading_zh": "2. 让时间一直摆在明面上", "rows": [[{"id": "s1_0_0", "md": "Once the meeting starts, give each question a ==time box== and say it out loud.", "text": "Once the meeting starts, give each question a time box and say it out loud.", "zh": "会议一开始，就给每个问题定一个时间盒，并且说出来。", "sp": null}, {"id": "s1_0_1", "md": "\"We have fifteen minutes for the hiring plan.\"", "text": "\"We have fifteen minutes for the hiring plan.\"", "zh": "「招聘计划我们留十五分钟。」", "sp": null}, {"id": "s1_0_2", "md": "Saying the number makes the limit feel shared, not like a rule you are ==enforcing== alone.", "text": "Saying the number makes the limit feel shared, not like a rule you are enforcing alone.", "zh": "把数字说出口，这个限制就变成了大家共同的约定，而不像是你一个人在执行规定。", "sp": null}], [{"id": "s1_1_0", "md": "Halfway through each item, give a quick check.", "text": "Halfway through each item, give a quick check.", "zh": "每一项讨论到一半，做一个快速检查。", "sp": null}, {"id": "s1_1_1", "md": "\"We're at seven minutes, and I'm hearing two options.\"", "text": "\"We're at seven minutes, and I'm hearing two options.\"", "zh": "「现在七分钟了，我听到的是两个选项。」", "sp": null}, {"id": "s1_1_2", "md": "This small update pulls people back from details without anyone __feeling cut off__.", "text": "This small update pulls people back from details without anyone feeling cut off.", "zh": "这个小小的同步能把大家从细节里拉回来，又不会让人觉得被打断。", "sp": null}], [{"id": "s1_2_0", "md": "Five minutes before the end, stop the discussion, even if it is going well.", "text": "Five minutes before the end, stop the discussion, even if it is going well.", "zh": "结束前五分钟，停止讨论，哪怕正聊得热火朝天。", "sp": null}, {"id": "s1_2_1", "md": "Use that time to confirm decisions and owners.", "text": "Use that time to confirm decisions and owners.", "zh": "用这段时间确认决定和负责人。", "sp": null}, {"id": "s1_2_2", "md": "**A meeting that ends on time with clear next steps beats a perfect discussion that runs over.**", "text": "A meeting that ends on time with clear next steps beats a perfect discussion that runs over.", "zh": "一个准时结束、下一步清晰的会，胜过一场超时的完美讨论。", "sp": null}], [{"id": "s1_3_0", "md": "And when you finish early, let people go.", "text": "And when you finish early, let people go.", "zh": "如果提前结束了，就放大家走。", "sp": null}, {"id": "s1_3_1", "md": "Nobody has ever complained about getting ten minutes back.", "text": "Nobody has ever complained about getting ten minutes back.", "zh": "从来没人抱怨过多出来十分钟。", "sp": null}, {"id": "s1_3_2", "md": "Over time, your meetings earn a ==reputation==, and people start showing up prepared, because they know you will __respect their time__.", "text": "Over time, your meetings earn a reputation, and people start showing up prepared, because they know you will respect their time.", "zh": "时间长了，你的会就有了口碑，大家会开始做好准备再来，因为他们知道你尊重他们的时间。", "sp": null}]]}], "gist": [{"q": "作者认为会议超时最主要的原因是什么？", "a": "议程写的是话题而不是要达成的结果，话题没有明显的结束点。"}, {"q": "怎样改写议程能让会议更高效？", "a": "把每个议题写成小组必须回答的问题；写不成问题的，可能发邮件就够了。"}, {"q": "会议进行中主持人如何控制时间？", "a": "每个议题说出时限；中途报时并概括现状；结束前五分钟停止讨论，确认决定和负责人；提前结束就放人。"}], "dictation": [{"id": "s0_2_0", "text": "Write every agenda item as a question the group must answer."}, {"id": "s1_2_2", "text": "A meeting that ends on time with clear next steps beats a perfect discussion that runs over."}, {"id": "s0_2_1", "text": "If you cannot turn an item into a question, it probably belongs in an email."}, {"id": "s1_3_1", "text": "Nobody has ever complained about getting ten minutes back."}], "shadow": {"text": "Once the meeting starts, give each question a time box and say it out loud. \"We have fifteen minutes for the hiring plan.\" Saying the number makes the limit feel shared, not like a rule you are enforcing alone.", "mark const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
