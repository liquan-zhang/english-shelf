const D = {"id": "142", "type": "dialogue", "title": "Dealing with a Noisy Neighbor", "meta": "B2 · 约 290 词 · 场景：楼上邻居噪音沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Neighbour", "name_zh": "邻居", "voice": "en-SG-WayneNeural"}}, "gist": [{"q": "「你」第一次上门反映的是什么噪音？对方怎么解释的？", "a": "深夜十一点后拖家具的声音，吵醒了三岁的儿子；对方刚搬来，下班后在拆箱挪东西，没意识到声音传得这么远。"}, {"q": "第一次沟通后双方约定了什么？", "a": "重活十点前做完，椅子脚下贴毛毡垫。"}, {"q": "周六早上的钻墙声是怎么回事？最后怎么处理的？", "a": "是装修师傅在装架子和电视挂架，物业规定九点前不许装修；邻居会去说，并避开午睡时间，周三前完工，双方还互留了电话。"}], "dictation": [{"id": "s0_2_0", "text": "I hope you don't mind me mentioning it, but there's been some noise late at night recently."}, {"id": "s0_8_0", "text": "Would it be possible to wrap up the heavy stuff by ten? That would really help."}, {"id": "s1_2_0", "text": "I see. Is there any chance he could start a bit later on weekends?"}, {"id": "s1_6_0", "text": "Great. Let me give you my number, so we can just text if anything comes up."}], "shadow": {"speaker": "A", "text": "Hi again. Sorry, the furniture noise has stopped, but there was drilling at eight this morning.", "marked": "Hi <b>again</b>. //<br><b>Sorry</b>, / the <b>furniture</b> noise has <b>stopped</b>, / but there was <b>drilling</b> / at <b>eight</b> this morning. //"}, "prompts": [{"q": "楼下邻居说你家小孩晚上跑跳太吵。用 30 秒回应：道歉、解释、给出具体改进办法。", "ref": "Oh, I'm really sorry about that. I had no idea it was that loud downstairs. Our son gets a burst of energy right before bed. We'll put down some play mats this weekend, and we'll try to keep him calm after nine. If it's still bad, please just knock or text me. I'd much rather know.", "ref_zh": "啊，真的很抱歉，我完全不知道楼下听得这么清楚。我儿子睡前总是特别兴奋。这周末我们会铺上游戏垫，九点以后尽量让他安静下来。如果还是吵，直接敲门或者给我发消息就行，我宁愿知道。", "id": "ref0"}, {"q": "隔壁每天晚上在走廊抽烟，烟飘进你家。友好地提出来，并提一个折中方案。", "ref": "Hi, sorry to bring this up. I've noticed the smoke from the corridor comes straight into our flat in the evenings, and we have a young child. I totally understand you need a break. Would you mind smoking down at the void deck or by the stairwell instead? It would make a big difference for us.", "ref_zh": "你好，不好意思提这件事。我发现晚上走廊的烟会直接飘进我们家，我们家有小孩。我完全理解你需要放松一下。能不能麻烦你去楼下架空层或者楼梯间那边抽？对我们来说帮助会很大。", "id": "ref1"}], "words": [{"w": "wake (someone) up", "ipa": "/weɪk ʌp/", "zh": "吵醒；叫醒", "ex": "The thunder woke the baby up at three in the morning.", "tts_w": "wake someone up", "tts": "The thunder woke the baby up at three in the morning.", "id": "w0"}, {"w": "unpack", "ipa": "/ʌnˈpæk/", "zh": "拆箱整理", "ex": "We still haven't unpacked the boxes in the study.", "id": "w1"}, {"w": "carry (v.)", "ipa": "/ˈkæri/", "zh": "（声音）传播", "ex": "Sound really carries in this building at night.", "tts_w": "carry", "id": "w2"}, {"w": "considerate", "ipa": "/kənˈsɪdərət/", "zh": "体贴的，为人着想的", "ex": "It was considerate of them to warn us about the party.", "id": "w3"}, {"w": "contractor", "ipa": "/ˈkɑːntræktər/", "zh": "装修承包商，施工师傅", "ex": "Our contractor said the kitchen will take two weeks.", "id": "w4"}, {"w": "bracket", "ipa": "/ˈbrækɪt/", "zh": "支架，挂架", "ex": "We need a bracket to mount the TV on the wall.", "id": "w5"}, {"w": "renovation", "ipa": "/ˌrenəˈveɪʃən/", "zh": "装修", "ex": "Renovation work is only allowed on weekdays here.", "id": "w6"}, {"w": "wrap up", "ipa": "/ræp ʌp/", "zh": "结束，收尾", "ex": "Let's wrap up the cleaning before the guests arrive.", "id": "w7"}, {"w": "pass on", "ipa": "/pæs ɑːn/", "zh": "转告", "ex": "I'll pass on your message to the manager.", "id": "w8"}], "sections": [{"heading": "1. Knocking on the Neighbour's Door", "heading_zh": "1. 敲开邻居家的门", "rows": [[{"id": "s0_0_0", "md": "Hi, sorry to bother you. I'm Lee, and I live __right below__ you.", "text": "Hi, sorry to bother you. I'm Lee, and I live right below you.", "zh": "你好，不好意思打扰一下。我姓李，就住你们楼下。", "sp": "A"}], [{"id": "s0_1_0", "md": "Oh, hi! Nice to finally meet you. Is everything okay?", "text": "Oh, hi! Nice to finally meet you. Is everything okay?", "zh": "哦，你好！终于见到你了。怎么了，有什么事吗？", "sp": "B"}], [{"id": "s0_2_0", "md": "**I hope you don't mind me mentioning it, but there's been some noise late at night recently.**", "text": "I hope you don't mind me mentioning it, but there's been some noise late at night recently.", "zh": "希望你别介意我提这个，最近晚上挺晚的时候有点吵。", "sp": "A"}], [{"id": "s0_3_0", "md": "Oh no, really? What kind of noise?", "text": "Oh no, really? What kind of noise?", "zh": "啊，真的吗？是什么样的声音？", "sp": "B"}], [{"id": "s0_4_0", "md": "It sounds like furniture being dragged around, usually after eleven. Our son is three, and it ==wakes== him up.", "text": "It sounds like furniture being dragged around, usually after eleven. Our son is three, and it wakes him up.", "zh": "听起来像是在拖家具，一般是十一点以后。我儿子三岁，会被吵醒。", "sp": "A"}], [{"id": "s0_5_0", "md": "I'm so sorry. We just moved in, so we've been ==unpacking== and moving things around after work.", "text": "I'm so sorry. We just moved in, so we've been unpacking and moving things around after work.", "zh": "真不好意思。我们刚搬进来，下班后一直在拆箱、挪东西。", "sp": "B"}], [{"id": "s0_6_0", "md": "That makes sense. I totally __get it__. Moving is exhausting.", "text": "That makes sense. I totally get it. Moving is exhausting.", "zh": "可以理解。我完全明白，搬家真的很累。", "sp": "A"}], [{"id": "s0_7_0", "md": "It really is. Honestly, I had no idea the sound ==carried== that much.", "text": "It really is. Honestly, I had no idea the sound carried that much.", "zh": "可不是嘛。说实话，我完全没想到声音会传得这么远。", "sp": "B"}], [{"id": "s0_8_0", "md": "Would it be possible to __wrap up__ the heavy stuff by ten? That would really help.", "text": "Would it be possible to wrap up the heavy stuff by ten? That would really help.", "zh": "重的东西能不能十点前弄完？那样就帮大忙了。", "sp": "A"}], [{"id": "s0_9_0", "md": "Of course. And we'll put some felt pads under the chairs too.", "text": "Of course. And we'll put some felt pads under the chairs too.", "zh": "当然可以。我们还会在椅子脚下贴毛毡垫。", "sp": "B"}], [{"id": "s0_10_0", "md": "That's really ==considerate== of you. Thanks for being so understanding.", "text": "That's really considerate of you. Thanks for being so understanding.", "zh": "你们真体贴。谢谢这么通情达理。", "sp": "A"}]]}, {"heading": "2. The Noise Comes Back", "heading_zh": "2. 噪音又来了", "rows": [[{"id": "s1_0_0", "md": "Hi again. Sorry, the furniture noise has stopped, but there was drilling at eight this morning.", "text": "Hi again. Sorry, the furniture noise has stopped, but there was drilling at eight this morning.", "zh": "又是我，不好意思。拖家具的声音已经没了，但今天早上八点有人在钻墙。", "sp": "A"}], [{"id": "s1_1_0", "md": "Ah, that's our ==contractor==. He's putting up shelves and a TV ==bracket==.", "text": "Ah, that's our contractor. He's putting up shelves and a TV bracket.", "zh": "啊，那是我们请的装修师傅。他在装架子和电视挂架。", "sp": "B"}], [{"id": "s1_2_0", "md": "**I see. Is there any chance he could start a bit later on weekends?**", "text": "I see. Is there any chance he could start a bit later on weekends?", "zh": "明白了。周末他能不能晚一点开工？", "sp": "A"}], [{"id": "s1_3_0", "md": "Actually, management says no ==renovation== work before nine. He shouldn't have started that early. I'll talk to him.", "text": "Actually, management says no renovation work before nine. He shouldn't have started that early. I'll talk to him.", "zh": "其实物业规定九点前不能装修。他不该那么早开工，我去跟他说。", "sp": "B"}], [{"id": "s1_4_0", "md": "Thanks. Our son naps from one to three, so __if possible__, could he avoid those hours too?", "text": "Thanks. Our son naps from one to three, so if possible, could he avoid those hours too?", "zh": "谢谢。我儿子一点到三点午睡，如果可以的话，这段时间也能避开吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "Sure, I'll __pass that on__. It should all be done by Wednesday.", "text": "Sure, I'll pass that on. It should all be done by Wednesday.", "zh": "没问题，我会转告他。周三之前应该就全部弄完了。", "sp": "B"}], [{"id": "s1_6_0", "md": "Great. Let me give you my number, so we can just text if anything __comes up__.", "text": "Great. Let me give you my number, so we can just text if anything comes up.", "zh": "太好了。我把电话留给你，有什么事直接发消息就行。", "sp": "A"}], [{"id": "s1_7 const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
