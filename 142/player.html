<script>
const D = {"id": "142", "type": "dialogue", "title": "Dealing with a Noisy Neighbor", "meta": "B2 · 约 290 词 · 场景：楼上邻居噪音沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Neighbour", "name_zh": "邻居", "voice": "en-SG-WayneNeural"}}, "gist": [{"q": "「你」第一次上门反映的是什么噪音？对方怎么解释的？", "a": "深夜十一点后拖家具的声音，吵醒了三岁的儿子；对方刚搬来，下班后在拆箱挪东西，没意识到声音传得这么远。"}, {"q": "第一次沟通后双方约定了什么？", "a": "重活十点前做完，椅子脚下贴毛毡垫。"}, {"q": "周六早上的钻墙声是怎么回事？最后怎么处理的？", "a": "是装修师傅在装架子和电视挂架，物业规定九点前不许装修；邻居会去说，并避开午睡时间，周三前完工，双方还互留了电话。"}], "dictation": [{"id": "s0_2_0", "text": "I hope you don't mind me mentioning it, but there's been some noise late at night recently."}, {"id": "s0_8_0", "text": "Would it be possible to wrap up the heavy stuff by ten? That would really help."}, {"id": "s1_2_0", "text": "I see. Is there any chance he could start a bit later on weekends?"}, {"id": "s1_6_0", "text": "Great. Let me give you my number, so we can just text if anything comes up."}], "shadow": {"speaker": "A", "text": "Hi again. Sorry, the furniture noise has stopped, but there was drilling at eight this morning.", "marked": "Hi <b>again</b>. //<br><b>Sorry</b>, / the <b>furniture</b> noise has <b>stopped</b>, / but there was <b>drilling</b> / at <b>eight</b> this morning. //"}, "prompts": [{"q": "楼下邻居说你家小孩晚上跑跳太吵。用 30 秒回应：道歉、解释、给出具体改进办法。", "ref": "Oh, I'm really sorry about that. I had no idea it was that loud downstairs. Our son gets a burst of energy right before bed. We'll put down some play mats this weekend, and we'll try to keep him calm after nine. If it's still bad, please just knock or text me. I'd much rather know.", "ref_zh": "啊，真的很抱歉，我完全不知道楼下听得这么清楚。我儿子睡前总是特别兴奋。这周末我们会铺上游戏垫，九点以后尽量让他安静下来。如果还是吵，直接敲门或者给我发消息就行，我宁愿知道。", "id": "ref0"}, {"q": "隔壁每天晚上在走廊抽烟，烟飘进你家。友好地提出来，并提一个折中方案。", "ref": "Hi, sorry to bring this up. I've noticed the smoke from the corridor comes straight into our flat in the evenings, and we have a young child. I totally understand you need a break. Would you mind smoking down at the void deck or by the stairwell instead? It would make a big difference for us.", "ref_zh": "你好，不好意思提这件事。我发现晚上走廊的烟会直接飘进我们家，我们家有小孩。我完全理解你需要放松一下。能不能麻烦你去楼下架空层或者楼梯间那边抽？对我们来说帮助会很大。", "id": "ref1"}], "words": [{"w": "wake (someone) up", "ipa": "/weɪk ʌp/", "zh": "吵醒；叫醒", "ex": "The thunder woke the baby up at three in the morning.", "tts_w": "wake someone up", "tts": "The thunder woke the baby up at three in the morning.", "id": "w0"}, {"w": "unpack", "ipa": "/ʌnˈpæk/", "zh": "拆箱整理", "ex": "We still haven't unpacked the boxes in the study.", "id": "w1"}, {"w": "carry (v.)", "ipa": "/ˈkæri/", "zh": "（声音）传播", "ex": "Sound really carries in this building at night.", "tts_w": "carry", "id": "w2"}, {"w": "considerate", "ipa": "/kənˈsɪdərət/", "zh": "体贴的，为人着想的", "ex": "It was considerate of them to warn us about the party.", "id": "w3"}, {"w": "contractor", "ipa": "/ˈkɑːntræktər/", "zh": "装修承包商，施工师傅", "ex": "Our contractor said the kitchen will take two weeks.", "id": "w4"}, {"w": "bracket", "ipa": "/ˈbrækɪt/", "zh": "支架，挂架", "ex": "We need a bracket to mount the TV on the wall.", "id": "w5"}, {"w": "renovation", "ipa": "/ˌrenəˈveɪʃən/", "zh": "装修", "ex": "Renovation work is only allowed on weekdays here.", "id": "w6"}, {"w": "wrap up", "ipa": "/ræp ʌp/", "zh": "结束，收尾", "ex": "Let's wrap up the cleaning before the guests arrive.", "id": "w7"}, {"w": "pass on", "ipa": "/pæs ɑːn/", "zh": "转告", "ex": "I'll pass on your message to the manager.", "id": "w8"}], "sections": [{"heading": "1. Knocking on the Neighbour's Door", "heading_zh": "1. 敲开邻居家的门", "rows": [[{"id": "s0_0_0", "md": "Hi, sorry to bother you. I'm Lee, and I live __right below__ you.", "text": "Hi, sorry to bother you. I'm Lee, and I live right below you.", "zh": "你好，不好意思打扰一下。我姓李，就住你们楼下。", "sp": "A"}], [{"id": "s0_1_0", "md": "Oh, hi! Nice to finally meet you. Is everything okay?", "text": "Oh, hi! Nice to finally meet you. Is everything okay?", "zh": "哦，你好！终于见到你了。怎么了，有什么事吗？", "sp": "B"}], [{"id": "s0_2_0", "md": "**I hope you don't mind me mentioning it, but there's been some noise late at night recently.**", "text": "I hope you don't mind me mentioning it, but there's been some noise late at night recently.", "zh": "希望你别介意我提这个，最近晚上挺晚的时候有点吵。", "sp": "A"}], [{"id": "s0_3_0", "md": "Oh no, really? What kind of noise?", "text": "Oh no, really? What kind of noise?", "zh": "啊，真的吗？是什么样的声音？", "sp": "B"}], [{"id": "s0_4_0", "md": "It sounds like furniture being dragged around, usually after eleven. Our son is three, and it ==wakes== him up.", "text": "It sounds like furniture being dragged around, usually after eleven. Our son is three, and it wakes him up.", "zh": "听起来像是在拖家具，一般是十一点以后。我儿子三岁，会被吵醒。", "sp": "A"}], [{"id": "s0_5_0", "md": "I'm so sorry. We just moved in, so we've been ==unpacking== and moving things around after work.", "text": "I'm so sorry. We just moved in, so we've been unpacking and moving things around after work.", "zh": "真不好意思。我们刚搬进来，下班后一直在拆箱、挪东西。", "sp": "B"}], [{"id": "s0_6_0", "md": "That makes sense. I totally __get it__. Moving is exhausting.", "text": "That makes sense. I totally get it. Moving is exhausting.", "zh": "可以理解。我完全明白，搬家真的很累。", "sp": "A"}], [{"id": "s0_7_0", "md": "It really is. Honestly, I had no idea the sound ==carried== that much.", "text": "It really is. Honestly, I had no idea the sound carried that much.", "zh": "可不是嘛。说实话，我完全没想到声音会传得这么远。", "sp": "B"}], [{"id": "s0_8_0", "md": "Would it be possible to __wrap up__ the heavy stuff by ten? That would really help.", "text": "Would it be possible to wrap up the heavy stuff by ten? That would really help.", "zh": "重的东西能不能十点前弄完？那样就帮大忙了。", "sp": "A"}], [{"id": "s0_9_0", "md": "Of course. And we'll put some felt pads under the chairs too.", "text": "Of course. And we'll put some felt pads under the chairs too.", "zh": "当然可以。我们还会在椅子脚下贴毛毡垫。", "sp": "B"}], [{"id": "s0_10_0", "md": "That's really ==considerate== of you. Thanks for being so understanding.", "text": "That's really considerate of you. Thanks for being so understanding.", "zh": "你们真体贴。谢谢这么通情达理。", "sp": "A"}]]}, {"heading": "2. The Noise Comes Back", "heading_zh": "2. 噪音又来了", "rows": [[{"id": "s1_0_0", "md": "Hi again. Sorry, the furniture noise has stopped, but there was drilling at eight this morning.", "text": "Hi again. Sorry, the furniture noise has stopped, but there was drilling at eight this morning.", "zh": "又是我，不好意思。拖家具的声音已经没了，但今天早上八点有人在钻墙。", "sp": "A"}], [{"id": "s1_1_0", "md": "Ah, that's our ==contractor==. He's putting up shelves and a TV ==bracket==.", "text": "Ah, that's our contractor. He's putting up shelves and a TV bracket.", "zh": "啊，那是我们请的装修师傅。他在装架子和电视挂架。", "sp": "B"}], [{"id": "s1_2_0", "md": "**I see. Is there any chance he could start a bit later on weekends?**", "text": "I see. Is there any chance he could start a bit later on weekends?", "zh": "明白了。周末他能不能晚一点开工？", "sp": "A"}], [{"id": "s1_3_0", "md": "Actually, management says no ==renovation== work before nine. He shouldn't have started that early. I'll talk to him.", "text": "Actually, management says no renovation work before nine. He shouldn't have started that early. I'll talk to him.", "zh": "其实物业规定九点前不能装修。他不该那么早开工，我去跟他说。", "sp": "B"}], [{"id": "s1_4_0", "md": "Thanks. Our son naps from one to three, so __if possible__, could he avoid those hours too?", "text": "Thanks. Our son naps from one to three, so if possible, could he avoid those hours too?", "zh": "谢谢。我儿子一点到三点午睡，如果可以的话，这段时间也能避开吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "Sure, I'll __pass that on__. It should all be done by Wednesday.", "text": "Sure, I'll pass that on. It should all be done by Wednesday.", "zh": "没问题，我会转告他。周三之前应该就全部弄完了。", "sp": "B"}], [{"id": "s1_6_0", "md": "Great. Let me give you my number, so we can just text if anything __comes up__.", "text": "Great. Let me give you my number, so we can just text if anything comes up.", "zh": "太好了。我把电话留给你，有什么事直接发消息就行。", "sp": "A"}], [{"id": "s1_7_0", "md": "Good idea. And please tell me straight away if it's still loud. I'd rather know.", "text": "Good idea. And please tell me straight away if it's still loud. I'd rather know.", "zh": "好主意。如果还是吵，请马上告诉我，我宁愿知道。", "sp": "B"}], [{"id": "s1_8_0", "md": "**Will do. And if you ever need anything, we're just downstairs.**", "text": "Will do. And if you ever need anything, we're just downstairs.", "zh": "一定。你们有什么需要也随时找我们，我们就在楼下。", "sp": "A"}], [{"id": "s1_9_0", "md": "Thanks, Lee. Let's grab a coffee once the place is sorted.", "text": "Thanks, Lee. Let's grab a coffee once the place is sorted.", "zh": "谢谢你，李先生。等家里收拾好了一起喝杯咖啡吧。", "sp": "B"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Knocking on the Neighbour's Door", "zh": "1. 敲开邻居家的门", "start": 0.0, "end": 2.352, "words": [[0.105, 0.329], [0.75, 1.066], [1.079, 1.158], [1.171, 1.25], [1.263, 1.618], [1.632, 1.974]]}, {"kind": "s", "id": "s0_0_0", "md": "Hi, sorry to bother you. I'm Lee, and I live __right below__ you.", "zh": "你好，不好意思打扰一下。我姓李，就住你们楼下。", "sp": "A", "gap": false, "start": 2.352, "end": 6.792, "words": [[2.47, 2.655], [3.049, 3.299], [3.313, 3.378], [3.391, 3.747], [3.76, 3.931], [4.378, 4.536], [4.549, 4.813], [5.155, 5.273], [5.286, 5.352], [5.365, 5.641], [5.655, 5.826], [5.839, 6.155], [6.168, 6.405]]}, {"kind": "s", "id": "s0_1_0", "md": "Oh, hi! Nice to finally meet you. Is everything okay?", "zh": "哦，你好！终于见到你了。怎么了，有什么事吗？", "sp": "B", "gap": false, "start": 6.792, "end": 13.848, "words": [[6.895, 7.25], [7.513, 7.987], [8.897, 9.252], [9.266, 9.384], [9.397, 9.858], [9.871, 10.16], [10.174, 10.634], [11.555, 11.779], [11.792, 12.266], [12.279, 12.924]]}, {"kind": "s", "id": "s0_2_0", "md": "**I hope you don't mind me mentioning it, but there's been some noise late at night recently.**", "zh": "希望你别介意我提这个，最近晚上挺晚的时候有点吵。", "sp": "A", "gap": false, "start": 13.848, "end": 18.36, "words": [[13.966, 14.032], [14.045, 14.216], [14.23, 14.322], [14.335, 14.532], [14.545, 14.769], [14.782, 14.861 116.461, 116.948]]}, {"kind": "s", "id": "s1_8_0", "md": "**Will do. And if you ever need anything, we're just downstairs.**", "zh": "一定。你们有什么需要也随时找我们，我们就在楼下。", "sp": "A", "gap": false, "start": 117.888, "end": 121.704, "words": [[117.993, 118.072], [118.085, 118.362], [118.796, 118.862], [118.875, 118.98], [118.993, 119.125], [119.138, 119.309], [119.322, 119.52], [119.533, 119.98], [120.296, 120.388], [120.401, 120.572], [120.585, 121.309]]}, {"kind": "s", "id": "s1_9_0", "md": "Thanks, Lee. Let's grab a coffee once the place is sorted.", "zh": "谢谢你，李先生。等家里收拾好了一起喝杯咖啡吧。", "sp": "B", "gap": false, "start": 121.704, "end": 127.872, "words": [[121.807, 122.504], [122.688, 123.228], [124.151, 124.52], [124.533, 124.796], [124.809, 124.888], [124.901, 125.309], [125.322, 125.625], [125.638, 125.783], [125.796, 126.112], [126.125, 126.257], [126.27, 126.941]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
