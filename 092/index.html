<script>
const D = {"id": "092", "title": "Asking Someone to Repeat Without Embarrassment", "meta": "B2 · 约 290 词 · 场景：请人重复", "voice": "en-SG-WayneNeural", "rate": "-5%", "sections": [{"heading": "1. The Cost of Nodding Along", "heading_zh": "1. 跟着点头的代价", "rows": [[{"id": "s0_0_0", "md": "Almost everyone in a global team has done it.", "text": "Almost everyone in a global team has done it.", "zh": "在全球化团队里，几乎每个人都干过这种事。", "sp": null}, {"id": "s0_0_1", "md": "A colleague speaks quickly, with an accent you are not used to, and you miss a key word.", "text": "A colleague speaks quickly, with an accent you are not used to, and you miss a key word.", "zh": "同事语速很快，带着你不熟的口音，你漏听了一个关键词。", "sp": null}, {"id": "s0_0_2", "md": "Instead of asking, you __nod along__ and hope it becomes clear later.", "text": "Instead of asking, you nod along and hope it becomes clear later.", "zh": "你没开口问，而是跟着点头，指望之后自然就明白了。", "sp": null}], [{"id": "s0_1_0", "md": "Sometimes it does.", "text": "Sometimes it does.", "zh": "有时候确实会明白。", "sp": null}, {"id": "s0_1_1", "md": "Often it does not, and the ==misunderstanding== shows up weeks later as the wrong feature or a missed deadline.", "text": "Often it does not, and the misunderstanding shows up weeks later as the wrong feature or a missed deadline.", "zh": "但更多时候不会，几周后这个误解就冒出来了，变成做错的功能或者错过的 deadline。", "sp": null}, {"id": "s0_1_2", "md": "**Pretending to understand feels polite in the moment, but it is the least polite choice in the long run.**", "text": "Pretending to understand feels polite in the moment, but it is the least polite choice in the long run.", "zh": "假装听懂，当下显得很礼貌，但长远看是最不礼貌的选择。", "sp": null}], [{"id": "s0_2_0", "md": "Asking someone to repeat is not a sign of weak English.", "text": "Asking someone to repeat is not a sign of weak English.", "zh": "请别人重复一遍，并不说明你英语差。", "sp": null}, {"id": "s0_2_1", "md": "Native speakers do it all the time, and they rarely ==apologize== for it.", "text": "Native speakers do it all the time, and they rarely apologize for it.", "zh": "母语者天天这么干，而且很少为此道歉。", "sp": null}, {"id": "s0_2_2", "md": "The difference is that they ask in a ==targeted== way that makes repeating easy.", "text": "The difference is that they ask in a targeted way that makes repeating easy.", "zh": "区别在于，他们问得很有针对性，让对方很容易重复。", "sp": null}]]}, {"heading": "2. Ask for the Missing Piece", "heading_zh": "2. 只问漏掉的那一块", "rows": [[{"id": "s1_0_0", "md": "Instead of a general \"Sorry?\", repeat the part you did catch and ask for the rest.", "text": "Instead of a general \"Sorry?\", repeat the part you did catch and ask for the rest.", "zh": "别笼统地来一句「Sorry？」，而是把你听到的那部分复述出来，再问剩下的。", "sp": null}, {"id": "s1_0_1", "md": "\"You said the release moves to Thursday, and then what was the second part?\"", "text": "\"You said the release moves to Thursday, and then what was the second part?\"", "zh": "「你说发布挪到周四，然后第二点是什么来着？」", "sp": null}, {"id": "s1_0_2", "md": "This shows you were listening and tells the speaker exactly what to ==clarify==.", "text": "This shows you were listening and tells the speaker exactly what to clarify.", "zh": "这说明你在认真听，也让对方清楚该澄清哪一块。", "sp": null}], [{"id": "s1_1_0", "md": "If a single word is the problem, ask about that word.", "text": "If a single word is the problem, ask about that word.", "zh": "如果只是某一个词没听清，就只问那个词。", "sp": null}, {"id": "s1_1_1", "md": "\"Sorry, did you say fifty or fifteen?\" or \"Could you spell the name of that service?\"", "text": "\"Sorry, did you say fifty or fifteen?\" or \"Could you spell the name of that service?\"", "zh": "「不好意思，你说的是五十还是十五？」或者「那个服务的名字能拼一下吗？」", "sp": null}, {"id": "s1_1_2", "md": "Numbers and names are the most common ==trouble spots==, so it is worth checking them every time.", "text": "Numbers and names are the most common trouble spots, so it is worth checking them every time.", "zh": "数字和名字是最容易出岔子的地方，所以每次都值得确认一下。", "sp": null}], [{"id": "s1_2_0", "md": "**Blame the line, not the person.**", "text": "Blame the line, not the person.", "zh": "怪线路，别怪人。", "sp": null}, {"id": "s1_2_1", "md": "\"The audio __cut out__ for a second\" or \"I think I missed that because of the noise here\" __takes the pressure off__ both of you.", "text": "\"The audio cut out for a second\" or \"I think I missed that because of the noise here\" takes the pressure off both of you.", "zh": "「刚才声音断了一下」或者「我这边太吵，好像没听到」，能给你们俩都减点压力。", "sp": null}, {"id": "s1_2_2", "md": "Nobody has to feel that their accent is the problem, even if it partly is.", "text": "Nobody has to feel that their accent is the problem, even if it partly is.", "zh": "谁都不用觉得是自己的口音有问题，哪怕确实有一部分原因在这儿。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, if you are still not sure, __play it back__ in your own words.", "text": "Finally, if you are still not sure, play it back in your own words.", "zh": "最后，如果还是不确定，就用自己的话复述一遍。", "sp": null}, {"id": "s1_3_1", "md": "\"Just to confirm, you need the report by Friday, not Monday, right?\"", "text": "\"Just to confirm, you need the report by Friday, not Monday, right?\"", "zh": "「我确认一下，报告是周五要，不是周一，对吧？」", "sp": null}, {"id": "s1_3_2", "md": "It takes five seconds and saves a week of ==rework==.", "text": "It takes five seconds and saves a week of rework.", "zh": "花五秒钟，能省下一周的返工。", "sp": null}]]}], "gist": [{"q": "为什么假装听懂是最不礼貌的选择？", "a": "当下看似礼貌，但误解几周后会变成做错的功能或错过的截止日期。"}, {"q": "比起笼统的 \"Sorry?\"，作者建议怎么请人重复？", "a": "复述你听到的部分，只问没听清的那部分；单个词就问那个词，数字和名字一定要核对。"}, {"q": "“怪线路不怪人”和最后一步分别指什么？", "a": "把没听清归因于音频或噪音，减轻双方压力；最后用自己的话复述确认，五秒钟省掉一周返工。"}], "dictation": [{"id": "s0_1_2", "text": "Pretending to understand feels polite in the moment, but it is the least polite choice in the long run."}, {"id": "s0_2_0", "text": "Asking someone to repeat is not a sign of weak English."}, {"id": "s1_2_0", "text": "Blame the line, not the person."}, {"id": "s1_3_2", "text": "It takes five seconds and saves a week of rework."}], "shadow": {"text": "Instead of a general \"Sorry?\", repeat the part you did catch and ask for the rest. \"You said the release moves to Thursday, and then what was the second part?\" This shows you were listening and tells the speaker exactly what to clarify.", "marked": "Instead of a general \"<b>Sorry</b>?\", / repeat the part you <b>did</b> catch / and ask for the <b>rest</b>. //<br>\"You said the release moves to <b>Thursday</b>, / and then what was the <b>second</b> part?\" //<br>This shows you were <b>listening</b> / and tells the speaker <b>exactly</b> / what to <b>clarify</b>. //"}, "prompts": [{"q": "印度同事在会上语速很快地说了一大段，你只听到 migrate the database 和 next sprint，中间没听清。精准地请他重复，30 秒。", "ref": "Sorry, Rahul, I want to make sure I got that right. You said we need to migrate the database in the next sprint, but I missed the part in the middle. Was it the user database or the logging one? And who's doing the migration? The audio dropped a little on my side.", "ref_zh": "不好意思 Rahul，我想确认一下我理解得对不对。你说我们下个 sprint 要迁移数据库，但中间那部分我没听到。是用户库还是日志库？迁移由谁来做？我这边刚才声音有点断。", "id": "ref0"}, {"q": "电话里合作方说了一个数字，你不确定是 fifteen 还是 fifty，截止时间也没听清。用复述来确认。", "ref": "Sorry, the line's a bit unclear on my end. Did you say fifteen thousand requests or fifty thousand? Fifty, got it, thanks. And just to confirm the timing, you need the first version by the end of this month, not the end of next month, right? Great, I'll send a short summary after the call.", "ref_zh": "不好意思，我这边信号不太清楚。你说的是一万五千次请求还是五万次？五万，好的，谢谢。时间上我也确认一下，第一版是这个月底要，不是下个月底，对吧？好，挂了电话我发个简短的纪要。", "id": "ref1"}], "words": [{"w": "misunderstanding", "ipa": "/ˌmɪsʌndərˈstændɪŋ/", "zh": "误解", "ex": "The delay came from a misunderstanding about who owned the API.", "id": "w0"}, {"w": "apologize", "ipa": "/əˈpɑːləˌdʒaɪz/", "zh": "道歉", "ex": "No need to apologize, just send the numbers when you have them.", "id": "w1"}, {"w": "targeted", "ipa": "/ˈtɑːrɡɪtɪd/", "zh": "有针对性的", "ex": "Instead of a general reminder, send a targeted message to the two owners.", "id": "w2"}, {"w": "clarify", "ipa": "/ˈklerəˌfaɪ/", "zh": "澄清、说明", "ex": "Could you clarify whether this applies to all regions?" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
