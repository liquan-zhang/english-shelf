<script>
const D = {"id": "141", "type": "dialogue", "title": "Meeting Your New Neighbor", "meta": "B2 · 约 250 词 · 场景：和新邻居打招呼与装修提前沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Neighbor", "name_zh": "邻居", "voice": "en-US-EmmaNeural"}}, "gist": [{"q": "「你」上门时介绍了自己家的哪些情况？", "a": "刚搬到隔壁，家里有太太和三岁的儿子；来新加坡一年左右，之前在市区附近租房，想要更大空间。"}, {"q": "装修安排是怎样的？", "a": "下周装修厨房，大约十天，只在工作日九点到五点施工，周末不施工，电钻只在头三天。"}, {"q": "邻居提了什么要求？「你」怎么回应？", "a": "希望保持走廊通畅；「你」保证让工人每天晚上清理，并留下电话，有打扰随时发短信。"}], "dictation": [{"id": "s0_0_0", "text": "Hi, sorry to bother you. I'm Wei. We just moved in next door, and I wanted to come over and say hello."}, {"id": "s0_2_0", "text": "Yes, that was us. It's me, my wife and our son. He's three, so apologies in advance for any noise."}, {"id": "s1_2_0", "text": "About ten days. They'll only work on weekdays, from nine to five, never on weekends."}, {"id": "s1_7_0", "text": "Here's my number. Please text me if anything bothers you."}], "shadow": {"speaker": "A", "text": "One more thing. We're doing some renovation next week, mainly the kitchen.", "marked": "One more <b>thing</b>. //<br>We're doing some <b>renovation</b> / next <b>week</b>, / mainly the <b>kitchen</b>. //"}, "prompts": [{"q": "楼上邻居家的孩子每晚十一点后还在跑跳。你去敲门，友好地提出来。", "ref": "Hi, sorry to bother you. I'm Wei from the unit right below yours. I know it's hard with little kids, and we have one too. It's just that there's often running and jumping after eleven, and our son keeps waking up. Would it be possible to keep it down a bit later at night? We'd really appreciate it.", "ref_zh": "你好，打扰了。我是住你们正下方的伟。我知道带小孩不容易，我们家也有一个。只是晚上十一点以后经常有跑跳的声音，我儿子总被吵醒。晚上晚一点的时候能不能稍微轻一点？我们会非常感激。", "id": "ref0"}, {"q": "你们全家要回国两周，想请邻居帮忙收快递、偶尔看一眼门口。上门拜托对方。", "ref": "Hi Rachel, I have a small favour to ask. We're flying back to China for two weeks from Saturday. A couple of parcels might arrive while we're away. Would you mind taking them in for us? And if you notice anything strange at our door, could you send me a message? Of course, we're happy to do the same for you anytime.", "ref_zh": "Rachel 你好，想请你帮个小忙。我们周六开始回国两周，期间可能会到几个快递。你介意帮我们收一下吗？另外如果看到我们门口有什么异常，能给我发个消息吗？当然，你们需要的时候我们也随时帮忙。", "id": "ref1"}], "words": [{"w": "bakery", "ipa": "/ˈbeɪkəri/", "zh": "面包店", "ex": "There's a great bakery at the bottom of our block.", "id": "w0"}, {"w": "rent (v.)", "ipa": "/rent/", "zh": "租（房）", "ex": "We're renting a three-bedroom flat near the school.", "tts_w": "rent", "id": "w1"}, {"w": "block", "ipa": "/blɑːk/", "zh": "（组屋/公寓）一栋楼", "ex": "The lift in our block is under maintenance today.", "id": "w2"}, {"w": "renovation", "ipa": "/ˌrenəˈveɪʃən/", "zh": "装修", "ex": "The renovation took longer than we expected.", "id": "w3"}, {"w": "heads-up", "ipa": "/ˈhedz ʌp/", "zh": "提前告知", "ex": "Thanks for the heads-up about the water cut tomorrow.", "id": "w4"}, {"w": "drilling", "ipa": "/ˈdrɪlɪŋ/", "zh": "钻孔（电钻声）", "ex": "The drilling next door started at nine sharp.", "id": "w5"}, {"w": "corridor", "ipa": "/ˈkɔːrɪdɔːr/", "zh": "走廊", "ex": "Please don't leave shoes in the corridor.", "id": "w6"}, {"w": "considerate", "ipa": "/kənˈsɪdərət/", "zh": "体贴的；考虑周到的", "ex": "It was considerate of them to warn us about the party.", "id": "w7"}, {"w": "take someone up on", "ipa": "/teɪk ˈsʌmwʌn ʌp ɑːn/", "zh": "接受某人的提议", "ex": "I'll take you up on that offer of a lift.", "id": "w8"}], "sections": [{"heading": "1. At the Door", "heading_zh": "1. 在门口", "rows": [[{"id": "s0_0_0", "md": "**Hi, sorry to bother you. I'm Wei. We just moved in next door, and I wanted to come over and say hello.**", "text": "Hi, sorry to bother you. I'm Wei. We just moved in next door, and I wanted to come over and say hello.", "zh": "你好，打扰一下。我叫伟，我们刚搬到隔壁，想过来打个招呼。", "sp": "A"}], [{"id": "s0_1_0", "md": "Oh, hi! Welcome! I'm Rachel. I saw the moving truck last weekend.", "text": "Oh, hi! Welcome! I'm Rachel. I saw the moving truck last weekend.", "zh": "噢，你好！欢迎！我是 Rachel。上周末我看到搬家车了。", "sp": "B"}], [{"id": "s0_2_0", "md": "Yes, that was us. It's me, my wife and our son. He's three, so __apologies in advance__ for any noise.", "text": "Yes, that was us. It's me, my wife and our son. He's three, so apologies in advance for any noise.", "zh": "对，就是我们。我、我太太和儿子，他三岁，所以先为可能的吵闹道个歉。", "sp": "A"}], [{"id": "s0_3_0", "md": "Don't worry about it. We have two kids ourselves, so we're hardly quiet!", "text": "Don't worry about it. We have two kids ourselves, so we're hardly quiet!", "zh": "别担心。我们自己也有两个孩子，可一点都不安静！", "sp": "B"}], [{"id": "s0_4_0", "md": "That's a relief. These are just some cookies from a ==bakery== we love.", "text": "That's a relief. These are just some cookies from a bakery we love.", "zh": "那就放心了。这是我们很喜欢的一家面包店的饼干，一点心意。", "sp": "A"}], [{"id": "s0_5_0", "md": "Oh, that's so sweet of you. How long have you been in Singapore?", "text": "Oh, that's so sweet of you. How long have you been in Singapore?", "zh": "哎呀，你们太贴心了。你们来新加坡多久了？", "sp": "B"}], [{"id": "s0_6_0", "md": "About a year. We were ==renting== near the city before, but we wanted more space.", "text": "About a year. We were renting near the city before, but we wanted more space.", "zh": "一年左右。之前在市区附近租房，但想要更大的空间。", "sp": "A"}], [{"id": "s0_7_0", "md": "Well, you picked a good ==block==. The neighbors are friendly, and the park is right downstairs.", "text": "Well, you picked a good block. The neighbors are friendly, and the park is right downstairs.", "zh": "那你们选对楼了。邻居们都很友好，公园就在楼下。", "sp": "B"}]]}, {"heading": "2. A Heads-up About Renovation", "heading_zh": "2. 提前打招呼：装修", "rows": [[{"id": "s1_0_0", "md": "One more thing. We're doing some ==renovation== next week, mainly the kitchen.", "text": "One more thing. We're doing some renovation next week, mainly the kitchen.", "zh": "还有一件事。我们下周要装修，主要是厨房。", "sp": "A"}], [{"id": "s1_1_0", "md": "Oh, OK. How long will that take?", "text": "Oh, OK. How long will that take?", "zh": "噢，好的。要多久？", "sp": "B"}], [{"id": "s1_2_0", "md": "**About ten days. They'll only work on weekdays, from nine to five, never on weekends.**", "text": "About ten days. They'll only work on weekdays, from nine to five, never on weekends.", "zh": "大概十天。他们只在工作日干活，九点到五点，周末绝对不施工。", "sp": "A"}], [{"id": "s1_3_0", "md": "Thanks for the ==heads-up==. My husband works from home, so the noise might be tough for him.", "text": "Thanks for the heads-up. My husband works from home, so the noise might be tough for him.", "zh": "谢谢提前告诉我。我先生在家办公，噪音对他来说可能会有点难受。", "sp": "B"}], [{"id": "s1_4_0", "md": "I completely understand. The ==drilling== should only take the first three days.", "text": "I completely understand. The drilling should only take the first three days.", "zh": "完全理解。电钻应该只在头三天。", "sp": "A"}], [{"id": "s1_5_0", "md": "That's not too bad. Could they keep the corridor clear, though? Last time someone left boxes everywhere.", "text": "That's not too bad. Could they keep the corridor clear, though? Last time someone left boxes everywhere.", "zh": "那还好。不过能让他们保持走廊通畅吗？上次有人把箱子堆得到处都是。", "sp": "B"}], [{"id": "s1_6_0", "md": "Of course. I'll __make sure__ they clean up every evening.", "text": "Of course. I'll make sure they clean up every evening.", "zh": "当然。我会确保他们每天晚上都清理干净。", "sp": "A"}], [{"id": "s1_7_0", "md": "**Here's my number. Please text me if anything bothers you.**", "text": "Here's my number. Please text me if anything bothers you.", "zh": "这是我的电话。有任何打扰到你的地方，请发短信告诉我。", "sp": "A"}], [{"id": "s1_8_0", "md": "That's very ==considerate==. And if you need anything, like a good plumber, just ask.", "text": "That's very considerate. And if you need anything, like a good plumber, just ask.", "zh": "你真是考虑周到。你们要是需要什么，比如靠谱的水管工，尽管问我。", "sp": "B"}], [{"id": "s1_9_0", "md": "Thanks, I might __take you up on that__. It was lovely to meet you, Rachel.", "text": "Thanks, I might take you up on that. It was lovely to meet you, Rachel.", "zh": "谢谢，说不定真要麻烦你。很高兴认识你，Rachel。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. At t const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
