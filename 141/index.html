const D = {"id": "141", "type": "dialogue", "title": "Meeting Your New Neighbor", "meta": "B2 · 约 250 词 · 场景：和新邻居打招呼与装修提前沟通", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Neighbor", "name_zh": "邻居", "voice": "en-US-EmmaNeural"}}, "gist": [{"q": "「你」上门时介绍了自己家的哪些情况？", "a": "刚搬到隔壁，家里有太太和三岁的儿子；来新加坡一年左右，之前在市区附近租房，想要更大空间。"}, {"q": "装修安排是怎样的？", "a": "下周装修厨房，大约十天，只在工作日九点到五点施工，周末不施工，电钻只在头三天。"}, {"q": "邻居提了什么要求？「你」怎么回应？", "a": "希望保持走廊通畅；「你」保证让工人每天晚上清理，并留下电话，有打扰随时发短信。"}], "dictation": [{"id": "s0_0_0", "text": "Hi, sorry to bother you. I'm Wei. We just moved in next door, and I wanted to come over and say hello."}, {"id": "s0_2_0", "text": "Yes, that was us. It's me, my wife and our son. He's three, so apologies in advance for any noise."}, {"id": "s1_2_0", "text": "About ten days. They'll only work on weekdays, from nine to five, never on weekends."}, {"id": "s1_7_0", "text": "Here's my number. Please text me if anything bothers you."}], "shadow": {"speaker": "A", "text": "One more thing. We're doing some renovation next week, mainly the kitchen.", "marked": "One more <b>thing</b>. //<br>We're doing some <b>renovation</b> / next <b>week</b>, / mainly the <b>kitchen</b>. //"}, "prompts": [{"q": "楼上邻居家的孩子每晚十一点后还在跑跳。你去敲门，友好地提出来。", "ref": "Hi, sorry to bother you. I'm Wei from the unit right below yours. I know it's hard with little kids, and we have one too. It's just that there's often running and jumping after eleven, and our son keeps waking up. Would it be possible to keep it down a bit later at night? We'd really appreciate it.", "ref_zh": "你好，打扰了。我是住你们正下方的伟。我知道带小孩不容易，我们家也有一个。只是晚上十一点以后经常有跑跳的声音，我儿子总被吵醒。晚上晚一点的时候能不能稍微轻一点？我们会非常感激。", "id": "ref0"}, {"q": "你们全家要回国两周，想请邻居帮忙收快递、偶尔看一眼门口。上门拜托对方。", "ref": "Hi Rachel, I have a small favour to ask. We're flying back to China for two weeks from Saturday. A couple of parcels might arrive while we're away. Would you mind taking them in for us? And if you notice anything strange at our door, could you send me a message? Of course, we're happy to do the same for you anytime.", "ref_zh": "Rachel 你好，想请你帮个小忙。我们周六开始回国两周，期间可能会到几个快递。你介意帮我们收一下吗？另外如果看到我们门口有什么异常，能给我发个消息吗？当然，你们需要的时候我们也随时帮忙。", "id": "ref1"}], "words": [{"w": "bakery", "ipa": "/ˈbeɪkəri/", "zh": "面包店", "ex": "There's a great bakery at the bottom of our block.", "id": "w0"}, {"w": "rent (v.)", "ipa": "/rent/", "zh": "租（房）", "ex": "We're renting a three-bedroom flat near the school.", "tts_w": "rent", "id": "w1"}, {"w": "block", "ipa": "/blɑːk/", "zh": "（组屋/公寓）一栋楼", "ex": "The lift in our block is under maintenance today.", "id": "w2"}, {"w": "renovation", "ipa": "/ˌrenəˈveɪʃən/", "zh": "装修", "ex": "The renovation took longer than we expected.", "id": "w3"}, {"w": "heads-up", "ipa": "/ˈhedz ʌp/", "zh": "提前告知", "ex": "Thanks for the heads-up about the water cut tomorrow.", "id": "w4"}, {"w": "drilling", "ipa": "/ˈdrɪlɪŋ/", "zh": "钻孔（电钻声）", "ex": "The drilling next door started at nine sharp.", "id": "w5"}, {"w": "corridor", "ipa": "/ˈkɔːrɪdɔːr/", "zh": "走廊", "ex": "Please don't leave shoes in the corridor.", "id": "w6"}, {"w": "considerate", "ipa": "/kənˈsɪdərət/", "zh": "体贴的；考虑周到的", "ex": "It was considerate of them to warn us about the party.", "id": "w7"}, {"w": "take someone up on", "ipa": "/teɪk ˈsʌmwʌn ʌp ɑːn/", "zh": "接受某人的提议", "ex": "I'll take you up on that offer of a lift.", "id": "w8"}], "sections": [{"heading": "1. At the Door", "heading_zh": "1. 在门口", "rows": [[{"id": "s0_0_0", "md": "**Hi, sorry to bother you. I'm Wei. We just moved in next door, and I wanted to come over and say hello.**", "text": "Hi, sorry to bother you. I'm Wei. We just moved in next door, and I wanted to come over and say hello.", "zh": "你好，打扰一下。我叫伟，我们刚搬到隔壁，想过来打个招呼。", "sp": "A"}], [{"id": "s0_1_0", "md": "Oh, hi! Welcome! I'm Rachel. I saw the moving truck last weekend.", "text": "Oh, hi! Welcome! I'm Rachel. I saw the moving truck last weekend.", "zh": "噢，你好！欢迎！我是 Rachel。上周末我看到搬家车了。", "sp": "B"}], [{"id": "s0_2_0", "md": "Yes, that was us. It's me, my wife and our son. He's three, so __apologies in advance__ for any noise.", "text": "Yes, that was us. It's me, my wife and our son. He's three, so apologies in advance for any noise.", "zh": "对，就是我们。我、我太太和儿子，他三岁，所以先为可能的吵闹道个歉。", "sp": "A"}], [{"id": "s0_3_0", "md": "Don't worry about it. We have two kids ourselves, so we're hardly quiet!", "text": "Don't worry about it. We have two kids ourselves, so we're hardly quiet!", "zh": "别担心。我们自己也有两个孩子，可一点都不安静！", "sp": "B"}], [{"id": "s0_4_0", "md": "That's a relief. These are just some cookies from a ==bakery== we love.", "text": "That's a relief. These are just some cookies from a bakery we love.", "zh": "那就放心了。这是我们很喜欢的一家面包店的饼干，一点心意。", "sp": "A"}], [{"id": "s0_5_0", "md": "Oh, that's so sweet of you. How long have you been in Singapore?", "text": "Oh, that's so sweet of you. How long have you been in Singapore?", "zh": "哎呀，你们太贴心了。你们来新加坡多久了？", "sp": "B"}], [{"id": "s0_6_0", "md": "About a year. We were ==renting== near the city before, but we wanted more space.", "text": "About a year. We were renting near the city before, but we wanted more space.", "zh": "一年左右。之前在市区附近租房，但想要更大的空间。", "sp": "A"}], [{"id": "s0_7_0", "md": "Well, you picked a good ==block==. The neighbors are friendly, and the park is right downstairs.", "text": "Well, you picked a good block. The neighbors are friendly, and the park is right downstairs.", "zh": "那你们选对楼了。邻居们都很友好，公园就在楼下。", "sp": "B"}]]}, {"heading": "2. A Heads-up About Renovation", "heading_zh": "2. 提前打招呼：装修", "rows": [[{"id": "s1_0_0", "md": "One more thing. We're doing some ==renovation== next week, mainly the kitchen.", "text": "One more thing. We're doing some renovation next week, mainly the kitchen.", "zh": "还有一件事。我们下周要装修，主要是厨房。", "sp": "A"}], [{"id": "s1_1_0", "md": "Oh, OK. How long will that take?", "text": "Oh, OK. How long will that take?", "zh": "噢，好的。要多久？", "sp": "B"}], [{"id": "s1_2_0", "md": "**About ten days. They'll only work on weekdays, from nine to five, never on weekends.**", "text": "About ten days. They'll only work on weekdays, from nine to five, never on weekends.", "zh": "大概十天。他们只在工作日干活，九点到五点，周末绝对不施工。", "sp": "A"}], [{"id": "s1_3_0", "md": "Thanks for the ==heads-up==. My husband works from home, so the noise might be tough for him.", "text": "Thanks for the heads-up. My husband works from home, so the noise might be tough for him.", "zh": "谢谢提前告诉我。我先生在家办公，噪音对他来说可能会有点难受。", "sp": "B"}], [{"id": "s1_4_0", "md": "I completely understand. The ==drilling== should only take the first three days.", "text": "I completely understand. The drilling should only take the first three days.", "zh": "完全理解。电钻应该只在头三天。", "sp": "A"}], [{"id": "s1_5_0", "md": "That's not too bad. Could they keep the corridor clear, though? Last time someone left boxes everywhere.", "text": "That's not too bad. Could they keep the corridor clear, though? Last time someone left boxes everywhere.", "zh": "那还好。不过能让他们保持走廊通畅吗？上次有人把箱子堆得到处都是。", "sp": "B"}], [{"id": "s1_6_0", "md": "Of course. I'll __make sure__ they clean up every evening.", "text": "Of course. I'll make sure they clean up every evening.", "zh": "当然。我会确保他们每天晚上都清理干净。", "sp": "A"}], [{"id": "s1_7_0", "md": "**Here's my number. Please text me if anything bothers you.**", "text": "Here's my number. Please text me if anything bothers you.", "zh": "这是我的电话。有任何打扰到你的地方，请发短信告诉我。", "sp": "A"}], [{"id": "s1_8_0", "md": "That's very ==considerate==. And if you need anything, like a good plumber, just ask.", "text": "That's very considerate. And if you need anything, like a good plumber, just ask.", "zh": "你真是考虑周到。你们要是需要什么，比如靠谱的水管工，尽管问我。", "sp": "B"}], [{"id": "s1_9_0", "md": "Thanks, I might __take you up on that__. It was lovely to meet you, Rachel.", "text": "Thanks, I might take you up on that. It was lovely to meet you, Rachel.", "zh": "谢谢，说不定真要麻烦你。很高兴认识你，Rachel。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. At t const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));
