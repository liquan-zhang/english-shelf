<script>
const D = {"id": "062", "title": "Writing a Status Update During an Outage", "meta": "B2 · 约 280 词 · 场景：故障通报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Who Is Actually Reading", "heading_zh": "1. 到底谁在看", "rows": [[{"id": "s0_0_0", "md": "During an outage, the engineers fixing the problem are rarely the people reading the updates.", "text": "During an outage, the engineers fixing the problem are rarely the people reading the updates.", "zh": "故障期间，修问题的工程师很少是看通报的人。", "sp": null}, {"id": "s0_0_1", "md": "The readers are support agents, sales leads, executives, and other teams waiting on you.", "text": "The readers are support agents, sales leads, executives, and other teams waiting on you.", "zh": "看通报的是客服、销售负责人、高管，还有在等你的其他团队。", "sp": null}, {"id": "s0_0_2", "md": "They do not need the stack trace; they need to understand the ==impact== and know what to tell their own people.", "text": "They do not need the stack trace; they need to understand the impact and know what to tell their own people.", "zh": "他们不需要堆栈信息；他们需要搞清楚影响面，知道该怎么跟自己的人交代。", "sp": null}], [{"id": "s0_1_0", "md": "Most bad updates fail in one of two ways.", "text": "Most bad updates fail in one of two ways.", "zh": "大多数糟糕的通报，都栽在下面两种情况之一。", "sp": null}, {"id": "s0_1_1", "md": "Some are too ==technical==, full of pod names and error codes that only three people understand.", "text": "Some are too technical, full of pod names and error codes that only three people understand.", "zh": "有的太技术，满篇 pod 名和错误码，只有三个人看得懂。", "sp": null}, {"id": "s0_1_2", "md": "Others are so ==cautious== that they say nothing at all, like \"We are aware of an issue.\"", "text": "Others are so cautious that they say nothing at all, like \"We are aware of an issue.\"", "zh": "有的又谨慎过头，等于什么都没说，比如「我们已知悉一个问题」。", "sp": null}], [{"id": "s0_2_0", "md": "**Write every update for the person who just joined the channel and has read nothing else.**", "text": "Write every update for the person who just joined the channel and has read nothing else.", "zh": "每一条通报都要写给刚进群、别的什么都没看过的人。", "sp": null}, {"id": "s0_2_1", "md": "If they can act on it without asking a follow-up question, the update has done its job.", "text": "If they can act on it without asking a follow-up question, the update has done its job.", "zh": "如果他不用追问就能据此行动，这条通报就算合格了。", "sp": null}, {"id": "s0_2_2", "md": "If they have to __scroll back__ through an hour of chat to understand it, the update has failed.", "text": "If they have to scroll back through an hour of chat to understand it, the update has failed.", "zh": "如果他得往上翻一个小时的聊天记录才看得懂，这条通报就失败了。", "sp": null}]]}, {"heading": "2. Four Lines, Every Time", "heading_zh": "2. 每次都写四行", "rows": [[{"id": "s1_0_0", "md": "A simple template __takes the pressure off__ when your heart is racing.", "text": "A simple template takes the pressure off when your heart is racing.", "zh": "心跳加速的时候，一个简单的模板能帮你减轻压力。", "sp": null}, {"id": "s1_0_1", "md": "Line one is the impact: which users, which feature, and since when.", "text": "Line one is the impact: which users, which feature, and since when.", "zh": "第一行写影响：哪些用户、哪个功能、从什么时候开始。", "sp": null}, {"id": "s1_0_2", "md": "Line two is the current status: investigating, ==identified==, or recovering.", "text": "Line two is the current status: investigating, identified, or recovering.", "zh": "第二行写当前状态：排查中、已定位，还是恢复中。", "sp": null}], [{"id": "s1_1_0", "md": "Line three is the next action, in plain words.", "text": "Line three is the next action, in plain words.", "zh": "第三行用大白话写下一步动作。", "sp": null}, {"id": "s1_1_1", "md": "\"We are rolling back the payment change and expect errors to drop within twenty minutes.\"", "text": "\"We are rolling back the payment change and expect errors to drop within twenty minutes.\"", "zh": "「我们正在回滚支付相关的改动，预计二十分钟内报错会降下来。」", "sp": null}, {"id": "s1_1_2", "md": "Line four is the time of the next update, and you keep that promise even if nothing has changed.", "text": "Line four is the time of the next update, and you keep that promise even if nothing has changed.", "zh": "第四行写下一次同步的时间，就算情况没变，也要说到做到。", "sp": null}], [{"id": "s1_2_0", "md": "**An update that says nothing new still tells people you have not forgotten them.**", "text": "An update that says nothing new still tells people you have not forgotten them.", "zh": "一条没有新消息的通报，也在告诉大家你没忘了他们。", "sp": null}, {"id": "s1_2_1", "md": "Avoid guessing at the root cause in a public channel, because ==premature== explanations tend to __come back to bite you__.", "text": "Avoid guessing at the root cause in a public channel, because premature explanations tend to come back to bite you.", "zh": "别在公开群里猜根因，因为过早下的结论往往会反过来坑你。", "sp": null}, {"id": "s1_2_2", "md": "Say what you have ==confirmed==, and __label the rest__ as unknown.", "text": "Say what you have confirmed, and label the rest as unknown.", "zh": "已经确认的就说确认了，其余的标成未知。", "sp": null}, {"id": "s1_2_3", "md": "People can plan around an honest unknown much more easily than around a wrong answer.", "text": "People can plan around an honest unknown much more easily than around a wrong answer.", "zh": "大家围绕一个坦诚的「未知」做安排，比围绕一个错误答案容易得多。", "sp": null}]]}], "gist": [{"q": "故障通报真正的读者是谁？他们需要什么？", "a": "客服、销售、高管和其他等待的团队；他们不要堆栈信息，要知道影响范围以及该怎么跟自己的人说。"}, {"q": "作者提出的四行模板分别是什么？", "a": "影响（哪些用户、哪个功能、从何时开始）；当前状态（排查中/已定位/恢复中）；下一步动作；下次更新时间。"}, {"q": "为什么不要在公开频道猜根因？", "a": "过早的解释容易反噬；只说已确认的，其余标为未知，诚实的未知比错误答案更便于别人安排。"}], "dictation": [{"id": "s0_2_0", "text": "Write every update for the person who just joined the channel and has read nothing else."}, {"id": "s1_1_2", "text": "Line four is the time of the next update, and you keep that promise even if nothing has changed."}, {"id": "s1_2_0", "text": "An update that says nothing new still tells people you have not forgotten them."}, {"id": "s1_2_3", "text": "People can plan around an honest unknown much more easily than around a wrong answer."}], "shadow": {"text": "Line three is the next action, in plain words. \"We are rolling back the payment change and expect errors to drop within twenty minutes.\" Line four is the time of the next update, and you keep that promise even if nothing has changed.", "marked": "Line <b>three</b> / is the next <b>action</b>, / in <b>plain</b> words. //<br>\"We are rolling <b>back</b> the payment change / and expect errors to <b>drop</b> / within <b>twenty</b> minutes.\" //<br>Line <b>four</b> / is the time of the <b>next</b> update, / and you <b>keep</b> that promise / even if <b>nothing</b> has changed. //"}, "prompts": [{"q": "支付服务故障已经二十分钟，客服群里一直在问情况。用 30 秒口头给出一次四行式的状态通报。", "ref": "Quick update on the payment issue. Since about two fifteen, around a third of card payments in the region are failing; other payment methods are fine. We've identified a bad config change as the likely trigger. We're rolling it back now and expect failures to drop within twenty minutes. Please tell customers to retry or use another method for now. Next update at three o'clock, even if nothing changes.", "ref_zh": "同步一下支付问题。大概从两点十五开始，这个区域约三分之一的银行卡支付失败；其他支付方式正常。我们已经定位到一个有问题的配置变更，很可能是诱因。现在正在回滚，预计二十分钟内失败率会降下来。请先让用户重试，或者换一种支付方式。三点同步下一次进展，就算没有变化也会同步。", "id": "ref0"}, {"q": "高管在群里追问“到底是什么原因？”，但根因还没确认。用 30 秒回复：说清已确认的、未知的，并避免过早下结论。", "ref": "Good question, and I want to be careful here. What we've confirmed is that the errors started with this morning's deployment, and rolling it back has already cut them by half. What we don't know yet is which part of the change caused it. I'd rather not guess in this channel and correct it later. We'll share the confirmed cause in the next update at four.", "ref_zh": "好问题，这里我想谨慎一点。目前已经确认的是，报错是从今天上午那次部署开始的，回滚之后已经降了一半。还不知道的是具体是改动里的哪一部分导致的。我不想在群里先猜一个、回头再更正。确认的原因我们会在四点的下一次同步里发出来。", "id": "ref1"}], "words": [{"w": "impact", "ipa": "/ˈɪmpækt/", "zh": "影响、影响范围", "ex": "What's the customer impact right now, roughly how many users?", "id": "w0"}, {"w": "technical", "ipa": "/ˈteknɪkəl/", "zh": "技术性的、专业的", "ex": "Keep the update less technical; the sales team will read it too.", "i const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
</html>
