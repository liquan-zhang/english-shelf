<script>
const D = {"id": "062", "title": "Writing a Status Update During an Outage", "meta": "B2 · 约 280 词 · 场景：故障通报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Who Is Actually Reading", "heading_zh": "1. 到底谁在看", "rows": [[{"id": "s0_0_0", "md": "During an outage, the engineers fixing the problem are rarely the people reading the updates.", "text": "During an outage, the engineers fixing the problem are rarely the people reading the updates.", "zh": "故障期间，修问题的工程师很少是看通报的人。", "sp": null}, {"id": "s0_0_1", "md": "The readers are support agents, sales leads, executives, and other teams waiting on you.", "text": "The readers are support agents, sales leads, executives, and other teams waiting on you.", "zh": "看通报的是客服、销售负责人、高管，还有在等你的其他团队。", "sp": null}, {"id": "s0_0_2", "md": "They do not need the stack trace; they need to understand the ==impact== and know what to tell their own people.", "text": "They do not need the stack trace; they need to understand the impact and know what to tell their own people.", "zh": "他们不需要堆栈信息；他们需要搞清楚影响面，知道该怎么跟自己的人交代。", "sp": null}], [{"id": "s0_1_0", "md": "Most bad updates fail in one of two ways.", "text": "Most bad updates fail in one of two ways.", "zh": "大多数糟糕的通报，都栽在下面两种情况之一。", "sp": null}, {"id": "s0_1_1", "md": "Some are too ==technical==, full of pod names and error codes that only three people understand.", "text": "Some are too technical, full of pod names and error codes that only three people understand.", "zh": "有的太技术，满篇 pod 名和错误码，只有三个人看得懂。", "sp": null}, {"id": "s0_1_2", "md": "Others are so ==cautious== that they say nothing at all, like \"We are aware of an issue.\"", "text": "Others are so cautious that they say nothing at all, like \"We are aware of an issue.\"", "zh": "有的又谨慎过头，等于什么都没说，比如「我们已知悉一个问题」。", "sp": null}], [{"id": "s0_2_0", "md": "**Write every update for the person who just joined the channel and has read nothing else.**", "text": "Write every update for the person who just joined the channel and has read nothing else.", "zh": "每一条通报都要写给刚进群、别的什么都没看过的人。", "sp": null}, {"id": "s0_2_1", "md": "If they can act on it without asking a follow-up question, the update has done its job.", "text": "If they can act on it without asking a follow-up question, the update has done its job.", "zh": "如果他不用追问就能据此行动，这条通报就算合格了。", "sp": null}, {"id": "s0_2_2", "md": "If they have to __scroll back__ through an hour of chat to understand it, the update has failed.", "text": "If they have to scroll back through an hour of chat to understand it, the update has failed.", "zh": "如果他得往上翻一个小时的聊天记录才看得懂，这条通报就失败了。", "sp": null}]]}, {"heading": "2. Four Lines, Every Time", "heading_zh": "2. 每次都写四行", "rows": [[{"id": "s1_0_0", "md": "A simple template __takes the pressure off__ when your heart is racing.", "text": "A simple template takes the pressure off when your heart is racing.", "zh": "心跳加速的时候，一个简单的模板能帮你减轻压力。", "sp": null}, {"id": "s1_0_1", "md": "Line one is the impact: which users, which feature, and since when.", "text": "Line one is the impact: which users, which feature, and since when.", "zh": "第一行写影响：哪些用户、哪个功能、从什么时候开始。", "sp": null}, {"id": "s1_0_2", "md": "Line two is the current status: investigating, ==identified==, or recovering.", "text": "Line two is the current status: investigating, identified, or recovering.", "zh": "第二行写当前状态：排查中、已定位，还是恢复中。", "sp": null}], [{"id": "s1_1_0", "md": "Line three is the next action, in plain words.", "text": "Line three is the next action, in plain words.", "zh": "第三行用大白话写下一步动作。", "sp": null}, {"id": "s1_1_1", "md": "\"We are rolling back the payment change and expect errors to drop within twenty minutes.\"", "text": "\"We are rolling back the payment change and expect errors to drop within twenty minutes.\"", "zh": "「我们正在回滚支付相关的改动，预计二十分钟内报错会降下来。」", "sp": null}, {"id": "s1_1_2", "md": "Line four is the time of the next update, and you keep that promise even if nothing has changed.", "text": "Line four is the time of the next update, and you keep that promise even if nothing has changed.", "zh": "第四行写下一次同步的时间，就算情况没变，也要说到做到。", "sp": null}], [{"id": "s1_2_0", "md": "**An update that says nothing new still tells people you have not forgotten them.**", "text": "An update that says nothing new still tells people you have not forgotten them.", "zh": "一条没有新消息的通报，也在告诉大家你没忘了他们。", "sp": null}, {"id": "s1_2_1", "md": "Avoid guessing at the root cause in a public channel, because ==premature== explanations tend to __come back to bite you__.", "text": "Avoid guessing at the root cause in a public channel, because premature explanations tend to come back to bite you.", "zh": "别在公开群里猜根因，因为过早下的结论往往会反过来坑你。", "sp": null}, {"id": "s1_2_2", "md": "Say what you have ==confirmed==, and __label the rest__ as unknown.", "text": "Say what you have confirmed, and label the rest as unknown.", "zh": "已经确认的就说确认了，其余的标成未知。", "sp": null}, {"id": "s1_2_3", "md": "People can plan around an honest unknown much more easily than around a wrong answer.", "text": "People can plan around an honest unknown much more easily than around a wrong answer.", "zh": "大家围绕一个坦诚的「未知」做安排，比围绕一个错误答案容易得多。", "sp": null}]]}], "gist": [{"q": "故障通报真正的读者是谁？他们需要什么？", "a": "客服、销售、高管和其他等待的团队；他们不要堆栈信息，要知道影响范围以及该怎么跟自己的人说。"}, {"q": "作者提出的四行模板分别是什么？", "a": "影响（哪些用户、哪个功能、从何时开始）；当前状态（排查中/已定位/恢复中）；下一步动作；下次更新时间。"}, {"q": "为什么不要在公开频道猜根因？", "a": "过早的解释容易反噬；只说已确认的，其余标为未知，诚实的未知比错误答案更便于别人安排。"}], "dictation": [{"id": "s0_2_0", "text": "Write every update for the person who just joined the channel and has read nothing else."}, {"id": "s1_1_2", "text": "Line four is the time of the next update, and you keep that promise even if nothing has changed."}, {"id": "s1_2_0", "text": "An update that says nothing new still tells people you have not forgotten them."}, {"id": "s1_2_3", "text": "People can plan around an honest unknown much more easily than around a wrong answer."}], "shadow": {"text": "Line three is the next action, in plain words. \"We are rolling back the payment change and expect errors to drop within twenty minutes.\" Line four is the time of the next update, and you keep that promise even if nothing has changed.", "marked": "Line <b>three</b> / is the next <b>action</b>, / in <b>plain</b> words. //<br>\"We are rolling <b>back</b> the payment change / and expect errors to <b>drop</b> / within <b>twenty</b> minutes.\" //<br>Line <b>four</b> / is the time of the <b>next</b> update, / and you <b>keep</b> that promise / even if <b>nothing</b> has changed. //"}, "prompts": [{"q": "支付服务故障已经二十分钟，客服群里一直在问情况。用 30 秒口头给出一次四行式的状态通报。", "ref": "Quick update on the payment issue. Since about two fifteen, around a third of card payments in the region are failing; other payment methods are fine. We've identified a bad config change as the likely trigger. We're rolling it back now and expect failures to drop within twenty minutes. Please tell customers to retry or use another method for now. Next update at three o'clock, even if nothing changes.", "ref_zh": "同步一下支付问题。大概从两点十五开始，这个区域约三分之一的银行卡支付失败；其他支付方式正常。我们已经定位到一个有问题的配置变更，很可能是诱因。现在正在回滚，预计二十分钟内失败率会降下来。请先让用户重试，或者换一种支付方式。三点同步下一次进展，就算没有变化也会同步。", "id": "ref0"}, {"q": "高管在群里追问“到底是什么原因？”，但根因还没确认。用 30 秒回复：说清已确认的、未知的，并避免过早下结论。", "ref": "Good question, and I want to be careful here. What we've confirmed is that the errors started with this morning's deployment, and rolling it back has already cut them by half. What we don't know yet is which part of the change caused it. I'd rather not guess in this channel and correct it later. We'll share the confirmed cause in the next update at four.", "ref_zh": "好问题，这里我想谨慎一点。目前已经确认的是，报错是从今天上午那次部署开始的，回滚之后已经降了一半。还不知道的是具体是改动里的哪一部分导致的。我不想在群里先猜一个、回头再更正。确认的原因我们会在四点的下一次同步里发出来。", "id": "ref1"}], "words": [{"w": "impact", "ipa": "/ˈɪmpækt/", "zh": "影响、影响范围", "ex": "What's the customer impact right now, roughly how many users?", "id": "w0"}, {"w": "technical", "ipa": "/ˈteknɪkəl/", "zh": "技术性的、专业的", "ex": "Keep the update less technical; the sales team will read it too.", "id": "w1"}, {"w": "cautious", "ipa": "/ˈkɔːʃəs/", "zh": "谨慎的、小心翼翼的", "ex": "The statement was so cautious that customers didn't know what to do.", "id": "w2"}, {"w": "identify", "ipa": "/aɪˈdentɪˌfaɪ/", "zh": "确认、定位", "ex": "We've identified the bad deploy and are rolling it back.", "id": "w3"}, {"w": "premature", "ipa": "/ˌpriːməˈtʃʊr/", "zh": "过早的、为时尚早的", "ex": "It's premature to blame the vendor before we check our own config.", "id": "w4"}, {"w": "confirm", "ipa": "/kənˈfɜːrm/", "zh": "确认、证实", "ex": "Can you confirm that the error rate is back to normal?", "id": "w5"}, {"w": "template", "ipa": "/ˈtemplət/", "zh": "模板", "ex": "Let's add an outage update template to the on-call runbook.", "id": "w6"}, {"w": "recover", "ipa": "/rɪˈkʌvər/", "zh": "恢复", "ex": "The service started to recover a few minutes after the rollback.", "id": "w7"}, {"w": "follow-up", "ipa": "/ˈfɑːloʊ ʌp/", "zh": "后续的；跟进", "ex": "I'll send a follow-up email with the full timeline tomorrow.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Who Is Actually Reading", "zh": "1. 到底谁在看", "start": 0.0, "end": 2.16, "words": [[0.105, 0.316], [0.763, 0.882], [0.895, 1.013], [1.026, 1.421], [1.434, 1.776]]}, {"kind": "s", "id": "s0_0_0", "md": "During an outage, the engineers fixing the problem are rarely the people reading the updates.", "zh": "故障期间，修问题的工程师很少是看通报的人。", "sp": null, "gap": false, "start": 2.16, "end": 7.92, "words": [[2.278, 2.515], [2.528, 2.621], [2.634, 3.186], [3.41, 3.502], [3.515, 4.094], [4.107, 4.528], [4.542, 4.621], [4.634, 5.094], [5.252, 5.476], [5.489, 5.91], [5.923, 6.028], [6.042, 6.476], [6.489, 6.752], [6.765, 6.857], [6.871, 7.528]]}, {"kind": "s", "id": "s0_0_1", "md": "The readers are support agents, sales leads, executives, and other teams waiting on you.", "zh": "看通报的是客服、销售负责人、高管，还有在等你的其他团队。", "sp": null, "gap": false, "start": 7.92, "end": 13.848, "words": [[8.038, 8.104], [8.117, 8.46], [8.473, 8.578], [8.591, 9.025], [9.038, 9.578], [9.841, 10.209], [1 .126], [51.14, 51.495]]}, {"kind": "s", "id": "s1_0_0", "md": "A simple template __takes the pressure off__ when your heart is racing.", "zh": "心跳加速的时候，一个简单的模板能帮你减轻压力。", "sp": null, "gap": false, "start": 51.888, "end": 55.8, "words": [[51.993, 52.046], [52.059, 52.441], [52.454, 52.888], [52.901, 53.191], [53.204, 53.296], [53.309, 53.743], [53.756, 54.072], [54.151, 54.27], [54.283, 54.414], [54.427, 54.756], [54.77, 54.901], [54.914, 55.414]]}, {"kind": "s", "id": "s1_0_1", "md": "Line one is the impact: which users, which feature, and since when.", "zh": "第一行写影响：哪些用户、哪个功能、从什么时候开始。", "sp": null, "gap": false, "start": 55.8, "end": 60.72, "words": [[55.905, 56.208], [56.221, 56.458], [56.471, 56.576], [56.589, 56.668], [56.682, 57.313], [57.616, 57.787], [57.8, 58.497], [58.682, 58.866], [58.879, 59.379], [59.695, 59.761], [59.774, 60.037], [60.05, 60.326]]}, {"kind": "s", "id": "s1_0_2", "md": "Line two is the current status: investigating, ==identified==, or recovering.", "zh": "第二行写当前状态：排查中、已定位，还是恢复中。", "sp": null, "gap": false, "start": 60.72, "end": 66.264, "words": [[60.825, 61.075], [61.088, 61.509], [61.523, 61.667], [61.681, 61.786], [61.799, 62.154], [62.167, 62.786], [63.075, 63.931], [64.141, 64.773], [65.194, 65.299], [65.312, 65.878]]}, {"kind": "s", "id": "s1_1_0", "md": "Line three is the next action, in plain words.", "zh": "第三行用大白话写下一步动作。", "sp": null, "gap": true, "start": 66.264, "end": 69.816, "words": [[66.369, 66.646], [66.659, 67.132], [67.211, 67.33], [67.343, 67.422], [67.435, 67.817], [67.83, 68.251], [68.54, 68.619], [68.632, 68.922], [68.935, 69.435]]}, {"kind": "s", "id": "s1_1_1", "md": "\"We are rolling back the payment change and expect errors to drop within twenty minutes.\"", "zh": "「我们正在回滚支付相关的改动，预计二十分钟内报错会降下来。」", "sp": null, "gap": false, "start": 69.816, "end": 75.192, "words": [[70.0, 70.027], [70.105, 70.237], [70.25, 70.605], [70.619, 70.974], [70.987, 71.079], [71.092, 71.434], [71.448, 71.842], [72.079, 72.171], [72.184, 72.645], [72.763, 73.119], [73.132, 73.224], [73.237, 73.645], [73.658, 73.974], [73.987, 74.303], [74.316, 74.79]]}, {"kind": "s", "id": "s1_1_2", "md": "Line four is the time of the next update, and you keep that promise even if nothing has changed.", "zh": "第四行写下一次同步的时间，就算情况没变，也要说到做到。", "sp": null, "gap": false, "start": 75.192, "end": 80.664, "words": [[75.297, 75.521], [75.534, 75.824], [75.837, 75.929], [75.942, 76.034], [76.047, 76.416], [76.429, 76.508], [76.521, 76.587], [76.6, 76.902], [76.916, 77.324], [77.666, 77.731], [77.745, 77.837], [77.85, 78.1], [78.113, 78.324], [78.337, 78.824], [78.837, 79.06], [79.074, 79.205], [79.218, 79.534], [79.547, 79.679], [79.692, 80.271]]}, {"kind": "s", "id": "s1_2_0", "md": "**An update that says nothing new still tells people you have not forgotten them.**", "zh": "一条没有新消息的通报，也在告诉大家你没忘了他们。", "sp": null, "gap": true, "start": 80.664, "end": 84.96, "words": [[80.769, 80.874], [80.888, 81.269], [81.282, 81.414], [81.427, 81.677], [81.69, 82.217], [82.23, 82.467], [82.48, 82.822], [82.835, 83.111], [83.125, 83.453], [83.467, 83.559], [83.572, 83.677], [83.69, 83.901], [83.914, 84.375], [84.388, 84.559]]}, {"kind": "s", "id": "s1_2_1", "md": "Avoid guessing at the root cause in a public channel, because ==premature== explanations tend to __come back to bite you__.", "zh": "别在公开群里猜根因，因为过早下的结论往往会反过来坑你。", "sp": null, "gap": false, "start": 84.96, "end": 91.728, "words": [[85.052, 85.46], [85.473, 85.855], [85.868, 85.947], [85.96, 86.026], [86.039, 86.368], [86.381, 86.789], [86.802, 86.907], [86.921, 86.973], [86.986, 87.342], [87.355, 87.736], [88.039, 88.342], [88.355, 88.999], [89.013, 89.842], [89.855, 90.092], [90.105, 90.157], [90.171, 90.368], [90.381, 90.697], [90.71, 90.815], [90.828, 91.118], [91.131, 91.342]]}, {"kind": "s", "id": "s1_2_2", "md": "Say what you have ==confirmed==, and __label the rest__ as unknown.", "zh": "已经确认的就说确认了，其余的标成未知。", "sp": null, "gap": false, "start": 91.728, "end": 95.352, "words": [[91.833, 92.004], [92.017, 92.162], [92.175, 92.267], [92.281, 92.452], [92.465, 93.083], [93.412, 93.544], [93.557, 93.82], [93.833, 93.925], [93.939, 94.307], [94.32, 94.439], [94.452, 94.965]]}, {"kind": "s", "id": "s1_2_3", "md": "People can plan around an honest unknown much more easily than around a wrong answer.", "zh": "大家围绕一个坦诚的「未知」做安排，比围绕一个错误答案容易得多。", "sp": null, "gap": false, "start": 95.352, "end": 100.944, "words": [[95.47, 95.747], [95.76, 95.918], [95.931, 96.26], [96.273, 96.615], [96.628, 96.76], [96.773, 97.234], [97.339, 97.852], [97.865, 98.207], [98.22, 98.47], [98.484, 98.997], [99.01, 99.155], [99.168, 99.549], [99.563, 99.602], [99.615, 100.036], [100.049, 100.549]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
