const D = {"id": "134", "type": "dialogue", "title": "Getting a Haircut", "meta": "B2 · 约 240 词 · 场景：理发时说清发型与修正", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Barber", "name_zh": "理发师", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "「你」对发型提了哪些具体要求？", "a": "只修一下；用剪刀不推渐变；顶上剪掉约两厘米，两边保持自然，后面收短，稍微打薄，左分，不上发蜡。"}, {"q": "剪完后出了什么问题？怎么解决的？", "a": "左边比右边短一点；理发师只修两边把它们弄齐，没再动顶上。"}, {"q": "最后「你」怎么付款、怎么预约的？", "a": "用 PayNow 付了二十五块；约了四周后同一天三点，并让理发师前一天发提醒。"}], "dictation": [{"id": "s0_1_0", "text": "Just a trim, please. It's getting a bit long, but I don't want it too short."}, {"id": "s0_3_0", "text": "Scissors, please. Take about two centimetres off the top, and keep the sides fairly natural."}, {"id": "s1_1_0", "text": "It looks good overall, but the left side seems a bit shorter than the right."}, {"id": "s1_3_0", "text": "Thanks. Just be careful not to go any shorter on top, please."}], "shadow": {"speaker": "A", "text": "Tapered, I think. And could you thin it out a little? My hair gets quite thick.", "marked": "<b>Tapered</b>, / I think. //<br>And could you <b>thin</b> it out / a <b>little</b>? //<br>My hair gets / quite <b>thick</b>. //"}, "prompts": [{"q": "带三岁的孩子去剪头发，孩子坐不住。跟理发师说清楚要的样子，并请对方尽量快一点。", "ref": "Hi, it's for my son. He's three, and he doesn't sit still for long, so the quicker the better. Could you just tidy it up? Keep the fringe above his eyebrows and make the sides a bit shorter. No clippers near his ears, please, they scare him. I'll hold him on my lap if that helps.", "ref_zh": "你好，是给我儿子剪。他三岁，坐不住太久，越快越好。能简单修一下吗？刘海剪到眉毛上面，两边稍微短一点。耳朵附近请别用电推子，他会害怕。如果方便的话，我可以抱着他坐。", "id": "ref0"}, {"q": "上次在这家店剪得太短了。这次一坐下就先把话说在前头，礼貌但明确。", "ref": "Before we start, last time I was here it came out much shorter than I wanted, so I'd like to be careful today. Please take off only about one centimetre all over. If you're not sure, leave it longer, and I'll tell you if I want more off. And please check with me before you use the clippers.", "ref_zh": "开始之前说一下，上次在这儿剪得比我想要的短很多，所以今天想小心一点。整体只剪掉大概一厘米。如果拿不准，就留长一点，要再短我会跟你说。还有，用电推子之前请先问我一下。", "id": "ref1"}], "words": [{"w": "trim (n.)", "ipa": "/trɪm/", "zh": "修剪", "ex": "I don't need a new style, just a trim.", "tts_w": "trim", "id": "w0"}, {"w": "fade", "ipa": "/feɪd/", "zh": "渐变推剪（两侧由短到长）", "ex": "He asked for a low fade on the sides.", "id": "w1"}, {"w": "tapered", "ipa": "/ˈteɪpərd/", "zh": "逐渐收短的", "ex": "A tapered neckline looks neater as it grows out.", "id": "w2"}, {"w": "thin out", "ipa": "/θɪn aʊt/", "zh": "打薄", "ex": "Could you thin out the back? It feels heavy.", "id": "w3"}, {"w": "product", "ipa": "/ˈprɑːdʌkt/", "zh": "（发蜡等）造型产品", "ex": "I don't use much product, just a bit of wax.", "id": "w4"}, {"w": "even (adj.)", "ipa": "/ˈiːvən/", "zh": "齐的；一样长的", "ex": "Make sure both sides of the curtain are even.", "tts_w": "even", "id": "w5"}, {"w": "owe", "ipa": "/oʊ/", "zh": "欠（钱）", "ex": "How much do I owe you for the taxi?", "id": "w6"}, {"w": "slot", "ipa": "/slɑːt/", "zh": "时段；名额", "ex": "The only slot left this week is Thursday at four.", "id": "w7"}, {"w": "reminder", "ipa": "/rɪˈmaɪndər/", "zh": "提醒", "ex": "The clinic sends a reminder the day before your appointment.", "id": "w8"}], "sections": [{"heading": "1. In the Chair", "heading_zh": "1. 坐上理发椅", "rows": [[{"id": "s0_0_0", "md": "Good afternoon, sir. What are we doing today?", "text": "Good afternoon, sir. What are we doing today?", "zh": "下午好，先生。今天想怎么剪？", "sp": "B"}], [{"id": "s0_1_0", "md": "Just a ==trim==, please. It's getting a bit long, but I don't want it too short.", "text": "Just a trim, please. It's getting a bit long, but I don't want it too short.", "zh": "稍微修一下就行。头发有点长了，但别剪太短。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. What about the sides? Do you want a ==fade==, or just scissors?", "text": "Sure. What about the sides? Do you want a fade, or just scissors?", "zh": "好的。两边呢？要推渐变，还是只用剪刀？", "sp": "B"}], [{"id": "s0_3_0", "md": "**Scissors, please. Take about two centimetres off the top, and keep the sides fairly natural.**", "text": "Scissors, please. Take about two centimetres off the top, and keep the sides fairly natural.", "zh": "用剪刀吧。顶上剪掉大概两厘米，两边保持自然一点。", "sp": "A"}], [{"id": "s0_4_0", "md": "Got it. And the back? Square, or ==tapered==?", "text": "Got it. And the back? Square, or tapered?", "zh": "明白。后面呢？剪平，还是逐渐收短？", "sp": "B"}], [{"id": "s0_5_0", "md": "Tapered, I think. And could you __thin it out__ a little? My hair gets quite thick.", "text": "Tapered, I think. And could you thin it out a little? My hair gets quite thick.", "zh": "收短吧。另外能稍微打薄一点吗？我头发挺厚的。", "sp": "A"}], [{"id": "s0_6_0", "md": "No problem. Do you usually __part it__ on the left?", "text": "No problem. Do you usually part it on the left?", "zh": "没问题。您平时是左分吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Yes, on the left. Basically __the same as__ now, just tidier.", "text": "Yes, on the left. Basically the same as now, just tidier.", "zh": "对，左分。基本跟现在一样，就是清爽一点。", "sp": "A"}], [{"id": "s0_8_0", "md": "Understood. Would you like some wax or gel at the end?", "text": "Understood. Would you like some wax or gel at the end?", "zh": "明白。最后要上点发蜡或者啫喱吗？", "sp": "B"}], [{"id": "s0_9_0", "md": "No ==product==, thanks. I prefer it natural.", "text": "No product, thanks. I prefer it natural.", "zh": "什么都不用上，谢谢。我喜欢自然一点。", "sp": "A"}]]}, {"heading": "2. Not Quite Right", "heading_zh": "2. 不太对劲", "rows": [[{"id": "s1_0_0", "md": "All done. Here's a mirror so you can see the back. What do you think?", "text": "All done. Here's a mirror so you can see the back. What do you think?", "zh": "剪好了。给您镜子看看后面。觉得怎么样？", "sp": "B"}], [{"id": "s1_1_0", "md": "It looks good overall, but the left side seems a bit shorter than the right.", "text": "It looks good overall, but the left side seems a bit shorter than the right.", "zh": "整体挺好，不过左边好像比右边短一点。", "sp": "A"}], [{"id": "s1_2_0", "md": "Let me see. Ah, you're right, they're not quite ==even= const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
