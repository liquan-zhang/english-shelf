const D = {"id": "134", "type": "dialogue", "title": "Getting a Haircut", "meta": "B2 · 约 240 词 · 场景：理发时说清发型与修正", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Barber", "name_zh": "理发师", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "「你」对发型提了哪些具体要求？", "a": "只修一下；用剪刀不推渐变；顶上剪掉约两厘米，两边保持自然，后面收短，稍微打薄，左分，不上发蜡。"}, {"q": "剪完后出了什么问题？怎么解决的？", "a": "左边比右边短一点；理发师只修两边把它们弄齐，没再动顶上。"}, {"q": "最后「你」怎么付款、怎么预约的？", "a": "用 PayNow 付了二十五块；约了四周后同一天三点，并让理发师前一天发提醒。"}], "dictation": [{"id": "s0_1_0", "text": "Just a trim, please. It's getting a bit long, but I don't want it too short."}, {"id": "s0_3_0", "text": "Scissors, please. Take about two centimetres off the top, and keep the sides fairly natural."}, {"id": "s1_1_0", "text": "It looks good overall, but the left side seems a bit shorter than the right."}, {"id": "s1_3_0", "text": "Thanks. Just be careful not to go any shorter on top, please."}], "shadow": {"speaker": "A", "text": "Tapered, I think. And could you thin it out a little? My hair gets quite thick.", "marked": "<b>Tapered</b>, / I think. //<br>And could you <b>thin</b> it out / a <b>little</b>? //<br>My hair gets / quite <b>thick</b>. //"}, "prompts": [{"q": "带三岁的孩子去剪头发，孩子坐不住。跟理发师说清楚要的样子，并请对方尽量快一点。", "ref": "Hi, it's for my son. He's three, and he doesn't sit still for long, so the quicker the better. Could you just tidy it up? Keep the fringe above his eyebrows and make the sides a bit shorter. No clippers near his ears, please, they scare him. I'll hold him on my lap if that helps.", "ref_zh": "你好，是给我儿子剪。他三岁，坐不住太久，越快越好。能简单修一下吗？刘海剪到眉毛上面，两边稍微短一点。耳朵附近请别用电推子，他会害怕。如果方便的话，我可以抱着他坐。", "id": "ref0"}, {"q": "上次在这家店剪得太短了。这次一坐下就先把话说在前头，礼貌但明确。", "ref": "Before we start, last time I was here it came out much shorter than I wanted, so I'd like to be careful today. Please take off only about one centimetre all over. If you're not sure, leave it longer, and I'll tell you if I want more off. And please check with me before you use the clippers.", "ref_zh": "开始之前说一下，上次在这儿剪得比我想要的短很多，所以今天想小心一点。整体只剪掉大概一厘米。如果拿不准，就留长一点，要再短我会跟你说。还有，用电推子之前请先问我一下。", "id": "ref1"}], "words": [{"w": "trim (n.)", "ipa": "/trɪm/", "zh": "修剪", "ex": "I don't need a new style, just a trim.", "tts_w": "trim", "id": "w0"}, {"w": "fade", "ipa": "/feɪd/", "zh": "渐变推剪（两侧由短到长）", "ex": "He asked for a low fade on the sides.", "id": "w1"}, {"w": "tapered", "ipa": "/ˈteɪpərd/", "zh": "逐渐收短的", "ex": "A tapered neckline looks neater as it grows out.", "id": "w2"}, {"w": "thin out", "ipa": "/θɪn aʊt/", "zh": "打薄", "ex": "Could you thin out the back? It feels heavy.", "id": "w3"}, {"w": "product", "ipa": "/ˈprɑːdʌkt/", "zh": "（发蜡等）造型产品", "ex": "I don't use much product, just a bit of wax.", "id": "w4"}, {"w": "even (adj.)", "ipa": "/ˈiːvən/", "zh": "齐的；一样长的", "ex": "Make sure both sides of the curtain are even.", "tts_w": "even", "id": "w5"}, {"w": "owe", "ipa": "/oʊ/", "zh": "欠（钱）", "ex": "How much do I owe you for the taxi?", "id": "w6"}, {"w": "slot", "ipa": "/slɑːt/", "zh": "时段；名额", "ex": "The only slot left this week is Thursday at four.", "id": "w7"}, {"w": "reminder", "ipa": "/rɪˈmaɪndər/", "zh": "提醒", "ex": "The clinic sends a reminder the day before your appointment.", "id": "w8"}], "sections": [{"heading": "1. In the Chair", "heading_zh": "1. 坐上理发椅", "rows": [[{"id": "s0_0_0", "md": "Good afternoon, sir. What are we doing today?", "text": "Good afternoon, sir. What are we doing today?", "zh": "下午好，先生。今天想怎么剪？", "sp": "B"}], [{"id": "s0_1_0", "md": "Just a ==trim==, please. It's getting a bit long, but I don't want it too short.", "text": "Just a trim, please. It's getting a bit long, but I don't want it too short.", "zh": "稍微修一下就行。头发有点长了，但别剪太短。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. What about the sides? Do you want a ==fade==, or just scissors?", "text": "Sure. What about the sides? Do you want a fade, or just scissors?", "zh": "好的。两边呢？要推渐变，还是只用剪刀？", "sp": "B"}], [{"id": "s0_3_0", "md": "**Scissors, please. Take about two centimetres off the top, and keep the sides fairly natural.**", "text": "Scissors, please. Take about two centimetres off the top, and keep the sides fairly natural.", "zh": "用剪刀吧。顶上剪掉大概两厘米，两边保持自然一点。", "sp": "A"}], [{"id": "s0_4_0", "md": "Got it. And the back? Square, or ==tapered==?", "text": "Got it. And the back? Square, or tapered?", "zh": "明白。后面呢？剪平，还是逐渐收短？", "sp": "B"}], [{"id": "s0_5_0", "md": "Tapered, I think. And could you __thin it out__ a little? My hair gets quite thick.", "text": "Tapered, I think. And could you thin it out a little? My hair gets quite thick.", "zh": "收短吧。另外能稍微打薄一点吗？我头发挺厚的。", "sp": "A"}], [{"id": "s0_6_0", "md": "No problem. Do you usually __part it__ on the left?", "text": "No problem. Do you usually part it on the left?", "zh": "没问题。您平时是左分吗？", "sp": "B"}], [{"id": "s0_7_0", "md": "Yes, on the left. Basically __the same as__ now, just tidier.", "text": "Yes, on the left. Basically the same as now, just tidier.", "zh": "对，左分。基本跟现在一样，就是清爽一点。", "sp": "A"}], [{"id": "s0_8_0", "md": "Understood. Would you like some wax or gel at the end?", "text": "Understood. Would you like some wax or gel at the end?", "zh": "明白。最后要上点发蜡或者啫喱吗？", "sp": "B"}], [{"id": "s0_9_0", "md": "No ==product==, thanks. I prefer it natural.", "text": "No product, thanks. I prefer it natural.", "zh": "什么都不用上，谢谢。我喜欢自然一点。", "sp": "A"}]]}, {"heading": "2. Not Quite Right", "heading_zh": "2. 不太对劲", "rows": [[{"id": "s1_0_0", "md": "All done. Here's a mirror so you can see the back. What do you think?", "text": "All done. Here's a mirror so you can see the back. What do you think?", "zh": "剪好了。给您镜子看看后面。觉得怎么样？", "sp": "B"}], [{"id": "s1_1_0", "md": "It looks good overall, but the left side seems a bit shorter than the right.", "text": "It looks good overall, but the left side seems a bit shorter than the right.", "zh": "整体挺好，不过左边好像比右边短一点。", "sp": "A"}], [{"id": "s1_2_0", "md": "Let me see. Ah, you're right, they're not quite ==even==. I'll __even it out__ for you.", "text": "Let me see. Ah, you're right, they're not quite even. I'll even it out for you.", "zh": "我看看。啊，您说得对，两边不太齐。我帮您修平。", "sp": "B"}], [{"id": "s1_3_0", "md": "**Thanks. Just be careful not to go any shorter on top, please.**", "text": "Thanks. Just be careful not to go any shorter on top, please.", "zh": "谢谢。顶上千万别再剪短了。", "sp": "A"}], [{"id": "s1_4_0", "md": "Of course, I'll only touch the sides. How's that now?", "text": "Of course, I'll only touch the sides. How's that now?", "zh": "当然，我只动两边。现在怎么样？", "sp": "B"}], [{"id": "s1_5_0", "md": "Much better, thank you. How much do I ==owe== you?", "text": "Much better, thank you. How much do I owe you?", "zh": "好多了，谢谢。我该付多少钱？", "sp": "A"}], [{"id": "s1_6_0", "md": "Twenty-five dollars for the cut. We take cash, card or PayNow.", "text": "Twenty-five dollars for the cut. We take cash, card or PayNow.", "zh": "剪发二十五块。可以付现金、刷卡或者用 PayNow。", "sp": "B"}], [{"id": "s1_7_0", "md": "PayNow is fine. Could I book the same ==slot== next month? Saturdays __get busy__.", "text": "PayNow is fine. Could I book the same slot next month? Saturdays get busy.", "zh": "PayNow 就行。下个月能约同一个时段吗？周六人多。", "sp": "A"}], [{"id": "s1_8_0", "md": "Sure. Four weeks from today at three. Shall I send you a ==reminder== the day before?", "text": "Sure. Four weeks from today at three. Shall I send you a reminder the day before?", "zh": "可以，四周后的今天三点。要不要前一天发个提醒给您？", "sp": "B"}], [{"id": "s1_9_0", "md": "**Yes, please. See you next month.**", "text": "Yes, please. See you next month.", "zh": "好的，麻烦了。下个月见。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. In the Chair", "zh": "1. 坐上理发椅", "start": 0.0, "end": 1.656, "words": [[0.105, 0.368], [0.645, 0.75], [0.763, 0.829], [0.842, 1.263]]}, {"kind": "s", "id": "s0_0_0", "md": "Good afternoon, sir. What are we doing today?", "zh": "下午好，先生。今天想怎么剪？", "sp": "B", "gap": false, "start": 1.656, "end": 6.84, "words": [[1.759, 2.022], [2.114, 2.917], [3.074, 3.469], [4.39 const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress

function step(id, name, time, how, body) {

  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}
