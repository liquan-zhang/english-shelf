<script>
const D = {"id": "020", "title": "Keeping a Remote Audience Awake", "meta": "B2 · 约 290 词 · 场景：线上汇报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. You Are Competing with Their Inbox", "heading_zh": "1. 你在跟他们的收件箱抢注意力", "rows": [[{"id": "s0_0_0", "md": "In a meeting room, you can see when people ==drift== away.", "text": "In a meeting room, you can see when people drift away.", "zh": "在会议室里，你能看出大家什么时候走神了。", "sp": null}, {"id": "s0_0_1", "md": "On a video call, you see a grid of muted squares, half of them with cameras off.", "text": "On a video call, you see a grid of muted squares, half of them with cameras off.", "zh": "在视频会上，你看到的是一格格静音的小方块，一半还关着摄像头。", "sp": null}, {"id": "s0_0_2", "md": "Somewhere behind those squares, your audience has email, chat, and a dashboard they are quietly ==monitoring==.", "text": "Somewhere behind those squares, your audience has email, chat, and a dashboard they are quietly monitoring.", "zh": "在那些小方块后面，你的听众开着邮件、聊天工具，还有一个他们正在悄悄盯着的看板。", "sp": null}], [{"id": "s0_1_0", "md": "This means a remote talk cannot be the same talk you would give in person.", "text": "This means a remote talk cannot be the same talk you would give in person.", "zh": "这意味着远程分享不能照搬线下的讲法。", "sp": null}, {"id": "s0_1_1", "md": "Your slides are not just competing with silence; they are competing with every notification on the listener's screen.", "text": "Your slides are not just competing with silence; they are competing with every notification on the listener's screen.", "zh": "你的幻灯片不只是在跟沉默竞争，它在跟听众屏幕上的每一条通知竞争。", "sp": null}, {"id": "s0_1_2", "md": "**Online, attention is not something you earn once; you have to win it back every few minutes.**", "text": "Online, attention is not something you earn once; you have to win it back every few minutes.", "zh": "在线上，注意力不是赢一次就完事的，你得每隔几分钟就重新把它抢回来。", "sp": null}], [{"id": "s0_2_0", "md": "The good news is that small changes make a big difference.", "text": "The good news is that small changes make a big difference.", "zh": "好消息是，小小的改变就能带来很大的不同。", "sp": null}, {"id": "s0_2_1", "md": "You do not need to be more ==charismatic==, you need to be more ==deliberate== about rhythm.", "text": "You do not need to be more charismatic, you need to be more deliberate about rhythm.", "zh": "你不需要更有个人魅力，你需要更刻意地把控节奏。", "sp": null}]]}, {"heading": "2. Change Something Every Five Minutes", "heading_zh": "2. 每五分钟变一次花样", "rows": [[{"id": "s1_0_0", "md": "Plan your talk in short blocks, and make sure something changes at the end of each one.", "text": "Plan your talk in short blocks, and make sure something changes at the end of each one.", "zh": "把分享拆成一个个短小的模块，确保每个模块结束时都有点变化。", "sp": null}, {"id": "s1_0_1", "md": "Switch from slides to a live screen, ask a question, or ==hand over== to a colleague.", "text": "Switch from slides to a live screen, ask a question, or hand over to a colleague.", "zh": "从幻灯片切到实时屏幕、抛一个问题，或者交给同事来讲。", "sp": null}, {"id": "s1_0_2", "md": "**A change in what people see or hear pulls their eyes back to your window.**", "text": "A change in what people see or hear pulls their eyes back to your window.", "zh": "大家看到的或听到的一有变化，视线就会被拉回你的窗口。", "sp": null}], [{"id": "s1_1_0", "md": "Use the chat ==actively==, because it is easier than unmuting.", "text": "Use the chat actively, because it is easier than unmuting.", "zh": "多用聊天框，因为打字比解除静音容易。", "sp": null}, {"id": "s1_1_1", "md": "\"Type one if you've hit this bug, and two if you haven't.\"", "text": "\"Type one if you've hit this bug, and two if you haven't.\"", "zh": "「遇到过这个 bug 的打一，没遇到过的打二。」", "sp": null}, {"id": "s1_1_2", "md": "Within seconds, the room __comes alive__, and you have real data to react to.", "text": "Within seconds, the room comes alive, and you have real data to react to.", "zh": "几秒钟之内，全场就活跃起来了，你也有了可以回应的真实数据。", "sp": null}], [{"id": "s1_2_0", "md": "Call on people by name, but warn them first.", "text": "Call on people by name, but warn them first.", "zh": "可以点名，但要先打个招呼。", "sp": null}, {"id": "s1_2_1", "md": "\"In a minute, I'll ask Hana how her team handles alerts.\"", "text": "\"In a minute, I'll ask Hana how her team handles alerts.\"", "zh": "「等会儿我会问问 Hana，她们团队是怎么处理告警的。」", "sp": null}, {"id": "s1_2_2", "md": "Hana starts listening ==closely==, and so does everyone else, because they know it could be them next.", "text": "Hana starts listening closely, and so does everyone else, because they know it could be them next.", "zh": "Hana 会开始认真听，其他人也一样，因为他们知道下一个可能就是自己。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __cut your content__ by about a third compared with an in-person version.", "text": "Finally, cut your content by about a third compared with an in-person version.", "zh": "最后，内容要比线下版本砍掉三分之一左右。", "sp": null}, {"id": "s1_3_1", "md": "Remote listeners tire faster, and nobody has ever complained that a call ended early.", "text": "Remote listeners tire faster, and nobody has ever complained that a call ended early.", "zh": "远程听众更容易累，而且从来没人抱怨过会议提前结束。", "sp": null}, {"id": "s1_3_2", "md": "Leave the details in a written doc, and __use the live time__ for the parts that need a conversation.", "text": "Leave the details in a written doc, and use the live time for the parts that need a conversation.", "zh": "细节留在书面文档里，现场时间用在需要讨论的部分。", "sp": null}]]}], "gist": [{"q": "作者认为线上汇报和线下汇报最大的不同是什么？", "a": "线上看不到听众的状态，而且你在和他们屏幕上的邮件、消息、通知争夺注意力，注意力需要每隔几分钟重新赢回。"}, {"q": "作者建议多久做一次变化？可以怎么变？", "a": "大约每五分钟；切换到实时画面、提一个问题、交给同事讲，或让大家在聊天框里回复。"}, {"q": "点名提问时作者有什么技巧？内容量应怎样调整？", "a": "提前预告要点谁，让对方和其他人都专心听；内容比线下版本削减约三分之一，细节放到书面文档。"}], "dictation": [{"id": "s0_1_2", "text": "Online, attention is not something you earn once; you have to win it back every few minutes."}, {"id": "s1_0_2", "text": "A change in what people see or hear pulls their eyes back to your window."}, {"id": "s1_1_0", "text": "Use the chat actively, because it is easier than unmuting."}, {"id": "s1_3_1", "text": "Remote listeners tire faster, and nobody has ever complained that a call ended early."}], "shadow": {"text": "Call on people by name, but warn them first. \"In a minute, I'll ask Hana how her team handles alerts.\"", "marked": "Call on people by <b>name</b>, / but <b>warn</b> them first. //<br>\"In a <b>minute</b>, / I'll ask <b>Hana</b> / how <b>her</b> team handles alerts.\" //"}, "prompts": [{"q": "你在给几个海外团队做线上分享，讲到第十分钟，感觉大家都在干别的。用 30 秒做一次“变化”：用聊天框互动，并预告接下来要点名。", "ref": "Let me pause the slides for a second and get a quick pulse check. In the chat, type one if your team has had a deploy rolled back this quarter, and two if not. Okay, I'm seeing lots of ones, that's what I expected. In a moment, I'm going to ask Carlos what his team changed after their last rollback, so Carlos, get ready.", "ref_zh": "我先暂停一下幻灯片，快速摸个底。在聊天框里，如果你们团队这个季度有过部署被回滚，就打一，没有就打二。好，我看到好多一，跟我预想的一样。等会儿我会请 Carlos 讲讲他们团队上次回滚之后改了什么，Carlos 准备一下。", "id": "ref0"}, {"q": "你要把一个六十分钟的线下培训改成线上版本。用 30 秒向同事说明你打算怎么调整结构。", "ref": "For the online version, I want to cut it down to about forty minutes. I'll split it into short blocks of five or six minutes each, and end every block with something different, a poll in the chat, a quick live demo, or a question for a specific person. The detailed examples will go into a written guide that people can read afterward, so the live time is mostly discussion.", "ref_zh": "线上版本我想压缩到四十分钟左右。我会把它拆成每段五六分钟的短模块，每段结尾都换个花样，比如聊天框里的投票、一段简短的现场演示，或者点名问某个人一个问题。详细的例子会放进一份书面指南，大家会后可以看，这样现场时间主要用来讨论。", "id": "ref1"}], "words": [{"w": "drift (away)", "ipa": "/drɪft/", "zh": "走神、注意力漂走", "ex": "I could see people drift away during the long architecture section.", "tts_w": "drift", "id": "w0"}, {"w": "monitor (v.)", "ipa": "/ˈmɑːnɪtər/", "zh": "监控、盯着", "ex": "Keep monitoring the error rate for an hour after the deploy.", "tts_w": "monitor", "id": "w1"}, {"w": "charismatic", "ipa": "/ˌkærɪzˈmætɪk/", "zh": "有魅力的、有感染力的", "ex": "You don't have to be charismatic to give a clear tech talk.", "id": "w2"}, {"w": "deliberate", "ipa": "/dɪˈlɪbərət/", "zh": "刻意的、有意为之的", "ex": "Keeping the first const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
