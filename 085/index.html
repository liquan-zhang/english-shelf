<script>
const D = {"id": "085", "title": "Coffee Chats with People Outside Your Team", "meta": "B2 · 约 270 词 · 场景：跨组咖啡聊天", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why Bother Leaving Your Team", "heading_zh": "1. 为什么要走出自己的团队", "rows": [[{"id": "s0_0_0", "md": "When you are busy, coffee with someone from another team can feel like a ==luxury==.", "text": "When you are busy, coffee with someone from another team can feel like a luxury.", "zh": "忙起来的时候，跟别的团队的人喝杯咖啡，感觉像是一种奢侈。", "sp": null}, {"id": "s0_0_1", "md": "Your own roadmap is full, and their work seems ==unrelated==.", "text": "Your own roadmap is full, and their work seems unrelated.", "zh": "自己的 roadmap 排得满满的，他们的工作看着也不相干。", "sp": null}], [{"id": "s0_1_0", "md": "But most problems in a large company sit between teams, not inside them.", "text": "But most problems in a large company sit between teams, not inside them.", "zh": "但在大公司里，大多数问题都卡在团队之间，而不是团队内部。", "sp": null}, {"id": "s0_1_1", "md": "The person who already knows the data lead, the legal reviewer, or the platform owner can solve in one message what takes others a week.", "text": "The person who already knows the data lead, the legal reviewer, or the platform owner can solve in one message what takes others a week.", "zh": "一个本来就认识数据负责人、法务审核或者平台 owner 的人，一条消息就能搞定别人要折腾一周的事。", "sp": null}, {"id": "s0_1_2", "md": "**Your network is not who you know; it is who will reply when you need help.**", "text": "Your network is not who you know; it is who will reply when you need help.", "zh": "你的人脉不是你认识谁；而是你需要帮忙的时候，谁会回你消息。", "sp": null}], [{"id": "s0_2_0", "md": "Those relationships are much easier to build before you need them.", "text": "Those relationships are much easier to build before you need them.", "zh": "这种关系，在你用得上之前建立要容易得多。", "sp": null}, {"id": "s0_2_1", "md": "Asking a stranger for a favor in the middle of an ==outage== feels uncomfortable.", "text": "Asking a stranger for a favor in the middle of an outage feels uncomfortable.", "zh": "线上事故处理到一半去找陌生人帮忙，会很别扭。", "sp": null}, {"id": "s0_2_2", "md": "Asking someone you had coffee with last month feels normal.", "text": "Asking someone you had coffee with last month feels normal.", "zh": "去找上个月一起喝过咖啡的人，就很自然。", "sp": null}]]}, {"heading": "2. Making Thirty Minutes Count", "heading_zh": "2. 让三十分钟物有所值", "rows": [[{"id": "s1_0_0", "md": "Go with a light reason, not a hidden ==agenda==.", "text": "Go with a light reason, not a hidden agenda.", "zh": "带一个轻松的理由去，别藏着别的目的。", "sp": null}, {"id": "s1_0_1", "md": "\"I saw your team launched the new search feature, and I'd love to hear how you approached it\" is an easy message to __say yes to__.", "text": "\"I saw your team launched the new search feature, and I'd love to hear how you approached it\" is an easy message to say yes to.", "zh": "「看到你们团队上线了新的搜索功能，很想听听你们是怎么做的」，这种消息对方很容易答应。", "sp": null}], [{"id": "s1_1_0", "md": "During the chat, __lean on__ three kinds of questions.", "text": "During the chat, lean on three kinds of questions.", "zh": "聊的时候，靠三类问题撑着。", "sp": null}, {"id": "s1_1_1", "md": "Ask about their work: \"What's taking up most of your time this quarter?\"", "text": "Ask about their work: \"What's taking up most of your time this quarter?\"", "zh": "问他们的工作：「这个季度你主要在忙什么？」", "sp": null}, {"id": "s1_1_2", "md": "Ask about their path: \"How did you end up on this team?\"", "text": "Ask about their path: \"How did you end up on this team?\"", "zh": "问他们的经历：「你是怎么来到这个团队的？」", "sp": null}, {"id": "s1_1_3", "md": "Ask about their view: \"What do people outside your team usually get wrong about it?\"", "text": "Ask about their view: \"What do people outside your team usually get wrong about it?\"", "zh": "问他们的看法：「外面的人对你们团队最常见的误解是什么？」", "sp": null}], [{"id": "s1_2_0", "md": "**The best coffee chats are two-way, so come ready to give something back.**", "text": "The best coffee chats are two-way, so come ready to give something back.", "zh": "最好的咖啡聊天是双向的，所以要准备好回馈点什么。", "sp": null}, {"id": "s1_2_1", "md": "Share a lesson from your own project, offer an introduction, or __send over__ a useful document afterward.", "text": "Share a lesson from your own project, offer an introduction, or send over a useful document afterward.", "zh": "分享一条自己项目里的经验，主动帮忙引荐，或者事后发一份有用的文档过去。", "sp": null}, {"id": "s1_2_2", "md": "That ==reciprocity== is what turns one chat into a lasting ==connection==.", "text": "That reciprocity is what turns one chat into a lasting connection.", "zh": "正是这种有来有往，让一次聊天变成长久的联系。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, keep it short and __follow through__.", "text": "Finally, keep it short and follow through.", "zh": "最后，聊得短一点，事后要跟进。", "sp": null}, {"id": "s1_3_1", "md": "A one-line message the next day, like \"Thanks again, that tip about the review process saved me hours,\" makes the next coffee much easier to ==arrange==.", "text": "A one-line message the next day, like \"Thanks again, that tip about the review process saved me hours,\" makes the next coffee much easier to arrange.", "zh": "第二天发一句话，比如「再次感谢，你说的评审流程那个技巧帮我省了好几个小时」，下次再约咖啡就容易多了。", "sp": null}]]}], "gist": [{"q": "作者为什么认为值得和组外的人喝咖啡？", "a": "大公司的问题多出在团队之间；认识对口的人能一条消息解决别人一周的事，而关系要在需要之前建立。"}, {"q": "聊天时可以问哪三类问题？", "a": "问对方的工作（这季度最占时间的是什么）、经历（怎么来到这个组）、看法（组外的人常误解什么）。"}, {"q": "怎样让一次聊天变成长期关系？", "a": "双向交流，主动回馈（分享经验、引荐、发资料）；第二天发一句具体的感谢，下次更好约。"}], "dictation": [{"id": "s0_1_2", "text": "Your network is not who you know; it is who will reply when you need help."}, {"id": "s0_2_0", "text": "Those relationships are much easier to build before you need them."}, {"id": "s1_2_0", "text": "The best coffee chats are two-way, so come ready to give something back."}, {"id": "s1_2_2", "text": "That reciprocity is what turns one chat into a lasting connection."}], "shadow": {"text": "The best coffee chats are two-way, so come ready to give something back. Share a lesson from your own project, offer an introduction, or send over a useful document afterward. That reciprocity is what turns one chat into a lasting connection.", "marked": "<b>The best</b> coffee chats are <b>two-way</b>, / so come ready to <b>give</b> something <b>back</b>. //<br>Share a <b>lesson</b> from your own project, / offer an <b>introduction</b>, / or send over a useful <b>document</b> afterward. //<br>That <b>reciprocity</b> / is what turns <b>one</b> chat / into a <b>lasting</b> connection. //"}, "prompts": [{"q": "你在电梯里碰到另一个部门做推荐实验的 TL，你们不认识。用一个轻理由在 30 秒内约他喝咖啡。", "ref": "Hi, sorry to jump in, I lead the media processing team on the third floor. I saw your talk on ranking experiments last month and really liked the part about small samples. Would you be up for a quick coffee sometime next week? I'd love to hear how your team decides which experiments to stop early.", "ref_zh": "你好，不好意思冒昧打扰，我是三楼媒体处理团队的负责人。上个月听了你讲排序实验的分享，特别喜欢讲小样本的那部分。下周找个时间一起喝杯咖啡怎么样？很想听听你们团队是怎么决定哪些实验提前停掉的。", "id": "ref0"}, {"q": "咖啡聊天快结束了，对方给了你很多帮助。用 30 秒表示感谢、回馈一点东西，并约下次。", "ref": "This was really helpful, thank you. The point about getting legal involved early is something I'll take straight back to my team. By the way, you mentioned you're struggling with video transcoding costs. One of my engineers did a deep dive on that last quarter. Want me to introduce you? And let's do this again next month.", "ref_zh": "这次真的很有帮助，谢谢。你说的让法务早点介入，我回去马上就跟团队讲。对了，你提到视频转码成本让你们挺头疼。我们组有个工程师上个季度专门深挖过这块。要不要我给你们牵个线？我们下个月再约一次。", "id": "ref1"}], "words": [{"w": "luxury", "ipa": "/ˈlʌkʃəri/", "zh": "奢侈、难得的享受", "ex": "Long design reviews are a luxury we can't afford this quarter.", "id": "w0"}, {"w": "unrelated", "ipa": "/ˌʌnrɪˈleɪtɪd/", "zh": "无关的", "ex": "The crash looked unrelated to our change, but we checked anyway.", "id": "w1"}, {"w": "outage", "ipa": "/ˈaʊtɪdʒ/", "zh": "（服务）中断、故障", "ex": "The outage lasted forty minutes and affected two regions.", "id": "w2"}, {"w": "agenda", "ipa": "/əˈdʒendə/", "zh": "议程；（隐藏的）目的", "ex": "I don't have a hidden agenda, I just want to understand your roadmap.", "id": "w3"}, {"w": "reciprocity", "ipa": "/ˌres const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
