<script>
const D = {"id": "085", "title": "Coffee Chats with People Outside Your Team", "meta": "B2 · 约 270 词 · 场景：跨组咖啡聊天", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why Bother Leaving Your Team", "heading_zh": "1. 为什么要走出自己的团队", "rows": [[{"id": "s0_0_0", "md": "When you are busy, coffee with someone from another team can feel like a ==luxury==.", "text": "When you are busy, coffee with someone from another team can feel like a luxury.", "zh": "忙起来的时候，跟别的团队的人喝杯咖啡，感觉像是一种奢侈。", "sp": null}, {"id": "s0_0_1", "md": "Your own roadmap is full, and their work seems ==unrelated==.", "text": "Your own roadmap is full, and their work seems unrelated.", "zh": "自己的 roadmap 排得满满的，他们的工作看着也不相干。", "sp": null}], [{"id": "s0_1_0", "md": "But most problems in a large company sit between teams, not inside them.", "text": "But most problems in a large company sit between teams, not inside them.", "zh": "但在大公司里，大多数问题都卡在团队之间，而不是团队内部。", "sp": null}, {"id": "s0_1_1", "md": "The person who already knows the data lead, the legal reviewer, or the platform owner can solve in one message what takes others a week.", "text": "The person who already knows the data lead, the legal reviewer, or the platform owner can solve in one message what takes others a week.", "zh": "一个本来就认识数据负责人、法务审核或者平台 owner 的人，一条消息就能搞定别人要折腾一周的事。", "sp": null}, {"id": "s0_1_2", "md": "**Your network is not who you know; it is who will reply when you need help.**", "text": "Your network is not who you know; it is who will reply when you need help.", "zh": "你的人脉不是你认识谁；而是你需要帮忙的时候，谁会回你消息。", "sp": null}], [{"id": "s0_2_0", "md": "Those relationships are much easier to build before you need them.", "text": "Those relationships are much easier to build before you need them.", "zh": "这种关系，在你用得上之前建立要容易得多。", "sp": null}, {"id": "s0_2_1", "md": "Asking a stranger for a favor in the middle of an ==outage== feels uncomfortable.", "text": "Asking a stranger for a favor in the middle of an outage feels uncomfortable.", "zh": "线上事故处理到一半去找陌生人帮忙，会很别扭。", "sp": null}, {"id": "s0_2_2", "md": "Asking someone you had coffee with last month feels normal.", "text": "Asking someone you had coffee with last month feels normal.", "zh": "去找上个月一起喝过咖啡的人，就很自然。", "sp": null}]]}, {"heading": "2. Making Thirty Minutes Count", "heading_zh": "2. 让三十分钟物有所值", "rows": [[{"id": "s1_0_0", "md": "Go with a light reason, not a hidden ==agenda==.", "text": "Go with a light reason, not a hidden agenda.", "zh": "带一个轻松的理由去，别藏着别的目的。", "sp": null}, {"id": "s1_0_1", "md": "\"I saw your team launched the new search feature, and I'd love to hear how you approached it\" is an easy message to __say yes to__.", "text": "\"I saw your team launched the new search feature, and I'd love to hear how you approached it\" is an easy message to say yes to.", "zh": "「看到你们团队上线了新的搜索功能，很想听听你们是怎么做的」，这种消息对方很容易答应。", "sp": null}], [{"id": "s1_1_0", "md": "During the chat, __lean on__ three kinds of questions.", "text": "During the chat, lean on three kinds of questions.", "zh": "聊的时候，靠三类问题撑着。", "sp": null}, {"id": "s1_1_1", "md": "Ask about their work: \"What's taking up most of your time this quarter?\"", "text": "Ask about their work: \"What's taking up most of your time this quarter?\"", "zh": "问他们的工作：「这个季度你主要在忙什么？」", "sp": null}, {"id": "s1_1_2", "md": "Ask about their path: \"How did you end up on this team?\"", "text": "Ask about their path: \"How did you end up on this team?\"", "zh": "问他们的经历：「你是怎么来到这个团队的？」", "sp": null}, {"id": "s1_1_3", "md": "Ask about their view: \"What do people outside your team usually get wrong about it?\"", "text": "Ask about their view: \"What do people outside your team usually get wrong about it?\"", "zh": "问他们的看法：「外面的人对你们团队最常见的误解是什么？」", "sp": null}], [{"id": "s1_2_0", "md": "**The best coffee chats are two-way, so come ready to give something back.**", "text": "The best coffee chats are two-way, so come ready to give something back.", "zh": "最好的咖啡聊天是双向的，所以要准备好回馈点什么。", "sp": null}, {"id": "s1_2_1", "md": "Share a lesson from your own project, offer an introduction, or __send over__ a useful document afterward.", "text": "Share a lesson from your own project, offer an introduction, or send over a useful document afterward.", "zh": "分享一条自己项目里的经验，主动帮忙引荐，或者事后发一份有用的文档过去。", "sp": null}, {"id": "s1_2_2", "md": "That ==reciprocity== is what turns one chat into a lasting ==connection==.", "text": "That reciprocity is what turns one chat into a lasting connection.", "zh": "正是这种有来有往，让一次聊天变成长久的联系。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, keep it short and __follow through__.", "text": "Finally, keep it short and follow through.", "zh": "最后，聊得短一点，事后要跟进。", "sp": null}, {"id": "s1_3_1", "md": "A one-line message the next day, like \"Thanks again, that tip about the review process saved me hours,\" makes the next coffee much easier to ==arrange==.", "text": "A one-line message the next day, like \"Thanks again, that tip about the review process saved me hours,\" makes the next coffee much easier to arrange.", "zh": "第二天发一句话，比如「再次感谢，你说的评审流程那个技巧帮我省了好几个小时」，下次再约咖啡就容易多了。", "sp": null}]]}], "gist": [{"q": "作者为什么认为值得和组外的人喝咖啡？", "a": "大公司的问题多出在团队之间；认识对口的人能一条消息解决别人一周的事，而关系要在需要之前建立。"}, {"q": "聊天时可以问哪三类问题？", "a": "问对方的工作（这季度最占时间的是什么）、经历（怎么来到这个组）、看法（组外的人常误解什么）。"}, {"q": "怎样让一次聊天变成长期关系？", "a": "双向交流，主动回馈（分享经验、引荐、发资料）；第二天发一句具体的感谢，下次更好约。"}], "dictation": [{"id": "s0_1_2", "text": "Your network is not who you know; it is who will reply when you need help."}, {"id": "s0_2_0", "text": "Those relationships are much easier to build before you need them."}, {"id": "s1_2_0", "text": "The best coffee chats are two-way, so come ready to give something back."}, {"id": "s1_2_2", "text": "That reciprocity is what turns one chat into a lasting connection."}], "shadow": {"text": "The best coffee chats are two-way, so come ready to give something back. Share a lesson from your own project, offer an introduction, or send over a useful document afterward. That reciprocity is what turns one chat into a lasting connection.", "marked": "<b>The best</b> coffee chats are <b>two-way</b>, / so come ready to <b>give</b> something <b>back</b>. //<br>Share a <b>lesson</b> from your own project, / offer an <b>introduction</b>, / or send over a useful <b>document</b> afterward. //<br>That <b>reciprocity</b> / is what turns <b>one</b> chat / into a <b>lasting</b> connection. //"}, "prompts": [{"q": "你在电梯里碰到另一个部门做推荐实验的 TL，你们不认识。用一个轻理由在 30 秒内约他喝咖啡。", "ref": "Hi, sorry to jump in, I lead the media processing team on the third floor. I saw your talk on ranking experiments last month and really liked the part about small samples. Would you be up for a quick coffee sometime next week? I'd love to hear how your team decides which experiments to stop early.", "ref_zh": "你好，不好意思冒昧打扰，我是三楼媒体处理团队的负责人。上个月听了你讲排序实验的分享，特别喜欢讲小样本的那部分。下周找个时间一起喝杯咖啡怎么样？很想听听你们团队是怎么决定哪些实验提前停掉的。", "id": "ref0"}, {"q": "咖啡聊天快结束了，对方给了你很多帮助。用 30 秒表示感谢、回馈一点东西，并约下次。", "ref": "This was really helpful, thank you. The point about getting legal involved early is something I'll take straight back to my team. By the way, you mentioned you're struggling with video transcoding costs. One of my engineers did a deep dive on that last quarter. Want me to introduce you? And let's do this again next month.", "ref_zh": "这次真的很有帮助，谢谢。你说的让法务早点介入，我回去马上就跟团队讲。对了，你提到视频转码成本让你们挺头疼。我们组有个工程师上个季度专门深挖过这块。要不要我给你们牵个线？我们下个月再约一次。", "id": "ref1"}], "words": [{"w": "luxury", "ipa": "/ˈlʌkʃəri/", "zh": "奢侈、难得的享受", "ex": "Long design reviews are a luxury we can't afford this quarter.", "id": "w0"}, {"w": "unrelated", "ipa": "/ˌʌnrɪˈleɪtɪd/", "zh": "无关的", "ex": "The crash looked unrelated to our change, but we checked anyway.", "id": "w1"}, {"w": "outage", "ipa": "/ˈaʊtɪdʒ/", "zh": "（服务）中断、故障", "ex": "The outage lasted forty minutes and affected two regions.", "id": "w2"}, {"w": "agenda", "ipa": "/əˈdʒendə/", "zh": "议程；（隐藏的）目的", "ex": "I don't have a hidden agenda, I just want to understand your roadmap.", "id": "w3"}, {"w": "reciprocity", "ipa": "/ˌres const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
