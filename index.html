  .offline button:disabled { opacity: .5; cursor: default; }

  .dlbar i { display:block; height: 100%; width: 0; background: var(--ok); }
  .empty { color: var(--mute); padding: 40px 0; text-align: center; }
  h2 { font-size: 16px; margin: 26px 0 10px; }
  h2 span { color: var(--mute); font-weight: normal; font-size: 13px; margin-left: 6px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius: 12px; padding: 12px 14px; display:flex; flex-direction:column; gap: 6px; }
  .card.off { opacity: .45; }
  .card[data-href] { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .card[data-href]:hover { border-color: #d6d3d1; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .card .top { display:flex; gap:8px; align-items:baseline; }
  .card .id { color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
  .card .t { font-weight: 600; line-height: 1.35; }
  .card .angle { color: var(--mute); font-size: 13px; }
  .card .foot { display:flex; align-items:center; gap: 8px; margin-top: auto; padding-top: 4px; font-size: 13px; }
  .card a { color: var(--ink); text-decoration:none; border:1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .card a:hover { border-color: var(--accent); }
  .accent { font-size: 11px; border-radius: 4px; padding: 1px 6px; background:#f5f5f4; color: var(--mute); }
  .bar { flex:1; height: 4px; background: #f0efed; border-radius: 2px; overflow:hidden; }
  .bar i { display:block; height:100%; background: var(--ok); }
  .card.done { border-color: #bbf7d0; }

true}, {"id": "140", "cat": "K", "cat_name": "生活对话", "sub": "孩子与家庭", "title": "Signing Up for Kids' Swimming Lessons", "angle": "报名游泳课：级别、时间、试课", "voice": "en-AU-WilliamMultilingualNeural", "ready": true}, {"id": "141", "cat": "K", "cat_name": "生活对话", "sub": "邻居与社交", "title": "Meeting Your New Neighbor", "angle": "新邻居打招呼、互相介绍", "voice": "en-US-EmmaNeural", "ready": true}, {"id": "142", "cat": "K", "cat_name": "生活对话", "sub": "邻居与社交", "title": "Dealing with a Noisy Neighbor", "angle": "邻居太吵，友好地沟通", "voice": "en-SG-WayneNeural", "ready": true}, {"id": "143", "cat": "K", "cat_name": "生活对话", "sub": "邻居与社交", "title": "Joining a Gym", "angle": "办健身卡：会员类型、私教、冻卡", "voice": "en-GB-SoniaNeural", "ready": true}, {"id": "144", "cat": "K", "cat_name": "生活对话", "sub": "邻居与社交", "title": "Small Talk at a Friend's Party", "angle": "朋友派对上和不认识的人聊天", "voice": "en-IN-PrabhatNeural", "ready": true}, {"id": "145", "cat": "K", "cat_name": "生活对话", "sub": "邻居与社交", "title": "Inviting Friends Over for Dinner", "angle": "邀请朋友来家里吃饭：时间、忌口", "voice": "en-US-AvaNeural", "ready": true}, {"id": "146", "cat": "K", "cat_name": "生活对话", "sub": "办事与求助", "title": "Calling Customer Service", "angle": "打客服电话：转人工、说清问题、要工单号", "voice": "en-AU-NatashaNeural", "ready": true}, {"id": "147", "cat": "K", "cat_name": "生活对话", "sub": "办事与求助", "title": "Sending a Parcel at the Post Office", "angle": "邮局寄包裹：时效、申报、保价", "voice": "en-SG-LunaNeural", "ready": true}, {"id": "148", "cat": "K", "cat_name": "生活对话", "sub": "办事与求助", "title": "Reporting a Lost Item", "angle": "报失：丢了钱包，描述物品、留联系方式", "voice": "en-GB-RyanNeural", "ready": true}, {"id": "149", "cat": "K", "cat_name": "生活对话", "sub": "办事与求助", "title": "Booking a Repair Technician", "angle": "预约空调维修：时间、上门费、报价", "voice": "en-IN-NeerjaNeural", "ready": true}, {"id": "150", "cat": "K", "cat_name": "生活对话", "sub": "办事与求助", "title": "Asking for Directions", "angle": "问路：怎么走、坐什么车、多远", "voice": "en-AU-WilliamMultilingualNeural", "ready": true}];
const ACC = { US: '美音', GB: '英音', IN: '印度', SG: '新加坡', AU: '澳洲' };
const prog = id => { const p = JSON.parse(localStorage.getItem('wb:' + id) || '{}'); return Object.values(p).filter(Boolean).length; };
// two-level navigation: domain (工作/生活/学术) → direction inside it
const DOMAINS = [['work', '工作'], ['life', '生活'], ['academic', '学术']];
const domainOf = t => t.domain || (t.cat === 'K' ? 'life' : 'work');
const dirOf = t => domainOf(t) === 'life' ? t.sub : t.cat_name;
const saved = JSON.parse(localStorage.getItem('wb:shelf') || '{}');
let dom = saved.dom || 'all', dir = saved.dir || 'all', todo = !!saved.todo;
const save = () => localStorage.setItem('wb:shelf', JSON.stringify({ dom, dir, todo }));
const btn = (label, on, onclick, extra = '') => {
  const b = document.createElement('button');
  b.innerHTML = label + extra; b.className = on ? 'on' : ''; b.onclick = onclick;
  return b;
};
const cnt = n => `<span class="n">${n}</span>`;

function render() {
  const done = T.filter(t => prog(t.id) >= 6).length, started = T.filter(t => prog(t.id) > 0).length;
  document.getElementById('stats').innerHTML =
    `<span><b>${T.filter(t => t.ready).length}</b>篇可练</span><span><b>${started}</b>篇已开始</span><span><b>${done}</b>篇已完成</span>`;

  const l1 = document.getElementById('filters');
  l1.replaceChildren(
    btn('全部', dom === 'all', () => { dom = 'all'; dir = 'all'; save(); render(); }, cnt(T.length)),
    ...DOMAINS.map(([k, n]) => btn(n, dom === k, () => { dom = k; dir = 'all'; save(); render(); },
      cnt(T.filter(t => domainOf(t) === k).length))),
    btn('只看未完成', todo, () => { todo = !todo; save(); render(); }));
  l1.lastChild.classList.add('toggle');

  const inDom = T.filter(t => dom === 'all' || domainOf(t) === dom);
  const dirs = [...new Set(inDom.map(dirOf))];
  const l2 = document.getElementById('filters2');
  l2.hidden = dom === 'all' || !dirs.length;
  l2.replaceChildren(
    btn('全部', dir === 'all', () => { dir = 'all'; save(); render(); }),
    ...dirs.map(d => btn(d, dir === d, () => { dir = d; save(); render(); }, cnt(inDom.filter(t => dirOf(t) === d).length))));

  const list = document.getElementById('list');
  list.innerHTML = '';
  if (dom === 'academic' && !inDom.length) {
    list.innerHTML = '<p class="empty">学术方向还没有内容。</p>';
    return;
  }
  for (const [dk, dn] of DOMAINS) {
    if (dom !== 'all' && dom !== dk) continue;
    for (const d of [...new Set(T.filter(t => domainOf(t) === dk).map(dirOf))]) {
      if (dir !== 'all' && dir !== d) continue;
      const items = T.filter(t => domainOf(t) === dk && dirOf(t) === d && (!todo || prog(t.id) < 6));
      if (!items.length) continue;
      list.insertAdjacentHTML('beforeend', `<h2>${dn} · ${d}<span>${items.length} 篇</span></h2>`);
      const g = document.createElement('div'); g.className = 'grid';
      for (const t of items) {
        const p = prog(t.id), acc = ACC[t.voice.split('-')[1]];
        g.insertAdjacentHTML('beforeend', `<div class="card ${t.ready ? '' : 'off'} ${p >= 6 ? 'done' : ''}" ${t.ready ? `data-href="${t.id}/player.html"` : ''}>
          <div class="top"><span class="id">${t.id}</span><span class="t">${t.title}</span></div>
          <div class="angle">${t.angle}</div>
          <div class="foot">${t.ready ? `<a href="${t.id}/player.html">🎧 播放</a><a href="${t.id}/index.html">📝 练习</a>` : '<span class="accent">生成中</span>'}
            <span class="accent">${acc}</span><span class="bar"><i style="width:${p / 6 * 100}%"></i></span></div></div>`);
      }
      list.append(g);
    }
  }
}
// whole card opens the article; the small buttons inside keep their own links
document.getElementById('list').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const card = e.target.closest('.card[data-href]');
  if (card) location.href = card.dataset.href;
});
render();

// offline: download every file listed in assets.json into the same cache the service worker uses
(async () => {
  if (!('caches' in window) || (location.protocol !== 'https:' && location.hostname !== 'localhost')) return;
  const box = document.getElementById('offline'), btn = document.getElementById('dl');
  const info = document.getElementById('dlinfo'), bar = document.getElementById('dlbar');
  box.hidden = false;
  const base = new URL('./', location.href);
  let files;
  try { files = await (await fetch('assets.json', { cache: 'no-cache' })).json(); } catch { box.hidden = true; return; }
  const cache = await caches.open('shelf-v1');
  const urls = files.map(f => new URL(f, base).href);
  const status = async () => {
    let have = 0;
    for (const u of urls) if (await cache.match(u)) have++;
    return have;
  };
  const show = (have, msg = '') => {
    bar.style.width = (have / urls.length * 100) + '%';
    info.textContent = msg || (have === urls.length ? '✓ 已全部离线可用' : `已离线 ${have}/${urls.length} 个文件`);
    btn.textContent = have === urls.length ? '⟳ 检查更新' : '⬇ 全部下载到本机';
  };
  show(await status());
  btn.onclick = async () => {
    btn.disabled = true;
    if (navigator.storage?.persist) navigator.storage.persist();
    const todo = [];
    for (const u of urls) if (!(await cache.match(u))) todo.push(u);
    let done = urls.length - todo.length, failed = 0;
    const worker = async () => {
      while (todo.length) {
        const u = todo.shift();
        try { const r = await fetch(u); if (r.ok) await cache.put(u, r); else failed++; } catch { failed++; }
        show(++done, `下载中 ${done}/${urls.length}…`);
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    const have = await status();
    show(have, failed ? `有 ${failed} 个文件失败，再点一次补齐` : '');
    btn.disabled = false;
  };
})();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js', { scope: './' });</script>
