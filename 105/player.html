now how you charge for late returns, and whether it's cheaper to extend by a full day.", "ref_zh": "你好，我是 Lee。我周五在你们这儿租了一辆紧凑型 SUV，本来今晚六点还车。我们堵在路上了，估计要晚两个小时左右。会有问题吗？想了解一下晚还车怎么收费，以及直接续租一整天是不是更划算。", "id": "ref1"}], "words": [{"w": "compact", "ipa": "/ˈkɑːmpækt/", "zh": "紧凑型的", "ex": "We rented a compact car to save on petrol.", "id": "w0"}, {"w": "third-party", "ipa": "/ˌθɜːrd ˈpɑːrti/", "zh": "第三方的", "ex": "Basic insurance only covers third-party damage.", "id": "w1"}, {"w": "excess", "ipa": "/ˈekses/", "zh": "（保险）自付额", "ex": "The excess on this policy is one thousand dollars.", "id": "w2"}, {"w": "deposit", "ipa": "/dɪˈpɑːzɪt/", "zh": "押金", "ex": "They held a deposit on my credit card.", "id": "w3"}, {"w": "inspection", "ipa": "/ɪnˈspekʃən/", "zh": "检查", "ex": "The car passed the inspection with no problems.", "id": "w4"}, {"w": "refueling", "ipa": "/ˌriːˈfjuːəlɪŋ/", "zh": "加油", "ex": "The refueling charge is much higher than the pump price.", "id": "w5"}, {"w": "fill up", "ipa": "/fɪl ʌp/", "zh": "加满", "ex": "Let's fill up before we get on the highway.", "id": "w6"}, {"w": "waive", "ipa": "/weɪv/", "zh": "免除（费用）", "ex": "The bank agreed to waive the late fee.", "id": "w7"}, {"w": "invoice", "ipa": "/ˈɪnvɔɪs/", "zh": "账单；发票", "ex": "Could you send the invoice to my work email?", "id": "w8"}], "sections": [{"heading": "1. Picking Up the Car", "heading_zh": "1. 取车", "rows": [[{"id": "s0_0_0", "md": "Hi there, welcome to Drive Easy. Do you have a booking with us?", "text": "Hi there, welcome to Drive Easy. Do you have a booking with us?", "zh": "你好，欢迎来到 Drive Easy。您有预订吗？", "sp": "B"}], [{"id": "s0_1_0", "md": "Yes, I booked a ==compact== SUV for the weekend, under Lee. I'm returning it Sunday evening.", "text": "Yes, I booked a compact SUV for the weekend, under Lee. I'm returning it Sunday evening.", "zh": "有，我订了一辆紧凑型 SUV，周末用，名字是 Lee。周日晚上还车。", "sp": "A"}], [{"id": "s0_2_0", "md": "Got it. Can I see your driver's license and the card you booked with?", "text": "Got it. Can I see your driver's license and the card you booked with?", "zh": "好的。能看一下您的驾照和预订用的那张卡吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**Here you go. What exactly does the basic insurance cover?**", "text": "Here you go. What exactly does the basic insurance cover?", "zh": "给你。基础保险具体保什么？", "sp": "A"}], [{"id": "s0_4_0", "md": "It covers ==third-party== damage, but you'd still pay an ==excess== of two thousand dollars if our car gets damaged.", "text": "It covers third-party damage, but you'd still pay an excess of two thousand dollars if our car gets damaged.", "zh": "保第三方损失，但如果我们的车被撞了，您还是要自付两千块。", "sp": "B"}], [{"id": "s0_5_0", "md": "Two thousand is quite a lot. How much would it cost to __reduce the excess__?", "text": "Two thousand is quite a lot. How much would it cost to reduce the excess?", "zh": "两千挺多的。要降低自付额得花多少钱？", "sp": "A"}], [{"id": "s0_6_0", "md": "Our full cover is thirty dollars a day, and it brings the excess down to zero.", "text": "Our full cover is thirty dollars a day, and it brings the excess down to zero.", "zh": "我们的全险是一天三十块，自付额降到零。", "sp": "B"}], [{"id": "s0_7_0", "md": "Okay, __I'll go with__ the full cover. We'll also need a child seat for a three-year-old.", "text": "Okay, I'll go with the full cover. We'll also need a child seat for a three-year-old.", "zh": "好，那我选全险。我们还需要一个三岁孩子用的儿童座椅。", "sp": "A"}], [{"id": "s0_8_0", "md": "Sure, that's ten dollars a day. We'll also hold a ==deposit== of five hundred on your card.", "text": "Sure, that's ten dollars a day. We'll also hold a deposit of five hundred on your card.", "zh": "好的，一天十块。另外我们会在您卡上冻结五百块押金。", "sp": "B"}], [{"id": "s0_9_0", "md": "When will the deposit be released?", "text": "When will the deposit be released?", "zh": "押金什么时候解冻？", "sp": "A"}], [{"id": "s0_10_0", "md": "Usually within seven working days after you return the car.", "text": "Usually within seven working days after you return the car.", "zh": "一般还车后七个工作日内。", "sp": "B"}], [{"id": "s0_11_0", "md": "**Before I drive off, could we walk around the car and note any existing scratches?**", "text": "Before I drive off, could we walk around the car and note any existing scratches?", "zh": "开走之前，我们能绕车看一圈，把现有的刮痕记下来吗？", "sp": "A"}], [{"id": "s0_12_0", "md": "Absolutely. Let's take photos together so it's all on record.", "text": "Absolutely. Let's take photos together so it's all on record.", "zh": "当然。我们一起拍照，都记录在案。", "sp": "B"}]]}, {"heading": "2. Returning the Car", "heading_zh": "2. 还车", "rows": [[{"id": "s1_0_0", "md": "Welcome back. Let me do a quick ==inspection==. Hmm, there's a scratch on the rear bumper.", "text": "Welcome back. Let me do a quick inspection. Hmm, there's a scratch on the rear bumper.", "zh": "欢迎回来。我快速检查一下。嗯，后保险杠上有一道刮痕。", "sp": "B"}], [{"id": "s1_1_0", "md": "**That scratch was already there. We took a photo of it on Friday.**", "text": "That scratch was already there. We took a photo of it on Friday.", "zh": "那道刮痕本来就有。我们周五拍过照。", "sp": "A"}], [{"id": "s1_2_0", "md": "Let me see. Oh yes, you're right, it's in our pickup notes too. Sorry about that.", "text": "Let me see. Oh yes, you're right, it's in our pickup notes too. Sorry about that.", "zh": "我看看。哦对，您说得对，取车记录里也有。不好意思。", "sp": "B"}], [{"id": "s1_3_0", "md": "No problem. Also, the tank is about three quarters full. Is that okay?", "text": "No problem. Also, the tank is about three quarters full. Is that okay?", "zh": "没事。另外油箱大概是四分之三满，可以吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Our policy is full to full, so there'll be a ==refueling== charge of about forty dollars.", "text": "Our policy is full to full, so there'll be a refueling charge of about forty dollars.", "zh": "我们的规定是满油取满油还，所以要收大概四十块的加油费。", "sp": "B"}], [{"id": "s1_5_0", "md": "Forty dollars? Is there a petrol station nearby? I'd rather __fill it up__ myself.", "text": "Forty dollars? Is there a petrol station nearby? I'd rather fill it up myself.", "zh": "四十块？附近有加油站吗？我宁愿自己去加满。", "sp": "A"}], [{"id": "s1_6_0", "md": "There's one just around the corner. If yo const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
