<script>
const D = {"id": "104", "type": "dialogue", "title": "Taking a Taxi and Giving Directions", "meta": "B2 · 约 280 词 · 场景：打车指路与车费争议", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Taxi Driver", "name_zh": "司机", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "「你」为什么不想全程跟导航走？", "a": "因为导航总是绕远，所以让司机跟导航到红绿灯，之后由「你」来指路。"}, {"q": "车费为什么比平时贵？", "a": "有高峰时段附加费和高速上的电子道路收费，另外开头还绕了一段路。"}, {"q": "司机最后怎么处理的？「你」要了什么？", "a": "司机承认错过路口，减了五块钱；「你」刷卡付款，要了打印收据用于报销。"}], "dictation": [{"id": "s0_3_0", "text": "Whichever is faster. I'm in a bit of a rush."}, {"id": "s0_11_0", "text": "No, you can pull over just before it, next to the white gate."}, {"id": "s1_1_0", "text": "Hmm, that's more than usual. It's normally around twenty. Is there a surcharge I'm missing?"}, {"id": "s1_3_0", "text": "I see. But I think we also took a detour near the start. That added a few minutes."}], "shadow": {"speaker": "A", "text": "Follow it until the traffic light, and then I'll guide you from there. The GPS always takes the long way.", "marked": "Follow it / until the <b>traffic light</b>, //<br>and then <b>I'll</b> guide you from there. //<br>The GPS / <b>always</b> takes the <b>long</b> way. //"}, "prompts": [{"q": "上车后发现司机开的方向不对，可能听错了地址。礼貌地打断他，重新说清楚目的地，并说你可以帮他指路。", "ref": "Sorry, uncle, I think we might be going the wrong way. I'm going to Holland Village, not Holland Road. It's the condo on Lorong Liput, near the market. Could you turn around at the next junction? Don't worry, I'll guide you once we get closer.", "ref_zh": "不好意思师傅，我们好像走错方向了。我去的是荷兰村，不是荷兰路。是 Lorong Liput 上的公寓，靠近巴刹。下个路口能掉个头吗？别担心，快到的时候我给你指路。", "id": "ref0"}, {"q": "下车后发现手机落在出租车上了。给出租车公司打电话，说明时间、上下车地点和车牌的线索，请他们联系司机。", "ref": "Hi, I took one of your taxis about twenty minutes ago, from Raffles Place to Holland Village, and I left my phone on the back seat. I paid by card, so you should have a record of the trip. The driver was very friendly and spoke with an Indian accent. Could you contact him and ask him to call this number? I'm happy to pay for his time.", "ref_zh": "你好，我大概二十分钟前坐了你们的出租车，从莱佛士坊到荷兰村，手机落在后座上了。我是刷卡付的，你们应该有行程记录。司机很友善，有印度口音。能帮我联系他、让他打这个号码吗？我愿意付他跑一趟的钱。", "id": "ref1"}], "words": [{"w": "expressway", "ipa": "/ɪkˈspresweɪ/", "zh": "高速公路", "ex": "The expressway is jammed after six.", "id": "w0"}, {"w": "turn down", "ipa": "/tɜːrn daʊn/", "zh": "调小", "ex": "Could you turn down the music a bit?", "id": "w1"}, {"w": "traffic light", "ipa": "/ˈtræfɪk laɪt/", "zh": "红绿灯", "ex": "Turn right at the next traffic light.", "id": "w2"}, {"w": "roundabout", "ipa": "/ˈraʊndəbaʊt/", "zh": "环岛", "ex": "Take the third exit at the roundabout.", "id": "w3"}, {"w": "pull over", "ipa": "/pʊl ˈoʊvər/", "zh": "靠边停车", "ex": "You can pull over next to the bus stop.", "id": "w4"}, {"w": "surcharge", "ipa": "/ˈsɜːrtʃɑːrdʒ/", "zh": "附加费", "ex": "There's a midnight surcharge on taxi fares.", "id": "w5"}, {"w": "detour", "ipa": "/ˈdiːtʊr/", "zh": "绕路", "ex": "The road was closed, so we had to take a detour.", "id": "w6"}, {"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "收据", "ex": "Can I get a receipt, please?", "id": "w7"}, {"w": "expenses", "ipa": "/ɪkˈspensɪz/", "zh": "（可报销的）费用", "ex": "I'll claim the taxi fare as expenses.", "id": "w8"}], "sections": [{"heading": "1. Getting In and Giving Directions", "heading_zh": "1. 上车与指路", "rows": [[{"id": "s0_0_0", "md": "Good evening, sir. Where to?", "text": "Good evening, sir. Where to?", "zh": "晚上好，先生。去哪儿？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi. Holland Village, please. It's a condo on Lorong Liput, right behind the market.", "text": "Hi. Holland Village, please. It's a condo on Lorong Liput, right behind the market.", "zh": "你好，去荷兰村。是 Lorong Liput 上的一个公寓，就在巴刹后面。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. Do you want me to take the ==expressway==, or go through town? This time of day, the expressway is usually faster.", "text": "Sure. Do you want me to take the expressway, or go through town? This time of day, the expressway is usually faster.", "zh": "好的。要走高速，还是走市区？这个点走高速一般快一些。", "sp": "B"}], [{"id": "s0_3_0", "md": "**Whichever is faster. I'm in a bit of a rush.**", "text": "Whichever is faster. I'm in a bit of a rush.", "zh": "哪条快走哪条。我有点赶时间。", "sp": "A"}], [{"id": "s0_4_0", "md": "Okay, expressway then. Is the air con alright for you?", "text": "Okay, expressway then. Is the air con alright for you?", "zh": "好，那就走高速。空调温度还行吗？", "sp": "B"}], [{"id": "s0_5_0", "md": "It's a bit cold, actually. Could you __turn it down a little__?", "text": "It's a bit cold, actually. Could you turn it down a little?", "zh": "其实有点冷。能稍微调小一点吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "No problem. When we come off the expressway, should I just follow the GPS?", "text": "No problem. When we come off the expressway, should I just follow the GPS?", "zh": "没问题。下了高速以后，我跟着导航走就行？", "sp": "B"}], [{"id": "s0_7_0", "md": "Follow it until the ==traffic light==, and then I'll __guide you__ from there. The GPS always takes the long way.", "text": "Follow it until the traffic light, and then I'll guide you from there. The GPS always takes the long way.", "zh": "跟导航到红绿灯那儿，然后我来给你指路。导航总是绕远。", "sp": "A"}], [{"id": "s0_8_0", "md": "Alright. Here's the traffic light now. Which way?", "text": "Alright. Here's the traffic light now. Which way?", "zh": "好的。到红绿灯了。往哪边走？", "sp": "B"}], [{"id": "s0_9_0", "md": "Turn left here, then take the second right. Then __keep going straight__ until you see a ==roundabout==.", "text": "Turn left here, then take the second right. Then keep going straight until you see a roundabout.", "zh": "这里左转，然后第二个路口右转。再一直往前，看到环岛为止。", "sp": "A"}], [{"id": "s0_10_0", "md": "Got it. Do you want me to go around it?", "text": "Got it. Do you want me to go around it?", "zh": "明白。要绕过环岛吗？", "sp": "B"}], [{"id": "s0_11_0", "md": "**No, you can pull over just before it, next to the white gate.**", "text": "No, you can pull over just before it, next to the white gate.", "zh": "不用，在环岛前面靠边停就行，白色大门旁边。", "sp": "A"}]]}, {"heading": "2. A Question About the Fare", "heading_zh": "2. 车费有疑问", "rows": [[{"id": "s1_0_0", "md": "Here we are. That'll be thirty-two dollars and forty cents.", "text": "Here we are. That'll be thirty-two dollars and forty cents.", "zh": "到了。一共三十二块四。", "sp": "B"}], [{"id": "s1_1_0", "md": "**Hmm, that's more than usual. It's normally around twenty. Is there a surcharge I'm missing?**", "text": "Hmm, that's more than usual. It's normally around twenty. Is there a surcharge I'm missing?", "zh": "嗯，比平时贵。一般二十块左右。是有什么附加费我没注意到吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Yes, there's a peak hour ==surcharge==, plus the ERP charge on the expressway.", "text": "Yes, there's a peak hour surcharge, plus the ERP charge on the expressway.", "zh": "是的，有高峰时段附加费，再加上高速上的电子道路收费。", "sp": "B"}], [{"id": "s1_3_0", "md": "I see. But I think we also took a ==detour== near the start. __That added__ a few minutes.", "text": "I see. But I think we also took a detour near the start. That added a few minutes.", "zh": "这样啊。不过我觉得刚开始那段也绕了路，多开了几分钟。", "sp": "A"}], [{"id": "s1_4_0", "md": "You're right, sir. I missed the turning earlier, sorry about that. Let me take off five dollars.", "text": "You're right, sir. I missed the turning earlier, sorry about that. Let me take off five dollars.", "zh": "您说得对，先生。我之前错过了一个路口，不好意思。我给您减五块。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thanks, I appreciate that. Can I __pay by card__?", "text": "Thanks, I appreciate that. Can I pay by card?", "zh": "谢谢，感谢。可以刷卡吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "Of course. Just tap here. Do you need a ==receipt==?", "text": "Of course. Just tap here. Do you need a receipt?", "zh": "当然。在这里拍一下就行。要收据吗？", "sp": "B"}], [{"id": "s1_7_0", "md": "Yes, please, a printed one. I'll need it for my ==expenses==.", "text": "Yes, please, a printed one. I'll need it for my expenses.", "zh": "要的，请给我打印的。我要拿去报销。", "sp": "A"}], [{"id": "s1_8_0", "md": "Here you go. Don't forget your umbrella, it's still raining.", "text": "Here you go. Don't forget your umbrella, it's still raining.", "zh": "给您。别忘了雨伞，外面还在下雨。", "sp": "B"}], [{"id": "s1_9_0", "md": "**Oh, thanks for the reminder. Have a good night, and drive safe.**", "text": "Oh, thanks for the reminder. Have a good night, and drive safe.", "zh": "哦，谢谢提醒。晚安，开车注意安全。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Getting In and Giving Directions", "zh": "1. 上车与指路", "start": 0.0, "end": 2.952, "words": [[0.118, 0.408], [0.737, 1.039], [1.053, 1.316], [1.461, 1.566], [1.579, 1.842], [1.855, 2.566]]}, {"kind": "s", "id": "s0_0_0", "md": "Good evening, sir. Where to?", "zh": "晚上好，先生。去哪儿？", "sp": "B", "gap": false, "start": 2.952, "end": 7.008, "words": [[3.055, 3.318], [3.41, 3.949], [4.16, 4.568], [5.518, 5.834], [5.834, 6.031]]}, {"kind": "s", "id": "s0_1_0", "md": "Hi. Holland Village, please. It's a condo on Lorong Liput, right behind the market.", "zh": "你好，去荷兰村。是 Lorong Liput 上的一个公寓，就在巴刹后面。", "sp": "A", "gap": false, "start": 7.008, "end": 13.128, "words": [[7.14, 7.39], [7.824, 8.087], [8.1, 8.521], [8.626, 9.166], [9.6, 9.705], [9.719, 9.771], [9.784, 10.311], [10.324, 10.495], [10.508, 10.942], [10.955, 11.337], [11.653, 11.837], [11.85, 12.166], [12.179, 12.232], [12.245, 12.718]]}, {"kind": "s", "id": "s0_2_0", "md": "Sure. Do you want me to take the ==expressway==, or go through town? This time of day, the expressway is usually faster.", "zh": "好的。要走高速，还是走市区？这个点走高速一般快一些。", "sp": "B", "gap": false, "start": 13.128, "end": 24.192, "words": [[13.231, 13.665], [14.654, 14.812], [14.812, 14.931], [14.97, 15.339], [15.339, 15.575], [15.589, 15.707], [15.707, 16.049], [16.062, 16.233], [16.233, 16.97], [17.273, 17.47], [17.47, 17.707], [17.707, 17.983], [17.983, 18.431], [19.339, 19.615], [19.615, 20.049], [20.049, 20.286], [20.286, 20.588], [20.891, 21.049], [21.049, 21.865], [21.957, 22.141], [22.167, 22.694], [22.694, 23.26]]}, {"kind": "s", "id": "s0_3_0", "md": "**Whichever is faster. I'm i rning earlier, sorry about that. Let me take off five dollars.", "zh": "您说得对，先生。我之前错过了一个路口，不好意思。我给您减五块。", "sp": "B", "gap": false, "start": 95.808, "end": 105.504, "words": [[95.911, 96.2], [96.2, 96.608], [96.766, 97.147], [98.097, 98.255], [98.255, 98.598], [98.676, 98.808], [98.821, 99.361], [99.413, 99.979], [100.15, 100.571], [100.637, 100.992], [100.992, 101.413], [102.347, 102.624], [102.65, 102.887], [102.926, 103.229], [103.229, 103.571], [103.571, 103.979], [103.979, 104.584]]}, {"kind": "s", "id": "s1_5_0", "md": "Thanks, I appreciate that. Can I __pay by card__?", "zh": "谢谢，感谢。可以刷卡吗？", "sp": "A", "gap": false, "start": 105.504, "end": 108.744, "words": [[105.636, 105.938], [106.03, 106.109], [106.122, 106.662], [106.675, 106.964], [107.399, 107.504], [107.517, 107.583], [107.596, 107.78], [107.793, 107.978], [107.991, 108.359]]}, {"kind": "s", "id": "s1_6_0", "md": "Of course. Just tap here. Do you need a ==receipt==?", "zh": "当然。在这里拍一下就行。要收据吗？", "sp": "B", "gap": false, "start": 108.744, "end": 114.864, "words": [[108.847, 109.057], [109.07, 109.557], [110.494, 110.849], [110.915, 111.244], [111.244, 111.626], [112.56, 112.718], [112.718, 112.823], [112.849, 113.191], [113.27, 113.362], [113.362, 113.889]]}, {"kind": "s", "id": "s1_7_0", "md": "Yes, please, a printed one. I'll need it for my ==expenses==.", "zh": "要的，请给我打印的。我要拿去报销。", "sp": "A", "gap": false, "start": 114.864, "end": 118.92, "words": [[114.969, 115.377], [115.601, 116.048], [116.075, 116.127], [116.14, 116.469], [116.482, 116.746], [117.18, 117.285], [117.298, 117.456], [117.469, 117.535], [117.548, 117.667], [117.68, 117.825], [117.838, 118.535]]}, {"kind": "s", "id": "s1_8_0", "md": "Here you go. Don't forget your umbrella, it's still raining.", "zh": "给您。别忘了雨伞，外面还在下雨。", "sp": "B", "gap": false, "start": 118.92, "end": 125.016, "words": [[119.023, 119.312], [119.312, 119.496], [119.496, 119.786], [120.762, 121.091], [121.091, 121.617], [121.67, 121.973], [122.065, 122.604], [122.894, 123.144], [123.196, 123.525], [123.525, 124.052]]}, {"kind": "s", "id": "s1_9_0", "md": "**Oh, thanks for the reminder. Have a good night, and drive safe.**", "zh": "哦，谢谢提醒。晚安，开车注意安全。", "sp": "A", "gap": false, "start": 125.016, "end": 129.36, "words": [[125.121, 125.319], [125.74, 125.963], [125.977, 126.069], [126.082, 126.161], [126.174, 126.74], [127.174, 127.279], [127.292, 127.345], [127.358, 127.516], [127.529, 127.819], [128.095, 128.148], [128.161, 128.477], [128.49, 128.976]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
