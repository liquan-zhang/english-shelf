<script>
const D = {"id": "104", "type": "dialogue", "title": "Taking a Taxi and Giving Directions", "meta": "B2 · 约 280 词 · 场景：打车指路与车费争议", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Taxi Driver", "name_zh": "司机", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "「你」为什么不想全程跟导航走？", "a": "因为导航总是绕远，所以让司机跟导航到红绿灯，之后由「你」来指路。"}, {"q": "车费为什么比平时贵？", "a": "有高峰时段附加费和高速上的电子道路收费，另外开头还绕了一段路。"}, {"q": "司机最后怎么处理的？「你」要了什么？", "a": "司机承认错过路口，减了五块钱；「你」刷卡付款，要了打印收据用于报销。"}], "dictation": [{"id": "s0_3_0", "text": "Whichever is faster. I'm in a bit of a rush."}, {"id": "s0_11_0", "text": "No, you can pull over just before it, next to the white gate."}, {"id": "s1_1_0", "text": "Hmm, that's more than usual. It's normally around twenty. Is there a surcharge I'm missing?"}, {"id": "s1_3_0", "text": "I see. But I think we also took a detour near the start. That added a few minutes."}], "shadow": {"speaker": "A", "text": "Follow it until the traffic light, and then I'll guide you from there. The GPS always takes the long way.", "marked": "Follow it / until the <b>traffic light</b>, //<br>and then <b>I'll</b> guide you from there. //<br>The GPS / <b>always</b> takes the <b>long</b> way. //"}, "prompts": [{"q": "上车后发现司机开的方向不对，可能听错了地址。礼貌地打断他，重新说清楚目的地，并说你可以帮他指路。", "ref": "Sorry, uncle, I think we might be going the wrong way. I'm going to Holland Village, not Holland Road. It's the condo on Lorong Liput, near the market. Could you turn around at the next junction? Don't worry, I'll guide you once we get closer.", "ref_zh": "不好意思师傅，我们好像走错方向了。我去的是荷兰村，不是荷兰路。是 Lorong Liput 上的公寓，靠近巴刹。下个路口能掉个头吗？别担心，快到的时候我给你指路。", "id": "ref0"}, {"q": "下车后发现手机落在出租车上了。给出租车公司打电话，说明时间、上下车地点和车牌的线索，请他们联系司机。", "ref": "Hi, I took one of your taxis about twenty minutes ago, from Raffles Place to Holland Village, and I left my phone on the back seat. I paid by card, so you should have a record of the trip. The driver was very friendly and spoke with an Indian accent. Could you contact him and ask him to call this number? I'm happy to pay for his time.", "ref_zh": "你好，我大概二十分钟前坐了你们的出租车，从莱佛士坊到荷兰村，手机落在后座上了。我是刷卡付的，你们应该有行程记录。司机很友善，有印度口音。能帮我联系他、让他打这个号码吗？我愿意付他跑一趟的钱。", "id": "ref1"}], "words": [{"w": "expressway", "ipa": "/ɪkˈspresweɪ/", "zh": "高速公路", "ex": "The expressway is jammed after six.", "id": "w0"}, {"w": "turn down", "ipa": "/tɜːrn daʊn/", "zh": "调小", "ex": "Could you turn down the music a bit?", "id": "w1"}, {"w": "traffic light", "ipa": "/ˈtræfɪk laɪt/", "zh": "红绿灯", "ex": "Turn right at the next traffic light.", "id": "w2"}, {"w": "roundabout", "ipa": "/ˈraʊndəbaʊt/", "zh": "环岛", "ex": "Take the third exit at the roundabout.", "id": "w3"}, {"w": "pull over", "ipa": "/pʊl ˈoʊvər/", "zh": "靠边停车", "ex": "You can pull over next to the bus stop.", "id": "w4"}, {"w": "surcharge", "ipa": "/ˈsɜːrtʃɑːrdʒ/", "zh": "附加费", "ex": "There's a midnight surcharge on taxi fares.", "id": "w5"}, {"w": "detour", "ipa": "/ˈdiːtʊr/", "zh": "绕路", "ex": "The road was closed, so we had to take a detour.", "id": "w6"}, {"w": "receipt", "ipa": "/rɪˈsiːt/", "zh": "收据", "ex": "Can I get a receipt, please?", "id": "w7"}, {"w": "expenses", "ipa": "/ɪkˈspensɪz/", "zh": "（可报销的）费用", "ex": "I'll claim the taxi fare as expenses.", "id": "w8"}], "sections": [{"heading": "1. Getting In and Giving Directions", "heading_zh": "1. 上车与指路", "rows": [[{"id": "s0_0_0", "md": "Good evening, sir. Where to?", "text": "Good evening, sir. Where to?", "zh": "晚上好，先生。去哪儿？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi. Holland Village, please. It's a condo on Lorong Liput, right behind the market.", "text": "Hi. Holland Village, please. It's a condo on Lorong Liput, right behind the market.", "zh": "你好，去荷兰村。是 Lorong Liput 上的一个公寓，就在巴刹后面。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. Do you want me to take the ==expressway==, or go through town? This time of day, the expressway is usually faster.", "text": "Sure. Do you want me to take the expressway, or go through town? This time of day, the expressway is usually faster.", "zh": "好的。要走高速，还是走市区？这个点走高速一般快一些。", "sp": "B"}], [{"id": "s0_3_0", "md": "**Whichever is faster. I'm in a bit of a rush.**", "text": "Whichever is faster. I'm in a bit of a rush.", "zh": "哪条快走哪条。我有点赶时间。", "sp": "A"}], [{"id": "s0_4_0", "md": "Okay, expressway then. Is the air con alright for you?", "text": "Okay, expressway then. Is the air con alright for you?", "zh": "好，那就走高速。空调温度还行吗？", "sp": "B"}], [{"id": "s0_5_0", "md": "It's a bit cold, actually. Could you __turn it down a little__?", "text": "It's a bit cold, actually. Could you turn it down a little?", "zh": "其实有点冷。能稍微调小一点吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "No problem. When we come off the expressway, should I just follow the GPS?", "text": "No problem. When we come off the expressway, should I just follow the GPS?", "zh": "没问题。下了高速以后，我跟着导航走就行？", "sp": "B"}], [{"id": "s0_7_0", "md": "Follow it until the ==traffic light==, and then I'll __guide you__ from there. The GPS always takes the long way.", "text": "Follow it until the traffic light, and then I'll guide you from there. The GPS always takes the long way.", "zh": "跟导航到红绿灯那儿，然后我来给你指路。导航总是绕远。", "sp": "A"}], [{"id": "s0_8_0", "md": "Alright. Here's the traffic light now. Which way?", "text": "Alright. Here's the traffic light now. Which way?", "zh": "好的。到红绿灯了。往哪边走？", "sp": "B"}], [{"id": "s0_9_0", "md": "Turn left here, then take the second right. Then __keep going straight__ until you see a ==roundabout==.", "text": "Turn left here, then take the second right. Then keep going straight until you see a roundabout.", "zh": "这里左转，然后第二个路口右转。再一直往前，看到环岛为止。", "sp": "A"}], [{"id": "s0_10_0", "md": "Got it. Do you want me to go around it?", "text": "Got it. Do you want me to go around it?", "zh": "明白。要绕过环岛吗？", "sp": "B"}], [{"id": "s0_11_0", "md": "**No, you can pull over just before it, next to the white gate.**", "text": "No, you can pull over just before it, next to the white gate.", "zh": "不用，在环岛前面靠边停就行，白色大门旁边。", "sp": "A"}]]}, {"heading": "2. A Question About the Fare", "heading_zh": "2. 车费有疑问", "rows": [[{"id": "s1_0_0", "md": "Here we are. That'll be thirty-two dollars and forty cents.", "text": "Here we are. That'll be thirty-two dollars and forty cents.", "zh": "到了。一共三十二块四。", "sp": "B"}], [{"id": "s1_1_0", "md": "**Hmm, that's more than usual. It's normally around twenty. Is there a surcharge I'm missing?**", "text": "Hmm, that's more than usual. It's normally around twenty. Is there a surcharge I'm missing?", "zh": "嗯，比平时贵。一般二十块左右。是有什么附加费我没注意到吗？", "sp": "A"}], [{"id": "s1_2_0", "md": "Yes, there's a peak hour ==surcharge==, plus the ERP charge on the expressway.", "text": "Yes, there's a peak hour surcharge, plus the ERP charge on the expressway.", "zh": "是的，有高峰时段附加费，再加上高速上的电子道路收费。", "sp": "B"}], [{"id": "s1_3_0", "md": "I see. But I think we also took a ==detour== near the start. __That added__ a few minutes.", "text": "I see. But I think we also took a detour near the start. That added a few minutes.", "zh": "这样啊。不过我觉得刚开始那段也绕了路，多开了几分钟。", "sp": "A"}], [{"id": "s1_4_0", "md": "You're right, sir. I missed the turning earlier, sorry about that. Let me take off five dollars.", "text": "You're right, sir. I missed the turning earlier, sorry about that. Let me take off five dollars.", "zh": "您说得对，先生。我之前错过了一个路口，不好意思。我给您减五块。", "sp": "B"}], [{"id": "s1_5_0", "md": "Thanks, I appreciate that. Can I __pay by card__?", "text": "Thanks, I appreciate that. Can I pay by card?", "zh": "谢谢，感谢。可以刷卡吗？", "sp": "A"}], [{"id": "s1_6_0", "md": "Of course. Just tap here. Do you need a ==receipt==?", "text": "Of course. Just tap here. Do you need a receipt?", "zh": "当然。在这里拍一下就行。要收据吗？", "sp": "B"}], [{"id": "s1_7_0", "md": "Yes, please, a printed one. I'll need it for my ==expenses==.", "text": "Yes, please, a printed one. I'll need it for my expenses.", "zh": "要的，请给我打印的。我要拿去报销。", "sp": "A"}], [{"id": "s1_8_0", "md": "Here you go. Don't forget your umbrella, it's sti const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
