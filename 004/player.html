<script>
const D = {"id": "004", "title": "Summarizing a Meeting in Thirty Seconds", "meta": "B2 · 约 280 词 · 场景：会议收尾", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Same Meeting, Different Memories", "heading_zh": "1. 同一个会，不同的记忆", "rows": [[{"id": "s0_0_0", "md": "Ask three people what was decided in a meeting, and you will often get three different answers.", "text": "Ask three people what was decided in a meeting, and you will often get three different answers.", "zh": "问三个人会上定了什么，你经常会得到三个不同的答案。", "sp": null}, {"id": "s0_0_1", "md": "The engineer remembers that the launch was delayed.", "text": "The engineer remembers that the launch was delayed.", "zh": "工程师记得的是上线推迟了。", "sp": null}, {"id": "s0_0_2", "md": "The PM remembers that it was \"delayed only if the tests fail.\"", "text": "The PM remembers that it was \"delayed only if the tests fail.\"", "zh": "PM 记得的是「只有测试没过才推迟」。", "sp": null}, {"id": "s0_0_3", "md": "The designer thinks the date never came up at all.", "text": "The designer thinks the date never came up at all.", "zh": "设计师则觉得会上压根没提日期。", "sp": null}], [{"id": "s0_1_0", "md": "Nobody is lying.", "text": "Nobody is lying.", "zh": "没有人在撒谎。", "sp": null}, {"id": "s0_1_1", "md": "Each person heard the parts that ==mattered== to them, and the meeting ended before anyone __checked the picture__.", "text": "Each person heard the parts that mattered to them, and the meeting ended before anyone checked the picture.", "zh": "每个人听到的都是对自己重要的那部分，而会议结束前没人去核对一下大家的理解。", "sp": null}, {"id": "s0_1_2", "md": "That gap usually shows up a week later, in a tense message thread.", "text": "That gap usually shows up a week later, in a tense message thread.", "zh": "这个偏差通常一周后才冒出来，变成一串火药味很浓的消息。", "sp": null}], [{"id": "s0_2_0", "md": "**The last thirty seconds of a meeting are worth more than any ten minutes in the middle.**", "text": "The last thirty seconds of a meeting are worth more than any ten minutes in the middle.", "zh": "会议最后三十秒，比中间任何十分钟都值钱。", "sp": null}, {"id": "s0_2_1", "md": "A short spoken summary turns a ==fuzzy== feeling of progress into something ==concrete== that people can agree with or correct.", "text": "A short spoken summary turns a fuzzy feeling of progress into something concrete that people can agree with or correct.", "zh": "一个简短的口头总结，能把模糊的「好像有进展」变成具体的东西，让大家可以认同或者纠正。", "sp": null}, {"id": "s0_2_2", "md": "It also makes you the person who __keeps things moving__, which people notice.", "text": "It also makes you the person who keeps things moving, which people notice.", "zh": "这也会让你成为推动事情往前走的那个人，大家是看在眼里的。", "sp": null}]]}, {"heading": "2. Decisions, Owners, Open Questions", "heading_zh": "2. 决定、负责人、待定问题", "rows": [[{"id": "s1_0_0", "md": "Keep the summary to three short parts, and say them in the same order every time.", "text": "Keep the summary to three short parts, and say them in the same order every time.", "zh": "总结控制在三个简短的部分，每次都按同样的顺序说。", "sp": null}, {"id": "s1_0_1", "md": "When the format is ==predictable==, people know exactly what to listen for.", "text": "When the format is predictable, people know exactly what to listen for.", "zh": "格式固定了，大家就知道该听什么。", "sp": null}], [{"id": "s1_1_0", "md": "First, the decisions.", "text": "First, the decisions.", "zh": "第一，决定。", "sp": null}, {"id": "s1_1_1", "md": "\"We agreed to ship on the twelfth, with the payment feature behind a flag.\"", "text": "\"We agreed to ship on the twelfth, with the payment feature behind a flag.\"", "zh": "「我们说好了十二号上线，支付功能先用开关控制。」", "sp": null}, {"id": "s1_1_2", "md": "Use the word \"agreed\" on purpose, because it invites anyone who did not agree to __speak up now__.", "text": "Use the word \"agreed\" on purpose, because it invites anyone who did not agree to speak up now.", "zh": "特意用「说好了」这个词，是为了让不同意的人现在就站出来说。", "sp": null}], [{"id": "s1_2_0", "md": "Second, the owners and dates.", "text": "Second, the owners and dates.", "zh": "第二，负责人和时间。", "sp": null}, {"id": "s1_2_1", "md": "\"Lena will update the rollout plan by Thursday, and I'll talk to the support team.\"", "text": "\"Lena will update the rollout plan by Thursday, and I'll talk to the support team.\"", "zh": "「Lena 周四前更新上线方案，我去跟客服团队沟通。」", "sp": null}, {"id": "s1_2_2", "md": "**A task without a name attached to it is just a wish.**", "text": "A task without a name attached to it is just a wish.", "zh": "一件事如果没落到具体的人头上，那就只是个愿望。", "sp": null}], [{"id": "s1_3_0", "md": "Third, what is still open.", "text": "Third, what is still open.", "zh": "第三，还没定的事。", "sp": null}, {"id": "s1_3_1", "md": "\"We haven't decided how to handle refunds, so let's ==revisit== that next week.\"", "text": "\"We haven't decided how to handle refunds, so let's revisit that next week.\"", "zh": "「退款怎么处理还没定，我们下周再议。」", "sp": null}, {"id": "s1_3_2", "md": "Naming open questions ==honestly== prevents people from __filling the gaps__ with their own guesses.", "text": "Naming open questions honestly prevents people from filling the gaps with their own guesses.", "zh": "坦白地把待定问题点出来，可以避免大家用自己的猜测去填空。", "sp": null}, {"id": "s1_3_3", "md": "Then post the same three lines in the chat, so the people who missed the call get the same version of the truth.", "text": "Then post the same three lines in the chat, so the people who missed the call get the same version of the truth.", "zh": "然后把这三句话原样发到群里，让没参会的人也拿到同一个版本的事实。", "sp": null}]]}], "gist": [{"q": "开头三个人对同一场会议的记忆为什么不同？", "a": "每个人只听到了对自己重要的部分，会议结束前没人核对共同理解。"}, {"q": "三十秒总结分哪三部分？", "a": "已做的决定；负责人和截止时间；仍未决定的问题。"}, {"q": "为什么总结里要刻意用“agreed”这个词？", "a": "它会促使不同意的人当场说出来，而不是事后再争。"}], "dictation": [{"id": "s0_2_0", "text": "The last thirty seconds of a meeting are worth more than any ten minutes in the middle."}, {"id": "s1_2_2", "text": "A task without a name attached to it is just a wish."}, {"id": "s1_0_1", "text": "When the format is predictable, people know exactly what to listen for."}, {"id": "s1_3_2", "text": "Naming open questions honestly prevents people from filling the gaps with their own guesses."}], "s 1], [92.525, 92.801], [92.814, 93.459], [93.59, 94.077], [94.09, 94.577], [94.59, 94.985], [94.998, 95.169], [95.182, 95.603], [95.617, 95.696], [95.709, 96.117], [96.13, 96.261], [96.275, 96.446], [96.459, 96.63], [96.643, 97.222]]}, {"kind": "s", "id": "s1_3_3", "md": "Then post the same three lines in the chat, so the people who missed the call get the same version of the truth.", "zh": "然后把这三句话原样发到群里，让没参会的人也拿到同一个版本的事实。", "sp": null, "gap": false, "start": 97.608, "end": 104.136, "words": [[97.713, 97.911], [97.924, 98.279], [98.292, 98.384], [98.397, 98.779], [98.792, 99.174], [99.187, 99.608], [99.621, 99.7], [99.713, 99.779], [99.792, 100.226], [100.634, 100.753], [100.766, 100.858], [100.871, 101.2], [101.213, 101.305], [101.319, 101.647], [101.661, 101.74], [101.753, 102.095], [102.108, 102.266], [102.279, 102.358], [102.371, 102.713], [102.726, 103.095], [103.108, 103.174], [103.187, 103.253], [103.266, 103.74]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
