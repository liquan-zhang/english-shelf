<script>
const D = {"id": "004", "title": "Summarizing a Meeting in Thirty Seconds", "meta": "B2 · 约 280 词 · 场景：会议收尾", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Same Meeting, Different Memories", "heading_zh": "1. 同一个会，不同的记忆", "rows": [[{"id": "s0_0_0", "md": "Ask three people what was decided in a meeting, and you will often get three different answers.", "text": "Ask three people what was decided in a meeting, and you will often get three different answers.", "zh": "问三个人会上定了什么，你经常会得到三个不同的答案。", "sp": null}, {"id": "s0_0_1", "md": "The engineer remembers that the launch was delayed.", "text": "The engineer remembers that the launch was delayed.", "zh": "工程师记得的是上线推迟了。", "sp": null}, {"id": "s0_0_2", "md": "The PM remembers that it was \"delayed only if the tests fail.\"", "text": "The PM remembers that it was \"delayed only if the tests fail.\"", "zh": "PM 记得的是「只有测试没过才推迟」。", "sp": null}, {"id": "s0_0_3", "md": "The designer thinks the date never came up at all.", "text": "The designer thinks the date never came up at all.", "zh": "设计师则觉得会上压根没提日期。", "sp": null}], [{"id": "s0_1_0", "md": "Nobody is lying.", "text": "Nobody is lying.", "zh": "没有人在撒谎。", "sp": null}, {"id": "s0_1_1", "md": "Each person heard the parts that ==mattered== to them, and the meeting ended before anyone __checked the picture__.", "text": "Each person heard the parts that mattered to them, and the meeting ended before anyone checked the picture.", "zh": "每个人听到的都是对自己重要的那部分，而会议结束前没人去核对一下大家的理解。", "sp": null}, {"id": "s0_1_2", "md": "That gap usually shows up a week later, in a tense message thread.", "text": "That gap usually shows up a week later, in a tense message thread.", "zh": "这个偏差通常一周后才冒出来，变成一串火药味很浓的消息。", "sp": null}], [{"id": "s0_2_0", "md": "**The last thirty seconds of a meeting are worth more than any ten minutes in the middle.**", "text": "The last thirty seconds of a meeting are worth more than any ten minutes in the middle.", "zh": "会议最后三十秒，比中间任何十分钟都值钱。", "sp": null}, {"id": "s0_2_1", "md": "A short spoken summary turns a ==fuzzy== feeling of progress into something ==concrete== that people can agree with or correct.", "text": "A short spoken summary turns a fuzzy feeling of progress into something concrete that people can agree with or correct.", "zh": "一个简短的口头总结，能把模糊的「好像有进展」变成具体的东西，让大家可以认同或者纠正。", "sp": null}, {"id": "s0_2_2", "md": "It also makes you the person who __keeps things moving__, which people notice.", "text": "It also makes you the person who keeps things moving, which people notice.", "zh": "这也会让你成为推动事情往前走的那个人，大家是看在眼里的。", "sp": null}]]}, {"heading": "2. Decisions, Owners, Open Questions", "heading_zh": "2. 决定、负责人、待定问题", "rows": [[{"id": "s1_0_0", "md": "Keep the summary to three short parts, and say them in the same order every time.", "text": "Keep the summary to three short parts, and say them in the same order every time.", "zh": "总结控制在三个简短的部分，每次都按同样的顺序说。", "sp": null}, {"id": "s1_0_1", "md": "When the format is ==predictable==, people know exactly what to listen for.", "text": "When the format is predictable, people know exactly what to listen for.", "zh": "格式固定了，大家就知道该听什么。", "sp": null}], [{"id": "s1_1_0", "md": "First, the decisions.", "text": "First, the decisions.", "zh": "第一，决定。", "sp": null}, {"id": "s1_1_1", "md": "\"We agreed to ship on the twelfth, with the payment feature behind a flag.\"", "text": "\"We agreed to ship on the twelfth, with the payment feature behind a flag.\"", "zh": "「我们说好了十二号上线，支付功能先用开关控制。」", "sp": null}, {"id": "s1_1_2", "md": "Use the word \"agreed\" on purpose, because it invites anyone who did not agree to __speak up now__.", "text": "Use the word \"agreed\" on purpose, because it invites anyone who did not agree to speak up now.", "zh": "特意用「说好了」这个词，是为了让不同意的人现在就站出来说。", "sp": null}], [{"id": "s1_2_0", "md": "Second, the owners and dates.", "text": "Second, the owners and dates.", "zh": "第二，负责人和时间。", "sp": null}, {"id": "s1_2_1", "md": "\"Lena will update the rollout plan by Thursday, and I'll talk to the support team.\"", "text": "\"Lena will update the rollout plan by Thursday, and I'll talk to the support team.\"", "zh": "「Lena 周四前更新上线方案，我去跟客服团队沟通。」", "sp": null}, {"id": "s1_2_2", "md": "**A task without a name attached to it is just a wish.**", "text": "A task without a name attached to it is just a wish.", "zh": "一件事如果没落到具体的人头上，那就只是个愿望。", "sp": null}], [{"id": "s1_3_0", "md": "Third, what is still open.", "text": "Third, what is still open.", "zh": "第三，还没定的事。", "sp": null}, {"id": "s1_3_1", "md": "\"We haven't decided how to handle refunds, so let's ==revisit== that next week.\"", "text": "\"We haven't decided how to handle refunds, so let's revisit that next week.\"", "zh": "「退款怎么处理还没定，我们下周再议。」", "sp": null}, {"id": "s1_3_2", "md": "Naming open questions ==honestly== prevents people from __filling the gaps__ with their own guesses.", "text": "Naming open questions honestly prevents people from filling the gaps with their own guesses.", "zh": "坦白地把待定问题点出来，可以避免大家用自己的猜测去填空。", "sp": null}, {"id": "s1_3_3", "md": "Then post the same three lines in the chat, so the people who missed the call get the same version of the truth.", "text": "Then post the same three lines in the chat, so the people who missed the call get the same version of the truth.", "zh": "然后把这三句话原样发到群里，让没参会的人也拿到同一个版本的事实。", "sp": null}]]}], "gist": [{"q": "开头三个人对同一场会议的记忆为什么不同？", "a": "每个人只听到了对自己重要的部分，会议结束前没人核对共同理解。"}, {"q": "三十秒总结分哪三部分？", "a": "已做的决定；负责人和截止时间；仍未决定的问题。"}, {"q": "为什么总结里要刻意用“agreed”这个词？", "a": "它会促使不同意的人当场说出来，而不是事后再争。"}], "dictation": [{"id": "s0_2_0", "text": "The last thirty seconds of a meeting are worth more than any ten minutes in the middle."}, {"id": "s1_2_2", "text": "A task without a name attached to it is just a wish."}, {"id": "s1_0_1", "text": "When the format is predictable, people know exactly what to listen for."}, {"id": "s1_3_2", "text": "Naming open questions honestly prevents people from filling the gaps with their own guesses."}], "s const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;

const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
