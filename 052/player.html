<script>
const D = {"id": "052", "title": "The First One-on-One with a New Report", "meta": "B2 · 约 280 词 · 场景：一对一", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What This Meeting Is Really For", "heading_zh": "1. 这个会真正是为了什么", "rows": [[{"id": "s0_0_0", "md": "Your new engineer joined on Monday, and your first one-on-one is on Thursday.", "text": "Your new engineer joined on Monday, and your first one-on-one is on Thursday.", "zh": "你的新工程师周一入职，你们的第一次 1:1 定在周四。", "sp": null}, {"id": "s0_0_1", "md": "It is tempting to fill the half hour with a project overview, the team's ==conventions==, and a list of tickets.", "text": "It is tempting to fill the half hour with a project overview, the team's conventions, and a list of tickets.", "zh": "很容易就想把这半小时塞满：项目介绍、团队规范，再加一串工单。", "sp": null}, {"id": "s0_0_2", "md": "That information matters, but a document can deliver it.", "text": "That information matters, but a document can deliver it.", "zh": "这些信息很重要，但一份文档就能传达。", "sp": null}], [{"id": "s0_1_0", "md": "The first one-on-one has a different job.", "text": "The first one-on-one has a different job.", "zh": "第一次 1:1 有不一样的任务。", "sp": null}, {"id": "s0_1_1", "md": "It sets the tone for every conversation you will have with this person for the next few years.", "text": "It sets the tone for every conversation you will have with this person for the next few years.", "zh": "它为你接下来几年和这个人的每一次谈话定下基调。", "sp": null}, {"id": "s0_1_2", "md": "**If the first meeting is a status update, every meeting after it will be one too.**", "text": "If the first meeting is a status update, every meeting after it will be one too.", "zh": "如果第一次会是同步进度，之后的每一次也都会是。", "sp": null}], [{"id": "s0_2_0", "md": "What you want to learn is how this person works best.", "text": "What you want to learn is how this person works best.", "zh": "你想了解的是这个人怎样工作状态最好。", "sp": null}, {"id": "s0_2_1", "md": "What motivates them, what ==drains== them, and how they like to hear bad news.", "text": "What motivates them, what drains them, and how they like to hear bad news.", "zh": "什么能激励他，什么会消耗他，他喜欢怎么听坏消息。", "sp": null}, {"id": "s0_2_2", "md": "Those answers are hard to get later, once habits have __settled in__ and both of you are ==guarded==.", "text": "Those answers are hard to get later, once habits have settled in and both of you are guarded.", "zh": "这些答案以后就很难问出来了，因为那时习惯已经定型，双方也都有了戒备。", "sp": null}]]}, {"heading": "2. Questions Worth Asking", "heading_zh": "2. 值得问的问题", "rows": [[{"id": "s1_0_0", "md": "Start with their past, not your plans.", "text": "Start with their past, not your plans.", "zh": "从他的过去聊起，而不是你的计划。", "sp": null}, {"id": "s1_0_1", "md": "\"Tell me about the best manager you ever had. What did they do?\"", "text": "\"Tell me about the best manager you ever had. What did they do?\"", "zh": "「讲讲你遇到过的最好的老板吧。他做了些什么？」", "sp": null}, {"id": "s1_0_2", "md": "Then ask the ==mirror== question: \"What did a bad manager do that you never want to see again?\"", "text": "Then ask the mirror question: \"What did a bad manager do that you never want to see again?\"", "zh": "然后问反过来的问题：「有哪个糟糕的老板做过什么，是你再也不想遇到的？」", "sp": null}], [{"id": "s1_1_0", "md": "Next, ask how they want to receive feedback.", "text": "Next, ask how they want to receive feedback.", "zh": "接着，问他希望怎样接收反馈。", "sp": null}, {"id": "s1_1_1", "md": "Some people prefer it in writing, so they can think before replying.", "text": "Some people prefer it in writing, so they can think before replying.", "zh": "有些人喜欢书面的，这样回复前可以先想一想。", "sp": null}, {"id": "s1_1_2", "md": "Others want it __on the spot__, in a quick chat after the meeting.", "text": "Others want it on the spot, in a quick chat after the meeting.", "zh": "另一些人希望当场说，会后简单聊几句。", "sp": null}, {"id": "s1_1_3", "md": "Asking now means your first piece of critical feedback will not __come as a shock__.", "text": "Asking now means your first piece of critical feedback will not come as a shock.", "zh": "现在问清楚，意味着你第一次给出批评性反馈时，不会让对方觉得突然。", "sp": null}], [{"id": "s1_2_0", "md": "Then talk about the ==rhythm== of your meetings.", "text": "Then talk about the rhythm of your meetings.", "zh": "然后聊聊你们开会的节奏。", "sp": null}, {"id": "s1_2_1", "md": "Agree on how often you meet, and make it clear that this time belongs to them, not to project updates.", "text": "Agree on how often you meet, and make it clear that this time belongs to them, not to project updates.", "zh": "约定多久见一次，并且说清楚这段时间是属于他的，不是用来同步项目的。", "sp": null}, {"id": "s1_2_2", "md": "**Tell them they can bring anything, including complaints about you.**", "text": "Tell them they can bring anything, including complaints about you.", "zh": "告诉他什么都可以拿来聊，包括对你的抱怨。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, talk less than you want to.", "text": "Finally, talk less than you want to.", "zh": "最后，少说话，比你想说的还要少。", "sp": null}, {"id": "s1_3_1", "md": "Write down what you hear, and repeat it back in the next meeting.", "text": "Write down what you hear, and repeat it back in the next meeting.", "zh": "把听到的记下来，下次见面时复述一遍。", "sp": null}, {"id": "s1_3_2", "md": "Nothing builds early trust faster than showing someone that you actually remembered what they ==revealed==.", "text": "Nothing builds early trust faster than showing someone that you actually remembered what they revealed.", "zh": "没有什么比让对方看到你真的记住了他说过的话，更能快速建立早期信任了。", "sp": null}]]}], "gist": [{"q": "作者认为第一次一对一的真正目的是什么？", "a": "定下以后所有谈话的基调，了解对方怎样工作最好：什么激励他、什么消耗他、他希望怎样听坏消息；项目信息可以靠文档。"}, {"q": "作者建议问哪些问题？", "a": "你遇到过最好的经理做了什么、最差的经理做了什么；你希望怎样接收反馈（书面还是当面即时）。"}, {"q": "关于一对一的节奏和你自己的表现，作者有什么建议？", "a": "约定频率，说明这段时间属于对方不是汇报进度，可以聊任何事包括对你的抱怨；自己少说，记下来，下次复述给对方听。"}], "dictation": [{"id": "s0_1_2", "text": "If the first meeting is a status update, every meeting after it will be one too."}, {"id": "s1_0_0", "text": "Start with their past, not your plans."}, {"id": "s1_2_2", "text": "Tell them they can bring anything, including complaints about you."}, {"id": "s1_3_1", "text": "Write down what you hear, and repeat it back in the next meeting."}], "shadow": {"text": "Next, ask how they want to receive feedback. Some people prefer it in writing, so they can think before replying. Others want it on the spot, in a quick chat after the meeting.", "marked": "Next, / ask <b>how</b> they want to <b>receive</b> feedback. //<br>Some people prefer it in <b>writing</b>, / so they can <b>think</b> before replying. //<br><b>Others</b> want it <b>on the spot</b>, / in a <b>quick</b> chat / after the meeting. //"}, "prompts": [{"q": "和新下属的第一次一对一刚开始。用 30 秒开场：说明这次会面的目的，不谈项目，然后抛出第一个问题。", "ref": "Welcome again, I'm really glad you're here. I want to use today a bit differently. We'll have plenty of time for projects and tickets, and most of that is in the onboarding doc anyway. Today I'd like to understand how you work best. So let me start with an easy one. Tell me about the best manager you've had. What did they do that worked for you?", "ref_zh": "再次欢迎，真的很高兴你能加入。今天我想换个方式来用这段时间。项目和工单以后有的是时间聊，而且大部分都在入职文档里了。今天我想了解一下你怎样工作状态最好。那我先问个简单的。讲讲你遇到过的最好的老板吧。他做了什么让你觉得很受用？", "id": "ref0"}, {"q": "继续这次一对一。用 30 秒问对方希望怎样接收反馈，并说明一对一的频率和规则。", "ref": "One more thing I'd like to get right early. When I have feedback for you, how do you prefer to get it? Some people like a written note, others want a quick chat right after the meeting. Also, I'd suggest we meet every week for thirty minutes. This time is yours, so bring anything, including things I'm doing that bother you.", "ref_zh": "还有一件事我想早点弄对。我有反馈要给你的时候，你更喜欢什么方式？有些人喜欢书面留言，有些人希望会后马上简单聊一下。另外，我建议我们每周见一次，每次三十分钟。这段时间是你的，所以什么都可以聊，包括我做的让你不舒服的事。", "id": "ref1"}], "words": [{"w": "convention", "ipa": "/kənˈvenʃən/", "zh": "惯例、约定", "ex": "Our naming convention for feature flags is in the wiki.", "id": "w0"}, {"w": "drain (v.)", "ipa": "/dreɪn/", "zh": "消耗（精力）", "ex": "Back-to-back on-call weeks really drain the team.", "tts_w": "drain", "id": "w1"}, {"w": "guarded", "ipa": "/ˈɡɑːrdɪd/", "zh": "有戒心的、保留的", "ex": "He was a bit guarded when I asked about his last project.", "id": "w2"}, {"w": " ot __come as a shock__.", "zh": "现在问清楚，意味着你第一次给出批评性反馈时，不会让对方觉得突然。", "sp": null, "gap": false, "start": 68.88, "end": 73.632, "words": [[68.985, 69.393], [69.406, 69.669], [69.683, 69.933], [69.946, 70.064], [70.077, 70.485], [70.498, 70.801], [70.814, 70.893], [70.906, 71.301], [71.314, 71.906], [72.025, 72.156], [72.169, 72.393], [72.406, 72.591], [72.604, 72.696], [72.709, 72.748], [72.762, 73.235]]}, {"kind": "s", "id": "s1_2_0", "md": "Then talk about the ==rhythm== of your meetings.", "zh": "然后聊聊你们开会的节奏。", "sp": null, "gap": true, "start": 73.632, "end": 76.008, "words": [[73.75, 73.856], [73.869, 74.106], [74.119, 74.356], [74.369, 74.461], [74.474, 74.816], [74.829, 74.908], [74.921, 75.04], [75.053, 75.619]]}, {"kind": "s", "id": "s1_2_1", "md": "Agree on how often you meet, and make it clear that this time belongs to them, not to project updates.", "zh": "约定多久见一次，并且说清楚这段时间是属于他的，不是用来同步项目的。", "sp": null, "gap": false, "start": 76.008, "end": 82.464, "words": [[76.113, 76.495], [76.508, 76.626], [76.64, 76.903], [76.916, 77.271], [77.284, 77.403], [77.416, 77.771], [78.166, 78.232], [78.245, 78.429], [78.442, 78.534], [78.547, 78.863], [78.876, 79.061], [79.074, 79.271], [79.284, 79.534], [79.547, 80.021], [80.034, 80.126], [80.14, 80.376], [80.784, 80.942], [80.955, 81.021], [81.034, 81.482], [81.495, 82.074]]}, {"kind": "s", "id": "s1_2_2", "md": "**Tell them they can bring anything, including complaints about you.**", "zh": "告诉他什么都可以拿来聊，包括对你的抱怨。", "sp": null, "gap": false, "start": 82.464, "end": 86.664, "words": [[82.582, 82.753], [82.767, 83.017], [83.188, 83.306], [83.319, 83.464], [83.477, 83.793], [83.951, 84.49], [84.885, 85.28], [85.293, 85.767], [85.78, 86.069], [86.082, 86.28]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, talk less than you want to.", "zh": "最后，少说话，比你想说的还要少。", "sp": null, "gap": true, "start": 86.664, "end": 88.992, "words": [[86.822, 87.23], [87.493, 87.756], [87.769, 87.967], [87.98, 88.098], [88.111, 88.217], [88.23, 88.453], [88.467, 88.598]]}, {"kind": "s", "id": "s1_3_1", "md": "Write down what you hear, and repeat it back in the next meeting.", "zh": "把听到的记下来，下次见面时复述一遍。", "sp": null, "gap": false, "start": 88.992, "end": 92.472, "words": [[89.097, 89.268], [89.281, 89.505], [89.518, 89.65], [89.663, 89.755], [89.768, 90.137], [90.453, 90.518], [90.531, 90.887], [90.9, 90.992], [91.005, 91.321], [91.334, 91.4], [91.413, 91.479], [91.492, 91.768], [91.781, 92.084]]}, {"kind": "s", "id": "s1_3_2", "md": "Nothing builds early trust faster than showing someone that you actually remembered what they ==revealed==.", "zh": "没有什么比让对方看到你真的记住了他说过的话，更能快速建立早期信任了。", "sp": null, "gap": false, "start": 92.472, "end": 98.184, "words": [[92.577, 92.893], [92.906, 93.327], [93.34, 93.669], [93.683, 94.104], [94.117, 94.683], [94.696, 94.827], [94.84, 95.235], [95.248, 95.617], [95.735, 95.867], [95.88, 96.011], [96.025, 96.511], [96.525, 96.998], [97.011, 97.143], [97.156, 97.261], [97.275, 97.801]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
