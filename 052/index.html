<script>
const D = {"id": "052", "title": "The First One-on-One with a New Report", "meta": "B2 · 约 280 词 · 场景：一对一", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. What This Meeting Is Really For", "heading_zh": "1. 这个会真正是为了什么", "rows": [[{"id": "s0_0_0", "md": "Your new engineer joined on Monday, and your first one-on-one is on Thursday.", "text": "Your new engineer joined on Monday, and your first one-on-one is on Thursday.", "zh": "你的新工程师周一入职，你们的第一次 1:1 定在周四。", "sp": null}, {"id": "s0_0_1", "md": "It is tempting to fill the half hour with a project overview, the team's ==conventions==, and a list of tickets.", "text": "It is tempting to fill the half hour with a project overview, the team's conventions, and a list of tickets.", "zh": "很容易就想把这半小时塞满：项目介绍、团队规范，再加一串工单。", "sp": null}, {"id": "s0_0_2", "md": "That information matters, but a document can deliver it.", "text": "That information matters, but a document can deliver it.", "zh": "这些信息很重要，但一份文档就能传达。", "sp": null}], [{"id": "s0_1_0", "md": "The first one-on-one has a different job.", "text": "The first one-on-one has a different job.", "zh": "第一次 1:1 有不一样的任务。", "sp": null}, {"id": "s0_1_1", "md": "It sets the tone for every conversation you will have with this person for the next few years.", "text": "It sets the tone for every conversation you will have with this person for the next few years.", "zh": "它为你接下来几年和这个人的每一次谈话定下基调。", "sp": null}, {"id": "s0_1_2", "md": "**If the first meeting is a status update, every meeting after it will be one too.**", "text": "If the first meeting is a status update, every meeting after it will be one too.", "zh": "如果第一次会是同步进度，之后的每一次也都会是。", "sp": null}], [{"id": "s0_2_0", "md": "What you want to learn is how this person works best.", "text": "What you want to learn is how this person works best.", "zh": "你想了解的是这个人怎样工作状态最好。", "sp": null}, {"id": "s0_2_1", "md": "What motivates them, what ==drains== them, and how they like to hear bad news.", "text": "What motivates them, what drains them, and how they like to hear bad news.", "zh": "什么能激励他，什么会消耗他，他喜欢怎么听坏消息。", "sp": null}, {"id": "s0_2_2", "md": "Those answers are hard to get later, once habits have __settled in__ and both of you are ==guarded==.", "text": "Those answers are hard to get later, once habits have settled in and both of you are guarded.", "zh": "这些答案以后就很难问出来了，因为那时习惯已经定型，双方也都有了戒备。", "sp": null}]]}, {"heading": "2. Questions Worth Asking", "heading_zh": "2. 值得问的问题", "rows": [[{"id": "s1_0_0", "md": "Start with their past, not your plans.", "text": "Start with their past, not your plans.", "zh": "从他的过去聊起，而不是你的计划。", "sp": null}, {"id": "s1_0_1", "md": "\"Tell me about the best manager you ever had. What did they do?\"", "text": "\"Tell me about the best manager you ever had. What did they do?\"", "zh": "「讲讲你遇到过的最好的老板吧。他做了些什么？」", "sp": null}, {"id": "s1_0_2", "md": "Then ask the ==mirror== question: \"What did a bad manager do that you never want to see again?\"", "text": "Then ask the mirror question: \"What did a bad manager do that you never want to see again?\"", "zh": "然后问反过来的问题：「有哪个糟糕的老板做过什么，是你再也不想遇到的？」", "sp": null}], [{"id": "s1_1_0", "md": "Next, ask how they want to receive feedback.", "text": "Next, ask how they want to receive feedback.", "zh": "接着，问他希望怎样接收反馈。", "sp": null}, {"id": "s1_1_1", "md": "Some people prefer it in writing, so they can think before replying.", "text": "Some people prefer it in writing, so they can think before replying.", "zh": "有些人喜欢书面的，这样回复前可以先想一想。", "sp": null}, {"id": "s1_1_2", "md": "Others want it __on the spot__, in a quick chat after the meeting.", "text": "Others want it on the spot, in a quick chat after the meeting.", "zh": "另一些人希望当场说，会后简单聊几句。", "sp": null}, {"id": "s1_1_3", "md": "Asking now means your first piece of critical feedback will not __come as a shock__.", "text": "Asking now means your first piece of critical feedback will not come as a shock.", "zh": "现在问清楚，意味着你第一次给出批评性反馈时，不会让对方觉得突然。", "sp": null}], [{"id": "s1_2_0", "md": "Then talk about the ==rhythm== of your meetings.", "text": "Then talk about the rhythm of your meetings.", "zh": "然后聊聊你们开会的节奏。", "sp": null}, {"id": "s1_2_1", "md": "Agree on how often you meet, and make it clear that this time belongs to them, not to project updates.", "text": "Agree on how often you meet, and make it clear that this time belongs to them, not to project updates.", "zh": "约定多久见一次，并且说清楚这段时间是属于他的，不是用来同步项目的。", "sp": null}, {"id": "s1_2_2", "md": "**Tell them they can bring anything, including complaints about you.**", "text": "Tell them they can bring anything, including complaints about you.", "zh": "告诉他什么都可以拿来聊，包括对你的抱怨。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, talk less than you want to.", "text": "Finally, talk less than you want to.", "zh": "最后，少说话，比你想说的还要少。", "sp": null}, {"id": "s1_3_1", "md": "Write down what you hear, and repeat it back in the next meeting.", "text": "Write down what you hear, and repeat it back in the next meeting.", "zh": "把听到的记下来，下次见面时复述一遍。", "sp": null}, {"id": "s1_3_2", "md": "Nothing builds early trust faster than showing someone that you actually remembered what they ==revealed==.", "text": "Nothing builds early trust faster than showing someone that you actually remembered what they revealed.", "zh": "没有什么比让对方看到你真的记住了他说过的话，更能快速建立早期信任了。", "sp": null}]]}], "gist": [{"q": "作者认为第一次一对一的真正目的是什么？", "a": "定下以后所有谈话的基调，了解对方怎样工作最好：什么激励他、什么消耗他、他希望怎样听坏消息；项目信息可以靠文档。"}, {"q": "作者建议问哪些问题？", "a": "你遇到过最好的经理做了什么、最差的经理做了什么；你希望怎样接收反馈（书面还是当面即时）。"}, {"q": "关于一对一的节奏和你自己的表现，作者有什么建议？", "a": "约定频率，说明这段时间属于对方不是汇报进度，可以聊任何事包括对你的抱怨；自己少说，记下来，下次复述给对方听。"}], "dictation": [{"id": "s0_1_2", "text": "If the first meeting is a status update, every meeting after it will be one too."}, {"id": "s1_0_0", "text": "Start with their past, not your plans."}, {"id": "s1_2_2", "text": "Tell them they can bring anything, including complaints about you."}, {"id": "s1_3_1", "text": "Write down what you hear, and repeat it back in the next meeting."}], "shadow": {"text": "Next, ask how they want to receive feedback. Some people prefer it in writing, so they can think before replying. Others want it on the spot, in a quick chat after the meeting.", "marked": "Next, / ask <b>how</b> they want to <b>receive</b> feedback. //<br>Some people prefer it in <b>writing</b>, / so they can <b>think</b> before replying. //<br><b>Others</b> want it <b>on the spot</b>, / in a <b>quick</b> chat / after the meeting. //"}, "prompts": [{"q": "和新下属的第一次一对一刚开始。用 30 秒开场：说明这次会面的目的，不谈项目，然后抛出第一个问题。", "ref": "Welcome again, I'm really glad you're here. I want to use today a bit differently. We'll have plenty of time for projects and tickets, and most of that is in the onboarding doc anyway. Today I'd like to understand how you work best. So let me start with an easy one. Tell me about the best manager you've had. What did they do that worked for you?", "ref_zh": "再次欢迎，真的很高兴你能加入。今天我想换个方式来用这段时间。项目和工单以后有的是时间聊，而且大部分都在入职文档里了。今天我想了解一下你怎样工作状态最好。那我先问个简单的。讲讲你遇到过的最好的老板吧。他做了什么让你觉得很受用？", "id": "ref0"}, {"q": "继续这次一对一。用 30 秒问对方希望怎样接收反馈，并说明一对一的频率和规则。", "ref": "One more thing I'd like to get right early. When I have feedback for you, how do you prefer to get it? Some people like a written note, others want a quick chat right after the meeting. Also, I'd suggest we meet every week for thirty minutes. This time is yours, so bring anything, including things I'm doing that bother you.", "ref_zh": "还有一件事我想早点弄对。我有反馈要给你的时候，你更喜欢什么方式？有些人喜欢书面留言，有些人希望会后马上简单聊一下。另外，我建议我们每周见一次，每次三十分钟。这段时间是你的，所以什么都可以聊，包括我做的让你不舒服的事。", "id": "ref1"}], "words": [{"w": "convention", "ipa": "/kənˈvenʃən/", "zh": "惯例、约定", "ex": "Our naming convention for feature flags is in the wiki.", "id": "w0"}, {"w": "drain (v.)", "ipa": "/dreɪn/", "zh": "消耗（精力）", "ex": "Back-to-back on-call weeks really drain the team.", "tts_w": "drain", "id": "w1"}, {"w": "guarded", "ipa": "/ˈɡɑːrdɪd/", "zh": "有戒心的、保留的", "ex": "He was a bit guarded when I asked about his last project.", "id": "w2"}, {"w": " const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress

function step(id, name, time, how, body) {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
