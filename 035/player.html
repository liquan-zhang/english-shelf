<script>
const D = {"id": "035", "title": "The Weekly Update Your Boss Actually Reads", "meta": "B2 · 约 270 词 · 场景：周报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Written for a Thirty-Second Read", "heading_zh": "1. 按三十秒读完来写", "rows": [[{"id": "s0_0_0", "md": "Your boss opens your weekly update on a phone, between two meetings.", "text": "Your boss opens your weekly update on a phone, between two meetings.", "zh": "你老板是在两个会之间，用手机打开你的周报的。", "sp": null}, {"id": "s0_0_1", "md": "They will read the first three lines, maybe four.", "text": "They will read the first three lines, maybe four.", "zh": "他会读前三行，也许四行。", "sp": null}, {"id": "s0_0_2", "md": "If the important part is in paragraph five, it is ==effectively== invisible.", "text": "If the important part is in paragraph five, it is effectively invisible.", "zh": "如果重点放在第五段，那基本等于没写。", "sp": null}], [{"id": "s0_1_0", "md": "Most updates are written like a ==diary==: what we did on Monday, what we did on Tuesday.", "text": "Most updates are written like a diary: what we did on Monday, what we did on Tuesday.", "zh": "大多数周报写得像日记：周一做了什么，周二做了什么。", "sp": null}, {"id": "s0_1_1", "md": "That format is easy to write and hard to use.", "text": "That format is easy to write and hard to use.", "zh": "这种格式写起来容易，用起来难。", "sp": null}, {"id": "s0_1_2", "md": "**Your boss does not need to know what you did; they need to know what changed and what needs them.**", "text": "Your boss does not need to know what you did; they need to know what changed and what needs them.", "zh": "老板不需要知道你做了什么；他需要知道什么变了，以及什么需要他出手。", "sp": null}], [{"id": "s0_2_0", "md": "So __flip the order__.", "text": "So flip the order.", "zh": "所以要把顺序倒过来。", "sp": null}, {"id": "s0_2_1", "md": "Put decisions and risks at the top, and the list of finished tasks at the bottom, or cut it entirely.", "text": "Put decisions and risks at the top, and the list of finished tasks at the bottom, or cut it entirely.", "zh": "把需要的决策和风险放在最上面，已完成任务的列表放在最下面，或者干脆删掉。", "sp": null}, {"id": "s0_2_2", "md": "A good update can be ==skimmed== in thirty seconds and still lead to the right action.", "text": "A good update can be skimmed in thirty seconds and still lead to the right action.", "zh": "一份好的周报，扫三十秒就能看完，而且照样能让人做出正确的动作。", "sp": null}]]}, {"heading": "2. Four Parts, Same Order Every Week", "heading_zh": "2. 四个部分，每周同一个顺序", "rows": [[{"id": "s1_0_0", "md": "**Open with the one thing that needs a reply, like \"Need your call on the launch date by Thursday.\"**", "text": "Open with the one thing that needs a reply, like \"Need your call on the launch date by Thursday.\"", "zh": "开头就写那件需要回复的事，比如「需要你在周四前定一下上线日期」。", "sp": null}, {"id": "s1_0_1", "md": "If nothing needs your boss, say so, because that is useful too.", "text": "If nothing needs your boss, say so, because that is useful too.", "zh": "如果没有需要老板处理的事，也直接说，因为这本身也是有用的信息。", "sp": null}], [{"id": "s1_1_0", "md": "Next, give an overall status with a short ==rationale==.", "text": "Next, give an overall status with a short rationale.", "zh": "接下来，给一个整体状态，附上简短的理由。", "sp": null}, {"id": "s1_1_1", "md": "\"Yellow, because the vendor is two weeks late with the new API\" says more than a table of twenty green tasks.", "text": "\"Yellow, because the vendor is two weeks late with the new API\" says more than a table of twenty green tasks.", "zh": "「黄灯，因为供应商的新 API 晚了两周」，比一张写满二十个绿灯任务的表格信息量大得多。", "sp": null}, {"id": "s1_1_2", "md": "A color without a reason __leaves your boss guessing__.", "text": "A color without a reason leaves your boss guessing.", "zh": "只有颜色没有理由，老板只能去猜。", "sp": null}], [{"id": "s1_2_0", "md": "Then list only what changed since last week: new risks, slipped dates, and wins worth noting.", "text": "Then list only what changed since last week: new risks, slipped dates, and wins worth noting.", "zh": "然后只列出跟上周相比有变化的东西：新的风险、延期的日期，以及值得一提的进展。", "sp": null}, {"id": "s1_2_1", "md": "Unchanged items are ==noise==, and noise teaches people to stop reading.", "text": "Unchanged items are noise, and noise teaches people to stop reading.", "zh": "没变化的条目都是噪音，噪音只会让人养成不读的习惯。", "sp": null}, {"id": "s1_2_2", "md": "Close with what is coming next week, in one or two lines.", "text": "Close with what is coming next week, in one or two lines.", "zh": "最后用一两行写下周的计划。", "sp": null}], [{"id": "s1_3_0", "md": "Keep the same structure every week.", "text": "Keep the same structure every week.", "zh": "每周保持同样的结构。", "sp": null}, {"id": "s1_3_1", "md": "A ==consistent== shape lets your boss __find what they need__ without thinking.", "text": "A consistent shape lets your boss find what they need without thinking.", "zh": "格式固定，老板不用动脑子就能找到他要的东西。", "sp": null}, {"id": "s1_3_2", "md": "Over time, they learn to trust that a quiet update really means things are fine, and they stop __chasing you for status__.", "text": "Over time, they learn to trust that a quiet update really means things are fine, and they stop chasing you for status.", "zh": "时间长了，他会相信一份平静的周报确实意味着一切正常，也就不会再追着你问进度了。", "sp": null}]]}], "gist": [{"q": "老板通常怎么读周报？这对写法意味着什么？", "a": "在手机上、两个会之间读，只看前三四行；重要内容放在后面等于看不见，要倒过来写。"}, {"q": "作者批评的「日记式」周报是什么？", "a": "按时间流水账写周一做了什么、周二做了什么；容易写但不好用，老板要的是变化和需要他做的事。"}, {"q": "推荐的周报四部分是什么？", "a": "需要老板回复的事；整体状态加一句理由；只列本周变化（新风险、延期、值得一提的成果）；下周计划一两行。每周结构保持一致。"}], "dictation": [{"id": "s0_1_2", "text": "Your boss does not need to know what you did; they need to know what changed and what needs them."}, {"id": "s1_2_1", "text": "Unchanged items are noise, and noise teaches people to stop reading."}, {"id": "s1_1_2", "text": "A color without a reason leaves your boss guessing."}, {"id": "s1_3_0", "text": "Keep the same structure every week."}], "shadow": {"text": "Most updates are written like a diary: what we did on Monday, what we did on Tuesday. That format is easy to write and hard to use.", "marked": "Most updates are written / like a <b>diary</b>: / what we did on <b>Monday</b>, / what we did on <b>Tuesday</b>. //<br>That format is <b>easy</b> to write / and <b>hard</b> to use. //"}, "prompts": [{"q": "老板在电梯里问你：「这周项目怎么样？」按周报的顺序用 30 秒口头回答：需要他决定的事、状态和理由、本周变化。", "ref": "One thing first: I need your call on whether we delay the launch by a week or ship without the export feature. I'd like an answer by Thursday. Overall we're yellow, because the vendor is late with the payment API. Since last week, the load test passed and we closed the two crash bugs. Next week is mostly about the vendor integration.", "ref_zh": "先说一件事：我需要你定一下，是把上线推迟一周，还是不带导出功能先上线。希望周四前能给我答复。整体是黄灯，因为供应商的支付 API 延期了。跟上周相比，压测通过了，两个崩溃 bug 也都关掉了。下周主要是做供应商的对接。", "id": "ref0"}, {"q": "你接手了一个新团队，他们的周报是很长的流水账。用 30 秒在团队会上提出新的周报格式。", "ref": "I'd like to try a new format for our weekly update. Leadership reads it on their phones, so the first line should be anything we need from them. Then one status color with a one-line reason. Then only what changed since last week, and a line on next week. If nothing changed, it's fine to keep it short. Let's try it for a month and see if we get better responses.", "ref_zh": "我想给我们的周报试一种新格式。管理层是在手机上看的，所以第一行应该写我们需要他们做的事。然后是一个状态颜色，加一行理由。再然后只写跟上周相比的变化，外加一行下周计划。如果没什么变化，写短一点也没关系。我们先试一个月，看看反馈会不会更好。", "id": "ref1"}], "words": [{"w": "effectively", "ipa": "/ɪˈfektɪvli/", "zh": "实际上、等于", "ex": "Without an owner, the ticket is effectively dead.", "id": "w0"}, {"w": "diary", "ipa": "/ˈdaɪəri/", "zh": "日记", "ex": "This update reads like a diary; what's the headline?", "id": "w1"}, {"w": "skim (v.)", "ipa": "/skɪm/", "zh": "略读、浏览", "ex": "Most people will only skim the doc, so put the decision first.", "tts_w": "skim", "id": "w2"}, {"w": "rationale", "ipa": "/ˌræʃəˈnæl/", "zh": "理由、依据", "ex": "Please add a short rationale for marking the project red.", "id": "w3"}, {"w": "vendor", "ipa": "/ˈvendər/", "zh": "供应商", "ex": "The vendor pushed their release, so our integration is blocked.", "id": "w4"}, {"w": "noise", "ipa": "/nɔɪz/", "zh": "噪音、无用信息", "ex": "Too many low-priority alerts turn into noise that people ignore.", "id": "w5"}, {"w": "consistent", const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
