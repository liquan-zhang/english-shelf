<script>
const D = {"id": "035", "title": "The Weekly Update Your Boss Actually Reads", "meta": "B2 · 约 270 词 · 场景：周报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Written for a Thirty-Second Read", "heading_zh": "1. 按三十秒读完来写", "rows": [[{"id": "s0_0_0", "md": "Your boss opens your weekly update on a phone, between two meetings.", "text": "Your boss opens your weekly update on a phone, between two meetings.", "zh": "你老板是在两个会之间，用手机打开你的周报的。", "sp": null}, {"id": "s0_0_1", "md": "They will read the first three lines, maybe four.", "text": "They will read the first three lines, maybe four.", "zh": "他会读前三行，也许四行。", "sp": null}, {"id": "s0_0_2", "md": "If the important part is in paragraph five, it is ==effectively== invisible.", "text": "If the important part is in paragraph five, it is effectively invisible.", "zh": "如果重点放在第五段，那基本等于没写。", "sp": null}], [{"id": "s0_1_0", "md": "Most updates are written like a ==diary==: what we did on Monday, what we did on Tuesday.", "text": "Most updates are written like a diary: what we did on Monday, what we did on Tuesday.", "zh": "大多数周报写得像日记：周一做了什么，周二做了什么。", "sp": null}, {"id": "s0_1_1", "md": "That format is easy to write and hard to use.", "text": "That format is easy to write and hard to use.", "zh": "这种格式写起来容易，用起来难。", "sp": null}, {"id": "s0_1_2", "md": "**Your boss does not need to know what you did; they need to know what changed and what needs them.**", "text": "Your boss does not need to know what you did; they need to know what changed and what needs them.", "zh": "老板不需要知道你做了什么；他需要知道什么变了，以及什么需要他出手。", "sp": null}], [{"id": "s0_2_0", "md": "So __flip the order__.", "text": "So flip the order.", "zh": "所以要把顺序倒过来。", "sp": null}, {"id": "s0_2_1", "md": "Put decisions and risks at the top, and the list of finished tasks at the bottom, or cut it entirely.", "text": "Put decisions and risks at the top, and the list of finished tasks at the bottom, or cut it entirely.", "zh": "把需要的决策和风险放在最上面，已完成任务的列表放在最下面，或者干脆删掉。", "sp": null}, {"id": "s0_2_2", "md": "A good update can be ==skimmed== in thirty seconds and still lead to the right action.", "text": "A good update can be skimmed in thirty seconds and still lead to the right action.", "zh": "一份好的周报，扫三十秒就能看完，而且照样能让人做出正确的动作。", "sp": null}]]}, {"heading": "2. Four Parts, Same Order Every Week", "heading_zh": "2. 四个部分，每周同一个顺序", "rows": [[{"id": "s1_0_0", "md": "**Open with the one thing that needs a reply, like \"Need your call on the launch date by Thursday.\"**", "text": "Open with the one thing that needs a reply, like \"Need your call on the launch date by Thursday.\"", "zh": "开头就写那件需要回复的事，比如「需要你在周四前定一下上线日期」。", "sp": null}, {"id": "s1_0_1", "md": "If nothing needs your boss, say so, because that is useful too.", "text": "If nothing needs your boss, say so, because that is useful too.", "zh": "如果没有需要老板处理的事，也直接说，因为这本身也是有用的信息。", "sp": null}], [{"id": "s1_1_0", "md": "Next, give an overall status with a short ==rationale==.", "text": "Next, give an overall status with a short rationale.", "zh": "接下来，给一个整体状态，附上简短的理由。", "sp": null}, {"id": "s1_1_1", "md": "\"Yellow, because the vendor is two weeks late with the new API\" says more than a table of twenty green tasks.", "text": "\"Yellow, because the vendor is two weeks late with the new API\" says more than a table of twenty green tasks.", "zh": "「黄灯，因为供应商的新 API 晚了两周」，比一张写满二十个绿灯任务的表格信息量大得多。", "sp": null}, {"id": "s1_1_2", "md": "A color without a reason __leaves your boss guessing__.", "text": "A color without a reason leaves your boss guessing.", "zh": "只有颜色没有理由，老板只能去猜。", "sp": null}], [{"id": "s1_2_0", "md": "Then list only what changed since last week: new risks, slipped dates, and wins worth noting.", "text": "Then list only what changed since last week: new risks, slipped dates, and wins worth noting.", "zh": "然后只列出跟上周相比有变化的东西：新的风险、延期的日期，以及值得一提的进展。", "sp": null}, {"id": "s1_2_1", "md": "Unchanged items are ==noise==, and noise teaches people to stop reading.", "text": "Unchanged items are noise, and noise teaches people to stop reading.", "zh": "没变化的条目都是噪音，噪音只会让人养成不读的习惯。", "sp": null}, {"id": "s1_2_2", "md": "Close with what is coming next week, in one or two lines.", "text": "Close with what is coming next week, in one or two lines.", "zh": "最后用一两行写下周的计划。", "sp": null}], [{"id": "s1_3_0", "md": "Keep the same structure every week.", "text": "Keep the same structure every week.", "zh": "每周保持同样的结构。", "sp": null}, {"id": "s1_3_1", "md": "A ==consistent== shape lets your boss __find what they need__ without thinking.", "text": "A consistent shape lets your boss find what they need without thinking.", "zh": "格式固定，老板不用动脑子就能找到他要的东西。", "sp": null}, {"id": "s1_3_2", "md": "Over time, they learn to trust that a quiet update really means things are fine, and they stop __chasing you for status__.", "text": "Over time, they learn to trust that a quiet update really means things are fine, and they stop chasing you for status.", "zh": "时间长了，他会相信一份平静的周报确实意味着一切正常，也就不会再追着你问进度了。", "sp": null}]]}], "gist": [{"q": "老板通常怎么读周报？这对写法意味着什么？", "a": "在手机上、两个会之间读，只看前三四行；重要内容放在后面等于看不见，要倒过来写。"}, {"q": "作者批评的「日记式」周报是什么？", "a": "按时间流水账写周一做了什么、周二做了什么；容易写但不好用，老板要的是变化和需要他做的事。"}, {"q": "推荐的周报四部分是什么？", "a": "需要老板回复的事；整体状态加一句理由；只列本周变化（新风险、延期、值得一提的成果）；下周计划一两行。每周结构保持一致。"}], "dictation": [{"id": "s0_1_2", "text": "Your boss does not need to know what you did; they need to know what changed and what needs them."}, {"id": "s1_2_1", "text": "Unchanged items are noise, and noise teaches people to stop reading."}, {"id": "s1_1_2", "text": "A color without a reason leaves your boss guessing."}, {"id": "s1_3_0", "text": "Keep the same structure every week."}], "shadow": {"text": "Most updates are written like a diary: what we did on Monday, what we did on Tuesday. That format is easy to write and hard to use.", "marked": "Most updates are written / like a <b>diary</b>: / what we did on <b>Monday</b>, / what we did on <b>Tuesday</b>. //<br>That format is <b>easy</b> to write / and <b>hard</b> to use. //"}, "prompts": [{"q": "老板在电梯里问你：「这周项目怎么样？」按周报的顺序用 30 秒口头回答：需要他决定的事、状态和理由、本周变化。", "ref": "One thing first: I need your call on whether we delay the launch by a week or ship without the export feature. I'd like an answer by Thursday. Overall we're yellow, because the vendor is late with the payment API. Since last week, the load test passed and we closed the two crash bugs. Next week is mostly about the vendor integration.", "ref_zh": "先说一件事：我需要你定一下，是把上线推迟一周，还是不带导出功能先上线。希望周四前能给我答复。整体是黄灯，因为供应商的支付 API 延期了。跟上周相比，压测通过了，两个崩溃 bug 也都关掉了。下周主要是做供应商的对接。", "id": "ref0"}, {"q": "你接手了一个新团队，他们的周报是很长的流水账。用 30 秒在团队会上提出新的周报格式。", "ref": "I'd like to try a new format for our weekly update. Leadership reads it on their phones, so the first line should be anything we need from them. Then one status color with a one-line reason. Then only what changed since last week, and a line on next week. If nothing changed, it's fine to keep it short. Let's try it for a month and see if we get better responses.", "ref_zh": "我想给我们的周报试一种新格式。管理层是在手机上看的，所以第一行应该写我们需要他们做的事。然后是一个状态颜色，加一行理由。再然后只写跟上周相比的变化，外加一行下周计划。如果没什么变化，写短一点也没关系。我们先试一个月，看看反馈会不会更好。", "id": "ref1"}], "words": [{"w": "effectively", "ipa": "/ɪˈfektɪvli/", "zh": "实际上、等于", "ex": "Without an owner, the ticket is effectively dead.", "id": "w0"}, {"w": "diary", "ipa": "/ˈdaɪəri/", "zh": "日记", "ex": "This update reads like a diary; what's the headline?", "id": "w1"}, {"w": "skim (v.)", "ipa": "/skɪm/", "zh": "略读、浏览", "ex": "Most people will only skim the doc, so put the decision first.", "tts_w": "skim", "id": "w2"}, {"w": "rationale", "ipa": "/ˌræʃəˈnæl/", "zh": "理由、依据", "ex": "Please add a short rationale for marking the project red.", "id": "w3"}, {"w": "vendor", "ipa": "/ˈvendər/", "zh": "供应商", "ex": "The vendor pushed their release, so our integration is blocked.", "id": "w4"}, {"w": "noise", "ipa": "/nɔɪz/", "zh": "噪音、无用信息", "ex": "Too many low-priority alerts turn into noise that people ignore.", "id": "w5"}, {"w": "consistent", const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
