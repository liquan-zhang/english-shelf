<script>
const D = {"id": "083", "title": "Talking About Your Weekend in Two Sentences", "meta": "B2 · 约 280 词 · 场景：周一聊周末", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Problem with \"Not Much\"", "heading_zh": "1. 「没干啥」的问题", "rows": [[{"id": "s0_0_0", "md": "Every Monday, someone asks, \"How was your weekend?\"", "text": "Every Monday, someone asks, \"How was your weekend?\"", "zh": "每周一，总有人问：「周末过得怎么样？」", "sp": null}, {"id": "s0_0_1", "md": "And every Monday, many of us answer, \"Good, not much,\" and the conversation dies __on the spot__.", "text": "And every Monday, many of us answer, \"Good, not much,\" and the conversation dies on the spot.", "zh": "也是每周一，很多人回一句：「挺好，没干啥。」然后天就当场聊死了。", "sp": null}, {"id": "s0_0_2", "md": "It is not rude, but it gives the other person nothing to __hold on to__.", "text": "It is not rude, but it gives the other person nothing to hold on to.", "zh": "这不算没礼貌，但对方完全接不住话。", "sp": null}], [{"id": "s0_1_0", "md": "Part of the problem is that we think our weekends are too ==ordinary== to share.", "text": "Part of the problem is that we think our weekends are too ordinary to share.", "zh": "问题的一部分在于，我们觉得自己的周末太平淡，不值一提。", "sp": null}, {"id": "s0_1_1", "md": "We did not climb a mountain; we did laundry and watched a show.", "text": "We did not climb a mountain; we did laundry and watched a show.", "zh": "我们没去爬山；就是洗了衣服、追了个剧。", "sp": null}, {"id": "s0_1_2", "md": "But small talk does not need ==drama==.", "text": "But small talk does not need drama.", "zh": "但闲聊不需要什么戏剧性。", "sp": null}, {"id": "s0_1_3", "md": "**People are not asking for an adventure; they are asking for a way in.**", "text": "People are not asking for an adventure; they are asking for a way in.", "zh": "人家要的不是冒险故事；要的是一个能接上话的口子。", "sp": null}], [{"id": "s0_2_0", "md": "A weekend answer is really an ==invitation==.", "text": "A weekend answer is really an invitation.", "zh": "回答周末怎么过，其实是在发出邀请。", "sp": null}, {"id": "s0_2_1", "md": "If you give one real detail, the other person can __pick up on__ it and ask a follow-up.", "text": "If you give one real detail, the other person can pick up on it and ask a follow-up.", "zh": "你只要给一个真实的细节，对方就能顺着接下去，再追问一句。", "sp": null}]]}, {"heading": "2. One Fact, One Hook", "heading_zh": "2. 一个事实，一个钩子", "rows": [[{"id": "s1_0_0", "md": "Here is a simple formula: one sentence about what you did, and one sentence that leaves a ==hook==.", "text": "Here is a simple formula: one sentence about what you did, and one sentence that leaves a hook.", "zh": "有个简单的公式：一句说你干了什么，一句留个钩子。", "sp": null}, {"id": "s1_0_1", "md": "The hook can be a feeling, a small problem, or a question back.", "text": "The hook can be a feeling, a small problem, or a question back.", "zh": "钩子可以是一种感受、一个小麻烦，或者反问回去。", "sp": null}, {"id": "s1_0_2", "md": "Think of it as a handle the other person can grab without any effort.", "text": "Think of it as a handle the other person can grab without any effort.", "zh": "把它想成一个把手，对方不费劲就能抓住。", "sp": null}], [{"id": "s1_1_0", "md": "\"I finally tried that new noodle place near the office. Honestly, I think it's ==overrated==, have you been?\"", "text": "\"I finally tried that new noodle place near the office. Honestly, I think it's overrated, have you been?\"", "zh": "「我终于去试了公司附近那家新开的面馆。说实话我觉得有点名不副实，你去过吗？」", "sp": null}, {"id": "s1_1_1", "md": "\"We took the kids to the beach on Sunday. I'm still finding sand in the car.\"", "text": "\"We took the kids to the beach on Sunday. I'm still finding sand in the car.\"", "zh": "「周日我们带孩子去了海边。到现在车里还能翻出沙子。」", "sp": null}, {"id": "s1_1_2", "md": "\"Quiet one, I mostly __caught up on__ sleep. I needed it after the release last week.\"", "text": "\"Quiet one, I mostly caught up on sleep. I needed it after the release last week.\"", "zh": "「挺清闲的，基本就是在补觉。上周上线完，确实得缓缓。」", "sp": null}], [{"id": "s1_2_0", "md": "Notice that none of these are ==impressive==.", "text": "Notice that none of these are impressive.", "zh": "你会发现，这几句没有一句是厉害的。", "sp": null}, {"id": "s1_2_1", "md": "They work because they are specific and slightly ==personal==, so the listener has something to work with.", "text": "They work because they are specific and slightly personal, so the listener has something to work with.", "zh": "它们之所以管用，是因为具体、又带点个人色彩，听的人有东西可接。", "sp": null}, {"id": "s1_2_2", "md": "**Two honest sentences beat a long story, and they beat \"not much\" every time.**", "text": "Two honest sentences beat a long story, and they beat \"not much\" every time.", "zh": "两句实在话胜过一个长故事，更是每次都胜过「没干啥」。", "sp": null}], [{"id": "s1_3_0", "md": "Prepare your two sentences on Sunday night, the same way you would prepare a status update.", "text": "Prepare your two sentences on Sunday night, the same way you would prepare a status update.", "zh": "周日晚上就把这两句话准备好，就像你准备进度同步一样。", "sp": null}, {"id": "s1_3_1", "md": "And when you ask back, __listen for__ their hook and follow it.", "text": "And when you ask back, listen for their hook and follow it.", "zh": "轮到你反问的时候，留意对方的钩子，顺着接下去。", "sp": null}]]}], "gist": [{"q": "为什么回答 \"Good, not much\" 会让对话冷掉？", "a": "它不失礼，但没给对方任何可以接的东西，对话当场就结束了。"}, {"q": "作者说别人问周末时其实想要什么？", "a": "不是想听冒险经历，而是想要一个接话的入口；周末回答其实是一个邀请。"}, {"q": "文中的公式是什么？好的例子有什么共同点？", "a": "一句说做了什么 + 一句留钩子（感受、小麻烦或反问）；例子都不厉害，但具体、带点个人色彩。"}], "dictation": [{"id": "s0_1_3", "text": "People are not asking for an adventure; they are asking for a way in."}, {"id": "s0_2_0", "text": "A weekend answer is really an invitation."}, {"id": "s0_2_1", "text": "If you give one real detail, the other person can pick up on it and ask a follow-up."}, {"id": "s1_2_2", "text": "Two honest sentences beat a long story, and they beat \"not much\" every time."}], "shadow": {"text": "Notice that none of these are impressive. They work because they are specific and slightly personal, so the listener has something to work with. Two honest sentences beat a long story, and they beat \"not much\" every time.", "marked": "Notice that <b>none</b> of these / are <b>impressive</b>. //<br>They work because they are <b>specific</b> / and slightly <b>personal</b>, / so the listener has something to <b>work</b> with. //<br>Two <b>honest</b> sentences / beat a <b>long</b> story, / and they beat \"<b>not much</b>\" / every <b>time</b>. //"}, "prompts": [{"q": "周一早上澳洲同事问你 How was your weekend? 你其实只是在家陪孩子、去了一趟超市。用“一句事实加一个钩子”回答，再问回去。", "ref": "Pretty low-key, to be honest. We stayed home with the kids, and the big event was a trip to the supermarket, which somehow took three hours. Honestly, it was relaxing in its own way. How about you? I saw the weather was great on Saturday. Did you get out anywhere?", "ref_zh": "说实话挺平淡的。我们在家陪孩子，最大的事是去了趟超市，不知怎么就逛了三个小时。不过说真的，也挺放松的。你呢？我看周六天气特别好，出去玩了吗？", "id": "ref0"}, {"q": "周五下班前同事问 Any plans for the weekend? 你打算去爬山但还没定。两句话回答并留一个钩子。", "ref": "I'm thinking of doing the MacRitchie trail on Saturday morning, if the weather holds. Last time I only made it halfway before it started pouring. I've never done the full loop, so I'm a bit worried about the monkeys. Have you done it? Any tips for a beginner?", "ref_zh": "如果天气不变，我打算周六上午去走 MacRitchie 步道。上次走到一半就下起了大雨。我还没走完过整圈，有点怕那些猴子。你走过吗？给新手支几招？", "id": "ref1"}], "words": [{"w": "ordinary", "ipa": "/ˈɔːrdəneri/", "zh": "普通的、平常的", "ex": "It was an ordinary week, just bug fixes and reviews.", "id": "w0"}, {"w": "drama", "ipa": "/ˈdrɑːmə/", "zh": "戏剧性、大事件", "ex": "The launch went out with no drama at all, which is exactly what we wanted.", "id": "w1"}, {"w": "invitation", "ipa": "/ˌɪnvɪˈteɪʃən/", "zh": "邀请", "ex": "Treat every question in a review as an invitation to explain your thinking.", "id": "w2"}, {"w": "hook (n.)", "ipa": "/hʊk/", "zh": "钩子、吸引人接话的点", "ex": "End your update with a hook, like a question for the team.", "tts_w": "hook", "id": "w3"}, {"w": "overrated", "ipa": "/ˌoʊvərˈreɪtɪd/", "zh": "被高估的", "ex": "Honestly, I think that new framework is a bit overrated.", "id": "w4"}, {"w": "impressive", "ipa": "/ɪmˈpresɪv/", "zh": "令人印象深刻的", "ex": "The demo was impressive, but I w const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
