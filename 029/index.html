<script>
const D = {"id": "029", "title": "Turning Lessons Learned into Real Changes", "meta": "B2 · 约 270 词 · 场景：复盘行动项跟进", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Graveyard of Action Items", "heading_zh": "1. 待办事项的坟场", "rows": [[{"id": "s0_0_0", "md": "Open any team's postmortem folder and count the action items that were never done.", "text": "Open any team's postmortem folder and count the action items that were never done.", "zh": "随便打开哪个团队的复盘文件夹，数数有多少待办事项从来没做完。", "sp": null}, {"id": "s0_0_1", "md": "Most teams find a ==graveyard==.", "text": "Most teams find a graveyard.", "zh": "大多数团队会发现那是一片坟场。", "sp": null}, {"id": "s0_0_2", "md": "The same lessons appear again and again: \"improve monitoring,\" \"communicate better,\" \"be more careful.\"", "text": "The same lessons appear again and again: \"improve monitoring,\" \"communicate better,\" \"be more careful.\"", "zh": "同样的教训一遍又一遍地出现：「完善监控」「加强沟通」「更加小心」。", "sp": null}], [{"id": "s0_1_0", "md": "These items fail because they describe a wish, not a change.", "text": "These items fail because they describe a wish, not a change.", "zh": "这些事项之所以落空，是因为它们描述的是一个愿望，而不是一个改动。", "sp": null}, {"id": "s0_1_1", "md": "Nobody can tell when \"be more careful\" is finished, so it never is.", "text": "Nobody can tell when \"be more careful\" is finished, so it never is.", "zh": "没人说得清「更加小心」什么时候算完成，所以它永远完成不了。", "sp": null}, {"id": "s0_1_2", "md": "Three months later, a new incident __brings the same lesson back__, and everyone nods again.", "text": "Three months later, a new incident brings the same lesson back, and everyone nods again.", "zh": "三个月后，一个新事故又把同样的教训翻出来，大家又一起点头。", "sp": null}, {"id": "s0_1_3", "md": "**Good intentions do not survive a busy quarter; mechanisms do.**", "text": "Good intentions do not survive a busy quarter; mechanisms do.", "zh": "良好的意愿熬不过一个忙碌的季度；机制才能。", "sp": null}], [{"id": "s0_2_0", "md": "A ==mechanism== is something that works even when people are tired, busy, or new.", "text": "A mechanism is something that works even when people are tired, busy, or new.", "zh": "机制就是那种在人累了、忙了或者刚来的时候，依然能起作用的东西。", "sp": null}, {"id": "s0_2_1", "md": "It might be an alert, a safer default setting, or a check in the deploy ==pipeline==.", "text": "It might be an alert, a safer default setting, or a check in the deploy pipeline.", "zh": "它可以是一条告警、一个更安全的默认配置，或者发布流水线里的一道检查。", "sp": null}, {"id": "s0_2_2", "md": "It does not depend on anyone remembering the incident.", "text": "It does not depend on anyone remembering the incident.", "zh": "它不依赖任何人还记得那次事故。", "sp": null}]]}, {"heading": "2. Owner, Date, Proof", "heading_zh": "2. 负责人、截止日期、验证", "rows": [[{"id": "s1_0_0", "md": "Take each lesson and ask, \"What would have stopped this automatically?\"", "text": "Take each lesson and ask, \"What would have stopped this automatically?\"", "zh": "拿着每一条教训问自己：「什么东西能自动拦住这件事？」", "sp": null}, {"id": "s1_0_1", "md": "\"Be careful with ==migrations==\" becomes \"the pipeline blocks any migration that has not passed a ==dry run==.\"", "text": "\"Be careful with migrations\" becomes \"the pipeline blocks any migration that has not passed a dry run.\"", "zh": "「做迁移要小心」就变成了「流水线会拦下任何没跑过 dry run 的迁移」。", "sp": null}, {"id": "s1_0_2", "md": "Now the lesson lives in the system, not in someone's memory.", "text": "Now the lesson lives in the system, not in someone's memory.", "zh": "这样，教训就沉淀进了系统里，而不是靠某个人的记忆。", "sp": null}, {"id": "s1_0_3", "md": "It keeps working even after the people who wrote the postmortem have moved to other teams.", "text": "It keeps working even after the people who wrote the postmortem have moved to other teams.", "zh": "哪怕写复盘的那批人都转去了别的团队，它也照样起作用。", "sp": null}], [{"id": "s1_1_0", "md": "Every item needs one owner and a realistic date.", "text": "Every item needs one owner and a realistic date.", "zh": "每一项都需要一个负责人和一个靠谱的截止日期。", "sp": null}, {"id": "s1_1_1", "md": "Name one person, not a team, because shared ownership usually means no ownership.", "text": "Name one person, not a team, because shared ownership usually means no ownership.", "zh": "要点名到一个人，而不是一个团队，因为大家一起负责，通常就等于没人负责。", "sp": null}, {"id": "s1_1_2", "md": "Then __cut the list down__ to the two or three changes that matter most.", "text": "Then cut the list down to the two or three changes that matter most.", "zh": "然后把清单砍到最重要的两三项改动。", "sp": null}, {"id": "s1_1_3", "md": "**Three finished fixes beat ten open tickets.**", "text": "Three finished fixes beat ten open tickets.", "zh": "做完三个修复，胜过挂着十个没关的工单。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, decide how you will ==verify== that the change works.", "text": "Finally, decide how you will verify that the change works.", "zh": "最后，想清楚你要怎么验证这个改动真的有效。", "sp": null}, {"id": "s1_2_1", "md": "Run a ==drill== in staging, break the thing on purpose, and confirm the new check catches it.", "text": "Run a drill in staging, break the thing on purpose, and confirm the new check catches it.", "zh": "在测试环境搞一次演练，故意把东西弄坏，确认新加的检查能拦住它。", "sp": null}, {"id": "s1_2_2", "md": "A fix that has never been tested is only a hope.", "text": "A fix that has never been tested is only a hope.", "zh": "一个从来没测过的修复，只是一个愿望。", "sp": null}, {"id": "s1_2_3", "md": "Then __close the loop__ in the next team meeting, so people see that postmortems actually lead somewhere.", "text": "Then close the loop in the next team meeting, so people see that postmortems actually lead somewhere.", "zh": "然后在下一次团队会议上把这件事闭环，让大家看到复盘是真的能带来结果的。", "sp": null}]]}], "gist": [{"q": "为什么很多复盘行动项从来没被完成？", "a": "它们描述的是愿望而不是改变，比如「更小心」，没人能判断什么时候算完成。"}, {"q": "作者说什么能扛过忙碌的季度？举例说明。", "a": "机制：告警、更安全的默认配置、发布流水线里的检查，不依赖任何人记得这次事故。"}, {"q": "把教训变成改进需要哪几步？", "a": "问「什么能自动拦住它」；每项一个负责人和现实的日期，精简到两三项；在预发环境演练验证，并在团队会上闭环。"}], "dictation": [{"id": "s0_1_3", "text": "Good intentions do not survive a busy quarter; mechanisms do."}, {"id": "s1_1_3", "text": "Three finished fixes beat ten open tickets."}, {"id": "s1_0_2", "text": "Now the lesson lives in the system, not in someone's memory."}, {"id": "s1_1_1", "text": "Name one person, not a team, because shared ownership usually means no ownership."}], "shadow": {"text": "These items fail because they describe a wish, not a change. Nobody can tell when \"be more careful\" is finished, so it never is.", "marked": "These items <b>fail</b> / because they describe a <b>wish</b>, / <b>not</b> a change. //<br><b>Nobody</b> can tell / when \"be more <b>careful</b>\" is <b>finished</b>, / so it <b>never</b> is. //"}, "prompts": [{"q": "复盘会上有人写下行动项「以后上线前要更仔细检查配置」。用 30 秒把它改写成一个可以落地的机制，并指定负责人和日期。", "ref": "I agree with the spirit, but checking more carefully is hard to measure. What would have caught this automatically? A config diff check in the pipeline would have flagged the wrong region name before deploy. Could we make that the action item instead? Priya, would you be able to own it, with a target of the end of next sprint? Then we'll test it in staging with a broken config.", "ref_zh": "出发点我同意，但「检查得更仔细」很难衡量。什么东西能自动发现这个问题？流水线里加一个配置 diff 检查，就能在发布前把错误的地区名标出来。我们能不能把这个作为待办？Priya，你能负责吗？目标是下个 sprint 结束前。然后我们在测试环境用一份错误的配置来验证它。", "id": "ref0"}, {"q": "上次复盘列了十几个行动项，大部分没做。用 30 秒向团队提议精简清单并约定怎么验证。", "ref": "Looking back at our last postmortem, we wrote fourteen action items and finished three. I don't think the problem is effort; the list was just too long. This time, let's pick the two changes that would have prevented the outage, give each one a single owner, and agree how we'll prove they work. I'll add a check-in to our team meeting in two weeks.", "ref_zh": "回头看上次复盘，我们写了十四个待办，只完成了三个。我觉得问题不在不够努力，而是清单太长了。这次我们就挑两个能避免这次故障的改动，每个只定一个负责人，再约定好怎么证明它们有效。我会在两周后的团队会议上加一个进度检查。", "id": "ref1"}], "words": [{"w": "graveyard", "ipa": "/ˈɡreɪvjɑːrd/", "zh": "墓地（喻：被遗忘的地方）", "ex": "Our backlog has become a graveyard of old tickets.", "id": "w0"}, {"w": "intention", "ipa": "/ɪnˈtenʃən/", "zh": "意图、打算", "ex": "Good intentions won't stop the next outage; an alert will.", "id": "w1"}, {"w": "mechanism", "ipa": "/ˈmekənɪzəm/", "zh" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
