<script>
const D = {"id": "027", "title": "Defending a Technical Decision", "meta": "B2 · 约 260 词 · 场景：被质疑旧决策", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Defend the Reasoning, Not the Result", "heading_zh": "1. 为思路辩护，而不是为结果辩护", "rows": [[{"id": "s0_0_0", "md": "Six months ago, you chose a message queue instead of direct calls between services.", "text": "Six months ago, you chose a message queue instead of direct calls between services.", "zh": "六个月前，你选了消息队列，而不是服务之间直接调用。", "sp": null}, {"id": "s0_0_1", "md": "Now a director asks in a review why the system is so complicated.", "text": "Now a director asks in a review why the system is so complicated.", "zh": "现在有位总监在评审会上问，这个系统为什么这么复杂。", "sp": null}, {"id": "s0_0_2", "md": "You have about one minute to __make your case__.", "text": "You have about one minute to make your case.", "zh": "你大概只有一分钟来讲清楚你的理由。", "sp": null}], [{"id": "s0_1_0", "md": "The weak answer tries to ==justify== the result.", "text": "The weak answer tries to justify the result.", "zh": "弱的回答是想证明结果是对的。", "sp": null}, {"id": "s0_1_1", "md": "\"It was the right call, and it works fine\" sounds like you are protecting your ==ego==.", "text": "\"It was the right call, and it works fine\" sounds like you are protecting your ego.", "zh": "「当时那么选没错，现在也跑得好好的」，听起来像是在维护自己的面子。", "sp": null}, {"id": "s0_1_2", "md": "It also invites the next question, and the one after that.", "text": "It also invites the next question, and the one after that.", "zh": "而且它还会招来下一个问题，然后再下一个。", "sp": null}, {"id": "s0_1_3", "md": "The strong answer explains the reasoning, so people can judge it for themselves.", "text": "The strong answer explains the reasoning, so people can judge it for themselves.", "zh": "强的回答是把思路讲出来，让大家自己去判断。", "sp": null}], [{"id": "s0_2_0", "md": "**You are not defending a choice; you are showing how you made it.**", "text": "You are not defending a choice; you are showing how you made it.", "zh": "你不是在为一个选择辩护，而是在展示你是怎么做出这个选择的。", "sp": null}, {"id": "s0_2_1", "md": "If the reasoning was ==sound==, the decision holds up even when the outcome is mixed.", "text": "If the reasoning was sound, the decision holds up even when the outcome is mixed.", "zh": "如果思路站得住，哪怕结果有好有坏，这个决策也经得起推敲。", "sp": null}, {"id": "s0_2_2", "md": "If it was not, it is better that you __spot the flaw__ before someone else does.", "text": "If it was not, it is better that you spot the flaw before someone else does.", "zh": "如果思路有问题，那最好是你自己先发现漏洞，而不是让别人先发现。", "sp": null}]]}, {"heading": "2. Context, Options, Evidence", "heading_zh": "2. 背景、选项、证据", "rows": [[{"id": "s1_0_0", "md": "Start with the ==constraints== you faced at the time.", "text": "Start with the constraints you faced at the time.", "zh": "先讲清楚当时面临的约束。", "sp": null}, {"id": "s1_0_1", "md": "\"We had three teams shipping on different schedules, and direct calls kept breaking each other's releases.\"", "text": "\"We had three teams shipping on different schedules, and direct calls kept breaking each other's releases.\"", "zh": "「当时有三个团队按不同的节奏发版，直接调用老是把彼此的发布搞挂。」", "sp": null}, {"id": "s1_0_2", "md": "Context makes an old decision look far less ==arbitrary==.", "text": "Context makes an old decision look far less arbitrary.", "zh": "有了背景，一个旧决策看起来就没那么拍脑袋了。", "sp": null}], [{"id": "s1_1_0", "md": "Then show the ==alternatives== you rejected.", "text": "Then show the alternatives you rejected.", "zh": "然后讲你否掉了哪些备选方案。", "sp": null}, {"id": "s1_1_1", "md": "\"We looked at a shared library and a single deployment, and both would have slowed every team down.\"", "text": "\"We looked at a shared library and a single deployment, and both would have slowed every team down.\"", "zh": "「我们看过共享库和统一部署，这两个方案都会拖慢每个团队。」", "sp": null}, {"id": "s1_1_2", "md": "This proves you __did your homework__ and did not just follow your gut.", "text": "This proves you did your homework and did not just follow your gut.", "zh": "这证明你做过功课，不是凭感觉拍板的。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, share the evidence and its limits.", "text": "Finally, share the evidence and its limits.", "zh": "最后，拿出证据，也讲清楚证据的局限。", "sp": null}, {"id": "s1_2_1", "md": "\"Release conflicts dropped to almost zero, but debugging got harder, and that cost is real.\"", "text": "\"Release conflicts dropped to almost zero, but debugging got harder, and that cost is real.\"", "zh": "「发布冲突基本降到了零，但排查问题变难了，这个代价是实打实的。」", "sp": null}, {"id": "s1_2_2", "md": "**Naming the downside yourself takes the weapon out of your critic's hand.**", "text": "Naming the downside yourself takes the weapon out of your critic's hand.", "zh": "自己先把缺点说出来，批评你的人手里就没了武器。", "sp": null}], [{"id": "s1_3_0", "md": "End by saying what data would change your mind.", "text": "End by saying what data would change your mind.", "zh": "结尾说一下，什么样的数据会让你改变主意。", "sp": null}, {"id": "s1_3_1", "md": "That one sentence is the difference between confidence and ==stubbornness==, and senior people __notice the difference__ right away.", "text": "That one sentence is the difference between confidence and stubbornness, and senior people notice the difference right away.", "zh": "就这一句话，区分了自信和固执，而资深的人一下子就能听出这个区别。", "sp": null}]]}], "gist": [{"q": "被质疑旧决策时，弱的回答和强的回答区别在哪？", "a": "弱的回答为结果辩护（「当时是对的、现在跑得好」），像在护面子；强的回答讲清推理过程，让大家自己判断。"}, {"q": "作者建议回答的结构是什么？", "a": "当时的约束条件 → 否掉了哪些备选方案 → 证据及其局限（主动讲代价）→ 什么数据会让你改变主意。"}, {"q": "为什么要主动说出决策的缺点？", "a": "自己先讲出代价，就等于缴了批评者的武器，也显得自信而不是固执。"}], "dictation": [{"id": "s0_2_0", "text": "You are not defending a choice; you are showing how you made it."}, {"id": "s1_2_2", "text": "Naming the downside yourself takes the weapon out of your critic's hand."}, {"id": "s1_0_2", "text": "Context makes an old decision look far less arbitrary."}, {"id": "s1_3_0", "text": "End by saying what data would change your mind."}], "shadow": {"text": "Finally, share the evidence and its limits. \"Release conflicts dropped to almost zero, but debugging got harder, and that cost is real.\" Naming the downside yourself takes the weapon out of your critic's hand.", "marked": "Finally, / share the <b>evidence</b> / and its <b>limits</b>. //<br>\"Release conflicts dropped to <b>almost zero</b>, / <b>but</b> debugging got <b>harder</b>, / and that cost is <b>real</b>.\" //<br><b>Naming</b> the downside <b>yourself</b> / takes the <b>weapon</b> / out of your critic's hand. //"}, "prompts": [{"q": "新来的总监问你：「当初为什么要自研配置中心，不直接用现成方案？」用 30 秒按「约束、备选、证据、什么会让我改主意」来回答。", "ref": "Good question. Two years ago we needed config changes to reach every region in under ten seconds, and the open source options we tested took close to a minute. We also looked at buying a hosted service, but it couldn't run inside our private network. Since then, change propagation has stayed fast and we've had no config outages. The cost is maintenance. If a hosted option now meets the latency bar, I'd be open to switching.", "ref_zh": "好问题。两年前我们要求配置变更在十秒内推到所有地区，而我们测过的开源方案都要将近一分钟。我们也考虑过买托管服务，但它没法跑在我们的内网里。从那以后，变更下发一直很快，也没出过配置相关的故障。代价是维护成本。如果现在有托管方案能达到延迟要求，我愿意考虑切过去。", "id": "ref0"}, {"q": "同事说你选的数据库「太小众、招人难」。承认这个代价，同时讲清楚当时的理由。", "ref": "That's a fair point, and I'll admit hiring is harder because of it. When we made the choice, our main constraint was write volume. The mainstream option needed three times the hardware for the same load, and we had a fixed budget. So we accepted a smaller talent pool in exchange for lower cost. If our write volume drops or the budget changes, I'd happily reopen that decision.", "ref_zh": "这个点说得对，我承认因为这个，招人确实更难了。当时做选择时，我们最主要的约束是写入量。主流方案在同样负载下需要三倍的机器，而我们的预算是固定的。所以我们用更小的人才池，换来了更低的成本。如果写入量下降了，或者预算有变化，我很乐意重新讨论这个决策。", "id": "ref1"}], "words": [{"w": "justify", "ipa": "/ˈdʒʌstɪfaɪ/", "zh": "为……辩护、证明合理", "ex": "Can we justify a new service for just two endpoints?", "id": "w0"}, {"w": "ego", "ipa": "/ˈiːɡoʊ/", "zh": "自尊心、面子", "ex": "Let's leave ego out of it and look at the benchmark.", "id": "w1"}, {"w": "sound (adj.)", "ipa": "/saʊnd/", "zh": "合理的、站得住的", "ex": "The plan is sound, but the timeline is too tight.", "tts_w": "sound", "id": "w2"}, {"w": "flaw", "ipa": "/flɔː/", "zh": "缺陷、漏洞", "ex": "We found a flaw in the retry logic during load testing.", "id": "w3"}, {"w": "constraint", "ipa": "/kənˈstreɪnt/", "zh": "约束、限制", "ex": "Our main constraint was a fixed hardware budget.", "id": "w4"}, {"w": "arbitrary", "ipa": "/ˈɑːrbɪtreri/", "zh": "随意的、武断的", "ex": "The thirty-second timeout looks arbitrary; where did it come from?", "id": "w5"}, {"w": "alternative", "ipa": "/ɔːlˈtɜːrnətɪv/", "zh": "备选方案", "ex": "We considered two alternatives before picking this design.", "id": "w6"}, {"w": "stubbornness", "ipa": "/ˈstʌbərnnəs/", "zh": "固执", "ex": "Holding on to the old design now looks like stubbornness.", "id": "w7"}, {"w": "downside", "ipa": "/ˈdaʊnsaɪd/", "zh": "缺点、负面影响", "ex": "The downside is that local debugging gets harder.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Defend the Reasoning, Not the Result", "zh": "1. 为思路辩护，而不是为结果辩护", "start": 0.0, "end": 3.192, "words": [[0.105, 0.421], [0.763, 1.092], [1.105, 1.171], [1.184, 1.697], [2.026, 2.197], [2.211, 2.289], [2.303, 2.789]]}, {"kind": "s", "id": "s0_0_0", "md": "Six months ago, you chose a message queue instead of direct calls between services.", "zh": "六个月前，你选了消息队列，而不是服务之间直接调用。", "sp": null, "gap": false, "start": 3.192, "end": 8.496, "words": [[3.31, 3.547], [3.56, 3.81], [3.824, 4.166], [4.455, 4.534], [4.547, 4.837], [4.85, 4.889], [4.903, 5.324], [5.337, 5.626], [5.639, 6.074], [6.087, 6.179], [6.192, 6.6], [6.613, 7.008], [7.021, 7.389], [7.403, 8.1]]}, {"kind": "s", "id": "s0_0_1", "md": "Now a director asks in a review why the system is so complicated.", "zh": "现在有位总监在评审会上问，这个系统为什么这么复杂。", "sp": null, "gap": false, "start": 8.496, "end": 12.96, "words": [[8.601, 8.799], [8.812, 8.864], [8.878, 9.364], [9.378, 9.772], [9.785, 9.891], [9.904, 9.957], [9.97, 10.483], [10.496, 10.707], [10.72, 10.812], [10.825, 11.378], [11.496, 11.575], [11.588, 11.772], [11.785, 12.575]]}, {"kind": "s", "id": "  "就这一句话，区分了自信和固执，而资深的人一下子就能听出这个区别。", "sp": null, "gap": false, "start": 89.904, "end": 96.768, "words": [[90.009, 90.246], [90.259, 90.509], [90.522, 91.049], [91.141, 91.259], [91.272, 91.404], [91.417, 91.851], [91.865, 92.233], [92.246, 92.957], [92.97, 93.062], [93.075, 93.799], [94.075, 94.207], [94.22, 94.601], [94.615, 94.943], [94.957, 95.259], [95.272, 95.378], [95.391, 95.825], [95.838, 95.996], [96.009, 96.391]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
