<script>
const D = {"id": "027", "title": "Defending a Technical Decision", "meta": "B2 · 约 260 词 · 场景：被质疑旧决策", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Defend the Reasoning, Not the Result", "heading_zh": "1. 为思路辩护，而不是为结果辩护", "rows": [[{"id": "s0_0_0", "md": "Six months ago, you chose a message queue instead of direct calls between services.", "text": "Six months ago, you chose a message queue instead of direct calls between services.", "zh": "六个月前，你选了消息队列，而不是服务之间直接调用。", "sp": null}, {"id": "s0_0_1", "md": "Now a director asks in a review why the system is so complicated.", "text": "Now a director asks in a review why the system is so complicated.", "zh": "现在有位总监在评审会上问，这个系统为什么这么复杂。", "sp": null}, {"id": "s0_0_2", "md": "You have about one minute to __make your case__.", "text": "You have about one minute to make your case.", "zh": "你大概只有一分钟来讲清楚你的理由。", "sp": null}], [{"id": "s0_1_0", "md": "The weak answer tries to ==justify== the result.", "text": "The weak answer tries to justify the result.", "zh": "弱的回答是想证明结果是对的。", "sp": null}, {"id": "s0_1_1", "md": "\"It was the right call, and it works fine\" sounds like you are protecting your ==ego==.", "text": "\"It was the right call, and it works fine\" sounds like you are protecting your ego.", "zh": "「当时那么选没错，现在也跑得好好的」，听起来像是在维护自己的面子。", "sp": null}, {"id": "s0_1_2", "md": "It also invites the next question, and the one after that.", "text": "It also invites the next question, and the one after that.", "zh": "而且它还会招来下一个问题，然后再下一个。", "sp": null}, {"id": "s0_1_3", "md": "The strong answer explains the reasoning, so people can judge it for themselves.", "text": "The strong answer explains the reasoning, so people can judge it for themselves.", "zh": "强的回答是把思路讲出来，让大家自己去判断。", "sp": null}], [{"id": "s0_2_0", "md": "**You are not defending a choice; you are showing how you made it.**", "text": "You are not defending a choice; you are showing how you made it.", "zh": "你不是在为一个选择辩护，而是在展示你是怎么做出这个选择的。", "sp": null}, {"id": "s0_2_1", "md": "If the reasoning was ==sound==, the decision holds up even when the outcome is mixed.", "text": "If the reasoning was sound, the decision holds up even when the outcome is mixed.", "zh": "如果思路站得住，哪怕结果有好有坏，这个决策也经得起推敲。", "sp": null}, {"id": "s0_2_2", "md": "If it was not, it is better that you __spot the flaw__ before someone else does.", "text": "If it was not, it is better that you spot the flaw before someone else does.", "zh": "如果思路有问题，那最好是你自己先发现漏洞，而不是让别人先发现。", "sp": null}]]}, {"heading": "2. Context, Options, Evidence", "heading_zh": "2. 背景、选项、证据", "rows": [[{"id": "s1_0_0", "md": "Start with the ==constraints== you faced at the time.", "text": "Start with the constraints you faced at the time.", "zh": "先讲清楚当时面临的约束。", "sp": null}, {"id": "s1_0_1", "md": "\"We had three teams shipping on different schedules, and direct calls kept breaking each other's releases.\"", "text": "\"We had three teams shipping on different schedules, and direct calls kept breaking each other's releases.\"", "zh": "「当时有三个团队按不同的节奏发版，直接调用老是把彼此的发布搞挂。」", "sp": null}, {"id": "s1_0_2", "md": "Context makes an old decision look far less ==arbitrary==.", "text": "Context makes an old decision look far less arbitrary.", "zh": "有了背景，一个旧决策看起来就没那么拍脑袋了。", "sp": null}], [{"id": "s1_1_0", "md": "Then show the ==alternatives== you rejected.", "text": "Then show the alternatives you rejected.", "zh": "然后讲你否掉了哪些备选方案。", "sp": null}, {"id": "s1_1_1", "md": "\"We looked at a shared library and a single deployment, and both would have slowed every team down.\"", "text": "\"We looked at a shared library and a single deployment, and both would have slowed every team down.\"", "zh": "「我们看过共享库和统一部署，这两个方案都会拖慢每个团队。」", "sp": null}, {"id": "s1_1_2", "md": "This proves you __did your homework__ and did not just follow your gut.", "text": "This proves you did your homework and did not just follow your gut.", "zh": "这证明你做过功课，不是凭感觉拍板的。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, share the evidence and its limits.", "text": "Finally, share the evidence and its limits.", "zh": "最后，拿出证据，也讲清楚证据的局限。", "sp": null}, {"id": "s1_2_1", "md": "\"Release conflicts dropped to almost zero, but debugging got harder, and that cost is real.\"", "text": "\"Release conflicts dropped to almost zero, but debugging got harder, and that cost is real.\"", "zh": "「发布冲突基本降到了零，但排查问题变难了，这个代价是实打实的。」", "sp": null}, {"id": "s1_2_2", "md": "**Naming the downside yourself takes the weapon out of your critic's hand.**", "text": "Naming the downside yourself takes the weapon out of your critic's hand.", "zh": "自己先把缺点说出来，批评你的人手里就没了武器。", "sp": null}], [{"id": "s1_3_0", "md": "End by saying what data would change your mind.", "text": "End by saying what data would change your mind.", "zh": "结尾说一下，什么样的数据会让你改变主意。", "sp": null}, {"id": "s1_3_1", "md": "That one sentence is the difference between confidence and ==stubbornness==, and senior people __notice the difference__ right away.", "text": "That one sentence is the difference between confidence and stubbornness, and senior people notice the difference right away.", "zh": "就这一句话，区分了自信和固执，而资深的人一下子就能听出这个区别。", "sp": null}]]}], "gist": [{"q": "被质疑旧决策时，弱的回答和强的回答区别在哪？", "a": "弱的回答为结果辩护（「当时是对的、现在跑得好」），像在护面子；强的回答讲清推理过程，让大家自己判断。"}, {"q": "作者建议回答的结构是什么？", "a": "当时的约束条件 → 否掉了哪些备选方案 → 证据及其局限（主动讲代价）→ 什么数据会让你改变主意。"}, {"q": "为什么要主动说出决策的缺点？", "a": "自己先讲出代价，就等于缴了批评者的武器，也显得自信而不是固执。"}], "dictation": [{"id": "s0_2_0", "text": "You are not defending a choice; you are showing how you made it."}, {"id": "s1_2_2", "text": "Naming the downside yourself takes the weapon out of your critic's hand."}, {"id": "s1_0_2", "text": "Context makes an old decision look far less arbitrary."}, {"id": "s1_3_0", "text": "End by saying what data would change your mind."}], "shadow": {"text": "Finally, share the evidence and its limits. \"Release conflicts dropped to almost zero, but debugging got harder, and that cost is real.\" Naming the downside yourself takes the weapon out of your critic's hand.", "marked": "Finally, / share the <b>evidence</b> / and its <b>limits</b>. //<br>\"Release conflicts dropped to <b>almost zero</b>, / <b>but</b> debugging got <b>harder</b>, / and that cost is <b>real</b>.\" //<br><b>Naming</b> the downside <b>yourself</b> / takes the <b>weapon</b> / out of your critic's hand. //"}, "prompts": [{"q": "新来的总监问你：「当初为什么要自研配置中心，不直接用现成方案？」用 30 秒按「约束、备选、证据、什么会让我改主意」来回答。", "ref": "Good question. Two years ago we needed config changes to reach every region in under ten seconds, and the open source options we tested took close to a minute. We also looked at buying a hosted service, but it couldn't run inside our private network. Since then, change propagation has stayed fast and we've had no config outages. The cost is maintenance. If a hosted option now meets the latency bar, I'd be open to switching.", "ref_zh": "好问题。两年前我们要求配置变更在十秒内推到所有地区，而我们测过的开源方案都要将近一分钟。我们也考虑过买托管服务，但它没法跑在我们的内网里。从那以后，变更下发一直很快，也没出过配置相关的故障。代价是维护成本。如果现在有托管方案能达到延迟要求，我愿意考虑切过去。", "id": "ref0"}, {"q": "同事说你选的数据库「太小众、招人难」。承认这个代价，同时讲清楚当时的理由。", "ref": "That's a fair point, and I'll admit hiring is harder because of it. When we made the choice, our main constraint was write volume. The mainstream option needed three times the hardware for the same load, and we had a fixed budget. So we accepted a smaller talent pool in exchange for lower cost. If our write volume drops or the budget changes, I'd happily reopen that decision.", "ref_zh": "这个点说得对，我承认因为这个，招人确实更难了。当时做选择时，我们最主要的约束是写入量。主流方案在同样负载下需要三倍的机器，而我们的预算是固定的。所以我们用更小的人才池，换来了更低的成本。如果写入量下降了，或者预算有变化，我很乐意重新讨论这个决策。", "id": "ref1"}], "words": [{"w": "justify", "ipa": "/ˈdʒʌstɪfaɪ/", "zh": "为……辩护、证明合理", "ex": "Can we justify a new service for just two endpoints?", "id": "w0"}, {"w": "ego", "ipa": "/ˈiːɡoʊ/", "zh": "自尊心、面子", "ex": "Let's leave ego out of it and look at the benchmark.", "id": "w1"}, {"w": "sound (adj.)", "ipa": "/saʊnd/", "zh": "合理的、站得住的", "ex": "The plan is sound, but the timeline is too tight.", const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
