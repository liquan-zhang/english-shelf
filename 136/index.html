const D = {"id": "136", "type": "dialogue", "title": "Visiting a Preschool", "meta": "B2 · 约 290 词 · 场景：参观幼儿园与候补名单", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Centre Principal", "name_zh": "园长", "voice": "en-AU-NatashaNeural"}}, "gist": [{"q": "这家幼儿园一天大致怎么安排？师生比是多少？", "a": "八点半前到、自由玩耍、围圈活动、户外、午饭、一点到两点半午睡，五点开始接；一个老师带八个孩子，上午加一名助教。"}, {"q": "关于语言和过敏，园长怎么说？", "a": "双语教学，以英语为主，每天有中文老师；全园禁坚果，必要时单独做饭。"}, {"q": "报名遇到了什么问题？最后怎么安排？", "a": "一月那批已满，且外国人不能拿政府补贴；「你」把女儿排进候补名单，一般等一两个月，有空位先过一周适应期。"}], "dictation": [{"id": "s0_3_0", "text": "What does a typical day look like after that?"}, {"id": "s0_5_0", "text": "What's the ratio of teachers to children in her age group?"}, {"id": "s1_4_0", "text": "Oh, that's a shame. Could you put her on the waiting list? How long is it usually?"}, {"id": "s1_8_0", "text": "Great. I'll fill in the form today. Please let me know as soon as a spot opens up."}], "shadow": {"speaker": "A", "text": "And what languages do you use? We speak Mandarin at home, so I'd like her English to improve.", "marked": "And what <b>languages</b> / do you use? //<br>We speak <b>Mandarin</b> at home, / so I'd like her <b>English</b> / to <b>improve</b>. //"}, "prompts": [{"q": "女儿入园第一周每天早上都哭着不肯进门。跟老师沟通，问问园里通常怎么帮孩子过渡。", "ref": "Hi, I wanted to have a quick word about Mia. She's been crying every morning at the gate this week, and it's been hard for both of us. How is she after I leave? Does she settle down quickly? Is there anything you'd suggest we do at drop-off, like a shorter goodbye or bringing a toy from home?", "ref_zh": "你好，想跟你简单聊聊 Mia。她这周每天早上都在门口哭，我们俩都挺难受的。我走了以后她怎么样？能很快平静下来吗？送她的时候你建议我们怎么做，比如道别短一点，或者从家里带个玩具？", "id": "ref0"}, {"q": "你在两家幼儿园之间犹豫。打电话给其中一家，问清全年额外费用和假期安排。", "ref": "Hi, we visited your centre last week, and we're deciding between you and one other school. Could I check a few things? Apart from the monthly fee, are there any extra costs, like uniforms, meals or excursions? And how many weeks are you closed during the year? We both work full time, so holiday care is important for us.", "ref_zh": "你好，我们上周参观过你们园，现在在你们和另一家之间做决定。能问几个问题吗？除了月费，还有其他额外费用吗，比如校服、餐费或者外出活动？一年里放假关门几周？我们俩都是全职工作，所以假期能不能托管对我们很重要。", "id": "ref1"}], "words": [{"w": "nap", "ipa": "/næp/", "zh": "小睡；午睡", "ex": "He gets cranky if he misses his afternoon nap.", "id": "w0"}, {"w": "ratio", "ipa": "/ˈreɪʃioʊ/", "zh": "比例（师生比）", "ex": "The ratio is one teacher to five toddlers.", "id": "w1"}, {"w": "bilingual", "ipa": "/baɪˈlɪŋɡwəl/", "zh": "双语的", "ex": "Many kids in Singapore grow up bilingual.", "id": "w2"}, {"w": "allergy", "ipa": "/ˈælərdʒi/", "zh": "过敏", "ex": "Please tell the restaurant about your son's egg allergy.", "id": "w3"}, {"w": "registration", "ipa": "/ˌredʒɪˈstreɪʃən/", "zh": "报名；注册", "ex": "Registration for the holiday camp closes on Friday.", "id": "w4"}, {"w": "subsidy", "ipa": "/ˈsʌbsədi/", "zh": "补贴", "ex": "Citizens get a subsidy for childcare fees.", "id": "w5"}, {"w": "intake", "ipa": "/ˈɪnteɪk/", "zh": "（一批）招生名额", "ex": "The school has two intakes a year, in January and July.", "id": "w6"}, {"w": "waiting list", "ipa": "/ˈweɪtɪŋ lɪst/", "zh": "候补名单", "ex": "We've been on the waiting list for three months.", "id": "w7"}, {"w": "settling-in", "ipa": "/ˈsetlɪŋ ɪn/", "zh": "适应期的", "ex": "The settling-in period usually takes about two weeks.", "id": "w8"}, {"w": "walk through", "ipa": "/wɔːk θruː/", "zh": "一步步讲解", "ex": "Could you walk me through how the app works?", "id": "w9"}], "sections": [{"heading": "1. Touring the Centre", "heading_zh": "1. 参观幼儿园", "rows": [[{"id": "s0_0_0", "md": "Welcome! You must be Mr. Zhang. Shall I show you around first?", "text": "Welcome! You must be Mr. Zhang. Shall I show you around first?", "zh": "欢迎！您一定是张先生吧。我先带您转转？", "sp": "B"}], [{"id": "s0_1_0", "md": "Yes, please. My daughter is three, and we're looking for a place starting in January.", "text": "Yes, please. My daughter is three, and we're looking for a place starting in January.", "zh": "好的。我女儿三岁，我们在找明年一月入园的地方。", "sp": "A"}], [{"id": "s0_2_0", "md": "Lovely. This is the nursery classroom. The children arrive by eight thirty and start with free play.", "text": "Lovely. This is the nursery classroom. The children arrive by eight thirty and start with free play.", "zh": "好呀。这是小班教室。孩子们八点半前到，先自由玩耍。", "sp": "B"}], [{"id": "s0_3_0", "md": "**What does a typical day look like after that?**", "text": "What does a typical day look like after that?", "zh": "那之后一天一般是怎么安排的？", "sp": "A"}], [{"id": "s0_4_0", "md": "Circle time, outdoor play, then lunch. They have a ==nap== from one to half past two, and pick-up starts at five.", "text": "Circle time, outdoor play, then lunch. They have a nap from one to half past two, and pick-up starts at five.", "zh": "围圈活动、户外活动，然后吃午饭。一点到两点半午睡，五点开始可以接。", "sp": "B"}], [{"id": "s0_5_0", "md": "What's the ==ratio== of teachers to children in her age group?", "text": "What's the ratio of teachers to children in her age group?", "zh": "她这个年龄段的师生比是多少？", "sp": "A"}], [{"id": "s0_6_0", "md": "One teacher to eight children, plus an assistant in the mornings.", "text": "One teacher to eight children, plus an assistant in the mornings.", "zh": "一个老师带八个孩子，上午还有一名助教。", "sp": "B"}], [{"id": "s0_7_0", "md": "And what languages do you use? We speak Mandarin at home, so __I'd like her English to improve__.", "text": "And what languages do you use? We speak Mandarin at home, so I'd like her English to improve.", "zh": "你们用什么语言教学？我们在家说普通话，所以希望她的英语能提高。", "sp": "A"}], [{"id": "s0_8_0", "md": "We're ==bilingual==. Classes are mainly in English, with a Mandarin teacher every day.", "text": "We're bilingual. Classes are mainly in English, with a Mandarin teacher every day.", "zh": "我们是双语的。主要用英语上课，每天也有中文老师。", "sp": "B"}], [{"id": "s0_9_0", "md": "That sounds ideal. How do you handle food ==allergies==? She can't eat peanuts.", "text": "That sounds ideal. How do you handle food allergies? She can't eat peanuts.", "zh": "听起来很理想。你们怎么处理食物过敏？她不能吃花生。", "sp": "A"}], [{"id": "s0_10_0", "md": "We're a nut-free centre, and our cook prepares separate meals when needed.", "text": "We're a nut-free centre, and our cook prepares separate meals when needed.", "zh": "我们园里不允许有坚果，需要的话厨师会单独做饭。", "sp": "B"}]]}, {"heading": "2. Fees and the Waiting List", "heading_zh": "2. 学费与候补名单", "rows": [[{"id": "s1_0_0", "md": "Could you __walk me through__ the fees?", "text": "Could you walk me through the fees?", "zh": "能跟我详细说说费用吗？", "sp": "A"}], [{"id": "s1_1_0", "md": "Full day is one thousand four hundred dollars a month, plus a ==registration== fee and one month's deposit.", "text": "Full day is one thousand four hundred dollars a month, plus a registration fee and one month's deposit.", "zh": "全天班每月一千四百块，另外还有报名费和一个月的押金。", "sp": "B"}], [{"id": "s1_2_0", "md": "Are we eligible for any ==subsidies==? We're here on an employment pass.", "text": "Are we eligible for any subsidies? We're here on an employment pass.", "zh": "我们能申请补贴吗？我们是持工作准证在这里的。", "sp": "A"}], [{"id": "s1_3_0", "md": "I'm afraid government subsidies are only for citizens. And there's one more thing. Our January intake is actually full.", "text": "I'm afraid government subsidies are only for citizens. And there's one more thing. Our January intake is actually full.", "zh": "恐怕政府补贴只给公民。还有一件事，我们一月那批其实已经满了。", "sp": "B"}], [{"id": "s1_4_0", "md": "**Oh, that's a shame. Could you put her on the waiting list? How long is it usually?**", "text": "Oh, that's a shame. Could you put her on the waiting list? How long is it usually?", "zh": "啊，太可惜了。能把她排进候补名单吗？一般要等多久？", "sp": "A"}], [{"id": "s1_5_0", "md": "Of course. Usually one or two months. Families often move or change plans.", "text": "Of course. Usually one or two months. Families often move or change plans.", "zh": "当然可以。通常一两个月，经常有家庭搬走或者改变计划。", "sp": "B"}], [{"id": "s1_6_0", "md": "If a place opens up in February, could she do a ==settling-in== week with me there?", "text": "If a place opens const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
