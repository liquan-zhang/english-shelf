const D = {"id": "136", "type": "dialogue", "title": "Visiting a Preschool", "meta": "B2 · 约 290 词 · 场景：参观幼儿园与候补名单", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Centre Principal", "name_zh": "园长", "voice": "en-AU-NatashaNeural"}}, "gist": [{"q": "这家幼儿园一天大致怎么安排？师生比是多少？", "a": "八点半前到、自由玩耍、围圈活动、户外、午饭、一点到两点半午睡，五点开始接；一个老师带八个孩子，上午加一名助教。"}, {"q": "关于语言和过敏，园长怎么说？", "a": "双语教学，以英语为主，每天有中文老师；全园禁坚果，必要时单独做饭。"}, {"q": "报名遇到了什么问题？最后怎么安排？", "a": "一月那批已满，且外国人不能拿政府补贴；「你」把女儿排进候补名单，一般等一两个月，有空位先过一周适应期。"}], "dictation": [{"id": "s0_3_0", "text": "What does a typical day look like after that?"}, {"id": "s0_5_0", "text": "What's the ratio of teachers to children in her age group?"}, {"id": "s1_4_0", "text": "Oh, that's a shame. Could you put her on the waiting list? How long is it usually?"}, {"id": "s1_8_0", "text": "Great. I'll fill in the form today. Please let me know as soon as a spot opens up."}], "shadow": {"speaker": "A", "text": "And what languages do you use? We speak Mandarin at home, so I'd like her English to improve.", "marked": "And what <b>languages</b> / do you use? //<br>We speak <b>Mandarin</b> at home, / so I'd like her <b>English</b> / to <b>improve</b>. //"}, "prompts": [{"q": "女儿入园第一周每天早上都哭着不肯进门。跟老师沟通，问问园里通常怎么帮孩子过渡。", "ref": "Hi, I wanted to have a quick word about Mia. She's been crying every morning at the gate this week, and it's been hard for both of us. How is she after I leave? Does she settle down quickly? Is there anything you'd suggest we do at drop-off, like a shorter goodbye or bringing a toy from home?", "ref_zh": "你好，想跟你简单聊聊 Mia。她这周每天早上都在门口哭，我们俩都挺难受的。我走了以后她怎么样？能很快平静下来吗？送她的时候你建议我们怎么做，比如道别短一点，或者从家里带个玩具？", "id": "ref0"}, {"q": "你在两家幼儿园之间犹豫。打电话给其中一家，问清全年额外费用和假期安排。", "ref": "Hi, we visited your centre last week, and we're deciding between you and one other school. Could I check a few things? Apart from the monthly fee, are there any extra costs, like uniforms, meals or excursions? And how many weeks are you closed during the year? We both work full time, so holiday care is important for us.", "ref_zh": "你好，我们上周参观过你们园，现在在你们和另一家之间做决定。能问几个问题吗？除了月费，还有其他额外费用吗，比如校服、餐费或者外出活动？一年里放假关门几周？我们俩都是全职工作，所以假期能不能托管对我们很重要。", "id": "ref1"}], "words": [{"w": "nap", "ipa": "/næp/", "zh": "小睡；午睡", "ex": "He gets cranky if he misses his afternoon nap.", "id": "w0"}, {"w": "ratio", "ipa": "/ˈreɪʃioʊ/", "zh": "比例（师生比）", "ex": "The ratio is one teacher to five toddlers.", "id": "w1"}, {"w": "bilingual", "ipa": "/baɪˈlɪŋɡwəl/", "zh": "双语的", "ex": "Many kids in Singapore grow up bilingual.", "id": "w2"}, {"w": "allergy", "ipa": "/ˈælərdʒi/", "zh": "过敏", "ex": "Please tell the restaurant about your son's egg allergy.", "id": "w3"}, {"w": "registration", "ipa": "/ˌredʒɪˈstreɪʃən/", "zh": "报名；注册", "ex": "Registration for the holiday camp closes on Friday.", "id": "w4"}, {"w": "subsidy", "ipa": "/ˈsʌbsədi/", "zh": "补贴", "ex": "Citizens get a subsidy for childcare fees.", "id": "w5"}, {"w": "intake", "ipa": "/ˈɪnteɪk/", "zh": "（一批）招生名额", "ex": "The school has two intakes a year, in January and July.", "id": "w6"}, {"w": "waiting list", "ipa": "/ˈweɪtɪŋ lɪst/", "zh": "候补名单", "ex": "We've been on the waiting list for three months.", "id": "w7"}, {"w": "settling-in", "ipa": "/ˈsetlɪŋ ɪn/", "zh": "适应期的", "ex": "The settling-in period usually takes about two weeks.", "id": "w8"}, {"w": "walk through", "ipa": "/wɔːk θruː/", "zh": "一步步讲解", "ex": "Could you walk me through how the app works?", "id": "w9"}], "sections": [{"heading": "1. Touring the Centre", "heading_zh": "1. 参观幼儿园", "rows": [[{"id": "s0_0_0", "md": "Welcome! You must be Mr. Zhang. Shall I show you around first?", "text": "Welcome! You must be Mr. Zhang. Shall I show you around first?", "zh": "欢迎！您一定是张先生吧。我先带您转转？", "sp": "B"}], [{"id": "s0_1_0", "md": "Yes, please. My daughter is three, and we're looking for a place starting in January.", "text": "Yes, please. My daughter is three, and we're looking for a place starting in January.", "zh": "好的。我女儿三岁，我们在找明年一月入园的地方。", "sp": "A"}], [{"id": "s0_2_0", "md": "Lovely. This is the nursery classroom. The children arrive by eight thirty and start with free play.", "text": "Lovely. This is the nursery classroom. The children arrive by eight thirty and start with free play.", "zh": "好呀。这是小班教室。孩子们八点半前到，先自由玩耍。", "sp": "B"}], [{"id": "s0_3_0", "md": "**What does a typical day look like after that?**", "text": "What does a typical day look like after that?", "zh": "那之后一天一般是怎么安排的？", "sp": "A"}], [{"id": "s0_4_0", "md": "Circle time, outdoor play, then lunch. They have a ==nap== from one to half past two, and pick-up starts at five.", "text": "Circle time, outdoor play, then lunch. They have a nap from one to half past two, and pick-up starts at five.", "zh": "围圈活动、户外活动，然后吃午饭。一点到两点半午睡，五点开始可以接。", "sp": "B"}], [{"id": "s0_5_0", "md": "What's the ==ratio== of teachers to children in her age group?", "text": "What's the ratio of teachers to children in her age group?", "zh": "她这个年龄段的师生比是多少？", "sp": "A"}], [{"id": "s0_6_0", "md": "One teacher to eight children, plus an assistant in the mornings.", "text": "One teacher to eight children, plus an assistant in the mornings.", "zh": "一个老师带八个孩子，上午还有一名助教。", "sp": "B"}], [{"id": "s0_7_0", "md": "And what languages do you use? We speak Mandarin at home, so __I'd like her English to improve__.", "text": "And what languages do you use? We speak Mandarin at home, so I'd like her English to improve.", "zh": "你们用什么语言教学？我们在家说普通话，所以希望她的英语能提高。", "sp": "A"}], [{"id": "s0_8_0", "md": "We're ==bilingual==. Classes are mainly in English, with a Mandarin teacher every day.", "text": "We're bilingual. Classes are mainly in English, with a Mandarin teacher every day.", "zh": "我们是双语的。主要用英语上课，每天也有中文老师。", "sp": "B"}], [{"id": "s0_9_0", "md": "That sounds ideal. How do you handle food ==allergies==? She can't eat peanuts.", "text": "That sounds ideal. How do you handle food allergies? She can't eat peanuts.", "zh": "听起来很理想。你们怎么处理食物过敏？她不能吃花生。", "sp": "A"}], [{"id": "s0_10_0", "md": "We're a nut-free centre, and our cook prepares separate meals when needed.", "text": "We're a nut-free centre, and our cook prepares separate meals when needed.", "zh": "我们园里不允许有坚果，需要的话厨师会单独做饭。", "sp": "B"}]]}, {"heading": "2. Fees and the Waiting List", "heading_zh": "2. 学费与候补名单", "rows": [[{"id": "s1_0_0", "md": "Could you __walk me through__ the fees?", "text": "Could you walk me through the fees?", "zh": "能跟我详细说说费用吗？", "sp": "A"}], [{"id": "s1_1_0", "md": "Full day is one thousand four hundred dollars a month, plus a ==registration== fee and one month's deposit.", "text": "Full day is one thousand four hundred dollars a month, plus a registration fee and one month's deposit.", "zh": "全天班每月一千四百块，另外还有报名费和一个月的押金。", "sp": "B"}], [{"id": "s1_2_0", "md": "Are we eligible for any ==subsidies==? We're here on an employment pass.", "text": "Are we eligible for any subsidies? We're here on an employment pass.", "zh": "我们能申请补贴吗？我们是持工作准证在这里的。", "sp": "A"}], [{"id": "s1_3_0", "md": "I'm afraid government subsidies are only for citizens. And there's one more thing. Our January intake is actually full.", "text": "I'm afraid government subsidies are only for citizens. And there's one more thing. Our January intake is actually full.", "zh": "恐怕政府补贴只给公民。还有一件事，我们一月那批其实已经满了。", "sp": "B"}], [{"id": "s1_4_0", "md": "**Oh, that's a shame. Could you put her on the waiting list? How long is it usually?**", "text": "Oh, that's a shame. Could you put her on the waiting list? How long is it usually?", "zh": "啊，太可惜了。能把她排进候补名单吗？一般要等多久？", "sp": "A"}], [{"id": "s1_5_0", "md": "Of course. Usually one or two months. Families often move or change plans.", "text": "Of course. Usually one or two months. Families often move or change plans.", "zh": "当然可以。通常一两个月，经常有家庭搬走或者改变计划。", "sp": "B"}], [{"id": "s1_6_0", "md": "If a place opens up in February, could she do a ==settling-in== week with me there?", "text": "If a place opens const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
