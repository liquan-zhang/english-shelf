<script>
const D = {"id": "094", "title": "Async First: When Not to Have a Meeting", "meta": "B2 · 约 270 词 · 场景：异步协作", "voice": "en-IN-NeerjaNeural", "rate": "-5%", "sections": [{"heading": "1. Meetings Are the Most Expensive Default", "heading_zh": "1. 开会是最贵的默认选项", "rows": [[{"id": "s0_0_0", "md": "In a global team, a one-hour meeting with eight people is not one hour.", "text": "In a global team, a one-hour meeting with eight people is not one hour.", "zh": "在全球化团队里，八个人开一小时的会，不是一小时。", "sp": null}, {"id": "s0_0_1", "md": "It is eight hours of work, and for someone in another time zone, it might also cost them dinner with their family or an hour of sleep.", "text": "It is eight hours of work, and for someone in another time zone, it might also cost them dinner with their family or an hour of sleep.", "zh": "而是八个小时的工作量，对另一个时区的人来说，可能还要搭上和家人吃的一顿晚饭，或者一小时的睡眠。", "sp": null}, {"id": "s0_0_2", "md": "Yet we schedule meetings almost by ==reflex==.", "text": "Yet we schedule meetings almost by reflex.", "zh": "可我们约会几乎是条件反射。", "sp": null}], [{"id": "s0_1_0", "md": "Async first means the default is written, and a meeting has to ==earn== its place.", "text": "Async first means the default is written, and a meeting has to earn its place.", "zh": "异步优先的意思是，默认用文字沟通，会议得证明自己值得开。", "sp": null}, {"id": "s0_1_1", "md": "Status updates, simple decisions and information sharing can almost always happen in a document or a thread.", "text": "Status updates, simple decisions and information sharing can almost always happen in a document or a thread.", "zh": "进度同步、简单决策和信息共享，几乎都可以在文档或者消息串里完成。", "sp": null}, {"id": "s0_1_2", "md": "**If a meeting could be replaced by a well-written message, it should be.**", "text": "If a meeting could be replaced by a well-written message, it should be.", "zh": "如果一个会能用一条写得好的消息替代，那就该替代。", "sp": null}], [{"id": "s0_2_0", "md": "Async work also helps people who think better in writing, including many colleagues working in a second language.", "text": "Async work also helps people who think better in writing, including many colleagues working in a second language.", "zh": "异步工作也能帮到那些写下来想得更清楚的人，包括很多用第二语言工作的同事。", "sp": null}, {"id": "s0_2_1", "md": "They get time to read, ==reflect== and reply with their best ideas instead of their fastest ones.", "text": "They get time to read, reflect and reply with their best ideas instead of their fastest ones.", "zh": "他们有时间读、想，然后回复自己最好的想法，而不是最快的想法。", "sp": null}, {"id": "s0_2_2", "md": "In a live call, the quickest speaker often wins, even when the quietest person had the better idea.", "text": "In a live call, the quickest speaker often wins, even when the quietest person had the better idea.", "zh": "在实时会议上，往往是嘴最快的人赢，哪怕最安静的那个人想法更好。", "sp": null}]]}, {"heading": "2. Three Reasons to Meet Anyway", "heading_zh": "2. 还是值得开会的三种情况", "rows": [[{"id": "s1_0_0", "md": "Async is not always the answer.", "text": "Async is not always the answer.", "zh": "异步也不是万能的。", "sp": null}, {"id": "s1_0_1", "md": "Before booking a call, ask yourself whether at least one of these three things is true.", "text": "Before booking a call, ask yourself whether at least one of these three things is true.", "zh": "约会之前，先问问自己，下面三条里是不是至少有一条成立。", "sp": null}], [{"id": "s1_1_0", "md": "First, there is a ==conflict== that has gone back and forth in comments more than twice.", "text": "First, there is a conflict that has gone back and forth in comments more than twice.", "zh": "第一，有个分歧在评论里已经来回拉扯了不止两轮。", "sp": null}, {"id": "s1_1_1", "md": "Long threads harden positions, and ten minutes of talking often __clears the air__.", "text": "Long threads harden positions, and ten minutes of talking often clears the air.", "zh": "消息串越长，各自的立场就越固化，聊上十分钟往往就能把话说开。", "sp": null}], [{"id": "s1_2_0", "md": "Second, the problem is still ==fuzzy==.", "text": "Second, the problem is still fuzzy.", "zh": "第二，问题本身还很模糊。", "sp": null}, {"id": "s1_2_1", "md": "When nobody can describe the question clearly yet, a quick ==brainstorm== is faster than a document that nobody knows how to start.", "text": "When nobody can describe the question clearly yet, a quick brainstorm is faster than a document that nobody knows how to start.", "zh": "当谁都还说不清问题是什么的时候，快速脑暴一下，比写一份没人知道从哪下笔的文档要快。", "sp": null}], [{"id": "s1_3_0", "md": "Third, the topic is ==delicate==, such as feedback, a reorganization, or bad news.", "text": "Third, the topic is delicate, such as feedback, a reorganization, or bad news.", "zh": "第三，话题比较敏感，比如给反馈、组织调整，或者坏消息。", "sp": null}, {"id": "s1_3_1", "md": "**Hard conversations deserve a human voice, not a block of text.**", "text": "Hard conversations deserve a human voice, not a block of text.", "zh": "难开口的谈话，值得用人的声音来讲，而不是一大段文字。", "sp": null}, {"id": "s1_3_2", "md": "If none of these apply, __write it up__, __set a deadline__ for comments, and give people their hour back.", "text": "If none of these apply, write it up, set a deadline for comments, and give people their hour back.", "zh": "如果这三条都不沾边，那就写下来，定一个评论截止时间，把这一小时还给大家。", "sp": null}]]}], "gist": [{"q": "为什么作者说会议是“最贵的默认选项”？", "a": "八个人开一小时会就是八小时工作量，对其他时区的人还可能占用晚饭或睡眠，而我们却习惯性地约会。"}, {"q": "异步优先对哪些人特别有帮助？", "a": "擅长书面思考的人，包括用第二语言工作的同事，他们有时间阅读、思考，给出最好而不是最快的想法。"}, {"q": "什么情况下仍然应该开会？", "a": "评论区来回超过两轮的分歧；问题还很模糊、需要头脑风暴；话题敏感（反馈、组织调整、坏消息）。否则写下来、设评论截止时间。"}], "dictation": [{"id": "s0_1_2", "text": "If a meeting could be replaced by a well-written message, it should be."}, {"id": "s0_1_0", "text": "Async first means the default is written, and a meeting has to earn its place."}, {"id": "s1_2_0", "text": "Second, the problem is still fuzzy."}, {"id": "s1_3_1", "text": "Hard conversations deserve a human voice, not a block of text."}], "shadow": {"text": "Async first means the default is written, and a meeting has to earn its place. Status updates, simple decisions and information sharing can almost always happen in a document or a thread. If a meeting could be replaced by a well-written message, it should be.", "marked": "Async <b>first</b> means / the default is <b>written</b>, / and a meeting has to <b>earn</b> its place. //<br><b>Status</b> updates, / simple <b>decisions</b> / and information sharing / can almost <b>always</b> happen / in a document or a <b>thread</b>. //<br>If a meeting could be <b>replaced</b> / by a well-written <b>message</b>, / it <b>should</b> be. //"}, "prompts": [{"q": "老板要求每周一开一小时的全员同步会，参会者分布在四个时区。你提议改成异步更新，30 秒说服他。", "ref": "I'd like to suggest a change to the Monday sync. Most of that hour is status updates, which people could write in a shared doc by Monday noon their time. That saves about eight hours of team time every week, and our Sydney colleagues get their evenings back. We could keep a short call once a month for planning and real discussion.", "ref_zh": "关于周一的同步会，我想提个调整。那一小时大部分都是进度更新，大家完全可以在各自时区的周一中午前写进一个共享文档。这样每周能省下团队大约八个小时，悉尼的同事也能把晚上拿回来。我们可以每月保留一次短会，用来做规划和真正需要讨论的事。", "id": "ref0"}, {"q": "一个设计方案在评论区来回吵了三轮仍无结论。你提议开一个短会。", "ref": "I think this thread has reached the point where writing is slowing us down. We've gone back and forth three times, and I'm not sure we're even disagreeing about the same thing. Can we jump on a fifteen-minute call tomorrow at four Singapore time? I'll summarize both options at the top of the doc first, so we start from the same page.", "ref_zh": "我觉得这个讨论串已经到了文字反而在拖慢我们的地步。我们来回了三轮，我都不确定我们争的是不是同一件事。明天新加坡时间四点开个十五分钟的短会行吗？我先在文档顶部把两个方案总结一下，这样我们从同一个起点开始。", "id": "ref1"}], "words": [{"w": "reflex", "ipa": "/ˈriːfleks/", "zh": "条件反射、本能反应", "ex": "Don't book a meeting by reflex, check if a message would work.", "id": "w0"}, {"w": "earn (v.)", "ipa": "/ɜːrn/", "zh": "赢得、挣得", "ex": "A recurring meeting has to earn its place on the calendar.", "tts_w": "earn", "id": "w1"}, {"w": "reflect", "ipa": "/rɪˈflekt/", "zh": "思考、反思", "ex": "Give people a day to reflect before you ask for a decision.", "id": "w2"}, {"w": "conflict", "ipa": "/ˈkɑːnflɪkt/", "zh": "冲突、分歧", "ex": "There's a conflict between the two teams' roadmaps.", "id": "w3"}, {"w": "fuzzy", "ipa": "/ˈfʌzi/", "zh": "模糊的、不清楚的", "ex": "The scope is still fuzzy, so let's not estimate yet.", "id": "w4"}, {"w": "brainstorm", "ipa": "/ˈbreɪnˌstɔːrm/", "zh": "头脑风暴", "ex": "Let's do a quick brainstorm before anyone writes a proposal.", "id": "w5"}, {"w": "delicate", "ipa": "/ˈdelɪkət/", "zh": "微妙的、需小心处理的", "ex": "Headcount changes are a delicate topic, I'll tell them in person.", "id": "w6"}, {"w": "async", "ipa": "/ˈeɪsɪŋk/", "zh": "异步（的）", "ex": "We run most of our planning async now, in a shared document.", "id": "w7"}, {"w": "clear the air", "ipa": "/klɪr ði er/", "zh": "消除误会、缓和气氛", "ex": "A short call cleared the air after that tense email thread.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Meetings Are the Most Expensive Default", "zh": "1. 开会是最贵的默认选项", "start": 0.0, "end": 4.176, "words": [[0.1, 0.639], [0.666, 1.232], [1.245, 1.35], [1.363, 1.429], [1.442, 1.863], [1.876, 2.574], [2.587, 3.258]]}, {"kind": "s", "id": "s0_0_0", "md": "In a global team, a one-hour meeting with eight people is not one hour.", "zh": "在全球化团队里，八个人开一小时的会，不是一小时。", "sp": null, "gap": false, "start": 4.176, "end": 9.696, "words": [[4.276, 4.5], [4.513, 4.565], [4.579, 5.052], [5.065, 5.5], [5.631, 5.776], [5.789, 6.158], [6.171, 6.618], [6.631, 6.868], [6.881, 7.105], [7.118, 7.539], [7.552, 7.763], [7.776, 8.079], [8.092, 8.434], [8.447, 8.763]]}, {"kind": "s", "id": "s0_0_1", "md": "It is eight hours of work, and for someone in another time zone, it might also cost them dinner with their family or an hour of sleep.", "zh": "而是八个小时的工作量，对另一个时区的人来说，可能还要搭上和家人吃的一顿晚饭，或者一小时的睡眠。", "sp": null, "gap": false, "start": 9.696, "end": 19.296, "words": [[9.796, 10.02], [10.033, 10.204], [10.217, 10.493], [10.507, 10.796], [10.809, 10.941], [10.954, 11.375], [11.507, 11.77], [11.783, 11.928], [11.941, 12.428], [12.441, 12.599], [12.612, 13.072], [13.085, 13.401], [13.414, 13.862], [13.993, 14.164], [14.178, 14.454], [14.467, 14.862], [14.875, 15.309], [15.322, 15.572], [15.585, 15.993], [16.007, 16.204 , 121.482], [121.495, 121.653], [121.666, 122.232], [122.39, 122.653], [122.666, 122.903], [122.916, 123.324], [123.337, 123.574], [123.587, 123.705], [123.719, 124.153]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
