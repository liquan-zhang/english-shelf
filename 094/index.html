<script>
const D = {"id": "094", "title": "Async First: When Not to Have a Meeting", "meta": "B2 · 约 270 词 · 场景：异步协作", "voice": "en-IN-NeerjaNeural", "rate": "-5%", "sections": [{"heading": "1. Meetings Are the Most Expensive Default", "heading_zh": "1. 开会是最贵的默认选项", "rows": [[{"id": "s0_0_0", "md": "In a global team, a one-hour meeting with eight people is not one hour.", "text": "In a global team, a one-hour meeting with eight people is not one hour.", "zh": "在全球化团队里，八个人开一小时的会，不是一小时。", "sp": null}, {"id": "s0_0_1", "md": "It is eight hours of work, and for someone in another time zone, it might also cost them dinner with their family or an hour of sleep.", "text": "It is eight hours of work, and for someone in another time zone, it might also cost them dinner with their family or an hour of sleep.", "zh": "而是八个小时的工作量，对另一个时区的人来说，可能还要搭上和家人吃的一顿晚饭，或者一小时的睡眠。", "sp": null}, {"id": "s0_0_2", "md": "Yet we schedule meetings almost by ==reflex==.", "text": "Yet we schedule meetings almost by reflex.", "zh": "可我们约会几乎是条件反射。", "sp": null}], [{"id": "s0_1_0", "md": "Async first means the default is written, and a meeting has to ==earn== its place.", "text": "Async first means the default is written, and a meeting has to earn its place.", "zh": "异步优先的意思是，默认用文字沟通，会议得证明自己值得开。", "sp": null}, {"id": "s0_1_1", "md": "Status updates, simple decisions and information sharing can almost always happen in a document or a thread.", "text": "Status updates, simple decisions and information sharing can almost always happen in a document or a thread.", "zh": "进度同步、简单决策和信息共享，几乎都可以在文档或者消息串里完成。", "sp": null}, {"id": "s0_1_2", "md": "**If a meeting could be replaced by a well-written message, it should be.**", "text": "If a meeting could be replaced by a well-written message, it should be.", "zh": "如果一个会能用一条写得好的消息替代，那就该替代。", "sp": null}], [{"id": "s0_2_0", "md": "Async work also helps people who think better in writing, including many colleagues working in a second language.", "text": "Async work also helps people who think better in writing, including many colleagues working in a second language.", "zh": "异步工作也能帮到那些写下来想得更清楚的人，包括很多用第二语言工作的同事。", "sp": null}, {"id": "s0_2_1", "md": "They get time to read, ==reflect== and reply with their best ideas instead of their fastest ones.", "text": "They get time to read, reflect and reply with their best ideas instead of their fastest ones.", "zh": "他们有时间读、想，然后回复自己最好的想法，而不是最快的想法。", "sp": null}, {"id": "s0_2_2", "md": "In a live call, the quickest speaker often wins, even when the quietest person had the better idea.", "text": "In a live call, the quickest speaker often wins, even when the quietest person had the better idea.", "zh": "在实时会议上，往往是嘴最快的人赢，哪怕最安静的那个人想法更好。", "sp": null}]]}, {"heading": "2. Three Reasons to Meet Anyway", "heading_zh": "2. 还是值得开会的三种情况", "rows": [[{"id": "s1_0_0", "md": "Async is not always the answer.", "text": "Async is not always the answer.", "zh": "异步也不是万能的。", "sp": null}, {"id": "s1_0_1", "md": "Before booking a call, ask yourself whether at least one of these three things is true.", "text": "Before booking a call, ask yourself whether at least one of these three things is true.", "zh": "约会之前，先问问自己，下面三条里是不是至少有一条成立。", "sp": null}], [{"id": "s1_1_0", "md": "First, there is a ==conflict== that has gone back and forth in comments more than twice.", "text": "First, there is a conflict that has gone back and forth in comments more than twice.", "zh": "第一，有个分歧在评论里已经来回拉扯了不止两轮。", "sp": null}, {"id": "s1_1_1", "md": "Long threads harden positions, and ten minutes of talking often __clears the air__.", "text": "Long threads harden positions, and ten minutes of talking often clears the air.", "zh": "消息串越长，各自的立场就越固化，聊上十分钟往往就能把话说开。", "sp": null}], [{"id": "s1_2_0", "md": "Second, the problem is still ==fuzzy==.", "text": "Second, the problem is still fuzzy.", "zh": "第二，问题本身还很模糊。", "sp": null}, {"id": "s1_2_1", "md": "When nobody can describe the question clearly yet, a quick ==brainstorm== is faster than a document that nobody knows how to start.", "text": "When nobody can describe the question clearly yet, a quick brainstorm is faster than a document that nobody knows how to start.", "zh": "当谁都还说不清问题是什么的时候，快速脑暴一下，比写一份没人知道从哪下笔的文档要快。", "sp": null}], [{"id": "s1_3_0", "md": "Third, the topic is ==delicate==, such as feedback, a reorganization, or bad news.", "text": "Third, the topic is delicate, such as feedback, a reorganization, or bad news.", "zh": "第三，话题比较敏感，比如给反馈、组织调整，或者坏消息。", "sp": null}, {"id": "s1_3_1", "md": "**Hard conversations deserve a human voice, not a block of text.**", "text": "Hard conversations deserve a human voice, not a block of text.", "zh": "难开口的谈话，值得用人的声音来讲，而不是一大段文字。", "sp": null}, {"id": "s1_3_2", "md": "If none of these apply, __write it up__, __set a deadline__ for comments, and give people their hour back.", "text": "If none of these apply, write it up, set a deadline for comments, and give people their hour back.", "zh": "如果这三条都不沾边，那就写下来，定一个评论截止时间，把这一小时还给大家。", "sp": null}]]}], "gist": [{"q": "为什么作者说会议是“最贵的默认选项”？", "a": "八个人开一小时会就是八小时工作量，对其他时区的人还可能占用晚饭或睡眠，而我们却习惯性地约会。"}, {"q": "异步优先对哪些人特别有帮助？", "a": "擅长书面思考的人，包括用第二语言工作的同事，他们有时间阅读、思考，给出最好而不是最快的想法。"}, {"q": "什么情况下仍然应该开会？", "a": "评论区来回超过两轮的分歧；问题还很模糊、需要头脑风暴；话题敏感（反馈、组织调整、坏消息）。否则写下来、设评论截止时间。"}], "dictation": [{"id": "s0_1_2", "text": "If a meeting could be replaced by a well-written message, it should be."}, {"id": "s0_1_0", "text": "Async first means the default is written, and a meeting has to earn its place."}, {"id": "s1_2_0", "text": "Second, the problem is still fuzzy."}, {"id": "s1_3_1", "text": "Hard conversations deserve a human voice, not a block of text."}], "shadow": {"text": "Async first means the default is written, and a meeting has to earn its place. Status updates, simple decisions and information sharing can almost always happen in a document or a thread. If a meeting could be replaced by a well-written message, it should be.", "marked": "Async <b>first</b> means / the default is <b>written</b>, / and a meeting has to <b>earn</b> its place. //<br><b>Status</b> updates, / simple <b>decisions</b> / and information sharing / can almost <b>always</b> happen / in a document or a <b>thread</b>. //<br>If a meeting could be <b>replaced</b> / by a well-written <b>message</b>, / it <b>should</b> be. //"}, "prompts": [{"q": "老板要求每周一开一小时的全员同步会，参会者分布在四个时区。你提议改成异步更新，30 秒说服他。", "ref": "I'd like to suggest a change to the Monday sync. Most of that hour is status updates, which people could write in a shared doc by Monday noon their time. That saves about eight hours of team time every week, and our Sydney colleagues get their evenings back. We could keep a short call once a month for planning and real discussion.", "ref_zh": "关于周一的同步会，我想提个调整。那一小时大部分都是进度更新，大家完全可以在各自时区的周一中午前写进一个共享文档。这样每周能省下团队大约八个小时，悉尼的同事也能把晚上拿回来。我们可以每月保留一次短会，用来做规划和真正需要讨论的事。", "id": "ref0"}, {"q": "一个设计方案在评论区来回吵了三轮仍无结论。你提议开一个短会。", "ref": "I think this thread has reached the point where writing is slowing us down. We've gone back and forth three times, and I'm not sure we're even disagreeing about the same thing. Can we jump on a fifteen-minute call tomorrow at four Singapore time? I'll summarize both options at the top of the doc first, so we start from the same page.", "ref_zh": "我觉得这个讨论串已经到了文字反而在拖慢我们的地步。我们来回了三轮，我都不确定我们争的是不是同一件事。明天新加坡时间四点开个十五分钟的短会行吗？我先在文档顶部把两个方案总结一下，这样我们从同一个起点开始。", "id": "ref1"}], "words": [{"w": "reflex", "ipa": "/ˈriːfleks/", "zh": "条件反射、本能反应", "ex": "Don't book a meeting by reflex, check if a message would work.", "id": "w0"}, {"w": "earn (v.)", "ipa": "/ɜːrn/", "zh": "赢得、挣得", "ex": "A recurring meeting has to earn its place on the calendar.", "tts_w": "earn", "id": "w1"}, {"w": "reflect", "ipa": "/rɪˈflekt/", "zh": "思考、反思", "ex": "Give people a day to reflect before you ask for a decision.", "id": "w2"}, {"w": "conflict", "ipa": "/ˈkɑːnflɪkt/", "zh": "冲突、分歧", "ex": "There's a conflict between the two teams' roadmaps.", "id": "w3"}, {"w": "fuzzy", "ipa": "/ˈfʌzi/", "zh": "模糊的、 const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {

function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
