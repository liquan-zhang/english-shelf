const D = {"id": "150", "type": "dialogue", "title": "Asking for Directions", "meta": "B2 · 约 280 词 · 场景：带孩子问路去科学馆", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Passer-by", "name_zh": "路人", "voice": "en-AU-WilliamMultilingualNeural"}}, "gist": [{"q": "去科学馆有哪两种方式？「你」为什么选了走路？", "a": "走路大约十五分钟，或者坐六十六路公交两站；公交午饭时间很挤，所以选了走路。"}, {"q": "原本的路线怎么走？后来遇到了什么问题？", "a": "直走到红绿灯左转，过天桥后在右手边；但天桥在维修封了，只能往前一百米走下一个路口的人行横道。"}, {"q": "回程打车和去地铁站有什么建议？", "a": "正门口有出租车站，用 Grab 叫车的话上车点在停车场旁边；走回地铁站大约十分钟，跟着裕廊东的指示牌走。"}], "dictation": [{"id": "s0_0_0", "text": "Excuse me, sorry to bother you. Could you tell me how to get to the Science Centre from here?"}, {"id": "s0_8_0", "text": "So straight on, left at the lights, over the bridge, and it's on my right?"}, {"id": "s1_3_0", "text": "Oh no. Is there another way across?"}, {"id": "s1_7_0", "text": "That's really helpful. Is it walking distance back to the MRT from there?"}], "shadow": {"speaker": "A", "text": "So straight on, left at the lights, over the bridge, and it's on my right?", "marked": "So <b>straight</b> on, / <b>left</b> at the lights, / <b>over</b> the bridge, / and it's on my <b>right</b>? //"}, "prompts": [{"q": "你在牛车水找不到预约好的诊所。拦住路人，说出诊所名字和街名，问怎么走、要多久。", "ref": "Excuse me, sorry to trouble you. I'm looking for a clinic called Family Care Medical on Smith Street. My map says it's around here, but I can't seem to find it. Do you know which way Smith Street is? And roughly how long would it take to walk there? My appointment is in ten minutes.", "ref_zh": "不好意思打扰一下。我在找一家叫 Family Care Medical 的诊所，在史密斯街。地图上显示就在这附近，但我怎么也找不到。您知道史密斯街往哪边走吗？走过去大概要多久？我的预约还有十分钟就到了。", "id": "ref0"}, {"q": "一位游客在你家附近的地铁站向你问路，要去植物园。用 30 秒给出清楚的指引，并提一个实用建议。", "ref": "Sure, the Botanic Gardens is on the Circle Line, so you don't need to change trains. Just take this line towards HarbourFront and get off at Botanic Gardens station. It's about six stops. When you come out, use exit A, and the entrance is right there. Bring some water, though. It's a big place, and it gets hot.", "ref_zh": "没问题，植物园就在环线上，不用换乘。坐这条线往港湾方向，在植物园站下车，大概六站。出站后走 A 出口，入口就在旁边。不过记得带水，园子很大，天也热。", "id": "ref1"}], "words": [{"w": "traffic lights", "ipa": "/ˈtræfɪk laɪts/", "zh": "红绿灯", "ex": "Turn right at the second set of traffic lights.", "id": "w0"}, {"w": "overhead bridge", "ipa": "/ˈoʊvərhed brɪdʒ/", "zh": "过街天桥", "ex": "Use the overhead bridge to get to the bus stop.", "id": "w1"}, {"w": "miss (v.)", "ipa": "/mɪs/", "zh": "错过，看漏", "ex": "The restaurant is huge. You can't miss it.", "tts_w": "miss", "id": "w2"}, {"w": "sheltered", "ipa": "/ˈʃeltərd/", "zh": "有遮挡的，带顶棚的", "ex": "There's a sheltered walkway from the MRT to the mall.", "id": "w3"}, {"w": "repair", "ipa": "/rɪˈper/", "zh": "维修", "ex": "The lift is closed for repairs until Friday.", "id": "w4"}, {"w": "detour", "ipa": "/ˈdiːtʊr/", "zh": "绕行路线", "ex": "We had to take a detour because of the roadworks.", "id": "w5"}, {"w": "pedestrian", "ipa": "/pəˈdestriən/", "zh": "行人；行人的", "ex": "Always use the pedestrian crossing with your kids.", "id": "w6"}, {"w": "entrance", "ipa": "/ˈentrəns/", "zh": "入口", "ex": "Let's meet at the main entrance at six.", "id": "w7"}, {"w": "pick-up point", "ipa": "/ˈpɪk ʌp pɔɪnt/", "zh": "上车点；取货点", "ex": "The Grab pick-up point is at the side of the hotel.", "id": "w8"}], "sections": [{"heading": "1. Which Way to the Science Centre?", "heading_zh": "1. 科学馆怎么走", "rows": [[{"id": "s0_0_0", "md": "**Excuse me, sorry to bother you. Could you tell me how to get to the Science Centre from here?**", "text": "Excuse me, sorry to bother you. Could you tell me how to get to the Science Centre from here?", "zh": "不好意思打扰一下。请问从这里去科学馆怎么走？", "sp": "A"}], [{"id": "s0_1_0", "md": "Sure. Are you walking, or taking the bus?", "text": "Sure. Are you walking, or taking the bus?", "zh": "好啊。您是走路，还是坐公交？", "sp": "B"}], [{"id": "s0_2_0", "md": "Whichever is easier. I've got my son with me, and he's only three.", "text": "Whichever is easier. I've got my son with me, and he's only three.", "zh": "哪个方便就哪个。我带着儿子，他才三岁。", "sp": "A"}], [{"id": "s0_3_0", "md": "It's about fifteen minutes on foot. Or you can take bus sixty-six from the stop across the road. It's just two stops.", "text": "It's about fifteen minutes on foot. Or you can take bus sixty-six from the stop across the road. It's just two stops.", "zh": "走路大概十五分钟。或者在马路对面的车站坐六十六路，只有两站。", "sp": "B"}], [{"id": "s0_4_0", "md": "__How often does__ the bus come?", "text": "How often does the bus come?", "zh": "公交多久来一班？", "sp": "A"}], [{"id": "s0_5_0", "md": "Every ten minutes or so, but it gets packed around lunchtime.", "text": "Every ten minutes or so, but it gets packed around lunchtime.", "zh": "大概十分钟一班，不过午饭时间会很挤。", "sp": "B"}], [{"id": "s0_6_0", "md": "We'll walk, then. Which way do I go?", "text": "We'll walk, then. Which way do I go?", "zh": "那我们走路吧。往哪边走？", "sp": "A"}], [{"id": "s0_7_0", "md": "Go straight down this road until you hit the ==traffic lights==, then turn left. Cross the ==overhead bridge==, and you'll see it on your right.", "text": "Go straight down this road until you hit the traffic lights, then turn left. Cross the overhead bridge, and you'll see it on your right.", "zh": "沿这条路一直走到红绿灯，然后左转。过了天桥，就在您右手边。", "sp": "B"}], [{"id": "s0_8_0", "md": "**So straight on, left at the lights, over the bridge, and it's on my right?**", "text": "So straight on, left at the lights, over the bridge, and it's on my right?", "zh": "所以是直走，红绿灯左转，过天桥，然后在我右边，对吗？", "sp": "A"}], [{"id": "s0_9_0", "md": "Exactly. You can't ==miss== it. There's a ==sheltered== walkway most of the way, so you won't get wet.", "text": "Exactly. You can't miss it. There's a sheltered walkway most of the way, so you won't get wet.", "zh": "没错，一眼就能看到。大部分路段都有带顶棚的走廊，下雨也淋不着。", "sp": "B"}]]}, {"heading": "2. A Detour", "heading_zh": "2. 临时绕路", "rows": [[{"id": "s1_0_0", "md": "Actually, I'm heading that way too. I'll walk with you as far as the const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
