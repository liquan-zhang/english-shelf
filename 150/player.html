const D = {"id": "150", "type": "dialogue", "title": "Asking for Directions", "meta": "B2 · 约 280 词 · 场景：带孩子问路去科学馆", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Passer-by", "name_zh": "路人", "voice": "en-AU-WilliamMultilingualNeural"}}, "gist": [{"q": "去科学馆有哪两种方式？「你」为什么选了走路？", "a": "走路大约十五分钟，或者坐六十六路公交两站；公交午饭时间很挤，所以选了走路。"}, {"q": "原本的路线怎么走？后来遇到了什么问题？", "a": "直走到红绿灯左转，过天桥后在右手边；但天桥在维修封了，只能往前一百米走下一个路口的人行横道。"}, {"q": "回程打车和去地铁站有什么建议？", "a": "正门口有出租车站，用 Grab 叫车的话上车点在停车场旁边；走回地铁站大约十分钟，跟着裕廊东的指示牌走。"}], "dictation": [{"id": "s0_0_0", "text": "Excuse me, sorry to bother you. Could you tell me how to get to the Science Centre from here?"}, {"id": "s0_8_0", "text": "So straight on, left at the lights, over the bridge, and it's on my right?"}, {"id": "s1_3_0", "text": "Oh no. Is there another way across?"}, {"id": "s1_7_0", "text": "That's really helpful. Is it walking distance back to the MRT from there?"}], "shadow": {"speaker": "A", "text": "So straight on, left at the lights, over the bridge, and it's on my right?", "marked": "So <b>straight</b> on, / <b>left</b> at the lights, / <b>over</b> the bridge, / and it's on my <b>right</b>? //"}, "prompts": [{"q": "你在牛车水找不到预约好的诊所。拦住路人，说出诊所名字和街名，问怎么走、要多久。", "ref": "Excuse me, sorry to trouble you. I'm looking for a clinic called Family Care Medical on Smith Street. My map says it's around here, but I can't seem to find it. Do you know which way Smith Street is? And roughly how long would it take to walk there? My appointment is in ten minutes.", "ref_zh": "不好意思打扰一下。我在找一家叫 Family Care Medical 的诊所，在史密斯街。地图上显示就在这附近，但我怎么也找不到。您知道史密斯街往哪边走吗？走过去大概要多久？我的预约还有十分钟就到了。", "id": "ref0"}, {"q": "一位游客在你家附近的地铁站向你问路，要去植物园。用 30 秒给出清楚的指引，并提一个实用建议。", "ref": "Sure, the Botanic Gardens is on the Circle Line, so you don't need to change trains. Just take this line towards HarbourFront and get off at Botanic Gardens station. It's about six stops. When you come out, use exit A, and the entrance is right there. Bring some water, though. It's a big place, and it gets hot.", "ref_zh": "没问题，植物园就在环线上，不用换乘。坐这条线往港湾方向，在植物园站下车，大概六站。出站后走 A 出口，入口就在旁边。不过记得带水，园子很大，天也热。", "id": "ref1"}], "words": [{"w": "traffic lights", "ipa": "/ˈtræfɪk laɪts/", "zh": "红绿灯", "ex": "Turn right at the second set of traffic lights.", "id": "w0"}, {"w": "overhead bridge", "ipa": "/ˈoʊvərhed brɪdʒ/", "zh": "过街天桥", "ex": "Use the overhead bridge to get to the bus stop.", "id": "w1"}, {"w": "miss (v.)", "ipa": "/mɪs/", "zh": "错过，看漏", "ex": "The restaurant is huge. You can't miss it.", "tts_w": "miss", "id": "w2"}, {"w": "sheltered", "ipa": "/ˈʃeltərd/", "zh": "有遮挡的，带顶棚的", "ex": "There's a sheltered walkway from the MRT to the mall.", "id": "w3"}, {"w": "repair", "ipa": "/rɪˈper/", "zh": "维修", "ex": "The lift is closed for repairs until Friday.", "id": "w4"}, {"w": "detour", "ipa": "/ˈdiːtʊr/", "zh": "绕行路线", "ex": "We had to take a detour because of the roadworks.", "id": "w5"}, {"w": "pedestrian", "ipa": "/pəˈdestriən/", "zh": "行人；行人的", "ex": "Always use the pedestrian crossing with your kids.", "id": "w6"}, {"w": "entrance", "ipa": "/ˈentrəns/", "zh": "入口", "ex": "Let's meet at the main entrance at six.", "id": "w7"}, {"w": "pick-up point", "ipa": "/ˈpɪk ʌp pɔɪnt/", "zh": "上车点；取货点", "ex": "The Grab pick-up point is at the side of the hotel.", "id": "w8"}], "sections": [{"heading": "1. Which Way to the Science Centre?", "heading_zh": "1. 科学馆怎么走", "rows": [[{"id": "s0_0_0", "md": "**Excuse me, sorry to bother you. Could you tell me how to get to the Science Centre from here?**", "text": "Excuse me, sorry to bother you. Could you tell me how to get to the Science Centre from here?", "zh": "不好意思打扰一下。请问从这里去科学馆怎么走？", "sp": "A"}], [{"id": "s0_1_0", "md": "Sure. Are you walking, or taking the bus?", "text": "Sure. Are you walking, or taking the bus?", "zh": "好啊。您是走路，还是坐公交？", "sp": "B"}], [{"id": "s0_2_0", "md": "Whichever is easier. I've got my son with me, and he's only three.", "text": "Whichever is easier. I've got my son with me, and he's only three.", "zh": "哪个方便就哪个。我带着儿子，他才三岁。", "sp": "A"}], [{"id": "s0_3_0", "md": "It's about fifteen minutes on foot. Or you can take bus sixty-six from the stop across the road. It's just two stops.", "text": "It's about fifteen minutes on foot. Or you can take bus sixty-six from the stop across the road. It's just two stops.", "zh": "走路大概十五分钟。或者在马路对面的车站坐六十六路，只有两站。", "sp": "B"}], [{"id": "s0_4_0", "md": "__How often does__ the bus come?", "text": "How often does the bus come?", "zh": "公交多久来一班？", "sp": "A"}], [{"id": "s0_5_0", "md": "Every ten minutes or so, but it gets packed around lunchtime.", "text": "Every ten minutes or so, but it gets packed around lunchtime.", "zh": "大概十分钟一班，不过午饭时间会很挤。", "sp": "B"}], [{"id": "s0_6_0", "md": "We'll walk, then. Which way do I go?", "text": "We'll walk, then. Which way do I go?", "zh": "那我们走路吧。往哪边走？", "sp": "A"}], [{"id": "s0_7_0", "md": "Go straight down this road until you hit the ==traffic lights==, then turn left. Cross the ==overhead bridge==, and you'll see it on your right.", "text": "Go straight down this road until you hit the traffic lights, then turn left. Cross the overhead bridge, and you'll see it on your right.", "zh": "沿这条路一直走到红绿灯，然后左转。过了天桥，就在您右手边。", "sp": "B"}], [{"id": "s0_8_0", "md": "**So straight on, left at the lights, over the bridge, and it's on my right?**", "text": "So straight on, left at the lights, over the bridge, and it's on my right?", "zh": "所以是直走，红绿灯左转，过天桥，然后在我右边，对吗？", "sp": "A"}], [{"id": "s0_9_0", "md": "Exactly. You can't ==miss== it. There's a ==sheltered== walkway most of the way, so you won't get wet.", "text": "Exactly. You can't miss it. There's a sheltered walkway most of the way, so you won't get wet.", "zh": "没错，一眼就能看到。大部分路段都有带顶棚的走廊，下雨也淋不着。", "sp": "B"}]]}, {"heading": "2. A Detour", "heading_zh": "2. 临时绕路", "rows": [[{"id": "s1_0_0", "md": "Actually, I'm heading that way too. I'll walk with you as far as the const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
