<script>
const D = {"id": "041", "title": "Getting Help from a Team That Owes You Nothing", "meta": "B2 · 约 290 词 · 场景：跨团队求助", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Hidden Cost of Your Request", "heading_zh": "1. 你的请求背后的隐性成本", "rows": [[{"id": "s0_0_0", "md": "You need a small change from the payments team, and they have no reason to give it to you.", "text": "You need a small change from the payments team, and they have no reason to give it to you.", "zh": "你需要支付团队帮你改个小东西，可他们没有任何理由要帮你。", "sp": null}, {"id": "s0_0_1", "md": "Their roadmap is full, their manager has never heard of your project, and your deadline is not their problem.", "text": "Their roadmap is full, their manager has never heard of your project, and your deadline is not their problem.", "zh": "他们的 roadmap 已经排满了，他们老板压根没听说过你的项目，你的 deadline 也不是他们的事。", "sp": null}, {"id": "s0_0_2", "md": "Most people respond by ==escalating==, or by sending the same message again with more urgency.", "text": "Most people respond by escalating, or by sending the same message again with more urgency.", "zh": "大多数人的反应是往上升级，或者把同一条消息再发一遍，语气更急。", "sp": null}, {"id": "s0_0_3", "md": "Both moves make you look like a ==burden==.", "text": "Both moves make you look like a burden.", "zh": "这两种做法都会让你看起来像个累赘。", "sp": null}], [{"id": "s0_1_0", "md": "Think about the request from their side.", "text": "Think about the request from their side.", "zh": "站在他们的角度想想这个请求。", "sp": null}, {"id": "s0_1_1", "md": "Every ask comes with a hidden cost: reading your context, learning your system, and taking the ==blame== if something breaks.", "text": "Every ask comes with a hidden cost: reading your context, learning your system, and taking the blame if something breaks.", "zh": "每个请求都带着隐性成本：要读你的背景、要搞懂你的系统，出了问题还得背锅。", "sp": null}, {"id": "s0_1_2", "md": "**People rarely refuse the work itself; they refuse the uncertainty around it.**", "text": "People rarely refuse the work itself; they refuse the uncertainty around it.", "zh": "人们很少是拒绝活本身；他们拒绝的是活背后的不确定性。", "sp": null}], [{"id": "s0_2_0", "md": "So your job is not to __make a stronger case__.", "text": "So your job is not to make a stronger case.", "zh": "所以你要做的不是把理由讲得更硬。", "sp": null}, {"id": "s0_2_1", "md": "Your job is to make yes the cheapest answer they can give.", "text": "Your job is to make yes the cheapest answer they can give.", "zh": "你要做的是让「好」成为他们最省事的回答。", "sp": null}, {"id": "s0_2_2", "md": "That changes what you bring to the very first conversation.", "text": "That changes what you bring to the very first conversation.", "zh": "这会改变你第一次沟通时要准备的东西。", "sp": null}]]}, {"heading": "2. Make Yes Cheap", "heading_zh": "2. 让对方点头的成本降到最低", "rows": [[{"id": "s1_0_0", "md": "Start by shrinking the ask until it fits into a single afternoon.", "text": "Start by shrinking the ask until it fits into a single afternoon.", "zh": "先把需求缩小，缩到一个下午就能搞定。", "sp": null}, {"id": "s1_0_1", "md": "Instead of \"Can you support bulk refunds?\", try \"Can you review one change that adds a single endpoint?\"", "text": "Instead of \"Can you support bulk refunds?\", try \"Can you review one change that adds a single endpoint?\"", "zh": "别问「你们能支持批量退款吗？」，换成「能帮忙 review 一个只加一个接口的改动吗？」", "sp": null}, {"id": "s1_0_2", "md": "A ==modest== request __gets a quick yes__; a vague one gets added to the backlog.", "text": "A modest request gets a quick yes; a vague one gets added to the backlog.", "zh": "小请求很快就能拿到同意；模糊的请求只会被扔进 backlog。", "sp": null}], [{"id": "s1_1_0", "md": "Next, do the ==legwork== yourself.", "text": "Next, do the legwork yourself.", "zh": "接着，脏活累活自己先干了。", "sp": null}, {"id": "s1_1_1", "md": "Write the design note, prepare the test cases, and offer to __pair with__ their engineer during the rollout.", "text": "Write the design note, prepare the test cases, and offer to pair with their engineer during the rollout.", "zh": "写好设计文档，准备好测试用例，上线时主动提出跟他们的工程师一起盯。", "sp": null}, {"id": "s1_1_2", "md": "You are not asking them to own your problem; you are asking them to approve your solution.", "text": "You are not asking them to own your problem; you are asking them to approve your solution.", "zh": "你不是让他们来扛你的问题；你是请他们批准你的方案。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, pay them in the currency they actually care about, which is visibility.", "text": "Finally, pay them in the currency they actually care about, which is visibility.", "zh": "最后，用他们真正在乎的东西来回报他们，那就是能见度。", "sp": null}, {"id": "s1_2_1", "md": "Thank the engineer by name in your launch email and copy their manager.", "text": "Thank the engineer by name in your launch email and copy their manager.", "zh": "在上线邮件里点名感谢那位工程师，并抄送他的老板。", "sp": null}, {"id": "s1_2_2", "md": "That small gesture __goes a long way__, because it turns a favor into ==evidence== they can show in their own review.", "text": "That small gesture goes a long way, because it turns a favor into evidence they can show in their own review.", "zh": "这个小动作作用很大，因为它把一次帮忙变成了对方在自己绩效评估里能拿出来的证据。", "sp": null}], [{"id": "s1_3_0", "md": "Next time you need help, the same team will remember you as easy to work with, not as one more ticket.", "text": "Next time you need help, the same team will remember you as easy to work with, not as one more ticket.", "zh": "下次你再需要帮忙，这个团队会记得你是个好合作的人，而不是又一张工单。", "sp": null}, {"id": "s1_3_1", "md": "**Help flows toward people who make helping easy.**", "text": "Help flows toward people who make helping easy.", "zh": "谁让帮忙变得容易，帮助就会流向谁。", "sp": null}]]}], "gist": [{"q": "作者认为别的团队拒绝帮忙，真正拒绝的是什么？", "a": "不是活本身，而是活周围的不确定性：要读你的背景、学你的系统、出了问题还要背锅。"}, {"q": "作者说你的任务是什么，而不是什么？", "a": "不是把理由讲得更有力，而是让「同意」成为对方成本最低的答案。"}, {"q": "让对方容易说 yes 的做法有哪些？", "a": "把请求缩小到一个下午能做完；自己把设计文档和测试准备好，只请对方审批；上线后点名感谢并抄送对方经理，给他可写进绩效的证据。"}], "dictation": [{"id": "s0_1_2", "text": "People rarely refuse the work itself; they refuse the uncertainty around it."}, {"id": "s0_2_1", "text": "Your job is to make yes the cheapest answer they can give."}, {"id": "s1_1_2", "text": "You are not asking them to own your problem; you are asking them to approve your solution."}, {"id": "s1_3_1", "text": "Help flows toward people who make helping easy."}], "shadow": {"text": "Next, do the legwork yourself. Write the design note, prepare the test cases, and offer to pair with their engineer during the rollout. You are not asking them to own your problem; you are asking them to approve your solution.", "marked": "Next, / do the <b>legwork</b> yourself. //<br>Write the <b>design</b> note, / prepare the <b>test</b> cases, / and offer to <b>pair</b> with their engineer / during the <b>rollout</b>. //<br>You are <b>not</b> asking them to <b>own</b> your problem; / you are asking them to <b>approve</b> your solution. //"}, "prompts": [{"q": "你需要基础架构组在网关看板上加一个超时指标，但他们这个季度排满了，也不归你管。用 30 秒发起请求：把需求缩小，并说明你这边已经做好的准备。", "ref": "Hi Maya, I know your quarter is packed, so I'll keep this small. We need one extra metric on the gateway dashboard to track timeout errors. My engineer has already written the change and the tests. All we need is about thirty minutes of review from someone on your side. If it's easier, we can walk through it together on Thursday.", "ref_zh": "Maya 你好，我知道你们这个季度很满，所以我尽量说得简单点。我们需要在网关 dashboard 上加一个指标，用来追踪超时错误。我们的工程师已经把改动和测试都写好了。只需要你们那边找个人花大概三十分钟 review 一下。如果方便的话，周四我们可以一起过一遍。", "id": "ref0"}, {"q": "上周另一个团队的工程师帮你们解决了一个阻塞上线的问题。在跨团队周会上用 30 秒公开感谢他，让他的经理也看到这份贡献。", "ref": "Before we move on, I want to call out Ravi from the storage team. Last week our launch was blocked by a write timeout, and honestly it wasn't his problem to fix. He spent a whole afternoon with us, found the root cause, and reviewed our patch the same day. We shipped on time because of him, so thank you, Ravi.", "ref_zh": "在进入下一项之前，我想特别感谢一下存储团队的 Ravi。上周我们的上线被一个写超时卡住了，说实话那根本不是他该修的问题。他陪我们花了整整一个下午，找到了根因，当天就 review 了我们的补丁。我们能按时上线全靠他，所以谢谢你，Ravi。", "id": "ref1"}], "words": [{"w": "escalate", "ipa": "/ˈeskəleɪt/", "zh": "升级（问题）、上报", "ex": "If we don't hear back by Friday, I'll escalate it to their director.", "i const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;

  for (const k of kids) el.append(k);

};

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
