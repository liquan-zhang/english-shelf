<script>
const D = {"id": "095", "title": "Understanding Indirect Feedback Across Cultures", "meta": "B2 · 约 280 词 · 场景：听懂委婉反馈", "voice": "en-SG-LunaNeural", "rate": "-5%", "sections": [{"heading": "1. When \"Interesting\" Means No", "heading_zh": "1. 当「有意思」的意思是不行", "rows": [[{"id": "s0_0_0", "md": "A British colleague reads your proposal and says, \"That's an interesting approach, maybe worth a bit more thought.\"", "text": "A British colleague reads your proposal and says, \"That's an interesting approach, maybe worth a bit more thought.\"", "zh": "一位英国同事看了你的方案，说：「这个思路挺有意思的，也许值得再多想想。」", "sp": null}, {"id": "s0_0_1", "md": "You leave the call happy.", "text": "You leave the call happy.", "zh": "你开开心心地下了会。", "sp": null}, {"id": "s0_0_2", "md": "Two weeks later, you discover he thought the plan had serious problems.", "text": "Two weeks later, you discover he thought the plan had serious problems.", "zh": "两周后，你才发现他觉得这个方案问题很大。", "sp": null}], [{"id": "s0_1_0", "md": "In many cultures, criticism is ==wrapped== in polite language.", "text": "In many cultures, criticism is wrapped in polite language.", "zh": "在很多文化里，批评是裹在客气话里的。", "sp": null}, {"id": "s0_1_1", "md": "In some teams in Asia, \"Let me check\" can be a soft way to ==decline==.", "text": "In some teams in Asia, \"Let me check\" can be a soft way to decline.", "zh": "在亚洲的一些团队里，「我看一下」可能是一种委婉的拒绝。", "sp": null}, {"id": "s0_1_2", "md": "In other places, like the Netherlands, people may say \"This won't work\" and mean nothing personal by it.", "text": "In other places, like the Netherlands, people may say \"This won't work\" and mean nothing personal by it.", "zh": "而在别的地方，比如荷兰，人们可能直接说「这样行不通」，而且没有任何针对个人的意思。", "sp": null}, {"id": "s0_1_3", "md": "Neither style is wrong, but if you only hear the words, you will misjudge both.", "text": "Neither style is wrong, but if you only hear the words, you will misjudge both.", "zh": "两种风格都没错，但如果你只听字面，两边都会判断错。", "sp": null}], [{"id": "s0_2_0", "md": "**With indirect feedback, the softer the words, the more carefully you should listen.**", "text": "With indirect feedback, the softer the words, the more carefully you should listen.", "zh": "面对委婉的反馈，话说得越软，你越要仔细听。", "sp": null}, {"id": "s0_2_1", "md": "Phrases like \"a few small concerns\", \"perhaps\", or \"have you considered\" are often polite packaging for real ==reservations==.", "text": "Phrases like \"a few small concerns\", \"perhaps\", or \"have you considered\" are often polite packaging for real reservations.", "zh": "像「有几个小顾虑」「也许」「你有没有考虑过」这类说法，往往是真实保留意见的客气包装。", "sp": null}, {"id": "s0_2_2", "md": "Treat them as an invitation to ask one more question.", "text": "Treat them as an invitation to ask one more question.", "zh": "把它们当成再多问一句的邀请。", "sp": null}]]}, {"heading": "2. Decode, Then Ask", "heading_zh": "2. 先解码，再追问", "rows": [[{"id": "s1_0_0", "md": "First, listen for ==softeners==.", "text": "First, listen for softeners.", "zh": "第一，留意那些软化词。", "sp": null}, {"id": "s1_0_1", "md": "Words like \"slightly\", \"quite\", and \"just a thought\" make feedback sound smaller than it is.", "text": "Words like \"slightly\", \"quite\", and \"just a thought\" make feedback sound smaller than it is.", "zh": "像「稍微」「挺」「只是个想法」这类词，会让反馈听起来比实际轻。", "sp": null}, {"id": "s1_0_2", "md": "When you hear several of them in a row, assume the concern is bigger than it sounds.", "text": "When you hear several of them in a row, assume the concern is bigger than it sounds.", "zh": "如果一连听到好几个，就默认这个顾虑比听上去要大。", "sp": null}], [{"id": "s1_1_0", "md": "Second, ask a question that makes directness safe.", "text": "Second, ask a question that makes directness safe.", "zh": "第二，问一个让对方可以放心直说的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"If this were your project, what is the first thing you would change?\"", "text": "\"If this were your project, what is the first thing you would change?\"", "zh": "「如果这是你的项目，你第一个要改的是什么？」", "sp": null}, {"id": "s1_1_2", "md": "This invites a clear answer without forcing anyone to sound ==harsh==.", "text": "This invites a clear answer without forcing anyone to sound harsh.", "zh": "这样能引出一个明确的答案，又不逼任何人说话难听。", "sp": null}], [{"id": "s1_2_0", "md": "Third, ==calibrate== with a scale.", "text": "Third, calibrate with a scale.", "zh": "第三，用打分来校准。", "sp": null}, {"id": "s1_2_1", "md": "\"On a scale from one to ten, how confident are you that this will work?\"", "text": "\"On a scale from one to ten, how confident are you that this will work?\"", "zh": "「从一到十打分，你对这个方案能成有几分把握？」", "sp": null}, {"id": "s1_2_2", "md": "**Numbers cut through politeness in a way that adjectives never do.**", "text": "Numbers cut through politeness in a way that adjectives never do.", "zh": "数字能穿透客气，这是形容词永远做不到的。", "sp": null}], [{"id": "s1_3_0", "md": "And remember that it works both ways.", "text": "And remember that it works both ways.", "zh": "还要记住，这是双向的。", "sp": null}, {"id": "s1_3_1", "md": "Your own direct comments may sound harsher to some teammates than you intend, so __soften the delivery__, not the content.", "text": "Your own direct comments may sound harsher to some teammates than you intend, so soften the delivery, not the content.", "zh": "你自己的直接评论，在有些队友听来可能比你本意更凶，所以要软化的是表达方式，而不是内容。", "sp": null}, {"id": "s1_3_2", "md": "A simple \"I might be wrong, but\" can make a hard point much easier to hear.", "text": "A simple \"I might be wrong, but\" can make a hard point much easier to hear.", "zh": "一句简单的「我可能说得不对，但是……」，就能让一个难听的观点好入耳得多。", "sp": null}]]}], "gist": [{"q": "开头英国同事的例子说明了什么？", "a": "“很有意思、也许值得再想想”听起来是肯定，实际意思是方案有严重问题；很多文化把批评包在礼貌语言里。"}, {"q": "作者给出的判断原则是什么？", "a": "间接反馈里，措辞越柔和，越要认真听；连续出现多个弱化词，就假设问题比听起来更大。"}, {"q": "听到委婉反馈后可以怎么问？反过来自己要注意什么？", "a": "问“如果是你的项目，第一件要改的是什么”，或用一到十分的量表问信心；自己直接的意见可能显得更凶，要软化表达方式而不是内容。"}], "dictation": [{"id": "s0_2_0", "text": "With indirect feedback, the softer the words, the more carefully you should listen."}, {"id": "s0_1_0", "text": "In many cultures, criticism is wrapped in polite language."}, {"id": "s1_2_2", "text": "Numbers cut through politeness in a way that adjectives never do."}, {"id": "s1_3_2", "text": "A simple \"I might be wrong, but\" can make a hard point much easier to hear."}], "shadow": {"text": "Third, calibrate with a scale. \"On a scale from one to ten, how confident are you that this will work?\" Numbers cut through politeness in a way that adjectives never do.", "marked": "Third, <b>calibrate</b> with a <b>scale</b>. //<br>\"On a scale from <b>one</b> to <b>ten</b>, / how <b>confident</b> are you / that this will <b>work</b>?\" //<br><b>Numbers</b> cut through politeness / in a way that <b>adjectives</b> / <b>never</b> do. //"}, "prompts": [{"q": "英国同事看了你的方案后说：It's a brave idea, I have a couple of small concerns. 你意识到这可能是强烈的保留意见。用一个问题让他说实话。", "ref": "Thanks, I appreciate that. I have a feeling those small concerns might be bigger than they sound, so I'd really like to hear them. If this were your project, what's the first thing you would change? And honestly, on a scale from one to ten, how confident are you that it would work as it is?", "ref_zh": "谢谢，很感谢。我感觉那几个小顾虑可能比听上去要大，所以真的很想听听。如果这是你的项目，你第一个要改的是什么？还有说实话，从一到十打分，你觉得照现在这样能成有几分把握？", "id": "ref0"}, {"q": "你上次给吉隆坡团队的反馈被转述为“太凶”。这次要表达同样的意见（关键流程缺少测试），但更柔和。", "ref": "I might be wrong here, but I'd like to share one thought on testing. From what I can see, a few important paths in the checkout flow don't have tests yet. I know the timeline has been tight. Could we look at those paths together this week and pick the two or three that matter most?", "ref_zh": "我可能说得不对，但关于测试我想说一点。从我看到的情况，结账流程里有几条重要路径还没有测试。我知道排期一直很紧。这周我们能不能一起过一下这些路径，挑出最要紧的两三条？", "id": "ref1"}], "words": [{"w": "wrap (v.)", "ipa": "/ræp/", "zh": "包裹、包装", "ex": "She wrapped the criticism in so much praise that he missed it.", "tts_w": "wrap", "id": "w0"}, {"w": "decline", "ipa": "/dɪˈklaɪn/", "zh": "婉拒", "ex": "They declined our request for extra review time.", "id": "w1"}, {"w": "reservation", "ipa": "/ˌrezərˈveɪʃən/", "zh": "保留意见、疑虑", "ex": "I have some reservations about launc const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {

})();

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
