<script>
const D = {"id": "095", "title": "Understanding Indirect Feedback Across Cultures", "meta": "B2 · 约 280 词 · 场景：听懂委婉反馈", "voice": "en-SG-LunaNeural", "rate": "-5%", "sections": [{"heading": "1. When \"Interesting\" Means No", "heading_zh": "1. 当「有意思」的意思是不行", "rows": [[{"id": "s0_0_0", "md": "A British colleague reads your proposal and says, \"That's an interesting approach, maybe worth a bit more thought.\"", "text": "A British colleague reads your proposal and says, \"That's an interesting approach, maybe worth a bit more thought.\"", "zh": "一位英国同事看了你的方案，说：「这个思路挺有意思的，也许值得再多想想。」", "sp": null}, {"id": "s0_0_1", "md": "You leave the call happy.", "text": "You leave the call happy.", "zh": "你开开心心地下了会。", "sp": null}, {"id": "s0_0_2", "md": "Two weeks later, you discover he thought the plan had serious problems.", "text": "Two weeks later, you discover he thought the plan had serious problems.", "zh": "两周后，你才发现他觉得这个方案问题很大。", "sp": null}], [{"id": "s0_1_0", "md": "In many cultures, criticism is ==wrapped== in polite language.", "text": "In many cultures, criticism is wrapped in polite language.", "zh": "在很多文化里，批评是裹在客气话里的。", "sp": null}, {"id": "s0_1_1", "md": "In some teams in Asia, \"Let me check\" can be a soft way to ==decline==.", "text": "In some teams in Asia, \"Let me check\" can be a soft way to decline.", "zh": "在亚洲的一些团队里，「我看一下」可能是一种委婉的拒绝。", "sp": null}, {"id": "s0_1_2", "md": "In other places, like the Netherlands, people may say \"This won't work\" and mean nothing personal by it.", "text": "In other places, like the Netherlands, people may say \"This won't work\" and mean nothing personal by it.", "zh": "而在别的地方，比如荷兰，人们可能直接说「这样行不通」，而且没有任何针对个人的意思。", "sp": null}, {"id": "s0_1_3", "md": "Neither style is wrong, but if you only hear the words, you will misjudge both.", "text": "Neither style is wrong, but if you only hear the words, you will misjudge both.", "zh": "两种风格都没错，但如果你只听字面，两边都会判断错。", "sp": null}], [{"id": "s0_2_0", "md": "**With indirect feedback, the softer the words, the more carefully you should listen.**", "text": "With indirect feedback, the softer the words, the more carefully you should listen.", "zh": "面对委婉的反馈，话说得越软，你越要仔细听。", "sp": null}, {"id": "s0_2_1", "md": "Phrases like \"a few small concerns\", \"perhaps\", or \"have you considered\" are often polite packaging for real ==reservations==.", "text": "Phrases like \"a few small concerns\", \"perhaps\", or \"have you considered\" are often polite packaging for real reservations.", "zh": "像「有几个小顾虑」「也许」「你有没有考虑过」这类说法，往往是真实保留意见的客气包装。", "sp": null}, {"id": "s0_2_2", "md": "Treat them as an invitation to ask one more question.", "text": "Treat them as an invitation to ask one more question.", "zh": "把它们当成再多问一句的邀请。", "sp": null}]]}, {"heading": "2. Decode, Then Ask", "heading_zh": "2. 先解码，再追问", "rows": [[{"id": "s1_0_0", "md": "First, listen for ==softeners==.", "text": "First, listen for softeners.", "zh": "第一，留意那些软化词。", "sp": null}, {"id": "s1_0_1", "md": "Words like \"slightly\", \"quite\", and \"just a thought\" make feedback sound smaller than it is.", "text": "Words like \"slightly\", \"quite\", and \"just a thought\" make feedback sound smaller than it is.", "zh": "像「稍微」「挺」「只是个想法」这类词，会让反馈听起来比实际轻。", "sp": null}, {"id": "s1_0_2", "md": "When you hear several of them in a row, assume the concern is bigger than it sounds.", "text": "When you hear several of them in a row, assume the concern is bigger than it sounds.", "zh": "如果一连听到好几个，就默认这个顾虑比听上去要大。", "sp": null}], [{"id": "s1_1_0", "md": "Second, ask a question that makes directness safe.", "text": "Second, ask a question that makes directness safe.", "zh": "第二，问一个让对方可以放心直说的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"If this were your project, what is the first thing you would change?\"", "text": "\"If this were your project, what is the first thing you would change?\"", "zh": "「如果这是你的项目，你第一个要改的是什么？」", "sp": null}, {"id": "s1_1_2", "md": "This invites a clear answer without forcing anyone to sound ==harsh==.", "text": "This invites a clear answer without forcing anyone to sound harsh.", "zh": "这样能引出一个明确的答案，又不逼任何人说话难听。", "sp": null}], [{"id": "s1_2_0", "md": "Third, ==calibrate== with a scale.", "text": "Third, calibrate with a scale.", "zh": "第三，用打分来校准。", "sp": null}, {"id": "s1_2_1", "md": "\"On a scale from one to ten, how confident are you that this will work?\"", "text": "\"On a scale from one to ten, how confident are you that this will work?\"", "zh": "「从一到十打分，你对这个方案能成有几分把握？」", "sp": null}, {"id": "s1_2_2", "md": "**Numbers cut through politeness in a way that adjectives never do.**", "text": "Numbers cut through politeness in a way that adjectives never do.", "zh": "数字能穿透客气，这是形容词永远做不到的。", "sp": null}], [{"id": "s1_3_0", "md": "And remember that it works both ways.", "text": "And remember that it works both ways.", "zh": "还要记住，这是双向的。", "sp": null}, {"id": "s1_3_1", "md": "Your own direct comments may sound harsher to some teammates than you intend, so __soften the delivery__, not the content.", "text": "Your own direct comments may sound harsher to some teammates than you intend, so soften the delivery, not the content.", "zh": "你自己的直接评论，在有些队友听来可能比你本意更凶，所以要软化的是表达方式，而不是内容。", "sp": null}, {"id": "s1_3_2", "md": "A simple \"I might be wrong, but\" can make a hard point much easier to hear.", "text": "A simple \"I might be wrong, but\" can make a hard point much easier to hear.", "zh": "一句简单的「我可能说得不对，但是……」，就能让一个难听的观点好入耳得多。", "sp": null}]]}], "gist": [{"q": "开头英国同事的例子说明了什么？", "a": "“很有意思、也许值得再想想”听起来是肯定，实际意思是方案有严重问题；很多文化把批评包在礼貌语言里。"}, {"q": "作者给出的判断原则是什么？", "a": "间接反馈里，措辞越柔和，越要认真听；连续出现多个弱化词，就假设问题比听起来更大。"}, {"q": "听到委婉反馈后可以怎么问？反过来自己要注意什么？", "a": "问“如果是你的项目，第一件要改的是什么”，或用一到十分的量表问信心；自己直接的意见可能显得更凶，要软化表达方式而不是内容。"}], "dictation": [{"id": "s0_2_0", "text": "With indirect feedback, the softer the words, the more carefully you should listen."}, {"id": "s0_1_0", "text": "In many cultures, criticism is wrapped in polite language."}, {"id": "s1_2_2", "text": "Numbers cut through politeness in a way that adjectives never do."}, {"id": "s1_3_2", "text": "A simple \"I might be wrong, but\" can make a hard point much easier to hear."}], "shadow": {"text": "Third, calibrate with a scale. \"On a scale from one to ten, how confident are you that this will work?\" Numbers cut through politeness in a way that adjectives never do.", "marked": "Third, <b>calibrate</b> with a <b>scale</b>. //<br>\"On a scale from <b>one</b> to <b>ten</b>, / how <b>confident</b> are you / that this will <b>work</b>?\" //<br><b>Numbers</b> cut through politeness / in a way that <b>adjectives</b> / <b>never</b> do. //"}, "prompts": [{"q": "英国同事看了你的方案后说：It's a brave idea, I have a couple of small concerns. 你意识到这可能是强烈的保留意见。用一个问题让他说实话。", "ref": "Thanks, I appreciate that. I have a feeling those small concerns might be bigger than they sound, so I'd really like to hear them. If this were your project, what's the first thing you would change? And honestly, on a scale from one to ten, how confident are you that it would work as it is?", "ref_zh": "谢谢，很感谢。我感觉那几个小顾虑可能比听上去要大，所以真的很想听听。如果这是你的项目，你第一个要改的是什么？还有说实话，从一到十打分，你觉得照现在这样能成有几分把握？", "id": "ref0"}, {"q": "你上次给吉隆坡团队的反馈被转述为“太凶”。这次要表达同样的意见（关键流程缺少测试），但更柔和。", "ref": "I might be wrong here, but I'd like to share one thought on testing. From what I can see, a few important paths in the checkout flow don't have tests yet. I know the timeline has been tight. Could we look at those paths together this week and pick the two or three that matter most?", "ref_zh": "我可能说得不对，但关于测试我想说一点。从我看到的情况，结账流程里有几条重要路径还没有测试。我知道排期一直很紧。这周我们能不能一起过一下这些路径，挑出最要紧的两三条？", "id": "ref1"}], "words": [{"w": "wrap (v.)", "ipa": "/ræp/", "zh": "包裹、包装", "ex": "She wrapped the criticism in so much praise that he missed it.", "tts_w": "wrap", "id": "w0"}, {"w": "decline", "ipa": "/dɪˈklaɪn/", "zh": "婉拒", "ex": "They declined our request for extra review time.", "id": "w1"}, {"w": "reservation", "ipa": "/ˌrezərˈveɪʃən/", "zh": "保留意见、疑虑", "ex": "I have some reservations about launching before the holidays.", "id": "w2"}, {"w": "softener", "ipa": "/ˈsɔːfənər/", "zh": "缓和语、弱化词", "ex": "\"Just a thought\" is a softener, but the point behind it may be serious.", "id": "w3"}, {"w": "harsh", "ipa": "/hɑːrʃ/", "zh": "严厉的、刺耳的", "ex": "That review comment sounded harsh, even if it was accurate.", "id": "w4"}, {"w": "calibrate", "ipa": "/ˈkæləˌbreɪt/", "zh": "校准、调整判断", "ex": "Let's calibrate: what does a good result look like to you?", "id": "w5"}, {"w": "understatement", "ipa": "/ˌʌndərˈsteɪtmənt/", "zh": "轻描淡写、保守说法", "ex": "Calling that outage 'a bit unfortunate' was a British understatement.", "id": "w6"}, {"w": "cut through", "ipa": "/kʌt θruː/", "zh": "穿透、直达要点", "ex": "One clear chart cut through an hour of debate.", "id": "w7"}, {"w": "indirect", "ipa": "/ˌɪndəˈrekt/", "zh": "间接的、委婉的", "ex": "His feedback was indirect, so I asked a follow-up question.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. When \"Interesting\" Means No", "zh": "1. 当「有意思」的意思是不行", "start": 0.0, "end": 3.768, "words": [[0.103, 0.747], [0.984, 1.247], [1.261, 1.918], [1.932, 2.326], [2.339, 2.853]]}, {"kind": "s", "id": "s0_0_0", "md": "A British colleague reads your proposal and says, \"That's an interesting approach, maybe worth a bit more thought.\"", "zh": "一位英国同事看了你的方案，说：「这个思路挺有意思的，也许值得再多想想。」", "sp": null, "gap": false, "start": 3.768, "end": 11.928, "words": [[3.871, 4.029], [4.042, 4.463], [4.476, 4.884], [4.897, 5.239], [5.252, 5.397], [5.41, 5.976], [5.989, 6.134], [6.147, 6.805], [7.029, 7.384], [7.397, 7.542], [7.555, 8.173], [8.186, 8.857], [9.068, 9.489], [9.502, 9.818], [9.831, 9.923], [9.936, 10.2], [10.213, 10.476], [10.489, 11.002]]}, {"kind": "s", "id": "s0_0_1", "md": "You leave the call happy.", "zh": "你开开心心地下了会。", "sp": null, "gap": false, "start": 11.928, "end": 14.544, "words": [[12.031, 12.215], [12.228, 12.504], [12.517, 12.649], [12.662, 12.925], [12.939, 13.623]]}, {"kind": "s", "id": "s0_0_2", "md": "Two weeks later, you discover he thought the plan had serious problems.", "zh": "两周后，你才发现他觉得这个方案问题很大。", "sp": null, "gap": false, "start": 14.544, "end": 20.208, "words": [[14.647, 14.897], [14.91, 15.226], [15.239, 15.818], [16.081, 16.252], [16.265, 16.818], [16.831, 16.976], [16.989, 17.239], [17.252, 17.383], [17.397, 17.739], [17.752, 17.989], [18.002, 18.476], [18.489, 19.278]]}, {"kind": "s", "id": "s0_1_0", "md": "In many cultures, criticism is ==wrapped== in polite language.", "zh": "在很多文化里，批评是裹在客气话里的。", "sp": null, "gap": true, "start": 20.208, "end": 25.488, "words": [[20.311, 20.508], [20.521, 20.797], [20.811, 21.6], [21.85, 22.587], [22.6, 22.85], [22.863, 23.153], [23.166, 23.337], [23.35, 23.719], [23.732, 24.547]]}, {"kind": "s", "id": "s0_1_1", "md": "In some teams in Asia, \"Let me check\" can be a soft way to ==decline==.", "zh": "在亚洲的一些团队里，「我看一下」可能是一种委婉的拒绝。", "sp": null, "gap": false, "start": 25.488, "end": 30.912, "words": [[25.591, 25.775], [25.788, 26.064], [26.077, 26.42], [26.433, 26.617], [26.63, 27.222], [27.459, 27.683], [27.696, 27.841], [27.854, 28.143], [28.156, 28.341], [28.354, 28.499], [28.512, 28.564], [28.577, 28.933], [28.946, 29.104], [29.117, 29.262], [29.275, 29.972]]}, {"kind": "s", "id": "s0_1_2", "md": "In other places, like the Netherlands, people may say \"This won't work\" and mean nothing personal by it.", "zh": "而在别的地方，比如荷兰，人们可能直接说「这样行不通」，而且没有任何针对个人的意思。", "sp": null, "gap": false, "start": 30.912, "end": 38.52, "words": [[31.015, 31.238], [31.251, 31.515], [31.528, 32.251], [32.515, 32.751], [32.765, 32.844], [32.857, 33.633], [33.883, 34.278], [34.291, 34.449], [34.462, 34.791], [34.804, 35.041], [35.054, 35.317], [35.33, 35.62], [35.633, 35.791], [35.804, 36.041], [36.054, 36.475], [36.488, 36.962], [36.975, 37.186], [37.199, 37.58]]}, {"kind": "s", "id": "s0_1_3", "md": "Neither style is wrong, but if you only hear the words, you will misjudge both.", "zh": "两种风格都没错，但如果你只听字面，两边都会判断错。", "sp": null, "gap": false, "start": 38.52, "end": 44.616, "w sp": null, "gap": false, "start": 68.592, "end": 72.24, "words": [[68.695, 69.379], [69.629, 70.089], [70.103, 70.274], [70.287, 71.3]]}, {"kind": "s", "id": "s1_0_1", "md": "Words like \"slightly\", \"quite\", and \"just a thought\" make feedback sound smaller than it is.", "zh": "像「稍微」「挺」「只是个想法」这类词，会让反馈听起来比实际轻。", "sp": null, "gap": false, "start": 72.24, "end": 78.84, "words": [[72.343, 72.698], [72.711, 72.908], [72.922, 73.632], [73.856, 74.422], [74.658, 74.895], [74.908, 75.172], [75.185, 75.251], [75.264, 75.54], [75.553, 75.803], [75.816, 76.251], [76.264, 76.579], [76.593, 77.053], [77.066, 77.237], [77.251, 77.408], [77.422, 77.908]]}, {"kind": "s", "id": "s1_0_2", "md": "When you hear several of them in a row, assume the concern is bigger than it sounds.", "zh": "如果一连听到好几个，就默认这个顾虑比听上去要大。", "sp": null, "gap": false, "start": 78.84, "end": 85.056, "words": [[78.943, 79.153], [79.166, 79.272], [79.285, 79.508], [79.522, 79.903], [79.916, 80.048], [80.061, 80.285], [80.298, 80.456], [80.469, 80.522], [80.535, 81.035], [81.232, 81.693], [81.706, 81.824], [81.837, 82.351], [82.364, 82.535], [82.548, 82.943], [82.956, 83.14], [83.153, 83.285], [83.298, 84.114]]}, {"kind": "s", "id": "s1_1_0", "md": "Second, ask a question that makes directness safe.", "zh": "第二，问一个让对方可以放心直说的问题。", "sp": null, "gap": true, "start": 85.056, "end": 89.496, "words": [[85.159, 85.922], [86.119, 86.422], [86.435, 86.501], [86.514, 86.988], [87.001, 87.198], [87.211, 87.527], [87.54, 88.027], [88.04, 88.58]]}, {"kind": "s", "id": "s1_1_1", "md": "\"If this were your project, what is the first thing you would change?\"", "zh": "「如果这是你的项目，你第一个要改的是什么？」", "sp": null, "gap": false, "start": 89.496, "end": 94.104, "words": [[89.599, 89.809], [89.822, 90.046], [90.059, 90.191], [90.204, 90.362], [90.375, 90.941], [91.178, 91.401], [91.414, 91.52], [91.533, 91.651], [91.664, 91.993], [92.007, 92.217], [92.23, 92.349], [92.362, 92.52], [92.533, 93.178]]}, {"kind": "s", "id": "s1_1_2", "md": "This invites a clear answer without forcing anyone to sound ==harsh==.", "zh": "这样能引出一个明确的答案，又不逼任何人说话难听。", "sp": null, "gap": false, "start": 94.104, "end": 99.096, "words": [[94.207, 94.522], [94.536, 94.97], [94.983, 95.062], [95.075, 95.404], [95.417, 95.786], [95.799, 96.167], [96.18, 96.654], [96.667, 97.101], [97.115, 97.22], [97.233, 97.536], [97.549, 98.154]]}, {"kind": "s", "id": "s1_2_0", "md": "Third, ==calibrate== with a scale.", "zh": "第三，用打分来校准。", "sp": null, "gap": true, "start": 99.096, "end": 102.528, "words": [[99.199, 99.685], [99.909, 100.528], [100.541, 100.751], [100.764, 100.817], [100.83, 101.593]]}, {"kind": "s", "id": "s1_2_1", "md": "\"On a scale from one to ten, how confident are you that this will work?\"", "zh": "「从一到十打分，你对这个方案能成有几分把握？」", "sp": null, "gap": false, "start": 102.528, "end": 107.928, "words": [[102.631, 102.815], [102.828, 102.881], [102.894, 103.249], [103.262, 103.512], [103.525, 103.723], [103.736, 103.881], [103.894, 104.381], [104.631, 104.867], [104.881, 105.486], [105.499, 105.617], [105.631, 105.775], [105.789, 106.025], [106.039, 106.249], [106.262, 106.446], [106.46, 106.986]]}, {"kind": "s", "id": "s1_2_2", "md": "**Numbers cut through politeness in a way that adjectives never do.**", "zh": "数字能穿透客气，这是形容词永远做不到的。", "sp": null, "gap": false, "start": 107.928, "end": 112.824, "words": [[108.031, 108.544], [108.557, 108.807], [108.82, 109.083], [109.096, 109.675], [109.689, 109.846], [109.86, 109.925], [109.939, 110.189], [110.202, 110.438], [110.452, 111.07], [111.083, 111.425], [111.439, 111.886]]}, {"kind": "s", "id": "s1_3_0", "md": "And remember that it works both ways.", "zh": "还要记住，这是双向的。", "sp": null, "gap": true, "start": 112.824, "end": 116.352, "words": [[112.927, 113.137], [113.15, 113.69], [113.703, 113.913], [113.927, 114.058], [114.071, 114.4], [114.413, 114.729], [114.742, 115.427]]}, {"kind": "s", "id": "s1_3_1", "md": "Your own direct comments may sound harsher to some teammates than you intend, so __soften the delivery__, not the content.", "zh": "你自己的直接评论，在有些队友听来可能比你本意更凶，所以要软化的是表达方式，而不是内容。", "sp": null, "gap": false, "start": 116.352, "end": 124.536, "words": [[116.455, 116.678], [116.691, 116.876], [116.889, 117.218], [117.231, 117.691], [117.705, 117.876], [117.889, 118.218], [118.231, 118.652], [118.665, 118.77], [118.784, 119.06], [119.073, 119.547], [119.56, 119.757], [119.77, 119.889], [119.902, 120.547], [120.757, 121.02], [121.034, 121.468], [121.481, 121.599], [121.613, 122.297], [122.481, 122.77], [122.784, 122.889], [122.902, 123.613]]}, {"kind": "s", "id": "s1_3_2", "md": "A simple \"I might be wrong, but\" can make a hard point much easier to hear.", "zh": "一句简单的「我可能说得不对，但是……」，就能让一个难听的观点好入耳得多。", "sp": null, "gap": false, "start": 124.536, "end": 130.536, "words": [[124.639, 124.744], [124.757, 125.441], [125.494, 125.507], [125.52, 125.797], [125.81, 125.968], [125.981, 126.428], [126.625, 127.02], [127.125, 127.336], [127.349, 127.56], [127.573, 127.612], [127.625, 127.928], [127.941, 128.231], [128.244, 128.573], [128.586, 128.954], [128.968, 129.086], [129.099, 129.599]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
