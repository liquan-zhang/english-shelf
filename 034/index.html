<script>
const D = {"id": "034", "title": "Pushing Back on an Unrealistic Deadline", "meta": "B2 · 约 260 词 · 场景：排期谈判", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why No Is the Wrong First Word", "heading_zh": "1. 为什么第一句话不该是「不行」", "rows": [[{"id": "s0_0_0", "md": "Your director wants the new onboarding flow live before the year-end campaign.", "text": "Your director wants the new onboarding flow live before the year-end campaign.", "zh": "你的总监希望新的注册引导流程在年底大促前上线。", "sp": null}, {"id": "s0_0_1", "md": "Your estimate says it needs ten weeks, and you have six.", "text": "Your estimate says it needs ten weeks, and you have six.", "zh": "你评估下来需要十周，而你只有六周。", "sp": null}, {"id": "s0_0_2", "md": "The worst thing you can say is \"That's impossible.\"", "text": "The worst thing you can say is \"That's impossible.\"", "zh": "你最不该说的一句话就是「这不可能」。", "sp": null}], [{"id": "s0_1_0", "md": "\"Impossible\" ends the conversation and makes you look ==inflexible==.", "text": "\"Impossible\" ends the conversation and makes you look inflexible.", "zh": "「不可能」会直接终结对话，还会让你显得很死板。", "sp": null}, {"id": "s0_1_1", "md": "Your director usually has a real reason for the date, maybe a promise to a partner or a marketing ==slot== that is already booked.", "text": "Your director usually has a real reason for the date, maybe a promise to a partner or a marketing slot that is already booked.", "zh": "总监定这个日期通常是有真实原因的，可能是答应了合作方，也可能是已经订好的营销档期。", "sp": null}, {"id": "s0_1_2", "md": "If you __brush off the date__, you also brush off their problem.", "text": "If you brush off the date, you also brush off their problem.", "zh": "你要是一口回绝这个日期，也就等于把他的难处一起推开了。", "sp": null}, {"id": "s0_1_3", "md": "From that moment, you are an obstacle, not a partner.", "text": "From that moment, you are an obstacle, not a partner.", "zh": "从那一刻起，你就成了障碍，而不是伙伴。", "sp": null}], [{"id": "s0_2_0", "md": "**Instead of arguing about the deadline, make the trade-offs visible.**", "text": "Instead of arguing about the deadline, make the trade-offs visible.", "zh": "与其争论 deadline，不如把取舍摆到台面上。", "sp": null}, {"id": "s0_2_1", "md": "Every project has three ==levers==: scope, time, and people.", "text": "Every project has three levers: scope, time, and people.", "zh": "每个项目都有三根杠杆：范围、时间和人力。", "sp": null}, {"id": "s0_2_2", "md": "If the date is fixed, at least one of the other two has to move.", "text": "If the date is fixed, at least one of the other two has to move.", "zh": "如果日期定死了，另外两个里至少有一个得动。", "sp": null}]]}, {"heading": "2. Offer What Fits", "heading_zh": "2. 给出能落地的方案", "rows": [[{"id": "s1_0_0", "md": "Start by agreeing on what the date protects.", "text": "Start by agreeing on what the date protects.", "zh": "先就这个日期要保住什么达成一致。", "sp": null}, {"id": "s1_0_1", "md": "\"So the key thing is being ready for the campaign traffic, right?\"", "text": "\"So the key thing is being ready for the campaign traffic, right?\"", "zh": "「所以最关键的是要在大促流量来之前准备好，对吧？」", "sp": null}, {"id": "s1_0_2", "md": "This shows you take the goal seriously before you talk about limits.", "text": "This shows you take the goal seriously before you talk about limits.", "zh": "这能表明你在谈限制之前，先认真对待了目标。", "sp": null}], [{"id": "s1_1_0", "md": "Then present options, not ==refusals==.", "text": "Then present options, not refusals.", "zh": "然后拿出方案，而不是拒绝。", "sp": null}, {"id": "s1_1_1", "md": "\"By that date, we can ship sign-up and email login, and add social login two weeks later.\"", "text": "\"By that date, we can ship sign-up and email login, and add social login two weeks later.\"", "zh": "「到那天，我们可以上线注册和邮箱登录，两周后再加上第三方登录。」", "sp": null}, {"id": "s1_1_2", "md": "Or: \"We can hit the full scope if we borrow two engineers from the growth team.\"", "text": "Or: \"We can hit the full scope if we borrow two engineers from the growth team.\"", "zh": "或者：「如果能从增长团队借两个工程师，我们就能做完全部范围。」", "sp": null}, {"id": "s1_1_3", "md": "Now your director is choosing between plans instead of __fighting with you__.", "text": "Now your director is choosing between plans instead of fighting with you.", "zh": "这样一来，总监是在几个方案之间做选择，而不是在跟你较劲。", "sp": null}], [{"id": "s1_2_0", "md": "Be honest about quality, too.", "text": "Be honest about quality, too.", "zh": "对质量也要坦诚。", "sp": null}, {"id": "s1_2_1", "md": "Squeezing ten weeks into six usually means skipping tests, and that ==debt== shows up as incidents in January.", "text": "Squeezing ten weeks into six usually means skipping tests, and that debt shows up as incidents in January.", "zh": "把十周的活压到六周，通常意味着要跳过测试，而这笔债会在一月份以线上事故的形式找上门来。", "sp": null}, {"id": "s1_2_2", "md": "**Let your director choose the risk, but make sure they choose it with open eyes.**", "text": "Let your director choose the risk, but make sure they choose it with open eyes.", "zh": "让总监来选择承担哪种风险，但要确保他是看清楚了再选的。", "sp": null}], [{"id": "s1_3_0", "md": "Put the agreed version __in writing__ the same day.", "text": "Put the agreed version in writing the same day.", "zh": "当天就把商定好的版本落成文字。", "sp": null}, {"id": "s1_3_1", "md": "A short summary of scope, date, and known risks protects everyone when memories ==fade==.", "text": "A short summary of scope, date, and known risks protects everyone when memories fade.", "zh": "一份关于范围、日期和已知风险的简短总结，能在大家记忆模糊的时候保护所有人。", "sp": null}]]}], "gist": [{"q": "为什么不该直接说「不可能」？", "a": "它会终结对话、显得不灵活；总监定这个日期通常有真实原因，否定日期等于否定他的问题。"}, {"q": "作者说每个项目有哪三个杠杆？", "a": "范围、时间、人力；如果日期固定，另外两个至少要动一个。"}, {"q": "具体应该怎么谈？", "a": "先确认日期要保护的目标；给出选项（砍范围分期上线或借人）而不是拒绝；坦白赶工带来的质量风险，让对方知情选择；当天书面确认。"}], "dictation": [{"id": "s0_2_0", "text": "Instead of arguing about the deadline, make the trade-offs visible."}, {"id": "s1_2_2", "text": "Let your director choose the risk, but make sure they choose it with open eyes."}, {"id": "s0_2_2", "text": "If the date is fixed, at least one of the other two has to move."}, {"id": "s1_0_0", "text": "Start by agreeing on what the date protects."}], "shadow": {"text": "Instead of arguing about the deadline, make the trade-offs visible. Every project has three levers: scope, time, and people. If the date is fixed, at least one of the other two has to move.", "marked": "Instead of <b>arguing</b> about the deadline, / make the <b>trade-offs</b> visible. //<br>Every project has <b>three</b> levers: / <b>scope</b>, / <b>time</b>, / and <b>people</b>. //<br>If the date is <b>fixed</b>, / at least <b>one</b> of the other two / has to <b>move</b>. //"}, "prompts": [{"q": "老板要求新功能月底上线，你估算需要再多三周。用 30 秒回应：先确认日期背后的目标，再给出两个选项。", "ref": "I understand the end of the month matters because of the partner demo. Let me be straight about where we are: the full feature needs about three more weeks. So here are two options. We can demo the core flow by the end of the month and ship the admin tools three weeks later. Or, if the full scope has to be there, we'd need two more engineers starting next week. Which matters more for the demo?", "ref_zh": "我理解月底很重要，因为有合作方的 demo。我直说现在的情况：完整功能还需要大概三周。所以有两个方案。我们可以月底先 demo 核心流程，三周后再上线管理工具。或者，如果必须是完整范围，我们需要从下周开始再加两个工程师。对这次 demo 来说，哪个更重要？", "id": "ref0"}, {"q": "PM 提议跳过测试来赶日期。用 30 秒说明质量风险，让对方明确选择，并提议书面确认。", "ref": "We can hit that date if we cut the test phase, but I want us to make that choice with open eyes. Without regression tests, the most likely result is a few bugs in checkout during the first week, right when traffic peaks. If you're comfortable with that risk, I'll go ahead. I'll just send a short note today with the scope, the date, and the risk we're accepting, so we're all aligned.", "ref_zh": "如果砍掉测试阶段，我们能赶上那个日期，但我希望大家是看清楚了再做这个选择。没有回归测试的话，最可能的结果是第一周结账流程会出几个 bug，正好赶上流量高峰。如果你能接受这个风险，我就推进。我今天会发一份简短的说明，写清楚范围、日期和我们接受的风险，确保大家对齐。", "id": "ref1"}], "words": [{"w": "inflexible", "ipa": "/ɪnˈfleksəbl/", "zh": "死板的、不灵活的", "ex": "Saying no to every date makes the team look inflexible.", "id": "w0"}, {"w": "slot", "ipa": "/slɑːt/", "zh": "（时间）档期", "ex": "Marketing already booked the launch slot for the first week of December.", "id": "w1"}, {"w": "lever", "ipa": "/ˈlevər/", "zh": "杠杆、可调节的手段", "ex": "Scop const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;

  for (const k of kids) el.append(k);

};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
</html>
