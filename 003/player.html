<script>
const D = {"id": "003", "title": "How to Interrupt Politely", "meta": "B2 · 约 280 词 · 场景：会议控场", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Interrupting Is a Service", "heading_zh": "1. 打断也是一种付出", "rows": [[{"id": "s0_0_0", "md": "Many of us were taught that interrupting is rude.", "text": "Many of us were taught that interrupting is rude.", "zh": "我们很多人从小被教育，打断别人是不礼貌的。", "sp": null}, {"id": "s0_0_1", "md": "So when a colleague spends ten minutes on a side topic, we sit and wait, and the real agenda gets ==squeezed== into the last five minutes.", "text": "So when a colleague spends ten minutes on a side topic, we sit and wait, and the real agenda gets squeezed into the last five minutes.", "zh": "所以同事在一个跑题的话题上讲了十分钟，我们就坐着等，真正的议程被挤到最后五分钟。", "sp": null}, {"id": "s0_0_2", "md": "Everyone leaves annoyed, including the person who was talking.", "text": "Everyone leaves annoyed, including the person who was talking.", "zh": "最后每个人都一肚子火，包括刚才那个讲话的人。", "sp": null}], [{"id": "s0_1_0", "md": "Think about who pays for that politeness.", "text": "Think about who pays for that politeness.", "zh": "想想这份客气是谁在买单。", "sp": null}, {"id": "s0_1_1", "md": "Eight people lose ten minutes each, and the decision you needed gets __pushed to next week__.", "text": "Eight people lose ten minutes each, and the decision you needed gets pushed to next week.", "zh": "八个人每人损失十分钟，本该做的决定又被推到了下周。", "sp": null}, {"id": "s0_1_2", "md": "**Letting a meeting drift is not polite; it just spreads the cost around.**", "text": "Letting a meeting drift is not polite; it just spreads the cost around.", "zh": "放任会议跑偏并不是礼貌，只是把代价摊给了所有人。", "sp": null}], [{"id": "s0_2_0", "md": "A good interruption is ==brief==, warm, and useful.", "text": "A good interruption is brief, warm, and useful.", "zh": "好的打断要简短、友善、有用。", "sp": null}, {"id": "s0_2_1", "md": "It protects the group's time without ==embarrassing== the speaker.", "text": "It protects the group's time without embarrassing the speaker.", "zh": "它既保护了大家的时间，又不会让讲话的人难堪。", "sp": null}, {"id": "s0_2_2", "md": "The trick is to __cut in__ on the topic, not on the person.", "text": "The trick is to cut in on the topic, not on the person.", "zh": "诀窍是打断话题，而不是打断人。", "sp": null}]]}, {"heading": "2. The Name, Thanks, Bridge Pattern", "heading_zh": "2. 叫名字、致谢、搭桥", "rows": [[{"id": "s1_0_0", "md": "Start with the person's name.", "text": "Start with the person's name.", "zh": "先叫对方的名字。", "sp": null}, {"id": "s1_0_1", "md": "Hearing their name makes people pause ==naturally==, so you don't have to raise your voice.", "text": "Hearing their name makes people pause naturally, so you don't have to raise your voice.", "zh": "人听到自己的名字会自然停下来，你不用提高嗓门。", "sp": null}, {"id": "s1_0_2", "md": "\"Priya, sorry to jump in here.\"", "text": "\"Priya, sorry to jump in here.\"", "zh": "「Priya，不好意思插一句。」", "sp": null}], [{"id": "s1_1_0", "md": "Then give them credit for the point.", "text": "Then give them credit for the point.", "zh": "然后肯定一下对方的观点。", "sp": null}, {"id": "s1_1_1", "md": "\"That's a really good question about the logging format.\"", "text": "\"That's a really good question about the logging format.\"", "zh": "「关于日志格式，这个问题提得很好。」", "sp": null}, {"id": "s1_1_2", "md": "This ==signals== that you are not dismissing them, only __changing the timing__.", "text": "This signals that you are not dismissing them, only changing the timing.", "zh": "这是在表明你没有否定他，只是换个时间讨论。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, build a bridge back to the agenda.", "text": "Finally, build a bridge back to the agenda.", "zh": "最后，搭一座桥回到议程上。", "sp": null}, {"id": "s1_2_1", "md": "\"Can we __park it__ for the end, so we can finish the rollout plan first?\"", "text": "\"Can we park it for the end, so we can finish the rollout plan first?\"", "zh": "「这个我们能不能放到最后聊，先把上线方案过完？」", "sp": null}, {"id": "s1_2_2", "md": "**Always offer the topic a home, a later slot, a separate thread, or a follow-up call.**", "text": "Always offer the topic a home, a later slot, a separate thread, or a follow-up call.", "zh": "一定要给这个话题安排个去处，比如后面的时间、单独拉个群，或者另约个会。", "sp": null}, {"id": "s1_2_3", "md": "People let go much more easily when they know their idea will not just disappear.", "text": "People let go much more easily when they know their idea will not just disappear.", "zh": "大家知道自己的想法不会就这么没了，放手就容易得多。", "sp": null}], [{"id": "s1_3_0", "md": "On video calls, timing is harder, because a small delay makes everyone talk over each other.", "text": "On video calls, timing is harder, because a small delay makes everyone talk over each other.", "zh": "开视频会时时机更难把握，因为稍有延迟大家就会抢话。", "sp": null}, {"id": "s1_3_1", "md": "Use the raise hand button or a short message in the chat first, then speak when there is a gap.", "text": "Use the raise hand button or a short message in the chat first, then speak when there is a gap.", "zh": "先用举手按钮或者在聊天框里发条短消息，等有空当了再开口。", "sp": null}, {"id": "s1_3_2", "md": "If you ==chair== the meeting, say at the start that you will keep things on track, so nobody takes it personally later.", "text": "If you chair the meeting, say at the start that you will keep things on track, so nobody takes it personally later.", "zh": "如果你是主持人，开场就说清楚你会把控节奏，这样之后没人会往心里去。", "sp": null}]]}], "gist": [{"q": "作者为什么说放任跑题并不礼貌？", "a": "每个人都在为这份“礼貌”买单：八个人各浪费十分钟，该做的决定被推到下周，只是把成本分摊开了。"}, {"q": "礼貌打断的三步模式是什么？", "a": "先叫对方名字让他自然停下；肯定他的观点；再搭桥回到议程，比如把话题挪到会后。"}, {"q": "为什么要给被打断的话题“安排一个去处”？", "a": "对方知道自己的想法不会就此消失，才更容易放手。"}], "dictation": [{"id": "s0_1_2", "text": "Letting a meeting drift is not polite; it just spreads the cost around."}, {"id": "s1_2_2", "text": "Always offer the topic a home, a later slot, a separate thread, or a follow-up call."}, {"id": "s0_2_2", "text": "The trick is to cut in on the topic, not on the person."}, {"id": "s1_2_3", "text": "People let go much more easily when they know their idea will not just disappear."}], "shadow": {"text": "Finally, build a bridge back to the agenda. \"Can we park it for the end, so we can finish the rollout plan first?\"", "marked": "<b>Finally</b>, / build a <b>bridge</b> / back to the <b>agenda</b>. //<br>\"Can we <b>park</b> it / for the <b>end</b>, / so we can <b>finish</b> the rollout plan <b>first</b>?\" //"}, "prompts": [{"q": "上线评审会上，一位同事开始详细讲他对日志格式的意见，已经说了五分钟，离会议结束只剩十五分钟。用 30 秒礼貌打断他，并给这个话题安排去处。", "ref": "Arjun, sorry to jump in. That's a fair point about the log format, and I think it deserves a proper discussion. We only have fifteen minutes left, though, and we still need a go or no-go on the release. Could we park the logging question and pick it up in a separate thread this afternoon? I'll start the thread myself right after this call.", "ref_zh": "Arjun，不好意思插一句。你说的日志格式确实有道理，也值得好好讨论。不过我们只剩十五分钟了，还得定这次发布上不上。日志的问题能不能先放一放，下午单独拉个群聊？会一结束我就去拉群。", "id": "ref0"}, {"q": "线上会议，你作为主持人在开场时先打个招呼：今天议程紧，你可能会打断大家。用 30 秒说得友好又不让人尴尬。", "ref": "Before we start, a quick heads-up. We have three big items today and only forty-five minutes. So if a topic starts to run long, I might jump in and suggest we move it to the end or to a follow-up. Please don't take it personally, it's just to protect everyone's time. And feel free to do the same to me if I start rambling.", "ref_zh": "开始之前先提个醒。我们今天有三个大议题，只有四十五分钟。所以如果某个话题聊得太久，我可能会插一句，建议挪到最后或者会后再跟进。大家别往心里去，只是为了保护每个人的时间。如果我自己讲着讲着跑题了，你们也尽管打断我。", "id": "ref1"}], "words": [{"w": "squeeze", "ipa": "/skwiːz/", "zh": "挤压、硬塞进", "ex": "We squeezed the security review into the last day of the sprint.", "id": "w0"}, {"w": "brief", "ipa": "/briːf/", "zh": "简短的", "ex": "Keep the status update brief, two minutes per team.", "id": "w1"}, {"w": "embarrass", "ipa": "/ɪmˈbærəs/", "zh": "使难堪", "ex": "I didn't want to embarrass him by pointing out the bug in front of the client.", "id": "w2"}, {"w": "naturally", "ipa": "/ˈnætʃərəli/", "zh": "自然地", "ex": "Once the tests were green, the conversation naturally moved to the launch date.", "id": "w3"}, {"w": "signal (v.)", "ipa": "/ˈsɪɡnəl/", "zh": "表明、示意", "ex": "Moving the deadline signals that quality matters more than speed.", "tts_w": "signal", "id": "w4"}, {"w": "chair (v.)", "ipa": "/tʃer/", "zh": "主持（会议）", "ex": "Who's chairing the incident review tomorrow?", "tts_w": "chair", "id": "w5"}, {"w": "park (v.)", "ipa": "/pɑːrk/", "zh": "暂时搁置（话题）", "ex": "Let's park the pricing question until we have data.", "tts_w": "park", "id": "w6"}, {"w": "cut in", "ipa": "/kʌt ɪn/", "zh": "插话、打断", "ex": "Sorry to cut in, but the build just failed again.", "id": "w7"}, {"w": "dismiss", "ipa": "/dɪsˈmɪs/", "zh": "不予理会、轻视", "ex": "Don't dismiss that alert; it fired before the last outage too.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Interrupting Is a Service", "zh": "1. 打断也是一种付出", "start": 0.0, "end": 2.76, "words": [[0.105, 0.355], [0.816, 1.447], [1.566, 1.658], [1.671, 1.724], [1.737, 2.368]]}, {"kind": "s", "id": "s0_0_0", "md": "Many of us were taught that interrupting is rude.", "zh": "我们很多人从小被教育，打断别人是不礼貌的。", "sp": null, "gap": false, "start": 2.76, "end": 5.952, "words": [[2.865, 3.115], [3.128, 3.221], [3.234, 3.378], [3.392, 3.523], [3.536, 3.905], [3.971, 4.128], [4.142, 4.852], [5.023, 5.155], [5.168, 5.563]]}, {"kind": "s", "id": "s0_0_1", "md": "So when a colleague spends ten minutes on a side topic, we sit and wait, and the real agenda gets ==squeezed== into the last five minutes.", "zh": "所以同事在一个跑题的话题上讲了十分钟，我们就坐着等，真正的议程被挤到最后五分钟。", "sp": null, "gap": false, "start": 5.952, "end": 14.04, "words": [[6.057, 6.162], [6.176, 6.294], [6.307, 6.36], [6.373, 6.755], [6.768, 7.136], [7.149, 7.413], [7.426, 7.728], [7.741, 7.834], [7.847, 7.886], [7.899, 8.228], [8.241, 8.715], [8.978, 9.123], [9.136, 9.491], [9.597, 9.728], [9.741, 10.123], [10.452, 10.518], [10.531, 10.623], [10.636, 10.873], [10.886, 11.268], [11.281, 11.518], [11.531, 12.202], [12.215, 12.36], [12.373, 12.478], [12.491, 12.834], [12.847, 13.123], [13.136, 13.636]]}, {"kind": "s", "id": "s0_0_2", "md": "Everyone leaves annoyed, including the person who was talking.", "zh": "最后每个人都一肚子火，包括刚才那个讲话的人。", "sp": null, "gap": false, "start": 14.04, "end": 17.976, "words": [[14.145, 14.685], [14.698, 14.987], [15.001, 15.553], [15.948, 16.343], [16.356, 16.435], [16.448, 16.869], [16.882, 16.961], [16.974, 17.119], [17.132, 17.593]]}, {"kind": "s", "id": "s0_1_0", "md": "Think about who pays for that politeness.", "zh": "想想这份客气是谁在买单。", "sp": null, "gap": true, "start": 17.976, "end": 20.448, "words": [[18.094, 18.226], [18.239, 18.489], [18.502, 18.647], [18.66, 19.029], [19.042, 19.16], [19.173, 19.344], [19.358, 20.068]]}, {"kind": "s", "id": "s0_1_1", "md": "Eight people lose ten minutes each, and the decision you needed gets __pushed to next week__.", "zh": "八个人每人损失十分钟，本该做的决定又被推到了下周。", "sp": null, "gap": false, "start": 20.448, "end": 25.776, "words": [[20.553, 20.764], [20.777, 21.145], [21.159, 21.448], [21.461, 21.737], [21.751, 22.066], [22.08, 22.487], [22.803, 22.869], [22.882, 22.961], [22.974, 23.501], [23.514, 23.606], [23.619, 23.987], [24.001, 24.224], [24.237, 24.593], [24.606, 24.685], [24.698, 25.014], [25.027, 25.395]]}, {"kind": "s", "id": "s0_1_2", "md": "**Letting a meeting drift is not polite; it just spreads the cost around.**", "zh": "放任会议跑偏并不是礼貌，只是把代价摊给了所有人。", "sp": null, "gap": false, "start": 25.776, "end": 30.456, "words": [[25.881, 26.105], [26.118, 26.158], [26.171, 26.513], [26.526, 26.947], [27.079, 27.184], [27.197, 27.473], [27.487, 27.973], [28.394, 28.46], [28.473, 28.723], [28.737, 29.158], [29.171, 29.263], [29.276, 29.631], [29.644, 30.065]]}, {"kind": "s", "id": "s0_2_0", "md": "A good interruption is ==brief==, warm, and useful.", "zh": "好的打断要简短、友善、有用。", "sp": null, "gap": true, "start": 30.456, "end": 34.464, "words": [[30.561, 30.627], [30.64, 30.864], [30.877, 31.469], [31.482, 31.627], [31.64, 32.167], [32.588, 33.022], [33.482, 33.548], [33.561, 34.074]]}, {"kind": "s", "id": "s0_2_1", "md": "It protects the group's time without ==embarrassing== the speaker.", "zh": "它既保护了大家的时间，又不会让讲话的人难堪。", "sp": null, "gap": false, "start": 34.464, "end": 38.088, "words": [[34.569, 34.648], [34.661, 35.148], [35.161, 35.28], [35.293, 35.635], [35.648, 36.003], [36.109, 36.49], [36.503, 37.096], [37.109, 37.175], [37.188, 37.701]]}, {"kind": "s", "id": "s0_2_2", "md": "The trick is to __cut in__ on the topic, not on the person.", "zh": "诀窍是打断话题，而不是打断人。", "sp": null, "gap": false, "start": 38.088, "end": 41.544, "words": [[38.206, 38.259], [38.272, 38.562], [38.575, 38.693], [38.706, 38.812], [38.825, 39.075], [39.088, 39.285], [39.299, 39.404], [39.417, 39.496], [39.509, 40.009], [40.299, 40.496], [40.509, 40.588], [40.601, 40.667], [40.68, 41.141]]}, {"kind": "h", "id": "h1", "md": "2. The Name, Thanks, Bridge Pattern", "zh": "2. 叫名字、致谢、搭桥", "start": 41.544, "end": 45.0, "words": [[41.662, 41.912], [42.36, 42.452], [42.465, 42.86], [43.268, 43.807], [43.939, 44.215], [44.228, 44.61]]}, {"kind": "s", "id": "s1_0_0", "md": "Start with the person's name.", "zh": "先叫对方的名字。", "sp": null, "gap": false, "start": 45.0, "end": 46.872, "words": [[45.118, 45.395], [45.408, 45.526], [45.539, 45.618], [45.632, 46.092], [46.105, 46.368]]}, {"kind": "s", "id": "s1_0_1", "md": "Hearing their name makes people pause ==naturally==, so you don't have to raise your voice.", "zh": "人听到自己的名字会自然停下来，你不用提高嗓门。", "sp": null, "gap": false, "start": 46.872, "end": 52.152, "words": [[47.004, 47.24], [47.254, 47.398], [47.411, 47.727], [47.938, 48.161], [48.175, 48.53], [48.543, 48.938], [48.951, 49.569], [49.938, 50.043], [50.056, 50.161], [50.175, 50.438], [50.451, 50.675], [50.688, 50.767], [50.78, 51.056], [51.069, 51.175], [51.188, 51.767]]}, {"kind": "s", "id": "s1_0_2", "md": "\"Priya, sorry to jump in here.\"", "zh": "「Priya，不好意思插一句。」", "sp": null, "gap": false, "start": 52.152, "end": 54.456, "words": [[52.336, 52.52], [52.981, 53.244], [53.257, 53.323], [53.336, 53.613], [53.626, 53.718], [53.731, 54.047]]}, {"kind": "s", "id": "s1_1_0", "md": "Then give them credit for the point.", "zh": "然后肯定一下对方的观点。", "sp": null, "gap": true, "start": 54.456, "end": 56.472, "words": [[54.574, 54.706], [54.719, 54.903], [54.917, 55.048], [55.061, 55.443], [55.456, 55.574], [55.588, 55.667], [55.68, 56.088]]}, {"kind": "s", "id": "s1_1_1", "md": "\"That's a really good question about the logging format.\"", "zh": "「关于日志格式，这个问题提得很好。」", "sp": null, "gap": false, "start": 56.472, "end": 59.544, "words": [[56.683, 56.722], [56.801, 56.854], [56.867, 57.143], [57.156, 57.34], [57.354, 57.814], [57.827, 58.051], [58.064, 58.156], [58.169, 58.551], [58.564, 59.13]]}, {"kind": "s", "id": "s1_1_2", "md": "This ==signals== that you are not dismissing them, only __changing the timing__.", "zh": "这是在表明你没有否定他，只是换个时间讨论。", "sp": null, "gap": false, "start": 59.544, "end": 63.696, "words": [[59.649, 59.873], [59.886, 60.281], [60.294, 60.426], [60.439, 60.531], [60.544, 60.636], [60.649, 60.939], [60.952, 61.518], [61.531, 61.741], [62.189, 62.386], [62.399, 62.794], [62.807, 62.873], [62.886, 63.307]]}, {"kind": "s", "id": "s1_2_0", "md": "Finally, build a bridge back to the agenda.", "zh": "最后，搭一座桥回到议程上。", "sp": null, "gap": true, "start": 63.696, "end": 66.672, "words": [[63.867, 64.301], [64.578, 64.788], [64.801, 64.854], [64.867, 65.249], [65.262, 65.538], [65.551, 65.643], [65.657, 65.775], [65.788, 66.275]]}, {"kind": "s", "id": "s1_2_1", "md": "\"Can we __park it__ for the end, so we can finish the rollout plan first?\"", "zh": "「这个我们能不能放到最后聊，先把上线方案过完？」", "sp": null, "gap": false, "start": 66.672, "end": 71.112, "words": [[66.856, 66.922], [66.922, 67.027], [67.04, 67.343], [67.356, 67.422], [67.435, 67.554], [67.567, 67.659], [67.672, 68.054], [68.383, 68.501], [68.514, 68.619], [68.633, 68.764], [68.777, 69.132], [69.146, 69.238], [69.251, 69.698], [69.711, 70.001], [70.014, 70.606]]}, {"kind": "s", "id": "s1_2_2", "md": "**Always offer the topic a home, a later slot, a separate thread, or a follow-up call.**", "zh": "一定要给这个话题安排个去处，比如后面的时间、单独拉个群，或者另约个会。", "sp": null, "gap": false, "start": 71.112, "end": 77.016, "words": [[71.217, 71.572], [71.586, 71.849], [71.862, 71.954], [71.967, 72.362], [72.375, 72.428], [72.441, 72.823], [73.217, 73.244], [73.257, 73.573], [73.586, 74.02], [74.336, 74.375], [74.388, 74.809], [74.823, 75.191], [75.599, 75.691], [75.704, 75.744], [75.757, 76.257], [76.27, 76.612]]}, {"kind": "s", "id": "s1_2_3", "md": "People let go much more easily when they know their idea will not just disappear.", "zh": "大家知道自己的想法不会就这么没了，放手就容易得多。", "sp": null, "gap": false, "start": 77.016, "end": 81.816, "words": [[77.134, 77.424], [77.437, 77.608], [77.621, 77.792], [77.805, 78.069], [78.082, 78.292], [78.305, 78.792], [78.805, 78.95], [78.963, 79.056], [79.069, 79.319], [79.332, 79.503], [79.516, 79.963], [79.977, 80.134], [80.148, 80.477], [80.49, 80.753], [80.766, 81.424]]}, {"kind": "s", "id": "s1_3_0", "md": "On video calls, timing is harder, because a small delay makes everyone talk over each other.", "zh": "开视频会时时机更难把握，因为稍有延迟大家就会抢话。", "sp": null, "gap": true, "start": 81.816, "end": 87.912, "words": [[81.921, 82.04], [82.053, 82.461], [82.474, 83.013], [83.25, 83.698], [83.711, 83.816], [83.829, 84.224], [84.487, 84.763], [84.777, 84.829], [84.842, 85.211], [85.224, 85.619], [85.632, 85.948], [86.105, 86.5], [86.513, 86.803], [86.816, 87.027], [87.04, 87.184], [87.198, 87.513]]}, {"kind": "s", "id": "s1_3_1", "md": "Use the raise hand button or a short message in the chat first, then speak when there is a gap.", "zh": "先用举手按钮或者在聊天框里发条短消息，等有空当了再开口。", "sp": null, "gap": false, "start": 87.912, "end": 93.72, "words": [[88.017, 88.228], [88.241, 88.333], [88.346, 88.623], [88.636, 88.886], [88.899, 89.307], [89.386, 89.557], [89.57, 89.609], [89.623, 89.991], [90.004, 90.399], [90.412, 90.478], [90.491, 90.57], [90.583, 90.872], [90.886, 91.399], [91.715, 91.886], [91.899, 92.333], [92.451, 92.57], [92.583, 92.715], [92.728, 92.82], [92.833, 92.886], [92.899, 93.32]]}, {"kind": "s", "id": "s1_3_2", "md": "If you ==chair== the meeting, say at the start that you will keep things on track, so nobody takes it personally later.", "zh": "如果你是主持人，开场就说清楚你会把控节奏，这样之后没人会往心里去。", "sp": null, "gap": false, "start": 93.72, "end": 100.152, "words": [[93.825, 93.93], [93.944, 94.036], [94.049, 94.299], [94.312, 94.378], [94.391, 94.773], [95.062, 95.286], [95.299, 95.378], [95.391, 95.47], [95.483, 95.825], [95.838, 95.97], [95.983, 96.075], [96.088, 96.22], [96.233, 96.483], [96.496, 96.746], [96.759, 96.891], [96.904, 97.378], [97.786, 97.944], [97.957, 98.378], [98.391, 98.68], [98.694, 98.786], [98.799, 99.325], [99.338, 99.759]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
