<script>
const D = {"id": "003", "title": "How to Interrupt Politely", "meta": "B2 · 约 280 词 · 场景：会议控场", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Interrupting Is a Service", "heading_zh": "1. 打断也是一种付出", "rows": [[{"id": "s0_0_0", "md": "Many of us were taught that interrupting is rude.", "text": "Many of us were taught that interrupting is rude.", "zh": "我们很多人从小被教育，打断别人是不礼貌的。", "sp": null}, {"id": "s0_0_1", "md": "So when a colleague spends ten minutes on a side topic, we sit and wait, and the real agenda gets ==squeezed== into the last five minutes.", "text": "So when a colleague spends ten minutes on a side topic, we sit and wait, and the real agenda gets squeezed into the last five minutes.", "zh": "所以同事在一个跑题的话题上讲了十分钟，我们就坐着等，真正的议程被挤到最后五分钟。", "sp": null}, {"id": "s0_0_2", "md": "Everyone leaves annoyed, including the person who was talking.", "text": "Everyone leaves annoyed, including the person who was talking.", "zh": "最后每个人都一肚子火，包括刚才那个讲话的人。", "sp": null}], [{"id": "s0_1_0", "md": "Think about who pays for that politeness.", "text": "Think about who pays for that politeness.", "zh": "想想这份客气是谁在买单。", "sp": null}, {"id": "s0_1_1", "md": "Eight people lose ten minutes each, and the decision you needed gets __pushed to next week__.", "text": "Eight people lose ten minutes each, and the decision you needed gets pushed to next week.", "zh": "八个人每人损失十分钟，本该做的决定又被推到了下周。", "sp": null}, {"id": "s0_1_2", "md": "**Letting a meeting drift is not polite; it just spreads the cost around.**", "text": "Letting a meeting drift is not polite; it just spreads the cost around.", "zh": "放任会议跑偏并不是礼貌，只是把代价摊给了所有人。", "sp": null}], [{"id": "s0_2_0", "md": "A good interruption is ==brief==, warm, and useful.", "text": "A good interruption is brief, warm, and useful.", "zh": "好的打断要简短、友善、有用。", "sp": null}, {"id": "s0_2_1", "md": "It protects the group's time without ==embarrassing== the speaker.", "text": "It protects the group's time without embarrassing the speaker.", "zh": "它既保护了大家的时间，又不会让讲话的人难堪。", "sp": null}, {"id": "s0_2_2", "md": "The trick is to __cut in__ on the topic, not on the person.", "text": "The trick is to cut in on the topic, not on the person.", "zh": "诀窍是打断话题，而不是打断人。", "sp": null}]]}, {"heading": "2. The Name, Thanks, Bridge Pattern", "heading_zh": "2. 叫名字、致谢、搭桥", "rows": [[{"id": "s1_0_0", "md": "Start with the person's name.", "text": "Start with the person's name.", "zh": "先叫对方的名字。", "sp": null}, {"id": "s1_0_1", "md": "Hearing their name makes people pause ==naturally==, so you don't have to raise your voice.", "text": "Hearing their name makes people pause naturally, so you don't have to raise your voice.", "zh": "人听到自己的名字会自然停下来，你不用提高嗓门。", "sp": null}, {"id": "s1_0_2", "md": "\"Priya, sorry to jump in here.\"", "text": "\"Priya, sorry to jump in here.\"", "zh": "「Priya，不好意思插一句。」", "sp": null}], [{"id": "s1_1_0", "md": "Then give them credit for the point.", "text": "Then give them credit for the point.", "zh": "然后肯定一下对方的观点。", "sp": null}, {"id": "s1_1_1", "md": "\"That's a really good question about the logging format.\"", "text": "\"That's a really good question about the logging format.\"", "zh": "「关于日志格式，这个问题提得很好。」", "sp": null}, {"id": "s1_1_2", "md": "This ==signals== that you are not dismissing them, only __changing the timing__.", "text": "This signals that you are not dismissing them, only changing the timing.", "zh": "这是在表明你没有否定他，只是换个时间讨论。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, build a bridge back to the agenda.", "text": "Finally, build a bridge back to the agenda.", "zh": "最后，搭一座桥回到议程上。", "sp": null}, {"id": "s1_2_1", "md": "\"Can we __park it__ for the end, so we can finish the rollout plan first?\"", "text": "\"Can we park it for the end, so we can finish the rollout plan first?\"", "zh": "「这个我们能不能放到最后聊，先把上线方案过完？」", "sp": null}, {"id": "s1_2_2", "md": "**Always offer the topic a home, a later slot, a separate thread, or a follow-up call.**", "text": "Always offer the topic a home, a later slot, a separate thread, or a follow-up call.", "zh": "一定要给这个话题安排个去处，比如后面的时间、单独拉个群，或者另约个会。", "sp": null}, {"id": "s1_2_3", "md": "People let go much more easily when they know their idea will not just disappear.", "text": "People let go much more easily when they know their idea will not just disappear.", "zh": "大家知道自己的想法不会就这么没了，放手就容易得多。", "sp": null}], [{"id": "s1_3_0", "md": "On video calls, timing is harder, because a small delay makes everyone talk over each other.", "text": "On video calls, timing is harder, because a small delay makes everyone talk over each other.", "zh": "开视频会时时机更难把握，因为稍有延迟大家就会抢话。", "sp": null}, {"id": "s1_3_1", "md": "Use the raise hand button or a short message in the chat first, then speak when there is a gap.", "text": "Use the raise hand button or a short message in the chat first, then speak when there is a gap.", "zh": "先用举手按钮或者在聊天框里发条短消息，等有空当了再开口。", "sp": null}, {"id": "s1_3_2", "md": "If you ==chair== the meeting, say at the start that you will keep things on track, so nobody takes it personally later.", "text": "If you chair the meeting, say at the start that you will keep things on track, so nobody takes it personally later.", "zh": "如果你是主持人，开场就说清楚你会把控节奏，这样之后没人会往心里去。", "sp": null}]]}], "gist": [{"q": "作者为什么说放任跑题并不礼貌？", "a": "每个人都在为这份“礼貌”买单：八个人各浪费十分钟，该做的决定被推到下周，只是把成本分摊开了。"}, {"q": "礼貌打断的三步模式是什么？", "a": "先叫对方名字让他自然停下；肯定他的观点；再搭桥回到议程，比如把话题挪到会后。"}, {"q": "为什么要给被打断的话题“安排一个去处”？", "a": "对方知道自己的想法不会就此消失，才更容易放手。"}], "dictation": [{"id": "s0_1_2", "text": "Letting a meeting drift is not polite; it just spreads the cost around."}, {"id": "s1_2_2", "text": "Always offer the topic a home, a later slot, a separate thread, or a follow-up call."}, {"id": "s0_2_2", "text": "The trick is to cut in on the topic, not on the person."}, {"id": "s1_2_3", "text": "People let go much more easily when they know their idea will not just disappear."}], "shadow": {"text": "Finally, build a bridge back to the agenda. \"Can we park it for the end, so we can finish the rollout plan first?\"", "marked": "<b>Finally</b>, / build a <b>bridge</b> / back to the <b>agenda</b>. //<br>\"Can we <b>park</b> it / for the <b>end</b>, / so we can <b>finish</b> the rollout plan <b>first</b>?\" //"}, "prompts": [{"q": "上线评审会上，一位同事开始详细讲他对日志格式的意见，已经说了五分钟，离会议结束只剩十五分钟。用 30 秒礼貌打断他，并给这个话题安排去处。", "ref": "Arjun, sorry to jump in. That's a fair point about the log format, and I think it deserves a proper discussion. We only have fifteen minutes left, though, and we still need a go or no-go on the release. Could we park the logging question and pick it up in a separate thread this afternoon? I'll start the thread myself right after this call.", "ref_zh": "Arjun，不好意思插一句。你说的日志格式确实有道理，也值得好好讨论。不过我们只剩十五分钟了，还得定这次发布上不上。日志的问题能不能先放一放，下午单独拉个群聊？会一结束我就去拉群。", "id": "ref0"}, {"q": "线上会议，你作为主持人在开场时先打个招呼：今天议程紧，你可能会打断大家。用 30 秒说得友好又不让人尴尬。", "ref": "Before we start, a quick heads-up. We have three big items today and only forty-five minutes. So if a topic starts to run long, I might jump in and suggest we move it to the end or to a follow-up. Please don't take it personally, it's just to protect everyone's time. And feel free to do the same to me if I start rambling.", "ref_zh": "开始之前先提个醒。我们今天有三个大议题，只有四十五分钟。所以如果某个话题聊得太久，我可能会插一句，建议挪到最后或者会后再跟进。大家别往心里去，只是为了保护每个人的时间。如果我自己讲着讲着跑题了，你们也尽管打断我。", "id": "ref1"}], "words": [{"w": "squeeze", "ipa": "/skwiːz/", "zh": "挤压、硬塞进", "ex": "We squeezed the security review into the last day of the sprint.", "id": "w0"}, {"w": "brief", "ipa": "/briːf/", "zh": "简短的", "ex": "Keep the status update brief, two minutes per team.", "id": "w1"}, {"w": "embarrass", "ipa": "/ɪmˈbærəs/", "zh": "使难堪", "ex": "I didn't want to embarrass him by pointing out the bug in front of the client.", "id": "w2"}, {"w": "naturally", "ipa": "/ˈnætʃərəli/", "zh": "自然地", "ex": "Once the tests were green, the conversation naturally moved to the launch date.", "id": "w3"}, {"w": "signal (v.)", "ipa": "/ˈsɪɡnəl/", "zh": "表明、示意", "ex": "Moving the deadline signa const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
