const D = {"id": "110", "type": "dialogue", "title": "Ordering at a Hawker Centre", "meta": "B2 · 约 260 词 · 场景：熟食中心点鸡饭与打包", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Hawker", "name_zh": "摊主", "voice": "en-AU-WilliamMultilingualNeural"}}, "gist": [{"q": "「你」给自己和儿子各点了什么？", "a": "自己要烧鸡饭配鸡腿，加一个卤蛋；儿子要小份、不要辣椒，酱另外放。"}, {"q": "儿子那份出了什么问题？摊主怎么处理？", "a": "不小心放了辣椒；摊主重新做了一份不辣的。"}, {"q": "给太太打包时「你」提了哪些要求？", "a": "烧鸡饭，饭少黄瓜多，辣椒另装，汤要绑紧别洒；餐盒收两毛钱，不要餐具。"}], "dictation": [{"id": "s0_1_0", "text": "Hi. One chicken rice, please. Can I have roasted instead of steamed?"}, {"id": "s0_9_0", "text": "Can I pay by PayNow?"}, {"id": "s1_4_0", "text": "Roasted chicken rice, but with less rice and more cucumber. And please pack the chilli separately."}, {"id": "s1_8_0", "text": "No need, we have some at home. We're trying to use less plastic."}], "shadow": {"speaker": "A", "text": "Hi, sorry, I ordered here a few minutes ago. I think the small portion came with chilli by mistake.", "marked": "Hi, sorry, / I ordered here / a few <b>minutes</b> ago. //<br>I think the <b>small</b> portion / came with <b>chilli</b> / by <b>mistake</b>. //"}, "prompts": [{"q": "你在咖啡摊想点一杯少糖的冰奶茶，和一杯给孩子的热美禄，还想要一个袋子提走。跟摊主说清楚。", "ref": "Hi, uncle. Can I have one iced milk tea, less sugar, and one hot Milo for my son? Not too hot, please, he's only four. Both to take away. Could you put them in a bag with a handle, so I can carry them? I'm also buying food from the next stall. Thanks.", "ref_zh": "你好，大叔。一杯少糖冰奶茶，再给我儿子一杯热美禄，别太烫，他才四岁。都打包。能用带提手的袋子装吗？方便我拎着，我还要去隔壁摊买吃的。谢谢。", "id": "ref0"}, {"q": "找不到座位，你看到一张桌子上放着纸巾包（有人占座）。礼貌地问旁边的人能不能拼桌。", "ref": "Excuse me, is anyone sitting here? I see the tissue packet, so I wasn't sure. If your friends are coming, no problem, we'll look somewhere else. But if there's space, would you mind if my son and I shared the table with you? We'll only be about fifteen minutes.", "ref_zh": "不好意思，这里有人坐吗？我看到放着纸巾，所以不太确定。如果你朋友要来，没关系，我们去别处找。不过如果有空位，介意我和儿子跟你们拼个桌吗？我们大概只坐十五分钟。", "id": "ref1"}], "words": [{"w": "small portion", "ipa": "/smɔːl ˈpɔːrʃən/", "zh": "小份", "ex": "One small portion of fried rice, please.", "id": "w0"}, {"w": "takeaway", "ipa": "/ˈteɪkəweɪ/", "zh": "外带；打包", "ex": "Is this for here or takeaway?", "id": "w1"}, {"w": "braised", "ipa": "/breɪzd/", "zh": "卤的；炖的", "ex": "The braised pork belly melts in your mouth.", "id": "w2"}, {"w": "beansprouts", "ipa": "/ˈbiːnspraʊts/", "zh": "豆芽", "ex": "Add some beansprouts to the noodles, please.", "id": "w3"}, {"w": "container", "ipa": "/kənˈteɪnər/", "zh": "容器；餐盒", "ex": "Bring your own container and get a discount.", "id": "w4"}, {"w": "cutlery", "ipa": "/ˈkʌtləri/", "zh": "餐具", "ex": "Do you need cutlery with your order?", "id": "w5"}, {"w": "cucumber", "ipa": "/ˈkjuːkʌmbər/", "zh": "黄瓜", "ex": "Could I have extra cucumber with my rice?", "id": "w6"}, {"w": "spill", "ipa": "/spɪl/", "zh": "洒出来", "ex": "Hold the cup straight so it doesn't spill.", "id": "w7"}, {"w": "sort out", "ipa": "/sɔːrt aʊt/", "zh": "解决；处理好", "ex": "Thanks for sorting out the problem so fast.", "id": "w8"}], "sections": [{"heading": "1. At the Chicken Rice Stall", "heading_zh": "1. 在鸡饭摊点餐", "rows": [[{"id": "s0_0_0", "md": "Hi, boss. What would you like?", "text": "Hi, boss. What would you like?", "zh": "老板，要什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi. One chicken rice, please. Can I have roasted instead of steamed?**", "text": "Hi. One chicken rice, please. Can I have roasted instead of steamed?", "zh": "你好，一份鸡饭。能要烧鸡，不要白斩鸡吗？", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. Breast or thigh? Thigh is more tender.", "text": "Sure. Breast or thigh? Thigh is more tender.", "zh": "可以。要鸡胸还是鸡腿？鸡腿比较嫩。", "sp": "B"}], [{"id": "s0_3_0", "md": "Thigh, please. And one more, a ==small portion== for my son, with no chilli.", "text": "Thigh, please. And one more, a small portion for my son, with no chilli.", "zh": "鸡腿。再来一份小份给我儿子，不要辣椒。", "sp": "A"}], [{"id": "s0_4_0", "md": "Okay, one small, no chilli. Eating here or ==takeaway==?", "text": "Okay, one small, no chilli. Eating here or takeaway?", "zh": "好，一份小的，不要辣。在这里吃还是打包？", "sp": "B"}], [{"id": "s0_5_0", "md": "Eating here. We're at table forty-two, near the drinks stall.", "text": "Eating here. We're at table forty-two, near the drinks stall.", "zh": "在这里吃。我们坐四十二号桌，饮料摊旁边。", "sp": "A"}], [{"id": "s0_6_0", "md": "Okay, I'll bring it over. Want any extras? We have ==braised== egg and ==beansprouts==.", "text": "Okay, I'll bring it over. Want any extras? We have braised egg and beansprouts.", "zh": "好，我端过去。要加什么吗？有卤蛋和豆芽。", "sp": "B"}], [{"id": "s0_7_0", "md": "One braised egg, please. And could you __put the sauce on the side__ for the small one?", "text": "One braised egg, please. And could you put the sauce on the side for the small one?", "zh": "加一个卤蛋。小份的酱能另外放吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "No problem. That's eight fifty altogether.", "text": "No problem. That's eight fifty altogether.", "zh": "没问题。一共八块五。", "sp": "B"}], [{"id": "s0_9_0", "md": "**Can I pay by PayNow?**", "text": "Can I pay by PayNow?", "zh": "可以用 PayNow 付吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Sure, scan the code here. Just __show me the screen__ after.", "text": "Sure, scan the code here. Just show me the screen after.", "zh": "可以，扫这里的码。付完给我看一下屏幕。", "sp": "B"}]]}, {"heading": "2. A Mix-up and a Takeaway Order", "heading_zh": "2. 搞错了，再打包一份", "rows": [[{"id": "s1_0_0", "md": "Hi, sorry, I ordered here a few minutes ago. I think the small portion came with chilli by mistake.", "text": "Hi, sorry, I ordered here a few minutes ago. I think the small portion came with chilli by mistake.", "zh": "你好，不好意思，我几分钟前在这里点的。小份那盘好像不小心放了辣椒。", "sp": "A"}], [{"id": "s1_1_0", "md": "Oh, sorry about that. I'll make you a new one, no chilli this time.", "text": "Oh, sorry about that. I'll make you a new one, no chilli this time.", "zh": "哦，不好意思。我给你重新做一份，这次不放辣。", "sp": "B"}], [{"id": "s1_2_0", "md": "Thanks. const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {

  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);

$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);

$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };

if (D.type === 'dialogue') $('role').hidden = false;
