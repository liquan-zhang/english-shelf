const D = {"id": "110", "type": "dialogue", "title": "Ordering at a Hawker Centre", "meta": "B2 · 约 260 词 · 场景：熟食中心点鸡饭与打包", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Hawker", "name_zh": "摊主", "voice": "en-AU-WilliamMultilingualNeural"}}, "gist": [{"q": "「你」给自己和儿子各点了什么？", "a": "自己要烧鸡饭配鸡腿，加一个卤蛋；儿子要小份、不要辣椒，酱另外放。"}, {"q": "儿子那份出了什么问题？摊主怎么处理？", "a": "不小心放了辣椒；摊主重新做了一份不辣的。"}, {"q": "给太太打包时「你」提了哪些要求？", "a": "烧鸡饭，饭少黄瓜多，辣椒另装，汤要绑紧别洒；餐盒收两毛钱，不要餐具。"}], "dictation": [{"id": "s0_1_0", "text": "Hi. One chicken rice, please. Can I have roasted instead of steamed?"}, {"id": "s0_9_0", "text": "Can I pay by PayNow?"}, {"id": "s1_4_0", "text": "Roasted chicken rice, but with less rice and more cucumber. And please pack the chilli separately."}, {"id": "s1_8_0", "text": "No need, we have some at home. We're trying to use less plastic."}], "shadow": {"speaker": "A", "text": "Hi, sorry, I ordered here a few minutes ago. I think the small portion came with chilli by mistake.", "marked": "Hi, sorry, / I ordered here / a few <b>minutes</b> ago. //<br>I think the <b>small</b> portion / came with <b>chilli</b> / by <b>mistake</b>. //"}, "prompts": [{"q": "你在咖啡摊想点一杯少糖的冰奶茶，和一杯给孩子的热美禄，还想要一个袋子提走。跟摊主说清楚。", "ref": "Hi, uncle. Can I have one iced milk tea, less sugar, and one hot Milo for my son? Not too hot, please, he's only four. Both to take away. Could you put them in a bag with a handle, so I can carry them? I'm also buying food from the next stall. Thanks.", "ref_zh": "你好，大叔。一杯少糖冰奶茶，再给我儿子一杯热美禄，别太烫，他才四岁。都打包。能用带提手的袋子装吗？方便我拎着，我还要去隔壁摊买吃的。谢谢。", "id": "ref0"}, {"q": "找不到座位，你看到一张桌子上放着纸巾包（有人占座）。礼貌地问旁边的人能不能拼桌。", "ref": "Excuse me, is anyone sitting here? I see the tissue packet, so I wasn't sure. If your friends are coming, no problem, we'll look somewhere else. But if there's space, would you mind if my son and I shared the table with you? We'll only be about fifteen minutes.", "ref_zh": "不好意思，这里有人坐吗？我看到放着纸巾，所以不太确定。如果你朋友要来，没关系，我们去别处找。不过如果有空位，介意我和儿子跟你们拼个桌吗？我们大概只坐十五分钟。", "id": "ref1"}], "words": [{"w": "small portion", "ipa": "/smɔːl ˈpɔːrʃən/", "zh": "小份", "ex": "One small portion of fried rice, please.", "id": "w0"}, {"w": "takeaway", "ipa": "/ˈteɪkəweɪ/", "zh": "外带；打包", "ex": "Is this for here or takeaway?", "id": "w1"}, {"w": "braised", "ipa": "/breɪzd/", "zh": "卤的；炖的", "ex": "The braised pork belly melts in your mouth.", "id": "w2"}, {"w": "beansprouts", "ipa": "/ˈbiːnspraʊts/", "zh": "豆芽", "ex": "Add some beansprouts to the noodles, please.", "id": "w3"}, {"w": "container", "ipa": "/kənˈteɪnər/", "zh": "容器；餐盒", "ex": "Bring your own container and get a discount.", "id": "w4"}, {"w": "cutlery", "ipa": "/ˈkʌtləri/", "zh": "餐具", "ex": "Do you need cutlery with your order?", "id": "w5"}, {"w": "cucumber", "ipa": "/ˈkjuːkʌmbər/", "zh": "黄瓜", "ex": "Could I have extra cucumber with my rice?", "id": "w6"}, {"w": "spill", "ipa": "/spɪl/", "zh": "洒出来", "ex": "Hold the cup straight so it doesn't spill.", "id": "w7"}, {"w": "sort out", "ipa": "/sɔːrt aʊt/", "zh": "解决；处理好", "ex": "Thanks for sorting out the problem so fast.", "id": "w8"}], "sections": [{"heading": "1. At the Chicken Rice Stall", "heading_zh": "1. 在鸡饭摊点餐", "rows": [[{"id": "s0_0_0", "md": "Hi, boss. What would you like?", "text": "Hi, boss. What would you like?", "zh": "老板，要什么？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi. One chicken rice, please. Can I have roasted instead of steamed?**", "text": "Hi. One chicken rice, please. Can I have roasted instead of steamed?", "zh": "你好，一份鸡饭。能要烧鸡，不要白斩鸡吗？", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. Breast or thigh? Thigh is more tender.", "text": "Sure. Breast or thigh? Thigh is more tender.", "zh": "可以。要鸡胸还是鸡腿？鸡腿比较嫩。", "sp": "B"}], [{"id": "s0_3_0", "md": "Thigh, please. And one more, a ==small portion== for my son, with no chilli.", "text": "Thigh, please. And one more, a small portion for my son, with no chilli.", "zh": "鸡腿。再来一份小份给我儿子，不要辣椒。", "sp": "A"}], [{"id": "s0_4_0", "md": "Okay, one small, no chilli. Eating here or ==takeaway==?", "text": "Okay, one small, no chilli. Eating here or takeaway?", "zh": "好，一份小的，不要辣。在这里吃还是打包？", "sp": "B"}], [{"id": "s0_5_0", "md": "Eating here. We're at table forty-two, near the drinks stall.", "text": "Eating here. We're at table forty-two, near the drinks stall.", "zh": "在这里吃。我们坐四十二号桌，饮料摊旁边。", "sp": "A"}], [{"id": "s0_6_0", "md": "Okay, I'll bring it over. Want any extras? We have ==braised== egg and ==beansprouts==.", "text": "Okay, I'll bring it over. Want any extras? We have braised egg and beansprouts.", "zh": "好，我端过去。要加什么吗？有卤蛋和豆芽。", "sp": "B"}], [{"id": "s0_7_0", "md": "One braised egg, please. And could you __put the sauce on the side__ for the small one?", "text": "One braised egg, please. And could you put the sauce on the side for the small one?", "zh": "加一个卤蛋。小份的酱能另外放吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "No problem. That's eight fifty altogether.", "text": "No problem. That's eight fifty altogether.", "zh": "没问题。一共八块五。", "sp": "B"}], [{"id": "s0_9_0", "md": "**Can I pay by PayNow?**", "text": "Can I pay by PayNow?", "zh": "可以用 PayNow 付吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Sure, scan the code here. Just __show me the screen__ after.", "text": "Sure, scan the code here. Just show me the screen after.", "zh": "可以，扫这里的码。付完给我看一下屏幕。", "sp": "B"}]]}, {"heading": "2. A Mix-up and a Takeaway Order", "heading_zh": "2. 搞错了，再打包一份", "rows": [[{"id": "s1_0_0", "md": "Hi, sorry, I ordered here a few minutes ago. I think the small portion came with chilli by mistake.", "text": "Hi, sorry, I ordered here a few minutes ago. I think the small portion came with chilli by mistake.", "zh": "你好，不好意思，我几分钟前在这里点的。小份那盘好像不小心放了辣椒。", "sp": "A"}], [{"id": "s1_1_0", "md": "Oh, sorry about that. I'll make you a new one, no chilli this time.", "text": "Oh, sorry about that. I'll make you a new one, no chilli this time.", "zh": "哦，不好意思。我给你重新做一份，这次不放辣。", "sp": "B"}], [{"id": "s1_2_0", "md": "Thanks. And while I'm here, could I __order one to go__? My wife is working late.", "text": "Thanks. And while I'm here, could I order one to go? My wife is working late.", "zh": "谢谢。顺便再打包一份可以吗？我太太加班晚回来。", "sp": "A"}], [{"id": "s1_3_0", "md": "Sure. Same as yours?", "text": "Sure. Same as yours?", "zh": "好。跟你的一样？", "sp": "B"}], [{"id": "s1_4_0", "md": "Roasted chicken rice, but with less rice and more ==cucumber==. And please __pack the chilli separately__.", "text": "Roasted chicken rice, but with less rice and more cucumber. And please pack the chilli separately.", "zh": "烧鸡饭，饭少一点，黄瓜多一点。辣椒请另外装。", "sp": "A"}], [{"id": "s1_5_0", "md": "Okay. For takeaway, there's a twenty cent charge for the ==container==. Is that alright?", "text": "Okay. For takeaway, there's a twenty cent charge for the container. Is that alright?", "zh": "好。打包的话餐盒要收两毛钱，可以吗？", "sp": "B"}], [{"id": "s1_6_0", "md": "That's fine. Could you also pack the soup? Make sure it's tied tight so it doesn't ==spill==.", "text": "That's fine. Could you also pack the soup? Make sure it's tied tight so it doesn't spill.", "zh": "可以。汤也帮我装一下？绑紧一点，别洒了。", "sp": "A"}], [{"id": "s1_7_0", "md": "Will do. Do you need any ==cutlery==?", "text": "Will do. Do you need any cutlery?", "zh": "好的。要餐具吗？", "sp": "B"}], [{"id": "s1_8_0", "md": "**No need, we have some at home. We're trying to use less plastic.**", "text": "No need, we have some at home. We're trying to use less plastic.", "zh": "不用，家里有。我们在尽量少用塑料。", "sp": "A"}], [{"id": "s1_9_0", "md": "Good on you. Here's the new plate for your boy. I'll call you when the takeaway's ready.", "text": "Good on you. Here's the new plate for your boy. I'll call you when the takeaway's ready.", "zh": "真不错。这是给你儿子的新一份。打包的好了我叫你。", "sp": "B"}], [{"id": "s1_10_0", "md": "Great, thanks for __sorting it out__ so quickly.", "text": "Great, thanks for sorting it out so quickly.", "zh": "好的，谢谢你这么快就弄好了。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. At the Chicken Rice Stall", "zh": const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress

const steps = [];
function step(id, name, time, how, body) {

  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
