<script>
const D = {"id": "080", "title": "The Pre-Read That Wins the Meeting", "meta": "B2 · 约 260 词 · 场景：会前材料", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Decided Before It Starts", "heading_zh": "1. 开会之前就已定局", "rows": [[{"id": "s0_0_0", "md": "If you walk into a decision meeting with only slides, you are starting from behind.", "text": "If you walk into a decision meeting with only slides, you are starting from behind.", "zh": "如果你只带着 PPT 走进一个决策会，你一开始就落后了。", "sp": null}, {"id": "s0_0_1", "md": "People see your idea for the first time, react to it in real time, and the loudest first reaction often __sets the direction__.", "text": "People see your idea for the first time, react to it in real time, and the loudest first reaction often sets the direction.", "zh": "大家第一次看到你的想法，当场做出反应，而第一个、嗓门最大的反应往往就定了方向。", "sp": null}, {"id": "s0_0_2", "md": "You spend the hour defending basics instead of discussing the real question.", "text": "You spend the hour defending basics instead of discussing the real question.", "zh": "你一个小时都在为基础问题辩护，而不是讨论真正的问题。", "sp": null}], [{"id": "s0_1_0", "md": "A good pre-read changes that.", "text": "A good pre-read changes that.", "zh": "一份好的会前材料能改变这一切。", "sp": null}, {"id": "s0_1_1", "md": "Attendees arrive having already ==digested== your proposal, with considered questions instead of ==improvised== ones.", "text": "Attendees arrive having already digested your proposal, with considered questions instead of improvised ones.", "zh": "参会的人来之前就已经消化了你的方案，带着想清楚的问题来，而不是临场想出来的问题。", "sp": null}, {"id": "s0_1_2", "md": "The meeting becomes a discussion of the hard parts rather than a ==tour== of the basics.", "text": "The meeting becomes a discussion of the hard parts rather than a tour of the basics.", "zh": "会议就变成了讨论难点，而不是把基础信息逛一遍。", "sp": null}], [{"id": "s0_2_0", "md": "**The meeting is where the decision is announced; the pre-read is where it is won.**", "text": "The meeting is where the decision is announced; the pre-read is where it is won.", "zh": "会议是宣布决定的地方；会前材料才是赢下决定的地方。", "sp": null}, {"id": "s0_2_1", "md": "Senior people especially value it, because it respects their time and lets them __weigh in__ ahead of time.", "text": "Senior people especially value it, because it respects their time and lets them weigh in ahead of time.", "zh": "高层尤其看重这一点，因为这尊重他们的时间，也让他们能提前发表意见。", "sp": null}, {"id": "s0_2_2", "md": "It also helps colleagues who work in a second language and prefer to read before they speak.", "text": "It also helps colleagues who work in a second language and prefer to read before they speak.", "zh": "它也照顾到了用第二语言工作、喜欢先读再说的同事。", "sp": null}]]}, {"heading": "2. One Page, Ask at the Top", "heading_zh": "2. 一页纸，诉求放最前", "rows": [[{"id": "s1_0_0", "md": "Put the ask in the first two lines.", "text": "Put the ask in the first two lines.", "zh": "把诉求放在头两行。", "sp": null}, {"id": "s1_0_1", "md": "\"We'd like approval to move the image service to the new storage layer next quarter, at an extra cost of about eight percent.\"", "text": "\"We'd like approval to move the image service to the new storage layer next quarter, at an extra cost of about eight percent.\"", "zh": "「我们希望批准下个季度把图片服务迁到新的存储层，额外成本大约百分之八。」", "sp": null}, {"id": "s1_0_2", "md": "Readers who stop there should still ==grasp== exactly what you want.", "text": "Readers who stop there should still grasp exactly what you want.", "zh": "读到这里就停下的人，也应该能准确明白你要什么。", "sp": null}], [{"id": "s1_1_0", "md": "Then give the context, the ==alternatives== you rejected, and the main risk with its ==safeguard==.", "text": "Then give the context, the alternatives you rejected, and the main risk with its safeguard.", "zh": "然后交代背景、你否掉的备选方案，以及主要风险和对应的保障措施。", "sp": null}, {"id": "s1_1_1", "md": "Keep it to one page, and send it at least a day before.", "text": "Keep it to one page, and send it at least a day before.", "zh": "控制在一页以内，至少提前一天发出去。", "sp": null}, {"id": "s1_1_2", "md": "A pre-read that arrives an hour early is just homework nobody did.", "text": "A pre-read that arrives an hour early is just homework nobody did.", "zh": "提前一小时才到的会前材料，只是一份没人做的作业。", "sp": null}], [{"id": "s1_2_0", "md": "For important decisions, __give key people a heads-up__ before the doc goes out.", "text": "For important decisions, give key people a heads-up before the doc goes out.", "zh": "对于重要的决定，在文档发出之前先跟关键人物打个招呼。", "sp": null}, {"id": "s1_2_1", "md": "Ask them, \"Is there anything here that would stop you from agreeing?\"", "text": "Ask them, \"Is there anything here that would stop you from agreeing?\"", "zh": "问他们：「这里面有没有什么会让你没法同意的？」", "sp": null}, {"id": "s1_2_2", "md": "**Objections you hear in private the day before are easy to fix; objections you hear in the room are not.**", "text": "Objections you hear in private the day before are easy to fix; objections you hear in the room are not.", "zh": "前一天私下听到的反对意见很好解决；在会上才听到的反对意见就不好办了。", "sp": null}]]}], "gist": [{"q": "只带幻灯片进决策会有什么问题？", "a": "大家第一次看到方案、当场反应，最响的第一反应往往定方向，你整场都在解释基础内容。"}, {"q": "一份好的会前材料怎么写？", "a": "开头两行写清诉求；再写背景、否掉的备选方案、主要风险和保障措施；控制在一页，至少提前一天发。"}, {"q": "重要决策还要额外做什么？为什么？", "a": "发文档前先私下给关键人打招呼，问有没有会让他们不同意的点；前一天私下听到的反对好解决，会上听到的就难了。"}], "dictation": [{"id": "s0_2_0", "text": "The meeting is where the decision is announced; the pre-read is where it is won."}, {"id": "s1_0_2", "text": "Readers who stop there should still grasp exactly what you want."}, {"id": "s1_1_2", "text": "A pre-read that arrives an hour early is just homework nobody did."}, {"id": "s1_2_2", "text": "Objections you hear in private the day before are easy to fix; objections you hear in the room are not."}], "shadow": {"text": "A good pre-read changes that. Attendees arrive having already digested your proposal, with considered questions instead of improvised ones. The meeting becomes a discussion of the hard parts rather than a tour of the basics.", "marked": "A <b>good</b> pre-read / <b>changes</b> that. //<br>Attendees arrive / having <b>already</b> digested your proposal, / with <b>considered</b> questions / instead of <b>improvised</b> ones. //<br>The meeting becomes a discussion / of the <b>hard</b> parts / rather than a <b>tour</b> / of the <b>basics</b>. //"}, "prompts": [{"q": "明天要在评审会上申请扩容预算。用 30 秒口头说出你会前材料开头的“诉求两行”和关键内容。", "ref": "The first two lines will say: we're asking for approval to add twenty percent more GPU capacity next quarter, at a cost of about fifteen thousand dollars a month. Below that, I'll explain why: training jobs are waiting an average of six hours. I'll list the two alternatives we rejected, and the main risk, which is low usage over holidays, with our plan to release capacity if that happens.", "ref_zh": "头两行会这么写：我们申请下个季度增加百分之二十的 GPU 算力，成本大约每月一万五千美元。下面我会解释原因：训练任务平均要排队六个小时。我会列出我们否掉的两个备选方案，以及主要风险，也就是节假日期间利用率低，还有万一出现这种情况我们释放算力的方案。", "id": "ref0"}, {"q": "评审会前一天，你想先和最可能反对的财务同事沟通。用 30 秒打这个招呼。", "ref": "Hi Grace, do you have five minutes? Tomorrow I'm presenting the storage migration proposal, and I'm sending the one-page pre-read this afternoon. Since the cost section matters most to you, I wanted to walk you through it first. Is there anything in the numbers that would stop you from supporting it? I'd much rather fix it today than discover it in the room.", "ref_zh": "Grace 你好，有五分钟吗？明天我要讲存储迁移的方案，今天下午会把一页纸的会前材料发出来。成本部分对你最重要，所以我想先带你过一遍。这些数字里有没有什么会让你没法支持的？我宁愿今天就改好，也不想在会上才发现。", "id": "ref1"}], "words": [{"w": "digest (v.)", "ipa": "/daɪˈdʒest/", "zh": "消化、理解吸收", "ex": "Give people a day to digest the proposal before we vote.", "tts_w": "digest", "id": "w0"}, {"w": "improvise", "ipa": "/ˈɪmprəˌvaɪz/", "zh": "即兴发挥、临时应付", "ex": "The demo crashed, so I had to improvise with screenshots.", "id": "w1"}, {"w": "tour", "ipa": "/tʊr/", "zh": "（逐一的）介绍、巡览", "ex": "She gave the new hires a quick tour of the codebase.", "id": "w2"}, {"w": "grasp (v.)", "ipa": "/ɡræsp/", "zh": "理解、领会", "ex": "It took me a while to grasp how the billing system works.", "tts_w": "grasp", "id": "w3"}, {"w": "alternative", "ipa": "/ɔːlˈtɜːrnətɪv/", "zh": omework nobody did.", "zh": "提前一小时才到的会前材料，只是一份没人做的作业。", "sp": null, "gap": false, "start": 76.104, "end": 80.256, "words": [[76.209, 76.275], [76.288, 76.736], [76.749, 76.854], [76.867, 77.288], [77.301, 77.394], [77.407, 77.709], [77.722, 78.143], [78.275, 78.407], [78.42, 78.683], [78.696, 79.183], [79.196, 79.578], [79.591, 79.867]]}, {"kind": "s", "id": "s1_2_0", "md": "For important decisions, __give key people a heads-up__ before the doc goes out.", "zh": "对于重要的决定，在文档发出之前先跟关键人物打个招呼。", "sp": null, "gap": true, "start": 80.256, "end": 84.984, "words": [[80.401, 80.493], [80.506, 80.927], [80.94, 81.624], [81.861, 82.085], [82.098, 82.322], [82.335, 82.69], [82.703, 82.756], [82.769, 83.282], [83.295, 83.651], [83.664, 83.743], [83.756, 84.032], [84.045, 84.295], [84.309, 84.598]]}, {"kind": "s", "id": "s1_2_1", "md": "Ask them, \"Is there anything here that would stop you from agreeing?\"", "zh": "问他们：「这里面有没有什么会让你没法同意的？」", "sp": null, "gap": false, "start": 84.984, "end": 88.872, "words": [[85.076, 85.352], [85.366, 85.563], [86.037, 86.142], [86.155, 86.339], [86.352, 86.76], [86.773, 86.997], [87.01, 87.102], [87.116, 87.234], [87.247, 87.629], [87.642, 87.773], [87.787, 87.958], [87.971, 88.431]]}, {"kind": "s", "id": "s1_2_2", "md": "**Objections you hear in private the day before are easy to fix; objections you hear in the room are not.**", "zh": "前一天私下听到的反对意见很好解决；在会上才听到的反对意见就不好办了。", "sp": null, "gap": false, "start": 88.872, "end": 95.976, "words": [[88.964, 89.583], [89.596, 89.714], [89.727, 90.017], [90.03, 90.135], [90.148, 90.596], [90.609, 90.701], [90.714, 90.912], [90.925, 91.504], [91.622, 91.78], [91.938, 92.227], [92.24, 92.319], [92.333, 92.938], [93.385, 93.951], [93.964, 94.056], [94.069, 94.306], [94.319, 94.385], [94.398, 94.464], [94.477, 94.859], [95.017, 95.109], [95.122, 95.596]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
