<script>
const D = {"id": "080", "title": "The Pre-Read That Wins the Meeting", "meta": "B2 · 约 260 词 · 场景：会前材料", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Decided Before It Starts", "heading_zh": "1. 开会之前就已定局", "rows": [[{"id": "s0_0_0", "md": "If you walk into a decision meeting with only slides, you are starting from behind.", "text": "If you walk into a decision meeting with only slides, you are starting from behind.", "zh": "如果你只带着 PPT 走进一个决策会，你一开始就落后了。", "sp": null}, {"id": "s0_0_1", "md": "People see your idea for the first time, react to it in real time, and the loudest first reaction often __sets the direction__.", "text": "People see your idea for the first time, react to it in real time, and the loudest first reaction often sets the direction.", "zh": "大家第一次看到你的想法，当场做出反应，而第一个、嗓门最大的反应往往就定了方向。", "sp": null}, {"id": "s0_0_2", "md": "You spend the hour defending basics instead of discussing the real question.", "text": "You spend the hour defending basics instead of discussing the real question.", "zh": "你一个小时都在为基础问题辩护，而不是讨论真正的问题。", "sp": null}], [{"id": "s0_1_0", "md": "A good pre-read changes that.", "text": "A good pre-read changes that.", "zh": "一份好的会前材料能改变这一切。", "sp": null}, {"id": "s0_1_1", "md": "Attendees arrive having already ==digested== your proposal, with considered questions instead of ==improvised== ones.", "text": "Attendees arrive having already digested your proposal, with considered questions instead of improvised ones.", "zh": "参会的人来之前就已经消化了你的方案，带着想清楚的问题来，而不是临场想出来的问题。", "sp": null}, {"id": "s0_1_2", "md": "The meeting becomes a discussion of the hard parts rather than a ==tour== of the basics.", "text": "The meeting becomes a discussion of the hard parts rather than a tour of the basics.", "zh": "会议就变成了讨论难点，而不是把基础信息逛一遍。", "sp": null}], [{"id": "s0_2_0", "md": "**The meeting is where the decision is announced; the pre-read is where it is won.**", "text": "The meeting is where the decision is announced; the pre-read is where it is won.", "zh": "会议是宣布决定的地方；会前材料才是赢下决定的地方。", "sp": null}, {"id": "s0_2_1", "md": "Senior people especially value it, because it respects their time and lets them __weigh in__ ahead of time.", "text": "Senior people especially value it, because it respects their time and lets them weigh in ahead of time.", "zh": "高层尤其看重这一点，因为这尊重他们的时间，也让他们能提前发表意见。", "sp": null}, {"id": "s0_2_2", "md": "It also helps colleagues who work in a second language and prefer to read before they speak.", "text": "It also helps colleagues who work in a second language and prefer to read before they speak.", "zh": "它也照顾到了用第二语言工作、喜欢先读再说的同事。", "sp": null}]]}, {"heading": "2. One Page, Ask at the Top", "heading_zh": "2. 一页纸，诉求放最前", "rows": [[{"id": "s1_0_0", "md": "Put the ask in the first two lines.", "text": "Put the ask in the first two lines.", "zh": "把诉求放在头两行。", "sp": null}, {"id": "s1_0_1", "md": "\"We'd like approval to move the image service to the new storage layer next quarter, at an extra cost of about eight percent.\"", "text": "\"We'd like approval to move the image service to the new storage layer next quarter, at an extra cost of about eight percent.\"", "zh": "「我们希望批准下个季度把图片服务迁到新的存储层，额外成本大约百分之八。」", "sp": null}, {"id": "s1_0_2", "md": "Readers who stop there should still ==grasp== exactly what you want.", "text": "Readers who stop there should still grasp exactly what you want.", "zh": "读到这里就停下的人，也应该能准确明白你要什么。", "sp": null}], [{"id": "s1_1_0", "md": "Then give the context, the ==alternatives== you rejected, and the main risk with its ==safeguard==.", "text": "Then give the context, the alternatives you rejected, and the main risk with its safeguard.", "zh": "然后交代背景、你否掉的备选方案，以及主要风险和对应的保障措施。", "sp": null}, {"id": "s1_1_1", "md": "Keep it to one page, and send it at least a day before.", "text": "Keep it to one page, and send it at least a day before.", "zh": "控制在一页以内，至少提前一天发出去。", "sp": null}, {"id": "s1_1_2", "md": "A pre-read that arrives an hour early is just homework nobody did.", "text": "A pre-read that arrives an hour early is just homework nobody did.", "zh": "提前一小时才到的会前材料，只是一份没人做的作业。", "sp": null}], [{"id": "s1_2_0", "md": "For important decisions, __give key people a heads-up__ before the doc goes out.", "text": "For important decisions, give key people a heads-up before the doc goes out.", "zh": "对于重要的决定，在文档发出之前先跟关键人物打个招呼。", "sp": null}, {"id": "s1_2_1", "md": "Ask them, \"Is there anything here that would stop you from agreeing?\"", "text": "Ask them, \"Is there anything here that would stop you from agreeing?\"", "zh": "问他们：「这里面有没有什么会让你没法同意的？」", "sp": null}, {"id": "s1_2_2", "md": "**Objections you hear in private the day before are easy to fix; objections you hear in the room are not.**", "text": "Objections you hear in private the day before are easy to fix; objections you hear in the room are not.", "zh": "前一天私下听到的反对意见很好解决；在会上才听到的反对意见就不好办了。", "sp": null}]]}], "gist": [{"q": "只带幻灯片进决策会有什么问题？", "a": "大家第一次看到方案、当场反应，最响的第一反应往往定方向，你整场都在解释基础内容。"}, {"q": "一份好的会前材料怎么写？", "a": "开头两行写清诉求；再写背景、否掉的备选方案、主要风险和保障措施；控制在一页，至少提前一天发。"}, {"q": "重要决策还要额外做什么？为什么？", "a": "发文档前先私下给关键人打招呼，问有没有会让他们不同意的点；前一天私下听到的反对好解决，会上听到的就难了。"}], "dictation": [{"id": "s0_2_0", "text": "The meeting is where the decision is announced; the pre-read is where it is won."}, {"id": "s1_0_2", "text": "Readers who stop there should still grasp exactly what you want."}, {"id": "s1_1_2", "text": "A pre-read that arrives an hour early is just homework nobody did."}, {"id": "s1_2_2", "text": "Objections you hear in private the day before are easy to fix; objections you hear in the room are not."}], "shadow": {"text": "A good pre-read changes that. Attendees arrive having already digested your proposal, with considered questions instead of improvised ones. The meeting becomes a discussion of the hard parts rather than a tour of the basics.", "marked": "A <b>good</b> pre-read / <b>changes</b> that. //<br>Attendees arrive / having <b>already</b> digested your proposal, / with <b>considered</b> questions / instead of <b>improvised</b> ones. //<br>The meeting becomes a discussion / of the <b>hard</b> parts / rather than a <b>tour</b> / of the <b>basics</b>. //"}, "prompts": [{"q": "明天要在评审会上申请扩容预算。用 30 秒口头说出你会前材料开头的“诉求两行”和关键内容。", "ref": "The first two lines will say: we're asking for approval to add twenty percent more GPU capacity next quarter, at a cost of about fifteen thousand dollars a month. Below that, I'll explain why: training jobs are waiting an average of six hours. I'll list the two alternatives we rejected, and the main risk, which is low usage over holidays, with our plan to release capacity if that happens.", "ref_zh": "头两行会这么写：我们申请下个季度增加百分之二十的 GPU 算力，成本大约每月一万五千美元。下面我会解释原因：训练任务平均要排队六个小时。我会列出我们否掉的两个备选方案，以及主要风险，也就是节假日期间利用率低，还有万一出现这种情况我们释放算力的方案。", "id": "ref0"}, {"q": "评审会前一天，你想先和最可能反对的财务同事沟通。用 30 秒打这个招呼。", "ref": "Hi Grace, do you have five minutes? Tomorrow I'm presenting the storage migration proposal, and I'm sending the one-page pre-read this afternoon. Since the cost section matters most to you, I wanted to walk you through it first. Is there anything in the numbers that would stop you from supporting it? I'd much rather fix it today than discover it in the room.", "ref_zh": "Grace 你好，有五分钟吗？明天我要讲存储迁移的方案，今天下午会把一页纸的会前材料发出来。成本部分对你最重要，所以我想先带你过一遍。这些数字里有没有什么会让你没法支持的？我宁愿今天就改好，也不想在会上才发现。", "id": "ref1"}], "words": [{"w": "digest (v.)", "ipa": "/daɪˈdʒest/", "zh": "消化、理解吸收", "ex": "Give people a day to digest the proposal before we vote.", "tts_w": "digest", "id": "w0"}, {"w": "improvise", "ipa": "/ˈɪmprəˌvaɪz/", "zh": "即兴发挥、临时应付", "ex": "The demo crashed, so I had to improvise with screenshots.", "id": "w1"}, {"w": "tour", "ipa": "/tʊr/", "zh": "（逐一的）介绍、巡览", "ex": "She gave the new hires a quick tour of the codebase.", "id": "w2"}, {"w": "grasp (v.)", "ipa": "/ɡræsp/", "zh": "理解、领会", "ex": "It took me a while to grasp how the billing system works.", "tts_w": "grasp", "id": "w3"}, {"w": "alternative", "ipa": "/ɔːlˈtɜːrnətɪv/", "zh": const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

    h('div', { class: 'how', html: how }), body);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
