blue one, probably on the kitchen counter. Could you keep it for me when you go in? I'm happy to pay for a courier to send it to our place. Sorry for the trouble, and thanks for a great stay.", "ref_zh": "你好 Daniel，我是 Lee。我们今天下午退房了，但好像把儿子的水壶落下了。是个蓝色的小水壶，大概在厨房台面上。你进去的时候能帮我收一下吗？我可以付快递费寄到我家。不好意思添麻烦，也谢谢你，住得很好。", "id": "ref1"}], "words": [{"w": "arrive", "ipa": "/əˈraɪv/", "zh": "到达", "ex": "What time does your flight arrive?", "id": "w0"}, {"w": "lockbox", "ipa": "/ˈlɑːkbɑːks/", "zh": "密码钥匙盒", "ex": "The key is in a lockbox next to the front door.", "id": "w1"}, {"w": "cot", "ipa": "/kɑːt/", "zh": "婴儿床（英式）", "ex": "Could the hotel put a cot in our room?", "id": "w2"}, {"w": "house rules", "ipa": "/haʊs ruːlz/", "zh": "入住规矩", "ex": "Please read the house rules before you check in.", "id": "w3"}, {"w": "keep the noise down", "ipa": "/kiːp ðə nɔɪz daʊn/", "zh": "保持安静", "ex": "Could you keep the noise down? The baby is sleeping.", "id": "w4"}, {"w": "rubbish chute", "ipa": "/ˈrʌbɪʃ ʃuːt/", "zh": "垃圾槽", "ex": "Don't throw glass bottles down the rubbish chute.", "id": "w5"}, {"w": "reset (v.)", "ipa": "/ˌriːˈset/", "zh": "重设", "ex": "I had to reset my password again.", "tts_w": "reset", "id": "w6"}, {"w": "hassle", "ipa": "/ˈhæsəl/", "zh": "麻烦事", "ex": "Sorry for the hassle, and thanks for waiting.", "id": "w7"}, {"w": "storeroom", "ipa": "/ˈstɔːrruːm/", "zh": "储物间", "ex": "You can leave your bags in the storeroom.", "id": "w8"}], "sections": [{"heading": "1. Calling the Host Before Arrival", "heading_zh": "1. 入住前给房东打电话", "rows": [[{"id": "s0_0_0", "md": "Hi, is this Daniel? __This is__ Lee. I booked your apartment in Tiong Bahru from Friday to Monday.", "text": "Hi, is this Daniel? This is Lee. I booked your apartment in Tiong Bahru from Friday to Monday.", "zh": "你好，是 Daniel 吗？我是 Lee。我订了你在中峇鲁的公寓，周五住到周一。", "sp": "A"}], [{"id": "s0_1_0", "md": "Hi, Mr. Lee! Thanks for booking. What time are you planning to ==arrive==?", "text": "Hi, Mr. Lee! Thanks for booking. What time are you planning to arrive?", "zh": "你好，Lee 先生！谢谢预订。你们打算几点到？", "sp": "B"}], [{"id": "s0_2_0", "md": "**Probably around nine at night. Is it self check-in, or do we need to meet you in person?**", "text": "Probably around nine at night. Is it self check-in, or do we need to meet you in person?", "zh": "大概晚上九点左右。是自助入住，还是需要跟你当面碰头？", "sp": "A"}], [{"id": "s0_3_0", "md": "It's self check-in. There's a ==lockbox== by the door, and I'll send you the code on the day.", "text": "It's self check-in. There's a lockbox by the door, and I'll send you the code on the day.", "zh": "是自助入住。门边有个密码钥匙盒，当天我把密码发给你。", "sp": "B"}], [{"id": "s0_4_0", "md": "Great. Is there a ==cot== we could use? We're travelling with a two-year-old.", "text": "Great. Is there a cot we could use? We're travelling with a two-year-old.", "zh": "好的。有没有婴儿床可以用？我们带着一个两岁的孩子。", "sp": "A"}], [{"id": "s0_5_0", "md": "Yes, there's a baby cot in the storeroom. I'll set it up before you come.", "text": "Yes, there's a baby cot in the storeroom. I'll set it up before you come.", "zh": "有的，储物间里有张婴儿床。你们来之前我会装好。", "sp": "B"}], [{"id": "s0_6_0", "md": "That's really helpful. Are there any __house rules__ I should know about?", "text": "That's really helpful. Are there any house rules I should know about?", "zh": "太有帮助了。有什么入住规矩我需要知道的吗？", "sp": "A"}], [{"id": "s0_7_0", "md": "Just the usual. No smoking, no parties, and please __keep the noise down__ after ten. The neighbours are quite strict.", "text": "Just the usual. No smoking, no parties, and please keep the noise down after ten. The neighbours are quite strict.", "zh": "就是常规那些。不能抽烟，不能开派对，十点以后请保持安静。邻居挺较真的。", "sp": "B"}], [{"id": "s0_8_0", "md": "No problem. And where do we throw the rubbish? I don't want to __get it wrong__.", "text": "No problem. And where do we throw the rubbish? I don't want to get it wrong.", "zh": "没问题。垃圾扔哪儿？我不想弄错。", "sp": "A"}], [{"id": "s0_9_0", "md": "There's a ==rubbish chute== in the corridor, right next to the lift. Recycling goes in the blue bin downstairs.", "text": "There's a rubbish chute in the corridor, right next to the lift. Recycling goes in the blue bin downstairs.", "zh": "走廊里有个垃圾槽，就在电梯旁边。可回收的放楼下的蓝色桶。", "sp": "B"}], [{"id": "s0_10_0", "md": "**Perfect. I'll send you a message when we land.**", "text": "Perfect. I'll send you a message when we land.", "zh": "好的。我们落地了给你发消息。", "sp": "A"}]]}, {"heading": "2. Locked Out at the Door", "heading_zh": "2. 门打不开", "rows": [[{"id": "s1_0_0", "md": "Hi Daniel, sorry to bother you so late. We're at the door, but the code you sent isn't working.", "text": "Hi Daniel, sorry to bother you so late. We're at the door, but the code you sent isn't working.", "zh": "Daniel 你好，抱歉这么晚打扰你。我们到门口了，但你发的密码打不开。", "sp": "A"}], [{"id": "s1_1_0", "md": "Oh no, I'm so sorry. Which code did you try?", "text": "Oh no, I'm so sorry. Which code did you try?", "zh": "哎呀，真不好意思。你试的是哪个密码？", "sp": "B"}], [{"id": "s1_2_0", "md": "Four seven two nine. I've tried it three times, and the box won't open.", "text": "Four seven two nine. I've tried it three times, and the box won't open.", "zh": "四七二九。我试了三次，盒子就是打不开。", "sp": "A"}], [{"id": "s1_3_0", "md": "Ah, my mistake. I ==reset== it this morning. The new code is eight one five three.", "text": "Ah, my mistake. I reset it this morning. The new code is eight one five three.", "zh": "啊，是我的错。我今天早上重设过了。新密码是八一五三。", "sp": "B"}], [{"id": "s1_4_0", "md": "Hold on, let me try. Okay, it's open!", "text": "Hold on, let me try. Okay, it's open!", "zh": "等一下，我试试。好，开了！", "sp": "A"}], [{"id": "s1_5_0", "md": "Sorry again for the ==hassle==. The Wi-Fi password is on the fridge.", "text": "Sorry again for the hassle. The Wi-Fi password is on the fridge.", "zh": "再次抱歉添麻烦了。Wi-Fi 密码贴在冰箱上。", "sp": "B"}], [{"id": "s1_6_0", "md": "**No worries. One more thing. Would it be possible to check out a bit later on Monday?**", "text": "No worries. One more thing. Would it be possible to check out a bit later on Monday?", "zh": "没关系。还有一件事。周一能稍微晚点退房吗？", "sp": "A"}], [{"id": "s1_ const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
