you planning to arrive?", "zh": "你好，Lee 先生！谢谢预订。你们打算几点到？", "sp": "B"}], [{"id": "s0_2_0", "md": "**Probably around nine at night. Is it self check-in, or do we need to meet you in person?**", "text": "Probably around nine at night. Is it self check-in, or do we need to meet you in person?", "zh": "大概晚上九点左右。是自助入住，还是需要跟你当面碰头？", "sp": "A"}], [{"id": "s0_3_0", "md": "It's self check-in. There's a ==lockbox== by the door, and I'll send you the code on the day.", "text": "It's self check-in. There's a lockbox by the door, and I'll send you the code on the day.", "zh": "是自助入住。门边有个密码钥匙盒，当天我把密码发给你。", "sp": "B"}], [{"id": "s0_4_0", "md": "Great. Is there a ==cot== we could use? We're travelling with a two-year-old.", "text": "Great. Is there a cot we could use? We're travelling with a two-year-old.", "zh": "好的。有没有婴儿床可以用？我们带着一个两岁的孩子。", "sp": "A"}], [{"id": "s0_5_0", "md": "Yes, there's a baby cot in the storeroom. I'll set it up before you come.", "text": "Yes, there's a baby cot in the storeroom. I'll set it up before you come.", "zh": "有的，储物间里有张婴儿床。你们来之前我会装好。", "sp": "B"}], [{"id": "s0_6_0", "md": "That's really helpful. Are there any __house rules__ I should know about?", "text": "That's really helpful. Are there any house rules I should know about?", "zh": "太有帮助了。有什么入住规矩我需要知道的吗？", "sp": "A"}], [{"id": "s0_7_0", "md": "Just the usual. No smoking, no parties, and please __keep the noise down__ after ten. The neighbours are quite strict.", "text": "Just the usual. No smoking, no parties, and please keep the noise down after ten. The neighbours are quite strict.", "zh": "就是常规那些。不能抽烟，不能开派对，十点以后请保持安静。邻居挺较真的。", "sp": "B"}], [{"id": "s0_8_0", "md": "No problem. And where do we throw the rubbish? I don't want to __get it wrong__.", "text": "No problem. And where do we throw the rubbish? I don't want to get it wrong.", "zh": "没问题。垃圾扔哪儿？我不想弄错。", "sp": "A"}], [{"id": "s0_9_0", "md": "There's a ==rubbish chute== in the corridor, right next to the lift. Recycling goes in the blue bin downstairs.", "text": "There's a rubbish chute in the corridor, right next to the lift. Recycling goes in the blue bin downstairs.", "zh": "走廊里有个垃圾槽，就在电梯旁边。可回收的放楼下的蓝色桶。", "sp": "B"}], [{"id": "s0_10_0", "md": "**Perfect. I'll send you a message when we land.**", "text": "Perfect. I'll send you a message when we land.", "zh": "好的。我们落地了给你发消息。", "sp": "A"}]]}, {"heading": "2. Locked Out at the Door", "heading_zh": "2. 门打不开", "rows": [[{"id": "s1_0_0", "md": "Hi Daniel, sorry to bother you so late. We're at the door, but the code you sent isn't working.", "text": "Hi Daniel, sorry to bother you so late. We're at the door, but the code you sent isn't working.", "zh": "Daniel 你好，抱歉这么晚打扰你。我们到门口了，但你发的密码打不开。", "sp": "A"}], [{"id": "s1_1_0", "md": "Oh no, I'm so sorry. Which code did you try?", "text": "Oh no, I'm so sorry. Which code did you try?", "zh": "哎呀，真不好意思。你试的是哪个密码？", "sp": "B"}], [{"id": "s1_2_0", "md": "Four seven two nine. I've tried it three times, and the box won't open.", "text": "Four seven two nine. I've tried it three times, and the box won't open.", "zh": "四七二九。我试了三次，盒子就是打不开。", "sp": "A"}], [{"id": "s1_3_0", "md": "Ah, my mistake. I ==reset== it this morning. The new code is eight one five three.", "text": "Ah, my mistake. I reset it this morning. The new code is eight one five three.", "zh": "啊，是我的错。我今天早上重设过了。新密码是八一五三。", "sp": "B"}], [{"id": "s1_4_0", "md": "Hold on, let me try. Okay, it's open!", "text": "Hold on, let me try. Okay, it's open!", "zh": "等一下，我试试。好，开了！", "sp": "A"}], [{"id": "s1_5_0", "md": "Sorry again for the ==hassle==. The Wi-Fi password is on the fridge.", "text": "Sorry again for the hassle. The Wi-Fi password is on the fridge.", "zh": "再次抱歉添麻烦了。Wi-Fi 密码贴在冰箱上。", "sp": "B"}], [{"id": "s1_6_0", "md": "**No worries. One more thing. Would it be possible to check out a bit later on Monday?**", "text": "No worries. One more thing. Would it be possible to check out a bit later on Monday?", "zh": "没关系。还有一件事。周一能稍微晚点退房吗？", "sp": "A"}], [{"id": "s1_ const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      h('details', {}, h('summary', {}, '看答案'), h('div', {}, g.a)))))));

// 2 dictation
main.append(step('s2', '② 听写', '4 分钟', '每句可以反复听，听到能完整写出来为止。点「核对」后，<span style="color:var(--bad)">红色</span>是漏听或听错的词。',
  h('div', {}, ...D.dictation.map((d, i) => {
    const ta = h('textarea', { placeholder: '把听到的句子打出来…' });
    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
</html>
