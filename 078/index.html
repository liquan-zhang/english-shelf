<script>
const D = {"id": "078", "title": "Changing Plans Mid-Quarter", "meta": "B2 · 约 270 词 · 场景：计划调整", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Changing Is Fine; Quietly Is Not", "heading_zh": "1. 改可以，悄悄改不行", "rows": [[{"id": "s0_0_0", "md": "Six weeks into the quarter, a major customer ==churns==, and leadership wants to shift the team to retention work.", "text": "Six weeks into the quarter, a major customer churns, and leadership wants to shift the team to retention work.", "zh": "季度进行到第六周，一个大客户流失了，管理层想把团队转去做留存。", "sp": null}, {"id": "s0_0_1", "md": "Your carefully negotiated plan is suddenly out of date.", "text": "Your carefully negotiated plan is suddenly out of date.", "zh": "你辛辛苦苦谈下来的计划一下子就过时了。", "sp": null}], [{"id": "s0_1_0", "md": "Changing course is not a sign of bad planning.", "text": "Changing course is not a sign of bad planning.", "zh": "调整方向并不说明计划做得不好。", "sp": null}, {"id": "s0_1_1", "md": "A plan that never changes in a fast market is probably being ignored.", "text": "A plan that never changes in a fast market is probably being ignored.", "zh": "在一个变化很快的市场里，一份从来不变的计划，很可能根本没人在看。", "sp": null}, {"id": "s0_1_2", "md": "**The damage comes from changing the plan quietly, not from changing it.**", "text": "The damage comes from changing the plan quietly, not from changing it.", "zh": "伤害来自悄悄地改计划，而不是改计划本身。", "sp": null}], [{"id": "s0_2_0", "md": "When plans shift without an announcement, other teams keep building on old ==assumptions==.", "text": "When plans shift without an announcement, other teams keep building on old assumptions.", "zh": "计划变了却没有通知，其他团队就会继续基于旧的假设往下做。", "sp": null}, {"id": "s0_2_1", "md": "A partner team finishes an API you no longer need, and a PM promises customers a feature you have just dropped.", "text": "A partner team finishes an API you no longer need, and a PM promises customers a feature you have just dropped.", "zh": "合作团队做完了一个你已经不需要的 API，某个 PM 向客户承诺了一个你刚砍掉的功能。", "sp": null}, {"id": "s0_2_2", "md": "Trust ==erodes== much faster than the plan itself changes, and next quarter everyone pads their estimates to protect themselves.", "text": "Trust erodes much faster than the plan itself changes, and next quarter everyone pads their estimates to protect themselves.", "zh": "信任流失的速度比计划本身变化快得多，下个季度大家都会在估时里加 buffer 来保护自己。", "sp": null}]]}, {"heading": "2. A Change Note in Four Sentences", "heading_zh": "2. 四句话的变更说明", "rows": [[{"id": "s1_0_0", "md": "When you change direction, send a short change note to every ==downstream== team.", "text": "When you change direction, send a short change note to every downstream team.", "zh": "当你调整方向时，给每个下游团队发一份简短的变更说明。", "sp": null}, {"id": "s1_0_1", "md": "It needs only four sentences, and each one answers a different question.", "text": "It needs only four sentences, and each one answers a different question.", "zh": "只需要四句话，每一句回答一个不同的问题。", "sp": null}, {"id": "s1_0_2", "md": "Keep it short enough that people actually read it to the end.", "text": "Keep it short enough that people actually read it to the end.", "zh": "写得足够短，短到大家真的会读到最后。", "sp": null}], [{"id": "s1_1_0", "md": "What changed in the world: \"Our largest customer in the region left, citing slow reporting.\"", "text": "What changed in the world: \"Our largest customer in the region left, citing slow reporting.\"", "zh": "外部发生了什么变化：「我们在这个区域最大的客户走了，理由是报表太慢。」", "sp": null}, {"id": "s1_1_1", "md": "What changes in the plan: \"We are moving two engineers to reporting speed for six weeks.\"", "text": "What changes in the plan: \"We are moving two engineers to reporting speed for six weeks.\"", "zh": "计划有什么变化：「我们把两个工程师调去做报表提速，为期六周。」", "sp": null}, {"id": "s1_1_2", "md": "What it costs: \"The new admin dashboard moves from this quarter to next.\"", "text": "What it costs: \"The new admin dashboard moves from this quarter to next.\"", "zh": "代价是什么：「新的管理后台从这个季度推到下个季度。」", "sp": null}, {"id": "s1_1_3", "md": "Who is affected: \"Design and the sales team, who were planning a demo.\"", "text": "Who is affected: \"Design and the sales team, who were planning a demo.\"", "zh": "影响到谁：「设计团队，还有原本在准备 demo 的销售团队。」", "sp": null}], [{"id": "s1_2_0", "md": "**Saying the cost out loud is what makes the change credible.**", "text": "Saying the cost out loud is what makes the change credible.", "zh": "把代价说出来，正是让这次调整显得可信的关键。", "sp": null}, {"id": "s1_2_1", "md": "It shows the decision was ==deliberate==, not a ==knee-jerk== reaction to whoever complained last.", "text": "It shows the decision was deliberate, not a knee-jerk reaction to whoever complained last.", "zh": "它说明这个决定是深思熟虑的，而不是对最后一个来抱怨的人的条件反射。", "sp": null}, {"id": "s1_2_2", "md": "It also gives affected teams a chance to __raise concerns__ before the new plan is __locked in__.", "text": "It also gives affected teams a chance to raise concerns before the new plan is locked in.", "zh": "它也让受影响的团队有机会在新计划定死之前提出顾虑。", "sp": null}, {"id": "s1_2_3", "md": "A plan that changes openly is still a plan; a plan that changes silently is just a rumor.", "text": "A plan that changes openly is still a plan; a plan that changes silently is just a rumor.", "zh": "公开调整的计划仍然是计划；悄悄调整的计划只是传言。", "sp": null}]]}], "gist": [{"q": "作者认为季度中途改计划本身有问题吗？", "a": "没有，市场变化快，从不改的计划多半没人在看；问题在于悄悄地改。"}, {"q": "悄悄改计划会造成什么后果？", "a": "其他团队按旧假设继续做，做出不再需要的接口、承诺已砍掉的功能；信任流失，下季度大家都给估时加水分自保。"}, {"q": "变更说明的四句话分别回答什么？", "a": "外部发生了什么变化；计划改了什么；代价是什么（哪些事推迟）；影响到谁。"}], "dictation": [{"id": "s0_1_1", "text": "A plan that never changes in a fast market is probably being ignored."}, {"id": "s0_1_2", "text": "The damage comes from changing the plan quietly, not from changing it."}, {"id": "s1_2_0", "text": "Saying the cost out loud is what makes the change credible."}, {"id": "s1_2_3", "text": "A plan that changes openly is still a plan; a plan that changes silently is just a rumor."}], "shadow": {"text": "Saying the cost out loud is what makes the change credible. It shows the decision was deliberate, not a knee-jerk reaction to whoever complained last.", "marked": "Saying the <b>cost</b> out loud / is what makes the change <b>credible</b>. //<br>It shows the decision was <b>deliberate</b>, / not a <b>knee-jerk</b> reaction / to whoever <b>complained</b> last. //"}, "prompts": [{"q": "季度中途，老板要求你的团队转去做稳定性。用 30 秒在跨团队周会上按四句话说明这次变更。", "ref": "I want to share a change to our plan. Last week we had two major outages, and our biggest partner has asked for a stability review. So we're moving three engineers to reliability work for the next five weeks. The cost is that the new search filters slip to next quarter. This mainly affects the design team and marketing, who were planning a campaign around search.", "ref_zh": "我想同步一下我们计划的调整。上周我们出了两次大故障，最大的合作方要求做一次稳定性评审。所以接下来五周，我们要调三个工程师去做稳定性。代价是新的搜索筛选推到下个季度。主要影响的是设计团队和市场团队，他们原本在围绕搜索策划一场活动。", "id": "ref0"}, {"q": "兄弟团队抱怨你们“又改计划了，没人通知”。用 30 秒承认问题并提出以后的做法。", "ref": "You're right, and I'm sorry. We decided to move the export work two weeks ago, and you heard about it from a ticket, not from us. That's on me. Going forward, whenever our plan changes, I'll send a short note to every team that depends on us, covering what changed, why, what slips, and who's affected, before anything is locked in.", "ref_zh": "你说得对，我很抱歉。我们两周前就决定挪走导出那块工作，而你是从一个工单里知道的，不是我们告诉你的。这是我的问题。以后只要我们的计划有变，我都会在定下来之前给每个依赖我们的团队发一份简短说明，讲清楚改了什么、为什么改、什么延期了、影响到谁。", "id": "ref1"}], "words": [{"w": "churn (v.)", "ipa": "/tʃɜːrn/", "zh": "（客户）流失", "ex": "Customers who hit this bug in their first week tend to churn.", "tts_w": "churn", "id": "w0"}, {"w": "assumption", "ipa": "/əˈsʌmpʃən/", "zh": "假设、前提", "ex": "Our capacity plan was based on the assumption of steady growth.", "id": "w1"}, {"w": "erode", "ipa": "/ɪˈroʊd/", "zh": "侵蚀、逐渐削弱", "ex": "Every missed deadline erodes the client's trust a little more.", "id": "w2"}, {"w": "downstream", "ipa": "/ˌdaʊnˈstriːm/", "zh": "下游的", "ex": "Changing this schema will break several downstream services.", "id": "w3"}, {"w": "deliberate", "ipa": "/dɪˈlɪbərət/", "zh": "深思熟虑的、有意的", "ex const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
