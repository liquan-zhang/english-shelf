<script>
const D = {"id": "078", "title": "Changing Plans Mid-Quarter", "meta": "B2 · 约 270 词 · 场景：计划调整", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Changing Is Fine; Quietly Is Not", "heading_zh": "1. 改可以，悄悄改不行", "rows": [[{"id": "s0_0_0", "md": "Six weeks into the quarter, a major customer ==churns==, and leadership wants to shift the team to retention work.", "text": "Six weeks into the quarter, a major customer churns, and leadership wants to shift the team to retention work.", "zh": "季度进行到第六周，一个大客户流失了，管理层想把团队转去做留存。", "sp": null}, {"id": "s0_0_1", "md": "Your carefully negotiated plan is suddenly out of date.", "text": "Your carefully negotiated plan is suddenly out of date.", "zh": "你辛辛苦苦谈下来的计划一下子就过时了。", "sp": null}], [{"id": "s0_1_0", "md": "Changing course is not a sign of bad planning.", "text": "Changing course is not a sign of bad planning.", "zh": "调整方向并不说明计划做得不好。", "sp": null}, {"id": "s0_1_1", "md": "A plan that never changes in a fast market is probably being ignored.", "text": "A plan that never changes in a fast market is probably being ignored.", "zh": "在一个变化很快的市场里，一份从来不变的计划，很可能根本没人在看。", "sp": null}, {"id": "s0_1_2", "md": "**The damage comes from changing the plan quietly, not from changing it.**", "text": "The damage comes from changing the plan quietly, not from changing it.", "zh": "伤害来自悄悄地改计划，而不是改计划本身。", "sp": null}], [{"id": "s0_2_0", "md": "When plans shift without an announcement, other teams keep building on old ==assumptions==.", "text": "When plans shift without an announcement, other teams keep building on old assumptions.", "zh": "计划变了却没有通知，其他团队就会继续基于旧的假设往下做。", "sp": null}, {"id": "s0_2_1", "md": "A partner team finishes an API you no longer need, and a PM promises customers a feature you have just dropped.", "text": "A partner team finishes an API you no longer need, and a PM promises customers a feature you have just dropped.", "zh": "合作团队做完了一个你已经不需要的 API，某个 PM 向客户承诺了一个你刚砍掉的功能。", "sp": null}, {"id": "s0_2_2", "md": "Trust ==erodes== much faster than the plan itself changes, and next quarter everyone pads their estimates to protect themselves.", "text": "Trust erodes much faster than the plan itself changes, and next quarter everyone pads their estimates to protect themselves.", "zh": "信任流失的速度比计划本身变化快得多，下个季度大家都会在估时里加 buffer 来保护自己。", "sp": null}]]}, {"heading": "2. A Change Note in Four Sentences", "heading_zh": "2. 四句话的变更说明", "rows": [[{"id": "s1_0_0", "md": "When you change direction, send a short change note to every ==downstream== team.", "text": "When you change direction, send a short change note to every downstream team.", "zh": "当你调整方向时，给每个下游团队发一份简短的变更说明。", "sp": null}, {"id": "s1_0_1", "md": "It needs only four sentences, and each one answers a different question.", "text": "It needs only four sentences, and each one answers a different question.", "zh": "只需要四句话，每一句回答一个不同的问题。", "sp": null}, {"id": "s1_0_2", "md": "Keep it short enough that people actually read it to the end.", "text": "Keep it short enough that people actually read it to the end.", "zh": "写得足够短，短到大家真的会读到最后。", "sp": null}], [{"id": "s1_1_0", "md": "What changed in the world: \"Our largest customer in the region left, citing slow reporting.\"", "text": "What changed in the world: \"Our largest customer in the region left, citing slow reporting.\"", "zh": "外部发生了什么变化：「我们在这个区域最大的客户走了，理由是报表太慢。」", "sp": null}, {"id": "s1_1_1", "md": "What changes in the plan: \"We are moving two engineers to reporting speed for six weeks.\"", "text": "What changes in the plan: \"We are moving two engineers to reporting speed for six weeks.\"", "zh": "计划有什么变化：「我们把两个工程师调去做报表提速，为期六周。」", "sp": null}, {"id": "s1_1_2", "md": "What it costs: \"The new admin dashboard moves from this quarter to next.\"", "text": "What it costs: \"The new admin dashboard moves from this quarter to next.\"", "zh": "代价是什么：「新的管理后台从这个季度推到下个季度。」", "sp": null}, {"id": "s1_1_3", "md": "Who is affected: \"Design and the sales team, who were planning a demo.\"", "text": "Who is affected: \"Design and the sales team, who were planning a demo.\"", "zh": "影响到谁：「设计团队，还有原本在准备 demo 的销售团队。」", "sp": null}], [{"id": "s1_2_0", "md": "**Saying the cost out loud is what makes the change credible.**", "text": "Saying the cost out loud is what makes the change credible.", "zh": "把代价说出来，正是让这次调整显得可信的关键。", "sp": null}, {"id": "s1_2_1", "md": "It shows the decision was ==deliberate==, not a ==knee-jerk== reaction to whoever complained last.", "text": "It shows the decision was deliberate, not a knee-jerk reaction to whoever complained last.", "zh": "它说明这个决定是深思熟虑的，而不是对最后一个来抱怨的人的条件反射。", "sp": null}, {"id": "s1_2_2", "md": "It also gives affected teams a chance to __raise concerns__ before the new plan is __locked in__.", "text": "It also gives affected teams a chance to raise concerns before the new plan is locked in.", "zh": "它也让受影响的团队有机会在新计划定死之前提出顾虑。", "sp": null}, {"id": "s1_2_3", "md": "A plan that changes openly is still a plan; a plan that changes silently is just a rumor.", "text": "A plan that changes openly is still a plan; a plan that changes silently is just a rumor.", "zh": "公开调整的计划仍然是计划；悄悄调整的计划只是传言。", "sp": null}]]}], "gist": [{"q": "作者认为季度中途改计划本身有问题吗？", "a": "没有，市场变化快，从不改的计划多半没人在看；问题在于悄悄地改。"}, {"q": "悄悄改计划会造成什么后果？", "a": "其他团队按旧假设继续做，做出不再需要的接口、承诺已砍掉的功能；信任流失，下季度大家都给估时加水分自保。"}, {"q": "变更说明的四句话分别回答什么？", "a": "外部发生了什么变化；计划改了什么；代价是什么（哪些事推迟）；影响到谁。"}], "dictation": [{"id": "s0_1_1", "text": "A plan that never changes in a fast market is probably being ignored."}, {"id": "s0_1_2", "text": "The damage comes from changing the plan quietly, not from changing it."}, {"id": "s1_2_0", "text": "Saying the cost out loud is what makes the change credible."}, {"id": "s1_2_3", "text": "A plan that changes openly is still a plan; a plan that changes silently is just a rumor."}], "shadow": {"text": "Saying the cost out loud is what makes the change credible. It shows the decision was deliberate, not a knee-jerk reaction to whoever complained last.", "marked": "Saying the <b>cost</b> out loud / is what makes the change <b>credible</b>. //<br>It shows the decision was <b>deliberate</b>, / not a <b>knee-jerk</b> reaction / to whoever <b>complained</b> last. //"}, "prompts": [{"q": "季度中途，老板要求你的团队转去做稳定性。用 30 秒在跨团队周会上按四句话说明这次变更。", "ref": "I want to share a change to our plan. Last week we had two major outages, and our biggest partner has asked for a stability review. So we're moving three engineers to reliability work for the next five weeks. The cost is that the new search filters slip to next quarter. This mainly affects the design team and marketing, who were planning a campaign around search.", "ref_zh": "我想同步一下我们计划的调整。上周我们出了两次大故障，最大的合作方要求做一次稳定性评审。所以接下来五周，我们要调三个工程师去做稳定性。代价是新的搜索筛选推到下个季度。主要影响的是设计团队和市场团队，他们原本在围绕搜索策划一场活动。", "id": "ref0"}, {"q": "兄弟团队抱怨你们“又改计划了，没人通知”。用 30 秒承认问题并提出以后的做法。", "ref": "You're right, and I'm sorry. We decided to move the export work two weeks ago, and you heard about it from a ticket, not from us. That's on me. Going forward, whenever our plan changes, I'll send a short note to every team that depends on us, covering what changed, why, what slips, and who's affected, before anything is locked in.", "ref_zh": "你说得对，我很抱歉。我们两周前就决定挪走导出那块工作，而你是从一个工单里知道的，不是我们告诉你的。这是我的问题。以后只要我们的计划有变，我都会在定下来之前给每个依赖我们的团队发一份简短说明，讲清楚改了什么、为什么改、什么延期了、影响到谁。", "id": "ref1"}], "words": [{"w": "churn (v.)", "ipa": "/tʃɜːrn/", "zh": "（客户）流失", "ex": "Customers who hit this bug in their first week tend to churn.", "tts_w": "churn", "id": "w0"}, {"w": "assumption", "ipa": "/əˈsʌmpʃən/", "zh": "假设、前提", "ex": "Our capacity plan was based on the assumption of steady growth.", "id": "w1"}, {"w": "erode", "ipa": "/ɪˈroʊd/", "zh": "侵蚀、逐渐削弱", "ex": "Every missed deadline erodes the client's trust a little more.", "id": "w2"}, {"w": "downstream", "ipa": "/ˌdaʊnˈstriːm/", "zh": "下游的", "ex": "Changing this schema will break several downstream services.", "id": "w3"}, {"w": "deliberate", "ipa": "/dɪˈlɪbərət/", "zh": "深思熟虑的、有意的", "ex const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
