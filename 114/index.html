const D = {"id": "114", "type": "dialogue", "title": "Hosting Friends for After-Work Drinks", "meta": "B2 · 约 250 词 · 场景：订位、点单与核对账单", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Bar Manager", "name_zh": "酒吧经理", "voice": "en-IN-PrabhatNeural"}}, "gist": [{"q": "「你」订了什么样的位子？还提前安排了什么？", "a": "周四六点半、六个人的靠窗高桌；还预点了一份分享拼盘。"}, {"q": "账单上出了什么错？", "a": "多算了一瓶白葡萄酒，那瓶其实是隔壁桌的，经理去掉了。"}, {"q": "为什么最后一轮啤酒按原价算？", "a": "因为是八点十分下的单，欢乐时段八点已经结束了。"}], "dictation": [{"id": "s0_1_0", "text": "Hi, I'd like to book a table for six this Thursday, around six thirty."}, {"id": "s0_5_0", "text": "Great. One of my friends doesn't drink. Do you have decent mocktails?"}, {"id": "s1_2_0", "text": "Sorry, I think there's a mistake. We only had one bottle of white wine, but there are two on here."}, {"id": "s1_6_0", "text": "Fair enough. Is the service charge already included?"}], "shadow": {"speaker": "A", "text": "Good to know. Could we also pre-order some bar snacks so they're ready when we arrive?", "marked": "Good to <b>know</b>. //<br>Could we also <b>pre-order</b> / some <b>bar snacks</b> / so they're <b>ready</b> / when we <b>arrive</b>? //"}, "prompts": [{"q": "你想给团队在酒吧包一个角落办欢送会，大约十二个人。打电话问能不能预留、有没有最低消费、可不可以带蛋糕。", "ref": "Hi, I'm organising a farewell for a colleague next Friday evening, about twelve people. Would it be possible to reserve a corner area for us from seven? Is there a minimum spend for a group that size? Also, we'd like to bring our own cake. Is that okay, and is there a cake cutting fee?", "ref_zh": "你好，我下周五晚上要给同事办个欢送会，大概十二个人。七点开始能给我们预留一个角落吗？这么多人有没有最低消费？另外我们想自带蛋糕，可以吗？收切蛋糕费吗？", "id": "ref0"}, {"q": "结账时朋友坚持要和你平摊，但你说好今天你请。礼貌地坚持由你买单，并顺便约下次。", "ref": "No, no, put your card away. I invited you all tonight, so this one's on me. It's been ages since we got together, and I really wanted to say thanks for helping me settle in. If you insist, you can get the next round next time. Let's not leave it so long again.", "ref_zh": "不不，把卡收起来。今晚是我请大家的，这顿我来。我们好久没聚了，我也一直想谢谢你们帮我适应这边。你们非要请的话，下次那一轮你们来。下次别隔这么久了。", "id": "ref1"}], "words": [{"w": "happy hour", "ipa": "/ˈhæpi aʊr/", "zh": "欢乐时段（酒水优惠）", "ex": "Happy hour ends at eight, so let's order now.", "id": "w0"}, {"w": "mocktail", "ipa": "/ˈmɑːkteɪl/", "zh": "无酒精鸡尾酒", "ex": "I'm driving tonight, so I'll just have a mocktail.", "id": "w1"}, {"w": "off menu", "ipa": "/ɔːf ˈmenjuː/", "zh": "菜单之外的", "ex": "The chef can cook something off menu for the kids.", "id": "w2"}, {"w": "bar snacks", "ipa": "/bɑːr snæks/", "zh": "下酒小吃", "ex": "The bar snacks here are better than the main dishes.", "id": "w3"}, {"w": "pre-order", "ipa": "/ˌpriː ˈɔːrdər/", "zh": "提前点单", "ex": "You can pre-order the birthday cake online.", "id": "w4"}, {"w": "mistake", "ipa": "/mɪˈsteɪk/", "zh": "错误", "ex": "There's a mistake on my receipt.", "id": "w5"}, {"w": "round", "ipa": "/raʊnd/", "zh": "（给一桌人点的）一轮酒", "ex": "This round is on me.", "id": "w6"}, {"w": "total", "ipa": "/ˈtoʊtəl/", "zh": "总额", "ex": "What's the total with service charge?", "id": "w7"}, {"w": "get the bill", "ipa": "/ɡet ðə bɪl/", "zh": "买单", "ex": "Could we get the bill when you have a moment?", "id": "w8"}], "sections": [{"heading": "1. Booking and Ordering", "heading_zh": "1. 订位和点单", "rows": [[{"id": "s0_0_0", "md": "Good afternoon, Copper Room. How can I help?", "text": "Good afternoon, Copper Room. How can I help?", "zh": "下午好，这里是 Copper Room。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "**Hi, I'd like to book a table for six this Thursday, around six thirty.**", "text": "Hi, I'd like to book a table for six this Thursday, around six thirty.", "zh": "你好，我想订这周四的位子，六个人，六点半左右。", "sp": "A"}], [{"id": "s0_2_0", "md": "Let me see. I can give you a high table near the window. Is that alright?", "text": "Let me see. I can give you a high table near the window. Is that alright?", "zh": "我看看。可以给您安排靠窗的高桌，行吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "Perfect. Do you have a ==happy hour==, and __until what time__?", "text": "Perfect. Do you have a happy hour, and until what time?", "zh": "太好了。你们有欢乐时段吗？到几点？", "sp": "A"}], [{"id": "s0_4_0", "md": "Yes, until eight. House pours and draught beers are one-for-one.", "text": "Yes, until eight. House pours and draught beers are one-for-one.", "zh": "有，到八点。店酒和生啤买一送一。", "sp": "B"}], [{"id": "s0_5_0", "md": "Great. One of my friends doesn't drink. Do you have decent ==mocktails==?", "text": "Great. One of my friends doesn't drink. Do you have decent mocktails?", "zh": "很好。我有个朋友不喝酒，你们有像样的无酒精鸡尾酒吗？", "sp": "A"}], [{"id": "s0_6_0", "md": "We have three on the menu, and the bartender can make something ==off menu== too.", "text": "We have three on the menu, and the bartender can make something off menu too.", "zh": "菜单上有三款，调酒师也可以做菜单外的。", "sp": "B"}], [{"id": "s0_7_0", "md": "Good to know. Could we also __pre-order__ some ==bar snacks== so they're ready when we arrive?", "text": "Good to know. Could we also pre-order some bar snacks so they're ready when we arrive?", "zh": "好的。我们能不能先预点一些下酒小吃，到的时候就能上？", "sp": "A"}], [{"id": "s0_8_0", "md": "Of course. I'd suggest the sharing platter. It __feeds about__ four to six people.", "text": "Of course. I'd suggest the sharing platter. It feeds about four to six people.", "zh": "当然。推荐拼盘，大概够四到六个人吃。", "sp": "B"}], [{"id": "s0_9_0", "md": "Let's do one platter. The booking is under Lee. Thanks a lot.", "text": "Let's do one platter. The booking is under Lee. Thanks a lot.", "zh": "那就来一份拼盘。订位名字写 Lee。多谢。", "sp": "A"}]]}, {"heading": "2. Settling the Bill", "heading_zh": "2. 结账", "rows": [[{"id": "s1_0_0", "md": "Excuse me, could we __get the bill__, please? It's all on one card.", "text": "Excuse me, could we get the bill, please? It's all on one card.", "zh": "打扰一下，麻烦买单。全部刷一张卡。", "sp": "A"}], [{"id": "s1_1_0", "md": "Certainly. Here you are. Take your time.", "text": "Certainly. Here you are. Take your time.", "zh": "好的，给您。您慢慢看。", "sp": "B"}], [{"id": "s1_2_0", "md": "Sorry, I think there's a ==mistake==. We only had one bottle of white wine, but there are two on here.", "text": "Sorry, I think there's a mistake. We only had one bottle of white wine, but there are two on here.", "zh": "不好意思，好像有点问题。我们只点了一瓶白葡萄酒，账单上是两瓶。", "sp": "A"}], [{"id": "s1_3_0", "md": "Let me check with the bar. You're right, the second one was for the next table. I'll take it off.", "text": "Let me check with the bar. You're right, the second one was for the next table. I'll take it off.", "zh": "我跟吧台确认一下。您说得对，第二瓶是隔壁桌的。我给您去掉。", "sp": "B"}], [{"id": "s1_4_0", "md": "Thanks. And the beers after eight, were those still at the happy hour price?", "text": "Thanks. And the beers after eight, were those still at the happy hour price?", "zh": "谢谢。还有八点以后点的啤酒，还算欢乐时段价吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "The last ==round== came in at eight ten, so that's full price, I'm afraid.", "text": "The last round came in at eight ten, so that's full price, I'm afraid.", "zh": "最后一轮是八点十分下的单，所以恐怕要按原价算。", "sp": "B"}], [{"id": "s1_6_0", "md": "**Fair enough. Is the service charge already included?**", "text": "Fair enough. Is the service charge already included?", "zh": "也合理。服务费已经包含在内了吗？", "sp": "A"}], [{"id": "s1_7_0", "md": "Yes, service charge and GST are both included. Your new ==total== is three hundred and twelve.", "text": "Yes, service charge and GST are both included. Your new total is three hundred and twelve.", "zh": "是的，服务费和消费税都包含了。新的总额是三百一十二。", "sp": "B"}], [{"id": "s1_8_0", "md": "**Great, thanks for sorting that out. We had a really good time.**", "text": "Great, thanks for sorting that out. We had a really good time.", "zh": "好，谢谢你们处理。我们今晚玩得很开心。", "sp": "A"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Booking and Ordering", "zh": "1. 订位和点单", "start": 0.0, "end": 2.352, "words": [[0.105, 0.368], [0.789, 1.197], [1.329, 1.434], [1.447, 1.947]]}, {"kind": "s", "id": "s0_0_0", "md": "Good afternoon, Copper Room. How can I help?", "zh": "下午好，这里是 Copper Room。有什么可 const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress

  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));
