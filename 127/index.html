<script>
const D = {"id": "127", "type": "dialogue", "title": "Asking the Landlord to Fix Something", "meta": "B2 · 约 320 词 · 场景：找房东报修与谈维修费", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Landlord", "name_zh": "房东", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "家里坏了哪两样东西？「你」先做了什么处理？", "a": "厨房水槽下的管子漏水、热水器没热水；先放了桶接水，并关掉了阀门。"}, {"q": "房东想按租约怎么分摊费用？「你」用什么理由反驳？", "a": "房东说每次维修前一百五十块由租客出；「你」说那条只适用于租客造成的小修，热水器用了十多年属于正常损耗，管子是密封圈老化。"}, {"q": "最后费用怎么分？以后再报修有什么约定？", "a": "房东出热水器的钱，「你」出管子的六十块；以后可以直接找师傅，但动工前先告诉房东。"}], "dictation": [{"id": "s0_2_0", "text": "There are two things, actually. The kitchen sink is leaking, and the water heater isn't working."}, {"id": "s0_4_0", "text": "It's dripping from the pipe under the sink. I've put a bucket there and turned off the valve for now."}, {"id": "s1_4_0", "text": "The heater is over ten years old, so I'd see it as normal wear and tear."}, {"id": "s1_10_0", "text": "Appreciate it. If anything else breaks, is it okay if I call the plumber directly?"}], "shadow": {"speaker": "A", "text": "I've read that clause. It's for minor repairs, usually things the tenant has caused. The heater is over ten years old, so I'd see it as normal wear and tear.", "marked": "I've <b>read</b> that clause. //<br>It's for <b>minor</b> repairs, / usually things the <b>tenant</b> has caused. //<br>The heater is over <b>ten years</b> old, / so I'd see it as <b>normal wear and tear</b>. //"}, "prompts": [{"q": "空调漏水滴到地板上，你给房东发语音。说清问题、你已经做了什么、希望什么时候来修。", "ref": "Hi Mrs. Lim, it's Zhang from unit twelve. The air con in the master bedroom is leaking. Water is dripping onto the floor, and I'm worried it'll damage the wood. I've switched it off and put a towel down for now. Could you send someone this week? Any evening after seven works for us.", "ref_zh": "林太太您好，我是十二号单元的小张。主卧空调漏水了，水滴到地板上，我担心会泡坏木地板。我先把空调关了，铺了条毛巾。这周能派人来修吗？我们每天晚上七点以后都可以。", "id": "ref0"}, {"q": "房东答应派人来修，但已经过了一周还没动静。礼貌地催一下，并提出一个具体方案。", "ref": "Hi Mrs. Lim, sorry to chase you on this. It's been a week since I reported the leak, and nobody has come by yet. It's getting worse, and the cabinet under the sink is starting to swell. If your plumber is busy, would you be okay with me calling one myself and sending you the invoice?", "ref_zh": "林太太您好，不好意思又来催您。我报修漏水已经一周了，还没有人来。现在漏得更厉害，水槽下面的柜子都开始泡胀了。如果您的师傅忙，我自己找一个师傅，然后把发票发给您，您看可以吗？", "id": "ref1"}], "words": [{"w": "leak", "ipa": "/liːk/", "zh": "漏水；漏洞", "ex": "There's a leak in the ceiling above the bathroom.", "id": "w0"}, {"w": "heating element", "ipa": "/ˈhiːtɪŋ ˌelɪmənt/", "zh": "加热管，加热元件", "ex": "The kettle stopped working because the heating element burned out.", "id": "w1"}, {"w": "plumber", "ipa": "/ˈplʌmər/", "zh": "水管工，水电师傅", "ex": "We need a plumber to fix the toilet.", "id": "w2"}, {"w": "confirm", "ipa": "/kənˈfɜːrm/", "zh": "确认", "ex": "Please confirm the time by tonight.", "id": "w3"}, {"w": "minor", "ipa": "/ˈmaɪnər/", "zh": "小的，次要的", "ex": "It's only a minor problem, so don't worry.", "id": "w4"}, {"w": "wear and tear", "ipa": "/ˌwer ən ˈter/", "zh": "正常磨损，损耗", "ex": "Scratches on the floor are just normal wear and tear.", "id": "w5"}, {"w": "seal", "ipa": "/siːl/", "zh": "密封圈，密封条", "ex": "The fridge door doesn't close well because the seal is broken.", "id": "w6"}, {"w": "invoice", "ipa": "/ˈɪnvɔɪs/", "zh": "发票，账单", "ex": "Could you email me the invoice?", "id": "w7"}, {"w": "directly", "ipa": "/dəˈrektli/", "zh": "直接地", "ex": "You can book directly on their website.", "id": "w8"}, {"w": "turn off", "ipa": "/tɜːrn ɔːf/", "zh": "关掉", "ex": "Remember to turn off the gas before you go out.", "id": "w9"}], "sections": [{"heading": "1. Reporting the Problems", "heading_zh": "1. 报修", "rows": [[{"id": "s0_0_0", "md": "Hi Mrs. Lim, it's Zhang from unit twelve. Sorry to bother you on a Sunday.", "text": "Hi Mrs. Lim, it's Zhang from unit twelve. Sorry to bother you on a Sunday.", "zh": "林太太您好，我是十二号单元的小张。不好意思周日打扰您。", "sp": "A"}], [{"id": "s0_1_0", "md": "No problem. Is everything okay with the flat?", "text": "No problem. Is everything okay with the flat?", "zh": "没事。房子没什么问题吧？", "sp": "B"}], [{"id": "s0_2_0", "md": "**There are two things, actually. The kitchen sink is leaking, and the water heater isn't working.**", "text": "There are two things, actually. The kitchen sink is leaking, and the water heater isn't working.", "zh": "其实有两件事。厨房水槽漏水，热水器也坏了。", "sp": "A"}], [{"id": "s0_3_0", "md": "Oh dear. How bad is the ==leak==?", "text": "Oh dear. How bad is the leak?", "zh": "哎呀。漏得厉害吗？", "sp": "B"}], [{"id": "s0_4_0", "md": "It's dripping from the pipe under the sink. I've put a bucket there and __turned off__ the valve for now.", "text": "It's dripping from the pipe under the sink. I've put a bucket there and turned off the valve for now.", "zh": "是水槽下面的管子在滴水。我先放了个桶，把阀门关了。", "sp": "A"}], [{"id": "s0_5_0", "md": "Good, thank you. And the heater, is there no hot water at all?", "text": "Good, thank you. And the heater, is there no hot water at all?", "zh": "好，谢谢你。那热水器呢，完全没热水吗？", "sp": "B"}], [{"id": "s0_6_0", "md": "None since yesterday. The light on the switch is on, but the water stays cold. With a small kid, it's quite hard.", "text": "None since yesterday. The light on the switch is on, but the water stays cold. With a small kid, it's quite hard.", "zh": "从昨天起就一点都没有。开关的灯是亮的，但出来的水一直是冷的。家里有小孩，挺麻烦的。", "sp": "A"}], [{"id": "s0_7_0", "md": "Must be the ==heating element== again. I'll ask my ==plumber== to come by. When are you usually home?", "text": "Must be the heating element again. I'll ask my plumber to come by. When are you usually home?", "zh": "估计又是加热管坏了。我叫我的水电师傅过来。你们一般什么时候在家？", "sp": "B"}], [{"id": "s0_8_0", "md": "**My wife is home on weekday mornings. Could he come tomorrow before noon?**", "text": "My wife is home on weekday mornings. Could he come tomorrow before noon?", "zh": "我太太工作日上午在家。他明天中午之前能来吗？", "sp": "A"}], [{"id": "s0_9_0", "md": "I'll try. I'll message you once he ==confirms==.", "text": "I'll try. I'll message you once he confirms.", "zh": "我尽量。他确认了我就发消息给你。", "sp": "B"}]]}, {"heading": "2. Who Pays for the Repair", "heading_zh": "2. 维修费谁出", "rows": [[{"id": "s1_0_0", "md": "Hi, the plumber fixed the pipe and changed the heater element. The bill is two hundred and sixty dollars.", "text": "Hi, the plumber fixed the pipe and changed the heater element. The bill is two hundred and sixty dollars.", "zh": "你好，师傅把管子修好了，也换了热水器加热管。一共两百六十块。", "sp": "B"}], [{"id": "s1_1_0", "md": "Thanks for arranging it so quickly. How would you like to handle the cost?", "text": "Thanks for arranging it so quickly. How would you like to handle the cost?", "zh": "谢谢您安排得这么快。费用您打算怎么处理？", "sp": "A"}], [{"id": "s1_2_0", "md": "Under the lease, the tenant covers the first one hundred and fifty dollars of each repair, right?", "text": "Under the lease, the tenant covers the first one hundred and fifty dollars of each repair, right?", "zh": "按租约，每次维修前一百五十块是租客出，对吧？", "sp": "B"}], [{"id": "s1_3_0", "md": "I've read that clause. It's for ==minor== repairs, usually things the tenant has caused.", "text": "I've read that clause. It's for minor repairs, usually things the tenant has caused.", "zh": "那条我看过。那是指小修，一般是租客造成的问题。", "sp": "A"}], [{"id": "s1_4_0", "md": "**The heater is over ten years old, so I'd see it as normal wear and tear.**", "text": "The heater is over ten years old, so I'd see it as normal wear and tear.", "zh": "热水器已经用了十多年了，我觉得这算正常损耗。", "sp": "A"}], [{"id": "s1_5_0", "md": "Hmm, fair point. But the pipe, maybe your helper put something heavy on it?", "text": "Hmm, fair point. But the pipe, maybe your helper put something heavy on it?", "zh": "嗯，有道理。但那根管子，会不会是你家阿姨在上面压了重东西？", "sp": "B"}], [{"id": "s1_6_0", "md": "I don't think so. The plumber said the ==seal== had just worn out. __Would you be okay with__ covering both this time?", "text": "I don't think so. The plumber said the seal had just worn out. Would you be okay with covering both this time?", "z const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      h('details', {}, h('summary', {}, '看答案'), h('div', {}, g.a)))))));

// 2 dictation
main.append(step('s2', '② 听写', '4 分钟', '每句可以反复听，听到能完整写出来为止。点「核对」后，<span style="color:var(--bad)">红色</span>是漏听或听错的词。',
  h('div', {}, ...D.dictation.map((d, i) => {
    const ta = h('textarea', { placeholder: '把听到的句子打出来…' });
    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
</html>
