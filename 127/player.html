<script>
const D = {"id": "127", "type": "dialogue", "title": "Asking the Landlord to Fix Something", "meta": "B2 · 约 320 词 · 场景：找房东报修与谈维修费", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Landlord", "name_zh": "房东", "voice": "en-SG-LunaNeural"}}, "gist": [{"q": "家里坏了哪两样东西？「你」先做了什么处理？", "a": "厨房水槽下的管子漏水、热水器没热水；先放了桶接水，并关掉了阀门。"}, {"q": "房东想按租约怎么分摊费用？「你」用什么理由反驳？", "a": "房东说每次维修前一百五十块由租客出；「你」说那条只适用于租客造成的小修，热水器用了十多年属于正常损耗，管子是密封圈老化。"}, {"q": "最后费用怎么分？以后再报修有什么约定？", "a": "房东出热水器的钱，「你」出管子的六十块；以后可以直接找师傅，但动工前先告诉房东。"}], "dictation": [{"id": "s0_2_0", "text": "There are two things, actually. The kitchen sink is leaking, and the water heater isn't working."}, {"id": "s0_4_0", "text": "It's dripping from the pipe under the sink. I've put a bucket there and turned off the valve for now."}, {"id": "s1_4_0", "text": "The heater is over ten years old, so I'd see it as normal wear and tear."}, {"id": "s1_10_0", "text": "Appreciate it. If anything else breaks, is it okay if I call the plumber directly?"}], "shadow": {"speaker": "A", "text": "I've read that clause. It's for minor repairs, usually things the tenant has caused. The heater is over ten years old, so I'd see it as normal wear and tear.", "marked": "I've <b>read</b> that clause. //<br>It's for <b>minor</b> repairs, / usually things the <b>tenant</b> has caused. //<br>The heater is over <b>ten years</b> old, / so I'd see it as <b>normal wear and tear</b>. //"}, "prompts": [{"q": "空调漏水滴到地板上，你给房东发语音。说清问题、你已经做了什么、希望什么时候来修。", "ref": "Hi Mrs. Lim, it's Zhang from unit twelve. The air con in the master bedroom is leaking. Water is dripping onto the floor, and I'm worried it'll damage the wood. I've switched it off and put a towel down for now. Could you send someone this week? Any evening after seven works for us.", "ref_zh": "林太太您好，我是十二号单元的小张。主卧空调漏水了，水滴到地板上，我担心会泡坏木地板。我先把空调关了，铺了条毛巾。这周能派人来修吗？我们每天晚上七点以后都可以。", "id": "ref0"}, {"q": "房东答应派人来修，但已经过了一周还没动静。礼貌地催一下，并提出一个具体方案。", "ref": "Hi Mrs. Lim, sorry to chase you on this. It's been a week since I reported the leak, and nobody has come by yet. It's getting worse, and the cabinet under the sink is starting to swell. If your plumber is busy, would you be okay with me calling one myself and sending you the invoice?", "ref_zh": "林太太您好，不好意思又来催您。我报修漏水已经一周了，还没有人来。现在漏得更厉害，水槽下面的柜子都开始泡胀了。如果您的师傅忙，我自己找一个师傅，然后把发票发给您，您看可以吗？", "id": "ref1"}], "words": [{"w": "leak", "ipa": "/liːk/", "zh": "漏水；漏洞", "ex": "There's a leak in the ceiling above the bathroom.", "id": "w0"}, {"w": "heating element", "ipa": "/ˈhiːtɪŋ ˌelɪmənt/", "zh": "加热管，加热元件", "ex": "The kettle stopped working because the heating element burned out.", "id": "w1"}, {"w": "plumber", "ipa": "/ˈplʌmər/", "zh": "水管工，水电师傅", "ex": "We need a plumber to fix the toilet.", "id": "w2"}, {"w": "confirm", "ipa": "/kənˈfɜːrm/", "zh": "确认", "ex": "Please confirm the time by tonight.", "id": "w3"}, {"w": "minor", "ipa": "/ˈmaɪnər/", "zh": "小的，次要的", "ex": "It's only a minor problem, so don't worry.", "id": "w4"}, {"w": "wear and tear", "ipa": "/ˌwer ən ˈter/", "zh": "正常磨损，损耗", "ex": "Scratches on the floor are just normal wear and tear.", "id": "w5"}, {"w": "seal", "ipa": "/siːl/", "zh": "密封圈，密封条", "ex": "The fridge door doesn't close well because the seal is broken.", "id": "w6"}, {"w": "invoice", "ipa": "/ˈɪnvɔɪs/", "zh": "发票，账单", "ex": "Could you email me the invoice?", "id": "w7"}, {"w": "directly", "ipa": "/dəˈrektli/", "zh": "直接地", "ex": "You can book directly on their website.", "id": "w8"}, {"w": "turn off", "ipa": "/tɜːrn ɔːf/", "zh": "关掉", "ex": "Remember to turn off the gas before you go out.", "id": "w9"}], "sections": [{"heading": "1. Reporting the Problems", "heading_zh": "1. 报修", "rows": [[{"id": "s0_0_0", "md": "Hi Mrs. Lim, it's Zhang from unit twelve. Sorry to bother you on a Sunday.", "text": "Hi Mrs. Lim, it's Zhang from unit twelve. Sorry to bother you on a Sunday.", "zh": "林太太您好，我是十二号单元的小张。不好意思周日打扰您。", "sp": "A"}], [{"id": "s0_1_0", "md": "No problem. Is everything okay with the flat?", "text": "No problem. Is everything okay with the flat?", "zh": "没事。房子没什么问题吧？", "sp": "B"}], [{"id": "s0_2_0", "md": "**There are two things, actually. The kitchen sink is leaking, and the water heater isn't working.**", "text": "There are two things, actually. The kitchen sink is leaking, and the water heater isn't working.", "zh": "其实有两件事。厨房水槽漏水，热水器也坏了。", "sp": "A"}], [{"id": "s0_3_0", "md": "Oh dear. How bad is the ==leak==?", "text": "Oh dear. How bad is the leak?", "zh": "哎呀。漏得厉害吗？", "sp": "B"}], [{"id": "s0_4_0", "md": "It's dripping from the pipe under the sink. I've put a bucket there and __turned off__ the valve for now.", "text": "It's dripping from the pipe under the sink. I've put a bucket there and turned off the valve for now.", "zh": "是水槽下面的管子在滴水。我先放了个桶，把阀门关了。", "sp": "A"}], [{"id": "s0_5_0", "md": "Good, thank you. And the heater, is there no hot water at all?", "text": "Good, thank you. And the heater, is there no hot water at all?", "zh": "好，谢谢你。那热水器呢，完全没热水吗？", "sp": "B"}], [{"id": "s0_6_0", "md": "None since yesterday. The light on the switch is on, but the water stays cold. With a small kid, it's quite hard.", "text": "None since yesterday. The light on the switch is on, but the water stays cold. With a small kid, it's quite hard.", "zh": "从昨天起就一点都没有。开关的灯是亮的，但出来的水一直是冷的。家里有小孩，挺麻烦的。", "sp": "A"}], [{"id": "s0_7_0", "md": "Must be the ==heating element== again. I'll ask my ==plumber== to come by. When are you usually home?", "text": "Must be the heating element again. I'll ask my plumber to come by. When are you usually home?", "zh": "估计又是加热管坏了。我叫我的水电师傅过来。你们一般什么时候在家？", "sp": "B"}], [{"id": "s0_8_0", "md": "**My wife is home on weekday mornings. Could he come tomorrow before noon?**", "text": "My wife is home on weekday mornings. Could he come tomorrow before noon?", "zh": "我太太工作日上午在家。他明天中午之前能来吗？", "sp": "A"}], [{"id": "s0_9_0", "md": "I'll try. I'll message you once he ==confirms==.", "text": "I'll try. I'll message you once he confirms.", "zh": "我尽量。他确认了我就发消息给你。", "sp": "B"}]]}, {"heading": "2. Who Pays for the Repair", "heading_zh": "2. 维修费谁出", "rows": [[{"id": "s1_0_0", "md": "Hi, the plumber fixed the pipe and changed the heater element. The bill is two hundred and sixty dollars.", "text": "Hi, the plumber fixed the pipe and changed the heater element. The bill is two hundred and sixty dollars.", "zh": "你好，师傅把管子修好了，也换了热水器加热管。一共两百六十块。", "sp": "B"}], [{"id": "s1_1_0", "md": "Thanks for arranging it so quickly. How would you like to handle the cost?", "text": "Thanks for arranging it so quickly. How would you like to handle the cost?", "zh": "谢谢您安排得这么快。费用您打算怎么处理？", "sp": "A"}], [{"id": "s1_2_0", "md": "Under the lease, the tenant covers the first one hundred and fifty dollars of each repair, right?", "text": "Under the lease, the tenant covers the first one hundred and fifty dollars of each repair, right?", "zh": "按租约，每次维修前一百五十块是租客出，对吧？", "sp": "B"}], [{"id": "s1_3_0", "md": "I've read that clause. It's for ==minor== repairs, usually things the tenant has caused.", "text": "I've read that clause. It's for minor repairs, usually things the tenant has caused.", "zh": "那条我看过。那是指小修，一般是租客造成的问题。", "sp": "A"}], [{"id": "s1_4_0", "md": "**The heater is over ten years old, so I'd see it as normal wear and tear.**", "text": "The heater is over ten years old, so I'd see it as normal wear and tear.", "zh": "热水器已经用了十多年了，我觉得这算正常损耗。", "sp": "A"}], [{"id": "s1_5_0", "md": "Hmm, fair point. But the pipe, maybe your helper put something heavy on it?", "text": "Hmm, fair point. But the pipe, maybe your helper put something heavy on it?", "zh": "嗯，有道理。但那根管子，会不会是你家阿姨在上面压了重东西？", "sp": "B"}], [{"id": "s1_6_0", "md": "I don't think so. The plumber said the ==seal== had just worn out. __Would you be okay with__ covering both this time?", "text": "I don't think so. The plumber said the seal had just worn out. Would you be okay with covering both this time?", "z const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
