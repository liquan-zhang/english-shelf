<script>
const D = {"id": "037", "title": "Understanding What Your Boss Is Measured On", "meta": "B2 · 约 280 词 · 场景：理解上级目标", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Every Manager Has a Scorecard", "heading_zh": "1. 每个经理都有一张考核表", "rows": [[{"id": "s0_0_0", "md": "Have you ever wondered why your manager gets excited about some projects and ignores others?", "text": "Have you ever wondered why your manager gets excited about some projects and ignores others?", "zh": "你有没有想过，为什么你的经理对有些项目特别上心，对另一些却不闻不问？", "sp": null}, {"id": "s0_0_1", "md": "It is rarely personal.", "text": "It is rarely personal.", "zh": "这很少是因为个人好恶。", "sp": null}, {"id": "s0_0_2", "md": "Most of the time, it __comes down to__ what their own boss is asking them for.", "text": "Most of the time, it comes down to what their own boss is asking them for.", "zh": "大多数时候，归根结底在于他自己的老板在要求他什么。", "sp": null}], [{"id": "s0_1_0", "md": "Every manager has a ==scorecard==, written or not.", "text": "Every manager has a scorecard, written or not.", "zh": "每个经理都有一张考核表，不管有没有写下来。", "sp": null}, {"id": "s0_1_1", "md": "One might be judged on ==reliability== and the number of incidents, another on revenue, hiring, or launch dates.", "text": "One might be judged on reliability and the number of incidents, another on revenue, hiring, or launch dates.", "zh": "有的考核稳定性和事故数，有的考核营收、招聘或者上线日期。", "sp": null}, {"id": "s0_1_2", "md": "**Once you know the scorecard, your manager's behavior stops looking random.**", "text": "Once you know the scorecard, your manager's behavior stops looking random.", "zh": "一旦你知道了这张考核表，经理的行为就不再显得随机了。", "sp": null}, {"id": "s0_1_3", "md": "The project they keep asking about is probably on it, and the one they keep postponing probably is not.", "text": "The project they keep asking about is probably on it, and the one they keep postponing probably is not.", "zh": "他老是追问的那个项目大概就在表上，他一直往后推的那个大概就不在。", "sp": null}], [{"id": "s0_2_0", "md": "You don't have to guess.", "text": "You don't have to guess.", "zh": "你不用去猜。", "sp": null}, {"id": "s0_2_1", "md": "Ask in a one-on-one: \"What are the two or three things you'll be ==evaluated== on this half?\"", "text": "Ask in a one-on-one: \"What are the two or three things you'll be evaluated on this half?\"", "zh": "在 1:1 里直接问：「这半年您主要会被考核哪两三件事？」", "sp": null}, {"id": "s0_2_2", "md": "Most managers are glad someone asked, because it shows you want to help them succeed.", "text": "Most managers are glad someone asked, because it shows you want to help them succeed.", "zh": "大多数经理都很高兴有人这么问，因为这说明你想帮他把事情做成。", "sp": null}]]}, {"heading": "2. Speaking Their Language", "heading_zh": "2. 用对方的语言说话", "rows": [[{"id": "s1_0_0", "md": "Then ==translate== your work into those terms.", "text": "Then translate your work into those terms.", "zh": "然后，把你的工作翻译成这些指标的语言。", "sp": null}, {"id": "s1_0_1", "md": "If your manager is measured on reliability, don't pitch a refactor as cleaner code.", "text": "If your manager is measured on reliability, don't pitch a refactor as cleaner code.", "zh": "如果你的经理考核的是稳定性，就别把一次重构包装成让代码更整洁。", "sp": null}, {"id": "s1_0_2", "md": "Pitch it as fewer pages for on-call and faster recovery when something breaks.", "text": "Pitch it as fewer pages for on-call and faster recovery when something breaks.", "zh": "要说它能让 on-call 少被呼几次，出了问题也能更快恢复。", "sp": null}, {"id": "s1_0_3", "md": "Your manager can repeat that sentence to their own boss, which is exactly what you want.", "text": "Your manager can repeat that sentence to their own boss, which is exactly what you want.", "zh": "你的经理可以把这句话原样转述给他的老板，这正是你想要的。", "sp": null}], [{"id": "s1_1_0", "md": "This is not ==manipulation==.", "text": "This is not manipulation.", "zh": "这不是操纵。", "sp": null}, {"id": "s1_1_1", "md": "It is the same work, explained in the language of the person who decides.", "text": "It is the same work, explained in the language of the person who decides.", "zh": "这是同样的工作，只是用决策者的语言讲出来而已。", "sp": null}, {"id": "s1_1_2", "md": "A finance partner hears cost, a product manager hears users, and an on-call engineer hears sleep.", "text": "A finance partner hears cost, a product manager hears users, and an on-call engineer hears sleep.", "zh": "财务伙伴听的是成本，产品经理听的是用户，on-call 工程师听的是能不能睡个好觉。", "sp": null}, {"id": "s1_1_3", "md": "**The best ideas still lose when they are pitched in the wrong currency.**", "text": "The best ideas still lose when they are pitched in the wrong currency.", "zh": "再好的想法，用错了「货币」去推销，照样会输。", "sp": null}], [{"id": "s1_2_0", "md": "Knowing the scorecard also helps you __pick your battles__.", "text": "Knowing the scorecard also helps you pick your battles.", "zh": "了解考核表也能帮你挑选值得打的仗。", "sp": null}, {"id": "s1_2_1", "md": "When two tasks compete for your week, choose the one that __moves the needle__ on what your manager is measured on.", "text": "When two tasks compete for your week, choose the one that moves the needle on what your manager is measured on.", "zh": "当两件事都在抢你这周的时间时，选那件能在经理考核指标上真正带来改变的。", "sp": null}, {"id": "s1_2_2", "md": "And when something you care about does not ==align== with it, you will know you need a stronger case or a different sponsor.", "text": "And when something you care about does not align with it, you will know you need a stronger case or a different sponsor.", "zh": "而当你在意的某件事跟这些指标对不上时，你就知道自己需要更有力的理由，或者换一个支持者。", "sp": null}]]}], "gist": [{"q": "为什么经理对某些项目热情、对另一些冷淡？", "a": "很少是个人原因，主要取决于他自己的上级考核他什么，也就是他的「记分卡」。"}, {"q": "怎么知道经理被考核什么？", "a": "不用猜，在一对一里直接问「这半年你主要被考核哪两三件事」，大多数经理乐意回答。"}, {"q": "知道记分卡之后怎么用？这算不算操纵？", "a": "把自己的工作翻译成那套指标来讲（比如重构讲成减少告警、加快恢复）；帮助取舍任务。不算操纵，是同样的工作换成决策者的语言。"}], "dictation": [{"id": "s0_1_2", "text": "Once you know the scorecard, your manager's behavior stops looking random."}, {"id": "s1_1_3", "text": "The best ideas still lose when they are pitched in the wrong currency."}, {"id": "s1_1_1", "text": "It is the same work, explained in the language of the person who decides."}, {"id": "s0_0_2", "text": "Most of the time, it comes down to what their own boss is asking them for."}], "shadow": {"text": "Then translate your work into those terms. If your manager is measured on reliability, don't pitch a refactor as cleaner code. Pitch it as fewer pages for on-call and faster recovery when something breaks.", "marked": "Then <b>translate</b> your work / into <b>those</b> terms. //<br>If your manager is measured on <b>reliability</b>, / <b>don't</b> pitch a refactor / as <b>cleaner code</b>. //<br>Pitch it as <b>fewer pages</b> for on-call / and <b>faster recovery</b> / when something breaks. //"}, "prompts": [{"q": "你想做一次数据库重构，经理这半年主要考核的是系统稳定性。用 30 秒按他的考核指标来介绍这个提案。", "ref": "I'd like to propose something that should help our reliability numbers this half. Most of our pages last quarter came from the same database, especially during peak hours. If we split the reporting queries onto a replica, I expect those pages to drop by more than half, and recovery gets faster because the main database stays healthy. It's about three weeks of work for two engineers.", "ref_zh": "我想提一个应该能改善我们这半年稳定性指标的方案。上个季度大部分告警都来自同一个数据库，尤其是在高峰时段。如果我们把报表查询拆到一个只读副本上，我预计这些告警能降一半以上，而且因为主库保持健康，故障恢复也会更快。大概是两个工程师三周的工作量。", "id": "ref0"}, {"q": "在一对一里，你想了解经理这半年被考核什么。用 30 秒自然地问出来，并说明你为什么想知道。", "ref": "Can I ask you something a bit different today? What are the two or three things you'll be evaluated on this half? I'm asking because I want to make sure my team's work lines up with what matters most to you and to your boss. If something we're doing doesn't really connect to those goals, I'd rather know now so we can adjust.", "ref_zh": "今天我能问你一个不太一样的问题吗？这半年你主要会被考核哪两三件事？我问这个，是想确保我们团队的工作跟你和你老板最看重的东西对得上。如果我们在做的某件事其实跟这些目标关系不大，我宁愿现在就知道，好及时调整。", "id": "ref1"}], "words": [{"w": "scorecard", "ipa": "/ˈskɔːrkɑːrd/", "zh": "考核记分卡", "ex": "Hiring targets are on every manager's scorecard this year.", "id": "w0"}, {"w": "reliability", "ipa": "/rɪˌlaɪəˈbɪləti/", "zh": "可靠性、稳定性", "ex": "Our reliability goal is fewer than two major incidents per quarter." const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
