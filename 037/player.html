<script>
const D = {"id": "037", "title": "Understanding What Your Boss Is Measured On", "meta": "B2 · 约 280 词 · 场景：理解上级目标", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Every Manager Has a Scorecard", "heading_zh": "1. 每个经理都有一张考核表", "rows": [[{"id": "s0_0_0", "md": "Have you ever wondered why your manager gets excited about some projects and ignores others?", "text": "Have you ever wondered why your manager gets excited about some projects and ignores others?", "zh": "你有没有想过，为什么你的经理对有些项目特别上心，对另一些却不闻不问？", "sp": null}, {"id": "s0_0_1", "md": "It is rarely personal.", "text": "It is rarely personal.", "zh": "这很少是因为个人好恶。", "sp": null}, {"id": "s0_0_2", "md": "Most of the time, it __comes down to__ what their own boss is asking them for.", "text": "Most of the time, it comes down to what their own boss is asking them for.", "zh": "大多数时候，归根结底在于他自己的老板在要求他什么。", "sp": null}], [{"id": "s0_1_0", "md": "Every manager has a ==scorecard==, written or not.", "text": "Every manager has a scorecard, written or not.", "zh": "每个经理都有一张考核表，不管有没有写下来。", "sp": null}, {"id": "s0_1_1", "md": "One might be judged on ==reliability== and the number of incidents, another on revenue, hiring, or launch dates.", "text": "One might be judged on reliability and the number of incidents, another on revenue, hiring, or launch dates.", "zh": "有的考核稳定性和事故数，有的考核营收、招聘或者上线日期。", "sp": null}, {"id": "s0_1_2", "md": "**Once you know the scorecard, your manager's behavior stops looking random.**", "text": "Once you know the scorecard, your manager's behavior stops looking random.", "zh": "一旦你知道了这张考核表，经理的行为就不再显得随机了。", "sp": null}, {"id": "s0_1_3", "md": "The project they keep asking about is probably on it, and the one they keep postponing probably is not.", "text": "The project they keep asking about is probably on it, and the one they keep postponing probably is not.", "zh": "他老是追问的那个项目大概就在表上，他一直往后推的那个大概就不在。", "sp": null}], [{"id": "s0_2_0", "md": "You don't have to guess.", "text": "You don't have to guess.", "zh": "你不用去猜。", "sp": null}, {"id": "s0_2_1", "md": "Ask in a one-on-one: \"What are the two or three things you'll be ==evaluated== on this half?\"", "text": "Ask in a one-on-one: \"What are the two or three things you'll be evaluated on this half?\"", "zh": "在 1:1 里直接问：「这半年您主要会被考核哪两三件事？」", "sp": null}, {"id": "s0_2_2", "md": "Most managers are glad someone asked, because it shows you want to help them succeed.", "text": "Most managers are glad someone asked, because it shows you want to help them succeed.", "zh": "大多数经理都很高兴有人这么问，因为这说明你想帮他把事情做成。", "sp": null}]]}, {"heading": "2. Speaking Their Language", "heading_zh": "2. 用对方的语言说话", "rows": [[{"id": "s1_0_0", "md": "Then ==translate== your work into those terms.", "text": "Then translate your work into those terms.", "zh": "然后，把你的工作翻译成这些指标的语言。", "sp": null}, {"id": "s1_0_1", "md": "If your manager is measured on reliability, don't pitch a refactor as cleaner code.", "text": "If your manager is measured on reliability, don't pitch a refactor as cleaner code.", "zh": "如果你的经理考核的是稳定性，就别把一次重构包装成让代码更整洁。", "sp": null}, {"id": "s1_0_2", "md": "Pitch it as fewer pages for on-call and faster recovery when something breaks.", "text": "Pitch it as fewer pages for on-call and faster recovery when something breaks.", "zh": "要说它能让 on-call 少被呼几次，出了问题也能更快恢复。", "sp": null}, {"id": "s1_0_3", "md": "Your manager can repeat that sentence to their own boss, which is exactly what you want.", "text": "Your manager can repeat that sentence to their own boss, which is exactly what you want.", "zh": "你的经理可以把这句话原样转述给他的老板，这正是你想要的。", "sp": null}], [{"id": "s1_1_0", "md": "This is not ==manipulation==.", "text": "This is not manipulation.", "zh": "这不是操纵。", "sp": null}, {"id": "s1_1_1", "md": "It is the same work, explained in the language of the person who decides.", "text": "It is the same work, explained in the language of the person who decides.", "zh": "这是同样的工作，只是用决策者的语言讲出来而已。", "sp": null}, {"id": "s1_1_2", "md": "A finance partner hears cost, a product manager hears users, and an on-call engineer hears sleep.", "text": "A finance partner hears cost, a product manager hears users, and an on-call engineer hears sleep.", "zh": "财务伙伴听的是成本，产品经理听的是用户，on-call 工程师听的是能不能睡个好觉。", "sp": null}, {"id": "s1_1_3", "md": "**The best ideas still lose when they are pitched in the wrong currency.**", "text": "The best ideas still lose when they are pitched in the wrong currency.", "zh": "再好的想法，用错了「货币」去推销，照样会输。", "sp": null}], [{"id": "s1_2_0", "md": "Knowing the scorecard also helps you __pick your battles__.", "text": "Knowing the scorecard also helps you pick your battles.", "zh": "了解考核表也能帮你挑选值得打的仗。", "sp": null}, {"id": "s1_2_1", "md": "When two tasks compete for your week, choose the one that __moves the needle__ on what your manager is measured on.", "text": "When two tasks compete for your week, choose the one that moves the needle on what your manager is measured on.", "zh": "当两件事都在抢你这周的时间时，选那件能在经理考核指标上真正带来改变的。", "sp": null}, {"id": "s1_2_2", "md": "And when something you care about does not ==align== with it, you will know you need a stronger case or a different sponsor.", "text": "And when something you care about does not align with it, you will know you need a stronger case or a different sponsor.", "zh": "而当你在意的某件事跟这些指标对不上时，你就知道自己需要更有力的理由，或者换一个支持者。", "sp": null}]]}], "gist": [{"q": "为什么经理对某些项目热情、对另一些冷淡？", "a": "很少是个人原因，主要取决于他自己的上级考核他什么，也就是他的「记分卡」。"}, {"q": "怎么知道经理被考核什么？", "a": "不用猜，在一对一里直接问「这半年你主要被考核哪两三件事」，大多数经理乐意回答。"}, {"q": "知道记分卡之后怎么用？这算不算操纵？", "a": "把自己的工作翻译成那套指标来讲（比如重构讲成减少告警、加快恢复）；帮助取舍任务。不算操纵，是同样的工作换成决策者的语言。"}], "dictation": [{"id": "s0_1_2", "text": "Once you know the scorecard, your manager's behavior stops looking random."}, {"id": "s1_1_3", "text": "The best ideas still lose when they are pitched in the wrong currency."}, {"id": "s1_1_1", "text": "It is the same work, explained in the language of the person who decides."}, {"id": "s0_0_2", "text": "Most of the time, it comes down to what their own boss is asking them for."}], "shadow": {"text": "Then translate your work into those terms. If your manager is measured on reliability, don't pitch a refactor as cleaner code. Pitch it as fewer pages for on-call and faster recovery when something breaks.", "marked": "Then <b>translate</b> your work / into <b>those</b> terms. //<br>If your manager is measured on <b>reliability</b>, / <b>don't</b> pitch a refactor / as <b>cleaner code</b>. //<br>Pitch it as <b>fewer pages</b> for on-call / and <b>faster recovery</b> / when something breaks. //"}, "prompts": [{"q": "你想做一次数据库重构，经理这半年主要考核的是系统稳定性。用 30 秒按他的考核指标来介绍这个提案。", "ref": "I'd like to propose something that should help our reliability numbers this half. Most of our pages last quarter came from the same database, especially during peak hours. If we split the reporting queries onto a replica, I expect those pages to drop by more than half, and recovery gets faster because the main database stays healthy. It's about three weeks of work for two engineers.", "ref_zh": "我想提一个应该能改善我们这半年稳定性指标的方案。上个季度大部分告警都来自同一个数据库，尤其是在高峰时段。如果我们把报表查询拆到一个只读副本上，我预计这些告警能降一半以上，而且因为主库保持健康，故障恢复也会更快。大概是两个工程师三周的工作量。", "id": "ref0"}, {"q": "在一对一里，你想了解经理这半年被考核什么。用 30 秒自然地问出来，并说明你为什么想知道。", "ref": "Can I ask you something a bit different today? What are the two or three things you'll be evaluated on this half? I'm asking because I want to make sure my team's work lines up with what matters most to you and to your boss. If something we're doing doesn't really connect to those goals, I'd rather know now so we can adjust.", "ref_zh": "今天我能问你一个不太一样的问题吗？这半年你主要会被考核哪两三件事？我问这个，是想确保我们团队的工作跟你和你老板最看重的东西对得上。如果我们在做的某件事其实跟这些目标关系不大，我宁愿现在就知道，好及时调整。", "id": "ref1"}], "words": [{"w": "scorecard", "ipa": "/ˈskɔːrkɑːrd/", "zh": "考核记分卡", "ex": "Hiring targets are on every manager's scorecard this year.", "id": "w0"}, {"w": "reliability", "ipa": "/rɪˌlaɪəˈbɪləti/", "zh": "可靠性、稳定性", "ex": "Our reliability goal is fewer than two major incidents per quarter."  [89.833, 89.991], [90.004, 90.149], [90.162, 90.491], [90.794, 91.149], [91.162, 91.281], [91.294, 91.557], [91.57, 91.754], [91.767, 92.123], [92.136, 92.215], [92.228, 92.596], [92.609, 92.754], [92.767, 92.912], [92.925, 93.03], [93.044, 93.583], [93.741, 93.846], [93.859, 94.215], [94.228, 94.504]]}, {"kind": "s", "id": "s1_2_2", "md": "And when something you care about does not ==align== with it, you will know you need a stronger case or a different sponsor.", "zh": "而当你在意的某件事跟这些指标对不上时，你就知道自己需要更有力的理由，或者换一个支持者。", "sp": null, "gap": false, "start": 94.896, "end": 101.256, "words": [[95.001, 95.067], [95.08, 95.199], [95.212, 95.541], [95.554, 95.659], [95.672, 95.922], [95.935, 96.225], [96.238, 96.383], [96.396, 96.62], [96.633, 97.041], [97.054, 97.251], [97.264, 97.409], [97.83, 97.896], [97.909, 98.028], [98.041, 98.251], [98.264, 98.422], [98.435, 98.606], [98.62, 98.659], [98.672, 99.159], [99.172, 99.633], [99.778, 99.883], [99.896, 99.962], [99.975, 100.278], [100.291, 100.87]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
