<script>
const D = {"id": "066", "title": "Reversible and Irreversible Decisions", "meta": "B2 · 约 260 词 · 场景：技术决策", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Ask What It Costs to Undo", "heading_zh": "1. 先问撤回的代价", "rows": [[{"id": "s0_0_0", "md": "Many teams spend the same amount of debate on every decision.", "text": "Many teams spend the same amount of debate on every decision.", "zh": "很多团队对每个决定都花同样多的时间争论。", "sp": null}, {"id": "s0_0_1", "md": "A button color gets three meetings, and so does a database migration.", "text": "A button color gets three meetings, and so does a database migration.", "zh": "一个按钮颜色开三次会，一次数据库迁移也开三次会。", "sp": null}, {"id": "s0_0_2", "md": "That is a ==mismatch==, and it slows everything down.", "text": "That is a mismatch, and it slows everything down.", "zh": "这就是错配，它会拖慢所有事情。", "sp": null}], [{"id": "s0_1_0", "md": "A better first question is simple: if we get this wrong, what does it cost to undo?", "text": "A better first question is simple: if we get this wrong, what does it cost to undo?", "zh": "更好的第一个问题很简单：如果我们做错了，撤回要付出什么代价？", "sp": null}, {"id": "s0_1_1", "md": "Changing a feature flag costs minutes.", "text": "Changing a feature flag costs minutes.", "zh": "改一个 feature flag 只要几分钟。", "sp": null}, {"id": "s0_1_2", "md": "Changing a public API that partners have built on can cost a year.", "text": "Changing a public API that partners have built on can cost a year.", "zh": "改一个合作方已经接入的公开 API，可能要花一年。", "sp": null}, {"id": "s0_1_3", "md": "**The cost of undoing a decision, not its size, should decide how long you debate it.**", "text": "The cost of undoing a decision, not its size, should decide how long you debate it.", "zh": "决定该讨论多久，取决于撤回它的代价，而不是它看起来有多大。", "sp": null}], [{"id": "s0_2_0", "md": "Most daily choices are ==reversible==.", "text": "Most daily choices are reversible.", "zh": "日常大多数选择都是可逆的。", "sp": null}, {"id": "s0_2_1", "md": "Which library to try, how to name a config, which test to write first.", "text": "Which library to try, how to name a config, which test to write first.", "zh": "试哪个库、配置怎么命名、先写哪个测试。", "sp": null}, {"id": "s0_2_2", "md": "For these, a quick decision by one ==accountable== person beats a perfect decision by committee.", "text": "For these, a quick decision by one accountable person beats a perfect decision by committee.", "zh": "对这类事，由一个负责人快速拍板，胜过一个委员会做出完美决定。", "sp": null}, {"id": "s0_2_3", "md": "If it turns out wrong, you __change course__ next week and lose very little.", "text": "If it turns out wrong, you change course next week and lose very little.", "zh": "就算错了，下周换个方向就行，损失很小。", "sp": null}]]}, {"heading": "2. Where to Slow Down", "heading_zh": "2. 哪里该慢下来", "rows": [[{"id": "s1_0_0", "md": "A few decisions really are hard to take back.", "text": "A few decisions really are hard to take back.", "zh": "有少数决定确实很难收回。", "sp": null}, {"id": "s1_0_1", "md": "Data schemas, public contracts, deleting user data, and anything that ==alters== what users have been promised.", "text": "Data schemas, public contracts, deleting user data, and anything that alters what users have been promised.", "zh": "数据 schema、对外的接口约定、删除用户数据，以及任何会改变对用户承诺的事。", "sp": null}, {"id": "s1_0_2", "md": "These __deserve the extra meeting__, a written proposal, and a second reviewer.", "text": "These deserve the extra meeting, a written proposal, and a second reviewer.", "zh": "这些值得多开一次会、写一份书面方案，再加一个 reviewer。", "sp": null}], [{"id": "s1_1_0", "md": "The trick is to say out loud which kind of decision you are in.", "text": "The trick is to say out loud which kind of decision you are in.", "zh": "诀窍是把你面对的是哪一类决定说出来。", "sp": null}, {"id": "s1_1_1", "md": "\"This is easy to undo, so let's pick one today and look at it again next sprint.\"", "text": "\"This is easy to undo, so let's pick one today and look at it again next sprint.\"", "zh": "「这个很容易撤回，我们今天就选一个，下个迭代再回头看。」", "sp": null}, {"id": "s1_1_2", "md": "Or: \"This one is ==permanent== once partners integrate, so I want a design review first.\"", "text": "Or: \"This one is permanent once partners integrate, so I want a design review first.\"", "zh": "或者：「这个一旦合作方接入就改不了了，所以我想先过一次设计评审。」", "sp": null}], [{"id": "s1_2_0", "md": "**Labeling the decision out loud ends a lot of pointless debate.**", "text": "Labeling the decision out loud ends a lot of pointless debate.", "zh": "把决定的类型说出来，能省掉大量无谓的争论。", "sp": null}, {"id": "s1_2_1", "md": "People relax when they know a choice can be ==revisited==.", "text": "People relax when they know a choice can be revisited.", "zh": "大家知道一个选择以后还能再改，就会放松下来。", "sp": null}, {"id": "s1_2_2", "md": "And they __take it seriously__ when you tell them it cannot.", "text": "And they take it seriously when you tell them it cannot.", "zh": "你告诉他们改不了的时候，他们也会认真对待。", "sp": null}, {"id": "s1_2_3", "md": "Over time, the team learns to move fast on most things and carefully on the few that matter.", "text": "Over time, the team learns to move fast on most things and carefully on the few that matter.", "zh": "时间长了，团队就学会了大多数事情快速推进，少数关键的事谨慎处理。", "sp": null}]]}], "gist": [{"q": "作者说团队在决策上常犯什么错？", "a": "对所有决定花同样多的讨论时间，按钮颜色和数据库迁移都开三次会，节奏错配。"}, {"q": "判断该讨论多久，应该看什么？", "a": "看决定撤销的成本，而不是决定看起来多大；可逆的由一个负责人快速拍板。"}, {"q": "哪些决定值得放慢？作者建议在会上怎么做？", "a": "数据结构、对外接口、删除数据、改变对用户承诺的事；在会上明确说出这是可逆还是不可逆的决定。"}], "dictation": [{"id": "s0_1_3", "text": "The cost of undoing a decision, not its size, should decide how long you debate it."}, {"id": "s0_2_2", "text": "For these, a quick decision by one accountable person beats a perfect decision by committee."}, {"id": "s1_2_0", "text": "Labeling the decision out loud ends a lot of pointless debate."}, {"id": "s1_2_3", "text": "Over time, the team learns to move fast on most things and carefully on the few that matter."}], "shadow": {"text": "A better first question is simple: if we get this wrong, what does it cost to undo? Changing a feature flag costs minutes. Changing a public API that partners have built on can cost a year.", "marked": "A better <b>first</b> question is simple: / if we get this <b>wrong</b>, / what does it <b>cost</b> to undo? //<br>Changing a feature <b>flag</b> / costs <b>minutes</b>. //<br>Changing a <b>public</b> API / that partners have built on / can cost a <b>year</b>. //"}, "prompts": [{"q": "团队为日志库选型已经争了两周。用 30 秒指出这是可逆决定，并推动今天拍板。", "ref": "Can I step back for a second? We've spent two weeks on this, but switching logging libraries later is maybe two days of work. That makes it a reversible decision. I'd suggest Priya picks one today, since she owns the service, and we check how it's going after one sprint. If it's painful, we switch. Let's save our debate time for the schema changes coming next month.", "ref_zh": "我能先跳出来说一句吗？这件事我们已经讨论了两周，但以后要换日志库，大概也就两天的工作量。这说明它是一个可逆的决定。我建议 Priya 今天选一个，毕竟服务是她负责的，一个迭代之后我们看看效果。要是用着难受，我们再换。把争论的时间留给下个月的 schema 变更吧。", "id": "ref0"}, {"q": "PM 想下周就把新接口开放给外部合作方。用 30 秒说明这是不可逆决定，需要先做设计评审。", "ref": "I'm excited about this too, but I want to flag the type of decision we're making. Once partners build on this API, we basically can't change the response format without breaking them. That makes it close to permanent. So I'd like a short design review and one more reviewer before we open it up. It might cost us a week now, but it could save us a year of support later.", "ref_zh": "我也很期待这个，但我想提醒一下我们在做的是哪一类决定。合作方一旦基于这个 API 开发，我们基本就没法改返回格式了，否则会把他们搞挂。所以这几乎是永久性的。我希望在开放之前先过一次简短的设计评审，再多加一个 reviewer。现在可能会多花一周，但以后可能省下一年的支持成本。", "id": "ref1"}], "words": [{"w": "mismatch", "ipa": "/ˈmɪsˌmætʃ/", "zh": "不匹配、错配", "ex": "There's a mismatch between the roadmap and our actual headcount.", "id": "w0"}, {"w": "reversible", "ipa": "/rɪˈvɜːrsəbəl/", "zh": "可逆的、可撤回的", "ex": "This config change is fully reversible, so let's just try it.", "id": "w1"}, {"w": "accountable", "ipa": "/əˈkaʊntəbəl/", "zh": "负责的、须担责的", "ex": "Who is accountable for the final launch decision?", "id": "w2"}, {"w": "alter", "ipa": "/ˈɔːltər/", "zh": "改变、更改", "ex": "This migration will alter how we store user const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
