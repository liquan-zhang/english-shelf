<script>
const D = {"id": "066", "title": "Reversible and Irreversible Decisions", "meta": "B2 · 约 260 词 · 场景：技术决策", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Ask What It Costs to Undo", "heading_zh": "1. 先问撤回的代价", "rows": [[{"id": "s0_0_0", "md": "Many teams spend the same amount of debate on every decision.", "text": "Many teams spend the same amount of debate on every decision.", "zh": "很多团队对每个决定都花同样多的时间争论。", "sp": null}, {"id": "s0_0_1", "md": "A button color gets three meetings, and so does a database migration.", "text": "A button color gets three meetings, and so does a database migration.", "zh": "一个按钮颜色开三次会，一次数据库迁移也开三次会。", "sp": null}, {"id": "s0_0_2", "md": "That is a ==mismatch==, and it slows everything down.", "text": "That is a mismatch, and it slows everything down.", "zh": "这就是错配，它会拖慢所有事情。", "sp": null}], [{"id": "s0_1_0", "md": "A better first question is simple: if we get this wrong, what does it cost to undo?", "text": "A better first question is simple: if we get this wrong, what does it cost to undo?", "zh": "更好的第一个问题很简单：如果我们做错了，撤回要付出什么代价？", "sp": null}, {"id": "s0_1_1", "md": "Changing a feature flag costs minutes.", "text": "Changing a feature flag costs minutes.", "zh": "改一个 feature flag 只要几分钟。", "sp": null}, {"id": "s0_1_2", "md": "Changing a public API that partners have built on can cost a year.", "text": "Changing a public API that partners have built on can cost a year.", "zh": "改一个合作方已经接入的公开 API，可能要花一年。", "sp": null}, {"id": "s0_1_3", "md": "**The cost of undoing a decision, not its size, should decide how long you debate it.**", "text": "The cost of undoing a decision, not its size, should decide how long you debate it.", "zh": "决定该讨论多久，取决于撤回它的代价，而不是它看起来有多大。", "sp": null}], [{"id": "s0_2_0", "md": "Most daily choices are ==reversible==.", "text": "Most daily choices are reversible.", "zh": "日常大多数选择都是可逆的。", "sp": null}, {"id": "s0_2_1", "md": "Which library to try, how to name a config, which test to write first.", "text": "Which library to try, how to name a config, which test to write first.", "zh": "试哪个库、配置怎么命名、先写哪个测试。", "sp": null}, {"id": "s0_2_2", "md": "For these, a quick decision by one ==accountable== person beats a perfect decision by committee.", "text": "For these, a quick decision by one accountable person beats a perfect decision by committee.", "zh": "对这类事，由一个负责人快速拍板，胜过一个委员会做出完美决定。", "sp": null}, {"id": "s0_2_3", "md": "If it turns out wrong, you __change course__ next week and lose very little.", "text": "If it turns out wrong, you change course next week and lose very little.", "zh": "就算错了，下周换个方向就行，损失很小。", "sp": null}]]}, {"heading": "2. Where to Slow Down", "heading_zh": "2. 哪里该慢下来", "rows": [[{"id": "s1_0_0", "md": "A few decisions really are hard to take back.", "text": "A few decisions really are hard to take back.", "zh": "有少数决定确实很难收回。", "sp": null}, {"id": "s1_0_1", "md": "Data schemas, public contracts, deleting user data, and anything that ==alters== what users have been promised.", "text": "Data schemas, public contracts, deleting user data, and anything that alters what users have been promised.", "zh": "数据 schema、对外的接口约定、删除用户数据，以及任何会改变对用户承诺的事。", "sp": null}, {"id": "s1_0_2", "md": "These __deserve the extra meeting__, a written proposal, and a second reviewer.", "text": "These deserve the extra meeting, a written proposal, and a second reviewer.", "zh": "这些值得多开一次会、写一份书面方案，再加一个 reviewer。", "sp": null}], [{"id": "s1_1_0", "md": "The trick is to say out loud which kind of decision you are in.", "text": "The trick is to say out loud which kind of decision you are in.", "zh": "诀窍是把你面对的是哪一类决定说出来。", "sp": null}, {"id": "s1_1_1", "md": "\"This is easy to undo, so let's pick one today and look at it again next sprint.\"", "text": "\"This is easy to undo, so let's pick one today and look at it again next sprint.\"", "zh": "「这个很容易撤回，我们今天就选一个，下个迭代再回头看。」", "sp": null}, {"id": "s1_1_2", "md": "Or: \"This one is ==permanent== once partners integrate, so I want a design review first.\"", "text": "Or: \"This one is permanent once partners integrate, so I want a design review first.\"", "zh": "或者：「这个一旦合作方接入就改不了了，所以我想先过一次设计评审。」", "sp": null}], [{"id": "s1_2_0", "md": "**Labeling the decision out loud ends a lot of pointless debate.**", "text": "Labeling the decision out loud ends a lot of pointless debate.", "zh": "把决定的类型说出来，能省掉大量无谓的争论。", "sp": null}, {"id": "s1_2_1", "md": "People relax when they know a choice can be ==revisited==.", "text": "People relax when they know a choice can be revisited.", "zh": "大家知道一个选择以后还能再改，就会放松下来。", "sp": null}, {"id": "s1_2_2", "md": "And they __take it seriously__ when you tell them it cannot.", "text": "And they take it seriously when you tell them it cannot.", "zh": "你告诉他们改不了的时候，他们也会认真对待。", "sp": null}, {"id": "s1_2_3", "md": "Over time, the team learns to move fast on most things and carefully on the few that matter.", "text": "Over time, the team learns to move fast on most things and carefully on the few that matter.", "zh": "时间长了，团队就学会了大多数事情快速推进，少数关键的事谨慎处理。", "sp": null}]]}], "gist": [{"q": "作者说团队在决策上常犯什么错？", "a": "对所有决定花同样多的讨论时间，按钮颜色和数据库迁移都开三次会，节奏错配。"}, {"q": "判断该讨论多久，应该看什么？", "a": "看决定撤销的成本，而不是决定看起来多大；可逆的由一个负责人快速拍板。"}, {"q": "哪些决定值得放慢？作者建议在会上怎么做？", "a": "数据结构、对外接口、删除数据、改变对用户承诺的事；在会上明确说出这是可逆还是不可逆的决定。"}], "dictation": [{"id": "s0_1_3", "text": "The cost of undoing a decision, not its size, should decide how long you debate it."}, {"id": "s0_2_2", "text": "For these, a quick decision by one accountable person beats a perfect decision by committee."}, {"id": "s1_2_0", "text": "Labeling the decision out loud ends a lot of pointless debate."}, {"id": "s1_2_3", "text": "Over time, the team learns to move fast on most things and carefully on the few that matter."}], "shadow": {"text": "A better first question is simple: if we get this wrong, what does it cost to undo? Changing a feature flag costs minutes. Changing a public API that partners have built on can cost a year.", "marked": "A better <b>first</b> question is simple: / if we get this <b>wrong</b>, / what does it <b>cost</b> to undo? //<br>Changing a feature <b>flag</b> / costs <b>minutes</b>. //<br>Changing a <b>public</b> API / that partners have built on / can cost a <b>year</b>. //"}, "prompts": [{"q": "团队为日志库选型已经争了两周。用 30 秒指出这是可逆决定，并推动今天拍板。", "ref": "Can I step back for a second? We've spent two weeks on this, but switching logging libraries later is maybe two days of work. That makes it a reversible decision. I'd suggest Priya picks one today, since she owns the service, and we check how it's going after one sprint. If it's painful, we switch. Let's save our debate time for the schema changes coming next month.", "ref_zh": "我能先跳出来说一句吗？这件事我们已经讨论了两周，但以后要换日志库，大概也就两天的工作量。这说明它是一个可逆的决定。我建议 Priya 今天选一个，毕竟服务是她负责的，一个迭代之后我们看看效果。要是用着难受，我们再换。把争论的时间留给下个月的 schema 变更吧。", "id": "ref0"}, {"q": "PM 想下周就把新接口开放给外部合作方。用 30 秒说明这是不可逆决定，需要先做设计评审。", "ref": "I'm excited about this too, but I want to flag the type of decision we're making. Once partners build on this API, we basically can't change the response format without breaking them. That makes it close to permanent. So I'd like a short design review and one more reviewer before we open it up. It might cost us a week now, but it could save us a year of support later.", "ref_zh": "我也很期待这个，但我想提醒一下我们在做的是哪一类决定。合作方一旦基于这个 API 开发，我们基本就没法改返回格式了，否则会把他们搞挂。所以这几乎是永久性的。我希望在开放之前先过一次简短的设计评审，再多加一个 reviewer。现在可能会多花一周，但以后可能省下一年的支持成本。", "id": "ref1"}], "words": [{"w": "mismatch", "ipa": "/ˈmɪsˌmætʃ/", "zh": "不匹配、错配", "ex": "There's a mismatch between the roadmap and our actual headcount.", "id": "w0"}, {"w": "reversible", "ipa": "/rɪˈvɜːrsəbəl/", "zh": "可逆的、可撤回的", "ex": "This config change is fully reversible, so let's just try it.", "id": "w1"}, {"w": "accountable", "ipa": "/əˈkaʊntəbəl/", "zh": "负责的、须担责的", "ex": "Who is accountable for the final launch decision?", "id": "w2"}, {"w": "alter", "ipa": "/ˈɔːltər/", "zh": "改变、更改", "ex": "This migration will alter how we store user : 92.472, "end": 98.208, "words": [[92.577, 92.775], [92.788, 93.222], [93.538, 93.617], [93.63, 93.932], [93.946, 94.222], [94.235, 94.327], [94.34, 94.577], [94.59, 95.011], [95.025, 95.143], [95.156, 95.485], [95.498, 95.906], [95.985, 96.169], [96.183, 96.735], [96.748, 96.854], [96.867, 96.933], [96.946, 97.222], [97.235, 97.419], [97.433, 97.827]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
