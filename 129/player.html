<script>
const D = {"id": "129", "type": "dialogue", "title": "Booking Movers", "meta": "B2 · 约 320 词 · 场景：搬家询价与砍价", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Moving Coordinator", "name_zh": "搬家公司客服", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "「你」家有哪些需要特别处理的物品？搬家公司怎么处理？", "a": "六十五寸电视、玻璃餐桌和很多厨房用品；单独包装，电视用专门木箱。"}, {"q": "最初报价多少？由哪几部分组成？", "a": "两千三百块：搬运一千四、打包六百、保险三百。"}, {"q": "「你」用了哪两个办法把价格降下来？最后多少？", "a": "改到工作日（周三）省两百，书和衣服自己打包再省两百，降到一千九左右，还免费拆装床。"}], "dictation": [{"id": "s0_3_0", "text": "Ideally on the fifteenth of next month. And yes, we'd like you to pack everything for us."}, {"id": "s0_9_0", "text": "I'd rather be on the safe side. Could you include that in the quote?"}, {"id": "s1_4_0", "text": "I see. Is there a surcharge for weekends? Would a weekday be cheaper?"}, {"id": "s1_6_0", "text": "A Wednesday is fine. And what if we pack the books and clothes ourselves?"}], "shadow": {"speaker": "A", "text": "Thanks for sending it. It's quite a bit higher than I expected. Could you break down the cost for me?", "marked": "Thanks for <b>sending</b> it. //<br>It's <b>quite a bit higher</b> / than I <b>expected</b>. //<br>Could you <b>break down</b> the cost / for me? //"}, "prompts": [{"q": "搬家当天，你发现一个箱子被压坏，里面的花瓶碎了。跟搬家队长说明情况，要求记录并问怎么理赔。", "ref": "Excuse me, could you come and look at this box? It was crushed at the bottom, and the vase inside is broken. It was marked fragile on the top. Could you note it down on the delivery form before you leave? And what do I need to do to make an insurance claim? Should I send you photos?", "ref_zh": "不好意思，能过来看一下这个箱子吗？底部被压坏了，里面的花瓶碎了。箱子顶上标了易碎。你们走之前能在交接单上记一下吗？我要理赔需要做什么？要发照片给你们吗？", "id": "ref0"}, {"q": "你收到两家搬家公司的报价，想让第一家再便宜一点。礼貌地拿另一家报价去谈。", "ref": "Hi Neha, thanks for the quote. To be honest, I really liked your service on the phone, but another company has quoted us about three hundred less for the same job. Is there any flexibility on your price? If you could get a bit closer to theirs, I'd be happy to confirm with you today.", "ref_zh": "妮哈你好，谢谢你的报价。说实话，我很喜欢你们电话里的服务，但另一家公司同样的活报价便宜了三百左右。你们价格上还有商量余地吗？如果能接近一点，我今天就可以跟你们确认。", "id": "ref1"}], "words": [{"w": "quote", "ipa": "/kwoʊt/", "zh": "报价", "ex": "Get at least three quotes before you choose a company.", "id": "w0"}, {"w": "fragile", "ipa": "/ˈfrædʒəl/", "zh": "易碎的", "ex": "Please mark this box as fragile.", "id": "w1"}, {"w": "insured", "ipa": "/ɪnˈʃʊrd/", "zh": "有保险的，已投保的", "ex": "Is the car insured for other drivers?", "id": "w2"}, {"w": "coverage", "ipa": "/ˈkʌvərɪdʒ/", "zh": "保险范围，保障额度", "ex": "Check how much coverage you have before you travel.", "id": "w3"}, {"w": "survey", "ipa": "/ˈsɜːrveɪ/", "zh": "（上门或视频）查看评估", "ex": "The movers did a quick survey of our flat.", "id": "w4"}, {"w": "surcharge", "ipa": "/ˈsɜːrtʃɑːrdʒ/", "zh": "附加费", "ex": "There's a surcharge for taxis after midnight.", "id": "w5"}, {"w": "dismantle", "ipa": "/dɪsˈmæntəl/", "zh": "拆卸", "ex": "We had to dismantle the wardrobe to get it out.", "id": "w6"}, {"w": "reassemble", "ipa": "/ˌriːəˈsembəl/", "zh": "重新组装", "ex": "Can you reassemble the cot in the new flat?", "id": "w7"}, {"w": "deposit", "ipa": "/dɪˈpɑːzɪt/", "zh": "定金，押金", "ex": "We paid a small deposit to book the venue.", "id": "w8"}, {"w": "break down", "ipa": "/breɪk daʊn/", "zh": "（把费用）拆分列明", "ex": "Could you break down the bill by person?", "id": "w9"}], "sections": [{"heading": "1. Getting a Quote", "heading_zh": "1. 询价", "rows": [[{"id": "s0_0_0", "md": "Hello, Swift Movers, Neha speaking. How can I help you?", "text": "Hello, Swift Movers, Neha speaking. How can I help you?", "zh": "您好，迅捷搬家，我是妮哈。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, we're moving from a three bedroom condo to another one in Bukit Timah, and I'd like to get a ==quote==.", "text": "Hi, we're moving from a three bedroom condo to another one in Bukit Timah, and I'd like to get a quote.", "zh": "你好，我们要从一个三房公寓搬到武吉知马的另一个公寓，想问个报价。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. When are you planning to move, and do you need help with packing?", "text": "Sure. When are you planning to move, and do you need help with packing?", "zh": "好的。打算什么时候搬？需要帮忙打包吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**Ideally on the fifteenth of next month. And yes, we'd like you to pack everything for us.**", "text": "Ideally on the fifteenth of next month. And yes, we'd like you to pack everything for us.", "zh": "最好是下个月十五号。是的，我们希望你们全部帮我们打包。", "sp": "A"}], [{"id": "s0_4_0", "md": "No problem. Do you have any large or ==fragile== items, like a piano, artwork, or a big TV?", "text": "No problem. Do you have any large or fragile items, like a piano, artwork, or a big TV?", "zh": "没问题。有大件或易碎品吗？比如钢琴、画、或者大电视？", "sp": "B"}], [{"id": "s0_5_0", "md": "A sixty-five inch TV, a glass dining table, and quite a lot of kitchenware.", "text": "A sixty-five inch TV, a glass dining table, and quite a lot of kitchenware.", "zh": "一台六十五寸电视、一张玻璃餐桌，还有挺多厨房用品。", "sp": "A"}], [{"id": "s0_6_0", "md": "We'll wrap those separately and use a special crate for the TV.", "text": "We'll wrap those separately and use a special crate for the TV.", "zh": "这些我们会单独包装，电视用专门的木箱装。", "sp": "B"}], [{"id": "s0_7_0", "md": "What happens if something gets broken? Are you ==insured==?", "text": "What happens if something gets broken? Are you insured?", "zh": "要是有东西摔坏了怎么办？你们有保险吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "Our basic ==coverage== pays up to two hundred dollars per item. For more, you can buy extra insurance.", "text": "Our basic coverage pays up to two hundred dollars per item. For more, you can buy extra insurance.", "zh": "我们的基础保障每件最高赔两百块。想要更高的，可以加买保险。", "sp": "B"}], [{"id": "s0_9_0", "md": "I'd rather __be on the safe side__. Could you include that in the quote?", "text": "I'd rather be on the safe side. Could you include that in the quote?", "zh": "我还是想稳妥一点。能把保险也算进报价里吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Sure. Could we do a video ==survey== this week, so I can give you an accurate price?", "text": "Sure. Could we do a video survey this week, so I can give you an accurate price?", "zh": "可以。这周能做个视频看房吗？这样我能给您准确的价格。", "sp": "B"}], [{"id": "s0_11_0", "md": "Thursday evening works for us.", "text": "Thursday evening works for us.", "zh": "周四晚上我们可以。", "sp": "A"}]]}, {"heading": "2. Questioning the Quote", "heading_zh": "2. 对报价有疑问", "rows": [[{"id": "s1_0_0", "md": "Hi, I've just emailed you the quote. It comes to two thousand three hundred dollars, including insurance.", "text": "Hi, I've just emailed you the quote. It comes to two thousand three hundred dollars, including insurance.", "zh": "您好，报价刚发到您邮箱了。含保险一共两千三百块。", "sp": "B"}], [{"id": "s1_1_0", "md": "Thanks for sending it. It's quite a bit higher than I expected.", "text": "Thanks for sending it. It's quite a bit higher than I expected.", "zh": "谢谢。比我预想的高不少。", "sp": "A"}], [{"id": "s1_2_0", "md": "**Could you break down the cost for me?**", "text": "Could you break down the cost for me?", "zh": "能给我拆分一下费用吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "Of course. The move itself is fourteen hundred, packing is six hundred, and insurance is three hundred.", "text": "Of course. The move itself is fourteen hundred, packing is six hundred, and insurance is three hundred.", "zh": "当然。搬运本身一千四，打包六百，保险三百。", "sp": "B"}], [{"id": "s1_4_0", "md": "I see. Is there a ==surcharge== for weekends? Would a weekday be cheaper?", "text": "I see. Is there a surcharge for weekends? Would a weekday be cheaper?", "zh": "明白了。周末有附加费吗？换工作日会便宜点吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "Yes, a Tuesday or Wednesday would save you about two hundred.", "text": "Yes, a Tuesday or Wednesday would save you about two hundred.", "zh": "有的，改周二或周三能省两百左右。", "sp": "B"}], [{"id": "s1_6_0", "md": "A Wednesday is fine. And what if we pack the books and clothes ourselves?", "text": "A Wednesday is fine. And what if we pack the books and clothes ourselves?", "zh": "周三可以。那如果书和衣服我们自己打包呢？", "sp": "A"}], const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
