const D = {"id": "129", "type": "dialogue", "title": "Booking Movers", "meta": "B2 · 约 320 词 · 场景：搬家询价与砍价", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Moving Coordinator", "name_zh": "搬家公司客服", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "「你」家有哪些需要特别处理的物品？搬家公司怎么处理？", "a": "六十五寸电视、玻璃餐桌和很多厨房用品；单独包装，电视用专门木箱。"}, {"q": "最初报价多少？由哪几部分组成？", "a": "两千三百块：搬运一千四、打包六百、保险三百。"}, {"q": "「你」用了哪两个办法把价格降下来？最后多少？", "a": "改到工作日（周三）省两百，书和衣服自己打包再省两百，降到一千九左右，还免费拆装床。"}], "dictation": [{"id": "s0_3_0", "text": "Ideally on the fifteenth of next month. And yes, we'd like you to pack everything for us."}, {"id": "s0_9_0", "text": "I'd rather be on the safe side. Could you include that in the quote?"}, {"id": "s1_4_0", "text": "I see. Is there a surcharge for weekends? Would a weekday be cheaper?"}, {"id": "s1_6_0", "text": "A Wednesday is fine. And what if we pack the books and clothes ourselves?"}], "shadow": {"speaker": "A", "text": "Thanks for sending it. It's quite a bit higher than I expected. Could you break down the cost for me?", "marked": "Thanks for <b>sending</b> it. //<br>It's <b>quite a bit higher</b> / than I <b>expected</b>. //<br>Could you <b>break down</b> the cost / for me? //"}, "prompts": [{"q": "搬家当天，你发现一个箱子被压坏，里面的花瓶碎了。跟搬家队长说明情况，要求记录并问怎么理赔。", "ref": "Excuse me, could you come and look at this box? It was crushed at the bottom, and the vase inside is broken. It was marked fragile on the top. Could you note it down on the delivery form before you leave? And what do I need to do to make an insurance claim? Should I send you photos?", "ref_zh": "不好意思，能过来看一下这个箱子吗？底部被压坏了，里面的花瓶碎了。箱子顶上标了易碎。你们走之前能在交接单上记一下吗？我要理赔需要做什么？要发照片给你们吗？", "id": "ref0"}, {"q": "你收到两家搬家公司的报价，想让第一家再便宜一点。礼貌地拿另一家报价去谈。", "ref": "Hi Neha, thanks for the quote. To be honest, I really liked your service on the phone, but another company has quoted us about three hundred less for the same job. Is there any flexibility on your price? If you could get a bit closer to theirs, I'd be happy to confirm with you today.", "ref_zh": "妮哈你好，谢谢你的报价。说实话，我很喜欢你们电话里的服务，但另一家公司同样的活报价便宜了三百左右。你们价格上还有商量余地吗？如果能接近一点，我今天就可以跟你们确认。", "id": "ref1"}], "words": [{"w": "quote", "ipa": "/kwoʊt/", "zh": "报价", "ex": "Get at least three quotes before you choose a company.", "id": "w0"}, {"w": "fragile", "ipa": "/ˈfrædʒəl/", "zh": "易碎的", "ex": "Please mark this box as fragile.", "id": "w1"}, {"w": "insured", "ipa": "/ɪnˈʃʊrd/", "zh": "有保险的，已投保的", "ex": "Is the car insured for other drivers?", "id": "w2"}, {"w": "coverage", "ipa": "/ˈkʌvərɪdʒ/", "zh": "保险范围，保障额度", "ex": "Check how much coverage you have before you travel.", "id": "w3"}, {"w": "survey", "ipa": "/ˈsɜːrveɪ/", "zh": "（上门或视频）查看评估", "ex": "The movers did a quick survey of our flat.", "id": "w4"}, {"w": "surcharge", "ipa": "/ˈsɜːrtʃɑːrdʒ/", "zh": "附加费", "ex": "There's a surcharge for taxis after midnight.", "id": "w5"}, {"w": "dismantle", "ipa": "/dɪsˈmæntəl/", "zh": "拆卸", "ex": "We had to dismantle the wardrobe to get it out.", "id": "w6"}, {"w": "reassemble", "ipa": "/ˌriːəˈsembəl/", "zh": "重新组装", "ex": "Can you reassemble the cot in the new flat?", "id": "w7"}, {"w": "deposit", "ipa": "/dɪˈpɑːzɪt/", "zh": "定金，押金", "ex": "We paid a small deposit to book the venue.", "id": "w8"}, {"w": "break down", "ipa": "/breɪk daʊn/", "zh": "（把费用）拆分列明", "ex": "Could you break down the bill by person?", "id": "w9"}], "sections": [{"heading": "1. Getting a Quote", "heading_zh": "1. 询价", "rows": [[{"id": "s0_0_0", "md": "Hello, Swift Movers, Neha speaking. How can I help you?", "text": "Hello, Swift Movers, Neha speaking. How can I help you?", "zh": "您好，迅捷搬家，我是妮哈。有什么可以帮您？", "sp": "B"}], [{"id": "s0_1_0", "md": "Hi, we're moving from a three bedroom condo to another one in Bukit Timah, and I'd like to get a ==quote==.", "text": "Hi, we're moving from a three bedroom condo to another one in Bukit Timah, and I'd like to get a quote.", "zh": "你好，我们要从一个三房公寓搬到武吉知马的另一个公寓，想问个报价。", "sp": "A"}], [{"id": "s0_2_0", "md": "Sure. When are you planning to move, and do you need help with packing?", "text": "Sure. When are you planning to move, and do you need help with packing?", "zh": "好的。打算什么时候搬？需要帮忙打包吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**Ideally on the fifteenth of next month. And yes, we'd like you to pack everything for us.**", "text": "Ideally on the fifteenth of next month. And yes, we'd like you to pack everything for us.", "zh": "最好是下个月十五号。是的，我们希望你们全部帮我们打包。", "sp": "A"}], [{"id": "s0_4_0", "md": "No problem. Do you have any large or ==fragile== items, like a piano, artwork, or a big TV?", "text": "No problem. Do you have any large or fragile items, like a piano, artwork, or a big TV?", "zh": "没问题。有大件或易碎品吗？比如钢琴、画、或者大电视？", "sp": "B"}], [{"id": "s0_5_0", "md": "A sixty-five inch TV, a glass dining table, and quite a lot of kitchenware.", "text": "A sixty-five inch TV, a glass dining table, and quite a lot of kitchenware.", "zh": "一台六十五寸电视、一张玻璃餐桌，还有挺多厨房用品。", "sp": "A"}], [{"id": "s0_6_0", "md": "We'll wrap those separately and use a special crate for the TV.", "text": "We'll wrap those separately and use a special crate for the TV.", "zh": "这些我们会单独包装，电视用专门的木箱装。", "sp": "B"}], [{"id": "s0_7_0", "md": "What happens if something gets broken? Are you ==insured==?", "text": "What happens if something gets broken? Are you insured?", "zh": "要是有东西摔坏了怎么办？你们有保险吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "Our basic ==coverage== pays up to two hundred dollars per item. For more, you can buy extra insurance.", "text": "Our basic coverage pays up to two hundred dollars per item. For more, you can buy extra insurance.", "zh": "我们的基础保障每件最高赔两百块。想要更高的，可以加买保险。", "sp": "B"}], [{"id": "s0_9_0", "md": "I'd rather __be on the safe side__. Could you include that in the quote?", "text": "I'd rather be on the safe side. Could you include that in the quote?", "zh": "我还是想稳妥一点。能把保险也算进报价里吗？", "sp": "A"}], [{"id": "s0_10_0", "md": "Sure. Could we do a video ==survey== this week, so I can give you an accurate price?", "text": "Sure. Could we do a video survey this week, so I can give you an accurate price?", "zh": "可以。这周能做个视频看房吗？这样我能给您准确的价格。", "sp": "B"}], [{"id": "s0_11_0", "md": "Thursday evening works for us.", "text": "Thursday evening works for us.", "zh": "周四晚上我们可以。", "sp": "A"}]]}, {"heading": "2. Questioning the Quote", "heading_zh": "2. 对报价有疑问", "rows": [[{"id": "s1_0_0", "md": "Hi, I've just emailed you the quote. It comes to two thousand three hundred dollars, including insurance.", "text": "Hi, I've just emailed you the quote. It comes to two thousand three hundred dollars, including insurance.", "zh": "您好，报价刚发到您邮箱了。含保险一共两千三百块。", "sp": "B"}], [{"id": "s1_1_0", "md": "Thanks for sending it. It's quite a bit higher than I expected.", "text": "Thanks for sending it. It's quite a bit higher than I expected.", "zh": "谢谢。比我预想的高不少。", "sp": "A"}], [{"id": "s1_2_0", "md": "**Could you break down the cost for me?**", "text": "Could you break down the cost for me?", "zh": "能给我拆分一下费用吗？", "sp": "A"}], [{"id": "s1_3_0", "md": "Of course. The move itself is fourteen hundred, packing is six hundred, and insurance is three hundred.", "text": "Of course. The move itself is fourteen hundred, packing is six hundred, and insurance is three hundred.", "zh": "当然。搬运本身一千四，打包六百，保险三百。", "sp": "B"}], [{"id": "s1_4_0", "md": "I see. Is there a ==surcharge== for weekends? Would a weekday be cheaper?", "text": "I see. Is there a surcharge for weekends? Would a weekday be cheaper?", "zh": "明白了。周末有附加费吗？换工作日会便宜点吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "Yes, a Tuesday or Wednesday would save you about two hundred.", "text": "Yes, a Tuesday or Wednesday would save you about two hundred.", "zh": "有的，改周二或周三能省两百左右。", "sp": "B"}], [{"id": "s1_6_0", "md": "A Wednesday is fine. And what if we pack the books and clothes ourselves?", "text": "A Wednesday is fine. And what if we pack the books and clothes ourselves?", "zh": "周三可以。那如果书和衣服我们自己打包呢？", "sp": "A"}], const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

    h('audio', { controls: '', src: src('track'), preload: 'none' }),
    ...D.gist.map((g, i) => h('div', { class: 'q' }, h('div', {}, `Q${i + 1}. ${g.q}`),
      h('details', {}, h('summary', {}, '看答案'), h('div', {}, g.a)))))));

// 2 dictation
main.append(step('s2', '② 听写', '4 分钟', '每句可以反复听，听到能完整写出来为止。点「核对」后，<span style="color:var(--bad)">红色</span>是漏听或听错的词。',
  h('div', {}, ...D.dictation.map((d, i) => {
    const ta = h('textarea', { placeholder: '把听到的句子打出来…' });
    const out = h('div', { class: 'diff' });
    return h('div', { class: 'q' },
      h('div', { class: 'controls' }, h('b', {}, `第 ${i + 1} 句`), clipCtl(d.id),
        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
</html>
