<script>
const D = {"id": "023", "title": "Receiving Harsh Feedback on Your Design", "meta": "B2 · 约 270 词 · 场景：设计被当众批评", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The First Ten Seconds", "heading_zh": "1. 最初的十秒钟", "rows": [[{"id": "s0_0_0", "md": "A senior engineer looks at your design and says, \"This will never survive production.\"", "text": "A senior engineer looks at your design and says, \"This will never survive production.\"", "zh": "一位资深工程师看了你的设计，说：「这东西到了生产环境根本活不下来。」", "sp": null}, {"id": "s0_0_1", "md": "The room goes quiet, and everyone turns to you.", "text": "The room goes quiet, and everyone turns to you.", "zh": "会议室一下安静了，所有人都看向你。", "sp": null}, {"id": "s0_0_2", "md": "What you say in the next ten seconds matters more than the design itself.", "text": "What you say in the next ten seconds matters more than the design itself.", "zh": "你接下来十秒钟说什么，比设计本身更重要。", "sp": null}], [{"id": "s0_1_0", "md": "The natural ==reflex== is to defend.", "text": "The natural reflex is to defend.", "zh": "人的本能反应是辩护。", "sp": null}, {"id": "s0_1_1", "md": "You start explaining every choice, faster and louder, and the discussion becomes a ==debate== about who is right.", "text": "You start explaining every choice, faster and louder, and the discussion becomes a debate about who is right.", "zh": "你开始解释每一个选择，越说越快、越说越大声，讨论就变成了一场谁对谁错的辩论。", "sp": null}, {"id": "s0_1_2", "md": "Even if you win, people remember that you got ==defensive==.", "text": "Even if you win, people remember that you got defensive.", "zh": "就算你赢了，大家记住的也是你当时急了。", "sp": null}], [{"id": "s0_2_0", "md": "**Your first job is not to answer the criticism; it is to understand it.**", "text": "Your first job is not to answer the criticism; it is to understand it.", "zh": "你的第一要务不是回应批评，而是弄懂批评。", "sp": null}, {"id": "s0_2_1", "md": "A calm \"Can you say more about that?\" __buys you time__ and shows you can __take a hit__.", "text": "A calm \"Can you say more about that?\" buys you time and shows you can take a hit.", "zh": "一句平静的「能具体说说吗？」能帮你争取时间，也能显示你扛得住。", "sp": null}, {"id": "s0_2_2", "md": "Harsh words often hide a useful point behind a bad delivery.", "text": "Harsh words often hide a useful point behind a bad delivery.", "zh": "难听的话背后，往往藏着一个有用的点，只是表达方式很糟。", "sp": null}, {"id": "s0_2_3", "md": "You do not have to agree yet; you only have to listen.", "text": "You do not have to agree yet; you only have to listen.", "zh": "你不必马上同意，只需要先听。", "sp": null}]]}, {"heading": "2. Turning Heat into Detail", "heading_zh": "2. 把火气变成细节", "rows": [[{"id": "s1_0_0", "md": "Ask which failure the person is actually worried about.", "text": "Ask which failure the person is actually worried about.", "zh": "问问对方到底担心的是哪种故障。", "sp": null}, {"id": "s1_0_1", "md": "\"Which part breaks first, the write path or the cache?\" turns a ==verdict== into a technical conversation.", "text": "\"Which part breaks first, the write path or the cache?\" turns a verdict into a technical conversation.", "zh": "「最先出问题的是写链路还是缓存？」这一问，就把一句定性的判词变成了技术讨论。", "sp": null}, {"id": "s1_0_2", "md": "Now you are both looking at the system, not at each other.", "text": "Now you are both looking at the system, not at each other.", "zh": "这样你们俩都在看系统，而不是盯着对方。", "sp": null}], [{"id": "s1_1_0", "md": "Then __separate the content from the tone__.", "text": "Then separate the content from the tone.", "zh": "然后把内容和语气分开。", "sp": null}, {"id": "s1_1_1", "md": "The delivery may be rude, but the point about connection limits may still be right.", "text": "The delivery may be rude, but the point about connection limits may still be right.", "zh": "对方说话也许很冲，但关于连接数上限的那个点可能是对的。", "sp": null}, {"id": "s1_1_2", "md": "If it is, say so plainly: \"Good catch, I missed that.\"", "text": "If it is, say so plainly: \"Good catch, I missed that.\"", "zh": "如果是对的，就直接说：「好问题，这个我漏了。」", "sp": null}, {"id": "s1_1_3", "md": "Admitting one gap quickly makes the rest of your choices more ==credible==.", "text": "Admitting one gap quickly makes the rest of your choices more credible.", "zh": "痛快地承认一个漏洞，反而会让你其他的选择更有说服力。", "sp": null}], [{"id": "s1_2_0", "md": "If you still disagree, ==park== it instead of fighting in the room.", "text": "If you still disagree, park it instead of fighting in the room.", "zh": "如果你还是不同意，就先把它放一放，别在会上硬杠。", "sp": null}, {"id": "s1_2_1", "md": "Say, \"Let me run a load test and come back to you on Thursday.\"", "text": "Say, \"Let me run a load test and come back to you on Thursday.\"", "zh": "可以说：「我跑个压测，周四给你结果。」", "sp": null}, {"id": "s1_2_2", "md": "**Data settles arguments that opinions only make louder.**", "text": "Data settles arguments that opinions only make louder.", "zh": "观点只会让争论越吵越凶，数据才能让它尘埃落定。", "sp": null}], [{"id": "s1_3_0", "md": "Afterwards, thank the critic in private.", "text": "Afterwards, thank the critic in private.", "zh": "事后，私下谢谢那位批评你的人。", "sp": null}, {"id": "s1_3_1", "md": "The person who __tore your design apart__ today is often the one who backs it in the next review.", "text": "The person who tore your design apart today is often the one who backs it in the next review.", "zh": "今天把你的设计批得体无完肤的人，往往就是下次评审时力挺它的那个人。", "sp": null}]]}], "gist": [{"q": "设计被当众严厉批评时，第一反应通常是什么？为什么不好？", "a": "本能地辩护，越说越快越大声，变成争谁对；就算赢了，大家也只记得你很防御。"}, {"q": "作者说第一件事应该做什么？", "a": "先理解批评而不是回答它，比如平静地问一句「能多说一点吗」，既争取时间也显得扛得住。"}, {"q": "如果你仍然不同意对方，文章建议怎么办？", "a": "先搁置，不在会上争；回去跑压测，约定时间带数据回来；会后私下感谢批评者。"}], "dictation": [{"id": "s0_2_0", "text": "Your first job is not to answer the criticism; it is to understand it."}, {"id": "s1_2_2", "text": "Data settles arguments that opinions only make louder."}, {"id": "s0_2_2", "text": "Harsh words often hide a useful point behind a bad delivery."}, {"id": "s1_0_2", "text": "Now you are both looking at the system, not at each other."}], "shadow": {"text": "Your first job is not to answer the criticism; it is to understand it. A calm \"Can you say more about that?\" buys you time and shows you can take a hit. Harsh words often hide a useful point behind a bad delivery.", "marked": "Your <b>first</b> job / is <b>not</b> to answer the criticism; / it is to <b>understand</b> it. //<br>A <b>calm</b> \"Can you say <b>more</b> about that?\" / <b>buys</b> you time / and shows you can <b>take a hit</b>. //<br><b>Harsh</b> words often hide a <b>useful</b> point / behind a <b>bad delivery</b>. //"}, "prompts": [{"q": "评审会上一位资深架构师说：「这个设计根本扛不住大促流量。」用 30 秒接住：先追问具体担心哪里，再提出会后用数据回复。", "ref": "That's a fair concern, and I want to make sure I understand it. Which part are you most worried about, the order write path or the inventory cache? If it's the cache, I agree we haven't tested a cold start under peak load. Let me run a load test at three times last year's peak and share the results with you by Friday. If it fails, we'll change the design.", "ref_zh": "这个担心很合理，我想确认一下我理解对了。你最担心的是哪部分，订单写链路还是库存缓存？如果是缓存，我同意我们还没测过峰值流量下的冷启动。我按去年峰值的三倍跑一次压测，周五前把结果发给你。如果扛不住，我们就改设计。", "id": "ref0"}, {"q": "同事在群里公开说你的方案「过度设计」。你认可其中一点但不认可整体。用 30 秒回应：先承认对的部分，再搁置分歧。", "ref": "Thanks for the direct feedback. You're right that the plugin layer is more than we need right now, and I'm happy to remove it. On the event bus, I still think we need it, because two other teams plan to subscribe next quarter. Rather than argue it here, can we spend fifteen minutes tomorrow looking at their requirements together? If the need isn't real, I'll simplify.", "ref_zh": "谢谢你直接给反馈。你说得对，插件层目前确实超出我们的需要了，我很乐意把它去掉。至于事件总线，我还是觉得需要，因为另外两个团队下个季度打算订阅。与其在这儿争，我们明天花十五分钟一起看看他们的需求怎么样？如果需求不成立，我就简化掉。", "id": "ref1"}], "words": [{"w": "harsh", "ipa": "/hɑːrʃ/", "zh": "严厉的、刺耳的", "ex": "The feedback was harsh, but the point about retries was right.", "id": "w0"}, {"w": "reflex", "ipa": "/ˈriːfleks/", "zh": "本能反应", "ex": "My first reflex was to roll back, but the logs said otherwise.", "id": "w1"}, {"w": "debate", "ipa": "/dɪˈbeɪt/", "zh": "争论、辩论", "ex": "Let's not turn this into a debate about frameworks.", "id": "w2"}, {"w": "defensive", "ipa": "/dɪˈfensɪv/", "zh": "防御性的、戒备的", "ex": "I got defensive when they questioned the schema.", "id": "w3"}, {"w": "verdict", "ipa": "/ˈvɜːrdɪkt/", "zh": "结论、裁决", "ex": "\"It won't scale\" is a verdict, not an analysis.", "id": "w4"}, {"w": "credible", "ipa": "/ˈkredəbl/", "zh": "可信的", "ex": "Benchmarks make the proposal much more credible.", "id": "w5"}, {"w": "park (v.)", "ipa": "/pɑːrk/", "zh": "暂时搁置（议题）", "ex": "Let's park the naming question and come back to it later.", "tts_w": "park", "id": "w6"}, {"w": "criticism", "ipa": "/ˈkrɪtɪsɪzəm/", "zh": "批评", "ex": "Most of the criticism was about the migration plan.", "id": "w7"}, {"w": "delivery", "ipa": "/dɪˈlɪvəri/", "zh": "表达方式", "ex": "Her point was good, but the delivery put people off.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. The First Ten Seconds", "zh": "1. 最初的十秒钟", "start": 0.0, "end": 2.304, "words": [[0.105, 0.355], [0.684, 0.776], [0.789, 1.105], [1.118, 1.303], [1.316, 1.908]]}, {"kind": "s", "id": "s0_0_0", "md": "A senior engineer looks at your design and says, \"This will never survive production.\"", "zh": "一位资深工程师看了你的设计，说：「这东西到了生产环境根本活不下来。」", "sp": null, "gap": false, "start": 2.304, "end": 7.728, "words": [[2.396, 2.449], [2.462, 2.896], [2.909, 3.33], [3.343, 3.58], [3.593, 3.672], [3.686, 3.804], [3.817, 4.343], [4.488, 4.593], [4.607, 5.093], [5.515, 5.738], [5.751, 5.883], [5.896, 6.278], [6.291, 6.764], [6.778, 7.317]]}, {"kind": "s", "id": "s0_0_1", "md": "The room goes quiet, and everyone turns to you.", "zh": "会议室一下安静了，所有人都看向你。", "sp": null, "gap": false, "start": 7.728, "end": 10.896, "words": [[7.846, 7.899], [7.912, 8.149], [8.162, 8.412], [8.425, 8.873], [9.267, 9.373], [9.386, 9.807], [9.82, 10.136], [10.149, 10.267], [10.281, 10.504]]}, {"kind": "s", "id": "s0_0_2", "md": "What you say in the next ten seconds matters more than the design itself.", "zh": "你接下来十秒钟说什么，比设计本身更重要。", "sp": null, "gap": false, "start": 10.896, "end": 15.192, "words": [[11.001, 11.12], [11.133, 11.225], [11.238, 11.514], [11.528, take a hit__.", "zh": "一句平静的「能具体说说吗？」能帮你争取时间，也能显示你扛得住。", "sp": null, "gap": false, "start": 32.736, "end": 37.824, "words": [[32.841, 32.907], [32.92, 33.341], [33.591, 33.736], [33.749, 33.828], [33.841, 34.039], [34.052, 34.262], [34.275, 34.539], [34.552, 34.881], [35.197, 35.46], [35.473, 35.565], [35.578, 35.973], [36.144, 36.21], [36.223, 36.591], [36.604, 36.683], [36.697, 36.802], [36.815, 37.052], [37.065, 37.104], [37.118, 37.433]]}, {"kind": "s", "id": "s0_2_2", "md": "Harsh words often hide a useful point behind a bad delivery.", "zh": "难听的话背后，往往藏着一个有用的点，只是表达方式很糟。", "sp": null, "gap": false, "start": 37.824, "end": 41.928, "words": [[37.942, 38.179], [38.192, 38.574], [38.679, 39.035], [39.048, 39.298], [39.311, 39.35], [39.363, 39.89], [39.903, 40.245], [40.258, 40.653], [40.666, 40.706], [40.719, 40.982], [40.995, 41.534]]}, {"kind": "s", "id": "s0_2_3", "md": "You do not have to agree yet; you only have to listen.", "zh": "你不必马上同意，只需要先听。", "sp": null, "gap": false, "start": 41.928, "end": 45.408, "words": [[42.033, 42.112], [42.125, 42.244], [42.257, 42.454], [42.467, 42.691], [42.704, 42.823], [42.836, 43.204], [43.217, 43.507], [43.967, 44.086], [44.099, 44.283], [44.296, 44.494], [44.507, 44.586], [44.599, 45.007]]}, {"kind": "h", "id": "h1", "md": "2. Turning Heat into Detail", "zh": "2. 把火气变成细节", "start": 45.408, "end": 48.24, "words": [[45.513, 45.803], [46.171, 46.526], [46.54, 46.974], [47.053, 47.263], [47.276, 47.842]]}, {"kind": "s", "id": "s1_0_0", "md": "Ask which failure the person is actually worried about.", "zh": "问问对方到底担心的是哪种故障。", "sp": null, "gap": false, "start": 48.24, "end": 51.552, "words": [[48.345, 48.595], [48.608, 48.766], [48.779, 49.161], [49.174, 49.253], [49.266, 49.727], [49.885, 50.016], [50.029, 50.398], [50.411, 50.766], [50.779, 51.161]]}, {"kind": "s", "id": "s1_0_1", "md": "\"Which part breaks first, the write path or the cache?\" turns a ==verdict== into a technical conversation.", "zh": "「最先出问题的是写链路还是缓存？」这一问，就把一 ": "s1_1_3", "md": "Admitting one gap quickly makes the rest of your choices more ==credible==.", "zh": "痛快地承认一个漏洞，反而会让你其他的选择更有说服力。", "sp": null, "gap": false, "start": 73.488, "end": 78.0, "words": [[73.593, 74.001], [74.014, 74.264], [74.277, 74.725], [74.791, 75.317], [75.501, 75.764], [75.777, 75.87], [75.883, 76.185], [76.199, 76.251], [76.264, 76.396], [76.409, 76.883], [76.896, 77.093], [77.106, 77.62]]}, {"kind": "s", "id": "s1_2_0", "md": "If you still disagree, ==park== it instead of fighting in the room.", "zh": "如果你还是不同意，就先把它放一放，别在会上硬杠。", "sp": null, "gap": true, "start": 78.0, "end": 81.48, "words": [[78.105, 78.21], [78.224, 78.289], [78.303, 78.539], [78.553, 79.105], [79.395, 79.645], [79.658, 79.737], [79.75, 80.105], [80.118, 80.197], [80.211, 80.579], [80.592, 80.671], [80.684, 80.75], [80.763, 81.092]]}, {"kind": "s", "id": "s1_2_1", "md": "Say, \"Let me run a load test and come back to you on Thursday.\"", "zh": "可以说：「我跑个压测，周四给你结果。」", "sp": null, "gap": false, "start": 81.48, "end": 85.896, "words": [[81.585, 81.914], [82.388, 82.48], [82.493, 82.598], [82.612, 82.783], [82.796, 82.835], [82.848, 83.138], [83.151, 83.572], [83.862, 83.954], [83.967, 84.138], [84.151, 84.414], [84.427, 84.533], [84.546, 84.677], [84.691, 84.809], [84.822, 85.388]]}, {"kind": "s", "id": "s1_2_2", "md": "**Data settles arguments that opinions only make louder.**", "zh": "观点只会让争论越吵越凶，数据才能让它尘埃落定。", "sp": null, "gap": false, "start": 85.896, "end": 89.568, "words": [[86.001, 86.251], [86.264, 86.646], [86.659, 87.238], [87.251, 87.396], [87.409, 88.12], [88.133, 88.396], [88.409, 88.685], [88.699, 89.172]]}, {"kind": "s", "id": "s1_3_0", "md": "Afterwards, thank the critic in private.", "zh": "事后，私下谢谢那位批评你的人。", "sp": null, "gap": true, "start": 89.568, "end": 92.328, "words": [[89.673, 90.344], [90.607, 90.844], [90.857, 90.95], [90.963, 91.318], [91.331, 91.423], [91.436, 91.936]]}, {"kind": "s", "id": "s1_3_1", "md": "The person who __tore your design apart__ today is often the one who backs it in the next review.", "zh": "今天把你的设计批得体无完肤的人，往往就是下次评审时力挺它的那个人。", "sp": null, "gap": false, "start": 92.328, "end": 98.16, "words": [[92.446, 92.525], [92.539, 92.92], [92.933, 93.078], [93.091, 93.42], [93.433, 93.565], [93.578, 93.946], [93.96, 94.289], [94.302, 94.749], [95.025, 95.17], [95.183, 95.565], [95.578, 95.696], [95.71, 95.96], [95.973, 96.131], [96.144, 96.565], [96.578, 96.71], [96.854, 96.96], [96.973, 97.039], [97.052, 97.381], [97.394, 97.775]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
