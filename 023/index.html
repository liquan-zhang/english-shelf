<script>
const D = {"id": "023", "title": "Receiving Harsh Feedback on Your Design", "meta": "B2 · 约 270 词 · 场景：设计被当众批评", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The First Ten Seconds", "heading_zh": "1. 最初的十秒钟", "rows": [[{"id": "s0_0_0", "md": "A senior engineer looks at your design and says, \"This will never survive production.\"", "text": "A senior engineer looks at your design and says, \"This will never survive production.\"", "zh": "一位资深工程师看了你的设计，说：「这东西到了生产环境根本活不下来。」", "sp": null}, {"id": "s0_0_1", "md": "The room goes quiet, and everyone turns to you.", "text": "The room goes quiet, and everyone turns to you.", "zh": "会议室一下安静了，所有人都看向你。", "sp": null}, {"id": "s0_0_2", "md": "What you say in the next ten seconds matters more than the design itself.", "text": "What you say in the next ten seconds matters more than the design itself.", "zh": "你接下来十秒钟说什么，比设计本身更重要。", "sp": null}], [{"id": "s0_1_0", "md": "The natural ==reflex== is to defend.", "text": "The natural reflex is to defend.", "zh": "人的本能反应是辩护。", "sp": null}, {"id": "s0_1_1", "md": "You start explaining every choice, faster and louder, and the discussion becomes a ==debate== about who is right.", "text": "You start explaining every choice, faster and louder, and the discussion becomes a debate about who is right.", "zh": "你开始解释每一个选择，越说越快、越说越大声，讨论就变成了一场谁对谁错的辩论。", "sp": null}, {"id": "s0_1_2", "md": "Even if you win, people remember that you got ==defensive==.", "text": "Even if you win, people remember that you got defensive.", "zh": "就算你赢了，大家记住的也是你当时急了。", "sp": null}], [{"id": "s0_2_0", "md": "**Your first job is not to answer the criticism; it is to understand it.**", "text": "Your first job is not to answer the criticism; it is to understand it.", "zh": "你的第一要务不是回应批评，而是弄懂批评。", "sp": null}, {"id": "s0_2_1", "md": "A calm \"Can you say more about that?\" __buys you time__ and shows you can __take a hit__.", "text": "A calm \"Can you say more about that?\" buys you time and shows you can take a hit.", "zh": "一句平静的「能具体说说吗？」能帮你争取时间，也能显示你扛得住。", "sp": null}, {"id": "s0_2_2", "md": "Harsh words often hide a useful point behind a bad delivery.", "text": "Harsh words often hide a useful point behind a bad delivery.", "zh": "难听的话背后，往往藏着一个有用的点，只是表达方式很糟。", "sp": null}, {"id": "s0_2_3", "md": "You do not have to agree yet; you only have to listen.", "text": "You do not have to agree yet; you only have to listen.", "zh": "你不必马上同意，只需要先听。", "sp": null}]]}, {"heading": "2. Turning Heat into Detail", "heading_zh": "2. 把火气变成细节", "rows": [[{"id": "s1_0_0", "md": "Ask which failure the person is actually worried about.", "text": "Ask which failure the person is actually worried about.", "zh": "问问对方到底担心的是哪种故障。", "sp": null}, {"id": "s1_0_1", "md": "\"Which part breaks first, the write path or the cache?\" turns a ==verdict== into a technical conversation.", "text": "\"Which part breaks first, the write path or the cache?\" turns a verdict into a technical conversation.", "zh": "「最先出问题的是写链路还是缓存？」这一问，就把一句定性的判词变成了技术讨论。", "sp": null}, {"id": "s1_0_2", "md": "Now you are both looking at the system, not at each other.", "text": "Now you are both looking at the system, not at each other.", "zh": "这样你们俩都在看系统，而不是盯着对方。", "sp": null}], [{"id": "s1_1_0", "md": "Then __separate the content from the tone__.", "text": "Then separate the content from the tone.", "zh": "然后把内容和语气分开。", "sp": null}, {"id": "s1_1_1", "md": "The delivery may be rude, but the point about connection limits may still be right.", "text": "The delivery may be rude, but the point about connection limits may still be right.", "zh": "对方说话也许很冲，但关于连接数上限的那个点可能是对的。", "sp": null}, {"id": "s1_1_2", "md": "If it is, say so plainly: \"Good catch, I missed that.\"", "text": "If it is, say so plainly: \"Good catch, I missed that.\"", "zh": "如果是对的，就直接说：「好问题，这个我漏了。」", "sp": null}, {"id": "s1_1_3", "md": "Admitting one gap quickly makes the rest of your choices more ==credible==.", "text": "Admitting one gap quickly makes the rest of your choices more credible.", "zh": "痛快地承认一个漏洞，反而会让你其他的选择更有说服力。", "sp": null}], [{"id": "s1_2_0", "md": "If you still disagree, ==park== it instead of fighting in the room.", "text": "If you still disagree, park it instead of fighting in the room.", "zh": "如果你还是不同意，就先把它放一放，别在会上硬杠。", "sp": null}, {"id": "s1_2_1", "md": "Say, \"Let me run a load test and come back to you on Thursday.\"", "text": "Say, \"Let me run a load test and come back to you on Thursday.\"", "zh": "可以说：「我跑个压测，周四给你结果。」", "sp": null}, {"id": "s1_2_2", "md": "**Data settles arguments that opinions only make louder.**", "text": "Data settles arguments that opinions only make louder.", "zh": "观点只会让争论越吵越凶，数据才能让它尘埃落定。", "sp": null}], [{"id": "s1_3_0", "md": "Afterwards, thank the critic in private.", "text": "Afterwards, thank the critic in private.", "zh": "事后，私下谢谢那位批评你的人。", "sp": null}, {"id": "s1_3_1", "md": "The person who __tore your design apart__ today is often the one who backs it in the next review.", "text": "The person who tore your design apart today is often the one who backs it in the next review.", "zh": "今天把你的设计批得体无完肤的人，往往就是下次评审时力挺它的那个人。", "sp": null}]]}], "gist": [{"q": "设计被当众严厉批评时，第一反应通常是什么？为什么不好？", "a": "本能地辩护，越说越快越大声，变成争谁对；就算赢了，大家也只记得你很防御。"}, {"q": "作者说第一件事应该做什么？", "a": "先理解批评而不是回答它，比如平静地问一句「能多说一点吗」，既争取时间也显得扛得住。"}, {"q": "如果你仍然不同意对方，文章建议怎么办？", "a": "先搁置，不在会上争；回去跑压测，约定时间带数据回来；会后私下感谢批评者。"}], "dictation": [{"id": "s0_2_0", "text": "Your first job is not to answer the criticism; it is to understand it."}, {"id": "s1_2_2", "text": "Data settles arguments that opinions only make louder."}, {"id": "s0_2_2", "text": "Harsh words often hide a useful point behind a bad delivery."}, {"id": "s1_0_2", "text": "Now you are both looking at the system, not at each other."}], "shadow": {"text": "Your first job is not to answer the criticism; it is to understand it. A calm \"Can you say more about that?\" buys you time and shows you can take a hit. Harsh words often hide a useful point behind a bad delivery.", "marked": "Your <b>first</b> job / is <b>not</b> to answer the criticism; / it is to <b>understand</b> it. //<br>A <b>calm</b> \"Can you say <b>more</b> about that?\" / <b>buys</b> you time / and shows you can <b>take a hit</b>. //<br><b>Harsh</b> words often hide a <b>useful</b> point / behind a <b>bad delivery</b>. //"}, "prompts": [{"q": "评审会上一位资深架构师说：「这个设计根本扛不住大促流量。」用 30 秒接住：先追问具体担心哪里，再提出会后用数据回复。", "ref": "That's a fair concern, and I want to make sure I understand it. Which part are you most worried about, the order write path or the inventory cache? If it's the cache, I agree we haven't tested a cold start under peak load. Let me run a load test at three times last year's peak and share the results with you by Friday. If it fails, we'll change the design.", "ref_zh": "这个担心很合理，我想确认一下我理解对了。你最担心的是哪部分，订单写链路还是库存缓存？如果是缓存，我同意我们还没测过峰值流量下的冷启动。我按去年峰值的三倍跑一次压测，周五前把结果发给你。如果扛不住，我们就改设计。", "id": "ref0"}, {"q": "同事在群里公开说你的方案「过度设计」。你认可其中一点但不认可整体。用 30 秒回应：先承认对的部分，再搁置分歧。", "ref": "Thanks for the direct feedback. You're right that the plugin layer is more than we need right now, and I'm happy to remove it. On the event bus, I still think we need it, because two other teams plan to subscribe next quarter. Rather than argue it here, can we spend fifteen minutes tomorrow looking at their requirements together? If the need isn't real, I'll simplify.", "ref_zh": "谢谢你直接给反馈。你说得对，插件层目前确实超出我们的需要了，我很乐意把它去掉。至于事件总线，我还是觉得需要，因为另外两个团队下个季度打算订阅。与其在这儿争，我们明天花十五分钟一起看看他们的需求怎么样？如果需求不成立，我就简化掉。", "id": "ref1"}], "words": [{"w": "harsh", "ipa": "/hɑːrʃ/", "zh": "严厉的、刺耳的", "ex": "The feedback was harsh, but the point about retries was right.", "id": "w0"}, {"w": "reflex", "ipa": "/ˈriːfleks/", "zh": "本能反应", "ex": "My first reflex was to roll back, but the logs said otherwise.", "id": "w1"}, {"w": "debate", "ipa": "/dɪˈbeɪt/", "zh": "争论、辩论", "ex": "Let's not turn this into a debate about frameworks.", "id": "w2"}, {"w": "defensive", "ipa": "/dɪˈfensɪv/", "zh": "防御性的、戒备的", "ex": "I const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
