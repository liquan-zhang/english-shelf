<script>
const D = {"id": "011", "title": "Opening a Tech Demo with the Problem, Not the Feature", "meta": "B2 · 约 260 词 · 场景：技术演示", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Nobody Cares About the Button Yet", "heading_zh": "1. 现在还没人关心那个按钮", "rows": [[{"id": "s0_0_0", "md": "Most tech demos open the same way.", "text": "Most tech demos open the same way.", "zh": "大多数技术 demo 的开场都一个样。", "sp": null}, {"id": "s0_0_1", "md": "\"So this is our new deployment dashboard, and here you can see the config panel.\"", "text": "\"So this is our new deployment dashboard, and here you can see the config panel.\"", "zh": "「这是我们新的部署看板，这里可以看到配置面板。」", "sp": null}, {"id": "s0_0_2", "md": "Within a minute, half the audience is checking their messages.", "text": "Within a minute, half the audience is checking their messages.", "zh": "不到一分钟，半数听众就开始看消息了。", "sp": null}], [{"id": "s0_1_0", "md": "The team is proud of what they built, so they start with the thing itself.", "text": "The team is proud of what they built, so they start with the thing itself.", "zh": "团队为自己做出来的东西骄傲，所以一上来就展示东西本身。", "sp": null}, {"id": "s0_1_1", "md": "But the audience has not yet felt the pain that the thing removes.", "text": "But the audience has not yet felt the pain that the thing removes.", "zh": "但听众还没感受过这个东西要解决的痛点。", "sp": null}, {"id": "s0_1_2", "md": "Without that pain, every feature looks like a nice ==extra==, not a ==necessity==.", "text": "Without that pain, every feature looks like a nice extra, not a necessity.", "zh": "没有这份痛，每个功能看起来都只是锦上添花，而不是刚需。", "sp": null}], [{"id": "s0_2_0", "md": "**People do not remember features; they remember the problem that went away.**", "text": "People do not remember features; they remember the problem that went away.", "zh": "人们记不住功能，他们记住的是消失了的那个问题。", "sp": null}, {"id": "s0_2_1", "md": "If you open with the problem, every screen that follows __lands harder__, because people already know why it matters.", "text": "If you open with the problem, every screen that follows lands harder, because people already know why it matters.", "zh": "如果你从问题讲起，后面每一屏都会更有冲击力，因为大家已经知道它为什么重要。", "sp": null}, {"id": "s0_2_2", "md": "You turn a product tour into a short story with a ==tension== and a ==payoff==.", "text": "You turn a product tour into a short story with a tension and a payoff.", "zh": "你就把一次产品导览变成了一个有冲突、有回报的小故事。", "sp": null}]]}, {"heading": "2. Before, Moment, After", "heading_zh": "2. 之前、转折、之后", "rows": [[{"id": "s1_0_0", "md": "Start with a concrete \"before.\"", "text": "Start with a concrete \"before.\"", "zh": "先讲一个具体的「之前」。", "sp": null}, {"id": "s1_0_1", "md": "\"Last month, rolling back a bad release took forty minutes and three people on a call at midnight.\"", "text": "\"Last month, rolling back a bad release took forty minutes and three people on a call at midnight.\"", "zh": "「上个月回滚一个有问题的版本，花了四十分钟，半夜拉了三个人上会。」", "sp": null}, {"id": "s1_0_2", "md": "Use a real ==incident==, a real number, and if possible a real name from the room.", "text": "Use a real incident, a real number, and if possible a real name from the room.", "zh": "用真实的事故、真实的数字，可能的话再加上在场某个人的真名。", "sp": null}], [{"id": "s1_1_0", "md": "Then show the moment of change, live and fast.", "text": "Then show the moment of change, live and fast.", "zh": "然后现场快速展示转折的那一刻。", "sp": null}, {"id": "s1_1_1", "md": "\"Here's the same rollback today,\" __click once__, and let the screen speak for a few seconds.", "text": "\"Here's the same rollback today,\" click once, and let the screen speak for a few seconds.", "zh": "「这是今天做同样的回滚」，点一下，让屏幕自己说话几秒钟。", "sp": null}, {"id": "s1_1_2", "md": "**Silence after a good moment is more powerful than any explanation.**", "text": "Silence after a good moment is more powerful than any explanation.", "zh": "精彩时刻之后的沉默，比任何解释都有力量。", "sp": null}], [{"id": "s1_2_0", "md": "Only now do you explain how it works.", "text": "Only now do you explain how it works.", "zh": "直到这时候，才去讲它是怎么做到的。", "sp": null}, {"id": "s1_2_1", "md": "Keep it to the two or three features that made that moment possible, and __leave the rest__ for questions.", "text": "Keep it to the two or three features that made that moment possible, and leave the rest for questions.", "zh": "只讲让那一刻成为可能的两三个功能，其余的留到提问环节。", "sp": null}, {"id": "s1_2_2", "md": "Your audience is ==curious== at this point, so they will actually listen.", "text": "Your audience is curious at this point, so they will actually listen.", "zh": "这时候听众已经好奇了，所以他们会真的听进去。", "sp": null}], [{"id": "s1_3_0", "md": "Close by ==circling== back to the problem.", "text": "Close by circling back to the problem.", "zh": "结尾再绕回到那个问题上。", "sp": null}, {"id": "s1_3_1", "md": "\"Forty minutes became thirty seconds, and nobody needs to wake up.\"", "text": "\"Forty minutes became thirty seconds, and nobody needs to wake up.\"", "zh": "「四十分钟变成了三十秒，而且没人需要半夜爬起来。」", "sp": null}, {"id": "s1_3_2", "md": "That one line is what people will __repeat to their teams__ afterward.", "text": "That one line is what people will repeat to their teams afterward.", "zh": "这句话就是大家会后会转述给自己团队的那句。", "sp": null}]]}], "gist": [{"q": "为什么从功能讲起的演示容易让人走神？", "a": "观众还没感受到这个东西要解决的痛点，功能看起来只是锦上添花。"}, {"q": "作者提出的演示结构是什么？", "a": "先讲具体的“之前”（真实事故、数字、人）；再现场快速展示改变的瞬间；然后只讲两三个关键功能；最后回到问题收尾。"}, {"q": "演示中出现精彩瞬间之后，作者建议怎么做？", "a": "停下来沉默几秒，让屏幕自己说话，这比任何解释都有力。"}], "dictation": [{"id": "s0_2_0", "text": "People do not remember features; they remember the problem that went away."}, {"id": "s1_1_2", "text": "Silence after a good moment is more powerful than any explanation."}, {"id": "s1_0_2", "text": "Use a real incident, a real number, and if possible a real name from the room."}, {"id": "s1_2_0", "text": "Only now do you explain how it works."}], "shadow": {"text": "Start with a concrete \"before.\" \"Last month, rolling back a bad release took forty minutes and three people on a call at midnight.\"", "marked": "Start with a <b>concrete</b> \"before.\" //<br>\"<b>Last</b> month, / rolling back a bad release / took <b>forty</b> minutes / and <b>three</b> people on a call / at <b>midnight</b>.\" //"}, "prompts": [{"q": "你要向几个业务团队演示新的日志检索工具。用 30 秒开场：先讲一个具体的“之前”痛点，再引出演示。", "ref": "Let me start with a quick story. Two weeks ago, a customer reported failed payments, and it took our on-call engineer almost an hour just to find the right logs. She had to search four different systems by hand. Today I want to show you what that same search looks like now. Watch the clock, because it's going to be a lot shorter.", "ref_zh": "我先讲个小故事。两周前，有客户反馈支付失败，我们的 on-call 工程师光是找到对应的日志就花了将近一个小时。她得在四个不同的系统里手动搜。今天我想给大家看看，现在做同样的搜索是什么样子。大家盯着时间，因为这次会短得多。", "id": "ref0"}, {"q": "演示刚展示完一键回滚。用 30 秒收尾：回到最初的问题，给出一句让人记得住的对比。", "ref": "So let's go back to where we started. Last month, a bad release cost us forty minutes, three engineers, and one very unhappy night. What you just saw took under thirty seconds, and it was one click. Nobody had to wake up. If you only remember one thing from today, remember that rollbacks are no longer scary, so we can afford to ship more often.", "ref_zh": "我们回到开头。上个月，一次有问题的发布让我们搭进去了四十分钟、三个工程师，还有一个非常糟心的夜晚。刚才大家看到的，不到三十秒，点一下就搞定了。没有人需要半夜爬起来。如果今天大家只记住一件事，那就记住回滚不再可怕了，所以我们可以更频繁地发版。", "id": "ref1"}], "words": [{"w": "extra (n.)", "ipa": "/ˈekstrə/", "zh": "附加的东西、额外项", "ex": "Dark mode is a nice extra, but it's not blocking the launch.", "tts_w": "extra", "id": "w0"}, {"w": "necessity", "ipa": "/nəˈsesəti/", "zh": "必需品、必要", "ex": "For a payments team, audit logs are a necessity.", "id": "w1"}, {"w": "tension", "ipa": "/ˈtenʃən/", "zh": "张力、紧张感", "ex": "There's real tension between shipping fast and keeping the API stable.", "id": "w2"}, {"w": "payoff", "ipa": "/ˈpeɪˌɔːf/", "zh": "回报、高潮", "ex": "The payoff of the refactor is that new features take days, not weeks.", "id": "w3"}, {"w": "incident", "ipa": "/ˈɪnsɪdənt/", "zh": "事故、事件", "ex": "We wrote a postmortem for every major incident this quarter.", "id": "w4"}, {"w": "curious", "ipa": "/ˈkjʊriəs/", "zh": "好奇的", "ex": "I'm curious how the n const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));

function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
