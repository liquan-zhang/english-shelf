const D = {"id": "133", "type": "dialogue", "title": "Getting Your Phone Repaired", "meta": "B2 · 约 300 词 · 场景：手机维修报价与追加问题", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Technician", "name_zh": "维修师傅", "voice": "en-GB-SoniaNeural"}}, "gist": [{"q": "换屏有哪两种选择？「你」选了哪种？", "a": "原装屏两百六十块，副厂屏一百四十块；「你」选了更亮、能保住防水的原装屏。"}, {"q": "维修店打电话来说了什么新问题？", "a": "充电口附近有腐蚀，像是进过水，清理要再加八十块，不处理以后可能充不了电。"}, {"q": "「你」是怎么回应的？", "a": "先只换屏幕，其他之后再定；请对方拍照发过来，自己半小时内答复。"}], "dictation": [{"id": "s0_3_0", "text": "No, it's about two years old. Could you give me a rough quote before you start?"}, {"id": "s0_5_0", "text": "What's the difference, apart from the price?"}, {"id": "s1_5_0", "text": "Can you go ahead with the screen only for now? I'll decide on the rest later."}, {"id": "s1_7_0", "text": "Understood. Could you send me a photo of the damage? I'd like to take a look first."}], "shadow": {"speaker": "A", "text": "I dropped my phone this morning, and the screen cracked. The touch still works, but only in some places.", "marked": "I <b>dropped</b> my phone / this <b>morning</b>, / and the <b>screen</b> cracked. //<br>The touch <b>still</b> works, / but only in <b>some</b> places. //"}, "prompts": [{"q": "手机修好取回来两天，充电又不正常了。回到店里，要求按保修免费处理。", "ref": "Hi, I picked up my phone here on Monday after a screen repair. Since yesterday, it only charges if I hold the cable at a certain angle. It was fine before I brought it in. I believe the repair is under your ninety-day warranty, so could you check it again at no charge? Here's my receipt.", "ref_zh": "你好，我周一在这里修完屏幕把手机取走了。从昨天开始，充电线要卡在某个角度才能充上。送修之前是好的。我想这应该在你们九十天的保修范围内，能不能免费再帮我检查一下？这是我的收据。", "id": "ref0"}, {"q": "你把笔记本电脑送去修，想在开修前问清：费用上限、数据安全、需要多久。", "ref": "Hi, my laptop won't turn on since this morning. Before you open it, could you give me an estimate? If the repair is going to cost more than two hundred dollars, please call me first instead of going ahead. Also, there's work data on it, so please don't wipe the hard drive. Roughly how many days will it take?", "ref_zh": "你好，我的笔记本从今早开始就开不了机。开机检查之前，能先给我估个价吗？如果维修费会超过两百块，请先打电话问我，别直接修。另外里面有工作资料，请不要格式化硬盘。大概要几天？", "id": "ref1"}], "words": [{"w": "display", "ipa": "/dɪˈspleɪ/", "zh": "显示屏", "ex": "The display is too dim to read in the sun.", "id": "w0"}, {"w": "warranty", "ipa": "/ˈwɔːrənti/", "zh": "保修", "ex": "The fridge is still under warranty for another year.", "id": "w1"}, {"w": "original", "ipa": "/əˈrɪdʒənəl/", "zh": "原装的；原厂的", "ex": "Please keep the original box in case you need to return it.", "id": "w2"}, {"w": "quote", "ipa": "/kwoʊt/", "zh": "报价", "ex": "Can you give me a quote for painting the living room?", "id": "w3"}, {"w": "back up", "ipa": "/bæk ʌp/", "zh": "备份", "ex": "Back up your photos before you update the phone.", "id": "w4"}, {"w": "corrosion", "ipa": "/kəˈroʊʒən/", "zh": "腐蚀；锈蚀", "ex": "The sea air caused some corrosion on the bike.", "id": "w5"}, {"w": "charging port", "ipa": "/ˈtʃɑːrdʒɪŋ pɔːrt/", "zh": "充电口", "ex": "Clean the charging port with a dry toothbrush.", "id": "w6"}, {"w": "cover (v.)", "ipa": "/ˈkʌvər/", "zh": "（保险/保修）覆盖、负担", "ex": "Does my insurance cover dental treatment?", "tts_w": "cover", "id": "w7"}, {"w": "get back to", "ipa": "/ɡet bæk tuː/", "zh": "回复；再联系", "ex": "Let me check with my wife and get back to you tonight.", "id": "w8"}], "sections": [{"heading": "1. At the Repair Counter", "heading_zh": "1. 在维修柜台", "rows": [[{"id": "s0_0_0", "md": "Hi, what seems to be the problem?", "text": "Hi, what seems to be the problem?", "zh": "你好，手机怎么了？", "sp": "B"}], [{"id": "s0_1_0", "md": "I dropped my phone this morning, and __the screen cracked__. The touch still works, but only in some places.", "text": "I dropped my phone this morning, and the screen cracked. The touch still works, but only in some places.", "zh": "我今早把手机摔了，屏幕裂了。触摸还能用，但只有部分地方灵。", "sp": "A"}], [{"id": "s0_2_0", "md": "Let me have a look. Yes, the ==display== will need replacing. Is it still under ==warranty==?", "text": "Let me have a look. Yes, the display will need replacing. Is it still under warranty?", "zh": "我看看。嗯，屏幕得换。还在保修期内吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**No, it's about two years old. Could you give me a rough quote before you start?**", "text": "No, it's about two years old. Could you give me a rough quote before you start?", "zh": "不在了，用了快两年了。开工之前能先给我报个大概的价吗？", "sp": "A"}], [{"id": "s0_4_0", "md": "An ==original== screen is two hundred and sixty dollars. A third-party one is one hundred and forty.", "text": "An original screen is two hundred and sixty dollars. A third-party one is one hundred and forty.", "zh": "原装屏两百六十块，副厂屏一百四十块。", "sp": "B"}], [{"id": "s0_5_0", "md": "What's the difference, apart from the price?", "text": "What's the difference, apart from the price?", "zh": "除了价格，还有什么区别？", "sp": "A"}], [{"id": "s0_6_0", "md": "The original is brighter and keeps the water resistance. The cheaper one is fine, but the colours are a bit off.", "text": "The original is brighter and keeps the water resistance. The cheaper one is fine, but the colours are a bit off.", "zh": "原装的更亮，防水性能也能保住。便宜的也能用，就是颜色有点偏。", "sp": "B"}], [{"id": "s0_7_0", "md": "I'll go with the original, then. Do your repairs come with any warranty?", "text": "I'll go with the original, then. Do your repairs come with any warranty?", "zh": "那我选原装的。你们的维修有保修吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "Yes, ninety days on parts and labour. Have you __backed up__ your data?", "text": "Yes, ninety days on parts and labour. Have you backed up your data?", "zh": "有，零件和人工保修九十天。您的数据备份了吗？", "sp": "B"}], [{"id": "s0_9_0", "md": "Yes, last night. How long will it take? I need it for work tomorrow.", "text": "Yes, last night. How long will it take? I need it for work tomorrow.", "zh": "备份了，昨晚弄的。要修多久？我明天上班要用。", "sp": "A"}], [{"id": "s0_10_0", "md": "It should be done by five today. We'll text you when you can __pick it up__.", "text": "It should be done by five today. We'll text you when you can pick it up.", "zh": "今天五点前应该能好。可以取的时候我们发短信给您。", "sp": "B"}], [{"id": "s0_11_0", "md": "Perfect. I'll come by after five.", "text": "Perfect. I'll come by after five.", "zh": "太好了。那我五点以后过来。", "sp": "A"}]]}, {"heading": "2. An Unexpected Phone Call", "heading_zh": "2. 一通意外的电话", "rows": [[{"id": "s1_0_0", "md": "Hello, this is the repair shop calling about your phone. We opened it up and found another issue.", "text": "Hello, this is the repair shop calling about your phone. We opened it up and found another issue.", "zh": "您好，这里是维修店，打来说一下您手机的事。我们拆开后发现了另一个问题。", "sp": "B"}], [{"id": "s1_1_0", "md": "Oh no. What's wrong with it?", "text": "Oh no. What's wrong with it?", "zh": "啊，糟糕。出什么问题了？", "sp": "A"}], [{"id": "s1_2_0", "md": "There's some ==corrosion== near the ==charging port==. It looks like water got in at some point.", "text": "There's some corrosion near the charging port. It looks like water got in at some point.", "zh": "充电口附近有些腐蚀，看起来之前进过水。", "sp": "B"}], [{"id": "s1_3_0", "md": "That's strange. It's never been in water. Does that change the price?", "text": "That's strange. It's never been in water. Does that change the price?", "zh": "奇怪，它从来没泡过水。那价格会变吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Cleaning it would be another eighty dollars. If we leave it, the charging might stop working later.", "text": "Cleaning it would be another eighty dollars. If we leave it, the charging might stop working later.", "zh": "清理要再加八十块。如果不处理，以后充电可能会出问题。", "sp": "B"}], [{"id": "s1_5_0", "md": "**Can you go ahead with the screen only for now? I'll decide on the rest later.**", "text": "Can you go ahead with the screen only for now? I'll decide on the rest later.", "zh": "能不能先只换屏幕？其他的我之后再决定。", "sp": "A"}], [{"id": "s1_6_0", "md": "We can, but our warranty wouldn't ==cover== any charging problems in that case.", "text": "We can, but our warranty wouldn't cover any charging problems in that case.", "zh": "可以，但那样的话，充电方面的问题就不在我们的保修范围内了。", "sp" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  h('div', {}, ...D.dictation.map((d, i) => {

      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
