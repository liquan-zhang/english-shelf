<script>
const D = {"id": "133", "type": "dialogue", "title": "Getting Your Phone Repaired", "meta": "B2 · 约 300 词 · 场景：手机维修报价与追加问题", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Technician", "name_zh": "维修师傅", "voice": "en-GB-SoniaNeural"}}, "gist": [{"q": "换屏有哪两种选择？「你」选了哪种？", "a": "原装屏两百六十块，副厂屏一百四十块；「你」选了更亮、能保住防水的原装屏。"}, {"q": "维修店打电话来说了什么新问题？", "a": "充电口附近有腐蚀，像是进过水，清理要再加八十块，不处理以后可能充不了电。"}, {"q": "「你」是怎么回应的？", "a": "先只换屏幕，其他之后再定；请对方拍照发过来，自己半小时内答复。"}], "dictation": [{"id": "s0_3_0", "text": "No, it's about two years old. Could you give me a rough quote before you start?"}, {"id": "s0_5_0", "text": "What's the difference, apart from the price?"}, {"id": "s1_5_0", "text": "Can you go ahead with the screen only for now? I'll decide on the rest later."}, {"id": "s1_7_0", "text": "Understood. Could you send me a photo of the damage? I'd like to take a look first."}], "shadow": {"speaker": "A", "text": "I dropped my phone this morning, and the screen cracked. The touch still works, but only in some places.", "marked": "I <b>dropped</b> my phone / this <b>morning</b>, / and the <b>screen</b> cracked. //<br>The touch <b>still</b> works, / but only in <b>some</b> places. //"}, "prompts": [{"q": "手机修好取回来两天，充电又不正常了。回到店里，要求按保修免费处理。", "ref": "Hi, I picked up my phone here on Monday after a screen repair. Since yesterday, it only charges if I hold the cable at a certain angle. It was fine before I brought it in. I believe the repair is under your ninety-day warranty, so could you check it again at no charge? Here's my receipt.", "ref_zh": "你好，我周一在这里修完屏幕把手机取走了。从昨天开始，充电线要卡在某个角度才能充上。送修之前是好的。我想这应该在你们九十天的保修范围内，能不能免费再帮我检查一下？这是我的收据。", "id": "ref0"}, {"q": "你把笔记本电脑送去修，想在开修前问清：费用上限、数据安全、需要多久。", "ref": "Hi, my laptop won't turn on since this morning. Before you open it, could you give me an estimate? If the repair is going to cost more than two hundred dollars, please call me first instead of going ahead. Also, there's work data on it, so please don't wipe the hard drive. Roughly how many days will it take?", "ref_zh": "你好，我的笔记本从今早开始就开不了机。开机检查之前，能先给我估个价吗？如果维修费会超过两百块，请先打电话问我，别直接修。另外里面有工作资料，请不要格式化硬盘。大概要几天？", "id": "ref1"}], "words": [{"w": "display", "ipa": "/dɪˈspleɪ/", "zh": "显示屏", "ex": "The display is too dim to read in the sun.", "id": "w0"}, {"w": "warranty", "ipa": "/ˈwɔːrənti/", "zh": "保修", "ex": "The fridge is still under warranty for another year.", "id": "w1"}, {"w": "original", "ipa": "/əˈrɪdʒənəl/", "zh": "原装的；原厂的", "ex": "Please keep the original box in case you need to return it.", "id": "w2"}, {"w": "quote", "ipa": "/kwoʊt/", "zh": "报价", "ex": "Can you give me a quote for painting the living room?", "id": "w3"}, {"w": "back up", "ipa": "/bæk ʌp/", "zh": "备份", "ex": "Back up your photos before you update the phone.", "id": "w4"}, {"w": "corrosion", "ipa": "/kəˈroʊʒən/", "zh": "腐蚀；锈蚀", "ex": "The sea air caused some corrosion on the bike.", "id": "w5"}, {"w": "charging port", "ipa": "/ˈtʃɑːrdʒɪŋ pɔːrt/", "zh": "充电口", "ex": "Clean the charging port with a dry toothbrush.", "id": "w6"}, {"w": "cover (v.)", "ipa": "/ˈkʌvər/", "zh": "（保险/保修）覆盖、负担", "ex": "Does my insurance cover dental treatment?", "tts_w": "cover", "id": "w7"}, {"w": "get back to", "ipa": "/ɡet bæk tuː/", "zh": "回复；再联系", "ex": "Let me check with my wife and get back to you tonight.", "id": "w8"}], "sections": [{"heading": "1. At the Repair Counter", "heading_zh": "1. 在维修柜台", "rows": [[{"id": "s0_0_0", "md": "Hi, what seems to be the problem?", "text": "Hi, what seems to be the problem?", "zh": "你好，手机怎么了？", "sp": "B"}], [{"id": "s0_1_0", "md": "I dropped my phone this morning, and __the screen cracked__. The touch still works, but only in some places.", "text": "I dropped my phone this morning, and the screen cracked. The touch still works, but only in some places.", "zh": "我今早把手机摔了，屏幕裂了。触摸还能用，但只有部分地方灵。", "sp": "A"}], [{"id": "s0_2_0", "md": "Let me have a look. Yes, the ==display== will need replacing. Is it still under ==warranty==?", "text": "Let me have a look. Yes, the display will need replacing. Is it still under warranty?", "zh": "我看看。嗯，屏幕得换。还在保修期内吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "**No, it's about two years old. Could you give me a rough quote before you start?**", "text": "No, it's about two years old. Could you give me a rough quote before you start?", "zh": "不在了，用了快两年了。开工之前能先给我报个大概的价吗？", "sp": "A"}], [{"id": "s0_4_0", "md": "An ==original== screen is two hundred and sixty dollars. A third-party one is one hundred and forty.", "text": "An original screen is two hundred and sixty dollars. A third-party one is one hundred and forty.", "zh": "原装屏两百六十块，副厂屏一百四十块。", "sp": "B"}], [{"id": "s0_5_0", "md": "What's the difference, apart from the price?", "text": "What's the difference, apart from the price?", "zh": "除了价格，还有什么区别？", "sp": "A"}], [{"id": "s0_6_0", "md": "The original is brighter and keeps the water resistance. The cheaper one is fine, but the colours are a bit off.", "text": "The original is brighter and keeps the water resistance. The cheaper one is fine, but the colours are a bit off.", "zh": "原装的更亮，防水性能也能保住。便宜的也能用，就是颜色有点偏。", "sp": "B"}], [{"id": "s0_7_0", "md": "I'll go with the original, then. Do your repairs come with any warranty?", "text": "I'll go with the original, then. Do your repairs come with any warranty?", "zh": "那我选原装的。你们的维修有保修吗？", "sp": "A"}], [{"id": "s0_8_0", "md": "Yes, ninety days on parts and labour. Have you __backed up__ your data?", "text": "Yes, ninety days on parts and labour. Have you backed up your data?", "zh": "有，零件和人工保修九十天。您的数据备份了吗？", "sp": "B"}], [{"id": "s0_9_0", "md": "Yes, last night. How long will it take? I need it for work tomorrow.", "text": "Yes, last night. How long will it take? I need it for work tomorrow.", "zh": "备份了，昨晚弄的。要修多久？我明天上班要用。", "sp": "A"}], [{"id": "s0_10_0", "md": "It should be done by five today. We'll text you when you can __pick it up__.", "text": "It should be done by five today. We'll text you when you can pick it up.", "zh": "今天五点前应该能好。可以取的时候我们发短信给您。", "sp": "B"}], [{"id": "s0_11_0", "md": "Perfect. I'll come by after five.", "text": "Perfect. I'll come by after five.", "zh": "太好了。那我五点以后过来。", "sp": "A"}]]}, {"heading": "2. An Unexpected Phone Call", "heading_zh": "2. 一通意外的电话", "rows": [[{"id": "s1_0_0", "md": "Hello, this is the repair shop calling about your phone. We opened it up and found another issue.", "text": "Hello, this is the repair shop calling about your phone. We opened it up and found another issue.", "zh": "您好，这里是维修店，打来说一下您手机的事。我们拆开后发现了另一个问题。", "sp": "B"}], [{"id": "s1_1_0", "md": "Oh no. What's wrong with it?", "text": "Oh no. What's wrong with it?", "zh": "啊，糟糕。出什么问题了？", "sp": "A"}], [{"id": "s1_2_0", "md": "There's some ==corrosion== near the ==charging port==. It looks like water got in at some point.", "text": "There's some corrosion near the charging port. It looks like water got in at some point.", "zh": "充电口附近有些腐蚀，看起来之前进过水。", "sp": "B"}], [{"id": "s1_3_0", "md": "That's strange. It's never been in water. Does that change the price?", "text": "That's strange. It's never been in water. Does that change the price?", "zh": "奇怪，它从来没泡过水。那价格会变吗？", "sp": "A"}], [{"id": "s1_4_0", "md": "Cleaning it would be another eighty dollars. If we leave it, the charging might stop working later.", "text": "Cleaning it would be another eighty dollars. If we leave it, the charging might stop working later.", "zh": "清理要再加八十块。如果不处理，以后充电可能会出问题。", "sp": "B"}], [{"id": "s1_5_0", "md": "**Can you go ahead with the screen only for now? I'll decide on the rest later.**", "text": "Can you go ahead with the screen only for now? I'll decide on the rest later.", "zh": "能不能先只换屏幕？其他的我之后再决定。", "sp": "A"}], [{"id": "s1_6_0", "md": "We can, but our warranty wouldn't ==cover== any charging problems in that case.", "text": "We can, but our warranty wouldn't cover any charging problems in that case.", "zh": "可以，但那样的话，充电方面的问题就不在我们的保修范围内了。", "sp" , "gap": false, "start": 78.816, "end": 83.232, "words": [[78.934, 79.079], [79.092, 79.671], [80.105, 80.224], [80.237, 80.487], [80.5, 80.658], [80.671, 80.776], [80.79, 81.25], [81.684, 81.79], [81.803, 81.934], [81.948, 82.211], [82.224, 82.303], [82.316, 82.842]]}, {"kind": "s", "id": "s1_4_0", "md": "Cleaning it would be another eighty dollars. If we leave it, the charging might stop working later.", "zh": "清理要再加八十块。如果不处理，以后充电可能会出问题。", "sp": "B", "gap": false, "start": 83.232, "end": 89.88, "words": [[83.348, 83.861], [83.874, 84.006], [84.019, 84.19], [84.203, 84.361], [84.374, 84.808], [84.821, 85.137], [85.15, 85.756], [86.179, 86.337], [86.35, 86.443], [86.456, 86.758], [86.771, 87.035], [87.311, 87.429], [87.443, 87.956], [87.969, 88.192], [88.206, 88.548], [88.561, 88.943], [88.956, 89.495]]}, {"kind": "s", "id": "s1_5_0", "md": "**Can you go ahead with the screen only for now? I'll decide on the rest later.**", "zh": "能不能先只换屏幕？其他的我之后再决定。", "sp": "A", "gap": false, "start": 89.88, "end": 94.296, "words": [[89.985, 90.09], [90.104, 90.196], [90.209, 90.38], [90.393, 90.643], [90.656, 90.762], [90.775, 90.841], [90.854, 91.288], [91.419, 91.643], [91.656, 91.814], [91.827, 92.104], [92.538, 92.643], [92.656, 93.091], [93.104, 93.169], [93.183, 93.248], [93.262, 93.538], [93.551, 93.906]]}, {"kind": "s", "id": "s1_6_0", "md": "We can, but our warranty wouldn't ==cover== any charging problems in that case.", "zh": "可以，但那样的话，充电方面的问题就不在我们的保修范围内了。", "sp": "B", "gap": false, "start": 94.296, "end": 99.672, "words": [[94.438, 94.596], [94.609, 95.057], [95.372, 95.57], [95.583, 95.714], [95.728, 96.333], [96.346, 96.714], [96.728, 97.083], [97.096, 97.359], [97.372, 97.833], [97.846, 98.346], [98.359, 98.464], [98.478, 98.714], [98.728, 99.28]]}, {"kind": "s", "id": "s1_7_0", "md": "Understood. Could you __send me a photo__ of the damage? I'd like to __take a look__ first.", "zh": "明白。能把损坏的地方拍张照片发给我吗？我想先看一下。", "sp": "A", "gap": false, "start": 99.672, "end": 104. const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
