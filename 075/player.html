<script>
const D = {"id": "075", "title": "Prioritizing When Everything Is Urgent", "meta": "B2 · 约 270 词 · 场景：需求排序", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Urgent Is a Label, Not a Fact", "heading_zh": "1. 紧急是标签，不是事实", "rows": [[{"id": "s0_0_0", "md": "On some Mondays, five people message you before ten o'clock, and every message says urgent.", "text": "On some Mondays, five people message you before ten o'clock, and every message says urgent.", "zh": "有些周一，十点前就有五个人来找你，每条消息都写着紧急。", "sp": null}, {"id": "s0_0_1", "md": "Sales needs a fix for a big client, the PM wants a demo by Wednesday, and security has found an old library with a known problem.", "text": "Sales needs a fix for a big client, the PM wants a demo by Wednesday, and security has found an old library with a known problem.", "zh": "销售要给一个大客户修 bug，PM 想周三前看 demo，安全团队发现了一个有已知漏洞的老库。", "sp": null}, {"id": "s0_0_2", "md": "If everything is urgent, the word has stopped meaning anything.", "text": "If everything is urgent, the word has stopped meaning anything.", "zh": "如果什么都紧急，这个词就已经没有意义了。", "sp": null}], [{"id": "s0_1_0", "md": "People label requests urgent because that is how they get attention.", "text": "People label requests urgent because that is how they get attention.", "zh": "大家把需求标成紧急，是因为这样才能被注意到。", "sp": null}, {"id": "s0_1_1", "md": "It is not ==dishonest==; it is a ==rational== response to a busy team.", "text": "It is not dishonest; it is a rational response to a busy team.", "zh": "这不是不诚实；面对一个忙碌的团队，这是理性的反应。", "sp": null}, {"id": "s0_1_2", "md": "**Your job is not to judge who shouts loudest but to find out what each delay really costs.**", "text": "Your job is not to judge who shouts loudest but to find out what each delay really costs.", "zh": "你的任务不是看谁嗓门最大，而是搞清楚每件事拖一拖真正的代价是什么。", "sp": null}], [{"id": "s0_2_0", "md": "Without that, priority goes to whoever is most ==persistent==, and the team spends its whole week reacting.", "text": "Without that, priority goes to whoever is most persistent, and the team spends its whole week reacting.", "zh": "不这么做的话，优先级就归最能磨的那个人，团队一整周都在被动应付。", "sp": null}, {"id": "s0_2_1", "md": "Engineers switch tasks five times a day and finish almost nothing.", "text": "Engineers switch tasks five times a day and finish almost nothing.", "zh": "工程师一天切换五次任务，几乎什么都做不完。", "sp": null}, {"id": "s0_2_2", "md": "By Friday, the most important request is often the one nobody got around to.", "text": "By Friday, the most important request is often the one nobody got around to.", "zh": "到了周五，最重要的那个需求往往是谁都没顾上的那个。", "sp": null}]]}, {"heading": "2. One Question and a Shared List", "heading_zh": "2. 一个问题加一张共享清单", "rows": [[{"id": "s1_0_0", "md": "The most useful question is simple: what happens if this waits one week?", "text": "The most useful question is simple: what happens if this waits one week?", "zh": "最有用的问题很简单：这件事等一周会怎样？", "sp": null}, {"id": "s1_0_1", "md": "For the security library, the answer might be a real ==exposure== for customer data.", "text": "For the security library, the answer might be a real exposure for customer data.", "zh": "对那个安全库来说，答案可能是客户数据存在真实的暴露风险。", "sp": null}, {"id": "s1_0_2", "md": "For the demo, the answer might be that the meeting moves to Thursday.", "text": "For the demo, the answer might be that the meeting moves to Thursday.", "zh": "对那个 demo 来说，答案可能是会议挪到周四。", "sp": null}], [{"id": "s1_1_0", "md": "Then put the requests in one ranked list and share it with everyone who asked.", "text": "Then put the requests in one ranked list and share it with everyone who asked.", "zh": "然后把所有需求放进一张排好序的清单，分享给每个提需求的人。", "sp": null}, {"id": "s1_1_1", "md": "Ranking in public is uncomfortable, but it moves the argument to the right place.", "text": "Ranking in public is uncomfortable, but it moves the argument to the right place.", "zh": "公开排序是有点尴尬，但它把争论挪到了该在的地方。", "sp": null}, {"id": "s1_1_2", "md": "If sales disagrees with the order, they can __take it up with__ the PM, instead of pressuring individual engineers in private messages.", "text": "If sales disagrees with the order, they can take it up with the PM, instead of pressuring individual engineers in private messages.", "zh": "如果销售不同意这个顺序，他们可以去找 PM 谈，而不是私聊给某个工程师施压。", "sp": null}], [{"id": "s1_2_0", "md": "**A visible ranking turns competing demands into a conversation about priorities.**", "text": "A visible ranking turns competing demands into a conversation about priorities.", "zh": "一张透明的排序，能把相互竞争的需求变成一场关于优先级的讨论。", "sp": null}, {"id": "s1_2_1", "md": "Keep a little ==slack== for true emergencies, and __revisit the list__ every week.", "text": "Keep a little slack for true emergencies, and revisit the list every week.", "zh": "给真正的紧急情况留一点余量，并且每周回顾一下这张清单。", "sp": null}, {"id": "s1_2_2", "md": "The list will never be perfect, but it will be ==transparent==, and that alone removes a lot of ==friction==.", "text": "The list will never be perfect, but it will be transparent, and that alone removes a lot of friction.", "zh": "这张清单永远不会完美，但它是透明的，光这一点就能减少很多摩擦。", "sp": null}]]}], "gist": [{"q": "为什么人人都把需求标成“紧急”？作者怎么看？", "a": "这是在忙碌团队里获得关注的理性做法，不算不诚实；但“紧急”只是标签，不是事实。"}, {"q": "判断优先级最有用的问题是什么？", "a": "如果这件事等一周会怎样？比如安全漏洞可能真的暴露客户数据，而演示只是改到周四。"}, {"q": "为什么要公开一份排序清单？", "a": "把争论引到正确的地方（找 PM 而不是私下施压工程师），把竞争性需求变成关于优先级的讨论；同时留余量应对真急事，每周复看。"}], "dictation": [{"id": "s0_0_2", "text": "If everything is urgent, the word has stopped meaning anything."}, {"id": "s0_1_2", "text": "Your job is not to judge who shouts loudest but to find out what each delay really costs."}, {"id": "s1_0_0", "text": "The most useful question is simple: what happens if this waits one week?"}, {"id": "s1_2_0", "text": "A visible ranking turns competing demands into a conversation about priorities."}], "shadow": {"text": "Then put the requests in one ranked list and share it with everyone who asked. Ranking in public is uncomfortable, but it moves the argument to the right place.", "marked": "Then put the requests / in <b>one</b> ranked list / and <b>share</b> it with everyone who asked. //<br>Ranking in <b>public</b> / is <b>uncomfortable</b>, / but it moves the argument / to the <b>right</b> place. //"}, "prompts": [{"q": "销售总监私信你的工程师，要求今天就修他客户的问题，打乱了排期。用 30 秒跟他沟通，用“等一周会怎样”来定优先级。", "ref": "Hi, I saw your message to Leo about the client issue, and I want to help. To place it correctly, can I ask one thing: what happens if this waits until next week? If the client might cancel, that changes everything, and we'll move it up today. If it's more of an annoyance, it goes on our shared list, and you can see exactly where it sits.", "ref_zh": "你好，我看到你给 Leo 发的关于客户问题的消息，我想帮忙。为了排准优先级，我能问一句吗：这件事等到下周会怎样？如果客户可能会解约，那就完全不一样了，我们今天就把它提上来。如果更多是个烦心事，它就会进我们的共享清单，你能清楚看到它排在哪里。", "id": "ref0"}, {"q": "周会上三个需求方都说自己最急。用 30 秒提出公开排序的做法。", "ref": "I hear that all three of these feel urgent, and I'm sure they are, from where each of you sits. We can't do all three this week, so here's what I propose. I'll put them in one ranked list, based on what each delay actually costs, and share it in our channel by this afternoon. If anyone disagrees with the order, let's discuss it together with the PM.", "ref_zh": "我知道这三件事都让人觉得很急，站在各自的角度，我相信确实都急。这周我们没法三件都做，所以我的提议是：我按每件事延期的实际代价排一张清单，今天下午之前发到群里。如果有人不同意这个顺序，我们拉上 PM 一起讨论。", "id": "ref1"}], "words": [{"w": "dishonest", "ipa": "/dɪsˈɑːnɪst/", "zh": "不诚实的", "ex": "It would be dishonest to call this feature finished.", "id": "w0"}, {"w": "rational", "ipa": "/ˈræʃənəl/", "zh": "理性的、合理的", "ex": "Given the deadline, cutting the feature was a rational choice.", "id": "w1"}, {"w": "persistent", "ipa": "/pərˈsɪstənt/", "zh": "坚持不懈的、反复纠缠的", "ex": "He was persistent until the platform team fixed the quota.", "id": "w2"}, {"w": "exposure", "ipa": "/ɪkˈspoʊʒər/", "zh": "暴露（风险）", "ex": "This bug creates an exposure for user email addresses.", "id": "w3"}, {"w": "slack", "ipa": "/slæk/", "zh": "余量、松弛空间", "ex": "Leave some slack in the sprint for on-call work.", "id": "w4"}, {"w": "transparent", "ipa": "/trænsˈperənt/" const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
