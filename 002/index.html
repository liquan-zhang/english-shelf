<script>
const D = {"id": "002", "title": "Turning a Messy Discussion into a Decision", "meta": "B2 · 约 270 词 · 场景：会议收敛", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Forty Minutes and No Answer", "heading_zh": "1. 四十分钟，没有结论", "rows": [[{"id": "s0_0_0", "md": "You have probably sat through this meeting.", "text": "You have probably sat through this meeting.", "zh": "这种会你大概率开过。", "sp": null}, {"id": "s0_0_1", "md": "Six smart people discuss a caching problem for forty minutes.", "text": "Six smart people discuss a caching problem for forty minutes.", "zh": "六个聪明人围着一个缓存问题讨论了四十分钟。", "sp": null}, {"id": "s0_0_2", "md": "Every comment is reasonable, but the conversation __goes in circles__, and the hour ends with \"Let's take this offline.\"", "text": "Every comment is reasonable, but the conversation goes in circles, and the hour ends with \"Let's take this offline.\"", "zh": "每个人说的都有道理，但讨论一直在原地打转，最后一句「我们会后再聊」就散了。", "sp": null}], [{"id": "s0_1_0", "md": "The problem is rarely a lack of ideas.", "text": "The problem is rarely a lack of ideas.", "zh": "问题很少是缺点子。", "sp": null}, {"id": "s0_1_1", "md": "It is that nobody has said out loud what the options are and how the group will choose between them.", "text": "It is that nobody has said out loud what the options are and how the group will choose between them.", "zh": "而是没有人把选项有哪些、大家要怎么选，明明白白地说出来。", "sp": null}, {"id": "s0_1_2", "md": "Without that, each person is arguing for a ==slightly== different question.", "text": "Without that, each person is arguing for a slightly different question.", "zh": "没有这一步，每个人争的其实都是一个略有不同的问题。", "sp": null}, {"id": "s0_1_3", "md": "Some people are ==optimizing== for speed, others for cost, and nobody notices the gap.", "text": "Some people are optimizing for speed, others for cost, and nobody notices the gap.", "zh": "有人在优化速度，有人在优化成本，却没人注意到这个错位。", "sp": null}], [{"id": "s0_2_0", "md": "**A discussion only becomes a decision when someone gives it edges.**", "text": "A discussion only becomes a decision when someone gives it edges.", "zh": "只有有人给讨论划出边界，它才能变成决定。", "sp": null}, {"id": "s0_2_1", "md": "That person does not need to be the most senior one in the room.", "text": "That person does not need to be the most senior one in the room.", "zh": "这个人不一定得是屋里级别最高的。", "sp": null}, {"id": "s0_2_2", "md": "It just needs to be someone willing to __step back__ and ==summarize== where things stand.", "text": "It just needs to be someone willing to step back and summarize where things stand.", "zh": "只要有人愿意退一步，总结一下现在讨论到哪儿了就行。", "sp": null}]]}, {"heading": "2. Three Questions That Pull a Room Together", "heading_zh": "2. 把讨论收拢的三个问题", "rows": [[{"id": "s1_0_0", "md": "Start by naming the options.", "text": "Start by naming the options.", "zh": "先把选项点出来。", "sp": null}, {"id": "s1_0_1", "md": "\"I'm hearing two ==camps==, either we add a cache now, or we fix the slow query first.\"", "text": "\"I'm hearing two camps, either we add a cache now, or we fix the slow query first.\"", "zh": "「我听下来大家分成两派：要么现在就加缓存，要么先把慢查询修了。」", "sp": null}, {"id": "s1_0_2", "md": "Even if your summary is a bit off, people will correct it, and the ==fog== starts to clear.", "text": "Even if your summary is a bit off, people will correct it, and the fog starts to clear.", "zh": "就算你总结得有点偏，大家也会纠正你，迷雾就开始散了。", "sp": null}], [{"id": "s1_1_0", "md": "Next, ask what really matters.", "text": "Next, ask what really matters.", "zh": "接着问，什么才是真正重要的。", "sp": null}, {"id": "s1_1_1", "md": "\"Is the main concern speed of delivery, or long-term cost?\"", "text": "\"Is the main concern speed of delivery, or long-term cost?\"", "zh": "「我们最关心的是交付速度，还是长期成本？」", "sp": null}, {"id": "s1_1_2", "md": "Once the group agrees on one ==criterion==, many arguments simply disappear, because they were __measuring different things__.", "text": "Once the group agrees on one criterion, many arguments simply disappear, because they were measuring different things.", "zh": "大家一旦对一个标准达成一致，很多争论自然就消失了，因为之前大家衡量的根本不是一回事。", "sp": null}], [{"id": "s1_2_0", "md": "Finally, ask how expensive it is to be wrong.", "text": "Finally, ask how expensive it is to be wrong.", "zh": "最后，问一下做错的代价有多大。", "sp": null}, {"id": "s1_2_1", "md": "If the choice is easy to ==reverse==, there is no reason to keep debating.", "text": "If the choice is easy to reverse, there is no reason to keep debating.", "zh": "如果这个选择很容易回退，那就没必要再争下去了。", "sp": null}, {"id": "s1_2_2", "md": "**Pick one, set a date to review it, and move on.**", "text": "Pick one, set a date to review it, and move on.", "zh": "选一个，定个时间复盘，然后往前走。", "sp": null}], [{"id": "s1_3_0", "md": "Then close the loop out loud.", "text": "Then close the loop out loud.", "zh": "然后当众把这件事闭环。", "sp": null}, {"id": "s1_3_1", "md": "\"So we're going with the query fix, and we'll check latency again next Friday.\"", "text": "\"So we're going with the query fix, and we'll check latency again next Friday.\"", "zh": "「那我们就先修查询，下周五再看一次延迟。」", "sp": null}, {"id": "s1_3_2", "md": "Saying it clearly gives people a chance to object now, instead of __in the hallway__ later.", "text": "Saying it clearly gives people a chance to object now, instead of in the hallway later.", "zh": "把话说清楚，大家就有机会现在提出异议，而不是事后在走廊里嘀咕。", "sp": null}]]}], "gist": [{"q": "作者认为讨论迟迟定不下来，根本原因是什么？", "a": "不是缺点子，而是没人明确说出有哪些选项、用什么标准来选，每个人其实在争论略有不同的问题。"}, {"q": "把讨论收敛成决定要问哪三个问题？", "a": "有哪几个选项；最看重的标准是什么；选错的代价有多大。"}, {"q": "如果一个决定很容易回退，作者建议怎么做？", "a": "不要继续争论，选一个，定个复盘日期，然后往前走；最后把结论大声说出来。"}], "dictation": [{"id": "s0_2_0", "text": "A discussion only becomes a decision when someone gives it edges."}, {"id": "s1_2_2", "text": "Pick one, set a date to review it, and move on."}, {"id": "s0_1_2", "text": "Without that, each person is arguing for a slightly different question."}, {"id": "s1_2_1", "text": "If the choice is easy to reverse, there is no reason to keep debating."}], "shadow": {"text": "Finally, ask how expensive it is to be wrong. If the choice is easy to reverse, there is no reason to keep debating. Pick one, set a date to review it, and move on.", "marked": "<b>Finally</b>, / ask how <b>expensive</b> it is / to be <b>wrong</b>. //<br>If the choice is <b>easy</b> to <b>reverse</b>, / there is <b>no</b> reason / to keep <b>debating</b>. //<br><b>Pick</b> one, / set a <b>date</b> to review it, / and <b>move on</b>. //"}, "prompts": [{"q": "大家为“先做 A/B 实验还是直接上线新推荐策略”讨论了半小时没有结论。用 30 秒把选项和判断标准说清楚，推动大家做决定。", "ref": "Can I try to pull this together? I'm hearing two options. We either run an A/B test for two weeks, or we ship the new ranking to everyone now. It seems like the real question is how much risk we can accept on engagement. Since we can roll back with one config change, I'd suggest we ship now and review the numbers next Wednesday. Does anyone strongly object?", "ref_zh": "我来试着收一下？我听下来有两个选项。要么做两周 A/B 实验，要么现在就把新的排序全量推给所有人。看起来真正的问题是，我们在互动指标上能承受多大的风险。既然改一个配置就能回滚，我建议现在就上，下周三再复盘数据。有人强烈反对吗？", "id": "ref0"}, {"q": "会议快结束，决定是“先修慢查询，暂不加缓存”。用 30 秒大声收口，说清决定、负责人和复查时间。", "ref": "Okay, let me close the loop so we're all on the same page. We're going with the query fix first, and we're parking the cache for now. Wei will own the fix, and we'll check P ninety-nine latency again next Friday. If the numbers are still bad by then, we'll come back to the cache option. If anyone disagrees, now is the time to say it.", "ref_zh": "好，我来闭个环，确保大家理解一致。我们先修查询，缓存的事暂时搁置。Wei 负责修复，下周五再看一次 P99 延迟。如果到时候数据还是不行，我们再回头考虑缓存方案。有不同意见的话，现在就说。", "id": "ref1"}], "words": [{"w": "slightly", "ipa": "/ˈslaɪtli/", "zh": "稍微、略微", "ex": "The new build is slightly faster, but not enough to notice.", "id": "w0"}, {"w": "summarize", "ipa": "/ˈsʌməˌraɪz/", "zh": "总结、概括", "ex": "Could you summarize the incident in two sentences for the leads?", "id": "w1"}, {"w": "camp", "ipa": "/kæmp/", "zh": "阵营、派别", "ex": "The team split into two camps over the rewrite.", "id": "w2"}, {"w": "fog", "ipa": "/fɑːɡ/", "zh": "迷雾、混乱不清", "ex": "The dashboard cleared up a lot of the fog around the drop in sign-ups.", "id": const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
