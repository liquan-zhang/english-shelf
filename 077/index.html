<script>
const D = {"id": "077", "title": "Planning Meetings That Produce Plans", "meta": "B2 · 约 270 词 · 场景：规划会议", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why Planning Meetings Drift", "heading_zh": "1. 规划会为什么会跑偏", "rows": [[{"id": "s0_0_0", "md": "Many planning meetings end with a ==lengthy== discussion and a promise to __follow up offline__.", "text": "Many planning meetings end with a lengthy discussion and a promise to follow up offline.", "zh": "很多规划会最后都是一通冗长的讨论，再加一句「会后线下再跟进」。", "sp": null}, {"id": "s0_0_1", "md": "Two hours of senior time later, the plan looks exactly the same as before.", "text": "Two hours of senior time later, the plan looks exactly the same as before.", "zh": "花了两个小时高级别的时间，计划跟之前一模一样。", "sp": null}, {"id": "s0_0_2", "md": "Everyone leaves tired, and nobody is quite sure what was decided.", "text": "Everyone leaves tired, and nobody is quite sure what was decided.", "zh": "大家都累了，走的时候谁也说不准到底定了什么。", "sp": null}], [{"id": "s0_1_0", "md": "The usual cause is that the meeting is doing two jobs at once.", "text": "The usual cause is that the meeting is doing two jobs at once.", "zh": "常见的原因是，这个会在同时干两件事。", "sp": null}, {"id": "s0_1_1", "md": "People are hearing information for the first time while also being asked to decide.", "text": "People are hearing information for the first time while also being asked to decide.", "zh": "大家第一次听到信息，同时又被要求做决定。", "sp": null}, {"id": "s0_1_2", "md": "So the conversation ==drifts== into questions that should have been answered by email a week earlier.", "text": "So the conversation drifts into questions that should have been answered by email a week earlier.", "zh": "于是讨论就跑偏到一些本该一周前用邮件就答完的问题上。", "sp": null}], [{"id": "s0_2_0", "md": "**A planning meeting should be where decisions get made, not where facts get collected.**", "text": "A planning meeting should be where decisions get made, not where facts get collected.", "zh": "规划会应该是做决定的地方，而不是收集信息的地方。", "sp": null}, {"id": "s0_2_1", "md": "Collect estimates, dependencies, and open questions in the days before.", "text": "Collect estimates, dependencies, and open questions in the days before.", "zh": "估时、依赖和待定问题，在会前几天就收集好。", "sp": null}, {"id": "s0_2_2", "md": "By the time everyone sits down, the ==groundwork== should already be done.", "text": "By the time everyone sits down, the groundwork should already be done.", "zh": "等大家坐下来的时候，铺垫工作应该已经做完了。", "sp": null}, {"id": "s0_2_3", "md": "The meeting is for the questions that only the people in the room can answer.", "text": "The meeting is for the questions that only the people in the room can answer.", "zh": "会议是留给那些只有在场的人才能回答的问题的。", "sp": null}]]}, {"heading": "2. Bring a Draft, Leave with Owners", "heading_zh": "2. 带着草案进来，带着负责人离开", "rows": [[{"id": "s1_0_0", "md": "Walk in with a draft plan, even a rough one.", "text": "Walk in with a draft plan, even a rough one.", "zh": "带着一份计划草案进会，哪怕很粗糙。", "sp": null}, {"id": "s1_0_1", "md": "A ==straw man== gives people something concrete to react to.", "text": "A straw man gives people something concrete to react to.", "zh": "一个靶子能给大家一个具体的东西去回应。", "sp": null}, {"id": "s1_0_2", "md": "**It is much easier to improve a bad plan than to write a good one from a blank page.**", "text": "It is much easier to improve a bad plan than to write a good one from a blank page.", "zh": "改进一份糟糕的计划，比从一张白纸开始写一份好计划容易得多。", "sp": null}], [{"id": "s1_1_0", "md": "Spend the meeting on the parts people actually disagree about.", "text": "Spend the meeting on the parts people actually disagree about.", "zh": "把会议时间花在大家真正有分歧的部分上。", "sp": null}, {"id": "s1_1_1", "md": "If everyone accepts the staffing for the first two projects, don't reopen it; spend the time on the ==contested== third one.", "text": "If everyone accepts the staffing for the first two projects, don't reopen it; spend the time on the contested third one.", "zh": "如果大家都接受前两个项目的人力安排，就别再翻出来讨论；把时间花在有争议的第三个上。", "sp": null}, {"id": "s1_1_2", "md": "A good facilitator will often say, \"It sounds like we agree on this, so let's __move on__.\"", "text": "A good facilitator will often say, \"It sounds like we agree on this, so let's move on.\"", "zh": "一个好的主持人经常会说：「听起来这点我们达成一致了，那就往下走。」", "sp": null}], [{"id": "s1_2_0", "md": "Before anyone leaves, go through every item and confirm an owner and a date.", "text": "Before anyone leaves, go through every item and confirm an owner and a date.", "zh": "在任何人离开之前，逐项过一遍，确认每项的负责人和日期。", "sp": null}, {"id": "s1_2_1", "md": "Read them back out loud, so ==misunderstandings== come up while everyone is still in the room.", "text": "Read them back out loud, so misunderstandings come up while everyone is still in the room.", "zh": "把它们大声念一遍，这样误解能在大家都还在场的时候暴露出来。", "sp": null}, {"id": "s1_2_2", "md": "Then send the summary within an hour, while the discussion is still fresh.", "text": "Then send the summary within an hour, while the discussion is still fresh.", "zh": "然后在一小时内发出会议纪要，趁讨论还新鲜。", "sp": null}, {"id": "s1_2_3", "md": "A plan without named owners is just a ==wish list==.", "text": "A plan without named owners is just a wish list.", "zh": "没有具体负责人的计划，只是一张愿望清单。", "sp": null}]]}], "gist": [{"q": "规划会为什么常常开完了计划没变？", "a": "会议同时在做两件事：大家第一次听到信息，又被要求当场决定，讨论就跑偏到本该会前邮件解决的问题上。"}, {"q": "会前应该做什么？带什么进会？", "a": "提前收集估时、依赖和未决问题；带一份草案（稻草人方案）进会，让大家有具体东西可以改。"}, {"q": "会议结束前要做哪一步？", "a": "逐项确认负责人和日期并大声复述，暴露误解；一小时内发出总结。没有负责人的计划只是愿望清单。"}], "dictation": [{"id": "s0_2_0", "text": "A planning meeting should be where decisions get made, not where facts get collected."}, {"id": "s1_0_2", "text": "It is much easier to improve a bad plan than to write a good one from a blank page."}, {"id": "s1_2_0", "text": "Before anyone leaves, go through every item and confirm an owner and a date."}, {"id": "s1_2_3", "text": "A plan without named owners is just a wish list."}], "shadow": {"text": "Before anyone leaves, go through every item and confirm an owner and a date. Read them back out loud, so misunderstandings come up while everyone is still in the room.", "marked": "Before anyone <b>leaves</b>, / go through <b>every</b> item / and confirm an <b>owner</b> / and a <b>date</b>. //<br>Read them back <b>out loud</b>, / so <b>misunderstandings</b> come up / while everyone is <b>still</b> in the room. //"}, "prompts": [{"q": "下周你要主持季度规划会。用 30 秒在群里说明会前准备的要求和会议怎么开。", "ref": "Hi all, quick note before next Tuesday's planning session. By Friday, please add your estimates, dependencies, and open questions to the shared doc. I'll turn that into a draft plan over the weekend. In the meeting itself, we won't walk through every item; we'll focus on the parts where we disagree. And we'll finish with an owner and a date for each project, so please come ready to commit.", "ref_zh": "大家好，下周二规划会之前提醒一下。请在周五之前把你们的估时、依赖和待定问题填到共享文档里。我周末会整理成一份计划草案。会上我们不会逐项过；我们只聚焦有分歧的部分。最后每个项目都会定下负责人和日期，所以请大家带着承诺来。", "id": "ref0"}, {"q": "规划会已经开了一个半小时，还在讨论第一个项目的细节。用 30 秒把会议拉回来，确认负责人和日期。", "ref": "Sorry to cut in, but we're at ninety minutes and still on the first project. It sounds like we agree on the approach, and the remaining questions are details that Wei and Sam can sort out offline. Can we confirm Wei as owner, with a first milestone at the end of the month? Then let's move to the search project, which is where we actually disagree.", "ref_zh": "抱歉打断一下，我们已经开了九十分钟，还在第一个项目上。听起来大家对方案是一致的，剩下的问题都是细节，Wei 和 Sam 可以线下解决。我们能不能确认 Wei 做负责人，第一个里程碑定在月底？然后我们进到搜索项目，那才是我们真正有分歧的地方。", "id": "ref1"}], "words": [{"w": "lengthy", "ipa": "/ˈleŋθi/", "zh": "冗长的", "ex": "After a lengthy debate, we agreed to keep the old API for now.", "id": "w0"}, {"w": "drift (v.)", "ipa": "/drɪft/", "zh": "偏离、跑题", "ex": "The meeting drifted into a debate about naming conventions.", "tts_w": "drift", "id": "w1"}, {"w": "groundwork", "ipa": "/ˈɡraʊndˌwɜːrk/", "zh": "前期准备、基础工作", "ex": "She did the groundwork with each team before the review.", "id": "w2"}, {"w": "straw man", "ipa": "/ˌstrɔː ˈmæn/", "zh": "供讨论的初稿方案（稻草人）", "ex": "Here's a straw man for the Q3 roadmap; please async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };

}

const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
