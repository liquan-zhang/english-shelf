<script>
const D = {"id": "077", "title": "Planning Meetings That Produce Plans", "meta": "B2 · 约 270 词 · 场景：规划会议", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why Planning Meetings Drift", "heading_zh": "1. 规划会为什么会跑偏", "rows": [[{"id": "s0_0_0", "md": "Many planning meetings end with a ==lengthy== discussion and a promise to __follow up offline__.", "text": "Many planning meetings end with a lengthy discussion and a promise to follow up offline.", "zh": "很多规划会最后都是一通冗长的讨论，再加一句「会后线下再跟进」。", "sp": null}, {"id": "s0_0_1", "md": "Two hours of senior time later, the plan looks exactly the same as before.", "text": "Two hours of senior time later, the plan looks exactly the same as before.", "zh": "花了两个小时高级别的时间，计划跟之前一模一样。", "sp": null}, {"id": "s0_0_2", "md": "Everyone leaves tired, and nobody is quite sure what was decided.", "text": "Everyone leaves tired, and nobody is quite sure what was decided.", "zh": "大家都累了，走的时候谁也说不准到底定了什么。", "sp": null}], [{"id": "s0_1_0", "md": "The usual cause is that the meeting is doing two jobs at once.", "text": "The usual cause is that the meeting is doing two jobs at once.", "zh": "常见的原因是，这个会在同时干两件事。", "sp": null}, {"id": "s0_1_1", "md": "People are hearing information for the first time while also being asked to decide.", "text": "People are hearing information for the first time while also being asked to decide.", "zh": "大家第一次听到信息，同时又被要求做决定。", "sp": null}, {"id": "s0_1_2", "md": "So the conversation ==drifts== into questions that should have been answered by email a week earlier.", "text": "So the conversation drifts into questions that should have been answered by email a week earlier.", "zh": "于是讨论就跑偏到一些本该一周前用邮件就答完的问题上。", "sp": null}], [{"id": "s0_2_0", "md": "**A planning meeting should be where decisions get made, not where facts get collected.**", "text": "A planning meeting should be where decisions get made, not where facts get collected.", "zh": "规划会应该是做决定的地方，而不是收集信息的地方。", "sp": null}, {"id": "s0_2_1", "md": "Collect estimates, dependencies, and open questions in the days before.", "text": "Collect estimates, dependencies, and open questions in the days before.", "zh": "估时、依赖和待定问题，在会前几天就收集好。", "sp": null}, {"id": "s0_2_2", "md": "By the time everyone sits down, the ==groundwork== should already be done.", "text": "By the time everyone sits down, the groundwork should already be done.", "zh": "等大家坐下来的时候，铺垫工作应该已经做完了。", "sp": null}, {"id": "s0_2_3", "md": "The meeting is for the questions that only the people in the room can answer.", "text": "The meeting is for the questions that only the people in the room can answer.", "zh": "会议是留给那些只有在场的人才能回答的问题的。", "sp": null}]]}, {"heading": "2. Bring a Draft, Leave with Owners", "heading_zh": "2. 带着草案进来，带着负责人离开", "rows": [[{"id": "s1_0_0", "md": "Walk in with a draft plan, even a rough one.", "text": "Walk in with a draft plan, even a rough one.", "zh": "带着一份计划草案进会，哪怕很粗糙。", "sp": null}, {"id": "s1_0_1", "md": "A ==straw man== gives people something concrete to react to.", "text": "A straw man gives people something concrete to react to.", "zh": "一个靶子能给大家一个具体的东西去回应。", "sp": null}, {"id": "s1_0_2", "md": "**It is much easier to improve a bad plan than to write a good one from a blank page.**", "text": "It is much easier to improve a bad plan than to write a good one from a blank page.", "zh": "改进一份糟糕的计划，比从一张白纸开始写一份好计划容易得多。", "sp": null}], [{"id": "s1_1_0", "md": "Spend the meeting on the parts people actually disagree about.", "text": "Spend the meeting on the parts people actually disagree about.", "zh": "把会议时间花在大家真正有分歧的部分上。", "sp": null}, {"id": "s1_1_1", "md": "If everyone accepts the staffing for the first two projects, don't reopen it; spend the time on the ==contested== third one.", "text": "If everyone accepts the staffing for the first two projects, don't reopen it; spend the time on the contested third one.", "zh": "如果大家都接受前两个项目的人力安排，就别再翻出来讨论；把时间花在有争议的第三个上。", "sp": null}, {"id": "s1_1_2", "md": "A good facilitator will often say, \"It sounds like we agree on this, so let's __move on__.\"", "text": "A good facilitator will often say, \"It sounds like we agree on this, so let's move on.\"", "zh": "一个好的主持人经常会说：「听起来这点我们达成一致了，那就往下走。」", "sp": null}], [{"id": "s1_2_0", "md": "Before anyone leaves, go through every item and confirm an owner and a date.", "text": "Before anyone leaves, go through every item and confirm an owner and a date.", "zh": "在任何人离开之前，逐项过一遍，确认每项的负责人和日期。", "sp": null}, {"id": "s1_2_1", "md": "Read them back out loud, so ==misunderstandings== come up while everyone is still in the room.", "text": "Read them back out loud, so misunderstandings come up while everyone is still in the room.", "zh": "把它们大声念一遍，这样误解能在大家都还在场的时候暴露出来。", "sp": null}, {"id": "s1_2_2", "md": "Then send the summary within an hour, while the discussion is still fresh.", "text": "Then send the summary within an hour, while the discussion is still fresh.", "zh": "然后在一小时内发出会议纪要，趁讨论还新鲜。", "sp": null}, {"id": "s1_2_3", "md": "A plan without named owners is just a ==wish list==.", "text": "A plan without named owners is just a wish list.", "zh": "没有具体负责人的计划，只是一张愿望清单。", "sp": null}]]}], "gist": [{"q": "规划会为什么常常开完了计划没变？", "a": "会议同时在做两件事：大家第一次听到信息，又被要求当场决定，讨论就跑偏到本该会前邮件解决的问题上。"}, {"q": "会前应该做什么？带什么进会？", "a": "提前收集估时、依赖和未决问题；带一份草案（稻草人方案）进会，让大家有具体东西可以改。"}, {"q": "会议结束前要做哪一步？", "a": "逐项确认负责人和日期并大声复述，暴露误解；一小时内发出总结。没有负责人的计划只是愿望清单。"}], "dictation": [{"id": "s0_2_0", "text": "A planning meeting should be where decisions get made, not where facts get collected."}, {"id": "s1_0_2", "text": "It is much easier to improve a bad plan than to write a good one from a blank page."}, {"id": "s1_2_0", "text": "Before anyone leaves, go through every item and confirm an owner and a date."}, {"id": "s1_2_3", "text": "A plan without named owners is just a wish list."}], "shadow": {"text": "Before anyone leaves, go through every item and confirm an owner and a date. Read them back out loud, so misunderstandings come up while everyone is still in the room.", "marked": "Before anyone <b>leaves</b>, / go through <b>every</b> item / and confirm an <b>owner</b> / and a <b>date</b>. //<br>Read them back <b>out loud</b>, / so <b>misunderstandings</b> come up / while everyone is <b>still</b> in the room. //"}, "prompts": [{"q": "下周你要主持季度规划会。用 30 秒在群里说明会前准备的要求和会议怎么开。", "ref": "Hi all, quick note before next Tuesday's planning session. By Friday, please add your estimates, dependencies, and open questions to the shared doc. I'll turn that into a draft plan over the weekend. In the meeting itself, we won't walk through every item; we'll focus on the parts where we disagree. And we'll finish with an owner and a date for each project, so please come ready to commit.", "ref_zh": "大家好，下周二规划会之前提醒一下。请在周五之前把你们的估时、依赖和待定问题填到共享文档里。我周末会整理成一份计划草案。会上我们不会逐项过；我们只聚焦有分歧的部分。最后每个项目都会定下负责人和日期，所以请大家带着承诺来。", "id": "ref0"}, {"q": "规划会已经开了一个半小时，还在讨论第一个项目的细节。用 30 秒把会议拉回来，确认负责人和日期。", "ref": "Sorry to cut in, but we're at ninety minutes and still on the first project. It sounds like we agree on the approach, and the remaining questions are details that Wei and Sam can sort out offline. Can we confirm Wei as owner, with a first milestone at the end of the month? Then let's move to the search project, which is where we actually disagree.", "ref_zh": "抱歉打断一下，我们已经开了九十分钟，还在第一个项目上。听起来大家对方案是一致的，剩下的问题都是细节，Wei 和 Sam 可以线下解决。我们能不能确认 Wei 做负责人，第一个里程碑定在月底？然后我们进到搜索项目，那才是我们真正有分歧的地方。", "id": "ref1"}], "words": [{"w": "lengthy", "ipa": "/ˈleŋθi/", "zh": "冗长的", "ex": "After a lengthy debate, we agreed to keep the old API for now.", "id": "w0"}, {"w": "drift (v.)", "ipa": "/drɪft/", "zh": "偏离、跑题", "ex": "The meeting drifted into a debate about naming conventions.", "tts_w": "drift", "id": "w1"}, {"w": "groundwork", "ipa": "/ˈɡraʊndˌwɜːrk/", "zh": "前期准备、基础工作", "ex": "She did the groundwork with each team before the review.", "id": "w2"}, {"w": "straw man", "ipa": "/ˌstrɔː ˈmæn/", "zh": "供讨论的初稿方案（稻草人）", "ex": "Here's a straw man for the Q3 roadmap; please  [93.841, 93.92], [93.933, 94.38], [94.393, 94.722], [94.735, 94.828], [94.841, 95.196], [95.525, 95.617], [95.63, 95.722], [95.735, 96.354], [96.446, 96.551], [96.564, 96.854], [96.867, 97.472]]}, {"kind": "s", "id": "s1_2_3", "md": "A plan without named owners is just a ==wish list==.", "zh": "没有具体负责人的计划，只是一张愿望清单。", "sp": null, "gap": false, "start": 97.872, "end": 101.16, "words": [[97.977, 98.043], [98.056, 98.385], [98.398, 98.767], [98.78, 99.056], [99.069, 99.477], [99.596, 99.74], [99.754, 99.99], [100.004, 100.043], [100.056, 100.319], [100.333, 100.767]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
