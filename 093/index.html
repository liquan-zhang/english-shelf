<script>
const D = {"id": "093", "title": "Writing for Readers Whose First Language Isn't English", "meta": "B2 · 约 280 词 · 场景：写给非母语读者", "voice": "en-GB-RyanNeural", "rate": "-5%", "sections": [{"heading": "1. Clever Writing Gets Lost", "heading_zh": "1. 写得巧，读者就丢了", "rows": [[{"id": "s0_0_0", "md": "Imagine you send a message saying the new feature is \"a bit of a __long shot__\" and that you would like to \"park it for now\".", "text": "Imagine you send a message saying the new feature is \"a bit of a long shot\" and that you would like to \"park it for now\".", "zh": "想象一下，你发了条消息，说新功能「有点悬」，想「先放一放」。", "sp": null}, {"id": "s0_0_1", "md": "To a reader in Seoul or Jakarta, reading in their second or third language late at night, that sentence can mean almost anything.", "text": "To a reader in Seoul or Jakarta, reading in their second or third language late at night, that sentence can mean almost anything.", "zh": "对一个在首尔或雅加达、深夜用第二甚至第三语言读消息的人来说，这句话几乎可以理解成任何意思。", "sp": null}, {"id": "s0_0_2", "md": "Some will paste it into a translation tool, and the result may be complete ==nonsense==.", "text": "Some will paste it into a translation tool, and the result may be complete nonsense.", "zh": "有些人会把它贴进翻译工具，翻出来的可能完全是胡话。", "sp": null}], [{"id": "s0_1_0", "md": "Most of our readers are smart, but they read quickly, between meetings, and often on a phone.", "text": "Most of our readers are smart, but they read quickly, between meetings, and often on a phone.", "zh": "我们的读者大多很聪明，但他们读得很快，在会议间隙读，而且经常是在手机上。", "sp": null}, {"id": "s0_1_1", "md": "Idioms, jokes and long sentences make them work harder, and ==ambiguous== words leave them guessing.", "text": "Idioms, jokes and long sentences make them work harder, and ambiguous words leave them guessing.", "zh": "习语、玩笑和长句会让他们读得更费劲，有歧义的词则让他们只能靠猜。", "sp": null}, {"id": "s0_1_2", "md": "**If your reader has to guess what you mean, you have not finished writing.**", "text": "If your reader has to guess what you mean, you have not finished writing.", "zh": "如果读者还得猜你什么意思，那你就还没写完。", "sp": null}], [{"id": "s0_2_0", "md": "This is not about writing simple ideas.", "text": "This is not about writing simple ideas.", "zh": "这不是说只能写简单的想法。", "sp": null}, {"id": "s0_2_1", "md": "It is about writing complex ideas in plain, ==predictable== language.", "text": "It is about writing complex ideas in plain, predictable language.", "zh": "而是要用平实、好预测的语言，把复杂的想法写清楚。", "sp": null}]]}, {"heading": "2. Four Rules for Global Readers", "heading_zh": "2. 写给全球读者的四条规矩", "rows": [[{"id": "s1_0_0", "md": "Put the request in the first line.", "text": "Put the request in the first line.", "zh": "把请求放在第一行。", "sp": null}, {"id": "s1_0_1", "md": "\"Please review the design by Thursday\" should come before the background, not at the end of the third paragraph.", "text": "\"Please review the design by Thursday\" should come before the background, not at the end of the third paragraph.", "zh": "「请在周四前评审一下设计」应该放在背景之前，而不是藏在第三段末尾。", "sp": null}], [{"id": "s1_1_0", "md": "Keep one idea per sentence, and prefer common verbs.", "text": "Keep one idea per sentence, and prefer common verbs.", "zh": "一句话只讲一个意思，尽量用常见动词。", "sp": null}, {"id": "s1_1_1", "md": "\"We will delay the launch\" is clearer than \"We are going to __push the launch back__ a bit.\"", "text": "\"We will delay the launch\" is clearer than \"We are going to push the launch back a bit.\"", "zh": "「我们会推迟上线」比「我们打算把上线往后挪一挪」更清楚。", "sp": null}, {"id": "s1_1_2", "md": "==Phrasal verbs== feel natural to native speakers, but they are often the hardest part for everyone else.", "text": "Phrasal verbs feel natural to native speakers, but they are often the hardest part for everyone else.", "zh": "短语动词对母语者来说很自然，但对其他人往往是最难的部分。", "sp": null}], [{"id": "s1_2_0", "md": "Write dates and numbers so they cannot be misunderstood.", "text": "Write dates and numbers so they cannot be misunderstood.", "zh": "日期和数字要写得不可能被误解。", "sp": null}, {"id": "s1_2_1", "md": "Spell out the month, because a date written only in numbers is ==interpreted== differently in London and New York.", "text": "Spell out the month, because a date written only in numbers is interpreted differently in London and New York.", "zh": "月份要用单词写出来，因为纯数字写的日期，在伦敦和纽约会被读成不同的意思。", "sp": null}, {"id": "s1_2_2", "md": "Give the time zone too, even when it feels obvious to you.", "text": "Give the time zone too, even when it feels obvious to you.", "zh": "时区也要写上，哪怕你觉得再明显不过。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __save the idioms for__ calls, where tone and facial expressions help.", "text": "Finally, save the idioms for calls, where tone and facial expressions help.", "zh": "最后，习语留到打电话的时候用，那时有语气和表情帮忙。", "sp": null}, {"id": "s1_3_1", "md": "**In writing, clear beats clever every time.**", "text": "In writing, clear beats clever every time.", "zh": "写东西的时候，清楚永远胜过巧妙。", "sp": null}, {"id": "s1_3_2", "md": "Your readers will not remember your style, but they will remember that your messages were easy to ==act on==.", "text": "Your readers will not remember your style, but they will remember that your messages were easy to act on.", "zh": "读者不会记得你的文风，但会记得你的消息拿来就能执行。", "sp": null}]]}], "gist": [{"q": "为什么像 long shot、park it 这样的说法在全球团队的书面沟通里有问题？", "a": "读者用第二、第三语言在深夜快速阅读，可能看不懂，或用翻译工具翻出一堆胡话。"}, {"q": "作者说这篇讲的是写简单的想法吗？", "a": "不是；是用平实、可预测的语言写复杂的想法。读者要靠猜，说明还没写完。"}, {"q": "给全球读者写作的四条规则是什么？", "a": "请求放第一行；一句一个意思，多用常见动词少用短语动词；日期写出月份并注明时区；习语留到通话里用。"}], "dictation": [{"id": "s0_1_2", "text": "If your reader has to guess what you mean, you have not finished writing."}, {"id": "s1_0_0", "text": "Put the request in the first line."}, {"id": "s1_1_0", "text": "Keep one idea per sentence, and prefer common verbs."}, {"id": "s1_3_1", "text": "In writing, clear beats clever every time."}], "shadow": {"text": "Most of our readers are smart, but they read quickly, between meetings, and often on a phone. Idioms, jokes and long sentences make them work harder, and ambiguous words leave them guessing. If your reader has to guess what you mean, you have not finished writing.", "marked": "Most of our readers are <b>smart</b>, / but they read <b>quickly</b>, / between <b>meetings</b>, / and often on a <b>phone</b>. //<br><b>Idioms</b>, jokes and long sentences / make them work <b>harder</b>, / and <b>ambiguous</b> words / leave them <b>guessing</b>. //<br>If your reader has to <b>guess</b> what you mean, / you have <b>not finished</b> writing. //"}, "prompts": [{"q": "你在会上口头向多国同事宣布上线推迟一周。按文中的写法说：先说结论和请求，一句一个意思，日期说清楚，30 秒。", "ref": "Here is the main point. We will delay the launch by one week, to the twelfth of June. The reason is a bug in the payment flow. The fix is ready, but we need three more days to test it. Please update your plans. If this delay blocks your team, tell me by Friday.", "ref_zh": "先说重点。我们会把上线推迟一周，改到六月十二日。原因是支付流程里有个 bug。修复已经好了，但我们还需要三天来测试。请大家相应调整计划。如果这次延期会卡住你们团队，请在周五前告诉我。", "id": "ref0"}, {"q": "下属给海外团队写的邮件里全是 touch base、circle back、low-hanging fruit。给他 30 秒反馈。", "ref": "The content of this email is good, but I think some readers will struggle with it. Phrases like circle back and low-hanging fruit are hard for people reading in a second language, and translation tools often get them wrong. Could you replace them with plain verbs and put the request in the first line? Then it's ready to send.", "ref_zh": "这封邮件内容挺好的，但我觉得有些读者会读得很吃力。像 circle back、low-hanging fruit 这种说法，用第二语言读的人很难看懂，翻译工具也经常翻错。能不能换成平实的动词，再把请求放到第一行？这样就可以发了。", "id": "ref1"}], "words": [{"w": "nonsense", "ipa": "/ˈnɑːnsens/", "zh": "胡话、毫无意义的东西", "ex": "The machine translation of that idiom was complete nonsense.", "id": "w0"}, {"w": "ambiguous", "ipa": "/æmˈbɪɡjuəs/", "zh": "模棱两可的", "ex": "\"Soon\" is ambiguous, please give an actual date.", "id": "w1"}, {"w": "predictable", "ipa": "/prɪˈdɪktəbəl/", "zh": "可预测的", "ex": "Use a predictable structure: request, context, deadline.", "id": "w2"}, {"w": "phrasal verb", "ipa": "/ˈfreɪzəl vɜːrb/", "zh": "短语动词", "ex": "\"Roll out\" is a phrasal verb that many readers look u const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
