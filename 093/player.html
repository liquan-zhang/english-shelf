<script>
const D = {"id": "093", "title": "Writing for Readers Whose First Language Isn't English", "meta": "B2 · 约 280 词 · 场景：写给非母语读者", "voice": "en-GB-RyanNeural", "rate": "-5%", "sections": [{"heading": "1. Clever Writing Gets Lost", "heading_zh": "1. 写得巧，读者就丢了", "rows": [[{"id": "s0_0_0", "md": "Imagine you send a message saying the new feature is \"a bit of a __long shot__\" and that you would like to \"park it for now\".", "text": "Imagine you send a message saying the new feature is \"a bit of a long shot\" and that you would like to \"park it for now\".", "zh": "想象一下，你发了条消息，说新功能「有点悬」，想「先放一放」。", "sp": null}, {"id": "s0_0_1", "md": "To a reader in Seoul or Jakarta, reading in their second or third language late at night, that sentence can mean almost anything.", "text": "To a reader in Seoul or Jakarta, reading in their second or third language late at night, that sentence can mean almost anything.", "zh": "对一个在首尔或雅加达、深夜用第二甚至第三语言读消息的人来说，这句话几乎可以理解成任何意思。", "sp": null}, {"id": "s0_0_2", "md": "Some will paste it into a translation tool, and the result may be complete ==nonsense==.", "text": "Some will paste it into a translation tool, and the result may be complete nonsense.", "zh": "有些人会把它贴进翻译工具，翻出来的可能完全是胡话。", "sp": null}], [{"id": "s0_1_0", "md": "Most of our readers are smart, but they read quickly, between meetings, and often on a phone.", "text": "Most of our readers are smart, but they read quickly, between meetings, and often on a phone.", "zh": "我们的读者大多很聪明，但他们读得很快，在会议间隙读，而且经常是在手机上。", "sp": null}, {"id": "s0_1_1", "md": "Idioms, jokes and long sentences make them work harder, and ==ambiguous== words leave them guessing.", "text": "Idioms, jokes and long sentences make them work harder, and ambiguous words leave them guessing.", "zh": "习语、玩笑和长句会让他们读得更费劲，有歧义的词则让他们只能靠猜。", "sp": null}, {"id": "s0_1_2", "md": "**If your reader has to guess what you mean, you have not finished writing.**", "text": "If your reader has to guess what you mean, you have not finished writing.", "zh": "如果读者还得猜你什么意思，那你就还没写完。", "sp": null}], [{"id": "s0_2_0", "md": "This is not about writing simple ideas.", "text": "This is not about writing simple ideas.", "zh": "这不是说只能写简单的想法。", "sp": null}, {"id": "s0_2_1", "md": "It is about writing complex ideas in plain, ==predictable== language.", "text": "It is about writing complex ideas in plain, predictable language.", "zh": "而是要用平实、好预测的语言，把复杂的想法写清楚。", "sp": null}]]}, {"heading": "2. Four Rules for Global Readers", "heading_zh": "2. 写给全球读者的四条规矩", "rows": [[{"id": "s1_0_0", "md": "Put the request in the first line.", "text": "Put the request in the first line.", "zh": "把请求放在第一行。", "sp": null}, {"id": "s1_0_1", "md": "\"Please review the design by Thursday\" should come before the background, not at the end of the third paragraph.", "text": "\"Please review the design by Thursday\" should come before the background, not at the end of the third paragraph.", "zh": "「请在周四前评审一下设计」应该放在背景之前，而不是藏在第三段末尾。", "sp": null}], [{"id": "s1_1_0", "md": "Keep one idea per sentence, and prefer common verbs.", "text": "Keep one idea per sentence, and prefer common verbs.", "zh": "一句话只讲一个意思，尽量用常见动词。", "sp": null}, {"id": "s1_1_1", "md": "\"We will delay the launch\" is clearer than \"We are going to __push the launch back__ a bit.\"", "text": "\"We will delay the launch\" is clearer than \"We are going to push the launch back a bit.\"", "zh": "「我们会推迟上线」比「我们打算把上线往后挪一挪」更清楚。", "sp": null}, {"id": "s1_1_2", "md": "==Phrasal verbs== feel natural to native speakers, but they are often the hardest part for everyone else.", "text": "Phrasal verbs feel natural to native speakers, but they are often the hardest part for everyone else.", "zh": "短语动词对母语者来说很自然，但对其他人往往是最难的部分。", "sp": null}], [{"id": "s1_2_0", "md": "Write dates and numbers so they cannot be misunderstood.", "text": "Write dates and numbers so they cannot be misunderstood.", "zh": "日期和数字要写得不可能被误解。", "sp": null}, {"id": "s1_2_1", "md": "Spell out the month, because a date written only in numbers is ==interpreted== differently in London and New York.", "text": "Spell out the month, because a date written only in numbers is interpreted differently in London and New York.", "zh": "月份要用单词写出来，因为纯数字写的日期，在伦敦和纽约会被读成不同的意思。", "sp": null}, {"id": "s1_2_2", "md": "Give the time zone too, even when it feels obvious to you.", "text": "Give the time zone too, even when it feels obvious to you.", "zh": "时区也要写上，哪怕你觉得再明显不过。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __save the idioms for__ calls, where tone and facial expressions help.", "text": "Finally, save the idioms for calls, where tone and facial expressions help.", "zh": "最后，习语留到打电话的时候用，那时有语气和表情帮忙。", "sp": null}, {"id": "s1_3_1", "md": "**In writing, clear beats clever every time.**", "text": "In writing, clear beats clever every time.", "zh": "写东西的时候，清楚永远胜过巧妙。", "sp": null}, {"id": "s1_3_2", "md": "Your readers will not remember your style, but they will remember that your messages were easy to ==act on==.", "text": "Your readers will not remember your style, but they will remember that your messages were easy to act on.", "zh": "读者不会记得你的文风，但会记得你的消息拿来就能执行。", "sp": null}]]}], "gist": [{"q": "为什么像 long shot、park it 这样的说法在全球团队的书面沟通里有问题？", "a": "读者用第二、第三语言在深夜快速阅读，可能看不懂，或用翻译工具翻出一堆胡话。"}, {"q": "作者说这篇讲的是写简单的想法吗？", "a": "不是；是用平实、可预测的语言写复杂的想法。读者要靠猜，说明还没写完。"}, {"q": "给全球读者写作的四条规则是什么？", "a": "请求放第一行；一句一个意思，多用常见动词少用短语动词；日期写出月份并注明时区；习语留到通话里用。"}], "dictation": [{"id": "s0_1_2", "text": "If your reader has to guess what you mean, you have not finished writing."}, {"id": "s1_0_0", "text": "Put the request in the first line."}, {"id": "s1_1_0", "text": "Keep one idea per sentence, and prefer common verbs."}, {"id": "s1_3_1", "text": "In writing, clear beats clever every time."}], "shadow": {"text": "Most of our readers are smart, but they read quickly, between meetings, and often on a phone. Idioms, jokes and long sentences make them work harder, and ambiguous words leave them guessing. If your reader has to guess what you mean, you have not finished writing.", "marked": "Most of our readers are <b>smart</b>, / but they read <b>quickly</b>, / between <b>meetings</b>, / and often on a <b>phone</b>. //<br><b>Idioms</b>, jokes and long sentences / make them work <b>harder</b>, / and <b>ambiguous</b> words / leave them <b>guessing</b>. //<br>If your reader has to <b>guess</b> what you mean, / you have <b>not finished</b> writing. //"}, "prompts": [{"q": "你在会上口头向多国同事宣布上线推迟一周。按文中的写法说：先说结论和请求，一句一个意思，日期说清楚，30 秒。", "ref": "Here is the main point. We will delay the launch by one week, to the twelfth of June. The reason is a bug in the payment flow. The fix is ready, but we need three more days to test it. Please update your plans. If this delay blocks your team, tell me by Friday.", "ref_zh": "先说重点。我们会把上线推迟一周，改到六月十二日。原因是支付流程里有个 bug。修复已经好了，但我们还需要三天来测试。请大家相应调整计划。如果这次延期会卡住你们团队，请在周五前告诉我。", "id": "ref0"}, {"q": "下属给海外团队写的邮件里全是 touch base、circle back、low-hanging fruit。给他 30 秒反馈。", "ref": "The content of this email is good, but I think some readers will struggle with it. Phrases like circle back and low-hanging fruit are hard for people reading in a second language, and translation tools often get them wrong. Could you replace them with plain verbs and put the request in the first line? Then it's ready to send.", "ref_zh": "这封邮件内容挺好的，但我觉得有些读者会读得很吃力。像 circle back、low-hanging fruit 这种说法，用第二语言读的人很难看懂，翻译工具也经常翻错。能不能换成平实的动词，再把请求放到第一行？这样就可以发了。", "id": "ref1"}], "words": [{"w": "nonsense", "ipa": "/ˈnɑːnsens/", "zh": "胡话、毫无意义的东西", "ex": "The machine translation of that idiom was complete nonsense.", "id": "w0"}, {"w": "ambiguous", "ipa": "/æmˈbɪɡjuəs/", "zh": "模棱两可的", "ex": "\"Soon\" is ambiguous, please give an actual date.", "id": "w1"}, {"w": "predictable", "ipa": "/prɪˈdɪktəbəl/", "zh": "可预测的", "ex": "Use a predictable structure: request, context, deadline.", "id": "w2"}, {"w": "phrasal verb", "ipa": "/ˈfreɪzəl vɜːrb/", "zh": "短语动词", "ex": "\"Roll out\" is a phrasal verb that many readers look up.", "id": "w3"}, {"w": "interpret", "ipa": "/ɪnˈtɜːrprɪt/", "zh": "理解、解读", "ex": "Different teams interpreted the requirement in different ways.", "id": "w4"}, {"w": "act on", "ipa": "/ækt ɑːn/", "zh": "根据……采取行动", "ex": "Write feedback that people can act on, not just agree with.", "id": "w5"}, {"w": "long shot", "ipa": "/lɔːŋ ʃɑːt/", "zh": "希望渺茫的事", "ex": "Getting this into the current release is a long shot.", "id": "w6"}, {"w": "plain", "ipa": "/pleɪn/", "zh": "平实的、简明的", "ex": "Write the summary in plain English so the whole region can use it.", "id": "w7"}, {"w": "spell out", "ipa": "/spel aʊt/", "zh": "清楚说明、拼写出来", "ex": "Spell out what you need from each team, don't assume they know.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Clever Writing Gets Lost", "zh": "1. 写得巧，读者就丢了", "start": 0.0, "end": 3.288, "words": [[0.1, 0.508], [0.718, 1.034], [1.047, 1.508], [1.521, 1.771], [1.784, 2.363]]}, {"kind": "s", "id": "s0_0_0", "md": "Imagine you send a message saying the new feature is \"a bit of a __long shot__\" and that you would like to \"park it for now\".", "zh": "想象一下，你发了条消息，说新功能「有点悬」，想「先放一放」。", "sp": null, "gap": false, "start": 3.288, "end": 10.08, "words": [[3.388, 3.888], [3.901, 3.993], [4.006, 4.23], [4.243, 4.283], [4.296, 4.638], [4.651, 4.967], [4.98, 5.046], [5.059, 5.296], [5.309, 5.704], [5.717, 5.901], [6.085, 6.151], [6.164, 6.349], [6.362, 6.441], [6.454, 6.493], [6.506, 6.796], [6.809, 7.204], [7.23, 7.335], [7.349, 7.48], [7.493, 7.585], [7.599, 7.73], [7.743, 7.941], [7.954, 8.059], [8.151, 8.454], [8.467, 8.585], [8.599, 8.73], [8.743, 9.151]]}, {"kind": "s", "id": "s0_0_1", "md": "To a reader in Seoul or Jakarta, reading in their second or third language late at night, that sentence can mean almost anything.", "zh": "对一个在首尔或雅加达、深夜用第二甚至第三语言读消息的人来说，这句话几乎可以理解成任何意思。", "sp": null, "gap": false, "start": 10.08, "end": 18.216, "words": [[10.18, 10.377], [10.391, 10.469], [10.483, 10.851], [10.864, 11.048], [11.062, 11.443], [11 d": "s", "id": "s1_2_1", "md": "Spell out the month, because a date written only in numbers is ==interpreted== differently in London and New York.", "zh": "月份要用单词写出来，因为纯数字写的日期，在伦敦和纽约会被读成不同的意思。", "sp": null, "gap": false, "start": 83.208, "end": 89.976, "words": [[83.308, 83.663], [83.676, 83.834], [83.847, 83.913], [83.926, 84.374], [84.492, 84.716], [84.729, 84.808], [84.821, 85.111], [85.124, 85.453], [85.466, 85.716], [85.729, 85.874], [85.887, 86.242], [86.255, 86.426], [86.44, 87.084], [87.097, 87.597], [87.611, 87.742], [87.755, 88.137], [88.15, 88.347], [88.361, 88.558], [88.571, 89.058]]}, {"kind": "s", "id": "s1_2_2", "md": "Give the time zone too, even when it feels obvious to you.", "zh": "时区也要写上，哪怕你觉得再明显不过。", "sp": null, "gap": false, "start": 89.976, "end": 94.56, "words": [[90.076, 90.3], [90.313, 90.405], [90.418, 90.734], [90.747, 91.05], [91.063, 91.365], [91.655, 91.984], [91.997, 92.142], [92.155, 92.26], [92.273, 92.642], [92.655, 93.102], [93.115, 93.234], [93.247, 93.629]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, __save the idioms for__ calls, where tone and facial expressions help.", "zh": "最后，习语留到打电话的时候用，那时有语气和表情帮忙。", "sp": null, "gap": true, "start": 94.56, "end": 100.344, "words": [[94.66, 95.292], [95.515, 95.818], [95.831, 95.923], [95.936, 96.371], [96.384, 96.489], [96.502, 96.963], [97.134, 97.305], [97.318, 97.699], [97.778, 97.923], [97.936, 98.331], [98.344, 98.989], [99.002, 99.423]]}, {"kind": "s", "id": "s1_3_1", "md": "**In writing, clear beats clever every time.**", "zh": "写东西的时候，清楚永远胜过巧妙。", "sp": null, "gap": false, "start": 100.344, "end": 104.184, "words": [[100.444, 100.681], [100.694, 101.194], [101.405, 101.747], [101.76, 102.023], [102.036, 102.405], [102.418, 102.733], [102.747, 103.273]]}, {"kind": "s", "id": "s1_3_2", "md": "Your readers will not remember your style, but they will remember that your messages were easy to ==act on==.", "zh": "读者不会记得你的文风，但会记得你的消息拿来就能执行。", "sp": null, "gap": false, "start": 104.184, "end": 110.448, "words": [[104.284, 104.495], [104.508, 104.916], [104.929, 105.087], [105.1, 105.35], [105.363, 105.692], [105.705, 105.85], [105.863, 106.376], [106.587, 106.705], [106.718, 106.81], [106.823, 106.994], [107.008, 107.376], [107.389, 107.547], [107.56, 107.679], [107.692, 108.218], [108.231, 108.389], [108.402, 108.758], [108.771, 108.902], [108.916, 109.179], [109.192, 109.521]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
