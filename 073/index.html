<script>
const D = {"id": "073", "title": "Estimating When You Really Don't Know", "meta": "B2 · 约 270 词 · 场景：排期估时", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why Single Numbers Mislead", "heading_zh": "1. 单个数字为什么会误导", "rows": [[{"id": "s0_0_0", "md": "Your PM asks how long the new search integration will take.", "text": "Your PM asks how long the new search integration will take.", "zh": "PM 问你新的搜索集成要多久。", "sp": null}, {"id": "s0_0_1", "md": "You have never used this vendor's API, and the data format is still undecided.", "text": "You have never used this vendor's API, and the data format is still undecided.", "zh": "你从来没用过这家供应商的 API，数据格式也还没定。", "sp": null}, {"id": "s0_0_2", "md": "Any single number you give right now is a guess dressed up as a plan.", "text": "Any single number you give right now is a guess dressed up as a plan.", "zh": "现在你给出的任何一个数字，都只是一个打扮成计划的猜测。", "sp": null}], [{"id": "s0_1_0", "md": "The usual mistake is to say \"about three weeks\" to sound ==decisive==.", "text": "The usual mistake is to say \"about three weeks\" to sound decisive.", "zh": "常见的错误是为了显得果断，张口就说「大概三周」。", "sp": null}, {"id": "s0_1_1", "md": "The PM writes it on the roadmap, and from that moment the guess __becomes a commitment__.", "text": "The PM writes it on the roadmap, and from that moment the guess becomes a commitment.", "zh": "PM 把它写进 roadmap，从那一刻起，这个猜测就变成了承诺。", "sp": null}, {"id": "s0_1_2", "md": "When it slips, the team looks ==unreliable==, even though the original number was never real.", "text": "When it slips, the team looks unreliable, even though the original number was never real.", "zh": "等延期了，团队就显得不靠谱，尽管最初那个数字本来就不是真的。", "sp": null}], [{"id": "s0_2_0", "md": "**An estimate without a range is a promise you didn't mean to make.**", "text": "An estimate without a range is a promise you didn't mean to make.", "zh": "不带区间的估时，是一个你本没打算做出的承诺。", "sp": null}, {"id": "s0_2_1", "md": "Ranges can sound ==noncommittal==, but they carry real information: how much you still don't know.", "text": "Ranges can sound noncommittal, but they carry real information: how much you still don't know.", "zh": "区间听起来可能像不愿表态，但它承载着真实的信息：你还有多少不知道。", "sp": null}, {"id": "s0_2_2", "md": "A wide range is not a weakness; it is an honest description of the problem.", "text": "A wide range is not a weakness; it is an honest description of the problem.", "zh": "区间宽不是弱点；它是对问题的诚实描述。", "sp": null}]]}, {"heading": "2. A Range, a Reason, a Checkpoint", "heading_zh": "2. 一个区间、一个理由、一个检查点", "rows": [[{"id": "s1_0_0", "md": "Give a range, and say what drives the width.", "text": "Give a range, and say what drives the width.", "zh": "给一个区间，并说明是什么让它这么宽。", "sp": null}, {"id": "s1_0_1", "md": "\"Two to six weeks; the big unknown is whether their API supports bulk updates.\"", "text": "\"Two to six weeks; the big unknown is whether their API supports bulk updates.\"", "zh": "「两到六周；最大的未知是他们的 API 支不支持批量更新。」", "sp": null}, {"id": "s1_0_2", "md": "Now the PM knows which question matters most, and might even help answer it.", "text": "Now the PM knows which question matters most, and might even help answer it.", "zh": "这样 PM 就知道哪个问题最关键，说不定还能帮着去搞清楚。", "sp": null}], [{"id": "s1_1_0", "md": "Then offer to __narrow it down__.", "text": "Then offer to narrow it down.", "zh": "然后主动提出把区间缩小。", "sp": null}, {"id": "s1_1_1", "md": "Spend two or three days on a quick ==prototype== against the real API.", "text": "Spend two or three days on a quick prototype against the real API.", "zh": "花两三天对着真实的 API 快速做一个原型。", "sp": null}, {"id": "s1_1_2", "md": "After that, you can give a much tighter estimate, and the PM can decide whether the project is still worth it.", "text": "After that, you can give a much tighter estimate, and the PM can decide whether the project is still worth it.", "zh": "之后你就能给出一个准得多的估时，PM 也能判断这个项目还值不值得做。", "sp": null}], [{"id": "s1_2_0", "md": "Agree on a ==checkpoint== where you will update the number, and put it in the calendar.", "text": "Agree on a checkpoint where you will update the number, and put it in the calendar.", "zh": "约好一个更新数字的检查点，并且放进日历。", "sp": null}, {"id": "s1_2_1", "md": "**The goal is not a perfect estimate; it is an estimate that gets better on schedule.**", "text": "The goal is not a perfect estimate; it is an estimate that gets better on schedule.", "zh": "目标不是一次完美的估时；而是一个能按时变得越来越准的估时。", "sp": null}, {"id": "s1_2_2", "md": "When the update arrives on the day you promised, a changed number looks like ==diligence==, not failure.", "text": "When the update arrives on the day you promised, a changed number looks like diligence, not failure.", "zh": "当更新在你承诺的那天准时到来，数字变了看起来是认真负责，而不是失败。", "sp": null}, {"id": "s1_2_3", "md": "Over a few projects, that habit __earns you__ more trust than any confident guess ever could.", "text": "Over a few projects, that habit earns you more trust than any confident guess ever could.", "zh": "做过几个项目之后，这个习惯为你赢得的信任，比任何自信满满的猜测都多。", "sp": null}]]}], "gist": [{"q": "面对未知时给出单一数字有什么问题？", "a": "猜测会被写进路线图变成承诺，延期时团队显得不可靠，尽管原始数字本来就不真实。"}, {"q": "作者建议怎么给估时？", "a": "给一个区间，并说明是什么因素决定了区间宽度（最大的未知是什么）。"}, {"q": "如何让估时逐步变准并赢得信任？", "a": "花两三天做原型缩小不确定性；约定检查点按时更新数字，这样数字变化看起来是尽责而非失败。"}], "dictation": [{"id": "s0_0_2", "text": "Any single number you give right now is a guess dressed up as a plan."}, {"id": "s0_2_0", "text": "An estimate without a range is a promise you didn't mean to make."}, {"id": "s0_2_2", "text": "A wide range is not a weakness; it is an honest description of the problem."}, {"id": "s1_2_1", "text": "The goal is not a perfect estimate; it is an estimate that gets better on schedule."}], "shadow": {"text": "Give a range, and say what drives the width. \"Two to six weeks; the big unknown is whether their API supports bulk updates.\" Now the PM knows which question matters most, and might even help answer it.", "marked": "Give a <b>range</b>, / and say what <b>drives</b> the width. //<br>\"<b>Two</b> to <b>six</b> weeks; / the big <b>unknown</b> / is whether their API supports <b>bulk</b> updates.\" //<br>Now the PM knows / which question matters <b>most</b>, / and might even <b>help</b> answer it. //"}, "prompts": [{"q": "PM 在会上追问“接入新支付渠道要多久？给个数”。你们从没接过这家。用 30 秒给出区间、主要未知和检查点。", "ref": "Honestly, a single number right now would be a guess. My range is three to eight weeks. The biggest unknown is their refund API; if it works like their docs say, we're near the low end. Here's what I suggest: give us three days to build a small prototype against their sandbox. On Thursday I'll come back with a much tighter estimate, and you can decide if it's still worth it.", "ref_zh": "说实话，现在给一个数字只能是猜。我的区间是三到八周。最大的未知是他们的退款 API；如果它跟文档说的一样，我们就接近下限。我的建议是：给我们三天，对着他们的沙箱环境做个小原型。周四我给你一个准得多的估时，到时候你再判断还值不值得做。", "id": "ref0"}, {"q": "上次估三周、实际做了六周，老板有些不满。用 30 秒说明你以后会怎么给估时。", "ref": "You're right that the last estimate was off, and I take responsibility for that. The problem was that I gave one number when we still didn't understand the data migration. From now on, I'll give a range and name the biggest unknown behind it. I'll also set a checkpoint after the first week to update the estimate, so you hear about any change early rather than at the deadline.", "ref_zh": "你说得对，上次的估时偏了，这个责任在我。问题在于，我们还没搞懂数据迁移的时候，我就给了一个数字。以后我会给区间，并说明背后最大的未知是什么。我还会在第一周之后设一个检查点来更新估时，这样有任何变化你都能早点知道，而不是到 deadline 才知道。", "id": "ref1"}], "words": [{"w": "decisive", "ipa": "/dɪˈsaɪsɪv/", "zh": "果断的", "ex": "We need someone decisive to own the launch call.", "id": "w0"}, {"w": "unreliable", "ipa": "/ˌʌnrɪˈlaɪəbəl/", "zh": "不可靠的", "ex": "The staging data is unreliable, so test against a production copy.", "id": "w1"}, {"w": "noncommittal", "ipa": "/ˌnɑːnkəˈmɪtəl/", "zh": "不表态的、含糊的", "ex": "The vendor was noncommittal about when the fix would be ready.", "id": "w2"}, {"w": "prototype", "ipa": "/ˈproʊtəˌtaɪp/", "zh": "原型", "ex": "Let's build a quick prototype before we commit to this design.", "id": "w3"}, {"w": "checkpoint", "ipa": "/ˈtʃekˌpɔɪnt/", "zh": "检查点、节点", "ex": "We'll have a check const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {

});

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
