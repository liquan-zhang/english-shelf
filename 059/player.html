<script>
const D = {"id": "059", "title": "Setting Expectations Early", "meta": "B2 · 约 280 词 · 场景：明确期望", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Surprises Are Usually Late Expectations", "heading_zh": "1. 意外通常是迟到的预期", "rows": [[{"id": "s0_0_0", "md": "At the end of the year, you tell an engineer that he did not show enough ==initiative==.", "text": "At the end of the year, you tell an engineer that he did not show enough initiative.", "zh": "年底的时候，你告诉一位工程师，他主动性不够。", "sp": null}, {"id": "s0_0_1", "md": "He looks shocked.", "text": "He looks shocked.", "zh": "他一脸震惊。", "sp": null}, {"id": "s0_0_2", "md": "\"Nobody ever told me that was part of my job,\" he says, and he has a point.", "text": "\"Nobody ever told me that was part of my job,\" he says, and he has a point.", "zh": "「从来没人告诉过我这是我工作的一部分。」他说，而且他说得有道理。", "sp": null}], [{"id": "s0_1_0", "md": "Most painful performance conversations are not about bad work.", "text": "Most painful performance conversations are not about bad work.", "zh": "大多数让人难受的绩效谈话，并不是因为活干得差。", "sp": null}, {"id": "s0_1_1", "md": "They are about ==unspoken== expectations that only one side knew about.", "text": "They are about unspoken expectations that only one side knew about.", "zh": "而是因为有些预期从没说出口，只有一方知道。", "sp": null}, {"id": "s0_1_2", "md": "You assumed a senior engineer would review other people's designs; he assumed his job was to close his own tickets well.", "text": "You assumed a senior engineer would review other people's designs; he assumed his job was to close his own tickets well.", "zh": "你以为资深工程师会去 review 别人的设计；他以为自己的工作就是把自己的工单做好。", "sp": null}, {"id": "s0_1_3", "md": "**If an expectation only lives in your head, it is not an expectation; it is a trap.**", "text": "If an expectation only lives in your head, it is not an expectation; it is a trap.", "zh": "如果一个预期只存在你的脑子里，那它就不是预期，而是陷阱。", "sp": null}], [{"id": "s0_2_0", "md": "The fix is boring, and it works.", "text": "The fix is boring, and it works.", "zh": "解决办法很无聊，但管用。", "sp": null}, {"id": "s0_2_1", "md": "Say what good looks like at the beginning, in plain words, and __write it down__.", "text": "Say what good looks like at the beginning, in plain words, and write it down.", "zh": "一开始就用大白话说清楚什么叫做得好，并且写下来。", "sp": null}, {"id": "s0_2_2", "md": "It feels ==awkward== to state the obvious, but what is obvious to you is rarely obvious to everyone.", "text": "It feels awkward to state the obvious, but what is obvious to you is rarely obvious to everyone.", "zh": "把显而易见的事说出来会觉得有点别扭，但对你显而易见的东西，很少对每个人都显而易见。", "sp": null}]]}, {"heading": "2. What to Spell Out", "heading_zh": "2. 要讲明白什么", "rows": [[{"id": "s1_0_0", "md": "Start with outcomes for the first ninety days.", "text": "Start with outcomes for the first ninety days.", "zh": "从头九十天的结果说起。", "sp": null}, {"id": "s1_0_1", "md": "\"By the end of March, you own the alerting for the checkout service and have led one postmortem.\"", "text": "\"By the end of March, you own the alerting for the checkout service and have led one postmortem.\"", "zh": "「到三月底，你要负责结账服务的告警，并且主导过一次复盘。」", "sp": null}, {"id": "s1_0_2", "md": "Concrete ==milestones== are easier to discuss than adjectives like \"strong\" or \"senior.\"", "text": "Concrete milestones are easier to discuss than adjectives like \"strong\" or \"senior.\"", "zh": "具体的里程碑比「强」或「资深」这种形容词更好讨论。", "sp": null}], [{"id": "s1_1_0", "md": "Then cover the ==unwritten== rules.", "text": "Then cover the unwritten rules.", "zh": "然后，把那些不成文的规矩讲一讲。", "sp": null}, {"id": "s1_1_1", "md": "How fast should people reply in chat?", "text": "How fast should people reply in chat?", "zh": "群里消息应该多快回复？", "sp": null}, {"id": "s1_1_2", "md": "Is it fine to push back on a product manager in a meeting?", "text": "Is it fine to push back on a product manager in a meeting?", "zh": "在会上反驳产品经理可以吗？", "sp": null}, {"id": "s1_1_3", "md": "These small norms cause more ==friction== than any technical decision.", "text": "These small norms cause more friction than any technical decision.", "zh": "这些小规矩引起的摩擦，比任何技术决策都多。", "sp": null}], [{"id": "s1_2_0", "md": "Be clear about what you will do in return.", "text": "Be clear about what you will do in return.", "zh": "也要讲清楚你会怎么回报。", "sp": null}, {"id": "s1_2_1", "md": "\"I'll give you feedback within a week of anything important, and I'll tell you early if you're __off track__.\"", "text": "\"I'll give you feedback within a week of anything important, and I'll tell you early if you're off track.\"", "zh": "「有任何重要的事，我会在一周内给你反馈；如果你跑偏了，我会尽早告诉你。」", "sp": null}, {"id": "s1_2_2", "md": "**Expectations work best when they run in both directions.**", "text": "Expectations work best when they run in both directions.", "zh": "预期是双向的时候，效果最好。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __revisit them__ regularly.", "text": "Finally, revisit them regularly.", "zh": "最后，定期回顾。", "sp": null}, {"id": "s1_3_1", "md": "Priorities change, and a list from January can be ==outdated== by June.", "text": "Priorities change, and a list from January can be outdated by June.", "zh": "优先级会变，一月份列的清单到六月可能就过时了。", "sp": null}, {"id": "s1_3_2", "md": "A quick check every quarter keeps the agreement alive, and keeps year-end reviews free of surprises.", "text": "A quick check every quarter keeps the agreement alive, and keeps year-end reviews free of surprises.", "zh": "每个季度快速对一次，能让这份约定一直有效，也能让年底的绩效评估没有意外。", "sp": null}]]}], "gist": [{"q": "作者认为大多数痛苦的绩效谈话源于什么？", "a": "不是工作做得差，而是只有一方知道的、没说出口的期望；只存在你脑子里的期望是陷阱。"}, {"q": "一开始应该讲清哪些内容？", "a": "前九十天的具体成果和里程碑；不成文的规矩（聊天回复速度、能否在会上反驳 PM）；以及你作为经理会给对方什么。"}, {"q": "期望讲清之后还要做什么？", "a": "定期回顾，比如每季度检查一次，因为优先级会变，年初的清单到年中可能过时。"}], "dictation": [{"id": "s0_1_3", "text": "If an expectation only lives in your head, it is not an expectation; it is a trap."}, {"id": "s1_1_3", "text": "These small norms cause more friction than any technical decision."}, {"id": "s1_2_2", "text": "Expectations work best when they run in both directions."}, {"id": "s1_3_1", "text": "Priorities change, and a list from January can be outdated by June."}], "shadow": {"text": "The fix is boring, and it works. Say what good looks like at the beginning, in plain words, and write it down.", "marked": "The fix is <b>boring</b>, / and it <b>works</b>. //<br>Say what <b>good</b> looks like / at the <b>beginning</b>, / in <b>plain</b> words, / and <b>write</b> it down. //"}, "prompts": [{"q": "一位资深工程师刚转入你的团队。用 30 秒讲清你对他前三个月的期望，要具体到成果，而不是形容词。", "ref": "Let me be concrete about what I'm hoping to see in your first three months. By the end of March, I'd like you to own the alerting for the checkout service, and to have led at least one postmortem. I'd also like you to review designs from the two junior engineers, because that's a big part of the senior role here. In return, I'll give you feedback within a week of anything important.", "ref_zh": "我具体说一下前三个月我希望看到什么。到三月底，我希望你负责结账服务的告警，并且至少主导过一次复盘。我也希望你去 review 那两位初级工程师的设计，因为在我们这儿，这是资深岗位很重要的一部分。作为交换，有任何重要的事，我会在一周内给你反馈。", "id": "ref0"}, {"q": "团队里经常有人在会上不敢反驳 PM，事后才私下抱怨。用 30 秒在团队会上讲清这条「不成文的规矩」。", "ref": "I want to make one expectation explicit, because I don't think I've said it clearly before. If you disagree with a product decision, please say so in the meeting. You won't get in trouble for pushing back, even with senior PMs in the room. What doesn't help is agreeing in the meeting and complaining afterwards, because by then the plan is already moving.", "ref_zh": "有一个预期我想讲明白，因为我觉得之前没说清楚。如果你不同意某个产品决策，请在会上说出来。你反驳不会有任何麻烦，哪怕在座的有资深 PM。没用的是会上同意、会后抱怨，因为到那时方案已经在推进了。", "id": "ref1"}], "words": [{"w": "initiative", "ipa": "/ɪˈnɪʃətɪv/", "zh": "主动性", "ex": "She showed initiative by fixing the flaky alert without being asked.", "id": "w0"}, {"w": "unspoken", "ipa": "/ʌnˈspoʊkən/", "zh": "未说出口的", "ex": "There's an unspoken rule that nobody deploys on Friday.", "id": "w1"}, {"w": "awkward", "ipa": "/ˈɔːkwərd/", "zh": "尴尬的、别扭的", "ex": "It's a bit awkward, but we need to talk about the missed deadline.", "id": "w2"}, {"w": "milestone", "ipa": "/ˈmaɪlstoʊn/", "zh": "里程碑", "ex": "The first milestone is a working demo by the end of the month.", "id": "w3"}, {"w": "unwritten", "ipa": "/ʌnˈrɪtn/", "zh": "不成文的", "ex": "One unwritten rule here is that you reply to pages within five minutes.", "id": "w4"}, {"w": "friction", "ipa": "/ˈfrɪkʃən/", "zh": "摩擦", "ex": "Different code review standards caused friction between the teams.", "id": "w5"}, {"w": "outdated", "ipa": "/ˌaʊtˈdeɪtɪd/", "zh": "过时的", "ex": "The runbook is outdated; half the commands no longer work.", "id": "w6"}, {"w": "norm", "ipa": "/nɔːrm/", "zh": "规范、常规", "ex": "Async updates are the norm on our team, not daily meetings.", "id": "w7"}, {"w": "off track", "ipa": "/ɔːf træk/", "zh": "偏离轨道", "ex": "Tell me early if the project gets off track.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Surprises Are Usually Late Expectations", "zh": "1. 意外通常是迟到的预期", "start": 0.0, "end": 3.864, "words": [[0.118, 0.355], [0.697, 1.303], [1.316, 1.513], [1.526, 2.066], [2.079, 2.421], [2.513, 3.474]]}, {"kind": "s", "id": "s0_0_0", "md": "At the end of the year, you tell an engineer that he did not show enough ==initiative==.", "zh": "年底的时候，你告诉一位工程师，他主动性不够。", "sp": null, "gap": false, "start": 3.864, "end": 8.496, "words": [[3.969, 4.061], [4.075, 4.153], [4.167, 4.338], [4.351, 4.417], [4.43, 4.482], [4.496, 4.864], [5.18, 5.259], [5.272, 5.482], [5.496, 5.575], [5.588, 6.14], [6.153, 6.272], [6.285, 6.39], [6.403, 6.601], [6.614, 6.89], [6.903, 7.206], [7.219, 7.496], [7.509, 8.101]]}, {"kind": "s", "id": "s0_0_1", "md": "He looks shocked.", "zh": "他一脸震惊。", "sp": null, "gap": false, "start": 8.496, "end": 10.368, "words": [[8.614, 8.68], [8.693, 8.878], [8.891, 9.351]]}, {"kind": "s", "id": "s0_0_2", "md": "\"Nobody ever told me that was part of my job,\" he says, and he has a point.", "zh": "「从来没人告诉过我这是我工作的一部分。」他说，而且他说得有道理。", "sp": null, "gap": false, "start": 10.368, "end": 15.336, "words": [[10.552, 10.855], [10.934, 11.157], [11.171, , [72.723, 73.105], [73.118, 73.539], [73.552, 73.684], [73.697, 73.737], [73.75, 74.131]]}, {"kind": "s", "id": "s1_1_3", "md": "These small norms cause more ==friction== than any technical decision.", "zh": "这些小规矩引起的摩擦，比任何技术决策都多。", "sp": null, "gap": false, "start": 74.52, "end": 78.864, "words": [[74.638, 74.862], [74.875, 75.244], [75.257, 75.625], [75.638, 75.967], [75.981, 76.323], [76.336, 76.862], [76.981, 77.125], [77.257, 77.48], [77.494, 77.967], [77.981, 78.467]]}, {"kind": "s", "id": "s1_2_0", "md": "Be clear about what you will do in return.", "zh": "也要讲清楚你会怎么回报。", "sp": null, "gap": true, "start": 78.864, "end": 81.432, "words": [[78.982, 79.088], [79.101, 79.364], [79.377, 79.64], [79.653, 79.811], [79.825, 79.917], [79.93, 80.048], [80.061, 80.39], [80.403, 80.548], [80.561, 81.048]]}, {"kind": "s", "id": "s1_2_1", "md": "\"I'll give you feedback within a week of anything important, and I'll tell you early if you're __off track__.\"", "zh": "「有任何重要的事，我会在一周内给你反馈；如果你跑偏了，我会尽早告诉你。」", "sp": null, "gap": false, "start": 81.432, "end": 87.216, "words": [[81.616, 81.669], [81.669, 81.814], [81.827, 81.958], [81.971, 82.537], [82.55, 82.866], [82.879, 82.958], [82.971, 83.261], [83.274, 83.406], [83.577, 83.972], [83.985, 84.485], [84.879, 84.945], [84.958, 85.064], [85.077, 85.274], [85.287, 85.419], [85.432, 85.761], [85.774, 85.893], [85.906, 86.05], [86.064, 86.235], [86.248, 86.708]]}, {"kind": "s", "id": "s1_2_2", "md": "**Expectations work best when they run in both directions.**", "zh": "预期是双向的时候，效果最好。", "sp": null, "gap": false, "start": 87.216, "end": 91.272, "words": [[87.321, 88.111], [88.124, 88.4], [88.413, 88.874], [89.005, 89.111], [89.124, 89.255], [89.269, 89.676], [89.69, 89.808], [89.821, 90.124], [90.137, 90.874]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, __revisit them__ regularly.", "zh": "最后，定期回顾。", "sp": null, "gap": true, "start": 91.272, "end": 93.768, "words": [[91.43, 91.864], [92.18, 92.575], [92.588, 92.746], [92.759, 93. const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
