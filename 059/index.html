<script>
const D = {"id": "059", "title": "Setting Expectations Early", "meta": "B2 · 约 280 词 · 场景：明确期望", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Surprises Are Usually Late Expectations", "heading_zh": "1. 意外通常是迟到的预期", "rows": [[{"id": "s0_0_0", "md": "At the end of the year, you tell an engineer that he did not show enough ==initiative==.", "text": "At the end of the year, you tell an engineer that he did not show enough initiative.", "zh": "年底的时候，你告诉一位工程师，他主动性不够。", "sp": null}, {"id": "s0_0_1", "md": "He looks shocked.", "text": "He looks shocked.", "zh": "他一脸震惊。", "sp": null}, {"id": "s0_0_2", "md": "\"Nobody ever told me that was part of my job,\" he says, and he has a point.", "text": "\"Nobody ever told me that was part of my job,\" he says, and he has a point.", "zh": "「从来没人告诉过我这是我工作的一部分。」他说，而且他说得有道理。", "sp": null}], [{"id": "s0_1_0", "md": "Most painful performance conversations are not about bad work.", "text": "Most painful performance conversations are not about bad work.", "zh": "大多数让人难受的绩效谈话，并不是因为活干得差。", "sp": null}, {"id": "s0_1_1", "md": "They are about ==unspoken== expectations that only one side knew about.", "text": "They are about unspoken expectations that only one side knew about.", "zh": "而是因为有些预期从没说出口，只有一方知道。", "sp": null}, {"id": "s0_1_2", "md": "You assumed a senior engineer would review other people's designs; he assumed his job was to close his own tickets well.", "text": "You assumed a senior engineer would review other people's designs; he assumed his job was to close his own tickets well.", "zh": "你以为资深工程师会去 review 别人的设计；他以为自己的工作就是把自己的工单做好。", "sp": null}, {"id": "s0_1_3", "md": "**If an expectation only lives in your head, it is not an expectation; it is a trap.**", "text": "If an expectation only lives in your head, it is not an expectation; it is a trap.", "zh": "如果一个预期只存在你的脑子里，那它就不是预期，而是陷阱。", "sp": null}], [{"id": "s0_2_0", "md": "The fix is boring, and it works.", "text": "The fix is boring, and it works.", "zh": "解决办法很无聊，但管用。", "sp": null}, {"id": "s0_2_1", "md": "Say what good looks like at the beginning, in plain words, and __write it down__.", "text": "Say what good looks like at the beginning, in plain words, and write it down.", "zh": "一开始就用大白话说清楚什么叫做得好，并且写下来。", "sp": null}, {"id": "s0_2_2", "md": "It feels ==awkward== to state the obvious, but what is obvious to you is rarely obvious to everyone.", "text": "It feels awkward to state the obvious, but what is obvious to you is rarely obvious to everyone.", "zh": "把显而易见的事说出来会觉得有点别扭，但对你显而易见的东西，很少对每个人都显而易见。", "sp": null}]]}, {"heading": "2. What to Spell Out", "heading_zh": "2. 要讲明白什么", "rows": [[{"id": "s1_0_0", "md": "Start with outcomes for the first ninety days.", "text": "Start with outcomes for the first ninety days.", "zh": "从头九十天的结果说起。", "sp": null}, {"id": "s1_0_1", "md": "\"By the end of March, you own the alerting for the checkout service and have led one postmortem.\"", "text": "\"By the end of March, you own the alerting for the checkout service and have led one postmortem.\"", "zh": "「到三月底，你要负责结账服务的告警，并且主导过一次复盘。」", "sp": null}, {"id": "s1_0_2", "md": "Concrete ==milestones== are easier to discuss than adjectives like \"strong\" or \"senior.\"", "text": "Concrete milestones are easier to discuss than adjectives like \"strong\" or \"senior.\"", "zh": "具体的里程碑比「强」或「资深」这种形容词更好讨论。", "sp": null}], [{"id": "s1_1_0", "md": "Then cover the ==unwritten== rules.", "text": "Then cover the unwritten rules.", "zh": "然后，把那些不成文的规矩讲一讲。", "sp": null}, {"id": "s1_1_1", "md": "How fast should people reply in chat?", "text": "How fast should people reply in chat?", "zh": "群里消息应该多快回复？", "sp": null}, {"id": "s1_1_2", "md": "Is it fine to push back on a product manager in a meeting?", "text": "Is it fine to push back on a product manager in a meeting?", "zh": "在会上反驳产品经理可以吗？", "sp": null}, {"id": "s1_1_3", "md": "These small norms cause more ==friction== than any technical decision.", "text": "These small norms cause more friction than any technical decision.", "zh": "这些小规矩引起的摩擦，比任何技术决策都多。", "sp": null}], [{"id": "s1_2_0", "md": "Be clear about what you will do in return.", "text": "Be clear about what you will do in return.", "zh": "也要讲清楚你会怎么回报。", "sp": null}, {"id": "s1_2_1", "md": "\"I'll give you feedback within a week of anything important, and I'll tell you early if you're __off track__.\"", "text": "\"I'll give you feedback within a week of anything important, and I'll tell you early if you're off track.\"", "zh": "「有任何重要的事，我会在一周内给你反馈；如果你跑偏了，我会尽早告诉你。」", "sp": null}, {"id": "s1_2_2", "md": "**Expectations work best when they run in both directions.**", "text": "Expectations work best when they run in both directions.", "zh": "预期是双向的时候，效果最好。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __revisit them__ regularly.", "text": "Finally, revisit them regularly.", "zh": "最后，定期回顾。", "sp": null}, {"id": "s1_3_1", "md": "Priorities change, and a list from January can be ==outdated== by June.", "text": "Priorities change, and a list from January can be outdated by June.", "zh": "优先级会变，一月份列的清单到六月可能就过时了。", "sp": null}, {"id": "s1_3_2", "md": "A quick check every quarter keeps the agreement alive, and keeps year-end reviews free of surprises.", "text": "A quick check every quarter keeps the agreement alive, and keeps year-end reviews free of surprises.", "zh": "每个季度快速对一次，能让这份约定一直有效，也能让年底的绩效评估没有意外。", "sp": null}]]}], "gist": [{"q": "作者认为大多数痛苦的绩效谈话源于什么？", "a": "不是工作做得差，而是只有一方知道的、没说出口的期望；只存在你脑子里的期望是陷阱。"}, {"q": "一开始应该讲清哪些内容？", "a": "前九十天的具体成果和里程碑；不成文的规矩（聊天回复速度、能否在会上反驳 PM）；以及你作为经理会给对方什么。"}, {"q": "期望讲清之后还要做什么？", "a": "定期回顾，比如每季度检查一次，因为优先级会变，年初的清单到年中可能过时。"}], "dictation": [{"id": "s0_1_3", "text": "If an expectation only lives in your head, it is not an expectation; it is a trap."}, {"id": "s1_1_3", "text": "These small norms cause more friction than any technical decision."}, {"id": "s1_2_2", "text": "Expectations work best when they run in both directions."}, {"id": "s1_3_1", "text": "Priorities change, and a list from January can be outdated by June."}], "shadow": {"text": "The fix is boring, and it works. Say what good looks like at the beginning, in plain words, and write it down.", "marked": "The fix is <b>boring</b>, / and it <b>works</b>. //<br>Say what <b>good</b> looks like / at the <b>beginning</b>, / in <b>plain</b> words, / and <b>write</b> it down. //"}, "prompts": [{"q": "一位资深工程师刚转入你的团队。用 30 秒讲清你对他前三个月的期望，要具体到成果，而不是形容词。", "ref": "Let me be concrete about what I'm hoping to see in your first three months. By the end of March, I'd like you to own the alerting for the checkout service, and to have led at least one postmortem. I'd also like you to review designs from the two junior engineers, because that's a big part of the senior role here. In return, I'll give you feedback within a week of anything important.", "ref_zh": "我具体说一下前三个月我希望看到什么。到三月底，我希望你负责结账服务的告警，并且至少主导过一次复盘。我也希望你去 review 那两位初级工程师的设计，因为在我们这儿，这是资深岗位很重要的一部分。作为交换，有任何重要的事，我会在一周内给你反馈。", "id": "ref0"}, {"q": "团队里经常有人在会上不敢反驳 PM，事后才私下抱怨。用 30 秒在团队会上讲清这条「不成文的规矩」。", "ref": "I want to make one expectation explicit, because I don't think I've said it clearly before. If you disagree with a product decision, please say so in the meeting. You won't get in trouble for pushing back, even with senior PMs in the room. What doesn't help is agreeing in the meeting and complaining afterwards, because by then the plan is already moving.", "ref_zh": "有一个预期我想讲明白，因为我觉得之前没说清楚。如果你不同意某个产品决策，请在会上说出来。你反驳不会有任何麻烦，哪怕在座的有资深 PM。没用的是会上同意、会后抱怨，因为到那时方案已经在推进了。", "id": "ref1"}], "words": [{"w": "initiative", "ipa": "/ɪˈnɪʃətɪv/", "zh": "主动性", "ex": "She showed initiative by fixing the flaky alert without being asked.", "id": "w0"}, {"w": "unspoken", "ipa": "/ʌnˈspoʊkən/", "zh": "未说出口的", "ex": "There's an unspoken rule that nobody deploys on Friday.", "id": "w1"}, {"w": "awkward", "ipa": "/ˈɔːkwərd/", "zh": "尴尬的、别扭的", "ex": "It's a bit awkward, but we need to talk about the missed deadline.", "id": "w2"}, {"w": "milestone", const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
