<script>
const D = {"id": "081", "title": "Small Talk Before the Meeting Starts", "meta": "B2 · 约 290 词 · 场景：会前闲聊", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Two Minutes Nobody Plans For", "heading_zh": "1. 没人准备的那两分钟", "rows": [[{"id": "s0_0_0", "md": "Most people treat the first two minutes of a meeting as dead time.", "text": "Most people treat the first two minutes of a meeting as dead time.", "zh": "大多数人把会议开始前的两分钟当成垃圾时间。", "sp": null}, {"id": "s0_0_1", "md": "They check messages, stare at the agenda, or wait in silence for the last person to join.", "text": "They check messages, stare at the agenda, or wait in silence for the last person to join.", "zh": "他们刷消息、盯着议程看，或者干等着最后一个人进会。", "sp": null}, {"id": "s0_0_2", "md": "But those two minutes are often the only ==informal== contact you have with people from other teams.", "text": "But those two minutes are often the only informal contact you have with people from other teams.", "zh": "但这两分钟，往往是你和其他团队的人唯一一次非正式接触。", "sp": null}], [{"id": "s0_1_0", "md": "Nobody remembers the slides from a weekly sync.", "text": "Nobody remembers the slides from a weekly sync.", "zh": "周会上的 PPT 没人记得住。", "sp": null}, {"id": "s0_1_1", "md": "They remember who said hello, who asked about their trip, and who made them laugh.", "text": "They remember who said hello, who asked about their trip, and who made them laugh.", "zh": "大家记得的是谁打了招呼，谁问了他们出去玩得怎么样，谁把他们逗笑了。", "sp": null}, {"id": "s0_1_2", "md": "**Small talk is not a break from work; it is how people decide whether they trust you.**", "text": "Small talk is not a break from work; it is how people decide whether they trust you.", "zh": "闲聊不是工作之余的休息；人家就是靠这个来判断能不能信任你。", "sp": null}], [{"id": "s0_2_0", "md": "The problem is that many of us go blank when there is no agenda.", "text": "The problem is that many of us go blank when there is no agenda.", "zh": "问题是，一没有议程，很多人脑子就一片空白。", "sp": null}, {"id": "s0_2_1", "md": "We __wait for someone else__ to start, and the silence grows ==awkward==.", "text": "We wait for someone else to start, and the silence grows awkward.", "zh": "我们等着别人先开口，沉默越拖越尴尬。", "sp": null}, {"id": "s0_2_2", "md": "The fix is not to become more ==outgoing==.", "text": "The fix is not to become more outgoing.", "zh": "解决办法不是让自己变得更外向。", "sp": null}, {"id": "s0_2_3", "md": "The fix is to have a simple pattern ready before you walk in.", "text": "The fix is to have a simple pattern ready before you walk in.", "zh": "而是进门之前，心里先备好一个简单的套路。", "sp": null}]]}, {"heading": "2. Notice, Ask, Add", "heading_zh": "2. 观察、提问、补一句", "rows": [[{"id": "s1_0_0", "md": "First, notice something small and ==neutral== that everyone shares.", "text": "First, notice something small and neutral that everyone shares.", "zh": "第一步，注意到一件大家都有份的、不起眼又不敏感的小事。", "sp": null}, {"id": "s1_0_1", "md": "It could be the weather, the coffee machine, or the fact that it is Friday.", "text": "It could be the weather, the coffee machine, or the fact that it is Friday.", "zh": "可以是天气、咖啡机，或者今天是周五。", "sp": null}, {"id": "s1_0_2", "md": "\"Everyone looks a bit tired today, long week?\" is enough to __get the ball rolling__.", "text": "\"Everyone looks a bit tired today, long week?\" is enough to get the ball rolling.", "zh": "「今天大家看着都有点累啊，这周挺长的吧？」这一句就足够把话头打开了。", "sp": null}], [{"id": "s1_1_0", "md": "Next, ask a question that is easy to answer.", "text": "Next, ask a question that is easy to answer.", "zh": "第二步，问一个好回答的问题。", "sp": null}, {"id": "s1_1_1", "md": "\"Did you end up going to that concert?\" works better than \"How are you?\", because it shows you __paid attention__ and gives the other person something ==concrete== to say.", "text": "\"Did you end up going to that concert?\" works better than \"How are you?\", because it shows you paid attention and gives the other person something concrete to say.", "zh": "「那场演唱会你最后去了吗？」比「最近怎么样？」好用，因为它说明你上了心，也让对方有具体的东西可聊。", "sp": null}], [{"id": "s1_2_0", "md": "Then add one small detail about yourself.", "text": "Then add one small detail about yourself.", "zh": "第三步，补一句关于自己的小细节。", "sp": null}, {"id": "s1_2_1", "md": "If they say the concert was great, you can say, \"Nice, I've been meaning to see them live.\"", "text": "If they say the concert was great, you can say, \"Nice, I've been meaning to see them live.\"", "zh": "如果对方说演唱会特别棒，你可以说：「真好，我一直想去看他们的现场。」", "sp": null}, {"id": "s1_2_2", "md": "**One question and one detail are enough to turn a silent room into a warm one.**", "text": "One question and one detail are enough to turn a silent room into a warm one.", "zh": "一个问题加一个细节，就能把一屋子的冷场变得热乎起来。", "sp": null}], [{"id": "s1_3_0", "md": "When the host starts the meeting, let the chat go.", "text": "When the host starts the meeting, let the chat go.", "zh": "主持人一开始开会，就别再聊了。", "sp": null}, {"id": "s1_3_1", "md": "You do not need to finish the story.", "text": "You do not need to finish the story.", "zh": "你不需要把故事讲完。", "sp": null}, {"id": "s1_3_2", "md": "A quick \"Let's __pick this up__ later\" leaves the door open, and people will ==associate== you with that small, friendly moment.", "text": "A quick \"Let's pick this up later\" leaves the door open, and people will associate you with that small, friendly moment.", "zh": "一句「回头再接着聊」，给后面留了个口子，大家也会把你和那个轻松友好的小片刻联系在一起。", "sp": null}]]}], "gist": [{"q": "作者怎么看会议开始前的那两分钟？", "a": "不是空白时间，而是和其他组同事唯一的非正式接触；人们正是通过闲聊决定是否信任你。"}, {"q": "作者说冷场的解决办法是什么？", "a": "不是让自己变得更外向，而是进门前准备好一个简单的套路。"}, {"q": "文中的套路有哪几步？", "a": "Notice 注意一个大家共有的中性小事；Ask 问一个好回答的具体问题；Add 补一句关于自己的小细节；会议开始就自然收住，约“回头再聊”。"}], "dictation": [{"id": "s0_1_2", "text": "Small talk is not a break from work; it is how people decide whether they trust you."}, {"id": "s0_2_3", "text": "The fix is to have a simple pattern ready before you walk in."}, {"id": "s1_1_0", "text": "Next, ask a question that is easy to answer."}, {"id": "s1_2_2", "text": "One question and one detail are enough to turn a silent room into a warm one."}], "shadow": {"text": "Then add one small detail about yourself. If they say the concert was great, you can say, \"Nice, I've been meaning to see them live.\" One question and one detail are enough to turn a silent room into a warm one.", "marked": "Then <b>add</b> one small <b>detail</b> / about <b>yourself</b>. //<br>If they say the concert was <b>great</b>, / you can say, / \"<b>Nice</b>, I've been <b>meaning</b> to see them <b>live</b>.\" //<br><b>One</b> question / and <b>one</b> detail / are enough to turn a <b>silent</b> room / into a <b>warm</b> one. //"}, "prompts": [{"q": "周一部门会你提前进了会议室，只有一位伦敦办公室的同事在，他上周刚休假回来。用 Notice, Ask, Add 和他闲聊 30 秒。", "ref": "Morning! You look pretty relaxed, so I guess the holiday did its job? I remember you said you were heading to Portugal. Did you make it to Lisbon in the end? Nice. I've been meaning to go there for years, mostly for the food. Let's grab a coffee after this and you can tell me where to eat.", "ref_zh": "早啊！你看着挺放松的，假期效果不错吧？我记得你说要去葡萄牙。最后去成里斯本了吗？真好。我想去那儿好多年了，主要是冲着吃的。会后一起喝杯咖啡，你给我推荐几家馆子。", "id": "ref0"}, {"q": "线上会议大家都开着摄像头等主持人，场面很安静。你来打破沉默，30 秒。", "ref": "Hi everyone, it's quiet today, are we all saving our energy for Friday? Priya, I saw your post about the half marathon last weekend. How did it go? That's impressive. I tried running outdoors in Singapore once and the humidity defeated me in ten minutes. Okay, looks like we're all here, let's pick this up after the call.", "ref_zh": "大家好，今天挺安静啊，是都在给周五攒电吗？Priya，我看到你发的上周末半马的动态了。跑得怎么样？太厉害了。我在新加坡试过一次户外跑，十分钟就被湿度打败了。好，看样子人都到齐了，这个我们会后再接着聊。", "id": "ref1"}], "words": [{"w": "informal", "ipa": "/ɪnˈfɔːrməl/", "zh": "非正式的", "ex": "Most of our real decisions start in informal chats, not in meetings.", "id": "w0"}, {"w": "awkward", "ipa": "/ˈɔːkwərd/", "zh": "尴尬的、别扭的", "ex": "There was an awkward pause after he asked about the budget.", "id": "w1"}, {"w": "outgoing", "ipa": "/ˈaʊtˌɡoʊɪŋ/", "zh": "外向的、爱社交的", "ex": "You don't have to be outgoing to be good at small talk.", "id": "w2"}, {"w": "neutral", "ipa": "/ˈnuːtrəl/", "zh": "中性的、不 function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;

}

async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
