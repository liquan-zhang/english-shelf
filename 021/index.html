<script>
const D = {"id": "021", "title": "What Makes a Good Design Review", "meta": "B2 · 约 280 词 · 场景：设计评审", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Diagram Is Not the Design", "heading_zh": "1. 架构图不等于设计", "rows": [[{"id": "s0_0_0", "md": "Most design reviews spend forty minutes on __boxes and arrows__.", "text": "Most design reviews spend forty minutes on boxes and arrows.", "zh": "大多数设计评审会花四十分钟在框框和箭头上。", "sp": null}, {"id": "s0_0_1", "md": "Someone asks why the queue is drawn on the left, and someone else suggests a different name for the cache.", "text": "Someone asks why the queue is drawn on the left, and someone else suggests a different name for the cache.", "zh": "有人问队列为什么画在左边，又有人建议给缓存换个名字。", "sp": null}, {"id": "s0_0_2", "md": "The meeting ends, everyone feels ==productive==, and the hard questions were never asked.", "text": "The meeting ends, everyone feels productive, and the hard questions were never asked.", "zh": "会开完了，大家都觉得挺有成效，可真正难的问题一个都没问。", "sp": null}], [{"id": "s0_1_0", "md": "A diagram shows what the system looks like.", "text": "A diagram shows what the system looks like.", "zh": "架构图展示的是系统长什么样。", "sp": null}, {"id": "s0_1_1", "md": "A design is the set of decisions behind it, and the ==assumptions== those decisions rest on.", "text": "A design is the set of decisions behind it, and the assumptions those decisions rest on.", "zh": "设计则是背后的一系列决策，以及这些决策所依赖的假设。", "sp": null}, {"id": "s0_1_2", "md": "**A good review tests the assumptions, because that is where designs usually break.**", "text": "A good review tests the assumptions, because that is where designs usually break.", "zh": "好的评审要去检验这些假设，因为设计通常就是在这里出问题的。", "sp": null}], [{"id": "s0_2_0", "md": "So before the meeting, the author should __spell out__ the three decisions that matter most.", "text": "So before the meeting, the author should spell out the three decisions that matter most.", "zh": "所以开会之前，作者应该把最关键的三个决策讲清楚。", "sp": null}, {"id": "s0_2_1", "md": "Why build a new service instead of extending the old one?", "text": "Why build a new service instead of extending the old one?", "zh": "为什么要新建一个服务，而不是在老服务上扩展？", "sp": null}, {"id": "s0_2_2", "md": "Why accept eventual ==consistency== instead of strong consistency?", "text": "Why accept eventual consistency instead of strong consistency?", "zh": "为什么接受最终一致性，而不是强一致性？", "sp": null}, {"id": "s0_2_3", "md": "Each decision should come with the option that was rejected and the reason.", "text": "Each decision should come with the option that was rejected and the reason.", "zh": "每个决策都要附上被否掉的方案和否掉的理由。", "sp": null}]]}, {"heading": "2. Three Questions for Reviewers", "heading_zh": "2. 评审人该问的三个问题", "rows": [[{"id": "s1_0_0", "md": "As a reviewer, your job is not to redesign the system in the room.", "text": "As a reviewer, your job is not to redesign the system in the room.", "zh": "作为评审人，你的任务不是在会上把系统重新设计一遍。", "sp": null}, {"id": "s1_0_1", "md": "It is to __poke holes in__ the thinking while changes are still cheap.", "text": "It is to poke holes in the thinking while changes are still cheap.", "zh": "而是趁改动成本还低的时候，去挑思路里的漏洞。", "sp": null}, {"id": "s1_0_2", "md": "Three questions do most of the work.", "text": "Three questions do most of the work.", "zh": "三个问题就能解决大部分事情。", "sp": null}], [{"id": "s1_1_0", "md": "First, what happens when this part fails?", "text": "First, what happens when this part fails?", "zh": "第一，这部分挂了会怎样？", "sp": null}, {"id": "s1_1_1", "md": "Ask about timeouts, retries, and what the user sees when a ==dependency== is down.", "text": "Ask about timeouts, retries, and what the user sees when a dependency is down.", "zh": "问问超时、重试，以及依赖挂掉时用户会看到什么。", "sp": null}, {"id": "s1_1_2", "md": "If the answer is \"it won't fail,\" you have found your first ==gap==.", "text": "If the answer is \"it won't fail,\" you have found your first gap.", "zh": "如果回答是「它不会挂」，那你就找到第一个漏洞了。", "sp": null}], [{"id": "s1_2_0", "md": "Second, what does this look like at ten times the traffic?", "text": "Second, what does this look like at ten times the traffic?", "zh": "第二，流量涨到十倍会是什么样？", "sp": null}, {"id": "s1_2_1", "md": "You are not asking the author to build for that scale today.", "text": "You are not asking the author to build for that scale today.", "zh": "你不是要作者现在就按那个量级去建。", "sp": null}, {"id": "s1_2_2", "md": "You are checking whether the design __paints the team into a corner__ later.", "text": "You are checking whether the design paints the team into a corner later.", "zh": "你是在确认这个设计以后会不会把团队逼进死胡同。", "sp": null}], [{"id": "s1_3_0", "md": "Third, how will we know it is working?", "text": "Third, how will we know it is working?", "zh": "第三，我们怎么知道它运行正常？", "sp": null}, {"id": "s1_3_1", "md": "A design without metrics, alerts, and a ==rollback== plan is only half finished.", "text": "A design without metrics, alerts, and a rollback plan is only half finished.", "zh": "一个没有指标、告警和回滚方案的设计，只完成了一半。", "sp": null}, {"id": "s1_3_2", "md": "**If you leave with a list of decisions and open risks, it was a good review, even if nobody moved a single box.**", "text": "If you leave with a list of decisions and open risks, it was a good review, even if nobody moved a single box.", "zh": "如果散会时你手里有一份决策清单和待解决的风险，那就是一次好的评审，哪怕没人挪动过一个框。", "sp": null}]]}], "gist": [{"q": "作者认为很多设计评审的问题出在哪里？", "a": "把时间花在框和箭头（图本身）上，真正难的问题没人问；图不等于设计，设计是背后的决策和假设。"}, {"q": "评审前作者应该准备什么？", "a": "讲清楚最重要的三个决策，每个决策附上被否掉的方案和理由。"}, {"q": "评审者可以问哪三个问题？", "a": "这部分挂了会怎样；流量涨到十倍会怎样；我们怎么知道它运转正常（指标、告警、回滚方案）。"}], "dictation": [{"id": "s0_1_2", "text": "A good review tests the assumptions, because that is where designs usually break."}, {"id": "s0_1_1", "text": "A design is the set of decisions behind it, and the assumptions those decisions rest on."}, {"id": "s0_2_3", "text": "Each decision should come with the option that was rejected and the reason."}, {"id": "s1_3_2", "text": "If you leave with a list of decisions and open risks, it was a good review, even if nobody moved a single box."}], "sha const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());

function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
