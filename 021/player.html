<script>
const D = {"id": "021", "title": "What Makes a Good Design Review", "meta": "B2 · 约 280 词 · 场景：设计评审", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Diagram Is Not the Design", "heading_zh": "1. 架构图不等于设计", "rows": [[{"id": "s0_0_0", "md": "Most design reviews spend forty minutes on __boxes and arrows__.", "text": "Most design reviews spend forty minutes on boxes and arrows.", "zh": "大多数设计评审会花四十分钟在框框和箭头上。", "sp": null}, {"id": "s0_0_1", "md": "Someone asks why the queue is drawn on the left, and someone else suggests a different name for the cache.", "text": "Someone asks why the queue is drawn on the left, and someone else suggests a different name for the cache.", "zh": "有人问队列为什么画在左边，又有人建议给缓存换个名字。", "sp": null}, {"id": "s0_0_2", "md": "The meeting ends, everyone feels ==productive==, and the hard questions were never asked.", "text": "The meeting ends, everyone feels productive, and the hard questions were never asked.", "zh": "会开完了，大家都觉得挺有成效，可真正难的问题一个都没问。", "sp": null}], [{"id": "s0_1_0", "md": "A diagram shows what the system looks like.", "text": "A diagram shows what the system looks like.", "zh": "架构图展示的是系统长什么样。", "sp": null}, {"id": "s0_1_1", "md": "A design is the set of decisions behind it, and the ==assumptions== those decisions rest on.", "text": "A design is the set of decisions behind it, and the assumptions those decisions rest on.", "zh": "设计则是背后的一系列决策，以及这些决策所依赖的假设。", "sp": null}, {"id": "s0_1_2", "md": "**A good review tests the assumptions, because that is where designs usually break.**", "text": "A good review tests the assumptions, because that is where designs usually break.", "zh": "好的评审要去检验这些假设，因为设计通常就是在这里出问题的。", "sp": null}], [{"id": "s0_2_0", "md": "So before the meeting, the author should __spell out__ the three decisions that matter most.", "text": "So before the meeting, the author should spell out the three decisions that matter most.", "zh": "所以开会之前，作者应该把最关键的三个决策讲清楚。", "sp": null}, {"id": "s0_2_1", "md": "Why build a new service instead of extending the old one?", "text": "Why build a new service instead of extending the old one?", "zh": "为什么要新建一个服务，而不是在老服务上扩展？", "sp": null}, {"id": "s0_2_2", "md": "Why accept eventual ==consistency== instead of strong consistency?", "text": "Why accept eventual consistency instead of strong consistency?", "zh": "为什么接受最终一致性，而不是强一致性？", "sp": null}, {"id": "s0_2_3", "md": "Each decision should come with the option that was rejected and the reason.", "text": "Each decision should come with the option that was rejected and the reason.", "zh": "每个决策都要附上被否掉的方案和否掉的理由。", "sp": null}]]}, {"heading": "2. Three Questions for Reviewers", "heading_zh": "2. 评审人该问的三个问题", "rows": [[{"id": "s1_0_0", "md": "As a reviewer, your job is not to redesign the system in the room.", "text": "As a reviewer, your job is not to redesign the system in the room.", "zh": "作为评审人，你的任务不是在会上把系统重新设计一遍。", "sp": null}, {"id": "s1_0_1", "md": "It is to __poke holes in__ the thinking while changes are still cheap.", "text": "It is to poke holes in the thinking while changes are still cheap.", "zh": "而是趁改动成本还低的时候，去挑思路里的漏洞。", "sp": null}, {"id": "s1_0_2", "md": "Three questions do most of the work.", "text": "Three questions do most of the work.", "zh": "三个问题就能解决大部分事情。", "sp": null}], [{"id": "s1_1_0", "md": "First, what happens when this part fails?", "text": "First, what happens when this part fails?", "zh": "第一，这部分挂了会怎样？", "sp": null}, {"id": "s1_1_1", "md": "Ask about timeouts, retries, and what the user sees when a ==dependency== is down.", "text": "Ask about timeouts, retries, and what the user sees when a dependency is down.", "zh": "问问超时、重试，以及依赖挂掉时用户会看到什么。", "sp": null}, {"id": "s1_1_2", "md": "If the answer is \"it won't fail,\" you have found your first ==gap==.", "text": "If the answer is \"it won't fail,\" you have found your first gap.", "zh": "如果回答是「它不会挂」，那你就找到第一个漏洞了。", "sp": null}], [{"id": "s1_2_0", "md": "Second, what does this look like at ten times the traffic?", "text": "Second, what does this look like at ten times the traffic?", "zh": "第二，流量涨到十倍会是什么样？", "sp": null}, {"id": "s1_2_1", "md": "You are not asking the author to build for that scale today.", "text": "You are not asking the author to build for that scale today.", "zh": "你不是要作者现在就按那个量级去建。", "sp": null}, {"id": "s1_2_2", "md": "You are checking whether the design __paints the team into a corner__ later.", "text": "You are checking whether the design paints the team into a corner later.", "zh": "你是在确认这个设计以后会不会把团队逼进死胡同。", "sp": null}], [{"id": "s1_3_0", "md": "Third, how will we know it is working?", "text": "Third, how will we know it is working?", "zh": "第三，我们怎么知道它运行正常？", "sp": null}, {"id": "s1_3_1", "md": "A design without metrics, alerts, and a ==rollback== plan is only half finished.", "text": "A design without metrics, alerts, and a rollback plan is only half finished.", "zh": "一个没有指标、告警和回滚方案的设计，只完成了一半。", "sp": null}, {"id": "s1_3_2", "md": "**If you leave with a list of decisions and open risks, it was a good review, even if nobody moved a single box.**", "text": "If you leave with a list of decisions and open risks, it was a good review, even if nobody moved a single box.", "zh": "如果散会时你手里有一份决策清单和待解决的风险，那就是一次好的评审，哪怕没人挪动过一个框。", "sp": null}]]}], "gist": [{"q": "作者认为很多设计评审的问题出在哪里？", "a": "把时间花在框和箭头（图本身）上，真正难的问题没人问；图不等于设计，设计是背后的决策和假设。"}, {"q": "评审前作者应该准备什么？", "a": "讲清楚最重要的三个决策，每个决策附上被否掉的方案和理由。"}, {"q": "评审者可以问哪三个问题？", "a": "这部分挂了会怎样；流量涨到十倍会怎样；我们怎么知道它运转正常（指标、告警、回滚方案）。"}], "dictation": [{"id": "s0_1_2", "text": "A good review tests the assumptions, because that is where designs usually break."}, {"id": "s0_1_1", "text": "A design is the set of decisions behind it, and the assumptions those decisions rest on."}, {"id": "s0_2_3", "text": "Each decision should come with the option that was rejected and the reason."}, {"id": "s1_3_2", "text": "If you leave with a list of decisions and open risks, it was a good review, even if nobody moved a single box."}], "sha ", "zh": "作为评审人，你的任务不是在会上把系统重新设计一遍。", "sp": null, "gap": false, "start": 51.384, "end": 55.68, "words": [[51.489, 51.608], [51.621, 51.66], [51.673, 52.226], [52.647, 52.739], [52.752, 53.095], [53.173, 53.279], [53.292, 53.581], [53.595, 53.752], [53.766, 54.318], [54.331, 54.41], [54.423, 54.818], [54.831, 54.897], [54.91, 54.976], [54.989, 55.292]]}, {"kind": "s", "id": "s1_0_1", "md": "It is to __poke holes in__ the thinking while changes are still cheap.", "zh": "而是趁改动成本还低的时候，去挑思路里的漏洞。", "sp": null, "gap": false, "start": 55.68, "end": 59.376, "words": [[55.785, 55.864], [55.877, 55.983], [55.996, 56.101], [56.114, 56.43], [56.443, 56.746], [56.759, 56.838], [56.851, 56.93], [56.943, 57.404], [57.562, 57.733], [57.746, 58.18], [58.193, 58.298], [58.312, 58.588], [58.601, 58.983]]}, {"kind": "s", "id": "s1_0_2", "md": "Three questions do most of the work.", "zh": "三个问题就能解决大部分事情。", "sp": null, "gap": false, "start": 59.376, "end": 61.776, "words": [[59.521, 59.692], [59.705, 60.231], [60.244, 60.455], [60.468, 60.837], [60.85, 60.902], [60.915, 60.994], [61.008, 61.376]]}, {"kind": "s", "id": "s1_1_0", "md": "First, what happens when this part fails?", "zh": "第一，这部分挂了会怎样？", "sp": null, "gap": true, "start": 61.776, "end": 64.512, "words": [[61.934, 62.302], [62.565, 62.684], [62.697, 63.079], [63.092, 63.223], [63.237, 63.355], [63.368, 63.605], [63.618, 64.131]]}, {"kind": "s", "id": "s1_1_1", "md": "Ask about timeouts, retries, and what the user sees when a ==dependency== is down.", "zh": "问问超时、重试，以及依赖挂掉时用户会看到什么。", "sp": null, "gap": false, "start": 64.512, "end": 70.104, "words": [[64.604, 64.841], [64.854, 65.117], [65.13, 65.907], [66.104, 66.92], [67.13, 67.262], [67.275, 67.433], [67.446, 67.499], [67.512, 67.933], [67.946, 68.328], [68.341, 68.459], [68.473, 68.525], [68.538, 69.17], [69.183, 69.315], [69.328, 69.709]]}, {"kind": "s", "id": "s1_1_2", "md": "If the answer is \"it won't fail,\" you have found your first ==gap==.", "zh": "如果回答是「它不会挂」，那你就找到第一 const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
