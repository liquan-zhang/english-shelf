const D = {"id": "103", "type": "dialogue", "title": "Checking In at the Airport", "meta": "B2 · 约 310 词 · 场景：机场值机、行李超重与转机", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Check-in Agent", "name_zh": "值机柜台", "voice": "en-GB-SoniaNeural"}}, "gist": [{"q": "第一个箱子出了什么问题？「你」怎么处理的？", "a": "超重了，三十一公斤，额度是二十三公斤；「你」没付超重费，把东西挪到了较轻的第二个箱子里。"}, {"q": "行李能直挂到成都吗？为什么？", "a": "不能。上海是入境第一站，要在上海提行李、过海关。"}, {"q": "如果赶不上转机怎么办？柜台帮了什么忙？", "a": "两段是同一张票，航空公司会免费改签下一班；柜台给行李贴了优先标签，还告诉了中转柜台的位置。"}], "dictation": [{"id": "s0_6_0", "text": "Oh, I see. What would it cost for the extra weight?"}, {"id": "s0_10_0", "text": "Could we sit together, ideally near the front of the plane?"}, {"id": "s1_0_0", "text": "One more question. Will our bags go all the way through to Chengdu?"}, {"id": "s1_2_0", "text": "But our layover is only seventy minutes. That sounds really tight. What happens if we miss the connection?"}], "shadow": {"speaker": "A", "text": "But our layover is only seventy minutes. That sounds really tight. What happens if we miss the connection?", "marked": "But our <b>layover</b> / is only <b>seventy</b> minutes. //<br>That sounds <b>really</b> tight. //<br>What happens / if we <b>miss</b> the connection? //"}, "prompts": [{"q": "你带孩子出行，行李里有一个儿童安全座椅，想问值机柜台能不能免费托运，以及能不能带上飞机用。", "ref": "Hi, quick question before we check in. We're travelling with a car seat for our son. Can we check it in for free, or does it count as one of our bags? And if there's an empty seat next to us, would we be allowed to bring it on board and use it? He sleeps much better in it.", "ref_zh": "你好，值机前想问一下。我们带了一个儿童安全座椅。能免费托运吗，还是要算作一件行李？如果我们旁边有空座，能带上飞机用吗？他坐在里面睡得好很多。", "id": "ref0"}, {"q": "航班延误三个小时，你会赶不上下一程。到柜台问能不能改签，以及有没有餐券或休息室。", "ref": "Hi, our flight to Shanghai has been delayed by three hours, so we'll definitely miss our connection to Chengdu. Could you rebook us on a later flight today? There are three of us, including a small child. Also, is there a meal voucher or a lounge we could use while we wait? It's going to be a long afternoon.", "ref_zh": "你好，我们飞上海的航班延误了三个小时，肯定赶不上转去成都的那班了。能帮我们改签今天晚一点的航班吗？我们三个人，有一个小孩。另外等的时候有餐券或者休息室可以用吗？这个下午会很漫长。", "id": "ref1"}], "words": [{"w": "stroller", "ipa": "/ˈstroʊlər/", "zh": "婴儿推车", "ex": "Can we take the stroller up to the gate?", "id": "w0"}, {"w": "scale", "ipa": "/skeɪl/", "zh": "秤", "ex": "Please put your bag on the scale.", "id": "w1"}, {"w": "allowance", "ipa": "/əˈlaʊəns/", "zh": "（行李）额度", "ex": "My baggage allowance is thirty kilos.", "id": "w2"}, {"w": "customs", "ipa": "/ˈkʌstəmz/", "zh": "海关", "ex": "It took us an hour to get through customs.", "id": "w3"}, {"w": "layover", "ipa": "/ˈleɪoʊvər/", "zh": "中转停留", "ex": "We have a two-hour layover in Hong Kong.", "tts": "We have a two hour layover in Hong Kong.", "id": "w4"}, {"w": "miss the connection", "ipa": "/mɪs ðə kəˈnekʃən/", "zh": "赶不上转机", "ex": "If the flight is late, we'll miss the connection.", "id": "w5"}, {"w": "rebook", "ipa": "/ˌriːˈbʊk/", "zh": "改签", "ex": "The airline rebooked us on the next flight.", "id": "w6"}, {"w": "transfer", "ipa": "/ˈtrænsfɜːr/", "zh": "中转", "ex": "Follow the signs to the transfer desk.", "id": "w7"}, {"w": "boarding pass", "ipa": "/ˈbɔːrdɪŋ pæs/", "zh": "登机牌", "ex": "Please have your boarding pass ready.", "id": "w8"}], "sections": [{"heading": "1. At the Check-in Counter", "heading_zh": "1. 在值机柜台", "rows": [[{"id": "s0_0_0", "md": "Good morning. Where are you flying to today?", "text": "Good morning. Where are you flying to today?", "zh": "早上好。今天飞哪里？", "sp": "B"}], [{"id": "s0_1_0", "md": "Morning. We're flying to Shanghai, then __connecting to__ Chengdu. It's me, my wife and our son.", "text": "Morning. We're flying to Shanghai, then connecting to Chengdu. It's me, my wife and our son.", "zh": "早上好。我们飞上海，再转机去成都。我、我太太和我儿子三个人。", "sp": "A"}], [{"id": "s0_2_0", "md": "Could I see all three passports, please? And are you checking in any bags?", "text": "Could I see all three passports, please? And are you checking in any bags?", "zh": "麻烦给我看一下三本护照。有行李要托运吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "Yes, two suitcases and a ==stroller==. Can we keep the stroller until the gate?", "text": "Yes, two suitcases and a stroller. Can we keep the stroller until the gate?", "zh": "有，两个箱子和一辆婴儿推车。推车能推到登机口再托运吗？", "sp": "A"}], [{"id": "s0_4_0", "md": "Of course, I'll give you a gate tag for it. Could you put the first suitcase on the ==scale==?", "text": "Of course, I'll give you a gate tag for it. Could you put the first suitcase on the scale?", "zh": "当然可以，我给您一张登机口托运的标签。请把第一个箱子放到秤上。", "sp": "B"}], [{"id": "s0_5_0", "md": "I'm afraid this one is thirty-one kilos. The ==allowance== is twenty-three per bag.", "text": "I'm afraid this one is thirty-one kilos. The allowance is twenty-three per bag.", "zh": "这个恐怕有三十一公斤。每件额度是二十三公斤。", "sp": "B"}], [{"id": "s0_6_0", "md": "**Oh, I see. What would it cost for the extra weight?**", "text": "Oh, I see. What would it cost for the extra weight?", "zh": "哦，这样。超重部分要多少钱？", "sp": "A"}], [{"id": "s0_7_0", "md": "About one hundred and fifty dollars. Or you could move a few things into the other bag.", "text": "About one hundred and fifty dollars. Or you could move a few things into the other bag.", "zh": "大概一百五十块。或者您可以挪一些东西到另一个箱子里。", "sp": "B"}], [{"id": "s0_8_0", "md": "Let me __move some things over__. The second one is quite light.", "text": "Let me move some things over. The second one is quite light.", "zh": "我挪一点过去吧。第二个箱子挺轻的。", "sp": "A"}], [{"id": "s0_9_0", "md": "Perfect, they're both under the limit now. Would you like to choose your seats?", "text": "Perfect, they're both under the limit now. Would you like to choose your seats?", "zh": "好了，现在两个都没超。您要选座位吗？", "sp": "B"}], [{"id": "s0_10_0", "md": "**Could we sit together, ideally near the front of the plane?**", "text": "Could we sit together, ideally near the front of the plane?", "zh": "我们能坐在一起吗？最好靠前一点。", "sp": "A"}], [{"id": "s0_11_0", "md": "I have three together in row twelve, with a window. Shall I take those?", "text": "I have three together in row twelve, with a window. Shall I take those?", "zh": "第十二排有三个连座，带窗。给您选这个？", "sp": "B"}], [{"id": "s0_12_0", "md": "Yes, please. That's great.", "text": "Yes, please. That's great.", "zh": "好的，太好了。", "sp": "A"}]]}, {"heading": "2. A Tight Connection", "heading_zh": "2. 转机时间太紧", "rows": [[{"id": "s1_0_0", "md": "**One more question. Will our bags go all the way through to Chengdu?**", "text": "One more question. Will our bags go all the way through to Chengdu?", "zh": "还有个问题。我们的行李能直挂到成都吗？", "sp": "A"}], [{"id": "s1_1_0", "md": "Since Shanghai is your first stop in China, you'll need to collect your bags and clear ==customs== there.", "text": "Since Shanghai is your first stop in China, you'll need to collect your bags and clear customs there.", "zh": "因为上海是你们入境中国的第一站，需要在那边提行李、过海关。", "sp": "B"}], [{"id": "s1_2_0", "md": "But our ==layover== is only seventy minutes. That sounds really tight. What happens if we __miss the connection__?", "text": "But our layover is only seventy minutes. That sounds really tight. What happens if we miss the connection?", "zh": "可我们中转只有七十分钟，听起来很紧。要是赶不上转机怎么办？", "sp": "A"}], [{"id": "s1_3_0", "md": "Both flights are on one ticket, so the airline will ==rebook== you on the next flight at no cost.", "text": "Both flights are on one ticket, so the airline will rebook you on the next flight at no cost.", "zh": "两段航班是同一张票，所以航空公司会免费给你们改签到下一班。", "sp": "B"}], [{"id": "s1_4_0", "md": "That's a relief. Is there anything we can do to __save time__?", "text": "That's a relief. Is there anything we can do to save time?", "zh": "那就放心了。有什么办法能节省点时间吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "I'll tag your bags as priority, so they come out first. And being near the front will help.", "text": "I'll tag your bags as priority, so they come out first. And being near the front will help.", "zh": "我给你们的行李贴优先标签，会先出来。坐得靠前也有帮助。", "sp": "B"}], [{" const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
