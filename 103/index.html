const D = {"id": "103", "type": "dialogue", "title": "Checking In at the Airport", "meta": "B2 · 约 310 词 · 场景：机场值机、行李超重与转机", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Check-in Agent", "name_zh": "值机柜台", "voice": "en-GB-SoniaNeural"}}, "gist": [{"q": "第一个箱子出了什么问题？「你」怎么处理的？", "a": "超重了，三十一公斤，额度是二十三公斤；「你」没付超重费，把东西挪到了较轻的第二个箱子里。"}, {"q": "行李能直挂到成都吗？为什么？", "a": "不能。上海是入境第一站，要在上海提行李、过海关。"}, {"q": "如果赶不上转机怎么办？柜台帮了什么忙？", "a": "两段是同一张票，航空公司会免费改签下一班；柜台给行李贴了优先标签，还告诉了中转柜台的位置。"}], "dictation": [{"id": "s0_6_0", "text": "Oh, I see. What would it cost for the extra weight?"}, {"id": "s0_10_0", "text": "Could we sit together, ideally near the front of the plane?"}, {"id": "s1_0_0", "text": "One more question. Will our bags go all the way through to Chengdu?"}, {"id": "s1_2_0", "text": "But our layover is only seventy minutes. That sounds really tight. What happens if we miss the connection?"}], "shadow": {"speaker": "A", "text": "But our layover is only seventy minutes. That sounds really tight. What happens if we miss the connection?", "marked": "But our <b>layover</b> / is only <b>seventy</b> minutes. //<br>That sounds <b>really</b> tight. //<br>What happens / if we <b>miss</b> the connection? //"}, "prompts": [{"q": "你带孩子出行，行李里有一个儿童安全座椅，想问值机柜台能不能免费托运，以及能不能带上飞机用。", "ref": "Hi, quick question before we check in. We're travelling with a car seat for our son. Can we check it in for free, or does it count as one of our bags? And if there's an empty seat next to us, would we be allowed to bring it on board and use it? He sleeps much better in it.", "ref_zh": "你好，值机前想问一下。我们带了一个儿童安全座椅。能免费托运吗，还是要算作一件行李？如果我们旁边有空座，能带上飞机用吗？他坐在里面睡得好很多。", "id": "ref0"}, {"q": "航班延误三个小时，你会赶不上下一程。到柜台问能不能改签，以及有没有餐券或休息室。", "ref": "Hi, our flight to Shanghai has been delayed by three hours, so we'll definitely miss our connection to Chengdu. Could you rebook us on a later flight today? There are three of us, including a small child. Also, is there a meal voucher or a lounge we could use while we wait? It's going to be a long afternoon.", "ref_zh": "你好，我们飞上海的航班延误了三个小时，肯定赶不上转去成都的那班了。能帮我们改签今天晚一点的航班吗？我们三个人，有一个小孩。另外等的时候有餐券或者休息室可以用吗？这个下午会很漫长。", "id": "ref1"}], "words": [{"w": "stroller", "ipa": "/ˈstroʊlər/", "zh": "婴儿推车", "ex": "Can we take the stroller up to the gate?", "id": "w0"}, {"w": "scale", "ipa": "/skeɪl/", "zh": "秤", "ex": "Please put your bag on the scale.", "id": "w1"}, {"w": "allowance", "ipa": "/əˈlaʊəns/", "zh": "（行李）额度", "ex": "My baggage allowance is thirty kilos.", "id": "w2"}, {"w": "customs", "ipa": "/ˈkʌstəmz/", "zh": "海关", "ex": "It took us an hour to get through customs.", "id": "w3"}, {"w": "layover", "ipa": "/ˈleɪoʊvər/", "zh": "中转停留", "ex": "We have a two-hour layover in Hong Kong.", "tts": "We have a two hour layover in Hong Kong.", "id": "w4"}, {"w": "miss the connection", "ipa": "/mɪs ðə kəˈnekʃən/", "zh": "赶不上转机", "ex": "If the flight is late, we'll miss the connection.", "id": "w5"}, {"w": "rebook", "ipa": "/ˌriːˈbʊk/", "zh": "改签", "ex": "The airline rebooked us on the next flight.", "id": "w6"}, {"w": "transfer", "ipa": "/ˈtrænsfɜːr/", "zh": "中转", "ex": "Follow the signs to the transfer desk.", "id": "w7"}, {"w": "boarding pass", "ipa": "/ˈbɔːrdɪŋ pæs/", "zh": "登机牌", "ex": "Please have your boarding pass ready.", "id": "w8"}], "sections": [{"heading": "1. At the Check-in Counter", "heading_zh": "1. 在值机柜台", "rows": [[{"id": "s0_0_0", "md": "Good morning. Where are you flying to today?", "text": "Good morning. Where are you flying to today?", "zh": "早上好。今天飞哪里？", "sp": "B"}], [{"id": "s0_1_0", "md": "Morning. We're flying to Shanghai, then __connecting to__ Chengdu. It's me, my wife and our son.", "text": "Morning. We're flying to Shanghai, then connecting to Chengdu. It's me, my wife and our son.", "zh": "早上好。我们飞上海，再转机去成都。我、我太太和我儿子三个人。", "sp": "A"}], [{"id": "s0_2_0", "md": "Could I see all three passports, please? And are you checking in any bags?", "text": "Could I see all three passports, please? And are you checking in any bags?", "zh": "麻烦给我看一下三本护照。有行李要托运吗？", "sp": "B"}], [{"id": "s0_3_0", "md": "Yes, two suitcases and a ==stroller==. Can we keep the stroller until the gate?", "text": "Yes, two suitcases and a stroller. Can we keep the stroller until the gate?", "zh": "有，两个箱子和一辆婴儿推车。推车能推到登机口再托运吗？", "sp": "A"}], [{"id": "s0_4_0", "md": "Of course, I'll give you a gate tag for it. Could you put the first suitcase on the ==scale==?", "text": "Of course, I'll give you a gate tag for it. Could you put the first suitcase on the scale?", "zh": "当然可以，我给您一张登机口托运的标签。请把第一个箱子放到秤上。", "sp": "B"}], [{"id": "s0_5_0", "md": "I'm afraid this one is thirty-one kilos. The ==allowance== is twenty-three per bag.", "text": "I'm afraid this one is thirty-one kilos. The allowance is twenty-three per bag.", "zh": "这个恐怕有三十一公斤。每件额度是二十三公斤。", "sp": "B"}], [{"id": "s0_6_0", "md": "**Oh, I see. What would it cost for the extra weight?**", "text": "Oh, I see. What would it cost for the extra weight?", "zh": "哦，这样。超重部分要多少钱？", "sp": "A"}], [{"id": "s0_7_0", "md": "About one hundred and fifty dollars. Or you could move a few things into the other bag.", "text": "About one hundred and fifty dollars. Or you could move a few things into the other bag.", "zh": "大概一百五十块。或者您可以挪一些东西到另一个箱子里。", "sp": "B"}], [{"id": "s0_8_0", "md": "Let me __move some things over__. The second one is quite light.", "text": "Let me move some things over. The second one is quite light.", "zh": "我挪一点过去吧。第二个箱子挺轻的。", "sp": "A"}], [{"id": "s0_9_0", "md": "Perfect, they're both under the limit now. Would you like to choose your seats?", "text": "Perfect, they're both under the limit now. Would you like to choose your seats?", "zh": "好了，现在两个都没超。您要选座位吗？", "sp": "B"}], [{"id": "s0_10_0", "md": "**Could we sit together, ideally near the front of the plane?**", "text": "Could we sit together, ideally near the front of the plane?", "zh": "我们能坐在一起吗？最好靠前一点。", "sp": "A"}], [{"id": "s0_11_0", "md": "I have three together in row twelve, with a window. Shall I take those?", "text": "I have three together in row twelve, with a window. Shall I take those?", "zh": "第十二排有三个连座，带窗。给您选这个？", "sp": "B"}], [{"id": "s0_12_0", "md": "Yes, please. That's great.", "text": "Yes, please. That's great.", "zh": "好的，太好了。", "sp": "A"}]]}, {"heading": "2. A Tight Connection", "heading_zh": "2. 转机时间太紧", "rows": [[{"id": "s1_0_0", "md": "**One more question. Will our bags go all the way through to Chengdu?**", "text": "One more question. Will our bags go all the way through to Chengdu?", "zh": "还有个问题。我们的行李能直挂到成都吗？", "sp": "A"}], [{"id": "s1_1_0", "md": "Since Shanghai is your first stop in China, you'll need to collect your bags and clear ==customs== there.", "text": "Since Shanghai is your first stop in China, you'll need to collect your bags and clear customs there.", "zh": "因为上海是你们入境中国的第一站，需要在那边提行李、过海关。", "sp": "B"}], [{"id": "s1_2_0", "md": "But our ==layover== is only seventy minutes. That sounds really tight. What happens if we __miss the connection__?", "text": "But our layover is only seventy minutes. That sounds really tight. What happens if we miss the connection?", "zh": "可我们中转只有七十分钟，听起来很紧。要是赶不上转机怎么办？", "sp": "A"}], [{"id": "s1_3_0", "md": "Both flights are on one ticket, so the airline will ==rebook== you on the next flight at no cost.", "text": "Both flights are on one ticket, so the airline will rebook you on the next flight at no cost.", "zh": "两段航班是同一张票，所以航空公司会免费给你们改签到下一班。", "sp": "B"}], [{"id": "s1_4_0", "md": "That's a relief. Is there anything we can do to __save time__?", "text": "That's a relief. Is there anything we can do to save time?", "zh": "那就放心了。有什么办法能节省点时间吗？", "sp": "A"}], [{"id": "s1_5_0", "md": "I'll tag your bags as priority, so they come out first. And being near the front will help.", "text": "I'll tag your bags as priority, so they come out first. And being near the front will help.", "zh": "我给你们的行李贴优先标签，会先出来。坐得靠前也有帮助。", "sp": "B"}], [{" const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  h('div', {}, ...D.dictation.map((d, i) => {

        h('button', { onclick: () => {
          const r = diff(d.text, ta.value);
          out.replaceChildren(...r.words.flatMap(([w, ok]) => [h('span', { class: ok ? 'hit' : 'miss' }, w), ' ']),
            h('span', { class: 'score' }, `${r.pct}%`));
        } }, '核对')),
      ta, out);
  }))));

// 3 intensive listening
const intensive = h('div', { class: 'hide' });
for (const sec of D.sections) {
  intensive.append(h('h3', {}, sec.heading));
  sec.rows.forEach((para, pi) => {
    if (pi && !para[0].sp) intensive.append(h('div', { class: 'para-gap' }));
    for (const s of para) {
      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
