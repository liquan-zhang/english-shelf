<script>
const D = {"id": "009", "title": "Saying I Don't Know Without Losing Credibility", "meta": "B2 · 约 280 词 · 场景：回答问题", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Two Engineers, One Question", "heading_zh": "1. 两个工程师，同一个问题", "rows": [[{"id": "s0_0_0", "md": "Imagine two engineers being asked the same thing in a review.", "text": "Imagine two engineers being asked the same thing in a review.", "zh": "想象两个工程师在评审会上被问了同一个问题。", "sp": null}, {"id": "s0_0_1", "md": "\"How many users will this migration affect?\"", "text": "\"How many users will this migration affect?\"", "zh": "「这次迁移会影响多少用户？」", "sp": null}, {"id": "s0_0_2", "md": "The first one answers right away with a confident number.", "text": "The first one answers right away with a confident number.", "zh": "第一个张口就给了一个很自信的数字。", "sp": null}, {"id": "s0_0_3", "md": "The second says, \"I don't know yet, but I can find out by tomorrow.\"", "text": "The second says, \"I don't know yet, but I can find out by tomorrow.\"", "zh": "第二个说：「我现在还不知道，但明天之前能查清楚。」", "sp": null}], [{"id": "s0_1_0", "md": "A week later, the first number turns out to be wrong by a factor of ten.", "text": "A week later, the first number turns out to be wrong by a factor of ten.", "zh": "一周后，第一个数字被发现差了十倍。", "sp": null}, {"id": "s0_1_1", "md": "From then on, people quietly double-check everything that engineer says.", "text": "From then on, people quietly double-check everything that engineer says.", "zh": "从那以后，那个工程师说的每句话，大家都会悄悄再核实一遍。", "sp": null}, {"id": "s0_1_2", "md": "The second engineer, meanwhile, has become the person whose answers people __take at face value__.", "text": "The second engineer, meanwhile, has become the person whose answers people take at face value.", "zh": "而第二个工程师，成了那个说什么大家都直接信的人。", "sp": null}], [{"id": "s0_2_0", "md": "**Credibility does not come from always knowing; it comes from being right about what you know.**", "text": "Credibility does not come from always knowing; it comes from being right about what you know.", "zh": "信誉不是来自什么都知道，而是来自你对自己知道的东西判断准确。", "sp": null}, {"id": "s0_2_1", "md": "Leaders learn very quickly whose ==confidence== is ==calibrated== and whose is just a performance.", "text": "Leaders learn very quickly whose confidence is calibrated and whose is just a performance.", "zh": "领导很快就能看出来，谁的自信是有分寸的，谁的只是在表演。", "sp": null}, {"id": "s0_2_2", "md": "A ==bluff== might save you for one meeting, but it costs you the next ten.", "text": "A bluff might save you for one meeting, but it costs you the next ten.", "zh": "硬撑也许能帮你混过一个会，但接下来十个会都要还。", "sp": null}]]}, {"heading": "2. Make Not Knowing Sound Useful", "heading_zh": "2. 让「不知道」听起来也有用", "rows": [[{"id": "s1_0_0", "md": "The trick is to never stop at \"I don't know.\"", "text": "The trick is to never stop at \"I don't know.\"", "zh": "诀窍是永远别停在「我不知道」上。", "sp": null}, {"id": "s1_0_1", "md": "**Follow it with what you do know, how you will find out, and when.**", "text": "Follow it with what you do know, how you will find out, and when.", "zh": "后面要接上你知道什么、你打算怎么查、什么时候给答复。", "sp": null}, {"id": "s1_0_2", "md": "\"I don't have the exact number, but it's only users on the old app version, and I'll pull the figure from the logs by noon.\"", "text": "\"I don't have the exact number, but it's only users on the old app version, and I'll pull the figure from the logs by noon.\"", "zh": "「具体数字我手上没有，但只涉及老版本 app 的用户，中午前我从日志里把数拉出来。」", "sp": null}], [{"id": "s1_1_0", "md": "It also helps to __put a number on your certainty__.", "text": "It also helps to put a number on your certainty.", "zh": "给你的把握程度报个数也很有帮助。", "sp": null}, {"id": "s1_1_1", "md": "\"I'm fairly sure it's under ten percent, maybe seventy percent ==confident==.\"", "text": "\"I'm fairly sure it's under ten percent, maybe seventy percent confident.\"", "zh": "「我比较确定在百分之十以下，大概七成把握。」", "sp": null}, {"id": "s1_1_2", "md": "This sounds ==precise== even when the answer is rough, and it tells people how much weight to give it.", "text": "This sounds precise even when the answer is rough, and it tells people how much weight to give it.", "zh": "哪怕答案很粗略，这样说听起来也很精确，还能让大家知道这个答案该信几分。", "sp": null}], [{"id": "s1_2_0", "md": "If the question is outside your area, __point to the right person__ instead of guessing.", "text": "If the question is outside your area, point to the right person instead of guessing.", "zh": "如果问题超出了你的范围，就指给对的人，别瞎猜。", "sp": null}, {"id": "s1_2_1", "md": "\"That's really a question for the data team, I'll ==loop in== Anna.\"", "text": "\"That's really a question for the data team, I'll loop in Anna.\"", "zh": "「这个其实得问数据团队，我把 Anna 拉进来。」", "sp": null}], [{"id": "s1_3_0", "md": "Finally, close the gap you opened.", "text": "Finally, close the gap you opened.", "zh": "最后，把你留下的口子补上。", "sp": null}, {"id": "s1_3_1", "md": "Send the real answer when you promised, even if nobody reminds you.", "text": "Send the real answer when you promised, even if nobody reminds you.", "zh": "在你承诺的时间把真实答案发出去，哪怕没人提醒你。", "sp": null}, {"id": "s1_3_2", "md": "Each time you do this, the words \"I don't know\" become a little more ==trustworthy==.", "text": "Each time you do this, the words \"I don't know\" become a little more trustworthy.", "zh": "每这样做一次，你说「我不知道」时就更值得信任一点。", "sp": null}]]}], "gist": [{"q": "两位工程师的例子说明了什么？", "a": "随口给出错误数字的人从此被人怀疑；坦诚说“不知道但明天给你”的人反而赢得信任。"}, {"q": "作者认为可信度从哪里来？", "a": "不是永远都知道答案，而是对自己知道的部分判断准确，信心与实际相符。"}, {"q": "说“不知道”之后应该补充什么？", "a": "说出已知部分、怎么查、什么时候给答案；给出把握程度；不是自己领域就指向对的人；按时兑现承诺。"}], "dictation": [{"id": "s0_2_0", "text": "Credibility does not come from always knowing; it comes from being right about what you know."}, {"id": "s1_0_1", "text": "Follow it with what you do know, how you will find out, and when."}, {"id": "s0_2_2", "text": "A bluff might save you for one meeting, but it costs you the next ten."}, {"id": "s1_3_1", "text": "Send the real answer when you promised, even if nobody reminds you."}], "shadow": {"text": "The trick is to never stop at \"I don't know.\" Follow it with what you do know, how you will find out, and when.", "marked": "The <b>trick</b> / is to <b>never</b> stop at / \"I <b>don't</b> know.\" //<br>Follow it with what you <b>do</b> know, / <b>how</b> you will find out, / and <b>when</b>. //"}, "prompts": [{"q": "评审会上，总监问你：“这次数据库迁移会让多少请求变慢？”你没有确切数字。用 30 秒回答：说已知部分、把握程度、怎么查、什么时候给结果。", "ref": "I don't have an exact number yet. What I do know is that only the reporting queries touch the old tables, and those are a small share of our traffic. My best guess is under five percent of requests, and I'd say I'm about seventy percent confident in that. I'll run a replay test this afternoon and send you the real figure by tomorrow morning.", "ref_zh": "我现在还没有确切的数字。我知道的是，只有报表查询会碰到老表，而这部分只占我们流量的一小块。我最好的估计是不到百分之五的请求，大概有七成把握。今天下午我跑一个回放测试，明早之前把准确数字发给你。", "id": "ref0"}, {"q": "客户沟通会上，有人问你一个法务合规的问题，不在你的领域。用 30 秒不丢面子地说不知道，并指向对的人。", "ref": "That's a great question, and I don't want to give you a half-right answer on something this important. Data retention rules are really owned by our legal and privacy team. What I can tell you is that the system supports deleting user data on request. I'll loop in our privacy lead today, and we'll come back to you with a written answer this week.", "ref_zh": "这个问题很好，这么重要的事，我不想给你一个半对不对的答案。数据保留的规则其实归法务和隐私团队管。我能告诉你的是，系统支持按用户请求删除数据。我今天就把隐私负责人拉进来，这周内给你一个书面答复。", "id": "ref1"}], "words": [{"w": "confidence", "ipa": "/ˈkɑːnfɪdəns/", "zh": "信心、把握", "ex": "We have high confidence in the fix, but we'll keep monitoring.", "id": "w0"}, {"w": "calibrated", "ipa": "/ˈkæləˌbreɪtɪd/", "zh": "（判断）校准过的、与实际相符的", "ex": "His estimates are well calibrated; when he says two weeks, it's two weeks.", "id": "w1"}, {"w": "bluff (n.)", "ipa": "/blʌf/", "zh": "虚张声势", "ex": "The confident answer was a bluff, and the logs proved it.", "tts_w": "bluff", "id": "w2"}, {"w": "confident", "ipa": "/ˈkɑːnfɪdənt/", "zh": "有把握的", "ex": "I'm confident the cache is warm before peak hours.", "id": "w3"}, {"w": "precise", "ipa": "/prɪˈsaɪs/", "zh": "精确的 const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();

const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {

  return h('span', { class: 'ctl' }, p, l);
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
