<script>
const D = {"id": "009", "title": "Saying I Don't Know Without Losing Credibility", "meta": "B2 · 约 280 词 · 场景：回答问题", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Two Engineers, One Question", "heading_zh": "1. 两个工程师，同一个问题", "rows": [[{"id": "s0_0_0", "md": "Imagine two engineers being asked the same thing in a review.", "text": "Imagine two engineers being asked the same thing in a review.", "zh": "想象两个工程师在评审会上被问了同一个问题。", "sp": null}, {"id": "s0_0_1", "md": "\"How many users will this migration affect?\"", "text": "\"How many users will this migration affect?\"", "zh": "「这次迁移会影响多少用户？」", "sp": null}, {"id": "s0_0_2", "md": "The first one answers right away with a confident number.", "text": "The first one answers right away with a confident number.", "zh": "第一个张口就给了一个很自信的数字。", "sp": null}, {"id": "s0_0_3", "md": "The second says, \"I don't know yet, but I can find out by tomorrow.\"", "text": "The second says, \"I don't know yet, but I can find out by tomorrow.\"", "zh": "第二个说：「我现在还不知道，但明天之前能查清楚。」", "sp": null}], [{"id": "s0_1_0", "md": "A week later, the first number turns out to be wrong by a factor of ten.", "text": "A week later, the first number turns out to be wrong by a factor of ten.", "zh": "一周后，第一个数字被发现差了十倍。", "sp": null}, {"id": "s0_1_1", "md": "From then on, people quietly double-check everything that engineer says.", "text": "From then on, people quietly double-check everything that engineer says.", "zh": "从那以后，那个工程师说的每句话，大家都会悄悄再核实一遍。", "sp": null}, {"id": "s0_1_2", "md": "The second engineer, meanwhile, has become the person whose answers people __take at face value__.", "text": "The second engineer, meanwhile, has become the person whose answers people take at face value.", "zh": "而第二个工程师，成了那个说什么大家都直接信的人。", "sp": null}], [{"id": "s0_2_0", "md": "**Credibility does not come from always knowing; it comes from being right about what you know.**", "text": "Credibility does not come from always knowing; it comes from being right about what you know.", "zh": "信誉不是来自什么都知道，而是来自你对自己知道的东西判断准确。", "sp": null}, {"id": "s0_2_1", "md": "Leaders learn very quickly whose ==confidence== is ==calibrated== and whose is just a performance.", "text": "Leaders learn very quickly whose confidence is calibrated and whose is just a performance.", "zh": "领导很快就能看出来，谁的自信是有分寸的，谁的只是在表演。", "sp": null}, {"id": "s0_2_2", "md": "A ==bluff== might save you for one meeting, but it costs you the next ten.", "text": "A bluff might save you for one meeting, but it costs you the next ten.", "zh": "硬撑也许能帮你混过一个会，但接下来十个会都要还。", "sp": null}]]}, {"heading": "2. Make Not Knowing Sound Useful", "heading_zh": "2. 让「不知道」听起来也有用", "rows": [[{"id": "s1_0_0", "md": "The trick is to never stop at \"I don't know.\"", "text": "The trick is to never stop at \"I don't know.\"", "zh": "诀窍是永远别停在「我不知道」上。", "sp": null}, {"id": "s1_0_1", "md": "**Follow it with what you do know, how you will find out, and when.**", "text": "Follow it with what you do know, how you will find out, and when.", "zh": "后面要接上你知道什么、你打算怎么查、什么时候给答复。", "sp": null}, {"id": "s1_0_2", "md": "\"I don't have the exact number, but it's only users on the old app version, and I'll pull the figure from the logs by noon.\"", "text": "\"I don't have the exact number, but it's only users on the old app version, and I'll pull the figure from the logs by noon.\"", "zh": "「具体数字我手上没有，但只涉及老版本 app 的用户，中午前我从日志里把数拉出来。」", "sp": null}], [{"id": "s1_1_0", "md": "It also helps to __put a number on your certainty__.", "text": "It also helps to put a number on your certainty.", "zh": "给你的把握程度报个数也很有帮助。", "sp": null}, {"id": "s1_1_1", "md": "\"I'm fairly sure it's under ten percent, maybe seventy percent ==confident==.\"", "text": "\"I'm fairly sure it's under ten percent, maybe seventy percent confident.\"", "zh": "「我比较确定在百分之十以下，大概七成把握。」", "sp": null}, {"id": "s1_1_2", "md": "This sounds ==precise== even when the answer is rough, and it tells people how much weight to give it.", "text": "This sounds precise even when the answer is rough, and it tells people how much weight to give it.", "zh": "哪怕答案很粗略，这样说听起来也很精确，还能让大家知道这个答案该信几分。", "sp": null}], [{"id": "s1_2_0", "md": "If the question is outside your area, __point to the right person__ instead of guessing.", "text": "If the question is outside your area, point to the right person instead of guessing.", "zh": "如果问题超出了你的范围，就指给对的人，别瞎猜。", "sp": null}, {"id": "s1_2_1", "md": "\"That's really a question for the data team, I'll ==loop in== Anna.\"", "text": "\"That's really a question for the data team, I'll loop in Anna.\"", "zh": "「这个其实得问数据团队，我把 Anna 拉进来。」", "sp": null}], [{"id": "s1_3_0", "md": "Finally, close the gap you opened.", "text": "Finally, close the gap you opened.", "zh": "最后，把你留下的口子补上。", "sp": null}, {"id": "s1_3_1", "md": "Send the real answer when you promised, even if nobody reminds you.", "text": "Send the real answer when you promised, even if nobody reminds you.", "zh": "在你承诺的时间把真实答案发出去，哪怕没人提醒你。", "sp": null}, {"id": "s1_3_2", "md": "Each time you do this, the words \"I don't know\" become a little more ==trustworthy==.", "text": "Each time you do this, the words \"I don't know\" become a little more trustworthy.", "zh": "每这样做一次，你说「我不知道」时就更值得信任一点。", "sp": null}]]}], "gist": [{"q": "两位工程师的例子说明了什么？", "a": "随口给出错误数字的人从此被人怀疑；坦诚说“不知道但明天给你”的人反而赢得信任。"}, {"q": "作者认为可信度从哪里来？", "a": "不是永远都知道答案，而是对自己知道的部分判断准确，信心与实际相符。"}, {"q": "说“不知道”之后应该补充什么？", "a": "说出已知部分、怎么查、什么时候给答案；给出把握程度；不是自己领域就指向对的人；按时兑现承诺。"}], "dictation": [{"id": "s0_2_0", "text": "Credibility does not come from always knowing; it comes from being right about what you know."}, {"id": "s1_0_1", "text": "Follow it with what you do know, how you will find out, and when."}, {"id": "s0_2_2", "text": "A bluff might save you for one meeting, but it costs you the next ten."}, {"id": "s1_3_1", "text": "Send the real answer when you promised, even if nobody reminds you."}], "shadow": {"text": "The trick is to never stop at \"I don't know.\" Follow it with what you do know, how you will find out, and when.", "marked": "The <b>trick</b> / is to <b>never</b> stop at / \"I <b>don't</b> know.\" //<br>Follow it with what you <b>do</b> know, / <b>how</b> you will find out, / and <b>when</b>. //"}, "prompts": [{"q": "评审会上，总监问你：“这次数据库迁移会让多少请求变慢？”你没有确切数字。用 30 秒回答：说已知部分、把握程度、怎么查、什么时候给结果。", "ref": "I don't have an exact number yet. What I do know is that only the reporting queries touch the old tables, and those are a small share of our traffic. My best guess is under five percent of requests, and I'd say I'm about seventy percent confident in that. I'll run a replay test this afternoon and send you the real figure by tomorrow morning.", "ref_zh": "我现在还没有确切的数字。我知道的是，只有报表查询会碰到老表，而这部分只占我们流量的一小块。我最好的估计是不到百分之五的请求，大概有七成把握。今天下午我跑一个回放测试，明早之前把准确数字发给你。", "id": "ref0"}, {"q": "客户沟通会上，有人问你一个法务合规的问题，不在你的领域。用 30 秒不丢面子地说不知道，并指向对的人。", "ref": "That's a great question, and I don't want to give you a half-right answer on something this important. Data retention rules are really owned by our legal and privacy team. What I can tell you is that the system supports deleting user data on request. I'll loop in our privacy lead today, and we'll come back to you with a written answer this week.", "ref_zh": "这个问题很好，这么重要的事，我不想给你一个半对不对的答案。数据保留的规则其实归法务和隐私团队管。我能告诉你的是，系统支持按用户请求删除数据。我今天就把隐私负责人拉进来，这周内给你一个书面答复。", "id": "ref1"}], "words": [{"w": "confidence", "ipa": "/ˈkɑːnfɪdəns/", "zh": "信心、把握", "ex": "We have high confidence in the fix, but we'll keep monitoring.", "id": "w0"}, {"w": "calibrated", "ipa": "/ˈkæləˌbreɪtɪd/", "zh": "（判断）校准过的、与实际相符的", "ex": "His estimates are well calibrated; when he says two weeks, it's two weeks.", "id": "w1"}, {"w": "bluff (n.)", "ipa": "/blʌf/", "zh": "虚张声势", "ex": "The confident answer was a bluff, and the logs proved it.", "tts_w": "bluff", "id": "w2"}, {"w": "confident", "ipa": "/ˈkɑːnfɪdənt/", "zh": "有把握的", "ex": "I'm confident the cache is warm before peak hours.", "id": "w3"}, {"w": "precise", "ipa": "/prɪˈsaɪs/", "zh": "精确的 ": "哪怕答案很粗略，这样说听起来也很精确，还能让大家知道这个答案该信几分。", "sp": null, "gap": false, "start": 73.176, "end": 78.72, "words": [[73.281, 73.452], [73.465, 73.742], [73.755, 74.347], [74.505, 74.729], [74.742, 74.86], [74.873, 74.952], [74.965, 75.373], [75.387, 75.505], [75.518, 75.926], [76.347, 76.4], [76.413, 76.505], [76.518, 76.808], [76.821, 77.137], [77.15, 77.308], [77.321, 77.531], [77.544, 77.794], [77.808, 77.887], [77.9, 78.136], [78.15, 78.334]]}, {"kind": "s", "id": "s1_2_0", "md": "If the question is outside your area, __point to the right person__ instead of guessing.", "zh": "如果问题超出了你的范围，就指给对的人，别瞎猜。", "sp": null, "gap": true, "start": 78.72, "end": 83.808, "words": [[78.825, 78.93], [78.944, 79.023], [79.036, 79.523], [79.667, 79.825], [79.838, 80.299], [80.312, 80.444], [80.457, 80.825], [81.207, 81.496], [81.509, 81.588], [81.602, 81.694], [81.707, 81.97], [81.983, 82.457], [82.575, 82.917], [82.931, 83.009], [83.023, 83.43]]}, {"kind": "s", "id": "s1_2_1", "md": "\"That's really a question for the data team, I'll ==loop in== Anna.\"", "zh": "「这个其实得问数据团队，我把 Anna 拉进来。」", "sp": null, "gap": false, "start": 83.808, "end": 87.408, "words": [[84.005, 84.071], [84.15, 84.413], [84.426, 84.479], [84.492, 84.913], [84.926, 85.019], [85.032, 85.111], [85.124, 85.361], [85.374, 85.703], [86.124, 86.242], [86.255, 86.479], [86.492, 86.611], [86.624, 86.979]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, close the gap you opened.", "zh": "最后，把你留下的口子补上。", "sp": null, "gap": true, "start": 87.408, "end": 87.768, "words": [[87.566, 88.0], [88.276, 88.566], [88.579, 88.671], [88.684, 88.934], null, null]}, {"kind": "s", "id": "s1_3_1", "md": "Send the real answer when you promised, even if nobody reminds you.", "zh": "在你承诺的时间把真实答案发出去，哪怕没人提醒你。", "sp": null, "gap": false, "start": 87.768, "end": 92.28, "words": [[87.873, 88.097], [88.11, 88.202], [88.215, 88.636], [88.65, 89.044], [89.057, 89.189], [89.202, 89.294], [89.307, 89.952], [90.36, 90.558], [90.571, 90.689], [90.702, 91.1 const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
