<script>
const D = {"id": "049", "title": "Building Trust Before You Need It", "meta": "B2 · 约 260 词 · 场景：跨团队关系", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Trust Works Like a Bank Account", "heading_zh": "1. 信任就像一个银行账户", "rows": [[{"id": "s0_0_0", "md": "The worst time to meet the database team is during an outage at midnight.", "text": "The worst time to meet the database team is during an outage at midnight.", "zh": "认识数据库团队最糟糕的时机，就是半夜出故障的时候。", "sp": null}, {"id": "s0_0_1", "md": "You need them urgently, they have never heard your name, and every question sounds like a ==demand==.", "text": "You need them urgently, they have never heard your name, and every question sounds like a demand.", "zh": "你急着要找他们，他们从没听过你的名字，你问的每个问题听起来都像是在提要求。", "sp": null}, {"id": "s0_0_2", "md": "Even good engineers become careful and slow with strangers.", "text": "Even good engineers become careful and slow with strangers.", "zh": "再好的工程师，面对陌生人也会变得谨慎、动作变慢。", "sp": null}], [{"id": "s0_1_0", "md": "Think of trust as a bank account.", "text": "Think of trust as a bank account.", "zh": "把信任想象成一个银行账户。", "sp": null}, {"id": "s0_1_1", "md": "Every kept promise, shared insight, or small favor is a ==deposit==.", "text": "Every kept promise, shared insight, or small favor is a deposit.", "zh": "每一次兑现承诺、分享洞察、帮个小忙，都是一笔存款。", "sp": null}, {"id": "s0_1_2", "md": "Every urgent request is a ==withdrawal==.", "text": "Every urgent request is a withdrawal.", "zh": "每一个紧急请求都是一次取款。", "sp": null}, {"id": "s0_1_3", "md": "**If you only show up when you need something, your account is always empty.**", "text": "If you only show up when you need something, your account is always empty.", "zh": "如果你只在有求于人的时候才出现，你的账户永远是空的。", "sp": null}], [{"id": "s0_2_0", "md": "The good news is that deposits are cheap.", "text": "The good news is that deposits are cheap.", "zh": "好消息是，存款很便宜。", "sp": null}, {"id": "s0_2_1", "md": "They take minutes, not weeks, and they ==compound== over time.", "text": "They take minutes, not weeks, and they compound over time.", "zh": "只需要几分钟，而不是几周，而且会随着时间复利增长。", "sp": null}, {"id": "s0_2_2", "md": "You just have to make them when nothing is on fire.", "text": "You just have to make them when nothing is on fire.", "zh": "你只需要在没出事的时候去存。", "sp": null}]]}, {"heading": "2. Small Deposits That Add Up", "heading_zh": "2. 积少成多的小额存款", "rows": [[{"id": "s1_0_0", "md": "Start by keeping small promises ==precisely==.", "text": "Start by keeping small promises precisely.", "zh": "先从精确地兑现小承诺开始。", "sp": null}, {"id": "s1_0_1", "md": "If you say you will send the logs by three, send them by three.", "text": "If you say you will send the logs by three, send them by three.", "zh": "如果你说三点前发日志，那就三点前发。", "sp": null}, {"id": "s1_0_2", "md": "People judge your big commitments by how you handle the tiny ones.", "text": "People judge your big commitments by how you handle the tiny ones.", "zh": "别人是根据你怎么处理小事，来判断你的大承诺靠不靠谱的。", "sp": null}], [{"id": "s1_1_0", "md": "Next, share information before anyone asks.", "text": "Next, share information before anyone asks.", "zh": "接着，在别人开口之前就主动同步信息。", "sp": null}, {"id": "s1_1_1", "md": "If your team plans a change that will __double the traffic__ to their service, tell them a month ahead, not the day before.", "text": "If your team plans a change that will double the traffic to their service, tell them a month ahead, not the day before.", "zh": "如果你们团队计划做一个会让他们服务流量翻倍的改动，提前一个月告诉他们，而不是前一天。", "sp": null}, {"id": "s1_1_2", "md": "That kind of early warning is rare, and people __remember who gave it__.", "text": "That kind of early warning is rare, and people remember who gave it.", "zh": "这种提前预警很少见，人们会记住是谁给的。", "sp": null}], [{"id": "s1_2_0", "md": "Show up when they are in trouble, too.", "text": "Show up when they are in trouble, too.", "zh": "他们遇到麻烦的时候，你也要出现。", "sp": null}, {"id": "s1_2_1", "md": "When their system has an incident, offer a dashboard, a theory, or simply __an extra pair of eyes__.", "text": "When their system has an incident, offer a dashboard, a theory, or simply an extra pair of eyes.", "zh": "他们的系统出故障时，主动提供一个 dashboard、一个猜测，或者只是多一双眼睛帮着看。", "sp": null}, {"id": "s1_2_2", "md": "**Helping in their crisis is the fastest way to earn help in yours.**", "text": "Helping in their crisis is the fastest way to earn help in yours.", "zh": "在他们危机时出手相助，是你在自己危机时得到帮助的最快方式。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, make the relationship personal in a ==professional== way.", "text": "Finally, make the relationship personal in a professional way.", "zh": "最后，以职业的方式让关系变得私人一点。", "sp": null}, {"id": "s1_3_1", "md": "A short coffee chat, a thank-you in their channel, or a question about their roadmap all count.", "text": "A short coffee chat, a thank-you in their channel, or a question about their roadmap all count.", "zh": "一次简短的咖啡聊天、在他们群里说声谢谢、问问他们的 roadmap，这些都算。", "sp": null}, {"id": "s1_3_2", "md": "None of this is ==manipulation==; it is simply what good colleagues do when there is nothing to gain yet.", "text": "None of this is manipulation; it is simply what good colleagues do when there is nothing to gain yet.", "zh": "这些都不是在耍手段；这只是好同事在还没有任何好处可图的时候会做的事。", "sp": null}]]}], "gist": [{"q": "作者用什么比喻来描述信任？", "a": "银行账户：守住的承诺、分享的信息、小忙是存款，紧急求助是取款；只在需要时出现，账户永远是空的。"}, {"q": "作者建议的「小额存款」有哪些？", "a": "精确兑现小承诺；主动提前同步会影响对方的变更；对方出事故时去帮忙；喝咖啡、公开感谢、关心对方路线图。"}, {"q": "为什么要在平时而不是出事时建立信任？", "a": "出事时对方不认识你，每个问题都像命令；平时存款成本低、会累积，危机时才取得出来。"}], "dictation": [{"id": "s0_1_3", "text": "If you only show up when you need something, your account is always empty."}, {"id": "s1_0_2", "text": "People judge your big commitments by how you handle the tiny ones."}, {"id": "s1_2_2", "text": "Helping in their crisis is the fastest way to earn help in yours."}, {"id": "s1_0_1", "text": "If you say you will send the logs by three, send them by three."}], "shadow": {"text": "Think of trust as a bank account. Every kept promise, shared insight, or small favor is a deposit. Every urgent request is a withdrawal.", "marked": "Think of <b>trust</b> / as a <b>bank account</b>. //<br>Every <b>kept</b> promise, / <b>shared</b> insight, / or <b>small</b> favor / is a <b>deposit</b>. //<br>Every <b>urgent</b> request / is a <b>withdrawal</b>. //"}, "prompts": [{"q": "你们下个月要做一个营销活动，预计会让风控团队的服务流量翻倍。用 30 秒提前给对方负责人打个招呼。", "ref": "Hi Lena, nothing urgent, I just wanted to give you an early heads-up. Next month we're running a campaign that could roughly double the calls to your risk service for about a week. I'll share our traffic forecast once it's ready. Is there anything you'd need from us to prepare, like load test data or a contact on call during the campaign?", "ref_zh": "Lena 你好，不着急，只是想提前跟你打个招呼。下个月我们要做一个活动，大概有一周时间，打到你们风控服务的调用量可能会翻一倍左右。流量预估出来后我会发给你。你们需要我们提供什么来做准备吗？比如压测数据，或者活动期间我们这边 on-call 的联系人？", "id": "ref0"}, {"q": "另一个团队正在处理一个线上事故，和你们没直接关系。用 30 秒在他们的事故频道里主动提供帮助。", "ref": "Hi all, sorry you're dealing with this. We saw a similar spike in connection errors last month, and it turned out to be a pool size setting after a config change. Not sure it's the same thing, but I can share the dashboard we used to find it. If an extra pair of eyes would help, I'm free for the next hour.", "ref_zh": "大家好，辛苦了。我们上个月也遇到过类似的连接错误突增，最后发现是一次配置变更后连接池大小设置的问题。不确定是不是同一回事，但我可以把我们当时用来定位的 dashboard 分享出来。如果需要多一双眼睛帮忙看，接下来一个小时我都有空。", "id": "ref1"}], "words": [{"w": "demand", "ipa": "/dɪˈmænd/", "zh": "要求、强求", "ex": "Phrase it as a question so it doesn't sound like a demand.", "id": "w0"}, {"w": "deposit", "ipa": "/dɪˈpɑːzɪt/", "zh": "存款", "ex": "Every on-time delivery is a deposit in your trust account.", "id": "w1"}, {"w": "withdrawal", "ipa": "/wɪðˈdrɔːəl/", "zh": "取款、撤回", "ex": "Asking them to work the weekend is a big withdrawal.", "id": "w2"}, {"w": "compound (v.)", "ipa": "/kəmˈpaʊnd/", "zh": "复利般累积", "ex": "Small improvements in test speed compound over a year.", "tts_w": "compound", "id": "w3"}, {"w": "precisely", "ipa": "/prɪˈsaɪsli/", "zh": "精确地、恰好", "ex": "The job failed precisely when the backup started.", "id": "w4"}, {"w": "professional", "ipa": "/prəˈfeʃənl/", "zh": "职业的、得体的", "ex": "Keep the incident channel professional, even under pressure.", "id": "w5"}, {"w": "manipulation", "ipa": "/məˌnɪpjuˈleɪʃən/", "zh": "操纵", "ex": "Sharing data early isn't manipulation; it's good planning.", "id": "w6"}, {"w": "incident", "ipa": "/ˈɪnsɪdənt/", "zh": "事故", "ex": "We opened an incident as soon as the error rate passed the threshold.", "id": "w7"}, {"w": "insight", "ipa": "/ˈɪnsaɪt/", "zh": "洞察、见解", "ex": "Her insight into the query planner saved us a week.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Trust Works Like a Bank Account", "zh": "1. 信任就像一个银行账户", "start": 0.0, "end": 2.616, "words": [[0.105, 0.303], [0.684, 1.026], [1.039, 1.289], [1.303, 1.447], [1.461, 1.526], [1.539, 1.803], [1.816, 2.224]]}, {"kind": "s", "id": "s0_0_0", "md": "The worst time to meet the database team is during an outage at midnight.", "zh": "认识数据库团队最糟糕的时机，就是半夜出故障的时候。", "sp": null, "gap": false, "start": 2.616, "end": 6.84, "words": [[2.734, 2.8], [2.813, 3.077], [3.09, 3.313], [3.327, 3.419], [3.432, 3.642], [3.655, 3.748], [3.761, 4.274], [4.287, 4.642], [4.827, 4.919], [4.932, 5.234], [5.248, 5.366], [5.445, 5.787], [5.8, 5.892], [5.905, 6.458]]}, {"kind": "s", "id": "s0_0_1", "md": "You need them urgently, they have never heard your name, and every question sounds like a ==demand==.", "zh": "你急着要找他们，他们从没听过你的名字，你问的每个问题听起来都像是在提要求。", "sp": null, "gap": false, "start": 6.84, "end": 12.624, "words": [[6.945, 7.05], [7.064, 7.261], [7.274, 7.419], [7.524, 8.051], [8.366, 8.472], [8.485, 8.603], [8.616, 8.972], [8.985, 9.222], [9.235, 9.353], [9.366, 9.695], [10.09, 10.208], [10.34, 10.603], [10.616, 11.129], [11.143, 11.458], [11.472, 11.59], [11.603, 11.643], [11.656, 12.235]]}, {"kind": "s", "id": "s0_0_2", "md": "Even good engineers become careful and slow with strangers.", "zh": "再好的工程师，面对陌生人也会变得谨慎、动作变慢。", "sp": null, "gap": false, "start": 12.624, "end ], [51.636, 51.794], [51.807, 51.952], [51.965, 52.386], [52.399, 52.478], [52.491, 52.82], [52.833, 53.333]]}, {"kind": "s", "id": "s1_1_0", "md": "Next, share information before anyone asks.", "zh": "接着，在别人开口之前就主动同步信息。", "sp": null, "gap": true, "start": 53.736, "end": 57.168, "words": [[53.841, 54.236], [54.499, 54.736], [54.749, 55.354], [55.368, 55.802], [55.815, 56.144], [56.157, 56.775]]}, {"kind": "s", "id": "s1_1_1", "md": "If your team plans a change that will __double the traffic__ to their service, tell them a month ahead, not the day before.", "zh": "如果你们团队计划做一个会让他们服务流量翻倍的改动，提前一个月告诉他们，而不是前一天。", "sp": null, "gap": false, "start": 57.168, "end": 63.84, "words": [[57.273, 57.392], [57.405, 57.523], [57.536, 57.773], [57.786, 58.115], [58.129, 58.181], [58.194, 58.615], [58.629, 58.734], [58.747, 58.879], [58.892, 59.221], [59.234, 59.313], [59.326, 59.813], [59.826, 59.918], [59.931, 60.089], [60.102, 60.668], [60.957, 61.115], [61.129, 61.26], [61.273, 61.313], [61.326, 61.655], [61.668, 62.05], [62.457, 62.642], [62.655, 62.747], [62.76, 62.931], [62.944, 63.457]]}, {"kind": "s", "id": "s1_1_2", "md": "That kind of early warning is rare, and people __remember who gave it__.", "zh": "这种提前预警很少见，人们会记住是谁给的。", "sp": null, "gap": false, "start": 63.84, "end": 67.968, "words": [[63.958, 64.051], [64.064, 64.274], [64.287, 64.393], [64.498, 64.774], [64.787, 65.222], [65.235, 65.366], [65.379, 65.774], [66.182, 66.235], [66.248, 66.59], [66.603, 66.958], [66.972, 67.09], [67.103, 67.393], [67.406, 67.577]]}, {"kind": "s", "id": "s1_2_0", "md": "Show up when they are in trouble, too.", "zh": "他们遇到麻烦的时候，你也要出现。", "sp": null, "gap": true, "start": 67.968, "end": 70.296, "words": [[68.073, 68.31], [68.323, 68.481], [68.494, 68.6], [68.613, 68.718], [68.731, 68.85], [68.863, 68.942], [68.955, 69.35], [69.6, 69.902]]}, {"kind": "s", "id": "s1_2_1", "md": "When their system has an incident, offer a dashboard, a theory, or simply __an extra pair of eyes__.", "zh": "他们的系统 "gap": false, "start": 90.936, "end": 97.512, "words": [[91.054, 91.265], [91.278, 91.397], [91.41, 91.752], [91.87, 91.989], [92.002, 92.857], [93.278, 93.331], [93.344, 93.462], [93.475, 93.831], [93.844, 94.107], [94.12, 94.383], [94.397, 94.936], [94.949, 95.318], [95.436, 95.594], [95.607, 95.765], [95.778, 95.897], [95.91, 96.331], [96.344, 96.436], [96.449, 96.765], [96.778, 97.12]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
