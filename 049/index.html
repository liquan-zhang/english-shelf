<script>
const D = {"id": "049", "title": "Building Trust Before You Need It", "meta": "B2 · 约 260 词 · 场景：跨团队关系", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Trust Works Like a Bank Account", "heading_zh": "1. 信任就像一个银行账户", "rows": [[{"id": "s0_0_0", "md": "The worst time to meet the database team is during an outage at midnight.", "text": "The worst time to meet the database team is during an outage at midnight.", "zh": "认识数据库团队最糟糕的时机，就是半夜出故障的时候。", "sp": null}, {"id": "s0_0_1", "md": "You need them urgently, they have never heard your name, and every question sounds like a ==demand==.", "text": "You need them urgently, they have never heard your name, and every question sounds like a demand.", "zh": "你急着要找他们，他们从没听过你的名字，你问的每个问题听起来都像是在提要求。", "sp": null}, {"id": "s0_0_2", "md": "Even good engineers become careful and slow with strangers.", "text": "Even good engineers become careful and slow with strangers.", "zh": "再好的工程师，面对陌生人也会变得谨慎、动作变慢。", "sp": null}], [{"id": "s0_1_0", "md": "Think of trust as a bank account.", "text": "Think of trust as a bank account.", "zh": "把信任想象成一个银行账户。", "sp": null}, {"id": "s0_1_1", "md": "Every kept promise, shared insight, or small favor is a ==deposit==.", "text": "Every kept promise, shared insight, or small favor is a deposit.", "zh": "每一次兑现承诺、分享洞察、帮个小忙，都是一笔存款。", "sp": null}, {"id": "s0_1_2", "md": "Every urgent request is a ==withdrawal==.", "text": "Every urgent request is a withdrawal.", "zh": "每一个紧急请求都是一次取款。", "sp": null}, {"id": "s0_1_3", "md": "**If you only show up when you need something, your account is always empty.**", "text": "If you only show up when you need something, your account is always empty.", "zh": "如果你只在有求于人的时候才出现，你的账户永远是空的。", "sp": null}], [{"id": "s0_2_0", "md": "The good news is that deposits are cheap.", "text": "The good news is that deposits are cheap.", "zh": "好消息是，存款很便宜。", "sp": null}, {"id": "s0_2_1", "md": "They take minutes, not weeks, and they ==compound== over time.", "text": "They take minutes, not weeks, and they compound over time.", "zh": "只需要几分钟，而不是几周，而且会随着时间复利增长。", "sp": null}, {"id": "s0_2_2", "md": "You just have to make them when nothing is on fire.", "text": "You just have to make them when nothing is on fire.", "zh": "你只需要在没出事的时候去存。", "sp": null}]]}, {"heading": "2. Small Deposits That Add Up", "heading_zh": "2. 积少成多的小额存款", "rows": [[{"id": "s1_0_0", "md": "Start by keeping small promises ==precisely==.", "text": "Start by keeping small promises precisely.", "zh": "先从精确地兑现小承诺开始。", "sp": null}, {"id": "s1_0_1", "md": "If you say you will send the logs by three, send them by three.", "text": "If you say you will send the logs by three, send them by three.", "zh": "如果你说三点前发日志，那就三点前发。", "sp": null}, {"id": "s1_0_2", "md": "People judge your big commitments by how you handle the tiny ones.", "text": "People judge your big commitments by how you handle the tiny ones.", "zh": "别人是根据你怎么处理小事，来判断你的大承诺靠不靠谱的。", "sp": null}], [{"id": "s1_1_0", "md": "Next, share information before anyone asks.", "text": "Next, share information before anyone asks.", "zh": "接着，在别人开口之前就主动同步信息。", "sp": null}, {"id": "s1_1_1", "md": "If your team plans a change that will __double the traffic__ to their service, tell them a month ahead, not the day before.", "text": "If your team plans a change that will double the traffic to their service, tell them a month ahead, not the day before.", "zh": "如果你们团队计划做一个会让他们服务流量翻倍的改动，提前一个月告诉他们，而不是前一天。", "sp": null}, {"id": "s1_1_2", "md": "That kind of early warning is rare, and people __remember who gave it__.", "text": "That kind of early warning is rare, and people remember who gave it.", "zh": "这种提前预警很少见，人们会记住是谁给的。", "sp": null}], [{"id": "s1_2_0", "md": "Show up when they are in trouble, too.", "text": "Show up when they are in trouble, too.", "zh": "他们遇到麻烦的时候，你也要出现。", "sp": null}, {"id": "s1_2_1", "md": "When their system has an incident, offer a dashboard, a theory, or simply __an extra pair of eyes__.", "text": "When their system has an incident, offer a dashboard, a theory, or simply an extra pair of eyes.", "zh": "他们的系统出故障时，主动提供一个 dashboard、一个猜测，或者只是多一双眼睛帮着看。", "sp": null}, {"id": "s1_2_2", "md": "**Helping in their crisis is the fastest way to earn help in yours.**", "text": "Helping in their crisis is the fastest way to earn help in yours.", "zh": "在他们危机时出手相助，是你在自己危机时得到帮助的最快方式。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, make the relationship personal in a ==professional== way.", "text": "Finally, make the relationship personal in a professional way.", "zh": "最后，以职业的方式让关系变得私人一点。", "sp": null}, {"id": "s1_3_1", "md": "A short coffee chat, a thank-you in their channel, or a question about their roadmap all count.", "text": "A short coffee chat, a thank-you in their channel, or a question about their roadmap all count.", "zh": "一次简短的咖啡聊天、在他们群里说声谢谢、问问他们的 roadmap，这些都算。", "sp": null}, {"id": "s1_3_2", "md": "None of this is ==manipulation==; it is simply what good colleagues do when there is nothing to gain yet.", "text": "None of this is manipulation; it is simply what good colleagues do when there is nothing to gain yet.", "zh": "这些都不是在耍手段；这只是好同事在还没有任何好处可图的时候会做的事。", "sp": null}]]}], "gist": [{"q": "作者用什么比喻来描述信任？", "a": "银行账户：守住的承诺、分享的信息、小忙是存款，紧急求助是取款；只在需要时出现，账户永远是空的。"}, {"q": "作者建议的「小额存款」有哪些？", "a": "精确兑现小承诺；主动提前同步会影响对方的变更；对方出事故时去帮忙；喝咖啡、公开感谢、关心对方路线图。"}, {"q": "为什么要在平时而不是出事时建立信任？", "a": "出事时对方不认识你，每个问题都像命令；平时存款成本低、会累积，危机时才取得出来。"}], "dictation": [{"id": "s0_1_3", "text": "If you only show up when you need something, your account is always empty."}, {"id": "s1_0_2", "text": "People judge your big commitments by how you handle the tiny ones."}, {"id": "s1_2_2", "text": "Helping in their crisis is the fastest way to earn help in yours."}, {"id": "s1_0_1", "text": "If you say you will send the logs by three, send them by three."}], "shadow": {"text": "Think of trust as a bank account. Every kept promise, shared insight, or small favor is a deposit. Every urgent request is a withdrawal.", "marked": "Think of <b>trust</b> / as a <b>bank account</b>. //<br>Every <b>kept</b> promise, / <b>shared</b> insight, / or <b>small</b> favor / is a <b>deposit</b>. //<br>Every <b>urgent</b> request / is a <b>withdrawal</b>. //"}, "prompts": [{"q": "你们下个月要做一个营销活动，预计会让风控团队的服务流量翻倍。用 30 秒提前给对方负责人打个招呼。", "ref": "Hi Lena, nothing urgent, I just wanted to give you an early heads-up. Next month we're running a campaign that could roughly double the calls to your risk service for about a week. I'll share our traffic forecast once it's ready. Is there anything you'd need from us to prepare, like load test data or a contact on call during the campaign?", "ref_zh": "Lena 你好，不着急，只是想提前跟你打个招呼。下个月我们要做一个活动，大概有一周时间，打到你们风控服务的调用量可能会翻一倍左右。流量预估出来后我会发给你。你们需要我们提供什么来做准备吗？比如压测数据，或者活动期间我们这边 on-call 的联系人？", "id": "ref0"}, {"q": "另一个团队正在处理一个线上事故，和你们没直接关系。用 30 秒在他们的事故频道里主动提供帮助。", "ref": "Hi all, sorry you're dealing with this. We saw a similar spike in connection errors last month, and it turned out to be a pool size setting after a config change. Not sure it's the same thing, but I can share the dashboard we used to find it. If an extra pair of eyes would help, I'm free for the next hour.", "ref_zh": "大家好，辛苦了。我们上个月也遇到过类似的连接错误突增，最后发现是一次配置变更后连接池大小设置的问题。不确定是不是同一回事，但我可以把我们当时用来定位的 dashboard 分享出来。如果需要多一双眼睛帮忙看，接下来一个小时我都有空。", "id": "ref1"}], "words": [{"w": "demand", "ipa": "/dɪˈmænd/", "zh": "要求、强求", "ex": "Phrase it as a question so it doesn't sound like a demand.", "id": "w0"}, {"w": "deposit", "ipa": "/dɪˈpɑːzɪt/", "zh": "存款", "ex": "Every on-time delivery is a deposit in your trust account.", "id": "w1"}, {"w": "withdrawal", "ipa": "/wɪðˈdrɔːəl/", "zh": "取款、撤回", "ex": "Asking them to work the weekend is a big withdrawal.", "id": "w2"}, {"w": "compound (v.)", "ipa": "/kəmˈpaʊnd/", "zh": "复利般累积", "ex": "Small improvements in test speed compound over a year.", "tts_w": "compound", "id": "w3"}, {"w": "precisely", "ipa": "/prɪˈsaɪsli/", "zh": "精确地、恰好", "ex": "The job failed precisely when the const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
