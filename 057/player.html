<script>
const D = {"id": "057", "title": "Helping a Strong Engineer Grow into a Lead", "meta": "B2 · 约 280 词 · 场景：培养骨干", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. When Strength Becomes a Bottleneck", "heading_zh": "1. 当长处变成瓶颈", "rows": [[{"id": "s0_0_0", "md": "Every team has one: the engineer who can fix anything.", "text": "Every team has one: the engineer who can fix anything.", "zh": "每个团队都有这么一个人：什么都能修的工程师。", "sp": null}, {"id": "s0_0_1", "md": "When production breaks, people page her first, and when a design looks risky, she rewrites it over the weekend.", "text": "When production breaks, people page her first, and when a design looks risky, she rewrites it over the weekend.", "zh": "线上一出问题，大家第一个 page 她；设计一看有风险，她周末就给重写了。", "sp": null}, {"id": "s0_0_2", "md": "Naturally, she is the first person you think of for the next lead role.", "text": "Naturally, she is the first person you think of for the next lead role.", "zh": "很自然地，下一个 lead 的位置你第一个想到的就是她。", "sp": null}], [{"id": "s0_1_0", "md": "Here is the problem.", "text": "Here is the problem.", "zh": "问题就在这里。", "sp": null}, {"id": "s0_1_1", "md": "The habits that made her ==exceptional== as an engineer can hold her back as a lead.", "text": "The habits that made her exceptional as an engineer can hold her back as a lead.", "zh": "那些让她成为出色工程师的习惯，可能会拖累她当 lead。", "sp": null}, {"id": "s0_1_2", "md": "If she keeps solving every hard problem herself, the team stops learning, and she becomes the ==bottleneck== for everything.", "text": "If she keeps solving every hard problem herself, the team stops learning, and she becomes the bottleneck for everything.", "zh": "如果她继续自己解决每一个难题，团队就不再成长，而她会成为所有事情的瓶颈。", "sp": null}, {"id": "s0_1_3", "md": "**As an engineer, she was measured by what she built; as a lead, she is measured by what her team builds.**", "text": "As an engineer, she was measured by what she built; as a lead, she is measured by what her team builds.", "zh": "作为工程师，衡量她的是她做出了什么；作为 lead，衡量她的是她的团队做出了什么。", "sp": null}], [{"id": "s0_2_0", "md": "Most strong engineers do not see this shift on their own.", "text": "Most strong engineers do not see this shift on their own.", "zh": "大多数强工程师自己意识不到这个转变。", "sp": null}, {"id": "s0_2_1", "md": "They feel ==guilty== when they are not coding and ==anxious== when someone else writes code more slowly than they would.", "text": "They feel guilty when they are not coding and anxious when someone else writes code more slowly than they would.", "zh": "不写代码的时候他们会内疚，别人写代码比自己慢的时候他们会焦虑。", "sp": null}]]}, {"heading": "2. Designing the Transition", "heading_zh": "2. 设计这次转型", "rows": [[{"id": "s1_0_0", "md": "Start by naming the shift out loud.", "text": "Start by naming the shift out loud.", "zh": "先把这个转变明确说出来。", "sp": null}, {"id": "s1_0_1", "md": "Tell her directly that her success now depends on how many people can do what she does.", "text": "Tell her directly that her success now depends on how many people can do what she does.", "zh": "直接告诉她，她现在的成功取决于有多少人能做到她能做的事。", "sp": null}, {"id": "s1_0_2", "md": "Saying it clearly __gives her permission__ to step back from the keyboard.", "text": "Saying it clearly gives her permission to step back from the keyboard.", "zh": "把话说清楚，就等于允许她从键盘前退后一步。", "sp": null}], [{"id": "s1_1_0", "md": "Then give her a project that is too big to do alone.", "text": "Then give her a project that is too big to do alone.", "zh": "然后，给她一个一个人干不完的项目。", "sp": null}, {"id": "s1_1_1", "md": "A cross-team migration with three engineers is ideal, because she simply cannot write all the code.", "text": "A cross-team migration with three engineers is ideal, because she simply cannot write all the code.", "zh": "一个配三个工程师的跨团队迁移就很理想，因为她根本不可能把所有代码都写了。", "sp": null}, {"id": "s1_1_2", "md": "She will have to plan, ==delegate==, and review, whether she likes it or not.", "text": "She will have to plan, delegate, and review, whether she likes it or not.", "zh": "不管她愿不愿意，她都得去规划、分工和 review。", "sp": null}], [{"id": "s1_2_0", "md": "Next, change what you praise.", "text": "Next, change what you praise.", "zh": "接着，改变你表扬的东西。", "sp": null}, {"id": "s1_2_1", "md": "Stop celebrating the heroic late-night fix, and start recognizing the moment she __walked a junior through__ it instead.", "text": "Stop celebrating the heroic late-night fix, and start recognizing the moment she walked a junior through it instead.", "zh": "别再庆祝深夜英雄式的救火，开始认可她带着初级工程师一起搞定问题的那一刻。", "sp": null}, {"id": "s1_2_2", "md": "People grow toward whatever their manager ==notices==.", "text": "People grow toward whatever their manager notices.", "zh": "经理注意到什么，人就会往什么方向成长。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, expect a dip.", "text": "Finally, expect a dip.", "zh": "最后，做好产出下滑的准备。", "sp": null}, {"id": "s1_3_1", "md": "Her ==output== will drop for a few months, and she may feel less useful than before.", "text": "Her output will drop for a few months, and she may feel less useful than before.", "zh": "接下来几个月她的产出会下降，她可能会觉得自己不如以前有用了。", "sp": null}, {"id": "s1_3_2", "md": "**Tell her the dip is normal, and stay close enough to help her through it.**", "text": "Tell her the dip is normal, and stay close enough to help her through it.", "zh": "告诉她这种下滑很正常，并且待在离她足够近的地方，帮她度过这段时间。", "sp": null}]]}], "gist": [{"q": "为什么最强的工程师当 lead 时会出问题？", "a": "让她优秀的习惯（自己解决所有难题）会让团队停止学习，她变成一切的瓶颈；工程师按自己做了什么衡量，lead 按团队做了什么衡量。"}, {"q": "作者建议给她什么样的项目？为什么？", "a": "一个大到一个人做不完的项目，比如三个人参与的跨团队迁移，逼她去规划、委派和评审。"}, {"q": "转型期经理还应该做什么？", "a": "明确说出角色的转变；改变表扬的对象（表扬她带新人而不是熬夜救火）；预期产出会下滑一段时间，告诉她这很正常并陪她度过。"}], "dictation": [{"id": "s0_1_3", "text": "As an engineer, she was measured by what she built; as a lead, she is measured by what her team builds."}, {"id": "s1_1_0", "text": "Then give her a project that is too big to do alone."}, {"id": "s1_2_2", "text": "People grow toward whatever their manager notices."}, {"id": "s1_3_2", "text": "Tell her the dip is normal, and stay close enough to help her through it."}], "shadow": {"text": "Then give her a project that is too big to do alone. A cross-team migration with three engineers is ideal, because she simply cannot write all the code. She will have to plan, delegate, and review, whether she likes it or not.", "marked": "Then give her a project / that is <b>too big</b> to do <b>alone</b>. //<br>A <b>cross-team</b> migration with <b>three</b> engineers is <b>ideal</b>, / because she simply <b>cannot</b> write all the code. //<br>She will have to <b>plan</b>, / <b>delegate</b>, / and <b>review</b>, / whether she <b>likes</b> it or not. //"}, "prompts": [{"q": "你团队最强的工程师刚被提拔为小组负责人，但他还是什么都自己写。用 30 秒在一对一里跟他讲清角色的转变。", "ref": "First, congratulations, you really earned this. I want to be honest about one thing that changes now. Until last month, your impact was the code you wrote, and it was excellent. From now on, your impact is what the three people on your team can deliver. So when you're tempted to fix something yourself, ask whether someone else could learn by doing it. I'd rather see you slower and the team stronger.", "ref_zh": "首先，恭喜你，这是你实打实挣来的。有一件从现在开始会变的事，我想跟你说实话。到上个月为止，你的影响力是你写的代码，而且写得非常好。从现在起，你的影响力是你团队里这三个人能交付什么。所以当你忍不住想自己动手修的时候，先问问自己，有没有别人可以通过做这件事学到东西。我宁愿看到你慢一点、团队强一点。", "id": "ref0"}, {"q": "这位新 lead 担心自己写代码少了、产出下降，觉得自己没用。用 30 秒安慰并鼓励他。", "ref": "What you're feeling is completely normal, and almost every new lead goes through it. Your own commits are down, yes. But look at what happened this month. Mei shipped her first feature without help, and the design review you ran caught two real problems. That's your output now, it just shows up in other people's work. Give it a few months, and you'll see it clearly.", "ref_zh": "你现在的感受完全正常，几乎每个新 lead 都会经历。没错，你自己的 commit 少了。但看看这个月发生了什么。Mei 第一次没靠别人帮忙就上线了自己的功能，你主持的设计评审抓到了两个真问题。这些就是你现在的产出，只是它体现在别人的工作里。再给它几个月，你就会看得很清楚。", "id": "ref1"}], "words": [{"w": "exceptional", "ipa": "/ɪkˈsepʃənl/", "zh": "杰出的、非凡的", "ex": "Her debugging skills are exceptional; she found the leak in an hour.", "id": "w0"}, {"w": "bottleneck", "ipa": "/ˈbɑːtlnek/", "zh": "瓶颈", "ex": "If every review goes through one person, he becomes the bottleneck.", "id": "w1"}, {"w": "guilty", "ipa": "/ˈɡɪlti/", "zh": "内疚的", "ex": "Don't feel guilty about skipping the coding task; planning is your job now.", "id": "w2"}, {"w": "anxious", "ipa": "/ˈæŋkʃəs/", "zh": "焦虑的", "ex": "The team is anxious about the launch date moving again.", "id": "w3"}, {"w": "delegate", "ipa": "/ˈdelɪɡeɪt/", "zh": "委派、授权", "ex": "Try to delegate the on-call schedule to someone on the team.", "id": "w4"}, {"w": "notice", "ipa": "/ˈnoʊtɪs/", "zh": "注意到", "ex": "Did anyone notice the error rate went up after the deploy?", "id": "w5"}, {"w": "output", "ipa": "/ˈaʊtpʊt/", "zh": "产出", "ex": "Team output went up after we cut the number of meetings.", "id": "w6"}, {"w": "heroic", "ipa": "/hɪˈroʊɪk/", "zh": "英雄式的", "ex": "We shouldn't depend on heroic weekend fixes to hit a deadline.", "id": "w7"}, {"w": "dip", "ipa": "/dɪp/", "zh": "短暂下滑", "ex": "Expect a small dip in velocity while the new hires ramp up.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. When Strength Becomes a Bottleneck", "zh": "1. 当长处变成瓶颈", "start": 0.0, "end": 2.928, "words": [[0.105, 0.355], [0.737, 0.882], [0.895, 1.355], [1.368, 1.763], [1.776, 1.829], [1.842, 2.539]]}, {"kind": "s", "id": "s0_0_0", "md": "Every team has one: the engineer who can fix anything.", "zh": "每个团队都有这么一个人：什么都能修的工程师。", "sp": null, "gap": false, "start": 2.928, "end": 6.72, "words": [[3.033, 3.283], [3.296, 3.573], [3.586, 3.783], [3.796, 4.112], [4.546, 4.625], [4.639, 5.191], [5.204, 5.349], [5.362, 5.507], [5.52, 5.875], [5.889, 6.336]]}, {"kind": "s", "id": "s0_0_1", "md": "When production breaks, people page her first, and when a design looks risky, she rewrites it over the weekend.", "zh": "线上一出问题，大家第一个 page 她；设计一看有风险，她周末就给重写了。", "sp": null, "gap": false, "start": 6.72, "end": 14.088, "words": [[6.838, 6.931], [6.944, 7.43], [7.444, 7.97], [8.207, 8.562], [8.575, 8.891], [8.904, 9.049], [9.0 const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
