<script>
const D = {"id": "100", "title": "Your Accent Is Not the Problem", "meta": "B2 · 约 270 词 · 场景：口音与清晰表达", "voice": "en-SG-WayneNeural", "rate": "-5%", "sections": [{"heading": "1. Clear, Not Native", "heading_zh": "1. 要清楚，不要地道", "rows": [[{"id": "s0_0_0", "md": "Many engineers spend years trying to sound like native speakers.", "text": "Many engineers spend years trying to sound like native speakers.", "zh": "很多工程师花了好几年，想让自己听起来像母语者。", "sp": null}, {"id": "s0_0_1", "md": "They watch films, copy accents, and feel embarrassed every time a vowel comes out wrong.", "text": "They watch films, copy accents, and feel embarrassed every time a vowel comes out wrong.", "zh": "他们看电影、模仿口音，每次元音发得不对都觉得尴尬。", "sp": null}], [{"id": "s0_1_0", "md": "But walk around any global office in Singapore.", "text": "But walk around any global office in Singapore.", "zh": "但你去新加坡任何一个全球化办公室转一圈。", "sp": null}, {"id": "s0_1_1", "md": "You will hear Indian English, Singlish, Australian, British, Chinese and Filipino accents, sometimes in the same meeting.", "text": "You will hear Indian English, Singlish, Australian, British, Chinese and Filipino accents, sometimes in the same meeting.", "zh": "你会听到印度英语、新加坡式英语、澳洲、英国、中国和菲律宾口音，有时候就在同一个会上。", "sp": null}, {"id": "s0_1_2", "md": "The people who are easy to follow are not the ones with the most ==polished== accent.", "text": "The people who are easy to follow are not the ones with the most polished accent.", "zh": "那些让人容易听懂的人，并不是口音最纯正的那些。", "sp": null}, {"id": "s0_1_3", "md": "They are the ones who speak clearly.", "text": "They are the ones who speak clearly.", "zh": "而是说话清楚的那些。", "sp": null}], [{"id": "s0_2_0", "md": "**Nobody needs you to sound like a native speaker; they need to understand you the first time.**", "text": "Nobody needs you to sound like a native speaker; they need to understand you the first time.", "zh": "没人需要你听起来像母语者；大家需要的是第一遍就能听懂你。", "sp": null}, {"id": "s0_2_1", "md": "That is a different goal, and a much more ==achievable== one.", "text": "That is a different goal, and a much more achievable one.", "zh": "这是一个不同的目标，而且容易实现得多。", "sp": null}, {"id": "s0_2_2", "md": "==Intelligibility== comes from a few habits, not from changing who you are.", "text": "Intelligibility comes from a few habits, not from changing who you are.", "zh": "让人听得懂靠的是几个习惯，而不是改变你自己。", "sp": null}]]}, {"heading": "2. Four Habits That Matter More Than Accent", "heading_zh": "2. 比口音更重要的四个习惯", "rows": [[{"id": "s1_0_0", "md": "First, slow down on the words that carry the meaning.", "text": "First, slow down on the words that carry the meaning.", "zh": "第一，在承载意思的词上放慢。", "sp": null}, {"id": "s1_0_1", "md": "Names, numbers and the key verb in each sentence deserve an extra half second.", "text": "Names, numbers and the key verb in each sentence deserve an extra half second.", "zh": "名字、数字和每句话里的关键动词，值得多给半秒。", "sp": null}, {"id": "s1_0_2", "md": "You can rush the small words, and listeners will __fill in the gaps__.", "text": "You can rush the small words, and listeners will fill in the gaps.", "zh": "小词可以说快一点，听的人自己会补上。", "sp": null}], [{"id": "s1_1_0", "md": "Second, speak in short ==chunks==, with a clear pause between ideas, not in the middle of them.", "text": "Second, speak in short chunks, with a clear pause between ideas, not in the middle of them.", "zh": "第二，分成短块来说，停顿放在意思和意思之间，而不是一个意思的中间。", "sp": null}, {"id": "s1_1_1", "md": "Short chunks are easy to follow, even with a strong accent and a weak connection.", "text": "Short chunks are easy to follow, even with a strong accent and a weak connection.", "zh": "短块很好跟，哪怕口音很重、网络很差。", "sp": null}], [{"id": "s1_2_0", "md": "Third, get the stress right.", "text": "Third, get the stress right.", "zh": "第三，重音要放对。", "sp": null}, {"id": "s1_2_1", "md": "Putting the weight on the wrong ==syllable== confuses listeners far more than an unusual vowel.", "text": "Putting the weight on the wrong syllable confuses listeners far more than an unusual vowel.", "zh": "重音放错音节，比一个不太标准的元音更让人困惑。", "sp": null}, {"id": "s1_2_2", "md": "When you learn a new technical word, check where the stress falls before you use it in a meeting.", "text": "When you learn a new technical word, check where the stress falls before you use it in a meeting.", "zh": "学一个新的技术词时，在会上用之前先查一下重音在哪儿。", "sp": null}], [{"id": "s1_3_0", "md": "Fourth, ==signpost== your structure.", "text": "Fourth, signpost your structure.", "zh": "第四，把结构标出来。", "sp": null}, {"id": "s1_3_1", "md": "Phrases like \"two points\", \"the main issue is\", and \"so, in short\" __give listeners a map__, so they can follow you even if they miss a word or two.", "text": "Phrases like \"two points\", \"the main issue is\", and \"so, in short\" give listeners a map, so they can follow you even if they miss a word or two.", "zh": "像「两点」「主要问题是」「所以简单说」这类短语，相当于给听的人一张地图，就算漏听一两个词也能跟上你。", "sp": null}, {"id": "s1_3_2", "md": "**Clarity is a skill you can practice; your accent is just part of who you are.**", "text": "Clarity is a skill you can practice; your accent is just part of who you are.", "zh": "清晰是可以练的技能；口音只是你的一部分。", "sp": null}]]}], "gist": [{"q": "作者认为口音和清晰度哪个更重要？", "a": "清晰度；在新加坡的全球办公室里，好懂的人不是口音最地道的，而是说得清楚的。"}, {"q": "作者为什么说“听起来像母语者”不是正确目标？", "a": "别人需要的是第一次就听懂你；可懂度来自几个习惯，更容易实现，也不需要改变你是谁。"}, {"q": "文中的四个习惯是什么？", "a": "在承载意思的词（名字、数字、关键动词）上放慢；按意群短句表达，在意思之间停顿；重音放对音节；用路标短语交代结构。"}], "dictation": [{"id": "s0_2_0", "text": "Nobody needs you to sound like a native speaker; they need to understand you the first time."}, {"id": "s1_0_0", "text": "First, slow down on the words that carry the meaning."}, {"id": "s1_0_1", "text": "Names, numbers and the key verb in each sentence deserve an extra half second."}, {"id": "s1_3_2", "text": "Clarity is a skill you can practice; your accent is just part of who you are."}], "shadow": {"text": "First, slow down on the words that carry the meaning. Names, numbers and the key verb in each sentence deserve an extra half second. You can rush the small words, and listeners will fill in the gaps.", "marked": "First, <b>slow down</b> / on the words that <b>carry</b> the meaning. //<br><b>Names</b>, <b>numbers</b> / and the key <b>verb</b> in each sentence / deserve an extra <b>half</b> second. //<br>You can <b>rush</b> the small words, / and listeners will fill in the <b>gaps</b>. //"}, "prompts": [{"q": "你要在全球周会上用英语汇报一次故障，担心自己的口音。用分块、重音和路标短语，30 秒说完。", "ref": "Two points on yesterday's outage. First, what happened. At nine in the evening, the cache cluster ran out of memory, and uploads failed for forty minutes. Second, what we're doing. We've doubled the memory, and we're adding an alert, so next time we'll catch it before users do. So, in short, it's fixed, and it won't happen silently again.", "ref_zh": "关于昨天的故障，说两点。第一，发生了什么。晚上九点，缓存集群内存耗尽，上传失败了四十分钟。第二，我们在做什么。内存已经扩了一倍，还在加告警，下次我们能赶在用户之前发现。所以简单说，问题已经修好了，而且不会再悄无声息地发生。", "id": "ref0"}, {"q": "一位新加坡同事说他担心自己的 Singlish 口音太重，不敢在全球会议上发言。用文中的观点鼓励他。", "ref": "Honestly, your accent isn't the issue. I understand you perfectly in our team meetings. What helps in the big calls is slowing down on the key words and pausing between ideas, and you already do that when you present your demos. Try opening with something like 'I have two points', and people will follow you easily. Nobody expects you to sound British.", "ref_zh": "说实话，你的口音不是问题。我们组会上你说的我完全听得懂。在大会上管用的是关键词说慢一点、意思之间停一停，你讲 demo 的时候其实已经在这么做了。开头试试说「我有两点」，大家就能很轻松地跟上你。没人指望你说一口英国腔。", "id": "ref1"}], "words": [{"w": "polished", "ipa": "/ˈpɑːlɪʃt/", "zh": "精致的、打磨过的", "ex": "The slides don't need to be polished, they just need to be clear.", "id": "w0"}, {"w": "achievable", "ipa": "/əˈtʃiːvəbəl/", "zh": "可实现的", "ex": "Let's set an achievable goal for this sprint.", "id": "w1"}, {"w": "intelligibility", "ipa": "/ɪnˌtelɪdʒəˈbɪləti/", "zh": "可懂度、清晰易懂", "ex": "For global calls, intelligibility matters more than a perfect accent.", "id": "w2"}, {"w": "chunk (n.)", "ipa": "/tʃʌŋk/", "zh": "（语言的）意群、一块", "ex": "Break the update into small chunks so people can follow.", "tts_w": "chun const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
