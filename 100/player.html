<script>
const D = {"id": "100", "title": "Your Accent Is Not the Problem", "meta": "B2 · 约 270 词 · 场景：口音与清晰表达", "voice": "en-SG-WayneNeural", "rate": "-5%", "sections": [{"heading": "1. Clear, Not Native", "heading_zh": "1. 要清楚，不要地道", "rows": [[{"id": "s0_0_0", "md": "Many engineers spend years trying to sound like native speakers.", "text": "Many engineers spend years trying to sound like native speakers.", "zh": "很多工程师花了好几年，想让自己听起来像母语者。", "sp": null}, {"id": "s0_0_1", "md": "They watch films, copy accents, and feel embarrassed every time a vowel comes out wrong.", "text": "They watch films, copy accents, and feel embarrassed every time a vowel comes out wrong.", "zh": "他们看电影、模仿口音，每次元音发得不对都觉得尴尬。", "sp": null}], [{"id": "s0_1_0", "md": "But walk around any global office in Singapore.", "text": "But walk around any global office in Singapore.", "zh": "但你去新加坡任何一个全球化办公室转一圈。", "sp": null}, {"id": "s0_1_1", "md": "You will hear Indian English, Singlish, Australian, British, Chinese and Filipino accents, sometimes in the same meeting.", "text": "You will hear Indian English, Singlish, Australian, British, Chinese and Filipino accents, sometimes in the same meeting.", "zh": "你会听到印度英语、新加坡式英语、澳洲、英国、中国和菲律宾口音，有时候就在同一个会上。", "sp": null}, {"id": "s0_1_2", "md": "The people who are easy to follow are not the ones with the most ==polished== accent.", "text": "The people who are easy to follow are not the ones with the most polished accent.", "zh": "那些让人容易听懂的人，并不是口音最纯正的那些。", "sp": null}, {"id": "s0_1_3", "md": "They are the ones who speak clearly.", "text": "They are the ones who speak clearly.", "zh": "而是说话清楚的那些。", "sp": null}], [{"id": "s0_2_0", "md": "**Nobody needs you to sound like a native speaker; they need to understand you the first time.**", "text": "Nobody needs you to sound like a native speaker; they need to understand you the first time.", "zh": "没人需要你听起来像母语者；大家需要的是第一遍就能听懂你。", "sp": null}, {"id": "s0_2_1", "md": "That is a different goal, and a much more ==achievable== one.", "text": "That is a different goal, and a much more achievable one.", "zh": "这是一个不同的目标，而且容易实现得多。", "sp": null}, {"id": "s0_2_2", "md": "==Intelligibility== comes from a few habits, not from changing who you are.", "text": "Intelligibility comes from a few habits, not from changing who you are.", "zh": "让人听得懂靠的是几个习惯，而不是改变你自己。", "sp": null}]]}, {"heading": "2. Four Habits That Matter More Than Accent", "heading_zh": "2. 比口音更重要的四个习惯", "rows": [[{"id": "s1_0_0", "md": "First, slow down on the words that carry the meaning.", "text": "First, slow down on the words that carry the meaning.", "zh": "第一，在承载意思的词上放慢。", "sp": null}, {"id": "s1_0_1", "md": "Names, numbers and the key verb in each sentence deserve an extra half second.", "text": "Names, numbers and the key verb in each sentence deserve an extra half second.", "zh": "名字、数字和每句话里的关键动词，值得多给半秒。", "sp": null}, {"id": "s1_0_2", "md": "You can rush the small words, and listeners will __fill in the gaps__.", "text": "You can rush the small words, and listeners will fill in the gaps.", "zh": "小词可以说快一点，听的人自己会补上。", "sp": null}], [{"id": "s1_1_0", "md": "Second, speak in short ==chunks==, with a clear pause between ideas, not in the middle of them.", "text": "Second, speak in short chunks, with a clear pause between ideas, not in the middle of them.", "zh": "第二，分成短块来说，停顿放在意思和意思之间，而不是一个意思的中间。", "sp": null}, {"id": "s1_1_1", "md": "Short chunks are easy to follow, even with a strong accent and a weak connection.", "text": "Short chunks are easy to follow, even with a strong accent and a weak connection.", "zh": "短块很好跟，哪怕口音很重、网络很差。", "sp": null}], [{"id": "s1_2_0", "md": "Third, get the stress right.", "text": "Third, get the stress right.", "zh": "第三，重音要放对。", "sp": null}, {"id": "s1_2_1", "md": "Putting the weight on the wrong ==syllable== confuses listeners far more than an unusual vowel.", "text": "Putting the weight on the wrong syllable confuses listeners far more than an unusual vowel.", "zh": "重音放错音节，比一个不太标准的元音更让人困惑。", "sp": null}, {"id": "s1_2_2", "md": "When you learn a new technical word, check where the stress falls before you use it in a meeting.", "text": "When you learn a new technical word, check where the stress falls before you use it in a meeting.", "zh": "学一个新的技术词时，在会上用之前先查一下重音在哪儿。", "sp": null}], [{"id": "s1_3_0", "md": "Fourth, ==signpost== your structure.", "text": "Fourth, signpost your structure.", "zh": "第四，把结构标出来。", "sp": null}, {"id": "s1_3_1", "md": "Phrases like \"two points\", \"the main issue is\", and \"so, in short\" __give listeners a map__, so they can follow you even if they miss a word or two.", "text": "Phrases like \"two points\", \"the main issue is\", and \"so, in short\" give listeners a map, so they can follow you even if they miss a word or two.", "zh": "像「两点」「主要问题是」「所以简单说」这类短语，相当于给听的人一张地图，就算漏听一两个词也能跟上你。", "sp": null}, {"id": "s1_3_2", "md": "**Clarity is a skill you can practice; your accent is just part of who you are.**", "text": "Clarity is a skill you can practice; your accent is just part of who you are.", "zh": "清晰是可以练的技能；口音只是你的一部分。", "sp": null}]]}], "gist": [{"q": "作者认为口音和清晰度哪个更重要？", "a": "清晰度；在新加坡的全球办公室里，好懂的人不是口音最地道的，而是说得清楚的。"}, {"q": "作者为什么说“听起来像母语者”不是正确目标？", "a": "别人需要的是第一次就听懂你；可懂度来自几个习惯，更容易实现，也不需要改变你是谁。"}, {"q": "文中的四个习惯是什么？", "a": "在承载意思的词（名字、数字、关键动词）上放慢；按意群短句表达，在意思之间停顿；重音放对音节；用路标短语交代结构。"}], "dictation": [{"id": "s0_2_0", "text": "Nobody needs you to sound like a native speaker; they need to understand you the first time."}, {"id": "s1_0_0", "text": "First, slow down on the words that carry the meaning."}, {"id": "s1_0_1", "text": "Names, numbers and the key verb in each sentence deserve an extra half second."}, {"id": "s1_3_2", "text": "Clarity is a skill you can practice; your accent is just part of who you are."}], "shadow": {"text": "First, slow down on the words that carry the meaning. Names, numbers and the key verb in each sentence deserve an extra half second. You can rush the small words, and listeners will fill in the gaps.", "marked": "First, <b>slow down</b> / on the words that <b>carry</b> the meaning. //<br><b>Names</b>, <b>numbers</b> / and the key <b>verb</b> in each sentence / deserve an extra <b>half</b> second. //<br>You can <b>rush</b> the small words, / and listeners will fill in the <b>gaps</b>. //"}, "prompts": [{"q": "你要在全球周会上用英语汇报一次故障，担心自己的口音。用分块、重音和路标短语，30 秒说完。", "ref": "Two points on yesterday's outage. First, what happened. At nine in the evening, the cache cluster ran out of memory, and uploads failed for forty minutes. Second, what we're doing. We've doubled the memory, and we're adding an alert, so next time we'll catch it before users do. So, in short, it's fixed, and it won't happen silently again.", "ref_zh": "关于昨天的故障，说两点。第一，发生了什么。晚上九点，缓存集群内存耗尽，上传失败了四十分钟。第二，我们在做什么。内存已经扩了一倍，还在加告警，下次我们能赶在用户之前发现。所以简单说，问题已经修好了，而且不会再悄无声息地发生。", "id": "ref0"}, {"q": "一位新加坡同事说他担心自己的 Singlish 口音太重，不敢在全球会议上发言。用文中的观点鼓励他。", "ref": "Honestly, your accent isn't the issue. I understand you perfectly in our team meetings. What helps in the big calls is slowing down on the key words and pausing between ideas, and you already do that when you present your demos. Try opening with something like 'I have two points', and people will follow you easily. Nobody expects you to sound British.", "ref_zh": "说实话，你的口音不是问题。我们组会上你说的我完全听得懂。在大会上管用的是关键词说慢一点、意思之间停一停，你讲 demo 的时候其实已经在这么做了。开头试试说「我有两点」，大家就能很轻松地跟上你。没人指望你说一口英国腔。", "id": "ref1"}], "words": [{"w": "polished", "ipa": "/ˈpɑːlɪʃt/", "zh": "精致的、打磨过的", "ex": "The slides don't need to be polished, they just need to be clear.", "id": "w0"}, {"w": "achievable", "ipa": "/əˈtʃiːvəbəl/", "zh": "可实现的", "ex": "Let's set an achievable goal for this sprint.", "id": "w1"}, {"w": "intelligibility", "ipa": "/ɪnˌtelɪdʒəˈbɪləti/", "zh": "可懂度、清晰易懂", "ex": "For global calls, intelligibility matters more than a perfect accent.", "id": "w2"}, {"w": "chunk (n.)", "ipa": "/tʃʌŋk/", "zh": "（语言的）意群、一块", "ex": "Break the update into small chunks so people can follow.", "tts_w": "chunk", "id": "w3"}, {"w": "syllable", "ipa": "/ˈsɪləbəl/", "zh": "音节", "ex": "In 'develop', the stress is on the second syllable.", "id": "w4"}, {"w": "signpost (v.)", "ipa": "/ˈsaɪnˌpoʊst/", "zh": "（用路标语）提示结构", "ex": "Signpost your talk early: 'I'll cover three risks.'", "tts_w": "signpost", "id": "w5"}, {"w": "fill in the gaps", "ipa": "/fɪl ɪn ðə ɡæps/", "zh": "补全缺失部分", "ex": "The logs fill in the gaps that the dashboard misses.", "id": "w6"}, {"w": "rush (v.)", "ipa": "/rʌʃ/", "zh": "仓促做、赶", "ex": "Don't rush the conclusion, that's the part people remember.", "tts_w": "rush", "id": "w7"}, {"w": "enunciate", "ipa": "/ɪˈnʌnsiˌeɪt/", "zh": "清晰地发音", "ex": "Enunciate the numbers clearly when you read out the results.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Clear, Not Native", "zh": "1. 要清楚，不要地道", "start": 0.0, "end": 3.96, "words": [[0.103, 0.76], [1.024, 1.8], [2.103, 2.392], [2.405, 3.05]]}, {"kind": "s", "id": "s0_0_0", "md": "Many engineers spend years trying to sound like native speakers.", "zh": "很多工程师花了好几年，想让自己听起来像母语者。", "sp": null, "gap": false, "start": 3.96, "end": 8.928, "words": [[4.063, 4.497], [4.51, 5.023], [5.036, 5.392], [5.405, 5.668], [5.681, 6.01], [6.023, 6.128], [6.142, 6.471], [6.484, 6.655], [6.668, 7.063], [7.076, 7.997]]}, {"kind": "s", "id": "s0_0_1", "md": "They watch films, copy accents, and feel embarrassed every time a vowel comes out wrong.", "zh": "他们看电影、模仿口音，每次元音发得不对都觉得尴尬。", "sp": null, "gap": false, "start": 8.928, "end": 15.96, "words": [[9.031, 9.241], [9.254, 9.544], [9.557, 10.175], [10.386, 10.807], [10.82, 11.518], [11.781, 12.004], [12.017, 12.254], [12.267, 12.899], [12.912, 13.175], [13.189, 13.517], [13.531, 13.596], [13.61, 13.939], [13.952, 14.307], [14.32, 14.544], [14.557, 15.017]]}, {"kind": "s", "id": "s0_1_0", "md": "But walk around any global office in Singapore.", "zh": "但你去新加坡任何一个全球化办公室转一圈。", "sp": null, "gap": true, "start": 15.96, "end": 19.968, "words": [[16.063, 16.299], [16.313, 16.563], ], [94.844, 94.923], [94.936, 95.213], [95.226, 95.7], [95.713, 96.41], [96.423, 96.989], [97.002, 97.239], [97.252, 97.515], [97.529, 97.726], [97.739, 97.884], [97.897, 98.436], [98.45, 99.042]]}, {"kind": "s", "id": "s1_2_2", "md": "When you learn a new technical word, check where the stress falls before you use it in a meeting.", "zh": "学一个新的技术词时，在会上用之前先查一下重音在哪儿。", "sp": null, "gap": false, "start": 99.984, "end": 106.608, "words": [[100.087, 100.31], [100.323, 100.442], [100.455, 100.718], [100.731, 100.797], [100.81, 101.1], [101.113, 101.639], [101.652, 102.166], [102.389, 102.679], [102.692, 102.902], [102.916, 102.995], [103.008, 103.429], [103.442, 103.771], [103.784, 104.166], [104.179, 104.271], [104.284, 104.6], [104.613, 104.784], [104.797, 104.929], [104.942, 104.981], [104.995, 105.679]]}, {"kind": "s", "id": "s1_3_0", "md": "Fourth, ==signpost== your structure.", "zh": "第四，把结构标出来。", "sp": null, "gap": true, "start": 106.608, "end": 110.112, "words": [[106.711, 107.303], [107.579, 108.25], [108.263, 108.382], [108.395, 109.184]]}, {"kind": "s", "id": "s1_3_1", "md": "Phrases like \"two points\", \"the main issue is\", and \"so, in short\" __give listeners a map__, so they can follow you even if they miss a word or two.", "zh": "像「两点」「主要问题是」「所以简单说」这类短语，相当于给听的人一张地图，就算漏听一两个词也能跟上你。", "sp": null, "gap": false, "start": 110.112, "end": 120.912, "words": [[110.215, 110.728], [110.741, 110.965], [110.978, 111.201], [111.215, 111.754], [111.978, 112.136], [112.149, 112.438], [112.451, 112.872], [112.886, 113.346], [113.583, 113.846], [113.859, 114.386], [114.662, 114.873], [114.886, 115.228], [115.241, 115.465], [115.478, 116.004], [116.017, 116.07], [116.083, 116.504], [116.754, 117.017], [117.03, 117.162], [117.175, 117.386], [117.399, 117.715], [117.728, 117.912], [117.925, 118.241], [118.254, 118.425], [118.438, 118.583], [118.596, 118.938], [118.951, 119.044], [119.057, 119.359], [119.373, 119.517], [119.53, 120.004]]}, {"kind": "s", "id": "s1_3_2", "md": "**Clarity is a skill you can practice; your accent is just part of who you are.**", "zh": "清晰是可以练的技能；口音只是你的一部分。", "sp": null, "gap": false, "start": 120.912, "end": 126.768, "words": [[121.015, 121.554], [121.567, 121.725], [121.738, 121.791], [121.804, 122.12], [122.133, 122.251], [122.265, 122.501], [122.515, 123.251], [123.488, 123.712], [123.725, 124.159], [124.173, 124.317], [124.33, 124.62], [124.633, 124.857], [124.87, 125.028], [125.041, 125.212], [125.225, 125.436], [125.449, 125.844]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
