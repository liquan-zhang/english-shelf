<script>
const D = {"id": "048", "title": "Finding Who Really Makes the Decision", "meta": "B2 · 约 270 词 · 场景：推动决策", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Org Chart Is Only a Map", "heading_zh": "1. 组织架构图只是一张地图", "rows": [[{"id": "s0_0_0", "md": "You spend three weeks convincing a director to approve your migration plan.", "text": "You spend three weeks convincing a director to approve your migration plan.", "zh": "你花了三周说服一位总监批准你的迁移方案。", "sp": null}, {"id": "s0_0_1", "md": "She says yes in the meeting.", "text": "She says yes in the meeting.", "zh": "她在会上同意了。", "sp": null}, {"id": "s0_0_2", "md": "Then nothing moves, because a senior architect two levels below her quietly has ==doubts==, and the director will not overrule him.", "text": "Then nothing moves, because a senior architect two levels below her quietly has doubts, and the director will not overrule him.", "zh": "然后事情一点都没动，因为她下面隔两级的一位资深架构师心里有疑虑，而总监不会去否掉他。", "sp": null}], [{"id": "s0_1_0", "md": "This happens all the time in large companies.", "text": "This happens all the time in large companies.", "zh": "这种事在大公司里天天发生。", "sp": null}, {"id": "s0_1_1", "md": "The org chart tells you who signs, but not who ==shapes== the decision.", "text": "The org chart tells you who signs, but not who shapes the decision.", "zh": "组织架构图告诉你谁签字，但不告诉你谁在影响决策。", "sp": null}, {"id": "s0_1_2", "md": "Often there is a trusted engineer, a finance partner, or a product lead whose opinion the formal owner always checks first.", "text": "Often there is a trusted engineer, a finance partner, or a product lead whose opinion the formal owner always checks first.", "zh": "往往有一位被信任的工程师、财务伙伴或者产品负责人，名义上的负责人总会先问他们的意见。", "sp": null}, {"id": "s0_1_3", "md": "**Getting a yes from the wrong person is just a slower way of getting a no.**", "text": "Getting a yes from the wrong person is just a slower way of getting a no.", "zh": "从不对的人那里拿到同意，只不过是换一种更慢的方式被拒绝。", "sp": null}], [{"id": "s0_2_0", "md": "None of this is ==sinister==.", "text": "None of this is sinister.", "zh": "这里面没有什么阴谋。", "sp": null}, {"id": "s0_2_1", "md": "Leaders rely on people they trust, especially for technical details they cannot ==verify== themselves.", "text": "Leaders rely on people they trust, especially for technical details they cannot verify themselves.", "zh": "领导依赖自己信任的人，尤其是那些他们自己没法验证的技术细节。", "sp": null}, {"id": "s0_2_2", "md": "Your task is simply to find those people early.", "text": "Your task is simply to find those people early.", "zh": "你要做的只是早点找到这些人。", "sp": null}]]}, {"heading": "2. How to Find the Real Decision", "heading_zh": "2. 怎么找到真正做决定的人", "rows": [[{"id": "s1_0_0", "md": "The easiest method is to ask directly.", "text": "The easiest method is to ask directly.", "zh": "最简单的办法就是直接问。", "sp": null}, {"id": "s1_0_1", "md": "\"Besides you, who else needs to be comfortable with this before it can move forward?\"", "text": "\"Besides you, who else needs to be comfortable with this before it can move forward?\"", "zh": "「除了你，还有谁需要认可这件事，它才能往前推？」", "sp": null}, {"id": "s1_0_2", "md": "Most people will answer honestly, because it saves them trouble later.", "text": "Most people will answer honestly, because it saves them trouble later.", "zh": "大多数人都会如实回答，因为这能省掉他们以后的麻烦。", "sp": null}], [{"id": "s1_1_0", "md": "Next, watch the room.", "text": "Next, watch the room.", "zh": "接着，观察会议室。", "sp": null}, {"id": "s1_1_1", "md": "When a tough question comes up, notice whose face the director looks at before answering.", "text": "When a tough question comes up, notice whose face the director looks at before answering.", "zh": "遇到棘手的问题时，留意总监在回答前先看了谁一眼。", "sp": null}, {"id": "s1_1_2", "md": "That glance often tells you more than any ==hierarchy== diagram.", "text": "That glance often tells you more than any hierarchy diagram.", "zh": "那一眼往往比任何层级图告诉你的都多。", "sp": null}], [{"id": "s1_2_0", "md": "Once you know the ==influencers==, meet them one by one before the big meeting.", "text": "Once you know the influencers, meet them one by one before the big meeting.", "zh": "一旦知道了谁有影响力，就在大会之前一个一个去聊。", "sp": null}, {"id": "s1_2_1", "md": "Share the draft, __ask for their input__, and adjust the plan where they have a point.", "text": "Share the draft, ask for their input, and adjust the plan where they have a point.", "zh": "把草稿给他们看，听听他们的意见，有道理的地方就调整方案。", "sp": null}, {"id": "s1_2_2", "md": "**Nobody likes to be surprised in public, and nobody blocks a plan they helped to shape.**", "text": "Nobody likes to be surprised in public, and nobody blocks a plan they helped to shape.", "zh": "没人喜欢在公开场合被突然袭击，也没人会去拦一个自己参与塑造过的方案。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __close the loop__ in writing.", "text": "Finally, close the loop in writing.", "zh": "最后，用书面形式收个尾。", "sp": null}, {"id": "s1_3_1", "md": "After the decision, send a short summary that names who agreed and what happens next.", "text": "After the decision, send a short summary that names who agreed and what happens next.", "zh": "决定做出后，发一份简短的纪要，写明谁同意了、接下来做什么。", "sp": null}, {"id": "s1_3_2", "md": "A written record makes the decision ==stick==, even when the real decision makers were never on the invite.", "text": "A written record makes the decision stick, even when the real decision makers were never on the invite.", "zh": "有了书面记录，决定才能落地，哪怕真正拍板的人根本不在会议邀请里。", "sp": null}]]}], "gist": [{"q": "为什么总监在会上同意了，项目却没有推进？", "a": "因为她下面一位资深架构师心存疑虑，而总监不会推翻他的意见；签字的人和真正影响决策的人不是同一个。"}, {"q": "怎么找到真正影响决策的人？", "a": "直接问「除了你，还有谁需要认可这件事」；开会时观察遇到难题总监先看谁。"}, {"q": "找到之后怎么做？", "a": "大会前逐个单聊，分享草稿、征求意见、按合理意见调整；决定后写邮件总结谁同意了、下一步是什么。"}], "dictation": [{"id": "s0_1_3", "text": "Getting a yes from the wrong person is just a slower way of getting a no."}, {"id": "s0_1_1", "text": "The org chart tells you who signs, but not who shapes the decision."}, {"id": "s1_2_2", "text": "Nobody likes to be surprised in public, and nobody blocks a plan they helped to shape."}, {"id": "s1_3_1", "text": "After the decision, send a short summary that names who agreed and what happens next."}], "shadow": {"text": "Next, watch the room. When a tough question comes up, notice whose face the director looks at before answering. That glance often tells you more than any hierarchy diagram.", "marked": "Next, / <b>watch</b> the room. //<br>When a <b>tough</b> question comes up, / notice <b>whose</b> face the director looks at / <b>before</b> answering. //<br>That <b>glance</b> / often tells you <b>more</b> / than any hierarchy diagram. //"}, "prompts": [{"q": "你想推动把日志系统迁移到新平台，名义上的决策人是基础架构负责人。用 30 秒问他：还有谁需要认可这件事？问得自然、不显得绕过他。", "ref": "Thanks for supporting the migration, that really helps. I want to make sure we don't hit surprises later. Besides you, is there anyone else who should be comfortable with this before we start? For example, does the security team or the cost owner usually need to review changes like this? I'd rather talk to them now than discover a concern two weeks in.", "ref_zh": "谢谢你支持这次迁移，真的帮了大忙。我想确保后面不会出意外。除了你之外，在我们开始前还有谁需要认可这件事吗？比如说，像这样的改动，安全团队或者成本负责人通常需要 review 吗？我宁愿现在就去找他们聊，也不想做了两周才发现有顾虑。", "id": "ref0"}, {"q": "大评审会前，你约了一位关键的资深工程师单独聊你的方案。用 30 秒开场，请他提意见。", "ref": "Thanks for making time. Next week I'm presenting the caching proposal, and you know this service better than anyone, so I wanted your view before it goes in front of a big group. Here's the draft. I'm most unsure about the invalidation part. Where do you see the biggest risk? If you think something's wrong, I'd much rather fix it now.", "ref_zh": "谢谢你抽时间。下周我要讲缓存方案，你比谁都了解这个服务，所以我想在拿到大场合之前先听听你的看法。这是草稿。我最没把握的是失效那一块。你觉得最大的风险在哪儿？如果你觉得有什么不对，我非常希望现在就改掉。", "id": "ref1"}], "words": [{"w": "doubt", "ipa": "/daʊt/", "zh": "疑虑", "ex": "I have some doubts about the rollback plan for the database.", "id": "w0"}, {"w": "shape (v.)", "ipa": "/ʃeɪp/", "zh": "塑造、影响", "ex": "Her feedback shaped the final version of the design.", "tts_w": "shape", "id": "w1"}, {"w": "sinister", "ipa": "/ˈsɪnɪstər/", "zh": "阴险的、不怀好意的", "ex": "The delay isn't sinister; they just lost tw  52.807]]}, {"kind": "s", "id": "s1_0_1", "md": "\"Besides you, who else needs to be comfortable with this before it can move forward?\"", "zh": "「除了你，还有谁需要认可这件事，它才能往前推？」", "sp": null, "gap": false, "start": 53.208, "end": 58.008, "words": [[53.432, 53.721], [53.8, 53.984], [54.445, 54.563], [54.576, 54.8], [54.813, 55.05], [55.063, 55.142], [55.155, 55.3], [55.313, 55.879], [55.892, 56.076], [56.09, 56.274], [56.287, 56.669], [56.682, 56.761], [56.774, 56.919], [56.932, 57.129], [57.142, 57.603]]}, {"kind": "s", "id": "s1_0_2", "md": "Most people will answer honestly, because it saves them trouble later.", "zh": "大多数人都会如实回答，因为这能省掉他们以后的麻烦。", "sp": null, "gap": false, "start": 58.008, "end": 62.04, "words": [[58.113, 58.311], [58.324, 58.64], [58.653, 58.797], [58.811, 59.153], [59.166, 59.719], [59.982, 60.271], [60.284, 60.376], [60.39, 60.771], [60.784, 60.916], [60.929, 61.271], [61.284, 61.653]]}, {"kind": "s", "id": "s1_1_0", "md": "Next, watch the room.", "zh": "接着，观察会议室。", "sp": null, "gap": true, "start": 62.04, "end": 63.912, "words": [[62.145, 62.487], [62.658, 62.895], [62.908, 62.987], [63.001, 63.29]]}, {"kind": "s", "id": "s1_1_1", "md": "When a tough question comes up, notice whose face the director looks at before answering.", "zh": "遇到棘手的问题时，留意总监在回答前先看了谁一眼。", "sp": null, "gap": false, "start": 63.912, "end": 68.904, "words": [[64.03, 64.123], [64.136, 64.188], [64.201, 64.451], [64.465, 64.886], [64.899, 65.201], [65.215, 65.412], [65.833, 66.149], [66.162, 66.346], [66.359, 66.688], [66.701, 66.794], [66.807, 67.254], [67.267, 67.57], [67.583, 67.675], [67.688, 68.03], [68.044, 68.517]]}, {"kind": "s", "id": "s1_1_2", "md": "That glance often tells you more than any ==hierarchy== diagram.", "zh": "那一眼往往比任何层级图告诉你的都多。", "sp": null, "gap": false, "start": 68.904, "end": 73.104, "words": [[69.022, 69.18], [69.193, 69.614], [69.733, 70.088], [70.101, 70.378], [70.391, 70.509], [70.522, 70.865], [70.878, 71.062], [71.207, 71.457], [71.47, 72.088], [72.101, 72.707]]}, {"kind": "s", "id": "s1_2_0", "md": "Once you know the ==influencers==, meet them one by one before the big meeting.", "zh": "一旦知道了谁有影响力，就在大会之前一个一个去聊。", "sp": null, "gap": true, "start": 73.104, "end": 77.568, "words": [[73.222, 73.407], [73.42, 73.499], [73.512, 73.683], [73.696, 73.815], [73.828, 74.67], [74.972, 75.17], [75.183, 75.341], [75.354, 75.565], [75.578, 75.749], [75.762, 76.091], [76.104, 76.459], [76.472, 76.565], [76.578, 76.788], [76.801, 77.17]]}, {"kind": "s", "id": "s1_2_1", "md": "Share the draft, __ask for their input__, and adjust the plan where they have a point.", "zh": "把草稿给他们看，听听他们的意见，有道理的地方就调整方案。", "sp": null, "gap": false, "start": 77.568, "end": 82.416, "words": [[77.673, 77.897], [77.91, 77.989], [78.002, 78.529], [78.818, 79.081], [79.094, 79.2], [79.213, 79.384], [79.397, 79.857], [80.186, 80.252], [80.265, 80.634], [80.647, 80.752], [80.765, 81.134], [81.147, 81.252], [81.265, 81.371], [81.384, 81.502], [81.515, 81.568], [81.581, 82.015]]}, {"kind": "s", "id": "s1_2_2", "md": "**Nobody likes to be surprised in public, and nobody blocks a plan they helped to shape.**", "zh": "没人喜欢在公开场合被突然袭击，也没人会去拦一个自己参与塑造过的方案。", "sp": null, "gap": false, "start": 82.416, "end": 87.576, "words": [[82.521, 82.903], [82.916, 83.205], [83.219, 83.311], [83.324, 83.442], [83.455, 83.995], [84.008, 84.1], [84.113, 84.561], [84.89, 84.995], [85.008, 85.403], [85.416, 85.784], [85.798, 85.85], [85.863, 86.245], [86.258, 86.377], [86.39, 86.679], [86.692, 86.745], [86.758, 87.192]]}, {"kind": "s", "id": "s1_3_0", "md": "Finally, __close the loop__ in writing.", "zh": "最后，用书面形式收个尾。", "sp": null, "gap": true, "start": 87.576, "end": 90.12, "words": [[87.734, 88.181], [88.444, 88.787], [88.8, 88.905], [88.918, 89.194], [89.208, 89.326], [89.339, 89.721]]}, {"kind": "s", "id": "s1_3_1", "md": "After the decision, send a short summary that names who agreed and what happens next.", "zh": "决定做出后，发一份简短的纪要，写明谁同意了、接下来做什么。", "sp": null, "gap": false, "star const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
