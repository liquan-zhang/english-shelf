<script>
const D = {"id": "048", "title": "Finding Who Really Makes the Decision", "meta": "B2 · 约 270 词 · 场景：推动决策", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Org Chart Is Only a Map", "heading_zh": "1. 组织架构图只是一张地图", "rows": [[{"id": "s0_0_0", "md": "You spend three weeks convincing a director to approve your migration plan.", "text": "You spend three weeks convincing a director to approve your migration plan.", "zh": "你花了三周说服一位总监批准你的迁移方案。", "sp": null}, {"id": "s0_0_1", "md": "She says yes in the meeting.", "text": "She says yes in the meeting.", "zh": "她在会上同意了。", "sp": null}, {"id": "s0_0_2", "md": "Then nothing moves, because a senior architect two levels below her quietly has ==doubts==, and the director will not overrule him.", "text": "Then nothing moves, because a senior architect two levels below her quietly has doubts, and the director will not overrule him.", "zh": "然后事情一点都没动，因为她下面隔两级的一位资深架构师心里有疑虑，而总监不会去否掉他。", "sp": null}], [{"id": "s0_1_0", "md": "This happens all the time in large companies.", "text": "This happens all the time in large companies.", "zh": "这种事在大公司里天天发生。", "sp": null}, {"id": "s0_1_1", "md": "The org chart tells you who signs, but not who ==shapes== the decision.", "text": "The org chart tells you who signs, but not who shapes the decision.", "zh": "组织架构图告诉你谁签字，但不告诉你谁在影响决策。", "sp": null}, {"id": "s0_1_2", "md": "Often there is a trusted engineer, a finance partner, or a product lead whose opinion the formal owner always checks first.", "text": "Often there is a trusted engineer, a finance partner, or a product lead whose opinion the formal owner always checks first.", "zh": "往往有一位被信任的工程师、财务伙伴或者产品负责人，名义上的负责人总会先问他们的意见。", "sp": null}, {"id": "s0_1_3", "md": "**Getting a yes from the wrong person is just a slower way of getting a no.**", "text": "Getting a yes from the wrong person is just a slower way of getting a no.", "zh": "从不对的人那里拿到同意，只不过是换一种更慢的方式被拒绝。", "sp": null}], [{"id": "s0_2_0", "md": "None of this is ==sinister==.", "text": "None of this is sinister.", "zh": "这里面没有什么阴谋。", "sp": null}, {"id": "s0_2_1", "md": "Leaders rely on people they trust, especially for technical details they cannot ==verify== themselves.", "text": "Leaders rely on people they trust, especially for technical details they cannot verify themselves.", "zh": "领导依赖自己信任的人，尤其是那些他们自己没法验证的技术细节。", "sp": null}, {"id": "s0_2_2", "md": "Your task is simply to find those people early.", "text": "Your task is simply to find those people early.", "zh": "你要做的只是早点找到这些人。", "sp": null}]]}, {"heading": "2. How to Find the Real Decision", "heading_zh": "2. 怎么找到真正做决定的人", "rows": [[{"id": "s1_0_0", "md": "The easiest method is to ask directly.", "text": "The easiest method is to ask directly.", "zh": "最简单的办法就是直接问。", "sp": null}, {"id": "s1_0_1", "md": "\"Besides you, who else needs to be comfortable with this before it can move forward?\"", "text": "\"Besides you, who else needs to be comfortable with this before it can move forward?\"", "zh": "「除了你，还有谁需要认可这件事，它才能往前推？」", "sp": null}, {"id": "s1_0_2", "md": "Most people will answer honestly, because it saves them trouble later.", "text": "Most people will answer honestly, because it saves them trouble later.", "zh": "大多数人都会如实回答，因为这能省掉他们以后的麻烦。", "sp": null}], [{"id": "s1_1_0", "md": "Next, watch the room.", "text": "Next, watch the room.", "zh": "接着，观察会议室。", "sp": null}, {"id": "s1_1_1", "md": "When a tough question comes up, notice whose face the director looks at before answering.", "text": "When a tough question comes up, notice whose face the director looks at before answering.", "zh": "遇到棘手的问题时，留意总监在回答前先看了谁一眼。", "sp": null}, {"id": "s1_1_2", "md": "That glance often tells you more than any ==hierarchy== diagram.", "text": "That glance often tells you more than any hierarchy diagram.", "zh": "那一眼往往比任何层级图告诉你的都多。", "sp": null}], [{"id": "s1_2_0", "md": "Once you know the ==influencers==, meet them one by one before the big meeting.", "text": "Once you know the influencers, meet them one by one before the big meeting.", "zh": "一旦知道了谁有影响力，就在大会之前一个一个去聊。", "sp": null}, {"id": "s1_2_1", "md": "Share the draft, __ask for their input__, and adjust the plan where they have a point.", "text": "Share the draft, ask for their input, and adjust the plan where they have a point.", "zh": "把草稿给他们看，听听他们的意见，有道理的地方就调整方案。", "sp": null}, {"id": "s1_2_2", "md": "**Nobody likes to be surprised in public, and nobody blocks a plan they helped to shape.**", "text": "Nobody likes to be surprised in public, and nobody blocks a plan they helped to shape.", "zh": "没人喜欢在公开场合被突然袭击，也没人会去拦一个自己参与塑造过的方案。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, __close the loop__ in writing.", "text": "Finally, close the loop in writing.", "zh": "最后，用书面形式收个尾。", "sp": null}, {"id": "s1_3_1", "md": "After the decision, send a short summary that names who agreed and what happens next.", "text": "After the decision, send a short summary that names who agreed and what happens next.", "zh": "决定做出后，发一份简短的纪要，写明谁同意了、接下来做什么。", "sp": null}, {"id": "s1_3_2", "md": "A written record makes the decision ==stick==, even when the real decision makers were never on the invite.", "text": "A written record makes the decision stick, even when the real decision makers were never on the invite.", "zh": "有了书面记录，决定才能落地，哪怕真正拍板的人根本不在会议邀请里。", "sp": null}]]}], "gist": [{"q": "为什么总监在会上同意了，项目却没有推进？", "a": "因为她下面一位资深架构师心存疑虑，而总监不会推翻他的意见；签字的人和真正影响决策的人不是同一个。"}, {"q": "怎么找到真正影响决策的人？", "a": "直接问「除了你，还有谁需要认可这件事」；开会时观察遇到难题总监先看谁。"}, {"q": "找到之后怎么做？", "a": "大会前逐个单聊，分享草稿、征求意见、按合理意见调整；决定后写邮件总结谁同意了、下一步是什么。"}], "dictation": [{"id": "s0_1_3", "text": "Getting a yes from the wrong person is just a slower way of getting a no."}, {"id": "s0_1_1", "text": "The org chart tells you who signs, but not who shapes the decision."}, {"id": "s1_2_2", "text": "Nobody likes to be surprised in public, and nobody blocks a plan they helped to shape."}, {"id": "s1_3_1", "text": "After the decision, send a short summary that names who agreed and what happens next."}], "shadow": {"text": "Next, watch the room. When a tough question comes up, notice whose face the director looks at before answering. That glance often tells you more than any hierarchy diagram.", "marked": "Next, / <b>watch</b> the room. //<br>When a <b>tough</b> question comes up, / notice <b>whose</b> face the director looks at / <b>before</b> answering. //<br>That <b>glance</b> / often tells you <b>more</b> / than any hierarchy diagram. //"}, "prompts": [{"q": "你想推动把日志系统迁移到新平台，名义上的决策人是基础架构负责人。用 30 秒问他：还有谁需要认可这件事？问得自然、不显得绕过他。", "ref": "Thanks for supporting the migration, that really helps. I want to make sure we don't hit surprises later. Besides you, is there anyone else who should be comfortable with this before we start? For example, does the security team or the cost owner usually need to review changes like this? I'd rather talk to them now than discover a concern two weeks in.", "ref_zh": "谢谢你支持这次迁移，真的帮了大忙。我想确保后面不会出意外。除了你之外，在我们开始前还有谁需要认可这件事吗？比如说，像这样的改动，安全团队或者成本负责人通常需要 review 吗？我宁愿现在就去找他们聊，也不想做了两周才发现有顾虑。", "id": "ref0"}, {"q": "大评审会前，你约了一位关键的资深工程师单独聊你的方案。用 30 秒开场，请他提意见。", "ref": "Thanks for making time. Next week I'm presenting the caching proposal, and you know this service better than anyone, so I wanted your view before it goes in front of a big group. Here's the draft. I'm most unsure about the invalidation part. Where do you see the biggest risk? If you think something's wrong, I'd much rather fix it now.", "ref_zh": "谢谢你抽时间。下周我要讲缓存方案，你比谁都了解这个服务，所以我想在拿到大场合之前先听听你的看法。这是草稿。我最没把握的是失效那一块。你觉得最大的风险在哪儿？如果你觉得有什么不对，我非常希望现在就改掉。", "id": "ref1"}], "words": [{"w": "doubt", "ipa": "/daʊt/", "zh": "疑虑", "ex": "I have some doubts about the rollback plan for the database.", "id": "w0"}, {"w": "shape (v.)", "ipa": "/ʃeɪp/", "zh": "塑造、影响", "ex": "Her feedback shaped the final version of the design.", "tts_w": "shape", "id": "w1"}, {"w": "sinister", "ipa": "/ˈsɪnɪstər/", "zh": "阴险的、不怀好意的", "ex": "The delay isn't sinister; they just lost tw const h = (tag, attrs = {}, ...kids) => {

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('../sw.js', { scope: '../' });</script>
</body>
