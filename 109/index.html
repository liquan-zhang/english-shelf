const D = {"id": "109", "type": "dialogue", "title": "Paying and Splitting the Bill", "meta": "B2 · 约 250 词 · 场景：结账分单、刷卡失败与开发票", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Server", "name_zh": "服务员", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "账单上「你」问了哪两项费用？发现了什么错误？", "a": "百分之十是服务费，百分之九是消费税；气泡水只点了一瓶却收了两瓶的钱。"}, {"q": "四个人怎么分账、怎么付？", "a": "平均分成四份；两个人刷卡，两个人用 PayNow。"}, {"q": "第一张卡出了什么问题？「你」最后要了什么？", "a": "第一张卡被拒，换了一张才通过，「你」确认了第一张没扣款；最后要了抬头是公司名的发票。"}], "dictation": [{"id": "s0_0_0", "text": "Excuse me, could we get the bill, please?"}, {"id": "s0_6_0", "text": "Thanks. Is it possible to split the bill four ways?"}, {"id": "s1_3_0", "text": "Let me try this one. Could you check that the first one didn't go through? I don't want to be charged twice."}, {"id": "s1_5_0", "text": "Great. Could I also get a tax invoice with the company name on it? It's for a team dinner."}], "shadow": {"speaker": "A", "text": "Really? That's strange. Could you try it once more? Maybe tap it instead of inserting it.", "marked": "Really? //<br>That's <b>strange</b>. //<br>Could you try it <b>once more</b>? //<br>Maybe <b>tap</b> it / instead of <b>inserting</b> it. //"}, "prompts": [{"q": "你和三个朋友吃饭，其中一个人点了很贵的酒，你们不想平均分。跟服务员说明你们想怎么分。", "ref": "Hi, could we split the bill? But not evenly, if that's okay. Could you put the bottle of wine on one bill, for my friend here? Then split everything else three ways between the rest of us. And could you print separate receipts, please? Sorry, I know that's a bit complicated.", "ref_zh": "你好，账单能分开吗？不过不平均分，可以吗？那瓶酒单独算一张单，给我这位朋友。其余的我们三个人平分。麻烦分别打印收据。不好意思，我知道有点复杂。", "id": "ref0"}, {"q": "回家后看银行通知，发现餐厅扣了你两次钱。打电话给餐厅，说明日期、金额，要求退回多扣的那笔。", "ref": "Hi, I had dinner at your restaurant last Friday evening, a table of four. I just checked my bank app, and I've been charged twice for the same amount, about one hundred and twenty dollars. I think the first payment went through after all. Could you check your records and refund the second charge? I can send you a screenshot.", "ref_zh": "你好，我上周五晚上在你们餐厅吃饭，四个人一桌。我刚看了银行应用，同样的金额被扣了两次，每次大概一百二十块。我想第一笔其实是扣成功了。能查一下记录、把第二笔退给我吗？我可以发截图给你们。", "id": "ref1"}], "words": [{"w": "service charge", "ipa": "/ˈsɜːrvɪs tʃɑːrdʒ/", "zh": "服务费", "ex": "Most restaurants here add a ten percent service charge.", "id": "w0"}, {"w": "GST", "ipa": "/ˌdʒiː es ˈtiː/", "zh": "消费税（新加坡）", "ex": "Is GST included in this price?", "id": "w1"}, {"w": "overcharge (v.)", "ipa": "/ˌoʊvərˈtʃɑːrdʒ/", "zh": "多收钱", "ex": "I think the shop overcharged me for the eggs.", "tts_w": "overcharge", "id": "w2"}, {"w": "itemise", "ipa": "/ˈaɪtəmaɪz/", "zh": "逐项列出", "ex": "Could you itemise the bill for us?", "id": "w3"}, {"w": "split the bill", "ipa": "/splɪt ðə bɪl/", "zh": "分摊账单", "ex": "Let's split the bill. It's easier.", "id": "w4"}, {"w": "declined", "ipa": "/dɪˈklaɪnd/", "zh": "（卡）被拒", "ex": "My card was declined at the supermarket.", "id": "w5"}, {"w": "approved", "ipa": "/əˈpruːvd/", "zh": "（交易）通过", "ex": "Your payment has been approved.", "id": "w6"}, {"w": "tax invoice", "ipa": "/tæks ˈɪnvɔɪs/", "zh": "税务发票", "ex": "Please send me a tax invoice for the repair.", "id": "w7"}, {"w": "breakdown", "ipa": "/ˈbreɪkdaʊn/", "zh": "明细；分项", "ex": "Can I see a breakdown of the costs?", "id": "w8"}], "sections": [{"heading": "1. Checking the Bill", "heading_zh": "1. 核对账单", "rows": [[{"id": "s0_0_0", "md": "**Excuse me, could we get the bill, please?**", "text": "Excuse me, could we get the bill, please?", "zh": "不好意思，麻烦买单。", "sp": "A"}], [{"id": "s0_1_0", "md": "Sure, here you go. Take your time.", "text": "Sure, here you go. Take your time.", "zh": "好的，给您。您慢慢看。", "sp": "B"}], [{"id": "s0_2_0", "md": "Thanks. Quick question. What's this ten percent here?", "text": "Thanks. Quick question. What's this ten percent here?", "zh": "谢谢。问一下，这里的百分之十是什么？", "sp": "A"}], [{"id": "s0_3_0", "md": "That's the ==service charge==, and the nine percent below it is ==GST==.", "text": "That's the service charge, and the nine percent below it is GST.", "zh": "那是服务费，下面的百分之九是消费税。", "sp": "B"}], [{"id": "s0_4_0", "md": "I see. And I think we've been ==overcharged== for the water. We only had one bottle of sparkling, not two.", "text": "I see. And I think we've been overcharged for the water. We only had one bottle of sparkling, not two.", "zh": "明白了。另外水好像多收了。我们只要了一瓶气泡水，不是两瓶。", "sp": "A"}], [{"id": "s0_5_0", "md": "Let me check. You're right, sorry about that. I'll __take it off__ right away.", "text": "Let me check. You're right, sorry about that. I'll take it off right away.", "zh": "我查一下。您说得对，不好意思。我马上去掉。", "sp": "B"}], [{"id": "s0_6_0", "md": "**Thanks. Is it possible to split the bill four ways?**", "text": "Thanks. Is it possible to split the bill four ways?", "zh": "谢谢。账单能分成四份吗？", "sp": "A"}], [{"id": "s0_7_0", "md": "We can split it evenly, or ==itemise== it by what each person ordered. Which would you prefer?", "text": "We can split it evenly, or itemise it by what each person ordered. Which would you prefer?", "zh": "可以平均分，也可以按每个人点的分开算。您想怎么分？", "sp": "B"}], [{"id": "s0_8_0", "md": "Evenly is fine. Two of us will pay by card, and the other two will __pay by PayNow__.", "text": "Evenly is fine. Two of us will pay by card, and the other two will pay by PayNow.", "zh": "平均分就行。我们两个刷卡，另外两个用 PayNow 付。", "sp": "A"}], [{"id": "s0_9_0", "md": "No problem. The PayNow code is on the counter.", "text": "No problem. The PayNow code is on the counter.", "zh": "没问题。PayNow 的二维码在柜台上。", "sp": "B"}]]}, {"heading": "2. A Card Problem and a Receipt", "heading_zh": "2. 刷卡失败与开发票", "rows": [[{"id": "s1_0_0", "md": "Sorry, sir, your card has been ==declined==.", "text": "Sorry, sir, your card has been declined.", "zh": "不好意思，先生，您的卡被拒了。", "sp": "B"}], [{"id": "s1_1_0", "md": "Really? That's strange. Could you try it once more? Maybe __tap it__ instead of inserting it.", "text": "Really? That's strange. Could you try it once more? Maybe tap const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;
const prog = JSON.parse(localStorage.getItem(KEY) || '{}');
const steps = [];
function step(id, name, time, how, body) {
  const cb = h('input', { type: 'checkbox' });
  cb.checked = !!prog[id];
  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));
}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
