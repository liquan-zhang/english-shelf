const D = {"id": "109", "type": "dialogue", "title": "Paying and Splitting the Bill", "meta": "B2 · 约 250 词 · 场景：结账分单、刷卡失败与开发票", "voice": "en-US-AndrewNeural", "rate": "-5%", "speakers": {"A": {"name": "You", "name_zh": "你", "voice": "en-US-AndrewNeural"}, "B": {"name": "Server", "name_zh": "服务员", "voice": "en-IN-NeerjaNeural"}}, "gist": [{"q": "账单上「你」问了哪两项费用？发现了什么错误？", "a": "百分之十是服务费，百分之九是消费税；气泡水只点了一瓶却收了两瓶的钱。"}, {"q": "四个人怎么分账、怎么付？", "a": "平均分成四份；两个人刷卡，两个人用 PayNow。"}, {"q": "第一张卡出了什么问题？「你」最后要了什么？", "a": "第一张卡被拒，换了一张才通过，「你」确认了第一张没扣款；最后要了抬头是公司名的发票。"}], "dictation": [{"id": "s0_0_0", "text": "Excuse me, could we get the bill, please?"}, {"id": "s0_6_0", "text": "Thanks. Is it possible to split the bill four ways?"}, {"id": "s1_3_0", "text": "Let me try this one. Could you check that the first one didn't go through? I don't want to be charged twice."}, {"id": "s1_5_0", "text": "Great. Could I also get a tax invoice with the company name on it? It's for a team dinner."}], "shadow": {"speaker": "A", "text": "Really? That's strange. Could you try it once more? Maybe tap it instead of inserting it.", "marked": "Really? //<br>That's <b>strange</b>. //<br>Could you try it <b>once more</b>? //<br>Maybe <b>tap</b> it / instead of <b>inserting</b> it. //"}, "prompts": [{"q": "你和三个朋友吃饭，其中一个人点了很贵的酒，你们不想平均分。跟服务员说明你们想怎么分。", "ref": "Hi, could we split the bill? But not evenly, if that's okay. Could you put the bottle of wine on one bill, for my friend here? Then split everything else three ways between the rest of us. And could you print separate receipts, please? Sorry, I know that's a bit complicated.", "ref_zh": "你好，账单能分开吗？不过不平均分，可以吗？那瓶酒单独算一张单，给我这位朋友。其余的我们三个人平分。麻烦分别打印收据。不好意思，我知道有点复杂。", "id": "ref0"}, {"q": "回家后看银行通知，发现餐厅扣了你两次钱。打电话给餐厅，说明日期、金额，要求退回多扣的那笔。", "ref": "Hi, I had dinner at your restaurant last Friday evening, a table of four. I just checked my bank app, and I've been charged twice for the same amount, about one hundred and twenty dollars. I think the first payment went through after all. Could you check your records and refund the second charge? I can send you a screenshot.", "ref_zh": "你好，我上周五晚上在你们餐厅吃饭，四个人一桌。我刚看了银行应用，同样的金额被扣了两次，每次大概一百二十块。我想第一笔其实是扣成功了。能查一下记录、把第二笔退给我吗？我可以发截图给你们。", "id": "ref1"}], "words": [{"w": "service charge", "ipa": "/ˈsɜːrvɪs tʃɑːrdʒ/", "zh": "服务费", "ex": "Most restaurants here add a ten percent service charge.", "id": "w0"}, {"w": "GST", "ipa": "/ˌdʒiː es ˈtiː/", "zh": "消费税（新加坡）", "ex": "Is GST included in this price?", "id": "w1"}, {"w": "overcharge (v.)", "ipa": "/ˌoʊvərˈtʃɑːrdʒ/", "zh": "多收钱", "ex": "I think the shop overcharged me for the eggs.", "tts_w": "overcharge", "id": "w2"}, {"w": "itemise", "ipa": "/ˈaɪtəmaɪz/", "zh": "逐项列出", "ex": "Could you itemise the bill for us?", "id": "w3"}, {"w": "split the bill", "ipa": "/splɪt ðə bɪl/", "zh": "分摊账单", "ex": "Let's split the bill. It's easier.", "id": "w4"}, {"w": "declined", "ipa": "/dɪˈklaɪnd/", "zh": "（卡）被拒", "ex": "My card was declined at the supermarket.", "id": "w5"}, {"w": "approved", "ipa": "/əˈpruːvd/", "zh": "（交易）通过", "ex": "Your payment has been approved.", "id": "w6"}, {"w": "tax invoice", "ipa": "/tæks ˈɪnvɔɪs/", "zh": "税务发票", "ex": "Please send me a tax invoice for the repair.", "id": "w7"}, {"w": "breakdown", "ipa": "/ˈbreɪkdaʊn/", "zh": "明细；分项", "ex": "Can I see a breakdown of the costs?", "id": "w8"}], "sections": [{"heading": "1. Checking the Bill", "heading_zh": "1. 核对账单", "rows": [[{"id": "s0_0_0", "md": "**Excuse me, could we get the bill, please?**", "text": "Excuse me, could we get the bill, please?", "zh": "不好意思，麻烦买单。", "sp": "A"}], [{"id": "s0_1_0", "md": "Sure, here you go. Take your time.", "text": "Sure, here you go. Take your time.", "zh": "好的，给您。您慢慢看。", "sp": "B"}], [{"id": "s0_2_0", "md": "Thanks. Quick question. What's this ten percent here?", "text": "Thanks. Quick question. What's this ten percent here?", "zh": "谢谢。问一下，这里的百分之十是什么？", "sp": "A"}], [{"id": "s0_3_0", "md": "That's the ==service charge==, and the nine percent below it is ==GST==.", "text": "That's the service charge, and the nine percent below it is GST.", "zh": "那是服务费，下面的百分之九是消费税。", "sp": "B"}], [{"id": "s0_4_0", "md": "I see. And I think we've been ==overcharged== for the water. We only had one bottle of sparkling, not two.", "text": "I see. And I think we've been overcharged for the water. We only had one bottle of sparkling, not two.", "zh": "明白了。另外水好像多收了。我们只要了一瓶气泡水，不是两瓶。", "sp": "A"}], [{"id": "s0_5_0", "md": "Let me check. You're right, sorry about that. I'll __take it off__ right away.", "text": "Let me check. You're right, sorry about that. I'll take it off right away.", "zh": "我查一下。您说得对，不好意思。我马上去掉。", "sp": "B"}], [{"id": "s0_6_0", "md": "**Thanks. Is it possible to split the bill four ways?**", "text": "Thanks. Is it possible to split the bill four ways?", "zh": "谢谢。账单能分成四份吗？", "sp": "A"}], [{"id": "s0_7_0", "md": "We can split it evenly, or ==itemise== it by what each person ordered. Which would you prefer?", "text": "We can split it evenly, or itemise it by what each person ordered. Which would you prefer?", "zh": "可以平均分，也可以按每个人点的分开算。您想怎么分？", "sp": "B"}], [{"id": "s0_8_0", "md": "Evenly is fine. Two of us will pay by card, and the other two will __pay by PayNow__.", "text": "Evenly is fine. Two of us will pay by card, and the other two will pay by PayNow.", "zh": "平均分就行。我们两个刷卡，另外两个用 PayNow 付。", "sp": "A"}], [{"id": "s0_9_0", "md": "No problem. The PayNow code is on the counter.", "text": "No problem. The PayNow code is on the counter.", "zh": "没问题。PayNow 的二维码在柜台上。", "sp": "B"}]]}, {"heading": "2. A Card Problem and a Receipt", "heading_zh": "2. 刷卡失败与开发票", "rows": [[{"id": "s1_0_0", "md": "Sorry, sir, your card has been ==declined==.", "text": "Sorry, sir, your card has been declined.", "zh": "不好意思，先生，您的卡被拒了。", "sp": "B"}], [{"id": "s1_1_0", "md": "Really? That's strange. Could you try it once more? Maybe __tap it__ instead of inserting it.", "text": "Really? That's strange. Could you try it once more? Maybe tap it instead of inserting it.", "zh": "真的吗？奇怪。能再试一次吗？也许用拍卡的，不要插卡。", "sp": "A"}], [{"id": "s1_2_0", "md": "Same result, I'm afraid. Do you have another card?", "text": "Same result, I'm afraid. Do you have another card?", "zh": "恐怕还是一样。您有别的卡吗？", "sp": "B"}], [{"id": "s1_3_0", "md": "**Let me try this one. Could you check that the first one didn't go through? I don't want to be charged twice.**", "text": "Let me try this one. Could you check that the first one didn't go through? I don't want to be charged twice.", "zh": "我试试这张。能确认一下第一张没扣款成功吗？我不想被扣两次。", "sp": "A"}], [{"id": "s1_4_0", "md": "Don't worry, it didn't go through. This one's ==approved==.", "text": "Don't worry, it didn't go through. This one's approved.", "zh": "放心，第一张没扣成功。这张通过了。", "sp": "B"}], [{"id": "s1_5_0", "md": "Great. Could I also get a ==tax invoice== with the company name on it? It's for a team dinner.", "text": "Great. Could I also get a tax invoice with the company name on it? It's for a team dinner.", "zh": "好的。能开一张抬头是公司名字的发票吗？这是团队聚餐。", "sp": "A"}], [{"id": "s1_6_0", "md": "Sure. I'll need the company name and registration number.", "text": "Sure. I'll need the company name and registration number.", "zh": "可以。我需要公司名称和注册号。", "sp": "B"}], [{"id": "s1_7_0", "md": "I'll __write it down__ for you. It's quite a long name.", "text": "I'll write it down for you. It's quite a long name.", "zh": "我给你写下来，名字挺长的。", "sp": "A"}], [{"id": "s1_8_0", "md": "Thank you. Here's the invoice, and here's a ==breakdown== for everyone.", "text": "Thank you. Here's the invoice, and here's a breakdown for everyone.", "zh": "谢谢。这是发票，这是给大家的分账明细。", "sp": "B"}], [{"id": "s1_9_0", "md": "**Thanks. That was a lovely dinner, by the way.**", "text": "Thanks. That was a lovely dinner, by the way.", "zh": "谢谢。对了，今晚的饭很好吃。", "sp": "A"}], [{"id": "s1_10_0", "md": "Glad you enjoyed it. Please come again.", "text": "Glad you enjoyed it. Please come again.", "zh": "很高兴您喜欢。欢迎再来。", "sp": "B"}]]}], "karaoke": [{"kind": "h", "id": "h0", "md": .776, "end": 79.464, "words": [[73.881, 73.973], [73.987, 74.052], [74.065, 74.289], [74.302, 74.487], [74.5, 74.723], [75.158, 75.276], [75.289, 75.368], [75.381, 75.644], [75.658, 75.763], [75.776, 75.855], [75.868, 76.21], [76.223, 76.355], [76.368, 76.618], [76.631, 76.789], [76.802, 77.065], [77.5, 77.552], [77.565, 77.697], [77.71, 77.815], [77.829, 77.881], [77.894, 77.987], [78.0, 78.421], [78.434, 79.079]]}, {"kind": "s", "id": "s1_4_0", "md": "Don't worry, it didn't go through. This one's ==approved==.", "zh": "放心，第一张没扣成功。这张通过了。", "sp": "B", "gap": false, "start": 79.464, "end": 85.104, "words": [[79.564, 80.038], [80.051, 80.538], [80.696, 80.867], [80.88, 81.182], [81.196, 81.406], [81.419, 81.84], [82.751, 83.172], [83.185, 83.54], [83.553, 84.146]]}, {"kind": "s", "id": "s1_5_0", "md": "Great. Could I also get a ==tax invoice== with the company name on it? It's for a team dinner.", "zh": "好的。能开一张抬头是公司名字的发票吗？这是团队聚餐。", "sp": "A", "gap": false, "start": 85.104, "end": 90.552, "words": [[85.209, 85.551], [85.986, 86.091], [86.104, 86.222], [86.236, 86.512], [86.525, 86.67], [86.683, 86.736], [86.749, 87.157], [87.17, 87.604], [87.617, 87.736], [87.749, 87.815], [87.828, 88.183], [88.196, 88.42], [88.433, 88.604], [88.617, 88.788], [89.222, 89.341], [89.354, 89.499], [89.512, 89.564], [89.578, 89.828], [89.841, 90.157]]}, {"kind": "s", "id": "s1_6_0", "md": "Sure. I'll need the company name and registration number.", "zh": "可以。我需要公司名称和注册号。", "sp": "B", "gap": false, "start": 90.552, "end": 96.072, "words": [[90.652, 91.257], [92.155, 92.431], [92.444, 92.694], [92.707, 92.799], [92.813, 93.26], [93.273, 93.641], [93.655, 93.865], [93.878, 94.615], [94.628, 95.128]]}, {"kind": "s", "id": "s1_7_0", "md": "I'll __write it down__ for you. It's quite a long name.", "zh": "我给你写下来，名字挺长的。", "sp": "A", "gap": false, "start": 96.072, "end": 98.928, "words": [[96.177, 96.256], [96.269, 96.401], [96.414, 96.493], [96.506, 96.73], [96.743, 96.927], [96.94, 97.111], [97.546, 97.651], [97.664, 97.875], [97.888, 97.914], [97.927, 98.23], [98.243, 98.532]]}, {"kind": "s", "id": "s1_8_0", "md": "Thank you. Here's the invoice, and here's a ==breakdown== for everyone.", "zh": "谢谢。这是发票，这是给大家的分账明细。", "sp": "B", "gap": false, "start": 98.928, "end": 105.432, "words": [[99.028, 99.489], [99.502, 99.778], [100.689, 101.175], [101.189, 101.346], [101.36, 101.978], [102.123, 102.36], [102.373, 102.715], [102.728, 102.794], [102.807, 103.478], [103.491, 103.781], [103.794, 104.517]]}, {"kind": "s", "id": "s1_9_0", "md": "**Thanks. That was a lovely dinner, by the way.**", "zh": "谢谢。对了，今晚的饭很好吃。", "sp": "A", "gap": false, "start": 105.432, "end": 108.384, "words": [[105.564, 105.971], [106.419, 106.511], [106.524, 106.656], [106.669, 106.721], [106.735, 107.129], [107.143, 107.471], [107.498, 107.629], [107.643, 107.735], [107.748, 107.998]]}, {"kind": "s", "id": "s1_10_0", "md": "Glad you enjoyed it. Please come again.", "zh": "很高兴您喜欢。欢迎再来。", "sp": "B", "gap": false, "start": 108.384, "end": 113.04, "words": [[108.484, 108.971], [108.984, 109.129], [109.142, 109.668], [109.681, 109.971], [110.881, 111.289], [111.302, 111.566], [111.579, 112.118]]}]};
const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
