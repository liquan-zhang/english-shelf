<script>
const D = {"id": "047", "title": "Writing a Request That Gets a Reply", "meta": "B2 · 约 260 词 · 场景：书面求助", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why Good Requests Get Ignored", "heading_zh": "1. 好请求为什么会被无视", "rows": [[{"id": "s0_0_0", "md": "You send a careful message to another team.", "text": "You send a careful message to another team.", "zh": "你给另一个团队发了一条很用心的消息。", "sp": null}, {"id": "s0_0_1", "md": "It explains the history, the ==architecture==, and the problem in four long paragraphs.", "text": "It explains the history, the architecture, and the problem in four long paragraphs.", "zh": "用四大段把历史背景、架构和问题都讲了一遍。", "sp": null}, {"id": "s0_0_2", "md": "A week later, there is still no reply.", "text": "A week later, there is still no reply.", "zh": "一周过去了，还是没人回。", "sp": null}], [{"id": "s0_1_0", "md": "The reader was not rude; they were busy.", "text": "The reader was not rude; they were busy.", "zh": "对方不是没礼貌，是太忙了。", "sp": null}, {"id": "s0_1_1", "md": "They opened your message between two meetings, could not ==locate== the question, and decided to __come back to it later__.", "text": "They opened your message between two meetings, could not locate the question, and decided to come back to it later.", "zh": "他在两个会中间打开了你的消息，没找到问题在哪儿，就决定待会儿再说。", "sp": null}, {"id": "s0_1_2", "md": "Later never came.", "text": "Later never came.", "zh": "然后就没有然后了。", "sp": null}, {"id": "s0_1_3", "md": "**If the reader has to work to find your ask, you have already lost them.**", "text": "If the reader has to work to find your ask, you have already lost them.", "zh": "如果读的人得费劲才能找到你要什么，你就已经失去他了。", "sp": null}], [{"id": "s0_2_0", "md": "A message that gets a reply is not more polite or more detailed.", "text": "A message that gets a reply is not more polite or more detailed.", "zh": "能得到回复的消息，并不是更客气或者更详细。", "sp": null}, {"id": "s0_2_1", "md": "It is easier to answer.", "text": "It is easier to answer.", "zh": "而是更容易回答。", "sp": null}, {"id": "s0_2_2", "md": "Your goal is to make replying take less than two minutes, ==ideally== from a phone, while __standing in line for coffee__.", "text": "Your goal is to make replying take less than two minutes, ideally from a phone, while standing in line for coffee.", "zh": "你的目标是让对方两分钟内就能回复，最好是排队买咖啡的时候拿手机就能回。", "sp": null}]]}, {"heading": "2. Four Habits of Requests That Work", "heading_zh": "2. 有效请求的四个习惯", "rows": [[{"id": "s1_0_0", "md": "Put the ask in the first line.", "text": "Put the ask in the first line.", "zh": "第一行就写出你要什么。", "sp": null}, {"id": "s1_0_1", "md": "\"Could you approve read access to the orders table by Thursday?\" tells the reader everything they need to decide.", "text": "\"Could you approve read access to the orders table by Thursday?\" tells the reader everything they need to decide.", "zh": "「能在周四前帮忙开一下订单表的读权限吗？」这一句就给了对方做决定所需的全部信息。", "sp": null}, {"id": "s1_0_2", "md": "Context can follow, for anyone who wants it.", "text": "Context can follow, for anyone who wants it.", "zh": "背景放在后面，谁想看谁看。", "sp": null}], [{"id": "s1_1_0", "md": "Make the question easy to answer.", "text": "Make the question easy to answer.", "zh": "让问题好回答。", "sp": null}, {"id": "s1_1_1", "md": "Yes or no questions get faster replies than open ones.", "text": "Yes or no questions get faster replies than open ones.", "zh": "是非题比开放题回得更快。", "sp": null}, {"id": "s1_1_2", "md": "Instead of \"What do you think?\", try \"Is option A okay, or would you prefer B?\"", "text": "Instead of \"What do you think?\", try \"Is option A okay, or would you prefer B?\"", "zh": "别问「你怎么看？」，换成「方案 A 可以吗，还是你更倾向 B？」", "sp": null}], [{"id": "s1_2_0", "md": "Include a reason for the ==deadline==.", "text": "Include a reason for the deadline.", "zh": "给 deadline 附上理由。", "sp": null}, {"id": "s1_2_1", "md": "\"By Thursday\" sounds ==arbitrary==; \"by Thursday, because the audit starts on Friday\" sounds real.", "text": "\"By Thursday\" sounds arbitrary; \"by Thursday, because the audit starts on Friday\" sounds real.", "zh": "「周四前」听起来很随意；「周四前，因为周五审计就开始了」听起来才是真的。", "sp": null}, {"id": "s1_2_2", "md": "A ==genuine== reason __creates urgency__ without pressure.", "text": "A genuine reason creates urgency without pressure.", "zh": "一个真实的理由能制造紧迫感，又不会让人有压力。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, keep one request per message, and __address it to__ one named person.", "text": "Finally, keep one request per message, and address it to one named person.", "zh": "最后，一条消息只提一个请求，并且点名发给一个具体的人。", "sp": null}, {"id": "s1_3_1", "md": "When a question goes to a whole channel, everyone assumes someone else will answer.", "text": "When a question goes to a whole channel, everyone assumes someone else will answer.", "zh": "问题一发到整个群里，每个人都以为别人会回。", "sp": null}, {"id": "s1_3_2", "md": "**A request with a clear owner and a clear deadline is hard to ignore.**", "text": "A request with a clear owner and a clear deadline is hard to ignore.", "zh": "有明确负责人、有明确 deadline 的请求，很难被忽视。", "sp": null}, {"id": "s1_3_3", "md": "If you still hear nothing, a short, friendly ==follow-up== after two days is ==perfectly== normal.", "text": "If you still hear nothing, a short, friendly follow-up after two days is perfectly normal.", "zh": "如果还是没回音，两天后发一条简短友好的跟进，完全正常。", "sp": null}]]}], "gist": [{"q": "作者认为长篇详细的求助为什么没人回？", "a": "读者很忙，在两个会之间打开消息找不到问题，就想稍后再看，结果再也没回来。"}, {"q": "一条好的求助消息的目标是什么？", "a": "让对方两分钟内就能回复，最好排队买咖啡时用手机就能答。"}, {"q": "有效求助的四个习惯是什么？", "a": "第一行就写请求；问题好回答（是非题或二选一）；给截止时间附上真实理由；一条消息一个请求、发给一个具体的人，没回两天后友好跟进。"}], "dictation": [{"id": "s0_1_3", "text": "If the reader has to work to find your ask, you have already lost them."}, {"id": "s1_1_1", "text": "Yes or no questions get faster replies than open ones."}, {"id": "s1_3_1", "text": "When a question goes to a whole channel, everyone assumes someone else will answer."}, {"id": "s1_3_2", "text": "A request with a clear owner and a clear deadline is hard to ignore."}], "shadow": {"text": "The reader was not rude; they were busy. They opened your message between two meetings, could not locate the question, and decided to come back to it later. Later never came.", "marked": "The reader was <b>not</b> rude; / they were <b>busy</b>. //<br>They opened your message / <b>between</b> two meetings, / could <b>not</b> locate the question, / and decided to come back to it <b>later</b>. //<br><b>Later</b> / <b>never</b> came. //"}, "prompts": [{"q": "你需要安全团队批准一个外部接口的白名单申请。口头练习：用 30 秒说出你会在消息里怎么写，第一句就是请求，带截止时间和理由，让对方容易回答。", "ref": "Hi Priya, could you approve our request to allow traffic from the new partner API by Wednesday? We need it before the integration test on Thursday morning. The details are in the ticket I've linked, including the IP range and the data we'll send. If it helps, it's the same setup you approved for the shipping partner last month. Is Wednesday realistic for you?", "ref_zh": "Priya 你好，能不能在周三前帮忙批一下放行新合作方 API 流量的申请？我们周四上午要做联调测试，在那之前需要搞定。详细信息都在我附的工单里，包括 IP 段和我们要发送的数据。顺便说一下，这跟你上个月给物流合作方批的配置是一样的。周三对你来说现实吗？", "id": "ref0"}, {"q": "你两天前发的求助没人回。用 30 秒说一条友好的跟进消息，不带责怪。", "ref": "Hi Tom, just bringing this back to the top of your inbox, since I know things get buried. We still need a yes or no on extending the test environment until Friday. If you're not the right person for this, could you point me to whoever is? Either answer is fine; we just need to plan the release around it. Thanks a lot.", "ref_zh": "Tom 你好，把这条再顶一下，我知道消息很容易被淹掉。测试环境能不能延长到周五，我们还需要一个明确的答复。如果这事不归你管，能帮我指一下该找谁吗？行或不行都可以，我们只是需要据此安排发布。多谢。", "id": "ref1"}], "words": [{"w": "deadline", "ipa": "/ˈdedlaɪn/", "zh": "截止时间", "ex": "The deadline is Thursday because the audit starts Friday.", "id": "w0"}, {"w": "arbitrary", "ipa": "/ˈɑːrbɪtreri/", "zh": "随意的、武断的", "ex": "The cutoff looks arbitrary unless we explain the reason.", "id": "w1"}, {"w": "genuine", "ipa": "/ˈdʒenjuɪn/", "zh": "真实的、真诚的", "ex": "There's a genuine risk of data loss if we skip the backup.", "id": "w2"}, {"w": "follow-up", "ipa": "/ˈfɑːloʊ ʌp/", "zh": "跟进（消息）", "ex": "I'll send a follow-up if we don't hear back by Monday.", "id": "w3"}, {"w": "perfectly", "ipa": "/ˈpɜːrfɪktli/", "zh": "完全地", "ex": "It's perfectly fine to ask for more time on the review.", "id": "w4"}, {"w": "urgency", "ipa": "/ˈɜːrdʒənsi/", "zh": "紧迫感", "ex": "The outage gave the security fix a new sense of urgency.", "id": "w5"}, {"w": "architecture", "ipa": "/ˈɑːrkɪtektʃər/", "zh": "架构", "ex": "Skip the architecture overview and start with the question.", "id": "w6"}, {"w": "locate", "ipa": "/ˈloʊkeɪt/", "zh": "找到、定位", "ex": "It took us an hour to locate the config that caused the outage.", "id": "w7"}, {"w": "ideally", "ipa": "/aɪˈdiːəli/", "zh": "理想情况下", "ex": "Ideally, we'd have the fix reviewed before the weekend.", "id": "w8"}], "karaoke": [{"kind": "h", "id": "h0", "md": "1. Why Good Requests Get Ignored", "zh": "1. 好请求为什么会被无视", "start": 0.0, "end": 2.712, "words": [[0.105, 0.395], [0.75, 0.947], [0.961, 1.158], [1.171, 1.671], [1.684, 1.829], [1.842, 2.329]]}, {"kind": "s", "id": "s0_0_0", "md": "You send a careful message to another team.", "zh": "你给另一个团队发了一条很用心的消息。", "sp": null, "gap": false, "start": 2.712, "end": 5.184, "words": [[2.817, 2.896], [2.909, 3.12], [3.133, 3.186], [3.199, 3.594], [3.607, 4.015], [4.028, 4.159], [4.173, 4.488], [4.501, 4.804]]}, {"kind": "s", "id": "s0_0_1", "md": "It explains the history, the ==architecture==, and the problem in four long paragraphs.", "zh": "用四大段把历史背景、架构和问题都讲了一遍。", "sp": null, "gap": false, "start": 5.184, "end": 10.608, "words": [[5.289, 5.355], [5.368, 5.868], [5.881, 5.974], [5.987, 6.579], [6.802, 6.908], [6.921, 7.697], [7.987, 8.039], [8.052, 8.131], [8.145, 8.605], [8.671, 8.789], [8.802, 9.158], [9.171, 9.408], [9.421, 10.223]]}, {"kind": "s", "id": "s0_0_2", "md": "A week later, there is still no reply.", "zh": "一周过去了，还是没人回。", "sp": null, "gap": false, "start": 10.608, "end": 13.176, "words": [[10.713, 10.779], [10.792, 10.99], [11.003, 11.358], [11.647, 11.766], [11.779, 11.871], [11.884, 12.134], [12.147, 12.29 const L = D.karaoke;
const $ = id => document.getElementById(id);
const a = $('a');
$('title').textContent = D.title;

// render lines; each whitespace token is a word span, markdown markers become classes
const MK = { '**': 'b', '__': 'u', '==': 'm' };
L.forEach((l, i) => {
  const el = document.createElement('div');
  el.className = 'line' + (l.kind === 'h' ? ' h' : '') + (l.gap ? ' gap' : '');
  if (l.sp) {
    const sp = D.speakers[l.sp];
    const tag = document.createElement('span');
    tag.className = 'sp ' + l.sp; tag.textContent = sp.name;
    el.append(tag);
  }
  const st = { b: false, u: false, m: false };
  l.spans = l.md.split(/\s+/).map((tok, k) => {
    const cls = new Set();
    let text = '';
    for (const part of tok.split(/(\*\*|__|==)/)) {
      if (MK[part]) { st[MK[part]] = !st[MK[part]]; continue; }
      if (!part) continue;
      text += part;
      for (const c in st) if (st[c]) cls.add(c);
    }
    const s = document.createElement('span');
    s.className = 'w ' + [...cls].join(' ');
    s.textContent = text;
    s.dataset.k = k;
    el.append(s, ' ');
    return s;
  });
  // keep underline/highlight continuous across the spaces inside a phrase
  l.spans.forEach((s, k) => {
    const n = l.spans[k + 1];
    const shared = n && ['u', 'm'].filter(c => s.classList.contains(c) && n.classList.contains(c));
    if (shared && shared.length) {
      const gap = document.createElement('span');
      gap.className = 'w ' + shared.join(' '); gap.textContent = ' ';
      s.nextSibling.replaceWith(gap);
    }
  });
  if (l.sp === 'A') {
    const turn = document.createElement('span');
    turn.className = 'turn'; turn.textContent = '轮到你说 · 点击看答案';
    el.append(turn);
  }
  if (l.zh) {
    const zh = document.createElement('div');
    zh.className = 'zh'; zh.textContent = l.zh;
    el.append(zh);
  }
  const wait = document.createElement('div');
  wait.className = 'wait'; wait.innerHTML = '<i></i>';
  el.append(wait);
  el.addEventListener('click', e => {
    const k = e.target.dataset?.k;
    const w = k != null && l.words[k];
    seekTo(w ? w[0] : l.start, i);
    if (document.body.classList.contains('hidetext')) el.classList.add('reveal');
  });
  l.el = el; l.bar = wait.firstChild;
  $('col').append(el);
});

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
a.addEventListener('loadedmetadata', () => { $('seek').max = a.duration; $('tdur').textContent = fmt(a.duration); });

let cur = -1, loopOn = false, shadowOn = false, roleOn = false, waitT = null, turnDone = -1;
const lineAt = t => { for (let i = L.length - 1; i >= 0; i--) if (t >= L[i].start) return i; return 0; };

function setCur(i) {
  if (i === cur) return;
  if (cur >= 0) L[cur].el.classList.remove('cur', 'reveal', 'waiting');
  cur = i;
  L[i].el.classList.add('cur');
  L[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function paintWords(t) {
  const l = L[cur];
  l.spans.forEach((s, k) => {
    const w = l.words[k];
    s.classList.toggle('said', !!w && t >= w[1]);
    s.classList.toggle('now', !!w && t >= w[0] && t < w[1] + 0.08);
  });
}

function seekTo(t, i = lineAt(t)) {
  cancelWait();
  turnDone = -1;
  a.currentTime = t + 0.001;
  setCur(i);
  if (a.paused) a.play();
}

function cancelWait() {
  if (waitT) { clearInterval(waitT); waitT = null; }
  if (cur >= 0) L[cur].el.classList.remove('waiting', 'myturn');
}

// role play: your lines are muted; say them yourself, then the other side answers
function myTurn(i) {
  const l = L[i];
  turnDone = i;
  shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
  l.el.classList.add('myturn');
}

// shadowing pause: wait 1.3x the sentence length so there is room to repeat it
function shadowPause(l, then) {
  a.pause();
  const total = (l.end - l.start) * 1.3 / a.playbackRate * 1000, t0 = performance.now();
  l.el.classList.add('waiting');
  waitT = setInterval(() => {
    const p = (performance.now() - t0) / total;
    l.bar.style.width = Math.min(100, p * 100) + '%';
    if (p >= 1) { cancelWait(); then(); }
  }, 50);
}

function tick() {
  const t = a.currentTime;
  if (!a.paused && cur >= 0 && !waitT && roleOn && L[cur].sp === 'A' && turnDone !== cur && t < L[cur].end - 0.2) {
    myTurn(cur);
  } else if (!a.paused && cur >= 0 && !waitT) {
    const l = L[cur];
    if (t >= l.end - 0.04) {
      if (loopOn && l.kind === 's') {
        if (shadowOn) shadowPause(l, () => { a.currentTime = l.start; a.play(); });
        else a.currentTime = l.start;
      } else if (shadowOn && l.kind === 's') {
        shadowPause(l, () => { a.currentTime = l.end + 0.001; a.play(); });
      }
    }
  }
  if (!waitT) {
    const i = lineAt(a.currentTime);
    if (!(loopOn && i === cur + 1)) setCur(i);
    paintWords(a.currentTime);
  }
  $('seek').value = a.currentTime;
  $('tcur').textContent = fmt(a.currentTime);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const toggle = (btn, on) => (btn.classList.toggle('on', on), on);
a.addEventListener('play', () => $('play').textContent = '⏸');
a.addEventListener('pause', () => { if (!waitT) $('play').textContent = '▶'; });
$('play').onclick = () => { if (waitT) { cancelWait(); a.play(); } else if (a.paused) a.play(); else a.pause(); };
$('prev').onclick = () => seekTo(L[Math.max(0, (a.currentTime - L[cur].start > 1 ? cur : cur - 1))].start, undefined);
$('next').onclick = () => cur < L.length - 1 && seekTo(L[cur + 1].start, cur + 1);
$('loop').onclick = () => loopOn = toggle($('loop'), !loopOn);
$('shadow').onclick = () => { shadowOn = toggle($('shadow'), !shadowOn); if (!shadowOn && waitT) { cancelWait(); a.play(); } };
$('hide').onclick = () => toggle($('hide'), document.body.classList.toggle('hidetext'));
const zhOn = on => { document.body.classList.toggle('nozh', !on); $('zh').classList.toggle('on', on); localStorage.setItem('wb:zh', on ? '1' : '0'); };
zhOn(localStorage.getItem('wb:zh') !== '0');
$('zh').onclick = () => zhOn(document.body.classList.contains('nozh'));
if (D.type === 'dialogue') $('role').hidden = false;
$('role').onclick = () => { roleOn = toggle($('role'), !roleOn); turnDone = -1; if (!roleOn && waitT) { cancelWait(); a.play(); } };
$('speed').onchange = e => a.playbackRate = parseFloat(e.target.value);
$('seek').oninput = e => seekTo(parseFloat(e.target.value));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = { ' ': 'play', ArrowLeft: 'prev', ArrowRight: 'next', l: 'loop', s: 'shadow', h: 'hide', t: 'zh', r: 'role' }[e.key];
  if (k) { e.preventDefault(); $(k).click(); }
});
setCur(0); paintWords(0);
</script>
