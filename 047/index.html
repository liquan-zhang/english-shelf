<script>
const D = {"id": "047", "title": "Writing a Request That Gets a Reply", "meta": "B2 · 约 260 词 · 场景：书面求助", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Why Good Requests Get Ignored", "heading_zh": "1. 好请求为什么会被无视", "rows": [[{"id": "s0_0_0", "md": "You send a careful message to another team.", "text": "You send a careful message to another team.", "zh": "你给另一个团队发了一条很用心的消息。", "sp": null}, {"id": "s0_0_1", "md": "It explains the history, the ==architecture==, and the problem in four long paragraphs.", "text": "It explains the history, the architecture, and the problem in four long paragraphs.", "zh": "用四大段把历史背景、架构和问题都讲了一遍。", "sp": null}, {"id": "s0_0_2", "md": "A week later, there is still no reply.", "text": "A week later, there is still no reply.", "zh": "一周过去了，还是没人回。", "sp": null}], [{"id": "s0_1_0", "md": "The reader was not rude; they were busy.", "text": "The reader was not rude; they were busy.", "zh": "对方不是没礼貌，是太忙了。", "sp": null}, {"id": "s0_1_1", "md": "They opened your message between two meetings, could not ==locate== the question, and decided to __come back to it later__.", "text": "They opened your message between two meetings, could not locate the question, and decided to come back to it later.", "zh": "他在两个会中间打开了你的消息，没找到问题在哪儿，就决定待会儿再说。", "sp": null}, {"id": "s0_1_2", "md": "Later never came.", "text": "Later never came.", "zh": "然后就没有然后了。", "sp": null}, {"id": "s0_1_3", "md": "**If the reader has to work to find your ask, you have already lost them.**", "text": "If the reader has to work to find your ask, you have already lost them.", "zh": "如果读的人得费劲才能找到你要什么，你就已经失去他了。", "sp": null}], [{"id": "s0_2_0", "md": "A message that gets a reply is not more polite or more detailed.", "text": "A message that gets a reply is not more polite or more detailed.", "zh": "能得到回复的消息，并不是更客气或者更详细。", "sp": null}, {"id": "s0_2_1", "md": "It is easier to answer.", "text": "It is easier to answer.", "zh": "而是更容易回答。", "sp": null}, {"id": "s0_2_2", "md": "Your goal is to make replying take less than two minutes, ==ideally== from a phone, while __standing in line for coffee__.", "text": "Your goal is to make replying take less than two minutes, ideally from a phone, while standing in line for coffee.", "zh": "你的目标是让对方两分钟内就能回复，最好是排队买咖啡的时候拿手机就能回。", "sp": null}]]}, {"heading": "2. Four Habits of Requests That Work", "heading_zh": "2. 有效请求的四个习惯", "rows": [[{"id": "s1_0_0", "md": "Put the ask in the first line.", "text": "Put the ask in the first line.", "zh": "第一行就写出你要什么。", "sp": null}, {"id": "s1_0_1", "md": "\"Could you approve read access to the orders table by Thursday?\" tells the reader everything they need to decide.", "text": "\"Could you approve read access to the orders table by Thursday?\" tells the reader everything they need to decide.", "zh": "「能在周四前帮忙开一下订单表的读权限吗？」这一句就给了对方做决定所需的全部信息。", "sp": null}, {"id": "s1_0_2", "md": "Context can follow, for anyone who wants it.", "text": "Context can follow, for anyone who wants it.", "zh": "背景放在后面，谁想看谁看。", "sp": null}], [{"id": "s1_1_0", "md": "Make the question easy to answer.", "text": "Make the question easy to answer.", "zh": "让问题好回答。", "sp": null}, {"id": "s1_1_1", "md": "Yes or no questions get faster replies than open ones.", "text": "Yes or no questions get faster replies than open ones.", "zh": "是非题比开放题回得更快。", "sp": null}, {"id": "s1_1_2", "md": "Instead of \"What do you think?\", try \"Is option A okay, or would you prefer B?\"", "text": "Instead of \"What do you think?\", try \"Is option A okay, or would you prefer B?\"", "zh": "别问「你怎么看？」，换成「方案 A 可以吗，还是你更倾向 B？」", "sp": null}], [{"id": "s1_2_0", "md": "Include a reason for the ==deadline==.", "text": "Include a reason for the deadline.", "zh": "给 deadline 附上理由。", "sp": null}, {"id": "s1_2_1", "md": "\"By Thursday\" sounds ==arbitrary==; \"by Thursday, because the audit starts on Friday\" sounds real.", "text": "\"By Thursday\" sounds arbitrary; \"by Thursday, because the audit starts on Friday\" sounds real.", "zh": "「周四前」听起来很随意；「周四前，因为周五审计就开始了」听起来才是真的。", "sp": null}, {"id": "s1_2_2", "md": "A ==genuine== reason __creates urgency__ without pressure.", "text": "A genuine reason creates urgency without pressure.", "zh": "一个真实的理由能制造紧迫感，又不会让人有压力。", "sp": null}], [{"id": "s1_3_0", "md": "Finally, keep one request per message, and __address it to__ one named person.", "text": "Finally, keep one request per message, and address it to one named person.", "zh": "最后，一条消息只提一个请求，并且点名发给一个具体的人。", "sp": null}, {"id": "s1_3_1", "md": "When a question goes to a whole channel, everyone assumes someone else will answer.", "text": "When a question goes to a whole channel, everyone assumes someone else will answer.", "zh": "问题一发到整个群里，每个人都以为别人会回。", "sp": null}, {"id": "s1_3_2", "md": "**A request with a clear owner and a clear deadline is hard to ignore.**", "text": "A request with a clear owner and a clear deadline is hard to ignore.", "zh": "有明确负责人、有明确 deadline 的请求，很难被忽视。", "sp": null}, {"id": "s1_3_3", "md": "If you still hear nothing, a short, friendly ==follow-up== after two days is ==perfectly== normal.", "text": "If you still hear nothing, a short, friendly follow-up after two days is perfectly normal.", "zh": "如果还是没回音，两天后发一条简短友好的跟进，完全正常。", "sp": null}]]}], "gist": [{"q": "作者认为长篇详细的求助为什么没人回？", "a": "读者很忙，在两个会之间打开消息找不到问题，就想稍后再看，结果再也没回来。"}, {"q": "一条好的求助消息的目标是什么？", "a": "让对方两分钟内就能回复，最好排队买咖啡时用手机就能答。"}, {"q": "有效求助的四个习惯是什么？", "a": "第一行就写请求；问题好回答（是非题或二选一）；给截止时间附上真实理由；一条消息一个请求、发给一个具体的人，没回两天后友好跟进。"}], "dictation": [{"id": "s0_1_3", "text": "If the reader has to work to find your ask, you have already lost them."}, {"id": "s1_1_1", "text": "Yes or no questions get faster replies than open ones."}, {"id": "s1_3_1", "text": "When a question goes to a whole channel, everyone assumes someone else will answer."}, {"id": "s1_3_2", "text": "A request with a clear owner and a clear deadline is hard to ignore."}], "shadow": {"text": "The reader was not rude; they were busy. They opened your message between two meetings, could not locate the question, and decided to come back to it later. Later never came.", "marked": "The reader was <b>not</b> rude; / they were <b>busy</b>. //<br>They opened your message / <b>between</b> two meetings, / could <b>not</b> locate the question, / and decided to come back to it <b>later</b>. //<br><b>Later</b> / <b>never</b> came. //"}, "prompts": [{"q": "你需要安全团队批准一个外部接口的白名单申请。口头练习：用 30 秒说出你会在消息里怎么写，第一句就是请求，带截止时间和理由，让对方容易回答。", "ref": "Hi Priya, could you approve our request to allow traffic from the new partner API by Wednesday? We need it before the integration test on Thursday morning. The details are in the ticket I've linked, including the IP range and the data we'll send. If it helps, it's the same setup you approved for the shipping partner last month. Is Wednesday realistic for you?", "ref_zh": "Priya 你好，能不能在周三前帮忙批一下放行新合作方 API 流量的申请？我们周四上午要做联调测试，在那之前需要搞定。详细信息都在我附的工单里，包括 IP 段和我们要发送的数据。顺便说一下，这跟你上个月给物流合作方批的配置是一样的。周三对你来说现实吗？", "id": "ref0"}, {"q": "你两天前发的求助没人回。用 30 秒说一条友好的跟进消息，不带责怪。", "ref": "Hi Tom, just bringing this back to the top of your inbox, since I know things get buried. We still need a yes or no on extending the test environment until Friday. If you're not the right person for this, could you point me to whoever is? Either answer is fine; we just need to plan the release around it. Thanks a lot.", "ref_zh": "Tom 你好，把这条再顶一下，我知道消息很容易被淹掉。测试环境能不能延长到周五，我们还需要一个明确的答复。如果这事不归你管，能帮我指一下该找谁吗？行或不行都可以，我们只是需要据此安排发布。多谢。", "id": "ref1"}], "words": [{"w": "deadline", "ipa": "/ˈdedlaɪn/", "zh": "截止时间", "ex": "The deadline is Thursday because the audit starts Friday.", "id": "w0"}, {"w": "arbitrary", "ipa": "/ˈɑːrbɪtreri/", "zh": "随意的、武断的", "ex": "The cutoff looks arbitrary unless we explain the reason.", "id": "w1"}, {"w": "genuine", "ipa": "/ˈdʒenjuɪn/", "zh": "真实的、真诚的", "ex": "There's a genuine risk of data loss if we skip the backup.", "id": "w2"}, {"w": "follow-up", "ipa": "/ˈfɑːloʊ ʌp/", "zh": "跟进（消息）", "ex": "I'll send a follow const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);

const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {

});
function clipCtl(id) {

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
