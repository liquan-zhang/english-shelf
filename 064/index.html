<script>
const D = {"id": "064", "title": "Making a Call with Incomplete Data", "meta": "B2 · 约 280 词 · 场景：决策会议", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. Waiting Is Also a Choice", "heading_zh": "1. 等待也是一种选择", "rows": [[{"id": "s0_0_0", "md": "In almost every planning meeting, someone eventually says, \"Let's wait for more data.\"", "text": "In almost every planning meeting, someone eventually says, \"Let's wait for more data.\"", "zh": "几乎每次规划会上，最后总有人会说：「要不再等等更多数据吧。」", "sp": null}, {"id": "s0_0_1", "md": "Sometimes that is wise.", "text": "Sometimes that is wise.", "zh": "有时候这确实明智。", "sp": null}, {"id": "s0_0_2", "md": "Often it is a polite way to avoid __owning a decision__.", "text": "Often it is a polite way to avoid owning a decision.", "zh": "但很多时候，这只是一种体面地回避为决定负责的说法。", "sp": null}], [{"id": "s0_1_0", "md": "The problem is that waiting is not ==neutral==.", "text": "The problem is that waiting is not neutral.", "zh": "问题在于，等待并不是中性的。", "sp": null}, {"id": "s0_1_1", "md": "While the team waits two more weeks for experiment results, engineers sit idle, competitors ship, and the ==window== slowly closes.", "text": "While the team waits two more weeks for experiment results, engineers sit idle, competitors ship, and the window slowly closes.", "zh": "团队再等两周实验结果的时候，工程师闲着，竞品在上线，窗口期一点点关上。", "sp": null}, {"id": "s0_1_2", "md": "**Not deciding is also a decision, and it usually has a cost nobody wrote down.**", "text": "Not deciding is also a decision, and it usually has a cost nobody wrote down.", "zh": "不做决定本身也是一种决定，而且它通常有一笔没人记下来的成本。", "sp": null}], [{"id": "s0_2_0", "md": "Data is rarely complete in real work.", "text": "Data is rarely complete in real work.", "zh": "实际工作中，数据很少是完整的。", "sp": null}, {"id": "s0_2_1", "md": "Logs have gaps, dashboards ==contradict== each other, and the user research covers twelve people.", "text": "Logs have gaps, dashboards contradict each other, and the user research covers twelve people.", "zh": "日志有缺口，几个看板互相打架，用户调研只覆盖了十二个人。", "sp": null}, {"id": "s0_2_2", "md": "The skill is not finding certainty; it is acting __in proportion to__ the evidence you have.", "text": "The skill is not finding certainty; it is acting in proportion to the evidence you have.", "zh": "真正的本事不是找到确定性；而是根据手上证据的分量去行动。", "sp": null}], [{"id": "s0_3_0", "md": "Before asking for more data, ask what result would actually change the decision.", "text": "Before asking for more data, ask what result would actually change the decision.", "zh": "在要更多数据之前，先问一句：什么样的结果会真正改变这个决定？", "sp": null}, {"id": "s0_3_1", "md": "If no realistic number from the experiment would make you choose differently, the extra two weeks buy you nothing.", "text": "If no realistic number from the experiment would make you choose differently, the extra two weeks buy you nothing.", "zh": "如果实验跑出任何现实的数字都不会让你改选，那多等两周什么都买不到。", "sp": null}, {"id": "s0_3_2", "md": "If one result really would flip the choice, then wait, but agree on the date you will decide.", "text": "If one result really would flip the choice, then wait, but agree on the date you will decide.", "zh": "如果某个结果真的会让你改选，那就等，但要先约好哪天拍板。", "sp": null}]]}, {"heading": "2. Name What Would Change Your Mind", "heading_zh": "2. 说清什么会让你改主意", "rows": [[{"id": "s1_0_0", "md": "When you make a call with partial data, say three things out loud.", "text": "When you make a call with partial data, say three things out loud.", "zh": "当你在数据不全的情况下拍板时，要把三件事说出来。", "sp": null}, {"id": "s1_0_1", "md": "First, what you are deciding and why the current evidence ==leans== that way.", "text": "First, what you are deciding and why the current evidence leans that way.", "zh": "第一，你决定的是什么，以及为什么现有证据倾向于这个方向。", "sp": null}, {"id": "s1_0_2", "md": "Second, what you are still ==uncertain== about, so nobody thinks you are hiding the gaps.", "text": "Second, what you are still uncertain about, so nobody thinks you are hiding the gaps.", "zh": "第二，你还有哪些不确定的地方，免得大家觉得你在藏着缺口。", "sp": null}], [{"id": "s1_1_0", "md": "Third, and most important, name the signal that would make you ==reverse== it.", "text": "Third, and most important, name the signal that would make you reverse it.", "zh": "第三，也是最重要的，说出什么信号会让你推翻这个决定。", "sp": null}, {"id": "s1_1_1", "md": "\"We'll go with the new ranking, and if retention drops in the first week, we'll switch back.\"", "text": "\"We'll go with the new ranking, and if retention drops in the first week, we'll switch back.\"", "zh": "「我们先上新的排序，如果第一周留存掉了，就切回去。」", "sp": null}, {"id": "s1_1_2", "md": "**Naming your exit condition turns a gamble into an experiment.**", "text": "Naming your exit condition turns a gamble into an experiment.", "zh": "把退出条件说出来，赌博就变成了一次实验。", "sp": null}], [{"id": "s1_2_0", "md": "This works because it gives the doubters something concrete to watch instead of something to argue about.", "text": "This works because it gives the doubters something concrete to watch instead of something to argue about.", "zh": "这招管用，是因为它给了持怀疑态度的人一个具体的东西去盯，而不是一个去争论的东西。", "sp": null}, {"id": "s1_2_1", "md": "It also __protects your credibility__.", "text": "It also protects your credibility.", "zh": "它也能保住你的信誉。", "sp": null}, {"id": "s1_2_2", "md": "If the data turns against you, you are following your own plan, not __backing down__ under pressure.", "text": "If the data turns against you, you are following your own plan, not backing down under pressure.", "zh": "如果数据最后对你不利，你是在执行自己的方案，而不是顶不住压力退让。", "sp": null}]]}], "gist": [{"q": "作者为什么说“等等更多数据”并不是中立的？", "a": "等待本身也是决定，有成本：工程师闲置、对手上线、时间窗口关闭，只是没人把这笔账写下来。"}, {"q": "数据不全时做决定，要说出哪三件事？", "a": "决定是什么以及证据为何倾向它；还有哪些不确定；什么信号会让你推翻这个决定。"}, {"q": "说出“退出条件”有什么好处？", "a": "把赌博变成实验，给质疑者一个具体可观察的指标；数据不利时你是在执行原计划，而不是被迫让步，保护了信誉。"}], "dictation": [{"id": "s0_1_2", "text": "Not deciding is also a decision, and it usually has a cost nobody wrote down."}, {"id": "s0_2_2", "text": "The skill is not finding certainty; it is acting in proportion to the evidence you have."}, {"id": "s1_1_2", "text": "Naming your exit condition turns a gamble into an experiment."}, {"id": "s1_2_0", "text": "This works because it gives the doubters something concrete to watch instead of something to argue about."}], "shadow": {"text": "Third, and most important, name the signal that would make you reverse it. \"We'll go with the new ranking, and if retention drops in the first week, we'll switch back.\" Naming your exit condition turns a gamble into an experiment.", "marked": "<b>Third</b>, / and most <b>important</b>, / name the <b>signal</b> / that would make you <b>reverse</b> it. //<br>\"We'll go with the <b>new</b> ranking, / and if <b>retention</b> drops in the first week, / we'll switch <b>back</b>.\" //<br>Naming your <b>exit</b> condition / turns a <b>gamble</b> / into an <b>experiment</b>. //"}, "prompts": [{"q": "A/B 实验还要两周才出完整结果，但下个版本马上要定。用 30 秒做出决定：说明倾向、不确定点和反悔条件。", "ref": "Here's my call: we ship the new onboarding flow in the next release. The early numbers lean that way, completion is up in the first four days, though the sample is still small. What I'm unsure about is whether it hurts long-term retention. So if week-two retention drops more than two points, we switch back to the old flow. That way we're not waiting, and we're not guessing blindly.", "ref_zh": "我的决定是：新的新手引导流程下个版本上线。早期数据倾向于这样做，前四天完成率涨了，不过样本还小。我不确定的是它会不会伤害长期留存。所以如果第二周留存掉超过两个点，我们就切回老流程。这样我们既不干等，也不是瞎猜。", "id": "ref0"}, {"q": "会上有人第三次提议“再等等数据”。用 30 秒指出等待的成本，并推动大家定下来。", "ref": "I get why more data feels safer. But waiting isn't free. Two engineers are blocked until we choose, and the holiday window closes in three weeks. We'll never have complete data here. Can we decide today based on what we have, and agree on one metric that would make us change course? Then the extra data becomes a check, not a reason to wait.", "ref_zh": "我理解多要点数据感觉更稳妥。但等待不是免费的。我们不定下来，两个工程师就一直卡着，节日窗口期三周后就关了。这件事我们永远不会有完整的数据。能不能今天就根据现有的信息拍板，同时约定一个会让我们改方向的指标？这样后面的数据是用来校验的，而不是拿来当等待的理由。", "id": "ref1"}], "words": [{"w": "neutral", "ipa": "/ˈnuːtrəl/", "zh": "中立的、无影响 d": "This works because it gives the doubters something concrete to watch instead of something to argue about.", "zh": "这招管用，是因为它给了持怀疑态度的人一个具体的东西去盯，而不是一个去争论的东西。", "sp": null, "gap": true, "start": 91.752, "end": 97.56, "words": [[91.87, 92.041], [92.055, 92.397], [92.41, 92.712], [92.726, 92.844], [92.857, 93.134], [93.147, 93.278], [93.291, 93.739], [93.752, 94.094], [94.107, 94.673], [94.686, 94.791], [94.805, 95.291], [95.384, 95.765], [95.778, 95.857], [95.87, 96.226], [96.239, 96.344], [96.357, 96.739], [96.752, 97.173]]}, {"kind": "s", "id": "s1_2_1", "md": "It also __protects your credibility__.", "zh": "它也能保住你的信誉。", "sp": null, "gap": false, "start": 97.56, "end": 99.768, "words": [[97.665, 97.744], [97.757, 98.021], [98.034, 98.547], [98.56, 98.665], [98.678, 99.376]]}, {"kind": "s", "id": "s1_2_2", "md": "If the data turns against you, you are following your own plan, not __backing down__ under pressure.", "zh": "如果数据最后对你不利，你是在执行自己的方案，而不是顶不住压力退让。", "sp": null, "gap": false, "start": 99.768, "end": 105.768, "words": [[99.873, 99.992], [100.005, 100.097], [100.11, 100.479], [100.492, 100.821], [100.834, 101.229], [101.242, 101.413], [101.913, 101.979], [101.992, 102.084], [102.097, 102.584], [102.597, 102.768], [102.781, 102.952], [102.965, 103.426], [103.847, 104.044], [104.057, 104.426], [104.439, 104.715], [104.729, 104.886], [104.9, 105.386]]}]};
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/__(.+?)__/g, '<u>$1</u>').replace(/==(.+?)==/g, '<mark>$1</mark>');
const src = id => `audio/${id}.mp3`;

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {
  if (loopBtn) { loopBtn.classList.remove('on'); loopBtn = null; player.pause(); player.loop = false; segLoop = false; }
}

// progress
const KEY = 'wb:' + D.id;

function step(id, name, time, how, body) {

  cb.addEventListener('change', () => { prog[id] = cb.checked; localStorage.setItem(KEY, JSON.stringify(prog)); renderNav(); });
  steps.push({ id, name });
  return h('section', { class: 'step', id },
    h('h2', {}, name, h('span', { class: 'time' }, time), h('label', {}, cb, ' 完成')),
    h('div', { class: 'how', html: how }), body);
}
function renderNav() {
  $('#nav').replaceChildren(...steps.map(s => h('a', { href: '#' + s.id, class: prog[s.id] ? 'done' : '' }, s.name)));

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

      const tag = s.sp ? `<span class="sp ${s.sp}">${D.speakers[s.sp].name}</span>` : '';
      const txt = h('div', { class: 'txt', html: tag + md(s.md) });
      if (s.zh) txt.append(h('div', { class: 'zh' }, s.zh));
      txt.addEventListener('click', () => txt.style.filter = 'none');
      intensive.append(h('div', { class: 'row' }, clipCtl(s.id), txt));
    }
  });
}
const zhBtn = h('button', { onclick: () => {
  const on = document.body.classList.toggle('nozh');
  localStorage.setItem('wb:zh', on ? '0' : '1');
  zhBtn.textContent = on ? '显示中文' : '隐藏中文';
} }, '隐藏中文');
if (localStorage.getItem('wb:zh') === '0') { document.body.classList.add('nozh'); zhBtn.textContent = '显示中文'; }
const toggle = h('button', { onclick: () => {
  intensive.classList.toggle('hide');
  intensive.querySelectorAll('.txt').forEach(t => t.style.filter = '');
  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
