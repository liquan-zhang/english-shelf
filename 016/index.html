<script>
const D = {"id": "016", "title": "The One-Slide Summary", "meta": "B2 · 约 270 词 · 场景：项目汇报", "voice": "en-US-AndrewNeural", "rate": "-5%", "sections": [{"heading": "1. The Only Slide That Gets Read", "heading_zh": "1. 唯一会被读的那页", "rows": [[{"id": "s0_0_0", "md": "A director once told me how she reads a twenty-page project deck.", "text": "A director once told me how she reads a twenty-page project deck.", "zh": "有位总监跟我讲过她是怎么看一份二十页的项目汇报的。", "sp": null}, {"id": "s0_0_1", "md": "She looks at the first slide, then skips to the last one, and only opens the middle if something ==bothers== her.", "text": "She looks at the first slide, then skips to the last one, and only opens the middle if something bothers her.", "zh": "她先看第一页，然后直接跳到最后一页，只有哪里让她不放心，才会翻开中间。", "sp": null}, {"id": "s0_0_2", "md": "She is not lazy; she has thirty projects to ==juggle==.", "text": "She is not lazy; she has thirty projects to juggle.", "zh": "她不是懒，她手上有三十个项目要兼顾。", "sp": null}], [{"id": "s0_1_0", "md": "Most senior people work this way.", "text": "Most senior people work this way.", "zh": "大多数高层都是这么工作的。", "sp": null}, {"id": "s0_1_1", "md": "That means your first slide is not an introduction.", "text": "That means your first slide is not an introduction.", "zh": "这意味着你的第一页不是开场白。", "sp": null}, {"id": "s0_1_2", "md": "**It is the whole presentation, and everything after it is evidence.**", "text": "It is the whole presentation, and everything after it is evidence.", "zh": "它就是整场汇报，后面的一切都只是证据。", "sp": null}], [{"id": "s0_2_0", "md": "Writing that slide is harder than it sounds, and that is exactly why it is useful.", "text": "Writing that slide is harder than it sounds, and that is exactly why it is useful.", "zh": "写好这一页比听起来难，而这正是它有用的原因。", "sp": null}, {"id": "s0_2_1", "md": "If you cannot fit the project on one page, you probably have not decided what really matters yet.", "text": "If you cannot fit the project on one page, you probably have not decided what really matters yet.", "zh": "如果你没法把项目塞进一页纸，那多半是你还没想清楚什么才真正重要。", "sp": null}, {"id": "s0_2_2", "md": "The slide __forces the thinking__ that a long deck lets you ==postpone==.", "text": "The slide forces the thinking that a long deck lets you postpone.", "zh": "长篇大论的汇报让你可以把思考往后拖，而这一页逼着你现在就想清楚。", "sp": null}]]}, {"heading": "2. Four Boxes and a Title", "heading_zh": "2. 四个框加一个标题", "rows": [[{"id": "s1_0_0", "md": "Start with the title, and make it a full sentence with your conclusion in it.", "text": "Start with the title, and make it a full sentence with your conclusion in it.", "zh": "先写标题，而且要写成一个完整的句子，把结论放进去。", "sp": null}, {"id": "s1_0_1", "md": "Not \"Search Latency Project,\" but \"Search is now forty percent faster; we need two more weeks for mobile.\"", "text": "Not \"Search Latency Project,\" but \"Search is now forty percent faster; we need two more weeks for mobile.\"", "zh": "不要写「搜索延迟项目」，而要写「搜索已提速百分之四十；移动端还需要两周」。", "sp": null}, {"id": "s1_0_2", "md": "Someone who reads only the title should still __walk away with__ the main point.", "text": "Someone who reads only the title should still walk away with the main point.", "zh": "只看标题的人，也应该能带走核心信息。", "sp": null}], [{"id": "s1_1_0", "md": "Under the title, use four short boxes.", "text": "Under the title, use four short boxes.", "zh": "标题下面，放四个简短的框。", "sp": null}, {"id": "s1_1_1", "md": "Why we did this, what we did, what changed, and what we need next.", "text": "Why we did this, what we did, what changed, and what we need next.", "zh": "为什么做、做了什么、带来了什么变化、接下来需要什么。", "sp": null}, {"id": "s1_1_2", "md": "Keep each box to two or three lines, and cut every word that does not __earn its place__.", "text": "Keep each box to two or three lines, and cut every word that does not earn its place.", "zh": "每个框控制在两三行，凡是没有存在价值的词都删掉。", "sp": null}], [{"id": "s1_2_0", "md": "The last box is the one people ==skip== most often, and it matters most.", "text": "The last box is the one people skip most often, and it matters most.", "zh": "最后一个框最常被人跳过，却最重要。", "sp": null}, {"id": "s1_2_1", "md": "**A summary without an ask is just a status report.**", "text": "A summary without an ask is just a status report.", "zh": "一份没有诉求的总结，只是一份进度汇报。", "sp": null}, {"id": "s1_2_2", "md": "Whether you need a decision, a person, or simply ==awareness== of a risk, say it ==explicitly==.", "text": "Whether you need a decision, a person, or simply awareness of a risk, say it explicitly.", "zh": "不管你需要的是一个决定、一个人手，还是只想让大家知道某个风险，都要明确说出来。", "sp": null}], [{"id": "s1_3_0", "md": "Then test the slide on someone outside the project.", "text": "Then test the slide on someone outside the project.", "zh": "然后找个项目外的人测试一下这页。", "sp": null}, {"id": "s1_3_1", "md": "Give them thirty seconds, take the slide away, and ask what they remember.", "text": "Give them thirty seconds, take the slide away, and ask what they remember.", "zh": "给他三十秒，然后把幻灯片拿走，问他记住了什么。", "sp": null}, {"id": "s1_3_2", "md": "If their answer matches your title, you are ready.", "text": "If their answer matches your title, you are ready.", "zh": "如果他的回答和你的标题对得上，你就准备好了。", "sp": null}]]}], "gist": [{"q": "作者说的那位总监是怎么看项目材料的？这说明了什么？", "a": "只看第一页和最后一页，有疑问才看中间；说明第一页就是整个汇报，后面都只是证据。"}, {"q": "一页纸总结的结构是什么？", "a": "一个包含结论的完整句子做标题，下面四个框：为什么做、做了什么、改变了什么、下一步需要什么。"}, {"q": "为什么最后一个“需要什么”的框最重要？", "a": "没有明确诉求的总结只是状态汇报；需要决定、人手还是风险知情，都要明说。"}], "dictation": [{"id": "s0_1_2", "text": "It is the whole presentation, and everything after it is evidence."}, {"id": "s1_2_1", "text": "A summary without an ask is just a status report."}, {"id": "s0_2_1", "text": "If you cannot fit the project on one page, you probably have not decided what really matters yet."}, {"id": "s1_3_2", "text": "If their answer matches your title, you are ready."}], "shadow": {"text": "The last box is the one people skip most often, and it matters most. A summary without an ask is just a status report.", "marked": "The <b>last</b> box / is the one people <b>skip</b> most often, / and it matters <b>most</b>. //<br>A summary / <b>without</b> an ask / is just a <b>status</b> report. //"}, "prompts": [{"q": "电梯里碰到总监，他问你项目怎么样了。用 30 秒按“一页纸”结构口头汇报：结论先行，最后提出一个明确诉求。", "ref": "Short version, the new checkout is live in two markets and conversion is up about six percent. We built it because the old flow was losing a lot of users at the payment step. The main open issue is the mobile wallet integration, which needs another two weeks. What I need from you is help getting time from the payments team next sprint. Could you raise it with their director?", "ref_zh": "简单说，新的结算流程已经在两个市场上线，转化率提升了大约百分之六。我们做这个，是因为老流程在支付这一步流失了大量用户。目前主要的遗留问题是移动钱包的接入，还需要两周。我需要你帮忙的是，下个迭代从支付团队那边争取一些排期。你能跟他们的总监提一下吗？", "id": "ref0"}, {"q": "同事给你看他的项目首页，标题是“推荐系统优化项目”。用 30 秒给他反馈，教他把标题改成结论句并补上诉求。", "ref": "The content is solid, but I'd change the title. Right now it just names the project, so a busy reader learns nothing from it. Try putting your conclusion in the title, something like, click-through is up twelve percent, and we need one more engineer to finish the rollout. Also, your last box only shows status. Add a clear ask, otherwise leadership won't know what you want from them.", "ref_zh": "内容很扎实，但我会改一下标题。现在它只写了项目名，忙碌的读者从中什么也得不到。试着把结论放进标题里，比如：点击率提升了百分之十二，还需要再加一个工程师才能完成全量。另外，你最后一个框只写了进度。加一个明确的诉求，不然领导不知道你需要他们做什么。", "id": "ref1"}], "words": [{"w": "bother", "ipa": "/ˈbɑːðər/", "zh": "使困扰、让人在意", "ex": "What bothers me is that the error only shows up on weekends.", "id": "w0"}, {"w": "postpone", "ipa": "/poʊstˈpoʊn/", "zh": "推迟", "ex": "We postponed the launch until the security review is done.", "id": "w1"}, {"w": "skip", "ipa": "/skɪp/", "zh": "跳过", "ex": "Let's skip the intro slides and go straight to the results.", "id": "w2"}, {"w": "awareness", "ipa": "/əˈwernəs/", "zh": "知晓、意识", "ex": "This is just for awareness; no action needed yet.", "id": "w3"}, {"w": "explicitly", "ipa": "/ɪkˈsplɪsɪtli/", "zh": "明确地", "ex": "The doc should explicitly say who approves the release.", "id": "w4"}, {"w": "deck", "ipa": "/dek/", "zh": "（一套）幻灯片", "ex": "Can you se const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v);
  }
  for (const k of kids) el.append(k);
  return el;
};
const md = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

// one shared player for clip buttons
const player = new Audio();
let loopBtn = null;
const rate = () => parseFloat($('#speed').value);
// sentence/heading ids are segments of track.mp3; other ids (words, refs, shadow) are their own files
const SEG = Object.fromEntries((D.karaoke || []).map(l => [l.id, l]));
let seg = null, segLoop = false;
function play(id, loop = false, r = null) {
  seg = SEG[id] || null; segLoop = loop;
  const url = src(seg ? 'track' : id);
  if (!player.src.endsWith(url)) player.src = url;
  player.loop = !seg && loop;
  player.playbackRate = r ?? rate();
  const go = () => { if (seg) player.currentTime = seg.start; player.playbackRate = r ?? rate(); player.play(); };
  if (seg && player.readyState < 1) player.addEventListener('loadedmetadata', go, { once: true }); else go();
}
(function watchSeg() {
  if (seg && !player.paused && player.currentTime >= seg.end - 0.03) {
    if (segLoop) player.currentTime = seg.start; else { player.pause(); seg = null; }
  }
  requestAnimationFrame(watchSeg);
})();
$('#speed').addEventListener('change', () => {
  player.playbackRate = rate();
  document.querySelectorAll('audio').forEach(a => a.playbackRate = rate());
});
function clipCtl(id) {
  const p = h('button', { title: '播放', onclick: () => { stopLoop(); play(id); } }, '▶');
  const l = h('button', { title: '单句循环', onclick: () => {
    if (loopBtn === l) return stopLoop();
    stopLoop(); loopBtn = l; l.classList.add('on'); play(id, true);
  } }, '🔁');
  return h('span', { class: 'ctl' }, p, l);
}
function stopLoop() {

}

// recorder
async function makeRecorder(slot) {
  let mr = null, chunks = [];
  const btn = h('button', { class: 'rec', onclick: async () => {
    if (mr && mr.state === 'recording') { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mr = new MediaRecorder(stream); chunks = [];
      mr.ondataavailable = e => chunks.push(e.data);
      mr.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        btn.classList.remove('on'); btn.textContent = '🎙 重录';
        slot.replaceChildren(h('div', { class: 'how' }, '我的录音：'), h('audio', { controls: '', src: URL.createObjectURL(new Blob(chunks)) }));
        btn.dispatchEvent(new Event('stopped'));
      };
      mr.start(); btn.classList.add('on'); btn.textContent = '⏹ 停止录音';
      btn.dispatchEvent(new Event('started'));
    } catch (e) { slot.textContent = '无法使用麦克风：' + e.message; }
  } }, '🎙 录音');
  btn.stopRec = () => { if (mr && mr.state === 'recording') mr.stop(); };
  return btn;
}

// dictation diff (word-level LCS)
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').split(/\s+/).filter(Boolean);
function diff(ref, got) {
  const a = norm(ref), b = norm(got);
  const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { hit.add(i); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { words: a.map((w, k) => [w, hit.has(k)]), pct: Math.round(100 * hit.size / a.length) };
}

  toggle.textContent = intensive.classList.contains('hide') ? '显示全部原文' : '隐藏原文';
} }, '显示全部原文');
main.append(step('s3', '③ 精听', '4 分钟', '逐句听，先自己在脑中复述，再点模糊的文字看原文。没听出来的那句就用 🔁 循环，直到每个词都能听清。<b>加粗</b>是要背的句子，<u>下划线</u>是可复用的短语，<mark>高亮</mark>是重点词。',
  h('div', {}, h('div', { class: 'controls' }, toggle, zhBtn), intensive)));

// 4 shadowing
const shadowSlot = h('div');
makeRecorder(shadowSlot).then(rec => {
  $('#s4-ctl').append(rec);
});
main.append(step('s4', '④ 跟读', '4 分钟', '先用 0.75× 跟读 2 遍，再用原速跟读 1 遍，最后录一遍自己的声音和原音对比。<code>/</code> 是短停顿，<code>//</code> 是长停顿，蓝色加粗的词要重读。',
  h('div', {},
    h('div', { class: 'shadow', html: D.shadow.marked }),
    h('div', { class: 'controls', id: 's4-ctl' },
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 0.75); } }, '▶ 0.75×'),
      h('button', { onclick: () => { stopLoop(); play('shadow', false, 1); } }, '▶ 原速')),
    shadowSlot)));

// 5 output
main.append(step('s5', '⑤ 输出', '5 分钟', '点「开始」后会倒计时 30 秒并自动录音。用文中的三个动作作答：先对齐目标，再用提问代替断言，最后说具体。说完再听参考答案。',
  h('div', {}, ...D.prompts.map((p, i) => {
    const slot = h('div');
    const timer = h('span', { class: 'timer' }, '30');
    const box = h('div', { class: 'prompt' }, h('div', {}, h('b', {}, `场景 ${i + 1}：`), p.q));
    makeRecorder(slot).then(rec => {
      let t = null;
      rec.textContent = '▶ 开始（30 秒）';
      rec.addEventListener('started', () => {
        let n = 30; timer.textContent = n;
        t = setInterval(() => { timer.textContent = --n; if (n <= 0) rec.stopRec(); }, 1000);
      });
      rec.addEventListener('stopped', () => { clearInterval(t); timer.textContent = '30'; });
      box.append(h('div', { class: 'controls' }, rec, timer), slot,
        h('details', {}, h('summary', {}, '参考答案'),
          h('div', { class: 'controls' }, clipCtl(p.id)), h('div', {}, p.ref),
          p.ref_zh ? h('div', { class: 'zh' }, p.ref_zh) : ''));
    });
    return box;
  }))));

// words
main.append(step('s6', '⑥ 单词', '2 分钟', '点 ▶ 听单词和例句，跟着读一遍。例句都取自开会、写技术文档的场景。',
  h('table', {},
    h('tr', {}, ...['', '单词', '音标', '中文', '工作中怎么用'].map(t => h('th', {}, t))),
    ...D.words.map(w => h('tr', {},
      h('td', {}, clipCtl(w.id)), h('td', {}, h('b', {}, w.w)), h('td', { class: 'ipa' }, w.ipa),
      h('td', {}, w.zh), h('td', {}, w.ex))))));

renderNav();
</script>
